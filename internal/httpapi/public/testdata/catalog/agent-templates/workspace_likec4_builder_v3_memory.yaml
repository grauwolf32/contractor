apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: workspace_likec4_builder
  version: "3"

spec:
  description: Builds an evidence-linked LikeC4 model from a hydrated project workspace
  runtime: adk@1
  instructions:
    ref: instructions/workspace-likec4-builder-worker-memory.md
  modelPolicy: worker@2
  summarizer:
    instructions:
      ref: instructions/terminal-summarizer.md
    modelPolicy: summarizer@1
    contextWindowRatio: 0.8
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: workspace-changes@1
      tools: [changed_paths, diff, rollback_changes]
    - ref: text-artifacts@1
      tools: [read_text_artifact]
    - ref: likec4@1
      tools:
        - load_likec4
        - write_likec4
        - read_likec4
        - append_likec4
        - replace_likec4
        - validate_likec4
  skills:
    - namespace: skills
      name: likec4
  sandboxProfile: local-workdir@1
