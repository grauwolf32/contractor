apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: nuclei-target, version: "1"}
spec:
  parameters:
    target: {required: true}
  inputs:
    task: {required: true, mediaTypes: [application/zip]}
    rulepack: {required: false, sourceScope: user, mediaTypes: [application/yaml]}
  outputs:
    report: {required: true, primary: true, mediaTypes: [application/json]}
  entryStage: scan
  stages:
    scan:
      objective: Exercise exact rulepack and ordinary input admission
      instructions: {ref: instructions/planner.md}
      planner: passthrough@1
      agents:
        scanner: {template: nuclei-scan@1}
      context:
        artifacts:
          task: {namespace: inputs, name: task, required: true}
          rulepack: {namespace: inputs, name: rulepack, required: false}
      result:
        artifacts:
          report: {required: true, mediaTypes: [application/json], from: {namespace: scanner, name: report}}
      workflowOutputs: {report: report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
