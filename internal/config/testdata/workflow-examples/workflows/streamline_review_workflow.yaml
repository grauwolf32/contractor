# configs/examples/streamline_review_workflow.yaml with its Planner policy and
# Agent retargeted to the core fixture's test-planner@1 and artifact_builder@1.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: streamline-review
  version: "2"

spec:
  parameters:
    review_mode:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    report:
      required: true
      mediaTypes: [application/json]

  executionConfig:
    planner:
      modelPolicy: test-planner@1
      llmGateway: local-litellm@1
      credential: development-planner
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: review
  stages:
    review:
      objective: Analyze the source and produce a reviewed JSON report
      instructions:
        ref: instructions/copy-planner.md
      planner: streamline@1
      agents:
        reviewer:
          template: artifact_builder@1
          namespace: review
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [application/json]
            from: {namespace: review, name: report}
      workflowOutputs:
        report: report
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
