apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-openapi-nuclei-scan
  version: '1'
spec:
  parameters: {}
  inputs:
    openapi:
      required: true
      mediaTypes:
      - application/json
      - application/yaml
    settings:
      required: true
      mediaTypes:
      - application/json
    operation:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  entryStage: scan
  stages:
    scan:
      objective: Check the fixed OpenAPI URL with the pinned Nuclei template selection
      instructions:
        ref: instructions/audit-openapi-scan.md
      planner: scan-plan@1
      scanPlan:
        inputArtifact: openapi
        maxInputs: 1
        maxJobs: 1
        maxTotalSeconds: 300
        tools:
        - worker: scanner
          maxJobs: 1
          maxTotalSeconds: 300
      agents:
        scanner:
          template: audit-nuclei-scan@1
      context:
        artifacts:
          openapi:
            namespace: inputs
            name: openapi
            required: true
          settings:
            namespace: inputs
            name: settings
            required: true
          operation:
            namespace: inputs
            name: operation
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: scan-results
              name: operation-report
      workflowOutputs:
        result: report
      'on':
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
      scanPreparation:
        scanner: nuclei
        settingsArtifact: settings
        unknownOutcome: retain-gap
        kind: openapi-operation
        operationArtifact: operation
