apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-web-nuclei-scan
  version: '1'
spec:
  parameters:
    credential_id:
      required: false
    template_ids:
      required: true
    tags:
      required: true
    severity:
      required: true
  inputs:
    engagement:
      required: true
      mediaTypes:
      - application/vnd.contractor.engagement+json
    target:
      required: true
      mediaTypes:
      - application/json
    rulepack:
      required: false
      mediaTypes:
      - application/yaml
      - application/vnd.contractor.nuclei-rulepack+zip
  outputs: {}
  entryStage: scan
  stages:
    scan:
      objective: Check the exact target URL with the retained Nuclei selection
      instructions:
        ref: instructions/audit-openapi-scan.md
      planner: scan-plan@1
      scanPlan:
        inputArtifact: target
        maxInputs: 1
        maxJobs: 1
        maxTotalSeconds: 330
        tools:
        - worker: scanner
          maxJobs: 1
          maxTotalSeconds: 330
      agents:
        scanner:
          template: audit-web-nuclei-scan@1
      context:
        artifacts:
          target:
            namespace: inputs
            name: target
            required: true
          rulepack:
            namespace: inputs
            name: rulepack
            required: false
      result:
        artifacts:
          report:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: scan-results
              name: operation-report
          materials:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: scan-results
              name: finding-materials
      'on':
        succeeded:
          next: publish
        failed:
          next: publish-partial
        interrupted:
          next: publish-partial
      scanPreparation:
        scanner: nuclei
        unknownOutcome: retain-gap
        kind: web-target
    publish:
      operation:
        ref: publish-findings@1
        arguments: {}
      context:
        artifacts:
          materials:
            namespace: scan-results
            name: finding-materials
            required: true
      result:
        artifacts: {}
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
      objective: Publish the selected evidenced assertions as Project Findings.
    publish-partial:
      operation:
        ref: publish-findings@1
        arguments: {}
      context:
        artifacts:
          materials:
            namespace: scan-results
            name: finding-materials
            required: true
      result:
        artifacts: {}
      'on':
        succeeded:
          fail: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
      objective: Publish complete scanner assertions while preserving scan failure.
