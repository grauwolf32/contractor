apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: compact_builder
  version: "1"

spec:
  description: Reads a declared input and writes the requested result across a long context
  runtime: adk@1
  instructions:
    ref: instructions/artifact-builder.md
  modelPolicy: test-compact-worker@1
  summarizer:
    modelPolicy: test-summarizer@1
    contextWindowRatio: 0.9
  toolsets:
    - ref: run-artifacts@1
      tools:
        - list_artifacts
        - read_artifact
        - write_artifact
  sandboxProfile: local-workdir@1
