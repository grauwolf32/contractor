{
  "apiVersion": "contractor/v1alpha1",
  "kind": "AuditProfile",
  "metadata": {
    "name": "source-checklist",
    "version": "1"
  },
  "spec": {
    "schema": "contractor.audit.program.v1",
    "inputs": {
      "source": {
        "required": true,
        "media_types": [
          "application/zip"
        ]
      },
      "checklist": {
        "required": true,
        "media_types": [
          "application/json",
          "application/yaml"
        ]
      }
    },
    "workflows": {
      "check": {
        "ref": "audit-source-check@1",
        "inputs": {
          "source": {
            "source": "audit-input",
            "name": "source"
          },
          "context": {
            "source": "task-context"
          }
        },
        "parameters": {},
        "outputs": {
          "result": "result"
        }
      }
    },
    "hypotheses": {},
    "initial_work": [
      {
        "key": "inspect-source",
        "workflow": "check",
        "objective": "Explore the selected source"
      }
    ],
    "limits": {
      "max_tasks": 128,
      "max_iterations": 1,
      "max_tasks_per_iteration": 128,
      "batch_size": 2,
      "max_submitted_runs": 384,
      "max_attempts": 3,
      "deadline_seconds": 86400,
      "max_evidence_bytes": 67108864,
      "max_hypotheses": 1,
      "max_hypothesis_revisions": 1,
      "max_hypothesis_bytes": 32768
    },
    "policy": {
      "active_operations": "prohibited"
    }
  }
}
