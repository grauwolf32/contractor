apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: audit-contract-check, version: "1"}
spec:
  parameters: {}
  inputs:
    source: {required: true, mediaTypes: [text/plain]}
    context: {required: true, mediaTypes: [application/json]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [application/json]}
  executionConfig:
    workers: {modelPolicy: test-worker@1, llmGateway: local-litellm@1}
  entryStage: check
  stages:
    check:
      objective: Check the scoped assertion from the trusted context against selected source
      instructions: {ref: instructions/copy-planner.md}
      planner: passthrough@1
      agents:
        builder: {template: artifact_builder@1}
      context:
        artifacts:
          source: {namespace: inputs, name: source, required: true}
          context: {namespace: inputs, name: context, required: true}
      result:
        artifacts:
          conclusions: {required: true, mediaTypes: [application/json], from: {namespace: builder, name: conclusions}}
      workflowOutputs: {result: conclusions}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
