# Copy this file under configs/workflows/ to load it. It demonstrates one
# streamline@1 Planner coordinating one fixed prepared Agent binding.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: streamline-review
  version: "1"

spec:
  parameters:
    review_mode:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    report:
      required: true
      mediaTypes: [application/json]

  executionConfig:
    planner:
      modelPolicy: planner@1
      llmGateway: local-litellm@1
    workers:
      llmGateway: local-litellm@1

  entryStage: review
  stages:
    review:
      objective: Analyze the source and produce a reviewed JSON report
      instructions:
        ref: instructions/copy-planner.md
      planner: streamline@1
      agents:
        reviewer:
          template: artifact_builder@1
          namespace: review
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [application/json]
            from: {namespace: review, name: report}
      workflowOutputs:
        report: report
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
