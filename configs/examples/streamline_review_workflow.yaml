# Copy this file under configs/workflows/ to load it. It demonstrates one
# streamline@1 Planner coordinating one fixed prepared Agent binding.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: streamline-review
  version: "3"

spec:
  parameters:
    review_mode:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    report:
      required: true
      mediaTypes: [application/json]

  executionConfig:
    planner:
      modelPolicy: planner@2
      llmGateway: local-litellm@1
      credential: development-planner
      compactorModelPolicy: compactor@1
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

      modelPolicy: worker@2
    stages:
      review:
        agents:
          reviewer:
            summarizerModelPolicy: summarizer@1
  entryStage: review
  stages:
    review:
      objective: Analyze the source and produce a reviewed JSON report
      instructions:
        ref: instructions/report-planner.md
      planner: streamline@1
      plannerContextManagement:
        strategy: compact@1
        instructions:
          ref: instructions/planner-compaction.md
      agents:
        reviewer:
          template: artifact_builder@3
          namespace: review
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [application/json]
            from: {namespace: review, name: report}
      workflowOutputs:
        report: report
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
