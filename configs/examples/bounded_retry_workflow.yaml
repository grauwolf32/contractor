# Copy this file under configs/workflows/ to load it. maxAttempts includes the
# first execution, so this policy creates at most two retry executions.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: artifact-report-with-retry
  version: '1'

spec:
  parameters:
    objective:
      required: false
  inputs:
    source:
      required: true
      mediaTypes: [text/plain]
  outputs:
    result:
      required: true
      mediaTypes: [text/plain]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

      modelPolicy: worker@1
    stages:
      copy:
        agents:
          builder:
            summarizerModelPolicy: summarizer@1
  entryStage: copy
  stages:
    copy:
      objective: Inspect the source and author the requested report
      instructions:
        ref: instructions/report-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: artifact_builder@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          copied:
            required: true
            mediaTypes: [text/plain]
            from: {namespace: builder, name: copied}
      workflowOutputs:
        result: copied
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 3
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 3
            then:
              fail: {}
