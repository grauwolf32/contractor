# Copy this file under configs/workflows/ to load it. It deliberately declares
# reviewer before builder; router@1 presents available logical agents in stable
# lexical order using their pinned AgentTemplate descriptions.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: router-openapi
  version: '1'

spec:
  parameters:
    review_mode:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]

  outputs:
    document:
      required: true
      mediaTypes: [application/yaml, application/json]

  executionConfig:
    planner:
      modelPolicy: planner@1
      llmGateway: local-litellm@1
      credential: development-planner
      compactorModelPolicy: compactor@1
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

      modelPolicy: worker@1
    stages:
      build:
        agents:
          reviewer:
            summarizerModelPolicy: summarizer@1
          builder:
            summarizerModelPolicy: summarizer@1
  entryStage: build
  stages:
    build:
      objective: Build and review an OpenAPI document from the exact source archive
      instructions:
        ref: instructions/openapi-build-planner.md
      planner: router@1
      plannerContextManagement:
        strategy: compact@1
        instructions:
          ref: instructions/planner-compaction.md
      agents:
        reviewer:
          template: openapi_validator@1
          namespace: review
        builder:
          template: openapi_builder@1
          namespace: openapi
      context:
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          document:
            required: true
            mediaTypes: [application/yaml, application/json]
            from: {namespace: openapi, name: openapi}
      workflowOutputs:
        document: document
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
