# Copy this file under configs/workflows/ and planner_compactor_policy.yaml
# under configs/model-policies/ to load it. It is streamline-review with opt-in
# Planner context compaction: when the Planner prompt reaches
# contextWindowRatio of its window, earlier complete steps are replaced by a
# rolling summary from the compactor, the keepRecentGroups latest steps stay
# verbatim, and exact earlier Worker results remain readable through
# read_context_history (WFL-R90, PLN-R125). Omit plannerContextManagement, or
# set strategy: none, to keep the whole conversation.
apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: streamline-compaction-review
  version: "1"

spec:
  parameters:
    review_mode:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    report:
      required: true
      mediaTypes: [application/json]

  executionConfig:
    planner:
      modelPolicy: planner@2
      llmGateway: local-litellm@1
      credential: development-planner
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: review
  stages:
    review:
      objective: Analyze the source and produce a reviewed JSON report
      instructions:
        ref: instructions/copy-planner.md
      planner: streamline@1
      plannerContextManagement:
        strategy: compact@1
        modelPolicy: planner-compactor@1
        instructions:
          ref: instructions/planner-compaction.md
        contextWindowRatio: 0.75
        keepRecentGroups: 4
        maxCompactions: 8
      agents:
        reviewer:
          template: artifact_builder@2
          namespace: review
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [application/json]
            from: {namespace: review, name: report}
      workflowOutputs:
        report: report
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
