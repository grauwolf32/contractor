apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: openapi_validator
  version: "3"

spec:
  description: Validates and minimally repairs a candidate OpenAPI document against project evidence
  runtime: adk@1
  instructions:
    ref: instructions/openapi-validator-worker-memory.md
  modelPolicy: worker@2
  summarizer:
    instructions:
      ref: instructions/terminal-summarizer.md
    modelPolicy: summarizer@1
    contextWindowRatio: 0.8
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: source-analysis@1
      tools:
        - open_source_archive
        - search_source
        - read_source
    - ref: text-artifacts@1
      tools:
        - read_text_artifact
        - write_text_artifact
    - ref: openapi@1
      tools:
        - load_openapi
        - get_openapi_info
        - set_openapi_info
        - list_openapi_servers
        - set_openapi_servers
        - list_openapi_tags
        - set_openapi_tags
        - list_openapi_paths
        - get_openapi_path
        - upsert_openapi_path
        - remove_openapi_path
        - list_openapi_components
        - get_openapi_component
        - upsert_openapi_component
        - remove_openapi_component
        - validate_openapi
  sandboxProfile: local-workdir@1
