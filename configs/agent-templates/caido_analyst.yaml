apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: caido_analyst
  version: "1"

spec:
  description: Performs bounded authorized HTTP and Caido analysis and publishes an evidence report
  runtime: adk@1
  instructions:
    ref: instructions/caido-analyst-worker.md
  modelPolicy: worker@2
  summarizer:
    instructions:
      ref: instructions/terminal-summarizer.md
    modelPolicy: summarizer@1
    contextWindowRatio: 0.8
  toolsets:
    - ref: caido@1
      tools:
        - caido_scope
        - caido_history
        - caido_request_detail
        - caido_replay
        - caido_automate_run
        - caido_automate_results
        - caido_sitemap
        - caido_workflow_list
        - caido_workflow_run
        - caido_workflow_findings
    - ref: http-tools@1
      tools:
        - http_request
        - http_read_body
        - http_history
    - ref: text-artifacts@1
      tools:
        - read_text_artifact
        - write_text_artifact
  skills:
    - namespace: skills
      name: caido
  sandboxProfile: local-workdir@1
