apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: caido_analyst
  version: "3"

spec:
  description: Performs bounded authorized HTTP and Caido analysis and publishes an evidence report
  runtime: adk@1
  instructions:
    ref: instructions/caido-analyst-worker-memory.md
  modelPolicy: domain_worker@1
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: caido@1
      tools:
        - caido_scope
        - caido_history
        - caido_request_detail
        - caido_replay
        - caido_automate_run
        - caido_automate_results
        - caido_sitemap
        - caido_workflow_list
        - caido_workflow_run
        - caido_workflow_findings
    - ref: http-tools@1
      tools:
        - http_request
        - http_read_body
        - http_history
    - ref: text-artifacts@1
      tools:
        - read_text_artifact
        - write_text_artifact
  skills:
    - namespace: skills
      name: caido
  sandboxProfile: local-workdir@1
