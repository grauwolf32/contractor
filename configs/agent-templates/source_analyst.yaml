apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: source_analyst
  version: "1"

spec:
  description: Inspects an exact project source archive and publishes evidenced Markdown analysis
  runtime: adk@1
  instructions:
    ref: instructions/source-analyst-worker.md
  modelPolicy: domain_worker@1
  toolsets:
    - ref: source-analysis@1
      tools:
        - open_source_archive
        - list_source_files
        - search_source
        - read_source
    - ref: text-artifacts@1
      tools:
        - read_text_artifact
        - write_text_artifact
  sandboxProfile: local-workdir@1
