apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: workspace_source_analyst
  version: "2"

spec:
  description: Inspects a hydrated project workspace with portable structural analysis and publishes evidenced Markdown
  runtime: adk@1
  instructions:
    ref: instructions/workspace-source-shallow-analyst-worker.md
  modelPolicy: domain_worker@1
  toolsets:
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: code-analysis@1
      tools: [search_def, list_symbols]
    - ref: text-artifacts@1
      tools: [read_text_artifact, write_text_artifact]
  sandboxProfile: local-workdir@1
