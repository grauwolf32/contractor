apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: audit_asvs_source_verifier
  version: '2'

spec:
  description: Evaluates one exact ASVS requirement under its immutable evidence contract
  runtime: adk@1
  instructions:
    ref: instructions/audit-asvs-source-verifier-worker-v2.md
  toolsets:
    - ref: security-findings@1
      tools: [fact]
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: security-findings-code@1
      tools: [finding]
    - ref: audit-results@2
      tools: [read_audit_task, submit_result, submit_results, evidence]
  skills:
    - namespace: skills
      name: trace
  sandboxProfile: local-workdir@1
