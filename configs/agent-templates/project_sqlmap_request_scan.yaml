apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata:
  name: project-sqlmap-request-scan
  version: '1'
spec:
  runtime: tool@1
  sandboxProfile: local-workdir@1
  toolsets:
  - ref: scan@1
    tools:
    - scan_sqlmap
  execution:
    arguments:
      request_ref:
        source: artifact
        name: request
      level:
        source: literal
        value: 1
      risk:
        source: literal
        value: 1
      timeout_seconds:
        source: literal
        value: 300
    resultArtifact: report
    timeoutSeconds: 330
    tool: scan_sqlmap
  description: Check one exact prepared HTTP request and materialize Finding candidates.
