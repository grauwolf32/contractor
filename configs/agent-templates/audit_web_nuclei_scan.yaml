apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata:
  name: audit-web-nuclei-scan
  version: '1'
spec:
  description: Scan one HTTP target with a verified private Nuclei rules package.
  runtime: tool@1
  sandboxProfile: local-workdir@1
  toolsets:
  - ref: scan@1
    tools:
    - scan_nuclei
  execution:
    tool: scan_nuclei
    arguments:
      url:
        source: parameter
        name: target
      template_ids:
        source: parameter
        name: template_ids
      tags:
        source: parameter
        name: tags
      severity:
        source: parameter
        name: severity
      rate_limit:
        source: parameter
        name: rate_limit
        parse: integer
      templates_digest:
        source: literal
        value: sha256:51a3bd4eef14e95bdeb0bad14ca4bd9bd455479a7044b244b76dee8f6dba5014
      rulepack_ref:
        source: artifact
        name: rulepack
        optional: true
      timeout_seconds:
        source: literal
        value: 300
    resultArtifact: report
    timeoutSeconds: 330
  sitemap:
    version: sitemap-access@1
    collectObservations: true
