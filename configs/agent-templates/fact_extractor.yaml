apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: fact_extractor, version: "1"}
spec:
  description: Selects bounded source-grounded Project facts from an exact memory snapshot
  runtime: adk@1
  instructions: {ref: instructions/fact-extractor-v1.md}
  toolsets:
    - ref: text-artifacts@1
      tools: [read_text_artifact, write_text_artifact]
    - ref: security-findings@1
      tools: [record_fact]
  sandboxProfile: local-workdir@1
