apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: audit_openapi_operation_tracer
  version: "3"

spec:
  description: Traces one pinned OpenAPI Audit operation through source and structural graph evidence and records evidence-backed finding proposals alongside its canonical result
  runtime: adk@1
  instructions:
    ref: instructions/audit-openapi-operation-tracer-worker-project-findings-keyed-results.md
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: code-analysis@1
      tools:
        - search_def
        - list_symbols
        - graph_summary
        - find_symbol
        - find_callers
        - find_callees
        - paths_between
        - entrypoint_paths_to
        - attack_surface
        - complexity_hotspots
        - functions_that_raise
    - ref: text-artifacts@1
      tools: [write_text_artifact]
    - ref: taint-annotations@1
      tools: [annotate_trace, annotate_validate, annotate_sink]
    - ref: workspace-changes@1
      tools: [changed_paths, diff, rollback_changes]
    - ref: security-findings-trace@1
      tools: [finding]
    - ref: audit-results@2
      tools: [read_audit_task, submit_check_result, submit_check_results]
  skills:
    - namespace: skills
      name: trace
  sandboxProfile: local-workdir@1
