apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: audit_source_checker
  version: "3"

spec:
  description: Evaluates a bounded pinned checklist or OpenAPI task set against source code and publishes one complete canonical result set
  runtime: adk@1
  instructions:
    ref: instructions/audit-source-checker-worker-memory.md
  modelPolicy: worker@2
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: source-analysis@1
      tools: [open_source_archive, list_source_files, read_source, search_source]
    - ref: audit-results@1
      tools: [read_audit_task, submit_check_result]
  skills:
    - namespace: skills
      name: trace
  sandboxProfile: local-workdir@1
