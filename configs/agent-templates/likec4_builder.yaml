apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: likec4_builder
  version: "1"

spec:
  description: Incrementally builds one evidence-linked single-file LikeC4 architecture model
  runtime: adk@1
  instructions:
    ref: instructions/likec4-builder-worker.md
  modelPolicy: domain_worker@1
  toolsets:
    - ref: source-analysis@1
      tools:
        - open_source_archive
        - list_source_files
        - search_source
        - read_source
    - ref: text-artifacts@1
      tools:
        - read_text_artifact
    - ref: likec4@1
      tools:
        - load_likec4
        - write_likec4
        - read_likec4
        - append_likec4
        - replace_likec4
        - validate_likec4
  sandboxProfile: local-workdir@1
