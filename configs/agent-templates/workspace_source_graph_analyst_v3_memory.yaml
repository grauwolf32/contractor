apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: workspace_source_graph_analyst
  version: "3"

spec:
  description: Inspects a hydrated project workspace with bounded structural graph analysis and publishes evidenced Markdown
  runtime: adk@1
  instructions:
    ref: instructions/workspace-source-graph-analyst-worker-memory.md
  modelPolicy: worker@2
  summarizer:
    instructions:
      ref: instructions/terminal-summarizer.md
    modelPolicy: summarizer@1
    contextWindowRatio: 0.8
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: code-analysis@1
      tools:
        - search_def
        - list_symbols
        - graph_summary
        - find_symbol
        - find_callers
        - find_callees
        - paths_between
        - entrypoint_paths_to
        - attack_surface
        - complexity_hotspots
        - functions_that_raise
    - ref: text-artifacts@1
      tools: [read_text_artifact, write_text_artifact]
  sandboxProfile: local-workdir@1
