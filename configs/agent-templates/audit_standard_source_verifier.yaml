apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: audit_standard_source_verifier
  version: "1"

spec:
  description: Reviews one pinned ASVS requirement or WSTG scenario against source evidence while preserving runtime and documentation gaps
  runtime: adk@1
  instructions:
    ref: instructions/audit-standard-source-verifier-worker.md
  modelPolicy: worker@2
  toolsets:
    - ref: memory-tools@1
      tools: [list_memories, read_memory, write_memory, append_memory, search_memory, list_memory_tags]
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: source-analysis@1
      tools: [open_source_archive, list_source_files, read_source, search_source]
    - ref: text-artifacts@1
      tools: [write_text_artifact]
    - ref: security-findings@2
      tools: [finding]
    - ref: audit-results@1
      tools: [read_audit_task, submit_check_result]
  skills:
    - namespace: skills
      name: trace
  sandboxProfile: local-workdir@1
