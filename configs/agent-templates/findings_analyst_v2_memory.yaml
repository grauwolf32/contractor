apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata:
  name: findings_analyst
  version: "2"
spec:
  description: Analyzes an explicit finding collection and writes an evidence-grounded report
  runtime: adk@1
  instructions:
    ref: instructions/findings-analyst-worker-memory.md
  modelPolicy: domain_worker@2
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: security-findings@2
      tools: [list_findings]
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: text-artifacts@1
      tools: [write_text_artifact]
  sandboxProfile: local-workdir@1
