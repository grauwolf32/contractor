apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: artifact_builder
  version: "3"

spec:
  description: Reads declared materials and authors the requested text report
  runtime: adk@1
  instructions:
    ref: instructions/artifact-builder-authored-text.md
  summarizer:
    instructions:
      ref: instructions/terminal-summarizer.md
    contextWindowRatio: 0.8
  toolsets:
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: run-artifacts@1
      tools:
        - list_artifacts
        - read_artifact
    - ref: text-artifacts@1
      tools:
        - write_text_artifact
  sandboxProfile: local-workdir@1
