apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: audit_source_checker
  version: '3'

spec:
  description: Evaluates a bounded pinned checklist or OpenAPI task set against source code and records incremental results for Runtime-owned publication
  runtime: adk@1
  instructions:
    ref: instructions/audit-source-checker-worker-v3.md
  toolsets:
    - ref: security-findings@1
      tools: [fact]
    - ref: memory-tools@1
      tools:
        - list_memories
        - read_memory
        - write_memory
        - append_memory
        - search_memory
        - list_memory_tags
    - ref: filesystem@1
      tools: [ls, glob, read_file, grep]
    - ref: text-artifacts@1
      tools: [write_text_artifact]
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: security-findings-code@1
      tools: [finding]
    - ref: audit-results@2
      tools: [read_audit_task, submit_result, submit_results, evidence]
  skills:
    - namespace: skills
      name: trace
    - namespace: skills
      name: vuln-scan
  sandboxProfile: local-workdir@1
