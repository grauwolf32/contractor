apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: artifact-copy
  version: "1"

spec:
  parameters: {}

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    result:
      required: true
      mediaTypes: [text/plain]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: copy
  stages:
    copy:
      objective: Copy the source artifact byte-for-byte into the declared result artifact
      instructions:
        ref: instructions/copy-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: artifact_builder@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          copied:
            required: true
            mediaTypes: [text/plain]
            from: {namespace: builder, name: copied}
      workflowOutputs:
        result: copied
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
