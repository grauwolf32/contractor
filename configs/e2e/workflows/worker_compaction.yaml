apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: worker-compaction
  version: "1"

spec:
  parameters:
    mode:
      required: true

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    result:
      required: true
      mediaTypes: [text/plain]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: compact
  stages:
    compact:
      objective: Exercise Workflow-selected Worker context compaction
      instructions:
        ref: instructions/copy-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: compact_worker@1
          contextManagement:
            strategy: compact@1
            modelPolicy: worker_compactor@1
            instructions:
              ref: instructions/worker-compaction.md
            includeReasoning: true
            contextWindowRatio: 0.5
            keepRecentGroups: 1
            maxCompactions: 4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes: [text/plain]
            from: {namespace: builder, name: result}
      workflowOutputs:
        result: result
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
