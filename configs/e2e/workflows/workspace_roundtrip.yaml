apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: workspace-roundtrip
  version: "1"

spec:
  parameters: {}

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]

  outputs:
    workspace_state:
      required: true
      mediaTypes: [application/vnd.contractor.workspace-overlay+json]
    workspace_diff:
      required: true
      mediaTypes: [text/x-diff]

  executionConfig:
    workers:
      llmGateway: local-litellm@1

  entryStage: edit
  stages:
    edit:
      objective: Change the exact fixture line and export the cumulative workspace state
      instructions:
        ref: instructions/copy-planner.md
      planner: passthrough@1
      agents:
        editor:
          template: workspace_editor@1
          namespace: editor
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      workflowOutputs:
        workspace_state: workspace_state
        workspace_diff: workspace_diff
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
