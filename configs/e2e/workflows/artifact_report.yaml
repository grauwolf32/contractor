apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: artifact-report-fixture
  version: '1'

spec:
  parameters: {}

  inputs:
    source:
      required: true
      mediaTypes: [text/plain]

  outputs:
    result:
      required: true
      mediaTypes: [text/plain]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1

  entryStage: copy
  stages:
    copy:
      objective: Inspect the source and author the requested report
      instructions:
        ref: instructions/report-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: artifact_builder@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          copied:
            required: true
            mediaTypes: [text/plain]
            from: {namespace: builder, name: copied}
      workflowOutputs:
        result: copied
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
