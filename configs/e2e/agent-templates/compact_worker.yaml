apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: compact_worker
  version: "1"

spec:
  description: Deterministic Worker fixture that a Workflow continues through context compaction
  runtime: adk@1
  instructions:
    ref: instructions/worker-summarizer.md
  modelPolicy: compact_worker@1
  toolsets:
    - ref: text-artifacts@1
      tools: [write_text_artifact]
  sandboxProfile: local-workdir@1
