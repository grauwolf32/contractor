apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: capability_copy_builder
  version: "2"

spec:
  description: Authors a report in an environment with LikeC4 validation capability
  runtime: adk@1
  instructions:
    ref: instructions/artifact-builder-authored-text.md
  toolsets:
    - ref: run-artifacts@1
      tools:
        - read_artifact
    - ref: text-artifacts@1
      tools:
        - write_text_artifact
    - ref: likec4@1
      tools:
        - validate_likec4
  sandboxProfile: local-workdir@1
