apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: artifact_builder
  version: "1"

spec:
  description: Reads one declared input artifact and writes its byte-for-byte copy
  runtime: adk@1
  instructions:
    ref: instructions/artifact-builder.md
  modelPolicy: worker@1
  toolsets:
    - ref: run-artifacts@1
      tools:
        - read_artifact
        - write_artifact
  sandboxProfile: local-workdir@1
