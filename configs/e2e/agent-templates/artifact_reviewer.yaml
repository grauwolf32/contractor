apiVersion: contractor/v1alpha1
kind: AgentTemplate

metadata:
  name: artifact_reviewer
  version: '1'

spec:
  description: Reviews declared input and authors a text review
  runtime: adk@1
  instructions:
    ref: instructions/artifact-reviewer-authored-text.md
  toolsets:
    - ref: run-artifacts@1
      tools:
        - read_artifact
    - ref: text-artifacts@1
      tools:
        - write_text_artifact
  sandboxProfile: local-workdir@1
