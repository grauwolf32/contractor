apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: taint-trace-from-workspace
  version: '1'

spec:
  parameters:
    target:
      required: true
    objective:
      required: false
    context:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]

  outputs:
    taint_report:
      required: true
      primary: true
      mediaTypes: [text/markdown]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

      modelPolicy: worker@1
    stages:
      trace:
        agents:
          analyst:
            summarizerModelPolicy: summarizer@1
  entryStage: trace
  stages:
    trace:
      objective: Trace the assigned target, add evidence-backed annotations, and publish a defensible report
      instructions:
        ref: instructions/taint-trace-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_taint_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: report}
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      workflowOutputs:
        taint_report: report
      on:
        succeeded:
          succeed: {}
        failed: &retry_policy
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted: *retry_policy
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
