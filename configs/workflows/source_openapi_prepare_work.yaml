apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: source-openapi-prepare-work
  version: '1'
spec:
  parameters:
    objective:
      required: false
    checking_workflow:
      required: true
    selection:
      required: true
    max_items:
      required: true
    scanner:
      required: false
    server:
      required: false
    operations:
      required: false
    test_parameters:
      required: false
    credential_id:
      required: false
  inputs:
    engagement:
      required: false
      mediaTypes:
      - application/vnd.contractor.engagement+json
    source:
      required: true
      mediaTypes:
      - application/zip
    existing_openapi:
      required: false
      mediaTypes:
      - application/yaml
      - application/json
    request_values:
      required: false
      mediaTypes:
      - application/json
  outputs:
    openapi:
      required: true
      mediaTypes:
      - application/yaml
    openapi_validation_report:
      required: true
      mediaTypes:
      - text/markdown
    work:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      modelPolicy: worker@1
      llmGateway: local-litellm@1
      credential: development-worker
    stages:
      dependency_discovery:
        agents:
          analyst:
            summarizerModelPolicy: summarizer@1
      project_discovery:
        agents:
          analyst:
            summarizerModelPolicy: summarizer@1
      openapi_build:
        agents:
          builder:
            summarizerModelPolicy: summarizer@1
      openapi_validate:
        agents:
          validator:
            summarizerModelPolicy: summarizer@1
  entryStage: dependency_discovery
  stages:
    dependency_discovery:
      objective: Inventory runtime dependencies from the hydrated project workspace
      instructions:
        ref: instructions/dependency-discovery-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_source_graph_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
          - artifact: source
            target: ''
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          dependency_report:
            required: true
            mediaTypes:
            - text/markdown
            from:
              namespace: analysis
              name: dependencies
          workspace_state:
            required: true
            mediaTypes:
            - application/vnd.contractor.workspace-overlay+json
          workspace_diff:
            required: true
            mediaTypes:
            - text/x-diff
      'on':
        succeeded:
          next: project_discovery
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
    project_discovery:
      objective: Map project structure, API surface, security controls, and runtime integrations
      instructions:
        ref: instructions/project-discovery-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_source_graph_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
          - artifact: source
            target: ''
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          project_report:
            required: true
            mediaTypes:
            - text/markdown
            from:
              namespace: analysis
              name: project
          workspace_state:
            required: true
            mediaTypes:
            - application/vnd.contractor.workspace-overlay+json
          workspace_diff:
            required: true
            mediaTypes:
            - text/x-diff
      'on':
        succeeded:
          next: openapi_build
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
    openapi_build:
      objective: Build an evidence-linked OpenAPI document for the implemented inbound HTTP API
      instructions:
        ref: instructions/openapi-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: workspace_openapi_builder@1
          namespace: openapi
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          existing_openapi:
            namespace: inputs
            name: existing_openapi
            required: false
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
          - artifact: source
            target: ''
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          openapi:
            required: true
            mediaTypes:
            - application/yaml
            from:
              namespace: openapi
              name: openapi
          workspace_state:
            required: true
            mediaTypes:
            - application/vnd.contractor.workspace-overlay+json
          workspace_diff:
            required: true
            mediaTypes:
            - text/x-diff
      'on':
        succeeded:
          next: openapi_validate
        failed:
          retry:
            maxAttempts: 4
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 4
            then:
              fail: {}
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
    openapi_validate:
      objective: Validate and minimally repair the candidate OpenAPI document against source evidence
      instructions:
        ref: instructions/openapi-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: workspace_openapi_validator@1
          namespace: openapi
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          openapi_candidate:
            namespace: openapi
            name: openapi
            required: true
          prior_workspace_state:
            namespace: openapi
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
          - artifact: source
            target: ''
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          openapi:
            required: true
            mediaTypes:
            - application/yaml
            from:
              namespace: openapi
              name: openapi
          validation_report:
            required: true
            mediaTypes:
            - text/markdown
            from:
              namespace: openapi
              name: validation-report
          workspace_state:
            required: true
            mediaTypes:
            - application/vnd.contractor.workspace-overlay+json
          workspace_diff:
            required: true
            mediaTypes:
            - text/x-diff
      workflowOutputs:
        openapi: openapi
        openapi_validation_report: validation_report
      'on':
        succeeded:
          next: prepare_work
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
    prepare_work:
      objective: Prepare bounded independent scan work from the generated exact OpenAPI and selected execution
        parameters
      operation:
        ref: openapi-prepare-work@1
        arguments:
          workflow:
            source: parameter
            name: checking_workflow
          selection:
            source: parameter
            name: selection
          max_items:
            source: parameter
            name: max_items
          scanner:
            source: parameter
            name: scanner
            default: ''
          server:
            source: parameter
            name: server
            default: ''
          operations:
            source: parameter
            name: operations
            default: ''
          test_parameters:
            source: parameter
            name: test_parameters
            default: ''
          credential_id:
            source: parameter
            name: credential_id
            default: ''
      context:
        artifacts:
          openapi:
            namespace: openapi
            name: openapi
            required: true
          request_values:
            namespace: inputs
            name: request_values
            required: false
      result:
        artifacts:
          work:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: prepared-work
              name: work
      workflowOutputs:
        work: work
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
