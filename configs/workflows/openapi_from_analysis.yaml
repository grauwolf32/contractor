apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: openapi-from-analysis
  version: "2"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    dependency_report:
      required: true
      mediaTypes: [text/markdown]
    project_report:
      required: true
      mediaTypes: [text/markdown]
    existing_openapi:
      required: false
      mediaTypes: [application/yaml, application/json]

  outputs:
    openapi:
      required: true
      primary: true
      mediaTypes: [application/yaml]
    openapi_validation_report:
      required: true
      mediaTypes: [text/markdown]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: openapi_build
  stages:
    openapi_build:
      objective: Build an evidence-linked OpenAPI document using caller-selected analysis reports
      instructions:
        ref: instructions/openapi-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: openapi_builder@1
          namespace: openapi
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          existing_openapi:
            namespace: inputs
            name: existing_openapi
            required: false
      result:
        artifacts:
          openapi:
            required: true
            mediaTypes: [application/yaml]
            from: {namespace: openapi, name: openapi}
      on:
        succeeded:
          next: openapi_validate
        failed:
          retry:
            maxAttempts: 4
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 4
            then:
              fail: {}

    openapi_validate:
      objective: Validate and minimally repair the candidate OpenAPI document against source evidence
      instructions:
        ref: instructions/openapi-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: openapi_validator@1
          namespace: openapi
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          openapi_candidate:
            namespace: openapi
            name: openapi
            required: true
      result:
        artifacts:
          openapi:
            required: true
            mediaTypes: [application/yaml]
            from: {namespace: openapi, name: openapi}
          validation_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: openapi, name: validation-report}
      workflowOutputs:
        openapi: openapi
        openapi_validation_report: validation_report
      on:
        succeeded:
          succeed: {}
        failed:
          escalate:
            maxAttempts: 1
            executionConfig:
              ref: strong-oas-review@1
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
