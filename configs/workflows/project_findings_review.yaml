apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: project-findings-review
  version: "1"
spec:
  parameters: {}
  inputs:
    check_results:
      required: false
      mediaTypes: [application/json]
  outputs:
    selection:
      required: false
      mediaTypes: [application/vnd.contractor.findings-collection+zip]
    report:
      required: true
      primary: true
      mediaTypes: [text/markdown]
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@2
    stages:
      analyze:
        agents:
          analyst:
            summarizerModelPolicy: summarizer@1
  entryStage: analyze
  stages:
    analyze:
      objective: Review selected current Project findings and publish a report grounded in exact retained evidence
      instructions:
        ref: instructions/project-findings-analyst.md
      planner: passthrough@1
      agents:
        analyst:
          template: project_findings_analyst@1
          namespace: findings-review
      context:
        artifacts:
          check_results:
            namespace: inputs
            name: check_results
            required: false
      result:
        artifacts:
          selection:
            required: false
            mediaTypes: [application/vnd.contractor.findings-collection+zip]
            from: {namespace: findings-review, name: selected-findings}
          report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: findings-review, name: report}
      workflowOutputs:
        selection: selection
        report: report
      on:
        succeeded:
          succeed: {}
        failed: &retry_policy
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted: *retry_policy
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@2
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
