apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-source-streamline
  version: "2"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    architecture:
      required: true
      mediaTypes: [text/vnd.likec4]
    validation_report:
      required: true
      mediaTypes: [text/markdown]

  executionConfig:
    planner:
      modelPolicy: project_planner@1
      llmGateway: local-litellm@1
    workers:
      modelPolicy: project_worker@1
      llmGateway: local-litellm@1

  entryStage: dependency_discovery
  stages:
    dependency_discovery:
      objective: Inventory runtime dependencies that connect the project to external systems
      instructions:
        ref: instructions/dependency-discovery-planner.md
      planner: streamline@1
      agents:
        analyst:
          template: source_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          dependency_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: dependencies}
      on:
        succeeded:
          next: project_discovery
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    project_discovery:
      objective: Map project structure, API surface, security controls, and runtime integrations
      instructions:
        ref: instructions/project-discovery-planner.md
      planner: streamline@1
      agents:
        analyst:
          template: source_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
      result:
        artifacts:
          project_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: project}
      on:
        succeeded:
          next: likec4_build
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    likec4_build:
      objective: Build an evidence-linked single-file LikeC4 architecture model for the project
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: streamline@1
      agents:
        builder:
          template: likec4_builder@2
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
      on:
        succeeded:
          next: likec4_validate
        failed:
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 6
            then:
              fail: {}

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: streamline@1
      agents:
        validator:
          template: likec4_validator@2
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
          validation_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: likec4, name: validation-report}
      workflowOutputs:
        architecture: architecture
        validation_report: validation_report
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
