apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-standard-source-review
  version: "2"
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@2
  entryStage: check
  stages:
    check:
      objective: Review one exact standard requirement or scenario against the supplied source and preserve
        unresolved evidence gaps
      instructions:
        ref: instructions/audit-standard-source-verifier-worker-project-findings.md
      planner: passthrough@1
      agents:
        verifier:
          template: audit_standard_source_verifier@2
          namespace: audit-standard
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-standard
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
