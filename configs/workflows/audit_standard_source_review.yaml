apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: audit-standard-source-review
  version: "1"

spec:
  parameters: {}
  inputs:
    task:
      required: true
      mediaTypes: [application/zip]
    execution_manifest:
      required: true
      mediaTypes: [application/json]
    source:
      required: true
      mediaTypes: [application/zip]
  outputs:
    result:
      required: true
      primary: true
      mediaTypes: [application/zip]
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
  entryStage: check
  stages:
    check:
      objective: Review one exact standard requirement or scenario against the supplied source and preserve unresolved evidence gaps
      instructions:
        ref: instructions/audit-standard-source-verifier-worker.md
      planner: passthrough@1
      agents:
        verifier:
          template: audit_standard_source_verifier@1
          namespace: audit-standard
      context:
        artifacts:
          task: {namespace: inputs, name: task, required: true}
          execution_manifest: {namespace: inputs, name: execution_manifest, required: true}
          source: {namespace: inputs, name: source, required: true}
      result:
        artifacts:
          result:
            required: true
            mediaTypes: [application/zip]
            from: {namespace: audit-standard, name: result}
      workflowOutputs:
        result: result
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
