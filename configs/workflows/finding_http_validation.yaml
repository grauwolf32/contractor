apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: finding-http-validation
  version: '1'
spec:
  parameters:
    target: {required: true}
  inputs:
    finding: {required: true, mediaTypes: [application/json]}
    context: {required: true, mediaTypes: [application/json]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [application/json]}
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1
  entryStage: check
  stages:
    check:
      objective: Validate the one selected Finding assertion on the pinned Project target, recording actual control and probe exchanges and uncertainty
      instructions:
        ref: instructions/finding-http-validator-v1.md
      planner: passthrough@1
      agents:
        validator: {template: finding_http_validator@1, namespace: finding-check}
      context:
        artifacts:
          finding: {namespace: inputs, name: finding, required: true}
          context: {namespace: inputs, name: context, required: true}
      result:
        artifacts:
          result:
            required: true
            mediaTypes: [application/json]
            from: {namespace: finding-check, name: result}
      workflowOutputs: {result: result}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
