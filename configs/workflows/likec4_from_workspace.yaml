apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-workspace
  version: "1"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    architecture:
      required: true
      mediaTypes: [text/vnd.likec4]
    validation_report:
      required: true
      mediaTypes: [text/markdown]
    workspace_state:
      required: true
      mediaTypes: [application/vnd.contractor.workspace-overlay+json]
    workspace_diff:
      required: true
      mediaTypes: [text/x-diff]

  executionConfig:
    workers:
      llmGateway: local-litellm@1

  entryStage: dependency_discovery
  stages:
    dependency_discovery:
      objective: Inventory runtime dependencies from the hydrated project workspace
      instructions:
        ref: instructions/dependency-discovery-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_source_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          dependency_report:
            required: true
            mediaTypes: [text/markdown]
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: project_discovery
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    project_discovery:
      objective: Map project structure, architecture, security controls, and runtime integrations
      instructions:
        ref: instructions/project-discovery-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_source_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          project_report:
            required: true
            mediaTypes: [text/markdown]
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: likec4_build
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    likec4_build:
      objective: Build an evidence-linked single-file LikeC4 architecture model for the project
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: workspace_likec4_builder@1
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: likec4_validate
        failed:
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 6
            then:
              fail: {}

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: workspace_likec4_validator@1
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
          prior_workspace_state:
            namespace: likec4
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
          validation_report:
            required: true
            mediaTypes: [text/markdown]
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      workflowOutputs:
        architecture: architecture
        validation_report: validation_report
        workspace_state: workspace_state
        workspace_diff: workspace_diff
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
