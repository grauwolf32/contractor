apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: audit-web-nuclei-scan, version: "1"}
spec:
  # Declare the accepted task contract and its executor, independently of inventory.
  auditTask: {contract: web-scan@1, stage: scan}
  parameters: {}
  inputs:
    target: {required: true, mediaTypes: [application/json]}
    settings: {required: true, mediaTypes: [application/json]}
    rulepack: {required: false, mediaTypes: [application/yaml, application/vnd.contractor.nuclei-rulepack+zip]}
    task: {required: true, mediaTypes: [application/zip]}
    execution_manifest: {required: true, mediaTypes: [application/json]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [application/zip]}
  entryStage: scan
  stages:
    scan:
      objective: Check the exact target URL with the retained Nuclei selection
      instructions: {ref: instructions/audit-openapi-scan.md}
      planner: scan-plan@1
      auditScan:
        scanner: nuclei
        settingsArtifact: settings
        taskArtifact: task
        manifestArtifact: execution_manifest
        unknownOutcome: retain-gap
      scanPlan:
        inputArtifact: target
        maxInputs: 1
        maxJobs: 1
        # Allow the five-minute scanner deadline plus diagnostic publication.
        maxTotalSeconds: 330
        tools:
          - {worker: scanner, maxJobs: 1, maxTotalSeconds: 330}
      agents:
        scanner: {template: audit-web-nuclei-scan@1}
      context:
        artifacts:
          target: {namespace: inputs, name: target, required: true}
          settings: {namespace: inputs, name: settings, required: true}
          rulepack: {namespace: inputs, name: rulepack, required: false}
          task: {namespace: inputs, name: task, required: true}
          execution_manifest: {namespace: inputs, name: execution_manifest, required: true}
      result:
        artifacts:
          report: {required: true, mediaTypes: [application/zip], from: {namespace: scan-results, name: audit-result}}
      workflowOutputs: {result: report}
      on:
        succeeded: {succeed: {}}
        failed: {retry: {maxAttempts: 2, then: {fail: {}}}}
        interrupted: {retry: {maxAttempts: 2, then: {fail: {}}}}
