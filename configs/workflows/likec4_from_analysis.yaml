apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-analysis
  version: "1"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    dependency_report:
      required: true
      mediaTypes: [text/markdown]
    project_report:
      required: true
      mediaTypes: [text/markdown]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    architecture:
      required: true
      mediaTypes: [text/vnd.likec4]
    validation_report:
      required: true
      mediaTypes: [text/markdown]

  entryStage: likec4_build
  stages:
    likec4_build:
      objective: Build an evidence-linked LikeC4 model using caller-selected analysis reports
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: likec4_builder@1
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
      on:
        succeeded:
          next: likec4_validate
        failed:
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 6
            then:
              fail: {}

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: likec4_validator@1
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
          validation_report:
            required: true
            mediaTypes: [text/markdown]
      workflowOutputs:
        architecture: architecture
        validation_report: validation_report
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
