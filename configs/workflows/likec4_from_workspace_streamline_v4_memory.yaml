apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-workspace-streamline
  version: "4"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    likec4:
      required: true
      primary: true
      mediaTypes: [text/vnd.likec4]
    likec4_validation_report:
      required: true
      mediaTypes: [text/markdown]
    workspace_state:
      required: true
      mediaTypes: [application/vnd.contractor.workspace-overlay+json]
    workspace_diff:
      required: true
      mediaTypes: [text/x-diff]

  executionConfig:
    planner:
      modelPolicy: planner@2
      llmGateway: local-litellm@1
      credential: development-planner
    workers:
      modelPolicy: worker@2
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: dependency_discovery
  stages:
    dependency_discovery:
      objective: Inventory runtime dependencies from the hydrated project workspace
      instructions:
        ref: instructions/dependency-discovery-planner.md
      planner: streamline@1
      agents:
        analyst:
          template: workspace_source_graph_analyst@3
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          dependency_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: dependencies}
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: project_discovery
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    project_discovery:
      objective: Map project structure, architecture, security controls, and runtime integrations
      instructions:
        ref: instructions/project-discovery-planner.md
      planner: streamline@1
      agents:
        analyst:
          template: workspace_source_graph_analyst@3
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          project_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: project}
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: likec4_build
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}

    likec4_build:
      objective: Build an evidence-linked single-file LikeC4 architecture model for the project
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: streamline@1
      agents:
        builder:
          template: workspace_likec4_builder@3
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
          prior_workspace_state:
            namespace: analysis
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      on:
        succeeded:
          next: likec4_validate
        failed:
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 6
            then:
              fail: {}

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: streamline@1
      agents:
        validator:
          template: workspace_likec4_validator@3
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: analysis
            name: dependencies
            required: true
          project_report:
            namespace: analysis
            name: project
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
          prior_workspace_state:
            namespace: likec4
            name: workspace_state
            required: true
        workspace:
          mode: overlay
          sources:
            - artifact: source
              target: ""
          state:
            artifact: prior_workspace_state
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
          validation_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: likec4, name: validation-report}
          workspace_state:
            required: true
            mediaTypes: [application/vnd.contractor.workspace-overlay+json]
          workspace_diff:
            required: true
            mediaTypes: [text/x-diff]
      workflowOutputs:
        likec4: architecture
        likec4_validation_report: validation_report
        workspace_state: workspace_state
        workspace_diff: workspace_diff
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
