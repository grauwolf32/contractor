apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-top10-source-risk
  version: "3"
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@2
  entryStage: check
  stages:
    check:
      objective: Evaluate one exact OWASP Top 10 source-risk scenario and publish its bounded result
      instructions:
        ref: instructions/audit-risk-source-checker-worker-project-findings-keyed-results.md
      planner: passthrough@1
      agents:
        checker:
          template: audit_risk_source_checker@3
          namespace: audit-risk
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-risk
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
