apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-asvs-source-verification
  version: '1'
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@2
  entryStage: check
  stages:
    check:
      objective: Evaluate one exact ASVS requirement against the supplied source and documentation
      instructions:
        ref: instructions/audit-asvs-source-verifier-worker.md
      planner: passthrough@1
      agents:
        verifier:
          template: audit_asvs_source_verifier@1
          namespace: audit-asvs
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-asvs
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
