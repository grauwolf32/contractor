apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: project-facts-extract, version: "4"}
spec:
  parameters: {}
  inputs:
    memories: {required: true, mediaTypes: [application/json]}
  outputs:
    report: {required: true, primary: true, mediaTypes: [text/markdown]}
  executionConfig:
    workers: {llmGateway: local-litellm@1, credential: development-worker, modelPolicy: worker@2}
  entryStage: extract
  stages:
    extract:
      objective: Select useful source-grounded Project facts; zero observations is valid
      instructions: {ref: instructions/project-facts-extract-stage-v2.md}
      planner: passthrough@1
      agents:
        extractor: {template: fact_extractor@2, namespace: facts}
      context:
        artifacts:
          memories: {namespace: inputs, name: memories, required: true}
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: facts, name: report}
      workflowOutputs: {report: report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
