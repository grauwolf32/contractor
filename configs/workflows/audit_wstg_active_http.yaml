apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: audit-wstg-active-http
  version: "1"

spec:
  parameters:
    target: {required: true}
    authorization_scope: {required: true}
  inputs:
    task:
      required: true
      mediaTypes: [application/zip]
    execution_manifest:
      required: true
      mediaTypes: [application/json]
    context:
      required: true
      mediaTypes: [text/plain, text/markdown]
  outputs:
    result:
      required: true
      primary: true
      mediaTypes: [application/zip]
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
  entryStage: check
  stages:
    check:
      objective: Perform one approved WSTG scenario against the declared HTTP target and preserve live evidence and capability gaps
      instructions:
        ref: instructions/audit-wstg-http-verifier-worker.md
      planner: passthrough@1
      agents:
        verifier:
          template: audit_wstg_http_verifier@1
          namespace: audit-wstg-http
      context:
        artifacts:
          task: {namespace: inputs, name: task, required: true}
          execution_manifest: {namespace: inputs, name: execution_manifest, required: true}
          context: {namespace: inputs, name: context, required: true}
      result:
        artifacts:
          result:
            required: true
            mediaTypes: [application/zip]
            from: {namespace: audit-wstg-http, name: result}
      workflowOutputs:
        result: result
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
