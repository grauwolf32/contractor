apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-wstg-active-http
  version: "8"
spec:
  parameters: {}
  inputs:
    materials:
      required: true
      mediaTypes:
      - text/plain
      - text/markdown
    engagement:
      required: true
      mediaTypes:
      - application/vnd.contractor.engagement+json
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@2
  entryStage: check
  stages:
    check:
      objective: Check the assigned WSTG assertion within the pinned engagement policy and preserve captured
        evidence and capability gaps
      instructions:
        ref: instructions/audit-wstg-http-verifier-worker-project-findings-keyed-results-runtime-versions-investigation-sources-thin-results.md
      planner: passthrough@1
      agents:
        verifier:
          template: audit_wstg_http_verifier@8
          namespace: audit-wstg-http
      context:
        artifacts:
          materials:
            namespace: inputs
            name: materials
            required: true
          engagement:
            namespace: inputs
            name: engagement
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-wstg-http
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
