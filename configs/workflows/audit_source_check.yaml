apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-source-check
  version: "8"
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: audit_completion_worker@1
  entryStage: check
  stages:
    check:
      objective: Evaluate the assigned immutable Audit task set against the supplied source archive
      instructions:
        ref: instructions/audit-source-checker-worker-project-findings-keyed-results-runtime-versions-investigation-sources-thin-results.md
      planner: passthrough@1
      agents:
        checker:
          template: audit_source_checker@8
          namespace: audit-check
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-check
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
