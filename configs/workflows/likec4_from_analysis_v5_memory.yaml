apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-analysis
  version: "6"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    dependency_report:
      required: true
      mediaTypes: [text/markdown]
    project_report:
      required: true
      mediaTypes: [text/markdown]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    likec4:
      required: true
      primary: true
      mediaTypes: [text/vnd.likec4]
    likec4_validation_report:
      required: true
      mediaTypes: [text/markdown]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

      modelPolicy: worker@2
    stages:
      likec4_build:
        agents:
          builder:
            summarizerModelPolicy: summarizer@1
      likec4_validate:
        agents:
          validator:
            summarizerModelPolicy: summarizer@1
  entryStage: likec4_build
  stages:
    likec4_build:
      objective: Build an evidence-linked LikeC4 model using caller-selected analysis reports
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: likec4_builder@5
          namespace: likec4
      context:
        artifacts:
          source: &source_artifact
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
      on:
        succeeded:
          next: likec4_validate
        failed: &retry_policy
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted: *retry_policy
        summarized:
          escalate: &planner_continuation
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@2
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: likec4_validator@5
          namespace: likec4
      context:
        artifacts:
          source: *source_artifact
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
          validation_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: likec4, name: validation-report}
      workflowOutputs:
        likec4: architecture
        likec4_validation_report: validation_report
      on:
        succeeded:
          succeed: {}
        failed: &retry_policy_2
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted: *retry_policy_2
        summarized:
          escalate: *planner_continuation
