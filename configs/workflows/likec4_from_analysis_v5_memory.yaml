apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: likec4-from-analysis
  version: "5"

spec:
  parameters:
    objective:
      required: false

  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
    dependency_report:
      required: true
      mediaTypes: [text/markdown]
    project_report:
      required: true
      mediaTypes: [text/markdown]
    existing_likec4:
      required: false
      mediaTypes: [text/vnd.likec4, text/plain]

  outputs:
    likec4:
      required: true
      primary: true
      mediaTypes: [text/vnd.likec4]
    likec4_validation_report:
      required: true
      mediaTypes: [text/markdown]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: likec4_build
  stages:
    likec4_build:
      objective: Build an evidence-linked LikeC4 model using caller-selected analysis reports
      instructions:
        ref: instructions/likec4-build-planner.md
      planner: passthrough@1
      agents:
        builder:
          template: likec4_builder@4
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          existing_likec4:
            namespace: inputs
            name: existing_likec4
            required: false
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
      on:
        succeeded:
          next: likec4_validate
        failed:
          retry:
            maxAttempts: 6
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 6
            then:
              fail: {}

    likec4_validate:
      objective: Validate and minimally repair the candidate LikeC4 model against source evidence
      instructions:
        ref: instructions/likec4-validate-planner.md
      planner: passthrough@1
      agents:
        validator:
          template: likec4_validator@4
          namespace: likec4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          dependency_report:
            namespace: inputs
            name: dependency_report
            required: true
          project_report:
            namespace: inputs
            name: project_report
            required: true
          architecture_candidate:
            namespace: likec4
            name: architecture
            required: true
      result:
        artifacts:
          architecture:
            required: true
            mediaTypes: [text/vnd.likec4]
            from: {namespace: likec4, name: architecture}
          validation_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: likec4, name: validation-report}
      workflowOutputs:
        likec4: architecture
        likec4_validation_report: validation_report
      on:
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
