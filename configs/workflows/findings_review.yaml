apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: findings-review
  version: '1'
spec:
  parameters: {}
  inputs:
    findings:
      required: true
      mediaTypes: [application/vnd.contractor.findings-collection+zip]
  outputs:
    report:
      required: true
      primary: true
      mediaTypes: [text/markdown]
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1
    stages:
      analyze:
        agents:
          analyst:
            summarizerModelPolicy: summarizer@1
  entryStage: analyze
  stages:
    analyze:
      objective: Analyze the supplied finding collection and publish a report grounded in its retained evidence
      instructions:
        ref: instructions/findings-analyst-worker.md
      planner: passthrough@1
      agents:
        analyst:
          template: findings_analyst@1
          namespace: findings-review
      context:
        artifacts:
          findings:
            namespace: inputs
            name: findings
            required: true
      result:
        artifacts:
          report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: findings-review, name: report}
      workflowOutputs:
        report: report
      on:
        succeeded:
          succeed: {}
        failed: &retry_policy
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted: *retry_policy
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
            deadlineSeconds: 1800
            executionConfig:
              planner:
                modelPolicy: planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
