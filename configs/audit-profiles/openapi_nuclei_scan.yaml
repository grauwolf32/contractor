apiVersion: contractor/v1alpha1
kind: AuditProfile
metadata:
  name: openapi-nuclei-scan
  version: '1'
spec:
  schema: contractor.audit.program.v1
  inputs:
    openapi:
      required: true
      media_types:
      - application/json
      - application/yaml
    settings:
      required: true
      media_types:
      - application/json
  workflows:
    prepare:
      ref: openapi-prepare-work@1
      inputs:
        openapi:
          source: audit-input
          name: openapi
        settings:
          source: audit-input
          name: settings
      parameters:
        checking_workflow: scan
        selection: scan-requests
        max_items: '16'
      outputs:
        work: work
    scan:
      ref: audit-openapi-nuclei-scan@1
      inputs:
        settings:
          source: audit-input
          name: settings
        operation:
          source: task-input
        openapi:
          source: task-input
      parameters: {}
      outputs: {}
  hypotheses: {}
  initial_work:
  - key: prepare-operations
    workflow: prepare
    objective: Prepare bounded independent operation work from the exact selected contract and settings
  limits:
    max_tasks: 17
    max_iterations: 1
    max_tasks_per_iteration: 17
    batch_size: 1
    max_submitted_runs: 48
    max_attempts: 3
    deadline_seconds: 86400
    max_evidence_bytes: 67108864
    max_hypotheses: 1
    max_hypothesis_revisions: 1
    max_hypothesis_bytes: 32768
  policy:
    active_operations: allowed
