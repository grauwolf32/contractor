apiVersion: contractor/v1alpha1
kind: AuditProfile
metadata: {name: web-scan, version: "1"}
spec:
  mode: risk-assessment
  standards: []
  inputs:
    target: {required: true, mediaTypes: [application/json]}
    rulepack: {required: false, mediaTypes: [application/yaml, application/vnd.contractor.nuclei-rulepack+zip]}
    settings: {required: true, mediaTypes: [application/json]}
  inventory:
    implementation: web-scans@1
    source: {source: audit-input, name: target}
    settings: {source: audit-input, name: settings}
    itemWorkflowRole: scan
  workflows:
    scan:
      kind: check
      ref: audit-web-nuclei-scan@1
      inputs:
        rulepack: {source: audit-input, name: rulepack}
        task: {source: item-package}
        execution_manifest: {source: execution-manifest}
        target: {source: audit-input, name: target}
        settings: {source: audit-input, name: settings}
      parameters: {}
      outputs: {result: result}
  execution:
    roundMode: fixed-barrier
    maxRounds: 1
    batchSize: 1
    # One direct target; optional exact custom rules; ordinary Audit retention.
    maxItemsPerRound: 1
    maxItemsTotal: 1
    maxSubmittedRuns: 3
    maxItemRunAttempts: 3
    deadlineSeconds: 86400
    maxEvidenceBytes: 67108864
    incompleteRound: assess-with-gaps
  interaction:
    activeChecks: approval-required
    notApplicable: profile-rule
    reportAcceptance: automatic
