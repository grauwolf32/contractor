{
  "apiVersion": "contractor/v1alpha1",
  "kind": "AuditProfile",
  "metadata": {
    "name": "hypothesis-research",
    "version": "1"
  },
  "spec": {
    "schema": "contractor.audit.program.v1",
    "inputs": {
      "source": {
        "required": true,
        "media_types": [
          "application/zip"
        ]
      },
      "material": {
        "required": true,
        "media_types": [
          "text/plain",
          "application/json"
        ]
      },
      "findings": {
        "required": false,
        "media_types": [
          "application/vnd.contractor.findings-collection+zip"
        ]
      },
      "materials": {
        "required": false,
        "media_types": [
          "application/json"
        ]
      }
    },
    "workflows": {
      "generate": {
        "ref": "audit-hypothesis-generation@1",
        "inputs": {
          "material": {
            "source": "audit-input",
            "name": "material"
          },
          "findings": {
            "source": "audit-input",
            "name": "findings"
          },
          "context": {
            "source": "task-context"
          },
          "materials": {
            "source": "audit-input",
            "name": "materials"
          },
          "analysis": {
            "source": "prior-results"
          },
          "results": {
            "source": "task-results"
          }
        },
        "parameters": {},
        "outputs": {
          "proposals": "proposals"
        },
        "max_attempts": 1
      },
      "check": {
        "ref": "audit-source-check@1",
        "inputs": {
          "source": {
            "source": "audit-input",
            "name": "source"
          },
          "context": {
            "source": "task-context"
          }
        },
        "parameters": {},
        "outputs": {
          "result": "result"
        }
      }
    },
    "hypotheses": {},
    "initial_work": [
      {
        "key": "initial-generation",
        "workflow": "generate",
        "objective": "Propose a scoped next check from the selected source; return empty work if no supported next check exists"
      }
    ],
    "limits": {
      "max_tasks": 32,
      "max_iterations": 1,
      "max_tasks_per_iteration": 32,
      "batch_size": 1,
      "max_submitted_runs": 64,
      "max_attempts": 2,
      "deadline_seconds": 86400,
      "max_evidence_bytes": 67108864,
      "max_hypotheses": 16,
      "max_hypothesis_revisions": 64,
      "max_hypothesis_bytes": 1048576
    },
    "policy": {
      "active_operations": "prohibited"
    },
    "continuation": {
      "workflow": "generate"
    }
  }
}
