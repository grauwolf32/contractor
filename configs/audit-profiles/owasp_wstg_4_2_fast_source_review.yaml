apiVersion: contractor/v1alpha1
kind: AuditProfile

metadata:
  name: owasp-wstg-4-2-fast-source-review
  version: "1"

spec:
  mode: requirements-verification
  standards:
    - scheme: owasp-wstg
      version: "4.2-fast-source.1"
  inputs:
    source:
      required: true
      mediaTypes: [application/zip]
  inventory:
    implementation: standard-mappings@1
    itemWorkflowRole: check
  workflows:
    check:
      kind: check
      ref: audit-standard-source-review@1
      workerCompletion: {kind: audit-check-results@1, stage: check, agent: verifier}
      inputs:
        task: {source: item-package}
        execution_manifest: {source: execution-manifest}
        source: {source: audit-input, name: source}
      parameters: {}
      outputs:
        result: result
  execution:
    roundMode: fixed-barrier
    maxRounds: 1
    batchSize: 1
    maxItemsPerRound: 16
    maxItemsTotal: 16
    maxSubmittedRuns: 16
    maxItemRunAttempts: 1
    deadlineSeconds: 14400
    maxEvidenceBytes: 67108864
    incompleteRound: assess-with-gaps
  interaction:
    activeChecks: prohibited
    findingConfirmation: human-required
    notApplicable: human-required
    reportAcceptance: automatic
