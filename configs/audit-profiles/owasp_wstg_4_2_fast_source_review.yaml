apiVersion: contractor/v1alpha1
kind: AuditProfile
metadata:
  name: owasp-wstg-4-2-fast-source-review
  version: '3'
spec:
  schema: contractor.audit.program.v1
  inputs:
    source:
      required: true
      media_types:
      - application/zip
  workflows:
    check:
      ref: audit-standard-source-review@3
      inputs:
        source:
          source: audit-input
          name: source
        context:
          source: task-context
      parameters: {}
      outputs:
        result: result
  hypotheses: {}
  initial_work: []
  seed_source:
    workflow: check
    standard:
      scheme: owasp-wstg
      version: 4.2-fast-source.1
  limits:
    max_tasks: 16
    max_iterations: 1
    max_tasks_per_iteration: 16
    batch_size: 1
    max_submitted_runs: 16
    max_attempts: 1
    deadline_seconds: 14400
    max_evidence_bytes: 67108864
    max_hypotheses: 128
    max_hypothesis_revisions: 512
    max_hypothesis_bytes: 16777216
  policy:
    active_operations: prohibited
