apiVersion: contractor/v1alpha1
kind: AuditProfile
metadata:
  name: owasp-wstg-4-2-active-http
  version: "4"
spec:
  schema: contractor.audit.program.v1
  inputs:
    materials:
      required: true
      media_types:
      - text/plain
      - text/markdown
    engagement:
      required: true
      media_types:
      - application/vnd.contractor.engagement+json
  workflows:
    check:
      ref: audit-wstg-active-http@4
      inputs:
        materials:
          source: audit-input
          name: materials
        engagement:
          source: audit-input
          name: engagement
        context:
          source: task-context
      parameters: {}
      outputs:
        result: result
  hypotheses: {}
  initial_work: []
  seed_source:
    workflow: check
    standard:
      scheme: owasp-wstg
      version: 4.2-http.1
  limits:
    max_tasks: 94
    max_iterations: 1
    max_tasks_per_iteration: 94
    batch_size: 1
    max_submitted_runs: 94
    max_attempts: 1
    deadline_seconds: 86400
    max_evidence_bytes: 67108864
    max_hypotheses: 128
    max_hypothesis_revisions: 512
    max_hypothesis_bytes: 16777216
  policy:
    active_operations: allowed
