apiVersion: contractor/v1alpha1
kind: AuditProfile
metadata:
  name: openapi-operation-observe
  version: '2'
spec:
  schema: contractor.audit.program.v1
  inputs:
    source:
      required: true
      media_types:
      - application/zip
    openapi:
      required: true
      media_types:
      - application/json
      - application/yaml
      - application/zip
  workflows:
    prepare:
      ref: openapi-prepare-work@1
      inputs:
        openapi:
          source: audit-input
          name: openapi
      parameters:
        checking_workflow: trace
        selection: operations
        max_items: '256'
      outputs:
        work: work
    trace:
      ref: audit-openapi-operation-observe@2
      inputs:
        source:
          source: audit-input
          name: source
        operation:
          source: task-input
        openapi:
          source: task-input
        context:
          source: task-context
      parameters: {}
      outputs:
        result: result
  hypotheses: {}
  initial_work:
  - key: prepare-operations
    workflow: prepare
    objective: Prepare bounded independent operation work from the exact selected contract and settings
  limits:
    max_tasks: 257
    max_iterations: 1
    max_tasks_per_iteration: 257
    batch_size: 1
    max_submitted_runs: 768
    max_attempts: 3
    deadline_seconds: 86400
    max_evidence_bytes: 67108864
    max_hypotheses: 1
    max_hypothesis_revisions: 1
    max_hypothesis_bytes: 32768
  policy:
    active_operations: prohibited
