apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: nuclei-scan, version: "1"}
spec:
  description: Scan one target using installed nuclei HTTP templates.
  runtime: tool@1
  sandboxProfile: local-workdir@1
  toolsets:
    - ref: scan@1
      tools: [scan_nuclei]
  execution:
    tool: scan_nuclei
    arguments:
      url: {source: parameter, name: target}
      rate_limit: {source: literal, value: 10}
    resultArtifact: report
    timeoutSeconds: 300
