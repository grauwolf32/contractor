apiVersion: contractor/v1alpha1
kind: ModelPolicy

metadata:
  name: worker-qwen38-eval
  version: "1"

# Opt-in local Qwen3.8 thinking-mode sampling; original budgets are retained.
# Reference: https://huggingface.co/Qwen/Qwen3.8-27B
spec:
  model: worker-model
  contextWindowTokens: 118000
  maxOutputTokens: 16384
  maxModelCalls: 200
  maxToolCalls: 200
  maxTotalTokens: 2500000
  temperature: 1.0
