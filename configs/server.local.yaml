apiVersion: contractor/v1alpha1
kind: ServerConfig

# Non-secret process defaults for the loopback demo stack. Relative paths are
# resolved from this file, so the command works from any working directory.
spec:
  listen: 127.0.0.1:8080
  privateListen: 127.0.0.1:8443
  privateUrl: https://127.0.0.1:8443

  operatorConfigRoot: .
  managedConfigRoot: ../.local/managed-configs

  shutdownTimeout: 5s
  # Individual private Runtime/A2A HTTP requests only. See docs/operations/timeout-configuration.md.
  runtimeRequestTimeout: 30s
  workerRequestTimeout: 300s
  plannerTimeout: 30m

  scheduler:
    operationTimeout: 30s
    finalizationTimeout: 10s
    abortTimeout: 10s
  runtimeLifecycle:
    cleanupTimeout: 30s
  projectLifecycle:
    operationTimeout: 30s
    claimDuration: 1m
  auditController:
    pollInterval: 1s
    claimLease: 30s
    operationTimeout: 10s
    claimBatch: 8
  database:
    connectTimeout: 5s
    acquireTimeout: 2s
    queryTimeout: 20s
    statementTimeout: 15s
    lockTimeout: 2s
    idleTransactionTimeout: 30s
  a2a:
    pollInterval: 100ms
  credentialManagement:
    connectTimeout: 3s
    requestTimeout: 15s

  artifactBlobBackend: postgresql
  gitAllowedRemotes:
    - github.com:443

  localAuthFile: ../.local/secrets/local-auth.yaml
  browserOrigins:
    - http://127.0.0.1:4173
  insecureLoopbackCookie: true

  caFile: ../.local/pki/ca.crt
  certificateFile: ../.local/pki/control-plane.crt
  privateKeyFile: ../.local/pki/control-plane.key

  performanceMetrics: true
  pprof: false
  pprofListen: 127.0.0.1:6060
