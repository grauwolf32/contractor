name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: contractor
          POSTGRES_DB: contractor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contractor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTRACTOR_TEST_DATABASE_URL: postgres://postgres:contractor@127.0.0.1:5432/contractor?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install Runtime dependencies
        run: cd runtime && uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.x"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install Chromium and host libraries
        run: |
          cd ui
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium

      - name: Full deterministic release gate
        run: make release-verify
