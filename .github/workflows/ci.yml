name: CI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A pull request keeps only its newest selected run. Tags and manual runs each
# keep their own full-gate verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.stages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from PR paths or the full release gate
        id: stages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/select_ci_stages.py

  # PRs run only stages affected by their changed paths. A release tag or
  # manual dispatch selects every make/release.mk stage.
  stage:
    name: ${{ matrix.stage }}
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: contractor
          POSTGRES_DB: contractor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contractor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTRACTOR_TEST_DATABASE_URL: postgres://postgres:contractor@127.0.0.1:5432/contractor?sslmode=disable
      CONTRACTOR_UI_EVIDENCE_DIR: ${{ github.workspace }}/reports/ui-stack
    steps:
      - uses: actions/checkout@v4

      # setup-go saves its cache only after a successful job; restore and
      # save explicitly so failing runs still warm the next one. A cancelled
      # run may have built little, so it saves nothing.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go build and module caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.stage }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.stage }}-

      - name: Confirm Go toolchain
        run: go version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install Runtime dependencies
        run: cd runtime && uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.x"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install UI dependencies
        run: cd ui && corepack pnpm install --frozen-lockfile

      - name: Install Chromium and host libraries
        if: startsWith(matrix.stage, 'release-verify-browser-') || matrix.stage == 'test-ui-stack-operations'
        run: cd ui && corepack pnpm exec playwright install --with-deps chromium

      - name: Check UI image dependency layer
        if: matrix.stage == 'release-verify-ui'
        run: python3 scripts/check_ui_container_install.py

      - name: Run ${{ matrix.stage }}
        shell: bash
        run: |
          mkdir -p reports
          make -k ${{ matrix.stage }} 2>&1 | tee "reports/${{ matrix.stage }}.log"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.stage }}
          path: |
            reports/
            ui/test-results/
            .local/audit-completion-gate/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Save Go build and module caches
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Distinct verdicts make a selected PR pass distinct from the full gate.
  pr-verify:
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    needs: stage
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected PR stage
        run: test "${{ needs.stage.result }}" = success

  release-verify:
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}
    needs: stage
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release stage
        run: test "${{ needs.stage.result }}" = success

  # Live advisory scans query databases that change without a code change, so
  # they report here instead of failing the deterministic release-verify check.
  advisories:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Scan Go commands and the locked Runtime graph
        run: make -k advisories
