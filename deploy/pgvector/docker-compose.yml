# Postgres + pgvector for the artifact-pool RAG backend
# (contractor/tools/artifact_rag.py). Bring it up with ./deploy_pg.sh, then set
# RAG_DB_DSN in cli/.env to the printed DSN.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: contractor-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-contractor}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-contractor}
      POSTGRES_DB: ${PGVECTOR_DB:-contractor_rag}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      # CREATE EXTENSION vector runs on first init; the backend also ensures it.
      - ./init/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-contractor} -d ${PGVECTOR_DB:-contractor_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector-data:
