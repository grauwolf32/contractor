---
# Every variable may be set per group or host. Values that also exist as an
# instance key (see contractor_runtime_instances) can be overridden per
# instance. README.md describes each group.

# Release ---------------------------------------------------------------------

# Git checkout on the controller. The release is `git archive` of the exact
# commit, so uncommitted changes are never deployed.
contractor_runtime_source_repo: "{{ playbook_dir }}/../.."
# Any commit-ish; it is resolved once to a full commit hash.
contractor_runtime_version: HEAD
# Controller directory for release archives.
contractor_runtime_controller_work_dir: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}/contractor-runtime-ansible"
contractor_runtime_python_version: "3.13"
# Extra uv environment for the venv build, for example
# {UV_PYTHON_INSTALL_MIRROR: https://python.mirror.example/, HTTPS_PROXY: http://proxy:3128}.
contractor_runtime_uv_environment: {}
contractor_runtime_keep_releases: 3

# Host layout -----------------------------------------------------------------

contractor_runtime_user: contractor-runtime
contractor_runtime_group: contractor-runtime
contractor_runtime_home: /var/lib/contractor-runtime
contractor_runtime_prefix: /opt/contractor-runtime
contractor_runtime_config_dir: /etc/contractor-runtime
# Subordinate IDs added for the service account when it has none.
contractor_runtime_subid_start: 524288
contractor_runtime_subid_count: 65536
# Delegate the cpu, cpuset, io, memory and pids controllers to user managers;
# Podman limits need them.
contractor_runtime_manage_cgroup_delegation: true

# Control Plane and identity --------------------------------------------------

# Required: the Server's private Control Plane URL, e.g. https://10.0.0.5:8443.
contractor_runtime_control_plane_url: ""
# Host where `contractor pki` runs and the deployment CA lives. The CA key
# never leaves it; the role copies the CA certificate and each instance's
# certificate and key.
contractor_runtime_pki_host: localhost
contractor_runtime_pki_root: "{{ contractor_runtime_source_repo }}/.local/pki"
contractor_runtime_pki_command: contractor
# Issue missing instance certificates. An existing certificate is never
# re-issued, because a new key changes the Runtime principal.
contractor_runtime_pki_issue: true

# Instances -------------------------------------------------------------------

# One Runtime process per entry; each has one allocation slot. Keys:
#   name (required)  [a-z0-9][a-z0-9_-]{0,62}; unit, certificate and Podman owner
#   port (required)  listen and advertised port
#   state            present (default) or absent: stop and remove the unit,
#                    keep certificates and work roots
#   listen_host, advertise_host, cert_dns, cert_ips, labels, adapters,
#   allowed_target_networks, log_level, extra_args, extra_environment,
#   workspace_limits, podman_limits, podman_owner
#   capabilities     overrides of the effective capability switches below
contractor_runtime_instances:
  - name: "{{ inventory_hostname_short | lower | regex_replace('[^a-z0-9_-]+', '-') }}-1"
    port: 9443

contractor_runtime_listen_host: 127.0.0.1
# Address the Server uses to reach the Runtime; defaults to the listen host.
contractor_runtime_advertise_host: ""
# Certificate SANs for newly issued certificates; empty derives them from the
# advertise host plus localhost, 127.0.0.1 and ::1.
contractor_runtime_cert_dns: []
contractor_runtime_cert_ips: []
# Startup labels seed a previously unseen principal only. Each must already be
# bound on the Server, or registration fails with invalid_runtime_labels.
contractor_runtime_labels: []
# null probes every built-in RuntimeAdapter; a list selects a non-empty subset.
contractor_runtime_adapters: null
contractor_runtime_allowed_target_networks: []
contractor_runtime_log_level: info
contractor_runtime_request_timeout_seconds: 5
contractor_runtime_shutdown_grace_seconds: 30
contractor_runtime_cert_expiry_warning_days: 30
# Workspace and Podman settings, as --workspace-<key> and --podman-<key> with
# underscores for hyphens, e.g. {max_files: 50000} or {cpus: 4}. The Runtime
# validates names and bounds; empty keeps its defaults.
contractor_runtime_workspace_limits: {}
contractor_runtime_podman_limits: {}
contractor_runtime_extra_args: []
contractor_runtime_extra_environment: {}
# Appended to the instance's own bin directory. Keep it free of scanners and
# validators: a capability is advertised whenever its executable is found.
contractor_runtime_system_path: /usr/bin:/bin

# Capabilities ----------------------------------------------------------------

# The full set. Override single keys in contractor_runtime_capabilities (host
# or group) or in an instance's `capabilities`.
contractor_runtime_capabilities_default:
  # local | memory | none. local is required by Podman and by the Trailmark
  # graph tools of code-analysis@1; none disables the filesystem Toolsets.
  workspace_storage: local
  # validate_openapi (openapi@1) through vacuum.
  openapi_validator: true
  # validate_likec4 (likec4@1) through the likec4 CLI on Node.
  likec4_validator: true
  # scan@1 operations: nuclei, sqlmap, naabu, ffuf, katana.
  scanners: [nuclei, sqlmap, naabu, ffuf, katana]
  # podman@1 and code-execution@1: rootless Podman, Linux only.
  podman: true
  # podman-network@1 through pasta; requires podman.
  podman_network: true
contractor_runtime_capabilities: {}

# Use operator-provided nuclei templates instead of the pinned release.
contractor_runtime_nuclei_templates_dir: ""

# Podman ----------------------------------------------------------------------

# A preprovisioned repository@sha256 reference. Empty builds deploy/podman
# offline as the service account and uses the digest of the result.
contractor_runtime_podman_image: ""
contractor_runtime_podman_image_repository: localhost/contractor-supervisor
# Pull the digest-pinned base image named in the Containerfile when missing.
# Set false on an air-gapped host and load it into the account's store first.
contractor_runtime_podman_pull_base_image: true

# Service ---------------------------------------------------------------------

contractor_runtime_enable_at_boot: true
# Restart running instances whose release, executables, certificate or
# settings changed. A restart aborts the slot's current allocation: drain the
# Runtime Agent first or set false and restart later.
contractor_runtime_restart: true
contractor_runtime_verify: true
contractor_runtime_verify_timeout_seconds: 180

# Packages and pinned downloads -----------------------------------------------

# Per OS family; override contractor_runtime_system_packages with the same
# groups for another distribution.
contractor_runtime_system_packages_default:
  Debian:
    base: [acl, ca-certificates, python3, sudo, tar, unzip, xz-utils]
    podman: [podman, uidmap, dbus-user-session]
    podman_network: [passt]
  RedHat:
    base: [acl, ca-certificates, python3, sudo, tar, unzip, xz]
    podman: [podman, shadow-utils]
    podman_network: [passt]
  Archlinux:
    base: [acl, ca-certificates, python, sudo, tar, unzip, xz]
    podman: [podman]
    podman_network: [passt]
contractor_runtime_system_packages: {}

# Interpreter that runs sqlmap.py.
contractor_runtime_sqlmap_python: /usr/bin/python3

# Exact versions verified with the Runtime on 2026-10-22. Asset keys are
# ansible_architecture values; `any` serves every architecture. `path` is the
# executable (or, for data, a marker) inside the extracted tree, `strip` the
# number of leading archive directories to drop and `probe` the arguments of
# the Runtime's own startup probe. Override a tool in contractor_runtime_tools
# (merged recursively), always with its sha256.
contractor_runtime_tools_default:
  uv:
    version: 0.13.1
    path: uv
    strip: 1
    assets:
      x86_64:
        url: https://github.com/astral-sh/uv/releases/download/0.13.1/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
      aarch64:
        url: https://github.com/astral-sh/uv/releases/download/0.13.1/uv-aarch64-unknown-linux-gnu.tar.gz
        sha256: 9041c73c99fdc5892cf128140beb354eca9231d502068cc36e6cb53a8e59ad14
  vacuum:
    version: 0.33.2
    path: vacuum
    probe: [version]
    assets:
      x86_64:
        url: https://github.com/daveshanley/vacuum/releases/download/v0.33.2/vacuum_0.33.2_linux_x86_64.tar.gz
        sha256: f6986baeb4d50365fb620f68b2a450e54fc1c9c2d48b7524d330bf9476c29bf9
      aarch64:
        url: https://github.com/daveshanley/vacuum/releases/download/v0.33.2/vacuum_0.33.2_linux_arm64.tar.gz
        sha256: 03ebd836193530d2b153964fa208ac69587105ca065e33f9fbd89b2bedf06f23
  nuclei:
    version: 3.11.1
    path: nuclei
    probe: [-version]
    assets:
      x86_64:
        url: https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
        sha256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
      aarch64:
        url: https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_arm64.zip
        sha256: 8044e3d9768ba0a744b2872c1a87e813006f013da97ca9f50f7661a4203bec07
  naabu:
    version: 2.6.1
    path: naabu
    probe: [-version]
    assets:
      x86_64:
        url: https://github.com/projectdiscovery/naabu/releases/download/v2.6.1/naabu_2.6.1_linux_amd64.zip
        sha256: 018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90
      aarch64:
        url: https://github.com/projectdiscovery/naabu/releases/download/v2.6.1/naabu_2.6.1_linux_arm64.zip
        sha256: 3adc2bb2395c3efff89623499b20eea66ef54924c485d3ae86762393a31736ea
  ffuf:
    version: 2.3.0
    path: ffuf
    probe: [-V]
    assets:
      x86_64:
        url: https://github.com/ffuf/ffuf/releases/download/v2.3.0/ffuf_2.3.0_linux_amd64.tar.gz
        sha256: b2a3c725fcb9da175159682f54d6e9149f2905b00d84d155e7efc5d599975ceb
      aarch64:
        url: https://github.com/ffuf/ffuf/releases/download/v2.3.0/ffuf_2.3.0_linux_arm64.tar.gz
        sha256: e2d712615d53da797ee929006e41f2df5a7960a5353133db9c150ddaa22ae4e8
  katana:
    # The Runtime accepts the 1.7.x and 1.8.x command contracts only.
    version: 1.8.0
    path: katana
    probe: [-version]
    assets:
      x86_64:
        url: https://github.com/projectdiscovery/katana/releases/download/v1.8.0/katana_1.8.0_linux_amd64.zip
        sha256: cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2
      aarch64:
        url: https://github.com/projectdiscovery/katana/releases/download/v1.8.0/katana_1.8.0_linux_arm64.zip
        sha256: 80e269210727a855511ffac8dfb01297b2344742acec71a35e8ba4a67a90f0f2
  sqlmap:
    version: 11afdcb02640211826b71af11a646a87157d223f
    path: sqlmap.py
    probe: [--version]
    strip: 1
    assets:
      any:
        url: https://github.com/sqlmapproject/sqlmap/archive/11afdcb02640211826b71af11a646a87157d223f.tar.gz
        sha256: fd91e67979a46372a8d4b6551601776a95b1a10792160848ea00c0fe3e7ff579
