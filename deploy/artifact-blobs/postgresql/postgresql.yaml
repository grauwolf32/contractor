# Example only: supply your image/bootstrap configs, database and owner-only
# authentication/PKI secrets before applying. See docs/operations/artifact-blob-storage.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractor-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contractor-server
  template:
    metadata:
      labels:
        app: contractor-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files are root-owned; fsGroup makes them group-readable so the
        # init container can copy them into owner-only files for this UID.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: owner-only-secrets
          # alpine:3.24; only copies secret files, no network or writable root.
          image: docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command:
            - /bin/sh
            - -ec
            - |
              for name in local-auth.yaml credential-master-key ca.crt control-plane.crt control-plane.key; do
                cp "/projected/$name" "/secrets/$name"
                chmod 0400 "/secrets/$name"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
          volumeMounts:
            - name: credentials
              mountPath: /projected
              readOnly: true
            - name: secret-files
              mountPath: /secrets
      containers:
        - name: server
          image: contractor-server:local
          command: [/contractor-server]
          args: [serve, --credential-master-key-file=/secrets/credential-master-key]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CONTRACTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: contractor-database
                  key: url
            - name: CONTRACTOR_ARTIFACT_BLOB_BACKEND
              value: postgresql
            - name: CONTRACTOR_OPERATOR_CONFIG_ROOT
              value: /configs
            - name: CONTRACTOR_MANAGED_CONFIG_ROOT
              value: /managed
            - name: CONTRACTOR_LOCAL_AUTH_FILE
              value: /secrets/local-auth.yaml
            - name: CONTRACTOR_BROWSER_ORIGINS
              value: https://contractor.example.invalid
            - name: CONTRACTOR_PUBLIC_LISTEN
              value: 0.0.0.0:8080
            - name: CONTRACTOR_PRIVATE_LISTEN
              value: 0.0.0.0:8443
            - name: CONTRACTOR_PRIVATE_URL
              value: https://contractor-server:8443
            - name: CONTRACTOR_CA_FILE
              value: /secrets/ca.crt
            - name: CONTRACTOR_CONTROL_PLANE_CERT_FILE
              value: /secrets/control-plane.crt
            - name: CONTRACTOR_CONTROL_PLANE_KEY_FILE
              value: /secrets/control-plane.key
          ports:
            - name: public
              containerPort: 8080
            - name: private
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 2Gi
          volumeMounts:
            - name: secret-files
              mountPath: /secrets
              readOnly: true
            - name: managed-config
              mountPath: /managed
      volumes:
        - name: credentials
          secret:
            secretName: contractor-server-credentials
            defaultMode: 0440
        - name: secret-files
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: managed-config
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: contractor-server
spec:
  selector:
    app: contractor-server
  ports:
    - name: public
      port: 8080
      targetPort: public
    - name: private
      port: 8443
      targetPort: private
