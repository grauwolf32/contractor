model_list:
  - model_name: planner-model
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 240
  - model_name: worker-model
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 240

litellm_settings:
  num_retries: 0
  request_timeout: 240
  set_verbose: false
