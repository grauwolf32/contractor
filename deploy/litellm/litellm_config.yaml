model_list:
  - model_name: planner-model
    litellm_params:
      model: openai/qwen/qwen3.8-27b
      api_base: os.environ/CONTRACTOR_LM_STUDIO_URL
      api_key: os.environ/CONTRACTOR_LM_STUDIO_TOKEN
      timeout: 240
  - model_name: worker-model
    litellm_params:
      model: openai/qwen/qwen3.8-27b
      api_base: os.environ/CONTRACTOR_LM_STUDIO_URL
      api_key: os.environ/CONTRACTOR_LM_STUDIO_TOKEN
      timeout: 240

litellm_settings:
  num_retries: 0
  request_timeout: 240
  set_verbose: false
