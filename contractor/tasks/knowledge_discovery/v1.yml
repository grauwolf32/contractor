task:
  name: "Knowledge discovery — surface unrecorded security-relevant facts"

  objective: >
    Explore the project at {project_path} together with the existing artifact
    pool and capture security-relevant facts that are NOT yet recorded in
    memory, as concise, atomic, tagged notes in your working namespace. You are
    in DISCOVERY mode. The deliverable is the set of new memory notes plus the
    Markdown coverage report defined in output_format.

    Survey what already exists before writing anything: call pool_namespaces()
    and list_memories first, and do not re-record facts the pool already
    captures. If the pool is empty, start from the source.

  instructions: |
    Work the artifact pool and the read-only source tools to find what is
    missing, then record it. Follow these steps:

    STEP 1 — Map the knowledge frontier
      - Call pool_namespaces() to enumerate every namespace and its kinds.
      - Skim existing notes with list_memories / list_tags and, for other
        namespaces, pool_read_memory(namespace, "") previews.
      - Build a short mental model of what is ALREADY known so you only chase
        gaps.

    STEP 2 — Hunt for unrecorded, security-relevant facts
      Use pool_search(query, "*", k) over existing results, and the read-only
      source tools (read_file, grep, list_symbols, code-graph) to locate facts
      the pool does not yet capture. Prioritise:
        - Entry points (HTTP routes, handlers, CLI/commands, message consumers)
        - Authentication / authorization / session / RBAC mechanisms
        - Trust boundaries and where untrusted input enters
        - External-service integrations (DB, queues, storage, identity, APIs)
        - Dangerous sinks (SQL, command exec, deserialization, file/path, SSRF)
        - Configuration and secret handling

    STEP 3 — Record each NEW fact
      For every fact NOT already in the pool, write one atomic note with
      write_memory:
        - A specific snake_case name.
        - 1–3 reusable tags (reuse existing tags — call list_tags first).
        - A description that adds context.
        - A body that states the fact AND cites evidence: source path(s),
          symbol/route, or the artifact key it was derived from. Prefix
          inferred facts with "Suspected:" and explain.
      Skip anything already recorded; extend a near-match with append_memory
      instead of creating a duplicate.

    CONSTRAINTS:
      - Read-only everywhere except your own namespace's memory. Never edit
        code or write into another namespace.
      - Do NOT recurse into vendor/, node_modules/, .git/, build/, dist/,
        target/, .venv/ or similar artifact directories.
      - Do NOT invent facts. No evidence -> no note.
      - Do not create subtasks for "verify memory was saved."

  output_format: |
    First, ensure every new fact is saved via write_memory/append_memory.
    Then return a single Markdown coverage report with this structure:

    ```
    # Knowledge Discovery Report

    ## Frontier Reviewed
    - **Namespaces surveyed:** <list>
    - **Existing notes considered:** <count + a few names>

    ## New Facts Recorded
    | Note name | Tags | Fact (1 line) | Evidence |
    |-----------|------|---------------|----------|
    | <name>    | <t1, t2> | <fact> | <path / artifact key> |

    ## Skipped (Already Known)
    - <fact> — already in <namespace>/<note or artifact>

    ## Gaps / Follow-ups
    - <area not yet covered, why, suggested next step>
    ```

    For any empty section, keep the heading and write "None."

  constraints:
    - Survey the pool (pool_namespaces, list_memories) before writing.
    - Every note must cite evidence; inferred facts are prefixed "Suspected:".
    - Reuse existing tags; keep notes atomic.
    - The final answer is the Markdown report; the notes are the durable output.
