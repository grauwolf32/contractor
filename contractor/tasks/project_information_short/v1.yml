task:
  name: "Project structure & security-relevant information (short)"

  objective: >
    Produce a CONCISE high-level Markdown inventory of the project at
    {project_path}, with the same sections as the full inventory but far less
    detail. This is the SHORT recon: breadth over depth, names over contents.
    It must stay shallow and finish quickly — it exists so large repositories
    can be mapped without exhausting the tool/LLM-call budget. The final output
    is the Markdown document itself — not a memory entry or intermediate summary.

    If prior analysis results exist in memory/records for {project_path}, load
    them first and build on them. Do not repeat completed work.

  instructions: |
    Map the project at {project_path} into the report in output_format below.
    Stay deliberately shallow — prefer inferring purpose from directory and file
    NAMES, extensions, and a handful of top-level docs over reading source.

    STEP 1 — Shallow reconnaissance (breadth-first, depth <= 1)
      - List the top-level directory entries (depth 0).
      - For each top-level directory, list its immediate children (depth 1).
      - Do NOT recurse deeper than depth 1. Decide a directory's purpose from
        its name and child names, not by opening its files.
      - Read ONLY the few top-level orientation files: README, SECURITY.md, and
        the primary manifest/build file (e.g. go.mod, package.json, pyproject.toml,
        pom.xml). Read headers / first ~40 lines only.

    STEP 2 — Classify by name (no deep reads)
      For each section below, list the directories/files whose names or
      extensions place them there. Do NOT open files to confirm unless a name is
      genuinely ambiguous AND the section is security-sensitive — and even then,
      read headers only. Keep each entry to one short line.

      Sections:
        1. Configuration & environment settings
        2. Tests
        3. Business / domain logic
        4. Data models & schemas
        5. Cryptographic functions
        6. Security functions (auth, authz, RBAC, middleware)
        7. External-system integration (HTTP/gRPC/DB/queues/clients, API handlers)
        8. Documentation
        9. API specifications (OpenAPI/Swagger/GraphQL/WSDL/proto)

    STEP 3 — Brief risk note
      For items under sections 1, 5, or 6 only, add a short (<= 12 word) risk
      note. Skip risk notes everywhere else.

    STEP 4 — Compose the concise report
      Write the report per output_format. One line per item; no exhaustive
      enumeration. The report IS the deliverable — return it directly.

    HARD CAPS (do not exceed):
      - Never go deeper than directory depth 1.
      - Open at most ~8 files total, headers only.
      - Do NOT recurse into vendor/, node_modules/, .git/, build/, dist/,
        target/, .venv/ or similar.
      - Prefer "inferred from name" over reading. When unsure, list it with a
        "(inferred)" marker rather than opening the file.
      - Do not create subtasks for "verify memory was saved."
      - The final answer MUST be the Markdown report (Markdown only, no JSON).

  output_format: |
    Return a single concise Markdown document with this exact structure:

    ```
    # Project Structure & Security-Relevant Inventory (Short)

    ## Overview
    - **Repository root:** {project_path}
    - **Suspected tech stack:** <languages, frameworks, build tools>
    - **Main entry points:** <file paths, best guess>
    - **Top-level layout:** <comma-separated top-level dirs + one-word purpose>

    ## 1. Configuration & Environment Settings
    - `<path>` — <purpose> <risk note>

    ## 2. Tests
    - `<path>` — <unit/integration/e2e, inferred>

    ## 3. Business / Domain Logic
    - `<path>` — <purpose>

    ## 4. Data Models & Schemas
    - `<path>` — <format/purpose>

    ## 5. Cryptographic Functions
    - `<path>` — <purpose> <risk note>   (or "Not found.")

    ## 6. Security Functions
    - `<path>` — <purpose> <risk note>   (or "Not found.")

    ## 7. External-System Integration
    - `<path>` — <integration type / target>

    ## 8. Documentation
    - `<path>` — <content>

    ## 9. API Specifications
    - `<path>` — <format>   (or "Not found.")

    ## Security Risk Summary
    - **HIGH:** <paths or "none">
    - **MEDIUM:** <paths or "none">
    - **LOW:** <paths or "none">
    ```

    For any section with no matches, keep the heading and write "Not found."

  constraints:
    - Stay at directory depth <= 1; infer purpose from names, not file contents.
    - Open at most ~8 files total, headers only.
    - One short line per item; this report is intentionally brief.
    - The final answer MUST be the Markdown report; no JSON, no deep enumeration.
