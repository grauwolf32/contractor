<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contractor ERD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen drafting table. Top bar, legend rail on the left, pan/zoom schema in the middle, table sheet on the right. */
:root {
  --plane: #f3f3f0;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7873;
  --hair: #e1e0d9;
  --line: #c3c2b7;
  --edge: #8f8d86;
  --dot: #d9d8d1;
  --ring: rgba(11,11,11,0.12);
  --chip: #ebeae5;
  --g-exec: #2a78d6; --g-artifacts: #eb6834; --g-projects: #1baf7a; --g-secrets: #eda100;
  --g-runtime: #e87ba4; --g-audits: #008300; --g-findings: #4a3aa7; --g-evals: #e34948;
  --critical: #d03b3b; --warning: #fab219;
  --tint: 16%; --frame: 5%;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0f0f0e; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
    --hair: #2c2c2a; --line: #44443f; --edge: #77756d; --dot: #262624; --ring: rgba(255,255,255,0.12); --chip: #262624;
    --g-exec: #3987e5; --g-artifacts: #d95926; --g-projects: #199e70; --g-secrets: #c98500;
    --g-runtime: #d55181; --g-audits: #008300; --g-findings: #9085e9; --g-evals: #e66767;
    --tint: 26%; --frame: 8%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0f0f0e; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
  --hair: #2c2c2a; --line: #44443f; --edge: #77756d; --dot: #262624; --ring: rgba(255,255,255,0.12); --chip: #262624;
  --g-exec: #3987e5; --g-artifacts: #d95926; --g-projects: #199e70; --g-secrets: #c98500;
  --g-runtime: #d55181; --g-audits: #008300; --g-findings: #9085e9; --g-evals: #e66767;
  --tint: 26%; --frame: 8%;
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--plane); color: var(--ink); font-family: var(--sans); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Top bar */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--hair);
}
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.title h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.stats { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.search { position: relative; }
.search input {
  width: 15rem; max-width: 60vw; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--plane); font-family: var(--mono); font-size: 12.5px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--chip); }

/* Main area */
.main { flex: 1; display: flex; min-height: 0; position: relative; }
.rail {
  width: 272px; flex: none; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--hair);
  padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 18px;
}
.rail h2 {
  margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.rail p.lead { margin: 0 0 8px; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.legend, .audit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.legend button, .audit button {
  width: 100%; display: grid; grid-template-columns: 12px 1fr auto; align-items: start; gap: 8px;
  text-align: left; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
}
.legend button:hover, .audit button:hover { background: var(--chip); }
.legend button[aria-pressed="true"], .audit button[aria-pressed="true"] { background: var(--chip); box-shadow: inset 0 0 0 1px var(--line); }
.sw { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }
.legend .nm, .audit .nm { font-weight: 500; font-size: 13px; line-height: 1.3; }
.legend .nt, .audit .nt { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; font-weight: 400; }
.cnt { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
.mk {
  width: 12px; height: 12px; margin-top: 3px; border-radius: 3px; border: 1.5px dashed var(--muted); box-sizing: border-box;
}
.mk.dead { border-color: var(--critical); border-style: dashed; }
.mk.wo { border-color: var(--warning); border-style: solid; background: color-mix(in oklab, var(--warning) 35%, transparent); }
.mk.merge { border-style: dashed; border-color: var(--ink-2); }
.mk.fold { border-color: var(--ink); background: var(--ink); }
.howto .ln { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.howto .bx { fill: var(--surface); stroke: var(--line); }
.howto .lb { font: 400 11px var(--sans); fill: var(--ink-2); }
.howto .lk { font: 600 9px var(--mono); fill: var(--muted); }
.verdict { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); margin: 0; }
.verdict b { color: var(--ink); font-weight: 600; }

/* Canvas */
.stage { flex: 1; position: relative; min-width: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--plane);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 18px 18px;
}
.stage.dragging { cursor: grabbing; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
.zoom {
  position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 2px var(--ring);
}
.zoom button { width: 36px; height: 34px; border: 0; background: transparent; cursor: pointer; font-size: 16px; line-height: 1; }
.zoom button + button { border-top: 1px solid var(--hair); }
.zoom button:hover { background: var(--chip); }
.zoom .fit { font-size: 11px; font-weight: 600; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.glabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 7px; border-radius: 5px;
  background: color-mix(in oklab, var(--surface) 92%, transparent); border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 2px var(--ring); transition: opacity 0.15s;
}
.glabel i { width: 9px; height: 9px; border-radius: 2px; background: var(--gc); }
.glabel span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.glabel.dim { opacity: 0.3; }
.hint {
  position: absolute; left: 14px; bottom: 14px; font-size: 11.5px; color: var(--muted);
  background: color-mix(in oklab, var(--plane) 85%, transparent); padding: 3px 8px; border-radius: 4px; pointer-events: none;
}

/* SVG content */
.frame rect { fill: color-mix(in oklab, var(--gc) var(--frame), var(--plane)); stroke: color-mix(in oklab, var(--gc) 45%, var(--plane)); stroke-width: 1; }
.tbl { cursor: pointer; }
.tbl .box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.tbl .hd { fill: color-mix(in oklab, var(--gc) var(--tint), var(--surface)); }
.tbl .tn { font: 600 12px var(--mono); fill: var(--ink); }
.tbl .cn { font: 400 11px var(--mono); fill: var(--ink); }
.tbl .cn.k { font-weight: 600; }
.tbl .ct { font: 400 11px var(--mono); fill: var(--muted); }
.tbl .km { font: 600 8.5px var(--mono); fill: var(--muted); letter-spacing: 0.02em; }
.tbl .more { font: italic 400 10.5px var(--sans); fill: var(--muted); }
.tbl .sep { stroke: var(--hair); stroke-width: 1; }
.tbl:hover .box { stroke: var(--ink-2); }
.tbl.sel .box { stroke: var(--ink); stroke-width: 2; }
.tbl.dead .box { stroke: var(--critical); stroke-dasharray: 5 3; stroke-width: 1.5; }
.tbl.wo .box { stroke: var(--warning); stroke-width: 1.75; }
.tbl.merge .box { stroke: var(--ink-2); stroke-dasharray: 2 2; stroke-width: 1.5; }
.tbl .flagbg.dead { fill: var(--critical); }
.tbl .flagbg.wo { fill: var(--warning); }
.tbl .flagbg.merge { fill: var(--ink-2); }
.tbl .flagbg.fold { fill: var(--ink); }
.tbl .flagtx { font: 600 9px var(--sans); fill: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
.tbl .flagtx.wo { fill: #0b0b0b; }
.tbl .flagtx.merge { fill: var(--surface); }
.tbl .flagtx.fold { fill: var(--surface); }
.tbl .colhi { fill: color-mix(in oklab, var(--gc) 14%, transparent); }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1; }
.edge.hot path { stroke: var(--ink); stroke-width: 1.75; }
.edge .hit { stroke: transparent; stroke-width: 9; }
.edge.hot .hit { stroke: transparent; stroke-width: 9; }
svg.focus .tbl.dim, svg.focus .frame.dim { opacity: 0.22; }
svg.focus .edge.dim { opacity: 0.08; }
.tbl, .edge, .frame { transition: opacity 0.15s; }

/* Detail sheet */
.sheet {
  width: 400px; flex: none; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--hair);
  padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 16px;
}
.sheet header { display: flex; flex-direction: column; gap: 6px; }
.sheet .top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.sheet h2 { margin: 0; font: 600 16px var(--mono); word-break: break-all; }
.close { border: 1px solid var(--line); background: transparent; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
.close:hover { background: var(--chip); }
.gchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.gchip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sheet .desc { margin: 0; font-size: 13.5px; line-height: 1.5; max-width: 60ch; }
.callout { border-radius: 6px; padding: 9px 11px; font-size: 12.5px; line-height: 1.45; border: 1px solid; }
.callout.dead { border-color: var(--critical); background: color-mix(in oklab, var(--critical) 9%, var(--surface)); }
.callout.wo { border-color: color-mix(in oklab, var(--warning) 70%, var(--ink)); background: color-mix(in oklab, var(--warning) 12%, var(--surface)); }
.callout.merge { border-color: var(--ink-2); background: var(--plane); }
.callout.fold { border-color: var(--ink); background: var(--plane); }
.callout b { display: block; font-weight: 600; margin-bottom: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.facts b { color: var(--ink); font-weight: 600; }
.sheet h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cols { width: 100%; border-collapse: collapse; font: 400 12px var(--mono); }
.cols td { padding: 3px 4px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.cols td.k { width: 44px; color: var(--muted); font-size: 10px; font-weight: 600; padding-top: 5px; }
.cols td.t { color: var(--muted); text-align: right; white-space: nowrap; }
.cols td.n { word-break: break-all; }
.cols tr.key td.n { font-weight: 600; }
.rels { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rels li { font-size: 12px; line-height: 1.4; }
.rels button {
  font: 500 12px var(--mono); border: 0; background: var(--chip); border-radius: 4px; padding: 1px 6px; cursor: pointer; color: var(--ink);
}
.rels button:hover { box-shadow: inset 0 0 0 1px var(--line); }
.rels .map { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
.rels .act { font-size: 11px; color: var(--ink-2); }
.plain { font: 400 12px var(--mono); color: var(--ink-2); line-height: 1.6; margin: 0; word-break: break-all; }
.empty { color: var(--muted); font-size: 12.5px; margin: 0; }

/* List view */
.list { flex: 1; overflow: auto; padding: 16px; min-width: 0; }
.list table { border-collapse: collapse; width: 100%; min-width: 760px; background: var(--surface); border: 1px solid var(--hair); }
.list th, .list td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--hair); font-size: 12.5px; vertical-align: top; }
.list th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
.list td.nm { font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.list td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.list tr.grp td { background: var(--plane); font-weight: 600; font-size: 13px; }
.list tr.row { cursor: pointer; }
.list tr.row:hover td { background: var(--chip); }
.badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.badge.dead { background: var(--critical); color: #fff; }
.badge.wo { background: var(--warning); color: #0b0b0b; }
.badge.merge { background: var(--ink-2); color: var(--surface); }
.badge.fold { background: var(--ink); color: var(--surface); }
.list .why { margin-top: 3px; font-size: 12px; line-height: 1.45; color: var(--ink-2); max-width: 70ch; }
.list .procs { margin-top: 3px; font-size: 11.5px; line-height: 1.4; color: var(--muted); max-width: 70ch; }
.sheet .procs { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.sheet .procs li { margin: 2px 0; }
.removed { margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 1.45; }
.removed li { margin: 0 0 5px; }
.removed code { font: 500 11.5px var(--mono); color: var(--ink); }
.removed span { color: var(--ink-2); }

.railtoggle { display: none; }

@media (max-width: 1100px) {
  .sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(400px, 92%); box-shadow: -8px 0 24px var(--ring); z-index: 3; }
}
@media (max-width: 760px) {
  .bar { gap: 8px 12px; }
  .title h1 { font-size: 16px; }
  .stats { font-size: 11.5px; }
  .tools { margin-left: 0; width: 100%; gap: 6px 8px; }
  .search { flex: 1 1 100%; order: 3; }
  .seg { margin-left: auto; }
  .seg button, .railtoggle { padding: 5px 9px; }
  .search input { width: 100%; max-width: none; box-sizing: border-box; }
  .railtoggle { display: inline-block; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; }
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 88%); z-index: 4; box-shadow: 8px 0 24px var(--ring); }
  .sheet { top: auto; left: 0; width: auto; max-height: 62%; border-left: 0; border-top: 1px solid var(--hair); box-shadow: 0 -8px 24px var(--ring); }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.glabel {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 7px; border-radius: 5px;
  background: color-mix(in oklab, var(--surface) 92%, transparent); border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 2px var(--ring); transition: opacity 0.15s;
}
.glabel i { width: 9px; height: 9px; border-radius: 2px; background: var(--gc); }
.glabel span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.glabel.dim { opacity: 0.3; }
.hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tbl, .edge, .frame { transition: none; } }
</style>

<div class="bar">
  <div class="title">
    <h1>Схема БД Contractor</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="tools">
    <button class="railtoggle" id="railToggle" aria-expanded="false" aria-controls="rail">Подсистемы</button>
    <div class="search">
      <label for="q" hidden>Найти таблицу</label>
      <input id="q" type="search" placeholder="Таблица, колонка или процесс" list="tableNames" autocomplete="off" spellcheck="false">
      <datalist id="tableNames"></datalist>
    </div>
    <div class="seg" role="group" aria-label="Вид">
      <button type="button" data-mode="keys" aria-pressed="true">Ключи</button>
      <button type="button" data-mode="all" aria-pressed="false">Все колонки</button>
      <button type="button" data-mode="list" aria-pressed="false">Список</button>
    </div>
  </div>
</div>

<div class="main">
  <aside class="rail" id="rail" aria-label="Подсистемы и оценка">
    <section>
      <h2>Подсистемы</h2>
      <ul class="legend" id="legend"></ul>
    </section>
    <section>
      <h2>Нужны ли все</h2>
      <p class="verdict" id="verdict"></p>
    </section>
    <section>
      <h2>Вердикты</h2>
      <ul class="audit" id="audit"></ul>
    </section>
    <section>
      <h2>Удалено в V365</h2>
      <ul class="removed" id="removed"></ul>
    </section>
    <section>
      <h2>Как читать</h2>
      <svg class="howto" width="236" height="58" viewBox="0 0 236 58" role="img" aria-label="Связь: вилка у таблицы с внешним ключом, черта у таблицы, на которую он ссылается">
        <path class="ln" d="M22,16H150M30,10V22M140,16L150,9M140,16L150,23"/>
        <rect class="bx" x="2" y="6" width="20" height="20" rx="3"/>
        <rect class="bx" x="150" y="6" width="20" height="20" rx="3"/>
        <text class="lb" x="2" y="44">родитель</text>
        <text class="lb" x="122" y="44">с внешним ключом</text>
        <text class="lk" x="2" y="56">PK</text>
        <text class="lk" x="122" y="56">FK → PK родителя</text>
      </svg>
    </section>
  </aside>

  <div class="stage" id="stage">
    <svg id="svg" role="group" aria-label="Диаграмма связей 71 таблицы Contractor, сгруппированных по 8 подсистемам">
      <g id="world"></g>
    </svg>
    <div class="labels" id="labels"></div>
    <div class="zoom" aria-label="Масштаб">
      <button type="button" id="zin" aria-label="Приблизить">+</button>
      <button type="button" id="zout" aria-label="Отдалить">−</button>
      <button type="button" id="zfit" class="fit" aria-label="Вписать всю схему">ВСЁ</button>
    </div>
    <div class="hint">Колесо — масштаб, перетаскивание — сдвиг, клик по таблице — подробности</div>
  </div>

  <div class="list" id="list" hidden></div>

  };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  stage.addEventListener('click', (e) => {
    if (moved || e.target.closest('.zoom')) return;
    if (!e.target.closest('.tbl') && !e.target.closest('.edge')) { if (selected) deselect(); else if (focusSet) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); } }
  });
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
  }, { passive: false });
  $('zin').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.35); });
  $('zout').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.35); });
  $('zfit').addEventListener('click', () => fitAll());

  // Legend and audit buckets
  $('legend').addEventListener('click', (e) => {
    const b = e.target.closest('[data-group]'); if (!b) return;
    const id = b.dataset.group;
    if (focusKey === 'g:' + id) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); fitAll(); return; }
    if (mode === 'list') setMode(store.get('erd-map') || 'keys');
    selected = null; sheet.hidden = true; clearPressed(); b.setAttribute('aria-pressed', 'true');
    focusKey = 'g:' + id; focusSet = new Set(D.tables.filter((t) => t.group === id).map((t) => t.name));
    applyFocus();
    const p = L.groups[id]; fitBox({ x: p.x - 10, y: p.y - 10, w: p.w + 20, h: p.h + 20 }, 1.1);
    closeRailOnPhone();
  });
  $('audit').addEventListener('click', (e) => {
    const b = e.target.closest('[data-audit]'); if (!b) return;
    const a = auditItems.find((x) => x.key === b.dataset.audit);
    if (focusKey === 'a:' + a.key) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); fitAll(); return; }
    if (mode === 'list') setMode(store.get('erd-map') || 'keys');
    selected = null; sheet.hidden = true; clearPressed(); b.setAttribute('aria-pressed', 'true');
    focusKey = 'a:' + a.key; focusSet = new Set(a.tables);
    applyFocus();
    if (a.tables.length === 1) select(a.tables[0], true); else fitTo(a.tables, 1);
    closeRailOnPhone();
  });

  // Search: dims tables that do not match a name or column
  $('q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (T[q]) { select(q, true); return; }
    if (!q) { focusSet = null; focusKey = null; applyFocus(); return; }
    selected = null; sheet.hidden = true; clearPressed();
    focusKey = 'q'; focusSet = new Set(D.tables.filter((t) => t.name.includes(q) || t.cols.some((c) => c.n.includes(q)) || (t.desc + ' ' + t.why + ' ' + t.procs.join(' ')).toLowerCase().includes(q)).map((t) => t.name));
    applyFocus();
  });
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && focusSet && focusSet.size) { e.preventDefault(); const first = [...focusSet][0]; focusSet.size === 1 ? select(first, true) : fitTo([...focusSet], 1); }
    if (e.key === 'Escape') { e.target.value = ''; focusSet = null; focusKey = null; applyFocus(); }
  });

  // List view
  function renderList() {
    const rows = D.groups.map((g) => {
      const ts = D.tables.filter((t) => t.group === g.id);
      return `<tr class="grp"><td colspan="6"><span class="gchip"><i style="background:${gvar(g.id)}"></i>${g.name} · ${ts.length}</span></td></tr>` +
        ts.map((t) => { const fl = D.flags[t.name]; return `<tr class="row" data-t="${t.name}" tabindex="0"><td class="nm">${t.name}${fl ? `<span class="badge ${KIND[fl.kind].cls}">${KIND[fl.kind].label}</span>` : ''}</td><td>${esc(t.desc)}${t.why ? `<div class="why">${esc(t.why)}</div>` : ''}${t.procs.length ? `<div class="procs">Процессы: ${esc(t.procs.join('; '))}</div>` : ''}</td><td class="num">${t.cols.length}</td><td class="num">${(out[t.name] || []).length}</td><td class="num">${(inc[t.name] || []).length}</td><td style="font-family:var(--mono);font-size:11.5px;color:var(--ink-2)">${t.usage.join(', ') || '—'}</td></tr>`; }).join('');
    }).join('');
    $('list').innerHTML = `<table><thead><tr><th>Таблица</th><th>Назначение</th><th style="text-align:right">Колонки</th><th style="text-align:right">FK наружу</th><th style="text-align:right">FK внутрь</th><th>Пакеты internal/</th></tr></thead><tbody>${rows}</tbody></table>`;
    $('list').querySelectorAll('tr.row').forEach((r) => {
      r.addEventListener('click', () => select(r.dataset.t, true));
      r.addEventListener('keydown', (e) => { if (e.key === 'Enter') select(r.dataset.t, true); });
    });
  }

  function setMode(m) {
    mode = m; store.set('erd-mode', m);
    if (m !== 'list') store.set('erd-map', m);
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    const isList = m === 'list';
    $('list').hidden = !isList; stage.hidden = isList;
    if (isList) { renderList(); sheet.hidden = true; return; }
    render();
    if (selected) { showSheet(selected); fitTo([selected], 1); } else fitAll(false);
  }
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // Phone: the legend slides over the canvas
  const rail = $('rail');
  const phone = () => matchMedia('(max-width: 760px)').matches;
  function syncRail() { if (phone()) rail.hidden = $('railToggle').getAttribute('aria-expanded') !== 'true'; else rail.hidden = false; }
  function closeRailOnPhone() { if (phone()) { $('railToggle').setAttribute('aria-expanded', 'false'); syncRail(); } }
  $('railToggle').addEventListener('click', (e) => { const b = e.currentTarget; b.setAttribute('aria-expanded', String(b.getAttribute('aria-expanded') !== 'true')); syncRail(); });
  addEventListener('resize', () => { syncRail(); });
  syncRail();

  addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected && document.activeElement?.id !== 'q') deselect(); });

  // Boot
  setMode(mode);
  const h = decodeURIComponent(location.hash.slice(1));
  if (T[h]) select(h, true);
  else requestAnimationFrame(() => mode !== 'list' && fitAll(false));
})();
</script>
