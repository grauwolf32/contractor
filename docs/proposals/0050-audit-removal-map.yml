schema_version: '1.0'
boundary: V64-001 validates contracts offline. Dependent tasks switch executable callers. No compatibility
  mode and no second execution pipeline.
relations:
- name: audits
  action: preserve
  owner: V64-002
  facts: Goal, pinned baseline/scope/program, control intent and report refs; drop phase/review authority
    and duplicate execution state.
- name: audit_controller_claims
  action: preserve
  owner: V64-002
  facts: Reuse ControllerClaims; no extra claim or lease owner.
- name: audit_events
  action: preserve
  owner: V64-002
  facts: Retain historical event facts; obsolete approval event values confer no authority.
- name: audit_artifact_links
  action: replace
  owner: V64-004
  facts: Transfer exact refs, lineage and retention to ordinary Audit/Project Artifact ownership before
    releasing old holds.
- name: audit_items
  action: replace
  owner: V64-002
  facts: Accepted task identity, immutable selected inputs and remaining work; do not invent historical
    hypotheses or verdicts.
- name: audit_execution_items
  action: replace
  owner: V64-002
  facts: Preserve exact task/Run-attempt membership and collected outcome references, including batches.
- name: audit_executions
  action: replace
  owner: V64-002
  facts: Keep original Run identity, submission key, pinned inputs, collection receipt and exact outputs;
    technical execution state comes from Run.
- name: audit_rounds
  action: replace
  owner: V64-002
  facts: Preserve selected membership/order as iteration boundary; remove admission/staging/seal and progression
    state.
- name: audit_round_result_pages
  action: replace
  owner: V64-013
  facts: Retain exact accepted results and any independent input snapshot; remove round-specific page
    chain after consumers migrate.
- name: audit_report_pages
  action: replace
  owner: V64-010
  facts: Keep every existing report byte and exact descriptor in ArtifactStore; no report candidate/acceptance
    lifecycle.
- name: audit_findings
  action: replace
  owner: V64-014
  facts: Move evidenced problem identities to Project, preserving independent origins; qualified correlation
    alone does not justify merging arbitrary findings. Proposals lacking problem admission facts remain
    retained ordinary results/receipts; migration does not invent evidence or a current Project assessment.
- name: audit_finding_contributions
  action: replace
  owner: V64-014
  facts: Retain every distinct source Audit/task/Run, exact evidence, time/conditions, original receipts
    and optional existing check association. Preserve source-specific assessments and annotations, including
    contradictory ratings and original duplicate targets; no representative or latest-source verdict.
- name: audit_finding_assessments
  action: replace
  owner: V64-014
  facts: Preserve original semantic facts and exact evidence as ordinary outputs; no hypothesis fabricated
    from old free text and no new assessment ledger.
- name: audit_review_requests
  action: delete
  owner: V411-010
  facts: Delete pending/expired/fulfilled approval requests, report candidates and expiry/renewal authority
    after their callers are removed. Exact report snapshots are preserved independently.
- name: audit_review_decisions
  action: replace
  owner: V411-010
  facts: Transfer useful analyst finding annotations with actor/time/history; discard control approvals.
    V64-014 retains finding annotations as source facts; V411-010 supplies direct Project commands and
    removes obsolete control records after retention. Historical decisions neither set current Project
    assessment automatically nor grant future execution authority.
- name: audit_live_item_reviews
  action: delete
  owner: V411-010
  facts: Delete the approval projection/view with its callers; no replacement waiting-for-policy state.
- name: finding_correlation_fences
  action: preserve
  owner: V64-014
  facts: Keep qualified Project-scoped deduplication fence; reuse owner mechanism, do not create another
    lock domain.
- name: finding_proposal_audit_holds
  action: replace
  owner: V64-014
  facts: Transfer required exact proposal/evidence holds to Project contribution or retained ordinary
    result ownership before releasing source Audit holds.
- name: finding_proposal_receipts
  action: preserve
  owner: V64-014
  facts: Reuse existing finding intake and receipt identity. Replays add no independent source.
- name: mutation_receipts
  action: preserve
  owner: V64-002
  facts: Reuse keyed mutation receipts and natural submission/publication/intake keys. Do not add a parallel
    receipt store.
- name: workflow_runs
  action: preserve
  owner: V64-002
  facts: Reuse RunService/Scheduler attempts, cancellation, terminal observation and cleanup authority.
paths:
- prefix: internal/auditcontroller/
  action: replace
  owner: V64-002
  facts: One bounded coordinator over ordinary tasks/Runs; remove separate phase/round progression.
- prefix: internal/auditservice/
  action: replace
  owner: V64-002
  facts: One task acceptance/control owner; shared idempotency and authorization.
- prefix: internal/auditstore/
  action: replace
  owner: V64-002
  facts: Apply relation-specific dispositions; preserve real-store invariants and bounded purge.
- prefix: internal/auditdomain/
  action: replace
  owner: V64-010
  facts: Keep reusable inventory/parser/evidence algorithms; remove exclusive ZIP/task/result wrappers
    only after migrated callers.
- prefix: internal/config/auditprofile/
  action: replace
  owner: V64-010
  facts: Replace staged role/inventory/review authoring with the common program; no lenient reader.
- prefix: runtime/src/contractor_runtime/toolsets/audit_results/
  action: replace
  owner: V64-012
  facts: Rework existing Runtime assembly for trusted per-item conclusions and ordinary JSON outputs;
    remove obsolete ZIP assembly, no new collector.
- prefix: ui/src/routes/projects/audits/
  action: replace
  owner: V64-009
  facts: Keep goal/work/material/result/finding views and controls; remove approvals inbox and candidate
    acceptance.
- prefix: ui/src/routes/catalog/audit-preset
  action: replace
  owner: V64-009
  facts: Show common program inputs and selected Workflows.
- prefix: internal/evalstore/
  action: replace
  owner: V64-010
  facts: Adapt existing Audit readers and retained execution tombstones; keep independent Eval lifecycle.
- prefix: internal/findingintake/
  action: replace
  owner: V64-014
  facts: Keep normalized provider-independent intake and receipts; remove report-approval fence; preserve
    Project sources.
- prefix: internal/contracts/audit_completion.go
  action: replace
  owner: V64-012
  facts: Replace the old ZIP completion envelope only with the actual Runtime/Scheduler caller.
- prefix: internal/config/audit_profile.go
  action: replace
  owner: V64-010
  facts: Switch catalog authoring strictly after executable consumers migrate.
- prefix: internal/httpapi/public/
  action: replace
  owner: V64-008
  facts: Migrate only Audit-dependent handlers/contracts; preserve unrelated API.
- prefix: internal/publicclient/
  action: replace
  owner: V64-008
  facts: Regenerate client and migrate Audit CLI consumers in the same API change.
- prefix: ui/src/api/generated/public.ts
  action: replace
  owner: V64-008
  facts: Regenerate; never edit by hand.
- prefix: api/v1alpha1/
  action: replace
  owner: V64-012
  facts: Migrate only workerCompletion, completion capabilities and Audit allocation context with actual
    Runtime caller; preserve other wire fields.
- prefix: api/audit-check-plans/
  action: replace
  owner: V64-010
  facts: Retain exact facts needed by findings/results; drop exclusive acceptance-package schemas after
    migration.
- prefix: api/audit-dependencies/
  action: replace
  owner: V64-010
  facts: Retire the old item dependency format after its actual consumers migrate. V64-004 supplies
    per-artifact exact forks only; the concrete SMT snapshot/original-input case remains domain-owned
    in V410-025, without a replacement universal dependency manifest.
- prefix: api/audit-priority/
  action: preserve
  owner: V64-010
  facts: Optional ranking contract is outside core execution and has no scheduling authority.
- prefix: api/testdata/
  action: replace
  owner: V64-010
  facts: Migrate only Audit consumer fixtures/gates with each owner; independent exports and source archives
    retain their contracts.
- prefix: internal/auditbaseline/
  owner: V64-002
  action: replace
  facts: Preserve exact baseline/scope pinning; replace obsolete approval policy fields with ordinary
    operation restrictions.
- prefix: internal/auditimport/
  owner: V64-012
  action: replace
  facts: Consume exact ordinary JSON task results; retain reusable evidence validation and remove exclusive
    ZIP/import wrappers with their callers.
- prefix: internal/auditscan/
  owner: V64-010
  action: preserve
  facts: Keep deterministic scan planning and selection algorithms; adapt their caller to ordinary accepted
    tasks.
- prefix: internal/auditstandards/
  owner: V64-010
  action: replace
  facts: Preserve immutable standard content/version and fixed source denominator; remove execution approval
    requirements from target bindings.
- prefix: internal/auditpriority/
  owner: V64-005
  action: preserve
  facts: Optional ranking remains outside deterministic core execution; no new scheduler authority.
- prefix: internal/artifacts/
  owner: V64-004
  action: replace
  facts: Extend ordinary ownership/grants/publication/retention for Audit materials; preserve all unrelated
    Artifact contracts.
- prefix: internal/runservice/
  owner: V64-004
  action: replace
  facts: Reuse ordinary Run creation and exact input forks; adapt Audit-selected input materialization
    without an additional execution service.
- prefix: internal/runstore/
  owner: V64-002
  action: replace
  facts: Keep authoritative ordinary Run state, attempts and receipts; migrate Audit association readers,
    never duplicate execution state.
- prefix: internal/scheduler/
  owner: V64-012
  action: replace
  facts: Preserve capacity, placement, retry and cleanup ownership; switch Audit completion context only
    with its real Runtime caller.
- prefix: internal/httpapi/privateartifacts/
  owner: V64-004
  action: replace
  facts: Adapt only ordinary selected Artifact grants/ownership; no Audit-specific collector or permission
    API.
- prefix: runtime/src/contractor_runtime/contracts/
  owner: V64-012
  action: replace
  facts: Migrate Audit allocation/completion/capability fields together; preserve other private wire contracts.
- prefix: runtime/src/contractor_runtime/worker/
  owner: V64-012
  action: replace
  facts: Rework existing Audit completion assembly under its invocation owner; preserve ordinary Worker
    outcomes and configured model.
- prefix: runtime/src/contractor_runtime/finding_proposals.py
  owner: V64-014
  action: replace
  facts: Retain normalized finding submissions and receipts; bind exact per-item origin from trusted context.
- prefix: runtime/src/contractor_runtime/toolsets/security_findings/
  owner: V64-014
  action: replace
  facts: Keep AppSec problem/evidence tooling; adapt source contributions without deriving a historical
    hypothesis identity from free text.
- prefix: configs/workflows/
  owner: V64-010
  action: replace
  facts: Migrate Audit-dependent bindings and exclusive task/result schemas; keep ordinary standalone
    Workflows and independent source/export archives.
- prefix: configs/agent-templates/
  owner: V64-010
  action: replace
  facts: Migrate Audit-specific prompt/tool instructions with their real caller; preserve shared ordinary
    Worker templates.
- prefix: ui/src/routes/projects/
  owner: V411-010
  action: replace
  facts: Remove old approval-required Project settings while preserving ordinary scope, credentials and
    operation restrictions.
- prefix: internal/contracts/engagementcontract/
  owner: V411-010
  action: replace
  facts: Align only active-operation policy with removal of formal approvals; keep independent HTTP scope,
    credentials and network authorization guarantees.
