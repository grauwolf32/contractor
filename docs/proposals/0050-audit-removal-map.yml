states:
- family: Audit
  preserve:
  - draft
  - active
  - paused
  - cancelling
  - cancelled
  - finalizing
  - completed
  - failed
  - deleting
  remove:
  - waiting_review
  owner: V64-002
- family: approval
  remove:
  - pending
  - approved
  - rejected
  - expired
  - renewed
  - awaiting_review
  owner: V411-010
  facts: These are approval states only; identically named ordinary task states are not deleted by spelling.
- family: execution
  owner: V64-002
  facts: Run retains technical status; task keeps selected work, attempts, exact outputs and settlement
    facts without a duplicate running/failed/succeeded lifecycle.
