    - >-
      All analysis starts from one immutable effective snapshot. Local direct
      and overlay therefore share the same mirror path, while memory remains
      shallow-only by explicit resource policy rather than technical accident.
    - >-
      Operation-level positive capability is sufficient: shallow templates run
      on either provider and graph templates wait for local capacity without a
      new profile type or hidden fallback.
    - >-
      V15-007 adds only new AgentTemplate/Workflow versions; old identities stay
      untouched. V15-008 crosses PostgreSQL, mTLS, registration, Scheduler,
