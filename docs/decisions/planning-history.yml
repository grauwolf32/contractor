    - >-
      Tree-sitter node_type is language-specific and graph quality/language
      coverage is constrained by pinned upstream parsers. No result claims
      semantic completeness when coverage is incomplete.
    - >-
      Graph indexes are rebuilt for every allocation and digest. Persisted
      graph artifacts or a cross-Run cache may improve performance later but
      require separate provenance, invalidation and Artifact contracts.

