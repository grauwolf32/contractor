interpretation:
  - Raw samples were captured before a history-only rebase at 7ec550a3153d6572f9f80a664ea8dcebc51a1690; the internal/performance and tools/performancebench trees are byte-identical at the recorded rebased revision.
  - The authenticated JSON micro-workload deliberately isolates middleware cost. Enabled HTTP accounting added about 0.77 microseconds at p95 and 15 allocations per request on this host; network, JSON parsing and database work in a real request will change the relative percentage.
  - One simulated hour retained exactly 240 frames and 625120 bytes, below the 8 MiB cap. It issued exactly 60 logical database-stat reads, 12 size reads and 60 flush attempts; the disabled path retained and issued none.
  - Idle pprof throughput was 0.88 percent above the off sample mean and active capture was 0.63 percent below it. Both differences are within the observed run-to-run variation and are not an overhead guarantee.
  - High-water RSS differed by roughly 2 MiB between the profiling variants, but the host was under memory pressure with swap fully used; treat this as environment evidence rather than a stable product bound.
  - The standard Go benchmarks recorded separately by the same command are the lower-level regression baseline; the release gate intentionally has no noisy universal percentage threshold.
