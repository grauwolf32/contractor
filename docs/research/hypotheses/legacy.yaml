- id: AA3
  direction: AA
  claim: Task-specific skills as executable assets (tool-call sequences, code templates, scripts) raise small-model
    success vs prose.
  legacy_design:
    mechanism: 'Generalizes E4 from payloads to whole procedures: a replayable probe sequence / code template
