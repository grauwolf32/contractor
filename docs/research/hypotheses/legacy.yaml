- id: AC6
  direction: AC
  claim: Observations are a tunable precision/recall dial — lean and lean+paths move opposite axes; route per
    use-case.
  legacy_design:
    mechanism: 'The study showed lean = recall, lean+paths = precision. Expose this as a config dial: a security
      scanner that must not miss bugs picks lean; a PR-gate / triage flow drowning in FPs picks lean+paths.'
    test: Sweep the dial across use-case-representative fixtures; verify monotone precision/recall movement.
