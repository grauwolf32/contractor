- id: AB1
  direction: AB
  claim: Define and instrument hypothesis quality — hit-rate, hypothesis-recall, and confirmed-findings-per-hypothesis-token
    — so generators are comparable.
  legacy_design:
    mechanism: Hit-rate = confirmed / generated; hypothesis-recall = ground-truth vulns that had a matching hypothesis
      at all; efficiency = confirmed findings per hypothesis-token. This is the instrument the whole direction
      needs (measurement-first, like F).
    test: Score oas_analyzer on the 24 fixtures as the baseline under these metrics.
    decision_rule: Establishes the baseline; every generator below is judged against it.
    metrics:
    - hit-rate; hypothesis-recall; confirmed/hypothesis-token
  legacy_evidence:
    status: not_recorded
  source_anchor: AB1
  v2_status: proposed
- id: AB2
  direction: AB
  claim: 'Mode richness trades off cleanly: whitebox > graybox > blackbox on hit-rate; blackbox wins on breadth-per-token.'
  legacy_design:
    mechanism: More internal signal → more precise hypotheses but higher cost/narrower reach. Quantifying the
      curve tells you which mode to use when (and pairs with Y's BFS/DFS).
    test: Same fixtures, generate hypotheses in each mode; plot hit-rate and recall vs tokens.
    decision_rule: Confirm the ordering and the cost crossover; output a mode-selection guideline.
    metrics:
    - hit-rate / recall / tokens by mode
  legacy_evidence:
    status: not_recorded
  source_anchor: AB2
  v2_status: proposed
- id: AB3
  direction: AB
  claim: Differential/comparative generation (hypothesize from the outlier sibling) beats per-endpoint spec-shape
    on hit-rate.
  legacy_design:
    mechanism: '"Siblings A,B check ownership; C doesn''t" is a far stronger signal than "C takes an id" (ties
      R intent-anomaly, E3 control-diff). Works in all three modes.'
    test: Differential generator vs oas_analyzer on BOLA/BFLA fixtures (crapi, vampi).
    decision_rule: Confirm if differential hit-rate > spec-shape, with fewer naming-based false hypotheses.
    metrics:
    - hit-rate; naming-based-FP share
  legacy_evidence:
    status: not_recorded
  source_anchor: AB3
  v2_status: proposed
- id: AB4
  direction: AB
  claim: Active/behavioral generation (probe → observe differential → hypothesize from the anomaly) surfaces hypotheses
    static spec-analysis misses.
  legacy_design:
    mechanism: 'Graybox/blackbox: send calibrated baseline requests, mine response-code/size/timing/error differentials
      for anomalies, turn each into a hypothesis. The spec never reveals these.'
    test: Behavioral generator vs static-only; hypothesis-recall on fixtures with behavior-only signals (error-based,
      timing).
    decision_rule: Confirm a class of hypotheses appears that static generation cannot produce.
    metrics:
    - hypothesis-recall; behavior-only hypotheses count
  legacy_evidence:
    status: not_recorded
  source_anchor: AB4
  v2_status: proposed
- id: AB5
  direction: AB
  claim: Multi-modal fusion (OAS + LikeC4 + code/dataflow + traces) generates higher-quality hypotheses than any
    single source.
  legacy_design:
    mechanism: The spec gives the surface, the architecture gives trust boundaries, dataflow gives reachability,
      traces give runtime truth — fused, they ground hypotheses the blackbox oas_analyzer can't (whitebox-grade
      leads from the founding format artifacts X).
    test: Fusion generator vs OAS-only; hit-rate + recall, both model sizes.
