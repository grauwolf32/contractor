hypotheses:
- id: A1
  direction: A
  claim: Prompt caching of the static prefix cuts input tokens ≥40% with no quality change.
  legacy_design:
    mechanism: Mark the worker system prompt + schema trailer + injected skills as cacheable so re-sends bill
      at the cached rate instead of full input rate.
    test: Re-run vuln-detection (24 fixtures) + XBOW subset with caching on/off.
    decision_rule: Confirm if LLM_USAGE.usage.cached > 0 and mean input drops ≥40% while detection F1 and capture
      rate stay within pass@3 noise. Kill if F1 moves >1σ.
    metrics:
    - metrics.jsonl → LLM_USAGE.usage.{input,cached,total}; RUN_SUMMARY.input_tokens
  legacy_evidence:
    status: not_recorded
  source_anchor: A1
  v2_status: proposed
- id: A2
  direction: A
  claim: Byte-bounded heavy-result retention ( keep_budget_chars>0 ) reduces peak prompt size ≥30% on scan tasks
    without lowering recall.
  legacy_design:
    mechanism: Today retention is count-only (last 15); 15× up to 50 KB reads can co-reside. Add a byte budget
      so large reads evict sooner.
    test: vuln-scan (max_steps 75) + vuln-scan-trace on the realvuln fixtures, sweep keep_budget_chars ∈ {0, 60k,
      120k} .
    decision_rule: Confirm if peak input tokens drop ≥30% and detection recall is flat; kill if recall drops >5%.
    metrics:
    - RUN_SUMMARY.input_tokens (peak per agent) vs scoring.recall
  legacy_evidence:
    status: shipped_or_validated
    note: Byte-bounded retention was shipped and reported recall-safe on binding large scans.
  source_anchor: A2
  v2_status: proposed
- id: A3
  direction: A
  claim: Making summarization prune (drop oldest tool results) instead of appending a nudge lowers total tokens
    on over-budget runs.
  legacy_design:
    mechanism: On crossing the budget, evict the oldest elided-eligible results to bring the prompt under budget,
      rather than appending a "wrap up" message that grows it and repeats each turn.
    test: Long-horizon tasks (scan 75-step) where summarization currently fires repeatedly; compare total tokens
      and count of summarization-history entries.
    decision_rule: Confirm if total tokens fall and completion/recall hold; kill if the model truncates output
      (incomplete rate rises).
    metrics:
    - CALLBACK_SUMMARY.summarization.history length; RUN_SUMMARY.total_tokens; subtask incomplete rate
  legacy_evidence:
    status: not_recorded
  source_anchor: A3
  v2_status: proposed
- id: A4
  direction: A
  claim: A cross-subtask file-read cache cuts redundant read_file tokens materially on multi-subtask tasks.
  legacy_design:
    mechanism: Dedup elision only catches near-identical calls inside one prompt; the same file read in subtask
      1 and subtask 5 is re-fetched and re-tokenized. Return a "already read, see prior result" handle for unchanged
      files.
    test: Instrument repeated read_file args across a planner session on vuln-assess ; measure duplicate-read
      rate and token bytes.
    decision_rule: Confirm if duplicate-read bytes are a non-trivial share (≥15%) and the cache reclaims most
      of it with equal recall.
    metrics:
    - TOOL_RESULT.result_size summed by args_hash for read_file
  legacy_evidence:
    status: not_recorded
  source_anchor: A4
  v2_status: proposed
- id: A5
  direction: A
  claim: Repair-only re-prompting (vs n_retries=3 full re-run) on malformed worker output cuts wasted tokens without
    lowering completion.
  legacy_design:
    mechanism: A malformed parse currently re-runs the entire worker (all reads/tool calls). Instead feed back
      just the parse error and ask for a corrected structured object — the expensive reasoning already happened.
    test: Force-induce malformed outputs (small model, complex fixture); compare tokens-per-recovery and final
      completion rate, retries 3→1+repair.
    decision_rule: Confirm if recovery tokens drop sharply and completion rate is equal; especially measure on
      the smallest model (mission tie-in).
    metrics:
    - TOOL_CALL count per subtask; RUN_SUMMARY by attempt; completion rate
  legacy_evidence:
    status: not_recorded
  source_anchor: A5
  v2_status: proposed
- id: A6
  direction: A
  claim: 'Elide-to-handle: prune old tool results to just their id/handle (e.g. an HTTP request_id ) so the agent
    recalls the body by lookup only when needed — cutting the exploit loop''s accumulated context.'
  legacy_design:
    mechanism: 'A FunctionResultsRemovalCallback variant: instead of replacing a stale result with {elided:true}
      , keep a compact stub carrying the handle ( {request_id, method, path, status} for http_request ; {artifact_key,
      exit_code} for run_python ) plus a "recall via http_read_body / http_history(request_id) " hint. Register
      it for http_request + code-exec (not in today''s DEFAULT_HEAVY_TOOLS ). Safe for the exploit agent : the
      proof chain is rebuilt deterministically from Caido by tag at the end ( collect_http_chain ), not from prompt
      context — so eliding in-context bodies loses no evidence, and the recall path already exists.'
    test: Exploit/verdict eval + XBOW subset, elide-to-handle on/off; input tokens, capture/verdict accuracy,
      recall-lookups vs redundant re-probes.
    decision_rule: Confirm input tokens drop materially with capture/verdict held; kill if the agent loses track
      and re-probes redundantly (spike in duplicate probes).
    metrics:
    - exploit-agent input tokens; capture/verdict accuracy; recall-lookups vs duplicate re-probes
    additional:
      whats_needed: (1) extend the callback with an elide-to-handle strategy that extracts the id before stubbing;
        (2) register it on the exploit agent's HTTP/code-exec tools; (3) ensure a by-id lookup tool is exposed
        (mostly present). Ties A4 (read cache) and AG2 (offload-to-handle).
  legacy_evidence:
    status: not_recorded
  source_anchor: A6
  v2_status: proposed
- id: B1
  direction: B
  claim: Activating the shannon trace prompt raises detection recall ≥10% at equal precision vs v7 .
  legacy_design:
    mechanism: Coverage-ledger + sink-slot/sanitizer reasoning forces the model to account for every sink rather
      than stopping at the first finding.
    test: CONTRACTOR_EVAL_TRACE_PROMPT_VERSION=shannon vs v7 on the 4 trace-task fixtures + 24 detection fixtures,
      pass@5.
    decision_rule: Confirm if recall +10% and precision flat; kill if precision drops (more FPs) — note this lands
      on the same anti-overfit constraint as B4.
    metrics:
    - trace_vuln_scoring / scoring.score_vuln_findings → micro P/R/F1
  legacy_evidence:
    status: tested_inconclusive
    note: The Shannon prompt was directionally positive but within noise and was superseded by the converge prompt.
  source_anchor: B1
  v2_status: proposed
- id: B2
  direction: B
  claim: A structured finding schema (first-class cwe , sink_kind , entry_point , data_flow ) improves post-dedup
    precision and stops overwrite loss.
  legacy_design:
    mechanism: Replace free-text details parsing with typed fields; dedup/merge on structured keys instead of
      "CWE-" string-split; key reports so competing findings for one slug don't silently overwrite.
    test: Run vuln-scan-fast on fixtures known to surface duplicate/contradictory findings; count merge errors
      and lost findings before/after.
    decision_rule: Confirm if duplicate/overwrite incidents → ~0 and precision rises with recall held.
    metrics:
    - count of dedup mis-merges; scoring precision; report overwrite events
  legacy_evidence:
    status: not_recorded
  source_anchor: B2
  v2_status: proposed
- id: B3
  direction: B
  claim: A second independent trace pass + programmatic union/dedup raises recall ≥X% — i.e. single-pass is the
    binding constraint.
  legacy_design:
    mechanism: Re-run the per-operation trace with a different seed/lens, union findings, dedup structurally.
      Tests whether misses are stochastic (recoverable by re-roll) or systematic.
    test: 1-pass vs 2-pass vs 3-pass on 24 detection fixtures; plot recall vs token cost.
    decision_rule: Confirm if recall climbs with passes (stochastic misses) → motivates iteration; flat means
      misses are systematic → invest in B1/E instead. Either way it's decisive.
    metrics:
    - recall@passes; cost = sum RUN_SUMMARY.total_tokens
  legacy_evidence:
    status: not_recorded
  source_anchor: B3
  v2_status: proposed
- id: B4
  direction: B
  claim: Replacing codereview v3 's hardcoded patterns with general source/sink methodology holds recall on seen
    fixtures while raising it on held-out fixtures.
  legacy_design:
    mechanism: 'The overfit hypothesis: literal grep/WordPress patterns inflate seen-fixture recall but generalize
      poorly. A methodology-first prompt should transfer.'
    test: Wire the unused eyeballvul / full Real-Vuln-Benchmark corpora as held-out fixtures (Direction F3); compare
      seen vs held-out recall for v3 vs methodology prompt.
    decision_rule: Confirm if held-out recall rises for the methodology prompt with seen-recall flat. Falls back
      to the repo's anti-overfit principle.
    metrics:
    - recall on seen vs held-out fixture splits
  legacy_evidence:
    status: not_recorded
  source_anchor: B4
  v2_status: proposed
- id: B5
  direction: B
  claim: A SAST pre-pass (semgrep) seeding candidate sinks lets a 27b model match a 70b baseline's recall.
  legacy_design:
    mechanism: Run semgrep, feed ranked candidate sinks to the trace/scan agent as leads. Offloads pattern-recall
      (where small models are weakest) to a deterministic engine. Mission-central (also E1).
    test: '2×2: {27b, 70b} × {with semgrep, without} on 24 detection fixtures.'
    decision_rule: Confirm if (27b + semgrep) recall ≥ (70b baseline) recall, at lower or equal cost. Kill if
      FP rate from semgrep noise tanks precision.
    metrics:
    - F1 by (model × semgrep) cell; precision delta
  legacy_evidence:
    status: not_recorded
  source_anchor: B5
  v2_status: proposed
- id: C1
  direction: C
  claim: Requiring a request-id-backed proof chain (not self-asserted strings) reveals the true exploitation rate.
  legacy_design:
    mechanism: Tighten score_exploitability_run "evidence present" to require ≥1 cited request_id in the Caido
      chain, not just a non-empty summary.
    test: Re-score existing exploitability runs under old vs new evidence rule.
    decision_rule: 'This is a measurement correction: the gap between old and new pass rate is the result — it
      quantifies how much "exploitable" is currently unproven.'
    metrics:
    - verdict eval evidence_rate; pass-rate delta under strict rule
  legacy_evidence:
    status: not_recorded
  source_anchor: C1
  v2_status: proposed
- id: C2
  direction: C
  claim: Granting the exploit agent read-only code access raises verdict accuracy on sparse-seed findings.
  legacy_design:
    mechanism: When seed details omit the endpoint/param, the "do NOT read code" rule strands the agent. Allow
      targeted reads to recover the entry point.
    test: Verdict eval on fixtures with deliberately thin seeds, code-access on/off.
    decision_rule: Confirm if verdict accuracy rises on thin seeds with no precision loss on rich seeds; kill
      if it induces code-trusting (verdicts not backed by a probe).
    metrics:
    - verdict match rate by seed-richness bucket; evidence_rate
  legacy_evidence:
    status: not_recorded
  source_anchor: C2
  v2_status: proposed
- id: C3
  direction: C
  claim: One fused static+dynamic verifier beats the two split agents on verdict accuracy.
  legacy_design:
    mechanism: A single agent that both traces code (entry→sink) and fires HTTP probes can corroborate path-exists
      with payload-fires; the split design loses that join.
    test: Fused agent vs (trace-verify → exploit) chain on the exploitability fixtures + XBOW subset.
    decision_rule: Confirm if verdict accuracy / capture rate rises at equal-or-lower token cost.
    metrics:
    - capture rate (XBOW), verdict match (exploitability), total tokens
  legacy_evidence:
    status: not_recorded
  source_anchor: C3
  v2_status: proposed
- id: C4
  direction: C
  claim: XBEN-010 is solvable with an XSS execution oracle, not more time.
  legacy_design:
    mechanism: The holdout is XSS; HTTP-only probing has no DOM/JS execution oracle, so the agent loops without
      a success signal. Add a headless-browser oracle.
    test: Re-run XBEN-010 with the oracle, same 900s budget.
    decision_rule: Confirm if it captures within budget; kill (it's a budget/reasoning problem) if it still times
      out — which itself redirects effort.
    metrics:
    - flag_captured for XBEN-010; llm calls / time to capture
  legacy_evidence:
    status: not_recorded
  source_anchor: C4
  v2_status: proposed
- id: C5
  direction: C
  claim: Per-finding exploit budgets (derived from metrics) cut XBOW total tokens without losing captures.
  legacy_design:
    mechanism: Captures span ~26→128 llm calls; a flat budget over-spends on easy cases and under-spends on hard
      ones. Class-aware budgets reallocate.
    test: Flat vs class-aware budget on the 15-ID XBOW set; track captures and total tokens.
    decision_rule: Confirm if total tokens drop with captures held at 14/15.
    metrics:
    - sum input/output tokens; capture count
  legacy_evidence:
    status: not_recorded
  source_anchor: C5
  v2_status: proposed
- id: C6
  direction: C
  claim: 'Bypass-exhaustion gate: require N distinct failed bypasses before any not_exploitable verdict — make
    the verifier earn a negative.'
  legacy_design:
    mechanism: '[comparative: Shannon] Distinguish "control withstood ≥8–10 real bypass attempts" (true FP) from
      "blocked by an external operational constraint" (still potential). An explicit attempt counter on the negative
      verdict.'
    test: Verdict eval; false-negative rate (real bugs wrongly called not-exploitable) with/without the gate.
    decision_rule: Confirm if FN drops; suits small LLMs as an explicit counter/checklist rather than a holistic
      judgement.
    metrics:
    - false-negative rate on exploitable fixtures; bypasses logged
  legacy_evidence:
    status: not_recorded
  source_anchor: C6
  v2_status: proposed
- id: D1
  direction: D
  claim: The four trace workflows collapse into one parametrized workflow with no eval regression.
  legacy_design:
    mechanism: 'One trace workflow with flags {driver: planner|direct, graph: on|off, path_parallel: on|off} .
      The variants become config presets.'
    test: Run trace-task + 24 detection fixtures + XBOW subset on old variants vs the unified workflow's equivalent
      presets.
    decision_rule: Confirm if all metrics stay within pass@5 noise and net LOC drops materially; kill if any preset
      regresses.
    metrics:
    - F1 / capture parity; LOC removed (git diff stat)
  legacy_evidence:
    status: not_recorded
  source_anchor: D1
  v2_status: proposed
- id: D2
  direction: D
  claim: Dropping the planner for iterations=1, max_attempts≤2 tasks (uniform AgentRunner) cuts LLM calls at equal
    completion.
  legacy_design:
    mechanism: For single-iteration tasks the planner's add/execute/finish loop is overhead — the direct trace
      variants already prove the worker runs fine without it.
    test: Pick such tasks; run planner vs AgentRunner; compare llm_calls, tokens, completion, recall.
    decision_rule: Confirm if llm_calls/tokens drop with equal completion + recall.
    metrics:
    - RUN_SUMMARY.llm_calls / total_tokens; completion + recall
  legacy_evidence:
    status: not_recorded
  source_anchor: D2
  v2_status: proposed
- id: D3
  direction: D
  claim: Unifying the vuln namespace eliminates the verify/pathpar coupling bug class.
  legacy_design:
    mechanism: 'Replace hardcoded trace-annotation: reads with the shared namespace constant so trace-verify consumes
      any trace engine''s output.'
    test: Run trace-graph-pathpar → trace-verify end-to-end (currently broken).
    decision_rule: 'Binary: verify successfully reads pathpar findings. Regression test added.'
    metrics:
    - verify reads N>0 findings from pathpar output
  legacy_evidence:
    status: confirmed_fixed
    note: The predicted namespace-coupling failure was found in the old production path and fixed.
  source_anchor: D3
  v2_status: proposed
- id: D4
  direction: D
  claim: Dropping the records artifact + separate summarizer call reduces tokens/code with no downstream breakage.
  legacy_design:
    mechanism: The summarizer re-bills the full records payload as input. If no task declares records as an upstream
      artifact, it's dead weight.
    test: Grep artifact-consumer declarations for /records ; if none, remove and re-run the full eval set.
    decision_rule: Confirm if no consumer references records and all eval metrics hold; tokens drop by the summarizer-call
      cost.
    metrics:
    - consumer grep count; total tokens; eval parity
  legacy_evidence:
    status: not_recorded
  source_anchor: D4
  v2_status: proposed
- id: D5
  direction: D
  claim: Pruning unwired agents / inactive prompts shrinks maintenance surface with zero eval impact.
  legacy_design:
    mechanism: Confirm via import graph that web_exploitability_agent / threat_model_agent /inactive prompt versions
      are unreferenced by registered workflows; archive or delete.
    test: Static import/registry analysis + full eval run before/after.
    decision_rule: Confirm if nothing in get_workflows() reaches them and eval is byte-identical; keep anything
      an eval or workflow touches.
    metrics:
    - import-graph reachability; eval envelope diff (must be empty)
  legacy_evidence:
    status: not_recorded
  source_anchor: D5
  v2_status: proposed
- id: E1
  direction: E
  claim: Each unit of reasoning offloaded to a deterministic tool narrows the 27b↔70b recall gap.
  legacy_design:
    mechanism: General form of B5. Add deterministic leads (semgrep sinks, dataflow edges, handler-control diff)
      and measure the gap as a function of how much reasoning is offloaded.
    test: 2×2 {27b,70b} × {baseline, +tool} per offload tool; plot the gap.
    decision_rule: Confirm if the small-model uplift > large-model uplift for each tool (gap narrows). A tool
      that helps both equally is "nice" but off-mission.
    metrics:
    - recall(70b) − recall(27b), before vs after each tool
  legacy_evidence:
    status: not_recorded
  source_anchor: E1
  v2_status: proposed
- id: E2
  direction: E
  claim: Forced structured-output schemas cut small-model format failure more than large-model.
  legacy_design:
    mechanism: Small models drift from output schemas, inflating malformed / incomplete subtasks (→ wasted n_retries
      ). Tighter schema + forced tool calls should disproportionately help them.
    test: Measure malformed/incomplete subtask rate by model size, schema-strict on/off.
    decision_rule: Confirm if small-model malformed rate drops more than large-model's; ties to A5 (retry cost).
    metrics:
    - subtask status distribution (malformed/incomplete) by model
  legacy_evidence:
    status: not_recorded
  source_anchor: E2
  v2_status: proposed
- id: E3
  direction: E
  claim: An "attack-surface + control-diff" tool lets small models do absence-detection they currently miss.
  legacy_design:
    mechanism: Absence-detection (missing authz on one sibling handler) needs the model to hold all handlers +
      their guards in working memory — exactly where small models fail. A tool that enumerates handlers and diffs
      their controls does the bookkeeping. ( attack_surface lists entrypoints but doesn't diff guards.)
    test: BOLA/missing-authz fixtures (crapi, vampi), tool on/off, both model sizes.
    decision_rule: Confirm if small-model BOLA recall rises toward large-model with the tool.
    metrics:
    - recall on BOLA/BFLA/missing-authz cases by model
  legacy_evidence:
    status: not_recorded
  source_anchor: E3
  v2_status: proposed
- id: E4
  direction: E
  claim: A payload/PoC library exposed as a tool beats payloads-as-prose for small-model exploit success.
  legacy_design:
    mechanism: Retrieval beats free-recall for small models. Move per-class payloads from skill prose into a queryable
      tool the exploit agent calls by class.
    test: Exploitability + XBOW subset, payload-tool vs prose, both model sizes.
    decision_rule: Confirm if small-model capture/verdict accuracy rises; kill if no delta (prose recall was sufficient).
    metrics:
    - capture rate / verdict accuracy by model
  legacy_evidence:
    status: not_recorded
  source_anchor: E4
  v2_status: proposed
- id: E5
