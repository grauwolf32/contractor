  legacy_design:
    mechanism: Sweep the matcher tolerances — LINE_TOLERANCE ∈ {0,10,25,∞} , exact-CWE vs CWE-family, exact-file
      vs file∨caller — and re-score. Audit acceptable_cwes / acceptable_locations coverage the way AP audits the
      vuln set itself.
    test: Re-score existing envelope history under the tolerance grid; no new model calls.
    decision_rule: A ranking that flips within the plausible tolerance range is scorer-driven , not capability-driven
      — freeze one canonical tolerance and report the band. This is distinct from AP (which promotes real FPs
      into GT); AR2 is about the matcher wrongly rejecting true TPs.
    metrics:
    - rank stability vs tolerance; per-fixture P/R sensitivity; tolerance-set coverage rate
  legacy_evidence:
    status: not_recorded
  source_anchor: AR2
  v2_status: proposed
- id: AR3
  direction: AR
  claim: Multiplicity discipline (pre-registration + FDR across each A/B batch) separates real discoveries from
    the ~10 expected by chance.
  legacy_design:
    mechanism: Fix N + threshold before each run (already gestured at in the planner-variants "Method"); apply
      Benjamini–Hochberg FDR across each batch of comparisons.
    test: Apply FDR to the already-run A/B corpus; count how many "wins" survive q=0.1.
    decision_rule: The surviving set is the trustworthy roadmap; the culled set returns to "needs pass@N." Pairs
      with Z2 (variance reduction lets more effects clear) and F1 (pass@≥5).
    metrics:
    - '# surviving discoveries at FDR q=0.1 vs raw p<0.05'
  legacy_evidence:
    status: not_recorded
  source_anchor: AR3
  v2_status: proposed
- id: AS1
  direction: AS
  claim: 'Perturbation-sensitivity: semantic-preserving renames/relocations that leave a deriving model ~invariant
    collapse a memorizing one — the honest benchmark is the perturbed fixture.'
  legacy_design:
    mechanism: Mechanically rename endpoints/params/vars/files and relocate handlers within a fixture (behavior-preserving),
      then re-score. Derivation is ~invariant; recall-of-writeups collapses.
    test: Original vs perturbed crapi/vampi/cvebench; Δrecall by fixture, both model sizes.
    decision_rule: Small Δ ⇒ derivation (trustworthy); large Δ ⇒ memorization (discount that fixture's recall
      and re-weight the aggregate). Either way the perturbed set becomes the honest benchmark — and a cheap, unlimited
      one.
    metrics:
    - recall(original) − recall(perturbed) per fixture × model size
  legacy_evidence:
    status: not_recorded
  source_anchor: AS1
  v2_status: proposed
- id: AS2
  direction: AS
  claim: 'Public-vs-fresh gap: recall on never-published fixtures of matched difficulty quantifies the contamination
    tax and re-baselines the memo''s recall figures toward what an adopter will see.'
  legacy_design:
    mechanism: Author (or via P self-play) a small set of never-published fixtures in the same frameworks/classes;
      compare recall to public fixtures matched on class × framework × LoC.
    test: public vs fresh, matched difficulty, both model sizes.
    decision_rule: A large public≫fresh gap is the contamination tax; the memo's headline recall numbers should
      be read at the fresh level, not the public one. Ties P (self-play as the fresh-fixture generator) and F3
      (held-out splits).
    metrics:
    - recall(public) − recall(fresh), matched
  legacy_evidence:
    status: not_recorded
  source_anchor: AS2
  v2_status: proposed
- id: AS3
  direction: AS
  claim: 'The mission trap: part of the measured 27b↔70b gap may be memorization, not reasoning — so the target
    should be the perturbed gap, not the raw one.'
  legacy_design:
    mechanism: Larger models memorize more of the public corpus; if their advantage on public fixtures is partly
      recall-of-writeups, "close the gap" is partly chasing a number the adopter's private code won't reward.
    test: AS1's perturbation-Δ, stratified by model size.
    decision_rule: If Δ(70b) > Δ(27b) (the bigger model drops more under perturbation), the raw gap overstates
      the capability deficit; redefine the mission metric as the perturbed 27b↔70b gap. A profound correction
      to the whole E/G/H/L asymmetry axis if it holds.
    metrics:
    - perturbation-Δ by model size; perturbed-gap vs raw-gap
  legacy_evidence:
    status: not_recorded
  source_anchor: AS3
  v2_status: proposed
- id: AT1
  direction: AT
  claim: Per-FN cause attribution (coverage / reasoning / scoring / retention) as an envelope histogram tells
    you which direction each fixture's misses actually demand.
  legacy_design:
    mechanism: For each ground-truth vuln missed, classify by the join of (was its file in the observed read-set?)
      × (did any stage emit a matching finding pre-filter?) × (matcher tolerance, AR2). Emit an FN-cause histogram
      per fixture into the eval/v1 envelope.
    test: Backfill over recent runs — uses stored AC observations + records, no new model calls.
    decision_rule: 'Decisive routing: coverage-dominated misses → W6/U ordering & AM min_iter; reasoning misses
      → E/H/skills; scoring misses → AR2; retention misses → AN. Pass = the memo''s biggest open question ("why
      does recall collapse on large targets?") gets a per-cause answer for free.'
    metrics:
    - FN-cause distribution per fixture; per-cause share of total miss
  legacy_evidence:
    status: not_recorded
  source_anchor: AT1
  v2_status: proposed
- id: AU1
  direction: AU
  claim: 'Wall-clock, not tokens — and output is co-equal, not 1/47th: decode dominates GPU-seconds, and post-caching
    it dominates outright, partially reversing AG4.'
  legacy_design:
    mechanism: Measure prefill-tok/s and decode-tok/s on the real stack; convert every token figure to GPU-seconds.
      Because decode is ~10–50× slower per token, the 47:1 token ratio is ~1:1 in wall-clock — and once A1/E5
      prefix-caching makes repeated prefill ~free, output tokens dominate wall-clock outright , so generation-side
      reductions (terser reasoning, shorter records, D4's summarizer) may beat input compaction on the metric
      adopters feel.
    test: A-series/AG changes scored in tokens vs GPU-seconds; input-side vs output-side reductions on wall-clock
      at equal recall, pre- and post-caching.
    decision_rule: Confirm the input:output wall-clock ratio ≪ 47:1 and that post-cache the leverage shifts output-side
      — redirecting where A/AG effort goes. Kills AG4's premise if it holds only in tokens.
    metrics:
    - GPU-seconds/run; prefill:decode tok/s ratio; wall-clock Δ input-side vs output-side
  legacy_evidence:
    status: not_recorded
  source_anchor: AU1
  v2_status: proposed
- id: AU2
  direction: AU
  claim: 'Precision-weighted utility (triage cost): F1 under-values the C/K/L2 precision directions because the
    adopter pays per finding reviewed, not per F1 point.'
  legacy_design:
    mechanism: Add a triage-cost metric — Fβ with β<1, or a fixed findings-to-review budget — and show F1-ranked
      configs diverge from utility-ranked ones.
    test: Re-rank recent runs by Fβ<1 / cost-to-triage; compare to F1 ranking.
    decision_rule: If rankings diverge, precision-axis directions (C, K, L2, triage) are under-valued by F1; adopt
      a documented β. Ties AC6's precision/recall dial (the dial's setpoint should be chosen by adopter utility,
      not symmetric F1).
    metrics:
    - rank correlation F1 vs Fβ<1; findings-emitted per confirmed TP
  legacy_evidence:
    status: not_recorded
  source_anchor: AU2
  v2_status: proposed
- id: AU3
  direction: AU
  claim: Severity-weighted recall reorders rankings toward what an adopter cares about — a config strong on low-severity
    breadth but weak on criticals should not win.
  legacy_design:
    mechanism: Weight recall by CVSS/impact; complements S2 (chain-aware severity), which the scorer doesn't yet
      honor.
    test: Re-score with severity weights; re-rank.
    decision_rule: Confirm a breadth-strong/criticals-weak config drops under weighting — the adopter-relevant
      reorder. Kill if severity is uncorrelated with ranking (unlikely).
    metrics:
    - severity-weighted recall; ranking shift vs unweighted
  legacy_evidence:
    status: not_recorded
  source_anchor: AU3
  v2_status: proposed
- id: AV1
  direction: AV
  claim: 'Position/ordering bias (distinct from AH4 length): where a slice sits in the prompt changes recall at
    fixed length — a near-free lever via deterministic salience-ordering.'
  legacy_design:
    mechanism: Shuffle the order of injected files/skills/observations at fixed total length; measure recall variance
      attributable to position alone, by model size. Interacts with A1 (a stable prefix pins position) and AE
      (layer order).
    test: Order permutations at fixed length on trace + scan fixtures, both model sizes.
    decision_rule: If position-only variance is non-trivial (esp. on the 27b), prompt assembly needs a deterministic
      salience-ordering rule (most-suspect slice first/last) and AC/AE injection order becomes a tunable — a near-free
      recall lever. Kill if recall is position-invariant.
    metrics:
    - recall σ from ordering permutations × model size; ties A1 prefix-stability
  legacy_evidence:
    status: not_recorded
  source_anchor: AV1
  v2_status: proposed
- id: AV2
  direction: AV
  claim: 'Scaling-cliff characterization: is recall degradation smooth (budget-fixable) or a cliff (needs decomposition)?
    — the curve AM1''s law presupposes.'
  legacy_design:
    mechanism: 'Plot recall/precision/tokens vs target size (LoC, #files, #endpoints, call-graph size) across
      small→large fixtures plus synthetic size sweeps (concatenate/prune a fixture). Decompose the drop via AT1
      (coverage vs reasoning).'
    test: Recall(size) curve + knee detection; which sub-metric drives the drop.
    decision_rule: Fit the curve; a cliff localizes to a mechanism — context ceiling → W/AH4; coverage → U/W6;
      convergence → AF. Feeds AM1 with data instead of the "large projects need more" heuristic. Pass = min_iter
      auto-sizing (AM2) gets a real scaling law.
    metrics:
    - recall(size); knee location; AT1 cause-share at each size bucket
  legacy_evidence:
    status: not_recorded
  source_anchor: AV2
  v2_status: proposed
- id: AW1
  direction: AW
  claim: 'Tool-success-conditioned recall exposes a hidden capability ceiling: runs with incomplete or ambiguous
    tool results account for a disproportionate share of false negatives.'
  legacy_design:
    mechanism: Add a per-call outcome taxonomy ( complete , partial , empty-valid , empty-ambiguous , error )
      and join it to AT1's per-FN cause attribution. This separates model reasoning misses from evidence the model
      never received.
    test: Backfill tool events where possible, then instrument paired eval runs. Compare FN rate for paths touched
      by complete calls versus partial/ambiguous calls, controlling for fixture and model.
    decision_rule: Confirm if partial/ambiguous calls have materially higher FN odds and explain a non-trivial
      share of misses. Kill as a priority if the share is negligible after current fixes.
    metrics:
    - FN odds ratio by tool outcome; share of FNs preceded by partial/ambiguous evidence; recall conditioned on
      complete evidence
