- id: AE5
  direction: AE
  claim: 'Placement-by-access-frequency minimizes tokens at equal quality: frequently-needed → resident; occasionally-needed
    → lazy.'
  legacy_design:
    mechanism: 'Formalize the routing as a cost model: knowledge needed on most turns is cheapest resident (or
