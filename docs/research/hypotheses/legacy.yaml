- id: AC1
  direction: AC
  claim: 'Grounding generalizes: any deterministic check that contradicts the worker''s self-report suppresses
    hallucination — file_paths is one instance of many.'
  legacy_design:
    mechanism: '"Reported a finding in file X but never read X" is a contradiction the system can detect deterministically
      and act on. Enumerate such checks (place-vs-read, sink-vs-trace, endpoint-vs-source) and feed them back.'
    test: Add contradiction checks beyond paths; measure FP reduction on the trace fixtures.
    decision_rule: Confirm if additional contradiction signals each cut FP the way paths did, at flat cost.
    metrics:
    - vuln FP; F1; tool cost
  legacy_evidence:
    status: not_recorded
  source_anchor: AC1
  v2_status: proposed
- id: AC2
  direction: AC
  claim: 'An emitted-vs-observed cross-check kills hallucinated artifacts (the oas_build CRUD hallucinations:
    GET /notes , PUT /users/{id} absent from source).'
  legacy_design:
    mechanism: Flag any emitted endpoint/finding whose place was never present in an observed (read) file — the
