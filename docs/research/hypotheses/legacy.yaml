- id: AE3
  direction: AE
  claim: Fine-grained, lazily-pulled skills beat monolithic bundles for small LLMs — validate the design divergence.
  legacy_design:
    mechanism: Index + small references read on demand lets the model load only the relevant slice, fitting the
