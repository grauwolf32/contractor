- id: AW2
  direction: AW
  claim: Failing closed on ambiguous empty results (with one bounded retry or alternate query) raises recall more
    cheaply than adding another model iteration.
  legacy_design:
    mechanism: An empty glob, missing artifact, zero-finding namespace, or truncated search becomes a typed diagnostic
      rather than ordinary data. The runner retries once with a validated fallback, then surfaces the unresolved
      gap to the agent and envelope.
    test: Fault-inject empty/partial responses into file search, artifact load, graph lookup, and finding retrieval;
      compare silent-empty baseline, typed retry, and one extra model iteration at equal token budget.
    decision_rule: Confirm if typed retry recovers more ground-truth evidence and avoids false-success runs at
      lower cost than model re-execution. Kill individual retries whose false-alarm rate or cost exceeds their
      recovery.
    metrics:
    - evidence-recovery rate; false-success rate; recall recovered per 1k tokens; false-alarm rate
  legacy_evidence:
    status: not_recorded
  source_anchor: AW2
  v2_status: proposed
- id: AW3
  direction: AW
  claim: A backend-conformance corpus makes local, overlay, and remote execution recall-equivalent; behavioral
    parity predicts end-to-end parity better than unit coverage does.
  legacy_design:
    mechanism: Replay one golden corpus of path, glob, encoding, truncation, artifact, and graph queries against
      every backend and compare normalized results. Gate releases on semantic parity, not merely each implementation's
      isolated tests.
    test: Run the same vuln fixtures on rooted-local, overlay, and remote snapshots after conformance; compare
      tool-result set equality first, then recall/F1.
    decision_rule: Confirm if eliminating contract deltas collapses the backend recall gap. Any remaining gap
      routes to model/context behavior rather than filesystem semantics.
    metrics:
    - cross-backend result-set Jaccard; contract violations per corpus; recall/F1 gap by backend
  legacy_evidence:
    status: not_recorded
  source_anchor: AW3
  v2_status: proposed
- id: AX1
  direction: AX
  claim: A capability-vs-complexity failure classifier improves recovery because the two classes require different
    interventions.
  legacy_design:
    mechanism: 'Classify a stuck subtask from deterministic signals: invalid/failed tool calls, missing capability
      and parse errors imply capability failure; long evidence-bearing paths, branching, and budget exhaustion
      imply complexity. Route the first to a typed tool/skill or command repair, the second to decomposition,
      search, or escalation.'
    test: Label recent failed runs, measure classifier accuracy, then A/B class-aware recovery against the current
      uniform retry on matched failures.
    decision_rule: Confirm if completion rises and wasted repeated actions fall at equal budget; kill if the classes
      cannot be predicted before the recovery decision.
    metrics:
    - failure-class accuracy; recovery rate by class; repeated-action tokens avoided
  legacy_evidence:
    status: not_recorded
  source_anchor: AX1
  v2_status: proposed
- id: AX2
  direction: AX
  claim: A calibrated remaining-difficulty estimate predicts whether a path needs 3 or 30 steps and improves abandon/continue
    decisions.
  legacy_design:
    mechanism: Estimate remaining depth from attack-tree depth, unresolved prerequisites, tool availability, evidence
      confidence, context load, and observed progress. Calibrate the estimate against actual remaining steps rather
      than trusting self-reported confidence.
    test: Replay completed and failed trajectories; predict remaining steps and eventual success at each decision
      point, then use the estimate in U/AL's scheduler.
    decision_rule: Confirm if estimates are calibrated enough to reduce premature abandonment and doomed-path
      overspend. Kill if a cheap structural baseline performs equally well.
    metrics:
    - remaining-step MAE; success calibration error; recall and tokens from difficulty-aware routing
  legacy_evidence:
    status: not_recorded
  source_anchor: AX2
  v2_status: proposed
- id: AX3
  direction: AX
  claim: An external evidence-guided attack tree beats prose plans by preserving alternatives and penalizing high-difficulty
    branches without corrupting state.
  legacy_design:
    mechanism: Store each hypothesis/path as a node with evidence, confidence, estimated difficulty, visits, and
      status; select with a UCB-style score over promise × exploration − difficulty. The model proposes actions,
      while code owns tree mutation and state.
    test: External tree vs current flat plan and AL7 best-first on multi-path exploit fixtures, with the same
      model and action budget.
    decision_rule: Confirm if it explores more distinct promising branches, resumes abandoned paths correctly,
      and improves capture at equal cost.
    metrics:
    - capture/recall@budget; productive branch coverage; state-corruption rate; path-switch regret
  legacy_evidence:
    status: not_recorded
  source_anchor: AX3
  v2_status: proposed
- id: AY1
  direction: AY
  claim: Recall and efficiency degrade as benign distractor density rises; the slope distinguishes robust search
    from benchmark cue-following.
  legacy_design:
    mechanism: Hold the vulnerable component fixed while adding secure sibling services, endpoints, and code modules.
      Measure whether attention and probes remain concentrated on evidence-bearing paths.
    test: Evaluate each fixture at 0/1/3/7 matched distractor components with fixed vulnerability and budget.
    decision_rule: Fit the degradation curve. A steep slope re-prioritizes U/AX search and invalidates isolated-target
      scores as deployment estimates; a flat slope validates the current scaffold.
    metrics:
    - recall and confirmed findings per token vs distractor count; irrelevant-tool-call share
  legacy_evidence:
    status: not_recorded
  source_anchor: AY1
  v2_status: proposed
- id: AY2
  direction: AY
  claim: Clean-target controls reveal prevalence-induced over-reporting that vulnerable-only benchmarks cannot
    measure.
  legacy_design:
    mechanism: Mix patched/secure twins into the benchmark without telling the agent which targets are positive.
      Score target-level specificity and calibration in addition to finding precision.
    test: Run a blinded mixture across vulnerability prevalence levels (50%, 10%, 1% via resampling) and require
      an evidence-backed no-finding outcome where appropriate.
    decision_rule: Confirm if precision or calibration collapses at realistic low prevalence. Promote only configurations
      whose utility remains positive after triage cost (AU2).
    metrics:
    - target-level specificity; false-positive targets per 100 clean targets; precision and expected triage cost
      by prevalence
  legacy_evidence:
    status: not_recorded
  source_anchor: AY2
  v2_status: proposed
- id: AY3
  direction: AY
  claim: 'Lifecycle handoff fidelity predicts real utility better than detection recall: finding → executable
    PoC → minimally safe patch → regression tests.'
  legacy_design:
    mechanism: Score each transition separately in a reproducible build sandbox. A finding only advances when
      its PoC reproduces; a patch only advances when it blocks the PoC and passes existing functionality tests.
    test: Add a small CyberGym-E2E-style track over existing reproducible fixtures; compare ranking by detection-only
      F1 versus end-to-end completion.
    decision_rule: Confirm if rankings change and identify the lossiest handoff. Keep detection-only eval for
      diagnosis, but use lifecycle completion for deployment claims.
    metrics:
    - stage retention; end-to-end completion; functionality-test pass rate; rank correlation with detection F1
  legacy_evidence:
    status: not_recorded
  source_anchor: AY3
  v2_status: proposed
