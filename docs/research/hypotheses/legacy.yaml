- id: AD2
  direction: AD
  claim: A specialized agent beats the generalist worker on its subtask only when the subtask is distinct enough
    — specialize where it wins, not everywhere.
  legacy_design:
    mechanism: A focused prompt helps small LLMs (narrower instruction surface), but every new agent is maintenance
      + the agent-proliferation the report warns about. Decide by measured subtask lift, not intuition.
    test: 'For each candidate (e.g. auth-discovery, hypothesis-gen): specialized agent vs generalist worker on
      the subtask, both model sizes.'
    decision_rule: Create the agent only where it beats the generalist on subtask quality (especially on the 27b);
      otherwise keep the generalist.
    metrics:
    - subtask success/quality, specialized vs generalist × model
  legacy_evidence:
    status: not_recorded
  source_anchor: AD2
  v2_status: proposed
- id: AD3
  direction: AD
  claim: Declarative composition (derive pipeline order from declared artifact deps, topologically) reproduces
    hand-coded pipelines at equal quality with far less code.
  legacy_design:
    mechanism: The artifact-dependency graph already determines order; make it the source of truth so a pipeline
      is data (a task list + deps) not a bespoke workflow.py . Collapses the proliferation D1/W2 target.
    test: Re-express ≥2 existing workflows declaratively; run the full eval set; compare metrics and LOC.
    decision_rule: Confirm if metrics stay within noise and net LOC drops materially; kill if the graph can't
      express a needed control flow.
    metrics:
    - 'eval parity; LOC removed; #workflows collapsed'
  legacy_evidence:
    status: not_recorded
  source_anchor: AD3
  v2_status: proposed
- id: AD4
  direction: AD
  claim: Target-aware auto-composition (select tasks by target type) matches or beats a fixed maximal pipeline
    at lower cost.
  legacy_design:
    mechanism: Detect target characteristics (HTTP API? deps/lockfiles? live URL?) and assemble only the relevant
      tasks — API → oas+trace+exploit; no-API → scan; has-deps → SCA (J); no-URL → skip exploit. Skips irrelevant
      work instead of running everything.
    test: Auto-composed vs fixed maximal pipeline across heterogeneous fixtures (API and non-API); recall vs tokens.
    decision_rule: Confirm if auto matches fixed recall at lower cost (no relevant task dropped); kill if the
