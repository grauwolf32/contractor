- id: AE4
  direction: AE
  claim: 'The task-prompt worker-context channel is high-leverage: task-specific grounding belongs there, not
    baked into the static agent prompt or a skill.'
  legacy_design:
    mechanism: Per-target facts (the endpoint under test, prior findings, deterministic observations from AC)
