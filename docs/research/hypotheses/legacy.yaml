    - hit-rate / recall, fusion vs OAS-only × model
  legacy_evidence:
    status: not_recorded
  source_anchor: AB5
  v2_status: proposed
- id: AB6
  direction: AB
  claim: Generate-then-critique (adversarial pruning before spending probe budget) raises end-to-end efficiency.
  legacy_design:
    mechanism: Over-generate, then a critic prunes low-prior / non-falsifiable hypotheses before the expensive
      verification stage spends probes (ties L2 adversarial verify, U budget).
    test: With/without critique stage; confirmed findings per probe and per token.
    decision_rule: Confirm efficiency rises (fewer wasted probes) without recall loss.
    metrics:
    - confirmed/probe; confirmed/token; recall
  legacy_evidence:
    status: not_recorded
  source_anchor: AB6
  v2_status: proposed
- id: AB7
  direction: AB
  claim: Hypothesis-as-typed-artifact (probe + oracle + prior + falsification criterion) stored in the leads pool
