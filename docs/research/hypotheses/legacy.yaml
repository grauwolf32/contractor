- id: AC7
  direction: AC
  claim: Tool arguments (not just counts/paths) as observations sharpen coverage-gap and ungrounded-claim detection
    — but risk the errors-arm failure mode.
  legacy_design:
    mechanism: 'Project what the worker actually searched/probed: grep patterns, resolved symbols, HTTP params/payloads,
      edits. The planner can then see gaps ("grepped SQLi sinks, never SSRF") and contradictions ("claimed SQLi
      but no arg matched a query sink" — extends AC1). The honest risk: like include_tool_errors , the extra text
      may add noise/FP and tokens rather than signal.'
    test: Add a tool-args arm vs lean and lean+paths; vuln F1 / FP / recall + tokens, on the trace + scan fixtures.
    decision_rule: Keep only if it adds recall or precision per token; drop if neutral-to-negative, exactly as
      errors/memories were dropped. The precedent says assume nothing.
    metrics:
    - vuln F1 / FP / recall; tokens — args arm vs lean / lean+paths
  legacy_evidence:
    status: not_recorded
  source_anchor: AC7
  v2_status: proposed
- id: AC8
  direction: AC
  claim: Task-relevance scoping of observations beats projecting everything — the "relevant for tasks" control
    is what keeps args from becoming noise.
  legacy_design:
    mechanism: 'Which tool args matter is task-dependent: a trace task cares about read/grep/graph args; an exploit
      task about HTTP params/payloads; an oas task about endpoints emitted vs files read. Project only the task-relevant
      slice (ties AA''s task axis + the per-task skills: /config pattern) instead of all args — controlling the
      token/noise blowup that sank the errors arm.'
    test: Three arms — counts-only (current lean) vs all-args vs task-scoped-args — measured as F1 per token across
      task types.
    decision_rule: Confirm if task-scoped args dominate all-args on F1-per-token (signal without the noise tax);
      if all-args already wins, scoping is unnecessary complexity.
    metrics:
    - vuln F1 per token by projection scope × task type
  legacy_evidence:
    status: not_recorded
  source_anchor: AC8
  v2_status: proposed
- id: AD1
  direction: AD
  claim: 'Task ablation maps which tasks earn their place: removing each task moves end-to-end recall/F1/cost
    measurably (or not).'
  legacy_design:
    mechanism: 'Systematically drop one task at a time from a pipeline (e.g. vuln-assess : SWE → OAS → lint →
      trace → exploit) and measure the end-to-end delta. A task whose removal doesn''t move metrics is dead weight
      (ties D).'
    test: Leave-one-out ablation over the pipeline's tasks on the eval fixtures.
    decision_rule: Produces a per-task value table (ΔF1, Δcost); keep high-value tasks, prune zero-value ones.
    metrics:
    - end-to-end ΔF1 / Δrecall / Δtokens per task removed
