- id: AC3
  direction: AC
  claim: Observations raise recall WITHOUT injecting run-to-run variance (deterministic, per Z) — unlike a learned/fuzzy
    feedback channel would.
  legacy_design:
    mechanism: The block is computed from recorded tool usage, not generated — so it's identical across repeats.
      Confirms observations are a safe lever for a hypothesis-driven roadmap.
    test: Repeat a fixed config; verify the injected observation block is byte-identical run-to-run; contrast
      variance with the off arm's intrinsic noise.
    decision_rule: Confirm the signal itself adds zero variance (the ±0.07 is model noise, not observation noise).
    metrics:
    - observation-block stability across repeats
  legacy_evidence:
    status: supported
    note: Legacy repeats reported an observation recall lift without additional run-to-run variance.
  source_anchor: AC3
  v2_status: proposed
- id: AC4
  direction: AC
  claim: 'It''s a small-LLM lever: the recall lift is replicated on 27b/35b at flat-or-lower cost, and may be
    larger for smaller models.'
  legacy_design:
    mechanism: Observations substitute for the working-memory a small model lacks ("you already looked here, found
