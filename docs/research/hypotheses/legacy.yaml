    bugs.'
  legacy_design:
    mechanism: Django-IDOR knowledge (queryset ownership, get_object_or_404 idioms) is more actionable than generic
      IDOR prose.
    test: Generic class skill vs framework×class cell, stratified by framework (crapi=Spring/Django, vampi=Flask…).
    decision_rule: Confirm if framework-cell recall > generic on that framework's fixtures.
