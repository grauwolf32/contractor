    - within-model recall lift by model size
  legacy_evidence:
    status: not_recorded
  source_anchor: AC4
  v2_status: proposed
- id: AC5
  direction: AC
  claim: More observation dimensions pay off — coverage gaps, graph-reachability, and malformed/retry signals
    (the malformed_only arm was 2nd-best at the cheapest cost).
  legacy_design:
    mechanism: 'The study tested tools/files/skills/memories. Untested deterministic signals: "these handlers
      were never visited" (coverage), "this sink is reachable but never traced" (graph), and the cheap malformed_only
      signal that already gave +0.062 F1.'
    test: Add each dimension as an arm; vuln F1 + cost vs lean.
