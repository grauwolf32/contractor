  v2_status: proposed
- id: AA5
  direction: AA
  claim: 'A skill-coverage matrix (axes × cells) makes gaps explicit and measurable: empty cells predict low recall
    on those framework×class combos.'
  legacy_design:
    mechanism: Lay skills on the framework×class grid; occupancy becomes a measurable surface. Filling a predicted-weak
      cell should raise exactly that combo's recall — turning coverage into a plannable, anti-overfit roadmap
      (general cells, not benchmark-specific patches).
    test: Correlate per-(framework×class) recall with cell occupancy; then fill the lowest-occupancy, highest-traffic
      cells and re-measure.
    decision_rule: Confirm if recall tracks occupancy and filling targeted cells lifts their combos without hurting
      others.
