<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contractor · Inbox · production</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#101216;color:#e4e6ea;font:12px/1.5 system-ui;padding:12px 16px}header{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}strong{margin-right:auto}label{display:flex;gap:6px;align-items:center}select{font:inherit;padding:5px 7px;color:inherit;background:#191d23;border:1px solid #343940;border-radius:6px}.frames{display:flex;gap:16px;align-items:flex-start;justify-content:center}.panel{min-width:0;flex:1}.panel>p{margin:0 0 6px;color:#b5bac3}.stage{position:relative;margin:auto}iframe{position:absolute;top:0;left:0;border:0;outline:1px solid #343940;transform-origin:top left}footer{margin-top:10px;color:#b5bac3}[hidden]{display:none!important}@media(max-width:850px){.frames{flex-direction:column}.panel{width:100%}}
</style><header><strong>Inbox · production</strong><label>View<select id="view"><option value="overview">Inbox / next task</option><option value="issue">HTTP issue</option><option value="sql">Source-code issue</option><option value="report">Ready report</option><option value="blocked">Model recovery</option><option value="ready">Run result</option><option value="running">Running check</option></select></label><label>State<select id="state"><option value="normal">Normal</option><option value="empty">Empty</option><option value="report-error">Report read failure</option><option value="report-pending">Report pending</option><option value="report-unavailable">No aggregate report</option><option value="partial">Partial queue read</option><option value="error">Queue read failure</option><option value="detail-error">Issue read failure</option></select></label><label>Theme<select id="theme"><option>light</option><option selected>dark</option><option>black</option></select></label><label>Width<select id="width"><option>1440</option><option>1100</option><option>390</option><option>320</option></select></label><label>Version<select id="version"><option value="new">Production Inbox</option><option value="issues">Issues reference</option><option value="reports">Reports reference</option></select></label></header><div class="frames"><section class="panel" id="first"><p>OpenDesign</p><div class="stage"><iframe title="Inbox preview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></div></section><section class="panel" id="second" hidden><p>Reports reference</p><div class="stage"><iframe title="Reports reference" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></div></section></div><footer>Actual production UI · approval-free Audits · synthetic data only. Full Issues and Reports readers; queue navigation and mobile Back. A completed check can have no aggregate report. All mutations are refused locally.</footer><script>
const fields=['view','state','theme','width','version'],p=new URLSearchParams(location.search);for(const id of fields){const e=document.getElementById(id);if([...e.options].some(o=>o.value===p.get(id)))e.value=p.get(id)}
function fit(){const w=Number(document.getElementById('width').value);for(const panel of document.querySelectorAll('.panel')){if(panel.hidden)continue;const frame=panel.querySelector('iframe'),stage=panel.querySelector('.stage'),scale=Math.min(1,panel.clientWidth/w);frame.style.width=w+'px';frame.style.height=Math.max(900,(innerHeight-145)/scale)+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=parseFloat(frame.style.height)*scale+'px'}}
function show(){const q=new URLSearchParams;for(const id of fields)q.set(id,document.getElementById(id).value);history.replaceState(null,'','?'+q);const compare=q.get('version')==='compare';document.getElementById('second').hidden=!compare;document.querySelector('#first>p').textContent=q.get('version')==='issues'?'Issues reference':q.get('version')==='reports'?'Reports reference':'Production Inbox';q.set('version',compare?'new':q.get('version'));document.querySelector('#first iframe').src='./current.html?'+q;q.set('version','reports');if(compare)document.querySelector('#second iframe').src='./current.html?'+q;fit()}for(const id of fields)document.getElementById(id).addEventListener('change',show);addEventListener('resize',fit);show();
</script></html>
