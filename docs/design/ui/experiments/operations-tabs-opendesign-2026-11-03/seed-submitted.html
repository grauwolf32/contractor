 * Colour, type and scale tokens for the light, dark and black themes
 * (docs/design/ui/themes.md). Every colour in the UI comes from these tokens,
 * and spacing, radii, font sizes and control heights come from the scale
 * (src/ui/README.md, "Style scale").
 *
 * Light is the base. src/app/theme.ts always sets data-theme="light|dark|
 * black": an explicit choice, or the system preference resolved to light or
 * dark and followed while it changes.
 */
:root {
  color-scheme: light;
  --font-sans:
    ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Spacing: a 4 px grid, --space-N = N x 0.25rem, with half steps. */
  --space-0-5: 0.125rem;
  --space-1: 0.25rem;
  --space-1-5: 0.375rem;
  --space-2: 0.5rem;
  --space-2-5: 0.625rem;
  --space-3: 0.75rem;
  --space-3-5: 0.875rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;

  /* Radii: chips and inputs, controls, cards, panes, pills. */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 12px;
  --radius-2xl: 14px;
  --radius-full: 999px;

  /* Font sizes: 11, 12, 13, 14, 16, 20 and 24 px. */
  --text-2xs: 0.6875rem;
  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-md: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;

  /* Control heights: xs, sm and md buttons; lg is the touch target. */
  --control-xs: 1.75rem;
  --control-sm: 2rem;
  --control-md: 2.375rem;
  --control-lg: 2.75rem;

  --background: #eceff3;
  --surface: #ffffff;
  --surface-subtle: #f4f6f9;
  --surface-raised: #f1f4f8;
  --surface-hover: #e9eef4;

  --primary: #1f2630;

  --success-line: #a7d3b6;
  --warning: #8a4a00;
  --warning-bg: #fbeed6;
  --warning-line: #e4c38a;
  --danger: #b3261e;

  --on-danger: #ffffff;
  --info: #1d4fbf;
  --info-bg: #e3eafb;
  --info-line: #b2c4ef;

  --code-ink: #24415f;
  --scrim: rgb(16 21 29 / 42%);
  --shadow-lg:
    0 24px 64px -20px rgb(16 21 29 / 35%), 0 2px 6px rgb(16 21 29 / 8%);
  --brand-bg: #050505;

  /*
   * V3B parts (src/ui): chrome for method chips and rail states, faint
   * secondary text, the selected-row tint with its bar and outline, code
   * blocks and highlighted lines, the rail count badge, and progress
   * segments (m-*). The selection tokens alias the accent family, so the
   * dark and black blocks only redefine the rest.
   */
  --chrome: #e3e8ee;
  --chrome-2: #d6dde6;
  --faint: #56606f;
  --sel: var(--accent-dark);
  --sel-bar: var(--accent);
  --sel-line: var(--accent-line);
  --code-bg: #f6f8fa;
  --code-hl: #e6eef7;
  --badge-bg: #10151d;
  --badge-ink: #ffffff;
  --m-idle: #cfd6e0;
  --m-partial: #c08600;
  --m-progress: #3f6fe0;
  --m-blocked: #a3221a;
  --m-done: #1f8a4c;

  --diff-add-bg: #e6f4ea;
  --diff-add-ink: #14532b;
  --diff-add-num-bg: #cfe9d7;
  --diff-add-num-ink: #17703a;
  --diff-del-bg: #fbe9e7;
  --diff-del-ink: #7f1a14;
  --diff-del-num-bg: #f5d0cc;
  --diff-del-num-ink: #a3221a;
  --diff-hunk-bg: #e8eefa;
  --diff-hunk-ink: #1d4fbf;
  --diff-hunk-num-bg: #d6e1f6;
  --diff-file-bg: #eef1f5;
  --diff-file-ink: #10151d;
  --diff-num-ink: #5f6a7a;
  --diff-num-line: #e3e7ed;
  --diff-add-count: #17703a;
  --diff-del-count: #b3261e;

  /* Evals: variant A is always blue, B always orange (S30:593-596). */
  --eval-a: #1f6fd1;
  --eval-b: #c25a00;
  --eval-b-stripe: #8a3f00;
  --chart-axis: #9aa5b4;
  /* GPU series: Okabe-Ito based; every series also has a named legend entry. */
  --gpu-1: #0072b2;
  --gpu-2: #b86e00;
  --gpu-3: #00805e;
  --gpu-4: #7d7200;
  --gpu-5: #b4447f;
  --gpu-6: #c24e00;
  --gpu-7: #5b4bc4;
  --gpu-8: #4b5566;
  --gpu-9: #004f7c;
  --gpu-10: #8a5200;
  --gpu-11: #005a42;
  --gpu-12: #5a5200;
  --gpu-13: #8a2e5f;
  --gpu-14: #933a00;
  --gpu-15: #3f3196;
  --gpu-16: #2f3744;
}

/*
 * First paint for a dark system preference, before src/app/theme.ts sets
 * data-theme (it resolves "system" to light or dark and follows changes).
 * The values repeat the dark block below; theme.test.ts keeps them equal.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --background: #0b0e13;
    --text: #e9edf3;
  }
}

/*
 * opendesign.css — Operations overview visual pass.
 * Overrides layered after the seed styles; every colour comes from the
 * existing theme tokens and both font families are the supplied ones.
 * Breakpoints follow the seed scale: 1100 / 820 / 640 / 480.
 */

/* Page frame: capped measure and a header band divider */
.workspace {
  max-width: 1280px;
  margin-inline: auto;
}
.page-head {
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--line);
}
.page-head h1 { letter-spacing: -.01em; }
.page-actions { gap: var(--space-2); }

/* Live-transport badge in the page actions */
.connection {
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
  background: var(--surface);
  font-weight: 500;
}
.connection svg { width: 14px; height: 14px; }
.connection[data-tone=success] {
  border-color: var(--success-line);
  background: var(--success-bg);
}
.connection[data-tone=warning] {
  border-color: var(--warning-line);
  background: var(--warning-bg);
}

/* Compact snapshot band: micro-labels, mono counts */
.glance { gap: var(--space-3); }
.glance-card {
  padding: var(--space-3) var(--space-4);
}
.glance-label {
  font-size: var(--text-2xs);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.glance-label svg { width: 14px; height: 14px; }
.glance-number {
  font: 500 var(--text-lg)/1.3 var(--font-mono);
  margin-top: var(--space-1);
}
.glance-card p { font-size: var(--text-xs); }
#mismatch-card[data-tone=warning] {
  border-color: var(--warning-line);
  background: var(--warning-bg);
}
#mismatch-card[data-tone=warning] .glance-number { color: var(--warning); }
#mismatch-card[data-tone=unknown] .glance-number { color: var(--muted); }

/* Slot distribution — the visual anchor */
.readiness { border-color: var(--line-strong); }
.slot-track {
  height: 1.25rem;
  gap: var(--space-0-5);
  margin: var(--space-4) 0;
  background: var(--sunken);
  border: 1px solid var(--line);
}
.slot-track span { min-width: var(--space-1-5); }
.slot-legend {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
  gap: var(--space-2) var(--space-3);
}
.slot-legend strong { font: 600 var(--text-xs)/1.4 var(--font-mono); }
.capacity-note {
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--line);
}

/* Needs inspection — clearly qualified items */
#inspection[data-tone=warning] { border-color: var(--warning-line); }
#inspection[data-tone=warning] .panel-head h2 { color: var(--warning); }
.inspection-item {
  margin-bottom: 0;
  padding: var(--space-2) 0;
  border-top: 1px solid var(--line);
}
.inspection-item:first-child { border-top: 0; padding-top: 0; }
.inspection-item a {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 500;
}
.inspection-item p { font-size: var(--text-xs); }
#inspection .details-link {
  display: inline-block;
  margin-top: var(--space-3);
}
.drain-note {
  padding-top: var(--space-3);
  border-top: 1px solid var(--line);
}

/* Section headers below the anchor panels */
.section-heading {
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--line);
}
.section-heading h2 {
  font-size: var(--text-md);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.section-heading a { white-space: nowrap; }

/* Labelled section navigation */
.ops-navigation summary { font-weight: 600; }
.ops-navigation a { transition: background 150ms ease; }
.ops-navigation a:hover { background: var(--surface-hover); }
.ops-navigation a[aria-current] { box-shadow: inset 2px 0 0 var(--sel-bar); }
.nav-group {
  margin: var(--space-4) var(--space-3) var(--space-1);
  padding-top: var(--space-3);
  border-top: 1px solid var(--line);
}

/* Sticky labelled nav card on wide screens */
@media (min-width: 821px) {
  .ops-navigation {
    position: sticky;
    top: var(--space-6);
    padding: var(--space-4);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--surface);
  }
}

/* Process and allocation rows — related but distinct */
.status-chip { font-weight: 500; }
.agent-row>summary,
.allocation-row>summary {
  padding: var(--space-3) var(--space-4);
  transition: background 150ms ease;
}
.agent-row>summary:hover,
.allocation-row>summary:hover { background: var(--row-hover); }
.row-open { transition: transform 150ms ease; }
details[open]>summary .row-open { transform: rotate(90deg); }
.agent-row[data-warning=true] .row-icon { color: var(--warning); }
.allocation-row .row-icon { color: var(--accent); }
.allocation-states .status-chip:last-child {
  background: transparent;
  border-color: currentColor;
}
.row-details {
  background: var(--surface-subtle);
  padding: var(--space-3) var(--space-4);
}
.row-details-title {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
}

/* Technical facts inside disclosures */
.fact-list { gap: 0; }
.fact-list>div {
  padding: var(--space-1-5) 0;
  border-bottom: 1px solid var(--line);
}
.fact-list>div:last-child { border-bottom: 0; }
.fact-list dt {
  font-size: var(--text-2xs);
  text-transform: uppercase;
  letter-spacing: .05em;
  align-self: center;
}

/* Empty and failed reads stay explicit */
.empty-copy {
  padding: var(--space-3);
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
}
#read-error { background: var(--danger-bg); }
#read-error h2 { color: var(--danger-ink); }

/* Footer links, diagnostics, copy buttons */
.shortcuts {
  border-top: 1px solid var(--line);
  padding-top: var(--space-4);
}
.diagnostics>summary:hover { color: var(--muted-strong); }
.icon-button { color: var(--muted); }
.icon-button:hover { color: var(--text); }

/* 1100 — narrower rail, tighter band */
@media (max-width: 1100px) {
  .ops-navigation { padding: var(--space-3); }
  .glance { gap: var(--space-2); }
}

/* 820 — nav folds into the labelled block; snapshot stacks */
@media (max-width: 820px) {
  .mobile-bar {
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .glance-number {
    grid-column: 2;
    grid-row: 1/3;
    margin: 0;
  }
  .agent-row,
  .allocation-row { scroll-margin-top: 3.5rem; }
}

/* 640 — stacked header, tighter rows */
@media (max-width: 640px) {
  .page-head {
    flex-direction: column;
    align-items: stretch;
  }
  .page-actions { justify-content: space-between; }
  .agent-row>summary,
  .allocation-row>summary { padding: var(--space-3); }
  .row-details { padding: var(--space-3); }
}

/* 480 — phones: restacked process rows, two-column legend */
@media (max-width: 480px) {
  .workspace { padding: var(--space-4) var(--space-3); }
  .glance-card { padding: var(--space-3); }
  .slot-track { height: 1rem; }
  .slot-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .agent-row>summary { grid-template-columns: minmax(0, 1fr) 18px; }
  .agent-row>summary>.row-state { grid-column: 1; grid-row: 2; justify-self: start; }
  .agent-row>summary>.row-context { grid-column: 1; grid-row: 3; }
  .agent-row>summary>.row-open { grid-column: 2; grid-row: 1; }
  .mobile-bar { padding: var(--space-2) var(--space-3); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .ops-navigation a,
  .agent-row>summary,
  .allocation-row>summary,
  .row-open { transition: none; }
}
</style>

function renderCompleted(){const rows=scenario==='empty'?[]:T.completed.filter(r=>filter==='all'||r.run.includes(filter));content.innerHTML=allocationTabs()+heading('Completed allocations','Terminal allocation records and the resources that were actually collected.',button('Refresh','refresh'),'Allocation history')+`<form id="history-filter" class="toolbar">${field('Run ID',input('runId',filter==='all'?'':filter,'text','placeholder="run-…"'))}<div class="button-row"><button type="submit">Apply filter</button>${button('Clear','clear-history')}</div></form>`+note('CPU and observed RSS peak cover the Runtime process, including service work. Subprocesses and sandbox containers are excluded.')+`<div class="inventory">${rows.map(r=>`<details class="inventory-entry">${summary(r.worker,r.id,chip(r.outcome)+chip(r.status),'history')}<div class="entry-meta"><span>${esc(r.run)}</span><span>${r.duration===undefined?'Duration not available':r.duration+' s'}</span><span>${r.cpu===undefined?'CPU not available':r.cpu+' CPU s'}</span><span>${r.rss===undefined?'RSS not available':r.rss+' MiB observed RSS peak'}</span></div><div class="entry-body">${facts([['Allocation',r.id],['Resource status',r.status],['Collection policy',r.status==='disabled'?'disabled':r.status==='unsupported'?'unsupported':'requested'],['Reason',r.reason??'None'],['Runtime process scope','Includes process service work; excludes subprocesses and containers'],['Duration',r.duration===undefined?'Not reported':r.duration+' s'],['CPU user + system',r.cpu===undefined?'Not reported':r.cpu+' s'],['Observed RSS peak',r.rss===undefined?'Not reported':r.rss+' MiB']])}<div class="entry-link">${a('Open Run →','/runs/'+r.run)}</div></div></details>`).join('')||empty('No matching terminal allocation','No owned record matches the selected Run. Missing reports are still included in history.')}</div>`+foot();}
function chart(type){const points=range==='15m'?T.performance.points:[];return points.length?`<div class="chart" role="img" aria-label="Synthetic ${type} samples over 15 minutes">${points.map(p=>`<span style="height:${Math.round((type==='CPU'?p.cpu/1.5:p.rss/300)*100)}%"></span>`).join('')}</div><div class="chart-labels"><span>11:45 UTC</span><span>12:00 UTC</span></div>`:'<div class="chart-gap">No demo samples for this range</div>'}
function renderPerformance(){const p=T.performance,unavailable=scenario==='empty',stale=scenario==='reconnecting';const state=unavailable?'unavailable':stale?'stale':'available',value=v=>unavailable?'—':v;
 content.innerHTML=heading('Performance','Server process, HTTP and database measurements. Execution telemetry is a separate source.',button('Refresh','refresh'))+`<div class="toolbar">${field('Time range',select('range',['15m','1h','6h','24h','7d']))}<span class="count-note">Snapshot ${T.at} · ${stale?'last observation; reconnecting':'synthetic measurements'}</span></div>`+(stale?note('Last snapshot shown. Measurements are stale while the preview is reconnecting.','warning'):'')+`<div class="metric-grid"><article class="metric"><header><h3>Server CPU</h3>${chip(state)}</header><strong class="metric-value">${value(p.cpu)} <small>cores</small></strong><p class="quiet">Process CPU consumption</p>${unavailable?'<div class="chart-gap">No measurement</div>':chart('CPU')}</article><article class="metric"><header><h3>Server memory</h3>${chip(state)}</header><strong class="metric-value">${value(p.rss)} <small>MiB RSS</small></strong><p class="quiet">${unavailable?'Heap unavailable':p.heap+' MiB live heap'}</p>${unavailable?'<div class="chart-gap">No measurement</div>':chart('RSS')}</article><article class="metric"><header><h3>HTTP</h3>${chip(state)}</header><strong class="metric-value">${value(p.requestRate)} <small>requests / s</small></strong>${facts([['Errors / s',value(p.errorRate)],['In flight',value(p.inFlight)],['p95 upper bound',unavailable?'Unavailable':'≤ 250 ms']])}<p class="quiet">Public and private surfaces combined.</p></article></div><div class="two-column"><section class="panel"><header class="panel-head"><h3>Database & connection pool</h3>${chip(state)}</header>${[['Pool acquired',value(p.pool.acquired)+' / '+value(p.pool.max)],['Pool idle',value(p.pool.idle)],['Active DB connections',value(p.database.active)],['Lock waiting',value(p.database.waiting)],['Longest transaction',value(p.database.longest)+' s'],['Database size',value(p.database.sizeGiB)+' GiB']].map(([k,v])=>`<div class="data-line"><span>${k}</span><strong>${v}</strong></div>`).join('')}<p class="quiet">Database statistics: 60 s · size: 5 min</p></section><section class="panel"><header class="panel-head"><h3>Host GPU</h3>${chip('unavailable')}</header><p class="quiet">No GPU observation in this fixture. Unknown utilization is not shown as zero.</p><div class="entry-link">${a('Completed allocation resources →','/operations/allocations/completed')}</div></section></div><details class="diagnostics"><summary>Collection scope & freshness</summary><div class="entry-body">${facts([['Server generation','performance-demo-1'],['Process / HTTP interval','15 seconds'],['History retention','7 days at minute granularity'],['Source','Synthetic, fixed samples; no live polling'],['Unavailable groups','No successful observation is represented by a dash']])}</div></details>`;
 content.querySelector('[name=range]').value=range;}
function renderConfiguration(){const configs=scenario==='empty'?[]:T.configs;content.innerHTML=heading('Runtime configuration','Published versions, label bindings and Runtime service credentials apply server-wide.',button('Publish RuntimeConfig','publish','primary'),'Execution defaults')+note('Publishing does not activate a version. A default or named label must point to its exact digest.')+`<div class="inventory">${configs.map(c=>`<details class="inventory-entry">${summary(c.name+'@'+c.version,c.source,c.bindings.length?c.bindings.map(l=>chip(l)).join(''):chip('Not bound'),'binding')}<div class="entry-meta"><span>${c.bindings.length?'Selected by '+c.bindings.join(', '):'Not selected by any label'}</span><span>${c.source==='built-in'?'Built-in version':'Published by demo-operator'}</span></div><div class="entry-body">${facts([['Name',c.name],['Version',c.version],['Digest',c.digest],['Bindings',c.bindings.join(', ')||'None']])}${button('Manage bindings','bindings:'+c.name)}<div class="entry-link">${a('Inspect exact version →','/operations/configuration/'+c.name+'/'+c.version+'?digest='+c.digest)}</div></div></details>`).join('')||empty('No published versions','Publish a RuntimeConfig, then select it through a label binding.')}</div><section class="panel"><header class="panel-head"><div><h3>Runtime service credentials</h3><p class="quiet">Adapter access · distinct from LLM gateway credentials</p></div>${button('Create credential','runtime-credential')}</header>${scenario==='empty'?empty('No Runtime credentials','Only metadata is retained in this preview.'): `<div class="data-line"><span>demo-telemetry</span><strong>OTLP headers</strong></div><div class="data-line"><span>demo-api-access</span><strong>HTTP target bearer token</strong></div><p class="quiet">Secret values are never displayed after creation.</p>`}</section>`;}
function renderLLM(){const kinds=[['model-policies','Model policies'],['llm-gateways','LLM gateways'],['agent-templates','Agent templates']],items=kind==='model-policies'?[['worker','Model behavior and execution safety limits'],['planner','Planning model policy']]:kind==='llm-gateways'?[['local-litellm','OpenAI protocol · credential manager: LiteLLM']]:[['source-reviewer','Python / ADK · source review'],['api-tracer','Python / ADK · API analysis']];content.innerHTML=heading('LLM configurations','Inspect published policies, request routes and Agent templates. New versions affect future selections only.','','Server-wide')+filters('Configuration kind',kinds,kind)+(kind==='agent-templates'?note('Agent templates are read-only here. Instructions, Skills and Workflow usage live in the Library.'):note('Inspect or clone an exact version. Publishing a clone does not select it for execution.'))+`<div class="inventory">${scenario==='empty'?empty('No published versions','No versions match the selected configuration kind.'):items.map(([name,desc])=>`<details class="inventory-entry">${summary(name+'@1',desc,chip('built-in'),'docs')}<div class="entry-meta"><span>sha256:11111111…1111</span></div><div class="entry-body">${facts([['Kind',kind],['Identity',name+'@1'],['Digest','sha256:'+'1'.repeat(64)],...(kind==='model-policies'?[['Model alias','Configured worker model'],['Context window','131072 tokens'],['Maximum output','8192 tokens'],['Maximum model calls','24'],['Maximum tool calls','80']]:kind==='llm-gateways'?[['Protocol','openai'],['Inference address','http://gateway.example.invalid/v1'],['Credential manager','LiteLLM']]:[['Worker runtime','adk@1'],['Instructions','Source analysis methodology'],['Toolsets','likec4@1']])])}<div class="button-row">${kind==='agent-templates'?a('Explore in Library →','/catalog/agents'):button('Clone as new version','clone:'+name)}</div></div></details>`).join('')}</div>`+foot();}
function credentialForm(){return `<form data-demo-form="LLM credential"><div class="form-grid">${field('Credential ID',input('credentialId','','text','required placeholder="review-budget"'))}${field('Label',input('label'))}${field('Managed LLM Gateway',select('gateway',['local-litellm@1']))}<fieldset class="field"><legend>Model policies</legend><label class="check-label"><input type="checkbox" checked> worker@1</label><label class="check-label"><input type="checkbox"> planner@1</label></fieldset>${field('Maximum budget (USD)',input('budget','','number','min="0" step="0.01"'))}${field('Budget duration',input('budgetDuration','','text','placeholder="30d"'))}${field('Tokens / minute',input('tpm','','number','min="1"'))}${field('Requests / minute',input('rpm','','number','min="1"'))}</div><div class="form-footer"><button type="submit" class="primary">Create active credential</button><span class="quiet">Demo only · no key will be created</span></div></form>`}
function renderCredentials(){content.innerHTML=heading('Managed LLM credentials','Gateway access, policy sets, budgets and observed usage.',button('Create LLM credential','llm-credential','primary'),'LLM gateway access')+note('Development tokens configured outside Contractor are not listed. Runtime service credentials are under Configuration; personal Git SSH keys are in Settings.')+`<div class="inventory">${scenario==='empty'?empty('No managed LLM credentials','Create a credential to manage gateway access and budgets.'):T.credentials.map(c=>`<details class="inventory-entry">${summary(c.label,c.id,chip('active'),'target')}<div class="entry-meta"><span>${c.gateway}</span><span>${c.policies.length} model polic${c.policies.length===1?'y':'ies'}</span><span>${c.spend===undefined?'Spend not observed':'$'+c.spend.toFixed(2)+' of $'+c.budget.toFixed(2)}</span></div>${c.spend===undefined?'':`<div class="entry-meta"><div class="progress-track" style="width:100%" role="img" aria-label="21.4 percent of demo budget observed"><span style="width:${c.spend/c.budget*100}%"></span></div></div>`}<div class="entry-body">${facts([['Credential ID',c.id],['Gateway',c.gateway],['Policy set',c.policies.join(', ')],['Spend',c.spend===undefined?'Not observed':'$'+c.spend.toFixed(2)],['Created','2026-11-03 12:00 UTC'],['Secret value','Never returned by this view']])}<div class="entry-link">${a('Inspect credential →','/operations/credentials/'+c.id)}</div></div></details>`).join('')}</div>`+foot()+`<div class="button-row">${a('Runtime service credentials →','/operations/configuration')}${a('Personal repository access →','/operations/settings#repository-access')}</div>`;}
const setting=(id,title,scope,desc,form)=>`<section class="settings-block" id="${id}"><div class="settings-copy"><h3>${title}</h3><p class="scope">${scope}</p><p>${desc}</p></div><div class="settings-form">${form}</div></section>`;
function renderSettings(){content.innerHTML=heading('Settings','Execution defaults, personal repository access and appearance.')+`<nav class="settings-directory" aria-label="Settings on this page">${a('Workflow scheduling','#workflow-scheduling')}${a('Models','#model-selection')}${a('Repository access','#repository-access')}${a('Appearance','#appearance')}</nav>`+setting('workflow-scheduling','Workflow scheduling','Server-wide','Separate limits for Runs using a model and Runs without one. Lowering limits drains work naturally; it never cancels existing work.',`<form data-demo-form="Scheduling limits"><div class="form-grid">${field('Concurrent Runs using a model',input('modelRuns','1','number','required min="1" max="32" step="1"'),'Whole number, 1–32')}${field('Concurrent Runs without a model',input('toolRuns','2','number','required min="1" max="32" step="1"'),'Whole number, 1–32')}</div>${note('Admission, not capacity. Compatible Runtime slots can further limit throughput.')}<div class="form-footer"><button type="submit" class="primary">Save scheduling limits</button><button type="reset">Reset</button></div><p class="quiet">Saved demo revision 4 · Server writes are disabled in this preview.</p></form>`)+setting('model-selection','Models','Server-wide','One default for new Runs and checks. Existing Runs, check drafts and prepared Evals keep their model choices.',`<form data-demo-form="Model selection">${field('Default model',select('defaultModel',['Configured Contractor model (unchanged)']))}<details class="diagnostics"><summary>Customize individual roles</summary><div class="entry-body">${['Planner','Worker','Summarizer','Audit completion'].map(r=>field(r,select(r,['Use default']))).join('')}</div></details><div class="form-footer"><button type="submit" class="primary">Save model choices</button><button type="reset">Reset</button></div></form>`)+setting('repository-access','Repository access','Personal credential','Your Git SSH public key is used to authorize private repository imports. Private key material is never shown.',`<div>${chip('Not configured')}</div><p class="quiet">No personal key has been loaded in this synthetic preview.</p>${button('Generate SSH key','ssh')}`)+setting('appearance','Appearance','This browser','Use the same theme and typography across Contractor.',field('Theme',select('appearance',['light','dark','black'])));content.querySelector('[name=appearance]').value=document.documentElement.dataset.theme;}
function render(){if(scenario==='error'){content.innerHTML=heading(sections[section]?.[0]??'Operations','The section could not be read.')+empty('Read failed','Current values are unavailable. Refresh retries this synthetic example.')+button('Retry read','refresh');return}const renderers={'runtime-agents':renderAgents,allocations:renderAllocations,completed:renderCompleted,performance:renderPerformance,configuration:renderConfiguration,llm:renderLLM,credentials:renderCredentials,settings:renderSettings};(renderers[section]??renderAgents)();}
function dialog(title,html){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.className='selection-dialog';d.setAttribute('aria-labelledby','dialog-title');d.innerHTML=`<header class="dialog-head"><h3 id="dialog-title">${esc(title)}</h3>${button('Close','close-dialog')}</header><div class="dialog-body">${note('Local design example. No Server changes, credentials or model requests will be sent.')}${html}<p class="dialog-feedback" role="status"></p></div>`;document.body.append(d);d.showModal();}
function localResult(form){const s='Preview only: '+form.dataset.demoForm+' validated locally. No Server changes were sent.';const d=form.closest('dialog');if(d)d.querySelector('.dialog-feedback').textContent=s;announce(s);}
content.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){if(section==='llm')kind=b.dataset.filter;else filter=b.dataset.filter;render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='history-filter'){filter=new FormData(e.target).get('runId').trim()||'all';render();return}if(e.target.matches('[data-demo-form]'))localResult(e.target)});
document.addEventListener('change',e=>{if(e.target.name==='range'){range=e.target.value;renderPerformance()}if(e.target.name==='appearance'){document.documentElement.dataset.theme=e.target.value;parent.postMessage({type:'operations-theme',theme:e.target.value},'*')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [action,id]=b.dataset.action.split(':');if(action==='close-dialog'){b.closest('dialog').close();return}if(action==='refresh'){announce('Preview reread the same synthetic example. No deployment request sent.');return}if(action==='clear-history'){filter='all';render();return}
 if(action==='labels'){const p=T.principals.find(p=>p.id===id);dialog('Edit Agent labels',`<form data-demo-form="Agent labels"><p class="quiet">Durable principal ${esc(p.id)}</p>${['default','source-review','api','staging'].map(l=>`<label class="check-label"><input type="checkbox" ${p.labels.includes(l)?'checked':''}> ${l}</label>`).join('')}<div class="form-footer"><button type="submit" class="primary">Save labels</button></div></form>`)}
 if(action==='bindings')dialog('Manage RuntimeConfig bindings',`<form data-demo-form="Runtime bindings">${field('Label',select('label',['default','api','source-review']))}${facts([['Target version',id+'@'+T.configs.find(c=>c.name===id).version],['Digest',T.configs.find(c=>c.name===id).digest]])}<div class="form-footer"><button type="submit" class="primary">Save binding</button></div></form>`);
 if(action==='publish')dialog('Publish RuntimeConfig',`<form data-demo-form="RuntimeConfig publication"><div class="form-grid">${field('Name',input('name','','text','required'))}${field('Version',input('version','','text','required'))}${field('Clone from',select('base',T.configs.map(c=>c.name+'@'+c.version)))}</div>${note('A new immutable version is published first; label bindings activate it separately.')}<div class="form-footer"><button type="submit" class="primary">Publish version</button></div></form>`);
 if(action==='runtime-credential')dialog('Create Runtime service credential',`<form data-demo-form="Runtime service credential">${field('Credential ID',input('id','','text','required'))}${field('Kind',select('kind',['OTLP headers','HTTP proxy basic auth','HTTP proxy bearer token','Caido bearer token','Interactsh server token','HTTP origin basic auth','HTTP origin bearer token','HTTP target basic auth','HTTP target bearer token','HTTP target cookies']))}${note('Payload inputs depend on the selected kind. This layout example intentionally accepts no secret payload.')}<div class="form-footer"><button type="submit" class="primary">Preview credential metadata</button></div></form>`);
 if(action==='llm-credential')dialog('Create active LLM credential',credentialForm());
 if(action==='clone')dialog('Clone '+id+' as a new version',`<form data-demo-form="Configuration clone"><div class="form-grid">${field('Name',input('name',id,'text','required'))}${field('New version',input('version','2','text','required'))}</div>${field('Versioned document','<textarea name="document" spellcheck="false"># Synthetic document layout example\n# Exact fields depend on configuration kind.</textarea>')}<div class="form-footer"><button type="submit" class="primary">Publish new version</button></div></form>`);
 if(action==='ssh')dialog('Generate SSH key',`<p>In the application this creates a personal key for private repository imports.</p>${button('Preview generation','ssh-preview','primary')}`);
 if(action==='ssh-preview')announce('Preview only. No SSH key was generated.');});
document.addEventListener('click',e=>{const link=e.target.closest('a');if(!link)return;e.preventDefault();const href=link.getAttribute('href');if(href.startsWith('#')){const t=document.getElementById(href.slice(1));t?.scrollIntoView({block:'start'});return}const match=Object.entries(sections).find(([,v])=>v[1]===href.split('#')[0]);if(match){parent.postMessage({type:'operations-section',section:match[0],hash:href.split('#')[1]??''},'*');return}announce('Preview destination: '+href+'. No deployment state changed.');});
for(const link of document.querySelectorAll('.ops-navigation a')){link.removeAttribute('aria-current');if(link.getAttribute('href')===(section==='completed'?sections.allocations[1]:sections[section]?.[1]))link.setAttribute('aria-current','page')}
$('sections-browser').querySelector('summary').innerHTML=esc(sections[section]?.[0]??'Runtime Agents')+'<span>Operations sections</span>';
$('connection').innerHTML=chip(fixture.connection==='live'?'Live updates':fixture.connection==='reconnecting'?'Reconnecting':'Read failed');
$('connection-note').textContent=fixture.connection==='reconnecting'?'Showing the last synthetic snapshot.':'Synthetic design preview · local interactions only';
for(const b of document.querySelectorAll('[data-refresh]'))b.onclick=()=>announce('Preview reread the same synthetic example. No deployment request sent.');
const mobile=matchMedia('(max-width:820px)');function adapt(){$('sections-browser').open=!mobile.matches}mobile.addEventListener('change',adapt);adapt();
$('mobile-menu').onclick=()=>{$('global-rail').dataset.open=String($('global-rail').dataset.open!=='true');$('mobile-menu').setAttribute('aria-expanded',$('global-rail').dataset.open)};
render();if(q.get('target')){const d=document.getElementById(q.get('target'));if(d instanceof HTMLDetailsElement){d.open=true;d.scrollIntoView({block:'nearest'})}}
window.__operationsTabs={section,scenario,render,source:T};
</script></body></html>
