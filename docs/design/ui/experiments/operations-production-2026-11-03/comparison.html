<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations · OpenDesign / working UI</title><style>body{margin:0;background:#0b0e13;color:#dde3ec;font:13px system-ui}header{padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#11161f}select,a{font:inherit;color:inherit}select{background:#1a2431;border:1px solid #394453;padding:6px;border-radius:5px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}.pair img{width:100%;display:block;border:1px solid #344050}.pair h2{font-size:14px}a{margin-left:auto}@media(max-width:640px){.pair{grid-template-columns:1fr}}</style><header><strong>OpenDesign / Working UI</strong><label>Section <select id="section"><option>overview</option><option>runtime-agents</option><option>allocations</option><option>completed</option><option>performance</option><option>configuration</option><option>llm</option><option>credentials</option><option>settings</option></select></label><label>Width <select id="width"><option>1440</option><option>390</option></select></label><label>Card <select id="state"><option>collapsed</option><option>expanded</option></select></label><a id="open" target="_blank">Open working UI →</a></header><main class="pair"><section><h2>Approved OpenDesign</h2><img id="approved" alt="Approved OpenDesign"></section><section><h2>Working React UI</h2><img id="working" alt="Working React UI"></section></main><script>const q=new URLSearchParams(location.search),section=document.getElementById('section'),width=document.getElementById('width'),state=document.getElementById('state');for(const el of [section,width,state]){el.value=q.get(el.id)||el.options[0].value;el.onchange=render}function render(){state.disabled=section.value!=='runtime-agents';if(state.disabled)state.value='collapsed';for(const version of ['approved','working'])document.getElementById(version).src=section.value+'-'+width.value+'-'+version+'-'+state.value+'.png';document.getElementById('open').href='../index.html?version=new&section='+section.value+'&case=attention&theme=dark&width='+width.value;history.replaceState(null,'','?section='+section.value+'&width='+width.value+'&state='+state.value)}render()</script></html>
