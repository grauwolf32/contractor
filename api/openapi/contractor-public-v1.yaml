          maxProperties: 128
          additionalProperties: {$ref: '#/components/schemas/ExactArtifactRef'}
        outputPublications:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/OutputPublication'}
        eventCursor: {$ref: '#/components/schemas/EventCursor'}
        activeStageExecutionId: {$ref: '#/components/schemas/ResourceId'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
