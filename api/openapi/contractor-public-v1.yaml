        username: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'}
        password:
          type: string
          writeOnly: true
          description: Password must contain 12 through 1024 UTF-8 bytes. The server validates byte length, rather than Unicode character count.
          x-min-utf8-bytes: 12
          x-max-utf8-bytes: 1024

    SnapshotCursor:
      type: object
      additionalProperties: false
      required: [generation, revision]
      properties:
        generation: {$ref: '#/components/schemas/ResourceId'}
        revision: {type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 20}
    SafeReason:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code: {$ref: '#/components/schemas/ConfigId'}
        retryable: {type: boolean}
    RuntimeToolsetCapability:
      type: object
      additionalProperties: false
      required: [ref, tools]
      properties:
        ref: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        tools:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {$ref: '#/components/schemas/ConfigId'}
    WorkspaceLimits:
      type: object
      additionalProperties: false
      required: [maxFiles, maxExpandedBytes, maxManagedTextBytes, maxFileBytes]
      properties:
        maxFiles: {type: integer, minimum: 1}
        maxExpandedBytes: {type: integer, format: int64, minimum: 1}
        maxManagedTextBytes: {type: integer, format: int64, minimum: 1}
        maxFileBytes: {type: integer, format: int64, minimum: 1}
    WorkspaceCapabilities:
      type: object
      additionalProperties: false
      required: [storage, modes, limits]
      properties:
        storage: {type: string, enum: [local, memory]}
        modes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [direct, overlay]}
        limits: {$ref: '#/components/schemas/WorkspaceLimits'}
    PlacementLabels:
      type: array
      description: Sorted unique cloud/local paths forming one ancestor chain. Empty means no location declaration or requirement.
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^(cloud|local)(/[a-z][a-z0-9_-]*)*$'
        not: {pattern: '[^a-z0-9_/-]'}
    RuntimeAgentObservation:
      type: object
      additionalProperties: false
      required: [instanceId, softwareVersion, supportedRuntimes, supportedToolsets, supportedSandboxProfiles, supportedRuntimeAdapters, observedState, slotState]
      properties:
        placementLabels: {$ref: '#/components/schemas/PlacementLabels'}
        instanceId: {$ref: '#/components/schemas/ResourceId'}
        softwareVersion: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'}
        supportedRuntimes:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        supportedToolsets:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/RuntimeToolsetCapability'}
        supportedSandboxProfiles:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        supportedRuntimeAdapters:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        workspaceCapabilities: {$ref: '#/components/schemas/WorkspaceCapabilities'}
        observedState: {type: string, enum: [idle, allocated, draining, fenced]}
        slotState: {type: string, enum: [idle, reserved, busy, draining, fenced]}
        lastAcceptedHeartbeat: {type: string, format: date-time}
        confirmedLeaseUntil: {type: string, format: date-time}
        currentAllocationId: {$ref: '#/components/schemas/ResourceId'}
        authoritativeAllocationId: {$ref: '#/components/schemas/ResourceId'}
        reconciliationReason: {$ref: '#/components/schemas/SafeReason'}
    RuntimeAgentPrincipalAvailability:
      type: string
      enum: [available, offline, busy, slot_unavailable, adapter_capability_mismatch]
    RuntimeAgentPrincipal:
      type: object
      additionalProperties: false
      required: [runtimeAgentId, labels, revision, availability, requiredRuntimeAdapters, missingRuntimeAdapters, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        runtimeAgentId: {type: string, pattern: '^[0-9a-f]{64}$'}
        labels:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
        revision: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 20}
        availability: {$ref: '#/components/schemas/RuntimeAgentPrincipalAvailability'}
        requiredRuntimeAdapters:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        missingRuntimeAdapters:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeCapabilityRef'}
        live: {$ref: '#/components/schemas/RuntimeAgentObservation'}
        createdBy: {$ref: '#/components/schemas/AuditActor'}
        createdAt: {type: string, format: date-time}
        updatedBy: {$ref: '#/components/schemas/AuditActor'}
        updatedAt: {type: string, format: date-time}
    RuntimeAgentPrincipalPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RuntimeAgentPrincipal'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RuntimeAgentLabelsMutation:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          description: >-
            The Runtime Agent's complete label set in any order: at most 32
            labels of the label grammar, unique, never the reserved default
            label (RCF-R117 to RCF-R120). The Server stores it in lexical order.
          type: array
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
    PerformanceNumber:
      type: number
      minimum: 0
      maximum: 1.7976931348623157e308
      description: Finite nonnegative measurement. Unknown values are omitted, never replaced with zero.
    PerformanceInteger:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    PerformanceReason:
      type: string
      enum: [unsupported_platform, read_failed, sampling_gap, counter_reset, missing_baseline, permission_denied, statistics_disabled, database_unavailable, budget_exceeded, record_limit, gpu_not_available, unsupported_metric]
    PerformanceCoverage:
      type: object
      additionalProperties: false
      required: [startedAt, endedAt, durationSeconds, expectedSamples, observedSamples]
      properties:
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        durationSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        expectedSamples: {$ref: '#/components/schemas/PerformanceInteger'}
        observedSamples: {$ref: '#/components/schemas/PerformanceInteger'}
    PerformanceFreshness:
      type: object
      additionalProperties: false
      required: [status, lastAttemptAt, intervalSeconds, coverage]
      description: observedAt is the last successful observation, not the read time. Two missed intervals make the group stale; unavailable or never observed groups omit measurements.
      properties:
        status: {type: string, enum: [ok, partial, unavailable]}
        reason: {$ref: '#/components/schemas/PerformanceReason'}
        observedAt: {type: string, format: date-time}
        lastAttemptAt: {type: string, format: date-time}
        intervalSeconds: {type: integer, enum: [15, 60, 300]}
        coverage: {$ref: '#/components/schemas/PerformanceCoverage'}
    PerformanceHistogram:
      type: object
      additionalProperties: false
      required: [count, sumSeconds, buckets]
      description: Cumulative counts at fixed bounds .005,.01,.025,.05,.1,.25,.5,1,2.5,5,10,30,60,+Inf seconds. The last bucket equals count. Merge counts and sums, not quantiles. Empty windows have unknown quantiles; overflow is greater than 60s.
      properties:
        count: {$ref: '#/components/schemas/PerformanceInteger'}
        sumSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        buckets:
          type: array
          minItems: 14
          maxItems: 14
          items: {$ref: '#/components/schemas/PerformanceInteger'}
    PerformanceHTTPSurface:
      type: object
      additionalProperties: false
      required: [surface, inFlight, counts, duration]
      properties:
        surface: {type: string, enum: [public, private]}
        inFlight: {$ref: '#/components/schemas/PerformanceInteger'}
        counts:
          type: array
          minItems: 10
          maxItems: 10
          description: Rows GET,HEAD,POST,PUT,DELETE,CONNECT,OPTIONS,TRACE,PATCH,other; columns 1xx,2xx,3xx,4xx,5xx,no_response. No request-specific dimensions.
          items:
            type: array
            minItems: 6
            maxItems: 6
            items: {$ref: '#/components/schemas/PerformanceInteger'}
        duration: {$ref: '#/components/schemas/PerformanceHistogram'}
    PerformanceHTTP:
      type: object
      additionalProperties: false
      required: [freshness, surfaces]
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        surfaces:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly public then private.
          items: {$ref: '#/components/schemas/PerformanceHTTPSurface'}
    PerformanceGCPauseHistogram:
      type: object
      additionalProperties: false
      required: [boundsSeconds, counts]
      description: Cumulative process-lifetime GC pause histogram with non-cumulative bucket populations. Bounds are finite upper edges; counts has one additional overflow bucket for positive infinity. Unknown/reset deltas are not zero.
      properties:
        boundsSeconds:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/PerformanceNumber'}
        counts:
          type: array
          minItems: 1
          maxItems: 257
          items: {$ref: '#/components/schemas/PerformanceInteger'}
    PerformanceProcess:
      type: object
      additionalProperties: false
      required: [freshness]
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        cpuUserSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        cpuSystemSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        cpuCores: {$ref: '#/components/schemas/PerformanceNumber'}
        rssBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        heapLiveBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        goroutines: {$ref: '#/components/schemas/PerformanceInteger'}
        gcCycles: {$ref: '#/components/schemas/PerformanceInteger'}
        gcPauseSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        gcPauses: {$ref: '#/components/schemas/PerformanceGCPauseHistogram'}
    PerformancePool:
      type: object
      additionalProperties: false
      required: [freshness]
      description: Working pgx pool counters. Successful acquisition duration/count is a mean, not p95 or cancelled-acquire latency.
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        acquiredConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        idleConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        totalConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        maxConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        acquireCount: {$ref: '#/components/schemas/PerformanceInteger'}
        acquireDurationSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        emptyAcquireCount: {$ref: '#/components/schemas/PerformanceInteger'}
        emptyAcquireWaitSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        canceledAcquireCount: {$ref: '#/components/schemas/PerformanceInteger'}
    PerformanceDatabase:
      type: object
      additionalProperties: false
      required: [freshness]
      description: Aggregates for the current database only. Restricted visibility produces partial or unavailable data; resets invalidate deltas. No SQL text or per-backend records.
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        statsReset: {type: string, format: date-time}
        commits: {$ref: '#/components/schemas/PerformanceInteger'}
        rollbacks: {$ref: '#/components/schemas/PerformanceInteger'}
        deadlocks: {$ref: '#/components/schemas/PerformanceInteger'}
        tempFiles: {$ref: '#/components/schemas/PerformanceInteger'}
        tempBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        blocksRead: {$ref: '#/components/schemas/PerformanceInteger'}
        blocksHit: {$ref: '#/components/schemas/PerformanceInteger'}
        activeConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        idleConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        idleInTransactionConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        lockWaitingConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        longestTransactionSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        longestIdleTransactionSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        estimatedLiveTuples: {$ref: '#/components/schemas/PerformanceInteger'}
        estimatedDeadTuples: {$ref: '#/components/schemas/PerformanceInteger'}
        clientConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        hiddenConnections: {$ref: '#/components/schemas/PerformanceInteger'}
        autovacuumWorkers: {$ref: '#/components/schemas/PerformanceInteger'}
        vacuumCount: {$ref: '#/components/schemas/PerformanceInteger'}
        autovacuumCount: {$ref: '#/components/schemas/PerformanceInteger'}
        lastVacuumAt: {type: string, format: date-time}
        lastAutovacuumAt: {type: string, format: date-time}
        rates: {$ref: '#/components/schemas/PerformanceDatabaseRates'}
    PerformanceDatabaseRates:
      type: object
      additionalProperties: false
      required: [intervalSeconds, commitsPerSecond, rollbacksPerSecond, deadlocksPerSecond, tempFilesPerSecond, tempBytesPerSecond, blocksReadPerSecond, blocksHitPerSecond]
      properties:
        intervalSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        commitsPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        rollbacksPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        deadlocksPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        tempFilesPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        tempBytesPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        blocksReadPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        blocksHitPerSecond: {$ref: '#/components/schemas/PerformanceNumber'}
        bufferHitRatio: {type: number, minimum: 0, maximum: 1}
    PerformanceDatabaseSize:
      type: object
      additionalProperties: false
      required: [freshness]
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        sizeBytes: {$ref: '#/components/schemas/PerformanceInteger'}
    PerformanceGPU:
      type: object
      additionalProperties: false
      required: [freshness, devices]
      description: NVIDIA devices visible to the Server host, including other applications. Unsupported metrics are omitted. Device UUIDs keep history separate across reorder or replacement.
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        devices:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/PerformanceGPUDevice'}
    PerformanceGPUDevice:
