    post:
      operationId: importGitArtifact
      tags: [Artifacts]
      summary: Import one bounded Git snapshot as an exact source ZIP artifact
      description: |
        Omitting both precondition headers or sending `If-None-Match: *` creates
        an absent binding and conflicts if it already exists. Updating an
        existing binding requires one strong quoted `If-Match` revision;
        supplying both headers is invalid. No automatic refresh or mutation
        retry. The whole operation is bounded to 120 seconds.
      x-max-request-body-bytes: 65536
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
        - name: If-None-Match
          in: header
          schema: {type: string, const: '*'}
        - $ref: '#/components/parameters/ArtifactIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitImportRequest'}
      responses:
        '200': {$ref: '#/components/responses/GitImportResult'}
        '201': {$ref: '#/components/responses/GitImportResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ArtifactWriteConflict'}
        '408':
          description: Import interrupted; inspect metadata before retrying
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504':
          description: Import deadline exceeded; inspect metadata before retrying
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ArtifactWriteUnavailable'}

