    AuditLabels:
      allOf:
        - $ref: '#/components/schemas/RunMetadataLabels'
        - type: object
          additionalProperties: true
          maxProperties: 28
          propertyNames:
            not: {pattern: '^audit\.'}
      description: Ordinary labels pinned at Audit start and inherited by every child Run. cloud or local with an empty value selects the whole namespace; cloud=aws selects cloud/aws. Four entries are reserved for child-specific audit.* provenance.
    RunMetadataLabelSelector:
      type: string
      minLength: 2
      maxLength: 320
      x-max-utf8-bytes: 320
      pattern: '^[^=]+=[\s\S]*$'
      description: >-
        Exact metadata-label key=value selector after query decoding. The first
        '=' separates the key from the value. Server validates the key with the
        RunMetadataLabels key grammar and byte bound (LIM-RUN-4) and the value
        with its byte bound (no U+0000, LIM-RUN-5).
        The combined byte bound is LIM-RUN-11; a shorter key does
        not increase the value allowance. Invalid parts return 400 invalid_request.
    RunMetadataLabels:
      description: Immutable ordinary key/value labels. cloud and local derive Runtime placement; an empty value selects the namespace and a non-empty value selects its provider/site child path. Other keys are descriptive.
      type: object
      maxProperties: 32
      propertyNames:
        allOf:
          - type: string
            minLength: 1
            maxLength: 63
            pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
          - not: {pattern: '^contractor\.'}
      additionalProperties:
        type: string
        minLength: 0
        maxLength: 256
        x-max-utf8-bytes: 256
        description: Opaque non-NUL UTF-8 value bounded by the shared Server byte policy. An empty string represents a key-only label.
