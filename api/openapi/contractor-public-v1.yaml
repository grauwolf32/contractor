      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ArtifactLineageEdge'}}
        page: {$ref: '#/components/schemas/PageInfo'}

    WorkflowRunState:
      type: string
      enum: [initializing, pending, running, waiting, cancelling, succeeded, failed, cancelled]
    WorkflowRunLifecycle:
      type: string
      enum: [active, terminal]
    NonTerminalWorkflowRunState:
      type: string
      enum: [initializing, pending, running, waiting, cancelling]
    StageExecutionState:
      type: string
      enum: [preparing, running, finalizing, aborting, succeeded, failed, interrupted, cancelled]
    StageOutcome:
      type: string
      enum: [succeeded, failed]
    TerminationError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {$ref: '#/components/schemas/ConfigId'}
        message: {type: string, minLength: 1, maxLength: 4096}
        retryable: {type: boolean}
    StageContentResult:
      type: object
      additionalProperties: false
      required: [apiVersion, outcome, summary, artifacts]
      properties:
        apiVersion: {type: string, const: contractor/v1alpha1}
        outcome: {$ref: '#/components/schemas/StageOutcome'}
        summary: {type: string, minLength: 1, maxLength: 65536}
        artifacts:
          type: object
          maxProperties: 128
          additionalProperties: {$ref: '#/components/schemas/ExactArtifactRef'}
        error: {$ref: '#/components/schemas/TerminationError'}
        summarized:
          type: boolean
          description: Runtime-owned terminal summary carried by passthrough as incomplete work requiring continuation.
        summaryArtifact: {$ref: '#/components/schemas/ExactArtifactRef'}
      oneOf:
        - properties:
            outcome: {type: string, enum: [succeeded]}
            summarized: {type: boolean, enum: [false]}
          not:
            anyOf:
              - required: [error]
              - required: [summaryArtifact]
        - required: [error]
          properties:
            outcome: {type: string, enum: [failed]}
            summarized: {type: boolean, enum: [false]}
            error:
              properties:
                code: {not: {type: string, enum: [worker_summarized]}}
          not: {required: [summaryArtifact]}
        - required: [summarized, error]
          properties:
            outcome: {type: string, enum: [failed]}
            summarized: {type: boolean, enum: [true]}
            error:
              properties:
                code: {type: string, enum: [worker_summarized]}
                retryable: {type: boolean, enum: [false]}
    StageTermination:
      type: object
      additionalProperties: false
      required: [outcome, code, message, retryable, phase, occurredAt]
      properties:
        outcome: {type: string, enum: [cancelled, interrupted]}
        code: {$ref: '#/components/schemas/ConfigId'}
        message: {type: string, minLength: 1, maxLength: 4096}
        retryable: {type: boolean}
        phase: {type: string, enum: [preparing, running]}
        occurredAt: {type: string, format: date-time}
    Cancellation:
      type: object
      additionalProperties: false
      required: [code, requestedAt]
      properties:
        code: {type: string, const: user_cancelled}
        requestedAt: {type: string, format: date-time}
        requestedBy: {$ref: '#/components/schemas/ConfigId'}
        reason: {type: string, minLength: 1, maxLength: 4096, x-max-utf8-bytes: 4096}
    CostCounter:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})$'
      description: Exact nonnegative aggregate call/report count.
    USDAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})(\.[0-9]{0,17}[1-9])?$'
      description: Exact canonical USD decimal; no binary floating-point accounting.
    NullableUSDAmount:
      oneOf:
        - {$ref: '#/components/schemas/USDAmount'}
        - {type: 'null'}
    CostBreakdownRow:
      type: object
      additionalProperties: false
      required: [key, label, calls, amount, basis]
      properties:
        key: {type: string, minLength: 1, maxLength: 262}
        label: {type: string, minLength: 1, maxLength: 256}
        calls: {$ref: '#/components/schemas/CostCounter'}
        amount: {$ref: '#/components/schemas/USDAmount'}
        basis: {type: string, enum: [reported, estimated, mixed]}
    LLMCostExecution:
      type: object
      additionalProperties: false
      required: [executionId, runId, amount, basis, coverage, pending]
      properties:
        executionId: {$ref: '#/components/schemas/ResourceId'}
        runId: {type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        amount: {$ref: '#/components/schemas/NullableUSDAmount'}
        basis: {type: string, enum: [none, reported, estimated, mixed]}
        coverage: {type: string, enum: [complete, partial, pending, unavailable]}
        pending: {type: boolean}
    LLMCostSummary:
      type: object
      additionalProperties: false
      required: [scope, scopeId, currency, amount, calls, pricedCalls, reports, unknownReports, basis, coverage, pending, historicalGap, asOf, updatedAt, checksAmount, standaloneAmount, activity, models, executions]
      properties:
        scope: {type: string, enum: [run, audit, project]}
        scopeId: {$ref: '#/components/schemas/ResourceId'}
        currency: {type: string, const: USD}
        amount: {$ref: '#/components/schemas/NullableUSDAmount'}
        calls: {$ref: '#/components/schemas/CostCounter'}
        pricedCalls: {$ref: '#/components/schemas/CostCounter'}
        reports:
          $ref: '#/components/schemas/CostCounter'
          description: Expected Worker and Planner report slots, including unreceived reports and retained slots from deleted children.
        unknownReports:
          $ref: '#/components/schemas/CostCounter'
          description: Participants with no report, an incomplete report, or no cost metadata. Retained after child deletion.
        basis: {type: string, enum: [none, reported, estimated, mixed]}
        coverage: {type: string, enum: [complete, partial, pending, unavailable]}
        pending: {type: boolean}
        historicalGap: {type: boolean}
        asOf: {type: string, format: date-time}
        updatedAt: {type: [string, 'null'], format: date-time}
        checksAmount: {$ref: '#/components/schemas/NullableUSDAmount'}
        standaloneAmount: {$ref: '#/components/schemas/NullableUSDAmount'}
        activity: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CostBreakdownRow'}}
        models: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CostBreakdownRow'}}
        executions: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/LLMCostExecution'}}
    MetricsSummary:
      type: object
      additionalProperties: false
      required: [reportsComplete, modelCalls, inputTokens, outputTokens, totalTokens, toolCalls, toolFailures, errorCount, truncated]
      properties:
        reportsComplete: {type: boolean}
        modelCalls: {type: integer, minimum: 0}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        totalTokens: {type: integer, minimum: 0}
        toolCalls: {type: integer, minimum: 0}
        toolFailures: {type: integer, minimum: 0}
        errorCount: {type: integer, minimum: 0}
        truncated: {type: boolean}
    WorkerCompletionDiagnostics:
      type: object
      additionalProperties: false
      description: Latest Worker invocation facts. Published packages are not accepted Audit evidence.
      required: [kind, phase, acceptedCount, totalCount, reminderCount]
      properties:
        kind: {type: string, enum: [audit-check-results@1]}
        phase: {type: string, enum: [collecting, sealed, publishing, published, failed]}
        acceptedCount: {type: integer, minimum: 0, maximum: 64}
        totalCount: {type: integer, minimum: 1, maximum: 64}
        reminderCount: {type: integer, minimum: 0, maximum: 2}
        failureCode: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    AttemptDiagnostic:
      type: object
      additionalProperties: false
      required: [participant, code, message]
      properties:
        participant: {type: string, enum: [planner, worker]}
        completion: {$ref: '#/components/schemas/WorkerCompletionDiagnostics'}
        logicalAgent: {$ref: '#/components/schemas/ConfigId'}
        code: {$ref: '#/components/schemas/ConfigId'}
        message: {type: string, minLength: 1, maxLength: 4096}
        retryable: {type: boolean}
      allOf:
        - if: {properties: {participant: {type: string, const: planner}}}
          then: {not: {required: [logicalAgent]}}
        - if: {properties: {participant: {type: string, const: worker}}}
          then: {required: [logicalAgent]}
    DiagnosticUnsignedDecimal:
      type: string
      minLength: 1
      maxLength: 20
      pattern: '^(0|[1-9][0-9]*)$'
      description: Canonical decimal uint64, at most 18446744073709551615. Never parse through a JavaScript number.
    DiagnosticInt64Decimal:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^(0|[1-9][0-9]*)$'
      description: Canonical nonnegative int64 decimal, at most 9223372036854775807. Field names define milliseconds or byte units.
    DroppedSpanDiagnosticCounts:
      type: object
      additionalProperties: false
      required: [queueOverflow, encodingFailed, nonRetryable, retryExhausted, collectorRejected, deadlineExceeded, cancelled, shutdown]
      properties:
        queueOverflow: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        encodingFailed: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        nonRetryable: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        retryExhausted: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        collectorRejected: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        deadlineExceeded: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        cancelled: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        shutdown: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
    RuntimeAdapterDiagnostic:
      type: object
      additionalProperties: false
      required: [ref, operations, failedOperations]
      properties:
        ref: {type: string, enum: [otlp-http@1, http-proxy@1, caido-graphql@1, interactsh-http@1, http-target@1]}
        operations: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        failedOperations: {$ref: '#/components/schemas/DiagnosticUnsignedDecimal'}
        flushAttempted: {type: boolean}
        flushSucceeded: {type: boolean}
        lastErrorCode: {type: string, enum: [close_failed, delivery_failed, flush_failed, flush_timeout, queue_overflow, request_failed]}
        droppedSpans: {$ref: '#/components/schemas/DroppedSpanDiagnosticCounts'}
      dependentRequired:
        flushAttempted: [flushSucceeded]
        flushSucceeded: [flushAttempted]
    RuntimeDiagnostic:
      type: object
      additionalProperties: false
      required: [logicalAgent, status, stopReasonTruncated, adapters]
      properties:
        logicalAgent: {$ref: '#/components/schemas/ConfigId'}
        status: {type: string, enum: [available, partial, unavailable]}
        reason: {type: string, enum: [invalid_report]}
        complete: {type: boolean}
        durationMs: {$ref: '#/components/schemas/DiagnosticInt64Decimal'}
        stopReason: {type: string, minLength: 1, maxLength: 4096}
        stopReasonTruncated: {type: boolean}
        adapters:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/RuntimeAdapterDiagnostic'}
    ToolCallDiagnosticError:
      type: object
      additionalProperties: false
      required: [code, message, messageTruncated]
      properties:
        code: {$ref: '#/components/schemas/ConfigId'}
        message: {type: string, minLength: 1, maxLength: 4096, description: At most 4096 UTF-8 bytes; URL-shaped text removed.}
        messageTruncated: {type: boolean}
        retryable: {type: boolean}
    ToolCallDiagnostic:
      type: object
      additionalProperties: false
      required: [callReference, tool, toolTruncated, outcome, argumentsTruncated, durationMs, resultSizeBytes]
      properties:
        callReference: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$', description: Opaque reference derived from the selected report generation and retained record ordinal; never a source call ID.}
        tool: {type: string, minLength: 1, maxLength: 128, description: At most 128 UTF-8 bytes; unavailable marker replaces an oversized or malformed vocabulary name.}
        toolTruncated: {type: boolean}
        outcome: {type: string, enum: [succeeded, failed]}
        argumentsJson: {type: string, minLength: 2, maxLength: 4096, description: At most 4096 UTF-8 bytes of canonical sanitized JSON TEXT. Render as text without parsing numeric literals through JavaScript numbers.}
        argumentsTruncated: {type: boolean}
        durationMs:
          oneOf: [{$ref: '#/components/schemas/DiagnosticInt64Decimal'}, {type: 'null'}]
        resultSizeBytes:
          oneOf: [{$ref: '#/components/schemas/DiagnosticInt64Decimal'}, {type: 'null'}]
        error: {$ref: '#/components/schemas/ToolCallDiagnosticError'}
      allOf:
        - if: {properties: {outcome: {type: string, const: succeeded}}}
          then: {not: {required: [error]}}
        - if: {properties: {outcome: {type: string, const: failed}}}
          then: {required: [error]}
    ToolDiagnosticPage:
      type: object
      additionalProperties: false
      required: [status, participant, detailTruncated, items, page]
      properties:
        status: {type: string, enum: [available, pending, unavailable]}
        reason: {type: string, enum: [report_missing, invalid_report, report_oversized]}
        participant: {type: string, enum: [planner, worker]}
        logicalAgent: {$ref: '#/components/schemas/ConfigId'}
        complete: {type: boolean}
        detailTruncated: {type: boolean}
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ToolCallDiagnostic'}
        page: {$ref: '#/components/schemas/PageInfo'}
      allOf:
        - if: {properties: {participant: {type: string, const: planner}}}
          then: {not: {required: [logicalAgent]}}
        - if: {properties: {participant: {type: string, const: worker}}}
          then: {required: [logicalAgent]}
    RuntimeDiagnosticPage:
      type: object
      additionalProperties: false
      required: [status, items, page]
      properties:
        status: {type: string, enum: [available, pending, unavailable]}
        reason: {type: string, enum: [report_missing, invalid_report]}
        items:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/RuntimeDiagnostic'}
        page: {$ref: '#/components/schemas/PageInfo'}
    AttemptDiagnostics:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/AttemptDiagnostic'}
        truncated: {type: boolean}
    ModelPolicyRef:
      type: object
      additionalProperties: false
      required: [policyId, version, digest]
      properties:
        policyId: {$ref: '#/components/schemas/ConfigurationName'}
        version: {$ref: '#/components/schemas/ConfigVersion'}
        digest: {$ref: '#/components/schemas/Digest'}
    LLMGatewayConfigRef:
      type: object
      additionalProperties: false
      required: [gatewayId, version, digest]
      properties:
        gatewayId: {$ref: '#/components/schemas/ConfigurationName'}
        version: {$ref: '#/components/schemas/ConfigVersion'}
        digest: {$ref: '#/components/schemas/Digest'}
    RuntimeConfigRef:
      type: object
      additionalProperties: false
      required: [name, version, digest]
      properties:
        name: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
        version: {$ref: '#/components/schemas/RuntimeConfigVersion'}
        digest: {$ref: '#/components/schemas/Digest'}
    RuntimeConfigMetadata:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
        version: {$ref: '#/components/schemas/RuntimeConfigVersion'}
    RuntimeTelemetryConfig:
      type: object
      additionalProperties: false
      required: [adapter, endpoint]
      properties:
        adapter: {type: string, const: otlp-http@1}
        endpoint: {type: string, format: uri, minLength: 8, maxLength: 2048}
        credential:
          $ref: '#/components/schemas/RuntimeCredentialId'
        flushTimeoutSeconds: {type: integer, minimum: 1, maximum: 10, description: Defaults to 10 seconds.}
        export:
          $ref: '#/components/schemas/WorkerTelemetryExportConfig'
    WorkerTelemetryExportConfig:
      type: object
      additionalProperties: false
      description: Worker telemetry export settings. Not supported under planner.telemetry. The pending byte limit must cover the batch size.
      properties:
        batchSizeBytes: {type: integer, minimum: 1048576, maximum: 67108864, description: Defaults to 8388608 bytes (8 MiB).}
        maxAttempts: {type: integer, minimum: 1, maximum: 10, description: Defaults to 2 total attempts per batch.}
        maxPendingSpans: {type: integer, minimum: 1, maximum: 2048, description: Defaults to 2048 spans.}
        maxPendingBytes: {type: integer, minimum: 1048576, maximum: 67108864, description: Defaults to 67108864 bytes (64 MiB).}
        retry:
          $ref: '#/components/schemas/WorkerTelemetryRetryConfig'
    WorkerTelemetryRetryConfig:
      type: object
      additionalProperties: false
      description: >-
        Optional bounded backoff settings. When this block is supplied, omitted
        fields default to 100 and 1000 milliseconds respectively. After applying
        defaults, initialBackoffMilliseconds must not exceed maxBackoffMilliseconds;
        the Server validates this relationship. Absence preserves the stored document.
      properties:
        initialBackoffMilliseconds: {type: integer, minimum: 1, maximum: 60000, description: Defaults to 100 milliseconds.}
        maxBackoffMilliseconds: {type: integer, minimum: 1, maximum: 60000, description: Defaults to 1000 milliseconds.}
    RuntimeHTTPProxyConfig:
      type: object
      additionalProperties: false
      required: [adapter, proxyUrl, targets]
      properties:
        adapter: {type: string, const: http-proxy@1}
        proxyUrl: {type: string, format: uri, minLength: 8, maxLength: 2048}
        credential:
          $ref: '#/components/schemas/RuntimeCredentialId'
        caBundlePem: {$ref: '#/components/schemas/CABundlePEM'}
        targets:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {type: string, enum: [llm-gateway, tool-http, tool-subprocess]}
    CABundlePEM:
      type: string
      minLength: 1
      maxLength: 65536
      pattern: '^[\t\n\f\r\x20-\x7E]+$'
      description: One to eight PEM CERTIFICATE blocks (RCF-R86, LIM-RCF-11). The grammar is ASCII, so maxLength counts bytes.
    RuntimeCaidoConfig:
      type: object
      additionalProperties: false
      required: [adapter, endpoint]
      properties:
        adapter: {type: string, const: caido-graphql@1}
        endpoint: {type: string, format: uri, minLength: 8, maxLength: 2048}
        credential:
          $ref: '#/components/schemas/RuntimeCredentialId'
        caBundlePem: {$ref: '#/components/schemas/CABundlePEM'}
        requestTimeoutSeconds: {type: integer, minimum: 1, maximum: 120}
    RuntimeInteractshConfig:
      type: object
      additionalProperties: false
      required: [adapter, endpoint]
      properties:
        adapter: {type: string, const: interactsh-http@1}
        endpoint: {type: string, format: uri, minLength: 8, maxLength: 2048}
        credential:
          $ref: '#/components/schemas/RuntimeCredentialId'
        caBundlePem: {$ref: '#/components/schemas/CABundlePEM'}
        requestTimeoutSeconds: {type: integer, minimum: 1, maximum: 120}
    RuntimeLLMGatewayAuthorPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gateway:
          $ref: '#/components/schemas/Selector'
        credential:
          oneOf:
            - {$ref: '#/components/schemas/ConfigId'}
            - {type: 'null'}
    RuntimeWorkerAuthorPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        llmGateway:
          $ref: '#/components/schemas/RuntimeLLMGatewayAuthorPatch'
        telemetry:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeTelemetryConfig'}
            - {type: 'null'}
        httpProxy:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeHTTPProxyConfig'}
            - {type: 'null'}
        caido:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeCaidoConfig'}
            - {type: 'null'}
        interactsh:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeInteractshConfig'}
            - {type: 'null'}
    RuntimeConfigAuthorSpec:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        worker: {$ref: '#/components/schemas/RuntimeWorkerAuthorPatch'}
        planner: {$ref: '#/components/schemas/RuntimePlannerPatch'}
    RuntimeConfigAuthorDocument:
      type: object
      description: Publication input. Gateway selections use exact name@version strings, resolved by the Server before storage. At least one patch operation is required.
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, const: contractor/v1alpha1}
        kind: {type: string, const: RuntimeConfig}
        metadata: {$ref: '#/components/schemas/RuntimeConfigMetadata'}
        spec: {$ref: '#/components/schemas/RuntimeConfigAuthorSpec'}
    RuntimeLLMGatewayPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gateway:
          $ref: '#/components/schemas/LLMGatewayConfigRef'
        credential:
          oneOf:
            - {$ref: '#/components/schemas/ConfigId'}
            - {type: 'null'}
    RuntimeWorkerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        llmGateway:
          $ref: '#/components/schemas/RuntimeLLMGatewayPatch'
        telemetry:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeTelemetryConfig'}
            - {type: 'null'}
        httpProxy:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeHTTPProxyConfig'}
            - {type: 'null'}
        caido:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeCaidoConfig'}
            - {type: 'null'}
        interactsh:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeInteractshConfig'}
            - {type: 'null'}
    RuntimePlannerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        telemetry:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeTelemetryConfig'}
            - {type: 'null'}
    RuntimeConfigSpec:
      type: object
      additionalProperties: false
      properties:
        worker: {$ref: '#/components/schemas/RuntimeWorkerPatch'}
        planner: {$ref: '#/components/schemas/RuntimePlannerPatch'}
    RuntimeConfigDocument:
      type: object
      description: Immutable normalized read document. Gateway selections contain exact resolved refs. The built-in document may have an empty spec.
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, const: contractor/v1alpha1}
        kind: {type: string, const: RuntimeConfig}
        metadata: {$ref: '#/components/schemas/RuntimeConfigMetadata'}
        spec: {$ref: '#/components/schemas/RuntimeConfigSpec'}
    RuntimeConfigResource:
      type: object
      additionalProperties: false
      required: [ref, document, builtIn, createdBy, createdAt]
      properties:
        ref: {$ref: '#/components/schemas/RuntimeConfigRef'}
        document: {$ref: '#/components/schemas/RuntimeConfigDocument'}
        builtIn: {type: boolean}
        createdBy: {$ref: '#/components/schemas/AuditActor'}
        createdAt: {type: string, format: date-time}
    RuntimeConfigPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RuntimeConfigResource'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RuntimeLabelBinding:
      type: object
      additionalProperties: false
      required: [label, config, revision, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        label: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
        config: {$ref: '#/components/schemas/RuntimeConfigRef'}
        revision: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 20}
        createdBy: {$ref: '#/components/schemas/AuditActor'}
        createdAt: {type: string, format: date-time}
        updatedBy: {$ref: '#/components/schemas/AuditActor'}
        updatedAt: {type: string, format: date-time}
    RuntimeLabelPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RuntimeLabelBinding'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RuntimeLabelMutation:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config: {$ref: '#/components/schemas/RuntimeConfigRef'}
    RuntimeCredentialKind:
      type: string
      enum: [otlp-headers@1, http-proxy-basic@1, http-proxy-bearer@1, caido-bearer@1, interactsh-token@1, http-origin-basic@1, http-origin-bearer@1, target-basic@1, target-bearer@1, target-cookies@1, target-api-keys@1]
    RuntimeCredentialMetadata:
      type: object
      additionalProperties: false
      required: [credentialId, kind, createdBy, createdAt]
      properties:
        credentialId: {$ref: '#/components/schemas/RuntimeCredentialId'}
        kind: {$ref: '#/components/schemas/RuntimeCredentialKind'}
        createdBy: {$ref: '#/components/schemas/AuditActor'}
        createdAt: {type: string, format: date-time}
    RuntimeCredentialPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RuntimeCredentialMetadata'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    OTLPHeadersMaterial:
      type: object
      additionalProperties: false
      required: [headers]
      properties:
        headers:
          type: object
          minProperties: 1
          maxProperties: 32
          propertyNames: {type: string, minLength: 1, maxLength: 64, pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"}
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
            pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
            description: An HTTP/1.1 field value sent unchanged by every client (RCF-R113), visible ASCII characters with runs of space or tab only between them.
    HTTPProxyBasicMaterial:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/BasicCredentialUsername'}
        password: {$ref: '#/components/schemas/BasicCredentialPassword'}
    HTTPProxyBearerMaterial:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
          writeOnly: true
          description: An HTTP/1.1 field value sent unchanged by every client (RCF-R114), visible ASCII characters with runs of space or tab only between them.
    CaidoBearerMaterial:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
          writeOnly: true
          description: An HTTP/1.1 field value sent unchanged by every client (RCF-R114), visible ASCII characters with runs of space or tab only between them.
    InteractshTokenMaterial:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
          writeOnly: true
          description: An HTTP/1.1 field value sent unchanged by every client (RCF-R114), visible ASCII characters with runs of space or tab only between them.
    BasicCredentialUsername:
      type: string
      minLength: 1
      maxLength: 256
      x-max-utf8-bytes: 256
      pattern: '^[^\x00-\x1F\x7F:]+$'
      description: The username of a Basic credential, at most 256 UTF-8 bytes without control characters or a colon (RCF-R114).
    BasicCredentialPassword:
      type: string
      minLength: 1
      maxLength: 8192
      x-max-utf8-bytes: 8192
      pattern: '^[^\x00-\x1F\x7F]+$'
      writeOnly: true
      description: The password of a Basic credential, at most 8,192 UTF-8 bytes without control characters (RCF-R114).
    HTTPOriginBasicMaterial:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/BasicCredentialUsername'}
        password: {$ref: '#/components/schemas/BasicCredentialPassword'}
    HTTPOriginBearerMaterial:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
          writeOnly: true
          description: An HTTP/1.1 field value sent unchanged by every client (RCF-R114), visible ASCII characters with runs of space or tab only between them.
    TargetBasicMaterial:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/BasicCredentialUsername'}
        password: {$ref: '#/components/schemas/BasicCredentialPassword'}
    TargetBearerMaterial:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[!-~]+(?:[ \t]+[!-~]+)*$'
          writeOnly: true
          description: An HTTP/1.1 field value sent unchanged by every client (RCF-R114), visible ASCII characters with runs of space or tab only between them.
    TargetCookiesMaterial:
      type: object
      additionalProperties: false
      required: [cookies]
      properties:
        cookies:
          type: object
          minProperties: 1
          maxProperties: 128
          propertyNames: {pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]{1,256}$"}
          additionalProperties:
            type: string
            minLength: 0
            maxLength: 8192
            pattern: '^[\x21\x23-\x2B\x2D-\x3A\x3C-\x5B\x5D-\x7E]*$'
            writeOnly: true
          writeOnly: true
          description: Ready user supplied cookies (RCF-R184); at most 128 cookies with token names, at most 8192 ASCII cookie octets per value and at most 16 KiB of names and values combined. Empty values are allowed. Runtime does not log in or refresh the session.
    TargetAPIKeysMaterial:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          minProperties: 1
          maxProperties: 128
          propertyNames:
            type: string
            minLength: 7
            maxLength: 263
            x-max-utf8-bytes: 263
            pattern: '^(header|query|cookie):[^\x00-\x1F\x7F]+$'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 8192
            x-max-utf8-bytes: 8192
            writeOnly: true
          writeOnly: true
          description: >-
            API keys applied together through one engagement identity. Names use
            header:NAME, query:NAME or cookie:NAME. At most 256 UTF-8 bytes per
            unqualified name and 16 KiB of qualified names and values combined.
            Headers follow HTTP token/credential-field rules, cookies follow the
            cookie grammar, and query names/values forbid controls. Header names
            are case insensitive and cannot repeat or control HTTP framing.
