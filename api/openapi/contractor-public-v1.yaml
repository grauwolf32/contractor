          - false_positive
          - unreviewed
      - name: severity
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FindingSeverity'
      - name: projectRevision
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        description: Pin canonical Finding state. Continuations bind both Audit and Project revisions; stale views
          return 409.
      responses:
        '200':
          description: Stable oldest-first finding page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFindingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageTransactionConflict'
  /v1/audits/{auditId}/findings/{findingId}:
    parameters:
    - $ref: '#/components/parameters/AuditId'
    - $ref: '#/components/parameters/FindingId'
    get:
      operationId: getAuditFinding
      tags:
      - Audits
      summary: Read the same canonical Project Finding through an owned Audit
      responses:
        '200':
          description: Exact finding projection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageTransactionConflict'
  /v1/queue:
    get:
      operationId: listRunQueue
      tags: [Queue, Runs]
      summary: List the authenticated owner's non-terminal WorkflowRuns
      description: >-
        Stable oldest-created-first display projection. This order is not a
        Scheduler rank, execution priority, estimated start time, or claim.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/NonTerminalWorkflowRunState'}
        - name: membership
          in: query
          required: false
          schema: {$ref: '#/components/schemas/RunQueueMembership'}
      responses:
        '200':
          description: Stable oldest-created-first non-terminal Run page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunQueuePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/queue/control:
    get:
      operationId: getOwnerQueueControl
      tags: [Queue, Runs]
      summary: Get the authenticated owner's durable Queue admission control
      description: >-
        Absence of a persisted control row is represented as paused=false with
        revision 0. Pausing does not stop an already admitted Stage or any
        cancellation, recovery, finalization, publication, or release work.
      responses:
        '200':
          description: Effective owner Queue admission control
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerQueueControl'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}
    put:
      operationId: putOwnerQueueControl
      tags: [Queue, Runs]
      summary: Pause or resume the authenticated owner's Queue admission
      description: >-
        Exact CAS over the effective representation. The update serializes with
        every normal Stage admission; setting the current value is an
        idempotent no-op that retains its revision.
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/RequiredQueueControlIfMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOwnerQueueControlRequest'}
      responses:
        '200':
          description: Current owner Queue admission control
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerQueueControl'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs:
    post:
      operationId: createRun
      tags: [Runs]
      summary: Create an idempotent WorkflowRun
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
            example:
              workflow: artifact-copy@1
              parameters: {}
              artifacts:
                source: {namespace: projects, name: source, revision: revision-1}
      responses:
        '202':
          description: Run accepted; response-loss retry uses the same Idempotency-Key
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateRunResponse'}
              example:
                runId: run_example
                state: running
                runtimeLabels: []
                labels: {}
                runtimeConfiguration:
                  default:
                    label: default
                    bindingRevision: "1"
                    config:
                      name: contractor-empty
                      version: "1"
                      digest: sha256:80a1754c01f8443c29fdc8f650a2254b2461694819918b204a55a7ad3425dc5f
                  labels: []
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/RunSkillLimitExceeded'}
        '503': {$ref: '#/components/responses/RunCreationUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listRuns
      tags: [Runs]
      summary: List Runs owned by the authenticated principal
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/WorkflowRunState'}
        - name: lifecycle
          in: query
          required: false
          description: Read-only active or terminal state grouping applied before pagination.
          schema: {$ref: '#/components/schemas/WorkflowRunLifecycle'}
        - name: label
          in: query
          required: false
          style: form
          explode: true
          description: >-
            Repeat for an exact key/value conjunction. The first decoded '='
            separates the metadata-label key from its value; percent-encode
            value delimiters when constructing the URL.
          schema:
            type: array
            maxItems: 32
            items: {$ref: '#/components/schemas/RunMetadataLabelSelector'}
      responses:
        '200':
          description: Stable Run page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get authoritative Run state and ordered attempts
      responses:
        '200':
          description: Authoritative Run read model
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}
    delete:
      operationId: deleteRun
      tags: [Runs]
      summary: Permanently delete one released terminal Run and its Run-owned data
      description: >-
        Only terminal Runs whose Runtime allocations are fully released are
        deletable. UserScope and ProjectScope source Artifacts and independently
        published ProjectScope outputs are retained.
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}/attempts/{stageExecutionId}/runtime-diagnostics:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: stageExecutionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    get:
      operationId: getRunRuntimeDiagnostics
      tags: [Runs]
      summary: Inspect retained Runtime adapter diagnostics for an owned Stage attempt
      description: >-
        Reads only bounded Runtime projections from retained StageMetrics, including
        Eval-held metrics. Counters and durations are lossless decimal strings.
        Missing reports are not zero usage. No-store; read-only; selected Stage
        must belong to the owned Run. Cursor binds the retained metric generation;
        409 requires refreshing the first page. Report availability is diagnostic
        and never changes a Run outcome. No prompts or tool content are returned.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 10, default: 5}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page; pending/unavailable telemetry is explicit
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeDiagnosticPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}/attempts/{stageExecutionId}/tool-calls:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: stageExecutionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    get:
      operationId: getRunToolCalls
      tags: [Runs]
      summary: Inspect retained sanitized tool calls for one owned attempt participant
      description: >-
        Reads only one selected participant from retained StageMetrics, including
        Eval-held metrics. This is retained call detail, not a complete event history.
        Arguments are bounded canonical JSON TEXT; clients must render them without
        JSON.parse-to-number. Metrics are exact decimal strings; absent measurements
        are null. No wall-clock call timestamps, source call/report identities,
        results, provider content or URLs are exposed. Cursor binds the selected
        participant and retained metric generation; 409 requires a fresh first page.
      parameters:
        - name: participant
          in: query
          required: true
          schema: {type: string, enum: [planner, worker]}
        - name: logicalAgent
          in: query
          description: Required for worker; forbidden for planner.
          schema: {$ref: '#/components/schemas/ConfigId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A bounded page; pending/unavailable telemetry is explicit
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolDiagnosticPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}/repeat-draft:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunRepeatDraft
      tags: [Runs]
      summary: Project a terminal Run into a reviewed new-Run draft
      description: >-
        Reads immutable Run request provenance without creating or changing a
        Run. Original UserScope or ProjectScope revisions are returned only
        after owner and source-scope verification; frozen RunScope inputs are
        never presented as reusable sources. Audit-managed Runs return their
        owning Audit context without a draft. Ordinary drafts use stored Run
        settings and exact original input_fork source scopes and revisions.
        Missing required inputs or missing, ambiguous or unauthorized original
        provenance return a blocking input_provenance_invalid notice and no draft.
        Current source heads and edited Run input copies are never substituted.
      responses:
        '200':
          description: Sanitized repeat context and any required reviews
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunRepeatDraftResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/CredentialRecoveryRequired'}

  /v1/runs/{runId}/retry-gateway:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: retryRunGateway
      tags: [Runs]
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      summary: Reopen automatic model recovery for a waiting or queued Run
      description: Continues the existing invocation without replaying tools or creating a new stage attempt. Shared route recovery also unblocks other queued Runs using that route.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202':
          description: Recovery attempts enabled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runId]
                properties:
                  runId: {$ref: '#/components/schemas/ResourceId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: resumeRun
      tags: [Runs]
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      summary: Continue a failed Run with a new attempt of its failed stage
      description: >-
        Preserves successful stages, exact failed-stage inputs and pinned configuration.
        Requires completed allocation release. Audit-managed and evaluation Runs are excluded.
        stageExecutionId is both the expected failed attempt and the idempotency identity;
        repeating it returns the original continuation attempt, never another retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stageExecutionId]
              properties:
                stageExecutionId: {$ref: '#/components/schemas/ResourceId'}
      responses:
        '202':
          description: Continuation accepted or its original acceptance replayed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runId, sourceStageExecutionId, stageExecutionId]
                properties:
                  runId: {$ref: '#/components/schemas/ResourceId'}
                  sourceStageExecutionId: {$ref: '#/components/schemas/ResourceId'}
                  stageExecutionId: {$ref: '#/components/schemas/ResourceId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}
  /v1/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: Request cancellation of a non-terminal Run
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
            example: {reason: Requested by the operator}
      responses:
        '200':
          description: Run was already terminal or cancellation was already settled
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        '202':
          description: Cancellation accepted and cleanup is in progress
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/runs/{runId}/outputs/{slot}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/ArtifactSlot'
    get:
      operationId: downloadRunOutput
      tags: [Runs, Artifacts]
      summary: Download one frozen Workflow output
      responses:
        '200': {$ref: '#/components/responses/ArtifactBytes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ArtifactUnavailable'}

  /v1/runs/{runId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listRunArtifacts
      tags: [Runs, Artifacts]
      summary: List exact input, intermediate, and output bindings in one owned RunScope
      parameters:
        - name: namespace
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ArtifactName'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable RunScope Artifact page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
