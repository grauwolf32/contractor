    SitemapDocument:
      type: object
      additionalProperties: false
      required:
      - version
      - projection
      - groups
      - sources
      - rules
      - markers
      - gaps
      properties:
        version:
          type: string
          enum:
          - project-sitemap@1
        projection:
          type: string
          enum:
          - sitemap-safe-projection@1
        groups:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/SitemapGroup'
        sources:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/SitemapSource'
        rules:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/SitemapRule'
        markers:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/SitemapMarker'
        gaps:
          type: array
          maxItems: 2064
          items:
            $ref: '#/components/schemas/SitemapGap'
    SitemapGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - origin
      - method
      - route
      - structural
      - members
      - declarations
      - omitted
      properties:
        id:
          type: string
          maxLength: 8192
        origin:
          type: string
          maxLength: 8192
        method:
          type: string
          pattern: ^[A-Z]{1,16}$
          maxLength: 16
        route:
          type: string
          maxLength: 8192
        structural:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SitemapStructuralValue'
        members:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/SitemapMember'
        declarations:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/SitemapDeclaration'
        omitted:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    SitemapMember:
      type: object
      additionalProperties: false
      required:
      - id
      - path
      - summaries
      - examples
      - evidence
      - annotations
      - omitted
      properties:
        id:
          type: string
          maxLength: 8192
        path:
          type: string
          maxLength: 8192
        summaries:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SitemapSummary'
        examples:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 8192
        evidence:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SitemapEvidence'
        annotations:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/SitemapAnnotation'
        omitted:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    SitemapProvenance:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - kind
      properties:
        sourceId:
          $ref: '#/components/schemas/ResourceId'
        kind:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          description: Source label using the shared name grammar. Observed sources are extensible; manual and openapi identify domain editing and declaration provenance.
        deployment:
          $ref: '#/components/schemas/ResourceId'
    SitemapSummary:
      type: object
      additionalProperties: false
      required:
      - provenance
      - outcome
      - status
      - parameters
      - first
      - last
      properties:
        provenance:
          $ref: '#/components/schemas/SitemapProvenance'
        outcome:
          type: string
          maxLength: 8192
        status:
          type: integer
          minimum: 0
        parameters:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
        first:
          type: string
          maxLength: 8192
        last:
          type: string
          maxLength: 8192
    SitemapEvidence:
      type: object
      additionalProperties: false
      required:
      - runId
      - artifact
      properties:
        runId:
          $ref: '#/components/schemas/ResourceId'
        artifact:
          $ref: '#/components/schemas/SitemapExactArtifact'
    SitemapAnnotation:
      type: object
      additionalProperties: false
      required:
      - provenance
      - note
      - tags
      properties:
        provenance:
          $ref: '#/components/schemas/SitemapProvenance'
        note:
          type: string
          maxLength: 4096
          x-max-utf8-bytes: 4096
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
    SitemapDeclaration:
      type: object
      additionalProperties: false
      required:
      - rule
      - provenance
      - pointer
      - parameters
      properties:
        rule:
          type: boolean
        provenance:
          $ref: '#/components/schemas/SitemapProvenance'
        pointer:
          type: string
          maxLength: 2048
          x-max-utf8-bytes: 2048
        parameters:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
    SitemapSource:
      type: object
      additionalProperties: false
      required:
      - provenance
      - generation
      - policyDigest
      properties:
        provenance:
          $ref: '#/components/schemas/SitemapProvenance'
        generation:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        artifact:
          $ref: '#/components/schemas/SitemapExactArtifact'
        policyDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
    SitemapRule:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - origin
      - method
      - path
      - pointer
      - parameters
      - structural
      properties:
        sourceId:
          $ref: '#/components/schemas/ResourceId'
        origin:
          type: string
          maxLength: 8192
        method:
          type: string
          pattern: ^[A-Z]{1,16}$
          maxLength: 16
        path:
          type: string
          maxLength: 8192
        pointer:
          type: string
          maxLength: 2048
          x-max-utf8-bytes: 2048
        parameters:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
        structural:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SitemapStructuralParameter'
    SitemapStructuralParameter:
      type: object
      additionalProperties: false
      required:
      - name
      - allowed
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          x-max-utf8-bytes: 64
        allowed:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
          minItems: 1
    SitemapStructuralValue:
      type: object
      additionalProperties: false
      required:
      - name
      - values
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          x-max-utf8-bytes: 64
        values:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
    SitemapMarker:
      type: object
      additionalProperties: false
      required:
      - id
      - members
      - provenance
      properties:
        id:
          type: string
          maxLength: 8192
        members:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 8192
        provenance:
          $ref: '#/components/schemas/SitemapProvenance'
    SitemapGap:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - reason
      - count
      properties:
        sourceId:
          oneOf:
          - type: string
            const: ''
          - $ref: '#/components/schemas/ResourceId'
        reason:
          type: string
          enum:
          - structural
          - members
          - groups
          - summaries
          - examples
          - regrouping
          - incomplete
          - parameters
          - source-unavailable
          - ambiguous
          - projection
          - report-truncated
          - request-errors
          - evidence
        count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    SitemapMutation:
      type: object
      additionalProperties: false
      required:
      - operation
      properties:
        operation:
          type: string
          enum:
          - declare
          - annotate
          - remove
          - restore
          - replace-source
        expectedRevision:
          $ref: '#/components/schemas/ResourceId'
        url:
          type: string
          maxLength: 8192
          x-max-utf8-bytes: 8192
        method:
          type: string
          pattern: ^[A-Z]{1,16}$
          maxLength: 16
        memberIds:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 64
            pattern: ^[0-9a-f]{64}$
        note:
          type: string
          maxLength: 4096
          x-max-utf8-bytes: 4096
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
            x-max-utf8-bytes: 64
        markerId:
          $ref: '#/components/schemas/ResourceId'
        source:
          $ref: '#/components/schemas/SitemapSourceUpdate'
    SitemapSourceUpdate:
      type: object
      additionalProperties: false
      required:
      - rules
      properties:
        expected:
          $ref: '#/components/schemas/SitemapSource'
        rules:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/SitemapEditorRule'
    SitemapEditorRule:
      type: object
      description: >-
        Server validates origin and path together: their combined UTF-8 size
        must not exceed 8192 bytes (LIM-SMT-2). Each part also stays within
        that bound; unused bytes in one part are available to the other.
        Invalid routes return 400 invalid_request. Origin must be a canonical
        HTTP(S) origin and path must start with '/' and contain no query or fragment.
      additionalProperties: false
      required:
      - origin
      - method
      - path
      - pointer
      - parameters
      - structural
      properties:
        origin:
          type: string
          maxLength: 8192
          x-max-utf8-bytes: 8192
        method:
          type: string
          pattern: ^[A-Z]{1,16}$
          maxLength: 16
        path:
          type: string
          maxLength: 8192
          x-max-utf8-bytes: 8192
        pointer:
          type: string
          maxLength: 2048
          x-max-utf8-bytes: 2048
        parameters:
          type: array
          maxItems: 100
