        workflow: {$ref: '#/components/schemas/Selector'}
        state: {$ref: '#/components/schemas/WorkflowRunState'}
        deletable:
          type: boolean
          description: True only when terminal release and every applicable retention receipt are durable.
        runtimeLabels:
          description: >-
            Selected Runtime labels in lexical order; never the reserved default
            label (RCF-R118).
          type: array
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/ConfigId'}
        labels: {$ref: '#/components/schemas/RunMetadataLabels'}
        runtimeConfiguration: {$ref: '#/components/schemas/RunRuntimeConfiguration'}
        projectHttpTarget: {$ref: '#/components/schemas/ProjectHTTPTarget'}
        cancellation: {$ref: '#/components/schemas/Cancellation'}
        parameters:
          type: object
          additionalProperties: {type: string}
        inputs:
          type: object
          additionalProperties: {$ref: '#/components/schemas/ExactArtifactRef'}
        attempts:
          type: array
