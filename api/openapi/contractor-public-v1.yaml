        outcome: {$ref: '#/components/schemas/StageExecutionState'}
        finishedAt: {type: string, format: date-time}
        collectionPolicy: {type: string, enum: [requested, disabled, unsupported]}
        status: {type: string, enum: [disabled, unsupported, pending, available, partial, unavailable]}
        reason:
          description: >-
            Why resources are partial or unavailable. `report_missing`: the
            released allocation has no report with usable resources;
            `report_expired`: its report was received and has since expired
            under the 30-day telemetry retention.
          type: string
          enum: [unsupported_platform, read_failed, sampling_gap, counter_reset, invalid_report, report_missing, report_expired]
        resources: {$ref: '#/components/schemas/RuntimeResourceSummary'}
      example:
        allocationId: allocation-example
        runId: run-example
        stageExecutionId: stage-example
        stage: analyze
        logicalAgent: builder
        outcome: succeeded
        finishedAt: '2026-09-06T10:00:00Z'
        collectionPolicy: requested
        status: unavailable
        reason: report_missing
