          content: {application/json: {schema: {$ref: '#/components/schemas/AuditWorkspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/audits/{auditId}/findings:
    parameters:
    - $ref: '#/components/parameters/AuditId'
    get:
      operationId: listAuditFindings
      tags:
      - Audits
      summary: List canonical Project Findings associated with this Audit
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: auditRevision
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Pin this page to the summary revision. Continuations bind owner, filters and revision; stale
          revisions return 409.
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FindingState'
      - name: verdict
        in: query
        required: false
        schema:
          type: string
          enum:
