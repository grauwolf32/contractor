  /v1/operations/settings/models:
    get:
      operationId: getModelSelection
      tags: [Operations]
      summary: Get deployed model choices and durable model defaults
      description: >-
        Returns deployed immutable model routes and the saved default/per-role
        selection. An absent compiled catalog returns configured=false and an
        empty models array. The strong ETag binds both selection revision and
        catalog digest. Transient storage conflicts return 503 storage_transaction_conflict.
      responses:
        '200':
          description: Current model defaults and deployed choices
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSelectionInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}
    put:
      operationId: putModelSelection
      tags: [Operations]
      summary: Replace model defaults for new Runs and Audits
      description: >-
        Changes model defaults for newly resolved executions. Explicit Run/Eval
        policy selections win; active Runs and prepared Eval model selections
        remain pinned. Unknown or incompatible models reject the whole change.
        Replacing equal values at the current ETag is a no-op. Revision or catalog
        mismatch returns 412. Transient storage conflicts return 503 storage_transaction_conflict.
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/RequiredModelSelectionIfMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelSelectionValue'}
      responses:
        '200':
          description: Current model defaults and deployed choices after replacement or exact no-op
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSelectionInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

