        range: {$ref: '#/components/schemas/FindingLineRange'}
      not: {required: [line, range]}
      description: Exact relative POSIX path; line and range are mutually exclusive.
    FindingWebLocation:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, minLength: 1, maxLength: 8192}
        method: {type: string, minLength: 1, maxLength: 64}
      description: HTTP/HTTPS URL without userinfo; method is an explicit HTTP token.
    FindingLocation:
      oneOf:
        - {$ref: '#/components/schemas/FindingSourceLocation'}
        - {$ref: '#/components/schemas/FindingWebLocation'}
    FindingHTTPHeader:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string}
    FindingHTTPAttempt:
      type: object
      additionalProperties: false
      required: [method, url, headers, body_base64]
      properties:
        method: {type: string, minLength: 1, maxLength: 64}
        url: {type: string, minLength: 1, maxLength: 8192}
        headers:
          type: array
          items: {$ref: '#/components/schemas/FindingHTTPHeader'}
        body_base64: {type: string, description: Canonical base64 of up to 1 MiB of outgoing bytes.}
        status: {type: integer, minimum: 100, maximum: 599}
        response_headers:
          type: array
          items: {$ref: '#/components/schemas/FindingHTTPHeader'}
        error: {type: string, enum: [transport_error, cancelled]}
      oneOf:
        - required: [status]
          not: {required: [error]}
        - required: [error]
          not: {required: [status]}
      description: Exactly one of status or error; each header block is at most 64 KiB.
    FindingHTTPExchange:
      type: object
      additionalProperties: false
      required: [request_id, request_tag, attempts]
      properties:
        request_id: {type: integer, minimum: 1, maximum: 9007199254740991}
        request_tag: {type: string, minLength: 1, maxLength: 160}
        attempts:
          type: array
          minItems: 1
          maxItems: 13
          description: Existing HTTP budget of ten redirects plus three attempts.
          items: {$ref: '#/components/schemas/FindingHTTPAttempt'}
        response_body_evidence_id:
          type: string
          description: Must identify a member of this proposal's evidence_ids.
