        id: {type: string, pattern: '^GPU-[0-9a-fA-F-]{1,64}$', maxLength: 68}
        name: {type: string, minLength: 1, maxLength: 128}
        utilizationPercent: {type: number, minimum: 0, maximum: 100}
        memoryUsedBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        memoryTotalBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        temperatureCelsius: {$ref: '#/components/schemas/PerformanceNumber'}
        powerWatts: {$ref: '#/components/schemas/PerformanceNumber'}
        powerLimitWatts: {$ref: '#/components/schemas/PerformanceNumber'}
    PerformanceGPUAggregate:
      type: object
      additionalProperties: false
      required: [freshness, devices]
      description: NVIDIA devices visible to the Server host, including other applications. Unsupported metrics are omitted. Device UUIDs keep history separate across reorder or replacement.
      properties:
        freshness: {$ref: '#/components/schemas/PerformanceFreshness'}
        devices:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/PerformanceGPUDeviceGauges'}
    PerformanceGPUDeviceGauges:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, pattern: '^GPU-[0-9a-fA-F-]{1,64}$', maxLength: 68}
        name: {type: string, minLength: 1, maxLength: 128}
        utilizationPercent: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
        memoryUsedBytes: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
        memoryTotalBytes: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
        temperatureCelsius: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
        powerWatts: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
        powerLimitWatts: {$ref: '#/components/schemas/PerformanceGaugeSummary'}
    PerformanceSample:
