    RuntimeResourceSummary:
      type: object
      additionalProperties: false
      required: [version, scope, status]
      oneOf:
        - properties:
            status: {type: string, const: complete}
            rssSampleCount: {minimum: 2}
            maxSampleGapSeconds: {maximum: 30}
          required: [durationSeconds, cpuUserSeconds, cpuSystemSeconds, rssStartBytes, rssEndBytes, rssPeakObservedBytes, rssSampleCount, maxSampleGapSeconds]
          not: {required: [reason]}
        - properties:
            status: {type: string, enum: [partial, unavailable]}
      description: Allocation-local CPU deltas and observed RSS of the entire Runtime process, not child/container resources or a guaranteed RSS peak. Unknowns are omitted. Go/Python additionally validate boundary/count/peak and duration/gap consistency.
      properties:
        version: {type: integer, const: 1}
        scope: {type: string, const: runtime_process}
        status: {type: string, enum: [complete, partial, unavailable]}
        reason: {type: string, enum: [unsupported_platform, read_failed, sampling_gap, counter_reset, invalid_report]}
        durationSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        cpuUserSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        cpuSystemSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
        rssStartBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        rssEndBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        rssPeakObservedBytes: {$ref: '#/components/schemas/PerformanceInteger'}
        rssSampleCount: {$ref: '#/components/schemas/PerformanceInteger'}
        maxSampleGapSeconds: {$ref: '#/components/schemas/PerformanceNumber'}
    AllocationResourceSummary:
      type: object
      additionalProperties: false
      required: [allocationId, runId, stageExecutionId, stage, logicalAgent, outcome, finishedAt, collectionPolicy, status]
      properties:
        allocationId: {$ref: '#/components/schemas/ResourceId'}
        runId: {$ref: '#/components/schemas/ResourceId'}
        stageExecutionId: {$ref: '#/components/schemas/ResourceId'}
        stage: {$ref: '#/components/schemas/ConfigId'}
