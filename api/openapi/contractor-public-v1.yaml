      not:
        anyOf:
          - {pattern: '^0000-'}
          - {pattern: '^0001-01-01T00:00:00(\.0{1,9})?Z$'}
      readOnly: true
    ArtifactStorageTimestamps:
      type: object
      additionalProperties: false
      readOnly: true
      required: [scopeCreatedAt, blobCreatedAt, versionCreatedAt, bindingUpdatedAt]
