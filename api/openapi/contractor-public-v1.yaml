openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: Contractor Public API
  version: 1.0.0
  x-contractor-api-version: contractor.public.v1
  summary: Authenticated Workflow, Artifact, Run, and Operations API
  description: |
    Public single-VM Contractor API v1. This contract contains browser-safe and
    non-browser surfaces only. Runtime Agent control, allocation-scoped
    Artifact access, A2A, mTLS identities, model prompts, raw tool payloads,
    provider bodies, and credential material are deliberately absent.

    Operations tagged `implemented` exist in the current Go Server. Operations
    tagged `planned` reserve the first Operations/UI slice contract and return
    no implementation guarantee until their corresponding task lands.
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:8080
    description: Loopback development Server

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - {name: Auth, description: Local browser-session lifecycle}
  - {name: Workflows, description: Published Workflow contracts}
  - {name: Projects, description: Owner-scoped reusable artifact workspaces}
  - {name: Queue, description: Owner-scoped non-terminal WorkflowRun projection}
  - {name: Runs, description: User-owned Workflow executions}
  - {name: Artifacts, description: User and Run artifact views}
  - {name: Configuration, description: Immutable published configuration}
  - {name: Credentials, description: Secret-free managed Gateway credentials}
  - {name: Operations, description: Read-only Runtime Agent and allocation state}
  - {name: Events, description: Read-only WebSocket upgrade}

paths:
  /v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Create a local browser session
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 2048
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/LoginSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Recover the safe principal and session-bound CSRF token
      x-contractor-implementation: implemented
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/CurrentSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Destroy the current browser session
      x-contractor-implementation: implemented
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': {$ref: '#/components/responses/LogoutNoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/workflows:
    get:
      operationId: listWorkflows
      tags: [Workflows]
      summary: List published Workflow versions
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable Workflow page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/workflows/{name}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ConfigName'
      - $ref: '#/components/parameters/ConfigVersion'
    get:
      operationId: getWorkflow
      tags: [Workflows]
      summary: Get one exact Workflow contract
      x-contractor-implementation: implemented
      responses:
        '200':
          description: Exact Workflow contract
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create an idempotent owner-scoped Project
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
            example: {kind: project, name: Payment service, description: Reusable service analysis}
      responses:
        '201':
          description: Project created or exact idempotency replay
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List Projects owned by the authenticated principal
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ProjectKind'}
      responses:
        '200':
          description: Stable newest-first Project page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get one owned Project
      x-contractor-implementation: implemented
      responses:
        '200':
          description: Current Project metadata
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: CAS-update Project display metadata
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: Updated Project metadata
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectArtifacts
      tags: [Projects, Artifacts]
      summary: List current Artifact bindings in one owned ProjectScope
      x-contractor-implementation: implemented
      parameters:
        - name: namespace
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ArtifactName'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable ProjectScope Artifact page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/artifacts/{namespace}/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactNamespace'
      - $ref: '#/components/parameters/ArtifactName'
    put:
      operationId: putProjectArtifact
      tags: [Projects, Artifacts]
      summary: Create or CAS-update a ProjectScope Artifact
      description: |
        `If-None-Match: *` creates a new binding. One strong quoted `If-Match`
        revision updates an existing binding. Supplying both is invalid.
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 16777216
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, format: binary, maxLength: 16777216}
      responses:
        '200': {$ref: '#/components/responses/ArtifactWritten'}
        '201': {$ref: '#/components/responses/ArtifactCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: downloadProjectArtifact
      tags: [Projects, Artifacts]
      summary: Download the current or one exact ProjectScope Artifact revision
      x-contractor-implementation: implemented
      parameters:
        - name: revision
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Revision'}
      responses:
        '200': {$ref: '#/components/responses/ArtifactBytes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/artifacts/{namespace}/{name}/metadata:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactNamespace'
      - $ref: '#/components/parameters/ArtifactName'
    get:
      operationId: getProjectArtifactMetadata
      tags: [Projects, Artifacts]
      summary: Get current or exact ProjectScope Artifact metadata
      x-contractor-implementation: implemented
      parameters:
        - name: revision
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Revision'}
      responses:
        '200':
          description: ProjectScope Artifact metadata without bytes
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactMetadata'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/artifacts/{namespace}/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactNamespace'
      - $ref: '#/components/parameters/ArtifactName'
    get:
      operationId: listProjectArtifactVersions
      tags: [Projects, Artifacts]
      summary: List immutable versions of one ProjectScope Artifact binding
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable ProjectScope Artifact version page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/artifacts/{namespace}/{name}/lineage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactNamespace'
      - $ref: '#/components/parameters/ArtifactName'
    get:
      operationId: getProjectArtifactLineage
      tags: [Projects, Artifacts]
      summary: List bounded provenance edges for one ProjectScope Artifact binding
      x-contractor-implementation: implemented
      parameters:
        - name: revision
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Revision'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable ProjectScope lineage page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactLineagePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/projects/{projectId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createProjectRun
      tags: [Projects, Runs]
      summary: Create an idempotent WorkflowRun from exact ProjectScope inputs
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Project Run accepted with its exact inputs isolated in RunScope
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateRunResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listProjectRuns
      tags: [Projects, Runs]
      summary: List Runs that were launched from one owned Project
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/WorkflowRunState'}
        - name: label
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 32
            items: {type: string, minLength: 3, maxLength: 320, pattern: '^[^=]+=.+'}
      responses:
        '200':
          description: Stable newest-first Project Run page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/queue:
    get:
      operationId: listRunQueue
      tags: [Queue, Runs]
      summary: List the authenticated owner's non-terminal WorkflowRuns
      description: >-
        Stable oldest-created-first display projection. This order is not a
        Scheduler rank, execution priority, estimated start time, or claim.
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/NonTerminalWorkflowRunState'}
        - name: membership
          in: query
          required: false
          schema: {$ref: '#/components/schemas/RunQueueMembership'}
      responses:
        '200':
          description: Stable oldest-created-first non-terminal Run page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunQueuePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/runs:
    post:
      operationId: createRun
      tags: [Runs]
      summary: Create an idempotent WorkflowRun
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
            example:
              workflow: artifact-copy@1
              parameters: {}
              artifacts:
                source: {namespace: projects, name: source, revision: revision-1}
      responses:
        '202':
          description: Run accepted; response-loss retry uses the same Idempotency-Key
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateRunResponse'}
              example:
                runId: run_example
                state: running
                runtimeLabels: []
                labels: {}
                runtimeConfiguration:
                  default:
                    label: default
                    bindingRevision: "1"
                    config:
                      name: contractor-empty
                      version: "1"
                      digest: sha256:80a1754c01f8443c29fdc8f650a2254b2461694819918b204a55a7ad3425dc5f
                  labels: []
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listRuns
      tags: [Runs]
      summary: List Runs owned by the authenticated principal
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/WorkflowRunState'}
        - name: label
          in: query
          required: false
          style: form
          explode: true
          description: >-
            Repeat for an exact key/value conjunction. The first decoded '='
            separates the metadata-label key from its value; percent-encode
            value delimiters when constructing the URL.
          schema:
            type: array
            maxItems: 32
            items: {type: string, minLength: 3, maxLength: 320, pattern: '^[^=]+=.+'}
      responses:
        '200':
          description: Stable Run page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get authoritative Run state and ordered attempts
      x-contractor-implementation: implemented
      responses:
        '200':
          description: Authoritative Run read model
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: Request cancellation of a non-terminal Run
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
            example: {reason: Requested by the operator}
      responses:
        '200':
          description: Run was already terminal or cancellation was already settled
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        '202':
          description: Cancellation accepted and cleanup is in progress
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/runs/{runId}/outputs/{slot}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/ArtifactSlot'
    get:
      operationId: downloadRunOutput
      tags: [Runs, Artifacts]
      summary: Download one frozen Workflow output
      x-contractor-implementation: implemented
      responses:
        '200': {$ref: '#/components/responses/ArtifactBytes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/runs/{runId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listRunArtifacts
      tags: [Runs, Artifacts]
      summary: List exact input, intermediate, and output bindings in one owned RunScope
      x-contractor-implementation: implemented
      parameters:
        - name: namespace
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ArtifactName'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable RunScope Artifact page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
