    AuthPrincipal:
      type: object
      additionalProperties: false
      required: [userId, username, capabilities]
      properties:
        userId: {$ref: '#/components/schemas/ConfigId'}
        username: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'}
        capabilities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, enum: [user, operations]}
    AuthSession:
      type: object
