  /v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectArtifacts
      tags: [Projects, Artifacts]
      summary: List current Artifact bindings in one owned ProjectScope
      description: |
        Default order is namespace and name. With `order=material`, current
        bindings follow source code, API spec, engagement, architecture, docs,
        diffs, then Other, with namespace/name tie breakers. Git provenance
        takes precedence, then the suggested namespace, then purpose-specific
        media type. Priority is applied before the limit. Cursors bind the
        Project, namespace filter and order; they do not pin a snapshot.
        Without a namespace filter, historical-* migration archives are hidden
        before pagination. Select an archive namespace explicitly to list it.
        Audit-managed namespaces remain hidden.
      parameters:
        - name: order
          in: query
          required: false
          schema: {type: string, enum: [material]}
        - name: namespace
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ArtifactName'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable ProjectScope Artifact page
          headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StorageTransactionConflict'}

  /v1/projects/{projectId}/artifacts/{namespace}/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactNamespace'
      - $ref: '#/components/parameters/ArtifactName'
    put:
      operationId: putProjectArtifact
      tags: [Projects, Artifacts]
      summary: Create or CAS-update a ProjectScope Artifact
      description: |
        `If-None-Match: *` creates a new binding. One strong quoted `If-Match`
        revision updates an existing binding. Supplying both is invalid.
      x-max-request-body-bytes: 67108864
      parameters:
        - $ref: '#/components/parameters/ArtifactIfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, format: binary, maxLength: 67108864}
      responses:
        '200': {$ref: '#/components/responses/ArtifactWritten'}
        '201': {$ref: '#/components/responses/ArtifactCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ArtifactWriteConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ArtifactWriteUnavailable'}
    get:
      operationId: downloadProjectArtifact
      tags: [Projects, Artifacts]
      summary: Download the current or one exact ProjectScope Artifact revision
      parameters:
        - name: revision
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Revision'}
      responses:
        '200': {$ref: '#/components/responses/ArtifactBytes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ArtifactUnavailable'}

