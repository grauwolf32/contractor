        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/runtime-agent-principals/{runtimeAgentId}/labels:
    parameters:
      - $ref: '#/components/parameters/RuntimeAgentId'
    put:
      operationId: replaceRuntimeAgentPrincipalLabels
      tags: [Operations]
      summary: CAS-replace the complete authoritative label set of one principal
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeAgentLabelsMutation'}
      responses:
        '200':
          description: Updated authoritative label set; an active allocation remains unchanged
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeAgentPrincipal'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/credentials:
    get:
      operationId: listCredentials
      tags: [Credentials]
      summary: List active secret-free credential records
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stable active credential page
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createCredential
      tags: [Credentials]
      summary: Create one Gateway-managed credential without accepting token bytes
      x-contractor-implementation: implemented
      x-max-request-body-bytes: 1048576
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCredentialRequest'}
      responses:
        '201':
          description: Active secret-free credential metadata; token is never returned
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/GatewayUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    get:
      operationId: getCredential
      tags: [Credentials]
      summary: Get one active secret-free credential record
      x-contractor-implementation: implemented
      responses:
        '200':
          description: Active credential metadata
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: Delete an unpinned active credential and its remote virtual key
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalOrigin'
        - $ref: '#/components/parameters/OptionalCSRFToken'
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CredentialInUse'}
        '502': {$ref: '#/components/responses/GatewayUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/snapshot:
    get:
      operationId: getOperationsSnapshot
      tags: [Operations]
      summary: Get one coherent Runtime Agent and allocation observation snapshot
      x-contractor-implementation: implemented
      responses:
        '200':
          description: Process-generation-bound Operations snapshot
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsSnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/runtime-agents:
    get:
      operationId: listRuntimeAgents
      tags: [Operations]
      summary: List Runtime Agent observations from one coherent snapshot
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Runtime Agent page with snapshot cursor
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeAgentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/operations/allocations:
    get:
      operationId: listAllocations
      tags: [Operations]
      summary: List authoritative and observed allocation state
      x-contractor-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Allocation page with snapshot cursor
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllocationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/events/ws:
    get:
      operationId: connectEventsWebSocket
      tags: [Events]
      summary: Upgrade to the read-only contractor.events.v1 WebSocket
      description: |
        Requires an authenticated browser session, an exact allowed Origin,
        and `Sec-WebSocket-Protocol: contractor.events.v1`. No CSRF token or
        cursor appears in the URL. Client frames are at most 16 KiB; Server
        frames are at most 64 KiB. One socket permits 32 subscriptions and a
        256-frame/1-MiB output queue. Slow consumers close with status 1013.
      externalDocs:
        description: Exact closed client and Server frame schema
        url: ../events/contractor-events-v1.schema.json
      x-contractor-implementation: implemented
      x-websocket-subprotocol: contractor.events.v1
      x-websocket-message-schema: ../events/contractor-events-v1.schema.json
      x-max-client-frame-bytes: 16384
      x-max-server-frame-bytes: 65536
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: {type: string, const: contractor.events.v1}
      responses:
        '101':
          description: Switching Protocols; subsequent data is governed by the linked JSON Schema
          headers:
            X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
            Sec-WebSocket-Protocol:
              required: true
              schema: {type: string, const: contractor.events.v1}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Non-browser bootstrap authentication. Tokens never appear in URLs or bodies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-contractor_session
      description: Secure HttpOnly browser session. Loopback development uses a separately named cookie.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    ArtifactNamespace:
      name: namespace
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ArtifactName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ArtifactSlot:
      name: slot
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ConfigName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigId'}
    ConfigVersion:
      name: version
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigVersion'}
    ConfigurationKind:
      name: kind
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigurationKind'}
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigId'}
    RuntimeConfigName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
    RuntimeConfigVersion:
      name: version
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeConfigVersion'}
    RuntimeLabel:
      name: label
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
    RuntimeCredentialId:
      name: credentialId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeCredentialId'}
    RuntimeAgentId:
      name: runtimeAgentId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string, pattern: '^"[^"\\]+"$'}
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]{0,19}"$'}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string, const: '*'}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri, maxLength: 2048}
    OptionalOrigin:
      name: Origin
      in: header
      required: false
      description: Required with exact allowlist match when sessionCookie authenticates an unsafe request.
      schema: {type: string, format: uri, maxLength: 2048}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$'}
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for sessionCookie authentication; omitted for bearerAuth.
      schema: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512}

  headers:
    ContractorAPIVersion:
      required: true
      schema: {type: string, const: contractor.public.v1}
    RequestId:
      required: true
      schema: {$ref: '#/components/schemas/RequestId'}
    ETag:
      required: true
      schema: {type: string, pattern: '^"[^"\\]+"$'}
    ContentDisposition:
      required: false
      schema: {type: string, maxLength: 1024}
    IdempotencyReplayed:
      required: false
      schema: {type: string, const: 'true'}
    NoStore:
      required: true
      schema: {type: string, const: no-store}
  responses:
    NoContent:
      description: Mutation completed with no response body
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
    LogoutNoContent:
      description: Browser session was destroyed and its cookie cleared
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
        Set-Cookie:
          required: true
          schema: {type: string, maxLength: 1024}
    LoginSession:
      description: Safe browser session view and newly issued opaque cookie
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
        Set-Cookie:
          required: true
          schema: {type: string, maxLength: 1024}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    CurrentSession:
      description: Safe current browser session view
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    ArtifactWritten:
      description: Existing Artifact binding advanced by exact CAS
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ArtifactWriteResponse'}
    ArtifactCreated:
      description: New Artifact binding created
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ArtifactWriteResponse'}
    ArtifactBytes:
      description: Original artifact bytes
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
        Content-Length:
          required: true
          schema: {type: integer, minimum: 0, maximum: 16777216}
        Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
      content:
        '*/*':
          schema: {type: string, format: binary, maxLength: 16777216}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    Conflict: {$ref: '#/components/responses/Error409'}
    PreconditionFailed: {$ref: '#/components/responses/Error412'}
    PayloadTooLarge: {$ref: '#/components/responses/Error413'}
    RateLimited:
      description: Bounded process-local rate or socket limit
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 60}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CredentialInUse:
      description: One or more non-terminal Runs pin the credential
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuntimeLabelWritten:
      description: Current binding after create, rebind, or exact replay
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RuntimeLabelBinding'}
    GatewayUnavailable:
      description: Bounded managed-Gateway operation failure
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError: {$ref: '#/components/responses/Error500'}
    Error400:
      description: Request does not satisfy the API contract
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error401:
      description: Authentication is absent or invalid
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        WWW-Authenticate:
          required: false
          schema: {type: string, maxLength: 128}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error403:
      description: Authenticated principal lacks permission or CSRF/Origin validation failed
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error404:
      description: Resource is absent or not owned by the principal
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error409:
      description: Immutable identity, idempotency body, or CAS state conflicts
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error412:
      description: Strong revision precondition did not match current state
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error413:
      description: Artifact exceeds the 16 MiB limit
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error500:
      description: Safe internal failure without raw cause
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
    ResourceId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
    ProjectKind:
      type: string
      enum: [project, evaluation]
    RunQueueMembership:
      type: string
      enum: [standalone, project, evaluation]
    AuditActor:
      type: string
      minLength: 1
      maxLength: 256
    ConfigId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
    RunMetadataLabels:
      type: object
      maxProperties: 32
      propertyNames:
        allOf:
          - type: string
            minLength: 1
            maxLength: 63
            pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
          - not: {pattern: '^contractor\.'}
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 256
        description: Opaque non-NUL UTF-8 value bounded by the Server to 256 encoded bytes.
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {$ref: '#/components/schemas/ProjectKind'}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4096}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4096}
        httpTarget:
          oneOf:
            - {$ref: '#/components/schemas/ProjectHTTPTarget'}
            - {type: 'null'}
    HTTPOriginCredentialRef:
      type: object
      additionalProperties: false
      required: [credentialId, kind]
      properties:
        credentialId: {$ref: '#/components/schemas/RuntimeCredentialId'}
        kind: {enum: [http-origin-basic@1, http-origin-bearer@1]}
    ProjectHTTPTarget:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, minLength: 8, maxLength: 2048}
        credential: {$ref: '#/components/schemas/HTTPOriginCredentialRef'}
    Project:
      type: object
      additionalProperties: false
      required: [projectId, kind, name, description, revision, createdAt, updatedAt]
      properties:
        projectId: {$ref: '#/components/schemas/ResourceId'}
        kind: {$ref: '#/components/schemas/ProjectKind'}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4096}
        httpTarget: {$ref: '#/components/schemas/ProjectHTTPTarget'}
        revision: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Project'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RuntimeInfrastructureId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z][a-z0-9_-]*$'
    RuntimeCredentialId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z][a-z0-9_-]*$'
    RuntimeConfigVersion:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
    ConfigVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
    Selector:
      type: string
      minLength: 3
      maxLength: 193
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*@[A-Za-z0-9][A-Za-z0-9_.-]*$'
    RuntimeCapabilityRef:
      type: string
      minLength: 3
      maxLength: 256
      pattern: '^[a-z][a-z0-9_-]*@[A-Za-z0-9][A-Za-z0-9._+-]*$'
    InstructionPath:
      type: string
      minLength: 14
      maxLength: 512
      pattern: '^instructions/(?:[A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+$'
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Revision:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
    ArtifactName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
    MediaType:
      oneOf:
        - {type: string, const: '*/*'}
