components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Non-browser bootstrap authentication. Tokens never appear in URLs or bodies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-contractor_session
      description: Secure HttpOnly browser session. Loopback development uses a separately named cookie.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    ArtifactNamespace:
      name: namespace
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ArtifactName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ArtifactSlot:
      name: slot
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ArtifactName'}
    ConfigName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigurationName'}
    ConfigVersion:
      name: version
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigVersion'}
    ConfigurationKind:
      name: kind
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigurationKind'}
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConfigId'}
    RuntimeConfigName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
    RuntimeConfigVersion:
      name: version
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeConfigVersion'}
    RuntimeLabel:
      name: label
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeInfrastructureId'}
    RuntimeCredentialId:
      name: credentialId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuntimeCredentialId'}
    RuntimeAgentId:
      name: runtimeAgentId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    AuditId:
      name: auditId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    FindingId:
      name: findingId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Binds this exact request. Repeating it with the same key replays the original result; sending a different request with the key is the permanent 409 `idempotency_conflict` (retryable false), and only a new key can carry the changed request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Accepted for uniform mutation headers; the operation is idempotent by resource identity and does not bind the key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: One strong quoted positive decimal revision, as `RequiredIfMatch`. Any other value is 400 `invalid_request`, never a CAS conflict.
      schema: {type: string, pattern: '^"[1-9][0-9]{0,19}"$'}
    ArtifactIfMatch:
      name: If-Match
      in: header
      required: false
      description: One strong quoted Artifact revision in the `Revision` grammar. A malformed revision is 400 `invalid_request`, never a CAS conflict.
      schema: {type: string, minLength: 3, maxLength: 258, pattern: '^"[A-Za-z0-9][A-Za-z0-9_.:-]*"$'}
    RequiredModelSelectionIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]{0,19}:[0-9a-f]{64}"$'}
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]{0,19}"$'}
    RequiredQueueControlIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"(0|[1-9][0-9]{0,19})"$'}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string, const: '*'}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri, maxLength: 2048}
    OptionalOrigin:
      name: Origin
      in: header
      required: false
      description: Required with exact allowlist match when sessionCookie authenticates an unsafe request.
      schema: {type: string, format: uri, maxLength: 2048}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$'}
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for sessionCookie authentication; omitted for bearerAuth.
      schema: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$'}
    CatalogQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive literal query after Unicode whitespace trimming, NFC normalization and Unicode case folding.
      schema: {type: string, maxLength: 200}
    CatalogExactName:
      name: name
      in: query
      required: false
      description: Exact configuration name filter for enumerating opaque versions.
      schema: {$ref: '#/components/schemas/ConfigurationName'}

  headers:
    ContractorAPIVersion:
      required: true
      schema: {type: string, const: contractor.public.v1}
    RequestId:
      required: true
      schema: {$ref: '#/components/schemas/RequestId'}
    ETag:
      required: true
      schema: {type: string, pattern: '^"[^"\\]+"$'}
    ContentDisposition:
      required: false
      schema: {type: string, maxLength: 1024}
    IdempotencyReplayed:
      required: false
      schema: {type: string, const: 'true'}
    NoStore:
      required: true
      schema: {type: string, const: no-store}
  responses:
    FindingCorrelationStale:
      description: Restart the changed traversal.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: finding_correlation_stale
            message: finding correlation read could not complete
            retryable: false
            requestId: request-correlation
    FindingCorrelationItemTooLarge:
      description: A mandatory item cannot fit its bounded representation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: finding_correlation_item_too_large
            message: finding correlation read could not complete
            retryable: false
            requestId: request-correlation
    GitKeyState:
      description: Non-secret configured state; private key is never returned
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/GitKeyState'}}}
    GitImportResult:
      description: Complete exact source ZIP and immutable Git provenance
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {schema: {type: string}}
      content: {application/json: {schema: {$ref: '#/components/schemas/GitImportResult'}}}
    NoContent:
      description: Mutation completed with no response body
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
    LogoutNoContent:
      description: Browser session was destroyed and its cookie cleared
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
        Set-Cookie:
          required: true
          schema: {type: string, maxLength: 1024}
    LoginSession:
      description: Safe browser session view and newly issued opaque cookie
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
        Set-Cookie:
          required: true
          schema: {type: string, maxLength: 1024}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    CurrentSession:
      description: Safe current browser session view
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control:
          required: true
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    ArtifactWritten:
      description: Existing Artifact binding advanced by exact CAS
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ArtifactWriteResponse'}
    ArtifactCreated:
      description: New Artifact binding created
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ArtifactWriteResponse'}
    FindingExportBytes:
      description: Original immutable Audit export bytes
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        ETag: {$ref: '#/components/headers/ETag'}
        Content-Length:
          required: true
          schema: {type: integer, minimum: 0, maximum: 16777216}
        Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
      content:
        '*/*':
          schema: {$ref: '#/components/schemas/FindingExportContent'}
    FindingExportDiagnosticsBytes:
      description: Original immutable Audit export bytes
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        ETag: {$ref: '#/components/headers/ETag'}
        Content-Length:
          required: true
          schema: {type: integer, minimum: 0, maximum: 4194304}
        Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
      content:
        '*/*':
          schema: {$ref: '#/components/schemas/FindingExportDiagnosticsContent'}
    ArtifactBytes:
      description: Original artifact bytes
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        ETag: {$ref: '#/components/headers/ETag'}
        Content-Length:
          required: true
          schema: {type: integer, minimum: 0, maximum: 67108864}
        Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
      content:
        '*/*':
          schema: {type: string, format: binary, maxLength: 67108864}
    LLMCostResponse:
      description: Bounded prepared monetary observations with independent freshness; missing historical data is explicit.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LLMCostSummary'}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    Conflict: {$ref: '#/components/responses/Error409'}
    PreconditionFailed: {$ref: '#/components/responses/Error412'}
    UnsupportedMediaType: {$ref: '#/components/responses/Error415'}
    UnprocessableEntity: {$ref: '#/components/responses/Error422'}
    ArtifactUnavailable:
      description: Transfer capacity exhausted or a definite database transaction conflict exhausted retries (retryable), or stored content missing/corrupt (not automatically retryable).
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ArtifactWriteConflict:
      description: >-
        A stale or already-consumed CAS precondition (`conflict`), a
        frozen binding (`artifact_frozen`), or protected history that cannot
        fit the binding's retained-history limit (`artifact_history_protected`,
        not retryable).
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ArtifactWriteUnavailable:
      description: >-
        Transfer capacity exhausted, a definite database transaction conflict
        exhausted retries, or history maintenance pending
        (`artifact_history_maintenance_pending`, which carries Retry-After)
        (retryable); or stored content missing/corrupt (not automatically
        retryable).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          required: false
          schema: {type: integer, minimum: 1, maximum: 60}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PayloadTooLarge: {$ref: '#/components/responses/Error413'}
    RateLimited:
      description: Bounded process-local rate or socket limit
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 60}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CredentialInUse:
      description: One or more non-terminal Runs pin the credential
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuntimeLabelWritten:
      description: Current binding after create, rebind, or exact replay
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        ETag: {$ref: '#/components/headers/ETag'}
        Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RuntimeLabelBinding'}
    GatewayUnavailable:
      description: Bounded managed-Gateway operation failure
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CredentialRecoveryRequired:
      description: Credential lifecycle recovery has not completed or a definite database transaction conflict exhausted retries; retry after it settles
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CredentialMutationUnavailable:
      description: >-
        Credential lifecycle recovery has not completed (`credential_recovery_required`) or a definite
        database transaction conflict exhausted retries (`storage_transaction_conflict`), both retryable
        after they settle; or the Server was started without a credential master key
        (`credential_key_unavailable`, retryable false), so nothing is written and no Gateway call is
        made until an operator configures the key and restarts the Server
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuntimeCredentialMutationUnavailable:
      description: >-
        A definite database transaction conflict exhausted retries (`storage_transaction_conflict`,
        retryable); or the Server was started without a credential master key
        (`credential_key_unavailable`, retryable false), so nothing is written until an operator
        configures the key and restarts the Server
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RunCreationUnavailable:
      description: >-
        Credential recovery is in progress, a definite database transaction
        conflict exhausted retries, or a transient failure read the owner's
        Skill packages (`skill_artifact_unavailable`); nothing is created, so
        retry with the same Idempotency-Key
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RunSkillLimitExceeded:
      description: >-
        A Skill package that the Workflow's AgentTemplates select exceeds the
        stored package bound, or the selected packages exceed the stored-byte
        limit of one AgentTemplate or of the Run (`skill_limit_exceeded`,
        retryable false); nothing is created
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuditStartUnprocessable:
      description: >-
        Exact Audit input or requested profile policy cannot be processed by
        this Server, or the Skill packages that the child Workflows select
        cannot be pinned: a Skill has no current package
        (`skill_artifact_not_found`) or the packages exceed a stored-byte
        limit (`skill_limit_exceeded`); retryable false, and nothing is
        started
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuditStartUnavailable:
      description: >-
        Credential lifecycle recovery has not completed, a definite database
        transaction conflict exhausted retries, or a transient failure read
        the owner's Skill packages (`skill_artifact_unavailable`); nothing is
        started, so retry after it settles
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    StorageTransactionConflict:
      description: A definite database transaction conflict exhausted retries; retry the request
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError: {$ref: '#/components/responses/Error500'}
    Error400:
      description: Request does not satisfy the API contract
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error401:
      description: Authentication is absent or invalid
      headers:
        X-Contractor-API-Version: {$ref: '#/components/headers/ContractorAPIVersion'}
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        WWW-Authenticate:
          required: false
          schema: {type: string, maxLength: 128}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error403:
      description: Authenticated principal lacks permission or CSRF/Origin validation failed
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error404:
      description: Resource is absent or not owned by the principal
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error409:
      description: An immutable identity or CAS state conflict (`conflict` or a resource-specific code, retryable as marked), or an Idempotency-Key already bound to a different request (`idempotency_conflict`, retryable false)
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error412:
      description: Strong revision precondition did not match current state
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error413:
      description: Request body or artifact exceeds its size limit
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error415:
      description: An Operations settings update is not sent as exactly application/json (unsupported_media_type), or an archive preview names an Artifact that is not a ZIP or Skill package (archive_media_type)
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error422:
      description: Exact Audit input or requested profile policy cannot be processed by this Server
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error500:
      description: Safe internal failure without raw cause
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

  schemas:
    SharedConfig: {
