    RunRecovery:
      description: >-
        Live model-availability recovery for the Run's exact active stage.
        Coordination is held in the active Server's memory; Server restart resets
        outage history, backoff and automatic retry windows. This observation is
        refreshed by active-Run polling and is outside the durable event cursor.
      type: object
      additionalProperties: false
      required: [code, since, automaticUntil, requiresRetry]
      properties:
        code:
          type: string
          enum: [model_unavailable, gateway_unavailable, gateway_timeout, gateway_rate_limited]
          description: >-
            Cause of the model gateway failure that holds the Run, from the
            recovery cause vocabulary that the Server and the Runtime share. It
            is not an error code: gateway_unavailable here is an unavailable
            model gateway route, not the error of a failed Gateway credential
            manager.
        since: {type: string, format: date-time}
        nextRetryAt: {type: string, format: date-time}
        automaticUntil: {type: string, format: date-time}
        requiresRetry: {type: boolean}
    RunStatus:
      type: object
      additionalProperties: false
      required: [runId, workflow, state, deletable, runtimeLabels, labels, runtimeConfiguration, attempts, transitions, outputs, outputPublications]
      properties:
        requiredPlacementLabels: {$ref: '#/components/schemas/PlacementLabels'}
        recovery: {$ref: '#/components/schemas/RunRecovery'}
        resumeStageExecutionId:
          allOf: [{$ref: '#/components/schemas/ResourceId'}]
          description: Present only when this failed attempt can be manually continued after cleanup.
