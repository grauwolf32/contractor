[project]
name = "contractor-runtime"
version = "0.1.0"
description = "Single-slot Python Runtime Agent for Contractor v2"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "fsspec>=2026.7.0,<2027.0.0",
  "google-adk==2.8.0",
  "httpx>=0.28,<1",
  "jcs>=0.2,<1",
  "openai==2.54.0",
  "opentelemetry-proto==1.42.1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "regex>=2026.7,<2027",
  "starlette>=1.3.1,<2",
  "trailmark==0.5.0",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==1.14.3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
contractor-runtime = "contractor_runtime.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contractor_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
