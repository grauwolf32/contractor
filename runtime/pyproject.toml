[project]
name = "contractor-runtime"
version = "0.1.0"
description = "Single-slot Python Runtime Agent for Contractor v2"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
contractor-runtime = "contractor_runtime.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contractor_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
