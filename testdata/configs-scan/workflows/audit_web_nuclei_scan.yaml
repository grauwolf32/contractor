apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-web-nuclei-scan
  version: '1'
spec:
  parameters: {}
  inputs:
    target:
      required: true
      mediaTypes:
      - application/json
    settings:
      required: true
      mediaTypes:
      - application/json
    rulepack:
      required: false
      mediaTypes:
      - application/yaml
      - application/vnd.contractor.nuclei-rulepack+zip
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  entryStage: scan
  stages:
    scan:
      objective: Check the exact target URL with the retained Nuclei selection
      instructions:
        ref: instructions/audit-openapi-scan.md
      planner: scan-plan@1
      scanPlan:
        inputArtifact: target
        maxInputs: 1
        maxJobs: 1
        maxTotalSeconds: 330
        tools:
        - worker: scanner
          maxJobs: 1
          maxTotalSeconds: 330
      agents:
        scanner:
          template: audit-web-nuclei-scan@1
      context:
        artifacts:
          target:
            namespace: inputs
            name: target
            required: true
          settings:
            namespace: inputs
            name: settings
            required: true
          rulepack:
            namespace: inputs
            name: rulepack
            required: false
      result:
        artifacts:
          report:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: scan-results
              name: operation-report
      workflowOutputs:
        result: report
      'on':
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
      scanPreparation:
        scanner: nuclei
        settingsArtifact: settings
        unknownOutcome: retain-gap
        kind: web-target
