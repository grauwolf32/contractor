apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: audit-source-check
  version: '1'
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
    context:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      primary: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: domain_worker@2
  entryStage: check
  stages:
    check:
      objective: Explore the selected source using the trusted task context
      instructions:
        ref: instructions/audit-source-checker-worker.md
      planner: passthrough@1
      agents:
        checker:
          template: audit_source_checker@1
          namespace: audit-check
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
          context:
            namespace: inputs
            name: context
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: audit-check
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
