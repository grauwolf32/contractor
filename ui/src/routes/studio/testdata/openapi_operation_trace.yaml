{
  "apiVersion": "contractor/v1alpha1",
  "kind": "AuditProfile",
  "metadata": {
    "name": "common-tasks",
    "version": "1"
  },
  "spec": {
    "schema": "contractor.audit.program.v1",
    "inputs": {
      "source": {
        "required": true,
        "media_types": [
          "text/plain"
        ]
      }
    },
    "workflows": {
      "trace": {
        "ref": "audit-openapi-operation-trace@1",
        "inputs": {
          "source": {
            "source": "audit-input",
            "name": "source"
          }
        },
        "parameters": {},
        "outputs": {
          "material": "result"
        }
      }
    },
    "hypotheses": {},
    "initial_work": [
      {
        "key": "inspect-1",
        "workflow": "trace",
        "objective": "Inspect selected source"
      }
    ],
    "limits": {
      "max_tasks": 100000,
      "max_iterations": 32,
      "max_tasks_per_iteration": 10000,
      "batch_size": 64,
      "max_submitted_runs": 1000000,
      "max_attempts": 10,
      "deadline_seconds": 31536000,
      "max_evidence_bytes": 1073741824,
      "max_hypotheses": 10000,
      "max_hypothesis_revisions": 50000,
      "max_hypothesis_bytes": 268435456
    },
    "policy": {
      "active_operations": "prohibited"
    }
  }
}
