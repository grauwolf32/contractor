    merge: { cls: 'merge', label: 'слить', title: 'Слить в родителя', name: 'Слить', note: 'Пристройка один к одному: перенести колонками в родителя' },
    questionable: { cls: 'wo', label: 'спорная', title: 'Спорная', name: 'Спорные', note: 'Работает, но механизм можно заменить' },
    fold: { cls: 'fold', label: 'вобрала', title: 'Вобрала удалённые таблицы', name: 'Вобрали', note: 'Сюда в V365 перенесены колонки удалённых таблиц' },
  };
  const DEL = { a: 'нет действия', r: 'запрет', c: 'каскадное удаление', n: 'SET NULL', d: 'SET DEFAULT' };
  const nCols = D.tables.reduce((s, t) => s + t.cols.length, 0);

  const $ = (id) => document.getElementById(id);
  const svg = $('svg'), world = $('world'), stage = $('stage'), sheet = $('sheet');
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  $('stats').innerHTML = `<b>${D.tables.length}</b> ${plural(D.tables.length, 'таблица', 'таблицы', 'таблиц')} · <b>${D.fks.length}</b> ${plural(D.fks.length, 'внешний ключ', 'внешних ключа', 'внешних ключей')} · <b>${nCols}</b> ${plural(nCols, 'колонка', 'колонки', 'колонок')} · <b>${D.groups.length}</b> подсистем${D.schemaVersion ? ` · миграция <b>${D.schemaVersion}</b>` : ''}`;
  $('tableNames').innerHTML = D.tables.map((t) => `<option value="${t.name}"></option>`).join('');

  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  };
  const gvar = (g) => `var(--g-${g})`;

  // Legend and audit lists
  $('legend').innerHTML = D.groups.map((g) => `
    <li><button type="button" data-group="${g.id}" aria-pressed="false">
      <span class="sw" style="background:${gvar(g.id)}"></span>
      <span class="nm">${g.name}<span class="nt">${g.note}</span></span>
      <span class="cnt">${g.count}</span>
    </button></li>`).join('');

  const byKind = (k) => Object.entries(D.flags).filter(([, f]) => f.kind === k).map(([n]) => n);
  const nRemove = byKind('remove').length, nMerge = byKind('merge').length, nQ = byKind('questionable').length;
  const nKeep = D.tables.length - nRemove - nMerge - nQ;
  const nRemoved = Object.keys(D.removed).length, nFold = byKind('fold').length;
  const candidates = `${nRemove} можно убрать, ${nMerge} слить${nMerge ? ' (отложено)' : ''}, ${nQ} спорные`;
  $('verdict').innerHTML = !nRemoved ? `Нужны <b>${nKeep}</b> ${plural(nKeep, 'таблица', 'таблицы', 'таблиц')}; кандидаты: ${candidates}. Разбор — docs/research/2026-10-03-database-schema-review.md.` : `Сокращение V365 убрало <b>${nRemoved}</b> ${plural(nRemoved, 'таблицу', 'таблицы', 'таблиц')}: ${nRemoved + D.tables.length} → <b>${D.tables.length}</b>. Мёртвые удалены, пристройки один к одному перенесены колонками в <b>${nFold}</b> ${plural(nFold, 'родителя', 'родителей', 'родителей')}. Из оставшихся кандидатов ${candidates}. Разбор — docs/research/2026-10-03-database-schema-review.md, план — docs/plans/2026-10-04-schema-reduction.md.`;
  $('removedSection').hidden = !nRemoved;
  $('removed').innerHTML = Object.entries(D.removed).map(([n, w]) => `<li><code>${n}</code><br><span>${esc(w)}</span></li>`).join('');

  const auditItems = ['fold', 'remove', 'merge', 'questionable'].map((k) => ({ key: k, cls: KIND[k].cls, name: KIND[k].name, note: KIND[k].note, tables: byKind(k) }));
  $('audit').innerHTML = auditItems.map((a) => `
    <li><button type="button" data-audit="${a.key}" aria-pressed="false">
      <span class="mk ${a.cls}"></span>
      <span class="nm">${a.name}<span class="nt">${a.note}</span></span>
      <span class="cnt">${a.tables.length}</span>
    </button></li>`).join('');

  // Subsystem labels stay a constant on-screen size above the zoomed drawing
  const labelEls = {};
  for (const g of D.groups) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'glabel'; b.style.setProperty('--gc', gvar(g.id));
    b.innerHTML = `<i></i>${g.name}<span>${g.count}</span>`;
    b.addEventListener('click', (e) => { e.stopPropagation(); document.querySelector(`[data-group="${g.id}"]`).click(); });
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    $('labels').appendChild(b); labelEls[g.id] = b;
  }
  function placeLabels() {
    if (!L) return;
    for (const g of D.groups) {
      const p = L.groups[g.id];
      labelEls[g.id].style.transform = `translate(${Math.round(view.x + p.x * view.k + 8)}px, ${Math.round(view.y + p.y * view.k + 8)}px)`;
    }
  }

  // Rendering
  let mode = ['keys', 'all', 'list'].includes(store.get('erd-mode')) ? store.get('erd-mode') : 'keys';
  let L = null;
  const nodeEls = {}, edgeEls = [], frameEls = {};

  function roundedPath(pts) {
    if (pts.length < 3) return 'M' + pts.map((p) => p.join(',')).join('L');
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const r = Math.min(5, Math.hypot(x - px, y - py) / 2, Math.hypot(nx - x, ny - y) / 2);
      const ax = x - Math.sign(x - px) * r, ay = y - Math.sign(y - py) * r;
      const bx = x + Math.sign(nx - x) * r, by = y + Math.sign(ny - y) * r;
      d += `L${ax},${ay}Q${x},${y} ${bx},${by}`;

    const last = pts[pts.length - 1];
    return d + `L${last[0]},${last[1]}`;
  }
  function endMarks(pts) {
    // Crow's foot at the child end, a bar at the parent end.
    const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
    const e = pts[pts.length - 1], [ux, uy] = unit(pts[pts.length - 2], e), [vx, vy] = [-uy, ux];
    const b = [e[0] - ux * 10, e[1] - uy * 10];
    const s = pts[0], [sx, sy] = unit(pts[1], s), [wx, wy] = [-sy, sx];
    const c = [s[0] - sx * 7, s[1] - sy * 7];
    return `M${b[0]},${b[1]}L${e[0] + vx * 5},${e[1] + vy * 5}M${b[0]},${b[1]}L${e[0] - vx * 5},${e[1] - vy * 5}` +
      `M${c[0] + wx * 5},${c[1] + wy * 5}L${c[0] - wx * 5},${c[1] - wy * 5}`;
  }

  function render() {
    L = D.layouts[mode];
    world.textContent = '';
    for (const k in nodeEls) delete nodeEls[k];
    for (const k in frameEls) delete frameEls[k];
    edgeEls.length = 0;
    const gFrames = el('g', {}, world), gEdges = el('g', {}, world), gNodes = el('g', {}, world);

    for (const g of D.groups) {
      const p = L.groups[g.id];
      const f = el('g', { class: 'frame', style: `--gc:${gvar(g.id)}` }, gFrames);
      el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10 }, f);
      frameEls[g.id] = f;
    }

    D.fks.forEach((fk, i) => {
      const pts = L.routes[i];
      const g = el('g', { class: 'edge' }, gEdges);
      const d = roundedPath(pts);
      el('path', { d, class: 'hit' }, g);
      el('path', { d }, g);
      el('path', { d: endMarks(pts) }, g);
      const tt = el('title', {}, g);
      tt.textContent = `${fk.from}(${fk.fc.join(', ')}) → ${fk.to}(${fk.tc.join(', ')})`;
      g.addEventListener('click', (ev) => { ev.stopPropagation(); select(fk.from); });
      edgeEls[i] = g;
    });

    for (const t of D.tables) {
      const p = L.nodes[t.name];
      const fl = D.flags[t.name];
      const g = el('g', {
        class: 'tbl' + (fl ? ' ' + KIND[fl.kind].cls : ''),
        style: `--gc:${gvar(t.group)}`, tabindex: 0, role: 'button', 'data-t': t.name,
        'aria-label': `${t.name}: ${t.desc}`,
      }, gNodes);
      el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 4, class: 'box' }, g);
      el('path', { d: `M${p.x + 0.5},${p.y + G.head}V${p.y + 4.5}Q${p.x + 0.5},${p.y + 0.5} ${p.x + 4.5},${p.y + 0.5}H${p.x + p.w - 4.5}Q${p.x + p.w - 0.5},${p.y + 0.5} ${p.x + p.w - 0.5},${p.y + 4.5}V${p.y + G.head}Z`, class: 'hd' }, g);
      el('line', { x1: p.x, x2: p.x + p.w, y1: p.y + G.head, y2: p.y + G.head, class: 'sep' }, g);
      const tn = el('text', { x: p.x + G.padX, y: p.y + 17, class: 'tn' }, g);
      tn.textContent = t.name;
      if (fl) {
        const label = KIND[fl.kind].label;
        const w = label.length * 6 + 10;
        el('rect', { x: p.x + p.w - w - 6, y: p.y - 8, width: w, height: 15, rx: 3, class: 'flagbg ' + KIND[fl.kind].cls }, g);
        const ft = el('text', { x: p.x + p.w - w / 2 - 6, y: p.y + 2.5, 'text-anchor': 'middle', class: 'flagtx ' + KIND[fl.kind].cls }, g);
        ft.textContent = label;
      }
      const byName = Object.fromEntries(t.cols.map((c) => [c.n, c]));
      p.shown.forEach((n, j) => {
        const c = byName[n];
        const y = p.y + G.head + G.padY + j * G.row;
        const km = (c.pk ? 'PK' : '') + (c.pk && c.fk ? ' ' : '') + (c.fk ? 'FK' : '');
        if (km) { const k = el('text', { x: p.x + G.padX, y: y + 11.5, class: 'km' }, g); k.textContent = km; }
        const cn = el('text', { x: p.x + G.padX + G.mark, y: y + 12, class: 'cn' + (c.pk || c.fk ? ' k' : ''), 'data-c': n }, g);
        cn.textContent = n;
        const ct = el('text', { x: p.x + p.w - G.padX, y: y + 12, 'text-anchor': 'end', class: 'ct' }, g);
        ct.textContent = c.t + (c.nn ? '' : '?');
      });
      if (p.hidden > 0) {
        const m = el('text', { x: p.x + G.padX + G.mark, y: p.y + p.h - G.padY - 3, class: 'more' }, g);
        m.textContent = `ещё ${p.hidden} ${plural(p.hidden, 'колонка', 'колонки', 'колонок')}`;
      }
      g.addEventListener('click', (ev) => { ev.stopPropagation(); if (!moved) select(t.name); });
      g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(t.name, true); } });
      g.addEventListener('mouseenter', () => hoverEdges(t.name, true));
      g.addEventListener('mouseleave', () => hoverEdges(t.name, false));
      nodeEls[t.name] = g;
    }
    applyFocus();
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  // Focus state: a selected table, a group, an audit bucket or a search
  let selected = null, focusSet = null, focusKey = null;
  function hoverEdges(name, on) {
    if (selected) return;
    for (const i of [...(out[name] || []), ...(inc[name] || [])]) edgeEls[i]?.classList.toggle('hot', on);
  }
  function applyFocus() {
    let set = null, edges = null;
    if (selected) {
      set = new Set([selected]);
      edges = new Set([...(out[selected] || []), ...(inc[selected] || [])]);
      for (const i of edges) { set.add(D.fks[i].from); set.add(D.fks[i].to); }
    } else if (focusSet) {
      set = focusSet;
      edges = new Set(D.fks.map((f, i) => (set.has(f.from) && set.has(f.to) ? i : -1)).filter((i) => i >= 0));
    }
    svg.classList.toggle('focus', !!set);
    for (const [n, g] of Object.entries(nodeEls)) {
      g.classList.toggle('dim', !!set && !set.has(n));
      g.classList.toggle('sel', n === selected);
      g.querySelectorAll('.colhi').forEach((r) => r.remove());
    }
    edgeEls.forEach((g, i) => { g.classList.toggle('dim', !!edges && !edges.has(i)); g.classList.toggle('hot', !!selected && edges.has(i)); });
    for (const [id, f] of Object.entries(frameEls)) {
      const any = !set || [...set].some((n) => T[n].group === id);
      f.classList.toggle('dim', !any);
      labelEls[id].classList.toggle('dim', !!set && !any);
    }
    if (selected) markColumns();
  }
  function markColumns() {
    // Shade the columns that take part in the selected table's relationships.
    const marks = {};
    for (const i of out[selected] || []) { const f = D.fks[i]; (marks[f.from] ||= new Set(f.fc)); f.fc.forEach((c) => marks[f.from].add(c)); (marks[f.to] ||= new Set()); f.tc.forEach((c) => marks[f.to].add(c)); }
    for (const i of inc[selected] || []) { const f = D.fks[i]; (marks[f.from] ||= new Set()); f.fc.forEach((c) => marks[f.from].add(c)); (marks[f.to] ||= new Set()); f.tc.forEach((c) => marks[f.to].add(c)); }
    for (const [n, cols] of Object.entries(marks)) {
      const p = L.nodes[n], g = nodeEls[n];
      p.shown.forEach((c, j) => {
        if (!cols.has(c)) return;
        const r = el('rect', { x: p.x + 1, y: p.y + G.head + G.padY + j * G.row, width: p.w - 2, height: G.row, class: 'colhi' });

    }
  }

  function clearPressed() { document.querySelectorAll('[data-group][aria-pressed="true"],[data-audit][aria-pressed="true"]').forEach((b) => b.setAttribute('aria-pressed', 'false')); }

  function select(name, zoomTo) {

    applyFocus();
    showSheet(name);
    if (zoomTo) fitTo([name, ...(out[name] || []).map((i) => D.fks[i].to), ...(inc[name] || []).map((i) => D.fks[i].from)], 0.95);

  }
  function deselect() {

    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function relItem(i, dir) {
    const f = D.fks[i];
    const other = dir === 'out' ? f.to : f.from;
    const map = dir === 'out' ? `${f.fc.join(', ')} → ${f.tc.join(', ')}` : `${f.fc.join(', ')} → ${f.tc.join(', ')}`;
    return `<li><button type="button" data-goto="${other}">${other}</button> <span class="map">${esc(map)}</span><br><span class="act">при удалении родителя: ${DEL[f.del] || f.del}</span></li>`;
  }
  function showSheet(name) {
    const t = T[name], g = GR[t.group], fl = D.flags[name];
    const o = out[name] || [], i = inc[name] || [];
    const tags = (tagOf[name] || []).map((k) => `<div class="callout tag"><b>${D.tags[k].name}</b>${D.tags[k].text}. Таблицы: ${D.tags[k].tables.filter((n) => n !== name).join(', ')}.</div>`).join('');
    sheet.innerHTML = `
      <header>
        <div class="top"><h2>${t.name}</h2><button type="button" class="close" id="close" aria-label="Закрыть">✕</button></div>
        <span class="gchip"><i style="background:${gvar(t.group)}"></i>${g.name}</span>
      </header>
      <p class="desc">${esc(t.desc)}</p>
      ${t.why ? `<section><h3>Зачем нужна</h3><p class="desc">${esc(t.why)}</p></section>` : ''}
      ${t.procs.length ? `<section><h3>Какие процессы её используют</h3><ul class="procs">${t.procs.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></section>` : ''}
      ${fl ? `<div class="callout ${KIND[fl.kind].cls}"><b>${KIND[fl.kind].title}</b>${esc(fl.text)}</div>` : ''}
      ${tags}
      <div class="facts"><span><b>${t.cols.length}</b> ${plural(t.cols.length, 'колонка', 'колонки', 'колонок')}</span><span><b>${o.length}</b> ссылок наружу</span><span><b>${i.length}</b> ссылок внутрь</span><span><b>${t.triggers.length}</b> ${plural(t.triggers.length, 'триггер', 'триггера', 'триггеров')}</span></div>
      <section><h3>Колонки</h3><table class="cols">${t.cols.map((c) => `<tr class="${c.pk || c.fk ? 'key' : ''}"><td class="k">${[c.pk ? 'PK' : '', c.fk ? 'FK' : ''].filter(Boolean).join(' ')}</td><td class="n">${c.n}</td><td class="t">${c.t}${c.nn ? '' : '?'}</td></tr>`).join('')}</table></section>
      <section><h3>Ссылается на</h3>${o.length ? `<ul class="rels">${o.map((x) => relItem(x, 'out')).join('')}</ul>` : '<p class="empty">Внешних ключей нет.</p>'}</section>
      <section><h3>На неё ссылаются</h3>${i.length ? `<ul class="rels">${i.map((x) => relItem(x, 'in')).join('')}</ul>` : '<p class="empty">Никто не ссылается.</p>'}</section>
      <section><h3>Где в коде</h3>${t.usage.length ? `<p class="plain">${t.usage.map((u) => 'internal/' + u).join('<br>')}</p>` : '<p class="empty">Ни один пакет не обращается к таблице в SQL.</p>'}</section>
      ${t.triggers.length ? `<section><h3>Триггеры</h3><p class="plain">${t.triggers.join('<br>')}</p></section>` : ''}
    `;
    sheet.hidden = false;
    sheet.scrollTop = 0;
    $('close').addEventListener('click', deselect);
    sheet.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => select(b.dataset.goto, true)));
  }

  // View transform
  let view = { x: 0, y: 0, k: 1 };
  const apply = () => { world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); placeLabels(); };
  const clampK = (k) => Math.min(3, Math.max(0.04, k));
  function animateTo(target) {

    };
    requestAnimationFrame(step);
  }
  function fitBox(b, maxK = 1.2, animate = true) {
    const r = stage.getBoundingClientRect();

    const k = clampK(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h, maxK));
    const target = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };

  }
  function fitTo(names, maxK = 1.2) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of names) { const p = L.nodes[n]; x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.h); }
    fitBox({ x: x0 - 20, y: y0 - 20, w: x1 - x0 + 40, h: y1 - y0 + 40 }, maxK);
  }
  const fitAll = (animate = true) => fitBox({ x: 0, y: 0, w: L.w, h: L.h }, 1, animate);
  function zoomAt(cx, cy, f) {
    const k = clampK(view.k * f);
    view = { k, x: cx - (cx - view.x) * (k / view.k), y: cy - (cy - view.y) * (k / view.k) };
    apply();
  }

  // Pan and pinch
  const pointers = new Map();
  let moved = false, last = null, pinch = null;
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.zoom')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false; last = { x: e.clientX, y: e.clientY };

    }
  });

    if (!pointers.has(e.pointerId)) return;

      const [a, b] = [...pointers.values()];

      zoomAt(cx, cy, (pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / view.k);
      moved = true; return;
    }
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; stage.classList.add('dragging'); try { stage.setPointerCapture(e.pointerId); } catch {} }
    view.x += dx; view.y += dy; last = { x: e.clientX, y: e.clientY }; apply();
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) stage.classList.remove('dragging');
  };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  stage.addEventListener('click', (e) => {
    if (moved || e.target.closest('.zoom')) return;
    if (!e.target.closest('.tbl') && !e.target.closest('.edge')) { if (selected) deselect(); else if (focusSet) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); } }
  });
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
  }, { passive: false });
  $('zin').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.35); });
  $('zout').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.35); });
  $('zfit').addEventListener('click', () => fitAll());

  // Legend and audit buckets
  $('legend').addEventListener('click', (e) => {
    const b = e.target.closest('[data-group]'); if (!b) return;
    const id = b.dataset.group;
    if (focusKey === 'g:' + id) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); fitAll(); return; }
    if (mode === 'list') setMode(store.get('erd-map') || 'keys');
    selected = null; sheet.hidden = true; clearPressed(); b.setAttribute('aria-pressed', 'true');
    focusKey = 'g:' + id; focusSet = new Set(D.tables.filter((t) => t.group === id).map((t) => t.name));
    applyFocus();
    const p = L.groups[id]; fitBox({ x: p.x - 10, y: p.y - 10, w: p.w + 20, h: p.h + 20 }, 1.1);
    closeRailOnPhone();
  });
  $('audit').addEventListener('click', (e) => {
    const b = e.target.closest('[data-audit]'); if (!b) return;
    const a = auditItems.find((x) => x.key === b.dataset.audit);
    if (focusKey === 'a:' + a.key) { focusSet = null; focusKey = null; clearPressed(); applyFocus(); fitAll(); return; }
    if (mode === 'list') setMode(store.get('erd-map') || 'keys');
    selected = null; sheet.hidden = true; clearPressed(); b.setAttribute('aria-pressed', 'true');
    focusKey = 'a:' + a.key; focusSet = new Set(a.tables);
    applyFocus();
    if (a.tables.length === 1) select(a.tables[0], true); else fitTo(a.tables, 1);
    closeRailOnPhone();
  });

  // Search: dims tables that do not match a name or column
  $('q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (T[q]) { select(q, true); return; }
    if (!q) { focusSet = null; focusKey = null; applyFocus(); return; }
    selected = null; sheet.hidden = true; clearPressed();
    focusKey = 'q'; focusSet = new Set(D.tables.filter((t) => t.name.includes(q) || t.cols.some((c) => c.n.includes(q)) || (t.desc + ' ' + t.why + ' ' + t.procs.join(' ')).toLowerCase().includes(q)).map((t) => t.name));
    applyFocus();
  });
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && focusSet && focusSet.size) { e.preventDefault(); const first = [...focusSet][0]; focusSet.size === 1 ? select(first, true) : fitTo([...focusSet], 1); }
    if (e.key === 'Escape') { e.target.value = ''; focusSet = null; focusKey = null; applyFocus(); }
  });

  // List view
  function renderList() {
    const rows = D.groups.map((g) => {
      const ts = D.tables.filter((t) => t.group === g.id);
      return `<tr class="grp"><td colspan="6"><span class="gchip"><i style="background:${gvar(g.id)}"></i>${g.name} · ${ts.length}</span></td></tr>` +
        ts.map((t) => { const fl = D.flags[t.name]; return `<tr class="row" data-t="${t.name}" tabindex="0"><td class="nm">${t.name}${fl ? `<span class="badge ${KIND[fl.kind].cls}">${KIND[fl.kind].label}</span>` : ''}</td><td>${esc(t.desc)}${t.why ? `<div class="why">${esc(t.why)}</div>` : ''}${t.procs.length ? `<div class="procs">Процессы: ${esc(t.procs.join('; '))}</div>` : ''}</td><td class="num">${t.cols.length}</td><td class="num">${(out[t.name] || []).length}</td><td class="num">${(inc[t.name] || []).length}</td><td style="font-family:var(--mono);font-size:11.5px;color:var(--ink-2)">${t.usage.join(', ') || '—'}</td></tr>`; }).join('');
    }).join('');
    $('list').innerHTML = `<table><thead><tr><th>Таблица</th><th>Назначение</th><th style="text-align:right">Колонки</th><th style="text-align:right">FK наружу</th><th style="text-align:right">FK внутрь</th><th>Пакеты internal/</th></tr></thead><tbody>${rows}</tbody></table>`;
    $('list').querySelectorAll('tr.row').forEach((r) => {
      r.addEventListener('click', () => select(r.dataset.t, true));
      r.addEventListener('keydown', (e) => { if (e.key === 'Enter') select(r.dataset.t, true); });
    });
  }

  function setMode(m) {
    mode = m; store.set('erd-mode', m);
    if (m !== 'list') store.set('erd-map', m);
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    const isList = m === 'list';
    $('list').hidden = !isList; stage.hidden = isList;
    if (isList) { renderList(); sheet.hidden = true; return; }
    render();
    if (selected) { showSheet(selected); fitTo([selected], 1); } else fitAll(false);
  }
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // Phone: the legend slides over the canvas
  const rail = $('rail');
  const phone = () => matchMedia('(max-width: 760px)').matches;
  function syncRail() { if (phone()) rail.hidden = $('railToggle').getAttribute('aria-expanded') !== 'true'; else rail.hidden = false; }
  function closeRailOnPhone() { if (phone()) { $('railToggle').setAttribute('aria-expanded', 'false'); syncRail(); } }
  $('railToggle').addEventListener('click', (e) => { const b = e.currentTarget; b.setAttribute('aria-expanded', String(b.getAttribute('aria-expanded') !== 'true')); syncRail(); });
  addEventListener('resize', () => { syncRail(); });
  syncRail();

  addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected && document.activeElement?.id !== 'q') deselect(); });

  // Boot
  setMode(mode);
  const h = decodeURIComponent(location.hash.slice(1));
  if (T[h]) select(h, true);
  else requestAnimationFrame(() => mode !== 'list' && fitAll(false));
})();
</script>
