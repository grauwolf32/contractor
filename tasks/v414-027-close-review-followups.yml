goal: >-
  Every follow-up found while implementing and reviewing V407 and V409 has a
  verified disposition: each V414 task is completed with its real-path
  regression, or archived with a recorded decision and removed from this
  list in the same change, and the landing revision passes make lint and the
  suites the V414 tasks touched.
context:
  review: >-
    The V407 and V409 task records the V414 tasks cite in context.review:
    tasks/done/v407-001, -004, -008, -011, -017, -018, -019, -020 (open,
    tasks/v407-020-telemetry-trim-and-history.yml), -021, -024, -029,
    -030, -032 and -034; tasks/done/v409-001, -002, -004, -007, -009, -010
    and -012.
  finding: >-
    Twenty-five follow-up candidates were rechecked on 19f7477f (the
    integration branch claude/review-v407-v409 with main merged) before
    filing. All held and became V414-001 to V414-026 (candidate 25 split into
    the allocation-history page, V414-025, and the Eval summary page,
    V414-026). V409-013 added V414-028 and V414-029, measured while
    verifying the SQL review's claim-probe question. This is an exit gate, not another defect: closing it requires
    the dependencies, not new implementation.
  open_questions: >-
    Items found during verification that no V414 task owns; each needs a
    disposition here (a new task, an existing task, or a recorded decline with
    its reason): (1) the optional-filter predicate shape
    ($n = '' OR column = $n, NOT $n::boolean OR ..., $n IS NULL OR ...) also
    appears in internal/auditstore/internal/pgstore (finding_reads_sql.go,
    read_sql.go, store_sql.go, workspace_sql.go, report_build_sql.go,
    provenance_reads_sql.go), internal/artifacts (postgres_query_sql.go,
    postgres_fork_sql.go), internal/runstore (store_sql.go,
    queue_store_sql.go), internal/projectstore/store_sql.go and
    internal/findingintake/postgres_sql.go; only the two statements of
    V414-025 and V414-026 were measured; decide per statement whether its
    generic plan is bounded by its parent or needs the V414-025/026 fix;
    (2) Audit and finding stores pass request strings with a \u0000 escape to
    jsonb parameters, which fails at write with an unclassified 500 instead of
    a 4xx (nothing is stored; found while verifying V414-017); (3) Planner
    error codes still missing from docs/spec/platform/errors.md besides
    planner_invocation_in_progress (for example planner_cancelled,
    planner_initialization_failed, worker_task_failed, planner_session_invalid;
    found while verifying V414-006): confirm V372-020 covers them or file a
    task; (4) V371-009 (Audit list preparation batch) may be superseded by
    V407-004's one-snapshot list read: confirm and archive it or keep it with
    a reason; (5) V414-006 and V414-008 both change
    planner.SessionError; the second to land rebases on the first; (6) found
    while verifying the SQL review (V409-013): workflow_run_events per Run
    has neither a count bound nor a detection signal (review open question
    F, V409-010 decision); reads are bounded per page (LIM-API-24) but Run
    deletion removes the whole history in one transaction; decide a detection
    signal or a bound; (7) also from V409-013: the cumulative 64 MiB machine
    report check (internal/auditimport/report_build.go:145-149, LIM-REV-8),
    which keeps audit_report_pages far below 4,096 pages of 64 MiB, has no
    test that drives it to its rejection; add one or record why not.
  open_question_dispositions: >-
    Recorded during the 2026-10-24 backlog revalidation on b523ae77:
    (3) covered: V372-020 was rewritten and its item (5) now owns the
    roughly 23 Planner, Worker-invocation and Scheduler Stage failure codes
    that reach StageTermination or AttemptDiagnostic.code without an
    errors.md row (planner_invocation_in_progress stays with V414-006);
    (4) confirmed and closed: V371-009 is archived as delivered by V407-004
    (3cd9826c7d5a3676f6cff53a712d6ea555b76736) with per-criterion evidence
    in tasks/done/v371-009-audit-list-preparation-batch.yml.
    Recorded on 2026-10-24 during the V410-V414 delivery: (2) owned by
    V414-032 at the user's request. Defects and gaps found by the delivery
    lanes themselves were filed as V414-034 to V414-039 on 2026-10-25 at the
    user's request, to be fixed before the next delivery wave.
    Recorded on 2026-10-30 when the last V414 dependencies closed:
    (1) owned by V425-015 (generic-plan budgets for every listed statement);
    (2) V414-032 is completed; (3) V372-020 is completed and registered the
    Planner, Worker-invocation and Stage failure codes (planner_cancelled,
    planner_initialization_failed, planner_session_invalid and
    worker_task_failed now have errors.md rows); the two Runtime allocation
    codes it did not cover are owned by V425-008; (4) unchanged, closed;
    (5) moot: V414-006 and V414-008 are both completed; (6) owned by
    V425-016, whose decision_needed asks the user to choose a bound with a
    metric or a metric only, both with batched deletion; (7) owned by
    V425-017.
scope:
  in:
    - "Reconcile every V414 dependency: completed with its implementation_commit and moved to tasks/done/, or archived by the user's decision with the reason, the evidence and its removal from depends_on in the same metadata change. Archived or deferred tasks never count as completed."
    - "Record a disposition for every item in context.open_questions."
    - "Run make lint and the suites the V414 tasks touched on the landing revision, with CONTRACTOR_TEST_DATABASE_URL set, and record commands, revision and results, naming any skipped or environment-limited test."
    - "Say whether the branch that carries the V414 work is merged into main and what is left (AGENTS.md section 4, Land your branch)."
  out:
    - "Implementing any V414 task inside this one."
    - "New findings unrelated to V407/V409 follow-ups; file them separately."
acceptance_criteria:
  - id: A1
    given: "the V414 task files"
    when: "this task is closed"
    then: "every task in depends_on is completed with a full implementation_commit in tasks/done/, or was archived with a recorded decision and removed from depends_on in the same change, and make lint accepts the index"
  - id: A2
    given: "context.open_questions"
    when: "this task is closed"
    then: "each item names its owning task or its recorded decline with evidence"
  - id: A3
    given: "the landing revision"
    when: "the commands under tests run with a disposable PostgreSQL database"
    then: "they pass, and the task records each command, the revision and the result; a skipped database test is reported as skipped, not as a pass"
tests:
  - command: make lint
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make test-go"
    covers: [A3]
  - command: make test-runtime
    covers: [A3]
  - command: make ui-verify
    covers: [A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make verify-public-api-postgres"
    covers: [A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make test-wire-cross-language"
    covers: [A3]
