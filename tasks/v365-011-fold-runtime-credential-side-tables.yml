  - {id: A3, text: "No Go code or specification references the dropped table(s)."}
tests:
  - {command: "go build ./... && go vet ./...", covers: [A1]}
  - {command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/persistence/... ./internal/credentials/... ./internal/runstore/... ./internal/runtimeconfig/...", covers: [A1, A2, A3]}
