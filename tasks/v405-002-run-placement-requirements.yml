schema_version: '1.0'
id: V405-002
title: Pin Run placement requirements and enforce dynamic Runtime matching
milestone: runtime-placement-labels-2026-10
epic: execution-core
kind: feature
priority: P2
status: pending
depends_on:
- V405-001
languages:
- go
- sql
goal: A WorkflowRun pins required placement labels and every Stage assignment, retry and recovery selects
  only compatible current Runtime instances, with auditable allocation provenance.
context:
  proposal: docs/proposals/0043-runtime-placement-labels.md
scope:
  in:
  - Additive requiredPlacementLabels on Run create/read/repeat and immutable PostgreSQL snapshots; strict
    validation on write and read.
  - Shared parent-matching fixture and deterministic matching in optimistic candidate edges, final reservation
    checks and model-capacity holds.
  - Persist actual instance placement labels on allocations and expose them after Runtime disconnects.
  - Update public API, clients, CLI callers and owning Run/Control Plane specifications.
  out:
  - Audit selection and propagation (V405-003).
  - UI selection and discovery (V405-004).
requirements:
- id: R1
  text: actual == required or actual starts with required + slash. Every requirement must match an actual
    label; empty requirements allow any otherwise-compatible Runtime. Requirements obey V405-001 grammar,
    limits and chain consistency.
- id: R2
  text: Pin the normalized requirement in the original Run transaction and request digest. Replay reconciles
    through the existing idempotency key before mutable reads. Retry/resume preserves the requirement;
    repeat drafts copy it for explicit editing.
- id: R3
  text: Preserve complete multi-Worker matching and atomic reservation. No matching fleet yields existing
    capacity backoff without fallback or pre-admission execution-budget consumption. Cancel and purge
    use existing ownership and cascade paths.
failure_outcomes:
- operation: Placement declaration, selection or observation at the task boundary
  permanent: Malformed, oversized or inconsistent input is rejected before mutation using the existing
    invalid_request/400 or registration-conflict/409 classification; no retry.
  retryable: Reuse subsystem storage_transaction_conflict/503 and existing bounded registration, controller
    or capacity backoff; read failures never fabricate empty success.
  ambiguous: Reconcile registration by immutable instance fingerprint and keyed writes through existing
    request receipts; do not introduce another journal.
  cancelled: Existing request/controller owner joins in-flight work; no new background worker survives
    cancellation.
  timeout: Existing registration/request/controller budgets own calls; capacity waiting does not consume
    the execution budget before admission.
cardinality:
- collection: Placement declarations and launch requirements
  expected: 1 location path per instance or launch
  maximum: 32 labels of at most 63 ASCII bytes each
  bound: Canonical sorted unique arrays, one compatible ancestor chain; no fleet IDs copied into launch
    snapshots.
- collection: Runtime fleet and UI inventory
  expected: A few local and cloud instances
  maximum: Existing bounded registry capacity times the per-instance label bound
  bound: Reuse registry limits and public pagination; no unbounded history scan or external lookup per
    label.
lifecycle:
- entity: Placement labels on existing Runtime incarnations, Runs, Audits or allocations
  delete: Follow the owning existing entity deletion API and authorization.
  cascade: No new side-table lifecycle; parent deletion removes its embedded placement data.
  retention: Runtime declarations live with their incarnation; immutable requirements and allocation provenance
    live with their owning retained Run/Audit.
acceptance_criteria:
- id: A1
  given: Real PostgreSQL and create/replay/repeat/resume operations
  when: A Run requires cloud/aws
  then: Requirements are immutable, validated on write/read, included in idempotency equality and preserved
    across retries and Server restart.
- id: A2
  given: A heterogeneous fleet with local, cloud/aws, cloud/hetzner and unlabeled Runtime instances
  when: cloud and cloud/aws Stages, multi-Worker assignments and model-capacity holds are evaluated
  then: Shared fixtures prove segment-boundary matching; only matching candidates are reserved or held
    and no partial assignment leaks slots.
- id: A3
  given: No matching capacity followed by a newly connected matching Runtime, cancellation or deletion
  when: The ordinary Scheduler retries or settles the Run
  then: The new Runtime can serve the pinned requirement, cancellation releases capacity, and durable
    allocation labels remain readable until parent purge.
tests:
- command: make test-postgres
  covers:
  - A1
  - A3
- command: go test ./internal/runstore ./internal/runservice ./internal/controlplane ./internal/scheduler
    ./internal/httpapi/public ./internal/publicclient
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api-postgres
  covers:
  - A1
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
