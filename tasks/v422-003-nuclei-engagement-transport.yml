schema_version: "1.0"
id: V422-003
title: "Run Nuclei with the engagement's allocation-local HTTP authority"
milestone: controlled-pentest-scanners-2026-10
epic: scan-tools
kind: feature
priority: P2
status: in_progress
depends_on: [V422-002]
languages: [go, python, yaml]
goal: >-
  Nuclei can run inside an engagement Audit with Runtime-local scope,
  credential isolation and optional HTTP limits from that exact allocation,
  without per-request Server authorization or a scanner bypass.
context:
  authority: "Explicit user request on 2026-10-30 to refactor and configure Nuclei after the pentest cleanup"
  specification:
    - docs/spec/tools/scanners.md
    - docs/spec/tools/http-caido.md
    - docs/spec/audits/audits.md
  code:
    - runtime/src/contractor_runtime/toolsets/scan
    - runtime/src/contractor_runtime/adapters/http_transport.py
    - internal/config/resolved/descriptors.go
scope:
  in:
    - "Inspect the actual Nuclei invocation and template protocols before choosing the local integration"
    - "Reuse the allocation-owned HTTP authority, optional limits and lifecycle for supported Nuclei HTTP execution"
    - "Support explicit assigned credential selection without leaking private values into argv, output, telemetry or artifacts"
    - "Reject unsupported templates, transports and execution options before target traffic"
    - "Verify real Nuclei traffic, forbidden destinations, retry, limits and cancellation"
  out:
    - "Browser, DNS, TCP, headless, code and OAST execution without a demonstrated enforceable engagement boundary"
    - "Server per-request journal, distributed request quotas or new persistent stores"
requirements:
  - id: R1
    text: "The same allocation HTTP policy owns Nuclei target requests and ordinary HTTP tool requests"
  - id: R2
    text: "Only configured limits apply; each allocation has independent counters and missing limits remain absent"
  - id: R3
    text: "Unsupported scanner paths remain rejected rather than bypassing engagement scope"
failure_outcomes:
  - operation: "Run Nuclei under engagement authority"
    permanent: "Invalid scope, unknown credential, unsupported template/protocol and exhausted configured limits reject without a fallback send"
    retryable: "Only existing bounded pre-send GET/HEAD/OPTIONS transport retry; no scanner-level replay of writes"
    ambiguous: "End the call without automatic replay or a durable possibly-sent marker"
    cancelled: "Join the Nuclei process and allocation HTTP tasks before closing local resources and clearing secrets"
    timeout: "Existing scanner and allocation deadlines bound the process and transport independently"
cardinality:
  - collection: "Selected Nuclei templates and physical requests"
    expected: "One pinned HTTP template selection per invocation"
    maximum: "Existing rulepack, output and selected-template bounds; configured allocation request/concurrency limits"
    bound: "Reuse streaming scanner output bounds and the existing allocation-owned transport"
lifecycle:
  - entity: "Allocation-owned Nuclei execution"
    delete: "Ordinary allocation teardown cancels and joins it"
    cascade: "Close any local bridge and all subprocess/HTTP work with the owning allocation"
    retention: "Only ordinary normalized scanner reports and explicitly selected evidence survive"
acceptance_criteria:
  - id: A1
    given: "An engagement with explicit optional HTTP limits and a supported Nuclei HTTP selection"
    when: "The Audit executes scan_nuclei"
    then: "Real Nuclei requests obey the same scope, credentials and allocation-local limits as HTTP tools"
  - id: A2
    given: "A forbidden origin/path/method/address or unsupported scanner protocol"
    when: "Nuclei would issue traffic"
    then: "The adapter refuses it and the forbidden target observes no request bytes"
  - id: A3
    given: "An in-flight Nuclei scan"
    when: "Cancellation, timeout, lease loss or release occurs"
    then: "The process and transport join and secrets are cleared without automatic replay of writes"
  - id: A4
    given: "Existing standalone Nuclei workflows"
    when: "The integration is enabled for engagement Audits"
    then: "Standalone behavior and normalized reports retain their contracts"
tests:
  - command: make test-nuclei-engagement
    covers: [A1, A2, A3]
  - command: "cd runtime && uv run pytest -W error tests/test_scan_toolset.py tests/test_http_proxy_bridge.py tests/test_nuclei_engagement.py tests/test_shared_engagement_allocation.py tests/test_engagement_allocation.py"
    covers: [A1, A2, A3, A4]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/config/... ./internal/contracts/... ./internal/auditservice/... ./internal/controlplane/..."
    covers: [A1, A2, A4]
  - command: make test-engagement-http-process
    covers: [A1, A2, A3]
  - command: make test-nuclei-web-e2e
    covers: [A4]
  - command: "cd ui && corepack pnpm exec vitest --run src/routes/checks/start/rulepack-metadata.test.ts"
    covers: [A4]
  - command: "go vet ./... && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks U1000 -tests -tags=e2e,integration ./... && go -C tools/testonlyexports run . -tags=integration,e2e -baseline tools/testonlyexports/baseline.txt <repository-root>"
    covers: [A1, A2, A3, A4]
  - command: "python3 scripts/check_release_verify_graph.py && python3 scripts/check_spec.py && python3 scripts/shared_fixture_gate.py --sources-only && cd runtime && uv run python ../scripts/check_tasks.py && uv run lint-imports --no-cache --no-logo"
    covers: [A1, A2, A3, A4]
  - command: "cd runtime && uv run ruff check . && uv run ruff format --check ."
    covers: [A1, A2, A3, A4]

decisions:
  boundary: >-
    Engagement remains scanner-neutral. The common Runtime HTTP transport owns
    destination/credential authority, optional slot limits, TLS and retry. An
    allocation-owned local HTTP proxy bridge delegates every accepted request to
    that same transport; Nuclei owns template selection, matching and normalized
    scanner output. Other scanners remain denied under engagement until their
    real execution path can use the common boundary; no provider-specific fields
    are added to engagement.
  execution: >-
    Use the installed Nuclei HTTP engine with zero scanner retries, disabled
    redirects/updates/OAST and a private authenticated per-invocation proxy config.
    HTTPS CONNECT terminates locally; target TLS is verified by the existing
    transport. Only selected snapshotted HTTP templates with an admitted normal
    HTTP feature set execute. Raw/unsafe/pipeline/race, external protocols, flow,
    external payload files and impure DSL helpers fail before target traffic.
    Private execution copies request disabled native cookies; the bridge also
    strips engine-added Cookie headers because explicit native jars can override
    that option. Credential and learned-cookie authority stays in Runtime.
    Selection uses inert metadata copies so original variables cannot evaluate
    during native listing. The supported engine is exactly provisioned v3.11.1.
  lifecycle: >-
    The complete scanner invocation is registered with the allocation HTTP owner.
    Cancellation joins the scanner process and bridge connections before scratch
    removal; no private proxy credential or target credential reaches argv or
    automatic report diagnostics. Bridge failures cannot become a successful scan.
  reversal: >-
    Expand the admitted template features or scanner set only with a concrete
    caller and real traffic evidence that the same boundary remains enforceable.

  evidence:
    - "Installed Nuclei v3.11.1 and its actual help/proxy behaviour"
    - "https://github.com/projectdiscovery/nuclei/blob/v3.11.1/pkg/protocols/http/httpclientpool/clientpool.go"
    - "https://github.com/projectdiscovery/nuclei/blob/v3.11.1/pkg/protocols/http/request.go"
    - "https://github.com/projectdiscovery/nuclei/blob/v3.11.1/pkg/protocols/common/variables/variables.go"

delivery:
  deferred_gates:
    authority: >-
      User explicitly requested merging implemented work while postponing general
      unrelated failures, then continuing the next planned task. Focused
      acceptance checks remain required; full-suite success is not claimed.
    command: make lint
    outcome: >-
      The gate stops in the unchanged UI export checker: MAXIMUM_AUTOMATIC_OPENAPI_BYTES
      in preview-plan.ts and PLANNER_FACTS/PlannerFacts in studio/planners.ts.
      Go vet, staticcheck, test-only exports, Runtime Ruff/import contracts and
      specification/task/fixture/release-graph checks are run independently.
