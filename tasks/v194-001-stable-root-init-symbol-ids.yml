schema_version: '1.0'
id: V194-001
title: Keep root __init__.py symbol IDs stable across Trailmark rebuilds
milestone: code-analysis-identity-2026-10
priority: P1
status: in_progress
depends_on: []
languages: [python]
goal: Prevent temporary mirror names from changing root-package symbol identities and projections.
context:
  issue: https://github.com/grauwolf32/contractor/issues/188
  finding: Trailmark uses the random parse-root directory name for the root __init__.py module ID.
scope:
  in:
    - Canonicalize root __init__.py graph identities and module projection without changing Trailmark source files.
    - Cover symbol IDs, relationship and path lookups after same-digest rebuilds.
    - Verify unrelated package symbols and entrypoint detection still work.
  out:
    - Changing snapshot digests, mirror cleanup or other graph parsers.
acceptance_criteria:
  - {id: A1, text: Root __init__.py symbol IDs and indices remain identical after invalidate and rebuild of the same digest.}
  - {id: A2, text: Existing IDs work for callers, callees and paths after rebuild.}
  - {id: A3, text: No projected symbol name or qualified lookup key exposes the mirror name.}
  - {id: A4, text: Entrypoint detection and mirror cleanup remain correct.}
tests:
  - {command: cd runtime && uv run pytest tests/test_trailmark_child.py tests/test_code_analysis_graph.py tests/test_code_analysis_child_lifecycle.py, covers: [A1, A2, A3, A4]}
  - {command: make lint, covers: [A1, A2, A3, A4]}
