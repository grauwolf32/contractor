schema_version: "1.0"
id: V414-040
title: "Answer Run Skill failures with their own public error codes instead of internal_error"
milestone: review-v407-v409-followups-2026-10
epic: agent-skills
kind: defect
introduced_by: V10-003
priority: P2
status: pending
depends_on: []
languages: [go]
goal: >-
  Every agentskills.RunSkillError that reaches a public handler answers its
  own registered code, status and retryability, so a Skill limit, a missing
  current Skill or a transient Skill source failure at Run creation or
  Audit start is never the retryable 500 internal_error.
context:
  specification:
    - docs/spec/tools/skills.md
    - docs/spec/platform/errors.md
    - docs/spec/api/public-api.md
  review: >-
    Found by the V414-035 lane on 2026-10-25 by code reading
    (tasks/done/v414-035-run-skill-missing-source-code.yml). The user asked
    to fix the bugs found during the delivery first.
  severity: medium
  finding: >-
    agentskills.RunSkillError (internal/agentskills/run.go:29-40) has Code
    and Retryable but no ErrorKind method, so apierror.Of
    (internal/apierror/kind.go:73) does not classify it and handleError
    (internal/httpapi/public/errors.go:25-36) answers the retryable 500
    internal_error. runservice returns it unwrapped from public Run creation;
    auditservice/start.go:323 builds one for Audit start. A Skill limit
    (skill_limit_exceeded), a missing current Skill or
    skill_artifact_not_found therefore reach a client as an internal error
    that it retries.
  siblings: >-
    Every public path that can return a RunSkillError: POST /v1/runs, Audit
    start, Eval preflight (internal/evalservice/preflight_errors.go already
    converts it; confirm), and any CLI client mapping in
    internal/publicclient. Each answers the registered code or is ruled out
    with the reason.
scope:
  in:
    - "Classify RunSkillError for the public API with one mapping from its Code to a registered apierror Kind (status and retryability from errors.md), adding the rows errors.md lacks."
    - "Declare the responses in api/openapi/contractor-public-v1.yaml where an operation can return them, regenerate both clients, and run make verify-public-api."
    - "Handler tests on the real store that drive POST /v1/runs and Audit start into each Skill failure and observe the registered code and status."
  out:
    - "Changing when Skill failures happen."
acceptance_criteria:
  - id: A1
    text: "POST /v1/runs with too many Skills, a missing current Skill, and a removed pinned source answers each failure's registered code and status, never internal_error."
  - id: A2
    text: "Audit start and every other sibling path answer the same codes or are ruled out with the reason."
  - id: A3
    text: "The handler tests fail on the unfixed code with 500 internal_error."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/httpapi/public/... ./internal/agentskills/... ./internal/runservice/... ./internal/auditservice/..."
    covers: [A1, A2, A3]
  - command: make verify-public-api
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2, A3]
