schema_version: '1.0'
id: V431-001
title: Fence Planner start with the owning Run lifecycle
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P2
status: in_progress
depends_on: []
languages:
- go
goal: An accepted cancellation prevents a later Planner start from creating a session or events.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: internal/runstore/stage_store.go:266 locks the Run but does not check its lifecycle; StartPlanner
    changes a preparing Stage to running after RequestRunCancellation committed cancelling.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/runs.md#RUN-R29
  - docs/spec/execution/runs.md#RUN-R106
scope:
  in:
  - Read and check the Run state under the existing Run-first lock before the Stage CAS.
  - Add real PostgreSQL coverage for cancellation winning before and while Planner start waits; keep successful
    start, caller transactions and retry semantics.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: Given cancellation committed first, Planner start returns ErrConflict and leaves Stage, sessions
    and event sequence unchanged.
- id: A2
  text: Given a running Run, the existing Planner start and transaction/lock ordering tests still pass.
- id: A3
  text: The cancellation regression fails on the unfixed implementation.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/planner/session/... ./internal/scheduler/...
  covers: &id001
  - A1
  - A2
  - A3
- command: make lint
  covers: *id001
introduced_by: V409-003
