schema_version: "1.0"
id: V414-013
title: "Stop ADK's module-level callable caches from keeping a released allocation's tools alive"
milestone: review-v407-v409-followups-2026-10
epic: planner-worker
kind: defect
introduced_by: MVP-012
priority: P2
status: pending
depends_on: []
languages: [python]
goal: >-
  After allocation release nothing in the Runtime process, including google-adk's
  module-level LRU caches, references the allocation's tool instances, their
  ArtifactClient, sessions or MetricsState, so release erases them as LIFE-WRK-3
  and RTA-R90 require.
context:
  review: >-
    tasks/done/v407-011-worker-state-publication-cost.yml, verification results:
    "Pre-existing finding, not fixed (outside scope): ... find_context_parameter
    is a module-level functools.lru_cache(maxsize=1024) keyed on the tool
    callable ... the retention itself needs its own defect task."
  specification:
    - docs/spec/execution/runtime-agent.md#RTA-R87
    - docs/spec/execution/runtime-agent.md#RTA-R90
    - docs/spec/platform/lifecycle.md
    - docs/spec/platform/security.md#SEC-R32
  severity: medium
  finding: >-
    runtime/src/contractor_runtime/worker/runtime.py:207 wraps every
    allocation-bound tool instance in FunctionTool(tool). In the pinned
    google-adk 2.8.0 (runtime/pyproject.toml google-adk==2.8.0, uv.lock),
    FunctionTool.__init__ calls google/adk/utils/context_utils.py:67-68
    find_context_parameter, a module-level @functools.lru_cache(maxsize=1024)
    whose key is the callable itself, and FunctionTool._get_declaration calls
    google/adk/tools/function_tool.py:75-76 _build_declaration_cached, a second
    lru_cache(maxsize=1024) keyed on self.func, on every model request. Both
    caches hold strong references to the key. Reproduction on 19f7477f
    (temporary pytest probe using test_allocation.make_service/make_spec):
    after prepare, finalize, release and gc.collect(), weakrefs to the
    released read_artifact and write_artifact tools and their ArtifactClient
    are still alive (find_context_parameter currsize=2); after
    find_context_parameter.cache_clear() and gc.collect() they are gone.
    Each retained tool keeps its MetricsState (up to 1000 tool-call records with
    4 KiB argument summaries), ArtifactClient and toolset session reachable
    until 1024 newer callables evict them, which is dozens of allocations.
    runtime/tests/test_worker_state.py:674-678 works around exactly this with a
    manual cache_clear(). Secret values: every holder inspected erases its
    secrets on close (ArtifactTool._secrets, HTTP session, Caido metric
    secrets, Interactsh private values, FindingPublisher.secrets), and in the
    probe gc.get_referrers on the RuntimeSettings token found only the test's
    own spec after release, so plaintext retention is not demonstrated; the
    retained graph still violates LIFE-WRK-3 ("Release erases ... clients")
    and makes SEC-R32 depend on every close() succeeding.
  siblings: >-
    Both ADK caches (find_context_parameter and _build_declaration_cached) are
    in scope. Other ADK callers of find_context_parameter (mcp_tool,
    workflow/_function_node, eventarc) are not used by the Runtime.
    ContractorSkillTool (agent_skills/runtime.py:253) subclasses BaseTool and
    does not pass through these caches; verify and record. The summarizer and
    result finalizer LlmAgents receive no FunctionTools; verify and record.
    test_worker_state.py:674-678 must drop its cache_clear() workaround.
  provenance: >-
    The FunctionTool(tool) pattern over allocation-bound tool instances was
    added in a565c242 ("feat: add ADK worker and allocation-scoped A2A",
    runtime/src/contractor_runtime/adk_runtime.py:124), the
    implementation_commit of tasks/done/mvp-012-python-adk-a2a.yml (MVP-012),
    with google-adk pinned at 2.8.0 from the same commit; 22b5ebc1 (V17-002)
    only moved the line.
  decision: >-
    Choose and record (AGENTS 3.10) one of: (a) clear both caches at the end
    of allocation release after every tool is closed; the Runtime has one
    allocation slot, so no other allocation's entries exist, and the cost is
    one declaration rebuild per tool per allocation; it touches a private ADK
    name (_build_declaration_cached), so a guard test must fail when an ADK
    upgrade renames or removes it; (b) hand FunctionTool an allocation-agnostic
    callable (for example a thin wrapper that exposes the tool's signature and
    docstring and reaches the tool through a weak reference cleared at
    release), so the cached key retains nothing allocation-owned; (c) subclass
    FunctionTool to bypass both caches. Reversal condition: an ADK release
    that keys these caches weakly or per instance.
scope:
  in:
    - "Remove the retention for both ADK caches with the chosen design, applied in the release path
      (allocation/service.py release) or at tool construction, for every Toolset."
    - "Record the decision, alternatives and reversal condition in docs/spec/execution/runtime-agent.md
      next to RTA-R90 (new numbered requirement) and in this task."
    - "A regression test on the real prepare -> invocation (fake model that triggers declaration
      building) -> finalize -> release path, without a manual cache_clear(), asserting that tools,
      their ArtifactClient and the MetricsState are collected and that no object still refers to
      the RuntimeSettings secret values."
    - "Drop the cache_clear() workaround in test_worker_state.py."
  out:
    - "Upstream ADK changes or a google-adk version bump."
    - "Changing tool close() semantics, metric retention bounds or the release protocol."
failure_outcomes:
  - operation: "Cache eviction or wrapper teardown during release"
    permanent: "A failure to clear is a Runtime bug: release must still erase State and secrets
      and report the cleanup failure through the existing release-cleanup error path, keeping the
      slot fenced (RTA-R91)."
    retryable: "An idempotent release retry repeats the step."
    ambiguous: "Not applicable; local in-process state only."
    cancelled: "Release cleanup is not cancellable by the tool call; the step runs after tools are
      closed."
    timeout: "Owned by the existing release cleanup deadline."
acceptance_criteria:
  - id: A1
    given: "An allocation prepared with run-artifacts tools and one Worker invocation that builds tool
      declarations"
    when: "it is finalized and released and gc.collect() runs, with no test-side cache_clear()"
    then: "weak references to every tool, its ArtifactClient and the allocation MetricsState are dead"
  - id: A2
    given: "The same scenario with HTTP, Caido or Interactsh toolsets prepared through their test
      adapters where available"
    when: "release completes"
    then: "no live object refers to the RuntimeSettings secret values or the session credentials"
  - id: A3
    given: "Two allocations prepared one after the other in the same process"
    when: "the second runs after the first is released"
    then: "the second's tools work and their declarations are identical to a fresh process"
  - id: A4
    given: "The unfixed implementation (19f7477f)"
    when: "the A1 regression test runs"
    then: "it fails because the released tools are still reachable from the ADK caches"
tests:
  - command: "cd runtime && uv run --locked pytest -q tests/test_worker_state.py tests/test_allocation.py tests/test_adk_runtime.py"
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A3]
