schema_version: "1.0"
id: V414-007
title: "Register the 2 MiB Planner session state bound and the other unregistered stored-size CHECKs"
milestone: review-v407-v409-followups-2026-10
epic: planner-worker
kind: chore
introduced_by: V384-001
priority: P3
status: in_progress
depends_on: []
languages: [markdown, go]
goal: >-
  The 2 MiB Planner session state bound has one owning requirement and a LIM row
  that names both enforcers and what each measures, and every other stored-size
  CHECK constraint is either registered or named as the storage guard of an
  existing LIM row.
context:
  review: >-
    tasks/done/v409-010-byte-bounded-run-reads.yml (verification.review_follow_up:
    "the constant also pre-checks Planner session state (stored bound
    planner_session_state_size, the unregistered 2 MiB session JSON of WFL-R87)").
    The request named V407-027 as the origin; tasks/done/v407-027-shared-controller-claim-loop.yml
    added no CHECK constraint and does not mention this bound.
  specification:
    - docs/spec/platform/limits.md
    - docs/spec/configuration/workflows.md#WFL-R87
    - docs/spec/execution/planners.md#PLN-R106
    - docs/spec/api/public-api.md#API-R110
  finding: >-
    internal/persistence/migrations/000001_baseline.sql:1995 declares
    planner_session_state_size CHECK (octet_length(state::text) <= 2097152) on
    planner_sessions; internal/planner/session/service.go:29 (maxSessionJSONBytes,
    used at :642, :677, :697) and internal/runstore/stage_store.go:228-230 and
    planner_store.go:42-44 (maxRunEventDataBytes) pre-check the submitted compact
    JSON. WFL-R87 (docs/spec/configuration/workflows.md:170-172) mentions "the 2
    MiB session JSON" but docs/spec/platform/limits.md has no row for it
    (LIM-PLN-1..8 cover other bounds; LIM-API-25 covers workflow_run_events data
    only), and no planners.md requirement owns it. The comment at
    internal/runstore/run_event_store.go:21-29 says so ("which has no registry
    entry"). A grep of limits.md for the stored-size CHECKs in the baseline finds
    no row naming, for example, llm_credentials_gateway_policy_check (64 KiB,
    pre-checked by internal/credentials/repository.go:27,387),
    runtime_management_operations_result_check (16 KiB),
    credential_operations_request_check (64 KiB), audit_events_summary_check
    (64 KiB) or the Audit snapshot CHECKs (audits_profile_snapshot_check and
    audits_input_selection_check 8 MiB, audits_baseline_snapshot_check 16 MiB).
  siblings: >-
    Every octet_length(...) size CHECK in internal/persistence/migrations (the
    jsonb-text ones are listed in V414-008's context; text and bytea ones such as
    performance_minutes_payload_check, audit_report_pages_content_check and the
    credential ciphertext CHECKs). For each, the task either adds a LIM row,
    adds the constraint as an enforcer of an existing LIM row, or records why it
    is an internal invariant rather than a limit (for example a fixed-width hash
    or nonce length). Classification of a CHECK violation at write time is
    V414-008, not this task.
  provenance: >-
    The CHECK came with 2fbac4dd (V3-009, 2026-08-30), before the LIM registry
    existed; the registry was written on 2026-10-11 by 2b675dda without a task.
    V384-001 (e8548f1e) then wrote WFL-R87 citing the 2 MiB session JSON while
    registering only LIM-PLN-3, so it is the first task that referenced the bound
    without registering it.
scope:
  in:
    - "A planners.md requirement (next free PLN-Rn) that owns the session state bound: what is stored, the 2 MiB stored-text measure, the Server pre-check on submitted JSON and that jsonb re-serialisation can lengthen a value (as LIM-API-25 already says for Run events)."
    - "A LIM-PLN row for it naming both enforcers, and WFL-R87 linking that row instead of the bare phrase."
    - "An inventory of every stored-size CHECK in the migrations with its disposition (new LIM row, enforcer added to an existing row, or internal invariant), applied to limits.md."
    - "A PostgreSQL test that reads planner_session_state_size and workflow_run_events_data_check from pg_constraint on the migrated schema and asserts that each bound equals the Go constant and the LIM row that names the constraint, so the three definitions cannot drift."
  out:
    - "Changing any bound or how it is enforced."
    - "Error classification of a CHECK violation (V414-008)."
acceptance_criteria:
  - id: A1
    given: "docs/spec/platform/limits.md and docs/spec/execution/planners.md"
    when: "scripts/check_spec.py runs"
    then: "a LIM-PLN row and an owning PLN requirement define the 2 MiB stored session state with both enforcers, and WFL-R87 links them"
  - id: A2
    given: "the inventory of octet_length CHECK constraints"
    when: "it is compared with limits.md"
    then: "every stored-size CHECK has a recorded disposition and each limit it enforces has a LIM row"
  - id: A3
    given: "the migrated schema"
    when: "the drift test runs"
    then: "it passes, and it fails if the CHECK literal, the Go constant or the LIM row value changes alone"
  - id: A4
    given: "the unfixed tree at 19f7477f"
    when: "the drift test runs"
    then: "it fails, because no LIM row names planner_session_state_size"
tests:
  - command: make lint
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -tags=integration -count=1 ./internal/runstore/... ./internal/planner/session/..."
    covers: [A3, A4]
