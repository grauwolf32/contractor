  - Describe optional summarizer instructions as a safe exact reference.
  - Describe optional Worker telemetry export retry settings with actual bounds and defaults; keep legacy
    documents valid.
  - Preserve supported summarizer references and bounded retry fields through UI normalization, rejecting
    unknown nested retry data.
  out:
  - Change ordinary Worker finalization, LLM budgets or eval/toolset implementation.
  - Change published execution policy, credential authority, owner checks or CAS semantics beyond the
    named contract corrections.
  - Deploy services or run live models.
acceptance_criteria:
- id: A1
  text: All repository AgentTemplate/ModelPolicy/Gateway public projections validate against their public
    response schemas.
- id: A2
  text: Supported telemetry retry request and normalized response validate; invalid retry settings and
    unknown properties are rejected.
- id: A3
  text: Both generated clients expose supported optional fields without weakening closed objects.
- id: A4
  text: UI publication/read normalization preserves retry and safe summarizer refs; defaults remain optional
    in generated request types.
tests:
- command: go test -count=1 ./internal/httpapi/public -run PublicConfigurationProjectionContracts
