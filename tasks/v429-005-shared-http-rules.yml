schema_version: "1.0"
id: V429-005
title: "Unify HTTP header admission and truthful truncated-body reads"
milestone: runtime-ownership-2026-11
epic: execution-core
kind: defect
introduced_by: V411-027
priority: P1
status: in_progress
depends_on: []
languages: [python]
goal: "Ordinary and controlled HTTP merge and bound headers consistently and disclose retained response truncation in body reads and history."
context:
  authority: >-
    User decision 2026-11-02: implement the accepted points 1–5 from the Runtime
    review: shared async joining, typed resources, CAS reconciliation, HTTP rules
    and responsibility-based orchestrator extraction. Confirmed lifecycle and
    HTTP defects have their own tasks in this package.
  specification:
    - docs/spec/execution/runtime-agent.md
    - docs/spec/execution/worker.md
    - docs/spec/platform/failure-model.md
    - docs/spec/tools/http-caido.md
  finding: "http/controlled.py:117 merges case-sensitively and set_session bypasses aggregate bounds; transport-truncated bodies become complete retained captures and history/read_body omit truncation. Ordinary HTTP is the sibling rule owner."
  boundary: >-
    Common modules own mechanics; callers retain deadlines, fencing, authority,
    failure classification and semantic completion. Keep the model finalizer,
    configured model, Artifact API and allocation state/idempotency contracts.
    No generic retry or lifecycle framework and no new wire fields.
  scale_and_failure: >-
    No new concurrent fan-out or unbounded collection reads. Join only work
    already owned under the existing operation deadline; retain caller error
    precedence on success, failure, cancellation and timeout. CAS replays exact
    bytes once and reads under the current domain byte ceiling.
scope:
  in:
    - "Share case-insensitive header merge and full aggregate validation within the HTTP package."
    - "Retain transport truncation in shared request records, body reads and history; preserve preview truncation separately."
    - "Preserve controlled private buffers, credential authority and ordinary trusted capture rules; regressions use the real HTTP transport."
  out:
    - Removing the model result finalizer, Memory read parallelism, A2A retention and Gateway/OTLP response limits.
    - Reopening V425-034, changing public/wire contracts or modifying unrelated macOS baseline failures V425-001/002.
acceptance_criteria:
  - id: A1
    text: "Share case-insensitive header merge and full aggregate validation within the HTTP package."
  - id: A2
    text: "Retain transport truncation in shared request records, body reads and history; preserve preview truncation separately."
  - id: A3
    text: "Preserve controlled private buffers, credential authority and ordinary trusted capture rules; regressions use the real HTTP transport."
tests:
  - command: cd runtime && uv run pytest -W error tests/test_http_toolset.py tests/test_audit_http_credentials.py tests/test_engagement_target.py
    covers: [A1, A2, A3]
  - command: cd runtime && uv run ruff check . && uv run ruff format --check . && uv run lint-imports --no-cache --no-logo
    covers: [A1, A2, A3]
