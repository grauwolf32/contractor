schema_version: "1.0"
id: V11-002
title: Implement confined Workspace protocols and rooted local backend
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-001]
languages: [python]

goal: >-
  Establish one fsspec-backed WorkspaceReader/Writer abstraction with virtual
  named roots and a local implementation that cannot escape or disclose an
  operator-configured project directory.

context:
  path_contract: >-
    Model-visible paths are POSIX virtual paths /<mount>/...; relative input is
    rooted by adding /. Reject NUL/control characters, backslash, URI/file
    schemes, Windows drive/UNC syntax and every .. component. Normalize repeated
    slash and dot, Unicode NFC, at most 32 components and 1024 UTF-8 bytes. The
    first component must be a configured mount. Outputs never contain host
    paths.
  authority: >-
    WorkspaceReader provides roots/stat/list/glob/read_text. WorkspaceWriter
    adds write_text/mkdir/remove/copy/move. Tool factories will receive narrowed
    views, never raw pathlib.Path, lower fsspec instance or arbitrary protocol
    options. local+hostWrite=false has no writer; true allows rooted direct host
    writes and has no diff/rollback promise.
  bounds: >-
    Maximum resulting text file is 4 MiB, one supplied write value 1 MiB,
    effective mount has at most 10,000 model-writable files and 64 MiB text.
    Scans are separately bounded by callers; the core must provide deterministic
    sorted iteration and cancellation-safe mutations. Direct local multi-entry
    operations preflight/stage bounded targets and roll back ordinary errors,
    but do not claim recovery after Runtime/host crash; overlay-local owns that
    stronger contract.

scope:
  in:
    - Add fsspec as an explicit Runtime dependency with the repository's pinned major/minor compatibility range rather than relying on a transitive ADK dependency.
    - Define immutable WorkspaceRoot/Entry/Mutation DTOs and Reader/Writer protocols independent of ADK tool schemas.
    - Implement one mount router that validates a virtual path exactly once then passes an opaque mount-relative path to a selected backend.
    - Implement RootedLocalFileSystem/adapter without raw __getattr__ delegation, URL chaining or caller-provided storage options.
    - Reject and hide symlinks, multiply linked regular files and special files in every component for direct read/list/walk/glob/write/remove/copy/move; use lstat/fstat identity checks around opens and sanitize all OS/fsspec exceptions.
    - Implement path-aware deterministic star/double-star glob primitives and honest scanned-entry ceiling metadata for later tools.
    - Make whole-file writes validate UTF-8/no-NUL/quotas first, use same-directory no-follow temporary regular files, flush and atomic replace; never truncate a valid target on failure.
    - For bounded direct-local multi-entry copy/move/remove, preflight all entries and use staged targets/backups for in-process rollback; defer coroutine cancellation through commit/rollback and document that process-crash recovery is unsupported in direct mode.
    - Forbid cross-mount copy/move, removing a mount root, recursive move into self/descendant and writing through a file parent.
  out:
    - In-memory snapshot, OverlayFS, ADK tools, startup write probe, materialization journal or Server changes.

deliverables:
  - {path: runtime/src/contractor_runtime/projectfs/core.py, description: Backend-neutral protocols DTOs quotas and mount router.}
  - {path: runtime/src/contractor_runtime/projectfs/paths.py, description: Single virtual path/glob validation implementation.}
  - {path: runtime/src/contractor_runtime/projectfs/local.py, description: Rooted no-follow local fsspec adapter and optional writer.}
  - {path: runtime/tests/test_workspace_paths.py, description: Traversal Unicode scheme and normalization matrix.}
  - {path: runtime/tests/test_workspace_local.py, description: Read/write/confinement/type/quota and atomic-failure tests.}

requirements:
  - id: R1
    text: The host root and canonical host child path never appear in a public DTO, sanitized exception or retained metric input.
  - id: R2
    text: Every operation is routed by a validated mount-relative token; a backend never reparses model input as a host path or fsspec URL.
  - id: R3
    text: Existing unreadable paths fail safely and do not masquerade as empty successful listings, while absent paths return the documented not-found class.
  - id: R4
    text: Path and mutation behavior is deterministic across Linux locale/CWD and does not follow links even when CWD is below the configured root.
  - id: R5
    text: The projectfs package does not rename, replace or reinterpret the existing contractor_runtime.workspace allocation-scratch module.

acceptance_criteria:
  - id: A1
    given: Parent, absolute-looking virtual, file URI, Windows, Unicode and sibling-prefix attack paths.
    when: Every reader/writer operation receives them.
    then: No access escapes the selected named root and errors contain only validated virtual data.
  - id: A2
    given: In-root and escaping symlinks, a hard link to an outside-named inode and a concurrent replacement attempt.
    when: List/read/write/remove/glob run.
    then: Links are neither followed nor exposed and no outside file is read, changed or deleted.
  - id: A3
    given: A permitted local host-write mount.
    when: Valid write/copy/move/remove operations and injected pre-replace failures run.
    then: Success changes only rooted targets, failure preserves prior bytes and every quota/type rule is enforced.

tests:
  - {name: path-core, command: "cd runtime && uv run pytest tests/test_workspace_paths.py tests/test_workspace_local.py", covers: [A1, A2, A3]}
  - {name: runtime-regression, command: "cd runtime && uv run pytest", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
