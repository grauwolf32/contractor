schema_version: "1.0"
id: V371-005
title: "Guard the Worker State read cost with a deterministic bound, make its benchmark runnable and re-measure it"
milestone: hub-audit-defects-2026-10
epic: planner-worker
kind: chore
introduced_by: V370-026
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: "A regression in the cost of reading a changed Worker State at the contract maximum fails a deterministic test, BenchmarkWorkerStateChangedRevision runs again, and the 60 ms target of V370-026 is confirmed on a quiet host or CI, or replaced by a measured one."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G1), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/execution/planners.md#PLN-R115"
  finding: >-
    V370-026 was completed with its acceptance criterion ("a benchmark at
    10,000 paths stays under 60 ms") met only by calibration:
    BenchmarkWorkerStateChangedRevision
    (internal/planner/stateview/read_cost_test.go:72-99) took a median of
    71 ms (67-83 ms) on the loaded 4-CPU build host (770 ms before), which
    the task scaled to about 24 ms on the audit's machine. The benchmark only
    reports ns/op, allocations and cpu-ms/op; nothing fails when the cost
    regresses, and the figure was never taken on CI or an idle host. The
    13 MB and 40k allocations per call it recorded are machine-independent,
    but no test holds them.
    Since V369-002 (22752c39, landed after a07f5e9) the benchmark cannot run
    at all: maximumStateBody (read_cost_test.go:38-60) starts from
    stateFixture (service_test.go:256-265), which reads the shared fixture
    api/testdata/v1alpha1/valid/agent-state-snapshot.json through
    contractstest.ReadFile, and contractstest
    (internal/contracts/contractstest/fixtures.go:108-115) fails every test
    whose name does not start with TestShared. On b523ae77
    `go test -run '^$' -bench WorkerStateChangedRevision ./internal/planner/stateview`
    fails immediately with "BenchmarkWorkerStateChangedRevision reads the
    shared fixture ...; a test that reads api/testdata is named TestShared*".
  measurement: >-
    2026-10-24 probe on b523ae77 (a temporary TestShared* test running the
    benchmark's loop body 20 times, removed afterwards): 1,939,213-byte
    maximum State, 40,251 allocations and 12,716,818 allocated bytes per
    changed-revision read, median 25.9 ms (24.0-27.4 ms) on an Apple M5 Max
    with a load average of about 4.5. This is one loaded developer host, not
    the CI or quiet-host figure A3 asks for.
    2026-10-30 after the fix (go1.26.9 darwin/arm64, Apple M5 Max, 18 CPUs;
    five other agent lanes building and testing on the same host, load
    average 5.4-6.9 during the run, so the wall times are indicative, not a
    quiet-host figure): `go test -run '^$' -bench WorkerStateChangedRevision
    -count 10 ./internal/planner/stateview` on the programmatic 1.94 MB
    maximum State took a median of 19.3 ms/op (17.3-21.2 ms), 20.3 cpu-ms/op
    (18.4-21.1), 11.6-13.2 MB/op and 40,203-40,228 allocs/op, well under the
    60 ms target, which stays. TestWorkerStateChangedRevisionReadCostIsBounded
    measures 40,193 allocations and 10.4 MB per read (GOMAXPROCS 1, after a
    collection) against bounds of 48,000 and 16 MiB; with the pre-PLN-R115
    snapshot copy restored in Service.load it measured 80,329 allocations and
    20.6 MB and failed (A1). On main before the fix the benchmark command
    still failed on the shared-fixture guard (A2). The race detector pads
    allocations (18.2 MB per read), so the guard builds with !race.
  siblings: >-
    No other completed acceptance in internal/planner rests on a wall-clock
    benchmark without a gate. The other benchmarks in packages that read
    shared fixtures (internal/planner/a2a client_connection_experiment_test.go,
    internal/scanplan source_reuse_test.go) still run (checked with
    -bench . -benchtime 1x on b523ae77). V341-001 (in progress) owns the CI
    measurements of the Runtime probe timeouts. V407-011 reduced the
    Runtime's State publication cost, not this Planner-side read.
  revalidated: >-
    2026-10-24 on b523ae77: the missing gate still holds (read_cost_test.go
    has only the benchmark; no test in internal/planner uses AllocsPerRun or
    an allocation bound). New: the listed benchmark command fails since
    V369-002, so this task now also makes it runnable. Line references
    refreshed and a fresh measurement recorded.
scope:
  in:
    - "Make BenchmarkWorkerStateChangedRevision runnable: build its maximum State without the shared-fixture guard rejecting it (a package-local fixture or a programmatic snapshot), or move the shared read into a TestShared* test, without weakening contractstest."
    - "A test (not only a benchmark) that reads the maximum State once per changed revision and fails above a recorded allocation count and allocated-byte bound, with its headroom stated in the test. If it reads the shared fixture it is named TestShared* so make test-wire-cross-language runs it."
    - "Record BenchmarkWorkerStateChangedRevision on CI or an idle host (median of repeated runs, CPU model and load); if it stays above 60 ms, record the measured target and its reason with PLN-R115 instead of the calibrated one."
  out:
    - "Validation strength and the decoder (V370-026's decision)."
    - "The shared-fixture naming rule of V369-002."
acceptance_criteria:
  - id: A1
    given: "The read path with the snapshot clone or a second strict decode restored"
    when: "The new test runs"
    then: "It fails on the allocation or byte bound."
  - id: A2
    given: "The repository at the fix"
    when: "go test -run '^$' -bench WorkerStateChangedRevision runs"
    then: "The benchmark completes and reports ns/op, B/op, allocs/op and cpu-ms/op; on b523ae77 the same command fails on the shared-fixture guard."
  - id: A3
    text: "The quiet-host or CI measurement is recorded with its method, and the 60 ms target is either met or replaced by the measured figure with its rationale."
tests:
  - command: "go test -count=1 ./internal/planner/stateview"
    covers: [A1]
  - command: "go test -run '^$' -bench WorkerStateChangedRevision -count 10 ./internal/planner/stateview"
    covers: [A2, A3]
  - command: "make test-wire-cross-language"
    covers: [A1]
  - command: make lint
    covers: [A1, A2, A3]
