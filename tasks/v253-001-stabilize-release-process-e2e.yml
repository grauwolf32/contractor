schema_version: '1.0'
id: V253-001
title: Restore process e2e coverage after release-gate consolidation
milestone: release-gate-test-dedup-2026-10
priority: P1
status: in_progress
implementation_commit: null
depends_on: [V155-001]
languages: [go]
goal: Make retained process e2e assertions reflect current catalog ordering and single-active server behavior.
context:
  issue: https://github.com/grauwolf32/contractor/issues/304
  finding: The first consolidated CI process pass exposed assertions that depend on database collation and a second active Server.
scope:
  in:
    - Compare bundled Skill catalog entries by identity rather than their database collation order.
    - Hand over the single active Server lease before testing a foreign owner's Run visibility.
    - Re-run affected process tests and inspect any remaining release-gate failures.
  out:
    - Weaken Skill catalog content validation or Run owner isolation.
acceptance_criteria:
  - {id: A1, text: The Skill catalog assertion accepts either database collation order but rejects missing, duplicate, or malformed entries.}
  - {id: A2, text: The foreign-owner process becomes active before owner-isolation API checks.}
  - {id: A3, text: Focused process e2e tests and relevant release graph checks pass.}
tests:
  - {command: CONTRACTOR_TEST_DATABASE_URL=<postgres> go test -tags=e2e -count=1 ./tests/e2e -run 'TestAgentSkillsMVPProcesses|TestRunMetadataLabelsAcrossProcesses', covers: [A1, A2]}
  - {command: make lint, covers: [A3]}
