schema_version: '1.0'
id: V59-003
title: Separate RuntimeConfig author/read contracts and preserve explicit null in Go
milestone: public-api-review-corrections
priority: P2
status: in_progress
depends_on: []
languages:
- go
- yaml
- typescript
goal: Separate RuntimeConfig author/read contracts and preserve explicit null in Go.
context:
  authority: User requested detailed analysis, concrete correction tasks and implementation of the public
    OpenAPI review.
  review: docs/research/2026-09-19-public-openapi-review.md
  design: docs/plans/2026-09-19-public-openapi-corrections.md
  finding_ids:
  - R04
  - R09
  specification:
  - docs/spec/06-server-ui-and-operations.md
  - docs/spec/07-runtime-labels-and-infrastructure-config.md
scope:
  in:
  - Use separate author and resolved document schema families for gateway selectors and exact refs.
  - Remove unsupported null gateway forms while preserving supported explicit clear operations.
  - Generate three-state Go nullable types, update affected callsites and dependencies, and test serialized
    typed requests.
  out:
  - Change ordinary Worker finalization, LLM budgets or eval/toolset implementation.
  - Change published execution policy, credential authority, owner checks or CAS semantics beyond the
    named contract corrections.
  - Deploy services or run live models.
acceptance_criteria:
- id: A1
  text: Publication accepts selector strings and rejects resolved gateway objects and null gateway forms;
    resolved reads describe exact gateway refs.
- id: A2
  text: Generated Go request bytes distinguish absent, null and value for Worker and Planner runtime patches
    and nullable credential fields.
- id: A3
  text: Existing CLI and UI consumers compile and retain their mutation behavior after generated-type
    changes.
tests:
- command: go test -count=1 ./internal/publicclient/... ./internal/runtimeconfig ./internal/cli ./internal/httpapi/public
  covers:
  - A1
  - A2
  - A3
- command: cd ui && corepack pnpm typecheck
  covers:
  - A1
  - A2
  - A3
verification_requirements:
- Record actual focused regressions and executed results, preserving fixture/real-database distinctions.
- Keep implementation and subsequent completion metadata commits separate.
