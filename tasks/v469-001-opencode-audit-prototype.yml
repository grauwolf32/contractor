schema_version: '1.0'
id: V469-001
title: Prove two ordinary Runs can reuse one OpenCode Audit container
milestone: opencode-audit-environments-2026-11
epic: planner-worker
kind: chore
priority: P1
status: pending
depends_on: []
languages:
- go
- python
- yaml
- markdown
goal: Establish the smallest executable path and its real limits before building a production environment
  lifecycle.
context:
  authority: 'User request 2026-11-16: break proposal 0048 into tasks with minimal changes and explain
    the design with diagrams. User decisions 2026-11-16: one retained container per Audit; application
    ports are declared at container creation; dynamic publish_service and forwarder containers are outside
    the first slice. Pause and terminal Audit stop the container, retaining files and installed packages
    until explicit Audit deletion; continuation starts the same container. This request authorizes task
    planning, not implementation, live-model calls or deployment. The supporting-task scope, fresh allocation
    sessions, Linux-first placement and reuse of existing ownership are agent proposals for minimizing
    changes, recorded in proposal 0048; they are not additional user decisions.'
  proposal: docs/proposals/0048-opencode-audit-environments.md
  specification:
  - docs/spec/execution/runtime-agent.md#RTA-R1
  - docs/spec/execution/worker.md#WRK-R65
  - docs/spec/configuration/agent-templates.md#TPL-R3
  - docs/spec/tools/code-execution.md#EXE-R123
  - docs/spec/audits/common-contract.md#ACT-R2
  - docs/spec/artifacts/artifact-store.md#ART-R1
  boundary: Keep the existing Audit -> ordinary Run -> Planner -> allocation A2A path. The Runtime adapter
    owns OpenCode protocol parsing and WorkerCompletion; ArtifactStore owns immutable outputs. Audit owns
    durable environment identity and desired lifecycle; the existing Runtime/Podman owner enforces exact
    host resources and stop. Extend existing allocation preparation and Audit reconciliation ports with
    concrete callers; do not add a second coordinator, generic provider framework, receipt table or independent
    lease system. Supporting tasks publish ordinary material outputs, not a fabricated hypothesis/check
    result.
  implementation_entry: Implementation is not started by this planning change. Complete dependencies and
    verify their recorded decisions before taking the task.
  current_evidence: 'At e93a5c927: a2a_server.InvocableWorker and factories.WorkerRuntimeFactory provide
    adapter seams. sandbox/podman/lifecycle_backend.py recover removes discovered allocation containers;
    it cannot own retained Audit containers unchanged. auditimport/tasks.go collectTasks already retains
    supporting outputs without semantic verdicts.'
  external_sources:
  - https://opencode.ai/docs/cli/
  - https://opencode.ai/docs/api
  - https://opencode.ai/docs/migrate-v1/
  version_note: 'Checked 2026-11-16: current official documentation is V2, while /docs/server redirects
    to V1. Do not copy historical serve/session endpoints into the implementation without testing the
    exact pinned binary.'
  decision_record: The retained Audit container is the user-selected direction. An allocation-local container
    plus prebuilt image would be simpler but would lose packages/files installed by earlier Runs. Reopen
    the plan only if V469-001 shows retained rootless ownership, cancellation or finite disk/resource
    bounds need a separate subsystem; record the smaller options before production work.
scope:
  in:
  - Add an opt-in test-only factory/fixture and make test-opencode-audit-prototype; exercise real current
    A2A and OpenCode rather than a fake executable.
  - Pin exact OpenCode binary and operator image digests; compare CLI against a private HTTP service only
    if the CLI cannot satisfy session, cancellation or result needs. Choose one transport, not two production
    adapters.
  - Use one existing supporting Audit task/Workflow binding with material outputs, the ordinary collection
    receipt and exact Artifact publication.
  - Measure retained writable-rootfs storage, process cleanup, credential persistence, current OpenCode
    background-service behavior and available usage/call observations.
  - Record an executable go/no-go decision, exact boundaries, deletable prototype scaffolding and necessary
    production changes in the proposal/evidence; revise pending successors if a new prerequisite is discovered.
  out:
  - Dynamic service publication, forwarder containers, multiple environments per Audit, VM migration or
    automatic cloud provisioning.
  - Controlled sandbox HTTP bridge, transparent interception, VPN, automatic user tunnels or public application
    hosting; no dependencies on V410-037 or V411-013.
  - A new workflow engine, custom OpenCode A2A wrapper, transferring all Contractor toolsets/Skills/MCP
    into OpenCode, or automatic Findings/hypothesis production.
  - Cross-allocation conversation continuation, automatic model substitution, compatibility readers or
    modifying active deployments.
acceptance_criteria:
- id: A1
  text: The real two-Run/A2A/container path preserves container identity, installed fixture package, file
    mutation and a reachable service after normal allocation release.
- id: A2
  text: Pause/resume and cancellation preserve disk state; no execution continues after confirmed release;
    unknown stop prevents reuse.
- id: A3
  text: A lost invocation reply is not blindly re-executed, and a wrong Audit/container cannot acquire
    the environment.
- id: A4
  text: The evidence records transport choice, exact version and image, model route, supported limits,
    resource measurements and a go/no-go decision. A no-go leaves dependent production tasks pending.
tests:
- command: make test-opencode-audit-prototype
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
demonstration: A real Server/Planner/A2A test path invokes pinned OpenCode in rootless Podman through
  a test-only Runtime factory. Run 1 installs a package from a controlled repository fixture, builds and
  starts a service; after allocation release Run 2 sees the same container/files/package and checks the
  service. Pause stops it and continuation starts the same container.
requirements:
- id: R1
  text: No production runtime registration or public environment API in this spike. All temporary hooks
    stay test-only with real production A2A callers.
- id: R2
  text: Prove same explicit OpenCode session across two subtask invocations within one allocation; a new
    allocation starts a fresh session against the retained files. Do not use the host user shared OpenCode
    service.
- id: R3
  text: Selected Workflow model/Gateway routing must remain exact. No OpenCode default provider or model
    fallback; provider/version/config facts are pinned.
- id: R4
  text: Test cancellation with a detached child and a running app. If descendant isolation is unreliable,
    choose whole-container stop on abnormal termination; retain files and report service downtime.
- id: R5
  text: Freeze finite production bounds and enforceable budget semantics, including writable-layer disk
    and retained-container count. Reject unsupported claimed hard token/tool budgets rather than accepting
    them with best-effort enforcement.
- id: R6
  text: Read/write service identity must come from the existing Audit/Run association, never model text
    or metadata labels. Test foreign Audit refusal.
- id: R7
  text: OpenCode transcript is untrusted content; Runtime assembles WorkerCompletion and exact ordinary
    ArtifactRefs. Service readiness needs an independent probe, not an executor assertion.
failure_outcomes:
- operation: Prepare, invoke or stop the exact Audit environment
  permanent: Reject unsupported configuration, unavailable required capability, foreign owner, wrong image/container
    identity or over-bound input before work. Use owning classified outcomes; no fallback executor or
    model.
  retryable: Only bounded read/reconciliation retries under the original deadline; do not repeat possibly
    executed prompts or shell operations.
  ambiguous: Inspect the original container/session/operation identity. Quarantine uncertain ownership
    and do not dispatch another mutating allocation until stop or prior outcome is established.
  cancelled: Join adapter, descendants and publishers through allocation ownership. If executor-only stop
    cannot be proven, stop the same whole container while retaining its writable layer.
  timeout: Invocation deadline and finite prepare/stop/reconciliation budgets are distinct. No background
    invocation may survive release.
cardinality:
- collection: Audit environments, allocations and host resources
  expected: One environment, one writer and one application port in the end-to-end demonstrator.
  maximum: One environment per Audit and one mutating allocation per environment. The demonstrator has
    one declared application port; the finite production port, retained-environment, rootfs/log/output
    byte and deadline limits are measured and fixed in V469-001 before production implementation. Existing
    source/artifact and Podman CPU/RAM/PID bounds remain. No whole-history scan, unbounded container discovery
    or implicit installation on startup.
  bound: Use indexed per-Audit/host lookup and bounded reconciliation pages; finite stream frames, output
    bytes, process trees and cleanup work.
lifecycle:
- entity: Audit-owned container and allocation-owned OpenCode execution
  delete: Audit/Project deletion drains users, confirms exact container/network removal and then purges
    ownership. An unreachable host leaves cleanup pending.
  cascade: Use the existing Audit deletion path; ordinary Run deletion cannot remove the Audit container
    or retained outputs.
  retention: Normal successful allocation release preserves the running app while Audit is active. Pause
    drains current Runs before stop; terminal Audit stops it. Rootfs persists until explicit Audit deletion.
    Resume of a paused Audit restarts the exact container; no terminal-Audit reopening is added; processes
    restart from the declared supervisor configuration, not a RAM snapshot.
test_prerequisites:
- A newly named make/process target is a deliverable of this task and must execute nonzero cases; absent
  targets or zero-match selections fail.
- Persistence behavior uses disposable PostgreSQL; a configured unreachable database fails. Use a single
  owned database per lane and drop it after all processes stop.
- Real rootless Linux Podman and pinned OpenCode are required for container/process acceptance. Missing
  Linux resources are not passing evidence. Test catalogs live under testdata, not the live configs tree.
- No live Gateway calls in deterministic gates. A scripted Gateway is used with the real OpenCode binary;
  any later live demonstration needs separate authorization and retains the project-selected model.
- Full suites of every touched package must pass. Heavy-I/O opt-in stays disabled unless explicitly requested;
  disabled heavy fixtures are not passing coverage.
