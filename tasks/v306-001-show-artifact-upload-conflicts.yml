schema_version: '1.0'
id: V306-001
title: Show artifact version-upload conflicts across reconciles
milestone: review-defects-2026-10-04
priority: P1
status: in_progress
depends_on: []
languages: [typescript]
goal: Keep a 412 version-upload conflict visible after the page reconciles to the newer revision.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: medium
  finding: On a rejected version upload, onError invalidates keys.all; the metadata refetch changes artifact.revision or current, which remounts ArtifactActions (keyed actions-${revision}) or swaps in the read-only historical panel and unmounts the error (ui/src/routes/artifacts/artifact-detail-view.tsx:88-114,340-344; common.tsx:181-185). The user then sees another writer's r2 with no error and the file selection cleared and may believe it is their upload. Pre-existing in both old copies and now shared by every scope through V179-008.
scope:
  in:
    - Key the form by binding identity or keep the conflict notice at the view level across the reconcile.
    - Test a concurrent-writer 412.
  out:
    - Changing upload semantics.
acceptance_criteria:
  - {id: A1, text: "After a 412 caused by a concurrent writer the page shows the conflict together with the new current revision."}
tests:
  - {command: "cd ui && corepack pnpm exec vitest run src/routes/artifacts", covers: [A1]}
  - {command: "cd ui && corepack pnpm typecheck && corepack pnpm lint", covers: [A1]}
