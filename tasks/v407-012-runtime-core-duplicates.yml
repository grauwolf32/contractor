schema_version: '1.0'
id: V407-012
title: Consolidate equivalent Runtime helpers and offload prepare filesystem work
milestone: server-runtime-review-2026-10
epic: planner-worker
kind: chore
priority: P3
status: in_progress
depends_on: []
languages:
- python
goal: Remove proven helper duplication and keep prepare filesystem operations off the event loop without
  changing helper semantics or allocation lifecycle coordination.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  finding: 'The exception-chain walkers in worker/runtime.py:1362-1400,1468-1476 share one algorithm;
    span wrappers, background-task consumers and metric identifier normalization also have repeated implementations.
    The JSON-size and UTF-8 truncation helpers are not interchangeable: telemetry/metrics.py:642-650 tolerates
    values/errors that worker/summarizer.py:509-518 rejects, while metrics.py:634-639 and adapters/otlp_http.py:736-740
    have distinct replacement and suffix policies. workspace.py:50-59, projectfs/provider.py:110-122 and
    agent_skills/runtime.py:568-584 perform synchronous filesystem work from async prepare/probe paths.'
  validation: Validated against main dc7012e8 on 2026-10-23. Duplication and synchronous calls were verified
    statically; no latency threshold was measured. Allocation prepare holds its lock, but heartbeat reads
    an independent runtime state and lease expiry/drain have explicit fencing paths. AllocationSnapshot.snapshot
    has no production caller, so its responsiveness alone is not evidence for a lifecycle redesign.
  siblings: Inspect the corresponding span wrappers in worker/instrumentation.py, task consumers in allocation/cleanup.py,
    control_client.py and adapters/host.py, and metric identifiers in telemetry/invocations.py. Preserve
    the separate JSON error/default and UTF-8 suffix/replacement policies, whether implemented separately
    or through explicit parameters.
plan:
- Consolidate only helpers with equivalent semantics, using the existing lower-layer modules and production
  callers. Add no exported helper used only by tests.
- Keep distinct JSON-size and text policies explicit; add boundary characterization cases before sharing
  a lower-level primitive. Do not choose a single ellipsis or JSON error policy for all consumers.
- Move the synchronous filesystem portions of the three prepare/probe paths through threads.to_thread_until_done.
  Preserve marker-before-directory ordering, modes, ownership checks, failure rollback and cancellation
  joining before cleanup.
- Use synchronization hooks to prove filesystem work is off the event-loop thread and cancellation joins
  the worker before cleanup. Leave allocation prepare locking, lease fencing and drain ordering unchanged.
scope:
  in:
  - Equivalent helper consolidation with import-layer validation.
  - Filesystem offload in local workdir, local project workspace and native Skill startup probe.
  out:
  - Changing JSON/truncation semantics or model-visible diagnostics.
  - Introducing a preparing flag, removing lease/drain safeguards or changing allocation locking and endpoint
    availability.
decisions:
- 'One production definition per equivalent algorithm: the exception-chain walk is worker/runtime.py
  _chained_error (it replaces the budget, summarization-request, finalizer and Gateway walkers); failure-isolated
  span start and end are adapters/instrumentation.py start_isolated_span and end_isolated_span (used by
  worker/runtime.py, worker/instrumentation.py and the terminal summarizer''s inline copy); the span error.type
  rule is worker/instrumentation.py span_error_type over telemetry SAFE_ERROR_CODE (runtime.py''s copy
  and its duplicate SAFE_TOOL_ERROR_CODE regex are gone); retrieving the exception of a deliberately
  unawaited task is threads.consume_task_exception (allocation cleanup and service, adapter host, control
  client, project workspace operation guard, Podman I/O, HTTP cookie checkpoint and to_thread_until_done);
  telemetry/invocations.py keys tools with telemetry/metrics.py _metric_identifier; the summarizer''s
  _document_size reuses its own strict _json_size.'
- 'Distinct policies stay separate and unshared, so no common primitive was introduced: telemetry/metrics.py
  _json_size (default=str, 0 on failure) and _truncate_utf8 (replacement, ellipsis inside the limit),
  adapters/otlp_http.py _truncate_utf8 (strict, unchanged within the limit, no marker), worker/summarizer.py
  _json_size and _bound_text (strict, [TRUNCATED] after the limit), contracts json_byte_size (wire measure),
  agent_skills _json_bytes (default=str, raises) and the OpenAPI toolset _encoded_size (admits NaN).
  metrics.py is not edited; V407-020 owns its JSON measure, so its private _json_size is not pinned by
  a test here.'
- 'control_client.py receives only the consumer replacement (one import, one callback); its transports
  and shutdown belong to V407-013.'
- 'Prepare/probe filesystem work runs in one joined worker thread per step. On cancellation the owner
  waits for the thread, then removes what it created in another joined thread before re-raising: the
  scratch directory keeps marker-before-directory creation and marker-last removal, and a failed rollback
  is suppressed (OSError) so the cancellation propagates while the kept marker lets startup cleanup reclaim
  the directory; the project workspace reuses its previous best-effort discard; the Skill probe removes
  its TemporaryDirectory. Allocation prepare locking, lease fencing and drain ordering are unchanged.'
- 'Ruled-out siblings (unchanged, outside the three named prepare/probe paths): PreparedAgentSkills.close
  and _cleanup_failed_preparation still await asyncio.to_thread on release and rollback, capabilities._probe_podman
  creates run_workdir with asyncio.to_thread, and the Podman engine/probe/lifecycle and trailmark host
  keep their own thread use; reopen as a cancellation-ownership task if a joined-removal guarantee is
  required there. projectfs SAFE_EXPORT_CAUSE shares the identifier grammar but names export causes,
  and the uint64 saturating constants in telemetry, Worker State and the adapter host are not part of
  this finding.'
acceptance_criteria:
- id: A1
  text: Each consolidated algorithm has one production definition; deliberately distinct JSON-size and
    UTF-8 policies remain explicit and retain their previous behavior on malformed text, non-JSON values,
    overflow and exceptions.
- id: A2
  text: Synchronization tests observe the listed filesystem operations on a worker thread and prove that
    cancelled preparation joins them before rollback; owner markers, permissions and cleanup outcomes
    remain correct.
- id: A3
  text: Existing Runtime tests retain their semantic assertions; helper relocation does not change exception
    propagation, telemetry failure isolation or import-layer direction.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_allocation.py tests/test_adk_runtime.py
    tests/test_instrumentation.py tests/test_metrics.py tests/test_workspace_provider.py tests/test_agent_skill_lifecycle.py
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
