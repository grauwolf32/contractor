languages: [yaml, make, python]
goal: Keep the release gate deterministic and the dependency audit trustworthy.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: low
  finding: release-verify runs uvx pip-audit==2.10.1 (make/release.mk:12-13) and CI runs govulncheck; both need the network and a new upstream advisory turns main red without a code change. pip-audit's own dependencies are unpinned, uv export --frozen does not check that the lock matches pyproject, and V250 A3 (fails for a vulnerable lock) was never demonstrated. ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
scope:
