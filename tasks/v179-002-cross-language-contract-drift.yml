schema_version: '1.0'
id: V179-002
title: Align drifted cross-language contract rules
milestone: code-reuse-2026-10
priority: P1
status: in_progress
depends_on: []
languages: [go, python, typescript]
goal: Give scan observation error codes, media types and configuration versions one rule shared by Go, Python and the UI.
context:
  finding: >-
    Python scan tools emit errorCode values with exitCode null that the Go scan
    planner reports as scan_report_invalid while the UI labels them unavailable;
    the artifact store and Runtime accept a different media-type grammar than the
    schemas, config loader and UI; the UI rejects audit-standard versions that
    the public OpenAPI allows; Python gateway failure-code validation accepts a trailing newline.
scope:
  in:
    - Define the scan observation errorCode set and its scan job status in one shared fixture read by Go, Python and UI tests; classify every emitted code explicitly in Go.
    - Use one media-type grammar in api schemas, OpenAPI, Go config and artifact store, Python Runtime and the UI, backed by a shared media-type case fixture.
    - Validate audit-standard scheme and version in the UI with the OpenAPI patterns.
    - Use full-string matching for Python gateway failure codes and add an invalid fixture.
  out:
    - Codegen of DTOs from schemas.
acceptance_criteria:
  - {id: A1, text: Every scan errorCode emitted by Python maps to an explicit Go scan job status and the UI label agrees with it.}
  - {id: A2, text: Go, Python, the schemas and the UI accept and reject the same media-type fixture cases.}
  - {id: A3, text: The UI accepts every audit-standard version the OpenAPI pattern accepts.}
  - {id: A4, text: A gateway failure code with a trailing newline is rejected by Go and Python.}
  - {id: A5, text: Go, Runtime and UI tests and lint pass.}
tests:
  - {command: go test ./internal/planner/scan ./internal/artifacts ./internal/config ./internal/contracts ./internal/httpapi/public, covers: [A1, A2, A4]}
  - {command: cd runtime && uv run pytest, covers: [A1, A2, A4, A5]}
  - {command: make ui-verify, covers: [A1, A2, A3, A5]}
  - {command: make lint, covers: [A5]}
