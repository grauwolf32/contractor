schema_version: "1.0"
id: "V37-005"
title: "Confirm Audit cancellation and deletion before sending a mutation"
milestone: "ui-journey-usability"
priority: "P2"
status: "completed"
implementation_commit: "468d83d3e14b938a63263d5ccd2c628925f504c0"
depends_on: ["V37-001", "V25-011"]
languages: ["typescript"]
goal: "Give users an explicit chance to cancel destructive Audit actions and understand their consequences."
context:
  user_stories: ["US-07"]
  review_findings: ["UX-04"]
  planning_document: "docs/ui-user-stories.md"
  baseline: >-
    Browser fixtures confirmed Cancel sends POST and Delete sends DELETE immediately, with no
    confirmation. Existing Project and Run confirmation flows establish the UI precedent.
  mutation_boundary: >-
    Reuse existing allowed actions, revision preconditions, idempotency and cancel/drain/delete
    behavior. Opening or closing a confirmation never sends the mutation.
  browser_verification: >-
    Build the UI with make ui-build and serve it using the documented UI development or Node
    server; set CONTRACTOR_UI_E2E_BASE_URL to that instance. Browser cases must explicitly
    install their API fixtures; a fixture pass is not proof of a live backend. Add new test
    files named below as part of this task.
scope:
  in:
    - >-
      Use the shared Dialog for Cancel and Delete Audit, naming the profile/Project and exact
      Audit ID with the distinct effects of each action.
    - >-
      Focus the safe close action initially, provide unambiguous destructive submit wording, and
      show one pending operation.
    - >-
      Refetch authoritative state after success/conflict and show safe errors with an explicit
      recovery path.
  out:
    - >-
      Confirmation for routine Pause/Resume, extra lifecycle APIs, optimistic terminal/deleted
      states, alteration of retention policy.
requirements:
  - id: "R1"
    text: >-
      The confirmation states the actual Server lifecycle effects, including asynchronous
      deletion/draining where applicable, without promising immediate removal.
  - id: "R2"
    text: >-
      Escape, backdrop interaction and the safe cancel button send zero requests. Backdrop
      interaction does not close the Dialog. Confirm sends one request with current
      preconditions and disables duplicate submission.
  - id: "R3"
    text: >-
      Conflict or lost response does not trigger automatic replay or overwrite; outcome is
      checked with Server and a refreshed decision is required where appropriate.
acceptance_criteria:
  - id: "A1"
    given: "An Audit with an allowed Cancel or Delete action."
    when: "The confirmation opens and is closed by keyboard or safe cancel."
    then: "Audit identity and effects are visible; no mutation has been sent."
  - id: "A2"
    given: "A confirmation with a valid revision, or a concurrent state/revision change."
    when: "The user confirms once or double-clicks."
    then: >-
      Only one pending mutation is issued, success is refetched and conflicts remain actionable
      without blind retry.
tests:
  - name: "ui"
    command: "cd ui && corepack pnpm exec vitest run src/routes/projects/audits"
    covers: ["A1", "A2"]
  - name: "typecheck"
    command: "make ui-typecheck"
    covers: ["A1", "A2"]
  - name: "browser"
    command: "cd ui && corepack pnpm exec playwright test e2e/audits.spec.ts e2e/dialogs.spec.ts"
    covers: ["A1", "A2"]
