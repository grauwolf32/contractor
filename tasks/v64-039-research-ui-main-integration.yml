  - Resolve integration conflicts and regenerate derived task/dependency documents.
  - Keep the combined UI patch release newer than main and retain all release-gate roots.
  - Verify UI, public APIs and the real research browser journey on disposable PostgreSQL.
  - Land through a no-fast-forward merge once the primary checkout permits safe integration.
  out:
  - Committing, discarding or overwriting the user's uncommitted changes.
  - Additional product features, model changes or demo deployment.
acceptance_criteria:
- id: A1
  text: Current main contains the reviewed research UI and compact Collected pills through a no-fast-forward merge, without losing concurrent changes.
- id: A2
  text: Relevant UI, API, browser and lint gates pass on the reconciled source, with explicit results and cleanup of the owned test database.
tests:
- command: make ui-verify
  covers: [A1, A2]
- command: make ui-browser-mocked
  covers: [A1, A2]
- command: make verify-public-api verify-public-api-postgres
  covers: [A2]
- command: make test-audit-research-ui
  covers: [A2]
- command: make lint
  covers: [A1, A2]
