  integration: >-
    Reconcile codex/audit-research-ui with current main, including selected HTTP
    evidence, process-local Gateway recovery and Eval owner-row persistence.
    Preserve the native OpenDesign data and the independent primary-checkout work.
    No demo deployment or database migration is requested.
scope:
