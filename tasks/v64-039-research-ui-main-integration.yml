schema_version: '1.0'
id: V64-039
title: Integrate the reviewed research UI into current main
milestone: audit-check-prioritization
epic: ui
kind: chore
priority: P2
status: in_progress
depends_on: [V64-009, V64-038]
languages: [typescript, css, python, markdown]
goal: Land the approved common Audit UI and compact timeline badges in main while preserving concurrent work.
context:
