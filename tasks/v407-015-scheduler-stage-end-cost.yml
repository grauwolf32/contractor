schema_version: '1.0'
id: V407-015
title: Reduce redundant Stage-end work while preserving recovery and redaction
milestone: server-runtime-review-2026-10
epic: execution-core
kind: chore
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: Reuse available preparation secrets and avoid duplicate final aggregation and historical cancellation
  reads, while retaining restart recovery and all redaction guarantees.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/scheduler.md
  finding: internal/scheduler/execution_preparation.go:50 materializes Worker settings, and reports.go:76-80,203-225
    materializes them again for report redaction. Planner completion builds metrics, persistReports writes
    a missing-report placeholder through persistPlannerReport, and final report persistence builds metrics
    again. Some work is redundant on an uninterrupted path, but reports.go:24-26 also supports restart
    directly into finalizing/aborting with no preparation cache. run_execution.go:160-176 scans Stage
    history only when no active Stage exists, then finishes cancellation; it is not the ordinary per-poll
    path for every cancelling Run.
  validation: Validated against main dc7012e8 on 2026-10-23. The repeated reads/builds are present, but
    no end-to-end slowdown was measured. Restart loses in-memory settings, so a universal zero-decryption
    Stage-end requirement would remove required recovery/redaction work. An active cancelling Stage is
    handled separately at run_execution.go:182-196.
  siblings: Normal preparation, partial preparation, finalizing/aborting recovery, placeholder planner-report
    persistence, HTTP-origin credential redaction and cancellation after historical attempts. Examine
    the Eval adapter only for shared report semantics; preserve all report consumers.
plan:
- Retain the exact SecretValues used during successful preparation in a bounded allocation-owned cache,
  only for the lifetime needed by report persistence. Use it where present; preserve bounded materialization
  when recovering without that cache and preserve current failure/redaction handling.
- Avoid duplicate final StageMetrics rebuilds within one persistence phase, while retaining any earlier
  observable aggregation and the restart-safe placeholder behavior. Count calls per scenario rather than
  requiring one build over every phase.
- For cancellation with no active Stage, select executions/allocations with pending release work and reuse
  their bounded reads. Preserve handling of unreadable Workflow snapshots, release failures and final
  cancellation commit.
- Test an uninterrupted Stage, restart directly into finalizing and aborting, credential lookup failure,
  and cancellation with many historical completed releases. Assert query/decrypt/build counts and exact
  redacted output using deterministic hooks and PostgreSQL.
scope:
  in:
  - Bounded volatile redaction-data reuse with recovery fallback.
  - Removal of redundant final-phase aggregation and irrelevant cancellation-history reads.
  out:
  - Eliminating credential reads required after process restart, persisting plaintext secrets, or weakening
    redaction on failure.
  - Changing report schemas, partial metrics visibility, release ownership or cancellation outcomes.
acceptance_criteria:
- id: A1
  text: On an uninterrupted path with a valid preparation cache, report persistence reuses the same secret
    values without re-decryption; after simulated cache loss/restart it uses the recovery path and produces
    equally redacted reports. Cache contents are cleared at lifecycle completion.
- id: A2
  text: Counts distinguish planner completion, final report persistence and restart recovery; redundant
    rebuilds inside the same final persistence phase are removed without losing previously visible or
    recovered metrics.
- id: A3
  text: When cancellation has no active Stage, a real-store case with 20 historical completed releases
    and pending release work reads allocations only for relevant executions, preserves retries and reaches
    the same terminal outcome.
- id: A4
  text: Counter regressions fail on the redundant paths; preparation failure, cancellation, report-write
    failure and recovery tests retain the existing redaction and lifecycle guarantees.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/scheduler/...
    ./internal/telemetry/... ./internal/runstore/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
