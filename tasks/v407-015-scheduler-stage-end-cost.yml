schema_version: "1.0"
id: V407-015
title: "Stop re-decrypting Worker credentials and rebuilding metrics at Stage end, and scope cancel scans to pending work"
milestone: server-runtime-review-2026-10
epic: execution-core
kind: defect
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "Stage end materializes credentials once and builds StageMetrics once; cancelling a Run reads only Stage executions with pending release work."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings D5 and D12; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/execution/scheduler.md
  severity: low
  finding: >-
    internal/scheduler/reports.go:60-66 and 195-225: persistReports ->
    allocationReportSecrets -> materializeRuntimeSettings resolves and
    decrypts the LLM token, OTLP headers, proxy, Caido, Interactsh and HTTP
    origin credentials for each allocation (each a DB read plus AES-GCM open
    under the credential lifecycle barrier read lock) only to build the
    redaction list, although prepareStageWorkers already materialized the
    same settings. rebuildStageMetrics runs in persistPlannerReport
    (invokeStagePlanner), again for the placeholder planner report inside
    persistReports, and once more at its end.
    internal/scheduler/run_execution.go:175-190 executeCancelling lists every
    StageExecution and per execution calls fenceRecordedAllocations
    (ListStageAllocations plus GetGrant per row) and existingLiveReservations
    (ListStageAllocations again plus ReserveAllContext); two list queries per
    historical Stage on every cancelling pass, although
    listTerminalStageExecutionsWithAllocationsSQL already has the
    release_completed_at IS NULL predicate.
  siblings: >-
    Any other caller of materializeRuntimeSettings outside preparation (grep)
    and the eval adapter's report path.
plan:
  - "Keep SecretValues() from the prepare step on preparedStageWorkers (cleared after persistReports) and use it for the redaction list; delete the second materialization."
  - "Build StageMetrics once per Stage end and pass it to both persist paths."
  - "In executeCancelling, list only executions with release_completed_at IS NULL using the existing SQL predicate (new or reused store reader), and call ListStageAllocations once per execution."
  - "Tests on the fake and real stores: count credential decrypts per Stage end (expect zero after prepare), count StageMetrics builds (expect one), and count list queries during cancellation of a Run with 20 historical Stages and one live Stage (expect proportional to live)."
scope:
  in:
    - "Credential reuse, single metrics build, scoped cancel scan."
  out:
    - "Report formats and redaction rules."
acceptance_criteria:
  - id: A1
    text: "Stage end performs no credential decryption and builds StageMetrics once."
  - id: A2
    text: "Cancelling a Run with 20 historical Stages lists allocations only for executions with pending release work."
  - id: A3
    text: "Counting tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/scheduler/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1]
