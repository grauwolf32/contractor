schema_version: "1.0"
id: V3-003
title: Refactor Streamline to one deterministic Worker adapter
milestone: planner-routing-and-escalation
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-002]
languages: [go, yaml]

goal: >-
  Make streamline@1 require exactly one logical Worker and expose only
  execute_current_subtask(subtask_id), with Server supplying the stored subtask
  and complete immutable StageContext to A2A.

context:
  current_state: >-
    The implementation creates one model-facing function per Stage binding and
    lets the model restate objective, instructions, parameters, and ArtifactRefs.
    That obsolete design conflates Streamline with Router and permits context
    loss or mutation at every dispatch.
  deterministic_adapter: >-
    The selected subtask's immutable objective and instructions become the
    StageContentRequest work description. The complete original StageContext
    string parameters and exact pinned artifact map are cloned into every
    request. The prepared sole WorkerHandle supplies all physical routing.

scope:
  in:
    - Reject Streamline factory creation unless Invocation.Workers contains exactly one non-empty logical binding.
    - Replace per-binding Worker tools with exactly execute_current_subtask(subtask_id).
    - Claim and validate the exact current subtask before inspecting context or calling A2A.
    - Clone the complete stored StageContext; accept no model-selected objective, instructions, parameters, artifacts, endpoint, or allocation identity.
    - Record active dispatch call ID and the sole logical worker name in PlannerPlan.
    - Apply a valid Worker succeeded/failed result to the claimed subtask and release the claim on every return path.
    - Preserve exact artifact validation, RunScope inspection, deadline, Worker-call budget, metrics, cancellation, and durable completion recovery.
    - Replace the shipped multi-agent Streamline example with a valid single-agent example and update loader validation/tests.
  out:
    - Selection among multiple Workers, Router, or cross-subtask dynamic artifact-binding mutation.

deliverables:
  - {path: internal/planner/streamline, description: Single-Worker factory, generic execute tool, deterministic request adapter, and tests.}
  - {path: internal/config, description: Planner cardinality validation for streamline@1.}
  - {path: configs/examples/streamline_review_workflow.yaml, description: Valid one-Worker Streamline example.}
  - {path: README.md, description: Correct Streamline versus Router distinction.}

requirements:
  - id: R1
    text: The model-facing execute schema has exactly one semantic argument, subtask_id.
  - id: R2
    text: Zero or multiple logical Workers fail before any Planner session, model call, allocation invocation, or artifact access.
  - id: R3
    text: A stale/unknown/resolved subtask ID produces a safe tool error and no A2A call.
  - id: R4
    text: Each valid request contains the stored subtask and all immutable StageContext parameters/artifacts with exact revisions.
  - id: R5
    text: Completion and failure always clear the active dispatch without allowing a late result to update a different current subtask.

acceptance_criteria:
  - id: A1
    given: A one-Worker Streamline plan with current subtask 0.
    when: The model calls execute_current_subtask with ID 0.
    then: The sole prepared Worker receives the deterministic stored request exactly once and its result advances the plan.
  - id: A2
    given: A model attempts to pass objective, instructions, parameters, artifacts, or worker_name.
    when: ADK validates the function call.
    then: The undeclared fields are rejected and cannot affect an A2A request.
  - id: A3
    given: Two Stage agents select streamline@1.
    when: Configuration or factory validation runs.
    then: It fails with a stable cardinality error directing the author to router@1.
  - id: A4
    given: Cancellation or Worker error occurs after a claim.
    when: A later valid call is attempted.
    then: No stale claim blocks it and no late result corrupts the plan.

tests:
  - {name: streamline-unit-race, command: "go test -race ./internal/planner/streamline/...", covers: [A1, A2, A4]}
  - {name: config, command: "go test ./internal/config/...", covers: [A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
