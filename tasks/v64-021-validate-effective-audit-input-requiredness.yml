schema_version: '1.0'
id: V64-021
title: Validate required inputs after initial Audit material overrides
milestone: audit-check-prioritization
epic: audits
kind: defect
introduced_by: V64-001
priority: P1
status: in_progress
depends_on:
- V64-001
languages:
- go
- python
- json
- markdown
goal: An initial task cannot turn a required Workflow input into an optional missing Audit material by
  overriding its selected source.
context:
  authority: 'User request on 2026-11-01: create fixes for the three implementation-review findings in
    completed V64-001. Preserve the accepted simple Audit task/Run/result model; these are local contract
    corrections, not a new subsystem. User explicitly authorized implementing V64-020,
    V64-021 and V64-022 on 2026-11-01.'
  review: Implementation review of main 79d2788d7 on 2026-11-01, following the delegated V64-001 delivery.
  severity: medium
  finding: internal/contracts/auditcontract/codec.go:319-333 checks override membership/media but not
    effective requiredness. internal/config/audit_program.go:50-52 checks only the original binding. A
    required source slot mapped to required material A, then overridden by initial_work.inputs.source=B
    where B is optional and text/plain, is accepted by the real config validate command. The program can
    therefore validate even when the actual required source is absent. Override path introduced in 36d93a45f021dca043126b5baeb487f4c2a046c2
    (V64-001).
  siblings: 'Default Workflow mappings and per-initial-task input selections; shared media/membership
    checks; real catalog-dependent ValidateAuditProgram and offline CLI. Proposal selections instead name
    concrete already available trusted materials: keep their existence/media checks without inventing
    a required flag on concrete descriptors. Optional actual Workflow slots remain optional.'
  specification:
  - docs/spec/audits/common-contract.md#ACT-R2
  - docs/spec/audits/common-contract.md#ACT-R7
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  boundary: Use existing auditcontract, real catalog Snapshot and offline config validate caller. No database
    mutation, controller, queue, receipt store, execution capability or compatibility reader.
  priority_rationale: The review severity is P2/medium; delivery priority is P1 because the existing base-slice
    consumer depends on this fix.
scope:
  in:
  - Validate each effective initial-task mapping against the real resolved Workflow slot, after applying
    selected Audit input overrides.
  - Reject optional declarations selected for required actual Workflow inputs; retain unknown-source and
    incompatible-media rejection.
  - Keep optional actual Workflow inputs usable with optional materials. Requiredness belongs to the real
    catalog owner, not a new model-supplied field or duplicated Python catalog validator.
  - Add regression inputs to the existing shared loader_cases and real CLI/catalog suites; align common
    Go/Python cases only for rules that those document validators actually own.
  out:
  - Changing Artifact ownership, implementing task execution or input retention, weakening required Workflow
    slots, or adding another mapping/graph engine.
  - Rejecting every optional material irrespective of the actual Workflow slot or requiring already available
    proposal material handles to acquire an invented required flag.
acceptance_criteria:
- id: A1
  given: a real Workflow required source input, default required Audit material A, and an initial override
    selecting optional compatible B
  when: the loaded Snapshot validator and offline CLI evaluate the program
  then: audit_document_invalid is returned before any task/Run is created, even though the default A mapping
    was valid
- id: A2
  given: a required compatible replacement, an actually optional Workflow slot with optional replacement,
    and incompatible/unknown selections
  when: effective initial mappings are validated
  then: the two valid cases pass while missing/unknown/incompatible required selections fail; concrete
    available proposal handles retain their existing behavior
- id: A3
  given: the real existing configuration/CLI path and regression fixture
  when: complete touched-package suites run
  then: the optional-source override regression fails on the unfixed code and passes after the fix without
    duplicating catalog authority
tests:
- command: go test -count=1 ./internal/config/... ./internal/contracts/auditcontract ./internal/app
  covers:
  - A1
  - A2
  - A3
- command: make test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
failure_outcomes:
- operation: Validate a common Audit document through the existing decoder and configuration CLI
  permanent: Invalid content returns audit_document_invalid with no canonical partial result or input
    content in diagnostics. No retry.
  retryable: Preserve existing surfaced filesystem/embedded-schema failures; validation adds no automatic
    mutation retry.
  ambiguous: No durable effect exists to reconcile; never run a Workflow or target request to repair local
    validation.
  cancelled: Validation remains caller-owned with no background work or live mutation.
  timeout: Keep the existing CLI/caller invocation ownership; introduce no controller clock or new timeout.
cardinality:
- collection: One selected document, its bounded trusted context and real loaded Workflow bindings
  expected: One small program/proposal and several selected materials or seeds.
  maximum: Retain LIM-ACT-1 through LIM-ACT-4 and existing containing-document/record/UTF-8 bounds.
  bound: Validate the selected bounded document; no Run/Audit/Project history enumeration or target activity.
lifecycle:
- entity: Existing offline input bytes and canonical validation result
  delete: Caller releases local files/bytes; no new persistent entity.
  retention: Validation creates no hold, grant, receipt or owner-lifetime change.
test_prerequisites:
- Commands are future implementation acceptance, not results of task creation.
- Use testdata catalogs and the real existing config validate path. Validation has no persistence behavior;
  do not introduce a fake store or require a new database fixture.
- Run complete suites of every touched Go package and the shared cross-language cases; a zero-match mandatory
  selection is a failure.
- On macOS use a canonical TMPDIR for the existing strict-root tests. If implementation expands into store
  behavior, report the scope change before proceeding.
implementation_commit: null
verification:
- Before the fix, the required-to-optional override regression failed in both the loaded Snapshot suite and the actual offline CLI (2026-11-01).
- Complete config/.../auditcontract/app suites passed after applying the same catalog-owned material check to defaults and effective selections. Required replacement and optional actual-slot scenarios pass; unknown/incompatible selections fail. The CLI now consumes loader_cases and asserts the classified error.
- Full cross-language and lint gates remain required before completion.
