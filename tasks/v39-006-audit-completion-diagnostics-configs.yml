  - path: internal/contracts
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: internal/httpapi/public
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: runtime/src/contractor_runtime/worker/instrumentation.py
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: runtime/tests/test_audit_completion_diagnostics.py
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: configs/agent-templates
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: configs/workflows
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: configs/audit-profiles
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: configs/instructions
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: docs/spec/25-audit-worker-finalization.md
    description: "Implement or extend the scoped contract and regression coverage described above; create planned paths when absent."
  - path: docs/reviews/2026-09-07-audit-completion-diagnostics.md
    description: "Record function review findings, regression fixes and verification limits."

requirements:
  - {id: R1, text: "Old reports remain readable; ordinary Run diagnostics and legacy model/tool counters retain their meanings."}
  - {id: R2, text: "Accepted local data and successful ZIP publication never appear as accepted Audit coverage."}
  - {id: R3, text: "Configs opt in with new immutable versions only and cannot trigger rollout just by being added."}
  - {id: R4, text: "Messages distinguish missing items from write conflicts and ordinary serializer failures without exposing retained content."}

acceptance_criteria:
  - id: A1
    given: "No-call, partial collection and publication failure"
    when: "terminal reports are read"
    then: "Diagnostics show the correct phase/counts/code without raw content or invented model/tool calls."
  - id: A2
    given: "Old and new repository profile versions"
    when: "loaded"
    then: "Old closures remain unchanged and new closures validate the explicit single-Worker @2 contract."
  - id: A3
    given: "A technically succeeded new Audit Run"
    when: "displayed before or after importer rejection"
    then: "Reports do not misrepresent publication as evidence acceptance."
  - id: A4
    given: "The versioned examples and a publisher authorization/transport failure"
    when: "Validated and reported"
    then: "Example retry ownership matches the Run-scoped create-only contract; programmatic failures add no LLM errors or fictitious tool calls."

tests:
  - command: "go test ./internal/contracts ./internal/config ./internal/telemetry ./internal/httpapi/public"
    covers: ["A1","A2","A3","A4"]
  - command: "cd runtime && uv run --frozen pytest tests/test_audit_completion_diagnostics.py tests/test_audit_completion_runtime.py"
    covers: ["A1","A3","A4"]
