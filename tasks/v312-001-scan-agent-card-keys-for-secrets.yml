schema_version: '1.0'
id: V312-001
title: Scan Agent Card object keys for long secrets
milestone: review-defects-2026-10-04
priority: P2
status: completed
implementation_commit: a17e9f3014445fca75074ac8aed50cb17e13b5e6
depends_on: []
languages: [go, python]
goal: Restore detection of private settings echoed as JSON object keys while keeping V159's fixed-string exemptions.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: low
  finding: V159 (19b589af) replaced the encoded-handle bytes.Contains check with collectors that gather string values only (internal/controlplane/runtime_client.go:553-563,582-601; runtime allocation/redaction.py:108-116; allocation/service.py:1145-1155). Card validation does not restrict keys, so a 33-byte secret used as an object key under capabilities.extensions passes in both languages. The trusted Agent Card path table is maintained by hand in Go and Python (about 20 entries each).
scope:
  in:
    - Include map keys (as path-untrusted strings) in the scanned set in Go and Python.
    - Share trusted paths and leak cases through an api/testdata fixture consumed by both suites.
  out:
    - Relaxing V159's fixed-string handling.
acceptance_criteria:
  - {id: A1, text: "A long secret used as an object key is detected in both languages."}
  - {id: A2, text: "V159's false-positive cases stay accepted."}
tests:
  - {command: "go test -count=1 ./internal/controlplane ./internal/contracts", covers: [A1, A2]}
  - {command: "cd runtime && uv run pytest tests/test_adapter_host.py tests/test_allocation.py tests/test_contracts.py", covers: [A1, A2]}
  - {command: "make lint", covers: [A1, A2]}
