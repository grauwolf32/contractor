schema_version: '1.0'
id: V234-001
title: Bound client I/O while artifact transfer slots are held
milestone: runtime-maintenance-2026-10
priority: P2
status: in_progress
depends_on: []
languages: [go]
goal: Release per-process artifact transfer slots when a client stalls during upload or download.
context:
  issue: https://github.com/grauwolf32/contractor/issues/241
  finding: Public and private Artifact HTTP handlers hold one of four shared slots through socket I/O without a deadline.
scope:
  in:
    - Apply a shared size-aware socket deadline to public and private Artifact PUT and GET handlers.
    - Preserve the four-slot memory bound by acquiring capacity before reading request bodies.
    - Verify stalled uploads and downloads release capacity on a real HTTP server.
  out:
    - Global HTTP server deadlines for unrelated routes.
acceptance_criteria:
  - {id: A1, text: Four stalled uploads release their slots by the documented transfer deadline so a new upload can proceed.}
  - {id: A2, text: A stalled download releases its slot by the deadline, for both public and private handlers.}
  - {id: A3, text: A normal 64 MiB transfer at the documented minimum throughput can complete.}
tests:
  - {command: go test ./internal/httpapi/... -count=1, covers: [A1, A2, A3]}
  - {command: make lint, covers: [A1, A2, A3]}
