schema_version: '1.0'
id: V407-005
title: Remove redundant Audit checks and share safe intake preparation reads
milestone: server-runtime-review-2026-10
epic: audits
kind: chore
introduced_by: V62-002
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: Simplify proven redundant Audit code and avoid duplicate pre-transaction Stage reads while preserving
  trusted validation and transaction-local authorization.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  validation: Revalidated against main dc7012e8 on 2026-10-23. Cleanup opportunities are confirmed. The
    alleged preparation-Workflow fail-open was not reachable through CreateAudit normalization and is
    excluded as a defect; the ranking package is unintegrated, not currently misranking production work.
  finding: 'internal/runservice/audit.go:234-236 ignores json.Marshal errors, but CreateAudit first normalizes
    the submitted Workflow through successful JSON encode/decode (28-43,185-193), and the pinned binding
    was successfully decoded at230. A channel or arbitrary failing Marshaler cannot be injected into this
    concrete production path, so no nil-equals-nil mismatch bypass was reproduced. Redundant code remains:
    auditimport/importer.go:277-280 repeats source initialization already done at233-236; check_results.go:325-328
    rechecks evidence ownership after result_package.go:58-60 and prepareCheckResults validation; auditservice/finding_comparisons.go:323
    checks a sum bounded by FindingCandidateWindowRows and the validated limit. FindingGroupMembers checks
    the correlation fence twice (590,623). Intake may read one StageExecution in anchors.go:42 and fingerprint.go:22
    before its required transaction-local provenance read at service.go:303. The first two are conditional,
    and the third has a distinct authorization role.'
  siblings: internal/auditpriority has no production caller and sorts by Priority then candidate ID (selection.go:70-75),
    not Confidence. Its V64 integration remains deferred by execution_policy; this task must not wire
    it or change its ranking policy. Check related Audit fence and validation call sites before deleting
    guards.
plan:
- Remove the duplicate source initialization and only those result-ownership/work-bound checks whose caller
  and real-store bounds prove them redundant. Preserve or document the owning validation; do not remove
  independent trust-boundary checks.
- Reduce FindingGroupMembers fence reads while retaining a final fence check after all reads and the existing
  stale-fence precedence on read errors. Use a controlled revision race to prove error semantics.
- Share at most one lazily loaded pre-transaction Stage snapshot between anchor and fingerprint derivation
  when either needs it. Keep verifyTrustedExecution and its Stage read inside the transaction; preserve
  early exits when neither derivation needs a Stage.
- Keep preparation Workflow comparison behavior unchanged and document why the claimed marshal-failure
  bypass is not a current defect. Do not add artificial channel/failing-Marshaler tests outside the actual
  Workflow type.
- Record the absent auditpriority production integration and unused-in-ranking Confidence in the existing
  research status only; retain the deferred integration decision and make no ranking/API changes.
scope:
  in:
  - Proven duplicate/dead checks and safe sharing of conditional pre-transaction intake reads.
  - Error/fence parity tests on real PostgreSQL and documentation of excluded unsupported claims.
  out:
  - A speculative fail-closed Workflow redesign or an impossible Marshal-failure acceptance test.
  - Eliminating the transaction-local provenance/authorization read or reusing an unvalidated stale snapshot
    for it.
  - Reactivating V64, adding an auditpriority caller, changing ranking semantics or introducing broad
    unrelated cleanup.
acceptance_criteria:
- id: A1
  text: The listed duplicate source initialization and provably redundant guards are removed or retained
    with a concrete independent-invariant rationale. Existing accepted/rejected result and work-limit
    behavior is unchanged.
- id: A2
  text: FindingGroupMembers performs one final correlation fence check on successful reads and preserves
    stale-fence/read-error precedence in controlled race tests.
- id: A3
  text: When both derivations require the Stage, intake performs at most one shared pre-transaction Stage
    read plus the separate transaction-local provenance read; paths needing neither retain their early
    exits. Real-store authorization/fencing tests still pass.
- id: A4
  text: No new marshal-failure bypass claim or artificial unsupported Workflow value is used as acceptance
    evidence. Research status describes auditpriority as unintegrated and preserves the existing deferred
    integration policy.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/runservice/...
    ./internal/auditimport/... ./internal/auditservice/... ./internal/findingintake/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
