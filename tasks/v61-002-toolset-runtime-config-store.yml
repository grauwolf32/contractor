schema_version: "1.0"
id: V61-002
title: Extend RuntimeConfig merge and credential lifecycle for configurable toolsets
milestone: toolset-runtime-configuration
priority: P1
status: pending
implementation_commit: null
depends_on: [V61-001]
languages: [go, sql, yaml]
goal: >-
  Publish and bind typed toolset settings through existing RuntimeConfig storage
  with deterministic merging and protected write-only MCP credentials.
context:
  authority: User requested generic tool configuration using current RuntimeConfig and bindings with one value per ref on a Run.
  design: docs/plans/2026-09-19-toolset-runtime-configuration.md
  specification: docs/spec/07-runtime-labels-and-infrastructure-config.md
  reuse: >-
    Reuse immutable runtime_config_versions, binding CAS/locks, publication
    idempotency, AtomicPatch, canonicalization and RuntimeCredentialService.
scope:
  in:
    - Add bounded typed Toolsets map, registry normalization/validation, defaults, clones, Spec.Empty and canonical serialization.
    - Use named constants for new defaults/bounds and reuse existing URL/PEM/document/header limits; give shared credential-header limits protocol-neutral names instead of OTLP-specific names.
    - Implement atomic per-ref same-layer merge and pure default/Run-layer resolution with deterministic source metadata.
    - Implement absent/object/per-ref-null semantics, normalize an empty map away and reject null for the whole map.
    - Add mcp-headers@1 material normalization, service/wire metadata validation and a migration extending the credential-kind CHECK.
    - Extend typed credential-reference extraction, publish/rebind barriers and SQL binding-usage inspection for the new map.
    - Reject assigning toolset-bearing labels to physical Runtime Agents and rebinding assigned labels to such configs under existing locks.
    - Exercise a second test-only native configuration schema to prove shared normalization/merge is not hardcoded to MCP.
  out:
    - Add a new configuration or secret table, change credential ownership/auth, resolve secrets during publication or open network connections.
    - Migrate existing Caido/telemetry/proxy sections into toolsets or introduce a generic deep-merge engine.
deliverables:
  - path: internal/runtimeconfig
    description: Typed model/normalizers/merge, pure Run-toolset resolution, source checks and focused unit/PostgreSQL tests.
  - path: internal/credentials
    description: MCP header credential material, usage inspection and lifecycle tests.
  - path: internal/persistence/migrations
    description: Additive migration extending existing Runtime credential kinds without a new storage service.
requirements:
  - id: R1
    text: Ref-keyed configuration objects are atomic; no endpoint/credential fields are assembled from different labels, and label order never selects a winner.
  - id: R2
    text: All selected-label conflicts are reported before per-agent projection; identical normalized values retain deterministic provenance of their sources.
  - id: R3
    text: Credentials use established write-only encryption/idempotency and reference barriers; case-insensitive duplicate headers, CR/LF and SDK-managed headers are rejected.
  - id: R4
    text: New settings are Run-owned; both principal assignment and binding mutation enforce this even for mixed configs and null entries.
acceptance_criteria:
  - id: A1
    text: MCP and test-native configs normalize strictly and publish idempotently; unknown refs/keys, missing fields, bounds and kinds fail, while old canonical bytes/digests pass unchanged.
  - id: A2
    text: Defaults, replacement, clear, empty map, equal deduplication and conflicting values obey the specified semantics for every label permutation.
  - id: A3
    text: MCP credentials round-trip only through the private material API; live binding usage prevents deletion and rebind/delete races preserve referential safety.
  - id: A4
    text: Toolset-bearing principal assignment and concurrent rebind are rejected atomically; existing infrastructure-only principal labels still work.
  - id: A5
    text: Database publication/replay/migration and reference tests actually execute against isolated PostgreSQL with no mandatory cases skipped.
tests:
  - command: go test -race -count=1 ./internal/runtimeconfig ./internal/credentials
    covers: [A1, A2, A3, A4]
  - command: make test-runtime-config-postgres test-runtime-credentials test-runtime-principals
    covers: [A1, A3, A4, A5]
  - command: make verify-public-api verify-wire-contracts
    covers: [A1, A3]
test_prerequisites:
  - Set CONTRACTOR_TEST_DATABASE_URL to a disposable isolated PostgreSQL instance; do not print connection credentials.
verification_requirements:
  - Record executed database cases, publication/deletion/rebind race evidence and old digest fixture results; skipped persistence tests do not satisfy A5.
