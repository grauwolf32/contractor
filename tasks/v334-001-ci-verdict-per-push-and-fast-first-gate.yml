schema_version: '1.0'
id: V334-001
title: Keep a verdict for every main push and run fast gates first
milestone: review-process-2026-10-04
priority: P1
status: completed
implementation_commit: ec9af537c8b3ba623b56f35f8b4b0310bfacb5cd
depends_on: []
languages: [yaml, make]
goal: Make CI report on every merge and surface cheap failures within minutes.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: high
  finding: The CI release-verify job has never passed since 2026-05-29. concurrency cancel-in-progress (.github/workflows/ci.yml:8-10) cancelled 44 of 58 main runs in one day, so most merges get no verdict. The Makefile includes make/release.mk before release-verify's own prerequisites, so make -n release-verify runs the race pass, the 19-test process pass (-timeout=50m) and the integration pass before lint, unit and UI checks, and make runs without -k, so each run reports one failure 50-70 minutes in. docs/testing/release-gates.md:117-118 claims the opposite order, docs/testing/README.md:18 overstates the requirements and make test-e2e omits 3 of the 19 release process tests. setup-go saves its cache only on success, so every red run cold-builds.
scope:
  in:
    - cancel-in-progress only for pull_request events.
    - Run verify (lint, unit, UI) first and fail fast there; split heavy stages into separate jobs or use per-stage reports so one run shows every failing stage.
    - Upload test reports as artifacts and save the Go cache on failure.
    - Fix the docs.
  out:
    - Repository branch protection (owner action, V347-001).
acceptance_criteria:
  - {id: A1, text: "Every push to main gets a completed run."}
  - {id: A2, text: "Lint, unit and UI failures surface within minutes."}
  - {id: A3, text: "The docs match the actual order."}
tests:
  - {command: "make -n release-verify", covers: [A2]}
  - {command: "python3 scripts/check_release_verify_graph.py", covers: [A1, A2, A3]}
verification:
  - make -n release-verify runs lint and build, the unit suites and the UI checks (exactly make verify) before the families, browser, race, discovered race, integration and process stages; each stage is a target and a CI matrix job run with make -k, fail-fast off, reports uploaded and the Go cache saved on failure.
  - python3 scripts/check_release_verify_graph.py passes inside and outside make; its unit tests reject a heavy stage before lint, a race suite in a fast stage, cancellation of pushes, a shared push concurrency group, a missing stage job, fail-fast, a reordered stage table in docs/testing/README.md and a nested make environment. actionlint 1.7.7 accepts the workflow.
  - Per-push verdicts and stage durations become observable on GitHub after merge; requiring the release-verify check on main stays the owner action V347-001.
