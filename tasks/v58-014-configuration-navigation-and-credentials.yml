schema_version: '1.0'
id: V58-014
title: Clarify configuration navigation and managed LLM credential inventory
milestone: ui-design-review
priority: P1
status: in_progress
implementation_commit: null
depends_on:
- V58-013
languages:
- typescript
- css
- markdown
goal: Make configuration links purposeful and explain why managed LLM credentials can be empty on a working development stand.
context:
  authority: User reports configuration links appearing inert and asks whether the empty LLM credential inventory is correct.
  evidence: Browser navigation works for other destinations; the current section links to itself. The live managed inventory has zero entries, development tokens are configured, and two separate Runtime credentials exist.
scope:
  in:
  - Label related settings visibly and omit links to the current configuration area, including detail routes.
  - Clarify managed LLM credentials, development tokens and Runtime service credentials in the inventory copy and navigation.
  - Verify navigation and empty/loaded inventory behavior, merge into local main and deploy UI while preserving backend state and unrelated edits.
  out:
  - Creating credentials or changing tokens, budgets, provider access, Server contracts or Runtime settings.
acceptance_criteria:
- id: A1
  text: Related configuration links have a visible purpose, avoid the current area and navigate to the intended views using pointer or keyboard.
- id: A2
  text: The LLM inventory identifies managed credentials and explains that development tokens are not listed; empty state is accurate and creation remains available.
- id: A3
  text: Existing credential listing and lifecycle tests pass; browser checks cover all four configuration areas at desktop and mobile widths without overflow or writes.
- id: A4
  text: The verified UI release is merged into local main and deployed without changing credentials, queue, scheduler, Runs or Server/Runtime processes.
tests:
- command: cd ui && corepack pnpm test --run src/routes/operations/operations.test.tsx src/routes/operations/settings/settings.test.tsx src/api/operations.test.ts src/api/configuration-contracts.test.ts src/api/runtime-config-contract.test.ts
  covers: [A1, A2, A3]
- command: make ui-lint ui-typecheck ui-build and read-only browser navigation/inventory checks before and after deployment.
  covers: [A1, A2, A3, A4]
