schema_version: '1.0'
id: V75-001
title: Require PostgreSQL before database hardening gates
milestone: release-and-ui-guardrails-2026-10
priority: P1
status: completed
implementation_commit: 6bb7d9d42e98631df539bc338ae645d4df73fc22
depends_on: []
languages: [make, go]
goal: Stop Runtime configuration and metadata-label gates from passing with their PostgreSQL tests skipped.
context:
  issue: https://github.com/grauwolf32/contractor/issues/314
  finding: The hardening targets omit require-database and their e2e targets check too late.
scope:
  in:
    - Guard both hardening and e2e targets before test recipes run.
    - Document the PostgreSQL requirement.
    - Verify both missing-database failure and configured-database execution.
  out:
    - Change Go test skip behavior outside these gates.
acceptance_criteria:
  - {id: A1, text: Both hardening and e2e targets fail before tests without a database URL.}
  - {id: A2, text: With PostgreSQL configured, matrix-owned database tests run rather than skip.}
  - {id: A3, text: General verify and matrix targets remain usable without PostgreSQL.}
tests:
  - {command: make -n test-runtime-configuration-hardening test-run-metadata-labels-hardening, covers: [A1]}
  - {command: go test ./internal/runtimeconfig ./internal/runstore, covers: [A2, A3]}
verification:
  guard: All four hardening and e2e targets failed before tests without CONTRACTOR_TEST_DATABASE_URL.
  postgres: All eight matrix-owned PostgreSQL tests passed under the race detector with serial packages and no SKIP.
  general: The hardening matrix passed without a database and verify retains its database-free dependency graph.
  limitation: A full parallel hardening run hit unrelated cross-package migration lock timeouts in the disposable database.
