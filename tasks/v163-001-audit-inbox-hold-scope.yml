schema_version: '1.0'
id: V163-001
title: Scope Audit inbox holds and skip unreadable discarded receipts
milestone: review-defects-2026-10
priority: P1
status: completed
implementation_commit: 3b2d8259c1575de105eafa0e1fc2c4923d239bd6
depends_on: []
languages: [go]
goal: Make the Audit finding-proposal inbox expose only the requesting Audit's hold and never fail on a discarded receipt it never retained.
context:
  issue: https://github.com/grauwolf32/contractor/issues/223
  finding: Inbox listing loaded every Audit's holds, hydrated deleted-Run proposals from another Audit's copy, and returned 404 for a whole page containing an unretained discarded receipt.
scope:
  in:
    - List inbox receipts through the Audit-scoped hold and hydration path used by GetAuditReceipts.
    - Omit, in SQL before LIMIT, native receipts whose source Run is deleted and that the Audit never retained.
    - Document the omission in spec 19.
  out:
    - Change captureCollection, which spec 27 requires to report every retained Audit hold.
acceptance_criteria:
  - {id: A1, text: ListAuditInbox and ListAuditHeldInbox succeed at limits 1 and 10 after a rejected child proposal's Run is deleted and paginate to the retained receipt.}
  - {id: A2, text: Each inbox receipt carries only the requesting Audit's hold.}
  - {id: A3, text: After source Run deletion, an Audit reads its own retained copy even when another Audit imported the receipt first.}
tests:
  - {command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags integration -count=1 ./internal/findingintake ./internal/auditimport, covers: [A1, A2, A3]}
