schema_version: "1.0"
id: V4-003
title: Add encrypted immutable LLM credential persistence
milestone: server-ui-and-operations
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-006, V4-001]
languages: [go, sql]

goal: >-
  Persist immutable Gateway-generated execution credentials encrypted in
  PostgreSQL, expose only non-secret refs/metadata through an internal provider,
  and resolve plaintext just in time for exact pinned Planner or Worker settings.

context:
  lifecycle: >-
    This foundation owns encrypted active rows, never-reused tombstones and
    durable operation primitives. V4-003A owns remote lifecycle orchestration,
    recovery, Run pin coordination and public handlers.
  encryption: >-
    Server reads one operator-owned 32-byte base64 master key from a secure
    absolute file. Tokens are AES-256-GCM encrypted with fresh 96-bit nonce and
    authenticated data containing schema version, credential ID, and exact
    digest-bearing Gateway ref. The row records a SHA-256 key fingerprint.

scope:
  in:
    - Add llm_credentials, credential_operations, and non-secret tombstone migrations and repositories.
    - Add strict secure-file loading for the credential master key and startup rules when encrypted rows exist.
    - Implement bounded encrypt/decrypt service with fresh cryptographic randomness and authenticated identity/route binding.
    - Define secret-bounded GatewayCredentialManager request/result types and interface without implementing lifecycle or LiteLLM HTTP.
    - Implement repository primitives for active records, tombstones and prepared/completed operation rows without outbound side effects.
    - Recheck active credential existence and exact Gateway binding during Run resolution.
    - Resolve/decrypt only at Planner construction/allocation preparation; keep plaintext out of snapshots, reports, logs, errors, API, and tests.
  out:
    - Create/delete orchestration, recovery, public handlers, Run deletion guards, master-key rotation/keyring, Vault/KMS, mutable policy, raw-token import, or LiteLLM HTTP.

deliverables:
  - {path: internal/persistence/migrations, description: Credential, operation journal, and tombstone schema.}
  - {path: internal/credentials, description: Repository, AES-GCM boundary, manager interface, and encrypted provider.}
  - {path: internal/app, description: Secure master-key bootstrap and just-in-time consumer secret resolution.}

requirements:
  - id: R1
    text: Token bytes are never accepted through public API and never returned after Gateway creation.
  - id: R2
    text: Credential rows and tombstones are immutable, credential IDs cannot coexist or be reused, and token bytes never have a plaintext database representation.
  - id: R3
    text: Missing/wrong master key or GCM authentication failure is fatal/safe and never falls back to plaintext or unauthenticated execution.
  - id: R4
    text: Repository and provider errors contain no plaintext token, nonce, ciphertext, master-key path content, or raw operation payload.

acceptance_criteria:
  - id: A1
    given: A bounded generated credential is sealed and inserted through repository primitives.
    when: The active record is read and resolved.
    then: Database contains ciphertext/nonce/key ID and safe metadata, while every public/log encoding lacks plaintext.
  - id: A2
    given: Ciphertext copied to another credential/Gateway identity or modified.
    when: Decryption runs.
    then: Authentication fails and no model request is attempted.
  - id: A3
    given: A missing, symlinked, malformed, relative, or overly permissive master-key file.
    when: Secure bootstrap runs, or encrypted rows exist without the configured key.
    then: Startup fails safely without reading a fallback key or exposing key material.
  - id: A4
    given: An active row, tombstone, or operation identity already exists.
    when: A conflicting immutable insert/update/reuse is attempted.
    then: PostgreSQL and repository constraints reject it without changing the existing record.

tests:
  - {name: crypto-unit, command: "go test -race ./internal/credentials/...", covers: [A1, A2, A3]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... go test ./internal/credentials/...", covers: [A1, A4]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
