schema_version: "1.0"
id: V4-003
title: Add encrypted immutable LLM credential storage
milestone: server-ui-and-operations
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-006, V4-001]
languages: [go, sql]

goal: >-
  Persist immutable Gateway-generated execution credentials encrypted in
  PostgreSQL, expose only non-secret refs/metadata, and resolve plaintext just
  in time for the exact pinned Planner or Worker settings.

context:
  lifecycle: >-
    A credential row means active. There is no disabled/revoked/current state
    and no update/rotation operation. Creating a replacement uses a never-reused
    credential ID; deletion removes the remote key and encrypted row while
    retaining only a safe tombstone and is forbidden while a non-terminal Run
    pins the credential.
  encryption: >-
    Server reads one operator-owned 32-byte base64 master key from a secure
    absolute file. Tokens are AES-256-GCM encrypted with fresh 96-bit nonce and
    authenticated data containing schema version, credential ID, and exact
    digest-bearing Gateway ref. The row records a SHA-256 key fingerprint.

scope:
  in:
    - Add llm_credentials, credential_operations, and non-secret tombstone migrations and repositories.
    - Add strict secure-file loading for the credential master key and startup rules when encrypted rows exist.
    - Implement bounded encrypt/decrypt service with fresh cryptographic randomness and authenticated identity/route binding.
    - Define a GatewayCredentialManager interface returning bounded token and remote key ID, without yet implementing LiteLLM HTTP.
    - Implement idempotent create/delete application workflows and internal prepared/completed recovery journal.
    - Recheck active credential existence/Gateway binding during Run resolution and block deletion for non-terminal pinned Runs.
    - Resolve/decrypt only at Planner construction/allocation preparation; keep plaintext out of snapshots, reports, logs, errors, API, and tests.
    - Expose safe list/detail/create/delete handler DTOs; create request never accepts a token.
  out:
    - Master-key rotation/keyring, Vault/KMS, mutable credential policy, disable, raw-token import, or LiteLLM-specific HTTP behavior.

deliverables:
  - {path: internal/persistence/migrations, description: Credential, operation journal, and tombstone schema.}
  - {path: internal/credentials, description: Repository, AES-GCM boundary, manager interface, lifecycle/recovery service.}
  - {path: internal/app, description: Secure master-key bootstrap and just-in-time consumer secret resolution.}
  - {path: internal/httpapi/public, description: Secret-free credential API handlers and errors.}

requirements:
  - id: R1
    text: Token bytes are never accepted through public API and never returned after Gateway creation.
  - id: R2
    text: Credential ID is never reused, token never changes in place, and deletion has no user-visible intermediate state.
  - id: R3
    text: Missing/wrong master key or GCM authentication failure is fatal/safe and never falls back to plaintext or unauthenticated execution.
  - id: R4
    text: Deletion performs no remote or database side effect when a non-terminal Run pins the ID.

acceptance_criteria:
  - id: A1
    given: A fake manager returns a valid token and remote ID.
    when: Credential creation commits.
    then: Database contains ciphertext/nonce/key ID and safe metadata, while every public/log encoding lacks plaintext.
  - id: A2
    given: Ciphertext copied to another credential/Gateway identity or modified.
    when: Decryption runs.
    then: Authentication fails and no model request is attempted.
  - id: A3
    given: A non-terminal Run pins a credential.
    when: Delete is requested.
    then: credential_in_use returns safe Run IDs and no manager/database deletion occurs.
  - id: A4
    given: An unfinished create/delete operation at process restart.
    when: Recovery completes before traffic.
    then: The system exposes either one active credential or a tombstone, never a selectable partial record.

tests:
  - {name: crypto-unit, command: "go test -race ./internal/credentials/...", covers: [A1, A2, A3]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... go test ./internal/credentials/... ./internal/runstore/...", covers: [A1, A3, A4]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
