schema_version: "1.0"
id: V372-024
title: "Make the Audit item attempt fake answer like the store and keep the item list schema-valid without it"
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V369-004
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: "The handler-test double of ListItemAttempts returns an empty list for every requested item without attempts, as the PostgreSQL store does, and listAuditItems renders an empty attempts array for an item the map lacks, so no test and no store renders attempts: null."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; file:line verified on b2b09ea"
  specification: "docs/spec/api/public-api.md#API-R1"
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds unchanged in substance;
    line numbers moved and are updated below. V409-004 changed the Audit
    item reads but not ListItemAttempts' fill or the handler merge. No
    V407/V409/V414 task covers it.
  finding: >-
    listAuditItems (internal/httpapi/public/audit_handlers.go:435-521)
    replaces each item's attempts with the map entry of ListItemAttempts
    (line 518), so an item missing from the map is rendered as
    "attempts": null, although auditItemReadModel had set an empty list
    (audit_models.go:135) and the AuditItem schema forbids null (attempts is
    a required array, api/openapi/contractor-public-v1.yaml:13002 and
    13019). The PostgreSQL store never omits an item: QueryStore.ListItemAttempts
    (internal/auditstore/internal/pgstore/read.go:274-372) fills an empty list
    for every requested item without attempts (lines 367-371), and
    auditservice.Service.ListItemAttempts (internal/auditservice/service.go:185-189)
    passes the result through, so production does not render null. The
    handler-test double does omit them and says the opposite of the store:
    "Like the store, the result holds only the items that have attempts"
    (fakeAuditManagement.ListItemAttempts,
    internal/httpapi/public/audit_handlers_test.go:763-777, comment at :769,
    added by V369-004 in acfa7b5), so handler tests can render a response the
    contract rejects and exercise a path the store cannot produce
    (AGENTS.md 3.5). The handler relies on the store's fill without the
    interface saying so (audit_handlers.go:47).
  siblings: >-
    The operation conformance fixture (operation_conformance_test.go:147-175)
    builds fakeAuditManagement with attempts for its only item, so it never
    reaches the missing-entry path; other fakeAuditManagement page reads
    (ListItems at audit_handlers_test.go:756, ListCoverage) must follow the
    store's answers too; check the coverage and execution reads the same way.
    internal/auditcontroller/controller_postgres_test.go:1478 reads the real
    store and is correct. The UI reads item.attempts without a null check
    (ui/src/routes/projects/audits/executions.tsx:99, 116 and 242,
    activity-model.ts:133), which is correct for a schema-valid response.
scope:
  in:
    - "The double fills an empty list for every requested item without attempts, and its comment states the store's rule; the ListItemAttempts interface comment (audit_handlers.go:47) states the guarantee."
    - "listAuditItems keeps the read model's empty list when the map lacks an item."
    - "A handler test with an item that has no attempts whose response is validated against the OpenAPI document."
  out:
    - "The store query and the attempt projection bound."
acceptance_criteria:
  - id: A1
    given: "A page whose items include one without attempts"
    when: "GET on the Audit items page is served by the handler with the double"
    then: "That item renders attempts as an empty array and the response validates against the AuditItem schema."
  - id: A2
    text: "The double and the PostgreSQL store give the same map for the same item selection (an empty list per item without attempts)."
  - id: A3
    text: "The new handler test fails on the unfixed code (b523ae77): with the old handler merge and a double that omits the item, the response has attempts null and fails schema validation."
tests:
  - command: "go test -count=1 ./internal/httpapi/public"
    covers: [A1, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/auditstore/... ./internal/httpapi/public"
    covers: [A2]
  - command: make lint
    covers: [A1, A2, A3]
