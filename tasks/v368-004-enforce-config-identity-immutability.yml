epic: workflows
kind: defect
priority: P1
status: pending
depends_on: []
languages: [go]
goal: "Changing a shipped manifest without a new version fails the gate (or the spec says why it may)."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), config D 3.4, F2; file:line as of 02bbdcbf, re-verify on current main"
  finding: >-
