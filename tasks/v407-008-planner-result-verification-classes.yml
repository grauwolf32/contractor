schema_version: '1.0'
id: V407-008
title: Align Planner artifact-failure classes and report rejected invocations correctly
milestone: server-runtime-review-2026-10
epic: planner-worker
kind: defect
introduced_by: MVP-013
priority: P1
status: in_progress
depends_on: []
languages:
- go
goal: Give deterministic result-reference failures a non-retryable classification and make rejected-candidate
  invocation metrics agree with the recorded error.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/planners.md
  validation: 'Revalidated against main dc7012e8 on 2026-10-23. Confirmed by a passthrough probe: ErrArtifactNotFound
    yielded result_artifact_unavailable, retryable=true and a2a.invoke succeeded=1/failed=0. The report-level
    Errors array already records the failure.'
  severity: medium
  finding: internal/planner/result.go:56-63 and streamline/tools.go:437-441 mark all inspector errors
    retryable. Scheduler finalization instead treats missing/invalid artifact references and exact-revision
    mismatch as deterministic (scheduler/stage_finalization.go:144-154). Invalid names are often rejected
    earlier by result.Validate; a revision mismatch requires a violated inspector/store contract, while
    the missing exact-reference probe directly reproduced the inconsistent class. passthrough.go:150-155
    omits invokeFailure on candidate rejection, so finishReport counts a2a.invoke successful (208-227),
    although the report Errors array still records the error (229-234). Unsorted map traversal in result.go:25,36,47
    makes the selected rejection nondeterministic when several artifacts fail.
  siblings: Use a common semantic classification for passthrough candidate validation, Streamline Worker-result/finish
    validation and Scheduler revalidation without conflating their control flows. Streamline may return
    a tool rejection and let its Planner continue; it must not be changed into an unconditional Stage
    abort. Preserve Runtime result assembly.
plan:
- Introduce or reuse a typed artifact-verification classification at an allowed shared layer. Distinguish
  fixed missing/invalid exact references and descriptor mismatch from transient storage failures; do not
  classify by error-message matching.
- Apply the same classification in both Planner validators and Scheduler finalization while retaining
  each caller control flow, codes and retry policy. Test malformed refs rejected before storage as well
  as typed store failures.
- Iterate artifact names deterministically and set invokeFailure in the passthrough rejected-candidate
  branch so a2a.invoke metrics, tool record and span agree with the existing report-level error.
- Document planner/internal failure codes in their owning registry/spec surface. Verify how docs/spec/platform/errors.md
  is generated before changing it; do not invent unused public HTTP API errors merely to populate that
  table.
- 'Add tests using the real passthrough path, Streamline tool flow, Scheduler finalization and a PostgreSQL-backed
  artifact inspector: missing reference is deterministic, injected storage failure is retryable, and rejected
  candidates produce one failed invocation metric.'
scope:
  in:
  - Consistent semantic artifact-error classification across Planner and Scheduler boundaries.
  - Correct rejected-candidate metrics, deterministic validation order and production-path regression
    coverage.
  out:
  - Changing on.interrupted retry policy, successful result shapes or Runtime finalization.
  - Forcing every Streamline tool rejection to terminate its Stage or claiming the whole ExecutionReport
    currently hides failure.
  - Adding public API error registrations without a production API caller.
acceptance_criteria:
- id: A1
  text: Missing/invalid exact artifact references and exact-descriptor mismatch receive the same non-retryable
    semantic class in both Planner validators and Scheduler validation; transient store errors remain
    retryable. Streamline retains its existing tool-rejection/continuation flow.
- id: A2
  text: The passthrough rejected-candidate path records a2a.invoke Calls 1, Succeeded 0 and Failed 1,
    a failed tool record and the existing report-level error without duplicating the invocation.
- id: A3
  text: Given multiple invalid artifacts, deterministic name order selects the same rejection across runs.
    The owning planner/error documentation describes the actual exposed classes without unused public
    API codes.
- id: A4
  text: Regression tests for missing-artifact retryability and the incorrect metric fail before the fix;
    PostgreSQL-backed inspector tests and existing retry/continuation suites pass.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/planner/...
    ./internal/scheduler/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
