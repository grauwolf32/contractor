schema_version: "1.0"
id: V414-021
title: "Decide the client deadline of a migration file: per statement or a migration budget of its own"
milestone: review-v407-v409-followups-2026-10
epic: persistence
kind: defect
introduced_by: V29-007
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: >-
  The migrator's client deadline is a bound chosen for migrations rather than the query
  budget of one traced call reused for a whole file, so a file whose statements each fit
  the statement timeout cannot fail in production on a deadline no test exercises, or
  the current per-file rule is kept by a recorded decision with its evidence.
context:
  review: >-
    tasks/done/v409-012-migration-and-sql-hygiene.yml, decisions ("Review correction
    (client deadline): the migrator sends a migration file as one Exec ... so the client
    deadline covers all statements of a file together"), from the V409-012 review.
  specification:
    - docs/spec/platform/persistence.md#PER-R31
    - docs/spec/platform/persistence.md#PER-R32
    - docs/spec/platform/persistence.md#PER-R33
  severity: low
  finding: >-
    internal/persistence/postgres/migrate.go:61-110 applies each pending file with one
    tx.Exec(ctx, contents). MigrationBudgets.normalized (budgets.go:83-102) sets the
    traced query budget to the statement timeout plus migrationQueryMargin (5 s), and
    budgetTracer.TraceQueryStart (budget_tracer.go:71-73) starts that deadline once per
    Exec, so the default 125 s client deadline covers all statements of a file, while
    PostgreSQL applies the 120 s statement_timeout to each statement. V409-012 documented
    this (PER-R31, PER-R32: "all statements of the file together within the client
    deadline") and pinned it with TestPostgresMigrationClientDeadlineCoversAWholeFile
    (migration_run_postgres_test.go:121), so code and spec agree; enforcement is a
    review obligation only (PER-R32, Non-goals). Upgrade tests apply migrations through
    tracer-less isolated pools (PER-R33), so the per-file deadline never constrains
    them. Several shipped files are multi-statement data migrations (by rough count of
    statement terminators: 000024_finding_automatic_correlation.sql 110,
    000037_trigger_scope_for_unrelated_updates.sql 51, 000025 42, 000013 31,
    000003 30), and a run applies every pending file in one transaction. This reuses
    one timeout, the safety net for one stuck call, as the budget of a different
    operation (AGENTS 3.2, timeout row), which PER-R32 then turned into an authoring
    rule.
  siblings: >-
    In scope: ApplyMigrations and its budgets; the ledger INSERT and the ledger table
    creation, which are separate Exec calls under the same budget; docs/deployment.md
    and LIM-PER-9..13. Checked: VerifyMigrations (migrate.go:123) reads the ledger only;
    the Server never applies migrations (startup verifies); the cleanup budget
    (WithCleanupBudget) is unrelated. A production statement splitter would have to
    match explaintest.SplitStatements, which today is test support only (V409-012).
  provenance: >-
    The per-Exec client deadline under the migration budget came from
    4cfd75c87e1c20825fbadba427a7129da26cc95a "fix(postgres): bound database waits and
    isolate maintenance budgets" (tasks/done/v29-007-database-budgets-and-verification.yml),
    which set QueryTimeout 125 s for WithMigrationBudget while migrate.go already ran each
    file as one Exec (b33333a6, MVP-004). d9d4ea12 (2026-09-22, issue #83, no task) made
    it follow the configurable statement timeout.
  decision_required: >-
    Choose and record in PER-R31 and PER-R32 (AGENTS 3.10): (A) keep the per-file deadline
    and the PER-R32 authoring rule, recording the evidence and a reversal condition such as
    a file that needs more than one statement timeout in total; (B) execute each
    statement of a file as its own Exec with the existing per-call deadline, which needs a
    production splitter that agrees with PostgreSQL on dollar quotes, comments and
    function bodies and a regression on every embedded file; (C) give the file Exec a
    migration-specific client deadline derived from the run deadline (LIM-PER-11), since
    PostgreSQL's statement_timeout already bounds each statement and the client deadline
    only has to catch a lost connection. Whatever is chosen, PER-R32 must state the bound a
    file has to fit and why.
scope:
  in:
    - "The decision above with alternatives, evidence and reversal condition in persistence.md (PER-R31, PER-R32, LIM-PER-9, FAIL-PER-5, invariant 26) and docs/deployment.md."
    - "If B or C is chosen: the implementation, and TestPostgresMigrationClientDeadlineCoversAWholeFile turned around so its eight 1 s statements under a 2 s statement timeout (8 s together, over the 7 s per-call deadline) now apply, while one 4 s statement still fails with 57014."
    - "If A is chosen: TestPostgresMigrationClientDeadlineCoversAWholeFile stays and the rule names its reversal condition."
  out:
    - "Per-file transactions, non-transactional steps or background backfills (PER-R32 rationale keeps one transaction per run)."
    - "Changing historical migration files (PER-R30)."
failure_outcomes:
  - operation: "One migration run"
    permanent: "a statement over the statement timeout is cancelled by PostgreSQL (57014) and the run rolls back; a file over the chosen file bound fails as a timeout and applies nothing (FAIL-PER-5)"
    retryable: "the operator re-runs with a larger budget; nothing was applied"
    ambiguous: "a lost COMMIT reply of the run is resolved by the ledger read of the next run or of the Server's startup check (PER-R30)"
    cancelled: "a cancelled run rolls back"
    timeout: "statement_timeout per statement, the chosen client bound per file or statement, LIM-PER-11 per run; each owned by one rule"
acceptance_criteria:
  - id: A1
    given: "the decision recorded in persistence.md"
    when: "a reviewer reads PER-R31 and PER-R32"
    then: "they name one owner per timeout (statement, client call, file if any, run), the alternatives considered and the reversal condition"
  - id: A2
    given: "option B or C chosen, a pool opened as the migrator opens it (budgetTestPool) with a 2 s statement timeout, and a migration file of eight 1 s statements"
    when: "applyMigrations runs it"
    then: "the run applies the file and records it in the ledger, while a file with one 4 s statement still fails with SQLSTATE 57014 and applies nothing"
  - id: A3
    given: "option B or C chosen and the unfixed code at 19f7477f"
    when: "the A2 regression runs"
    then: "it fails at the 7 s per-call client deadline (context.DeadlineExceeded, no SQLSTATE)"
  - id: A4
    given: "option A chosen"
    when: "TestPostgresMigrationClientDeadlineCoversAWholeFile runs"
    then: "it still passes and the spec names when the rule is reopened"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 ./internal/persistence/postgres/... ./internal/app/..."
    covers: [A2, A3, A4]
  - command: make lint
    covers: [A1]
decisions:
  - >-
    2026-10-30: option C. The call that carries a migration file gets the run deadline
    (LIM-PER-11) as its client deadline through withMigrationFileBudget
    (internal/persistence/postgres/budgets.go); the migrator's one-statement calls (lock
    poll, ledger creation and read, ledger row, commit) keep the statement timeout plus
    5 s. Evidence: every embedded file applied in under 0.2 s and all 61 in about 2 s on an
    empty schema (psql, one transaction per file, local PostgreSQL); several files hold 30
    to 110 statements; upgrade tests use tracer-less pools, so the per-file deadline was
    never exercised on data; PostgreSQL ends each statement at statement_timeout even after
    the client is gone. A was rejected because it reuses one call's safety net as a file
    budget enforced only by review; B because it needs a production splitter matching
    PostgreSQL for no gain beyond faster lost-connection detection. Price and reversal
    condition are recorded in PER-R31 (decision paragraph). The regression was renamed
    TestPostgresMigrationFileOutlastsTheCallDeadline (it no longer covers a whole file); on
    the unfixed code its first case failed at 7.03 s with context deadline exceeded and no
    SQLSTATE (A3).
