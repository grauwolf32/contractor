schema_version: '1.0'
id: V407-036
title: Load Memory note payloads concurrently within the existing serialized operation
milestone: server-runtime-review-2026-10
epic: memory
kind: chore
introduced_by: V9-002
priority: P3
status: pending
depends_on: []
languages:
- python
goal: Overlap up to eight independent note reads while preserving Memory operation serialization, deterministic
  validation, ordering and mutation outcomes.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/tools/memory.md
  finding: runtime/src/contractor_runtime/toolsets/memory/tools.py:211-237 performs a bounded prefix list
    then up to 128 sequential read_artifact calls. list_memories, search_memory, list_memory_tags and
    creation of a new note invoke it under the session lock (:136-139,159-161,199-209). The count and
    ordinal rules rely on MEM-R49 call/mutation serialization; only independent payload reads inside one
    owned operation can overlap. Runtime ArtifactClient exposes no Worker batch-read operation, even though
    Server-side stores have batch helpers. Creating a note also performs an initial lookup and a write,
    so the list-only 1+N count is not the complete create cost.
  siblings: All _load_all callers, corrupt prefix/namespace/revision/ordinal validation, read failure
    classification and cancellation ownership. Planner Memory batch loading is a separate boundary and
    does not imply an existing private Worker batch endpoint.
  validation: 'Confirmed as a bounded performance opportunity on dc7012e8: loading 128 valid notes used
    maximum client concurrency one. No correctness defect or measured production latency was established;
    MEM-R49 intentionally serializes calls and mutations.'
plan:
- Keep the outer Memory session lock and all create/append writes serialized. Bound the listed input before
  launching at most eight payload reads within the owned operation. Record per-reference structural, read
  and decode outcomes without returning a later failure before all earlier references are resolved.
- Consume outcomes in the original reference order and apply the existing decode, duplicate and ordinal
  checks at the same logical boundary. An early delayed read error must win over a later malformed reference,
  decode error or faster read failure, just as in the serial implementation.
- On caller cancellation, cancel/join all started reads. On a reference failure, resolve all earlier references
  before selecting the first failure; cancel only later outstanding work, then join every started read
  before returning or releasing ownership. No read outlives allocation cleanup and no write follows a
  failed load.
- Use a barrier-controlled fake Artifact client with 128 valid notes to prove overlap and maximum concurrency
  eight without timing thresholds. Check identical ordering/output and failure behavior with reversed
  completion order, empty/max/over-limit listings, malformed notes and injected cancellation. Include
  an early delayed forbidden read followed by a malformed reference or a faster read failure, so eager
  validation/cancellation cannot change the selected error.
scope:
  in:
  - Bounded concurrent payload reads within _load_all; deterministic aggregation, validation and joined
    cleanup.
  out:
  - Parallel Memory calls or writes, changed ordinal/count guarantees, new private batch API, note formats,
    bindings or limits.
  - Network latency guarantees or claims of a measured production speedup.
acceptance_criteria:
- id: A1
  text: A deterministic 128-note load starts more than one and at most eight read operations before releases,
    and preserves the exact prior listing/search/tag ordering and content. The concurrency assertion fails
    on the original serial loop.
- id: A2
  text: Empty, maximum-size, over-limit and corrupt-note cases retain their existing outcomes. Permuting
    read completion order does not change output or selected model-facing failure. An early delayed forbidden
    read wins over a later malformed reference or fast read failure, matching the original serial order.
- id: A3
  text: Cancellation and read failure join every started read before the operation releases its lock;
    a failed load performs no note mutation, and create/append count and ordinal behavior stays serialized.
- id: A4
  text: Full Memory toolset tests pass with the same tool schemas, formats and limits; added performance
    checks use counters and barriers, never elapsed time.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_memory_toolset.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A2
  - A3
  - A4
