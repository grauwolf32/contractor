schema_version: "1.0"
id: V25-008
title: Integrate Audit pause, cancel, deletion and retention fences
milestone: audits-mvp
priority: P0
status: pending
implementation_commit: null
depends_on: [V24-005, V25-007]
languages: [go, sql, openapi]

goal: >-
  Make Audit lifecycle safe under owner pause, Run deletion and Project
  deletion without leaked Runs, credentials, artifacts or controller work.

context:
  pause: >-
    The first UI/API guarantee is pause-new-Audit-Runs. Existing active child
    Stages may drain. Collection, cancel and cleanup must ignore owner/Audit
    admission pause.
  deletion: >-
    Audit deletion is durable: close dispatch, cancel and drain child Runs,
    release holds, purge managed bindings and domain rows. Project deletion must
    perform this phase before its existing Run and ProjectScope purge.

scope:
  in:
    - Add idempotent CAS pause/resume/cancel/delete commands and safe lifecycle projection.
    - Cancel every owned nonterminal Run with bounded independent progress and wait for existing terminal-release authority.
    - Block hard deletion of an Audit-bound Run until terminal release and committed output import; preserve nullable tombstone provenance afterward.
    - Reserve protected Audit-managed Project artifact prefixes from generic mutation.
    - Add Audit cancellation/drain/hold-release phases to Project deletion recovery.
    - Release managed LLM/Runtime credential holds and exact artifact holds only after no future child dispatch is possible.
  out:
    - Human review, multi-round discovery or finding Toolset.

requirements:
  - {id: R1, text: Cancel/delete cleanup progresses while owner queue and Audit dispatch are paused.}
  - {id: R2, text: Project purge cannot finish with an Audit Run, credential hold or Audit-managed Project binding left behind.}
  - {id: R3, text: Public generic artifact and Run deletion APIs cannot bypass Audit retention guards.}
  - {id: R4, text: Crash/restart at each deletion phase resumes rather than restarts or skips work.}

acceptance_criteria:
  - id: A1
    given: An Audit with active, waiting, terminal-unimported and imported Runs.
    when: Cancel or delete is requested during queue pause.
    then: All children drain, imports/retention rules hold and cleanup converges.
  - id: A2
    given: Project deletion races Audit start/dispatch/import.
    when: The Project fence commits.
    then: No new Audit work wins afterward and Project deletion eventually purges all owned state.
  - id: A3
    given: A public caller targets a managed Audit artifact or premature Run deletion.
    when: The mutation is attempted.
    then: It is rejected with a stable owner-safe conflict.

tests:
  - {name: lifecycle, command: "go test ./internal/auditcontroller ./internal/projectlifecycle ./internal/httpapi/public -run Audit", covers: [A1, A2, A3]}
  - {name: postgres, command: "go test -tags=integration -race ./internal/auditcontroller ./internal/projectlifecycle", covers: [A1, A2]}

