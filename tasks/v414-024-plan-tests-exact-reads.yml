schema_version: "1.0"
id: V414-024
title: "Measure the V407-025 drain and held-credential row budgets with explaintest Analysis.Reads"
milestone: review-v407-v409-followups-2026-10
epic: persistence
kind: chore
introduced_by: V407-025
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: >-
  The Project drain, purge-recheck and held-Audit credential plan tests bound the rows a
  statement reads with the exact per-table count (Analysis.Reads), with budgets derived
  from their fixtures, so a plan that reads rows can no longer pass because EXPLAIN
  rounded its per-loop rows to zero.
context:
  review: >-
    tasks/done/v409-004-audit-read-statements-indexes.yml, declined ("Node.Examined stays
    in explaintest as a plan-shape view ... V407-025's held-credential and drain tests
    assert heap rows with it ... moving them is a decision for V407-025's owner"), and the
    V409-004 re-review.
  specification:
    - docs/spec/platform/persistence.md
  finding: >-
    internal/auditstore/internal/pgstore/held_credentials_plan_postgres_test.go:171
    (TestPostgresHeldAuditCredentialChecksReadOnlyMatchingHeldAudits) bounds
    plan.Examined("audits") by the matching held Audits, and
    internal/projectlifecycle/drain_plan_postgres_test.go:393-399 and 408
    (TestProjectDrainChecksReadOnlyTheProjectAndUnreleasedAllocations, checkDrainPlans)
    bound Examined of workflow_runs, stage_executions, stage_allocations and audits and
    assert Examined("audits") == 0 and Examined("workflow_runs") == 0 for the purge
    recheck. Node.Examined (internal/persistence/explaintest/explaintest.go:308-324)
    multiplies EXPLAIN's per-loop row averages by loops; PostgreSQL 17 prints those
    averages rounded to integers, so an inner scan that returns a row in fewer than
    half of its loops reports 0 rows and Examined 0 while it reads rows. The package
    documentation (explaintest.go:15-22 and the Examined comment) already says Examined
    is not the rows a statement read and that row budgets use Analysis.Reads; these two
    tests are the only callers of Examined outside explaintest's own unit test (grep at
    19f7477f). Under
    the exact count their claims change, as V409-004 measured: the drain check's
    BitmapAnd returns 214 owner/project and 112 runtime-credential index entries of
    workflow_runs, and a rolled-back insert leaves a dead GIN entry under llm-10 and
    runtime-10, so the new budgets must state which index entries they include.
  siblings: >-
    In scope: both tests and every Examined assertion in them. Already on Reads: the
    V409-004 item, finding and inbox scale tests, the Eval inventory and comparison page
    tests. Node.Examined then has only its own unit test (explaintest_test.go:55); keep
    it as the plan-shape helper V409-004 decided on, or remove it with that test;
    explaintest is test support, so tools/testonlyexports allows either.
  provenance: >-
    git blame of drain_plan_postgres_test.go:393-408 points at 6202fe22 "perf(persistence):
    scope Stage triggers and narrow drain and hold checks", and of
    held_credentials_plan_postgres_test.go:171 at c9562ebeb4628a77dc0b697eccb8a5a2993f1d24,
    the implementation commit of tasks/done/v407-025-persistence-indexes-and-triggers.yml;
    both commits belong to V407-025.
scope:
  in:
    - "Replace each Examined row bound in the two tests with Analysis.Reads.Of(table), with a budget derived from the fixture constants (matching rows plus the stated index entries a plan returns, such as a BitmapAnd's inputs) and a comment that names what the budget counts."
    - "Keep or restate the zero-read claims (no Audit rows in the drain check, no workflow_runs or audits rows in the purge recheck) as exact Reads.Of(...) == 0, or record why the exact count is not zero."
    - "Order the fixture so measured plans see no dead index entries (measure before the rolled-back result cases, or VACUUM first), as checkDrainPlans already intends."
  out:
    - "The production statements and indexes V407-025 shipped; block-count comparisons with the original statements stay."
    - "explaintest's counting rules."
acceptance_criteria:
  - id: A1
    given: "the two tests after the change"
    when: "grep -n Examined runs over internal/projectlifecycle and internal/auditstore"
    then: "no row budget uses Node.Examined; each uses Analysis.Reads with a fixture-derived budget"
  - id: A2
    given: "a mutated statement that makes the drain check join audits or the held-credential check read a non-matching held Audit through a sparse nested loop"
    when: "the tests run on PostgreSQL 17"
    then: "the Reads-based assertions fail for every such mutation, and at least one of them (a sparse inner scan whose per-loop rows round to 0) passes the Examined-based assertions at 19f7477f; the mutations and both outcomes are recorded in the task"
  - id: A3
    given: "the shipped statements"
    when: "the tests run on PostgreSQL"
    then: "they pass, and existing tests pass unchanged apart from the replaced assertions"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 -run 'TestProjectDrainChecksReadOnlyTheProjectAndUnreleasedAllocations' ./internal/projectlifecycle/"
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 -run 'TestPostgresHeldAuditCredentialChecksReadOnlyMatchingHeldAudits' ./internal/auditstore/..."
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 ./internal/projectlifecycle/... ./internal/auditstore/... ./internal/persistence/explaintest/..."
    covers: [A3]
  - command: make lint
    covers: [A1]
