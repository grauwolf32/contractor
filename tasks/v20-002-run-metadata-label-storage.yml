schema_version: "1.0"
id: V20-002
title: Persist immutable WorkflowRun metadata labels
milestone: run-metadata-labels
priority: P0
status: pending
implementation_commit: null
depends_on: [V20-001]
languages: [go, sql, yaml, json]

goal: >-
  Add one strict bounded string map of immutable descriptive labels to every
  WorkflowRun, storing it atomically with Run creation and exposing it through
  owner-scoped create, list and detail read models.

context:
  semantics: >-
    Metadata labels identify and group a Run. They are not RuntimeConfig
    selectors, authorization claims, Scheduler inputs, execution parameters or
    an artifact substitute. Omission means an empty map; explicit null and
    non-object forms are invalid.
  shape: >-
    Accept at most 32 pairs. Keys are 1..63 ASCII bytes matching
    [a-z][a-z0-9]*(?:[._-][a-z0-9]+)*; contractor. is reserved. Values are
    non-empty decoded UTF-8 of at most 256 bytes. All values are treated as
    externally displayable safe metadata and must not contain secrets.
  durability: >-
    One normalized relational row per run/key provides a unique invariant and
    later exact-match index. Labels are inserted in the same transaction as
    the Workflow snapshot, RuntimeConfig pins, Skill snapshot and input forks.

scope:
  in:
    - Add migration 000024_workflow_run_metadata_labels.sql with run foreign key, one value per run/key, database bounds, immutable-row protection and an exact key/value/run index.
    - Add a RunMetadataLabels domain value with cloning, deterministic key ordering and validation shared by API, persistence and tests.
    - Strictly decode labels as an object of strings; reject explicit null, arrays, scalars, non-string values and duplicate JSON object keys rather than accepting parser last-value-wins behavior.
    - Add labels to CreateRunParams, WorkflowRun and bounded WorkflowRunSummary without reusing RuntimeLabels or RuntimeConfig provenance types.
    - Include the normalized map in the canonical Run-create idempotency digest independently of runtimeLabels.
    - Insert labels atomically with newly created Runs and load a bounded complete map for create, list and detail without an N+1 query per Run.
    - Return the original stored labels on exact idempotency replay before mutable Workflow/config/credential resolution; changed labels under the same key conflict.
    - Keep lifecycle events correlated by runId only instead of copying the complete map into every event.
    - Preserve empty-label ordinary Runs and all existing Scheduler claim/transition behavior.
  out:
    - Label mutation endpoints, list filtering, telemetry propagation, eval-specific validation, queue priority or Workflow-declared labels.

deliverables:
  - {path: internal/persistence/migrations/000024_workflow_run_metadata_labels.sql, description: Atomic immutable normalized Run-label storage and exact index.}
  - {path: internal/runstore, description: Metadata-label domain projection, create transaction and bounded reads.}
  - {path: internal/httpapi/public/run_handlers.go, description: Strict create validation, replay semantics and read projection.}
  - {path: api/openapi/contractor-public-v1.yaml, description: Closed string-map labels schema on Run create/list/detail.}
  - {path: internal/httpapi/public/openapi_contract_test.go, description: Contract and hostile-shape coverage.}

requirements:
  - {id: R1, text: A committed Run has either its complete original metadata-label set or no labels; partial insertion is impossible.}
  - {id: R2, text: Labels are immutable and owner-scoped and cannot influence execution, placement or authorization.}
  - {id: R3, text: API normalization and database constraints enforce the same count/key/value bounds.}
  - {id: R4, text: Exact replay returns the original map while any changed pair under that idempotency key conflicts before mutable dependency reads.}

acceptance_criteria:
  - id: A1
    given: A Run request with purpose, eval.name, eval.id, eval.leg, eval.case and eval.sample labels in arbitrary object order.
    when: Creation commits and create/list/detail are read repeatedly.
    then: Every response contains the same complete normalized map and execution behavior is identical to an unlabeled Run.
  - id: A2
    given: Empty/omitted labels and each invalid form, bound, key, reserved prefix, duplicate key and invalid UTF-8 case.
    when: Requests are decoded and persisted.
    then: Empty/omitted maps succeed equivalently; every invalid request returns a bounded 400 and leaves no Run, label, input fork or idempotency row.
  - id: A3
    given: A successful response is lost and current Workflow credentials or Runtime bindings later change or disappear.
    when: The exact labeled request is replayed and then the same key is tried with one changed label.
    then: Exact replay returns the stored Run without dependency resolution and the changed request conflicts without mutation.
  - id: A4
    given: A database writer attempts direct update/delete or concurrent duplicate insertion for one committed Run label.
    when: Constraints and immutable-row protection execute.
    then: The original value wins unchanged, while parent-owned retention may still remove the complete Run according to retention policy.

tests:
  - {name: domain-and-api, command: "go test -race ./internal/runstore/... ./internal/httpapi/public/...", covers: [A1, A2, A3]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... go test -count=1 ./internal/runstore/... ./internal/httpapi/public/...", covers: [A1, A2, A3, A4]}
  - {name: public-contract, command: "make verify-public-api", covers: [A1, A2]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}

decisions:
  - >-
    Labels are normalized rows instead of an opaque JSON blob so uniqueness,
    bounds and exact filtering remain database-enforced and indexable.
  - >-
    Version 1 intentionally has no mutation. A future mutable operator-tag
    resource requires explicit CAS/audit semantics and does not rewrite eval
    provenance retroactively.
