schema_version: "1.0"
id: V410-010
title: "Keep a previous lease owner's credential delete intent from committing behind the new owner's startup recovery"
milestone: review-v407-v409-followups-2026-10
epic: execution-core
kind: defect
introduced_by: V107-001
priority: P2
status: pending
depends_on: []
languages: [go]
goal: >-
  After a lease handover, no delete intent of the previous active Server can become
  durable after the new owner's credential recovery has read the operation journal, so
  RCF-R72 (no unfinished deletion once traffic is accepted) and safety property S1 of
  proposal 0044 (no intent while a reference exists) hold across the handover.
context:
  review: >-
    tasks/done/v407-018-credential-delete-lock-scope.yml and
    tasks/done/v407-019-credential-recovery-fence-and-classifier.yml;
    docs/proposals/0044-credential-deletion-availability.md section 6, finding 7
    ("Startup recovery trusts its journal read ... Not reproduced"), which names
    execution-core (single-active Server, lease handover) as the owner.
  specification:
    - docs/spec/configuration/runtime-config.md#RCF-R72
    - docs/spec/configuration/runtime-config.md#RCF-R53
    - docs/spec/platform/persistence.md#PER-R4
    - docs/spec/platform/persistence.md#PER-R5
    - docs/spec/platform/persistence.md#PER-R7
  proposal: docs/proposals/0044-credential-deletion-availability.md
  severity: medium
  finding: >-
    Reproduced on PostgreSQL 17.11 at 19f7477f with a temporary test in
    internal/credentials built on newDeleteFenceFixture: the old owner's Delete is held
    at COMMIT (commitFaultHold), so its intent transaction holds the credential's
    deletion lock and an uncommitted prepared row. A fresh Service on the same database
    (the new owner) runs Recover: it returns nil with ready=true and no uncertain fence,
    because settleUncertainDeleteLocked (internal/credentials/lifecycle.go:279-283)
    returns resolved when the process has no uncertain delete, so Recover
    (lifecycle.go:343-403) trusts a plain ListPreparedOperations read and never takes
    the deletion lock that would wait for the open intent. The new owner then admits a
    Run pinning the credential under WithRunCreation (allowed: the lookup does not see
    the uncommitted row and Run creation takes no M5 lock). When the held COMMIT lands,
    the journal holds one prepared delete while Run run-new-owner is non-terminal and
    pins the credential (S1 broken), the running new owner refuses every managed
    create with credential_recovery_required and every lookup of the credential, and
    the next restart's Recover fails with credential_in_use (CredentialInUseError,
    no Gateway call), so the Server cannot start until a Run ends that only a running
    Server can end. The process-level window is real: a server-side release of the
    lease session (pg_terminate_backend of the lease backend, or a failure of that one
    connection) frees the advisory lock at once, while the old owner notices only at
    its next one-second liveness probe (internal/app/single_active.go:24,153-189); a
    standby polls every second (single_active.go:260-285) and runs credential
    recovery right after acquisition; and the old owner's public requests run under
    context.WithoutCancel (internal/app/system.go:60) until ServeSystem closes the
    connections after detection (system.go:89-97), so a delete in flight, or started,
    in that window commits after the new owner's journal read. PER-R7 proves the
    old owner stops first only for a release by TCP keepalive, not for a release by
    the server.
  siblings: >-
    In scope: the managed LLM credential delete intent (lifecycle.go:566-609) and the
    managed create intent, whose prepared row a new owner would likewise miss; the
    startup order in internal/app/composition_credentials.go:126 (Recover before any
    listener). To evaluate and either fence or rule out with evidence in this task:
    other startup work that trusts durable state read once after acquisition while a
    previous owner can still write for up to one probe interval (the Scheduler's
    first claims, the Gateway recovery probe, Runtime credential create and delete);
    controller claims (PER-R25) and the Scheduler's Run claim are database leases and
    are expected to be safe. Out of scope: the D1-D4 availability alternatives of
    proposal 0044.
  provenance: >-
    Recover's unreconciled journal read dates from 4a7797fc (V4-003a, 2026-08-30),
    written before a lease existed. The overlap that makes it reachable comes from the
    lease handover of 3262cb829c470a4d416767d865403396c1bf2e2e "Enforce a single active
    Server with a PostgreSQL lease" (tasks/done/v107-001-single-active-server.yml),
    whose standby starts credential recovery as soon as it acquires the lock while the
    previous owner can still commit until its next probe. ca700f44 (V407-019) added
    in-process reconciliation only.
  decision_required: >-
    Record the chosen guarantee, alternatives, evidence and reversal condition in
    runtime-config.md and persistence.md (AGENTS 3.10). Alternatives: (A) a handover
    grace: after acquisition the new owner waits the previous owner's detection bound
    (probe interval plus tolerance window plus the bounded cancellation of in-flight
    requests) before credential recovery and the Scheduler start; simple, but a timing
    argument. (B) a lease fence inside each intent transaction: the active Server
    proves in the same transaction that its lease session still holds the advisory
    lease (or takes a shared transaction lock that the new owner takes exclusively
    before recovery), so a previous owner's intent either commits before the new
    owner reads the journal or fails; a database proof, as PER-R25 claims are. (C)
    Recover waits for every credential's deletion lock before trusting its read;
    bounded by the credential count but it does not stop an intent that starts later,
    so it needs (A) or (B). Reopen the choice if the single active Server becomes
    several replicas (OPS-R5).
scope:
  in:
    - "The chosen handover fence for managed credential create and delete intents, applied before the new owner's Recover reads the journal."
    - "Spec updates: RCF-R72 and FAIL-RCF-2 state the handover outcome; persistence.md states what the previous owner may still commit after a server-side lease release and how startup recovery excludes it."
    - "A PostgreSQL regression with two credential Services on one database that reproduces the interleaving above and proves the fix."
    - "Dispositions for the sibling startup paths listed above."
  out:
    - "Proposal 0044 decisions D1-D4 (barrier hold, durable-intent fence scope, completer, startup without a Gateway)."
    - "Multiple active Servers or replicas."
failure_outcomes:
  - operation: "Previous owner's delete intent transaction after a server-side lease release"
    permanent: "the intent is refused with a classified error and no prepared row; its caller sees the existing retryable credential_recovery_required or a storage failure, never a Gateway call"
    retryable: "the client retries against the new owner with its Idempotency-Key"
    ambiguous: "a lost COMMIT reply of the fenced transaction raises the existing uncertain-delete fence in the old process, which is exiting"
    cancelled: "the old owner's lease-loss shutdown cancels the request; a COMMIT already sent either finished before the new owner's recovery read or is excluded by the fence"
    timeout: "the fence wait (if any) is bounded by an existing database budget, and a timeout stops startup as FAIL-PER-4 does"
  - operation: "New owner's startup recovery"
    permanent: "a journal that disagrees with the fence fails startup with the existing recover LLM credential operations error"
    retryable: "the process supervisor restarts the Server"
    ambiguous: "not applicable: recovery reads after the fence"
    cancelled: "shutdown during recovery exits without an error"
    timeout: "database.queryTimeout per statement, as today"
acceptance_criteria:
  - id: A1
    given: "an old-owner credential Service whose delete intent transaction is open with its COMMIT held, and a fresh Service on the same database"
    when: "the fresh Service runs Recover, admits a Run of that credential, and the held COMMIT is then released"
    then: "either Recover does not report ready until the open intent has ended and then completes it, or the old intent cannot commit; in no outcome does a prepared delete coexist with a non-terminal Run pinning the credential"
  - id: A2
    given: "the same setup with a managed create intent held at COMMIT"
    when: "the fresh Service runs Recover"
    then: "the create is completed or excluded by the same rule"
  - id: A3
    given: "a server-side termination of the active Server's lease session in the process-level lease tests"
    when: "a standby acquires the lease"
    then: "the standby's credential recovery starts only after the chosen fence holds"
  - id: A4
    given: "the unfixed code at 19f7477f"
    when: "the A1 regression runs"
    then: "it fails: the restart Recover answers credential_in_use with the Run still pinning the credential"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 ./internal/credentials/... ./internal/app/..."
    covers: [A1, A2, A3, A4]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -tags=integration -count=1 ./internal/app/... ./internal/credentials/..."
    covers: [A3]
  - command: make lint
    covers: [A1, A2, A3]
