schema_version: '1.0'
id: V185-001
title: Align telemetry JSON size limits across Runtime and Server
milestone: telemetry-json-size-parity-2026-10
priority: P1
status: in_progress
depends_on: []
languages: [go, python]
goal: Accept Runtime reports whose compact UTF-8 JSON fits the published limits.
context:
  issue: https://github.com/grauwolf32/contractor/issues/203
  finding: Go's default JSON marshaler inflates HTML characters and line separators.
scope:
  in:
    - Use compact UTF-8 JSON size accounting for tool arguments and both report limits.
    - Apply the same byte unit to the Server telemetry persistence policy.
    - Cover the same character cases in Runtime, Go contracts and finalization tests.
  out:
    - Raising the 4096-byte argument or 1 MiB report limits.
acceptance_criteria:
  - {id: A1, text: Compact arguments within 4096 bytes survive Runtime and Server validation, while larger arguments are bounded.}
  - {id: A2, text: Compact aggregate and allocation reports under 1 MiB pass Go validation despite HTML-escaped size exceeding 1 MiB.}
  - {id: A3, text: Finalize and Abort retain real report details and the persistence policy does not truncate valid arguments.}
tests:
  - {command: go test ./internal/contracts ./internal/controlplane ./internal/telemetry, covers: [A1, A2, A3]}
  - {command: cd runtime && uv run pytest tests/test_metrics.py, covers: [A1]}
  - {command: make lint, covers: [A1, A2, A3]}
