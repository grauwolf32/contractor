schema_version: "1.0"
id: V11-004
title: Implement allocation-private fsspec OverlayFS core
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-002, V11-003]
languages: [python]

goal: >-
  Provide one copy-on-write OverlayFS over either rooted local or isolated
  memory lowers where all ordinary edits remain allocation-private and the
  effective view obeys the same WorkspaceReader/Writer contract.

context:
  state: >-
    One overlay owns files path->bytes, explicit dirs including mount root and
    tombstones hiding a path plus descendants. Reads prefer upper then lower;
    list/walk/glob merge both. Writes/create-parent/copy/move/remove mutate upper
    only. One re-entrant session lock serializes state. Upper file/count/byte
    bounds are 10000, 4 MiB and 64 MiB and are checked against the resulting
    state before mutation.
  compatibility: >-
    Use contractor-old MemoryOverlayFileSystem and tests as behavior references
    for read-through, tombstones, empty directories, open modes, recursive
    copy/move, type conflicts and glob parity. Do not copy its implicit wrapper,
    __getattr__ lower delegation, global state, patch serialization or fork
    merge algorithm.

scope:
  in:
    - Implement OverlayFileSystem as an explicit Workspace backend over a lower Reader, with Writer methods independent of lower write authority.
    - Normalize/rout paths before overlay dispatch and ensure lower objects/paths never bypass the mount wrapper.
    - Cover file/dir creation, whole text write, append support, mkdir, rm/rmdir, recursive copy and move, touch/open modes needed by Edit algorithms.
    - Maintain minimal tombstones, unhide on recreation, reject root deletion and enforce file-parent/type conflicts consistently across local and memory lowers.
    - Elide an upper file when its resulting bytes equal an unchanged lower file and no type change remains.
    - Make each operation exception/cancellation atomic under the lock; open-write buffers commit only on successful close and are discarded on exceptional exit.
    - Implement deterministic stat/list/walk/find/glob and cache invalidation over the effective view.
    - Expose internal immutable snapshot/reset primitives for later diff/rollback/materialization without defining a Server or Artifact serialization format.
  out:
    - Model-visible tools, unified diff, path rollback, lower materialization, patch JSON, cross-allocation fork/merge or host journal.

deliverables:
  - {path: runtime/src/contractor_runtime/projectfs/overlay.py, description: Explicit fsspec-compatible copy-on-write WorkspaceReader/Writer.}
  - {path: runtime/tests/test_workspace_overlay.py, description: Local/memory lower parity tombstone type and cancellation suite.}

requirements:
  - id: R1
    text: No ordinary Overlay Writer method invokes a lower mutation method, even when the lower is host writable.
  - id: R2
    text: Effective tree behavior is identical for equivalent local and memory lower fixtures.
  - id: R3
    text: Upper state is instance/allocation owned and a failed quota/type/cancelled mutation preserves its previous byte-exact snapshot.
  - id: R4
    text: Overlay never delegates unknown operations or exposes a raw lower filesystem to callers.

acceptance_criteria:
  - id: A1
    given: Equivalent rooted-local and isolated-memory lower trees.
    when: The full create/edit/append/copy/move/delete/recreate matrix runs.
    then: Effective trees and normalized results match while both lowers remain byte-for-byte unchanged.
  - id: A2
    given: Empty dirs, file-to-dir and dir-to-file changes, recursive tombstones and self/descendant move attacks.
    when: Overlay operations run.
    then: Every type/path invariant is deterministic and no hidden lower child leaks through.
  - id: A3
    given: Quota, injected I/O exception and cancellation at each buffered-write boundary.
    when: A mutation fails.
    then: Snapshot before and after is identical and subsequent valid operations still succeed.

tests:
  - {name: overlay-core, command: "cd runtime && uv run pytest tests/test_workspace_overlay.py", covers: [A1, A2, A3]}
  - {name: workspace-regression, command: "cd runtime && uv run pytest tests/test_workspace_paths.py tests/test_workspace_local.py tests/test_workspace_memory.py tests/test_workspace_overlay.py", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
