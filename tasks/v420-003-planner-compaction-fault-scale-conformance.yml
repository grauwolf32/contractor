acceptance_criteria:
- id: A1
  given: Every real-store append outcome at pre/post-finish boundaries
  when: Production session/compaction code runs
  then: 'Current error classification and PLN-R130 fencing are preserved: no further model/Worker effect
    or candidate after required append failure, including commit followed by lost acknowledgement. No
    marker append or Worker effect is duplicated; existing Worker receipts keep their own reconciliation
    semantics.'
- id: A2
  given: Barriers at every execution boundary
  when: Cancel/deadline/early-stop races run under the race detector
  then: All local work joins before return with stable state and no post-return work.
- id: A3
  given: All invalid summary and usage/budget cases
  when: Multiple context generations are attempted
  then: Charges and failure precedence remain exact and every loop terminates under explicit bounds.
- id: A4
  given: Lossy/adversarial summaries and interrupted tools
  when: Runner builds subsequent requests and finish validates outputs
  then: Exact old evidence remains accessible, summaries grant no authority and tool history stays truthful.
- id: A5
  given: Realistic long histories and every containing limit
  when: At-ceiling and one-over work/byte tests run
  then: Work and peak retained/transient data remain bounded with honest classified overflow and no secret
    leakage.
- id: A6
  given: Recovery and terminal Worker continuation fixtures
  when: Existing Planner/Scheduler regression suites run
  then: No new transitions, claims, retries or post-crash resume behavior appear.
