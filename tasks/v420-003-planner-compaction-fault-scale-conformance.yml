  - A5
  - A6
requirements:
- id: R1
  text: 'Exercise real PostgreSQL rejection, retryable outage, commit-then-lost-ack and cancellation for
    required ordinary/marker/finish appends. Assert PLN-R130: every checkpoint append failure fences continuation
    and candidate completion; a lost acknowledgement never causes marker replay, read-back-based continuation
    or a fresh Worker dispatch. Preserve existing classified failures and include iterator-exit/finish
    paths. Reuse existing compaction_postgres_test.go cases rather than duplicate them.'
- id: R2
  text: Add deterministic barriers around main admission, completed Worker tool group, compactor request, summary
    validation, append and continuation. Cover consumer break, parent cancel, absolute deadline, completion-write
    timeout and cleanup; all local work joins and no new effect is admitted after cancellation/return.
- id: R3
  text: Test success/decline/empty/tool-bearing/oversized/MAX_TOKENS response and raw Gateway stop/length/content_filter/missing/unknown
    finish reasons, known usage plus provider rejection, absent/inconsistent usage, exhausted main total budget,
    exhausted compactor per-call budget and maxCompactions. Pre-commit failures preserve raw context without
    a marker; post-commit no-progress detection preserves accepted state/charges and ends finitely.
- id: R4
  text: Deliberately omit/change an old ArtifactRef, subtask ID, revision, result status and completed-action
    description in summary. The deterministic index/current state still supplies valid evidence, forbids fabricated
    refs and prevents repeated Worker effects. Preserve distinct original task and continuation input.
- id: R5
  text: Verify real Runner-to-Gateway content after repeated generations with complete/incomplete tool pairs,
    same names/different IDs, empty IDs, equal timestamps, overlap and foreign scope. Uncertain dispatched
    effects remain uncertain and use existing receipts; no fabricated nonexecution or loss of useful text.
- id: R6
  text: Use realistic many-result fixtures and exact configured item/UTF-8 byte ceilings, one-over cases, multibyte
    data and escape-expanding JSON. Measure source scans, allocations/copies, serialized bytes and paged reads.
    Include aggregate history/index/peak bounds plus containing 2-MiB session JSON,256 fact digests,256-KiB
    initial input and4-MiB Gateway request; independent maxima need not succeed together.
- id: R7
  text: Check no whole-history materialization on every callback and no unbounded O(events squared) rescanning.
    Establish deterministic work bounds per group/checkpoint/page using injected counters, including the parent
    collection; timing samples alone are not acceptance.
- id: R8
  text: Verify secret canaries in summary, raw prompts, Output/NodeInfo/StateDelta/IsolationScope and provider
    errors cannot reach durable facts or public/closed telemetry projections. Partial events retain their current
    durable policy.
- id: R9
  text: Preserve completed recovery, unfinished-session failure, independent Worker terminal-summary continuation
    and current Scheduler/RunStore ownership. V451-002 process-local Gateway recovery and V455-001 Stage-owned
    resume state are existing infrastructure; do not restore removed recovery/decision/receipt tables
    or add stored transcripts and resumable Planner context.
failure_outcomes:
- operation: Compactor model call, checkpoint selection/append, history projection and continuation
  permanent: Empty/declined/tool-bearing/truncated/oversized/invalid output is a finite planner_compaction_failed
    outcome; exhausted cycle/retention limits use planner_compaction_limit_exceeded. Freeze stable codes/reasons
    in V420-001 and owning registries before implementation. Invalid session writes remain nonretryable
    planner_session_rejected. Never fall back to terminal summarizer or silently continue after an admitted
    failed checkpoint.
  retryable: Gateway/session outages retain their existing classified bounded recovery and PLN-R106 rules.
    Do not add semantic compaction retries, duplicate summary appends or model fallbacks. Total attempts/known
    usage and original deadline remain authoritative.
  ambiguous: 'Follow PLN-R130: a checkpoint append with lost acknowledgement fences this invocation and
    candidate completion; never replay the marker or use read-back to resume. Already dispatched Worker
    effects use their existing receipts independently.'
  cancelled: Cancellation takes precedence; the Planner owner closes the iterator and joins main/compactor/persistence/repair
    work before return and cleanup. It cannot promise rollback of a dispatched remote effect.
  timeout: The original Planner/Stage deadline and the existing Server Planner Gateway request timeout
    bound admission and transport. LLMGatewayConfig has no requestTimeout field; session writes and joined
    cleanup retain their current bounded owners.
cardinality:
- collection: Invocation-local raw history, prior summaries and validated Worker-result/reference index together
  expected: Several dozen groups and two or more checkpoints within one ordinary Planner invocation.
  maximum: 'Initial design envelope to prove/freeze in V420-001: 4096 complete source groups and 32 MiB aggregate
    retained UTF-8/serialized data; 64 MiB accounted peak including bounded projections and transient copies;
    summary 16 KiB, recent tail 1 MiB, 1..16 recent groups default 4, 1..16 compactions default 8.'
  bound: Count shared backing data once and actual copies separately. Bound each scan, serialization, append
    and history page. Enforce existing 4-MiB actual Gateway-request bytes and stricter policy context window;
    compaction does not reclaim raw ADK history automatically.
- collection: Authoritative plan, validated results and existing durable session state
  expected: Default 32 subtasks, one current subtask/active dispatch and exact refs from completed Workers.
  maximum: 'Existing independent ceilings: 1000 subtasks, objective 64 KiB, subtask objective 8 KiB/instructions
    32 KiB, Worker result text 64 KiB/payload 256 KiB/128 refs, session JSON 2 MiB and 256 recorded fact digests.'
  bound: Do not inject the full plan/result index into each prompt or assume all independent maxima fit. Preserve
    exact full authority in its existing owner and expose bounded current projections/pages; enclosing overflow
    produces a classified failure before further effects.
lifecycle:
- entity: One Planner invocation context generation, checkpoint and bounded in-memory history/result index
  delete: Planner owner releases these on success, failure, cancellation or timeout after joining all local
    work.
  cascade: All history, summaries, paging cursors and retained validated result views are invalidated with
    that session; completed StageResult and existing receipts/artifacts retain their existing owners.
  retention: RAM only for raw context, summary and history index. No PostgreSQL transcript/checkpoint table,
    cross-Stage context service or partial restart recovery. Completed-result recovery remains durable and
    model-free.
test_prerequisites:
- Commands are future implementation acceptance, not checks completed by this planning change. Record exact
  revision, Go/ADK versions, module graph/checksums, commands, executed case counts, skips and outcomes. Required
  cases cannot be skipped or match zero tests.
- Use disposable real PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set for persistence acceptance; an unreachable
  configured database fails. Canonicalize TMPDIR as Makefile does. Full package suites accompany focused regressions.
  make test-streamline does not cover Router, so run all internal/planner packages too.
- Use actual pinned ADK Runner/tool dispatch and controlled Gateway responses. tests/integration/streamline
  uses a fake WorkerInvoker and does not prove a real Server/Runtime process. Register new process cases in
  the release graph and provide their fixtures/prerequisites.
- Use testdata and test-only pseudo-Skills rather than reading live configs. Use injected clocks, synchronization
  barriers and work/byte/row counters, not wall-clock assertions. Live Gateway benchmarks are outside deterministic
  acceptance; keep configured models unchanged.
- No dependency on Python V418 or Worker compaction V417 is implied. Cross-language regression uses the currently
  supported Runtime lock. New shared grammar or wire changes, if actually needed, must update all implementations
  and shared fixtures in the owning task.
- Follow the current Linux/platform and disk-heavy test policies (V433-007 and AGENTS.md). Do not enable
  CONTRACTOR_TEST_HEAVY_IO implicitly or count declared optional skips as passing coverage. Record exact
  revision, executed cases and exclusions; this backlog review ran no feature acceptance suites.
