schema_version: '1.0'
id: V410-004
title: Import bounded scanner and selected Caido observations
milestone: project-sitemap-2026-10
epic: scan-tools
kind: feature
priority: P1
status: in_progress
depends_on:
- V410-002
- V410-003
languages:
- go
- python
- json
- yaml
- markdown
goal: Reuse existing ffuf/Katana reports and selected Caido observations as sitemap inputs through the same isolated
  collector/import path.
context:
  authority: 'User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence. User review on 2026-10-27 supersedes
    generic collection-completeness/status requirements: automatic sitemap updates are best effort and must remain
    isolated from HTTP/scanner outcomes and Run contracts. The 2026-10-27 metadata-policy decision removes sitemap
    secret filtering and matching-secret transport; ordinary owner-selected inputs authorize complete selected context,
    and the 2026-10-28 shared-map decision removes source-mode classification and consumer filtering. All permitted
    readers use the same Project metadata; snapshotInputs controls only needed original-file retention during snapshots.'
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 3-5 and 7-11: source adapters, metadata normalization, exact provenance, idempotent imports
    and factual limitations declared by the source.'
  specification:
  - docs/spec/artifacts/project-sitemap.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/tools/scanners.md
  - docs/spec/tools/http-caido.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or V61/V62/V64 work.
  code:
  - runtime/src/contractor_runtime/toolsets/scan/ffuf.py
  - runtime/src/contractor_runtime/toolsets/scan/katana.py
  - runtime/src/contractor_runtime/toolsets/caido/tools.py
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/tests/test_scan_ffuf.py
  - runtime/tests/test_scan_katana.py
  - runtime/tests/test_caido_read_tools.py
  - internal/projectsitemap
  reuse: Existing ffuf accepted matches, Katana bounded same-origin observed GET output and V375-002 Caido selection/paging
    are shipped; this task adds bounded map adapters, not replacement scanner execution.
scope:
  in:
  - Implement imports for the existing versioned normalized ffuf/Katana reports. Exact authorized refs are mandatory;
    scanner execution/report publication remains independent.
  - Connect already published scanner report refs and selected Caido results through optional composition-owned events.
    Automatic import failure is technical diagnostics only; explicit import_sitemap_source calls retain their own
    errors.
  - Preserve report provenance/timestamps, response availability, wildcard/soft-404 caveats, truncation and discarded-match
    gaps; validate every accepted record.
  - Bound each import step with the existing exact input/cursor and shared keyed mutation receipts. Add no autonomous
    import job, checkpoint journal or generic sync framework without a real caller.
  - Normalize imported URLs, examples and metadata under the shared syntax/byte and content-kind contract before
    map identity or publication; do not add sitemap secret matching or matching-secret transport.
  out:
  - Executing scanners merely to import data, free-form stdout parsing, new crawler modes or a generic plugin framework.
  - Implicit full shared Caido history import (V410-008), browser capture and new scanner capability promises.
  - A new dirsearch adapter without a concrete caller and pinned report contract; it is not a prerequisite for this
    first slice. Generic collection-completeness states or required automatic import checks are excluded.
requirements:
- id: R1
  text: An import reads only an exact authorized artifact under an explicit format/version and source/deployment binding;
    unknown formats fail permanently and never execute embedded instructions.
- id: R2
  text: Keep existing ffuf/Katana limits and observed-response restrictions. Preserve concrete limitations already
    declared by the report (such as discarded matches); do not invent a generic source-complete/incomplete state.
- id: R3
  text: Process a bounded exact report step and reuse the existing cursor/receipt mechanisms for continuation/replay.
    The same exact ref and keyed batch cannot append again after result eviction. Add no independent durable import
    checkpoint mechanism.
- id: R4
  text: Selected Caido request/detail results are not durable exchange refs; their IDs remain provenance unless actual
    authorized retained evidence exists. No entire-instance selection is inferred from tool availability.
- id: R5
  text: Use shared correlation only when trusted/available; otherwise merge operation groups without claiming physical
    request identity or exact traffic counts.
- id: R6
  text: Imports use the same metadata normalization as HTTP. Valid paths, parameter names, finite structural values,
    notes and tags retain credential-like words, opaque values and known-credential matches. Userinfo, fragments,
    nonstructural query values, raw headers and bodies remain outside the map model. Imports preserve trusted source kind,
    producer, deployment and context without manufacturing observations. All permitted readers see the same map; exact
    source-file authority and general evidence/telemetry redaction retain their existing owners.
failure_outcomes:
- operation: Read and parse exact structured report
  permanent: Unknown format/version, inaccessible ref, malformed envelope or incompatible records return permanent
    classified outcomes; accepted valid records from a documented partial format carry exact gaps.
  retryable: Only Artifact/provider transport failures retry within owning read/import deadline.
  ambiguous: Resume the same exact report identity and bounded continuation position; do not choose current/latest source or rerun the scanner.
  cancelled: Join off-thread parser work and preserve accepted keyed batches before allocation release.
  timeout: A bounded import-step deadline limits parsing and publication; incomplete continuation remains explicit.
- operation: Selected Caido projection and map publication
  permanent: Provider invalidity, absent raw exchange or collection denial never fabricate HTTP success; no raw HTTP
    exchange is retained as sitemap metadata. Generic Artifact admission rejection or history filled by protected revisions
    remains an explicit nonautomatic-retry outcome; there is no custom cumulative Run publication quota.
  retryable: Existing Caido read retries and sitemap write retries keep separate budgets; bounded ArtifactStore eviction
    backpressure retries publication only and never a target mutation for collection.
  ambiguous: Replay the same source/correlation identity and accepted receipt; no exact request-count claim when correlation
    is unavailable.
  cancelled: Join provider decode and collector work before Caido session cleanup.
  timeout: Provider read and map flush deadlines remain independent; one does not extend the other.
cardinality:
- collection: Source report and selected Caido result pages
  expected: Small normalized reports and selected tool results
  maximum: Existing scanner/provider input bounds plus proposal section 10 batch/map/member quotas
  bound: Bound input bytes before parse, process one page/batch per step with bounded continuation instead of rescanning the full report.
- collection: Rejected/omitted records and provenance
  expected: A few source-specific gaps
  maximum: Shared source registry/provenance/gap representation limits
  bound: Use aggregate counts and bounded examples; do not append one durable gap per invalid input row.
lifecycle:
- entity: Import source, continuation position and selected-result attribution
  delete: Allocation cleanup removes transient parsers; Project purge removes its durable map source metadata.
  cascade: Deleting source Run bytes leaves safe map metadata and explicit unavailable evidence, not dangling claimed
    readable exchanges.
  retention: Exact report inputs selected for proof acquire ordinary holds before acceptance, atomically against eviction.
    Metadata refs/cursors/receipts alone do not pin history; the collector never performs eviction and metadata-only
    import does not preserve all raw traffic.
acceptance_criteria:
- id: A1
  given: Exact ffuf and Katana reports with partial/malformed/oversized cases
  when: The production importer processes them
  then: Valid records retain factual source limitations; explicit malformed imports return classified errors. No scanner
    process is launched, and automatic map publication cannot replace the scanner report/result.
- id: A2
  given: Many records spanning batches, a lost acknowledgement and eviction of an accepted revision
  when: The import resumes or repeats with the same source
  then: Each continuation step is bounded, accepted observations are not duplicated and receipt replay does not append
    another revision or republish evicted history; unavailable exact bytes never fall back to latest.
- id: A3
  given: Selected Caido results plus unrelated traffic in the same provider
  when: A selected tool inspects/generates requests
  then: Only selected data contributes and provider IDs never become invented durable evidence refs.
- id: A4
  given: HTTP and Caido observations with and without correlation, credential-like metadata and excluded URL/header/body fields
  when: They enter the shared map
  then: Valid paths, parameter names and configured structural values remain intact without secret filtering; only
    fields in the metadata model persist. Available trusted correlations preserve attribution and missing correlation
    produces no false traffic count. Observation frames and private collection requests carry no matching-secret list.
- id: A5
  given: Project/operation/file permissions, source deletion and cancellation during parsing/publication
  when: Imports run through actual Server/Runtime/PostgreSQL
  then: Current grants and unavailable files are truthful, metadata remains visible to every permitted reader, source
    provenance survives and all local work joins before release. Missing source bytes do not manufacture live proof.
deliverables:
- path: runtime/tests/testdata
  description: Sanitized exact ffuf/Katana and selected Caido fixtures at normal and maximum sizes; no live-config
    reads or speculative format support.
- path: tests/e2e
  description: Deterministic import cases in the existing sitemap tools gate, without installed scanner prerequisites.
tests:
- command: uv run --project runtime pytest runtime/tests/test_scan_ffuf.py runtime/tests/test_scan_katana.py runtime/tests/test_scan_katana_lifecycle.py
    runtime/tests/test_caido_*.py runtime/tests/test_sitemap_*.py
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-tools-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-postgres
  covers:
  - A2
  - A4
  - A5
- command: make test-http-caido-e2e
  covers:
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Use controlled report/provider fixtures, real Artifact storage and production process boundaries. Installed-engine
  test-scan-e2e is unnecessary for import-only changes; if implementation also changes scanner execution, its existing
  execution gate becomes required.
execution:
  branch: codex/v410-sitemap
  claimed_on: '2026-10-27'
  note: Resumed after the reviewed V410-003 implementation and its main merge. V410-005 through V410-007 remain pending until their own implementation starts.
implementation_decisions:
- date: 2026-10-26
  decision: Preserve the user-requested isolation between tools and sitemap. Scanner execution and Caido tools retain
    their own results and do not depend on sitemap persistence. Allocation composition wires optional generic observation
    events to the separate collector; exact report imports remain explicit sitemap work.
- date: '2026-10-27'
  decision: Reuse the V410-003 subscriber/publisher and the existing import_sitemap_source surface. Producers only
    emit minimal events or exact report refs. Automatic failure never changes scanner/Caido results or Run state;
    explicit imports fail as explicit operations. Keep factual report truncation metadata, not a generic collection-status
    subsystem. Defer new dirsearch format work until a concrete caller/contract exists.
- date: '2026-10-27'
  decision: Existing normalized ffuf and Katana reports each retain at most 100 results and 128 KiB. Validate those owning bounds and import one exact report as one bounded batch through existing receipts. No continuation cursor or durable import checkpoint is needed for these concrete callers; reopen only when a selected versioned format exceeds the shared batch bound.
