test_prerequisites:
- Use controlled report/provider fixtures, real Artifact storage and production process boundaries. Installed-engine
  test-scan-e2e is unnecessary for import-only changes; if implementation also changes scanner execution, its existing
  execution gate becomes required.
execution:
  branch: codex/v410-004-sitemap-imports
  claimed_on: '2026-10-29'
  note: >-
    Resumed here after the user's request to continue sitemap delivery. The earlier V410 lane's last turn
    is completed, its checkout is clean and its last commit only claimed this task; no implementation
    is being taken from an active worker. Start from main including V410-024. V410-005 through V410-009
    remain pending until their declared prerequisites and individual work are complete.
implementation_decisions:
- date: 2026-10-26
  decision: Preserve the user-requested isolation between tools and sitemap. Scanner execution and Caido tools retain
    their own results and do not depend on sitemap persistence. Allocation composition wires optional generic observation
    events to the separate collector; exact report imports remain explicit sitemap work.
- date: '2026-10-27'
  decision: Reuse the V410-003 subscriber/publisher and the existing import_sitemap_source surface. Producers only
    emit minimal events or exact report refs. Automatic failure never changes scanner/Caido results or Run state;
    explicit imports fail as explicit operations. Keep factual report truncation metadata, not a generic collection-status
    subsystem. Defer new dirsearch format work until a concrete caller/contract exists.
- date: '2026-10-27'
  decision: Existing normalized ffuf and Katana reports each retain at most 100 results and 128 KiB. Validate those owning bounds and import one exact report as one bounded batch through existing receipts. No continuation cursor or durable import checkpoint is needed for these concrete callers; reopen only when a selected versioned format exceeds the shared batch bound.
- date: '2026-10-29'
  decision: >-
    The 128 KiB limit applies to retained result arrays; the existing schemaVersion 1 tool report envelope
    is bounded by 512 KiB. Read exact current-Run report metadata and bytes through ArtifactStore,
    strictly validate the existing ffuf/Katana formats in Go, and reuse the common Project receipt and
    publication transaction. Receipt identity binds the exact ref, format and authenticated Run before
    reading source bytes. Missing HTTP timestamps use immutable report revision publication time,
    explicitly described as report time rather than precise exchange time. Stable kind/deployment
    sources aggregate behavior; existing bounded member Evidence stores exact report file locators.
- date: '2026-10-29'
  decision: >-
    Generic report-publication notifications originate after the tool Worker writes its ordinary report;
    scanner tools do not acquire another report writer. Allocation composition connects optional bounded
    subscribers. Selected Caido metadata is emitted before model-output redaction and without extra
    provider/target requests; native sitemap nodes lacking methods do not manufacture GET observations.
- date: '2026-10-29'
  decision: >-
    Keep one bounded mixed collector queue and one publisher for HTTP, selected Caido rows and exact
    report notifications. A definite invalid/unavailable report drops only its own item; allocation,
    storage and retry-budget failures retain the existing whole-collector stop semantics. Closing
    never chains a new publisher after cancellation; cleanup joins the active work before returning.
- date: '2026-10-29'
  decision: >-
    The new evidence writer exposed a snapshot mismatch: an explicitly selected original consumer
    input can contain the exact producer report under a different Run/ref. Match only configured
    original-input descriptors by digest/media/size, rebind and deduplicate evidence, then use the
    existing ordinary frozen forks. Foreign provenance alone never authorizes a read. Real-store
    verification deletes both producer Runs before snapshot creation and preserves retained bytes
    after consumer working-history eviction. Empty-result reports retain source gaps without inventing
    a member evidence locator.
- date: '2026-10-29'
  decision: >-
    Import tool arguments are format and artifact_ref so ordinary scalar and Artifact bindings in
    model-free Workers can invoke it. No nested-argument engine is added. The existing common
    256-KiB encoded command admission bound also applies after report projection; a pathological
    report exceeding it fails permanently instead of adding continuation or widening shared limits.
