schema_version: '1.0'
id: V410-004
title: Import bounded scanner and selected Caido observations
milestone: project-sitemap-2026-10
epic: scan-tools
kind: feature
priority: P1
status: pending
depends_on:
- V410-002
languages:
- go
- python
- json
- yaml
- markdown
goal: Enrich the shared map from existing exact scanner reports and explicitly selected Caido results without running
  another crawler or assuming complete discovery.
context:
  authority: User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence.
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 3-5 and 7-11: source adapters, safe projection, exact provenance, idempotent imports
    and incomplete source outcomes.'
  specification:
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/tools/scanners.md
  - docs/spec/tools/http-caido.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or V61/V62/V64
    work.
  code:
  - runtime/src/contractor_runtime/toolsets/scan/ffuf.py
  - runtime/src/contractor_runtime/toolsets/scan/katana.py
  - runtime/src/contractor_runtime/toolsets/caido/tools.py
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/tests/test_scan_ffuf.py
  - runtime/tests/test_scan_katana.py
  - runtime/tests/test_caido_read_tools.py
  - internal/projectsitemap
  reuse: Existing ffuf accepted matches, Katana bounded same-origin observed GET output and V375-002 Caido selection/paging
    are shipped; this task adds safe map adapters, not replacement scanner execution.
scope:
  in:
  - Implement versioned imports for existing normalized ffuf/Katana report artifacts and a documented structured
    dirsearch export; exact artifact refs and accessible input bytes are mandatory.
  - Automatically project requests inspected/generated by selected Caido tools through the same collector when collection
    is selected.
  - Preserve report provenance/timestamps, response availability, wildcard/soft-404 caveats, truncation and discarded-match
    gaps; validate every accepted record.
  - Checkpoint bounded import work and deduplicate repeated imports/correlated HTTP-Caido observations without claiming
    exact request counts when correlation is absent.
  - Use the safe projection/content-kind boundary for imported URLs, examples and metadata before map identity or
    publication.
  out:
  - Executing scanners merely to import data, free-form stdout parsing, new crawler modes or a generic plugin framework.
  - Implicit full shared Caido history import (V410-008), browser capture and new scanner capability promises.
requirements:
- id: R1
  text: An import reads only an exact authorized artifact under an explicit format/version and source/deployment
    binding; unknown formats fail permanently and never execute embedded instructions.
- id: R2
  text: Keep current ffuf match limits and Katana GET-only/observed-response restrictions; partial reports can contribute
    valid records only with explicit source gaps and deterministic rejected/omitted counts.
- id: R3
  text: One import step processes at most one bounded page/batch before checkpointing. Repeated source imports use
    immutable report identity and source timestamps; receipt replay after history eviction confirms the old commit
    without republishing or multiplying summaries. Exact evicted reads never substitute latest.
- id: R4
  text: Selected Caido request/detail results are not durable exchange refs; their IDs remain provenance unless
    actual authorized retained evidence exists. No entire-instance selection is inferred from tool availability.
- id: R5
  text: Use shared correlation only when trusted/available; otherwise merge operation groups without claiming physical
    request identity or exact traffic counts.
- id: R6
  text: Imported secret-bearing path/query/header/body/structural values pass the same safe projection as HTTP.
    Source-mode provenance cannot be self-declassified by an import payload.
failure_outcomes:
- operation: Read and parse exact structured report
  permanent: Unknown format/version, inaccessible ref, malformed envelope or incompatible records return permanent
    classified outcomes; accepted valid records from a documented partial format carry exact gaps.
  retryable: Only Artifact/provider transport failures retry within owning read/import deadline.
  ambiguous: Resume the same report identity and checkpoint; do not choose current/latest source or rerun the scanner.
  cancelled: Join off-thread parser work and preserve committed checkpoints before allocation release.
  timeout: A bounded import-step deadline limits parsing and publication; incomplete continuation remains explicit.
- operation: Selected Caido projection and map publication
  permanent: Provider invalidity, absent raw exchange or collection denial never fabricate HTTP success; no raw
    private data is retained. Generic Artifact admission rejection or history filled by protected revisions
    remains an explicit nonautomatic-retry outcome; there is no custom cumulative Run publication quota.
  retryable: Existing Caido read retries and sitemap write retries keep separate budgets; bounded ArtifactStore
    eviction backpressure retries publication only and never a target mutation for collection.
  ambiguous: Replay the same source/correlation identity and accepted receipt; no exact request-count claim when
    correlation is unavailable.
  cancelled: Join provider decode and collector work before Caido session cleanup.
  timeout: Provider read and map flush deadlines remain independent; one does not extend the other.
cardinality:
- collection: Source report and selected Caido result pages
  expected: Small normalized reports and selected tool results
  maximum: Existing scanner/provider input bounds plus proposal section 10 batch/map/member quotas
  bound: Bound input bytes before parse, process one page/batch per step and checkpoint instead of rescanning the
    full report.
- collection: Rejected/omitted records and provenance
  expected: A few source-specific gaps
  maximum: Shared source registry/provenance/gap representation limits
  bound: Use aggregate counts and bounded examples; do not append one durable gap per invalid input row.
lifecycle:
- entity: Import source, checkpoint and selected-result attribution
  delete: Allocation cleanup removes transient parsers; Project purge removes its durable map source metadata.
  cascade: Deleting source Run bytes leaves safe map metadata and explicit unavailable evidence, not dangling claimed
    readable exchanges.
  retention: Exact report inputs selected for proof acquire ordinary holds before acceptance, atomically against
    eviction. Metadata refs/checkpoints/receipts alone do not pin history; the collector never performs eviction
    and metadata-only import does not preserve all raw traffic.
acceptance_criteria:
- id: A1
  given: Exact ffuf, Katana and documented dirsearch reports with partial/malformed/oversized cases
  when: The production importer processes them
  then: Valid records retain source limitations, malformed input has deterministic errors/counts and no scanner
    process is launched.
- id: A2
  given: Many records spanning batches, a lost acknowledgement and eviction of an accepted revision
  when: The import resumes or repeats with the same source
  then: Checkpointed work is bounded, accepted observations are not duplicated and receipt replay does not append
    another revision or republish evicted history; unavailable exact bytes never fall back to latest.
- id: A3
  given: Selected Caido results plus unrelated traffic in the same provider
  when: A selected tool inspects/generates requests
  then: Only selected data contributes and provider IDs never become invented durable evidence refs.
- id: A4
  given: HTTP and Caido observations with and without correlation and canaries in every location
  when: They enter the shared map
  then: Safe values only are retained, available trusted correlations preserve attribution and missing correlation
    produces no false traffic count.
- id: A5
  given: Source-mode restrictions, source deletion and cancellation during parsing/publication
  when: Imports run through actual Server/Runtime/PostgreSQL
  then: Authorization and unavailable evidence are truthful, source provenance survives and all local work joins
    before release.
deliverables:
- path: runtime/tests/testdata
  description: Sanitized exact ffuf/Katana/dirsearch/Caido fixtures at normal, partial and maximum sizes; never
    read live configs.
- path: tests/e2e
  description: Deterministic import cases in the existing sitemap tools gate, without installed scanner prerequisites.
tests:
- command: uv run --project runtime pytest runtime/tests/test_scan_ffuf.py runtime/tests/test_scan_katana.py runtime/tests/test_scan_katana_lifecycle.py
    runtime/tests/test_caido_*.py runtime/tests/test_sitemap_*.py
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-tools-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-postgres
  covers:
  - A2
  - A4
  - A5
- command: make test-http-caido-e2e
  covers:
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Use controlled report/provider fixtures, real Artifact storage and production process boundaries. Installed-engine
  test-scan-e2e is unnecessary for import-only changes; if implementation also changes scanner execution, its existing
  execution gate becomes required.
