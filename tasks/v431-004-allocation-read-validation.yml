schema_version: '1.0'
id: V431-004
title: Share allocation invariants between stored reads and writes
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: Every allocation returned by RunStore satisfies the same immutable-field invariants required on
  write.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: internal/runstore/allocation_store.go:239 strictly decodes refs but omits the full StageAllocation
    validation; a stored invalid AgentTemplate digest is returned successfully.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/runs.md#RUN-R106
  - docs/spec/platform/persistence.md#PER-R13
scope:
  in:
  - Assemble stored allocation fields once, then reuse StageAllocation.Validate instead of repeating its
    domain checks.
  - Keep strict JSON decoding and explicit null checks; classify malformed stored data as a stored-data
    error rather than a user request.
  - Cover invalid digest and sibling identity, runtime, namespace and completion-contract invariants on
    PostgreSQL.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: A valid allocation round-trips unchanged through single and batch reads.
- id: A2
  text: Reads reject every corrupted immutable-field case that write validation rejects; strict JSON cases
    continue to fail.
- id: A3
  text: The invalid-digest regression fails on the unfixed implementation.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/controlplane/... ./internal/scheduler/...
  covers: &id001
  - A1
  - A2
  - A3
- command: make lint
  covers: *id001
introduced_by: V372-028
