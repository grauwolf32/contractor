schema_version: '1.0'
milestone: hub-audit-defects-2026-10
epic: planner-worker
depends_on: []
languages:
- go
id: V439-002
title: Derive Planner fact capacity from the pinned subtask limit
kind: defect
introduced_by: V384-001
priority: P2
status: in_progress
goal: A configured plan can execute its selected number of short subtasks without exhausting an unrelated 256-fact
  ceiling.
context:
  authority: 'User request 2026-11-03: implement the reviewed Planner simplifications and optimizations first,
    then fix the four reproduced defects. Preserve the existing Planner/domain/Server-operation boundaries.'
  finding: internal/planner/session/service.go:342 rejects the 86th sequential dispatch of a 100-subtask plan
    after add/current, selection and completion/current facts consume 256 entries.
  siblings: Streamline and Router share one engine. Passthrough, scan, durable reads, Gateway main/compactor
    and telemetry consumers are checked where applicable; no Runtime or UI behavior change is introduced.
  specification:
  - docs/spec/execution/planners.md
  - docs/spec/platform/limits.md
  boundary: Planner owns orchestration; Session owns durable receipts and validation; StateView owns revision-bound
    projections. Keep existing events and stores rather than adding batching protocols, tables or receipt owners.
    Reopen atomic event batching only if measured database cost justifies a separate change.
scope:
  in:
  - Derive the bounded receipt capacity from the pinned subtask budget and the existing event sequence; keep
    the 2 MiB state ceiling authoritative.
  - Apply the same bound during writes and durable reads, preserve receipt replay and permanent overflow rejection.
  - Add a real PostgreSQL sequential dispatch regression and boundary coverage for the maximum configured plan.
  out:
  - Relocating scanplan, adding Server operations, changing Worker/model selection, changing public schemas
    or replacing the persistence mechanism.
acceptance_criteria:
- id: A1
  text: A real PostgreSQL plan completes 100 sequential add/dispatch/complete cycles and its finish fact; equal-key
    replays do not append.
- id: A2
  text: The derived maximum accounts for each legal fact and cannot grow without bound; over-capacity writes
    and reads are rejected.
- id: A3
  text: Existing completion, invalid-write and plan-limit tests pass.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/planner/...
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
