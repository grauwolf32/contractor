scope:
  in:
  - Encode finding verdict-specific required and forbidden fields.
  - Allow empty-value label selectors in Run and Project Run queries.
  - Describe byte-based login password policy without changing accepted credentials.
  - Declare conditional browser Origin and CSRF headers for all four Git mutations.
  - Remove unsupported RunStatus history array cap and document implicit Git create while preserving update
    CAS.
  out:
  - Change ordinary Worker finalization, LLM budgets or eval/toolset implementation.
  - Change published execution policy, credential authority, owner checks or CAS semantics beyond the
    named contract corrections.
  - Deploy services or run live models.
acceptance_criteria:
- id: A1
  text: Finding verdict requests validate exactly for the supported conditional field combinations.
- id: A2
  text: General and Project Run endpoints accept empty-label filters and schema validation agrees.
- id: A3
  text: Existing valid multibyte passwords authenticate without schema or client character-count rejection.
- id: A4
  text: Git operations declare browser mutation requirements and current create/CAS semantics; session
    protections stay enforced.
- id: A5
  text: A valid automatic retry configuration and more than 1024 returned attempts remain schema-valid
    without truncation.
