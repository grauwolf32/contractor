  - Allow empty-value label selectors in Run and Project Run queries.
  - Describe byte-based login password policy without changing accepted credentials.
  - Declare conditional browser Origin and CSRF headers for all four Git mutations.
  - Remove unsupported RunStatus history array cap and document implicit Git create while preserving update
    CAS.
