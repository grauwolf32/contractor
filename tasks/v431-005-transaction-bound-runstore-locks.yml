schema_version: '1.0'
id: V431-005
title: Keep RunStore locking operations on transaction-bound stores
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: chore
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: The type of a RunStore locking operation requires a caller-owned transaction and the related types
  remain easy to navigate.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: LockRunQueueAdmission, LockRunSkillInitialization and GetAuditInputMaterialization take transaction-scoped
    locks but are methods of pool-capable PostgresStore. Their production callers already bind transactions.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/runs.md#RUN-R106
scope:
  in:
  - Move the three locking methods to PostgresTxStore and rename the materialization read to make its
    lock explicit.
  - Update all production callers and test doubles; avoid runtime capability checks, extra repositories
    or a generic transaction framework.
  - Keep related Run, Stage, Planner and allocation types alongside their owning operations instead of
    one mixed types.go.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: Pool-backed PostgresStore no longer exposes transaction-scoped locking operations; all real callers
    use PostgresTxStore.
- id: A2
  text: The refactor changes no intended lifecycle, API, SQL ownership or locking behavior; relevant suites
    and architecture checks pass.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/runservice/... ./internal/app/... ./internal/scheduler/... ./internal/archtest/...
  covers: &id001
  - A1
  - A2
- command: make lint
  covers: *id001
introduced_by: V370-018
