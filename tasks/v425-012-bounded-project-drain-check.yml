title: Bound the Project deletion drain check by active work, not finished Run history
milestone: hub-audit-defects-2026-10
epic: projects-artifacts
kind: defect
priority: P3
status: pending
depends_on: []
languages:
- go
- sql
goal: The Project deletion drain check reads a number of rows bounded by the Project's active Runs, independent
  of finished Run history and other owners.
context:
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  severity: low
  finding: waitForDrainSQL in internal/projectlifecycle/controller_sql.go reads more index entries as
    finished Run history grows (V414-024 measured 214 rows, then 356 with more history) and scans every
    owner's active Runs.
  siblings: Other drain and hold checks that V407-025 reduced; the held-credential check measured by V414-024.
scope:
  in:
  - Rewrite the statement or index so its reads are bounded by active Runs of the Project.
  - An explaintest Analysis.Reads budget test at realistic finished-history size (thousands of finished
    Runs, several owners).
  out:
  - Changing deletion semantics.
acceptance_criteria:
- id: A1
  text: Reads stay within the budget as finished history grows by an order of magnitude.
- id: A2
  text: The budget test fails on the unfixed statement.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/projectlifecycle/...
  covers:
