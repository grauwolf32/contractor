schema_version: '1.0'
id: V455-005
title: Preserve HTTP failure reasons and decide how to bound repeated failed calls
milestone: autonomous-http-pentest-2026-10
epic: http-tools
kind: defect
introduced_by: V422-002
priority: P1
status: pending
depends_on: []
languages: [python, markdown]
goal: >-
  The Worker can distinguish an exhausted HTTP allowance from a temporary
  failure, retain an actionable content-free diagnosis, and finish useful work
  without consuming its entire tool budget on the same rejected operation.
context:
  authority: >-
    User request 2026-11-08: document the observed problem; think through whether
    artificial delays should be introduced. This is documentation and decision
    preparation, not approval of a delay policy, implementation or another demo run.
  specification:
    - docs/spec/tools/http-caido.md#HTP-R120
    - docs/spec/tools/http-caido.md#HTP-R122
    - docs/spec/tools/http-caido.md#HTP-R145
    - docs/spec/platform/errors.md#ERR-R13
    - docs/spec/platform/observability.md#OBS-R32
  severity: high
  source_revision: 9d8bc588ca3c1f8829756d329f7cc5f8b1b09e04
  evidence: tasks/evidence/v455-005-http-error-pacing.json
  incident: >-
    Invoice Lab Run run_bb89459d503a5096536a7b4b173e94e1, Audit
    audit_d220eabdf35b48e9fbb9cceb18f21feb, 2026-11-07 22:38:03-22:44:59
    Europe/Moscow. Worker made 199 model calls and 200 tool calls: 118
    http_request (39 succeeded, 79 failed), 75 http_history, two
    http_credential_read, one http_credentials, three read_text_artifact and
    one read_audit_task. No finding or check result was published. Repeated
    failed requests and history reads ended in worker_budget_exhausted(tool_calls).
    All 79 failed HTTP tool spans contain only ControlledHTTPError, with
    durations 1-3 ms; the retained error is tool_http_request_failed.
    All 405 spans arrived, flush succeeded, drop counters are zero and Runtime
    finalized normally. This incident is not missing trace delivery or a crash.
  finding: >-
    adapters/http_transport.py:319-329 raises HTTPTransportError(http_limit_exceeded)
    before sending when the allocation's total request allowance is exhausted.
    toolsets/http/controlled.py:150-155 preserves only http_scope_denied and
    maps every other transport code to http_request_failed.
    toolsets/http/errors.py:5-28 marks http_request_failed retryable=true;
    worker/instrumentation.py:913-927 passes that flag to the model.
    These paths are under runtime/src/contractor_runtime/ in source_revision.
    The permanent limit reason is therefore lost and represented as retryable.
    controlled.py:156-185 only records exchanges with physical attempts, so
    admission rejection cannot be recovered by repeatedly reading HTTP history.
  evidence_limits: >-
    The engagement allowance is 40 physical requests, 2 requests/second and
    one concurrent request. Exhaustion is a plausible explanation of the 79
    failures, not a recovered fact: their original transport code and exact
    physical request count were not retained. 39 successful tool calls do not
    establish 39 physical sends; redirects and permitted retries can add sends.
    Retained diagnostic retryable=false is a different projection from the
    model-facing retryable=true established by code. Sensitive HTTP content
    suppression prevents replaying the exact model-visible responses here.
    Millisecond tool duration does not mean the whole model/tool loop ran at
    that rate; model calls between tools also consumed time and tokens.
  provenance: >-
    git blame identifies 41f6fb79e184f820e42f67ba845a2691c1863055
    (V422-002 engagement simplification) as introducing allocation-local
    http_limit_exceeded and the transport-code mapping at controlled.py:150-155.
    The generic retryability registry predates it; generic transport failure
    being retryable is not by itself evidence of that earlier task's defect.
  siblings: >-
    Review raised HTTPTransportError and non-completed transport outcomes,
    HTTP tool error normalization, model-facing safe responses, retained Worker
    diagnostics and content-free telemetry. Inspect shared transport consumers
    such as scanner/proxy paths for equivalent loss of limit reasons; preserve
    their existing owners and explicitly record applicability. Distinguish
    scope denial, request allowance, rate pacing, timeout, transient failure
    and an ambiguous already-sent request.
  boundary: >-
    Allocation transport owns physical-send accounting and existing rate pacing.
    HTTP tool adaptation owns safe error classification; Worker owns execution
    budgets and progress/completion. Telemetry records safe bounded reasons,
    never credentials, URLs or bodies. A model retry hint is not permission to
    replay an unsafe or ambiguously completed request.
  decision_needed: >-
    Decide whether to add any artificial delay and where it belongs. Option A:
    preserve permanent classification and useful completion guidance first,
    with no new sleep; this is the smallest agent-recommended baseline.
    Option B: bounded backoff only for classified temporary failures, respecting
    existing transport retries, Retry-After where applicable, attempt limits,
    cancellation and the original deadline; evaluate only if measurements show
    benefit. Option C: delay every failed tool call or all tool calls; this may
    reduce call rate but also postpones completion, does not restore a total
    request allowance and need not reduce model calls or token usage. It is not
    recommended without evidence. Separately decide whether repeated permanent
    rejection needs deterministic prevention or a completion path rather than
    relying on the model to honor retryable=false; do not silently introduce a
    global repeated-error threshold. No option has been approved by the user.
scope:
  in:
    - Reproduce permanent HTTP limit rejection through the real transport and instrumented tool boundary.
    - Preserve safe classified reasons and retryability through model responses and retained diagnostics.
    - Evaluate and record the delay/completion decision before implementing a new policy.
    - Test the chosen behavior, sibling consumers and secret suppression on the real execution path.
  out:
    - Blanket sleeps, new configurable retry policies or thresholds before the open decision is resolved.
    - Raising budgets, changing models, resetting the target or automatic replay of unsafe requests.
    - Relaxing HTTP content suppression or changing OTLP delivery scheduling.
acceptance_criteria:
  - id: A1
    text: >-
      Given a real controlled transport with an exhausted total allowance, the
      instrumented tool returns a stable non-retryable safe limit reason and
      sends no additional physical request. Model response and retained
      diagnostics agree on classification; telemetry permits identifying the
      reason without exposing sensitive content.
  - id: A2
    text: >-
      A decision record compares no added delay, temporary-failure backoff and
      blanket delay, distinguishing rate limits from total allowance. Record
      the selected completion/loop policy and its owner before implementation;
      a proposal is not a user decision. No requirement assumes delays help.
  - id: A3
    text: >-
      A deterministic real-path regression fails on the original mapping and
      exercises permanent rejection, temporary failure, ambiguous send and
      cancellation. The chosen policy preserves deadlines and send authority,
      leaves already available evidence usable, and reports incomplete coverage
      honestly. Any delay uses injected time; no fragile wall-clock assertions.
  - id: A4
    text: >-
      Review sibling consumers and reconcile applicable code registries,
      documentation and shared contracts. Validate with a bounded repeated
      comparison: model/tool calls, physical sends, tokens, elapsed time,
      repeated errors and useful completion. A slower run alone is not success;
      one paid model run is not evidence of improved behavior.
tests:
  - command: >-
      cd runtime && uv run pytest -W error tests/test_http_engine.py
      tests/test_http_toolset.py tests/test_http_retries.py
      tests/test_instrumentation.py tests/test_telemetry_content.py
    covers: [A1, A3, A4]
  - command: make test-runtime
    covers: [A1, A3, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]
verification_notes: >-
  Pending design/fix task. Existing test modules above must be extended with
  the real-path regression; merely running their current tests does not prove
  acceptance. The policy comparison and decision in A2/A4 require separately
  recorded evidence. Only documentation is delivered by this task-creation
  commit; no production behavior, deployment or delay policy has changed.
