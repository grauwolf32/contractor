schema_version: "1.0"
id: V414-014
title: "Exit a standby Server cleanly when shutdown races its readiness listener"
milestone: review-v407-v409-followups-2026-10
epic: execution-core
kind: defect
introduced_by: V107-001
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: >-
  A standby Server that is shut down while waiting for the lease always returns its
  context's cancellation, so the process exits without an error; only a readiness
  listener that stops on its own while the context is live is a process error.
context:
  review: >-
    tasks/done/v407-017-startup-lease-tolerance.yml, verification.decisions ("Out of
    scope, found while testing: a standby that is shut down can race its own readiness
    listener in awaitControlPlaneLease ... Observed in 2 of 20 holder-lookup runs ...
    needs its own defect task").
  specification:
    - docs/spec/platform/persistence.md#PER-R3
    - docs/spec/platform/persistence.md#PER-R27
  severity: low
  finding: >-
    internal/app/single_active.go:252-271 derives standbyCtx from the process context,
    so cancelling ctx also stops serveHandler, which shuts the readiness listener down
    and sends nil on done (app.go:274-310). The standby loop's select
    (single_active.go:262-271) then has two ready cases, <-ctx.Done() and serveErr :=
    <-done; Go chooses between ready cases at random, and the done case turns nil into
    "standby readiness listener stopped: listener exited before lease acquisition".
    That error is not context.Canceled, so runCLI (app.go:149-155) returns it and the
    process exits with an error on an ordinary shutdown. Both cases are ready whenever the
    loop reaches the select after cancellation, for example when ctx is cancelled
    during the holder lookup (single_active.go:248) or the acquisition probe and the
    readiness server finishes its shutdown first. V407-017 observed it in 2 of 20 runs
    of the holder-lookup stall test, which since accepts any error from a standing-by
    Server (assertStartupEnd, single_active_budget_test.go:442-453: "how it reports
    that shutdown ... is not asserted here"). Confirmed by
    reading at 19f7477f; FAIL-PER-4 already says a shutdown during the startup steps
    exits without an error, and FAIL-PER-2 leaves the cancelled outcome of a standby
    unspecified.
  siblings: >-
    In scope: the ctx.Done and done cases of the standby loop, and the acquisition
    branch, whose error path already returns ctx.Err() joined with stop(). Checked and
    unaffected: ServeSystem (internal/app/system.go:88-108) selects on ctx.Done against
    component exits but reports lease loss and shutdown by their cause; serveHandler
    itself returns nil after a requested shutdown. No other select in internal/app
    mixes the process context with a goroutine stopped by the same context.
  provenance: >-
    git blame of single_active.go:262-271 points at
    3262cb829c470a4d416767d865403396c1bf2e2e "Enforce a single active Server with a
    PostgreSQL lease", listed in tasks/done/v107-001-single-active-server.yml.
scope:
  in:
    - "The standby loop reports cancellation whenever the process context is done, whichever case the select picks, and keeps the listener error for a listener that stopped while the context was live."
    - "FAIL-PER-2 states the cancelled outcome: a standby that is shut down stops its readiness listener and exits without an error."
    - "A deterministic regression: a test seam (export_test.go) or ordering hook that makes the readiness server finish before the loop selects, with the context already cancelled."
    - "The holder-lookup stall test asserts the shutdown result again instead of discarding it."
  out:
    - "Lease acquisition, takeover and standby polling behaviour and their budgets (PER-R8, PER-R27, PER-R28)."
acceptance_criteria:
  - id: A1
    given: "a standby whose context is cancelled while it runs the holder lookup or an acquisition probe"
    when: "the readiness server has stopped before the loop selects"
    then: "awaitControlPlaneLease returns an error that wraps context.Canceled, and runCLI returns nil"
  - id: A2
    given: "a standby whose readiness listener fails or is closed while its context is live"
    when: "the loop selects"
    then: "it still returns standby readiness listener stopped with the listener's error"
  - id: A3
    given: "TestControlPlaneLeaseStartupStallEndsAtItsBudgetOwner with assertStartupEnd asserting the standing-by shutdown result"
    when: "it runs 20 times with -count=20"
    then: "every run observes the clean shutdown result"
  - id: A4
    given: "the unfixed select at 19f7477f"
    when: "the deterministic A1 regression runs"
    then: "it fails with listener exited before lease acquisition"
tests:
  - command: "go test -count=1 -run 'ControlPlaneLease|Standby' ./internal/app/..."
    covers: [A1, A2, A4]
  - command: "go test -count=20 -run TestControlPlaneLeaseStartupStallEndsAtItsBudgetOwner ./internal/app/"
    covers: [A1, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" go test -count=1 ./internal/app/..."
    covers: [A2]
  - command: make lint
    covers: [A1, A2]
