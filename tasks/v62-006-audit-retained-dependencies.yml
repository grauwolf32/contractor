schema_version: "1.0"
id: V62-006
title: Retain exact item dependencies across Audit rounds
milestone: audit-workflow-composition
epic: audits
kind: feature
priority: P2
status: deferred
deferral:
  date: "2026-09-20"
  previous_status: pending
  reason: Cross-round item dependencies belong to the later iterative Audit slice.
  reactivate_when: Explicit user approval of an actual later-round consumer and its exact dependency contract.
implementation_commit: null
depends_on: [V62-004]
languages: [go, json, sql]
goal: Let a later check consume precise earlier artifacts and accepted results through an immutable dependency manifest.
context:
  authority: User-requested V62 Audit Workflow composition task series.
  design: docs/plans/2026-09-20-audit-workflow-composition.md
  specification:
    - docs/spec/audits/audits.md
    - docs/spec/artifacts/artifact-store.md
    - docs/proposals/0033-autonomous-pentest-audits.md
  boundary: Define the generic retained-dependency contract on reactivation; V62-001 covers preparation only. Pentest-specific recipe, proof and authorization checks remain outside this task.
  revalidated: >-
    2026-10-24 on b523ae77: still deferred, not superseded. Every V62 foundation is complete:
    V62-001 (22fcba08), V62-002 (c13dfbb9), V62-003 and V62-004 (11471640), V62-009 (4bd4fd6d),
    V62-010 (233b94a5), V62-011 (a597d779) and V62-012 (8c2441f0). The Audit specification was split
    on 2026-10-11: mapping sources and preparation are docs/spec/audits/scans.md ASC-R13 to ASC-R19
    (the ASC-R17 table keeps retained-output same-Round only and lets prepare-output feed every
    Round), role bindings are docs/spec/audits/audits.md AUD-R31 to AUD-R43 (AUD-R41 forbids
    dependencies on per-item check outputs), and execution, review and completion moved to
    execution.md (AUX), review-and-reports.md (REV) and worker-completion.md (AWC); the scans.md and
    audits.md non-goals still list round-results, retained dependencies, proposed-check routing and
    standalone project-analysis as not provided. Schema changes since deferral:
    audit_collection_receipts folded into audit_executions (V365-017, b97fa2b6), audit_coverage_rows
    and audit_proposal_items into audit_items (V365-018, b2deb200), and audit_report_candidates into
    the report-acceptance review request (V365-019, b74c3f5c); keyed receipts use mutation_receipts
    and controller leases use audit_controller_claims through ControllerClaims (V370-007, PER-R24,
    PER-R25); migrations restart at 000001_baseline.sql (V367-001) and the next free number is
    000040. internal/auditstore is now split into claimstore, hookstore, ownerstore, querystore,
    reviewstore and internal/pgstore. A planned consumer now exists: V411-012 (pending) depends on
    V62-005, V62-006 and V62-007 as blocking prerequisites and must reuse their contracts, so
    V411-015 to V411-018, V411-020, V411-021 and V412-003 to V412-005 (directly or through
    V411-020), and the autonomous-http-pentest-2026-10 milestone, cannot finish until the user
    reactivates and completes them. Proposal 0033 sections 7.4 and 8 now propose the shared shapes
    to settle on reactivation: profile proposedChecks entries {planSchema, phase, workflowRole,
    requiredCapabilities} with phase verify or replay, the retained-dependency input source resolved
    from an accepted item's manifest, and findingConfirmation: optional. V410-006 explicitly leaves
    V62-006/007 routing out of the sitemap slice. This note reactivates nothing. Task-specific:
    retained-dependency would add a sixth mapping source to the ASC-R17 table and change ASC-R18;
    its holds must reuse Artifact bindings and the Audit purge path rather than a new hold table.
    V410-006 and proposal 0042 take a fresh sitemap snapshot per Round instead of a cross-round
    lookup, so they do not cover this task.
scope:
  in:
    - Persist bounded named dependencies binding Audit/baseline, source execution/round/item/attempt, retained ref/digest and intake receipt/ordinal where applicable.
    - Validate source ownership, accepted collection, semantic dependency type, exact content and retention before admitting a dependent item.
    - Resolve retained-dependency inputs only from the accepted item's manifest and create exact RunScope forks while preserving original-to-child ref mappings.
    - Reuse Audit-level prepare outputs in later rounds without rerunning preparation or searching mutable Project bindings.
    - Support exact selection of one accepted check result without relaxing generic retained-output or choosing an arbitrary batch/attempt.
    - Preserve holds through source Run deletion and check cancellation, purge them through Audit deletion and report missing/corrupt dependencies explicitly.
  out:
    - Cross-owner or cross-Audit lookup, latest-version fallback, implicit previous-round role search or new proposal routing.
deliverables:
  - path: internal/auditdomain
    description: Versioned item dependency manifest and canonical validation fixtures.
  - path: internal/auditservice
    description: Admission/retention of exact dependencies and task package references.
  - path: internal/auditcontroller
    description: Authorized dependency resolution and RunScope fork construction.
  - path: internal/auditstore
    description: Dependency holds, provenance relations and deletion lifecycle tests.
acceptance_criteria:
  - id: A1
    text: A second-round check consumes the exact prepare and first-round accepted result revisions even after source Runs or current catalog entries are removed.
  - id: A2
    text: Foreign, unaccepted, ambiguous, missing, corrupt or media-incompatible dependencies are rejected or block the item with explicit reasons and no fallback lookup.
  - id: A3
    text: Batches and retries preserve item/attempt/result attribution and correct original-to-Run ref mappings; Workers receive only declared inputs.
  - id: A4
    text: Restart, cancellation and Audit deletion preserve then release required holds under existing fences; current same-round retained-output behavior is unchanged.
tests:
  - command: go test -tags=integration -count=1 ./internal/auditdomain ./internal/auditservice ./internal/auditstore/... ./internal/auditcontroller ./internal/runservice ./internal/auditimport
    covers: [A1, A2, A3, A4]
  - command: go test ./internal/config ./internal/artifacts
    covers: [A2, A4]
test_prerequisites:
  - Disposable PostgreSQL for mandatory retention, source-deletion, restart and cross-owner isolation scenarios.
verification_requirements:
  - Record exact source and child refs/digests in assertions and prove no current-binding read is used during dependent dispatch.
