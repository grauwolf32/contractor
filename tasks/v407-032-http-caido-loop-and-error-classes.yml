schema_version: '1.0'
id: V407-032
title: Offload bounded Caido payload processing and preserve unexpected HTTP/Caido failures
milestone: server-runtime-review-2026-10
epic: http-tools
kind: defect
introduced_by: V12-004
priority: P2
status: pending
depends_on: []
languages:
- python
goal: Process reachable Caido payloads off the event loop and keep unexpected code exceptions distinct
  from classified transport failures without changing session or wire contracts.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/tools/http-caido.md
  severity: medium
  finding: 'runtime/src/contractor_runtime/toolsets/caido/tools.py:471-475,491-493 and corresponding replay/workflow
    paths perform _blob, credential redaction and full UTF-8 preview decoding inline. The production boundary
    is adapters/caido_graphql.py:28,511-524: at most 16 MiB for the complete decoded JSON response, including
    base64, so its raw payloads total less than 12 MiB. http/tools.py:721-724,990-992 and caido/tools.py:1131-1132,2359-2360
    map unexpected TypeError/AttributeError to retryable transport codes. _safe_tool_response already
    emits a bounded non-retryable response for an unexpected exception. _blob currently rejects noncanonical
    base64 by decode/re-encode equality; validate=True alone accepts nonzero pad bits. HTTP locking supports
    HTP-R75 request-state serialization and HTP-R129 cookie CAS ownership.'
  siblings: Caido request_detail, replay polling and workflow_run payload transforms; HTTP _send_once
    and RecordedToolCall boundary; Caido read and mutation error boundaries. Inspect interactsh expected
    transport classification as a sibling without changing its ambiguous-mutation outcomes. Filesystem
    and parser classification are separate domains.
  validation: 'Partially confirmed on dc7012e8: payload transforms run inline and TypeError becomes retryable
    caido_request_failed. The production adapter caps the whole JSON response at 16 MiB; a 32- or 64-MiB
    raw-message scenario is unreachable. Canonical base64 checks and HTTP session serialization are intentional.'
plan:
- Run pure Caido blob decode, canonical validation, redaction and preview preparation through threads.to_thread_until_done,
  retaining session ownership until work joins on cancellation and without leaking raw secrets into metrics.
- Preserve canonical base64 rejection, including noncanonical pad bits, exact response validation, byte
  bounds and output shapes. Keep the 16-MiB adapter response limit as the reachable test boundary.
- At HTTP/Caido transport and recorded-call boundaries, preserve existing domain errors and catch their
  documented transport families. Let unexpected implementation exceptions reach the existing tool-error
  callback with their identity intact; do not reclassify them as retryable transport faults. Preserve
  Caido mutation ambiguity handling and no blind replay.
- Use an adapter-valid fixture with approximately 8 MiB of raw content and total JSON below 16 MiB. Assert
  execution thread and barrier-controlled loop progress for each payload path; separately prove the real
  adapter rejects oversized JSON before payload processing.
- Inject unexpected exceptions and known transport errors through the actual tools and callbacks. Keep
  HTTP session mutation, request IDs, cookie recovery, cancellation and read serialization unchanged;
  test existing behavior rather than adding concurrent history/session reads.
scope:
  in:
  - Threaded bounded Caido payload transformations and joined cleanup; HTTP/Caido error-boundary classification;
    deterministic regression coverage.
  out:
  - Changing HTTP/Caido session serialization, request ID/cookie ownership, retry policy, mutation ambiguity
    outcomes or deadlines.
  - Target/redirect policy, base64 grammar, capture formats, adapter limits and tool schemas.
  - New concurrent-read behavior or raw-message tests that bypass the production response limit.
acceptance_criteria:
- id: A1
  text: For adapter-valid request_detail, replay and workflow payload fixtures, payload transforms run
    on worker threads; deterministic barriers demonstrate loop progress and joined cancellation. The offload
    test fails on the inline implementation.
- id: A2
  text: An injected TypeError in the HTTP or Caido send path reaches the existing tool-error callback
    as an unexpected exception and produces a bounded non-retryable failure; known connection failures
    retain their existing classified retryability. Caido mutations retain their existing unknown-outcome
    handling.
- id: A3
  text: 'Canonical base64 remains strict: YQ== is accepted for b''a'' and YR== is rejected. Adapter responses
    exceeding 16 MiB are rejected before tool processing; accepted response/output schemas and redaction
    remain unchanged.'
- id: A4
  text: Existing request ID ordering, session/cookie serialization, cancellation, recovery and bounded
    transport tests pass without relaxing their guarantees; no new tests assert wall-clock latency.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_caido_read_tools.py tests/test_caido_action_tools.py
    tests/test_http_toolset.py tests/test_http_caido_security.py tests/test_caido_adapter.py tests/test_caido_graphql_fixtures.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A2
  - A3
  - A4
