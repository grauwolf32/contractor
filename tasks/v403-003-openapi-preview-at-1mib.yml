schema_version: "1.0"
id: V403-003
title: "Keep a 1 MiB OpenAPI preview from blocking the page"
milestone: ui-journey-usability
epic: ui
kind: defect
introduced_by: V403-001
priority: P3
status: pending
depends_on: []
languages: [typescript]
goal: >-
  Opening the preview of an OpenAPI document of up to 1 MiB shows the first
  operations promptly and never holds the page for more than a fraction of a
  second, as the Markdown preview does since V403-002.
context:
  specification:
    - docs/spec/ui/ui.md#UI-R194
    - docs/spec/platform/limits.md
  severity: low
  finding: >-
    OpenApiArtifactPreview (ui/src/routes/artifacts/previews/openapi.tsx:11)
    hands the whole parsed document to Scalar's ApiReferenceReact, which
    renders every operation at once. Measured in Chromium with a temporary
    spec during V403-002: a 1 MiB OpenAPI 3.1 YAML with about 7,000 GET
    operations and no tags shows the Rendered view after 2.4 s, holds the main
    thread for 1.4 s in one task, builds about 98,000 elements and settles
    after 5.2 s; main before V403-002 measured the same. V403-001 raised
    LIM-UI-12 from 256 KiB to 1 MiB, which allows documents of this size.
  siblings: >-
    Markdown is sectioned by V403-002 (UI-R202). The diff renderer is linear
    (884 ms at 1 MiB, 838 ms at 256 KiB) and plain text takes 162 ms. LikeC4
    parses in a worker. Archive files previewed through the same renderers
    share this path.
scope:
  in:
    - "Measure where the time goes (YAML or JSON parse in openapi-document.ts, Scalar's store, or rendering) at 256 KiB and 1 MiB, with and without tags."
    - "Bound the work: a Scalar setting that renders operations lazily or collapsed if one exists, otherwise a size above which the preview opens the Source tab first and renders on request, stated as a limit in docs/spec/platform/limits.md."
    - "A browser regression with a 1 MiB OpenAPI document."
  out:
    - "Replacing Scalar."
    - "Other renderers."
acceptance_criteria:
  - id: A1
    text: "A 1 MiB OpenAPI document shows its first operation and leaves the page responsive: no main-thread task over about 200 ms in Chromium, measured as in V403-002."
  - id: A2
    text: "Whatever bound is chosen is stated once in the specification and the UI copy names it from its constant."
  - id: A3
    text: "The browser regression fails on the unbounded renderer."
tests:
  - command: make ui-verify
    covers: [A2]
  - command: make ui-browser-mocked
    covers: [A1, A3]
  - command: make lint
    covers: [A1, A2, A3]
