  - A2
  - A3
  - A4
- command: python3 scripts/test-audit-composition-e2e.py --case-set workspace
  covers: *id001
- command: make verify-public-api verify-public-api-postgres
  covers: *id001
- command: make test-runtime test-wire-cross-language
  covers: *id001
- command: make lint
  covers: *id001
test_prerequisites:
- These commands are future implementation acceptance, not results of this amendment. Add --case-set workspace
  to the existing runner/matrix before claiming it ran.
- Use disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set and actual Server/Scheduler/Runtime.
  Configured/unavailable DB, mandatory skips or zero-match cases fail; unit/config tests use testdata,
  not live configs.
- Run whole touched-package suites and required public/wire/release selectors. The focused workspace set
  does not require sqlmap/nuclei/Chromium or live models; unrelated composition regressions keep their
  own prerequisites.
- Existing preparation Runs are only the production calling site. Prove real Audit-scope material operations;
  do not claim the new coordinator or whole-Audit completion from these cases.
verification_requirements:
- Update OpenAPI and both generated clients for public changes; shared wire fixtures cover every changed
  cross-language rule.
- Classify new packages in the layer registry and register relation ownership/ERD changes; preserve downward
  dependencies and strict reads/writes.
- Delete the replaced vertical path and its exclusive schemas/states/tests as its callers migrate. Final
  V64-011 proves no parallel legacy pipeline remains.
