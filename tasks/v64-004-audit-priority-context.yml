goal: One ordinary Run output can be retained in Audit scope, selected as an exact input of another Run,
  and explicitly published to the owning Project through the existing ArtifactStore.
demonstration: The existing Audit role-output collection and dependent-Run submission path executes two
  small ordinary Workflows. Run A writes one self-contained JSON material; collection forks its exact
  output into Audit scope; RunService forks that selected revision into Run B. An owner publishes the
  exact material into Project through a minimal authenticated operation, then source Run/Audit deletion
  leaves the independently owned Project bytes and lineage readable. This is the material handoff slice,
  not the new coordinator or the complete lean Audit journey.
context:
  authority: 'User decisions on 2026-10-31 require exact Audit/Project materials through existing ArtifactStore,
    explicit publication and controlled complexity. On 2026-11-01 the user selected a first slice of self-contained
    materials, confirmed that automatic collection of everything referenced by a report is not a priority,
    and kept composite behavior with a separate concrete consumer. Existing V410-025 owns the SMT snapshot
    case. This amendment starts no implementation. User concern on 2026-11-01: avoid accumulating redundant
    artifact copies during handoff/publication.'
  implementation_gate: V64-001 and V410-010 are completed. A user assignment of V64-004 is sufficient
    under normal dependency/status rules; settled V64-001 decisions are not pending review. This amendment
    itself starts no code.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  - docs/proposals/0050-audit-removal-map.yml
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/artifacts/projects.md
