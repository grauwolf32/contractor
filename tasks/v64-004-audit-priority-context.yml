  - docs/spec/audits/common-contract.md#ACT-R10
  - docs/spec/audits/common-contract.md#ACT-R11
  - docs/spec/artifacts/artifact-store.md#ART-R72
  - docs/spec/artifacts/artifact-store.md#ART-R77
  - docs/spec/platform/limits.md#LIM-ACT-2
  specification_baseline: Completed V64-001 owns the common contract, especially ACT-R11. Update current
    Artifact/Audit execution requirements, public/wire contracts and fixtures with implementation. The
    removal map governs only migrated callers.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  production_caller:
    producer: auditimport.Importer.collectRoleSuccess -> ServiceArtifactAccess.RetainRunExact/retainRunExact
      (importer.go/artifacts.go). Move declared ordinary role-output retention from protected Project
      namespace to real Audit scope, reusing its receipt and authority.
    consumer: PinnedSubmissionBuilder.resolveRoleInputs/preparationOutput (auditcontroller/builder.go)
      -> runservice.Service.CreateAudit (runservice/audit.go). Resolve an accepted exact Audit descriptor
      and fork it into child inputs before scheduling; retain existing claim/execution-intent checks.
    publication: Add only the actual owner-authenticated material read/publication action to existing
      Artifact/Audit services and public handlers. Source is exact namespace/name/revision; destination
      Project comes from Audit ownership. Reuse ordinary target binding names, create-only/If-Match CAS
      and receipts. Full API/CLI and UI remain V64-008/009.
    sequencing: Existing controller role sequencing invokes these operations; V64-002 later replaces orchestration
      and reuses them. No new coordinator, execution mode, compatibility path or preservation requirement
      for old preparation/ZIP/remapping machinery.
  material_boundary: Opaque bytes and one selected artifact per fork/publication; ordinary multi-input/multi-output
    Workflows remain supported. Zero implicit external dependency descriptors or retention promises. No
    JSON/$ref/URL scan, selfContained flag, format whitelist, universal manifest or recursive resolver.
    The demo JSON needs no sidecar; V410-025 owns its explicit SMT composite case.
  verification_boundary: Extend the existing composition matrix/runner with mandatory workspace cases
    and focused --case-set workspace; include them in default/release evidence. Old preparation/Round/approval
    cases alone are not proof. Use real Server/Scheduler/Runtime/PostgreSQL and testdata; the focused
    set needs no scanners, browser or live model.
scope:
  in:
  - Add real Audit scope to existing ArtifactStore addressing, ownership, authorization, fork, metadata/read,
    lineage and purge/retention mechanisms. Keep the existing scoped store and downward component dependencies.
  - Migrate the named production output-collection and RunService input-initialization callers in the
    same change. The first demonstration uses one ordinary exact JSON output and one selected child input;
    source bytes are not repackaged or rewritten.
  - Preserve ordinary multi-input/multi-output Workflows. Each explicitly selected input receives its
    own exact fork under existing Run initialization; this adds no automatic dependency discovery or atomic
    whole-report bundle promise.
  - Expose the minimal owner-authenticated read/publication operation needed to publish one exact Audit
    material into its owning Project, with ordinary create-only collision, explicit CAS replacement, lineage
    and independent destination lifetime.
  - Keep source Run/Audit data usable by already accepted consumers. Preserve and reconcile the existing
    output/publication identity after response loss without repeating a Workflow or target action.
  - Register and execute the new mandatory workspace handoff/publication/failure cases through the existing
    composition matrix/runner; update owning specs, strict public/wire contracts and both generated clients
    when affected.
  out:
  - Composite material dependency discovery, closure manifests, recursive traversal, generic JSON/ref
    rewriting and a dependency graph/store. Existing composite consumers retain their current independent
    contracts; V410-025 owns the later sitemap snapshot case.
  - The new coordinator, task/iteration model, hypothesis execution/generation, finding migration, formal
    approval removal, broad API/UI redesign or whole-Audit completion. Those remain their existing V64/V411
    owners.
  - A separate Artifact service, transfer job/controller, new receipt/lease system, compatibility reader
    or test-only production API.
  - Implementation during this task-amendment turn, changing user model configuration or deploying/migrating
    the demo.
requirements:
- id: R1
  text: Every handoff/publication selects an exact existing revision. Input and published copies are independent
    bindings with truthful source scope/lineage; source mutation/deletion never substitutes latest or
    destructively relocates accepted data.
- id: R2
  text: Ownership transfer must use the existing fork of the same immutable version/blob, not read/reupload
    or a new payload version merely to change scope. Keep one Audit binding per accepted producer Run/output,
    and reuse it for consumers; replay of the same fork/publication adds no binding/revision. Project
    publication is explicit. Existing owner retention/purge and reference-safe GC release unused data;
    do not add a cleanup controller or retention policy.
- id: R3
  text: Audit owner/Project/Run membership and allocation grants come from trusted existing records. Run
    B receives only selected authorized inputs. Source references or matching Project IDs alone grant
    no cross-Audit reads.
- id: R4
  text: The first caller is the named existing collection -> accepted output lookup -> RunService path,
    plus the minimal owner publication action. A helper, standalone store test or the future V64-002 coordinator
    is not a substitute for that production caller.
- id: R5
  text: The slice guarantees one exact artifact, with no implicit external dependency retention. Self-contained
    payloads are a deliberate caller scope, not a new model declaration, file-type registry or universal
    parser. Ordinary explicit multi-input Workflows remain valid; each selected artifact is transferred
    independently of references embedded in its payload.
- id: R6
  text: Workspace-specific required cases must actually execute and report actual Audit-scope forks/publications.
    Old Project audit-* bindings, old composition cases, zero-match selections or mandatory skips cannot
    satisfy this acceptance.
failure_outcomes:
- operation: Collect an exact declared output into Audit scope and initialize a dependent Run input
  permanent: Missing/nonexact/unauthorized output, digest/media/size mismatch, source membership or scope
    fence rejects through the existing classified owner error. No runnable partial input, latest substitution
    or endless retry.
  retryable: Existing classified storage_transaction_conflict 503 and bounded owner retries keep the same
    collection/submission identity and deadline.
  ambiguous: Resolve the accepted output, original fork/collection receipt and Run association before
    repeating a mutation. Never rerun producer or consumer to repair storage acknowledgement.
  cancelled: Existing Audit/Run claim and allocation fences join in-flight writes/readers before cleanup.
    No new dispatch after pause/cancel; authorized terminal collection remains possible.
  timeout: Existing collection, Run initialization and Artifact operation deadlines remain separate; introduce
    no material-transfer clock/controller.
- operation: Publish one selected exact Audit artifact into the owning Project
  permanent: Reject unavailable/foreign source, create-only collision, stale explicit target CAS or deleting
    scope through the registered owner errors. PostgreSQL-backed handlers document storage_transaction_conflict.
    No partial destination/grant.
  retryable: Existing bounded Artifact/transaction conflict policy retries the same request/identity only.
  ambiguous: Replay the original publication key/receipt and exact destination. Do not create another
    revision or copy another source after an acknowledgement loss.
  cancelled: Existing owner/purge fencing joins publication; source deletion cannot release already committed
    Project ownership.
  timeout: Use the existing publication operation deadline; a possibly committed result remains reconcilable
    under its original identity.
cardinality:
- collection: One handoff/publication selection and its containing Run/Audit
  expected: Two ordinary Runs, one selected JSON output/input and one Project publication.
  maximum: One exact artifact per selected operation; zero external dependencies. Existing Artifact payload,
    declared-output, pagination and Audit task/evidence ceilings remain in force.
  bound: Use indexed selected descriptors and existing bounded output/collection slices. No full Run/Audit/Project
    history scan; no payload read merely to infer dependencies.
lifecycle:
- entity: Audit-owned exact Artifact bindings and dependent Run inputs
  delete: Existing authenticated Audit deletion fences new work and joins child work before bounded scope
    purge.
  cascade: Purge owner-local Audit bindings and release its holds; retain independent Run input forks
    and Project publications according to their own owners.
  retention: Accepted input and Project bindings retain exact bytes and provenance independently. Read-only
    metadata access creates no hold.
acceptance_criteria:
- id: A1
  given: the named existing production caller, real Server/Scheduler/Runtime/PostgreSQL and two small
    ordinary Workflows
  when: Run A declares one JSON output, it is collected into Audit scope and Run B consumes its selected
    exact revision
  then: bytes/digest/revision and Run -> Audit -> Run lineage agree; metadata proves real Audit scope,
    not a Project audit-* namespace; no new coordinator or hypothesis/approval workflow is required; ordinary
    explicit multi-input behavior remains supported, without an implicit dependency list; real-store checks
    prove the forks reuse the immutable version/blob, rather than duplicating payload bytes
- id: A2
  given: an owner-selected Audit material and the actual authenticated publication/read operation
  when: the exact material is published into Project, its acknowledgement is lost/replayed and the drained
    source Run/Audit is purged
  then: one logical Project publication and exact readable bytes/lineage remain under independent Project
    ownership; replay adds no binding/revision, surviving consumers retain their inputs until their own
    owner releases them, and no producer execution repairs publication
- id: A3
  given: create collision, valid replacement, stale CAS, foreign owner/Audit, unavailable exact source
    and deletion/cancellation races
  when: the actual publication/initialization operations run
  then: valid explicit CAS replaces exactly once; invalid cases return classified errors with no latest
    fallback, unauthorized grant, runnable partial input or lost accepted bytes
- id: A4
  given: the existing composition runner/matrix with a new workspace case set
  when: the focused workspace selection and owning release selector execute
  then: mandatory exact-handoff, publication-after-purge, replay, collision/CAS and authority/fence cases
    all report execution with zero skips; removing these cases or selecting only old preparation/Round/approval
    tests fails acceptance
