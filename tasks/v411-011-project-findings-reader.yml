schema_version: '1.0'
id: V411-011
title: Expose safe live Project findings to allocated pentesters
milestone: autonomous-http-pentest-2026-10
epic: findings
kind: feature
priority: P1
status: pending
depends_on:
- V411-002
- V397-004
languages:
- go
- python
- json
goal: Give a Worker bounded read-only access to findings in its owning Project and exact authorized evidence without
  changing existing immutable collection readers.
context:
  authority: User requested a complete implementation task plan for the reviewed proposals on 2026-10-24; this record
    authorizes no implementation during planning.
  proposal: docs/proposals/0033-autonomous-pentest-audits.md
  proposal_sections:
  - Sections 3 and 7.3; Project findings read acceptance gates
  specification:
  - docs/spec/findings/findings.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/execution/control-plane.md
  - docs/spec/tools/toolsets.md
  existing_boundaries: >-
    V62-005/006/007 are pending after the explicit 2026-10-24 user request.
    Only completed declared dependencies permit this task to start. Generic
    V62 work and V64 research retain their own task scopes; V61 MCP and
    V62-008 analysis-chain work remain deferred.
  code_owners:
  - internal/findingintake
  - internal/auditservice
  - internal/httpapi/privateartifacts
  - internal/artifacts
  - runtime/src/contractor_runtime/toolsets
scope:
  in:
  - Register list_project_findings and read_project_finding through a separate explicit Project-bound reader selection.
  - Derive Project identity from trusted allocation/Run context and reuse existing finding/correlation/review records.
  - Filter source-derived previews and embedded documents before blackbox disclosure; materialize exact allowed
    evidence into the consumer Run.
  - Test cross-Project isolation, current revisions, live pagination, source deletion and cancellation of materialization.
  out:
  - Finding mutation, confirmation, merging, deletion or automatic coverage credit.
  - SARIF/export redesign, a second finding database or a dependency on V397-006 through V397-009.
requirements:
- id: R1
  text: Reuse LIM-FND-26 default 20/max 100 and LIM-FND-29 256 KiB rather than copying independent page constants.
- id: R2
  text: Live keyset cursors bind Project and filters. Each result names its exact revision; pages are not claimed
    to be one immutable snapshot.
- id: R3
  text: Source-mode checks apply before metadata, notes and evidence exposure; unknown or mixed provenance cannot
    be labelled safe by the model.
- id: R4
  text: Resolve selected evidence through existing ownership/retention checks and exact forks, preserving original-to-consumer
    refs; foreign identities return safe not-found.
- id: R5
  text: Reads grant no review or mutation authority and no holds by themselves. Accepted proof dependencies acquire
    existing retention before acceptance.
failure_outcomes:
- operation: Finding list/read and evidence materialization
  permanent: Invalid filters fail with classified invalid-input errors; foreign refs are safe not-found and missing
    retained evidence is explicitly unavailable.
  retryable: Bound transient store conflicts through existing 503/Retry-After policy; never hide them as empty findings.
  ambiguous: Reconcile exact materialization/fork identity on lost acknowledgement; never select a newer revision.
  cancelled: Join pending evidence fetch/fork work before allocation release; fenced allocations cannot publish.
  timeout: Reader and materialization operations obey finite tool/allocation deadlines, separately from target request
    budgets.
cardinality:
- collection: Project findings and selected evidence
  expected: Several pages of findings from multiple Runs/Audits.
  maximum: 20 default/100 maximum items and 256 KiB metadata per page; existing evidence/package ceilings.
  bound: Use indexed keyset reads; do not hydrate every evidence blob or rescan all Project findings for a page.
lifecycle:
- entity: Prepared read view and consumer evidence
  delete: Allocation release drops ephemeral reader state; existing Run/Audit/Project deletion owns durable refs.
  cascade: Run-scoped materialized refs purge normally; accepted proof holds survive permitted source Run deletion.
  retention: Retain only explicitly selected proof dependencies; mere reading creates no new Project-wide hold.
acceptance_criteria:
- id: A1
  given: Multiple Runs/Audits contribute findings to one Project.
  when: An explicitly selected Worker lists and reads them.
  then: It sees bounded current metadata with exact revisions and usable authorized consumer refs.
- id: A2
  given: Foreign Project IDs/receipts and source-derived embedded content.
  when: A blackbox reader attempts list/read/materialization.
  then: Foreign data is not exposed and source content is filtered before any model-visible response.
- id: A3
  given: More than 100 findings and concurrent updates.
  when: All keyset pages are read.
  then: No first-page-only truncation occurs and the API truthfully identifies live revisions without claiming snapshot
    consistency.
- id: A4
  given: Source deletion, missing evidence and a lost fork response.
  when: The reader materializes a selected dependency.
  then: It returns an exact retained copy or explicit unavailable outcome and never a latest-binding substitute.
- id: A5
  given: A reader-only allocation is cancelled while materializing evidence.
  when: Release completes.
  then: No work outlives release and no finding state, analyst decision or coverage is changed.
tests:
- command: go test -tags=integration -count=1 ./internal/findingintake ./internal/auditservice ./internal/artifacts
    ./internal/httpapi/privateartifacts
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: cd runtime && uv run --locked pytest -W error tests/test_findings_reader_toolset.py tests/test_security_findings_toolset.py
  covers:
  - A1
  - A2
  - A5
- command: make test-findings-e2e test-wire-cross-language
  covers:
  - A1
  - A2
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Use disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set for every store-backed test; unavailable configured
  infrastructure must fail, not skip.
- Run complete suites of each touched package. Fixtures live in testdata, never the live configs tree; shipped configuration
  uses its dedicated validation command.
verification_requirements:
- Map every acceptance criterion to executed cases; selected zero-test filters and mandatory skips fail verification.
- Update owning numbered specifications, limits/errors/lifecycle registries and shared schemas/fixtures in the implementation
  change; planning supplies no implementation commit or successful verification evidence.
