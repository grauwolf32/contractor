schema_version: '1.0'
id: V411-011
title: Read live Project findings through allocation-authorized existing mechanisms
milestone: autonomous-http-pentest-2026-10
epic: findings
kind: feature
priority: P1
status: pending
depends_on:
- V422-002
- V397-004
- V411-015
languages:
- go
- python
- json
goal: A selected HTTP Worker can read bounded current Project findings and explicitly selected exact evidence
  as investigation context.
context:
  authority: 'User direction on 2026-10-30: replan stalled pentest tasks against the selected V422 contracts
    and archive obsolete work. This edit changes the plan only; it does not start implementation.'
  specification:
  - docs/spec/findings/findings.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/audits/audits.md
  - docs/spec/execution/control-plane.md
  - docs/spec/configuration/agent-templates.md
  replanned: '2026-10-30: replaces the earlier scope and acceptance in this task. Proposal 0033 is historical
    design wherever it conflicts with current normative contracts and this reviewed delivery scope.'
  boundary: Finding services own finding semantics. ArtifactStore owns content access/forks; trusted allocation
    context owns Project authority. No pentest-specific evidence store.
scope:
  in:
  - Add explicit read-only list/read tools over existing finding/correlation/review services, deriving
    Project identity from trusted Run/allocation context.
  - Reuse and narrowly extend ordinary Artifact allocation grants and exact evidence materialization rather
    than create a parallel file transport.
  - Preserve the current engagement source-access boundary for finding text/embedded files; do not copy
    the removed sitemap source-mode projection into the shared map.
  - Select the reader in an actual HTTP Workflow and cover all keyset pages, exact selected revisions
    and foreign Project denial.
  out:
  - Finding mutation/review/deletion, automatic coverage credit, a second finding database or proof-dependency
    registry.
  - Reintroducing source-mode filtering of shared sitemap metadata.
requirements:
- id: R1
  text: Use existing finding page/byte bounds and return exact current revisions; live pages do not claim
    a frozen snapshot.
- id: R2
  text: Unknown source provenance is not permission to disclose source-bearing finding content to blackbox
    consumers; explicit owner-selected inputs retain their existing authority.
- id: R3
  text: Reading adds no hold or review authority. Exact selected evidence uses existing forks/holds only
    when a real consumer retains it.
failure_outcomes:
- operation: Read live Project findings through allocation-authorized existing mechanisms
  permanent: Reject invalid, unauthorized or unsupported input through the owning existing classified
    error; a missing exact dependency stays unavailable without a latest-ref substitution.
  retryable: Use only existing bounded storage/publication retries under the original operation identity
    and deadline. HTTP retry is exclusively HTP-R139; no possibly sent request or failed engagement item
    is automatically repeated.
  ambiguous: Reconcile ordinary Artifact, Run or Audit receipts where publication may have committed.
    Never send target traffic to reconstruct a missing acknowledgement.
  cancelled: Existing allocation/Run ownership cancels and joins all work before release and secret cleanup;
    no special transport-stop proof or background controller is added.
  timeout: Use the ordinary Audit, Run and operation deadlines. No separate cumulative clock, post-deadline
    target work or new default HTTP quota.
cardinality:
- collection: Live findings and selected evidence
  expected: Several pages of Project findings; a few explicitly selected evidence members
  bound: Reuse LIM-FND-26/29 pagination and byte bounds; batch exact metadata without scanning unrelated
    Run artifacts.
lifecycle:
- entity: Existing Run/Audit artifacts and allocation-owned state
  delete: Existing drained Run/Audit/Project deletion and Artifact retention rules remain authoritative.
  retention: Only explicitly selected exact evidence/context uses existing holds. A read or metadata reference
    creates no new hold, table or lifetime.
acceptance_criteria:
- id: A1
  text: A Workflow reads more than 100 Project findings across all pages and identifies current exact
    revisions.
- id: A2
  text: Foreign Projects, unauthorized embedded source and inaccessible evidence remain unavailable before
    model exposure.
- id: A3
  text: Selected evidence materializes through ordinary Artifact ownership/retention and survives only
    according to those rules; cancellation joins work and changes no finding/review state.
tests:
- command: go test -count=1 ./internal/findingintake/... ./internal/auditservice/... ./internal/artifacts/...
    ./internal/httpapi/privateartifacts/...
  covers:
  - A1
  - A2
  - A3
- command: make test-runtime test-wire-cross-language test-findings-e2e
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
test_prerequisites:
- Run complete suites of touched packages. Store behavior uses disposable PostgreSQL; an explicitly configured
  unreachable database fails rather than skips. Mandatory process selections must execute at least one
  test with no unexpected skips.
- Unit/config tests use testdata fixtures; validate the shipped catalog separately. These commands are
  future implementation acceptance, not claimed results of this planning change.
demonstration: A Workflow reads more than 100 Project findings across all pages and identifies current
  exact revisions.
