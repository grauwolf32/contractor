schema_version: '1.0'
id: V74-001
title: Align Server and Runtime CA bundle grammar
milestone: runtime-contract-parity-2026-10
priority: P1
status: in_progress
depends_on: []
languages: [go, python]
goal: Reject CA bundles at publication that the Runtime would reject at allocation preparation.
context:
  issue: https://github.com/grauwolf32/contractor/issues/318
  finding: Go pem.Decode skips text before certificate blocks while Runtime requires whitespace only.
scope:
  in:
    - Share strict Go CA bundle validation between runtimeconfig and contracts.
    - Match Python on preambles, inter-block text, PEM headers and private-key markers.
    - Cover valid and invalid bundles in shared contract fixtures and document the grammar.
  out:
    - Change Runtime transport or certificate trust policy.
acceptance_criteria:
  - {id: A1, text: Publishing proxy or Caido CA bundles with non-whitespace text fails with a field error.}
  - {id: A2, text: Go and Python contracts agree on shared valid and invalid CA fixtures.}
  - {id: A3, text: Valid one-to-eight certificate bundles still pass.}
tests:
  - {command: go test ./internal/runtimeconfig ./internal/contracts, covers: [A1, A2, A3]}
  - {command: cd runtime && .venv/bin/pytest tests/test_contracts.py, covers: [A2, A3]}
