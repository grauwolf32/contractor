schema_version: "1.0"
id: V4-009
title: Implement Workflow, Artifact, and live Run UI
milestone: server-ui-and-operations
priority: P0
status: planned
implementation_commit: null
depends_on: [V4-007, V4-008]
languages: [typescript, css]

goal: >-
  Deliver the ordinary user surface for selecting a Workflow, binding string
  parameters/artifacts and published execution overrides, starting/cancelling a
  Run, and inspecting live Stage/Planner/artifact/metrics progress.

context:
  authority: >-
    TanStack Query responses are authoritative. WebSocket lifecycle events are
    invalidation hints; plan events may update a typed timeline but gaps require
    REST refetch. Mutations never optimistically invent Run, StageExecution,
    artifact binding, or transition state.

scope:
  in:
    - Add Workflow list/detail and schema-driven Run form for string parameters and required/optional artifact slots.
    - Add UserScope artifact upload, exact-version selection, list/detail/download, and bounded text/YAML/JSON/Markdown/LikeC4 preview.
    - Add exact published Planner/Worker ModelPolicy/Gateway/credential override selectors and read-only escalation-profile display.
    - Generate stable idempotency keys per submitted draft and preserve them only for exact retry of the same request.
    - Add Run list/detail/cancel with ordered Stages/attempts, retry/escalation decisions, effective refs/origins, terminations, and frozen outputs/lineage.
    - Render immutable Stage objective as global task plus ordered Planner subtasks, current subtask, and active logical Worker dispatch.
    - Render safe Planner/Worker/Runtime metrics and artifact metadata without prompts/tool payloads/provider bodies/secrets.
    - Integrate WebSocket reconnect/dedup/gap resync with bounded backoff and manual refresh.
    - Add accessible loading/empty/error/terminal states and routed component tests.
  out:
    - Specialized OpenAPI/LikeC4 diagram rendering, Workflow editor, arbitrary JSON parameters, optimistic lifecycle changes, or administrative execution controls.

deliverables:
  - {path: ui/src/routes/workflows, description: Workflow selection and validated Run creation flow.}
  - {path: ui/src/routes/artifacts, description: UserScope artifact management, preview, and download.}
  - {path: ui/src/routes/runs, description: Run list/detail/cancel, Stage attempts, Planner plan, artifacts, and metrics.}
  - {path: ui/src/events, description: Resumable Run subscription integrated with query invalidation/resync.}

requirements:
  - id: R1
    text: Complex inputs travel as artifacts; the form accepts only strings for Workflow parameters with no coercion.
  - id: R2
    text: UI cannot enter free-form model, URL, budget, token, or provider parameter; only published exact refs are selectable.
  - id: R3
    text: Planner subtasks are visually nested inside one Stage attempt and never presented as additional Workflow Stages.
  - id: R4
    text: Artifact preview is bounded and safely rendered; original bytes remain available through explicit authenticated download.

acceptance_criteria:
  - id: A1
    given: OpenAPI Workflow requires source ZIP and one string objective.
    when: User uploads/selects source and submits.
    then: One idempotent Run is created with exact artifact version and only published config refs.
  - id: A2
    given: A live Router Stage.
    when: Plan/dispatch events arrive.
    then: Global task, ordered subtasks, current marker, and logical Worker update without exposing Runtime placement or model text.
  - id: A3
    given: WebSocket disconnect, duplicate, sequence gap, or Server restart.
    when: Client reconnects.
    then: It deduplicates or refetches authoritative detail and does not infer missing lifecycle state.
  - id: A4
    given: A terminal Run.
    when: Detail is viewed.
    then: Frozen outputs, lineage, exact attempts/decisions/config refs, terminations, and safe metrics are inspectable/downloadable.

tests:
  - {name: ui-unit, command: "cd ui && corepack pnpm typecheck && corepack pnpm test --run", covers: [A1, A2, A3, A4]}
  - {name: ui-build, command: "cd ui && corepack pnpm build", covers: [A1, A4]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
