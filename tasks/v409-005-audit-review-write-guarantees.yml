schema_version: "1.0"
id: V409-005
title: "Reject review decision writes when the locked request is not pending"
milestone: sql-review-2026-10
epic: audits
kind: defect
introduced_by: V343-001
priority: P2
status: in_progress
depends_on: []
languages: [go, sql]
goal: >-
  The review store appends a decision and marks its matching locked request
  decided together, or returns ErrPrecondition without adding a decision
  when that request is absent, belongs to another Audit or is not pending.
context:
  review: "docs/research/2026-10-23-sql-review.md, section C, recordReviewDecisionSQL"
  specification:
    - docs/spec/audits/review-and-reports.md#REV-R27
    - docs/spec/audits/review-and-reports.md#REV-R43
    - docs/spec/audits/review-and-reports.md#REV-R44
  severity: low
  finding: >-
    internal/auditstore/internal/pgstore/review_write_sql.go:18-30 inserts a
    decision in a data-modifying CTE before an outer UPDATE restricted to
    request.state='pending'. review_write.go:17-23 discards the affected-row
    count. A direct store call for an expired request can therefore return
    success and commit a decision while leaving the request expired.
    This is a store-boundary precondition defect: the production services
    already lock and validate the request before calling it.
  siblings: >-
    Finding and action decisions share RecordReviewDecision. The finding
    service locks the request and checks its state and database-clock expiry
    in internal/auditservice/finding_review.go:145-168 before writing at
    line 202; action_review.go:62-67,108 applies the same protections. Keep
    those checks and the surrounding transaction containing projections and
    events. ProjectFindingDecision scoping, review reads, collection receipts
    and artifact-link collision handling are outside this narrowed defect.
  validation: >-
    On main 1d533b2db885e0162ebabb01d36470f139546009, a real PostgreSQL
    Store.RecordReviewDecision probe against an expired request returned nil,
    left its state expired and inserted one decision. Public service bypass
    was not reproduced. Existing database-clock expiry tests passed. REV-R43
    requires the PostgreSQL clock under the request lock, not a single SQL
    timestamp function; no expiry-clock change is justified here. No
    reachable cross-source artifact-link collision was established.
  provenance: >-
    git blame traces the ungated statement to V343-001 commit
    5eb6154228e392bc56b5f87f071ede15dd5dd8b5; its later move into the internal
    pgstore package did not introduce this behavior.
plan:
  - >-
    Gate the INSERT on the matching request_id, audit_id and pending state
    under the existing request-lock contract. Check that the statement
    inserts the decision and advances exactly one request; classify an unmet
    precondition as ErrPrecondition rather than success. Preserve transaction
    atomicity, existing constraint errors and service-level replay handling.
  - >-
    Add real-store regression cases for an expired request, an already
    decided request with an existing decision, an absent request and an
    Audit mismatch. Include a valid pending decision and exercise both
    finding and action service paths without changing their authority rules.
scope:
  in:
    - "The shared review decision SQL, its store result handling and real PostgreSQL regression tests."
  out:
    - "Changing expiry predicates, lifecycle rules, review locks or database-clock semantics."
    - "Changing artifact-link keys, collision classification, receipts or replay identity."
    - "Unrelated parent-scope changes to finding projection writes."
acceptance_criteria:
  - id: A1
    text: >-
      Given an expired request and otherwise valid decision parameters, when
      the store write is attempted under the normal request lock, then it
      returns ErrPrecondition, inserts no decision and leaves the request
      unchanged; this regression fails against the original statement.
  - id: A2
    text: >-
      Given a decided request, an absent request or an Audit mismatch, when
      the same store method is called, then it returns ErrPrecondition and
      adds no decision or request update; a decision already stored for a
      decided request remains intact.
  - id: A3
    text: >-
      Given a matching pending request, when an authorized finding or action
      decision succeeds, then exactly one decision and the decided request
      commit with the existing projection and event effects. A surrounding
      transaction failure rolls them back, and existing service replay and
      expiry rejection tests continue to pass.
  - id: A4
    text: >-
      Given the implementation and task changes, when repository lint runs,
      then SQL placement, layer boundaries and task metadata checks pass.
tests:
  - command: >-
      CONTRACTOR_TEST_DATABASE_URL="${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL before running this task}"
      go test -tags=integration -count=1 ./internal/auditstore/... ./internal/auditservice/... ./internal/auditcontroller/...
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A4]
