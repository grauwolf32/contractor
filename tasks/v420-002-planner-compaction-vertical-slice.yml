  - docs/spec/configuration/agent-templates.md#TPL-R117
  implementation_boundary: Update owning numbered specifications, limits/errors/failure/lifecycle registries
    and every affected reader/writer with implementation. A planned extension is not current shipped behavior.
    No legacy readers, v1/v2 production branches, native SDK resume, new receipt store or model substitution.
    Scheduler retains claims, queues, Stage identities, transitions, retries and completed recovery; only configuration
    plumbing, mechanical imports and regression fixtures may change there.
  replanning_authority: 'User request 2026-11-07: reconcile the compaction backlog with merged refactors
    before implementation. This edit updates task scope and acceptance only; it does not start implementation,
    run live experiments or claim task completion.'
  review_baseline: Local main 1142c2681d6520baa8c04bb0a90ca8fd224deb29. Current owning specifications
    and merged code take precedence over historical proposal/spike descriptions; preserve recorded implementation
    and verification history. Recheck affected contracts if main changes before execution.
  current_state: 'The Planner implementation is merged through 217158c7f. V425-042 subsequently made
    Workflow executionConfig the sole Planner compactor-model source. The current checkpoint failure
    contract is PLN-R130: a lost marker acknowledgement fences the invocation, without append replay
    or continuation.'
scope:
  in:
  - 'One buildable vertical feature: selectable policy, pinned config plumbing, both modeled Planners, bounded
    retained evidence, compactor, safe continuation, basic diagnostics and meaningful real-store tests.'
  out:
  - Worker V417 implementation, terminal Planner mode, composite terminal fallback, passive compaction on passthrough
    escalation targets, cross-Stage history, SDK resume, new receipt/checkpoint tables or Scheduler scheduling
    changes.
requirements:
- id: R1
  text: Accept the implemented Stage plannerContextManagement none/compact@1 union with strict behavior-only
    authoring, exact instruction dependencies and sole model selection through Workflow/inline-escalation
    executionConfig (V425-042). Preserve current strict normalized snapshot encoding and immutable pins
    through Planner Invocation and the common Streamline/Router engine. Omitted authoring selects none;
    no compatibility reader or context-block model source.
- id: R2
  text: Enforce the per-owner mutual exclusion on authoring, persisted snapshot read and execution admission.
    Reject Planner terminal/summarizer settings, mixed branches, ignored compactor overrides on none and compaction
    for current model-free/passthrough Stage. Preserve independently configured Worker terminal summarization
    and existing summary escalation. A summary-continuation target may independently select Planner compaction
    under the 2026-10-31 user decision (V420-006); do not emit summarized=true from compaction.
- id: R3
  text: Require the selected main ModelPolicy context window for compact@1. Resolve the tool-free compactor
    exact policy/instructions using the effective Planner Gateway/credential and existing publication/pinning
    rules. Require compactor contextWindowTokens, positive maxOutputTokens strictly below its window, maxModelCalls=1
    per cycle and finite positive maxTotalTokens; forbid maxToolCalls and maxWorkerCalls. Main cumulative budgets
    remain additional authority. Assemble instructions, selected source groups and output reserve within the
    compactor own context limit, which may be smaller than the main model window. Use the admission rule proved
    in V420-001; lack of a safe fit fails before transport, without truncating required groups or replacing
    the model. No silently selected replacement model or new provider adapter.
- id: R4
  text: 'Implement the proven safe-boundary trigger: latest actual main prompt tokens only, no active dispatch
    or split tool pair, valid finish before compaction, original deadline/budgets checked before admission.
    Compactor tokens do not change the trigger measurement. Preserve one executionState, tools, plan/revision,
    session/StageExecution IDs, model/Worker counters and prepared handles through continuation.'
- id: R5
  text: Wrap every compactor call with explicit admission, cumulative MaxModelCalls/MaxTokens charging, safe
    Gateway classification and invocation-local telemetry; its own output/request limits add bounds but do
    not create a second total budget. Known usage is charged once even for rejected/truncated responses. Missing/inconsistent
    usage and budget exhaustion follow the frozen finite outcome.
- id: R6
  text: Keep deterministic protected input/current-subtask projection and a bounded read path for validated
    historical Worker results/exact ArtifactRefs. Summary text cannot add refs, change IDs/status/revision,
    authorize access or repeat a completed dispatch. Expose the reader only to the live Planner, with no new
    HTTP endpoint. Opaque cursors bind SessionID, context generation/index revision and selected view/Worker;
    invalid, foreign, stale or expired cursors return bounded tool errors without data or effects. Bound items
    and encoded bytes, and permit fragments only for archive reading, never to split an active prompt tool
    group. Use actual production readers for any new index/export; do not reinsert the whole plan or all prior
    results into every prompt.
- id: R7
  text: Use one rolling summary plus retained complete groups through the public adapter/projection selected
    by V420-001. Bound raw history, index, summaries, transient copies, each serialization/page and actual
    Gateway payload. Native ADK history retention is not a memory bound; stop with the owning limit error before
    exceeding the aggregate ceiling. Do not silently evict the only trusted result or split a required group.
- id: R8
  text: 'Verify the implemented compactor response admission: finite nonempty text, no tools/unsupported
    content, bounded output bytes, successful finish and consistent usage. Retain HTTP-level coverage
    for stop, length, content_filter, missing and unknown finish reasons, including known usage on rejection.
    The original decoder gap described in the spike is already addressed by the compactor path; do not
    restore it or rewrite ordinary main-response semantics. Invalid, truncated or demonstrably ineffective
    output ends with its current classified failure, without terminal fallback, semantic retry or hidden
    continuation.'
- id: R9
  text: 'Persist the required content-free checkpoint marker through the existing session adapter before
    exposing continuation; raw history and summary remain in RAM. Follow PLN-R130: any marker append failure,
    including commit followed by lost acknowledgement, fences further model/Worker work and candidate
    completion; never append the marker again or resume by read-back reconciliation. Rejection is planner_session_rejected;
    other append failures use planner_session_unavailable. A required finish append failure after checkpoints
    also forbids success.'
- id: R10
  text: Cancel/timeout and early stop close and join the Runner, main/compactor calls, serialization and any
    repair work before Planner returns. No post-terminal compaction or unowned detached repair; completed recovery
    stays model-free and unfinished process-loss recovery stays non-resumable.
- id: R11
  text: Keep summary/raw history out of durable facts, public timeline and closed telemetry attributes. Basic
    numeric counters/outcomes and safe error visibility ship here; V420-004 extends their presentation, not
    the underlying safety/accounting guarantee.
- id: R12
  text: Update owning PLN/WFL/TPL requirements, all relevant limits/errors/failures/lifecycle entries and strict
    shared schemas/fixtures atomically. Update public OpenAPI and regenerate both clients if affected authoring/resolved
    schemas are exposed; align existing UI readers without requiring a new editor. Planner-only policy stays
    Server-side and is not added to AllocationSpec without a real Runtime consumer.
- id: R13
  text: Validate the currently shipped Streamline/Router and summary-continuation selections delivered
    by V420-006 and the behavior-only context/model-source migration from V425-042. Do not recreate the
    removed duplicate compaction Workflow/policy examples or revert the catalog to opt-in-only. Keep snapshots
    strict and use fixtures for unit tests; any actual persistence transition follows current repository
    policy without legacy readers or implicit business-data reset.
- id: R14
  text: 'All mandatory safety cases already pass before this task completes: write failure near finish, budget
    exhaustion, cancellation, old exact refs, mixed-policy rejection, two compactions and no duplicate effects.
    Subsequent conformance tasks expand scale/fault coverage and cannot excuse knowingly incomplete contracts.'
failure_outcomes:
- operation: Compactor model call, checkpoint selection/append, history projection and continuation
  permanent: Empty/declined/tool-bearing/truncated/oversized/invalid output is a finite planner_compaction_failed
    outcome; exhausted cycle/retention limits use planner_compaction_limit_exceeded. Freeze stable codes/reasons
    in V420-001 and owning registries before implementation. Invalid session writes remain nonretryable
    planner_session_rejected. Never fall back to terminal summarizer or silently continue after an admitted
    failed checkpoint.
  retryable: Gateway/session outages retain their existing classified bounded recovery and PLN-R106 rules.
    Do not add semantic compaction retries, duplicate summary appends or model fallbacks. Total attempts/known
    usage and original deadline remain authoritative.
  ambiguous: A marker acknowledgement lost after commit ends the invocation with planner_session_unavailable
    and no candidate, further dispatch or marker replay (PLN-R130). Worker effects retain their own existing
    receipts; marker read-back does not authorize continuation.
  cancelled: Cancellation takes precedence; the Planner owner closes the iterator and joins main/compactor/persistence/repair
    work before return and cleanup. It cannot promise rollback of a dispatched remote effect.
  timeout: Use the original absolute Planner/Stage deadline and existing Server Planner Gateway request
    timeout, as in the implementation; LLMGatewayConfig has no requestTimeout field. Session-write and
    cleanup budgets keep their current owners, with no detached repair after return.
cardinality:
- collection: Invocation-local raw history, prior summaries and validated Worker-result/reference index together
  expected: Several dozen groups and two or more checkpoints within one ordinary Planner invocation.
  maximum: 'Initial design envelope to prove/freeze in V420-001: 4096 complete source groups and 32 MiB aggregate
    retained UTF-8/serialized data; 64 MiB accounted peak including bounded projections and transient copies;
    summary 16 KiB, recent tail 1 MiB, 1..16 recent groups default 4, 1..16 compactions default 8.'
  bound: Count shared backing data once and actual copies separately. Bound each scan, serialization, append
    and history page. Enforce existing 4-MiB actual Gateway-request bytes and stricter policy context window;
    compaction does not reclaim raw ADK history automatically.
- collection: Authoritative plan, validated results and existing durable session state
  expected: Default 32 subtasks, one current subtask/active dispatch and exact refs from completed Workers.
  maximum: 'Existing independent ceilings: 1000 subtasks, objective 64 KiB, subtask objective 8 KiB/instructions
    32 KiB, Worker result text 64 KiB/payload 256 KiB/128 refs, session JSON 2 MiB and 256 recorded fact digests.'
  bound: Do not inject the full plan/result index into each prompt or assume all independent maxima fit. Preserve
    exact full authority in its existing owner and expose bounded current projections/pages; enclosing overflow
    produces a classified failure before further effects.
lifecycle:
- entity: One Planner invocation context generation, checkpoint and bounded in-memory history/result index
  delete: Planner owner releases these on success, failure, cancellation or timeout after joining all local
    work.
  cascade: All history, summaries, paging cursors and retained validated result views are invalidated with
    that session; completed StageResult and existing receipts/artifacts retain their existing owners.
  retention: RAM only for raw context, summary and history index. No PostgreSQL transcript/checkpoint table,
    cross-Stage context service or partial restart recovery. Completed-result recovery remains durable and
    model-free.
acceptance_criteria:
- id: A1
  given: None, compact and malformed/mixed policy fixtures across supported selection scopes
  when: Authoring, pinning, snapshot read and Planner admission run
  then: Only the selected supported branch reaches execution; invalid settings fail before model/Worker effects
    and all exact dependencies/digests agree.
- id: A2
  given: Streamline and Router with a long controlled conversation
  when: At least two compactions and subsequent finish execute
  then: The same invocation continues with protected state and exact old refs; no repeated dispatch, counter
    reset or new Stage identity occurs.
- id: A3
  given: Main/compactor budgets, known rejected usage and original deadlines
  when: Calls are admitted and responses accounted
  then: Every admitted attempt/known token is charged once, trigger usage stays main-only and no work starts
    beyond a hard limit.
- id: A4
  given: Malformed summary and failed/ambiguous PostgreSQL append, including at finish
  when: Checkpoint creation/continuation is attempted
  then: Finite classified failure prevents next semantic calls and false candidate completion; no terminal
    fallback or blind append replay occurs.
- id: A5
  given: Cancellation during model, compactor, serialization and persistence
  when: Planner returns
  then: Every local operation has joined and raw context/index data is released; recovery contracts remain
    unchanged.
- id: A6
  given: At-limit/one-over data, canaries and exposed schemas
  when: Full relevant suites and schema generation checks run
  then: Item/byte/work limits and privacy hold, required clients/readers agree and unsupported Runtime wire
    fields are absent.
