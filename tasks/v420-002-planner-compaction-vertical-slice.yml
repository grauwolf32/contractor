test_prerequisites:
- Commands are future implementation acceptance, not checks completed by this planning change. Record exact
  revision, Go/ADK versions, module graph/checksums, commands, executed case counts, skips and outcomes. Required
  cases cannot be skipped or match zero tests.
- Use disposable real PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set for persistence acceptance; an unreachable
  configured database fails. Canonicalize TMPDIR as Makefile does. Full package suites accompany focused regressions.
  make test-streamline does not cover Router, so run all internal/planner packages too.
- Use actual pinned ADK Runner/tool dispatch and controlled Gateway responses. tests/integration/streamline
  uses a fake WorkerInvoker and does not prove a real Server/Runtime process. Register new process cases in
  the release graph and provide their fixtures/prerequisites.
- Use testdata and test-only pseudo-Skills rather than reading live configs. Use injected clocks, synchronization
  barriers and work/byte/row counters, not wall-clock assertions. Live Gateway benchmarks are outside deterministic
  acceptance; keep configured models unchanged.
- No dependency on Python V418 or Worker compaction V417 is implied. Cross-language regression uses the currently
  supported Runtime lock. New shared grammar or wire changes, if actually needed, must update all implementations
  and shared fixtures in the owning task.
decisions:
- >-
  2026-10-31 (lane cmp-planner): the resolved snapshot encodes none as an absent
  plannerContextManagement member, not as an explicit {strategy: none}; a snapshot that
  names none or a partial compact@1 branch is rejected on read. This keeps the snapshot
  bytes and every closure digest of existing Workflows unchanged (finding intake
  WorkflowClosureDigest, Audit consumer pins, scan service), so no migration or relabel is
  needed. The public read model always renders the branch, {strategy: none} included.
  Deviation from the frozen V420-001 wording; reopen if a reader needs an explicit none in
  the snapshot.
- >-
  2026-10-31 (lane cmp-planner): the compactor policy is a Planner execution-selection
  member, compactorModelPolicy (TPL-R117). The Stage's plannerContextManagement.modelPolicy
  is its lowest-precedence origin; Workflow executionConfig.planner, ExecutionConfig
  profiles, Run overrides and escalation may replace it; a selection that applies to no
  compact@1 Stage is rejected, as is any Worker or Agent selection. No deployment
  model-selection role for the compactor (the deployment defaults stay four roles). The
  compactor client has no Gateway recovery participant: a transient compactor failure ends
  the invocation with retryable planner_gateway_unavailable; reopen if live runs show
  transient compactor failures that need in-invocation retries.
- >-
  2026-10-31 (lane cmp-planner): compactor request timeout is the existing Server Planner
  Gateway request timeout plus the invocation deadline (LLMGatewayConfig has no
  requestTimeout field). Finish content_filter maps to reason empty (declined); a missing
  or unknown finish to invalid. A due trigger with no eligible prefix continues without a
  checkpoint; a due trigger after maxCompactions ends with
  planner_compaction_limit_exceeded (cycle). The history reader evicts the oldest of 8
  cursors instead of failing the ninth. A marker append whose acknowledgement is lost
  fences the invocation (planner_session_unavailable) rather than reconciling and
  continuing; the committed marker is never appended again.
- >-
  2026-10-31 (lane cmp-planner): the opt-in example ships as copy-to-load files beside the
  existing examples (configs/examples/streamline_compaction_workflow.yaml,
  configs/examples/planner_compactor_policy.yaml) with the loaded instruction resource
  configs/instructions/planner-compaction.md; the strict mirror is
  internal/config/testdata/planner-compaction. The CLI gate validated ./configs and a copy
  with both example files loaded. No bundled Workflow enables compaction.
- >-
  2026-10-31 (lane cmp-planner): the Eval managed schema ExecutionSelection gains
  compactorModelPolicy because Eval recipes reuse the Go ExecutionConfigPatch decoder;
  without it the shared decoder and the schema would disagree.
