schema_version: '1.0'
id: V245-001
title: Remove unreachable managed Eval interrupted state
milestone: eval-maintenance-2026-10
priority: P2
status: completed
implementation_commit: 5e5bf0e3c1174b7bd63e0f02e45af99d1256e8e7
depends_on: []
languages: [go, sql, json, yaml, typescript]
goal: Keep managed Eval lifecycle, persistence, API, UI, and specification aligned with states the coordinator can actually enter.
context:
  issue: https://github.com/grauwolf32/contractor/issues/221
  finding: No production path writes the experiment state interrupted, but the lifecycle and public contract still advertise it.
scope:
  in:
    - Remove interrupted from managed Eval state handling and generated contracts.
    - Add a forward migration that rejects interrupted experiment rows.
    - Update Eval fixtures, UI polling, and lifecycle documentation.
  out:
    - Change unrelated workflow, stage, import, or audit interruption states.
acceptance_criteria:
  - {id: A1, text: Managed Eval state enums and lifecycle no longer expose interrupted.}
  - {id: A2, text: The database rejects an experiment state of interrupted after migration.}
  - {id: A3, text: Eval API and UI generation and focused tests pass.}
tests:
  - {command: go test -race -count=1 ./internal/evaldomain/... ./internal/evalstore/... ./internal/evalservice/... ./internal/evalcoordinator/... ./internal/httpapi/public/..., covers: [A1, A3]}
  - {command: go test -race -count=1 ./internal/persistence/postgres/..., covers: [A2]}
  - {command: corepack pnpm --dir ui generate:check && corepack pnpm --dir ui typecheck && corepack pnpm --dir ui test --run, covers: [A3]}
