schema_version: '1.0'
id: V392-002
title: Derive structural site and qualified snapshot issue anchors from exact source
milestone: finding-correlation-2026-10
epic: code-analysis
kind: feature
priority: P2
status: in_progress
depends_on:
- V392-001
languages:
- go
- python
- yaml
- markdown
goal: Compute structural anchors from exact retained code using pinned parsers, separating reproducible site candidates from qualified issue identities
  so independent paths sharing a sink are not automatically equated.
context:
  request: User selected deterministic structural anchors and automatic preservation-based duplicate marking on 2026-10-22.
  proposal:
  - docs/proposals/0028-finding-analysis-and-sarif.md#structural-anchors-from-exact-source
  - docs/proposals/0028-finding-analysis-and-sarif.md#unchanged-worker-tool-contract
  specification:
  - docs/spec/findings/findings.md#FND-R14
  - docs/spec/findings/findings.md#FND-R41
  - docs/spec/findings/findings.md#FND-R168
  - docs/spec/findings/findings.md#FND-R173
  - docs/spec/tools/code-analysis.md
  - docs/spec/tools/workspace.md
  - docs/spec/execution/worker.md
  - docs/spec/platform/limits.md
scope:
  in:
  - Closed exact-source anchor selector, Python/JavaScript/TypeScript parser profiles, canonical site keys and explicit ambiguity/unsupported
    diagnostics.
  - Optional qualified snapshot issue key only with registered machine-derived rule and complete issue context, including a genuinely node-local
    deterministic check where applicable.
  - Deterministic code-finding publisher integration, bounded receipt-owned derivation, hidden closed derived_anchors private-submission field,
    authenticated producer binding and Server projection validation using V392-001 boundaries.
  - Per-language regression corpus, cross-language hash/provenance fixtures and owning source/finding/limits/error/producer contract updates.
  out:
  - LLM-authored context/discriminators, heuristic symbol/line remapping, a new generic taint engine and cross-snapshot structural automatic grouping.
  - Unimplemented parser profiles advertised as supported, full finding-analysis/SARIF machinery and workspace requirements for generic/HTTP findings.
requirements:
- id: R1
  text: Resolve an explicitly selected exact source/file/region into one actionable AST node under a pinned language/grammar/normalizer profile.
    Definition-only, missing, error-containing or ambiguous selections produce availability reasons rather than first-node selection or a guessed
    symbol.
- id: R2
  text: Canonicalize ordered kinds/fields/meaningful tokens, exact identifiers/literals, enclosing signature and structural child path. Ignore
    offsets and syntax-insignificant trivia only; preserve significant indentation, literal whitespace, directives and semantic comments. Scanner
    output order is never a component.
- id: R3
  text: Expose a site key as candidate evidence only. A snapshot issue auto-key additionally requires exact snapshot identity, stable rule ID
    and registered machine-derived complete issue context; a shared sink/function/CWE, model prose or incomplete source-to-sink path cannot qualify.
    Initial cross-snapshot structural matches remain candidates.
- id: R4
  text: Wire the helper into the existing code-finding publisher and retain exact source/selector/version/derivation evidence. Parsing runs off
    the event loop before intake/group locks. Share lower/common parser helpers without direct imports between toolsets; The hidden derived_anchors
    field is generated only by the helper; Server stamps authenticated intake provenance and generic Artifact writes cannot forge it. Go validates
    closed derived records/provenance rather than reimplementing AST normalization.
- id: R5
  text: Cover Python, JavaScript and TypeScript separately with pinned fixtures, including repeat identical statements, overloads/anonymous scopes
    and significant syntax. Unsupported languages and unavailable contexts preserve ordinary findings. Model/tool output cannot forge the deterministic
    producer binding used for auto-keys.
- id: R6
  text: Extend api/testdata/finding-fingerprint-cases.json and a per-language structural corpus through actual Runtime parsing and Server record/provenance
    validation. Update finding/code-analysis/limits contracts and fixture consumers atomically, preserving independent Audit triage and all observations.
- id: R7
  text: Keep complete model-visible finding/list_findings declarations and required/optional arguments and response shapes unchanged. Publisher
    code builds all private matching metadata from existing inputs; the Worker authors no descriptors and duplicate collection entries remain
    readable.
failure_outcomes:
- operation: Parse source, retain deterministic derived evidence and submit through existing intake
  permanent: Malformed/foreign selectors or forged/inconsistent derivations use existing document/reference errors and publish no partial receipt;
    unsupported parser, ambiguous actionable node and missing issue context are explicit unavailable/candidate-only results.
  retryable: Existing Artifact/intake storage retry classes and finite bounds apply; parser ambiguity and unsupported semantics never trigger
    model or alternate-parser fallback.
  ambiguous: Reuse exact prepared artifacts/submission bytes and reconcile the existing intake receipt, without reparsing a newer source or allocating
    another proposal key.
  cancelled: Cancel and join bounded parsing and Artifact operations before release, preserving existing truthful cancellation/unavailability
    semantics and already committed evidence.
  timeout: Apply existing parser/file deadlines and finite selected-source preparation budget independently from intake/read budgets; no parse
    occurs while holding mutation locks.
cardinality:
- collection: Selected source anchors and source bytes per proposal
  expected: One precise actionable location and a small number of supporting source regions.
  maximum: 32 selected anchors and 8 MiB of distinct parsed source, with existing stricter per-file/archive/evidence bounds and 16 KiB selector/derived-record
    caps.
  bound: Parse only selected files once per exact digest, discard ASTs after compact derivation, cap contexts/serialized records and never traverse
    the whole workspace or call graph.
- collection: Parser profiles and machine issue contexts
  expected: Three initial language profiles and a small explicit registry of admissible context schemes.
  maximum: Python, JavaScript and TypeScript in the first slice; only registered qualified contexts can emit auto-keys.
  bound: One deterministic profile per selected file and finite context selectors; no Cartesian path enumeration or cross-language heuristic fallback.
lifecycle:
- entity: Derived anchor evidence and receipt key projection
  delete: Existing owned source/evidence/receipt lifecycle applies without live allocation graph IDs or a new anchor entity.
  cascade: Discard/purge clears derived sensitive contents with existing evidence/projections; another Audit's held exact source remains usable.
  retention: Immutable selected source and parser/normalizer versions are retained with Audit-held evidence; edits and later parser upgrades never
    rewrite previous keys or coordinate claims.
acceptance_criteria:
- id: A1
  given: Python, JavaScript and TypeScript exact sources with line/comment shifts, literal/token changes, duplicate statements, nested/anonymous
    symbols and meaningful directives.
  when: Production pinned profiles derive site anchors repeatedly.
  then: Canonical outputs follow each profile's fixtures, significant differences remain distinct, unrelated ambiguity yields an explicit reason
    and no LLM is invoked.
- id: A2
  given: The same sink reached from independent inputs, incomplete path context, an admissible node-local check and different exact source snapshots.
  when: Site and issue-context derivation runs.
  then: Shared sites without complete machine context remain candidates, qualified same-snapshot issues receive reproducible auto-keys and cross-snapshot
    structure never claims automatic equality.
- id: A3
  given: A real code-finding publisher, exact selected evidence and a Server intake validating trusted deterministic producer bindings.
  when: Anchors are emitted/read/replayed alongside ordinary generic/HTTP/no-anchor findings.
  then: Exact derived evidence and availability survive the production path, forged artifacts cannot qualify, unsupported cases preserve the finding
    and no model-visible required arguments are added.
- id: A4
  given: File/byte/anchor limits, parser errors, source mismatch, cancellation, release and source deletion with an Audit hold.
  when: Derivation/intake and lifecycle overlap.
  then: Work remains bounded off the event loop and outside mutation locks, cleanup joins parsing, failures are correctly classified and retained
    Audit evidence/keys stay valid independently.
- id: A5
  given: Provider/schema and success/error/reader fixtures pinned before publisher changes.
  when: The actual provider builder and Runtime/Server publisher/reader handle equal keys, unavailable optional inputs and replay.
  then: Complete model-visible contracts match pinned fixtures; optional preparation limits preserve valid ordinary findings and every independent
    observation survives.
tests:
