implementation_decisions:
- Retain the compact derivation inline on the existing receipt, referencing already selected exact evidence. A separate prewritten Artifact would change evidence counts and replay/lifecycle behavior; export can materialize the retained projection later. No new receipt mechanism or model-visible argument is introduced.
- Qualify only an explicit node-local private-key literal check with sole CWE-321 classification, one source location and no extra issue claims. Other structural matches remain candidate sites.
- The optional publisher uses cached parser assets only. The shared runtime-venv prerequisite prefetches the existing pinned language registry during dependency preparation, avoiding a cold downloader inside either publication or capability tests.

verification:
  date: '2026-10-22'
  status: passed
  checks:
  - Full Go suites of auditdomain, findingintake, auditservice, auditimport, persistence/postgres, privateartifacts and public passed with integration tags and the disposable PostgreSQL URL; database checks were not skipped.
  - Real PostgreSQL proves equal-key independent observations, foreign/changed source rejection, immutable projection writes, unchanged receipt wire, byte-identical replay, retained keys after source deletion, independent Audit holds, representative-independent purge and sensitive discard after the last hold.
  - Migration from version 22 preserves existing receipt contents and fingerprints, marks anchors not_recorded, and keeps strict immutability/discard behavior.
  - Python/JavaScript/TypeScript corpus and shared Go/Runtime canonical vectors passed; structural sites alone expose issue_context_unavailable, and qualified local issue keys change with the exact snapshot.
  - The actual code facade prepares hidden metadata, preserves its provider declaration and visible response, reads exact source once, and retries a lost intake response with identical bytes.
  - Final make test-runtime passed under an unprivileged Linux user with locked dependencies and prefetched pinned grammars; 4175 passed and 53 optional environment checks skipped.
  - make test-findings-e2e passed all 14 mandatory process cases; make verify-public-api and ui-verify passed.
  - Final make lint and test-wire-cross-language passed; 240 fixtures, 216 Go and 167 Python shared tests, and 300 Runtime wire tests passed.
  earlier_failure: A cold-cache Linux run failed one code-analysis capability assertion (4173 passed, 1 failed). Parser preparation is now explicit in runtime-venv; publication tests prove a missing cache never initiates grammar loading. The final full Linux target passed.
  boundary: All source parsing and canonicalization stay in Runtime common code; Server verifies closed metadata, exact evidence and authenticated intake authority. No Worker tool or configured model change, LLM call, new receipt or global issue entity is introduced.
