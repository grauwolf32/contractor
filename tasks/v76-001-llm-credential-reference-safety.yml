schema_version: '1.0'
id: V76-001
title: Validate and fence RuntimeConfig LLM credential references
milestone: llm-credential-reference-safety-2026-10
priority: P1
status: completed
implementation_commit: d18405296eecb350af1373c1b2453470dc5d2107
depends_on: []
languages: [go, sql, typescript]
goal: Keep published and bound RuntimeConfigs from referencing unavailable LLM credentials and prevent deletion of credentials still selected by active labels.
context:
  issue: https://github.com/grauwolf32/contractor/issues/319
  finding: Publication and binding omit the LLM credential lookup; LLM deletion omits active RuntimeConfig labels and has no cross-replica reference fence.
scope:
  in:
    - Validate LLM credential existence, identity and Gateway in the publication and binding transactions.
    - Serialize label reference commits with delete preparation in PostgreSQL.
    - Include active binding labels in credential deletion conflict details and recheck before remote deletion.
    - Show safe referencing labels on the credential deletion screen.
    - Cover missing, tombstoned and mismatched credentials, binding revisions, deletion, rebind and concurrent operations.
  out:
    - Change Runtime credential deletion or Gateway manager protocols.
acceptance_criteria:
  - {id: A1, text: Publication rejects missing, deleted and Gateway-mismatched LLM credentials without storing a version.}
  - {id: A2, text: Label create and rebind reject unavailable or mismatched credentials without changing the binding revision.}
  - {id: A3, text: Delete returns credential_in_use with active binding labels and leaves the credential and remote key untouched.}
  - {id: A4, text: Rebinding away permits deletion and concurrent binding/delete operations cannot leave a dangling reference.}
tests:
  - {command: go test ./internal/runtimeconfig ./internal/credentials ./internal/httpapi/public ./internal/app, covers: [A1, A2, A3, A4]}
  - {command: go vet ./internal/runtimeconfig ./internal/credentials ./internal/httpapi/public ./internal/app, covers: [A1, A2, A3, A4]}
  - {command: cd ui && corepack pnpm exec vitest run, covers: [A3]}
  - {command: cd ui && corepack pnpm typecheck, covers: [A3]}
verification:
  postgres: Full Go suite passed with PostgreSQL; focused credential and API tests passed under the race detector.
  ui: All 687 Vitest tests, typecheck, lint, generated-client check and production build passed.
