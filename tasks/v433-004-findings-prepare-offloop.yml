schema_version: "1.0"
id: V433-004
title: Move findings collection preparation and projections off the event loop
milestone: runtime-resource-bounds-2026-11
epic: findings
kind: defect
introduced_by: V43-003
priority: P2
status: in_progress
depends_on: [V432-001]
languages: [python, markdown]
goal: Preparing a full findings collection leaves the Runtime event loop available while retaining exact Artifact references and cancellation ownership.
context:
  authority: >-
    User request 2026-11-02: recheck synchronous findings preparation and create
    a task to move decoding and projection construction to to_thread_until_done.
    This is scheduling/ownership work, not a change to Finding domain semantics.
    User decision 2026-11-02: implement the CPU parsing P2s in the existing
    codex/runtime-shutdown-deadline branch before merging it.
  specification:
    - docs/spec/findings/findings.md#FND-R122
    - docs/spec/findings/findings.md#FND-R123
    - docs/spec/findings/findings.md#FND-R129
    - docs/spec/execution/runtime-agent.md#RTA-R87
    - docs/spec/execution/runtime-agent.md#RTA-R124
    - docs/spec/platform/failure-model.md
  finding: >-
    On main 57634940d40862fb638d4beea212e53a5107994a,
    toolsets/security_findings/reader.py:48 calls decode_collection directly
    inside async prepare_reader. ZIP inflation, JSON/canonicalization, digest
    and cross-reference validation execute on the event loop. The later
    retained-document digest comparisons and item/preview projection loop
    at :131-168 are also synchronous. A real ArtifactClient/collection fixture
    probe confirms both decoding and preview construction use the loop thread.
  origin: git blame attributes synchronous preparation to V43-003 implementation 89c4dcae60d3e8b000b81f43ed18fce5cd4b382a.
  siblings: >-
    Include initial collection decoding, retained/exact document verification
    and preparation projections. Inspect ListFindingsTool.__call__ filtering,
    canonical page sizing and deepcopy as the same collection's projection
    path; move significant bounded CPU chunks through the same existing
    helper rather than leaving a sibling event-loop stall. Keep async Artifact
    I/O and tool metrics in their owners. Pure decode_collection stays a
    synchronous function for non-async callers; this task moves async callers.
  boundary: >-
    Findings adapter owns package parsing and preview projection. The event
    loop owns ordered async Artifact reads/create-only writes and publication
    of complete prepared tools. Use threads.to_thread_until_done, joining any
    started thread through repeated cancellation before allocation ownership
    can be released. Preserve main's Project Finding snapshots and existing
    Artifact receipts/CAS; do not take over the in-progress V64-014/V425-034.
  decision: >-
    Decode and prepare projections in one owned thread operation per phase,
    and build each requested page in one operation. Verify a retained/exact
    document in an owned thread only on the existing reconciliation path,
    preserving its fail-fast read/write order; successful new writes add no
    per-document thread dispatch. A reader-local lock preserves the previous
    atomic call/close lifecycle while joined CPU work executes. The simpler
    bare to_thread alternative is rejected because caller cancellation could
    detach CPU work and release its resources. Reopen only if measured bounded
    work still requires stronger scheduling isolation; no process pool or hard
    interpreter-lock latency guarantee is introduced.
scope:
  in:
    - Offload ZIP/JSON/canonicalization, digest verification and projection construction through joined worker threads, avoiding one thread dispatch per tiny row.
    - Preserve validate-all-before-materialization, exact current-Run refs, ordered create-only reconciliation, bounded page cursors and detached returned projections.
    - Keep partial preparation invisible and preserve existing cleanup/fencing behavior on cancellation, invalid packages, ambiguous writes and store denial.
    - Add real ArtifactClient preparation regressions with thread identities, event barriers, repeated cancellation and realistic/max-bound collection fixtures; retain shared Go/Python golden semantics.
    - Document the asynchronous preparation ownership boundary in the findings specification without claiming a hard heartbeat-latency guarantee from thread offloading alone.
  out:
    - New Finding states or deduplication rules, new collection formats, larger limits, parallel Artifact-write fan-out, a process pool or changes to Project Finding command ownership.
failure_outcomes:
  success: Only a fully validated/materialized reader is exposed; previews, digest, exact refs, ordering and cursors remain identical.
  permanent: Malformed ZIP/JSON, digest/reference mismatch and deterministic store denial keep their current classified errors and never expose a partial tool.
  retryable: Keep existing retryable Artifact failures and create-only reconciliation; thread scheduling adds no semantic retry.
  ambiguous: Verify an existing exact Artifact receipt/bytes using the current algorithm; never blindly append or publish a fabricated revision.
  cancelled: Join decoding/verification/projection threads, including after repeated cancellation, before allocation rollback or lock release; no new materialization starts after cancellation is observed.
  timeout: Existing preparation/stop deadlines retain authority; if owned work cannot be joined, existing allocation fencing remains responsible rather than abandoning a thread.
cardinality: >-
  Preserve 16-MiB ZIP, 32-MiB expanded archive, 1-MiB collection JSON, at most
  1,023 documents and existing entry limits; list_findings returns at most
  100 whole items and 256 KiB. Exercise realistic hundreds of documents plus
  exact-limit/limit-plus-one admission; do not infer a latency bound from tiny fixtures.
acceptance_criteria:
  - id: A1
    given: A realistic large and maximum-admitted findings collection is prepared through the real ArtifactClient.
    when: Decoding, verification or preparation/page projection runs.
    then: The heavy operation executes outside the event-loop thread; deterministic barriers prove the loop can advance while the operation is paused, without wall-clock assertions.
  - id: A2
    given: Decoding/projection or reconciliation is blocked, fails, or receives repeated cancellation during allocation preparation.
    when: Preparation unwinds or shutdown begins.
    then: Started CPU work remains joined until settled, ownership is not released early, no partial reader is exposed and existing classified failure/fencing behavior remains correct.
  - id: A3
    text: Golden package bytes, Project Finding snapshot metadata, exact document refs, ambiguity/denial handling, page sizes/cursors and detached projections remain unchanged; new scheduling regressions fail on current synchronous preparation.
tests:
  - command: cd runtime && uv run pytest -W error tests/test_findings_reader_scheduling.py tests/test_findings_reader_toolset.py tests/test_security_findings_toolset.py tests/test_finding_tool_contracts.py tests/test_allocation.py tests/test_threads.py
    covers: [A1, A2, A3]
  - command: make test-wire-cross-language
    covers: [A3]
  - command: make lint
    covers: [A1, A2, A3]
