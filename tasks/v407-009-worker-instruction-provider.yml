schema_version: '1.0'
id: V407-009
title: Pass authored Worker instructions literally to ADK
milestone: server-runtime-review-2026-10
epic: planner-worker
kind: defect
introduced_by: V13-001
priority: P1
status: pending
depends_on: []
languages:
- python
goal: Accepted Worker instruction text containing braces reaches the model unchanged instead of being
  interpreted as ADK session-state placeholders.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/worker.md
  validation: 'Revalidated against main dc7012e8 on 2026-10-23. Confirmed with real ADK 2.8.0: instruction
    containing {path} fails as worker_execution_failed before any model call. The shipped catalog currently
    has no such trigger; this is a supported custom-instruction path.'
  severity: medium
  finding: runtime/src/contractor_runtime/worker/runtime.py:211-215 gives LlmAgent a plain instruction
    string. ResolvedInstructions accepts arbitrary nonempty text (contracts/settings.py:117-120), but
    ADK 2.8.0 instructions_utils.py:158-174 expands {identifier} from session state and raises KeyError
    when absent. A real-runtime probe using Inspect the literal {path}. produced worker_execution_failed
    and zero model calls. worker/summarizer.py already passes an instruction provider under TPL-R51. The
    finalizer also passes a string (finalizer.py:96), but its static instruction at19-25 contains no braces
    and has no current failing input. Go Streamline already uses InstructionProvider (internal/planner/streamline/planner.go:287-289).
  siblings: Check every Runtime LlmAgent construction for authored instruction text; change reachable
    authored-text paths or document why the instruction is a fixed safe constant. Summarizer and Go Streamline
    already preserve literal text and should retain their semantics.
plan:
- Pass the main Worker authored instruction through an ADK instruction provider, preserving exact text
  including brace sequences and JSON examples.
- Inspect sibling LlmAgent sites. Preserve the existing literal summarizer provider and Go provider; optionally
  use the same literal pattern for the static finalizer if that simplifies the boundary, without claiming
  a current finalizer failure.
- Document literal authored instruction delivery in the Worker/AgentTemplate contract. Keep braces accepted;
  do not add a regex grammar or Server/Runtime rejection rule for text this fix is meant to support.
- Add real ADK-runner tests with a scripted model for {path}, repeated braces and JSON examples, including
  a session containing a matching key with a different value. Verify the model receives exact instruction
  text and the invocation can complete.
- Keep helper extraction limited to actual production callers; do not create a generic exported abstraction
  for one trivial provider.
scope:
  in:
  - Literal delivery of authored Worker instructions and regression coverage through the real ADK runner.
  - Sibling construction audit and the owning instruction-text contract clarification.
  out:
  - Banning braces, introducing a new instruction grammar, changing Go/Runtime validation rules or modifying
    shipped prompt content.
  - Claiming a current failure in the brace-free static finalizer or changing ADK session semantics beyond
    instruction rendering.
  - Unrelated shared-helper cleanup; finalizer provider normalization is optional and not evidence required
    for closing the defect.
acceptance_criteria:
- id: A1
  text: A real ADK Worker invocation with {path} in its accepted instruction succeeds with a scripted
    model and sends the exact instruction text; it does not fail before the first model call.
- id: A2
  text: Brace/JSON examples and a matching session-state key do not alter authored instruction text. Existing
    summarizer literal-text behavior and static finalizer output remain unchanged.
- id: A3
  text: The main Worker regression fails on the unfixed implementation; every sibling construction is
    covered by the literal rule or recorded as a fixed safe constant. Documentation agrees that braces
    remain accepted.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_adk_runtime.py tests/test_worker_summarizer.py
    tests/test_settings.py
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
