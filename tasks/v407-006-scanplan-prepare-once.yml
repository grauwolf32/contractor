schema_version: '1.0'
id: V407-006
title: Reuse one parsed OpenAPI source across an Audit inventory operation batch
milestone: server-runtime-review-2026-10
epic: scan-tools
kind: chore
introduced_by: V62-001
priority: P2
status: in_progress
depends_on: []
languages:
- go
goal: Prepare one bounded Audit scan inventory with one source parse and reusable source digest while
  preserving operation-specific results and exact identities.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/tools/scanners.md
  validation: Revalidated against main dc7012e8 on 2026-10-23. Repeated source parsing and hashing in
    the inventory loop is confirmed by the call graph. Its elapsed-time impact was not measured. PrepareOpenAPIScanTask
    already prepares one selected operation per invocation.
  finding: internal/auditdomain/openapi_scan.go:51-52 calls AuditScanSettings.PrepareOperation for each
    selected operation. audit_settings.go:166-188 reaches prepare.go:36,50,66,92, which parses the source,
    normalizes options, hashes the full source and sorts/walks paths again. Limits allow 1000 operations
    and 2 MiB source (scanplan/types.go:7,11), so source-size work repeats per operation. PrepareOpenAPIScanTask
    (openapi_scan.go:103-114) has only one operation per call and is not a second 1000-operation loop.
    AuditScanSettings.PrepareOperation accepts data, mediaType and source on each call; caching only by
    settings identity or unconditional sync.Once would incorrectly reuse a previous source.
  siblings: PrepareOperation and PrepareOperationTarget must share the same source parsing/identity rules
    while keeping their distinct digest bases and coverage semantics. Keep the single-item Run-time caller
    correct; an unbounded process-wide cross-Run cache is not needed.
plan:
- Create an immutable prepared-source value scoped to one inventory build, containing validated parsed
  content, source digest and a bounded operation lookup index. Keep operation-specific options, reference-work
  budgets and coverage accumulation separate.
- Build that value once before BuildOpenAPIScanInventory loops over selected pointers; retain the existing
  public entry points with per-call identity validation and equivalent output. Do not bind a settings
  object permanently to the first source passed to it.
- Reuse common preparation code in the single-item Run-time path without claiming a repeated-operation
  saving there. Preserve byte-identical preparation/request/plan digest bases and existing invalid-input
  classes.
- Add test-only parse/source-digest counters for an accepted 1000-operation source close to 2 MiB, plus
  JSON/YAML fixtures, different bytes/media types/exact refs with the same settings, and concurrent independent
  preparations. Keep counters in export_test.go or package tests.
- Add a reproducible benchmark recording allocations and elapsed time as observations; make acceptance
  depend on deterministic counts and output parity rather than a machine-specific latency threshold.
scope:
  in:
  - Inventory-local reuse of source parsing, hashing and pointer lookup across selected operations.
  - Deterministic work-count tests and digest/result parity for JSON and YAML.
  out:
  - Changes to accepted scan inputs, limits, result schemas, coverage or digest fixtures.
  - An unconditional settings-only cache, unbounded cross-Run cache, or claims that the single-item Run-time
    path already loops over 1000 operations.
acceptance_criteria:
- id: A1
  text: Preparing an accepted 1000-operation inventory parses the source once and computes the source
    content digest once for preparation; unrelated existing final inventory packaging/digest work is accounted
    separately. The count regression fails on the repeated-preparation implementation.
- id: A2
  text: Existing golden preparation/request/plan outputs and error classifications are unchanged for JSON
    and YAML, including missing concrete values and unselected reference-work limits.
- id: A3
  text: The same settings used with different source bytes, media types or exact refs produces the corresponding
    fresh result, and concurrent independent preparations share no mutable state.
- id: A4
  text: The prepared-source lifetime and row/byte bounds are explicit; the single-item Run-time path remains
    correct without a process-wide cache. Benchmark results are recorded without a timing pass/fail threshold.
tests:
- command: go test -count=1 ./internal/scanplan/... ./internal/auditdomain/... ./internal/planner/scan/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
