schema_version: '1.0'
id: V490-004
title: Move allocation domain services to typed gRPC
milestone: server-runtime-grpc-2026-11
epic: api-contracts
kind: feature
priority: P1
status: pending
depends_on:
- V490-003
languages:
- go
- python
- protobuf
- markdown
goal: Runtime tools and Planner callbacks reach the existing Server domain owners through gRPC with unchanged
  allocation authority and receipts.
demonstration: Real Router/Streamline Planner callbacks dispatch a Worker and commit plan facts once under
  a lost reply; ordinary finding, Audit and sitemap submissions return their existing durable receipts.
context:
  authority: 'User decision 2026-11-27: plan and implement gRPC for Server/Runtime, preserve A2A. Direct connectivity
    through the existing overlay is an architectural fact, not new scope. NAT, reverse tunnels and removal
    of A2A were explicitly rejected. Implementation does not authorize deployment or merging main. The task
    decomposition and typed protobuf design are agent proposals.'
  proposal: docs/proposals/0038-server-runtime-transport.md
  specification:
  - docs/spec/execution/control-plane.md#CTL-R163
  - docs/spec/execution/runtime-agent.md#RTA-R75
  - docs/spec/platform/security.md#SEC-R5
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md#PER-R24
  baseline: main 9fd3ac96d32c696fa39988df85e32f6bb6d1d83b
scope:
  in:
  - Migrate Planner operations, gateway recovery, Audit evidence/judgments, finding proposals/reads/selections,
    sitemap mutations/snapshots/observations, Artifact list/metadata/access.
  - Keep provider parsing in Runtime adapters and domain rules in existing Server owners; replace HTTP adaptation
    without feature-specific stores.
  - Use typed request shapes and explicit pagination/preconditions; preserve raw JSON only where it is the
    domain document itself or the official A2A DataPart contract.
  - Maintain Project read grants, current/exact ArtifactRefs, contentCacheKey, fencing and existing sequence/idempotency
    semantics.
  out:
  - Artifact payload streaming is V490-005; public HTTP/WebSocket and model/Gateway traffic do not change.
requirements:
- id: R1
  text: Preserve existing component/domain ownership, mTLS role and principal checks, allocation fencing, receipts,
    canonical JSON digests and effective deadlines. Update each changed owning spec and cross-language fixture
    in the same implementation.
- id: R2
  text: Use standard A2A gRPC, direct overlay connectivity and no legacy fallback. No generic HTTP-over-gRPC
    tunnel or second workflow execution engine.
failure_outcomes:
- operation: Each migrated RPC and stream
  permanent: Invalid request/identity/permission and deterministic store rejection retain a stable domain code
    in gRPC details and are never retried. The V490-001 contract defines the status mapping.
  retryable: Use existing caller attempt/backoff bounds and effective deadline; no blanket automatic replay/hedging.
    Transport reconnect is not mutation retry.
  ambiguous: Reuse existing operation-specific receipts, sequence, lifecycle ID or Artifact expected revision.
    A lost reply is not proof of non-commit; do not resubmit with a new identity.
  cancelled: The existing operation owner fences, cancels and joins tasks before releasing allocation or transfer
    resources. RPC cancellation alone is not proof of Worker termination.
  timeout: Keep request, invocation/Stage, heartbeat lease and finalization/abort budgets separate; a channel
    reconnect never extends them.
cardinality:
- collection: Runtime allocations and in-flight operations
  expected: 1-4 slots per process; one active A2A Task per Worker
  maximum: Existing domain bounds in docs/spec/platform/limits.md; process capacity 4, heartbeat reconciliation
    actions 8, Artifact payload 64 MiB, Server payload transfers 4.
  bound: Bound pending RPC admission, messages, aggregate bytes and per-stream buffers explicitly in V490-001/owning
    spec before production implementation. Existing domain limits are not replaced with gRPC defaults.
lifecycle:
- entity: gRPC channels and request/stream owners
  delete: Process shutdown closes owned channels after the Scheduler/Workers stop; releasing one allocation
    must not kill sibling slots.
  cascade: Cancel/join active work and release transfer permits through the existing owners.
  retention: No new durable entity, receipt or queue. Existing report and Artifact retention stays with its
    domain.
acceptance_criteria:
- id: A1
  text: Shared Go/Python fixtures reject missing required values, unknown enums/fields, invalid identities,
    bounds and foreign allocation authority.
- id: A2
  text: Real PostgreSQL tests prove lost-reply receipt replay, stale revisions, cancellation and domain-specific
    transaction conflicts without duplicate side effects.
- id: A3
  text: Full Planner, findings, Audit, sitemap and Artifact metadata suites pass through the new adapters;
    tool and headless boundaries remain transport-independent.
tests:
