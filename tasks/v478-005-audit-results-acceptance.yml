scope:
  in:
  - Update existing public Task/material/result reads and Audit UI consumers for current assignments, exact
    selected evidence, model/system authorship, stop reasons and unresolved judgments.
  - Render explicit gaps in ordinary retained snapshots without a new report store or mandatory finalization
    model.
  - Register deterministic real Server/Runtime/PostgreSQL process cases and truthful report verification in
    the existing release graph.
  - Review active callers and retire superseded result assembly, names and duplicated coverage logic; maintain
    generated API clients through their generators.
  out:
  - Independent HTTP setup redesign, endpoint discovery, new dashboards, global traffic accounting or automatic
    security certification.
  - Live-model quality claims, new demo deployment/audit, and prerequisites on optional sitemap/browser/scanner
    integration.
  - Mandatory frozen-plan authoring or admission, new criterion fields and planning tools.
requirements:
- id: R1
  text: Display technical attempt outcome, accepted result, evidence persistence and semantic conclusion as
    separate facts. Label system interruption as no accepted conclusion, not a model uncertainty assessment.
- id: R2
  text: Show known assignments and explicit unresolved judgments/limitations without inventing a denominator
    for the whole system. Preserve existing authored-standard denominators only where already configured; no
    new plan requirement. Record counts and system inconclusive markers never imply verified/complete-security
    coverage.
- id: R3
  text: A missing activity record is displayed as no recorded activity, not proof of never executed. Model-authored
    tested conditions/remaining-work notes retain attribution; unknown values remain unknown.
- id: R4
  text: Use existing pagination and bounded server aggregates, refetch terminal changes, stop settled polling
    and show stale reads/conflicts. Validate 390px and light/dark/black themes; bump UI version for implementation
    release.
- id: R5
  text: Real-process matrix covers one-result early finish, all-conclusive completion, model inconclusive,
    hard limit, cancellation, crash, ambiguous writes, invalid membership, quota bounds, compaction and deletion.
    Evidence contains executed case counts and no skipped database case claimed passing.
- id: R6
  text: Pin independent vulnerable/fixed fixture behavior outside agent-visible materials. Scripted models
    prove plumbing and contract behavior only; do not claim they prove useful semantic judgments by small live
    models.
- id: R7
  text: Reuse one owned disposable database and cleanup owned processes/resources; no global prune, implicit
    heavy-I/O fixture enablement, live gateway calls or configured model changes.
- id: R8
  text: Verify that system stop records cannot satisfy the normal completion gate or convert a cancelled/failed
    Run to success. A valid model-authored inconclusive may settle an attempt while leaving semantic coverage
    unresolved.
- id: R9
  text: Existing readers distinguish Project fact/grounds, retained observation, selected check evidence and
    attributed interpretation. Show known original source context and applicability limitations; avoid independent-verification
    badges for Memory-derived or repeated sources. No new Facts dashboard or change to the existing informational
    Finding correlation policy.
- id: R10
  text: Verify common sources across code/HTTP/artifact and independent Audit/Finding/Fact consumers. Existing
    Findings evidence remains exact selected material; it must not be confused with a required Audit-owned
    evidence receipt. Include mixed-source and no-hypothesis cases.
- id: R11
  text: Integrated acceptance includes task-related and incidental Findings recorded before final submission,
    with code/HTTP/mixed sources and preserved exact origin after interruption. The UI shows an incidental
    problem independently of the assigned hypothesis conclusion. Verify effective instructions and publication
    receipts without interpreting deterministic scripted calls as proof of live-model compliance or imposing
    a minimum finding count.
- id: R12
  text: The integrated actual ADK declarations have no model revision/expected_revision or replacement
    token, including nested sources. Preserve the existing trusted-tool/API exact-reference boundary,
    V479 same-response conflicts, scalar correction/replay, atomic batches, cursor continuation and compaction.
    Update the registered-tool surface guard for the renamed/new exports. Show source selection, local
    recording and acknowledged durable acceptance separately; received revision metadata does not imply
    an Audit hold or accepted conclusion.
failure_outcomes:
- operation: Read/project retained Audit evidence and result facts and render a stable snapshot
  permanent: Reject invalid membership, foreign/exact-revision mismatches, quota violations and malformed input
    before mutation using owning classified errors. No retry of deterministic invalid input; specify any new
    public code/status in the owning error registry and OpenAPI in the implementation.
  retryable: Use existing bounded storage_transaction_conflict 503 and Artifact retry contracts, original receipt
    identity and owning deadline. Never retry target traffic to recover a persistence failure.
  ambiguous: Reconcile the same natural Artifact binding or existing keyed Audit mutation receipt. Return unknown/unconfirmed
    persistence if reconciliation fails; do not claim durable acceptance or create another logical effect.
  cancelled: Honor existing allocation/Run/Audit fences. Join owned I/O before cleanup; retained committed
    records survive. Do not send additional target/model calls to repair a partial result.
  timeout: Use existing operation and invocation deadlines; terminal persistence uses only the existing owner-authorized
    bounded drain/reconciliation path, never an unbounded extension of model execution.
cardinality:
- collection: Existing assigned items and explicitly selected evidence/annotations
  expected: One exploratory task or a small existing multi-item assignment; tens of selected sources.
  maximum: Keep the existing 64-item assignment and Audit collection bounds of 256 selected evidence records
    / 8 MiB encoded evidence plus conclusions; Audit maxEvidenceBytes also applies. Independent Finding/Fact
    callers retain their existing tighter or owner-specific limits, including four selected sources for informational
    facts.
  bound: Bound each operation by rows and bytes, use existing paged reads, and never hydrate the whole Audit
    in one transaction. Repeated annotations and revisions consume their owning bounds; no new frozen-plan
    denominator is introduced.
lifecycle:
- entity: Task/attempt-associated exact artifacts and results under existing Run/Audit/Project ownership
  delete: Use ordinary drained deletion and purge authorization. A held evidence artifact must remain readable
    after permitted producer Run deletion.
  cascade: Register any added relation/read/hold in existing ownership and purge mechanisms; no independent
    journal, queue, receipt store or retention service.
  retention: Only acknowledged durable records carry a persistence guarantee. Release existing Audit-owned
    holds through the ordinary Audit/Project lifecycle; volatile or unacknowledged observations may be unavailable.
acceptance_criteria:
- id: A1
  given: Normal and interrupted Audits over existing exploratory/singleton/batch assignments with attributed
    model and system results
  when: Users open Task/result/material views on desktop and 390px layouts
  then: Users identify retained evidence and unresolved judgments without reading traces; no complete-security
    or unstarted assertion is invented and no new plan setup is required.
- id: A2
  given: The composed real-process fault and maximum-cardinality matrix
  when: Required gates and report verification run
  then: Every named case executes through production owners with nonzero case counts, stable identities, bounded
    reads, no repeated target mutations and retained evidence after source deletion.
- id: A3
  given: Current shipped configs, API clients, Runtime tools, report snapshots and broader V411 consumers
  when: Integration review checks active contracts and lifecycle cleanup
  then: New names and common result semantics agree end to end; obsolete active paths are removed, independent
    pending tasks retain ownership and no live quality/deployment claim is made.
- id: A4
  given: An assigned assertion, an unrelated evidenced problem and a zero-problem control, using singleton
    and batch contexts
  when: The composed gate publishes through the selected finding tool before final submission and interrupts
    another attempt after publication
  then: Findings are real Project records with retained sources, incidental discoveries do not acquire an unrelated
    hypothesis or close its check, the control needs no Finding, and accepted publications survive stop. Effective
    evidence/publication guidance is present in actual prompts/tool declarations.
- id: A5
  given: The merged V479 version/schema guards and real material-version/compaction process cases, extended
    with common sources and thin result tools
  when: The composed V478 gate exercises source selection, scalar corrections and interruption after acknowledgement
    loss
  then: Model inputs remain revision-free while stored refs stay exact, current aliases and Project reads
    cannot change retained Run sources, old retries cannot roll back accepted results, and private selection/local
    recording are never displayed as durable acceptance. Existing gates have nonzero executed cases and
    new exports appear in the actual schema inventory.
