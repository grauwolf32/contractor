schema_version: '1.0'
id: V407-031
title: Offload OpenAPI document preparation and avoid repeated validation while preserving session ownership
milestone: server-runtime-review-2026-10
epic: workflows
kind: defect
introduced_by: V2-003
priority: P1
status: pending
depends_on:
- V407-024
languages:
- python
goal: Parse, validate and serialize bounded documents outside the Runtime event loop without changing
  document results, session serialization or cancellation ownership.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification:
  - docs/spec/execution/runtime-agent.md
  - docs/spec/tools/toolsets.md
  - docs/spec/tools/workspace.md
  severity: medium
  finding: runtime/src/contractor_runtime/toolsets/common/document_session.py:73-82 and 143 call decode
    and serialize synchronously. openapi/tools.py:1158-1161 runs an anchor-rejection parse followed by
    yaml.load_all; :498-506 and :218-220 validate the whole mutation candidate twice, and :356 validates
    the changed PathItem once more. This CPU work runs on the event loop. LikeC4 uses the same session
    base for bounded UTF-8 document preparation, while its external CLI and filesystem preparation are
    already asynchronous/threaded (likec4/tools.py:523,544). Validators hold the session lock, but common/document_session.py:99-115
    cancels the tracked task and core/process.py:144-156 joins subprocess cleanup. The supported defect
    is synchronous document CPU work and redundant validation, not a missing validator cancellation mechanism.
  siblings: OpenAPI initialize/load, path and component upserts, other mutations, validation rendering
    and full-document reads; LikeC4 shared decode/serialization paths. Preserve provenance validation
    and its project workspace acquisition. Server OpenAPI preview is a separate path.
  validation: 'Partially confirmed on dc7012e8: a valid near-4-MiB OpenAPI seed blocked the loop; one
    upsert validated the document twice and its changed PathItem three times. DocumentSession.close already
    cancels the validator before joining its lock; waiting for its full subprocess timeout was not reproduced.'
plan:
- Factor pure bounded document preparation so decode, copying, validation and serialization used by the
  owning session run through threads.to_thread_until_done. Keep ownership until the thread joins on success,
  failure or cancellation; never expose a mutable in-progress candidate.
- Give every write entry point a validated candidate and serialize that candidate without another whole-document
  walk. Keep load/initialize and direct write validation strict, and keep no-op/CAS/provenance behavior
  unchanged. Merge path/component patches before their single final structural validation.
- Reject anchors and aliases within the strict YAML loader during its single parse, preserving duplicate-key,
  unknown-format, depth, item-count and byte-limit rejection. Do not replace strict parsing with a permissive
  fast path.
- Keep the current validator lock and cancellation model. Add deterministic tests using worker-thread
  identity, barriers and execution ordering to prove event-loop progress during blocked preparation and
  that cancellation joins preparation/validator cleanup. Do not use elapsed-time or heartbeat-gap thresholds.
- Count whole-document and changed-entry validation calls for path/component mutations and parse passes
  for seed loads; run unchanged format, provenance, CAS and cancellation tests. Record the off-loop ownership
  guarantee in the owning specification.
- Record any new shared document-session cancellation/off-loop guarantee under the Runtime Agent lifecycle
  owner; use Toolsets for its shared call boundary and Workspace only for OpenAPI provenance. Keep one
  owning requirement and cross-reference it.
scope:
  in:
  - Document-session CPU offload with joined cancellation; single strict YAML parse; one complete structural
    validation per prepared mutation candidate; deterministic regression tests.
  out:
  - Document limits, accepted formats, tool signatures and output shapes; V407-024 limit alignment.
  - Changing validator serialization, concurrent read semantics, subprocess deadlines or claiming guaranteed
    heartbeat/lease timings.
  - Server-side OpenAPI preview or unrelated workspace snapshot optimization.
acceptance_criteria:
- id: A1
  text: Decode, candidate preparation and serialization are observed on a worker thread; a barrier-controlled
    preparation allows an independent loop callback to run before its release. The test fails if preparation
    is moved inline.
- id: A2
  text: An accepted path or component mutation performs one whole-document validation after merge and
    does not repeat its changed-entry validation; an OpenAPI seed is parsed once. Existing invalid-document,
    duplicate-key, anchor/alias and bound cases remain rejected.
- id: A3
  text: Cancellation leaves no preparation or validator work running after close returns; a started preparation
    is joined before session state is cleared, and the existing validator cancellation behavior is preserved.
    Tests use synchronization and completion ordering, not time thresholds.
- id: A4
  text: Existing document bytes, no-op handling, provenance, CAS reconciliation, tool schemas and validator
    result shapes remain unchanged for OpenAPI and LikeC4.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_openapi_toolset.py tests/test_likec4_toolset.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A2
  - A4
