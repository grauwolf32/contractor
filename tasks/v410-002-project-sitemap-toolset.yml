schema_version: '1.0'
id: V410-002
title: Expose authorized live sitemap tools to Project allocations
milestone: project-sitemap-2026-10
epic: projects-artifacts
kind: feature
priority: P1
status: pending
depends_on:
- V410-001
languages:
- go
- python
- json
- yaml
- markdown
goal: Let explicitly selected Workers read and edit their owning Project sitemap and retain exact safe context without
  granting general foreign-scope Artifact authority.
context:
  authority: User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence.
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 2-4 and 8-11: allocation authority, provenance, exact paging, safe views, snapshots
    and cleanup.'
  specification:
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/execution/control-plane.md
  - docs/spec/configuration/agent-templates.md
  - docs/spec/tools/toolsets.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or deferred V61/V62/V64
    work.
  code:
  - internal/httpapi/privateartifacts
  - internal/controlplane
  - internal/contracts
  - api/v1alpha1
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/src/contractor_runtime/toolsets/run_artifacts
  - runtime/src/contractor_runtime/factories.py
scope:
  in:
  - Add matching Go/Python private wire and capability/tool selection contracts for reader, editor/importer and
    observation-writer roles.
  - Register narrow Runtime list/read/upsert/remove/restore/grouping/import-dispatch/snapshot operations backed
    by the V410-001 service; Project binding comes only from trusted allocation context.
  - Implement exact-revision cursors, bounded immutable snapshot/index caching, source-mode filtered list/read/snapshot
    paths and authorized evidence materialization.
  - Attach trusted source/content-kind context, implement explicit ordinary Run context namespaces, and provide
    the common allocation collector interface used by later adapters.
  - Retain safe selected projections with original map revision, projection policy and authorized input refs, without
    mutating a started Audit baseline.
  out:
  - Automatic target traffic collection or scanner/OpenAPI parsers.
  - General Project Artifact authority, arbitrary foreign-Run reads or source-mode declassification by a model.
  - A dependency on a pentest engagement implementation; ordinary Project Runs are the first production consumers.
requirements:
- id: R1
  text: Reader selection grants no collection/edit authority; unknown capability/version fails validation, and a
    Skill/input file is not a grant. Every operation checks allocation ownership/fence and the Project lifecycle.
- id: R2
  text: Use the V410-001 schemas, limits and shared fixtures; do not define independent URL/context grammars or
    a second reduction policy in Python.
- id: R3
  text: Blackbox views filter contribution content and grouping effects before returning previews or materializing
    bytes. Source-assisted notes remain restricted unless trusted policy permits them; explicitly authorized OpenAPI
    stays usable.
- id: R4
  text: Never materialize the mixed raw map into a blackbox Run and filter afterward. If an allowed projection cannot
    be reconstructed safely, return unavailable/gap rather than leaking metadata.
- id: R5
  text: List cursors bind revision and filters; later writes do not alter the page sequence. Refresh creates a new
    view, and expired/foreign cursors fail permanently.
- id: R6
  text: Keep parsing/index work off the Runtime event loop using joined threads; cache lifetime/bytes are allocation-owned.
    Selected evidence is forked/materialized by the Server and retains exact source attribution; mere metadata reading
    creates no arbitrary evidence holds.
failure_outcomes:
- operation: Allocation sitemap read/edit/import-dispatch
  permanent: Stable invalid-request/access-denied outcomes for unknown tools/versions or missing grants; owner-safe
    not-found for foreign refs; stale manual/source mutations retain permanent conflict.
  retryable: Retry only classified transport/storage failures within the operation deadline and V410-001 bounds.
  ambiguous: Reuse the service receipt/accepted revision; never send an alternate mutation or target request after
    a lost reply.
  cancelled: Join read/index/materialization work before allocation release; fenced requests cannot publish.
  timeout: Caller operation deadline bounds network, decoding and cache work; timeout does not substitute latest
    for an exact ref.
- operation: Source-mode view or exact context snapshot/materialization
  permanent: Unavailable/denied exact source stays explicit; unsafe mixed-source projection fails without producing
    a consumer artifact.
  retryable: Use existing Artifact transport/transaction retry classification only.
  ambiguous: Reconcile exact snapshot/fork identity through existing Artifact/keyed mutation handling.
  cancelled: No materializer or cache worker outlives allocation cleanup.
  timeout: Snapshot deadline is independent from any target call or lifecycle finalization deadline.
cardinality:
- collection: Model-visible pages and one cached immutable revision
  expected: 20-100 entry previews within a Project of 100-1000 groups
  maximum: Proposal 0042 section 10 page rows/bytes and current-map size; a bounded number of cached revisions,
    defined in owning spec
  bound: Parse/index once per selected revision, return bounded metadata and reject cycles/stale cursors without
    whole-map reparsing per page.
- collection: Context snapshots and evidence selections
  expected: Only selected entries and exact needed refs
  maximum: Map, provenance and document limits from the owning shared contract; tighter consumer/Audit limits apply
  bound: Select bounded members/refs and materialize only authorized exact inputs, never scan all evidence blobs.
lifecycle:
- entity: Allocation grants, cached views and import dispatch
  delete: Finalize/cancel/release joins work and erases cache/grants.
  cascade: Allocation cleanup removes local transient state; committed Project map remains.
  retention: Consumer context artifacts follow ordinary Run/Audit retention; linked unavailable source IDs remain
    provenance only.
acceptance_criteria:
- id: A1
  given: Reader-only and editor/collector templates on two Projects
  when: Production Runtime tools call the private service
  then: Only explicitly selected operations succeed, Project comes from allocation context and foreign Project/ref
    probes disclose nothing.
- id: A2
  given: A mixed source-assisted Project map with canaries in paths, notes, parameter names and grouping rules
  when: A blackbox Worker lists, reads, imports and snapshots selected context
  then: Only authorized safe content is exposed/materialized; the full mixed artifact never enters its Run and model
    relabeling cannot change classification.
- id: A3
  given: A map spanning multiple byte-limited pages while another Run writes
  when: The first Worker follows cursors and then refreshes
  then: Its original page sequence stays on one exact revision with bounded work, while refresh truthfully selects
    the new revision.
- id: A4
  given: Exact source evidence that is present, missing or independently held
  when: A Worker selects a context projection and requests required bytes
  then: Authorized materialization retains exact refs, missing evidence is unavailable, and metadata reading grants
    no arbitrary cross-Run access.
- id: A5
  given: Slow parsing/materialization and an in-flight edit
  when: The allocation is cancelled or fenced and released
  then: Off-thread work is joined, no late writer survives, committed receipts remain replayable and caches are
    cleared.
deliverables:
- path: runtime/src/contractor_runtime/toolsets/sitemap
  description: New selected Toolset with production model-visible callers and accurate docstrings.
- path: api/v1alpha1
  description: Matching private operation/grant/context schemas with shared Go/Python fixtures.
- path: make/toolsets.mk
  description: New test-project-sitemap-tools-e2e target running actual Server/Runtime/PostgreSQL grant, safe-view
    and lifecycle cases; register in release graph.
tests:
- command: make test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make test-project-sitemap-postgres
  covers:
  - A1
  - A2
  - A4
  - A5
- command: uv run --project runtime pytest runtime/tests/test_sitemap_*.py runtime/tests/test_contracts.py runtime/tests/test_capabilities.py
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-tools-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- New test_sitemap_*.py suites and test-project-sitemap-tools-e2e are deliverables; the gate requires disposable
  PostgreSQL and real component processes, fails missing/zero/skipped mandatory cases and uses scripted local fixtures
  only.
