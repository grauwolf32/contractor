schema_version: '1.0'
milestone: hub-audit-defects-2026-10
epic: planner-worker
depends_on: []
languages:
- go
id: V439-005
title: Use the shared Planner subtask grammar in telemetry
kind: defect
introduced_by: V384-001
priority: P3
status: in_progress
goal: Telemetry preserves every legal Planner subtask ID including 100 through 999.
context:
  authority: 'User request 2026-11-03: implement the reviewed Planner simplifications and optimizations first,
    then fix the four reproduced defects. Preserve the existing Planner/domain/Server-operation boundaries.'
  finding: internal/planner/streamline/tools.go:663 keeps the historical two-digit rule after Workflow plan
    limits expanded to 1000.
  siblings: Streamline and Router share one engine. Passthrough, scan, durable reads, Gateway main/compactor
    and telemetry consumers are checked where applicable; no Runtime or UI behavior change is introduced.
  specification:
  - docs/spec/execution/planners.md
  - docs/spec/platform/limits.md
  boundary: Planner owns orchestration; Session owns durable receipts and validation; StateView owns revision-bound
    projections. Keep existing events and stores rather than adding batching protocols, tables or receipt owners.
    Reopen atomic event batching only if measured database cost justifies a separate change.
scope:
  in:
  - Reuse the existing Planner ID validator in tool metric arguments and spans.
  - Exercise the shared grammar fixture and real Planner tool execution at ID 100; reject malformed and out-of-range
    values.
  out:
  - Relocating scanplan, adding Server operations, changing Worker/model selection, changing public schemas
    or replacing the persistence mechanism.
acceptance_criteria:
- id: A1
  text: Every shared valid ID is preserved in telemetry and every invalid ID is reduced to the safe marker.
- id: A2
  text: A real Planner invocation records subtask 100 correctly in its report and Worker span.
- id: A3
  text: Existing RunStore/public fixture consumers preserve the same grammar without API/schema changes.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/planner/...
  covers:
  - A1
  - A2
  - A3
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/runstore ./internal/httpapi/public
  covers:
  - A1
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
