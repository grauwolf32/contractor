schema_version: '1.0'
id: V94-002
title: Keep LiteLLM launch credentials out of podman arguments
milestone: local-secret-log-and-process-boundaries-2026-10
priority: P2
status: completed
implementation_commit: 40a8312ca48d1aa02a637e85e0ffbf06f3b7bf68
depends_on: []
languages: [shell]
goal: Preserve owner-only key-file handling without exposing key bytes in podman argv.
context:
  issue: https://github.com/grauwolf32/contractor/issues/216
  finding: Foreground podman run includes master, salt and upstream token literals in command arguments.
scope:
  in:
    - Pass secret environment variable names to podman instead of literal values.
    - Keep regular-file, non-symlink and sk-prefix validation.
    - Add a stub-podman test for argv and environment delivery.
  out:
    - Change LiteLLM image, container networking or database persistence.
acceptance_criteria:
  - {id: A1, text: Podman argv omits all three secret values while its environment contains them.}
  - {id: A2, text: Key file validation and non-secret launch arguments remain intact.}
  - {id: A3, text: Shell syntax and stub launcher tests pass.}
tests:
  - {command: sh -n deploy/litellm/run.sh deploy/litellm/test-run-argv.sh, covers: [A3]}
  - {command: sh deploy/litellm/test-run-argv.sh, covers: [A1, A2, A3]}
