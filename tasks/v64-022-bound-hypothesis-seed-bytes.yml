schema_version: '1.0'
id: V64-022
title: Reject oversized hypothesis seeds in programs and proposals
milestone: audit-check-prioritization
epic: audits
kind: defect
introduced_by: V64-001
priority: P1
status: in_progress
depends_on:
- V64-001
languages:
- go
- python
- json
- markdown
goal: Known oversized candidate content is rejected at the common contract boundary before it can become
  an unstoreable hypothesis.
context:
  authority: 'User request on 2026-11-01: create fixes for the three implementation-review findings in
    completed V64-001. Preserve the accepted simple Audit task/Run/result model; these are local contract
    corrections, not a new subsystem. User explicitly authorized implementing V64-020,
    V64-021 and V64-022 on 2026-11-01.'
  review: Implementation review of main 79d2788d7 on 2026-11-01, following the delegated V64-001 delivery.
  severity: medium
  finding: internal/contracts/auditcontract/codec.go:160-168 checks nested hypothesis sizes only for context
    documents. program.hypotheses and proposals.hypotheses use the seed schema at api/audit/v1/contract.schema.json:109,
    whose text fields allow 64 KiB each. The real CLI accepts a fixed program containing a 33000-byte
    statement even though the statement alone exceeds the 32 KiB complete hypothesis-document limit. Initial
    seed schemas were added in cf6ab1cb5869f82d4a24be0ec59784dab3125d54; nested size helper in 36d93a45f021dca043126b5baeb487f4c2a046c2
    (V64-001).
  siblings: Initial program seeds, generated proposal seeds, embedded programs in proposal-context, standalone
    hypothesis documents, context.items[].hypothesis and hypothesis records inside mutations; Go schema/decoder,
    Python conformance and actual offline CLI. Standalone/full context hypothesis limits already exist
    and must not be weakened; unrelated result/rationale text retains its own bound.
  specification:
  - docs/spec/audits/common-contract.md#ACT-R1
  - docs/spec/audits/common-contract.md#ACT-R10
  - docs/spec/platform/limits.md#LIM-ACT-1
  - docs/spec/platform/limits.md#LIM-ACT-3
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  boundary: Use existing auditcontract, real catalog Snapshot and offline config validate caller. No database
    mutation, controller, queue, receipt store, execution capability or compatibility reader.
  priority_rationale: The review severity is P2/medium; delivery priority is P1 because the existing base-slice
    consumer depends on this fix.
scope:
  in:
  - Reject canonical UTF-8 seed content above 32 KiB in initial/generated seeds, including nested proposal-context
    programs, before returning a valid document.
  - Specify the early content check as a necessary bound; a complete hypothesis still uses the existing
    32 KiB limit after trusted IDs/revision/origin are assigned. Do not fabricate identity metadata merely
    to size a seed.
  - Keep per-string limits distinct from the combined seed payload, and cover statement, grounds and scope
    together rather than only one oversized field.
  - Update owning specification/schema annotations as necessary and extend shared fixtures plus real decoder/catalog/CLI
    regression cases. Durable aggregate counts/bytes stay with the future hypothesis owner.
  out:
  - Increasing the 32 KiB limit, reducing unrelated conclusion text limits, implementing the hypothesis
    registry/publication owner or adding a second budget subsystem.
  - Claiming that an early content-size pass replaces validation/accounting of the final full hypothesis
    document.
acceptance_criteria:
- id: A1
  given: initial and generated seeds whose statement alone is 33000 ASCII bytes, including a program embedded
    in proposal-context
  when: the common decoder and actual offline configuration command validate them
  then: audit_document_invalid is returned with no partial canonical result before hypothesis creation
- id: A2
  given: combined seed content at and above the defined canonical UTF-8 boundary, including multibyte
    text and scope/grounds
  when: the shared validators evaluate each owning document kind
  then: the documented early boundary is consistent across Go/Python; existing full hypothesis/context/mutation
    limits remain in force without applying a global 32 KiB limit to unrelated text
- id: A3
  given: the actual loader/CLI path, nested seeds and shared conformance fixtures
  when: complete touched-package suites run
  then: the known oversized-seed regression fails on the unfixed implementation and passes after the fix;
    final metadata accounting remains explicitly separate
tests:
- command: go test -count=1 ./internal/contracts/auditcontract ./internal/config/... ./internal/app
  covers:
  - A1
  - A2
  - A3
- command: make test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
failure_outcomes:
- operation: Validate a common Audit document through the existing decoder and configuration CLI
  permanent: Invalid content returns audit_document_invalid with no canonical partial result or input
    content in diagnostics. No retry.
  retryable: Preserve existing surfaced filesystem/embedded-schema failures; validation adds no automatic
    mutation retry.
  ambiguous: No durable effect exists to reconcile; never run a Workflow or target request to repair local
    validation.
  cancelled: Validation remains caller-owned with no background work or live mutation.
  timeout: Keep the existing CLI/caller invocation ownership; introduce no controller clock or new timeout.
cardinality:
- collection: One selected document, its bounded trusted context and real loaded Workflow bindings
  expected: One small program/proposal and several selected materials or seeds.
  maximum: Retain LIM-ACT-1 through LIM-ACT-4 and existing containing-document/record/UTF-8 bounds.
  bound: Validate the selected bounded document; no Run/Audit/Project history enumeration or target activity.
lifecycle:
- entity: Existing offline input bytes and canonical validation result
  delete: Caller releases local files/bytes; no new persistent entity.
  retention: Validation creates no hold, grant, receipt or owner-lifetime change.
test_prerequisites:
- Commands are future implementation acceptance, not results of task creation.
- Use testdata catalogs and the real existing config validate path. Validation has no persistence behavior;
  do not introduce a fake store or require a new database fixture.
- Run complete suites of every touched Go package and the shared cross-language cases; a zero-match mandatory
  selection is a failure.
- On macOS use a canonical TMPDIR for the existing strict-root tests. If implementation expands into store
  behavior, report the scope change before proceeding.
implementation_commit: null
verification:
- Before the fix, the 33000-byte statement and combined-content regressions failed in Decode, the real loaded catalog and offline CLI (2026-11-01).
- Complete auditcontract/config/.../app/archtest suites and the independent Python conformance module passed after the fix. Shared cases cover 32768 and 32769 canonical bytes with ASCII, multibyte Unicode, scope/grounds and JSON escaping across initial/generated/pinned-context seeds.
- Separate cases retain full-document metadata charging for standalone/context/mutation hypotheses and allow unrelated 33000-byte result rationale. No persistence behavior or database fixture was introduced.
- Full cross-language and lint gates remain required before completion.
