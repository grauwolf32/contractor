schema_version: "1.0"
id: V372-013
title: "Take Planner refs and facts from the descriptor registry in Go, the composition and Studio"
milestone: hub-audit-defects-2026-10
epic: workflows
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [go, typescript]
goal: "Planner identities, the single-Agent fact and the model-free fact come from the one descriptor registry (CAT-R79): Go compares descriptor facts or shared constants instead of string literals, the composed PlannerFactories are checked against the registry, and Studio validation is held to the same facts by a shared case list."
context:
  review: "Out-of-scope findings of the hub audit fix batch, wave 2 (group w2e: V370-006), recorded 2026-10-12; file:line verified on b2b09ea"
  specification: "docs/spec/configuration/catalog.md#CAT-R79"
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds and has grown. Lines
    were re-read and updated. New literal comparisons since b2b09ea:
    internal/config/resolved/summary.go:67 and :81 and
    internal/scheduler/stage_finalization.go:129 (194c6101, the V378
    summary continuation), internal/scanservice/service.go:247 (248e91a4,
    V406 Project sweeps). The resolved package now has KnownPlanner,
    IsModelFreePlanner and ValidatePlannerAgents
    (descriptors.go:266-292), but no single-Agent predicate and no named
    Planner identities; nothing yet checks the composed factories against
    the registry and no shared Planner fact case list exists
    (api/testdata/planner-subtask-cases.json is the V384 subtask budget,
    another rule).
  finding: >-
    V370-006 made the descriptor registry the source of the Planner facts
    (internal/config/resolved/descriptors.go:26-34 plannerDescriptor and
    :106-111: SingleAgent and ModelFree for passthrough@1, streamline@1,
    router@1 and scan-plan@1). Copies remain. (1) Studio validation
    (ui/src/routes/studio/validation.ts:149-157) requires exactly one Agent
    for the literal list passthrough@1 and streamline@1, and :176 exempts
    the literal scan-plan@1 from the result-source rule. (2) Nothing checks
    the composed PlannerFactories against the registry: planner.NewRegistry
    (internal/planner/registry.go:12-27) accepts any factories, and
    internal/app/composition_execution.go:107 passes four of them, so a
    descriptor without a factory loads in the catalog and fails only at
    Planner creation ("unknown PlannerFactory", registry.go:35); the refs are
    repeated as string constants in internal/planner/types.go:16-21. (3) Go
    compares Planner identities as literals outside the registry:
    internal/config/workflow.go:266 and internal/config/resolved/scan_plan.go:29
    (scan-plan, 1); internal/config/resolved/summary.go:67 (passthrough, 1)
    and :81 (streamline, 1); internal/scheduler/audit_completion.go:26 and
    internal/scheduler/stage_finalization.go:129 (passthrough, 1);
    internal/config/auditprofile/audit_completion.go:74,
    internal/evalservice/usage_collection.go:44 and
    internal/scanservice/service.go:247 (passthrough, 1). A renamed or new
    version is missed silently (AGENTS.md 3.1). The UI and string copies
    predate the shallow history (boundary 6349621).
  siblings: >-
    The Studio default Planner of a new Stage (ui/src/routes/studio/document.ts:230)
    is a default value, not a rule, and stays. The Planner implementations
    name their refs through the planner constants (planner/passthrough.go:35
    and :341, planner/streamline/config.go:19, planner/streamline/factory.go:34,
    planner/router/factory.go:12, planner/scan/factory.go:27 and :30); those
    constants and the registry keys are the two definitions to join. The
    literal "scan-plan" in internal/auditscan/evidence.go:85 is an evidence
    key suffix, not a Planner identity, and stays. The workspace observation
    descriptor of V371-006 is a separate fact with its own task.
scope:
  in:
    - "Go reads Planner facts through resolved accessors (a single-Agent predicate next to IsModelFreePlanner, and named Planner identities for the passthrough, streamline and scan-plan checks) and names Planner refs through one set of constants shared by the registry and the planner package; every literal in finding item (3) uses them."
    - "A test that the PlannerFactories composed in internal/app match the descriptor registry exactly."
    - "A shared case list of Planner facts under api/testdata (declared in readers.json) that the registry test and the Studio validation test both read, and Studio derives its single-Agent and result-source rules from it or from one module tested against it."
  out:
    - "Which Planners exist and what each one accepts: behaviour stays as on b523ae77."
    - "The workspace observation classification (V371-006) and the Planner subtask budget (planner-subtask-cases.json)."
acceptance_criteria:
  - id: A1
    given: "the descriptor registry and the PlannerFactories composed in internal/app"
    when: "a descriptor is added without a composed factory, or a factory without a descriptor"
    then: "a test fails naming the unmatched ref"
  - id: A2
    given: "the Go sources outside internal/config/resolved and internal/planner"
    when: "a source scan runs"
    then: "no file compares a Planner identity (PlannerID, Version or an id@version string) with a string literal, and a probe literal comparison fails the scan"
  - id: A3
    text: "Studio and the Go registry give every shared Planner case the same verdict, and every Workflow that validated on b523ae77 still validates."
  - id: A4
    text: "The composition test, the source scan and the shared-case test fail on b523ae77."
tests:
  - command: "go test ./internal/config/... ./internal/planner/... ./internal/app ./internal/scheduler ./internal/evalservice ./internal/scanservice"
    covers: [A1, A2, A3, A4]
  - command: "cd ui && corepack pnpm test --run src/routes/studio"
    covers: [A3, A4]
  - command: "go run ./cmd/contractor-server config validate --root ./configs"
    covers: [A3]
  - command: make lint
    covers: [A1, A2, A3]
