schema_version: "1.0"
id: V3-002
title: Add a bounded typed PlannerPlan state machine
milestone: planner-routing-and-escalation
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-001]
languages: [go]

goal: >-
  Give model-backed Planners one framework-neutral, bounded, typed subtask plan
  whose immutable global objective and adapter-controlled execution state can
  later be persisted and shown in the UI without exposing prompts or ADK State.

context:
  current_state: >-
    Streamline currently lets the model call Worker-specific tools with a new
    objective, instructions, parameters, and artifacts on every call. There is
    no server-owned representation of the current subtask. contractor-old had a
    larger task manager; this task intentionally retains only its stable-ID,
    current-item and stale-call safety invariants.
  first_contract: >-
    PlannerPlan has a monotonically increasing revision, the immutable Stage
    objective as its global task, an ordered list of at most 32 subtasks, one
    current subtask ID, and at most one active dispatch. A subtask stores a
    stable decimal ID, immutable objective/instructions, and an
    adapter-controlled status: pending, running, succeeded, or failed.

scope:
  in:
    - Add PlannerPlan, PlannerSubtask, PlannerSubtaskStatus, and ActiveDispatch domain types outside the ADK package.
    - Add a concurrency-safe in-memory controller with clone/snapshot methods and explicit state transitions.
    - Expose model tools add_subtask(objective, instructions) and list_subtasks with bounded strings and deterministic decimal IDs.
    - Keep the global task equal to Invocation.Stage.Objective; the model cannot set or replace it.
    - Make subtask objective/instructions immutable after add_subtask succeeds.
    - Reject unknown, stale, already resolved, parallel, and out-of-order dispatch claims before a side effect.
    - Advance currentSubtaskId deterministically after a dispatch resolves; retain failed records for inspection.
    - Require no pending/running subtask before successful finish; allow failed finish whenever no dispatch is active.
    - Add transition/property-style tests including duplicate concurrent claims and snapshot mutation isolation.
  out:
    - PostgreSQL persistence, WebSocket events, decomposition, skip, parent/child IDs, summarization, or Worker routing.

deliverables:
  - {path: internal/planner/plan.go, description: Framework-neutral bounded plan types, validation, cloning, and transition controller.}
  - {path: internal/planner/streamline, description: ADK add/list tool adapters and finish precondition integration.}
  - {path: internal/planner/plan_test.go, description: Exhaustive legal/illegal transition and concurrency tests.}
  - {path: docs/spec/00-workflow-and-planner.md, description: Exact first-version subtask tool and status contract.}

requirements:
  - id: R1
    text: Plan revision increases exactly once for every committed visible state change and never for a rejected operation.
  - id: R2
    text: IDs are generated by Server, never reused within an invocation, and cannot be supplied by the model during add_subtask.
  - id: R3
    text: Only the controller can move pending to running and running to succeeded or failed.
  - id: R4
    text: Every public snapshot is a deep copy and contains no prompt, hidden reasoning, arbitrary tool payload, credential, endpoint, or physical Runtime Agent identity.
  - id: R5
    text: Limits apply before mutation and produce stable safe errors suitable for an ADK function response.

acceptance_criteria:
  - id: A1
    given: An empty plan for Stage objective Build an API description.
    when: The model adds two subtasks.
    then: Snapshot revision, IDs 0 and 1, order, current ID 0, immutable text, and pending statuses are deterministic.
  - id: A2
    given: Subtask 0 is current.
    when: Two callers try to claim it or a caller supplies ID 1.
    then: Exactly one valid claim may become active and every rejected call performs no Worker side effect or plan mutation.
  - id: A3
    given: A dispatch completes with a failed Worker result.
    when: The controller records it.
    then: Subtask 0 is failed, the active dispatch is cleared, subtask 1 becomes current, and the failure remains in the bounded projection.
  - id: A4
    given: Pending work remains.
    when: The model requests successful finish.
    then: Finish is rejected; failed finish remains possible when no dispatch is active.

tests:
  - {name: plan-domain, command: "go test -race ./internal/planner/...", covers: [A1, A2, A3, A4]}
  - {name: streamline-integration, command: "go test ./internal/planner/streamline/...", covers: [A1, A4]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}

notes:
  - >-
    A later schema version may add decomposition and skip. The initial status
    set is deliberately small enough to make recovery and UI projection
    deterministic.
