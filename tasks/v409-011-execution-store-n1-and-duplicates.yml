schema_version: "1.0"
id: V409-011
title: "Batch execution-store round trips, fail closed on corrupt metrics rows and fold duplicated statements"
milestone: sql-review-2026-10
epic: execution-core
kind: defect
introduced_by: V1-004
priority: P3
status: pending
depends_on: []
languages: [go, sql]
goal: "Terminal release recovery, binding locks and credential usage queries issue bounded statement counts, corrupt rows fail reads, and sibling statements share one definition."
context:
  review: "docs/research/2026-10-23-sql-review.md, section D (N+1, FindEvalReceipt, metrics_batch lenient read, credential OR, duplicates)"
  specification: docs/spec/platform/persistence.md
  severity: low
  finding: >-
    (1) internal/scheduler/allocation_release.go:98-135 reads 32 executions
    then per execution ListStageAllocations
    (internal/runstore/allocation_store.go:157, with a second existence
    probe at :167 on empty) and per allocation
    MarkStageAllocationReleaseAttempt/Released, although
    ListStageAllocationsBatch (:180) exists with one runservice caller. (2)
    internal/runtimeconfig/repository.go:348-370 lockBindings and
    internal/agentprincipal/repository.go:131-153 LockMany lock one row per
    statement in a sorted loop; ValidateLockedAgentLabels
    (agent_labels.go:77-86) does GetBinding + GetVersionByRef per label.
    (3) internal/credentials/runtime_repository_sql.go:64
    runtimeCredentialAllocationUsageSQL has OR r.project_http_target_snapshot
    #>> ... = $1 across two tables, so neither the GIN index
    stage_allocations_live_runtime_credentials_idx nor
    workflow_runs_project_http_target_credential_idx applies. (4)
    internal/persistence/postgres/receipts.go:168-173 FindEvalReceipt
    selects project_id with LIMIT 1 and no ORDER BY where two receipts with
    different Projects are possible. (5) internal/telemetry/metrics_batch.go:34-36
    GetStageMetricsBatch continues past a row whose JSON fails to decode
    (AGENTS 2: validate strictly on read). (6) Duplicates:
    internal/artifacts/ref_page_sql.go:11 vs :26 (namespace-scoped variant
    keeps constant $5-$7 filters); internal/credentials/repository.go:176-183
    vs runtime_repository_sql.go:17 (same join, different JSON path lists,
    both casting canonical_document::jsonb from text per version);
    internal/gatewayrecovery/waiting.go:119-152 reads owner_id after
    LockRunState already read the row; internal/runstore/resume_store.go:46-69
    reads project_id unlocked, locks the Project, then re-reads the Run FOR
    UPDATE.
  siblings: >-
    V407-015 (scheduler Stage-end cost) and V407-014 (placement reads)
    touch neighbouring paths; coordinate the batch readers.
plan:
  - "Release recovery: one ListStageAllocationsBatch for the 32 executions and one UPDATE ... WHERE allocation_id = ANY($1) per mark; drop the empty-result existence probe or fold it into the batch."
  - "Lock bindings and principals with one statement WHERE label = ANY($1) ORDER BY label FOR UPDATE; fetch bindings and versions for a label set in one statement."
  - "Split the credential usage query into two UNION arms (allocation provenance via the GIN index; project target via the expression index) with the keyset applied to the union."
  - "FindEvalReceipt: include project_id in the lookup or treat more than one row as an internal error; metrics batch: return an error naming the stage on a corrupt row."
  - "Fold the duplicated statements: one ref-page statement with a nullable namespace parameter; one credential projection statement taking a path array (or store canonical_document as jsonb in a migration); drop the second reads in gatewayrecovery and resume by returning the needed columns from the locking read."
  - "Statement-count tests on the fake and real stores for release recovery (32 executions), binding locks (16 labels) and the credential usage page (EXPLAIN index use)."
scope:
  in:
    - "Batching, union rewrite, strict reads, statement folding, tests."
  out:
    - "Release protocol and credential formats."
acceptance_criteria:
  - id: A1
    text: "Terminal release recovery of 32 executions issues a constant number of statements; locking 16 labels issues one statement."
  - id: A2
    text: "EXPLAIN of the credential usage query shows index scans on both arms; a corrupt StageMetrics row fails the batch read with a classified error."
  - id: A3
    text: "The folded statements have one definition each; existing tests pass; the statement-count tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/scheduler/... ./internal/runstore/... ./internal/runtimeconfig/... ./internal/agentprincipal/... ./internal/credentials/... ./internal/telemetry/... ./internal/artifacts/... ./internal/gatewayrecovery/... ./internal/persistence/postgres/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A3]
