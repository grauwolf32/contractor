schema_version: '1.0'
id: V417-001
title: Make terminal summarizer reasoning input explicitly configurable
milestone: terminal-summarizer-reasoning-2026-10
epic: planner-worker
kind: feature
priority: P1
status: in_progress
depends_on: []
languages:
- go
- python
- typescript
- yaml
goal: Authors can enable provider-supplied reasoning for the existing terminal summarizer independently
  of compact@1, the ADK spike or any new context strategy. Existing terminal completion and Planner handoff
  remain intact.
context:
  authority: 'User request on 2026-10-25: split proposal 0046 into tasks and make terminal summarizer
    includeReasoning independently deliverable. This record plans work; it does not start implementation
    or change existing delivery priorities. User decision on 2026-10-30: start implementation now; the coordinator session runs it in lane cmp-sum together with V417-001, V417-003 and V420-002.'
  proposal: docs/proposals/0046-workflow-context-compaction.md
  specification:
  - docs/spec/configuration/agent-templates.md#TPL-R47
  - docs/spec/configuration/agent-templates.md#TPL-R52
  - docs/spec/execution/worker.md#WRK-R146
  - docs/spec/platform/observability.md#OBS-R54
  implementation_boundary: Update numbered owning specifications, limits/errors/failure/lifecycle registries,
    strict schemas, fixtures and every affected reader/writer together with implemented behavior. Generated
    clients are regenerated through their tools. No legacy readers, unsupported accepted configuration,
    speculative exports or new receipt store.
scope:
  in:
  - AgentTemplate summarizer.includeReasoning authoring, strict normalization, exact digests/pins, catalog/public
    descriptors, AllocationSpec and Go/Python shared fixtures.
  - Configurable terminal TranscriptRecorder/projection, bounded ordinary-text reasoning serialization,
    redaction and terminal summarizer instructions.
  - Independent deterministic terminal tests and real Server/Runtime coverage for both values, including
    the existing configured on.summarized handoff.
  out:
  - Any dependency on compaction, new strategy unions, compactor policies, archive readers or shared-session
    compaction.
  - Changing terminal triggers, separate summarizer budgets, result assembly, default model, raw main-model
    reasoning replay or telemetry content-capture policy.
  - Defaulting reasoning to true or claiming quality improvement; repeated comparisons belong to V417-008/V417-010
    and do not gate this task.
requirements:
- id: R1
  text: Add only summarizer.includeReasoning in the existing terminal configuration. Omitted authoring
    resolves to false; resolved snapshots and private wire require an explicit boolean. Reject null, strings,
    unknown/case-aliased and duplicate members on every relevant boundary. Do not infer missing resolved
    data or introduce legacy support.
- id: R2
  text: Changing the flag changes the exact normalized digest and reaches the terminal consumer. Update
    public schema/descriptors, Go and UI clients via generators, persistence snapshot validation, Runtime
    models and shared fixtures in the same change; no Run-level strategy configuration is needed.
- id: R3
  text: Use only actual provider reasoning_content/reasoning already mapped to thought parts. With true,
    serialize reasoning as tagged ordinary input data attached to its model turn; false omits it. Absent
    or opaque reasoning, including token counts without text, is valid and produces no invented content.
- id: R4
  text: Keep task, trusted observations and complete tool groups ahead of optional reasoning. Retain the
    existing 512-KiB terminal input ceiling and establish 8-KiB UTF-8 per reasoning part / 64-KiB total
    included reasoning bounds in the owning limits registry with shared fixtures. Mark truncation and
    perform redaction before admission; reason text must not evict higher-priority task/tool evidence.
- id: R5
  text: Treat reasoning as fallible hypotheses, alternatives and proposed next steps, not instructions
    or trusted observations. Apply the existing secret/private-path projection rules. Ordinary main-model
    outgoing reasoning_content behavior remains unchanged.
- id: R6
  text: Do not put raw reasoning into Worker State, Planner results, public events or UI. Existing independently
    configured OBS-R54-R60 capture and sensitive-output metadata-only rules continue to apply; this flag
    does not turn capture on.
- id: R7
  text: Preserve one tool-free terminal call, separate summarizer budget, trusted observations, summarized=true
    and existing cancellation/deadline semantics. The task must pass in a checkout with no compaction
    implementation; reusable helpers may be introduced only with this production caller.
failure_outcomes:
- operation: Authoring publication, normalized snapshot read and allocation validation
  permanent: Malformed or missing resolved boolean uses existing validation errors; public authoring returns
    the owning 400 classification before publication.
  retryable: Only existing storage_transaction_conflict/503 policy applies to catalog/Run writes.
  ambiguous: Reconcile existing publication/Run keys and exact digest; no extra version or receipt mechanism.
  cancelled: Request/Run owner joins writes and worker work before existing cleanup.
  timeout: Existing config request and Worker-call deadlines remain separate.
- operation: Terminal input projection and summarizer call
  permanent: Reasoning redaction/truncation is explicit; invalid output and overall input failure retain
    existing terminal summarizer failure classification. Missing reasoning is not a failure.
  retryable: Reuse bounded Gateway transport attempts; no semantic repair call.
  ambiguous: A lost Gateway response follows the existing transport contract; do not promise exactly-once
    billing.
  cancelled: Cancellation wins over late summary; close/join the call and clear temporary reasoning.
  timeout: Existing summarizer/Worker deadline applies without extension.
cardinality:
- collection: Terminal transcript and optional reasoning
  expected: One bounded prompt for one terminal call
  maximum: 512 KiB total prompt, 8 KiB per reasoning part and 64 KiB included reasoning per input document
  bound: Charge serialized UTF-8 bytes including tags and truncation markers; bound recorder retention
    and transient buffers, not only the final prompt.
lifecycle:
- entity: Resolved flag and transient terminal reasoning
  delete: Existing catalog/Run lifecycle owns config; invocation/allocation owner clears reasoning.
  cascade: No new table or retained reasoning artifact; terminal cleanup removes temporary projections.
  retention: Immutable flag follows snapshot retention; reasoning lives only with existing session/projection
    and independently authorized telemetry policy.
acceptance_criteria:
- id: A1
  given: Authoring omits the flag or explicitly selects either boolean
  when: Publication, snapshot reload and allocation validation run through real paths
  then: False is the authoring default; true/false survive exact pinning and digest checks; missing resolved
    or malformed values fail consistently in Go/Python/public readers.
- id: A2
  given: A normal Worker produces visible content, tool results and provider thought parts
  when: Terminal summarization runs with true, false, or a provider with no reasoning
  then: Only true includes available tagged ordinary-text reasoning in the actual Gateway request; all
    variants complete the terminal path without enabling compaction.
- id: A3
  given: Oversized multibyte reasoning and secret/path canaries compete with task and tool evidence
  when: Projection is built at and over each bound
  then: Input remains bounded, required higher-priority data is preserved according to terminal projection
    rules, truncation is marked, and sensitive content is absent from prohibited surfaces.
- id: A4
  given: A configured on.summarized transition, budgets and cancellation/deadline cases
  when: The real terminal Worker and Planner path runs
  then: There is one terminal summarizer attempt under existing budget semantics; trusted results stay
    summarized=true, handoff still works, and late replies cannot publish success.
- id: A5
  given: The flag changes while ordinary model replay and telemetry opt-in stay fixed
  when: Outgoing main-model requests and default/sensitive-output telemetry are inspected
  then: No raw reasoning replay or new content-capture permission is introduced; shared types and generated
    clients agree.
