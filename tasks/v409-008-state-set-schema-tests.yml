schema_version: "1.0"
id: V409-008
title: "Test every state CHECK set and partial-index predicate against its Go definition"
milestone: sql-review-2026-10
epic: persistence
kind: chore
priority: P3
status: pending
depends_on: []
languages: [go, sql]
goal: "A state added or renamed in Go without the matching schema change fails a test for every table, not only workflow_runs."
context:
  review: "docs/research/2026-10-23-sql-review.md, section B (state CHECK sets)"
  specification: docs/spec/platform/lifecycle.md
  finding: >-
    State CHECK sets exist on stage_executions (baseline:2136), audits
    (3360), audit_items (3236), audit_executions (3109), projects
    (2584/2589), eval_experiments (3817), eval_submissions (4078),
    audit_review_requests (3556), audit_findings (3469) and
    credential_operations (2653); the Go sets live in
    internal/runstore/types.go:91-98, internal/auditstore/types.go:37-68,
    internal/projectstore/types.go:36-39 and the Eval and credential
    packages. Only workflow_runs has TestPostgresRunStateSetsMatchSchema
    (internal/runstore/run_states_postgres_test.go:303). Partial-index
    predicates such as stage_executions_recovery_idx, audits_reconcile_idx,
    audit_executions_reconcile_idx and eval_experiments_claim_active_idx
    copy Go 'active' subsets with no test (AGENTS 3.1).
plan:
  - "Generalise the workflow_runs test into a table-driven test reading pg_constraint (CHECK) and pg_index (partial predicates) for each table above and comparing against an exported-for-test list per package (export_test.go hooks)."
  - "Where a Go set has no single definition (grep for string literals of state names outside the owning package), consolidate first."
scope:
  in:
    - "Table-driven schema test, consolidation of scattered state literals."
  out:
    - "Changing any state set."
acceptance_criteria:
  - id: A1
    text: "The test covers the ten tables and their partial-index predicates and fails when a state is added to Go only."
  - id: A2
    text: "No state name literal of those sets appears outside its owning package (source test)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/persistence/postgres/... ./internal/runstore/... ./internal/auditstore/... ./internal/projectstore/... ./internal/evalstore/... ./internal/credentials/..."
    covers: [A1, A2]
  - command: make lint
    covers: [A2]
