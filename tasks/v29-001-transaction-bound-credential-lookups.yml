schema_version: '1.0'
id: V29-001
title: Keep Run credential lookups on the owning PostgreSQL transaction
milestone: postgres-reliability-and-query-efficiency
priority: P1
status: pending
implementation_commit: null
depends_on:
- V8-005
- V8-016
languages:
- go
goal: Remove nested pool acquisition during Run creation and make transaction ownership explicit.
context:
  verified_evidence: 'PG-01: a two-connection pool with one LISTEN and one creation transaction times out after
    800 ms while PinRuntimeLabels requests a third connection. The same metadata lookup through pgx.Tx finishes
    in 1 ms. The probe uses a missing credential; acquisition blocks before existence is determined.'
  report: docs/reviews/2026-09-05-postgres-review.md
scope:
  in:
  - Pass the owning transaction into database-backed LLM credential metadata checks during pinning; preserve
    composite static/encrypted provider duplicate detection and deletion fences.
  - Make transaction-required pinning signatures or constructors explicit and audit the same call chain, including
    completed Audit start paths, for nested pool acquisition.
  out:
  - Pool-size increases as the correctness fix, secret decryption redesign or changes to Runtime label semantics.
requirements:
- id: R1
  text: After acquiring a transaction, its credential validation needs no additional pool connection.
- id: R2
  text: Unknown credentials, duplicate providers and concurrent credential deletion keep their current safe
    outcomes.
acceptance_criteria:
- id: A1
  given: A two-connection pool, a LISTEN connection and valid or missing RuntimeConfig LLM credentials.
  when: The real Run creation transaction pins configuration.
  then: Validation completes without pool starvation; missing credentials return their normal error and successful
    creation retains exact snapshots.
- id: A2
  given: Concurrent creation and credential deletion under pool saturation.
  when: Requests complete or are cancelled.
  then: There is no connection dependency cycle, leaked transaction or duplicate Run.
tests:
- name: postgres-integration
  command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -race ./internal/app ./internal/runtimeconfig
    ./internal/credentials ./internal/httpapi/public
  covers:
  - A1
  - A2
