schema_version: '1.0'
id: V410-009
title: Collect managed Playwright network observations into the sitemap
milestone: sitemap-browser-collection-2026-10
epic: http-tools
kind: feature
priority: P2
status: pending
depends_on:
- V410-002
- V410-007
- V412-001
languages:
- go
- python
- json
- yaml
- markdown
goal: Add optional BrowserContext-level request/response/failure metadata collection through the managed browser
  adapter while preserving identity separation, safe shared context and independent HTTP availability.
context:
  authority: User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence.
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 3-5 and 9-12: optional browser collector, source correlation, explicit coverage gaps
    and allocation lifecycle.'
  specification:
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/tools/http-caido.md
  - docs/spec/execution/control-plane.md
  - docs/spec/execution/worker.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or V61/V62/V64
    work.
  proposal_integration: Proposal 0033 managed browser adapter supplied by V412-001 is the required browser execution
    owner; this task only feeds its trusted network events into the sitemap.
  code:
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/src/contractor_runtime/toolsets/sitemap
  - runtime/src/contractor_runtime/toolsets
  - runtime/tests
  - tests/e2e
  - make/toolsets.mk
scope:
  in:
  - Subscribe at managed BrowserContext scope to request, response and failure events, including new tabs in the
    same identity context, using the actual adapter lifecycle.
  - Translate events to the common safe observation format with trusted identity/session/deployment/source provenance
    and available correlation tags.
  - Coalesce and flush through the bounded collector; distinguish request/response/failure/redirect outcomes and
    report unavailable/truncated evidence explicitly.
  - Join event handlers, parser threads and publishers before context/browser/allocation cleanup; stop accepting
    events after fencing.
  - Provide an optional selected capability, local browser fixtures and a registered process gate while leaving
    HTTP/OpenAPI Workflows independent.
  out:
  - Browser execution/identity policy or action DSL implementation owned by V412-001 and proposal 0033.
  - DOM extraction, journey graphs, screenshots as trusted proof, browser replay or a universal crawler framework.
  - Automatic capture of arbitrary sandbox scripts that do not use the helper/structured export or selected Caido
    import.
requirements:
- id: R1
  text: Collect only for explicitly selected managed browser/collector grants; an installed browser or generic sandbox
    script does not imply managed capture.
- id: R2
  text: Browser identity context includes trusted engagement/baseline plus local identity and session/state provenance;
    ordinary supported contexts remain Run-scoped. Tabs inherit only their owning managed context.
- id: R3
  text: Apply shared metadata normalization before constructing map keys/examples. Valid paths, names and finite
    structural values remain intact regardless of keywords, opaque appearance or known-credential matches; userinfo,
    fragments, nonstructural query values, raw headers and bodies remain outside the map model. Events carry no
    matching-secret list. Shared correlation preserves attribution, while absent correlation does not imply an exact
    physical request count.
- id: R4
  text: Use common pending/batch/context/member/provenance/publication bounds. A failed navigation/request is not
    a received HTTP response and a response event does not imply complete retained body evidence.
- id: R5
  text: Reading flushes the caller collector; cancellation/context close and allocation release join event/publisher
    work and retain explicit incomplete source state if pending metadata is lost.
- id: R6
  text: Optional browser absence yields a source-specific gap and never becomes a prerequisite of the first-slice
    HTTP/OpenAPI catalog; busy capacity is handled by the browser execution owner, not labelled absence here.
failure_outcomes:
- operation: Managed browser event capture and metadata normalization
  permanent: Unsupported event/projection, unknown identity context or unavailable browser capability reports a
    stable source gap; no fabricated response/evidence.
  retryable: Browser execution retries remain owned by V412-001; collector code does not repeat actions to obtain
    metadata.
  ambiguous: Correlate/deduplicate the same trusted event/request identity; otherwise retain bounded group attribution
    without exact count claims.
  cancelled: Context close/cancel drains and joins handlers and off-thread parsing before disposal.
  timeout: Capture/flush deadlines remain distinct from browser action/wait deadlines.
- operation: Publish browser batch or close collector
  permanent: Source/grant rejection, generic Artifact admission rejection or all-protected history capacity reports
    a separate nonautomatic-retry collection outcome without changing the browser action result.
  retryable: Use only the bounded reducer policy for storage conflicts and ArtifactStore eviction backpressure;
    collectors do not perform eviction or repeat browser actions.
  ambiguous: Replay accepted mutation receipts even after revision eviction without republishing or rerunning browser
    actions; exact evicted bytes remain unavailable.
  cancelled: Fenced allocation rejects late writes; cleanup joins every publisher.
  timeout: Drain expiry records incomplete collection and performs joined cleanup; no publisher outlives release.
cardinality:
- collection: Browser contexts, pages and network events
  expected: A few managed identities/tabs and coalesced request batches
  maximum: Managed browser context/page limits from V412-001 plus shared sitemap pending/batch/member/context limits
  bound: Subscribe once per owned context, coalesce bounded events and do not retain a DOM/journey or all-response
    graph.
- collection: Published browser metadata and exact references
  expected: Representative safe examples and sparse retained evidence links
  maximum: Proposal section 10 per-group limits, generic Artifact admission/operation limits and automatic common per-binding history policy
  bound: Record unavailable evidence and bounded gaps; do not materialize unbounded browser traces.
lifecycle:
- entity: Managed BrowserContext collector
  delete: Browser context owner closes and joins collector handlers before context/allocation release.
  cascade: Transient network buffers disappear with the context; committed shared metadata persists.
  retention: Selected safe proof/input context needs real holds before acceptance, atomically against eviction;
    metadata refs/receipts alone do not pin history. Browser traces and raw traffic are not archived implicitly.
acceptance_criteria:
- id: A1
  given: Managed anonymous/A/B contexts with new tabs, redirects and failed requests
  when: A controlled local browser application generates network events
  then: Context-level capture retains correct distinct identity/session/outcome provenance and does not confuse
    failure with response.
- id: A2
  given: Credential-like and opaque URL metadata, excluded URL/header/body fields and mixed source-mode contributions
  when: Events reach map publication and dedicated blackbox snapshots
  then: Valid metadata is retained without secret filtering or matching-secret transport, fields outside the model
    remain excluded and dedicated snapshots enforce source-mode authority. General browser credential handling and
    telemetry redaction are unchanged; ordinary owner-selected inputs remain authorized in full.
- id: A3
  given: HTTP/browser events with and without trusted correlation
  when: They contribute concurrently
  then: Available correlation retains source attribution; absent correlation does not fabricate request identity/counts
    and existing map updates survive.
- id: A4
  given: Event bursts, protected-history conflicts, eviction backpressure and context cancellation during flush
  when: Real browser/Runtime/Server/PostgreSQL execute the lifecycle
  then: Shared Artifact admission/retention bounds hold without a custom Run quota, retries never repeat browser actions and
    handlers/publishers join before release; receipts cannot republish evicted history.
- id: A5
  given: Missing optional browser capability and a first-slice HTTP/OpenAPI Workflow
  when: The catalog is selected and executed
  then: Browser collection reports its gap while the independent first slice remains runnable; installed-browser
    presence is not mistaken for a managed capability.
deliverables:
- path: runtime/src/contractor_runtime/toolsets/common
  description: Managed browser event adapter into the existing joined collector, without sibling Toolset imports.
- path: make/toolsets.mk
  description: New test-sitemap-browser-e2e target with a real locally installed supported browser, real component
    processes and mandatory case manifest; register in release graph.
- path: runtime/tests
  description: Event fixtures plus actual browser context lifecycle/canary tests, with no external target or paid
    model requirement.
tests:
- command: uv run --project runtime pytest runtime/tests/test_sitemap_*.py runtime/tests/test_pentest_browser_*.py
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-postgres
  covers:
  - A3
  - A4
- command: make test-sitemap-browser-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-e2e
  covers:
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- V412-001 owns the managed browser adapter and its production suites; align the test_pentest_browser_*.py pattern
  with its actual created suite names before implementation completion, and fail any zero-match selection.
- test-sitemap-browser-e2e is a new deliverable requiring a supported local browser, disposable PostgreSQL and actual
  Server/Runtime; optional product capability is not permission for the dedicated feature gate to skip missing browser
  prerequisites.
