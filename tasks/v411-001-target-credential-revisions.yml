schema_version: '1.0'
id: V411-001
title: Pin immutable target credential revisions in the existing encrypted store
milestone: autonomous-http-pentest-2026-10
epic: runtime-config
kind: feature
priority: P1
status: in_progress
depends_on: []
languages:
- go
- python
- sql
- json
- yaml
goal: Let an owner prepare Basic, bearer and login-field target identities whose exact encrypted content
  can be pinned and held by an Audit without exposing secrets or introducing a second credential service.
context:
  authority: User request on 2026-10-24 to decompose the updated proposals into implementation tasks.
    This record authorizes no implementation during planning and does not reactivate deferred work.
  proposal:
  - docs/proposals/0033-autonomous-pentest-audits.md#3-engagement-document-and-immutable-baseline
  - docs/proposals/0033-autonomous-pentest-audits.md#6-identities-login-and-test-data
  - docs/proposals/0033-autonomous-pentest-audits.md#61-login-recipe
  specification:
  - docs/spec/configuration/runtime-config.md#RCF-R110
  - docs/spec/configuration/runtime-config.md#RCF-R112
  - docs/spec/configuration/runtime-config.md#RCF-R115
  - docs/spec/configuration/runtime-config.md#RCF-R177
  - docs/spec/audits/audits.md#AUD-R16
  - docs/spec/platform/persistence.md#PER-R24
  code:
  - internal/credentials
  - internal/httpapi/public/credential_handlers.go
  - internal/contracts
  - runtime/src/contractor_runtime/contracts
  - api/openapi/contractor-public-v1.yaml
scope:
  in:
  - Extend existing credential create/list/read/delete services and public handlers with target-basic@1,
    target-bearer@1 and target-login@1; register additive public types and regenerate clients.
  - Define exact public credential revision references using the existing immutable credential identity
    wherever it already provides the required content identity; bind owner and kind and prohibit secret-derived
    public hashes.
  - Extend existing reference-aware holds and private material resolution for target revisions, including
    concurrent delete/hold acquisition and safe metadata. Add the required migration to the existing
    store.
  out:
  - Engagement start and allocation projection are V411-002; actual private injection/login is V411-005.
  - No generic MCP configuration/V61 reactivation, alias service, new credential database or secret
    export into a sandbox.
requirements:
- id: R1
  text: Credential CRUD handlers and their existing API/CLI consumers are the production callers in
    this change; no unused schema-only credential APIs. Every input is strictly validated on write
    and read.
- id: R2
  text: Keep the existing Basic/bearer field limits; target-login has at most 16 named fields and
    16 KiB total within the existing 32 KiB encrypted plaintext bound. Public responses expose names,
    identity/revision and non-secret metadata only.
- id: R3
  text: Creation replay uses the existing keyed mutation/credential identity mechanism; changed content
    never replaces an existing identity. Exact refs must preserve owner, kind and revision; supported
    mutable references are resolved before a later Audit can hold them.
- id: R4
  text: Add shared valid/invalid target credential reference/material fixtures under api/testdata
    and matching Go/Python/private schema checks. Canary secrets must be absent from errors, logs,
    events, metadata and generated public examples.
failure_outcomes:
- operation: Create/read/delete a target credential
  permanent: Use existing 400 runtime_config_invalid, 409 runtime_config_conflict/runtime_credential_in_use
    and safe 404 not_found; deterministic validation or reference rejection is permanent.
  retryable: Use existing 503 storage_transaction_conflict with Retry-After and the existing bounded
    transaction retry policy; do not retry arbitrary errors.
  ambiguous: Reconcile the original create/delete key and credential/tombstone identity; never submit
    a new key after a lost response.
  cancelled: The synchronous credential service joins transaction/material callbacks before returning
    and wipes plaintext on every exit.
  timeout: Credential API and storage timeouts remain distinct from future target-request/login timeouts.
- operation: Resolve or hold an exact target revision
  permanent: Missing/foreign/wrong-kind refs return safe not-found or existing validation failure
    without exposing secret existence; a deleted revision cannot be silently rebound.
  retryable: Only classified storage conflicts retry within the original service deadline.
  ambiguous: Re-read the original reference hold under its existing lifecycle fence; do not create
    duplicate holds.
  cancelled: Reference owner releases uncommitted holds and joins decryption; committed references
    follow owner lifecycle.
  timeout: The hold transaction uses the existing bounded database deadline; expiry never authorizes
    secret fallback.
cardinality:
- collection: Credential revisions within an owner and one future engagement
  expected: Three selected identities; one exact revision per authenticated identity
  maximum: Eight identities per engagement; owner credential history is paginated
  bound: At most 100 metadata rows per bounded page and 256 KiB response; existing lower API limits
    win. Never load all owner credentials to validate eight refs.
- collection: One target-login material
  expected: A username/password pair
  maximum: 16 fields, 16 KiB aggregate values, 32 KiB encrypted plaintext envelope
  bound: Validate total bytes and field count before encryption/decryption output; no unbounded map
    iteration or logging.
lifecycle:
- entity: Target credential revision and reference hold
  delete: Existing authenticated credential owner/administrator deletion is rejected while any binding,
    Run, allocation or active Audit hold uses it.
  cascade: Use existing credential tombstone and hold release paths; do not cascade-delete live users.
  retention: Encrypted revision remains until authorized deletion; no plaintext persists outside the
    existing encrypted/material boundary.
acceptance_criteria:
- id: A1
  given: Valid Basic, bearer and login-field inputs
  when: The existing credential API creates, lists and privately resolves each kind
  then: Exact identity/revision and non-secret metadata round-trip; public reads cannot recover material.
- id: A2
  given: Duplicate keys, unknown members, invalid Unicode, excessive fields/bytes or wrong kind
  when: Each Go/Python decoder and public write reads the same fixtures
  then: All reject consistently with permanent bounded errors and no secret canary leakage.
- id: A3
  given: A held revision and concurrent delete/hold acquisition in real PostgreSQL
  when: Both operations race, including MaxConns=1
  then: Reference safety holds without nested-pool deadlock; deletion either wins before pinning or
    is rejected.
- id: A4
  given: A committed create or delete whose response was lost
  when: The original idempotency key is retried
  then: The same identity/tombstone is returned without another revision or changed content.
- id: A5
  given: Runtime material callback failure/cancellation
  when: Resolution exits and logs/events/public artifacts are inspected
  then: Material is wiped and no secret bytes or secret hashes are exposed.
tests:
- command: go test -tags=integration -count=1 ./internal/credentials/... ./internal/runtimeconfig
    ./internal/httpapi/public ./internal/contracts/...
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-runtime-credentials verify-public-api test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Disposable PostgreSQL able to create/drop isolated schemas; never print its connection secret.
- Repository-pinned Go and locked Runtime dependencies; run commands from the repository root unless
  the command explicitly changes directory.
verification_requirements:
- Use testdata fixtures, never the live configs tree outside the documented e2e/eval exceptions. Keep
  model choice unchanged; deterministic targets need no real Gateway.
- Run every touched package in full, including any new package introduced by this task. Database tests
  require disposable PostgreSQL through CONTRACTOR_TEST_DATABASE_URL; an unreachable configured database
  fails and skipped mandatory cases do not pass.
- New shared fixtures must be registered with their Go/Python/schema readers in the existing shared-fixture
  gate. New process selections must fail when zero tests match and be reachable from release-verify.
- Update the owning normative specification, shared limits/errors/lifecycle registries and public/private
  contracts in the same change. Preserve existing contract ownership; do not add backward-compatibility
  readers or edit generated clients manually.
progress:
  checkpoint: 2026-10-24 20:26 MSK, branch claude/pentest after merging main ee2c9658.
  done:
  - target-basic@1, target-bearer@1 and target-login@1 are runtime credential kinds in the existing
    encrypted store (internal/credentials/runtime_types.go) with constructors, strict canonical
    re-decoding of stored plaintext and validRuntimeCredentialKind; the public create decoder
    (internal/httpapi/public/types_configuration.go) accepts them. Migration
    000040_target_credentials.sql widens runtime_credentials_credential_kind_check (renumber if
    another lane lands 000040 first).
  - OpenAPI adds TargetBasicMaterial, TargetBearerMaterial and TargetLoginMaterial, the three
    CreateRuntimeCredentialRequest variants and the RuntimeCredentialKind enum values (additive);
    UI and Go public clients regenerated; the Operations credential form offers the three kinds
    (login fields reuse the named-row editor).
  - Spec RCF-R184 (new), RCF-R111 cross-reference, LIM-RCF-30 (1-16 fields) and LIM-RCF-31 (16 KiB
    values) in runtime-config.md and platform/limits.md.
  - Tests TestTargetCredentialMaterialRoundTripsThroughCanonicalDecoding,
    TestTargetLoginCredentialRejectsOutOfBoundsFields,
    TestTargetLoginMaterialIsWipedAfterCallbackFailureAndNeverFormatted (internal/credentials) and
    TestTargetCredentialCreateReturnsOnlySafeMetadata (public, canary absent from success and 400).
  verified:
  - go test -tags=integration -count=1 ./internal/credentials/... ./internal/httpapi/public
    ./internal/persistence/... with CONTRACTOR_TEST_DATABASE_URL set (all ok, migration 000040 applied).
  - make verify-public-api passed; ui tsc --noEmit and vitest src/routes/operations (78 tests) passed.
  - make lint passed after make docs-dependencies and make docs-erd (schemaVersion 000040).
  - Not yet run for this task, make test-wire-cross-language (no new shared fixture yet) and the
    task's make test-runtime-credentials, which does not exist (see open).
  decisions:
  - The exact revision is the existing immutable runtime credential identity (create-only rows, no
    update), so an exact ref is the pair credentialId and kind; owner binding is RuntimeCredentialUser.MayUse
    (creator or Operations). No secret-derived public hash; replay keeps the RCF-R177 HMAC receipt.
  - Login field names match ^[a-z][a-z0-9_-]{0,63}$; values are bounded secrets (UTF-8, no control
    characters, 1-8192 bytes) because login values are form fields, not header field values. Basic
    and bearer keep the http-origin rules (RCF-R114).
  - Audit dispatch holds and the delete fence look up by credential ID regardless of kind
    (auditstore CredentialHolds.ListHeldAuditIDsByRuntimeCredential), so target kinds are held by
    the existing mechanism; A3 still needs its own real-PostgreSQL race test.
  open:
  - The task's test command names make test-runtime-credentials, which does not exist in the
    Makefile; either add that target (zero-match failing, reachable from release-verify) or correct
    the task. Needs the coordinator's call.
  - Proposal 0033 section 6 says public reads return login field names; RCF-R115 currently exposes
    only ID, kind and creation metadata. Needs a non-secret field-name column (migration),
    RuntimeCredentialMetadata.fieldNames and an additive OpenAPI member, plus an RCF-R115 update.
  next:
  - Shared fixture api/testdata/v1alpha1/target-credential-cases.json (valid/invalid material and
    exact refs, duplicate keys, unknown members, invalid Unicode, too many fields/bytes, wrong
    kind) with Go readers (credentials, public decoder and OpenAPI verdicts), a Python reader and
    private-schema $defs; register in api/testdata/readers.json.
  - Exact ref resolution for an owner (safe not-found for missing/foreign/wrong-kind) in the
    runtime credential service, with its production caller; A3 delete/hold race test including
    MaxConns=1; A4 lost-response replay of create/delete for each target kind; A5 wipe on callback
    failure/cancellation with canary checks.
  - Decide the field-name metadata question, then run every command in the tests list and make lint.
