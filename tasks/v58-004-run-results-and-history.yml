scope:
  in:
  - Use compact completed Run rows with workflow, context, state and time; identity and labels expand
    on demand, filters and pagination remain complete.
  - Make primary result reading the main action of a successful Run, retaining all outputs, diagnostics
    and repeat behavior.
  - Use state-specific next actions and preserve controlling Audit/Project/Eval links and exact revisions.
  out:
  - Changes to execution, audit evidence or security boundaries unrelated to UI behavior.
  - New evaluation experiment or toolset-configuration protocols tracked separately in V41/V56.
