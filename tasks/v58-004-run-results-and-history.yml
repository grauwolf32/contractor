  text: Use compact completed Run rows with workflow, context, state and time; identity and labels
    expand on demand, filters and pagination remain complete.
- id: A2
  text: Make primary result reading the main action of a successful Run, retaining all outputs, diagnostics
    and repeat behavior.
- id: A3
  text: Use state-specific next actions and preserve controlling Audit/Project/Eval links and exact
