schema_version: "1.0"
id: V11-007
title: Add workspace-changes@1 diff rollback and memory materialization
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-004, V11-005]
languages: [python, go]

goal: >-
  Let a Worker inspect and atomically discard allocation-private overlay changes,
  and establish a new allocation-local baseline for overlay-memory without
  exposing overlay internals or mutating a host project in the MVP.

context:
  exact_tools: >-
    workspace-changes@1 exports changed_paths, diff, rollback_changes and
    materialize_changes. The first three require an overlay. In this task,
    materialize_changes is available only for overlay-memory: it atomically
    replaces the allocation-owned lower, clears upper state and makes later
    diffs relative to that new lower. Crash-safe overlay-local host
    materialization is deliberately implemented by V11-010.
  change_contract: >-
    Changes are classified as sorted added, modified, deleted and typeChanged
    virtual paths. Unified diff uses only virtual a/... and b/... labels,
    deterministic context and explicit create/delete/type headers. Visible diff
    is at most 128 KiB/400 lines and returns total bytes plus truncated.

scope:
  in:
    - Implement changed_paths(path="/mount") over immutable overlay snapshots with deterministic sorted classifications and exact counts.
    - Implement bounded unified text diff for add/modify/delete/type changes and a bounded Binary files differ marker for an unreadable local-lower file.
    - Implement rollback_changes for a path/subtree and full recursive mount reset, revealing the current lower without mutating it.
    - Implement atomic overlay-memory materialization by building replacement lower state before swapping and clearing upper under the session lock.
    - Make calls against direct/read-only/non-overlay or overlay-local materialization return workspace_operation_unsupported without state change.
    - Record content-free counts, diff sizes/truncation, duration and stable outcomes in allocation metrics; never retain diff text or lower fingerprints.
    - Add the exact static descriptor and parity tests; keep all implementation and change state in Python Runtime.
  out:
    - Host materialization, journal/recovery, patch serialization, Artifact export, Server filesystem state/API, fork/merge or automatic finalization behavior.

deliverables:
  - {path: runtime/src/contractor_runtime/projectfs/changes.py, description: Snapshot classification deterministic diff rollback and memory commit service.}
  - {path: runtime/src/contractor_runtime/toolsets/workspace_changes.py, description: Narrow ChangeSet/Materializer ADK Toolset.}
  - {path: runtime/tests/test_workspace_changes.py, description: Classification diff rollback bounds and atomic memory materialization tests.}
  - {path: internal/config/descriptors.go, description: Static workspace-changes@1 exported-name metadata only.}
  - {path: internal/config/config_test.go, description: Exact descriptor and Runtime parity coverage.}

requirements:
  - id: R1
    text: Inspecting or rolling back changes never calls a lower mutation method and never serializes upper data outside the allocation process.
  - id: R2
    text: Diff truncation is explicit and deterministic; a truncated page cannot be mistaken for a complete patch or used as a hidden materialization format.
  - id: R3
    text: Failed/cancelled rollback or memory materialization preserves the complete previous effective view, lower and upper.
  - id: R4
    text: Until V11-010 succeeds its probes, an overlay-local mount never gains host materialization authority merely because the static tool name exists.

acceptance_criteria:
  - id: A1
    given: Overlays containing additions modifications deletions empty dirs and both directions of file/directory type change.
    when: changed_paths and diff run repeatedly on local and memory lowers.
    then: Classification/order/output are deterministic, virtual-only and honestly bounded.
  - id: A2
    given: A subtree and a complete mount with pending changes.
    when: rollback succeeds or is cancelled at an injected pre-commit boundary.
    then: Success removes exactly the selected changes and failure preserves the exact prior overlay snapshot and lower.
  - id: A3
    given: overlay-memory and overlay-local mounts with identical pending changes.
    when: materialize_changes is called.
    then: Memory commits atomically and resets its baseline while local returns unsupported and no host byte changes.

tests:
  - {name: workspace-changes, command: "cd runtime && uv run pytest tests/test_workspace_changes.py", covers: [A1, A2, A3]}
  - {name: descriptor, command: "go test ./internal/config", covers: [A1]}
  - {name: workspace-regression, command: "cd runtime && uv run pytest tests/test_workspace_overlay.py tests/test_workspace_changes.py", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
