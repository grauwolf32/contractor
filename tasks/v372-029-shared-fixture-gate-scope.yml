schema_version: "1.0"
id: V372-029
title: "Extend the shared fixture gate to every cross-language fixture"
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V369-002
priority: P3
status: in_progress
depends_on: []
languages: [python, go]
goal: "Every fixture that Go, the Runtime or the UI read together falls under the shared fixture gate's naming, reader and declared-readers checks wherever it lives."
context:
  review: "Out-of-scope findings of the hub audit fix batch, wave 2 (group w2b: V370-017, V369-002, V370-005), recorded 2026-10-12; file:line verified on b2b09ea"
  revalidated: >-
    2026-10-24 on b523ae77. Narrowed to the fixture scope: the second part of
    the original task (the gate re-running the PostgreSQL Eval store tests
    inside release-verify-families, A2) was delivered by V408-005
    (0a2bb8e27b2b4c27c1f6b26ad5a3a96df7d11c88). Inside release-verify,
    run-family-test (Makefile:41) turns every command of
    test-wire-cross-language (make/core.mk:49-52) into a no-op, so
    test-worker-session-modes-hardening (make/toolsets.mk:77) no longer runs
    the gate in release-verify-families, and test-release-shared-fixtures
    (make/core.mk:36-38, in release-verify-unit, make/release.mk:25) checks
    the shared tests from the go-unit report and the Runtime read log without
    running them again; make -n release-verify-families RELEASE_CONSOLIDATED=1
    shows no shared_fixture_gate.py call and python3
    scripts/check_release_verify_graph.py passes. V408-005 kept unit and race
    passes as distinct obligations, so the same Eval store tests also run in
    the race stages by decision. The fixture-scope finding still holds:
    scripts/shared_fixture_gate.py:40-41 still roots FIXTURES and MANIFEST at
    api/testdata, and the directories below are still read by several sides.
    introduced_by added: V369-002 created the gate with that root.
  finding: >-
    scripts/shared_fixture_gate.py, added by V369-002, enforces TestShared*
    and test_shared_* naming, contractstest reads and declared readers only
    for fixtures under api/testdata (FIXTURES and MANIFEST,
    shared_fixture_gate.py:40-41; fixture_files at :96, the Go path checks at
    :130-160 and the UI import pattern, which matches only api/testdata/).
    Fixtures read by more than one side elsewhere escape it:
    testdata/memory (cases.json and projections.json: internal/memory
    codec_test.go and projection_test.go, runtime/tests/test_memory.py:33 and
    test_memory_toolset.py:186), testdata/agent-skills (internal/agentskills
    validate_test.go and hardening_test.go, internal/config/agent_skills_test.go,
    runtime/tests/test_agent_skill_package.py:30-31),
    testdata/source_member_paths.json (internal/sourcebundle/bundle_test.go,
    named by bundle.go:38, and runtime/tests/test_source_analysis_toolset.py),
    the finding fixtures of internal/auditdomain/testdata
    (finding-collection-v1.fixture.json, finding-http-attempts.json,
    finding-locations.json: the internal/auditdomain tests,
    runtime/tests/test_finding_facades.py:46-50 and
    test_findings_reader_toolset.py:41, ui/src/api/http-exchange.test.ts:3,
    ui/src/routes/projects/audits/finding-locations.test.tsx and
    tests/e2e/findings_boundaries_process_test.go:159) and
    api/scan/v1/testdata/worker-error-codes.json (internal/planner/scan
    error_codes_test.go:23, pinned to the Server's table in report.go:176;
    runtime/tests/test_scan_error_codes.py:10;
    ui/src/routes/artifacts/scan-report-summary.test.tsx:3). None of those
    tests carries the shared naming, so the gate can neither prove that each
    side still reads its fixture nor stop an undeclared reader.
  siblings: >-
    testdata/configs and testdata/configs-scan are Go-only configuration
    fixtures and stay outside. api/scan/v1/testdata also holds Go-only scan
    report cases (valid.json, invalid-*.json) that need a readers entry with a
    reason or stay outside by an explicit exclusion. V371-021 and V372-016 own
    the time budgets of individual PostgreSQL tests.
scope:
  in:
    - "The gate covers the fixture locations above, either moved under api/testdata with their readers repointed or declared as extra roots in the gate and readers.json, with the same naming, contractstest and reader rules; each Go, Runtime and UI reader of them becomes a declared shared reader."
    - "A gate self-test (scripts/test_shared_fixture_gate.py) for a fixture outside api/testdata."
  out:
    - "The content of the fixtures and the cross-language verdicts."
    - "Where release-verify runs the gate, which V408-005 settled."
acceptance_criteria:
  - id: A1
    given: "A fixture in one of the covered locations outside api/testdata"
    when: "Two sides read it without a declared readers entry, or a declared side stops reading it"
    then: "The gate fails, as it does for api/testdata; the gate self-test proves it."
  - id: A2
    text: "Every fixture listed in the finding is covered by a readers entry and read through the shared naming, and the gate passes on the changed tree."
  - id: A3
    text: "The new gate self-test fails on the unfixed gate (b523ae77), which ignores fixtures outside api/testdata."
tests:
  - command: "python3 scripts/shared_fixture_gate.py --sources-only"
    covers: [A1, A2]
  - command: "python3 -m unittest discover -s scripts -p 'test_*.py'"
    covers: [A1, A3]
  - command: "python3 scripts/check_release_verify_graph.py"
    covers: [A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> make test-wire-cross-language"
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2]
