title: Integrate Workflow Planner subtask budgets with current main
milestone: workflow-planner-subtask-budgets-2026-10
epic: planner-worker
kind: chore
introduced_by: V384-001
priority: P2
status: in_progress
depends_on: [V384-001, V384-002]
languages: [go, typescript, markdown]
goal: >-
  Merge the completed Workflow subtask budget branch into main while retaining
  both branches' contracts, generated clients and independently tracked tasks.
context:
  request: On 2026-10-15 the user requested merging feat/v380-workflow-subtask-limit into main.
  finding: >-
    tasks/done/v380-001-workflow-planner-subtask-limit.yml:2 uses V380-001,
    which current main already assigns to Project active-check policy;
    tasks/index.yml, tasks/BACKLOG.md and ui/package.json also changed on both branches.
  specification:
    - docs/spec/configuration/workflows.md
    - docs/spec/execution/planners.md
    - docs/spec/platform/limits.md
scope:
