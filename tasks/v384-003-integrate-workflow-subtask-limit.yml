    - Renumber the incoming feature and fixture tasks without changing their implementation evidence.
    - Reconcile main, regenerate combined generated artifacts and advance the UI patch version.
    - Verify strict Workflow configuration, pinned Planner limits, PostgreSQL session persistence, continuation and public contracts on the combined revision.
    - Land the verified result in local main with a merge commit preserving the original branch history.
  out:
    - New feature behavior, model changes, schema changes, demo deployment and unrelated branches.
acceptance_criteria:
  - id: A1
    text: Both task histories have unique IDs, valid dependencies and milestone exits; generated backlog and public clients reflect the combined contracts.
  - id: A2
    text: The incoming feature and fixture checks pass on the combined revision with disposable PostgreSQL configured, including the complete Go suite, UI checks and shared fixtures.
  - id: A3
    text: The original feature branch is an ancestor of local main and the user's uncommitted primary-checkout files are preserved.
tests:
  - command: make test-config
