schema_version: "1.0"
id: V372-025
title: "Give every enum of the public OpenAPI document a type"
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [yaml, go, typescript]
goal: "Every enum of contractor-public-v1.yaml declares its type, the generated Go client gets typed fields and parameters instead of interface{}, and a contract test rejects a new untyped enum."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; file:line verified on b2b09ea"
  specification: "docs/spec/api/public-api.md#API-R68"
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds and has grown. A walk of
    the parsed document (tolerating its repeated YAML anchors) counts 134
    enums without a type (111 on b2b09ea); 130 are string-valued and 4 are
    boolean-valued (StageContentResult summarized and error.retryable,
    yaml:14103, 14111, 14119 and 14123), so "all are string-valued" no longer
    holds. A third untyped query parameter appeared: scope of
    listFindingDuplicateCandidates (yaml:6303-6310). Lines below were
    re-read. No non-generated Go code references the affected generated
    types today, so the CLI needs no adaptation unless that changes.
  finding: >-
    The step query parameter of getPerformanceHistory is
    schema: {enum: [15s, 1m, 5m, 1h]} without a type
    (api/openapi/contractor-public-v1.yaml:6167, and the same enum in a
    schema property at :16187), and so are the verdict filter of the Audit
    findings list (:4379) and the scope filter of the finding duplicate
    candidates (:6303-6310). OpenAPI 3.1 allows an enum without a type, but
    the generator of the Go client bundled with the CLI (API-R68) then emits
    interface{}: GetPerformanceHistoryParams.Step
    (internal/publicclient/generated/public.gen.go:8631),
    ListAuditFindingsParams.Verdict (:8250) and
    ListFindingDuplicateCandidatesParams.Scope (:8258), so a caller can pass
    any value and the compiler checks nothing. The same holds for schema
    properties, for example RunRecovery.code (yaml:14765), which the Go
    client exposes as Code interface{} (public.gen.go:6865). The UI
    generator infers literal unions and is not affected. Predates the
    shallow history (boundary 6349621).
  siblings: >-
    The generated files are never edited by hand (AGENTS.md section 2): make
    generate-public-client and make ui-generate rebuild them. CLI code under
    internal/cli that fills an affected parameter must compile against the
    typed field (none does on b523ae77). TestPublicOpenAPIContractIsValidAndPolicySafe
    (internal/httpapi/public/openapi_contract_test.go:36) is the natural
    home of the new rule. Any Go decoder of the document used by the test
    must accept the repeated anchors it already contains (PyYAML's
    SafeLoader rejects them).
scope:
  in:
    - "Add type: string to every string-valued untyped enum and type: boolean to the four boolean-valued ones, regenerate the Go client and the UI types, and adapt any CLI caller to the typed fields."
    - "A contract test that fails on an enum without a type, or with a type that does not match its values."
  out:
    - "The enum values themselves; the change is additive within /v1."
acceptance_criteria:
  - id: A1
    given: "the public OpenAPI document"
    when: "the contract test walks every schema, parameter and property"
    then: "no enum lacks a type or has a type its values do not satisfy, and a probe enum without a type fails the test"
  - id: A2
    text: "The generated Go client has no interface{} field or parameter that comes from an enum (Step, Verdict, Scope and RunRecovery.Code among them), and make verify-public-api and make ui-verify pass with freshly generated files."
  - id: A3
    text: "The contract test fails on b523ae77."
tests:
  - command: "go test ./internal/httpapi/public ./internal/publicclient/... ./internal/cli"
    covers: [A1, A2, A3]
  - command: "make verify-public-api"
    covers: [A1, A2]
  - command: "make ui-verify"
    covers: [A2]
  - command: make lint
    covers: [A1, A2]
