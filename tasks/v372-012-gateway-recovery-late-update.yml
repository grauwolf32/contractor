schema_version: "1.0"
id: V372-012
title: "Keep a late model-recovery update of an ended Stage from moving its Run back to waiting"
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P2
status: in_progress
depends_on: []
languages: [go]
goal: "A failed or acquire update from a participant whose Stage has already ended cannot create a recovery wait or move its Run to waiting; a PostgreSQL race test shows this for allocation and Planner participants, or the task records why the race cannot occur."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2h: V370-001), recorded 2026-10-12; the hub audit's suspected race (exec-state 3.2, docs/research/2026-10-11-hub-audit/exec-state.md:158-166), not reproduced yet; code path verified on b2b09ea"
  specification: "docs/spec/execution/scheduler.md#SCH-R108"
  severity: medium
  finding: >-
    gatewayrecovery's running and waiting transitions are not fenced by the
    participant or its Stage. Service.update
    (internal/gatewayrecovery/requests.go:96-216) locks the Run through
    lockRun (runs.go:37-45), which checks only the Run state (acceptsUpdate,
    store.go:73-82: pending, running and waiting accept every update), and
    then a failed (line 144) or a blocked acquire (line 151) calls setWaiting
    (waiting.go:13-20), which inserts a gateway_recovery_waits row for the
    participant and calls RunStates.EnterWaiting. EndStage (waiting.go:52-64)
    deletes the Stage's waits inside the transaction that ends it (SCH-R107),
    but nothing stops a later update of that Stage's participant from
    inserting a new wait: if it commits after EndStage while the Run runs a
    later Stage, the Run moves to waiting on a wait that no participant will
    clear until that later Stage ends. Allocation participants are fenced by
    the private handler, which refuses acquire and failed from a
    write-fenced allocation (internal/httpapi/privateartifacts/gateway_recovery.go:36-52)
    while it holds the allocation's write grant; whether the fence always
    precedes the transaction that ends the Stage, also across a Server
    restart, is unproven. Planner participants (Participant.Update,
    requests.go:86-92, created per Stage in
    internal/scheduler/planner_invocation.go:23-27) have no fence at all, and
    SCH-R108 re-delivers their abandoned updates on a detached context. The
    hub audit marked this SUSPECTED and asked for a race test. The code
    predates the shallow history (boundary 6349621).
  siblings: >-
    Terminal updates (succeeded, finished, released) clear waits and must
    stay accepted after the Stage began to end (SCH-R108, FAIL-SCH-14). The
    unchanged-update fast path (Service.unchanged, requests.go:218-256,
    SCH-R165) decides without locks and must keep its answers. Admission
    (admission.go) and manual retry (waiting.go:119) move Runs too and are
    in scope for the same check.
scope:
  in:
    - "A PostgreSQL test for each participant kind: the Stage ends (EndStage commits) and the Run moves on, then a delayed failed or acquire update of the ended Stage's participant is applied."
    - "Refuse non-terminal updates whose durable participant Stage is no longer running, before any recovery write and under the existing Run row lock. Healthy-route acquires read the same participant fact in their single snapshot. Use the existing non-retryable unavailable answer."
  out:
    - "The recovery policy (windows, probes and delays) and the terminal-update rules of SCH-R108."
failure_outcomes:
  - operation: "A failed or acquire update from the participant of an ended Stage"
    permanent: "gatewayrecovery.ErrUnavailable, answered 409 recovery_unavailable with retryable false on the private API; no wait is written and the Run state is unchanged."
    retryable: "A transaction conflict uses the existing bounded transaction retry."
    ambiguous: "Not applicable: a refused update writes nothing."
    cancelled: "The transaction rolls back with the request context."
    timeout: "The existing private request budget owns it."
acceptance_criteria:
  - id: A1
    given: "A Run whose Stage N ended while its Planner or Worker model call was in flight, and whose Stage N+1 is running"
    when: "The Stage N participant then reports failed or acquire"
    then: "No recovery wait is recorded and the Run stays running."
  - id: A2
    text: "Terminal updates of the ended Stage still relinquish its probe, and updates of the active Stage behave as before."
  - id: A3
    text: "The race test fails on b2b09ea, or the task records why the race cannot occur."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/gatewayrecovery ./internal/scheduler ./internal/httpapi/privateartifacts"
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/gatewayrecovery"
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/runstore/... ./internal/persistence ./internal/persistence/postgres ./internal/archtest"
    covers: [A1, A2, A3]
boundary_decision:
  guarantee: Non-terminal updates read the participant's exact durable running Stage before any recovery mutation; the Run lock orders that fact with the Scheduler's terminal commits.
  choice: >-
    Recovery reads Stage and allocation primary keys through explicit read
    grants in the table ownership registry. The active-participant predicate
    is shared by its one lock-free snapshot and its guarded transaction.
    Run locks and Run state writes still go through RunStates; no Stage is
    written or locked by recovery.
  alternatives: >-
    A separate participant lookup through the RunStates port would add a
    second read to every healthy model call, contrary to SCH-R165. A liveness
    cache or tombstone would duplicate durable Scheduler state and require
    another recovery mechanism. Moving recovery route reads into RunStore
    would couple the higher store to the lower recovery authority's state.
  reopen_when: Stage lifecycle transitions no longer serialize on the Run row, or participant identity gains a new kind.
cardinality:
  - collection: Active participant lookup
    expected: One Stage row for a Planner; one allocation and its Stage for a Worker.
    maximum: One row per primary key; no collection scan or lock is introduced.
verification:
  date: "2026-10-20"
  baseline: >-
    Six deterministic PostgreSQL cases failed before the fix, for Planner
    and allocation participants after real CommitResultProgression and the
    next Planner start. Late failed and blocked-acquire updates moved the Run
    back to waiting and created a new wait; failed also wrote a receipt.
    Healthy acquires still granted calls to the ended Stage.
  siblings: >-
    The healthy fast path shares the same durable Stage predicate and still
    answers while Run and route rows are locked. Terminal updates remain
    accepted after Stage end; cancellation and probe-release suites pass.
    Allocation cases recreate the service after progression, exercising the
    durable binding across authority restart. Admission and manual retry are
    Run-level operations: EndStage removes old membership, and the existing
    progression regression still proves an old route cannot be retried from
    the later Stage. Test fixtures now create actual running Stages and bind
    Planner identity to StageExecution ID rather than invocation ID.
  passed:
    - "go test -count=1 ./internal/gatewayrecovery ./internal/scheduler ./internal/httpapi/privateartifacts ./internal/runstore/... ./internal/persistence ./internal/persistence/postgres ./internal/archtest: all full packages passed with PostgreSQL."
    - "go test -tags=integration -count=1 ./internal/gatewayrecovery: passed with PostgreSQL."
    - "make lint: passed."
