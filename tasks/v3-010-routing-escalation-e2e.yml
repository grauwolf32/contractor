schema_version: "1.0"
id: V3-010
title: Verify routing and escalation across production boundaries
milestone: planner-routing-and-escalation
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-008, V3-009]
languages: [go, python, yaml, shell]

goal: >-
  Prove the complete single-VM stack can run Streamline and Router plans, route
  exact subtasks through real mTLS/A2A allocations, expose durable safe progress,
  and perform one Scheduler-owned escalation with pinned stronger settings.

context:
  production_boundaries: >-
    Tests start PostgreSQL, Go Server/Control Plane, one or more identical
    single-slot Python Runtime Agents, the real configuration loader, private
    mTLS control/artifact APIs, A2A, Scheduler, Planner SessionService, and
    public Run APIs. Only the external OpenAI-compatible model may be replaced
    by a deterministic scripted Gateway in ordinary CI.

scope:
  in:
    - Add deterministic Gateway scripts for Streamline success, Router multi-binding selection, and failed candidate followed by escalation success.
    - Exercise actual Planner model HTTP requests rather than replacing PlannerFactory or WorkerInvoker.
    - Assert full immutable StageContext reaches only the selected logical Worker and physical instance details never enter plan events.
    - Assert failed retryable false still follows configured Scheduler escalation and the second execution uses exact stronger refs.
    - Assert plan projection/events, StageExecution linkage, allocation finalization, metrics, frozen outputs, and slot reuse.
    - Add an opt-in live LM Studio scenario targeting http://192.168.1.217:1234 with model qwen/qwen3.8-27b through local LiteLLM; report bounded diagnostics instead of making network access a CI requirement.
    - Update development checkpoint/runbook and example configuration.
  out:
    - UI/browser tests, LiteLLM managed virtual-key operations, provider quality guarantees, or multi-VM scheduling.

deliverables:
  - {path: tests/e2e, description: Deterministic Streamline, Router, and escalation production-boundary scenarios.}
  - {path: deploy/litellm, description: Local pinned development configuration compatible with LM Studio.}
  - {path: scripts, description: Opt-in bounded live-model routing evaluation command.}
  - {path: docs/development.md, description: Reproducible local commands, expected evidence, and safe failure diagnostics.}

requirements:
  - id: R1
    text: Ordinary verification is deterministic and offline after dependencies/images are available; it never requires the LAN LM Studio host.
  - id: R2
    text: The deterministic test substitutes only external model behavior and validator fixtures, not Server/Runtime production boundaries.
  - id: R3
    text: Every process and temporary credential/config/database resource is cleaned up after pass or failure.
  - id: R4
    text: Live evaluation has finite Planner/Worker/time budgets and redacts tokens and provider bodies.

acceptance_criteria:
  - id: A1
    given: A one-Worker Streamline Workflow.
    when: The deterministic model creates and executes subtasks then finishes.
    then: The Run succeeds, outputs freeze, plan events match execution, reports complete, and the slot is reusable.
  - id: A2
    given: A Router Stage with builder and reviewer.
    when: The model selects reviewer for current subtask.
    then: Only reviewer's allocation is invoked and the durable dispatch records logical reviewer without placement data.
  - id: A3
    given: A failed non-retryable base result and one configured stronger escalation.
    when: Scheduler processes it.
    then: A fresh linked execution uses pinned stronger refs and succeeds; exactly one escalate decision is durable.
  - id: A4
    given: The optional reachable LM Studio deployment.
    when: The live command runs.
    then: It either completes a representative workflow or returns bounded actionable model-contract evidence with no leaked secret.

tests:
  - {name: routing-e2e, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... make test-e2e", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
  - {name: live-optional, command: "CONTRACTOR_LIVE_LLM_URL=http://192.168.1.217:1234/v1 CONTRACTOR_LIVE_LLM_MODEL=qwen/qwen3.8-27b make test-live-routing", covers: [A4], optional: true}
