schema_version: '1.0'
id: V102-001
title: Classify Runtime credential lookup failures by cause
milestone: runtime-credential-lookup-error-classification-2026-10
priority: P2
status: completed
implementation_commit: 0b481c7da6ab9b4ad126d98adaa89c12a893585b
depends_on: []
languages: [go]
goal: Preserve retryability for transient Runtime and LLM credential lookup failures.
context:
  issue: https://github.com/grauwolf32/contractor/issues/274
  finding: RuntimeConfig adds ErrInvalid to every credential lookup error, including store outages and recovery-required states.
scope:
  in:
    - Share stable missing or incompatible credential sentinels across packages without a dependency cycle.
    - Add ErrInvalid only for confirmed absence, wrong kind or identity/configuration mismatch.
    - Preserve lookup causes so public handlers and eval preflight classify transient and recovery errors correctly.
    - Cover RuntimeConfig validators and public mutation handler mappings.
  out:
    - Change credential storage, retry policy or RuntimeConfig resolution semantics.
acceptance_criteria:
  - {id: A1, text: Database and provider lookup errors preserve their cause without ErrInvalid and map to retryable 5xx.}
  - {id: A2, text: Missing, tombstoned and wrong-kind credentials remain ErrInvalid and map to 400.}
  - {id: A3, text: Recovery-required LLM lookup maps to retryable 503.}
  - {id: A4, text: Eval preflight still separates confirmed invalid dependencies from transient failures.}
  - {id: A5, text: Focused Go tests pass.}
tests:
  - {command: go test ./internal/runtimeconfig ./internal/credentials ./internal/runstore ./internal/httpapi/public ./internal/evalservice, covers: [A1, A2, A3, A4, A5]}
