schema_version: '1.0'
id: V466-006
title: Preserve scanner deadline classification across competing HTTP timers
milestone: project-sitemap-2026-10
epic: http-tools
kind: defect
introduced_by: V410-030
priority: P1
status: in_progress
depends_on: [V410-030]
languages: [python, markdown]
goal: An expired total scan deadline reports scan_timeout regardless of which HTTP timer settles
  first, while earlier request failures and independent shorter HTTP timeouts keep their classifications.
context:
  authority: >-
    User assignment 2026-11-10 approves the reviewed remaining Nuclei timeout prerequisite before
    V417-003 acceptance and isolated Audit compaction. This repairs the existing deadline contract;
    it does not widen compaction behavior or scanner privileges.
  specification:
  - docs/spec/tools/scanners.md#SCN-R254
  - docs/spec/tools/scanners.md#SCN-R263
  finding: >-
    runtime/src/contractor_runtime/adapters/bridge/proxy.py:108-115 classifies its deadline timeout
    as scan_request_failed. mitmproxy/ingress.py:248-253 also converts a delegated HTTP timeout
    bounded by the remaining scan deadline to scan_request_failed. Either can settle before the
    outer ScanSession timer and stop the process first. Full Runtime acceptance fails the real
    Nuclei owner-termination timeout case with that code instead of scan_timeout; isolation can pass.
    Both mappings were introduced by V410-030 commit fb127850b6e73fe38deed027be45e33cd84ab62e.
  siblings: >-
    The common bridge serves controlled Nuclei, SQLMap, Katana and ffuf through ScanSession.
    Correct both the IPC timer and delegated target outcome. Permanent target denial, ordinary
    connection/IPC failures, shorter per-request deadlines, cancellation and fatal bridge/lease
    exceptions retain their current behavior. Standalone process timeouts already return scan_timeout.
  boundary: >-
    The existing bridge owns HTTP adaptation and knows the total monotonic scan deadline. Classify
    a timeout there using that deadline; keep first failure, process joining and publication owners.
    No new timer, retry, outcome enum, receipt or transport API is required.
scope:
  in:
  - Preserve total-deadline timeout classification in both bridge completion paths.
  - Deterministic regressions for both timer orderings and earlier independent failures.
  - Real Nuclei process/socket cleanup and complete Runtime verification with heavy I/O disabled.
  - Clarify the existing deadline ownership in the scanner specification.
  out:
  - Timeout increases, test sleeps, live-model settings, retry behavior or new scanner capabilities.
acceptance_criteria:
- id: A1
  text: Both the bridge IPC timeout and delegated HTTP timeout report scan_timeout once the total
    deadline expires, independent of the outer scanner timer's scheduling.
- id: A2
  text: Earlier HTTP timeouts and connection failures retain scan_request_failed; denial, fatal
    infrastructure failures and cancellation remain distinct and owned resources are joined.
- id: A3
  text: The real Nuclei cancel, lease-loss and timeout cases and the complete Runtime suite pass;
    deterministic regressions fail on the uncorrected mappings without wall-clock assertions.
tests:
- command: cd runtime && uv run pytest -W error tests/test_http_proxy_bridge.py tests/test_bridge_ingress.py tests/test_bridge_lifecycle.py tests/test_controlled_scan_process.py tests/test_nuclei_engagement.py
  covers: [A1, A2, A3]
- command: make test-runtime
  covers: [A1, A2, A3]
- command: make lint
  covers: [A1, A2, A3]
verification_results:
- Before the correction, both deterministic total-deadline regressions fail with scan_request_failed;
  the eight shorter-timeout, connection-failure and denial controls pass.
- The corrected focused suite passes 103 tests, including the real Nuclei process/socket cases.
  Complete Runtime and lint acceptance remain outstanding.
