schema_version: "1.0"
id: V11-011
title: Prove materialization crash recovery before Runtime registration
milestone: runtime-filesystems-materialization-and-hardening
priority: P1
status: planned
implementation_commit: null
depends_on: [V11-010]
languages: [python]

goal: >-
  Demonstrate with killed Runtime subprocesses that every interrupted
  overlay-local materialization is rolled back deterministically before that
  Runtime can register or reuse its only slot.

context:
  startup_gate: >-
    Runtime scans only its dedicated bounded projectfs journal directory before
    constructing filesystem factories or starting its private listener. A valid
    non-committed journal is rolled back and verified. A corrupt, ambiguous,
    unbound or unrecoverable journal fails readiness and leaves Runtime
    unavailable; it is never ignored or reported as recovered. Scan at most
    eight directory entries and 256 MiB of journal/staging data under the
    shared 30-second startup deadline. More than one live journal is invalid
    for a single-slot Runtime. Persist resumable rollback progress before a
    bounded recovery attempt yields.
  safety_boundary: >-
    Recovery trusts only a versioned journal created below work_root, validates
    config/mount digest and every virtual operation again, and uses confined
    descriptor-relative access. It never follows a journal-supplied host path
    and never contacts Server to decide what to do.

scope:
  in:
    - Add subprocess failpoints after every durable journal phase and representative first/middle/last host mutation, including forced SIGKILL.
    - Restart with the same Runtime-local config/work_root and prove recovery completes before listener creation/registration is observable.
    - Verify byte/type/directory restoration, journal/staging cleanup and subsequent valid allocation/materialization after recovery.
    - Cover committed-before-response loss: restart keeps committed host state, removes completed local journal residue and does not replay or roll back success.
    - Cover missing/corrupt/truncated/oversized/unknown-version/digest-mismatch journals, a second live journal, more than eight entries, more than 256 MiB scanned data and backup hash mismatch; startup must fail with workspace_recovery_required and safe local diagnostics.
    - Force recovery past its 30-second injected deadline, persist exact rollback progress, and prove the next restart resumes rather than reapplying or guessing.
    - Plant malicious virtual traversal, symlink and replacement-race fixtures and prove recovery changes no path outside the configured root/work_root targets.
    - Capture attempted registration/heartbeat traffic and prove zero request is sent before a recovery-required condition is resolved.
  out:
    - Automated operator repair, Server-coordinated recovery, changed-root migration, distributed locking or data salvage from an invalid journal.

deliverables:
  - {path: runtime/tests/materialization_crash_worker.py, description: Deterministic subprocess/failpoint materialization driver.}
  - {path: runtime/tests/test_materialization_recovery_e2e.py, description: Kill restart corruption confinement and registration-gate suite.}
  - {path: runtime/README.md, description: Safe recovery-required operator diagnosis and immutable-config warning.}

requirements:
  - id: R1
    text: Recovery is bounded by configured maximum journal count/bytes/time and fails closed when bounds or integrity checks fail.
  - id: R2
    text: A Runtime process never advertises host-write/materialize capability or accepts an allocation before all journals are resolved.
  - id: R3
    text: Tests kill only dedicated child processes and mutate/delete only explicit validated temporary roots.
  - id: R4
    text: Recovery logs identify journal phase and safe mount name but redact host paths, hashes, backup bytes and config contents.

acceptance_criteria:
  - id: A1
    given: SIGKILL at every prepared/applying/rollback/committed boundary.
    when: Runtime restarts with unchanged local configuration.
    then: It deterministically restores pre-call host state or preserves committed state as appropriate before registration, with no ambiguous partial tree.
  - id: A2
    given: Invalid, malicious or unbound journal data.
    when: Startup recovery scans it.
    then: Runtime fails readiness safely, emits no registration request and changes neither project nor outside paths.
  - id: A3
    given: A successfully recovered Runtime.
    when: A new allocation edits and materializes the same mount.
    then: Normal behavior succeeds, proving locks/staging/capability state were fully reinitialized.

tests:
  - {name: recovery-e2e, command: "cd runtime && uv run pytest tests/test_materialization_recovery_e2e.py", covers: [A1, A2, A3]}
  - {name: runtime-suite, command: "cd runtime && uv run pytest", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
