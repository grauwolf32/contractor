  finding: "check_release_verify_graph.py:16-57 pins the race package union to the pre-V155 set: 32 of 76 Go packages with tests never run under -race in release-verify, including evalcoordinator, evalstore, evalservice, runservice, gatewayrecovery, sourcebundle, tests/faults and tests/integration/streamline, although V233, V235, V239, V254 and V259 changed Eval concurrency."
scope:
