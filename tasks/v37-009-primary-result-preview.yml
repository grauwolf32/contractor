schema_version: "1.0"
id: "V37-009"
title: "Highlight declared primary outputs and preview a selected result with one action"
milestone: "ui-journey-usability"
priority: "P2"
status: "in_progress"
implementation_commit: null
depends_on: ["V23-004", "V24-001", "V33-001"]
languages: ["typescript"]
goal: >-
  Let users open the intended bounded output directly while keeping exact provenance and all
  auxiliary files accessible.
context:
  user_stories: ["US-05", "US-09"]
  review_findings: ["UX-08"]
  planning_document: "docs/ui-user-stories.md"
  baseline: >-
    Run output disclosure loads metadata and then asks for Load preview a second time. Workflow
    outputs already carry optional primary; it is presentation intent and never proof of
    successful or high-quality output.
  contract: >-
    Use the exact Workflow version associated with the Run to identify primary slots. Preserve
    existing safe renderers and media, byte, parser and time limits; use explicit
    unavailable/missing states when metadata or bytes cannot be read.
  loading_contract: >-
    Opening Run detail may read the exact immutable Workflow contract used by the Run so output
    slots can be classified. It must not read any output metadata or payload until the user
    requests one exact present output. That one action sequences its metadata read and, only
    when preview policy permits, its bounded content read.
  missing_contract: >-
    A declared slot without a present Run output is pending while the Run is non-terminal and
    missing/unavailable after terminal state. If the exact Workflow contract cannot be read,
    retain all present outputs as unclassified and promote none of them to primary.
  browser_verification: >-
    Build the UI with make ui-build and serve it using the documented UI development or Node
    server; set CONTRACTOR_UI_E2E_BASE_URL to that instance. Browser cases must explicitly
    install their API fixtures; a fixture pass is not proof of a live backend. Add new test
    files named below as part of this task.
scope:
  in:
    - >-
      Combine metadata inspection and supported bounded preview into one explicit action for one
      output, reusing ArtifactPreviewPanel and its planning limits.
    - >-
      Group declared primary outputs before other outputs without promoting arbitrary files when
      no primary is declared; show missing expected outputs explicitly.
    - >-
      Keep Download, exact version, lineage/history and technical diagnostics accessible, moving
      Node/Go transport and If-Match explanations out of the primary reading flow.
  out:
    - >-
      Automatic loading of all outputs, new document renderers, changing Artifact storage/CAS or
      Run success semantics, inferring primary from filename.
requirements:
  - id: "R1"
    text: >-
      One explicit preview request causes only the selected exact artifact's bounded
      metadata/content reads; opening the page or other cards never fetches every payload.
  - id: "R2"
    text: >-
      Unsupported/oversized/missing bytes or a failed renderer yield clear feedback and a valid
      download path when bytes exist; do not promise a working download for known missing
      content.
  - id: "R3"
    text: >-
      Markdown/HTML/remote-image restrictions and existing OpenAPI/LikeC4 isolation remain
      effective; stale responses cannot display another artifact under the current selection.
acceptance_criteria:
  - id: "A1"
    given: "A completed Run with declared primary and auxiliary outputs."
    when: "The user opens a supported small primary document."
    then: >-
      It appears after one explicit action; only its exact bounded bytes are fetched and
      auxiliary outputs remain accessible.
  - id: "A2"
    given: "An oversized, unsupported, missing or maliciously formatted artifact."
    when: "Preview is requested."
    then: >-
      Existing limits/safe rendering hold and the UI explains fallback or unavailability without
      an extra redundant Load preview step.
  - id: "A3"
    given: "A Workflow without primary metadata or an unavailable expected primary output."
    when: "The Run output section renders."
    then: >-
      No arbitrary output is called primary and missing/legacy state is explicit with exact
      details retained.
tests:
  - name: "ui"
    command: "cd ui && corepack pnpm exec vitest run src/routes/artifacts src/routes/runs"
    covers: ["A1", "A2", "A3"]
  - name: "typecheck"
    command: "make ui-typecheck"
    covers: ["A1", "A2", "A3"]
  - name: "browser"
    command: "cd ui && corepack pnpm exec playwright test e2e/artifact-preview.spec.ts e2e/runs-navigation.spec.ts"
    covers: ["A1", "A2", "A3"]
