schema_version: "1.0"
id: V3-009
title: Persist typed Planner plans and reduced Run events
milestone: planner-routing-and-escalation
priority: P0
status: planned
implementation_commit: null
depends_on: [V3-004]
languages: [go, sql]

goal: >-
  Persist the validated PlannerPlan projection and safe lifecycle facts with
  ordered Planner-session and WorkflowRun sequences so recovery and a future
  WebSocket/UI can show the global task, subtasks, current work, and logical
  Worker dispatch without retaining model content.

context:
  current_state: >-
    ADK events are reduced to author, allowlisted function names, action flags,
    and token totals in planner_events. The plan itself exists only in memory,
    and there is no shared ordered Run event journal suitable for resume after
    disconnect.
  safe_projection: >-
    Durable plan data is limited to revision, bounded immutable subtask fields,
    adapter statuses, current ID, and optional active dispatch call ID/logical
    worker name. The global objective is joined from the immutable Stage rather
    than accepted from model output.

scope:
  in:
    - Extend SessionService with compare-and-append typed plan snapshots/changes bound to one running Planner session.
    - Persist monotonically increasing per-session sequence and allocate a monotonic per-Run event sequence transactionally.
    - Define fixed event kinds for Planner started/completed/failed, plan changed, current changed, dispatch selected/started/completed, and validated finish requested.
    - Store only bounded typed payloads, allowlisted logical names, safe codes, and aggregate counters.
    - Recover the latest committed plan projection for completed inspection and reject invalid revision/status/identity histories.
    - Keep partial conversation recovery out of scope; an abandoned running ADK invocation still follows existing retryable recovery behavior.
    - Add redaction tests with canary prompts, tokens, artifact contents, provider bodies, and physical endpoints.
  out:
    - WebSocket transport, UI queries, raw ADK events, hidden reasoning, partial model tokens, or resuming an interrupted model conversation.

deliverables:
  - {path: internal/persistence/migrations, description: Planner projection and per-Run event sequence storage.}
  - {path: internal/planner/session, description: Typed append/load APIs with optimistic concurrency and redaction.}
  - {path: internal/runstore, description: Safe ordered Run event journal query interface.}
  - {path: internal/planner/streamline, description: Plan transition event emission.}
  - {path: internal/planner/router, description: Logical routing event emission.}

requirements:
  - id: R1
    text: An event is externally queryable only after the same database transaction commits its sequence and payload.
  - id: R2
    text: Plan revisions and event sequences are strictly monotonic and duplicate retry of the same append is idempotent.
  - id: R3
    text: Persistent payload schemas are closed, size-bounded, versioned, and independently validated on read.
  - id: R4
    text: No durable record contains arbitrary model/tool text, credentials, raw error bodies, artifact bytes, or physical Runtime Agent addresses.

acceptance_criteria:
  - id: A1
    given: A Router adds two subtasks and dispatches one to reviewer.
    when: Committed events and latest projection are loaded.
    then: Order, current ID, statuses, call ID, reviewer name, and both sequences are deterministic.
  - id: A2
    given: Concurrent append attempts using the same expected revision.
    when: They race.
    then: One commits and the other receives a conflict without a duplicate/gap attributed to a committed event.
  - id: A3
    given: Canary secrets in model text, tool arguments, Worker response, endpoint, and provider error.
    when: All planner/session tables and JSON API-safe encodings are searched.
    then: No canary is present.

tests:
  - {name: session-race, command: "go test -race ./internal/planner/session/... ./internal/runstore/...", covers: [A1, A2, A3]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... go test ./internal/planner/session/... ./internal/runstore/...", covers: [A1, A2]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
