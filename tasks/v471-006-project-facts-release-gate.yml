schema_version: "1.0"
id: V471-006
title: Accept the shared Finding facts path through real process, lifecycle and scale gates
milestone: project-facts-2026-11
epic: quality
kind: chore
priority: P1
status: pending
depends_on: [V471-005]
languages: [go, python, typescript, yaml, markdown]
goal: >-
  Prove that optional note extraction, Project facts, existing Finding admission,
  basic evidence deduplication, exact hypothesis grounds and the separate UI work together on one
  integrated revision, with honest failure and source-retention behavior.
context:
  authority: >-
    User request 2026-11-20 plans facts, note extraction, deduplication and separate
    interfaces on the same Project Finding, with no unnecessary publication flag
    and clear diagrams. An integrated deterministic exit is an agent proposal.
    User decision 2026-11-20 selects an optional separate passthrough@1 extraction
    Stage and authorizes updating/merging the planning package into main. Verify
    that Stage's one Runtime Worker and model-free Planner in the real-process gate.
    Planning/integration authorizes no feature implementation, live-model run or deployment.
    User follow-up 2026-11-20 chooses common severity filtering and exclusion of
    informational records from needs review. Verify this rule for both producer
    facades and keep unknown severity visible under the V471-001 proposed predicate.
    User decision 2026-11-20 on review item 2 keeps ordinary current-Run reads
    for the extractor. Verify exact citations alongside the existing read grant.
    User decision 2026-11-20 accepts exact assertion deduplication, material-version
    grouping, optional Task/hypothesis origin and deferral of reverse navigation.
    Verify same-call replay and new-attempt recovery as distinct cases. Update and
    merge the reviewed planning package into main.
    Latest user decision 2026-11-21 reactivates V471-004 for basic evidence-only
    deduplication on existing Finding correlation. Equal complete evidence contents
    share one informational Finding regardless of title, with independent receipts.
    This supersedes the blanket deferral and title-plus-evidence proposal. Title
    matching, semantic/provider rules, material groups and possible-duplicate states
    remain outside the first slice. Optional origins and exact sources stay as agreed.
  proposal: docs/proposals/0055-project-facts-through-findings.md
  specification:
    - docs/spec/findings/findings.md
    - docs/spec/tools/memory.md
    - docs/spec/execution/server-operations.md
    - docs/spec/audits/hypotheses.md
    - docs/spec/artifacts/retention-and-deletion.md
  boundary: >-
    This gate verifies existing owners and integrated production callers; it does
    not create an execution controller, graph store, new model service or separate
    Fact persistence. Newly required release targets must have real consumers and
    participate in release verification without zero-case or skipped-case success.
scope:
  in:
    - Register and run shared real Server/PostgreSQL/Runtime/scripted-Gateway process cases in the release graph.
    - Verify direct facts/issues, optional Run-level origin, model-free snapshot, passthrough@1 extraction, basic evidence-content equality on existing correlation, receipt/source history, explicit ground selection and responsive UI together.
    - Exercise ambiguous replies, cancellation, claim loss, restart, source deletion and Project purge under realistic cardinality.
    - Record all executed checks, explicit skips, integrated revision and cleanup of the one owned test database and fixture resources.
  out:
    - Live semantic-quality claims, changing configured models, production deployment or demo data resets.
    - Full graph infrastructure, automatic semantic merge or reactivating unrelated deferred tasks.
    - Reverse fact-to-hypothesis navigation and semantic-match infrastructure.
    - A separate universal deduplication engine or generic model-filled fact/property vocabulary.
    - HTTP matching profiles, material-group readers/indexes, unique-material counters or possible-duplicate states.
acceptance_criteria:
  - id: A1
    text: >-
      One real-process scenario records notes, snapshots selected notes through a
      model-free operation, and extracts facts in a separate passthrough@1 Stage
      with exactly one Runtime Worker and no Planner LLM call. It obtains common
      Project Finding IDs through existing intake and selects
      exact grounds for a hypothesis. Omitted extraction and zero output create
      no hidden call; ordinary finding has no publication flag.
      The extractor can read another authorized ordinary current-Run artifact.
      An invalid citation is rejected before publication under V471-003 A4.
      Note, code and HTTP materials retain exact citations. Informational
      submissions with equal complete evidence contents share one Finding even
      with different titles; unequal sets stay separate. Existing non-informational
      producer/structural correlation keeps its guarantees.
      A batch Run publishes a general fact without Task/hypothesis and retains
      authoritative Run/Audit origin. Explicit member association is validated.
  - id: A2
    text: >-
      Audit A produces a fact and Audit B selects it into a hypothesis. Deleting
      A and its Run preserves the Project Finding/materials and B's exact grounds.
      Deleting B releases its hypothesis registry/holds while the Project retains
      the Finding/materials. Project purge drains users and removes owned data.
      Same-call replay adds no receipt. A new attempt after partial publication
      retains its receipt history/exact descriptors and reuses a Finding for equal
      complete evidence contents, including forks and independent byte-identical
      artifacts. Existing receipt replay is verified; no material grouping is added.
      Claim loss and cancellation prohibit post-fence writes. Analyst assessment
      remains explicit on the common identity.
  - id: A3
    text: >-
      Real PostgreSQL scale/pagination and browser tests pass at the planned
      bounds; all new strict schemas/fixtures agree across languages and clients.
      Informational records from either facade appear in Facts and are excluded
      from needs review. Unassessed low and unknown records remain eligible.
      List/count predicates agree and analyst severity changes refresh membership
      without replacing Finding identity or treating a suggestion as an assessment.
      Existing source history stays bounded under source fanout; no unique-material
      aggregation or new group reader is required.
      Optional Task/hypothesis fields survive API, collection and result-reader
      round trips. The Audit Eval recipe has a positive real-path scripted member.
      The integrated deterministic release gate passes with no required skipped
      case or absent target counted as success.
  - id: A4
    text: >-
      Evidence distinguishes mechanism tests from model quality, records remaining
      limitations and open decisions, and leaves no owned database/container/
      network. Full touched suites and release evidence identify the tested revision.
tests:
  - command: make test-project-facts-e2e
    covers: [A1, A2, A3, A4]
  - command: make test-memory-snapshot-e2e
    covers: [A1, A2, A3]
  - command: make test-project-facts-ui
    covers: [A1, A3]
  - command: make release-verify
    covers: [A1, A2, A3, A4]
test_prerequisites:
  - Real PostgreSQL and Server/Runtime processes are required; unset infrastructure produces unproven coverage, not acceptance.
  - Heavy-I/O fixtures remain explicit opt-in and disabled skips are not passes. Never enable the flag implicitly.
  - Use one disposable database, stop all processes/pools, then drop it and remove only owned test resources; no global prune/reset.
