schema_version: '1.0'
id: V410-006
title: Ship ordinary sitemap discovery and reconciliation Workflows
milestone: project-sitemap-2026-10
epic: workflows
kind: feature
priority: P1
status: pending
depends_on:
- V410-003
- V410-004
- V410-005
- V55-003
- V62-004
languages:
- go
- python
- yaml
- markdown
goal: Make the independent HTTP/OpenAPI sitemap slice runnable through ordinary Workflows and existing Audit preparation/round-discovery
  mappings with exact accepted context.
context:
  authority: 'User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence. User review on 2026-10-27 supersedes
    generic collection-completeness/status requirements: automatic sitemap updates are best effort and must remain
    isolated from HTTP/scanner outcomes and Run contracts. The 2026-10-27 metadata-policy decision removes sitemap
    secret filtering and matching-secret transport; ordinary owner-selected inputs authorize complete selected context,
    and the 2026-10-28 shared-map decision removes source-mode classification and consumer filtering. All permitted
    readers use the same Project metadata; snapshotInputs controls only needed original-file retention during snapshots.'
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 1-2, 5-6 and 12: independent first delivery and ordinary Workflow/Audit composition.'
  specification:
  - docs/spec/artifacts/project-sitemap.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/configuration/workflows.md
  - docs/spec/configuration/agent-templates.md
  - docs/spec/configuration/catalog.md
  - docs/spec/audits/scans.md
  - docs/spec/audits/worker-completion.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or V61/V62/V64 work.
  code:
  - configs/workflows
  - configs/agent-templates
  - configs/audit-profiles
  - internal/config
  - internal/auditcontroller
  - internal/auditimport
  - internal/auditservice
  - tests/e2e
  - docs/guides
scope:
  in:
  - Ship ordinary discovery and explicit OpenAPI source-import/reconciliation composition using existing tools, passthrough/tool
    Workers and declared outputs; add no special lifecycle or completion policy for automatic sitemap updates.
  - Provide Project examples for automatic HTTP discovery plus exact OpenAPI/report import, including a usable flow
    without any selected schema.
  - Compose reconciliation as preparation or same-round discovery through existing audit-input/prepare-output/retained-output
    mappings; snapshot live map through the explicit adapter and record the exact selected revision.
  - Keep normal HTTP ingestion on the current grouping policy without launching reconciliation for every request;
    declared boundaries/policy changes alone start another pass.
  - Validate the shipped catalog and test-only fixtures; document technical publication failures and concrete source-format
    limitations without a new collection-status surface.
  out:
  - Cross-round item artifacts, V62-006/007 routing, autonomous pentest program/profile release, browser requirements
    or generated OpenAPI prerequisites.
  - Full HTTP capture, heuristic grouping, a new Audit semantic step kind or automatic target execution during import.
  - Scheduler/Audit completion changes or a required automatic-sitemap-collection policy. Background publication is
    not an implicit required Workflow output.
requirements:
- id: R1
  text: Each Workflow has exact declared inputs/outputs, tool/capability closure and production callers; model-free
    reconciliation has no hidden model requirement and its full map is not returned in a completion envelope.
- id: R2
  text: HTTP-only execution remains runnable without OpenAPI, browser or incremental Caido history. Optional capabilities
    are selected explicitly; their absence does not synthesize generic completeness flags.
- id: R3
  text: Preparation outputs use existing prepare-output semantics; same-round discovery uses retained-output. Fresh
    live map reads use bounded allocation-owned immutable views, not history pins; replacement or
    release expires their cursors. Exact selected inputs/outputs need real holds before acceptance, atomically against
    eviction. Neither a cursor nor metadata refs imply previous-round lookup or mutate the Audit baseline. An owner-selected
    ordinary input authorizes the complete selected context. Dedicated reads expose the same map to all permitted
    readers; snapshotInputs selects only needed original files to retain inside the snapshot transaction. Cached
    pages recheck their current operation permission without resolving input files.
- id: R4
  text: Catalog identity follows the current pre-production rules; validate actual shipped configurations explicitly,
    while ordinary tests use testdata and never read live configs.
- id: R5
  text: Automatic HTTP/scanner sitemap publication is best effort and cannot fail the Run. A deliberately requested
    snapshot/import/reconciliation artifact uses ordinary required-input/output validation and reports its own operation
    failure; no extra collection completion check is introduced.
failure_outcomes:
- operation: Workflow input selection, model-free execution and output publication
  permanent: Unknown/missing required input, capability or tool/output contract fails at existing validation/prepare/result
    boundaries; unsupported source policy is not guessed. Evicted exact inputs remain unavailable; protected-history
    capacity conflicts and generic Artifact admission rejection do not automatically retry.
  retryable: Use ordinary Scheduler/Worker retry policy with exact held inputs; bounded ArtifactStore eviction backpressure
    retries only publication and preserves receipts, never redispatching target discovery.
  ambiguous: Reconcile existing output/Artifact receipts and source-generation intent; never repeat discovery target
    calls to recover a lost output acknowledgement. Receipt replay after eviction confirms the old commit without
    republishing; it does not make evicted exact bytes available.
  cancelled: Existing Scheduler cancellation joins allocations and sitemap publishers before release.
  timeout: Separate Run/task deadlines from collector drain and exact-output publication allowances.
- operation: Audit mapping and accepted reconciliation collection
  permanent: Invalid prepare/retained-output mapping or incompatible package is a permanent collection failure; no
    fallback to latest Project data.
  retryable: Reuse existing bounded Audit collection/recovery retries.
  ambiguous: Existing Audit collection receipt and exact retained outputs reconcile duplicate/lost collection responses.
  cancelled: Cancelled Audit uses existing child cancel/drain and retained evidence lifecycle.
  timeout: Ordinary Audit preparation/round deadlines own these calls; no new controller clock or claim is introduced.
cardinality:
- collection: Workflow inputs/outputs and Audit mapped selections
  expected: One exact map plus optional selected schema/report inputs
  maximum: Existing Workflow/Audit package and mapping bounds plus proposal 0042 section 10 map limits; tighter consumer
    limits win
  bound: Use selected snapshots/projections and existing paged inventory; never fan out a Workflow per HTTP observation.
- collection: Discovery requests/import work and reconciliations
  expected: Bounded discovery Run and one reconciliation per selected boundary
  maximum: Explicit Workflow request/time/depth, bounded collection operations and generic Artifact admission/retention
    limits
  bound: Discovery/import bounds and the shared publisher limit work. No per-request Workflow, custom Run publication
    quota or collection lifecycle is added.
lifecycle:
- entity: Workflow/Audit context snapshots and shared updates
  delete: Ordinary Run/Audit/Project lifecycle authorities retain control.
  cascade: Run deletion leaves committed shared metadata and accepted held context intact.
  retention: Exact accepted inputs/outputs are protected by their existing real holds; unselected metadata refs, CAS
    predecessors and research read snapshots do not pin history. Live map changes or eviction never rewrite an accepted
    worklist or report.
acceptance_criteria:
- id: A1
  given: A Project with HTTP access but no OpenAPI, browser or Caido history
  when: The shipped first-slice discovery Workflow runs
  then: With healthy storage it contributes useful bounded shared metadata. With failed automatic publication, HTTP/scanner
    results and ordinary Run outcomes remain valid; no collection state or generic completeness flag appears.
- id: A2
  given: An exact OpenAPI/map pair and the shipped reconciliation Workflow
  when: A tool@1 Worker executes without an LLM
  then: Only consumer-declared outputs are materialized; optional guarded publication records its actual revision.
- id: A3
  given: An Audit using prepare and same-round discovery fixtures with snapshot replacement and concurrent eviction
  when: Fresh map snapshots are reconciled before inventory/checks
  then: Existing exact mappings feed consumers and no baseline mutation or implicit cross-round artifact lookup occurs;
    expired research cursors fail and selected context obtains its real hold before acceptance or fails unavailable,
    never substituting latest. Ordinary owner-selected map inputs and permitted dedicated readers expose the same
    shared metadata. A referenced file without a matching permitted original input produces a gap or fails
    requireReferencedInputs. A resolved needed exact input with missing/corrupt bytes or I/O failure rolls back the
    snapshot under ordinary storage errors regardless of that flag; it never hides routes from map reads or changes
    existing frozen-context replay.
- id: A4
  given: Invalid schema, quota/source conflict, cancellation and lost output/collection replies
  when: The production composition hits each boundary
  then: Existing accepted map/data survive, stable outcomes are retained and retries never resend target work to recover
    publication.
- id: A5
  given: Shipped catalog and separate testdata fixtures
  when: Configuration and composition gates run
  then: All closures resolve, tests do not read live configs, generated clients/contracts remain consistent and ordinary
    Audit regression flows pass.
deliverables:
- path: configs/workflows
  description: Runnable discovery and model-free sitemap-openapi-reconcile Workflows, templates and exact output contracts.
- path: docs/guides
  description: Independent Project workflow examples and optional existing Audit mapping walkthrough.
- path: tests/e2e
  description: Composition fixtures and real-process cases registered in the sitemap and existing Audit composition
    gates.
tests:
- command: make test-config
  covers:
  - A1
  - A2
  - A5
- command: make test-project-sitemap-tools-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make test-audit-composition-e2e
  covers:
  - A3
  - A4
  - A5
- command: go test ./internal/config/... ./internal/auditcontroller/... ./internal/auditimport/... ./internal/auditservice/...
  covers:
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Existing tool@1 and Audit prepare/round mapping implementations are reused, not recreated. Use disposable PostgreSQL,
  local target/provider fixtures and scripted model responses; do not require paid/live models or deferred iterative
  features.
execution:
  released_on: '2026-10-26'
  previous_branch: codex/v410-sitemap
  note: Returned to pending at the user's request to finish V410-002 and pause. Implementation of this task has not
    started; the prior batch reservation is released.
implementation_decisions:
- date: 2026-10-26
  decision: 'Superseded by the 2026-10-27 review: Required sitemap persistence is checked by deterministic completion
    code at the declared boundary, outside the model-visible HTTP result. Run owners receive collection status; a
    failed final required report is an execution failure and never relabels target transport or repeats target traffic.'
- date: '2026-10-27'
  decision: Keep composition in catalog/tool selection and existing exact input/output mappings. Automatic publication
    is not a required output and never adds Run states or completion checks. Explicitly requested snapshot/reconciliation
    outputs retain ordinary Workflow artifact failure semantics. Change Scheduler/Audit execution code only if an
    independently demonstrated existing mapping defect requires a tracked fix.
