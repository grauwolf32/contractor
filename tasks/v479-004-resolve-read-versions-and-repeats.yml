  boundary_decision: Tools own the semantic selection and validation. Shared Runtime helpers live in toolsets.common
    and are explicitly called by production consumers; no universal argument-rewriting plugin, hidden acceptance
    of deleted arguments, new receipt store, database entity or framework for hypothetical tools. Server remains
    the authoritative owner of grants, exact Artifact reads, CAS, receipts, retention and lifecycle. Existing
    private/public/wire/persisted revision fields remain strict; only model-facing inputs change. Update numbered
    owning specs, descriptions, active instructions and actual ADK schemas with implementation; this task
    plan does not change shipped specs.
  delivery_group: 2 / revision. Do not start until all three stage-one tasks are completed. Add TestRuntimeManagedMaterialVersionsAcrossProcesses
    with the real Artifact API as the first read-side delivery.
  selection_decision: 'User chose on 2026-11-22: retain revision in results, remove it from arguments, keep
    ordinary current reads and continue exact pages through a Runtime-issued cursor. Do not add a refresh
    mode or general artifact-handle addressing. A first namespace/name/window read selects current; a cursor
    selects its exact version/window. Trusted task inputs can receive a start cursor from the same owner so
    their exact selected version remains readable without model revision input.'
  accepted_risk: Arbitrary historical versions not selected by trusted inputs, an authorized prior read or
    an existing domain selector are no longer chosen by raw revision. Existing selected materials remain exact
    and authorized. Reject ambiguous same-address source selections outside the cursor reader; reopen only
    for a concrete caller needing another semantic selection, not by restoring model revision arguments.
scope:
  in:
  - Remove revision from read_artifact, open_source_archive, load_openapi and load_likec4 while keeping current
    namespace/name addressing and returned artifact.revision.
  - Define one explicit tool-owned read-selection contract for assigned exact inputs, current reads, continuation
    and exact consumer reads; reuse the private invocation bindings and read cache.
  - Adapt the V476 tool-owned key/admission lifecycle to runtime-selected exact versions without suppressing
    mutable latest reads or expanding to other tool families.
  out:
  - New general artifact-handle addressing, renamed model-supplied version/ETag preconditions, force/replace
    flags, compatibility aliases and automatic semantic rebasing. The approved read_artifact pagination cursor
    is in scope in V479-004.
  - Removal of Server/API/wire/store revision checks, changed grants/retention or model/tool budget semantics.
  - Unrelated UI redesign, live model evaluation, demo deployment and full repository test gates.
requirements:
- id: R1
  text: Remove revision from read_artifact, open_source_archive, load_openapi and load_likec4. A fresh read_artifact
    requires namespace and name, accepts existing start_line/max_lines/line_offset window controls and selects
    the current binding. Continuation calls supply only cursor; namespace/name and nondefault window overrides
    cannot be mixed with cursor. Keep types informative and errors actionable despite the two mutually exclusive
    argument forms; do not discard conflicting fields. The other three tools retain existing namespace/name/target
    addressing and resolve admitted exact input sources from trusted invocation roles.
- id: R2
  text: Issue nextCursor for the next unread window, or null at end, fixing the exact ref, next line/byte
    offset and effective page size. The cursor is produced and validated by the tool, scoped to the owning
    logical invocation and grants, never supplied as a free-form revision. Reuse toolsets.common.cursors;
    enforce a proposed 2048-character encoded ceiling and existing bounded fields before decode. Cursor continuation
    cannot mix pages across a changed binding; unknown, tampered, expired, foreign or evicted exact selections
    fail without latest substitution. A fresh namespace/name/window call can intentionally read the newer
    version. Replace redundant nextStartLine/nextLineOffset continuation instructions/fields with nextCursor
    across active model callers; retain text/line counts, truncation, partial-line flags and actual artifact.revision.
- id: R3
  text: Use the same cursor owner to expose a start cursor for trusted pinned task inputs (and exact read
    results when needed for rereading), including images with the default whole-image window. A current read
    by namespace/name is always advertised as current, never silently interpreted as pinned just because the
    same binding appears in task context. Input context retains its full informational exact ref alongside
    the machine-issued read cursor. Source archive/document seeds and evidence consumers preserve trusted
    exact inputs through their own deterministic owner path. Do not introduce a second material handle registry
    or make a cursor grant access/retention.
- id: R4
  text: Preserve source archive/index identity, document seed identity and binary/image media bounds. A retired/missing
    exact revision fails; there is no latest fallback. A successful own write can establish a new current
    write/read base but cannot retarget an already-issued continuation or evidence source.
- id: R5
  text: For cursor/exact-input reads, V476 equivalence uses the decoded actual exact selection plus effective
    window and image context generation, not raw cursor text. Keep two successful/in-flight consecutive exact
    reads, reject the third and later with tool_repeat_limit, and keep Worker running with ordinary accounting.
    A fresh namespace/name current read remains outside the initially approved limiter coverage and interrupts
    the series, as versionless reads do today. Do not extend suppression to current reads in this task; a
    new current version must never be blocked because its arguments match. Multiple valid cursors addressing
    the same exact window must not bypass the allowance.
- id: R6
  text: The tool owns cursor validation, exact selection and its repeat rule; the ADK plugin remains generic,
    bounded and has no tool-name dispatch or I/O. Decode/validate the immutable selection once for consistent
    admission and payload execution; do not admit one version and read another. Invalid cursors retain ordinary
    strict-input errors and interrupt the previous series. Refused exact repeats perform no payload read or
    image decoding. Update WRK-R202/ART-R146 together to replace the explicit revision requirement with the
    approved cursor/private exact-selection form.
- id: R7
  text: Any changed tool/window or validation rejection interrupts the consecutive series; failed/cancelled
    reads release reservations. Only a committed checkpoint or a new logical invocation resets that series.
    Preserve selected material versions across compaction and distinguish them from the reset repeat counter;
    image attachment eviction permits an exact reread through the existing image generation.
- id: R8
  text: Keep revision in results, model-visible exact input metadata and technical records as informational
    metadata. Models can compare returned versions but cannot submit one, including through raw unknown fields.
    Do not trust revision strings quoted in model summaries or reread history as state. Reuse server grants,
    content-observation semantics and current private read APIs.
failure_outcomes:
- operation: Resolve a selected version and perform the existing owner operation
  permanent: Unknown/ambiguous/unavailable selection, malformed or removed argument, stale precondition, denied
    authority and owner limit failures return a bounded classified tool error before a new effect. Preserve
    existing owner codes; new codes must be documented at their owner. No implicit latest substitution on
    conflict.
  retryable: Existing classified infrastructure failures retain bounded attempts and the original call/invocation
    deadline. No retry loop for deterministic conflicts.
  ambiguous: Reuse existing exact-byte CAS recovery or owner receipt with the same frozen payload, precondition
    and identity. Never regenerate intent from latest state or repeat a semantic append after a lost response.
  cancelled: Existing invocation/session owners join admitted I/O and preparation before cleanup. Late completions
    cannot update another invocation or a newer operation generation.
  timeout: Keep existing operation and invocation deadlines; do not introduce an unrelated timeout, poller
    or budget reset.
cardinality:
- collection: Runtime-held selected versions and pending operations
  expected: A few input roles, current document targets and explicitly used materials; admit only actual consumers.
  maximum: Keep existing owner row/byte/page/in-flight limits. Any added shared selection map has an explicit
    proposed ceiling of 4096 entries and 4 MiB encoded metadata per logical invocation, defined once in the
    owning limits registry.
  bound: Point lookup and bounded admission; no entire Run/Project enumeration, raw payload copies or history
    scans on each tool call. Refuse new admissions at the bound without silently evicting an in-use selection
    or relabeling it as current.
- collection: One read_artifact continuation or exact-input start cursor
  expected: One exact ref and line/window position, normally a few hundred encoded characters.
  maximum: Proposed 2048 encoded characters plus existing ArtifactRef and line/page bounds; register once
    at the owning tool boundary.
  bound: Authenticate/decode and validate in bounded CPU time without network I/O or an unbounded cursor registry;
    payload/image caches keep their existing limits. No automatic Artifact history hold.
lifecycle:
- entity: Private version/precondition state of the existing tool session or logical invocation
  delete: Clear through the existing owner after completion/cancellation and joined work; allocation close
    clears all remaining private state.
  cascade: Successful compaction preserves selected versions and pending write identity; it only resets the
    V476 consecutive series where specified. SDK turns and failed checkpoints do not refresh materials or
    grant write authority.
  retention: No new persistent owner or holds. Replay/recovery uses only existing trusted inputs, admitted
    operation state and validated owner records. A model-written summary or returned revision supplied as
    an argument is never authority. If exact state cannot be restored, require a fresh semantic read/select
    instead of guessing latest.
acceptance_criteria:
- id: A1
  given: Pinned task inputs with Runtime-issued start cursors and mutable current artifacts in the actual
    Worker
  when: The four callables read without revision and read_artifact uses either fresh namespace/name/window
    or cursor mode
  then: Fresh reads select current; trusted source/start-cursor reads select admitted exact bytes. Actual
    revisions remain in results/context; removed or conflicting arguments fail before effects.
- id: A2
  given: A long/partial-line artifact, external update, own write, native image and committed checkpoint
  when: The model follows nextCursor, reuses a selected start cursor or starts another namespace/name read
  then: Continuation and pinned rereads preserve exact versions across checkpoints; fresh reads observe current.
    Invalid/expired cursors and evicted history never fall forward; there is no generic artifact-handle or
    refresh interface.
- id: A3
  given: Text/image exact reads through the real ADK repeat plugin
  when: A,A,A,A; another tool/window; failure; and checkpoint cases execute
  then: Two exact reads run, further repeats are refused once each, failed work releases reservations, checkpoint
    permits reread, and versions/native images remain correct.
- id: A4
  given: A current read whose binding changes, parallel selections and old-generation completions
  when: Selection/admission/read races and cancellation execute
  then: Current reads stay unguarded and break the series; exact cursors cannot mismatch key/payload or bypass
    limits through alternate encodings. Cancellation/recovery do not leak tasks or cross-invocation authority.
- id: A5
  given: The largest admitted private selection state and unknown/historical model-supplied revisions
  when: Runtime validates and reaches the limit
  then: Bounded deterministic failure preserves existing admitted selections, and neither compaction nor a
    returned token creates authority.
