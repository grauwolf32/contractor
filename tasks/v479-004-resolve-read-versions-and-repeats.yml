- V476-003
languages:
- python
- markdown
goal: The model reads current or assigned materials without sending revision, sees the resolved version in
  the result and can continue exact text/image reads across compaction.
demonstration: A Worker reads a long artifact by namespace/name, another writer changes it, and read_artifact(cursor=nextCursor)
  continues the original exact text. A fresh namespace/name read returns the new revision. A trusted task
  input start cursor selects its pinned version, and the third consecutive identical cursor read is refused
  until a committed checkpoint.
context:
