schema_version: '1.0'
id: V479-004
title: Resolve artifact read versions in Runtime and preserve V476 repeats
milestone: runtime-owned-tool-versions-2026-11
epic: planner-worker
kind: feature
priority: P1
status: in_progress
depends_on:
