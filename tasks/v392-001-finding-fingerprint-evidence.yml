  - A2
  - A3
  - A4
  - A5
- command: go test -count=1 -tags=integration ./internal/findingintake ./internal/auditservice ./internal/persistence/postgres
  covers:
  - A2
  - A3
  - A4
  - A5
- command: make test-runtime test-wire-cross-language test-findings-e2e
  covers:
  - A1
  - A2
  - A3
  - A5
- command: make verify-public-api ui-verify
  covers:
  - A2
  - A5
- command: make lint
  covers:
  - A1
  - A5
- command: make test-runtime test-findings-e2e
  covers:
  - A6
