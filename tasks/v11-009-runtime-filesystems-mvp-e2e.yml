schema_version: "1.0"
id: V11-009
title: Prove Runtime-only project filesystem MVP end to end
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-008]
languages: [python, go]

goal: >-
  Close the first usable project filesystem increment with real Runtime and
  Control Plane processes while proving that Server remains ignorant of roots,
  backends and workspace state.

context:
  deployment_rule: >-
    The Control Plane places only by ordinary exact Toolset/tool capability.
    Because no mount identity crosses the wire, all connected Runtime Agents
    eligible for one filesystem AgentTemplate must expose equivalent logical
    roots, content, modes and write authority, or the test/deployment must
    connect only one eligible Runtime. Mount affinity and source Artifact
    auto-mounting are not part of this task.
  mvp_matrix: >-
    Cover local read-only, local hostWrite, memory, overlay-local and
    overlay-memory. Host materialization for overlay-local remains unavailable
    until V11-010; direct local writes and memory materialization are included.

scope:
  in:
    - Add minimal AgentTemplate fixtures selecting each exact filesystem Toolset subset and no LLM-dependent Workflow.
    - Start real mTLS Server/Runtime processes against temporary operator roots and inspect registration/reservation/allocation/release behavior.
    - Drive Toolsets through the Runtime worker/factory boundary with deterministic scripted invocations rather than relying on model quality.
    - Prove read/edit/diff/rollback and overlay-memory materialization behavior across modes, including direct local hostWrite survival after release.
    - Run two sequential allocations and prove memory/overlay state is reset while immutable startup baselines are reused safely.
    - Capture all private HTTP payloads, operation snapshots, metrics and safe logs and assert that host paths, config YAML/digest and backend/mount descriptors are absent.
    - Add a no-config process case showing all pre-projectfs workflows/capabilities remain operational.
    - Document the one-eligible-Runtime deployment constraint in Runtime operator guidance without adding enforcement to Server.
  out:
    - LLM live evaluation, Server workspace API/state/UI, host materialization, crash recovery, shared roots or allocation affinity.

deliverables:
  - {path: runtime/tests/test_projectfs_process_e2e.py, description: Real-process mixed-mode lifecycle and remote-redaction proof.}
  - {path: configs/e2e/agent-templates, description: Minimal explicit filesystem Toolset selection fixtures.}
  - {path: runtime/README.md, description: Runtime-local configuration and equivalent-root deployment guidance.}

requirements:
  - id: R1
    text: E2E fixtures use only temporary roots outside the repository and validate exact targets before any host mutation or cleanup.
  - id: R2
    text: Tests prove absence of remote filesystem data by decoding captured payloads, not merely by checking public structs.
  - id: R3
    text: The MVP gate is deterministic, offline and independent of LM Studio, LiteLLM or an external model.
  - id: R4
    text: No test-only Server filesystem branch, placement dimension or allocation field is introduced.

acceptance_criteria:
  - id: A1
    given: One Runtime with all five modes and explicit AgentTemplate selections.
    when: Scripted tool calls and release execute through real process boundaries.
    then: Mode authority, isolation, bounds and exact visible tools match the contract and only authorized direct-local bytes persist.
  - id: A2
    given: Captured startup/heartbeat/reservation/allocation/report/operations traffic and Server-side logs.
    when: It is searched for every configured path, backend token, config digest and private change marker.
    then: No match exists while supportedToolsets contains only ordinary refs and exact positive tool names.
  - id: A3
    given: A Runtime launched without --workspace-config.
    when: Existing artifact/source-analysis process flows execute.
    then: They pass unchanged and the Runtime advertises no filesystem@1, edit-files@1 or workspace-changes@1.

tests:
  - {name: projectfs-process, command: "cd runtime && uv run pytest tests/test_projectfs_process_e2e.py", covers: [A1, A2, A3]}
  - {name: go-contract-regression, command: "go test ./internal/contracts ./internal/config ./internal/controlplane", covers: [A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
