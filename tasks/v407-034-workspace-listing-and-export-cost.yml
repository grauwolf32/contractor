schema_version: '1.0'
id: V407-034
title: Reduce repeated workspace glob work and export comparisons without changing snapshot semantics
milestone: server-runtime-review-2026-10
epic: workspaces
kind: chore
introduced_by: V11-007
priority: P2
status: pending
depends_on: []
languages:
- python
goal: Avoid repeated glob normalization and unnecessary known-revision export payload reads while preserving
  workspace classification, content-bound cursors and exact CAS behavior.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/tools/workspace.md
  finding: runtime/src/contractor_runtime/toolsets/filesystem/tools.py:145,173 acquires LocalDirectWorkspace.snapshot
    (projectfs/local_direct.py:73-74), whose local_io.py:368-384 reads text for classification and content
    digest. Local I/O is already threaded. The public listing distinguishes file/binary (filesystem/tools.py:504-511),
    and WSP-R69 binds cursors to the content projection; stat-only output is not behavior-equivalent.
    glob at :177-182 repeatedly normalizes each bounded candidate through project_glob_matches on the
    loop, with at most 20000 scanned paths. projectfs/exporter.py:126-134 downloads the current payload
    before equality/CAS. ArtifactReadResult only provides artifact, media_type and size (contracts/artifacts.py:121-124);
    opaque revisions are not digests. filesystem/tools.py:298-311 masks unexpected exceptions, but FilesystemToolError:64-69
    has no retryable flag and the callback defaults it to false; that classification is not changed by
    this performance chore.
  siblings: ls/glob share workspace snapshot and cursor contracts; grep already offloads its scan. OpenAPI
    provenance also consumes a full snapshot and is not migrated to a stat-only view here. Export state/diff
    bindings share _write_binding and need the same comparison/reconciliation treatment.
  validation: 'Partially confirmed on dc7012e8: listing acquires full content snapshots, glob matching
    runs inline, and export downloads the prior payload. However filesystem errors are already non-retryable,
    Artifact metadata has no digest, and content-free listing cannot silently replace current binary classification/content-bound
    cursor semantics.'
plan:
- Offload the bounded glob scan through the existing cancellation-joining helper. Normalize the query
  once and avoid repeating invariant path/glob work while preserving exact project_glob_matches semantics,
  ordering, scan counters and cursor digest. Retain content-backed classification/snapshot acquisition
  unless an equivalent optimization is proven.
- Before export comparison, resolve current metadata. A differing size or media type proves unequal and
  can proceed with CAS against that observed exact revision without downloading its payload. Equal-size
  unknown content still requires bounded exact payload comparison; never treat matching size or an opaque
  revision as a content digest.
- Keep an allocation-owned bounded cache of the last confirmed export comparison/write per state/diff
  binding, keyed by exact revision and the candidate payload identity or local content digest. Reuse it
  only after current metadata resolves that same exact revision; retain no unbounded history and clear
  on release. A changed revision must be compared/reconciled normally.
- Preserve create-only/update CAS, unchanged-content no-op, transport ambiguity reconciliation and concurrent-write
  handling. Recheck metadata/content identity across races; a metadata read failure remains the existing
  classified failure and is not a license to overwrite.
- Use deterministic normalization, execution-thread and artifact-call counters over up to 20000 paths.
  Test no payload reads for metadata-proven unequal content or repeated unchanged confirmed exact revisions,
  and required payload reads for unknown equal-size content. Keep binary/opaque paths, external edits
  and stale cursors in regression coverage.
scope:
  in:
  - Bounded glob CPU work and invariant normalization; metadata size/media export fast path; bounded exact-revision
    comparison cache with unchanged CAS semantics.
  out:
  - Stat-only listing, metadata-based replacement of the workspace content digest, changed file/binary
    classification or OpenAPI provenance semantics.
  - A new metadata digest field, treating revision as digest, range/streaming Artifact API additions,
    or guaranteed zero payload reads on the first equal-size unknown revision.
  - Filesystem exception classification, edit/change behavior, tool/API shapes, page/scan limits and snapshot/cursor
    contracts.
acceptance_criteria:
- id: A1
  text: Glob normalizes its pattern once, preserves matching/order/scanned/cursor results for a 20000-path
    fixture and runs expensive matching on a worker thread. Deterministic barrier/count tests fail on
    the former inline/repeated-normalization path.
- id: A2
  text: Export skips prior payload download when metadata proves different size/media type, and repeated
    unchanged export of a confirmed exact revision uses its bounded local comparison cache. Unknown equal-size
    revisions still require exact payload comparison; no absent digest field is assumed.
- id: A3
  text: Changed revisions, CAS races, missing bindings, transport ambiguity, cancellation and cleanup
    preserve existing outcomes; cache entries are allocation-bounded and are cleared on release. No stale
    cached equality can suppress a required write.
- id: A4
  text: Listing still correctly identifies text, binary and opaque paths and rejects changed content-bound
    cursors; existing workspace/provenance result shapes and error classifications remain unchanged. Regression
    assertions use counters and ordering, not elapsed-time thresholds.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_filesystem_toolset.py tests/test_projectfs_local_direct.py
    tests/test_workspace_auto_export.py tests/test_openapi_toolset.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A4
