schema_version: "1.0"
id: V11-005
title: Add bounded filesystem@1 read Toolset
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-004]
languages: [python, go]

goal: >-
  Expose backend-independent, bounded project navigation and text search tools
  from Python Runtime while keeping project roots, contents and filesystem
  state entirely outside Contractor Server.

context:
  runtime_boundary: >-
    The implementation runs only inside Python Runtime and receives a narrowed
    WorkspaceReader. Server work is limited to adding the static exported tool
    names needed by the existing AgentTemplate validator; there is no API,
    allocation field, database state, host path or filesystem operation in Go.
  exact_tools: >-
    filesystem@1 exports list_roots, ls, glob, read_file and grep. Virtual paths
    are /<mount>/... and have already been confined by projectfs. Results may
    expose safe virtual paths and text windows but never host paths or raw
    fsspec/OS errors.
  bounds: >-
    ls/glob page limit is at most 200 with stable offset; read output is at most
    128 KiB and 400 lines; grep visits at most 100000 files or 32 MiB for at
    most two seconds and returns at most 100 matches. Every capped result has
    total/returned/truncated metadata and a deterministic continuation hint.

scope:
  in:
    - Implement immutable result DTOs and ADK-compatible tools over WorkspaceReader without accepting raw filesystem objects.
    - list_roots returns lexical mount name, virtual root and effective readOnly/overlay/materialize booleans plus content-free import counts.
    - ls lists immediate entries only and glob implements the shared path-aware star/double-star grammar with sorted unique pagination.
    - read_file returns a one-based line window, optional line-number rendering and honest line/byte truncation metadata.
    - grep supports fixed-string default and explicitly selected regex, case sensitivity and bounded excerpts with virtual path and one-based line.
    - Bound regex evaluation so a pathological expression or long line cannot monopolize Runtime; cancellation produces a stable safe failure.
    - Record only operation, virtual path, counts, byte sizes, duration, truncation and stable error code in allocation metrics; hash search patterns instead of retaining them.
    - Add the exact filesystem@1 descriptor to existing Server config metadata and assert parity with Runtime exports.
  out:
    - Edit/change tools, filesystem selection by Workflow, host paths in registration, source indexing, binary reads or a new Server endpoint.

deliverables:
  - {path: runtime/src/contractor_runtime/toolsets/filesystem.py, description: Bounded Reader-only ADK Toolset and safe result envelopes.}
  - {path: runtime/tests/test_filesystem_toolset.py, description: Backend parity pagination bounds cancellation and redaction tests.}
  - {path: internal/config/descriptors.go, description: Static filesystem@1 tool-name descriptor only.}
  - {path: internal/config/config_test.go, description: Exact descriptor and visible-name collision coverage.}

requirements:
  - id: R1
    text: The Toolset has no writer/materializer handle and cannot mutate any backend, including through an unrecognized fsspec method.
  - id: R2
    text: Successful and failed outputs are deterministic and contain no host path, file metadata outside the contract, traceback or unbounded content.
  - id: R3
    text: A scan that reaches its deadline or ceiling reports an honest incomplete result rather than success with a silently partial total.
  - id: R4
    text: Adding static Go descriptor data does not add Server behavior, persistence, wire fields or project knowledge.

acceptance_criteria:
  - id: A1
    given: Equivalent local, memory and overlay effective trees containing text, binary, empty directories and Unicode names.
    when: All five read tools execute with the same virtual arguments.
    then: Compatible results match, are sorted and paginated, and binary read attempts use workspace_binary_unsupported.
  - id: A2
    given: Trees and files exactly below, at and above every scan/output/time bound plus a pathological regex.
    when: Read/search operations execute and are cancelled at injected boundaries.
    then: Runtime remains responsive, prior state is untouched and returned truncation/deadline metadata is exact.
  - id: A3
    given: Runtime exports and Server descriptor metadata.
    when: Parity and config-loader tests run.
    then: The exact five names match and an AgentTemplate can select any non-empty subset without any filesystem payload reaching Server.

tests:
  - {name: filesystem-toolset, command: "cd runtime && uv run pytest tests/test_filesystem_toolset.py", covers: [A1, A2]}
  - {name: descriptor, command: "go test ./internal/config", covers: [A3]}
  - {name: runtime-lint, command: "cd runtime && uv run ruff check src tests", covers: [A1, A2]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
