schema_version: "1.0"
id: V407-024
title: "Align Runtime limits and grammars with the Server through shared fixtures: openapi@1 bounds, finding identifier grammar, summary bytes, placement-label SQL"
milestone: server-runtime-review-2026-10
epic: api-contracts
kind: defect
introduced_by: V2-003
priority: P1
status: pending
depends_on: [V405-002]
languages: [go, python, sql]
goal: "A document or identifier the Runtime accepts is accepted by the Server, and every cross-language limit is registered once and tested from one fixture."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings G1, G13, C3; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/platform/limits.md
  severity: high
  finding: >-
    (1) runtime/src/contractor_runtime/toolsets/openapi/tools.py:50-52
    MAX_DOCUMENT_BYTES = 4 MiB, MAX_DOCUMENT_DEPTH = 128, MAX_DOCUMENT_ITEMS
    = 100000 (values only) vs internal/scanplan/types.go:7-10 MaxSourceBytes
    = 2 MiB, MaxDepth = 64, MaxNodes = 100000 with NamesAreNodes true
    (internal/scanplan/document.go:174, keys count). A document of 2-4 MiB,
    depth 65-128 or over 50k key/value pairs passes validate_openapi and is
    later refused by scan preparation; no LIM entry for openapi@1 in
    docs/spec/platform/limits.md and no api/testdata fixture. (2) The
    identifier grammar ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$ appears in
    security_findings/submission.py:20, security_findings/collection.py:26,
    audit_results/contracts.py:27, audit_results/packages.py:31 and Go
    validateIdentifier; audit_results/contracts.py:18 MAX_SUMMARY_BYTES = 16
    KiB vs Go MaximumStringBytes = 64 KiB (internal/auditdomain/limits.go:17),
    an undocumented asymmetry; interactsh/tools.py:144-145 repeats the
    adapter's MAX_REGISTRATIONS check. (3) The placement-label grammar
    (namespace cloud|local, segment [a-z][a-z0-9_-]*, 63 bytes, 32 labels,
    one ancestor chain) is implemented in Go
    (internal/contracts/placement_labels.go:40-65, tested against
    api/testdata/v1alpha1/placement-label-cases.json) and again as a
    PL/pgSQL CHECK function in the V405-002 migration
    (runtime_placement_labels.sql) on workflow_runs.required_placement_labels
    and stage_allocations.runtime_placement_labels; nothing runs the fixture
    through contractor_valid_placement_labels, and its second regex is
    redundant with the first.
  siblings: >-
    docs/spec/platform/limits.md registry; make test-wire-cross-language;
    the CWE catalog copies (internal/auditimport/cwe_catalog.json vs
    toolsets/common/cwe_catalog.json) are byte-identical today and need a
    gate asserting identity.
plan:
  - "Set the Runtime openapi@1 bounds to the scanplan values (bytes, depth, nodes with keys counted) and register them as LIM entries; add api/testdata/openapi-document-bounds.json with accept/reject cases at the boundaries and test it from internal/scanplan and from tests/test_openapi_toolset.py; wire it into make test-wire-cross-language."
  - "Put the finding identifier grammar and summary byte bound in one Python module under toolsets/common with a fixture shared with Go (api/testdata/finding-identifier-cases.json); decide the summary bound (document 16 KiB as the Worker-side bound and 64 KiB as the Server-side string bound in limits.md, or make them equal) and remove the duplicate interactsh check."
  - "Add a PostgreSQL test (pattern: TestPostgresRunStateSetsMatchSchema) running every placement-label fixture case through SELECT contractor_valid_placement_labels($1) and drop the redundant second regex; or remove the SQL copy and keep Go validation plus immutability triggers, recording the choice in docs/spec/platform/persistence.md."
  - "Add a lint check (scripts/ or a Go test) asserting the two CWE catalog files are identical."
scope:
  in:
    - "Runtime bound alignment, LIM registry entries, shared fixtures, SQL grammar test or removal, CWE identity gate."
  out:
    - "Changing the Server-side bounds."
acceptance_criteria:
  - id: A1
    text: "A 3 MiB or depth-100 OpenAPI document is rejected by validate_openapi with the same classified error the Server would give; boundary fixtures pass in both languages."
  - id: A2
    text: "The finding identifier grammar has one Python definition and one Go definition tested against one fixture; limits.md documents the summary bounds."
  - id: A3
    text: "Every placement-label fixture case gives the same verdict in Go and in contractor_valid_placement_labels (or the SQL copy is gone)."
  - id: A4
    text: "make test-wire-cross-language runs the new fixtures and fails on the unfixed Runtime bounds."
tests:
  - command: make test-wire-cross-language
    covers: [A1, A2, A4]
  - command: "cd runtime && uv run --locked pytest -q tests/test_openapi_toolset.py tests/test_finding_facades.py tests/test_audit_completion_contracts.py"
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/scanplan/... ./internal/contracts/... ./internal/persistence/..."
    covers: [A1, A3]
  - command: make lint
    covers: [A2, A3]
