schema_version: '1.0'
id: V114-001
title: Do not renew a Runtime lease from a reregister heartbeat
milestone: reregister-heartbeat-lease-2026-10
priority: P2
status: in_progress
implementation_commit: null
depends_on: [V111-001]
languages: [python]
goal: Let the Runtime self-fence when Server has lost its registration and re-registration keeps failing.
context:
  issue: https://github.com/grauwolf32/contractor/issues/279
  finding: The Runtime renews its local watchdog from reregister responses even though Server holds no lease.
scope:
  in:
    - Skip watchdog acknowledgement for reregister responses.
    - Cover repeated failed registrations with 500, 409 and 400 responses.
    - Preserve renewal for continue, drain and release responses.
  out:
    - Change the Server heartbeat response contract.
acceptance_criteria:
  - {id: A1, text: Reregister responses leave the confirmed deadline and last acknowledgement unchanged.}
  - {id: A2, text: Repeated failed registration permits local expiry and fences the Runtime.}
  - {id: A3, text: Successful registration still re-arms; ordinary heartbeat actions still renew.}
tests:
  - {command: PYTHONPATH=runtime/src runtime/.venv/bin/python -m pytest runtime/tests/test_control_client.py runtime/tests/test_lease_watchdog.py, covers: [A1, A2, A3]}
  - {command: PYTHONPATH=runtime/src runtime/.venv/bin/python -m pytest runtime/tests, covers: [A1, A2, A3]}
