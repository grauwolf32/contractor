  - date: 2026-09-20
    step: implementation_in_progress
    details: >-
      Correcting the integration fixture and adding adapter rejection, artifact-read
      deadline, cancellation and cleanup tests. Documenting the versioned request
      contract and workflow usage. Formatted the existing parser/adapter changes.
      Downloaded upstream sqlmap commit 0c491b755187bc580fe2dee18105a4b8f74ea2ba
      (1.10.9.18#dev) into /tmp for a reproducible loopback HTTP/HTTPS transport check;
      the optional live test has been added and is awaiting execution.
  - date: 2026-09-20
    step: adapter_and_worker_verified
    details: >-
      Fixed the SQLMap AllocationSpec fixture to exclude absent model fields.
      Four Worker integration cases and 29 new adapter cases passed together
      (33 passed, 13 deselected). Coverage includes invalid and hidden refs,
      mutually exclusive arguments, media type/revision mismatch, malformed or
      oversized content before launch, cancellation/close/deadline during artifact
      retrieval and active subprocess execution, process descendants, private
      scratch cleanup and secret-free metrics. The normative request contract,
      README instructions and upload/run/report example are now documented.
      Subprocess tests require execution outside the restricted sandbox.
  - date: 2026-09-20
    step: live_transport_correction
    details: >-
      Real sqlmap preserved the initial HTTP/HTTPS POST and HTTPS PATCH requests,
      including encoded URL, headers and multiline UTF-8 body. The stronger
      parameter-selection assertion exposed sqlmap's automatic WAF probe adding
      a random query parameter. Request mode now passes --skip-waf so this probe
      cannot bypass the artifact's explicit testParameters; rerunning the live tests.
  - date: 2026-09-20
    step: live_transport_verified_and_reviewed
    details: >-
      All three pinned-upstream loopback cases now pass (HTTP POST, HTTPS POST,
      HTTPS PATCH), preserving the initial request on the wire and keeping query,
      cookie and authorization values unchanged while sqlmap probes the selected
      JSON parameter. Independent review found that sqlmap recognizes Burp XML
      request markers case-insensitively; corrected the validator accordingly and
      added regression coverage so nested XML request data cannot replace the target.
  - date: 2026-09-20
    step: final_checks_passed
    details: >-
      Combined scanner and Worker/Allocation/A2A/ADK regression suite passed all
      407 tests, including the real sqlmap cases and the mixed-case XML regression.
      Go configuration tests, go vet, focused Ruff/format, gofmt and diff checks pass.
      Updated this worktree to main 22c464c1 by fast-forward; incoming Evals changes
      do not overlap the implementation or its Runtime/configuration dependencies.
      Implementation is ready to commit and integrate.
  - date: 2026-09-20
    step: integrated
    details: >-
      Committed the implementation as 716c51f0fd7c861125288f579f102487381cd435
      and fast-forwarded main to that commit. A1, A2 and A3 are verified; task
      completed. Broader scan UI/release integration remains the separate V55-006
      scope; OpenAPI/RequestSet and ffuf remain separate tasks.
