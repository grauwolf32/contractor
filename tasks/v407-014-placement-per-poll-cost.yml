schema_version: '1.0'
id: V407-014
title: Reuse overlapping placement resolution work within a waiting attempt
milestone: server-runtime-review-2026-10
epic: execution-core
kind: chore
introduced_by: V106-001
priority: P2
status: pending
depends_on:
- V405-002
languages:
- go
goal: Avoid repeated resolution of the same candidate within one failed placement attempt while retaining
  fresh durable authorization on later attempts.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/scheduler.md
  finding: internal/controlplane/placement.go:99-115 retries stale-principal placement after refresh and
    may resolve a model hold through candidateEdges at :128 with a new cache after the main pass at :237.
    These passes can overlap, but PlacementCandidates contains only eligible slots and liveCandidates
    also contains occupied slots. When no eligible candidate exists, :233-235 skips the first resolution
    pass. The extra cost therefore depends on the overlap and failure path, rather than a fixed two-pass
    query count on every waiting poll.
  validation: Validated against main dc7012e8 on 2026-10-23. main dc7012e8 has no full GetRun/Workflow-snapshot
    read or unformatted RequiredPlacementLabels check in pinReservations. Those claims referred to an
    uncommitted V405-002 branch and are removed. Registry operationsRevision changes on heartbeat (registry.go:322),
    so it is not sufficient evidence for a cross-poll metadata-cache invalidation policy.
  siblings: Model and tool lanes share candidateEdges. Model holds must still resolve occupied live candidates
    that were absent from the first pass. After V405-002 is complete, inspect its actual committed placement-label
    contract as a dependency, without assuming the earlier uncommitted code remains.
plan:
- Add deterministic query counters for zero eligible candidates, partially overlapping eligible/live sets,
  stale-principal refresh and successful placement. State candidate/binding cardinalities and current
  per-attempt counts.
- Share the resolution/cache results only within the same attempt where the underlying principal/config/credential
  view is unchanged. Resolve newly considered live candidates and invalidate affected entries after a
  principal refresh.
- Retain fresh reads on subsequent scheduler polls and transaction-time authorization. Do not introduce
  cross-poll caching keyed only by operationsRevision.
- Preserve SCH-R176 re-claim/hold expiry and both lane classes; verify durable credential, binding and
  label mutations are observed and no stale result becomes a committed reservation.
scope:
  in:
  - Per-attempt resolution reuse and deterministic query-budget tests over candidate-set overlap.
  - Integration with the committed V405-002 placement-label behavior.
  out:
  - An assumed GetRun or gofmt fix from uncommitted code.
  - Cross-poll caches, new metadata invalidation policy, or changing SCH-R176 claim/hold behavior.
acceptance_criteria:
- id: A1
  text: When the same compatible candidate/configuration occurs in the main and hold passes without an
    intervening revision change, counting tests show reuse rather than duplicate metadata/credential lookups;
    candidates present only in the live set are still resolved.
- id: A2
  text: With no eligible candidates there is no fictitious first-pass query budget; stale-principal refresh
    invalidates affected resolution results, and subsequent polls observe changed durable credentials,
    bindings and placement labels.
- id: A3
  text: Real PostgreSQL placement tests and lane/hold tests preserve transaction revalidation, no-capacity
    outcomes and hold expiry; the overlapping-candidate count regression fails on the old path.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/controlplane/...
    ./internal/scheduler/... ./internal/runstore/...
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
