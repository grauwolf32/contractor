schema_version: "1.0"
id: V407-014
title: "Bound per-poll placement work for a capacity-waiting model Stage"
milestone: server-runtime-review-2026-10
epic: execution-core
kind: defect
introduced_by: V106-001
priority: P2
status: pending
depends_on: [V405-002]
languages: [go]
goal: "A model Stage waiting for capacity costs one bounded resolution per poll, reusing resolved edges and refreshing principals only when the registry changed."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding D3; file:line as of 39d89438; internal/controlplane/placement.go has uncommitted V405-002 changes, re-locate by function name"
  specification: docs/spec/execution/scheduler.md
  severity: medium
  finding: >-
    Per SCH-R176 a deferred model Stage is re-claimed on every Scheduler poll
    (1 s) while a lane is free. In internal/controlplane/placement.go
    ReserveAllContext (about lines 95-136) resolves every binding x candidate
    edge with its own read cache (candidateEdges: request configs, one
    GetBinding plus GetVersionByRef per agent label, LLM and runtime
    credential lookups), then on ErrInsufficientCapacity runs
    refreshCandidatePrincipals (one agentprincipal.Get per candidate),
    possibly retries placement, and holdForWaitingModelStage (about 195-224)
    calls candidateEdges again with a fresh cache over liveCandidates(). That
    is roughly 2 x (1 + labels + credential ids) + N queries per waiting Run
    per second. In the V405-002 diff, pinReservations does
    store.GetRun(ctx, request.RunID) (full Run row including the Workflow
    snapshot) inside the placement transaction only to compare
    RequiredPlacementLabels, and one 'if err != nil { return err }' line is
    not gofmt-formatted.
  siblings: >-
    The tool-lane placement path (V400) shares candidateEdges; the fix must
    keep both lanes correct.
plan:
  - "Keep the resolved edge set from the first candidateEdges pass and reuse it in holdForWaitingModelStage, resolving only candidates not in the first set (live candidates are a superset)."
  - "Skip refreshCandidatePrincipals unless the Registry's operations revision changed since the last refresh for this Stage (store the revision in the deferred-claim state or in memory keyed by StageExecution ID)."
  - "Replace the full GetRun in pinReservations with a narrow reader returning required_placement_labels (new runstore method) and run gofmt."
  - "Add an EXPLAIN-free test on the fake store counting store calls for one waiting Run across 5 polls with an unchanged registry (expect the second to fifth polls to cost at most 1 + extra-candidate lookups), plus a PostgreSQL test of the narrow reader."
scope:
  in:
    - "Edge reuse, revision-gated principal refresh, narrow Run read."
  out:
    - "Changing SCH-R176 re-claim semantics."
acceptance_criteria:
  - id: A1
    text: "Five polls of one capacity-waiting Run with an unchanged registry issue a bounded store-call count that does not grow with labels or credentials after the first poll (asserted by the counting test)."
  - id: A2
    text: "pinReservations reads no Workflow snapshot (asserted via the fake store)."
  - id: A3
    text: "Existing placement, hold and lane tests pass; the counting test fails on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/controlplane/... ./internal/scheduler/... ./internal/runstore/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A3]
