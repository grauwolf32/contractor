schema_version: '1.0'
id: V64-015
title: Measure whether a larger Audit frontier needs incremental indexing
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P2
status: pending
depends_on:
- V64-011
languages:
- go
- json
goal: Establish whether the common bounded selector needs extra machinery, and add only a measured, concrete
  missing capability.
context:
  authority: 'User decisions on 2026-10-31: Contractor is a research platform. Audit provides durable
    coordination over ordinary Runs, fixed assertions use common hypotheses, exploratory findings may
    have no hypothesis, deduplication and exact Audit/Run origin remain, hypothesis associations are automatic
    and owner-independent, formal approvals are removed almost completely, and complexity must decrease
    or stay controlled. The user requested task replanning and diagrams for review before implementation.'
  proposal: docs/proposals/0045-audit-hypothesis-search.md
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/persistence.md
  deterministic_boundary: All Audit assertion checks use common hypotheses. Fixed checklist/standard seeds
    remain deterministic without generation, ranking or a separate research phase. Direct Runs and supporting
    non-assertion work need no hypotheses.
  implementation_boundary: Each new table, state, export and schema must have its named production writer/reader
    in this task; include the smallest actual integration caller, not a test-only placeholder waiting
    for another task.
  implementation_gate: Planning only. The user will review the revised task graph and proposal 0050 before
    authorizing implementation. Keep pending and do not start code, migrations, live Runs or deployment
    from this planning update.
  extension_boundary: First measure the simple common ready-task query at supported scale. Add dirty propagation/projections
    only for an evidenced failure and a concrete reader; do not make this task a base release prerequisite.
  execution_scope: Optional follow-up outside the requested basic scenario and V64-011 exit. Its pending
    status does not add it to the current base implementation scope; select it separately after the reviewed
    prerequisites.
scope:
  in:
  - Measure the common selector through its real reader at realistic/published ceilings and record processed
    rows/bytes.
  - If the simple query cannot meet the registered bounds, implement the smallest indexed projection/continuation
    in the same owner with actual update/read callers.
  - Otherwise record the no-additional-machinery outcome and remove obsolete frontier-only APIs/gates
    from this task.
  out:
  - Mandatory base frontier, new queue/lease/controller, whole-pool model rescoring or speculative graph
    propagation.
requirements:
- id: R1
  text: A ready query cannot check unbounded per-row dependencies after scanning a huge pool. Pending
    propagation does not grant eligibility.
- id: R2
  text: New evidence marks affected projections dirty without rewriting accepted plans/results; contradictory
    outcomes retain their original scope.
- id: R3
  text: No new lease, scheduler, global knowledge database or full-document CAS hotspot is introduced.
failure_outcomes:
- operation: Incremental readiness/score projection and frontier reads
  permanent: Invalid, foreign, unsupported or oversized input is rejected with the owning V64-001/standard
    contract reason; deterministic ErrInvalid is never endlessly retried and no partial authoritative
    result is accepted.
  retryable: Use existing bounded transient storage/provider retries for the owning operation; retry attempt/deadline
    limits are explicit and do not switch research policies or models.
  ambiguous: Reconcile the same existing keyed mutation, accepted producer association or exact result;
    never create another logical effect or repeat target activity to repair acknowledgement loss.
  cancelled: Existing Audit/Run owner fences and join/drain rules apply; allow authorized terminal collection,
    block new dispatch and release resources only after in-flight work is joined.
  timeout: Use the owning operation/Run deadline. Audit admission deadline pauses and drains; non-time
    budget exhaustion follows bounded finalization with gaps.
cardinality:
- collection: Ready, due and dirty history
  expected: 1,000 hypotheses and 20,000 edges
  maximum: 10,000 hypotheses / 100,000 edges; 100 entries / 256 KiB response
  bound: 128 primary and 512 total descriptors / 1 MiB per slice, with explicit continuation; timing belongs
    in benchmarks, not correctness assertions.
lifecycle:
- entity: Task-owned research records, exact artifacts and projections
  delete: Audit/Project ownership and existing deletion gates apply; accepted evidence used by work is
    retained, not removed by settling or withdrawing a candidate.
  cascade: Use the owning Audit relations and existing artifact hold lifecycle; register any new holder
    inventory entry in this change and leave no independent cleanup owner.
  retention: Preserve exact accepted inputs/results and history through permitted source Run deletion,
    pause and recovery; release only through the owning lifecycle. Stateless validation/read-only outputs
    acquire no artificial persistent state.
acceptance_criteria:
- id: A1
  given: supported-scale common task/hypothesis data with sparse ready work
  when: the actual selector is measured by deterministic row/byte counters
  then: the result either proves the simple query sufficient or names the precise missing indexed capability
- id: A2
  given: the selected outcome
  when: the task closes
  then: no unused projection/export/loop remains and the base path depends on no optional frontier
tests:
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/auditstore/... ./internal/auditservice ./internal/auditcontroller
  covers:
  - A1
  - A2
- command: make lint
implementation_commit: null
reactivation:
  date: '2026-10-24'
  previous_status: deferred
  reason: Explicit user request to queue the reviewed proposal 0045 tasks as pending.
  execution_rule: Implementation may start after declared dependencies complete; this update starts no
    implementation.
previous_deferral:
  date: '2026-10-24'
  previous_status: pending
  reason: Planning-only breakdown of proposal 0045; implementation has not been activated.
  reactivate_when: Explicit user authorization to implement this reviewed proposal 0045 scope, after its
    declared dependencies are completed. Replanning alone does not activate it.
deliverables:
- path: internal/auditstore
  description: Indexed readiness/dirty/lineage queries and real PostgreSQL scale tests.
- path: internal/auditservice
  description: Bounded projection maintenance and frontier reader used by selection.
- path: internal/auditcontroller
  description: Existing-owner reconcile hooks with continuation and per-tick work accounting.
test_prerequisites:
- Commands are implementation acceptance requirements, not results of this planning change. New named
  gates must be created, registered and fail on zero matching cases.
- Persistence/lifecycle acceptance uses disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; an
  unavailable configured database or mandatory skipped case fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Shipped configuration
  has its dedicated validation command.
- Run complete suites for touched packages; use injected clocks and deterministic work counters. Put timing
  measurements in benchmarks.
verification_requirements:
- Update owning numbered specifications, strict public/wire contracts and shared fixtures with implementation;
  do not cite task IDs from normative specifications.
- Record actual commands, case counts, required prerequisites and exact evidence after implementation.
  Planning does not populate implementation_commit or fabricate successful checks.
- Keep direct deterministic behavior, existing claims/receipts and source-to-consumer exact provenance
  explicit in real-path assertions.
