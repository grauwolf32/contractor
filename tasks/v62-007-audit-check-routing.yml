test_prerequisites:
- Disposable PostgreSQL is mandatory for store cases. Set CONTRACTOR_TEST_DATABASE_URL; absent or unreachable
  required infrastructure, skipped mandatory cases and zero matched tests fail the dedicated gate.
- Tests use isolated testdata, not the live configs tree. Process cases use actual Server/Runtime and
  scripted local model/provider fixtures; no paid models or live targets are needed.
- Run the complete suites of every touched package. Shared schema changes update every reader, owning
  numbered specifications, limit/error/lifecycle registries and cross-language fixtures in the same implementation
  change.
verification_requirements:
- Use registered production schemas and actual finding receipt admission; model text or a test-only origin
  must not establish trusted authority. V64-006 owns the future base research-to-ordinary-AuditItem source
  implementation, and V64-018 owns only its pentest specialization.
- Preserve V209-001 unsupported-executor rejection and current ordinary finding-verification acceptance;
  verify complete touched package suites and real store/process paths.
requirements:
- id: R1
  text: Profile mappings use a strict registered plan schema and declared method/phase semantics to select
    one compatible exact named check binding. Generic routing is not globally restricted to verify/replay;
    schema owners declare supported methods such as applicability or alternative testing. Free text alone
    cannot register a method or acquire authority.
- id: R2
  text: The common accepted-plan descriptor carries trusted origin identity, exact plan digest, dependencies
    and authorization. Wire the existing finding receipt/ordinal adapter in production now; an unknown
    origin is rejected, never treated as a finding with fabricated receipt fields. The base research adapter
    in V64-006 must prove its exact source and membership; V64-018 adds only pentest-specific validation
    and proof/replay integration.
- id: R3
  text: Before acceptance revalidate owner/Audit/baseline, source acceptance, V62-006 exact closure, configured
    required capabilities, Project active-check/approval policy and cumulative item/Run/budget bounds.
    The selected route cannot union permissions across incompatible items or broaden authority.
- id: R4
  text: Persist deterministic decisions and source-to-item attribution under existing keyed mutations,
    natural identities and ControllerClaims. Freeze next-Round membership/ordinals and exact role closure
    atomically. Retry of storage/collection is not a new target action or changed plan.
- id: R5
  text: Use bounded indexed intake selection and retained decisions with stable tie-breaking; no model
    ranking is required. Unsupported methods/capabilities/dependencies produce explicit rejection/defer/block
    results and cannot select arbitrary default work.
- id: R6
  text: Without declared typed mappings preserve inventory.itemWorkflowRole and standard-mapping routing
    for current valid schemas. Obsolete schemas still fail strictly. Direct Runs and deterministic inventories
    must require no hypothesis, search cycle, generation or ranking.
- id: R7
  text: Wire actual finding next-Round admission and dispatch in this task. Schema fixtures alone, a callable
    helper without a production caller or a future V411/V64 consumer does not satisfy completion. Generic
    verify/replay fixtures exercise separate ordinary roles without claiming pentest proof.
failure_outcomes:
- operation: Validate profile method routing and trusted plan source
  permanent: Unknown/ambiguous mapping, unsupported source/schema, capability mismatch or invalid exact
    dependency produces the owning stable validation/rejection outcome with no item, child Run or fallback
    route.
  retryable: Transient storage errors retain existing storage_transaction_conflict 503/bounded retry classification;
    deterministic store rejection is never retried indefinitely.
  ambiguous: Use exact immutable profile/source descriptors and accepted source identity to reconcile;
    an earlier rejection/decision cannot be replaced by guessed current data.
  cancelled: Owner fence stops new admission and joins active validation/materialization before cleanup.
  timeout: Finite admission/validation deadline applies independently from later check execution and target
    deadlines.
- operation: Accept next-Round decisions and dispatch routed items
  permanent: Stale authority, exhausted non-time budgets, invalid generation or expired exact approval
    prevents new dispatch with explicit dispositions; existing Audit deadline exhaustion pauses instead
    of finalizing.
  retryable: Existing bounded transaction-conflict and shared retention backpressure retries retain the
    same plan/decision key; capacity waiting stays distinct from missing capability.
  ambiguous: Reconcile accepted Round/item/decision and existing child intent/collection receipts; no
    duplicate item, budget debit or target execution.
  cancelled: Fence new Round/Run admission, allow existing lifecycle-authorized terminal collection during
    drain, and retain accepted decisions.
  timeout: Current Audit admission clock, item/Run deadlines and collection allowances retain separate
    ownership; waiting reasons have an explicit trigger rather than per-tick repeated work.
cardinality:
- collection: Profile method routing map and exact binding closure
  expected: A few plan schema/method/phase combinations.
  maximum: Proposed 128 unique mapping entries, subject to tighter existing Workflow role/mapping and
    config payload limits.
  bound: Validate once per exact profile closure and use indexed/canonical lookup for each candidate;
    reject duplicate ambiguous keys before child creation.
- collection: Candidate admission and decision descriptors within an Audit
  expected: A few selected receipts/plans for the next immutable Round.
  maximum: Existing per-Round/remaining total-item ceilings; at most 128 primary candidate/decision records,
    512 related descriptors and 1 MiB metadata per slice.
  bound: Use indexed keyset intake and bounded continuation; final accepted membership is atomic even
    when immutable prepared work is paged. Existing 64-item execution batch and tighter dependency/retained-link
    caps still apply.
- collection: Retained decision history and next-Round membership
  expected: Several Rounds with bounded admitted/rejected/deferred reasons.
  maximum: Existing Audit lifetime item/Run/round and typed proposal limits; a unique source/plan/decision
    generation can be accepted once.
  bound: Do not append another rejection on every controller tick. Page history through existing bounded
    report/list readers and purge with owning Audit limits.
lifecycle:
- entity: Routing/admission decision and accepted next-Round item
  delete: Audit deletion after drain removes owned decisions/items; withdrawing an unadmitted source does
    not rewrite accepted work.
  cascade: Existing Audit item/source relation and purge lifecycle release exact dependencies; pending
    approvals follow their existing owner close/cancel rules.
  retention: Accepted source, policy, route, approval and role closure stay exact through restart; pause/resume
    rechecks current authority without changing accepted bytes. No automatic resurrection of rejected/skipped
    accepted worklists.
