goal: Put artifact and skill contents before secondary metadata.
context:
  authority: User approved implementing the 2026-09-19 live design review and recording the task list.
  design: docs/plans/2026-09-19-ui-design-implementation.md
  review: docs/research/2026-09-19-ui-design-review.md
  finding_ids:
  - D04
