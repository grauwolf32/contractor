scope:
  in:
  - Render bounded SKILL.md frontmatter as safe metadata without changing Source or executing external
    content.
  - Place explicit file opening, download and version selection before secondary metadata; open uploads
    and history on demand.
  - Show useful Skills descriptions and retain Catalog navigation context without unbounded eager
    package downloads.
  - Explain archive index versus individual preview limits and provide a useful 404 recovery page.
  out:
  - Changes to execution, audit evidence or security boundaries unrelated to UI behavior.
  - New evaluation experiment or toolset-configuration protocols tracked separately in V41/V56.
