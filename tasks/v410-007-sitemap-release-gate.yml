test_prerequisites:
- New test-project-sitemap-e2e and its manifest are deliverables, not pre-existing evidence. Existing consolidated
  release mode must still prove actual required case execution.
- A scale failure may require implementation changes within this task or a separately tracked dependency; the task
  cannot complete with a merely proposed partitioning remedy.
- Use controlled non-Audit fixtures for the single-Run publication regression; no unrelated execution budget may
  mask removed-limit cases. V410-010 owns generic non-sitemap User/Project/Run fixtures and automatic per-binding
  retention gates; do not duplicate their implementation or introduce registration for those fixtures.

