test_prerequisites:
- New test-project-sitemap-e2e and its manifest are deliverables, not pre-existing evidence. Existing consolidated
  release mode must still prove actual required case execution.
- A scale failure may require implementation changes within this task or a separately tracked dependency; the task
  cannot complete with a merely proposed partitioning remedy.
- Use controlled non-Audit fixtures for the single-Run publication regression; no unrelated execution budget may mask
  removed-limit cases. V410-010 owns generic non-sitemap User/Project/Run fixtures and automatic per-binding retention
  gates; do not duplicate their implementation or introduce registration for those fixtures.
execution:
  released_on: '2026-10-26'
  previous_branch: codex/v410-sitemap
  note: Returned to pending at the user's request to finish V410-002 and pause. Implementation of this task has not
    started; the prior batch reservation is released.
implementation_decisions:
- date: '2026-10-27'
  decision: Keep one executable owner for each required case and reuse existing sitemap and common ArtifactStore gates.
    Verification must exercise actual nonblocking submission, keyed acknowledgement recovery, explicit read of committed
    state after automatic refusal, and joined crash/cancel/release. It does not create completeness states or duplicate
    generic persistence mechanisms.
