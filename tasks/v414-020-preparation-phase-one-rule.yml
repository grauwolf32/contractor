schema_version: "1.0"
id: V414-020
title: "Give the pre-Round preparation phase set one definition in Go and one in the UI"
milestone: review-v407-v409-followups-2026-10
epic: audits
kind: chore
introduced_by: V407-004
priority: P3
status: in_progress
depends_on: []
languages: [go, typescript, sql]
goal: >-
  Every check of "the Audit is preparing or inventory" (the phases without a
  current Round, AUD-R194) goes through one Go predicate and one UI helper,
  and the PostgreSQL phase constraints are tested against the Go predicate,
  so a new or renamed phase cannot leave a copy behind.
context:
  review: >-
    tasks/done/v407-004-audit-list-summary-projection.yml (V407-004 added
    AuditPhase.ShowsPreparation for the list snapshot and left the existing
    hand-written copies).
  specification:
    - docs/spec/audits/audits.md#AUD-R190
    - docs/spec/audits/audits.md#AUD-R194
    - docs/spec/audits/scans.md#ASC-R150
  finding: >-
    internal/auditdomain/preparation.go:18-23 defines
    AuditPhase.ShowsPreparation() as p == AuditPhasePreparing || p ==
    AuditPhaseInventory, used by pgstore/preparation.go:81 and
    httpapi/public/audit_preparation.go:47.
    internal/auditcontroller/controller.go:400-403 (dispatchClosureReason)
    hand-writes the same set (audit.Phase == AuditPhasePreparing ||
    audit.Phase == AuditPhaseInventory, with no Round and no current Round
    ID), and internal/auditservice/start.go:842 hand-writes its negation
    for a started Audit without a Round. Same phase set, same rule: both
    phases precede rounds and have no currentRoundId (AUD-R194), and the
    database requires either phase to pin a prepare role. The name
    ShowsPreparation describes the read-model use, not the rule; the
    implementer may keep it or rename it to a phase-neutral name and
    update every caller.
  siblings: >-
    Go production: controller.go:400 and start.go:842 (in scope). Go tests:
    httpapi/public/audit_list_preparation_postgres_test.go:490 and :586
    (switch to the predicate where they model production behaviour;
    audit_preparation_test.go:81 enumerates the phases as data and may
    stay). SQL: audits_phase_shape CHECK (000001_baseline.sql:3352) and
    contractor_protect_audit_preparation_baseline (000001_baseline.sql:854,
    :866, redefined in 000037_trigger_scope_for_unrelated_updates.sql:139,
    :148) list the same two phases; SQL cannot import Go, so add a
    PostgreSQL test that, for every AuditPhase value, checks the constraint
    accepts a NULL current_round_id exactly for the phases the predicate
    selects. UI: ui/src/routes/projects/audits/progress.tsx:118-119 and
    check-activity.tsx:247 compare audit.phase with "preparing" and
    "inventory"; give them one helper over the generated AuditPhase type.
  provenance: >-
    The controller and start.go copies came with 11471640 (implementation of
    V62-003 and V62-004), the UI copies with a597d779 (V62-011). The rule got
    its second, named definition in 3cd9826c, which V407-004 lists as its
    work (ShowsPreparation), without folding the copies; that is the
    duplication this task removes, so introduced_by names V407-004.
scope:
  in:
    - "controller.go:400 and start.go:842 use the Go predicate (renamed if the implementer chooses, with every caller updated)."
    - "One UI helper used by progress.tsx and check-activity.tsx, with a unit test over every AuditPhase value."
    - "A PostgreSQL test that holds audits_phase_shape and the preparation-baseline trigger to the Go predicate for every phase."
  out:
    - "Phase values, transitions and the controller's closure reasons, which stay exactly as they are."
    - "The list snapshot and preparation projection (V407-004)."
acceptance_criteria:
  - id: A1
    given: "The Go server"
    when: "a source-scan test looks for a comparison with both AuditPhasePreparing and AuditPhaseInventory in production code outside auditdomain"
    then: "no copy remains and controller and start use the predicate; the scan fails on 19f7477f, naming controller.go:400 and start.go:842."
  - id: A2
    given: "The UI"
    when: "the source is searched for phase === \"preparing\" || phase === \"inventory\""
    then: "only the helper holds the set, and progress and check-activity render as before."
  - id: A3
    given: "A copy of the database constraint or trigger that disagrees with the Go predicate (for example a third phase added to Go only)"
    when: "the new PostgreSQL test runs"
    then: "it fails; on the current schema it passes."
  - id: A4
    given: "The existing Audit controller, start, preparation and UI tests"
    when: "they run unchanged"
    then: "they pass; any test edited only follows the predicate or helper."
tests:
  - command: "go test -count=1 ./internal/auditcontroller ./internal/auditservice ./internal/auditdomain ./internal/httpapi/public"
    covers: [A1, A4]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/auditstore/... ./internal/httpapi/public"
    covers: [A3, A4]
  - command: make ui-verify
    covers: [A2, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]
