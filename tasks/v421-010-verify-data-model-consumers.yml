    Tasks can proceed independently except V421-004 follows V421-003's minimal
    attempt diagnostic boundary. V421-005 and V421-006 share Eval models and
    fixtures; V421-003/004/009 share public clients and UI generation, so rebase,
    regenerate and rerun the relevant gates after integration. V421-007 must
    preserve internal Worker/summarizer budgets and projectfs integrity and
