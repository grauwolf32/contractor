schema_version: '1.0'
milestone: project-review-v60
priority: P2
languages:
- go
- python
- typescript
- markdown
id: V60-001
title: Record detailed project review plan and execute the first evidence pass
status: in_progress
depends_on:
- V59-005
goal: Build a risk-ordered review plan after V59 and execute a source, history and focused-test pass without confusing
  hypotheses with defects.
context:
  authority: User requested a detailed project review plan and commencement after fixing the OpenAPI findings.
  specification:
  - docs/spec/README.md
  - docs/spec/00-workflow-and-planner.md
  - docs/spec/04-execution-lifecycle-and-metrics.md
  - docs/spec/06-server-ui-and-operations.md
  - docs/spec/19-audits.md
  design: docs/plans/2026-09-20-project-review.md
scope:
  in:
  - Record exact baseline, concurrent task inventory, boundaries and explicit evidence standards.
  - Map the complete project into review phases with entry points, scenarios, commands, dependencies and exit criteria.
  - Execute an initial risk-focused pass across execution/runtime, artifacts/Audit/product and authentication/quality/operations.
  - Record confirmed findings, rejected hypotheses, accepted decisions and unexecuted follow-ups separately; create
    bounded correction tasks for confirmed defects.
  out:
  - Declare whole-project review complete from the initial pass.
  - Take over V38 managed Evals, V40-002, V55-004 or V56 toolsets or change deferred finalization decisions.
  - Run live models, mutate production data or deploy.
acceptance_criteria:
- id: A1
  text: The plan covers all major specification domains and lists concrete risk scenarios and verification gates.
- id: A2
  text: The first-pass report has source/history evidence, actual focused checks and explicit limits; confirmed
    issues have bounded task mappings.
- id: A3
  text: Concurrent and unfinished work is identified without duplicate implementation ownership.
tests:
- command: git diff --check
  covers:
  - A1
  - A2
  - A3
verification_requirements:
- Check local links, unique task IDs and dependency graph; record actual commands/results and original implementation
  hash in a later completion commit.
