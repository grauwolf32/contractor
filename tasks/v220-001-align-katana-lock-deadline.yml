schema_version: '1.0'
id: V220-001
title: Align Katana scan and publication deadlines after scan lock acquisition
milestone: runtime-maintenance-2026-10
priority: P2
status: completed
implementation_commit: b74fb9d58c2953ca2819b28185ff82957e7bc91f
depends_on: []
languages: [python]
goal: Prevent a Katana crawl from losing its targets publication budget solely while waiting for the allocation scan lock.
context:
  issue: https://github.com/grauwolf32/contractor/issues/230
  finding: Katana publication counts pre-lock wait while its crawl budget begins after the lock.
scope:
  in:
    - Use one post-lock monotonic start for scan preparation, process budget and targets publication.
    - Document whether lock waiting counts toward timeout_seconds.
    - Cover a Katana call delayed behind the scan lock.
  out:
    - Changing the configured Katana process flags or scan lock serialization.
acceptance_criteria:
  - {id: A1, text: Katana waiting on the scan lock still publishes targets if its post-lock work finishes within timeout_seconds.}
  - {id: A2, text: Lock waiting alone never causes scan_artifact_failed after a completed crawl.}
  - {id: A3, text: Existing Katana behavior and cancellation tests remain valid.}
tests:
  - {command: cd runtime && uv run pytest -W error tests/test_scan_katana.py tests/test_scan_katana_lifecycle.py, covers: [A1, A2, A3]}
  - {command: make test-runtime, covers: [A1, A2, A3]}
  - {command: make lint, covers: [A1, A2, A3]}
