schema_version: '1.0'
id: V458-005
title: Bound cost freshness reads with existing indexes and Audit counters
milestone: llm-cost-reporting-2026-11
epic: operations
kind: defect
introduced_by: V458-002
priority: P2
status: in_progress
depends_on: [V458-002]
languages: [go]
goal: Keep independently refreshed cost reads bounded even when a Project or Audit retains a large completed Run history.
context:
  review: Final V458 implementation review on 2026-11-09
  severity: low
  finding: 'internal/projectstore/llm_cost_sql.go:8 probes workflow_runs by project_id alone and NOT IN terminal states, which cannot use the existing owner/project active partial index. internal/auditstore/internal/pgstore/llm_cost_sql.go:18 unnecessarily joins historical executions to Runs for liveness.'
  siblings: Run detail uses its primary key and is bounded. Explicit Work execution reads use a bounded exact-ID set. Project membership probes need owner predicates and the indexed active-state predicate; Audit already owns an authoritative outstanding_run_count.
scope:
  in:
  - Use the existing owner/project active and membership indexes for Project cost freshness.
  - Use the existing Audit outstanding Run counter for paused-check liveness.
  - Real PostgreSQL 12000-Run read-budget regression under custom and generic plans.
  out:
  - New tables, indexes, schema migrations, receipts or public API changes.
acceptance_criteria:
- id: A1
  text: A cost read after 12000 completed Runs visits at most four Run rows under both prepared plan modes and still detects a newly active Run.
- id: A2
  text: Paused Audit cost remains pending while outstanding Runs exist, and existing attribution, ownership and retention suites pass.
- id: A3
  text: The realistic read-budget regression fails on the original Project query and passes after the query correction; no database object is added.
tests:
- command: go test -count=1 ./internal/projectstore ./internal/auditstore/internal/pgstore ./internal/runservice
  covers: [A1, A2, A3]
- command: make lint
  covers: [A1, A2, A3]
