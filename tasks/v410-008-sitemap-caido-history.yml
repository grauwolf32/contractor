  description: New test-sitemap-caido-history-e2e target with required local provider/real component cases and release
    graph registration.
- path: runtime/tests/testdata
  description: Sanitized pinned provider continuation, expiry, repetition and out-of-selection fixtures.
- path: docs/guides
  description: Explicit history source setup, continuation limits and honest unsupported/gap handling.
