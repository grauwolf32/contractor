  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- The new gate uses a controlled pinned-schema GraphQL provider and real Server/Runtime/PostgreSQL, with fail-on-missing/skip/zero-case
  behavior; no access to a live shared Caido instance is required for deterministic acceptance.
