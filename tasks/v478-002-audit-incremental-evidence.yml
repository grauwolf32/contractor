schema_version: '1.0'
id: V478-002
title: Retain check observations during work through existing artifacts
milestone: audit-plan-evidence-results-2026-11
epic: audits
kind: feature
priority: P1
status: pending
depends_on:
- V478-001
languages:
- go
- python
- json
- markdown
goal: Observed evidence and attributed intermediate interpretation become readable before a final result; already
  acknowledged data survives a later limit or Worker loss.
demonstration: Issue a control request and a test request for one assigned check, retain them and an attributed
  observation, then kill the Runtime before result submission. The Server reads the committed check-linked
  artifacts without replaying either request.
context:
  authority: 'User request 2026-11-22: prepare tasks for a concrete Audit check plan, evidence collected during
    work, a thin result submission tool, and partial results on interruption without invented coverage conclusions.
    The user corrected the assumption that limits reveal completed/remaining semantic steps: execution facts
    do not establish semantic coverage. The user proposed submit_result and explicitly requested joint review
    and agreement before merging these tasks into main. This is planning authorization only. Names, retention
    policy and stop representation below are agent recommendations pending review, not accepted user decisions.'
  implementation_gate: Keep pending. Do not implement, deploy, launch an Audit or merge this task plan into
    main until the user reviews and agrees to the concrete tasks. Record that agreement and resolve context.decision_needed
    before implementation; task-plan approval alone does not authorize implementation.
  baseline: Local main 6a4d479d361f8fcb1ce5c74c7f512c5dfe4666af; Invoice Lab demonstrated one broad exploration
    item ending after one accepted conclusion. This is motivation, not a live quality benchmark.
  specification:
  - docs/spec/audits/common-contract.md
  - docs/spec/audits/worker-completion.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/tools/http-caido.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/retention-and-deletion.md
  boundary: Extend existing common Task/hypothesis, Runtime collector, Artifact and Audit intake owners. Source
    adapters own observation extraction; Server owns assignment, authority, exact retention and lifecycle.
    No alternate execution engine or coverage ledger. Update numbered owning specs and all API/wire/schema
    readers with implementation, not in this unapproved plan.
  decision_needed: 'Review recommendation: explicitly enable bounded automatic capture retention for assigned
    Audit checks, with an explicit item key in multi-item invocations; supplement it with one small record_observation
    tool for semantic notes and grouping exact handles. Alternative: require explicit record_observation selection
    for every capture, reducing retained traffic but losing unselected observations at a hard stop. These alternatives
    have different persistence guarantees; settle before implementation. The recommended record_observation
    name and precise note fields are also proposed, not approved; use existing exact observation handles plus
    bounded interpretation/tested-condition/limitation fields, with no final verdict or fabricated system facts.'
  sources:
  - runtime/src/contractor_runtime/toolsets/common/http_capture.py
  - runtime/src/contractor_runtime/toolsets/common/http_publication.py
  - runtime/src/contractor_runtime/toolsets/audit_results/collector.py
  boundary_decision: Extend the existing capture publisher and Task-owned Artifact attachment/hold path. Shared
    toolset plumbing lives in toolsets.common, with explicit tool opt-in; the HTTP adapter produces HTTP facts.
    First production consumers are HTTP exchanges and explicitly selected exact input-artifact evidence. This
    is not a global trace archive or new persistence service.
scope:
  in:
  - Persist bounded capture/observation artifacts and their exact Task/attempt association during execution
    using existing receipts, forks and holds.
  - Expose committed observation handles and safe pending/unavailable persistence diagnostics through current
    tools and ordinary Audit material reads.
  - Provide incremental model notes for grouping control/test/postcondition evidence and recording tested conditions/limitations,
    clearly attributed as interpretations.
  - Preserve independent Finding receipts and reuse the same exact evidence without copying arbitrary traces
    into the result.
  out:
  - Automatically retaining every tool input/output, raw credentials, full transcripts or all direct-Run HTTP
    traffic.
  - Provider registry, independent observation database, replay engine, inferred principals from credential
    labels or inferred semantic step completion.
requirements:
- id: R1
  text: Bind every record to the exact assigned item and attempt. A single-item invocation may derive membership;
    a batch requires explicit validated membership. Never use a mutable global active-check pointer across
    concurrent calls.
- id: R2
  text: Persist captures before claiming durable evidence. Attach acknowledged records to ordinary Audit-owned
    retention during work, so permitted Run deletion cannot destroy them before a final submit. A pointer alone
    is not a hold.
- id: R3
  text: Distinguish factual adapter observations from model interpretation. A record_observation note can cite
    exact admitted handles and describe tested conditions, uncertainty and role; it cannot assert trusted provenance
    or system-confirmed coverage.
- id: R4
  text: Reuse current sanitization and evidence envelopes. Do not automatically promote materials, notes, status
    codes or tool-call counts into verified evidence of a security claim.
- id: R5
  text: Apply 256-record/8 MiB invocation and Audit evidence-byte limits incrementally with reserved result/stop
    metadata space, including notes and repeated annotations. When capacity is exhausted, expose an explicit
    persistence gap and stop further collecting work according to the owning policy; do not silently evict
    acknowledged evidence.
- id: R6
  text: A response may arrive before its capture commits. On ambiguous persistence or process death preserve
    the acknowledged prefix, mark the unconfirmed tail unknown where known, and never resend the target request
    to reconstruct it.
- id: R7
  text: Retries reconcile existing artifact/mutation identities. Compaction, collection updates and further
    attempts do not duplicate observations, erase prior records or relabel their authorship.
failure_outcomes:
- operation: Publish an observation and attach its exact artifact to Audit-owned retention
  permanent: Reject invalid membership, foreign/exact-revision mismatches, quota violations and malformed input
    before mutation using owning classified errors. No retry of deterministic invalid input; specify any new
    public code/status in the owning error registry and OpenAPI in the implementation.
  retryable: Use existing bounded storage_transaction_conflict 503 and Artifact retry contracts, original receipt
    identity and owning deadline. Never retry target traffic to recover a persistence failure.
  ambiguous: Reconcile the same natural Artifact binding or existing keyed Audit mutation receipt. Return unknown/unconfirmed
    persistence if reconciliation fails; do not claim durable acceptance or create another logical effect.
  cancelled: Honor existing allocation/Run/Audit fences. Join owned I/O before cleanup; retained committed
    records survive. Do not send additional target/model calls to repair a partial result.
  timeout: Use existing operation and invocation deadlines; terminal persistence uses only the existing owner-authorized
    bounded drain/reconciliation path, never an unbounded extension of model execution.
- operation: Send an assigned HTTP probe and retain its actual capture
  permanent: Invalid scope/assignment is rejected before send. A legitimate target denial or unexpected response
    is an observation, not by itself an infrastructure failure or semantic conclusion.
  retryable: Only the existing HTTP transport policy decides transport retries; observation persistence retries
    must never resend a probe.
  ambiguous: A possibly sent request with no confirmed retained capture remains unknown/unavailable. Reconcile
    persistence by original identity if possible; never reconstruct traffic.
  cancelled: Join the transport and capture worker; retain only actually committed data and report a known
    persistence gap if capture did not commit.
  timeout: HTTP request deadline bounds the exchange; Artifact and owning invocation deadlines separately bound
    retention. No new model call is required.
cardinality:
- collection: Frozen checks, per-invocation observations and selected evidence
  expected: 'Invoice Lab fixture: 4 checks, 2 identities plus anonymous, tens of observations; scale fixture:
    128 frozen checks and 64 assigned items.'
  maximum: Reuse 128 checks / 1 MiB frozen seed metadata, 64 assigned items, 256 selected evidence records
    and 8 MiB encoded evidence plus conclusions per invocation; Audit maxEvidenceBytes remains an additional
    bound.
  bound: Bound admission by rows and bytes, use existing paged reads (at most 200 items and 1 MiB where applicable),
    and never hydrate the whole Audit in one transaction. Register any changed bound in the owning spec and
    shared fixtures before implementing it.
lifecycle:
- entity: Task/attempt-associated exact artifacts and results under existing Run/Audit/Project ownership
  delete: Use ordinary drained deletion and purge authorization. A held evidence artifact must remain readable
    after permitted producer Run deletion.
  cascade: Register any added relation/read/hold in existing ownership and purge mechanisms; no independent
    journal, queue, receipt store or retention service.
  retention: Only acknowledged durable records carry a persistence guarantee. Release existing Audit-owned
    holds through the ordinary Audit/Project lifecycle; volatile or unacknowledged observations may be unavailable.
acceptance_criteria:
- id: A1
  given: Two successful target exchanges and an acknowledged semantic note, but no submitted result
  when: The Runtime is killed and its producer Run is later deleted through the permitted path
  then: The exact committed observations remain readable from the Audit; no target/model replay occurs and
    no semantic verdict is manufactured.
- id: A2
  given: An exchange was sent but Artifact acknowledgement is lost; storage is unavailable or quota is reached
  when: Collection retries or the invocation stops
  then: Only reconciled records are reported durable, uncertainty/loss is visible, no request is resent, and
    current bounded quotas and secrecy hold.
- id: A3
  given: Two assigned items, concurrent tool calls, foreign handles and maximum record/byte counts
  when: Observation grouping and reads execute through real owners
  then: Cross-item association is rejected, exact membership remains correct, reads/writes are bounded, and
    deletion releases owned holds without leaks.
