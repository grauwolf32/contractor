verification_notes: Commands below are required implementation gates, not results of task planning. Use one
  owned disposable PostgreSQL database, explicitly drop it after pools/processes stop, and never implicitly
  enable CONTRACTOR_TEST_HEAVY_IO. Zero matched cases and skipped required database/process cases fail acceptance.
