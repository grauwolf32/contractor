scope:
  in:
  - Make similarly named Eval workspaces distinguishable through existing case, label and activity
    data.
  - Place existing Eval Runs and outcomes ahead of setup details, retaining exact artifacts, drafts
    and workspace context.
  - Show missing evaluation verdicts honestly and never infer passed evaluation from succeeded execution;
    no new experiment resource is introduced.
