schema_version: '1.0'
id: V410-017
title: Reduce repeated sitemap document processing and authority reads
milestone: project-sitemap-2026-10
epic: http-tools
kind: chore
introduced_by: V410-001
priority: P1
status: in_progress
depends_on:
- V410-001
languages:
- go
goal: Reduce repeated sitemap document processing and authority reads.
context:
  authority: User requested a second assessment, task creation and fixes on 2026-10-27. The raw owner-selected blackbox
    input finding is withdrawn; secret filtering is removed by V410-011.
  specification:
  - docs/spec/artifacts/project-sitemap.md
  severity: medium
  finding: 'internal/projectsitemap/service.go:203 and reducer.go:307: a 24.3-MB synthetic valid map requires about
    808 MiB allocated per annotation for Decode/Reduce/encode; allocation.go:53 performs two queries per selected
    input on every page authority check.'
  siblings: Reduce redundant serialization and validation while preserving strict ingress/stored-document checks,
    private-copy failure semantics, canonical bytes and publication limits; use bounded ephemeral lookup indexes
    where useful and batch original-input metadata reads without caching authority.
scope:
  in:
  - Reduce redundant serialization and validation while preserving strict ingress/stored-document checks, private-copy
    failure semantics, canonical bytes and publication limits; use bounded ephemeral lookup indexes where useful
    and batch original-input metadata reads without caching authority.
  - Regression coverage on the existing production path and owning contract updates.
  out:
  - Unrelated pending sitemap imports, reconciliation and workflow delivery; new persistence or retention mechanisms.
failure_outcomes:
- operation: Existing sitemap operation
  permanent: Preserve classified syntax, authority, exact selection and stale-intent errors.
  retryable: Use existing attempt and deadline bounds; no new blanket retries.
  ambiguous: Keep original operation identity and existing receipt or immutable view.
  cancelled: Join work through existing allocation/transaction lifecycle.
  timeout: Keep independent operations within their documented bounded allowance.
cardinality:
- collection: Existing map, view, source and observation collections
  expected: Existing proposal workload and realistic regression fixtures
  maximum: Existing LIM-SMT ceilings; no silently increased limit
  bound: Every page, batch and transaction remains bounded by existing count and byte constraints.
lifecycle:
- entity: Existing sitemap resources
  delete: Existing Project and allocation lifecycle
  cascade: No new lifetime or independent persistence owner
  retention: Existing ArtifactStore exact-reference protection and bounded history
acceptance_criteria:
- id: A1
  text: Equivalent mutations and projections preserve canonical results, original-document immutability and all
    existing error/size contracts.
- id: A2
  text: An instrumented or benchmarked representative map demonstrates reduced allocation/processing work; correctness
    tests contain no elapsed-time thresholds.
- id: A3
  text: Original input authority resolves the bounded selected set without per-input metadata queries and retains
    exact revision and deletion/fencing semantics on real PostgreSQL.
tests:
- command: go test ./internal/projectsitemap
  covers:
  - A1
  - A2
  - A3
- command: make test-project-sitemap-postgres
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
