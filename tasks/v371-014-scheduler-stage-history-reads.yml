schema_version: "1.0"
id: V371-014
title: "Count escalation attempts and check the first tick without reading Stage snapshots"
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P3
status: in_progress
depends_on: []
languages: [go, sql]
goal: "Escalation counting and the no-active-Stage first-tick check read narrow projections of the Run's Stage history (identity, variant, ordinal and lineage columns; an existence probe) instead of every StageExecution row with its snapshots."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G6), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/execution/scheduler.md#SCH-R164"
  revalidated: >-
    2026-10-24 on b523ae77. The cancellation cleanup part is done:
    V407-015 (a525cf29ada6f007f61ae0d29db1aa7d8dd21969) replaced the full
    history read and the two per-execution allocation reads with
    ListStageExecutionsWithUnreleasedAllocations and one
    ListStageAllocationsBatch (releaseEarlierAttempts,
    internal/scheduler/run_execution.go:194-230; SCH-R179), proven by
    TestPostgresCancellationReadsOnlyIncompleteReleases. That read still
    selects full rows, but only of attempts with an incomplete release
    (normally 0 to 2), and the cleanup uses each one's StageContext
    (auditBindingRequirements), so it is dropped from this task. The
    summary escalation branch already uses the HasSummaryEscalation
    existence probe (internal/runstore/stage_store.go:18-30). What remains
    is the automatic escalation count and the first-tick check; file:line
    references below are current.
  severity: low
  finding: >-
    escalationAttempts (internal/scheduler/stage_finalization.go:488-546,
    called at :357 for every failed or interrupted escalate decision) calls
    ListStageExecutions (:494), which selects every column of every
    StageExecution of the Run (listStageExecutionsSQL,
    internal/runstore/stage_store_sql.go:94-100, decoded by
    scanStageExecution in internal/runstore/stage_scan.go): the Stage spec,
    context, candidate and accepted result and termination snapshots, only
    to check the ordinals and resume lineage of one Stage and variant. With
    up to 1,024 attempts per Run (LIM-RUN-2) one escalate decision reads
    and decodes every snapshot, although SCH-R164 says a progression
    attempt does not read the Run's Stage history. The no-active-Stage
    branch of the progression tick (internal/scheduler/run_execution.go:63-73)
    calls the same full read only to check that the history is empty; in
    every valid state it returns no rows, but a Run whose history is not
    empty (the invalid state it detects) has every snapshot read and
    decoded before it fails. Predates the shallow history (boundary
    6349621).
  siblings: >-
    Production ListStageExecutions callers on b523ae77:
    run_execution.go:66 and stage_finalization.go:494 (in scope);
    runservice/detail.go:132, the public Run detail, which returns every
    StageExecution from one snapshot by contract (V368-013), out of scope;
    planner/session/scan_history.go:45 (ReadAuditScanHistory, used once per
    Audit scan dispatch recovery or terminal collection, not per tick),
    which needs the Stage spec snapshot of each executor attempt, out of
    scope here and a candidate for its own narrowed read. The cancellation
    cleanup sibling is done (see revalidated).
scope:
  in:
    - "A runstore read for escalation counting that selects only the identity, Run, Stage name, attempt, state, execution configuration variant, escalation ordinal, previous and resume source execution columns of the Run's StageExecutions (it may filter to the Stage), and escalationAttempts applying the same lineage rules to it."
    - "An existence probe (EXISTS on the Run's stage_executions) in place of ListStageExecutions at run_execution.go:66."
    - "SCH-R164 names these two reads and their bound (no snapshot column; at most LIM-RUN-2 narrow rows for the escalation count)."
    - "PostgreSQL tests: a Run with many StageExecutions carrying large snapshots, where an escalate decision and the first-tick check select no snapshot column (asserted through a statement tracer), and the lineage validation cases still end the Run as invalid state."
  out:
    - "Escalation, cancellation and fencing semantics, and the error classes of the history read."
    - "The cancellation cleanup read (done by V407-015), the public Run detail and the Audit scan history read."
failure_outcomes:
  - operation: "Narrow escalation history read and first-tick existence probe"
    permanent: "A history that breaks the lineage rules (missing, duplicate or non-contiguous ordinal, invalid manual continuation) is errInvalidRunState and ends the Run once, as today (TestPostgresInvalidEscalationHistoryEndsRunOnce); an execution found by the probe while none is active ends the Run with the existing invalid-state message."
    retryable: "A failed read returns the store error; the Run is left as it is and the next claim retries, as today (TestPostgresTransientEscalationHistoryReadIsRetried)."
    ambiguous: "Not applicable: both are reads."
    cancelled: "The claim's context cancels the read; nothing was changed."
    timeout: "The progression tick's existing context owns both reads; no new timeout."
cardinality:
  - collection: "StageExecutions of one Run read for escalation counting"
    expected: "a few"
    maximum: "1,024 attempts per Run (LIM-RUN-2)"
    bound: "one statement per escalate decision, narrow columns only, no snapshot column"
  - collection: "StageExecutions of one Run read by the first-tick check"
    expected: "none"
    maximum: "1,024 (only in the invalid state it detects)"
    bound: "one EXISTS statement returning one boolean"
acceptance_criteria:
  - id: A1
    given: "A Run with 1,024 StageExecutions carrying maximum-size snapshots"
    when: "An automatic escalate decision is made, and the first-tick check runs for a Run without an active Stage"
    then: "Neither read selects stage_spec_snapshot, stage_context_snapshot, candidate_stage_result, accepted_stage_result or stage_termination; each issues one statement."
  - id: A2
    text: "The existing escalation, invalid-history, transient-read, cancellation and fencing tests pass unchanged."
  - id: A3
    text: "The new PostgreSQL test fails on b523ae77, where escalationAttempts and the first-tick check still call ListStageExecutions."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 -tags integration ./internal/scheduler ./internal/runstore"
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
