  - go vet ./internal/scanplan/... ./internal/contracts/... passed.
  - gofmt and git diff --check passed; schema fixtures and semantic codec checks passed.
  - >-
    Preparation and tests perform no external HTTP requests or scanner execution.
    API availability is the internal preparation package; Workflow dispatch remains
