schema_version: '1.0'
id: V252-001
title: Batch Planner Memory reads without row locks
milestone: memory-query-efficiency-2026-10
priority: P2
status: in_progress
implementation_commit: null
depends_on: []
languages: [go]
goal: Read a full Planner Memory notebook in one bounded Store call and avoid row locks on read-only paths.
context:
  issue: https://github.com/grauwolf32/contractor/issues/146
  finding: Full notebook views run one listing transaction plus one locked read transaction per note.
scope:
  in:
    - Add one bounded current-revision batch read through the existing Artifact blob adapter.
    - Use one snapshot for listing, searching, tags, and creating notes.
    - Check active Run and Stage state without row locks on read paths while retaining the write fence.
    - Preserve bounded errors for corrupt notebook snapshots.
  out:
    - Change Memory wire format or write conflict semantics.
acceptance_criteria:
  - {id: A1, text: Full notebook views each make one Store call and creation makes one read plus one write.}
  - {id: A2, text: Planner Memory reads permit a concurrent NOWAIT lock on Run and Stage rows.}
  - {id: A3, text: Terminal reads are forbidden and terminal transitions still serialize with writes.}
  - {id: A4, text: Overflow, namespace mismatch, duplicate names, and bad ordinal sets return memory_unavailable.}
tests:
  - {command: go test -race -count=1 ./internal/memory ./internal/artifacts ./internal/planner/streamline, covers: [A1, A3, A4]}
  - {command: CONTRACTOR_TEST_DATABASE_URL=<postgres> go test -count=1 ./internal/memory -run 'TestPostgresPlannerMemory', covers: [A2, A3]}
  - {command: make lint, covers: [A1, A2, A3, A4]}
