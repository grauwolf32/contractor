schema_version: '1.0'
id: V417-009
title: Verify context compaction across real processes and close the deterministic milestone
milestone: worker-context-compaction-2026-10
epic: quality
kind: chore
priority: P1
status: pending
depends_on:
- V417-003
- V417-004
- V417-005
- V417-006
- V417-007
languages:
- go
- python
- typescript
- markdown
goal: The shipped compact@1 behavior has an integrated deterministic proof across real Server, Runtime
  and PostgreSQL, with documented limits and a release gate that does not depend on live-model quality.
context:
  authority: 'User decisions on 2026-10-31: Contractor is a research platform. Audit provides durable
    coordination over ordinary Runs, fixed assertions use common hypotheses, exploratory findings may
    have no hypothesis, deduplication and exact Audit/Run origin remain, hypothesis associations are automatic
    and owner-independent, formal approvals are removed almost completely, and complexity must decrease
    or stay controlled. The user requested task replanning and diagrams for review before implementation.'
  proposal: docs/proposals/0046-workflow-context-compaction.md
  specification:
  - docs/spec/execution/worker.md
  - docs/spec/configuration/workflows.md
  - docs/spec/audits/worker-completion.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/lifecycle.md
  implementation_boundary: Update numbered owning specifications, limits/errors/failure/lifecycle registries,
    strict schemas, fixtures and every affected reader/writer together with implemented behavior. Generated
    clients are regenerated through their tools. No legacy readers, unsupported accepted configuration,
    speculative exports or new receipt store.
  adk_migration: V418-007 accepts the exact ADK 2.13.0 lock before V417-002 establishes compaction integration.
    Internal SDK turns are not new logical Contractor invocations; use the accepted migration contract,
    not 2.8 callback/identity assumptions.
  implementation_gate: Planning only. The user will review the revised task graph and proposal 0050 before
    authorizing implementation. Keep pending and do not start code, migrations, live Runs or deployment
    from this planning update.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  redesign_boundary: Retarget the Audit branch of the real-process compaction gate to common result/context
    semantics; preserve ordinary Worker, SDK/budget/cancellation and required-case evidence.
scope:
  in:
  - A context-compaction family/process gate, required-case inventory and release-graph integration using
    tests already added by each implementation task plus missing cross-boundary cases.
  - Cross-task regression matrix for ordinary/Audit, shared/isolated, reasoning true/false, policy overrides,
    Scheduler behavior, failures and at-ceiling resource use.
  - Reconcile proposal 0046 status and operator/testing documentation with implemented normative contracts;
    retain separate measured-quality follow-up.
  out:
  - Deferring basic safety or bounds until this exit, adding another compaction engine, silently ignoring
    failed required cases or switching configured live models.
  - Live Gateway calls, measured quality/default-selection claims, dependence on V417-008/V417-010 or
    requiring terminal includeReasoning to implement compact@1.
acceptance_criteria:
- id: A1
  given: Integrated real Server/Runtime/PostgreSQL and a deterministic Gateway
  when: make test-worker-compaction-e2e runs
  then: Every required case executes and verifies continuing identities/budgets/results, ordinary/Audit
    modes, exact configuration and truthful state without a false handoff.
- id: A2
  given: At-ceiling history and injected failure/cancellation matrix
  when: The family gate and full affected suites run
  then: Bounds, scoped retrieval, receipts and fences hold and all selected required cases produce passing
    evidence.
- id: A3
  given: Release graph and completed implementation tasks
  when: make release-verify runs on the integrated revision
  then: The gate is reached exactly as intended, no live model is contacted, and all required stages pass
    with recorded commands/case counts. Evidence identifies the exact accepted SDK, lock digest and integrated
    Runtime revision.
- id: A4
  given: Delivered behavior and independent quality work still pending
  when: Specifications, proposal and documentation are reconciled
  then: No unsupported configuration or unused API remains; deterministic completion is clearly distinct
    from quality/default recommendations and does not wait for V417-008/V417-010.
tests:
- command: make test-worker-compaction-e2e
  covers:
  - A1
  - A2
- command: make test-wire-cross-language
  covers:
  - A1
  - A4
- command: make verify-public-api
  covers:
  - A1
  - A4
- command: make test-postgres
  covers:
  - A1
  - A2
- command: make release-verify
  covers:
  - A1
  - A2
  - A3
  - A4
requirements:
- id: R1
  text: Create make test-worker-compaction-e2e with required database/locked Runtime prerequisites and
    register it in the release graph without duplicate full-suite execution in consolidated mode. Verify
    required test names/cases from actual reports; zero matches, skips of required cases or missing evidence
    fail.
- id: R2
  text: Run real Server and Runtime processes with a deterministic fake Gateway and real PostgreSQL. Verify
    config publication, exact snapshot/read selection, two compactions, useful continuation, one finalizer/trusted
    result and no false summarized handoff. Do not mock the coordinator, session store or private transport
    under test. Use the exact 2.13 closure accepted by V418-007 and capture multiple internal SDK turns
    under one logical owner; record Runtime revision and lock digest.
- id: R3
  text: Cover ordinary isolated/shared, mixed-binding Router policies, Audit incomplete/complete paths,
    reference-only override resolution and lifecycle replacement. Existing terminal summarizer/handoff
    remains a control without making its optional new flag a prerequisite.
- id: R4
  text: Exercise multiple tool calls/errors, reasoning true/false/no provider text, stale/missing usage,
    exact task constraints, untrusted summary refs, repeated Skill disclosure, large history pagination
    and declared ceilings. Measure bounded work through counters/byte admission, not wall-clock assertions.
    Include equal timestamps at both inclusive range boundaries, retained equal-time neighbors, previous/overlapping
    summaries, foreign branch/scope events and complete interleaved call/response groups.
- id: R5
  text: Inject Gateway permanent/retryable failures, invalid output, general budgets, ineffective reduction
    before commit and after the next measured main response, ambiguous marker append, publication acknowledgement
    loss, cancel/deadline/lease loss and cleanup failure. Existing receipts/fences govern uncertainty;
    reusing an Event.id is not proof of append idempotency. No new semantic dispatch follows cancellation,
    local work joins before release, and already-sent uncertain effects or authorized WRK-R168 terminal
    cleanup keep their existing policies. SDK None/skip/exception adds no marker or continuing request
    for the rejected attempt. Post-commit ineffectiveness retains accepted markers and charges, then stops
    before the next dispatch/cycle.
- id: R6
  text: Every owning spec, limits/errors/failure/lifecycle entry, public/private schema, shared fixture
    and generated consumer must agree with implemented behavior. Update the proposal with delivered deterministic
    scope and unresolved measured-quality questions; do not label quality proven by this gate.
- id: R7
  text: Complete the required aggregate release gate once on the integrated revision and retain actual
    commands, case counts and evidence. Task completion means all required checks pass; unrelated failures
    are reported and resolved through their owners, never waived as a successful run.
failure_outcomes:
- operation: Deterministic process gate setup, fault injection and evidence collection
  permanent: Missing required prerequisites/cases, mismatched schema or invalid evidence fail explicitly;
    zero tests is never success.
  retryable: Only bounded fixture startup retries and the production operation policy under test apply;
    no rerun-until-green hiding of failures.
  ambiguous: Assert production receipt/marker reconciliation using stable test identities; retain the
    original failed observation.
  cancelled: Test harness cancels/joins Server/Runtime/fixture processes and cleans only its disposable
    schema/workspace.
  timeout: Harness timeout reports failure separately from injected Worker deadline; no real-time speed
    assertion.
cardinality:
- collection: Gate matrix and maximal context fixtures
  expected: A finite manifest of ordinary/Audit and session/policy cases
  maximum: All registered compaction ceilings, including 4096 groups/32 MiB, and explicit one-over cases
  bound: Bound process concurrency and disposable database resources; use required-case inventories rather
    than combinatorial unbounded sampling.
lifecycle:
- entity: Test processes, disposable database and evidence
  delete: Test harness owns teardown; only its named schema/workspaces may be removed.
  cascade: Join child processes before cleanup, preserve failure diagnostics with no raw secrets.
  retention: Keep safe gate reports and exact revisions through existing test-report convention; no production
    data mutations.
test_prerequisites:
- These are future implementation acceptance commands, not verification performed while creating tasks.
  Implement every explicitly named new gate in its owning task; zero selected or skipped mandatory cases
  fail.
- Use locked Runtime dependencies, testdata catalogs and pseudo-Skills. Unit and integration tests never
  read the live configs tree; make test-config validates the shipped catalog.
- Persistence and immutable snapshot reads use disposable real PostgreSQL. Set CONTRACTOR_TEST_DATABASE_URL
  for required gates; an unreachable configured database or skipped required case is a failure.
- Run full suites for every touched package in addition to focused gates. Use injected clocks and deterministic
  work counters for assertions, not wall-clock thresholds.
- Run integration acceptance on the exact ADK 2.13.0 closure accepted by V418-007; record Runtime revision
  and lock digest. No separate old-SDK compaction implementation or version-switching production path.
deliverables:
- path: make/toolsets.mk
  description: New test-worker-compaction-e2e family target and owned required-case checks, integrated
    with make/release.mk and release-graph validation.
- path: docs/testing/README.md
  description: Actual deterministic gate prerequisites, scope and retained evidence locations; live evaluation
    remains opt-in.
dependency_note: No dependency on V417-001, V417-008 or V417-010. Terminal reasoning has its own independent
  exit, and measured quality has a separate milestone.
