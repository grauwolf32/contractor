schema_version: "1.0"
id: V2-007
title: Prove OpenAPI and LikeC4 workflows end to end
milestone: project-workflows-mvp
priority: P0
status: planned
depends_on: [V2-004, V2-006]
languages: [go, python]

goal: >-
  Exercise both transferred workflows through the production Go Server,
  PostgreSQL, mTLS Control Plane, one real Python Runtime Agent, A2A, domain
  tools, and ArtifactStore with only the external model made deterministic.

context:
  harness: >-
    Extend the existing tests/e2e process harness. Use one serial single-slot
    Runtime Agent, an isolated database schema, generated deployment CA, and a
    deterministic OpenAI-compatible fake Gateway that emits real function calls.
  validators: >-
    Put fixed fake vacuum and likec4 executables first in the child Runtime PATH.
    They validate known fixture documents and emit representative bounded JSON;
    unit tests remain responsible for command edge cases.

scope:
  in:
    - Build a small in-memory ZIP fixture containing a runnable HTTP service, dependencies, configuration, auth, and one external integration.
    - Run openapi-from-source@1 and likec4-from-source@1 through public APIs.
    - Make the fake Gateway use source, text, OpenAPI, and LikeC4 tools rather than returning invented ArtifactRefs.
    - Verify exact intermediate bindings, final bytes/media types, output freezing, lineage, Stage order, metrics, workspace cleanup, and source immutability.
    - Add a stable make test-project-workflows target with the existing PostgreSQL prerequisite.
  out:
    - Semantic model quality scoring, internet access, real provider calls, renderer snapshots, load tests, or multi-agent parallelism.

deliverables:
  - {path: tests/e2e/project_workflows_test.go, description: Two production-boundary workflow scenarios and shared fixture helpers.}
  - {path: tests/e2e/fake_domain_gateway_test.go, description: Deterministic tool-calling Gateway scripts for all transferred Stage roles.}
  - {path: tests/e2e/testdata, description: Small source tree and fixed validator executables or generated equivalents.}
  - {path: Makefile, description: test-project-workflows target.}
  - {path: docs/development.md, description: Deterministic workflow gate and expected outputs.}

requirements:
  - id: R1
    text: The fake Gateway may choose tool calls and content but cannot bypass Runtime tool construction, private Artifact API, A2A, Scheduler result validation, or output mapping.
  - id: R2
    text: Every successful StageContentResult ref must originate from a real exact domain/text tool read or write observed by the Worker.
  - id: R3
    text: Tests assert dependency and project reports are created once per workflow, document build precedes validation, and one Runtime slot is reusable only after release cleanup.
  - id: R4
    text: OpenAPI output parses and contains the fixture route, response, provenance, and clean validation report; LikeC4 output contains fixture actors/systems/relationships/views and passes the fixed validator.
  - id: R5
    text: UserScope ZIP and optional seeds remain byte-identical; Run output refs are frozen exact revisions distinct from inputs.
  - id: R6
    text: Child logs and test failures remain bounded and redact bearer, gateway, and private-key material.

acceptance_criteria:
  - id: A1
    given: PostgreSQL and normal local build prerequisites only.
    when: make test-project-workflows runs.
    then: Both four-Stage Runs succeed and return readable frozen outputs with the required semantic fixture facts.
  - id: A2
    given: Captured fake Gateway requests.
    when: Tool exposure is inspected per AgentTemplate.
    then: Each role sees exactly its allowlist and all eight Stage executions make expected source/domain/text calls.
  - id: A3
    given: Both terminal Runs.
    when: Database artifacts, StageExecutions, reports, metrics, lineage, and Runtime work root are inspected.
    then: State matches exact serial execution, no guessed ref is accepted, and the single slot/workspace is clean.
  - id: A4
    given: The preexisting artifact-copy end-to-end fixture.
    when: Its gate runs after new descriptors/configs are added.
    then: It remains unchanged and passes, proving backward compatibility.

tests:
  - {name: domain-e2e, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... make test-project-workflows", covers: [A1, A2, A3]}
  - {name: original-e2e, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... make test-e2e", covers: [A4]}
  - {name: aggregate, command: "make verify", covers: [A2, A4]}

notes:
  - Keep source fixture intentionally small so failures identify orchestration/tool contracts rather than model context behavior.
