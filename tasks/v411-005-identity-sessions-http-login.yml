applicability:
- Both declared dependencies are completed on current main. Exact immutable target credentials and
  the independent controlled HTTP gate exist; the placed preflight remains anonymous-only and has
  no isolated Basic/bearer/login sessions, authenticated identity control or bounded refresh.
- Reuse the current controlled transport, action ledger and private exact-credential authority.
  Coordinate assignment/action/schema changes before Runtime implementation; do not add a general
  recipe executor, another receipt mechanism or Project session inheritance.
