goal: Give pentest preflight and subsequent checks separate anonymous/A/B identities with private
  credential injection, verifiable authentication and bounded refresh without leaking or inheriting
  Project sessions.
context:
  authority: User request on 2026-10-29 to continue after the completed V411-004 with the next
    ready pentest task, implementing, verifying, closing and merging it under the project rules.
  proposal:
  - docs/proposals/0033-autonomous-pentest-audits.md#6-identities-login-and-test-data
  - docs/proposals/0033-autonomous-pentest-audits.md#61-login-recipe
  - docs/proposals/0033-autonomous-pentest-audits.md#101-redaction-and-public-projections
  - docs/proposals/0033-autonomous-pentest-audits.md#11-action-journal-cancellation-and-recovery
  specification:
  - docs/spec/tools/http-caido.md#HTP-R1
  - docs/spec/tools/http-caido.md#HTP-R125
  - docs/spec/configuration/runtime-config.md#RCF-R110
  - docs/spec/audits/audits.md#AUD-R16
  - docs/spec/execution/control-plane.md#CTL-R6
  code:
  - runtime/src/contractor_runtime/toolsets/http/cookies.py
  - runtime/src/contractor_runtime/toolsets/common/credentials.py
  - runtime/src/contractor_runtime/contracts
