schema_version: "1.0"
id: V60-035
title: Compare durable Findings review state independently of read snapshot time
milestone: project-review-v60
priority: P2
status: completed
depends_on: [V60-008]
languages: [go, markdown]
goal: Preserve the process test's proof that collection analysis does not mutate Audit review state while accepting the documented per-read snapshot timestamp.
context:
  authority: User requested completion of the remaining V60 reviews; the mandatory Findings process gate reproduced this failure.
  design: docs/plans/2026-09-20-project-review.md
  specification: docs/spec/19-audits.md
  reproduction: >-
    TestFindingsProducerAndReaderAcrossProcesses compares complete Findings page
    responses with DeepEqual. The documented asOf field is generated by
    statement_timestamp() on each read, so different read times fail the old
    assertion even when the Audit revision and all review data are unchanged.
scope:
  in:
    - Record the exact before/after difference from the real process test.
    - Validate both snapshot timestamps and compare all remaining response fields unchanged.
    - Rerun the complete required Findings gate without skips.
  out:
    - Change product behavior, ignore Audit revision or review mutations, or relax producer/reader/retention assertions.
acceptance_criteria:
  - id: A1
    text: The original failure is explained by valid per-read snapshot timestamps while every durable response field remains equal.
  - id: A2
    text: The process test validates the snapshot timestamp format and retains exact equality of all other response fields.
  - id: A3
    text: The full Findings gate passes its required producer, reader, boundary and retention scenarios without skips.
tests:
  - command: make test-findings-e2e
    covers: [A1, A2, A3]
verification_requirements:
  - Record failure and passing logs, exact commands, source commits and case counts.
  - Use only isolated processes, database state and the scripted local Gateway.
  - Keep task-start, implementation and completion metadata commits separate.

review_evidence:
  report: docs/research/2026-09-20-v60-008-audit-product-review.md
  evidence: tasks/evidence/v60-035.json
  result: Exact process reproduction confirms only asOf differs; the full Findings gate passed 13 process cases and 48 Runtime cases without skips.

