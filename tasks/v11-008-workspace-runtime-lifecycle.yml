schema_version: "1.0"
id: V11-008
title: Integrate projectfs with Runtime lifecycle and capability probes
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-005, V11-006, V11-007]
languages: [python]

goal: >-
  Build one immutable Runtime-local WorkspaceProvider at startup and one
  isolated WorkspaceSession per allocation, advertising only projectfs tools
  proven usable by that Runtime process.

context:
  existing_lifecycle: >-
    contractor_runtime.workspace and local-workdir@1 already own allocation
    scratch. Preserve them. New contractor_runtime.projectfs is an optional
    independent service. It is constructed from --workspace-config before the
    private listener/registration, then injected into selected Toolset
    factories. No workspace path, mode, mount name, digest or state is added to
    registration, RuntimeSettings, AllocationSpec, Agent Card or Server API.
  capability_contract: >-
    Existing supportedToolsets carries exact positive tool subsets. Runtime
    advertises filesystem@1 when all configured read probes needed for a usable
    provider succeed; edit-files@1 when at least one effective writer exists;
    workspace-changes@1 changed/diff/rollback when an overlay exists and
    materialize_changes in the MVP only when overlay-memory is usable. Selected
    tools are revalidated before session construction.

scope:
  in:
    - Add WorkspaceProvider startup construction to settings/CLI/factory assembly without changing the existing scratch Workspace API.
    - Run bounded all-or-nothing config/root/read/import/overlay probes inside the existing 30-second complete discovery deadline before first Control Plane registration; Toolset probes reuse the prepared provider and publish safe failure classes locally.
    - For hostWrite, validate descriptor-relative/no-follow platform support and requested root authority without creating a probe file in the operator project; all generic probe mutations stay under Runtime work_root.
    - Build deterministic positive filesystem Toolset subsets from successfully constructed factories and preserve existing capability ordering/freeze rules.
    - Create a fresh WorkspaceSession before constructing selected tools/Worker; clone memory baselines, create overlay uppers and inject narrowed handles.
    - Fail allocation preparation atomically, close partial projectfs state and report the existing bounded Runtime preparation error when a selected tool cannot be built.
    - On finalize/abort/lease loss, stop tool execution before close; release resets/discards every allocation-owned memory/overlay state while preserving configured host roots and direct authorized writes.
    - Keep a Runtime with no workspace config byte-for-byte compatible in remote registration behavior and omit all three filesystem Toolsets.
    - Add safe lifecycle metrics and tests proving no path/config/backend/state crosses private HTTP payloads or logs captured by Server-facing test fixtures.
  out:
    - Server changes, allocation affinity, hot reload, mount payloads, automatic materialization, multiple slots, generic command execution or journal recovery.

deliverables:
  - {path: runtime/src/contractor_runtime/projectfs/provider.py, description: Frozen startup provider probes and per-allocation session factory.}
  - {path: runtime/src/contractor_runtime/factories.py, description: Optional projectfs Toolset factory registration and narrowed-handle injection.}
  - {path: runtime/src/contractor_runtime/allocation.py, description: WorkspaceSession prepare stop close ordering.}
  - {path: runtime/src/contractor_runtime/cli.py, description: Startup provider assembly before listener/registration.}
  - {path: runtime/tests/test_projectfs_lifecycle.py, description: Probe capability allocation isolation cleanup and payload-redaction tests.}

requirements:
  - id: R1
    text: Provider configuration and baselines are immutable for instance_id; allocation-owned sessions are never reused sequentially or concurrently.
  - id: R2
    text: A failed provider startup never registers; a failed allocation session never creates a ready Worker and releases all partial state.
  - id: R3
    text: Tool calls are quiesced before session cleanup so no coroutine can observe a half-cleared memory/overlay store.
  - id: R4
    text: Projectfs integration neither reads nor modifies Runtime labels and does not reinterpret local-workdir@1 as a project mount.

acceptance_criteria:
  - id: A1
    given: No workspace config and the existing Runtime unit/integration suite.
    when: Runtime probes, registers, reserves, executes and releases.
    then: Existing capability and payload snapshots remain compatible and no projectfs code requires a host root.
  - id: A2
    given: A valid mixed-mode config and an AgentTemplate selecting different filesystem tool subsets.
    when: Runtime starts and allocations execute sequentially.
    then: Registration contains only exact tool names, each Worker sees only selected tools, and later sessions cannot observe earlier private changes.
  - id: A3
    given: Startup probe, session preparation, active tool, finalization and lease-loss failures injected at each lifecycle boundary.
    when: Runtime handles them.
    then: It fails safely or self-terminates according to existing lifecycle rules, reports metrics, leaks no projectfs state/path and never automatically materializes.

tests:
  - {name: projectfs-lifecycle, command: "cd runtime && uv run pytest tests/test_projectfs_lifecycle.py tests/test_capabilities.py tests/test_allocation.py tests/test_abort.py tests/test_lease_watchdog.py", covers: [A1, A2, A3]}
  - {name: runtime-suite, command: "cd runtime && uv run pytest", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
