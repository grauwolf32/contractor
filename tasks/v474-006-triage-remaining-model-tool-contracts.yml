schema_version: '1.0'
id: V474-006
title: Review remaining tool simplifications against actual callers
milestone: runtime-maintenance-2026-10
epic: planner-worker
kind: chore
priority: P2
status: in_progress
depends_on: []
languages:
- python
- go
- yaml
goal: Decide which remaining simplifications justify a contract change and identify the caller, invariant
  and acceptance check for each.
context:
  authority: Agent proposal from the model tool interface review of main 86db128db on 2026-11-21. User
    requested that these review findings be reconciled and tracked. Individual mergers, deletions, description
    rules and live evaluations are proposals. User clarification 2026-11-21 confirms that request_id
    is Contractor's allocation-local request identifier. Runtime owns any provider-ID translation.
    The user also questioned making the model inspect an exchange before attaching it. The review
    recommendation is to let finding and record_fact attach the selected exchange by local ID alone.
  specification:
  - docs/spec/tools/toolsets.md#TLS-R29
  - docs/spec/tools/toolsets.md#TLS-R34
  - docs/spec/tools/http-caido.md#HTP-R72
  - docs/spec/tools/http-caido.md#HTP-R73
  - docs/spec/tools/http-caido.md#HTP-R89
  - docs/spec/findings/findings.md#FND-R43
  - docs/spec/findings/findings.md#FND-R49
  - docs/spec/findings/findings.md#FND-R238
  - docs/spec/tools/memory.md#MEM-R3
  baseline: '86db128db: 116 versioned Runtime exports, four conditional Worker/Skill tools and 30 context-specific
    Planner declarations. 21 exports have no selection in configs/agent-templates. V471-007 and V471-003
    already delivered local request IDs and original-memory evidence. V473-003 owns model-recovery diagnostics
    for zero/partial fact extraction.'
  review_outcomes:
  - candidate: Declaration descriptions and defaults
    disposition: Keep current wording rules until a separately reviewed schema-description change.
    evidence: TLS-R30 and TLS-R34 place the complete Args documentation in the function description. Native Skill declarations already describe properties.
    caller: Every selected Worker declaration and native Skill adapter.
    validation: Capture identical configured Worker declarations before and after a future change, retain side effects, defaults, bounds, CAS and continuation guidance, then measure first correct call and repair count.
  - candidate: record_fact evidence selection
    disposition: Implement automatic attachment from local request_id under V474-008.
    evidence: The shared publisher currently requires a current-invocation buffered capture. History can issue a local locator before storing exchange bytes.
    caller: fact_extractor, caido_analyst and the general/HTTP Finding facades.
    validation: Buffered selection needs no provider call. History-only selection uses an authorized stored read. Missing response retains its explicit outcome. Invalid, expired and unauthorized IDs create no Finding. Existing receipts preserve exact evidence on replay.
    specification_changes: HTP-R72, HTP-R73, HTP-R89 and FND-R43/FND-R46. Preserve body-reader and Audit observation restrictions.
  - candidate: Binary HTTP and provider previews
    disposition: Keep temporary body ownership. Propose metadata plus an exact ref when a persisted artifact already exists.
    evidence: http_read_body reads a bounded allocation buffer. Caido raw previews and convert output have different retention and publication behavior.
    caller: http_explorer and caido_analyst. V474-005 owns image transport for existing exact artifacts.
    validation: A future change must cover binary/text branches, incomplete bodies, eviction, metadata-only results and exact persisted refs. Define any new automatic persistence before implementation.
  - candidate: HTTP and provider modes
    disposition: Keep existing operations pending a separate authority review.
    evidence: caido_scope mixes listing and creation, while HTTP body_type changes request validation. Splitting list/create changes selection grants and shipped profiles.
    caller: caido_analyst and http_explorer.
    validation: A split requires fixtures showing that read-only selection grants no creation. Invalid body combinations must fail before transport. Replay and workflow operations require their own caller evidence.
  - candidate: Memory list, search and tags
    disposition: Keep the current six-operation contract.
    evidence: Go Planners and Python Workers share the interface. Filtered search uses OR matching; tag discovery returns a compact vocabulary. Merging list/search can broaden a search-only selection.
    caller: Streamline, Router and the shipped Memory-enabled Worker templates.
    validation: Any later merge must preserve OR matching, all 128 notes, the three-tag bound, tag discovery and search-only grants across both languages.
  - candidate: OpenAPI metadata readers and updates
    disposition: Propose a bounded metadata reader and partial info updates for a separate change. Keep current deep-merge operation names during this implementation.
    evidence: Builder/validator profiles select info, servers and tags together. Upsert creates missing entries and replaces arrays during deep merge, so a patch rename would obscure creation.
    caller: openapi_builder, openapi_validator and their workspace variants.
    validation: Compare existing separate grants and aggregate response bounds. Cover omitted fields, explicit clearing of a description, empty updates, creation, arrays and reference replacement.
  - candidate: Workspace, source and LikeC4 continuation
    disposition: Keep separate readers. Propose the common artifact reader's partial-line continuation for a later bounded change.
    evidence: The sources have distinct authority and lifecycle. V474-002 already provides UTF-8 byte continuation for Artifact text.
    caller: Workspace OpenAPI/LikeC4 builders and validators, source analysts and likec4 readers.
    validation: Reassemble a long multibyte line, preserve source identity and line numbering, and define concurrent edit behavior for mutable documents.
  - candidate: Typed taint annotation arguments
    disposition: Keep current signatures pending an explicit syntax migration.
    evidence: annotate_trace, annotate_validate and annotate_sink persist canonical source comments and currently parse string argument descriptions.
    caller: workspace_taint_analyst and trace Skill consumers.
    validation: A future typed argument list and optional source line must cover all three annotations, supported languages and canonical persisted comments.
  - candidate: Definition search, graph symbols and unselected exports
    disposition: Keep both searches and retain unproven deletion candidates.
    evidence: search_def returns structural definitions; find_symbol returns graph identities. Shipped selection counts alone do not rule out registered, operator or pinned Eval callers.
    caller: Workspace graph analysis profiles select both searches. insert_line, append_file, replace_range and whole-document OpenAPI reads need caller investigation before deletion.
    validation: Any rename migrates selectors, prompts and fixtures together. Delete an export only after checking all registered callers and exact pins.
  measurement_plan:
    structural: Baseline workspace_openapi_validator has 31 selected Toolset functions and 13936 description characters. Character counts do not establish token cost or task quality. Compare actual Gateway declarations and responses after the accepted changes.
    live_proposal: Use a separate reviewed Eval with identical tasks, source/context pins, configured models and effective budgets. For three tasks and three repetitions per variant the experiment is 18 Runs; the token ceiling is 18 times the pinned per-Run token budget. Estimate monetary cost from the selected route before dispatch.
    measures: First correct call, repairs, total input/output tokens, completed task and unchanged answer quality. Report repeated samples and failures.
    authority: Live measurements remain proposals. V40-002 keeps its frozen declaration comparison, and the reserved V417-010 lane remains with its owner.

scope:
  in:
  - Review schema field descriptions against TLS-R30/R34 and native Skills. Keep short preconditions,
    limits, continuation, CAS and uncertain-outcome semantics. Check evidence source limits and the eight-call
    memory extraction budget at record_fact. Describe request_id consistently as the local integer
    returned by a Contractor tool. Preserve the existing eligibility rules for body reads and Audit
    result evidence.
  - For finding and record_fact, distinguish an exchange already captured in the invocation from a
    local ID returned by authorized history with only a summary. Recommend using the buffered exchange
    directly or having Runtime read the selected stored exchange through its existing adapter. In both
    cases the model supplies only request_id for the attachment. Check how the invocation's existing
    access to the underlying detail is enforced when only a locator exists. Name the owning spec,
    prompt and fixture changes needed to remove a separate model inspection call.
  - Inventory other model-facing binary previews (http_read_body and Caido). Decide metadata or an exact
    evidence reference where appropriate. Keep internal encodings, opaque cursors, and provider identities
    separate from model-visible content.
  - Review mode-dependent arguments and write privileges in existing HTTP/Caido interfaces. Compare list/search/tags
    Memory across Python and Go (preserve OR matching, grant and discovery), OpenAPI info/servers/tags
    readers, optional metadata updates and deep-merge naming.
  - Compare workspace/source/LikeC4 line-window continuation, typed taint annotation inputs, definition
    search versus graph symbol IDs, and edit helpers including insert_line, append_file and replace_range.
    Check whole-document OpenAPI reads for real consumers. Keep source-specific Finding guarantees and
    distinct artifact/workspace authority explicit.
  - Use a representative selected Worker profile to estimate declaration size and repair cost. Document
    how to compare a future accepted change with identical tasks, configured models and budgets, repeated
    trials, first valid call, repair count, total tokens and task success. V40-002 pins tool declarations
    in its instruction experiment. V417-010 has its own paused lane.
  out:
  - Changing production tools, deleting exports solely on shipped selection counts, running existing reserved
    Evals, or reimplementing V471 deliveries.
acceptance_criteria:
- id: A1
  text: Every candidate above has an evidence-backed disposition, selected templates or other known callers,
    exact authority implications and a validation scenario. Unproven deletion candidates remain open.
- id: A2
  text: Spec conflicts and dependent configs/fixtures are named. Each accepted implementation has a bounded
    follow-up or an existing owner. Any proposed live measurement is separately costed and clearly distinguished
    from structural verification.
- id: A3
  text: All reviewed request_id examples pass a local ID from a Contractor tool result directly to the
    consuming tool. For finding and record_fact, specify scenarios for a buffered capture and a
    history-only ID resolved by an authorized read of the stored exchange. Each attaches the actual
    request and available response without a model detail call or a resend to the target. Distinguish
    an absent response (record the observed outcome) from an unknown, expired or unauthorized ID
    (return an explicit error before submission). Preserve exact evidence on receipt replay.
tests:
- command: cd runtime && uv run python ../scripts/check_tasks.py
  covers:
  - A1
  - A2
  - A3
