goal: Persist pending and waiting Runs and coordinate gateway recovery
context:
  authority: User explicitly requested tasks and implementation after the crAPI outage on 2026-09-20.
    Preserve other working-tree changes.
  design:
  - docs/plans/2026-09-20-run-gateway-recovery.md
scope:
  in:
  - Run initialization ends in pending; real execution admission sets running and startedAt. Queue time
    does not consume Stage execution time.
  - Persist a shared route-scoped recovery gate; stop admitting queued work to a failed model without
    affecting unrelated routes.
  - Retry only the failed model request in the existing invocation; retain tools, artifacts and finding
    identities. Expose waiting reason and recovery schedule; support cancellation and manual retry after
    the automatic recovery allowance.
  - Use explicit validated recovery configuration and single-probe recovery; preserve the configured overall
    Stage deadline and distinguish it from request timeouts.
  out:
  - Replay an entire Stage automatically after ambiguous tool effects.
  - Persist/restore ADK sessions after Runtime process loss.
  - Change crAPI truth or turn infrastructure failures into benchmark quality failures.
