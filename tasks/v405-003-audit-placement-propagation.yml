schema_version: '1.0'
id: V405-003
title: Pin Audit placement selection and propagate it to every child Run
milestone: runtime-placement-labels-2026-10
epic: audits
kind: feature
priority: P2
status: pending
depends_on:
- V405-002
languages:
- go
- sql
goal: An Audit started with a location requirement keeps that requirement for preparation, checks and
  later rounds without pinning physical Runtime IDs.
context:
  proposal: docs/proposals/0043-runtime-placement-labels.md
scope:
  in:
  - Add requiredPlacementLabels to Audit draft/start/read snapshots and public API with strict normalization
    and validation.
  - Pin the selection and its request digest atomically with Audit start using existing receipts.
  - Propagate through every child Run creation path, including initial and later inventories, preparation,
    scan/check roles, resumed dispatch and recovery.
  - Update Audit specification, generated clients and real-store regression tests.
  out:
  - Changing the requirement of an already started Audit.
  - Dynamic UI picker (V405-004).
requirements:
- id: R1
  text: Every child Run receives exactly the Audit-pinned requirement; no later binding or fleet change
    rewrites it. Standalone Runs keep their own selection.
failure_outcomes:
- operation: Placement declaration, selection or observation at the task boundary
  permanent: Malformed, oversized or inconsistent input is rejected before mutation using the existing
    invalid_request/400 or registration-conflict/409 classification; no retry.
  retryable: Reuse subsystem storage_transaction_conflict/503 and existing bounded registration, controller
    or capacity backoff; read failures never fabricate empty success.
  ambiguous: Reconcile registration by immutable instance fingerprint and keyed writes through existing
    request receipts; do not introduce another journal.
  cancelled: Existing request/controller owner joins in-flight work; no new background worker survives
    cancellation.
  timeout: Existing registration/request/controller budgets own calls; capacity waiting does not consume
    the execution budget before admission.
cardinality:
- collection: Placement declarations and launch requirements
  expected: 1 location path per instance or launch
  maximum: 32 labels of at most 63 ASCII bytes each
  bound: Canonical sorted unique arrays, one compatible ancestor chain; no fleet IDs copied into launch
    snapshots.
- collection: Runtime fleet and UI inventory
  expected: A few local and cloud instances
  maximum: Existing bounded registry capacity times the per-instance label bound
  bound: Reuse registry limits and public pagination; no unbounded history scan or external lookup per
    label.
lifecycle:
- entity: Placement labels on existing Runtime incarnations, Runs, Audits or allocations
  delete: Follow the owning existing entity deletion API and authorization.
  cascade: No new side-table lifecycle; parent deletion removes its embedded placement data.
  retention: Runtime declarations live with their incarnation; immutable requirements and allocation provenance
    live with their owning retained Run/Audit.
acceptance_criteria:
- id: A1
  given: An Audit draft with cloud and a real PostgreSQL store
  when: It starts, replays start, dispatches preparation and checks, advances rounds, resumes or recovers
  then: All created Runs retain the same normalized requirement; changed-payload replay conflicts and
    invalid stored requirements fail strictly.
- id: A2
  given: A populated Audit waiting for matching Runtime capacity
  when: Pause, cancel and purge run
  then: Existing controller and Run lifecycle semantics hold, no Run escapes the placement requirement,
    and the selection adds no retained side table.
tests:
- command: go test ./internal/auditservice ./internal/auditcontroller ./internal/auditstore/... ./internal/runservice
    ./internal/httpapi/public
  covers:
  - A1
  - A2
- command: make test-postgres
  covers:
  - A1
  - A2
- command: make verify-public-api-postgres
  covers:
  - A1
- command: make lint
  covers:
  - A1
  - A2
