schema_version: '1.0'
id: V71-003
title: Retain loaded Audit Coverage and Run rows after background errors
milestone: audit-ui-refresh-correctness-2026-10
priority: P1
status: in_progress
depends_on: [V71-001]
languages: [typescript]
goal: Keep loaded Audit tables and reader position stable through transient read errors.
context:
  issue: https://github.com/grauwolf32/contractor/issues/327
  finding: >-
    Coverage and Audit Runs replace loaded rows with an error panel after a
    failed background refetch, discarding scroll and nested detail state.
scope:
  in:
    - Render a stale-data warning above loaded rows with a retry action.
    - Keep the full error panel for an initial read with no retained rows.
    - Retry one unpinned Coverage batch when its before/after revisions straddle.
    - Preserve strict pinned and continuation revision boundaries.
  out:
    - Change server Audit collection APIs.
acceptance_criteria:
  - id: A1
    text: Failed background reads leave loaded Coverage and Run rows mounted.
  - id: A2
    text: One unpinned revision straddle retries without exposing a 409.
  - id: A3
    text: Initial errors and pinned revision conflicts remain visible and retryable.
tests:
  - command: cd ui && vitest run src/routes/projects/audits/coverage-data.test.tsx src/routes/projects/audits/audits.test.tsx
    covers: [A1, A2, A3]
