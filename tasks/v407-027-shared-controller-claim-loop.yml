schema_version: '1.0'
id: V407-027
title: Share controller claim-lifecycle plumbing without merging distinct scheduling policies
milestone: server-runtime-review-2026-10
epic: persistence
kind: chore
introduced_by: V38-004
priority: P3
status: pending
depends_on:
- V407-003
languages:
- go
goal: Audit and Eval reuse common claim execution/release plumbing and injectable timing while retaining
  their separate wake, fairness and operation-budget policies.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  finding: internal/auditcontroller/controller.go:41-77 and internal/evalcoordinator/coordinator.go:112-153
    repeat bounded per-claim goroutine/release logic and suppress claim-lost on release. Their wake mechanisms,
    options and tick policies differ. Direct time.Now/time.NewTimer also make some adapter/planner/controller
    tests harder to control, but no incorrect outcome caused by those calls or duplicated loops was reproduced.
  validation: This is maintenance and testability work. The common durable claim mechanism already exists;
    another lease protocol is not needed. The no-wall-clock-assertions rule constrains tests, not every
    production clock read. Extraction must preserve intentional differences rather than equating similar
    loops.
  specification:
  - docs/spec/platform/persistence.md
  - docs/spec/execution/scheduler.md
plan:
- Identify the identical claim handler/release lifecycle and extract the smallest shared helper below
  both consumers, with each controller retaining its admission, immediate retry, wake and batch policy.
  Avoid introducing an unused general-purpose controller framework.
- Pass explicit timing/release-budget dependencies through the shared code and through the adapters whose
  deterministic tests need them; keep production defaults and journaled cancellation RequestedAt semantics.
- Add contract tests for both real consumers covering handler failure, claim loss, cancellation/join,
  release failure and bounded concurrency. Use an injected clock or controlled channels, and retain existing
  controller suites.
scope:
  in:
  - Shared lifecycle plumbing, targeted clock injection and regression coverage for unchanged controller
    behavior.
  out:
  - A new receipt/lease mechanism, a forced common scheduler policy, changing V407-003 batching semantics,
    or banning all time.Now calls merely by grep.
acceptance_criteria:
- id: A1
  text: Both production consumers use the shared identical lifecycle code; release remains bounded and
    claim-lost handling/error aggregation match their prior behavior.
- id: A2
  text: Injected-time/synchronization tests cover both consumers without sleeps or elapsed-time assertions
    and verify cancellation joins work before release.
- id: A3
  text: Existing fairness, wake, batch and adapter replay tests retain their outcomes, and architecture
    layer tests accept the shared dependency placement.
tests:
- command: go test -count=1 ./internal/auditcontroller/... ./internal/evalcoordinator/... ./internal/evalservice/...
    ./internal/planner/... ./internal/archtest/...
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A3
