schema_version: '1.0'
id: V431-002
title: Replay committed Run resumptions before mutable Project eligibility
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P2
status: in_progress
depends_on: []
languages:
- go
goal: A repeated resume request returns its committed target while the Run and receipt still exist, even
  after Project deletion starts.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: internal/runstore/resume_store.go:62 rejects a deleting Project before reading run_stage_resumptions
    at line 77; response-loss replay returns ErrConflict despite an existing receipt. The original implementation
    is commit 16c41112c; no matching historical task record is identifiable.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/runs.md#RUN-R50
  - docs/spec/execution/runs.md#RUN-R52
scope:
  in:
  - Keep Project-before-Run locking; check the existing receipt before rejecting eligibility for a new
    attempt.
  - Exercise response-loss replay after BeginDeletion, and reject a fresh resume while deleting without
    new rows.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: Given a committed resume and a subsequently deleting Project, replay returns exactly the original
    target.
- id: A2
  text: A source without a receipt cannot create a new attempt in a deleting Project; ownership, locks
    and atomicity remain enforced.
- id: A3
  text: The replay regression fails on the unfixed implementation.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/httpapi/public/...
  covers: &id001
  - A1
  - A2
  - A3
- command: make lint
  covers: *id001
