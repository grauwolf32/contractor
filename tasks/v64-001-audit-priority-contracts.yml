schema_version: '1.0'
id: V64-001
title: Define the lean Audit task and result contract
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P1
status: in_progress
depends_on:
- V64-000
- V62-001
- V25-011
languages:
- go
- python
- json
- yaml
- markdown
goal: Specify one strict program/task/result contract for exploratory and hypothesis-driven Audits, with
  real configuration validation and a reviewable removal/data migration map.
demonstration: A test-only fixed checklist and an exploratory program validate through the real configuration
  loader; malformed or forged context is rejected with the shared Go/Python/public fixtures.
context:
  authority: 'User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. Subsequent user decisions on 2026-10-31:
    V64-001 is delegated to a separate implementation agent. Formal approvals are removed; a transition
    from old approvals, compatibility mode and special old-policy Resume protocol are not requested.'
  implementation_gate: The user delegated implementation of V64-001 to a separate agent on 2026-10-31.
    This amendment clarifies that agent's task without assigning implementation to the amending agent
    or authorizing dependent tasks. Ordinary dependency/status rules still apply; the delegate sets
    in_progress when starting. Approval removal is settled and must not be reopened as a cutover choice.
  contract_decisions: User confirmed soft pause/drain, Resume of accepted work and terminal Cancel on 2026-10-31; also confirmed 10000 hypotheses, 50000 revisions, 32 KiB per document, 256 MiB revision bytes, 128 records and 1 MiB metadata per mutation.
  execution_authority: User requested implementation in this chat on 2026-10-31. Work is isolated on codex/audit-task-contracts; dependent tasks are not started.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/common-contract.md
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/findings/findings.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  - docs/spec/configuration/workflows.md
  - docs/spec/configuration/catalog.md
  - docs/spec/api/public-api.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/platform/lifecycle.md
  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  review_choices: The common task/Run/result skeleton, result/finding distinction and removal of formal approvals are settled. User confirmation in this chat on 2026-10-31 finalized soft pause/drain, terminal Cancel and the exact hypothesis/mutation budgets recorded in contract_decisions. Do not reopen them or introduce old-policy migration, waiting or compatibility states. Hypothesis formulation guidance remains an agent recommendation and adds no required polarity/type classifier.
  boundary_decision: Common documents are validated through the existing config validate command with an explicit audit-document input and optional trusted audit-context, using the real loaded Workflow Snapshot. This supplies a production contract-validation caller without registering a second program catalog, execution mode, controller, queue or database relation. Actual Runtime assembly, state mutation, retention and public resource replacement remain with dependent owners in the checked removal map. Shared JSON Schema reuses existing wire primitives; Go owns admission validation, and Python conformance checks the same contract without advertising completion support.
  agent_proposal: 'For review: formulate a hypothesis as one observable assertion with object/actor and
    conditions, plus grounds and a way to check it. For problem search prefer a suspected violation; positive
    properties remain valid. Use existing statement/scope/grounds rather than new mandatory types or polarity
    logic.'
scope:
  in:
  - Define initial tasks, bounded continuation through allowed Workflows, exact input/output bindings,
    Artifact publication and minimal control commands; keep ordinary Workflow/Run execution ownership.
  - Define ordinary task/check results, optional normalized findings and hypotheses, stable IDs/revisions
    independent of owner, and system-derived Audit/task/Run/per-item provenance. A check result carries
    supported, refuted or inconclusive within explicit tested conditions; technical Run status is separate.
  - 'Describe Project problem findings/source contributions and qualified deduplication. Verdict polarity
    alone never establishes a problem: supporting a bug claim or refuting a positive property may justify
    a finding under domain evidence rules. Ordinary result outputs retain other conclusions without a
    new ledger/service.'
  - Specify pause/drain/resume versus terminal cancel, report snapshots and ordinary scope/operation/access
    restrictions. Define removal of formal approval contracts and their callers; any necessary business-data
    migration preserves exact evidence and reports without inventing hypotheses, verdicts or consent.
  - Build shared strict fixtures/codecs only with real config/contract validation callers. Map all current
    shipped profiles/API/wire/state/table paths to preservation, replacement or deletion.
  - Specify one accepted task path for investigation, checking, supporting work and generation; these
    purposes do not introduce separate execution entity types or stages. Permit initial checklist/manual
    checks and generation from selected materials without a prior finding.
  out:
  - A general graph/search engine, Project-wide hypothesis registry, ranker, new execution capacity or
    all-at-once materialization.
  - An approval migration protocol, compatibility reader or legacy approval mode; special waiting-for-policy
    states, transfer/replay of prior approvals, or Resume semantics for old approval-required policy.
  - Implementation of dependent Audit tasks under V64-001; changing user model configuration or deploying/migrating
    the demo.
requirements:
- id: R1
  text: Users/models never construct hypothesis ID/revision pairs; Server pins a selected exact hypothesis
    for a task and Runtime assembles its result association from trusted context.
- id: R2
  text: Exploration and supporting work require no dummy hypothesis. One task conclusion cannot be copied
    to every hypothesis in its Run.
- id: R3
  text: Preserve current task/iteration/batch ceilings and evidence/report bounds until an explicitly
    reviewed change; proposed new hypothesis bounds are finite and recorded once in LIM/shared fixtures.
- id: R4
  text: Remove formal approval requests, waiting/expiry/renewal states, approval-required policy and report
    acceptance from the target contract. Keep ordinary scope, allowed/prohibited operations and access
    checks. No approval compatibility mode, migration lifecycle or special old-policy Resume is required;
    retained historical data never becomes an active permission or fabricated human consent.
- id: R5
  text: No internal Audit ZIP or source-reference rewriting is a target requirement. Existing external
    exports/archives retain their independent contracts.
failure_outcomes:
- operation: Accept selected work or results through the owning service
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Accept selected work or results through the owning service
  expected: 'Base fixture: 2 ordinary Runs, 2 seeded hypotheses, 1 generated hypothesis and several conclusions.'
  maximum: Keep applicable published LIM-AUD/LIM-FND ceilings unless proposal 0050 explicitly identifies
    a reviewed change; no new full-pool work.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: fixed and exploratory definitions
  when: the real loader and shared validators read them
  then: both validate without model services; invalid/duplicate/unknown members and unsupported bindings
    fail consistently; fixtures distinguish result verdict, Run status and optional problem finding for
    both bug claims and positive-property claims, including inconclusive negative probes
- id: A2
  given: one or several task-bound hypotheses and a later source revision
  when: fixtures validate result identity
  then: only trusted exact per-item associations are accepted; latest substitution and forged provenance
    fail
- id: A3
  given: existing stored evidence, report snapshots and the inventory of obsolete approval contracts/callers
  when: the removal/data migration map is reviewed
  then: every fact has a preservation/transfer/deletion owner; no fabricated hypothesis, verdict, scope
    or permission is specified, and obsolete approval machinery is assigned to removal rather than compatibility
- id: A4
  given: target program/task/result definitions and obsolete approval-required or approval-request forms
  when: the actual target loader/codecs and shared Go/Python/public contract fixtures validate them
  then: supported definitions use ordinary scope/operation/access checks; obsolete approval forms are
    rejected by the target contract, with no old-policy waiting/resume or compatibility branch. The removal
    map assigns runtime/API/UI/storage caller deletion to the dependent implementation tasks; V64-001
    does not expand into the whole Audit replacement
- id: A5
  given: target limits, control transitions and bounded continuation contracts
  when: shared boundary fixtures and configuration validators evaluate them
  then: at-limit values pass, over-limit values fail, pause/resume/cancel/deadline guarantees are explicit, and continuation requires new accepted inputs or an explicit decision
