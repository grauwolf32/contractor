schema_version: "1.0"
id: V64-001
title: Specify opt-in Audit checklist prioritization and exact top-N contracts
milestone: audit-check-prioritization
priority: P1
status: pending
implementation_commit: null
depends_on: [V64-000, V62-001, V25-011]
languages: [go, json, yaml, openapi, markdown]
goal: >-
  Freeze independently scored checklist candidates, complete ranking cycles and
  exact top-N admission as an opt-in Audit contract before execution is enabled.
context:
  authority: User requested independent contextual checklist verdicts, at least ten highest-priority checks per pass, task specifications and detailed review on 2026-09-20.
  design: docs/plans/2026-09-20-audit-check-prioritization.md
  specification: [docs/spec/34-audit-check-prioritization.md, docs/spec/19-audits.md]
  foundations: >-
    V64-000 supplies the pure model-verdict and selection core. V62-001 supplies
    shared pre-Round lifecycle contracts; its current ordering through V62-009
    is a transitive delivery dependency, not a requirement to use OpenAPI input.
scope:
  in:
    - Define strict versioned profile opt-in, prioritization role, inventory/cycle/context/verdict/selection schemas and finite field/collection limits from specification 34.
    - Integrate V64-000 stable candidate identity and strict verdicts into Audit-wide contracts; fix remaining-pool membership as never-admitted candidates and the distinction between inventory capacity and immutable selected Round item budgets.
    - Define optional description/findings snapshots, analyst revision pins, evidence references and a common low/medium/high/critical rubric with confidence separate from priority.
    - Require complete valid verdicts for the entire remaining pool before sorting and selecting exact min(topN, remaining), with topN default 10 and range 10 through 1000.
    - Define profile topN/maxTopN and optional Draft/Start prioritization.topN within the profile ceiling, pinned into baseline/cycle/selection and immutable after start; changed-value idempotency replay conflicts.
    - Reject an inventory larger than 1000 explicitly; do not truncate to satisfy maxModelCalls or silently sample before ranking.
    - Specify exact failed/cancelled/paused/report-closure mappings, atomic budget admission, approval without backfill, no automatic model or whole-ranking-Run retries and all no-Round controls.
    - Pin sequential calls, complete context limits, utf8-bytes-v1 token admission and conservative ranking-plus-one-initial-check-Run-per-selected-item capacity reservations.
    - Specify exact context/candidates RunScope inputs and priorities output using application/vnd.contractor.audit-priorities+json with contractor.audit.priorities.v1 schema, frozen ordinary Run outputs and receipt-bound journal validation.
    - Define the narrow audit-priority@1 zero-Worker execution contract, policy validation, capability gating and canonical compatibility for all existing shapes.
    - Add strict public/config/domain types and executable valid/invalid/legacy fixtures while leaving new execution unavailable until dependent capabilities exist.
  out:
    - Execute models or Workers, enable a runnable profile, revise finding severity, generate new checklist entries or add deterministic fallback ranking.
deliverables:
  - path: docs/spec/34-audit-check-prioritization.md
    description: Implementation-ready contract with exact bounds, transitions, independent verdict schema, eligibility and atomic selection behavior.
  - path: internal/config
    description: Strict opt-in profile and planner/policy validation with capability gating and legacy canonical fixtures.
  - path: internal/contracts
    description: Versioned request/result shapes and strict validation for complete independent ranking.
  - path: api/testdata/audit-priority
    description: New positive, boundary, invalid and unchanged legacy snapshot fixtures selected by executable tests.
  - path: api/openapi/contractor-public-v1.yaml
    description: Proposed public priority/cycle/inventory shapes and synchronized generated types and parsers without premature executable capability claims.
acceptance_criteria:
  - id: A1
    text: Contract fixtures cover empty, one, nine, ten, eleven, 1000 and 1001 candidates, topN bounds, absent optional context and exact source/revision references; 100 inventory candidates with maxItemsPerRound ten remain valid.
  - id: A2
    text: Unknown IDs, duplicate verdicts, malformed/over-limit fields, invented evidence, unsupported roles, conflicting opt-ins and model-selected workflows are rejected by strict executable tests.
  - id: A3
    text: Every lifecycle outcome before a Round exists and after selection has one defined projection; priority, confidence, disposition, execution state and finding severity cannot be conflated.
  - id: A4
    text: Existing profiles and policies retain identical canonical bytes/digests and validation, while unsupported opt-ins remain non-runnable rather than partially executing.
tests:
  - command: go test ./internal/config ./internal/contracts ./internal/auditdomain ./internal/auditservice
    covers: [A1, A2, A3, A4]
  - command: make verify-public-api ui-generate-check ui-typecheck test-config
    covers: [A2, A3, A4]
  - command: git diff --check
    covers: [A1, A3]
verification_requirements:
  - Review the transition, limit and compatibility matrices against specification 34; prose-only cases do not satisfy executable fixture criteria.
  - Treat V62-001 as a real pending dependency and avoid claiming the contract alone enables prioritization.
