schema_version: '1.0'
id: V411-007
title: Retain actual engagement HTTP exchanges through ordinary Audit evidence
milestone: autonomous-http-pentest-2026-10
epic: findings
kind: defect
priority: P1
status: pending
depends_on:
- V422-002
- V421-001
languages:
- go
- python
- json
- sql
goal: An engagement HTTP check can select its actual invocation-owned exchange as ordinary Audit evidence,
  with truthful attempt provenance and no separate trusted-proof channel.
introduced_by: V411-027
context:
  authority: 'User direction on 2026-10-30: replan stalled pentest tasks against the selected V422 contracts
    and archive obsolete work. This edit changes the plan only; it does not start implementation.'
  specification:
  - docs/spec/tools/http-caido.md
  - docs/spec/audits/worker-completion.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/audits/execution.md
  replanned: '2026-10-30: replaces the earlier scope and acceptance in this task. Proposal 0033 is historical
    design wherever it conflicts with current normative contracts and this reviewed delivery scope.'
  boundary: Runtime owns actual HTTP attempt interpretation/capture. Existing Audit result selection,
    importer and ArtifactStore own accepted evidence and retention; Server has no request journal.
  finding: runtime/src/contractor_runtime/toolsets/http/controlled.py:167 builds one capture after sending
    from tool arguments, while the transport may redirect/retry and the common Audit evidence contract
    requires actual attempt provenance. Revalidate and fix this path with the common capture mechanism.
  siblings: Controlled and standalone HTTP capture, selected finding and audit-results evidence, redirects/retries,
    failed/truncated responses, common timestamp/deployment attribution, retained result importer and
    source Run deletion.
  provenance: git blame attributes reconstructed capture creation to V411-027, commit 27af751d90648be6630e181d6e4d158c91a9c471;
    reuse the ordinary evidence contract implemented by V421-001.
scope:
  in:
  - Inspect ControlledHTTPSession and HTTPTransport capture ownership, including redirects, failures and
    truncation; reuse the common capture builder and recent buffer.
  - Capture request-attempt facts at the Runtime transport boundary instead of reconstructing them from
    model arguments after the response. Preserve exact observed attempts, first-attempt time and available
    pinned deployment attribution.
  - Connect the existing http_request_id selection to audit-results@2, the ordinary encoder/importer and
    retained evidence readers; add real producer/store/process regressions.
  out:
  - New pentest exchange/observation schemas, capture-registration APIs, durable action receipts, proof
    promotion, recipe execution or full traffic archival.
  - Changing standalone HTTP semantics or treating an interactive response as independently reproduced
    vulnerability proof.
requirements:
- id: R1
  text: Reuse AWC-R126 and REV-R8; model-selected IDs cannot author observation facts. A summary alone
    remains an attributed assertion.
- id: R2
  text: Apply existing selected-exchange credential handling to actual sent attempts; never persist injected
    secrets or invent omitted response bytes, request tags or timestamps.
- id: R3
  text: An evicted/foreign/unavailable capture rejects selection before collector mutation; the Worker
    may submit an explicit gap. Evidence publication never sends another target request.
failure_outcomes:
- operation: Retain actual engagement HTTP exchanges through ordinary Audit evidence
  permanent: Reject invalid, unauthorized or unsupported input through the owning existing classified
    error; a missing exact dependency stays unavailable without a latest-ref substitution.
  retryable: Use only existing bounded storage/publication retries under the original operation identity
    and deadline. HTTP retry is exclusively HTP-R139; no possibly sent request or failed engagement item
    is automatically repeated.
  ambiguous: Reconcile ordinary Artifact, Run or Audit receipts where publication may have committed.
    Never send target traffic to reconstruct a missing acknowledgement.
  cancelled: Existing allocation/Run ownership cancels and joins all work before release and secret cleanup;
    no special transport-stop proof or background controller is added.
  timeout: Use the ordinary Audit, Run and operation deadlines. No separate cumulative clock, post-deadline
    target work or new default HTTP quota.
cardinality:
- collection: Recent exchanges and selected evidence
  expected: A few requests and selected members per check
  bound: Existing recent-buffer, attempt, result-member/package and Audit evidence limits; no scan of
    all traffic or Run artifacts.
lifecycle:
- entity: Existing Run/Audit artifacts and allocation-owned state
  delete: Existing drained Run/Audit/Project deletion and Artifact retention rules remain authoritative.
  retention: Only explicitly selected exact evidence/context uses existing holds. A read or metadata reference
    creates no new hold, table or lifetime.
acceptance_criteria:
- id: A1
  text: A real engagement request, including a redirect, is selected by the actual result tool and retains
    matching request/attempt/response facts and observation attribution through PostgreSQL collection.
- id: A2
  text: Foreign/evicted IDs, missing observations and truncated or failed exchanges cannot produce fabricated
    complete evidence or a conclusive result requiring unavailable HTTP observation.
- id: A3
  text: Duplicate result publication, cancellation and permitted source Run deletion preserve ordinary
    receipt, retention and cleanup behavior without new proof authority.
tests:
- command: go test -count=1 ./internal/auditimport/... ./internal/auditservice/... ./internal/artifacts/...
  covers:
  - A1
  - A2
  - A3
- command: make test-runtime test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
- command: make test-engagement-http-process test-audit-completion-e2e
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
test_prerequisites:
- Run complete suites of touched packages. Store behavior uses disposable PostgreSQL; an explicitly configured
  unreachable database fails rather than skips. Mandatory process selections must execute at least one
  test with no unexpected skips.
- Unit/config tests use testdata fixtures; validate the shipped catalog separately. These commands are
  future implementation acceptance, not claimed results of this planning change.
demonstration: A real engagement request, including a redirect, is selected by the actual result tool
  and retains matching request/attempt/response facts and observation attribution through PostgreSQL collection.
