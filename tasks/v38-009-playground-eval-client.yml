schema_version: "1.0"
id: "V38-009"
title: "Connect Playground as an optional managed Evals API client"
milestone: "managed-evals-ui"
priority: "P2"
status: "pending"
implementation_commit: null
implementation_repository: "playground-v2"
depends_on: ["V38-006"]
languages: ["python", "json", "markdown"]
goal: >-
  Allow the independent Playground runner to import datasets, launch native experiments or drive
  external experiments and publish attributed assessments through the public protocol.
context:
  specification: >-
    docs/spec/29-managed-evals.md
  design: >-
    docs/evals-experience-design.md
  format: >-
    docs/spec/26-portable-evaluation-format.md
  user_story: >-
    US-10 in docs/spec/ui-user-stories.md
  boundary: >-
    Contractor builds and runs native Evals without Playground. Server and external control
    modes are immutable and mutually exclusive for dispatch. Both submit ordinary Runs/Audits
    through existing services; no new Worker Scheduler or label-based membership authority. The
    delivered portable CLI format and private recovery journals remain compatible.
  verification: >-
    Create the named focused test files/packages as part of implementation. PostgreSQL commands
    require a disposable database and must not pass by skipping integration cases. Use
    deterministic fixtures; these tasks do not authorize paid models, live targets, tighter
    global token defaults or shared-demo mutations.
  locations: >-
    Implementation belongs in sibling playground-v2/evals/src/playground_evals: add a managed
    client/CLI integration and tests/test_managed_evals.py under playground-v2/evals. Contractor
    task metadata stays here. Resolve ../playground-v2 relative to the canonical Contractor
    checkout, not a nested worktree; this development convention is not a deployment
    requirement.
scope:
  in:
    - >-
      Add explicit client modes for pushing safe immutable datasets and starting native
      experiments, or registering a frozen external plan and driving managed member submissions.
      Keep connection credentials local; choose controlMode once and retain the registered
      ID/hash/receipts in the local journal.
    - >-
      Reuse existing portable case/scorer/provider boundaries, collect exact normal public
      artifacts and send immutable attributed result/assessment revisions. Retain private truth
      and scorer code locally; expose source provenance without private paths or secrets.
    - >-
      Recover lost create/submit/assessment/finalize responses with the same stable keys,
      preserve original deadlines and handle server fences/conflicts. Document both modes and
      legacy direct Run/Audit mode, with conformance fixture coverage.
  out:
    - >-
      Server changes requiring Playground imports, daemon, URL or SQL access; reconstructing old
      private journals from public artifacts; silently adopting legacy labelled Runs; live model
      campaigns or default catalog rollout.
requirements:
  - id: "R1"
    text: >-
      Only the selected driver dispatches. A native experiment continues without this client. In
      external mode the runner remains responsible for progress and private scoring, while the
      server enforces common submission admission and verified receipts.
  - id: "R2"
    text: >-
      External private source plan hashes are provenance assertions where unverifiable; visible
      imports have independently verified hashes. Shared public projection schema names do not
      imply runtime dependencies. Source/type strings never bypass server authorization.
  - id: "R3"
    text: >-
      Preserve exact existing V41 frozen bundles and direct/recorded provider behavior. Managed
      mode is an explicit option, not a migration of the original CLI recovery authority.
acceptance_criteria:
  - id: "A1"
    given: >-
      Public API fixtures for Workflow and Audit in both control modes, with private truth
      sentinels and a multi-child Audit.
    when: >-
      The CLI imports cases, starts a native experiment or registers/drives an external one.
    then: >-
      Requests use only documented owner APIs, leak no truth/credentials and retain exact IDs,
      mappings and attributed assessments. Workflow/Audit kind is preserved; Audit child
      accounting follows spec 29 and cannot change the expected member denominator. Follow
      the managed member execution inventory API across all pages/roles; an item list alone
      cannot establish complete Audit usage.
  - id: "A2"
    given: >-
      Lost responses, an interrupted external journal and a server deletion fence.
    when: >-
      The runner resumes, replays or finalizes.
    then: >-
      No member is resampled or submitted twice; conflicts/stale source pins block safely and
      deletion prevents new work without claiming remote process termination.
  - id: "A3"
    given: >-
      Existing portable/legacy fixtures and the new managed client.
    when: >-
      Both compatibility and managed test suites run without live models.
    then: >-
      V41 behavior remains valid and managed conformance matches Contractor fixtures; the
      independent native server requires no Playground package.
tests:
  - name: "managed-client"
    command: >-
      cd ../playground-v2/evals && uv run --extra dev pytest tests/test_managed_evals.py
    covers: ["A1", "A2", "A3"]
  - name: "compatibility"
    command: >-
      cd ../playground-v2/evals && uv run --extra dev pytest
    covers: ["A3"]
