schema_version: "1.0"
id: V425-034
title: Honor the custom rulepack read bound in the scan Artifact adapter
milestone: web-nuclei-rule-sweeps-2026-10
epic: audits
kind: defect
introduced_by: V406-018
priority: P1
status: in_progress
depends_on: [V406-018]
languages: [go]
goal: A Web scan Audit can execute its exact custom rulepack through the real Artifact service, within the existing YAML and ZIP limits.
context:
  authority: >-
    Required prerequisite discovered while executing the user-authorized removal
    of independent Sweep on 2026-10-31. Preserve the already specified Audit
    custom-rule capability instead of widening V425-033 or weakening its proof.
  specification:
    - docs/spec/tools/scanners.md#SCN-R239
    - docs/spec/audits/scans.md#ASC-R152
  finding: >-
    internal/planner/scan/audit_inputs.go:150 passes the scanner-owned 16 MiB ZIP
    bound to Read for every supplied rulepack. internal/planner/scan/artifacts.go:53
    rejects any limit above planner.MaxScanArtifactBytes (4 MiB), before looking
    at actual metadata. Every custom rulepack, even a small YAML, fails on the
    production adapter as audit_scan_source_unavailable. Fake adapters missed it.
    V406-018 introduced that consumer in c23e2350fa4e086fc614ddbc18c57fd822e1b724.
  boundary: >-
    Recommended and selected: permit the existing caller-specific input read
    bound up to the scanner-owned ZIP ceiling, and continue enforcing the exact
    requested bound against metadata and payload. Keep creation/recovery limits
    for plans/reports and media-specific YAML/ZIP admission unchanged. The simpler
    alternative of capping rulepacks at 4 MiB would reject already specified ZIPs
    and would not repair the invalid 16 MiB read request for small YAMLs.
  siblings: >-
    Inspect all ServiceArtifacts.Read/Create callers: source, settings, task,
    execution manifest, saved plans, retained reports and rulepack verification.
    Runtime and Audit admission already own YAML/ZIP media bounds; do not add a
    second rulepack parser, generic read API, table or validation framework.
  failures: >-
    Invalid/non-exact refs and unsupported read budgets remain permanent
    validation errors. Payloads beyond the requested budget remain permanent
    size errors; metadata/content disagreement remains an integrity error.
    Existing classified storage failures and cancellation keep their causes.
scope:
  in:
    - Correct the internal Artifact read budget without changing create limits.
    - Add PostgreSQL regression coverage through the production Artifact service for a small YAML and ZIP-sized bytes beyond 4 MiB, exact reads and narrower caller rejection.
    - Retain existing fake adapter tests for metadata-before-payload rejection and integrity checks.
  out:
    - Sweep removal, public API changes, new scan execution modes or new limits.
    - A change to generic Artifact payload or scanner report/plan creation bounds.
acceptance_criteria:
  - id: A1
    text: A real-store small YAML can be read using the existing 16 MiB scanner verification budget and its exact revision/content is preserved.
  - id: A2
    text: A real-store rulepack payload larger than 4 MiB and within 16 MiB is readable with its permitted budget, but fails under a smaller caller budget; read budgets beyond the scanner ceiling are rejected.
  - id: A3
    text: Existing creation bounds, metadata/content integrity checks and classified storage failures remain enforced; full scan Planner package tests and lint pass.
tests:
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/planner/scan
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
