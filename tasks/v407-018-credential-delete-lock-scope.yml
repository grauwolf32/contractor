schema_version: "1.0"
id: V407-018
title: "Release the credential lifecycle barrier before the Gateway delete call and bound startup recovery's blast radius"
milestone: server-runtime-review-2026-10
epic: runtime-config
kind: defect
introduced_by: V4-003A
priority: P1
status: pending
depends_on: []
languages: [go]
goal: "Deleting one LLM credential never stalls Worker preparation, placement or Run creation for the Gateway request timeout, and a Gateway outage at startup does not take the whole Server down."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings D1 and D13; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/configuration/runtime-config.md
  severity: medium
  finding: >-
    internal/credentials/lifecycle.go:321-329 Service.Delete takes the
    exclusive side of the lifecycle barrier (barrier.lockMutation) and keeps
    it through executeDelete (lifecycle.go:573+), that is through the LiteLLM
    POST /key/delete (credentials/litellm/manager.go post, connect 3 s plus
    request 15 s by default, up to 2 min configurable) and the final
    transaction. The read side is taken by every Worker credential
    decryption during Stage preparation (RuntimeCredentialService.Use from
    scheduler.useRuntimeCredential in materializeRuntimeSettings), by
    placement (PlacementAllocator.reserveAllContext ->
    credentialGuard.WithAllocationReferences), Run creation, RuntimeConfig
    publish and binding mutations. One slow Gateway admin API therefore
    stalls all Scheduler lanes preparing Workers and all Run creation. The
    durable prepared-delete row already fences the credential being deleted
    (EncryptedProvider.LookupLLMCredential returns ErrRecoveryRequired when
    HasPreparedDelete), so the process-wide write lock adds no safety for
    other credentials. RCF-R52 currently prescribes the hold. Separately,
    Recover runs only at startup via app/composition_credentials.go:126 and
    any prepared operation that cannot complete (LiteLLM down, Gateway
    removed from the catalog so resolveManager fails) makes runCLI return an
    error: the Server crash-loops and every unrelated capability is down
    until the Gateway is back. FAIL-RCF-2 mandates recovery before Run or
    Operations traffic, but the blast radius and reopen condition are not
    recorded (AGENTS 3.9).
  siblings: >-
    Rotate and Create paths in lifecycle.go take the same barrier; check
    whether they hold it across a remote call too and apply the same scope.
plan:
  - "Change RCF-R52 in docs/spec/configuration/runtime-config.md: the write side of the barrier covers reference checks and the prepared-intent insert only; the credential's own row fence covers the remote call and tombstone commit. Record the reversal (why: barrier blocks unrelated preparation; alternatives: per-credential locks, rejected because the row fence already exists)."
  - "Restructure Delete: lock, check references, insert prepared intent in the transaction at lifecycle.go:388-431, unlock; call the manager; commit the tombstone under the row fence only. Apply the same shape to Rotate if it holds across a remote call."
  - "Startup recovery: either start the Server in the existing ready=false mode and retry Recover in the background with backoff while Run and credential operations answer ErrRecoveryRequired, or document the crash-loop as an accepted risk with the detection signal (process restarts, log code) and a reopen condition in the spec. Prefer the first; it keeps FAIL-RCF-2's guarantee for Run traffic while leaving Audits and the UI up."
  - "Tests on real PostgreSQL: a Delete whose manager blocks must not block a concurrent Use of a different credential (bounded wait with the injected clock); a Delete of credential A blocks Use of A with ErrRecoveryRequired; startup with a failing manager serves Operations reads and answers ErrRecoveryRequired on Run creation."
scope:
  in:
    - "Barrier scope change with spec update; startup recovery mode; real-store tests."
  out:
    - "The credential_operations journal format and manager API."
acceptance_criteria:
  - id: A1
    text: "While a Delete waits on the Gateway, Use of another credential completes within the test's bounded wait."
  - id: A2
    text: "Use of the credential being deleted fails with ErrRecoveryRequired until the delete completes or is recovered."
  - id: A3
    text: "With the Gateway unreachable at startup, the Server serves Operations and Audit reads and rejects Run creation with ErrRecoveryRequired; recovery completes when the Gateway returns (or the accepted risk is recorded with a detection signal if that option is chosen)."
  - id: A4
    text: "Tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/credentials/... ./internal/app/... ./internal/scheduler/..."
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A3]
