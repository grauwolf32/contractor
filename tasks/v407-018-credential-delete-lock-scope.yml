schema_version: '1.0'
id: V407-018
title: Document credential lifecycle availability tradeoffs and a bounded redesign proposal
milestone: server-runtime-review-2026-10
epic: runtime-config
kind: chore
introduced_by: V4-003A
priority: P2
status: pending
depends_on: []
languages:
- go
goal: Prepare a self-contained availability proposal and current-contract characterization for managed-credential
  deletion and startup recovery, without changing runtime behavior.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/configuration/runtime-config.md
  finding: internal/credentials/lifecycle.go:326-329 holds the shared lifecycle barrier exclusively through
    manager.Delete at :611-615. This can block unrelated reference commits and RuntimeCredentialService.Use
    while the remote request is in flight. internal/app/composition_credentials.go:126-127 stops startup
    when an existing prepared operation cannot recover; an offline Gateway with no prepared operations
    does not cause this failure. Both choices implement the current RCF-R52 and RCF-R72 contracts, so
    changing them is a feature/design decision rather than fixing a contract violation.
  validation: Validated against main dc7012e8 on 2026-10-23. The lock path and conditional startup failure
    were confirmed on main dc7012e8. Create uses lifecycleMu but not the same exclusive barrier; no remote
    Rotate path was found. A prepared delete already fences its credential in EncryptedProvider, but that
    alone is not proof that every reference path can safely run after releasing the process-wide barrier.
  siblings: Inventory Run creation, placement commit, RuntimeConfig publication/binding, Agent labels,
    Audit holds, Runtime credential use/deletion and managed-create recovery. Differentiate safe reads
    from writes that can introduce references; do not assume all Audit or Operations traffic is safe during
    recovery.
plan:
- Prepare a design under docs/proposals comparing the current fail-closed policy, shorter global barrier
  ownership with durable per-credential fencing, and a restricted startup recovery mode. Trace every reference
  writer and recovery race before recommending an option.
- For each alternative record the safety guarantee, changed availability, evidence, failure outcomes,
  resource bounds, lifecycle ownership, alternatives and reversal condition. Include the existing policy
  as a legitimate outcome with detection and reopening conditions.
- Record a recommendation and the unresolved product decision with its owner, alternatives, evidence and
  reversal conditions. This task is complete when the proposal and current-behavior characterization are
  complete; it does not require approval of a behavior change. If a changed guarantee is later accepted,
  create a separate feature task with the owning RCF/FAIL updates and concrete implementation criteria.
- Use real-store synchronized tests to characterize the current barrier and prepared-operation fences,
  and an operation matrix to demonstrate what any accepted change must preserve. Avoid elapsed-time claims
  or simulated manager errors standing in for ambiguous database commits.
scope:
  in:
  - Availability proposal, current-contract characterization and recommendation with a decision owner
    and reopening conditions.
  out:
  - Implementing a shorter barrier, background recovery, new readiness state or newly permitted API traffic;
    those require a separate accepted feature task.
  - Weakening credential-reference checks, prepared-operation journals, single-active-Server ownership
    or existing secret-handling guarantees.
acceptance_criteria:
- id: A1
  text: A self-contained proposal distinguishes ordinary Gateway outage from outage with a prepared operation,
    and maps every affected reader/writer to its current fence and proposed safety proof.
- id: A2
  text: The proposal states success, permanent failure, retryable/ambiguous result, cancellation, timeout,
    bounded work and shutdown outcomes; tests characterize current cross-credential blocking and scoped
    prepared-delete rejection using synchronization and PostgreSQL.
- id: A3
  text: The recommendation distinguishes evidence from assumptions and records a decision owner, alternatives,
    safety guarantees, detection and reopening conditions. The proposal explicitly leaves current RCF-R52/R72
    behavior in force; approval or implementation of a redesign is outside this task.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/credentials/...
    ./internal/app/... ./internal/scheduler/...
  covers:
  - A2
- command: make lint
  covers:
  - A2
requirements:
- id: R1
  text: Until a revised contract is explicitly accepted, preserve RCF-R52 barrier ownership and RCF-R72
    recovery-before-traffic semantics.
- id: R2
  text: Any proposed narrower fence must prove that no Run, allocation, binding or Audit can newly reference
    a possibly deleted credential, including ambiguous database and Gateway outcomes.
failure_outcomes:
- operation: Design and characterization of managed deletion/recovery
  permanent: Describe the existing classified terminal rejection and its proposed treatment without changing
    it in this draft.
  retryable: Record request/recovery budget and backoff ownership for each alternative; no unbounded retry
    loop.
  ambiguous: Retain the durable credential_operations intent and reconcile by its existing identity before
    admitting potentially unsafe references.
  cancelled: Identify who joins in-flight work and owns the barrier/connection before shutdown.
  timeout: Keep Gateway request, database operation and lifecycle coordination budgets distinct.
cardinality:
- collection: Prepared credential operations and all dependent reference collections
  expected: Measure representative operation/reference counts in the characterization.
  maximum: Record existing declared limits and batching constants in the proposal; introduce no unbounded
    whole-journal scan.
  bound: Specify rows, bytes and concurrent remote operations per recovery step before choosing an implementation.
lifecycle:
- entity: Proposed recovery coordination, if accepted
  delete: Existing credential deletion authorization and reference blockers remain authoritative.
  cascade: No new entity, endpoint or persistence schema is authorized by this design draft.
  retention: Keep existing journal/tombstone retention; proposed volatile work must end or join on shutdown.
manual_verification:
- check: Review the proposal operation matrix, alternatives and recommendation against the current RCF-R52/R72
    paths and characterization evidence; record the decision owner and reopening conditions. This is proposal
    acceptance, not approval to change runtime behavior.
  covers:
  - A1
  - A3
