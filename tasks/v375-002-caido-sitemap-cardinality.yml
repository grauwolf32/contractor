schema_version: "1.0"
id: V375-002
title: Keep Caido sitemap browsing usable above one hundred entries
milestone: http-caido-tools-hardening
epic: http-tools
kind: defect
introduced_by: V12-004
priority: P1
status: pending
depends_on: []
languages: [python, markdown]
goal: Return bounded sitemap results with truthful continuation metadata when Caido has more than one hundred valid entries.
context:
  authority: User requested investigation of Caido errors found in demo Runs on 2026-10-13.
  severity: medium
  specification:
    - docs/spec/tools/http-caido.md#HTP-R87
    - docs/spec/tools/http-caido.md#HTP-R110
    - docs/spec/tools/http-caido.md#HTP-R112
    - docs/spec/platform/limits.md#LIM-HTP-19
  finding: >-
    runtime/src/contractor_runtime/toolsets/caido/tools.py:727 applies
    MAX_SITEMAP_ENTRIES=100 to the entire provider nodes array through _list,
    so a valid larger sitemap becomes caido_response_invalid. Read-only queries
    against the demo Caido reproduced the rejection for parent 151 with 107
    individually valid nodes. Run run_c36e022df21c15979b3ddd29a3447706 retained
    one failed caido_sitemap call with the same code and depth ALL; its exact
    parent argument was not retained, so identity with this reproduced query
    is not established. The failure is independent of Gateway termination.
  siblings: >-
    Both sitemapRootEntries and sitemapDescendantEntries share the faulty
    cardinality check. Other Caido list tools use provider-side paging and
    need regression coverage to retain their existing page bounds. The two
    caido_automate_run errors in run_97b5a6546297eeeb5af8b1a680e0f672 were
    caido_request_invalid before session creation, and are outside this finding.
scope:
  in:
    - Define bounded sitemap paging or subtree continuation without treating valid collection size as malformed data.
    - Preserve the adapter's response byte bound, strict node validation and a bounded model-visible response.
    - Expose truncation and a usable next step when a response cannot contain the full selection.
    - Add sanitized fixtures and a regression through the production Caido adapter and tool path with a local GraphQL server.
    - Document cardinality, byte bounds and the selected continuation contract in the owning specification.
  out:
    - Increase the entry limit to fit only the observed 107-node tree.
    - Change live Caido state, model choice, target policy or retry mutations.
    - Relax malformed node or GraphQL envelope validation.
acceptance_criteria:
  - id: A1
    text: Given valid root or descendant collections of 0, 100, 101, 107 and at least 1000 entries, sitemap calls return bounded usable results with truthful continuation metadata instead of caido_response_invalid solely because of cardinality.
  - id: A2
    text: Each call has explicit row and byte work bounds, including the containing provider collection; callers can obtain remaining entries through the documented continuation or narrower subtree requests.
  - id: A3
    text: Malformed nodes, oversized responses, cancellation and expired allocation deadlines retain stable failures and do not expose credentials or arbitrary provider content.
  - id: A4
    text: A production adapter and tool regression against a local GraphQL server fails on the original code; all touched Caido suites and lint pass after the fix.
tests:
  - command: uv run --project runtime pytest runtime/tests/test_caido_read_tools.py runtime/tests/test_caido_graphql_fixtures.py runtime/tests/test_caido_adapter.py runtime/tests/test_http_caido_security.py
    covers: [A1, A2, A3, A4]
  - command: make test-http-caido-e2e
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A4]
