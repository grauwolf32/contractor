      TestSharedPostgresEvalExperimentPurgeIsBoundedAndRestartable,
      TestSharedPostgresEvalPurgeWaitsForDrainAndAuthority,
      TestSharedPostgresEvalPurgeFitsLargestLegalRowInFreshPass,
      TestSharedPostgresEvalProjectPurgeSharesOneBudget,
      TestSharedPostgresEvalPurgeRemovesNativePlanResourcesAndCommands,
      TestSharedPostgresEvalPurgeCoversCascadesAndTriggers (with its
      thirteen fixtures), TestPurgeMeterLogsPassCountAndAge,
      TestPostgresProjectReceiptPurgeIsBoundedAndScoped,
      TestPostgresProjectDeletionClaimLifecycle,
      TestSharedPostgresEvalPurgeYieldsBetweenTicksAndRefusesPartialReads,
      TestProjectDeletionPurgesEvalDataInBoundedTransactions,
