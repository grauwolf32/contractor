schema_version: '1.0'
id: V409-009
title: Purge drained Eval data in bounded, restartable transactions
milestone: sql-review-2026-10
epic: evals
kind: defect
introduced_by: V38-003
priority: P2
status: completed
implementation_commit: f58ec2799a2d67042d820757a5eeb6571b098528
depends_on: []
languages:
- go
- sql
goal: Experiment and Project deletion remove Eval-owned data with a shared dependent-row and byte
  budget per committed pass while preserving drain gates, receipts and ownership.
context:
  review: docs/research/2026-10-23-sql-review.md, A10 and Eval purge disposition; other original
    Eval query optimizations are explicitly assigned or declined below.
  specification:
  - docs/spec/evals/managed-evals.md#EVM-R223
  - docs/spec/evals/managed-evals.md#EVM-R226
  - docs/spec/evals/managed-evals.md#EVM-R216
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  severity: medium
  finding: 'internal/evalstore/deletion.go:38-76 removes an experiment with one cascading DELETE;
    :79-126 removes every Project experiment plus datasets, collections and receipts in one caller
    transaction. internal/evalstore/records.go:83-156 permits additional distinct retained records
    without a per-member total-count bound, so even a small admitted experiment can accumulate unbounded
    deletion work. internal/projectlifecycle/controller.go:381-429 composes this purge with later
    Project cleanup. LIMIT on parent members alone cannot bound their dependent records: baseline.sql:4315-4357
    has cascades and selection references to records.'
  siblings: Standalone deletion through internal/evalservice/service.go:393-411; Project deletion
    through internal/projectlifecycle/controller.go:403; Eval-owned records, evidence, selections,
    projections, submissions/suboperations, commands, view data, plan resources, datasets/collections
    and retained mutation receipts. Audit purge in internal/auditstore/internal/pgstore/purge_sql.go
    demonstrates leaf-first phases and a shared remaining-row budget; preserve its separate lifecycle.
    Ordinary Run/Audit execution deletion remains with its existing owners.
  validation: 'Revalidated on main 1d533b2db885e0162ebabb01d36470f139546009: unbatched purge is confirmed;
    no production latency incident was measured. A native matrix admits at most 1000 members and
    the document limit is 1 MiB. The existing 10000-member comparison test seeds the store directly
    and is not a production-admitted plan. Current owner, deletion-fence, outstanding-work and unresolved-suboperation
    checks are required protections, not redundant queries.'
  provenance: git blame attributes Purge and the cascading DELETE to d4c4e8854d73fe44f52c8b3f6d461cfc56dcbcc1,
    recorded by V38-003. V38-006 added comparison data later; it is not the origin of this purge
    boundary.
  decisions:
  - The no-behavior comparison-page and existing-transaction recovery-query work from the original
    V409-009 is owned by V409-014; member INSERT batching remains V407-028 and metadata-only FrozenPlan
    reads remain V407-029.
  - 'Full PublishView projection redesign is outside this task: complete-matrix denominators, atomic
    generation publication and selected-document content identity are required by EVM-R164-R168.
    Reopen only with a measured admitted-size workload and a design preserving all pair/report fields,
    identity and byte bounds.'
  - 'A persisted next_ordinal is not scheduled here: NextMembers is used only for native admission,
    capped at 1000 members, with at most 10 admissions per tick. Reopen after representative plans
    show repeated scans are material and cursor recovery is specified for failed commits, pause/cancel
    and claim turnover.'
  - 'One transaction/experiment lock for an entire coordinator tick is rejected: intent commit, ordinary
    service side effect and acknowledgement must remain separate durable phases (EVM-R108-R111).
    Reconciliation currently selects at most 10 intents plus 10 accepted submissions, not 100; CollectView
    publishes once after a dirty batch, not per member.'
  - The 16 MiB row-byte budget below is a proposed new accounting budget, not an existing limit or
    a measured optimum. Its purpose is to keep batches of large retained documents smaller than the
    1000-row ceiling alone would allow. Before fixing the constant, derive the largest legal individual
    stored row across every affected table, including internally assembled projection/view rows;
    the final documented budget must fit that row. Do not infer that the 1 MiB external-document
    limit also bounds an assembled row.
plan:
- Trace the complete Eval FK/trigger graph and document a leaf-first purge order. Clear selection
  references before their target records; exhaust record/evidence/suboperation children before deleting
  their member/submission parents. Include deletion-trigger effects and final small cascades in the
  accounting rather than counting only top-level DELETE command tags.
- 'Use the existing CleanupBatchRows=1000 as one shared row-mutation budget across all Eval domain
  phases of a pass, not a fresh budget per table or experiment. Introduce a stored-row-byte budget,
  initially proposed at 16 MiB, measured by pg_column_size of bounded candidate rows before mutation.
  Prove the largest legal individual row across the affected tables and raise the proposed constant
  if necessary so every legal row fits; document the final value, rationale, accounting unit, fixed
  bounded authority/claim overhead and registration in limits.md. A nonempty unblocked remainder
  must make monotonic durable progress: do not introduce a permanent row-too-big deletion error,
  a silent skip or an endless zero-progress success.'
- Return explicit progress/done from the transaction-scoped purger. Keep the owning experiment or
  deleting Project and its fence until children are gone; remove the experiment last. Update the
  Eval service and Project controller to commit one incomplete pass and yield before starting another.
  When a Project Eval pass exhausts its budget or still has work, do not continue to finding receipts
  or artifact purge in that transaction. Empty Eval cleanup may continue through the existing later
  Project phases.
- Preserve owner checks, Project-before-experiment lock ordering, requireTx, no outstanding submissions,
  no unresolved suboperations and drained execution-workspace dependencies before destructive work.
  Keep mutation receipts after standalone experiment purge; during Project purge remove its Eval
  receipts in bounded phases before the Project is removed. Do not create another receipt or lease
  protocol.
- 'Define reads during committed partial cleanup: never publish a guessed partial comparison or summary.
  Keep lifecycle/identity metadata until the final delete, invalidate the selected-view pointer before
  deleting its dependent rows, and return the existing classified unavailable/deletion outcome for
  views that no longer exist. Specify and test the chosen existing error code and lifecycle-read
  fields in the owning Eval contract and OpenAPI where required.'
- A failed or cancelled pass rolls back its own mutations; earlier committed passes remain valid
  progress. Resume from durable remaining rows, without in-memory-only cursors. Recheck current deletion/claim
  authority on each owning controller pass and use existing definite-transaction retry rules; a lost
  commit acknowledgement must be safely reconcilable by reading what remains.
- Add real PostgreSQL regressions using an admitted experiment with more than two cleanup batches
  of dependent records, multiple Project experiments, selected references and retained receipts.
  Count aggregate dependent mutations and stored-row bytes per transaction, including a small member
  set with many records so a parent-only limit cannot pass. Separately label any 10000-member defensive
  fixture as directly seeded. Exercise interruption after a committed batch, rollback inside a batch,
  retries, owner isolation, live drain blockers and the final small cleanup. Include the largest
  legal row under the chosen accounting and a remaining budget too small for the next row; a fresh
  pass must remove that row and eventually finish.
scope:
  in:
  - Bounded Eval experiment and Project cleanup, controller progress integration, FK/trigger-aware
    accounting, existing deletion/read failure outcomes and normative limits.
  - Real PostgreSQL tests on standalone and Project deletion paths, including receipt lifetime and
    recovery after partial progress.
  out:
  - Query/projection/reconciliation optimizations assigned to V409-014 or declined in context.decisions;
    V407-028/029 work.
  - Whole-tick transactions, new execution retry policy, changed comparison semantics, new receipt
    tables, ordinary Run/Audit purge ownership or a new public lifecycle state.
acceptance_criteria:
- id: A1
  text: Given an admitted experiment with a small member set and more than two batches of retained
    children, when deletion advances, then each committed Eval pass mutates at most CleanupBatchRows
    domain/dependent rows and the documented stored-row-byte budget (proposed at 16 MiB and finalized
    after largest-row proof), with bounded fixed authority overhead; no parent cascade bypasses either
    budget.
- id: A2
  text: Given several experiments and retained Eval receipts in a deleting Project, when its controller
    purges Eval data, then all experiments share the same per-pass budget, the controller yields
    between incomplete passes, unrelated Project/owner data remains intact, and the Project row is
    deleted only after every required phase is complete.
- id: A3
  text: Given a completed pass followed by cancellation, rollback or a lost acknowledgement, when
    a new controller resumes, then committed progress is preserved, the failed pass has no partial
    effects, every remaining row is eventually removed once blockers clear, and standalone mutation
    receipts still replay until Project purge. The largest legal row fits a fresh pass, and every
    nonempty unblocked pass reduces the durable remaining work without a permanent size rejection.
- id: A4
  text: Given outstanding work, an unresolved side-effect intent, an undrained child workspace or
    a foreign owner, when purge is requested, then the existing drain/authority error is returned
    without removing protected data; partial cleanup never exposes a fabricated complete view or
    partial denominator.
- id: A5
  text: Given the original cascading implementation, when the aggregate-budget regression runs on
    PostgreSQL, then it exceeds the budget and fails; preservation checks for existing drain gates,
    ordinary execution ownership and receipt replay remain green without wall-clock thresholds.
