  database_tests_configured: true
  siblings_reviewed: >-
    Standalone deletion (evalservice.purge under the coordinator claim) and
    Project deletion (projectlifecycle.purgeProject) are the only callers of
    Purge and PurgeProject. Every Eval table with an experiment_id, the
    dataset revisions, the collection row and the Eval receipts are in the
    phases. The Project purge of finding proposal receipts now shares the
    CleanupBudget rule; Audit purge (auditstore) keeps its own lifecycle and
    its rows-only budget (LIM-REV-10).
    Ordinary Run and Audit deletion is untouched; the evalservice test keeps
    the eight workflow Runs. Read paths during a partial purge: Get and List
    (metadata only, freshness pending), Members, Pairs, Pair, Report, Chart
    (withSelectedView), Review and Executions (Purging gate), GetCommand
    (commands go in the last phase).
  limits_registered: >-
    LIM-EVM-20 (1,000 row mutations and 16 MiB of stored row bytes per Eval
    purge pass), owned by the new EVM-R243, which also records the accepted
    purge rate with its owner, detection and reopen condition. Also new:
    EVM-R244 (reads during a purge) and FAIL-EVM-9 (failure outcomes of one
    pass). V407-029 took EVM-R242 and LIM-EVM-19, so these were renumbered
    from EVM-R242, EVM-R243 and LIM-EVM-19. Updated: EVM-R223, DEL-R44,
    DEL-R60, LIFE-EVM-5, LIFE-DEL-9, FAIL-DEL-3, the observability table of
    telemetry rules owned elsewhere, and the eval_project_deleting registry
    meaning. LIM-EVM-18 was added to the managed-evals limits list, where it
    was missing. No migration.
  declined: >-
    No OpenAPI change: every Eval read operation already declares 409, and
    eval_project_deleting is in EvalAPIError. No UI change: some Eval reads
    do run during a purge without the experiment's snapshot (pair.tsx with
    the viewSnapshot URL parameter or none, and ExecutionReasons in
    execution-status.tsx without a snapshot when the experiment reports
    none), but they receive 409 eval_project_deleting and EvalError shows its
    message, "The evaluation workspace is being deleted."; no page shows
    partial data. Comparison, projection and
    reconciliation optimizations stay with V409-014 and context.decisions.
  accepted_risks: >-
    Recorded in EVM-R243: the Eval coordinator commits one experiment purge
    pass per tick (1 s by default), about 2.8 h for 10M rows; the Project
    deletion controller runs its passes back to back. Owner: the Eval
    coordinator. Detection: the PurgeMeter records (first pass, every 600th
    pass, last pass; a warning once a purge is older than one hour), tested
    by TestPurgeMeterLogsPassCountAndAge and asserted on both real purge
    paths. Reopen when the warning is logged or deletion must finish faster
    than one pass per tick.
  remaining: None for this task.
