manual_verification:
- check: Record the FK/trigger phase table, exact row/byte accounting and finalization overhead in
    the repository review. Confirm that no retained cascade or following Project phase escapes an
    incomplete pass; record actual PostgreSQL commands, non-skipped results and the landing revision.
    Record the largest-legal-row derivation and why the final proposed budget accommodates it; row-byte
    accounting is not a heap-memory or WAL-volume claim.
  covers:
  - A1
  - A2
  - A5
verification:
  date: '2026-10-24'
  environment: >-
    macOS arm64; Go 1.26.9 (GOTOOLCHAIN=local); locked Node 24.20 and Runtime
    venv; local PostgreSQL 17.11 database contractor_test_c2 with isolated
    per-test schemas and all 34 migrations; worktree branch claude/rv-c2 on
    base 9cc34c0b, with claude/review-v407-v409 (c36e3caa) merged in
    17de731b. First implementation 56ca02d3; review fixes f58ec279.
  re_verification: >-
    The finding held on base 9cc34c0b: Store.Purge removed an experiment with
    one DELETE of eval_experiments that cascaded through members, records,
    evidence, projections, submissions and view rows; Store.PurgeProject
    deleted every experiment, dataset revision, collection row and Eval
    receipt of the Project in the Project controller's transaction, which then
    continued to finding receipts and Artifacts. Nothing bounded rows or
    bytes, and records per member have no count bound.
  design_decision: >-
    One shared CleanupBudget per pass (persistence/postgres cleanup.go):
    1,000 row mutations (CleanupBatchRows) and 16 MiB of stored row bytes
    (LIM-EVM-20), with a fresh pass always taking its first unit. Each
    statement deletes the prefix of at most limit+1 ctid candidates whose
    running row and pg_column_size sums fit. Phases go leaf first, so no
    cascade removes an uncounted row. Collection rows that the triggers
    rewrite are charged with their parent (3 per dataset revision, 2 per
    experiment). The view pointer is cleared first, so no reader resolves a
    partly deleted view. Authority reuses the existing Eval controller claim
    (checkClaim) and Project deletion claim; no receipt, claim or retry
    mechanism was added. Reads during a purge (deletion requested and no
    selected view) keep identity and plan metadata, and member-level reads
    return 409 eval_project_deleting, an existing code already declared on
    every Eval read operation (EVM-R244). Rejected alternatives: a per-table
    or per-experiment fresh budget (the task requires one shared budget); a
    parent-member LIMIT (does not bound dependent records); a new
    purge-progress table or cursor (progress is the durable remaining rows).
    Reversal condition: a schema change that adds a table referencing a
    purged table, under any name and with any delete action, or a trigger
    that writes when a purge statement fires it, must extend the purge's
    declarations (experimentPurgePhases, finalPurgeCascades,
    projectPurgeTables, purgeDeleteTriggers, purgeRowColumns).
    TestSharedPostgresEvalPurgeCoversCascadesAndTriggers derives the cascade
    and trigger graph from pg_constraint and pg_trigger and fails otherwise.
  review_changes: >-
    The first review (CHANGES) found the schema guard compared only the
    columns of eval_* tables: a new cascading child or writing DELETE
    trigger passed it while a pass counted 63 of 4,863 rows. The guard now
    walks the FK graph (every confdeltype) and the triggers a purge
    statement fires, follows writes through called schema functions and
    dynamic SQL, and has thirteen negative DDL fixtures in rolled-back
    transactions. The final unit SQL, row costs and charged bytes are derived
    from the same declarations the guard checks. CleanupBudget and
    DeleteWithinBudget (now with an optional order) are the one definition of
    "row and byte limits per pass, first unit always goes": the Project
    purge of finding proposal receipts (LIM-DEL-3) uses it instead of its own
    statement, and project_purge_sql.go is gone. The Audit purge keeps its
    rows-only countdown because LIM-REV-10 has no byte bound; it adopts
    CleanupBudget when an Audit pass needs one. The doc comment now says row
    costs and the collection trigger bytes are constants the caller states.
    Detection of the accepted purge rate: evalstore.PurgeMeter, used by the
    Eval service and the Project deletion controller, logs each purge's first
    pass, every 600th pass (a warning past one hour) and its end with pass
    count, rows, bytes and age since the deletion request (the Project
    deletion claim now carries deletion_requested_at). The merge of
    claude/review-v407-v409 renumbered this task's IDs after V407-029.
  regression_before_fix: >-
    TestProjectDeletionPurgesEvalDataInBoundedTransactions and
    TestSharedPostgresEvalPurgeYieldsBetweenTicksAndRefusesPartialReads were
    copied onto a temporary worktree at 9cc34c0b (git worktree add, then
    removed) and run against PostgreSQL. The first failed with "step 3 spent
    5705 Eval row mutations, more than 1000"; the second failed with "one
    tick left 0 evidence references, want one bounded pass". The evalstore
    regressions use the new pass API and cannot compile against the base.
  manual_verification: >-
    Recorded in docs/research/2026-10-23-sql-review.md section G: the
    FK/trigger phase table, the exclusion argument, the accounting unit and
    its per-pass check against pg_stat_get_xact_tuples_* (equal on every
    committed pass), the fixed authority and finalization overhead (at most 6
    row mutations, about 3.1 MiB), the largest-legal-row derivation (queue
    suites 9,295,001 bytes, progress observation counts 11,260,056 stored
    bytes uncompressed, so 16 MiB fits every legal row), the commands and the
    landing revision. Measured standalone purge of an 8-member populated
    experiment of 3,171 dependent rows and 18,332,784 stored bytes: five
    passes (1000, 1000, 1000, 149 byte-bound, 26 final). Row-byte accounting
    is not a heap-memory or WAL-volume claim.
  commands:
