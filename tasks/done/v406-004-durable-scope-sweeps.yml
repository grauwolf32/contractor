progress:
  completed_work:
  - Implemented owner-bound create/read/list/member/cancel/purge API and regenerated SDKs from OpenAPI.
  - Captured exact Projects, target URLs, resolved Workflow/template and Runtime pins, defaulted arguments,
    original and retained source provenance, canonical child requests and opaque keys in one keyed mutation.
  - Retain one frozen same-owner UserScope fork and share its immutable bytes with ordinary Project Runs;
    original source deletion and advancement do not change pending members.
  - Use existing ControllerClaims on the parent row; process at most 25 members and 4 MiB per tick;
    maintained counters and indexed unsettled work avoid whole-sweep reads on polling.
  - Bind ordinary Run creation and admitted member facts in the same credential-aware Run transaction,
    fenced against cancellation and purge. In-process drain joins work and claim release before cleanup.
  - PostgreSQL coverage passes for 7/1000 members, source deletion, replay, lost child acknowledgements,
    competing claim ownership, restart, cancellation races, populated purge, admission deadline and
    30-day retention with 25-row cleanup batches.
  - Admission Project selection uses an indexed 1001-row prefix or bounded PK lookups; a 10000-Project
    containing portfolio regression verifies both paths.
  - Owner library pages skip reserved source snapshots through a partial index; a real-store 6000-snapshot
    regression verifies bounded rows read for visible entries.
  - Updated owning specs, failure/lifecycle/limit registries, table ownership and architecture; ERD
    regenerated from a scratch PostgreSQL database at migration 31. Architecture validation passed.
  remaining_work: []
