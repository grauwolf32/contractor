schema_version: '1.0'
id: V406-004
title: Coordinate durable bounded Nuclei sweeps over Project scopes
milestone: web-nuclei-rule-sweeps-2026-10
epic: scan-tools
kind: feature
priority: P2
status: completed
implementation_commit: 248e91a408c4b27fec7809919b6bd4d1957c1175
