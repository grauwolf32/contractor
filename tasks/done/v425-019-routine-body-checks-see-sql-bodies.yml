schema_version: "1.0"
id: V425-019
title: "Make routine-body checks read SQL-standard function bodies"
milestone: hub-audit-defects-2026-10
epic: persistence
kind: defect
introduced_by: V425-003
priority: P3
status: completed
depends_on: [V426-001]
languages: [go, sql]
goal: >-
  Every test or guard that inspects what a database routine does reads its
  body through one helper that returns SQL-standard (BEGIN ATOMIC) bodies as
  well as string bodies, so no routine is invisible to it.
context:
  severity: low
  origin: >-
    Reported by lane fix-restore while implementing V425-003 and rechecked
    on main ce609f4f3 by the coordinator.
  finding: >-
    Migration 000063 (V425-003) gave 16 functions SQL-standard bodies, for
    which pg_proc.prosrc is empty. Checks that match prosrc no longer see
    them: internal/auditstore/internal/pgstore/event_allocation_postgres_test.go:152
    and :173, internal/persistence/postgres/finding_correlation_fence_migration_test.go:97,
    internal/persistence/postgres/mutation_receipts_migration_test.go:105 and
    internal/evalstore/purge_coverage_postgres_test.go:49. Nothing is weakened
    today because only IMMUTABLE functions have such bodies, but a later
    writing function with a SQL-standard body would pass these checks
    unseen. V425-003 already switched the PER-R23 routine-ownership check to
    pg_get_function_sqlbody.
  specification:
    - docs/spec/platform/persistence.md#PER-R46
  implementation_decision: >-
    2026-10-31: Put the shared pg_proc body expression in the existing
    explaintest helper package and use it in every ordinary routine reader.
    Keep the existing trigger-only guards query as the documented exception:
    SQL functions cannot return trigger. Extend the existing lint persistence
    source checks with the direct-reader guard and negative Go/Python/SQL probes.
  siblings: >-
    Every git grep hit for prosrc under internal/, tests/ and scripts/,
    including internal/persistence/explaintest/guards_sql.go:10 (trigger
    functions, which cannot have SQL-standard bodies; rule it out
    explicitly) and explaintest.ReadBody.
scope:
  in:
    - "One shared SQL expression or helper (coalesce(pg_get_function_sqlbody(oid), prosrc)) used by every listed check."
    - "A guard that fails when a new check reads prosrc directly."
  out:
    - "Changing the functions themselves."
acceptance_criteria:
  - id: A1
    text: "Each listed check finds a writing function whose body is SQL-standard (proved with a test-only function in the test schema)."
  - id: A2
    text: "No direct prosrc read remains outside the helper and the explicitly ruled-out trigger reader."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/auditstore/... ./internal/persistence/... ./internal/evalstore/..."
    covers: [A1, A2]
  - command: make lint
    covers: [A2]
implementation_commit: c9f90eb704430d36ae67d7d2b9d34fb0ead54314
verification:
  date: '2026-10-31'
  environment: "macOS arm64, Go 1.26.9, disposable contractor_test_v425_quick PostgreSQL database."
  commands:
    - go test -count=1 ./internal/auditstore/... ./internal/persistence/... ./internal/evalstore/... passed after V426-001 repaired the pre-existing SQLSTATE source-guard failure.
    - make lint passed, including the new direct-reader guard and its negative Go/Python/SQL probes.
  regression: >-
    Replacing the shared body expression temporarily with a prosrc-only reader
    made all five real-PostgreSQL inspection tests fail: Audit event allocation,
    routine ownership, Project correlation fences, mutation receipts and Eval
    purge coverage. Restoring it passed the complete owner-package suites.
    The trigger-only source reader is explicitly documented because SQL
    functions cannot return trigger. No production functions or limits changed.
