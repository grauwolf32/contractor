schema_version: '1.0'
id: V458-012
title: Open the full Check workspace directly from the global Checks list
milestone: ui-consolidation-2026-10
epic: ui
kind: feature
priority: P2
status: completed
depends_on: [V458-011]
languages: [typescript, css, json, markdown, yaml]
goal: Selecting a Check immediately shows its complete workspace alongside the original Checks list and filters, with no intermediate summary or Open check step.
demonstration: Select a Check from a filtered global list, inspect Work and a saved result, switch to another Check, and return to the same list on mobile; all views use the same production detail component as the Project route.
context:
  authority: User decision 2026-11-09 removes the uninformative summary and approves opening the full workspace while retaining the source Checks list and filters on the left.
  specification: docs/spec/ui/ui.md#UI-R139
  design: >-
    Extract the existing research detail pane for both route entries. The global
    Checks URL retains state/project/check and selects the full section through
    section; internal section, hypothesis-history and exact-material links keep
    this list context. Canonical Project Check routes keep their current paths.
    Remove the short-summary component instead of retaining a second view.
    Route wrappers own document titles; the shared detail pane resets only
    its own scrolling when the selected Check changes.
scope:
  in:
  - Shared full research detail, global list selection, sections, keyboard activation and mobile return behavior.
  - Direct owner-authorized selected Check reads, including off-list and deleted Checks, with existing polling and failure behavior.
  - Preserve exact result/material navigation and visible lifecycle controls; update specification and responsive production preview.
  out:
  - Server API changes, new tables, model calls, business-data deletion, deployment and merge.
failure_outcomes:
  - operation: Read selected Check and its bounded detail resources
    permanent: Missing or inaccessible Check shows the existing unavailable message; unknown section offers Overview.
    retryable: Existing QueryView stale-data notices and polling backoff remain authoritative.
    ambiguous: No new mutation or receipt; existing lifecycle actions retain their CAS and idempotency behavior.
    cancelled: Query cancellation remains with the existing API and query layer.
    timeout: Existing HTTP request budgets; no unbounded prefetch or provider call.
cardinality:
  - collection: Global Checks context and selected detail
    expected: One selected Check with one visible page of tasks hypotheses or materials
    maximum: Existing owner-list page cap, 30 progress rows and ordinary detail page bounds
    bound: Reuse the current list hooks and detail pagination; do not load full workspaces for every list row.
lifecycle:
  - entity: Browser Check selection
    delete: Existing Check deletion confirmation and Server intent remain unchanged.
    cascade: Switching Check clears child selection and cursors; switching list filters retains the current detail section.
    retention: List filters and section live in the URL; no browser storage or new durable state.
acceptance_criteria:
  - id: A1
    text: A list click or Inbox check link opens full research content directly, with the existing list filters retained and no Open check intermediate action.
  - id: A2
    text: Sections, saved results, hypothesis work and exact-material links retain global context; switching Checks resets child cursors, and keyboard and mobile Back return predictably to the list.
  - id: A3
    text: Off-list selected Checks load independently; missing Checks remain explicit, mutation confirmations and direct Delete remain, and all themes fit at 390 and 1440 pixels.
tests:
  - command: make ui-verify
    covers: [A1, A2, A3]
  - command: make ui-browser-mocked
    covers: [A1, A2, A3]
implementation_commit: 0f4ee94edba8eb04c0b0073f4d14e9ee06e622aa
verification:
  results:
  - Removed the 267-line CheckSummary implementation, its retired legend component, unused item-filter type and summary-only CSS. Global and Project entries render the same ResearchAuditDetail; no nested pane layout or Open check intermediate action remains.
  - Final make ui-verify passed 223 files and 2504 tests plus one existing expected failure, all 17 Node server cases, generation check, lint, typecheck and build. UI release is 0.11.30.
  - Final complete mocked browser gate passed 233 cases across 33 specs with no skips or retries. Six new cases cover global filtered entry, full work and saved results, hypothesis work and exact materials, and mobile filtered Back at 390 and 1440 pixels in light dark and black themes.
  - The full global Checks unit file passed nine cases, including independent off-list and missing Check reads, existing mutation confirmation and deleting-state behavior, keyboard selection, retaining the section while filtering, clearing child cursors on another Check and resetting only the detail scroll.
  - Native production preview was inspected with synthetic data; mobile Back retained the Running and Shop API filters and restored focus to the source row. The final route-owned title also remains Checks after returning. CSS/export guards, specification and task checks passed.
  - Read-only preview and screenshot are retained under ignored local review files. No server/database changes, live model calls, business-data deletion, merge, deployment or full release gate were performed.
