schema_version: "1.0"
id: V461-002
title: Apply API key credentials through engagement identities
milestone: audit-scanners-engagement-2026-11
epic: scan-tools
kind: feature
priority: P1
status: completed
implementation_commit: e5b7a0f4d23014127983efe9f6848bee5d8268ae
depends_on: []
languages: [go, python, typescript]
context:
  authority: >-
    User decision 2026-11-09: remove Audit scan settings inputs, use engagement
    for egress, identities and traffic limits without turning it into a scan
    configuration; extend credentials to preserve authentication; run only HTTP
    Nuclei rules; align native Nuclei and, where possible, SQLMap scheduling to
    engagement to minimize transport-induced waits. Implementation is authorized.
  specification: docs/spec/tools/scanners.md
goal: Preserve header, query and cookie authentication including combinations through encrypted credentials and the shared HTTP transport.
demonstration: A credential created through the public API is resolved into an engagement allocation and used against a real local target without placing secrets in engagement or scan artifacts.
scope:
  in: [credential validation and encrypted persistence, public and wire contracts, shared HTTP application and redaction, credential UI]
  out: [automatic login, scan settings in engagement, Audit input replacement owned by V461-003]
requirements:
  - id: R1
    text: One bounded typed credential supports combined header/query/cookie values; strict Go/Python/API/UI readers share fixtures.
  - id: R2
    text: Only explicitly selected assigned identities receive credentials within their exact origins; caller collisions fail before send and private values are redacted.
failure_outcomes:
  - operation: Credential creation and allocation materialization
    permanent: Existing invalid-credential and unauthorized-reference outcomes; no retry.
    retryable: Existing store transaction conflict handling.
    ambiguous: Existing credential mutation receipts reconcile exact retries.
    cancelled: Existing allocation owner joins HTTP requests and clears private material.
    timeout: Existing API and allocation deadlines.
cardinality:
  - collection: Authentication fields
    expected: One to five values per identity
    maximum: Existing 128-field and 16-KiB material ceilings
    bound: Validate names, values and total bytes before persistence and allocation use.
lifecycle:
  - entity: Runtime credentials
    delete: Existing credential holds prevent deletion while in use.
    cascade: Existing allocation material cleanup.
    retention: Encrypted owner records; public material contains only references.
acceptance_criteria:
  - id: A1
    given: Combined header/query/cookie credentials
    when: Created, materialized and selected by a real HTTP request
    then: The target receives the exact values, while public artifacts and diagnostics do not expose them.
  - id: A2
    given: Malformed, oversized, conflicting or out-of-origin values
    when: Validation or sending is attempted
    then: All contract readers reject consistently and no unauthorized request is sent.
decisions:
  - "New target-api-keys@1 uses a fields map with header:, query:, cookie: qualified names; api-keys is its engagement identity. No scan configuration is added to engagement."
  - "Query keys are injected only into the private native request; logical URLs remain in provenance. Scanner redaction also covers encoded query secrets."
  - "Explicit non-auth cookie parameters may coexist with API keys; configured or learned key collisions fail before target bytes."
  - "API-key identities with supplied cookies follow the existing cookie clear/block lifecycle."
tests:
  - command: make test-wire-cross-language verify-public-api
    covers: [A1, A2]
  - command: go test ./internal/credentials ./internal/engagement ./internal/contracts/runtimesettings ./internal/contracts/engagementcontract ./internal/httpapi/public
    covers: [A1, A2]
  - command: make ui-verify lint
    covers: [A1, A2]
  - command: go test -tags=e2e -count=1 -timeout=6m ./tests/e2e -run '^TestNucleiEngagementAcrossProductionProcesses$'
    covers: [A1, A2]
  - command: cd runtime && uv run pytest -W error tests/test_engagement_api_keys.py tests/test_engagement_identity.py tests/test_shared_target_credential_references.py tests/test_audit_http_credentials.py tests/test_nuclei_engagement.py tests/test_sqlmap_engagement.py tests/test_http_proxy_bridge.py
    covers: [A1, A2]
  - command: cd ui && corepack pnpm exec playwright test e2e/operations-forms.spec.ts --grep 'Combined API keys'
    covers: [A1, A2]
verification:
  date: "2026-11-09"
  runtime: "6096 passed, 135 optional/environment skips in the full Runtime suite; 99 focused HTTP/scanner tests passed, including installed Nuclei and SQLMap."
  process: "Public credential creation through Server/Scheduler/Runtime and actual Nuclei passed; combined header/query/cookie values reached the target and remained absent from automatic provenance."
  go: "Full credentials, engagement, runtimesettings, engagementcontract and public API packages passed against contractor_v461_01a1bca1. TMPDIR=/private/tmp avoids the macOS /var symlink rejected by the filesystem blob backend."
  contracts: "make test-wire-cross-language and verify-public-api passed; 378 fixtures, 423 Go and 269 Python shared tests. One optional heavy disk test skipped, not passing coverage."
  ui: "make ui-verify passed: 220 test files, 2484 tests passed and one expected failure. Three Chromium checks at 390px passed; light, dark and black screenshots inspected."
  lint: "make lint passed, including generated clients, dependency graph, schema diagram, strict fixtures, Python layers and UI gates."
  delivery: "Implemented on codex/audit-engagement; not merged into main."
