schema_version: "1.0"
id: V414-023
title: "Match secrets at the Go telemetry boundary by the shared 16-byte rule, longest first"
milestone: review-v407-v409-followups-2026-10
epic: operations
kind: defect
introduced_by: V126-001
priority: P2
status: completed
implementation_commit: 5aa825347a91981de2d5aa0fa41fd0509ac60aa5
depends_on: []
languages: [go, python]
goal: >-
  The Server persistence boundary and Planner span export match secrets exactly as the Runtime
  does (OBS-R31, LIM-OBS-3): a secret of at least 16 UTF-8 bytes anywhere, longest first, a shorter
  one only as a complete string, error codes never rewritten (OBS-R32), with one Go definition and
  a fixture both languages read.
context:
  review: >-
    tasks/v407-020-telemetry-trim-and-history.yml (follow-up found while implementing V407-020 on
    branch claude/rv-r1; that task keeps redaction unchanged and does not cover it).
  specification:
    - docs/spec/platform/observability.md#OBS-R30
    - docs/spec/platform/observability.md#OBS-R31
    - docs/spec/platform/observability.md#OBS-R32
    - docs/spec/platform/limits.md#LIM-OBS-3
    - docs/spec/execution/control-plane.md#CTL-R110
  severity: medium
  finding: >-
    internal/telemetry/policy.go:245-254 redactText replaces every configured secret with
    strings.ReplaceAll in configuration order, whatever its length. Since V126-001 the secrets
    include each allocation's RuntimeSettings.SecretValues
    (internal/scheduler/reports.go:245-266, runtimesettings/runtime_settings.go:243-283), which
    hold short proxy and target basic-auth usernames. A probe in internal/telemetry (deleted) with
    NewPolicy("a") normalized a report into arguments {"p[REDACTED]th":"d[REDACTED]t[REDACTED]/m[REDACTED]in.go"},
    error code "tool_c[REDACTED]ll_f[REDACTED]iled" and message "c[REDACTED]nnot re[REDACTED]d
    m[REDACTED]in.go", and RedactMessage turned "administrator login failed" into
    "[REDACTED]istrator login failed" for the secret "admin". Validation accepted the garbled
    report, so it is persisted. Because the order is not longest first, a short secret that is a
    substring of a longer one leaks most of the longer one: with secrets ("abc",
    "abcdefghijklmnopqrstuvwxyz0123") the long token became "[REDACTED]defghijklmnopqrstuvwxyz0123";
    SecretValues lists a basic-auth username before its password, so a password that starts with
    the username is exposed this way in Server-originated text (Runtime reports arrive already
    redacted longest first).
  siblings: >-
    Go, in scope: policy.go:165-169 normalizeError rewrites error codes, which OBS-R32 forbids (a
    code that is not an identifier or contains a long secret becomes tool_call_failed);
    policy.go:180-225 sanitizeMap keys and values; policy.go:58-60 Runtime stop reason;
    internal/scheduler/run_execution.go:297 RedactMessage of Server errors;
    internal/telemetry/planner_otlp.go:463-480 safePlannerString and :482-502
    plannerRunMetadataLabelAttributes drop an attribute that contains a secret of any length,
    while the Runtime exporter (runtime/src/contractor_runtime/adapters/otlp_http.py:675,691) uses
    contains_private_value (exact, or long anywhere);
    internal/controlplane/runtime_client.go:557-586 applies the rule correctly but holds a second Go
    copy of the 16-byte constant (minPrivateSubstringBytes).
    Python, the reference: runtime/src/contractor_runtime/redaction.py:17,92-140 (exact match,
    long values longest first since V311-001). No shared fixture covers text matching today;
    api/testdata/v1alpha1/agent-card-secret-scan-cases.json covers only the card scan.
  provenance: >-
    git blame: redactText and NewPolicy come from a1db02a5 (V1-004), when only long deployment
    secrets were passed. 63993ab6 (V126-001, implementation_commit) added resolved allocation
    credentials, including short usernames, to the same substring policy. V311-001 fixed the rule
    in Python only (languages: [python]) and left the Go sibling.
scope:
  in:
    - "One Go definition of the secret-matching rule (16-byte constant, exact match, long values
      longest first and unique) in a package low enough for telemetry and controlplane to share;
      redactText, the Planner span filters and the Agent Card scan use it."
    - "Error codes are kept when they are identifiers without a long secret and replaced by
      tool_call_failed otherwise, never partially redacted."
    - "A shared fixture (for example api/testdata/v1alpha1/secret-matching-cases.json, declared in
      api/testdata/readers.json for go and python) with short, long, nested, prefix, overlapping,
      multibyte and exact cases, read by a Go TestShared* test and a Python test_shared_* test of
      redaction.py."
    - "A PostgreSQL regression through telemetry report persistence with a short username and a
      password that starts with it."
  out:
    - "Changing which values are secret, the redaction markers, URL redaction or sensitive-key
      handling."
    - "Report trimming and history cost (V407-020); Go secret holder formatting (V414-011)."
failure_outcomes:
  - operation: "Telemetry report normalization before persistence"
    permanent: "Unchanged: a report that fails validation after normalization is not persisted and
      the existing warning is logged; matching never introduces a new failure."
    retryable: "Not applicable; normalization is a pure function."
    ambiguous: "Not applicable."
    cancelled: "Not applicable."
    timeout: "Not applicable."
acceptance_criteria:
  - id: A1
    given: "Secrets including a 5-byte username, a 30-byte password that starts with it and a
      16-byte token"
    when: "a report with those values inside arguments, messages, stop reasons and codes is
      normalized and persisted on PostgreSQL"
    then: "long secrets are replaced wherever they occur and leave no suffix, the username is
      replaced only where it is a complete string, ordinary words and error codes are intact, and a
      code containing a long secret becomes tool_call_failed"
  - id: A2
    given: "The shared secret-matching fixture"
    when: "the Go rule and redaction.py evaluate every case"
    then: "both give the fixture's redacted text and contains verdict; the Planner span filters
      and the Agent Card scan use the same Go rule"
  - id: A3
    given: "The unfixed code at 19f7477f"
    when: "the Go fixture test and the PostgreSQL regression run"
    then: "they fail on the garbled code, the garbled word and the leaked password suffix"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/telemetry/...
      ./internal/controlplane/... ./internal/scheduler/..."
    covers: [A1, A2, A3]
  - command: "cd runtime && uv run --locked pytest -q tests/test_redaction.py tests/test_metrics.py
      tests/test_tool_call_metrics.py"
    covers: [A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> make test-wire-cross-language"
    covers: [A2]
  - command: make lint
    covers: [A1, A2, A3]
decisions:
  - >-
    D1 One Go definition: internal/secretmatch (foundation layer; MinSubstringBytes = 16, Long,
    Contains, Redact) mirrors contractor_runtime.redaction (MIN_PRIVATE_SUBSTRING_BYTES,
    substring_values, contains_private_value, redact_private_values). The two constants are pinned
    against each other by the fixture's minSubstringBytes; controlplane's second constant
    minPrivateSubstringBytes is removed. Long secrets are ordered by byte length, then byte order
    (Python sorts by code point, which is the same order for UTF-8).
  - >-
    D2 Error codes (OBS-R32): a code is kept when contracts.ValidName accepts it (the shared name
    grammar, the Runtime's SAFE_ERROR_CODE) and it contains no long secret; otherwise it becomes
    tool_call_failed. A short secret equal to a code does not replace the code: codes are Runtime
    vocabulary and the Runtime's _metric_error_code applies the same rule.
  - >-
    D3 Agent Card keys keep being scanned for long secrets only (protocol vocabulary), values by
    secretmatch.Contains, as before; only the duplicate constant and loop were folded.
  - >-
    D4 TestAllocationNormalizationTrimsRedactionExpansionOfABoundedReport relied on a 3-byte secret
    being replaced inside text. Under the rule a short secret expands text only where it is a
    complete value (a long one is never shorter than the marker), so the test now uses 75 argument
    members equal to the secret; it still proves trimming after redaction expansion.
  - >-
    Siblings: telemetry.Policy.redactText covers sanitizeMap keys and values, the Runtime stop
    reason, error messages and Scheduler RedactMessage (run_execution.go); Planner span filters
    safePlannerString and plannerRunMetadataLabelAttributes now use secretmatch.Contains; the
    Agent Card scan uses Contains and Long. grep for strings.Contains/ReplaceAll over secrets in
    internal/ (non-test) finds only secretmatch, the card-key loop over Long and normalizeCode's
    loop over Long. Python is unchanged (it is the reference) apart from the shared test.
