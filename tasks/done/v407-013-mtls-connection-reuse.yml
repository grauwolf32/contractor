  results:
  - 'A1: TestRuntimeControlClientReusesOneVerifiedConnectionUntilRelease (internal/controlplane) drives
    NewMTLSRuntimeControlClient against a TLS peer that counts verified handshakes: nine Finalize calls
    and a Release are ten requests on one handshake. TestConnectionReuseExperimentCounts/production now
    expects one connection and one handshake for SendMessage plus twenty GetTask polls through NewMTLS;
    the owned_baseline case keeps the fresh-connection behaviour and still counts 21.
    TestRuntimeAgentTransportsReuseOneVerifiedConnection counts one dial and one handshake for ten calls
    and ten for the former DisableKeepAlives client.'
  - 'A2: test_private_connections_reuse_one_verified_connection (tests/test_https.py, real TLS 1.3 peer
    with PKI from cmd/contractor-pki) sees one connection for ten mixed GET/POST exchanges and one
    connection per exchange when the peer answers Connection: close as the former transports requested.
    test_real_mtls_control_transport_registers_and_heartbeats runs registration and nine heartbeats
    through ControlClient on one connection. test_private_connections_reverify_rotated_certificates keeps
    the old connection while the peer presents a renewed certificate, verifies the renewed one after the
    idle bound and after the 5 minute lifetime (virtual clock, calls every 29 s keep the connection
    active), rejects an agent-role certificate and a foreign CA before any request byte reaches the peer,
    and accepts the expected identity again. TestRuntimeAgentTransportsReverifyRotatedCertificatesAfterLifetime
    and the controlplane test do the same on the Server side (same-key renewal accepted, other key or CA
    rejected before request bytes).'
  - 'A3: Go: capacity eviction (300 principals keep 256, least recently used evicted), idle eviction,
    Evict and Release close one principal, twelve concurrent requests use at most 8 connections with at
    most 2 idle and no cross-talk, a cancelled request closes its connection, Close ends every connection
    and later calls fail with no dial, a POST whose connection drops after the peer read it is delivered
    exactly once, and requests with Idempotency-Key, X-Idempotency-Key or Connection headers are refused
    before any byte. TestNewMTLSClosesConnectionsOfACancelledInvocation cancels a production Invoke
    during a poll: SendMessage 1, GetTask 3, CancelTask 1, two connections, all closed before Invoke
    returns. Python: unframed, HTTP/1.0, Connection: close (also inside a token list) and unsolicited-byte
    responses are never reused; twelve concurrent exchanges stay within 8 connections, each gets its own
    body and idle connections drop to 2; a cancelled exchange closes its connection and is not repeated; a
    POST without response on a reused connection raises and is delivered once, a GET in the same case is
    resent once on a new connection and a GET on a new connection is not resent; the fifth origin evicts
    the oldest; aclose closes everything and later exchanges fail without connecting.'
  - 'A4: Error classes are unchanged (transport tests in test_control_transport.py and test_artifacts.py
    keep their expectations; an empty response is HTTPResponseNotStartedError, a subclass of
    HTTPResponseError); request timeouts still cover the whole exchange including waiting for a
    connection; existing private wire fixtures are untouched. The handshake counts above distinguish the
    former behaviour (10 or 21 handshakes against 1).'
  - 'Siblings (internal/ Transports): internal/gitimport/client.go:397 builds one Transport per import
    and closes it through the returned cleanup (per-operation owner, public Git hosts, not private mTLS);
    internal/credentials/litellm/manager.go:90 is one bounded process-level Transport (MaxConnsPerHost 8,
    idle 30 s); internal/telemetry/planner_otlp.go:64 one per adapter, closed by Close;
    internal/publicclient/client.go:115 the CLI client clone of DefaultTransport. None reaches a Runtime
    Agent and none is changed. The two Runtime-facing clients (control client, A2A invoker) are the
    only users of BindRuntimeAgentPrincipal and now go through RuntimeAgentTransports.'
  - 'Review follow-up (cfecd2db, on top of 815a4a5e): the Runtime treated an interim 1xx head as final,
    so a framed 103 left the real response pending on a pooled connection and the next exchange returned
    it (the reviewer probe confirmed the second GET returned /first), and an unframed 103 from the Go
    Server waited for EOF until the timeout. The Runtime now skips at most five interim heads, refuses
    101, never pools after a 1xx and rejects a 204/304 that declares content.
    test_private_connections_skip_interim_responses_and_never_reuse_after_them (unframed 103, framed 103
    sent apart from the final response, 100 then 103, five interim heads) and
    test_private_connections_reject_switching_and_content_on_empty_responses cover it; the reviewer probe
    now returns /first, /second, /third on two connections. A GET is resent only when no response byte
    arrived (ConnectionReader counts received bytes): test_private_connections_resend_a_read_only_when_no_response_byte_arrived
    resends after a reset with no byte and raises after a reset following a partial head. Waiters of an
    evicted origin still run on unpooled connections (test_private_connections_serve_waiters_of_an_evicted_origin).
    Server Evict, Close and lifetime retirement close idle connections at once even with a request in
    flight (TestRuntimeAgentTransportsCloseIdleConnectionsAtOnceWhileOthersAreInFlight, Evict and Close).
    Each new test fails against a mutant that restores the old behaviour. LIM-CTL-16 records the
    transient doubling while a retired transport or evicted origin finishes, and LIM-CTL-14/15 and
    LIFE-CTL-5 state that the Runtime closes an expired idle connection at its next exchange to that
    origin, at shutdown or when the listener closes it. Reruns after the fix: go test -race -count=1
    ./internal/controlplane/... ./internal/planner/a2a/... ./internal/mtls/... ./internal/app/... pass;
    go test -race -count=10 ./internal/mtls/ pass; go test -tags integration ./internal/controlplane/
    ./internal/httpapi/privateartifacts/ pass; the task pytest command plus test_control_transport.py,
    test_gateway_recovery.py and test_server_mtls.py pass (test_https.py 85 tests); make
    test-wire-cross-language pass; make lint pass. make test-e2e and the full Runtime suite were not
    rerun after the follow-up.'
  - 'Spec: CTL-R163 to CTL-R166 (docs/spec/execution/control-plane.md, Private connection reuse),
