schema_version: '1.0'
id: V407-013
title: Reuse verified private TLS connections with bounded lifecycle ownership
milestone: server-runtime-review-2026-10
epic: execution-core
kind: chore
introduced_by: V8-004
priority: P2
status: completed
implementation_commit: cfecd2db7a8a724dc19528ddbce4f80ba556ea1c
depends_on: []
languages:
- go
- python
goal: Avoid repeated private TLS setup while preserving peer authentication, request deadlines, failure
  classification and bounded cleanup.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/control-plane.md
  finding: 'internal/controlplane/runtime_client.go:438-453 constructs a bound Transport for each control
    call with DisableKeepAlives=true. planner/a2a/client.go:133-144 constructs one per invocation, also
    with keep-alive disabled, so subsequent task polls open new connections. Runtime _https.py:136-156
    opens and closes a TLS stream for each private call; artifacts.py:465 and control_client.py:170 send
    Connection: close. This confirms repeated connection setup, not an idle-connection leak or a measured
    throughput loss.'
  validation: Validated against main dc7012e8 on 2026-10-23. The connection paths and 100ms configured
    A2A polling default were verified. Ten handshakes per second is only an approximate upper polling
    rate for fast pending responses; actual latency includes request time. Authentication is checked before
    request bytes, and this guarantee must remain true on every new connection.
  siblings: Inventory other per-request Transports in internal/ and classify their ownership separately.
    Cover control requests, A2A polling/cancellation, artifact read/write/list and Runtime control calls
    without changing their retry/idempotency rules.
plan:
- Give Server private clients bounded reusable transports keyed by all values that affect endpoint/principal/TLS
  authentication. Define cache capacity, idle lifetime, concurrent connection limits and close/eviction
  ownership; keep request deadlines on individual contexts.
- Give Runtime private transports bounded reusable verified connections or a bounded pool appropriate
  to concurrent calls. Preserve the strict HTTP parser, complete body framing and verification before
  the first byte on each new connection.
- Close unusable connections on malformed/incomplete responses and cancellation; do not blindly replay
  an ambiguous mutation when a reused connection fails. Preserve existing request keys and caller-owned
  reconciliation.
- Document connection ownership and invalidation for principal deletion, endpoint/config changes, credential
  rotation and shutdown. A valid certificate rotation for the same authenticated identity is not itself
  a rejection condition.
- Count handshakes across sequential successful calls, synchronize concurrent/cancelled operations, and
  test wrong-principal or untrusted certificates on reconnect plus valid rotation and bounded eviction.
scope:
  in:
  - Bounded authenticated connection reuse in Server control/A2A clients and Runtime private transports.
  - Lifecycle, failure and handshake-count tests with existing request semantics.
  out:
  - Changing polling intervals, protocol fields, trust policy, certificate identity rules or mutation
    retry semantics.
acceptance_criteria:
- id: A1
  text: Ten sequential successful control calls and ten task polls on an unchanged healthy peer reuse
    their connection; deterministic server counters observe one handshake for each tested connection owner.
- id: A2
  text: Ten sequential Runtime private exchanges reuse a verified connection; reconnect rejects an untrusted
    or wrong-principal peer before sending request bytes and accepts a valid certificate for the expected
    identity.
- id: A3
  text: Tests cover bounded cache/connection counts, principal or endpoint invalidation, concurrent requests,
    cancellation and shutdown without response cross-talk, leaked clients or automatic replay of ambiguous
    writes.
- id: A4
  text: Existing error classification, request timeouts and private wire fixtures remain unchanged; handshake-count
    assertions distinguish the old fresh-connection behavior.
tests:
- command: go test -count=1 ./internal/controlplane/... ./internal/planner/a2a/... ./internal/mtls/...
  covers:
  - A1
  - A3
  - A4
- command: cd runtime && uv run --locked pytest -q tests/test_https.py tests/test_artifacts.py tests/test_control_client.py
  covers:
  - A2
  - A3
  - A4
- command: make test-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
