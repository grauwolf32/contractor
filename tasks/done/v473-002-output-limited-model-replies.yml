  - "make test-runtime passed 6330 cases with 135 declared skips. The separate focused recovery tests also passed after the final exception and prompt formatting changes."
  - "make test-wire-cross-language passed 397 fixtures with 447 Go and 283 Python shared tests. One explicitly optional heavy I/O case skipped and is not passing coverage."
  - "Full Streamline and Router suites passed with disposable PostgreSQL. The focused race test passed empty/length combinations, hard budgets, invalid follow-ups and cancellation with retained known usage."
  - "make lint passed. Runtime verification used the pinned ffuf 2.3.0 source built with the release version flags in an owned temporary tool directory."
  - "The configured model and per-response ceiling were inspected in scripted requests. Integration evidence does not measure live-model recovery yield."
