  replan_history: Deferred on 2026-09-20 outside the delivered OpenAPI/preparation slice; the original
    deferral record is preserved. The 2026-10-24 review at b523ae77 confirmed that this iterative capability
    was still absent. The initial proposal 0045 plan retained deferral; the user subsequently queued this reviewed task as pending. Completed
    V62 preparation/API/UI/release tasks and their original milestone remain unchanged.
  ownership: Generic iterative Audit composition owns these contracts. V64-001 defines research contracts,
    V64-003 owns opt-in research lifecycle, V64-004 consumes exact context, V64-006 owns the base research-to-ordinary-AuditItem
    adapter, and V64-018 adds only its pentest specialization. These are consumers, not dependencies of
    generic V62.
  boundary: V62-004 provides preparation/inventory foundations. V410-010 owns common history retention;
    this task registers its new snapshot and selected-result holders through that mechanism. A consistent
    public Audit detail read is not a settled-Round snapshot.
scope:
  in:
  - Define the versioned round-results manifest/page contract, exact result selection, review revision
    pinning, source classification and finite collection/byte bounds.
  - Construct complete canonical snapshots from settled item, execution/receipt, coverage/gap, finding
    and accepted result-attachment descriptors; include explicit absence and technical failures.
  - Wire snapshot construction and round-results materialization into the production assessment dispatch
    path in this task, with declared profile binding validation and real-process fixture consumers.
  - Retain and enumerate exact required sources before publication, materialize only authorized declared
    inputs and preserve original-to-consumer refs/digests.
  - Recover interrupted page construction and publication under existing Audit ownership and keyed mutation/collection
    semantics; integrate holders with eviction and purge.
  - 'Implement the Audit-owned exact-page materializer and its durable source-to-Run closure: one declared
    bounded round-results input descriptor points to authorized exact Run-local pages, without one Workflow
    mapping per page or generic recursive input handling.'
  out:
  - Hypothesis registry, interpretation of research assessment payloads, ranking, selective research prompts
    or a new execution phase; future V64 consumers own these.
  - Arbitrary Project access, model-issued human decisions, live mutable state during assessment or changing
    default deterministic profiles to require snapshots.
  - Recursive generic Run-creation dereferencing, arbitrary cross-Run reads, one Workflow input mapping
    per snapshot page, or a new broad Project/Artifact access grant.
deliverables:
- path: internal/auditdomain
  description: Canonical snapshot manifest/page contracts and strict shared fixtures.
- path: internal/auditservice
  description: Production source capture, exact retention and Audit-owned bounded page-closure materialization
    into a single declared consumer descriptor plus Run-local artifacts.
- path: internal/auditcontroller
  description: Declared assessment snapshot barrier and actual dispatch integration.
- path: internal/auditstore
  description: Indexed source/page reads, accepted snapshot identity and purge integration.
- path: docs/spec/audits/scans.md
  description: Owning round-results mappings and limits, with related lifecycle/error registry updates.
- path: tests/e2e
  description: Real assessment consumer fixture, more-than-128-page retrieval, input-fence and snapshot
    recovery assertions in the Audit composition gate.
acceptance_criteria:
- id: A1
  given: A settled multi-batch Round with retry, supported and inconclusive results, failures, cancellation
    and accepted typed attachments
  when: The declared assessment role consumes round-results through the real controller
  then: Every item appears once with the exact selected attempt/receipt or explicit absence; attachment
    descriptors remain attributable and no research semantics or finding confirmation are invented.
- id: A2
  given: Concurrent analyst revisions and interrupted page construction
  when: Snapshot capture resumes or publication races another controller
  then: One coherent accepted source/review generation and complete manifest is consumed; incomplete or
    mixed-generation pages cannot dispatch an assessment.
- id: A3
  given: The admitted Round ceiling, a 100,000-item containing Audit and metadata near each byte bound
  when: Snapshot pages and dependencies are built with deterministic work counters
  then: Only selected indexed rows are examined within per-slice/DescribeExact limits; oversize snapshots
    fail explicitly without truncation and exact authorized Run input mappings are preserved.
- id: A4
  given: Protected exact sources, concurrent eviction, deleted producer Runs and lost fork/publication
    replies
  when: The assessment is prepared, replayed, cancelled and the populated Audit is later deleted
  then: Exactly the retained source bytes remain readable or an explicit unavailable outcome occurs; no
    latest fallback, duplicate child/evidence debit or orphan holder remains after purge.
- id: A5
  given: Direct Runs and deterministic Audit profiles without round-results consumers
  when: Ordinary execution, retry, cancel and completion paths run
  then: No snapshot phase or research requirement is introduced and original item membership, coverage
    and terminal behavior are preserved.
- id: A6
  given: A valid settled snapshot with more than 128 pages, bounded to the 256-page/byte ceilings, one
    declared round-results Workflow input and a reader with only ordinary Run-scoped artifact access
  when: The actual Audit materializer initializes the child, recovers a lost fork acknowledgement and
    the real assessment consumer follows the supplied exact local page refs
  then: Every required page is usable through ordinary Run-local reads with correct source/digest attribution,
    one declared input mapping and bounded work. No extra per-page Workflow mappings, implicit recursive
    Run-creation dereference, live/cross-Run reads or partially schedulable input state occurs; missing/denied
    page closure fails explicitly.
