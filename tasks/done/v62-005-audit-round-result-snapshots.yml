test_prerequisites:
- Disposable PostgreSQL is mandatory for store cases. Set CONTRACTOR_TEST_DATABASE_URL; absent or unreachable
  required infrastructure, skipped mandatory cases and zero matched tests fail the dedicated gate.
- Tests use isolated testdata, not the live configs tree. Process cases use actual Server/Runtime and
  scripted local model/provider fixtures; no paid models or live targets are needed.
- Run the complete suites of every touched package. Shared schema changes update every reader, owning
  numbered specifications, limit/error/lifecycle registries and cross-language fixtures in the same implementation
  change.
verification_requirements:
- Use PostgreSQL and actual production dispatch/fork readers, compare exact source and consumer refs/digests
  and inject capture/publication faults. Fakes and summary-count-only assertions are insufficient.
- V62-013 adds the combined iterative release gate; this task must already wire its production writer
  and assessment reader and execute its focused process cases.
- The process gate must retrieve and inspect content from more than 128 actual Run-local pages using the
  normal scoped Artifact tools. Counting a manifest or checking that forks exist is insufficient; inspect
  input mapping count, exact local refs and the no-allocation-before-complete-closure fence.
requirements:
- id: R1
  text: A snapshot covers every accepted item of exactly one settled Round once, ordered by immutable
    item identity/ordinal. Pin selected accepted attempt/result and exact collection receipt, or an explicit
    failed, cancelled, blocked or missing-result outcome. Run success alone never establishes an assessment.
- id: R2
  text: Capture a coherent source/review generation, then construct bounded immutable pages from indexed
    reads. Check generation before accepted publication; concurrent relevant review changes cannot mix
    revisions. A complete manifest names all pages, counts, digests and source watermark. Incomplete pages
    are never a consumable snapshot.
- id: R3
  text: Preserve typed accepted attachment descriptors, exact evidence provenance and conservative source
    classification without interpreting unknown research schemas. A source descriptor is not an access
    grant; the authorized consumer projection must filter prohibited source-derived material before model-visible
    metadata or content.
- id: R4
  text: Acquire legitimate exact holds before sources can disappear, atomically against V410-010 eviction.
    Register snapshot pages, selected dependencies and pending/accepted snapshot holders in the owning
    inventory. Reuse Audit retained bindings and existing lifecycle machinery, not another hold or receipt
    table.
- id: R5
  text: 'Profile/config validation and the actual assessment dispatch reader ship together. One declared
    round-results Workflow input carries a bounded consumer descriptor. Before the Run becomes schedulable,
    the Audit-owned materializer validates the exact accepted page closure, acquires its legitimate holds
    and forks authorized pages/required dependencies into a trusted controller-owned Run-local artifact
    namespace through existing ArtifactStore capabilities. The materializer derives a consumer descriptor
    with rewritten exact Run-local refs and explicit original-to-retained-to-consumer mappings/digests;
    it never rewrites the accepted source snapshot. Pages are ordinary Run-local artifacts readable through
    the existing scoped Artifact tools, not additional Workflow input slots. Generic Run creation keeps
    ART-R80: it neither follows JSON refs nor creates these domain-specific forks.'
- id: R6
  text: Keep direct Runs and deterministic Audits without a round-results consumer on their existing paths.
    Freeze complete snapshots only for declared consumers; future V64-004 may select a bounded projection
    but cannot relabel that subset as the complete Round.
- id: R7
  text: Normalize the cardinality values below into one owning limit definition/shared fixtures before
    implementation. Failed schema/limit validation publishes no accepted snapshot; retry and source retention
    accounting cannot repeat target work or double-charge evidence.
- id: R8
  text: Persist exact materialization intent/progress using existing child-Run/Audit identities and receipt
    mechanisms; stage bounded page/fork work behind the existing non-schedulable input-initialization
    fence. Only the complete validated consumer closure and descriptor make the Run schedulable. Required
    page refs always resolve locally; provenance-only or omitted evidence refs grant no read authority.
    The explicit closure holder registration protects required Run-local revisions, including JSON-backed
    refs, until the existing Run/Audit lifecycle releases them. Replayed materialization reuses exact
    source/page identities and cannot expose partial input or silently refresh a page.
failure_outcomes:
- operation: Capture, page and publish a settled-Round snapshot
  permanent: Unsettled membership, invalid trusted payload, missing required exact source or exceeded
    hard bound produces an explicit blocked/collection-contract-invalid outcome under the owning Audit
    contract; never an empty or partial successful snapshot. No new HTTP endpoint is introduced.
  retryable: Existing bounded storage_transaction_conflict/503 retries retain the same source generation
    and operation identity; shared artifact_history_maintenance_pending obeys V410-010 at most three caller
    attempts within the original deadline.
  ambiguous: Reconcile existing keyed mutation/accepted snapshot publication identity and exact page digests.
    Reuse committed pages only under the same source generation; a lost reply does not append duplicate
    accepted snapshots.
  cancelled: Audit owner fences new work, joins in-flight storage/fork work and follows existing drain;
    accepted snapshots stay immutable and unaccepted construction state has bounded lifecycle cleanup.
  timeout: Existing finite snapshot construction/collection attempt allowance bounds bookkeeping independently
    of target request time; leave explicit resumable progress or a classified terminal outcome, never
    poll forever.
- operation: Materialize round-results into an assessment Run
  permanent: Foreign, denied, missing, corrupt or media-incompatible exact sources fail declared input
    preparation without latest substitution; protected-history conflict is permanent.
  retryable: Use ordinary bounded exact-fork/storage recovery within the input preparation deadline; do
    not restart a target check to recover context.
  ambiguous: Reconcile exact accepted source/page closure, durable materialization progress, consumer
    descriptor and existing child-Run intent. Resume only missing exact forks under the same identity;
    no duplicate child, changed source revision or partially schedulable Run.
  cancelled: Join materialization before allocation/owner cleanup; incomplete child input state remains
    non-schedulable and purges through its existing Run lifecycle. Accepted Audit source holds survive
    normal drain and do not become authority for a cancelled allocation.
  timeout: Run input preparation/materialization owns its deadline separately from snapshot capture and
    assessment execution.
cardinality:
- collection: Round members inside the containing Audit
  expected: Tens to hundreds of items; many settled historical Rounds may belong to the same Audit.
  maximum: Existing LIM-AUX-10 maximum 4,096 admitted inventory items, tighter pinned per-Round/remaining-total
    limits, and LIM-AUD-25 maximum 100,000 Audit items.
  bound: Read only the selected Round by indexed keyset pages of at most 128 item/receipt/review descriptors
    and 256 KiB encoded metadata; dependency descriptor work is separately included in each transaction
    budget, never an N+1 whole-Audit scan.
- collection: Snapshot manifest/pages and explicit dependencies
  expected: One manifest and a few pages, with evidence payloads outside metadata pages.
  maximum: Proposed source root manifest and consumer descriptor each at most 256 KiB, each page at most
    256 KiB, at most 256 pages; total retained snapshot metadata including manifests/descriptors remains
    at most 64 MiB, with tighter maxEvidenceBytes and artifact/input bounds applying. The one declared
    descriptor consumes one Workflow mapping; pages do not consume extra mapping slots.
  bound: At most 128 primary records, 512 total related descriptors and 1 MiB metadata per transaction/tick
    slice; DescribeExact at most 32 refs per statement. Materialize page closure in bounded batches under
    the non-schedulable input fence, and read exact Run-local pages through existing tool byte/page limits.
    Existing RunScope insert/history limits still apply. Complete results that cannot fit fail explicitly
    without silent truncation, extra Workflow mappings or larger unbounded transactions.
- collection: Unaccepted snapshot progress and exact retention
  expected: One construction generation for the owning Round.
  maximum: One accepted immutable snapshot for the captured source/review generation and bounded staged
    pages under the same page/byte ceilings.
  bound: Reuse current Audit claims and bounded cleanup; obsolete generations are not retained without
    a reader. Existing maxEvidenceBytes charges distinct retained revisions once and existing ArtifactStore
    history admission remains authoritative.
lifecycle:
- entity: Pending and accepted settled-Round snapshot
  delete: Owning Audit deletion after drain removes its snapshot records and bindings; ordinary source
    Run deletion cannot delete held accepted sources.
  cascade: Register every new row/ref holder in Audit purge, including incomplete page construction. Release
    only the owning lifecycle obligation; preserve independently retained versions.
  retention: No new TTL. Accepted snapshot bytes and included review/result pins remain stable for the
    Audit lifetime; later reviews cannot rewrite them. Unaccepted pages never confer availability to consumers.
- entity: Consumer descriptor, Run-local snapshot pages and materialization progress
  delete: Existing child Run deletion/cancellation cleanup owns incomplete and complete Run-local copies;
    the materializer cannot make a partially initialized Run runnable.
  cascade: Register page-closure holders and source-to-child mappings with the existing Run/Audit cleanup
    paths. Run-local forks purge with the Run; source snapshots remain under their independent Audit retention.
  retention: The accepted source snapshot stays immutable. A derived consumer descriptor pins exact local
    page revisions, protected through registered authoritative closure holders; a bare JSON mention is
    not a hold or a cross-scope access grant.

implementation_notes:
- Source capture seals a coherent complete item/review generation before immutable Artifact publication; later reviews do not rewrite that seal.
- Construction keeps bounded source pages on the Round and one indexed next-page read. Publication verifies protected frozen exact bytes and drops the duplicate staging payload atomically.
- The Audit-owned consumer materializer is integrated by the coordinator through the ordinary initializing child fence; generic Run creation does not traverse JSON.
