schema_version: "1.0"
id: V371-022
title: "Remove the 10 ms probe budget from the capability discovery tests"
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
priority: P3
status: completed
implementation_commit: 9376d5d0a9877b4aa05450fe74a1354a3d96d0c2
depends_on: []
languages: [python]
goal: "The capability discovery tests that need a probe to time out make only that probe hang and give every other factory a budget machine load cannot exhaust."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G2), recorded 2026-10-12; verified on a07f5e9"
  revalidated: >-
    2026-10-24 on b523ae77: both tests still pass per_factory_timeout_seconds=0.01;
    line numbers moved and are updated. discover_capabilities still applies one
    per-factory budget to every probe (capabilities.py:134-272, _probe_one at
    :309-339). No V407/V409/V414 task covers it.
  finding: >-
    test_runtime_adapter_probe_timeout_is_omitted
    (runtime/tests/test_capabilities.py:421-438) calls discover_capabilities
    with per_factory_timeout_seconds=0.01 (:432), and the budget applies to
    every factory, not only the hanging RuntimeAdapter: the stub WorkerRuntime
    and the LocalWorkdirFactory probe must each finish within 10 ms
    (_probe_one, runtime/src/contractor_runtime/capabilities.py:309-339,
    timeout = min(per_factory_timeout_seconds, remaining)), or
    discover_capabilities omits them and CapabilitySnapshot.create raises
    "no usable WorkerRuntime capability" or "no usable SandboxProfile
    capability" (capabilities.py:79-82). It failed once under load
    (AGENTS.md 3.5). Predates the shallow history (boundary 6349621).
  siblings: >-
    test_optional_probe_timeout_and_failure_are_omitted_without_leaking_details
    (test_capabilities.py:297-332, budget at :320) uses the same 10 ms budget
    with passing factories (adk@1, local-workdir@1, http-proxy@1) and the same
    risk. The only other discover_capabilities call with an explicit budget
    in test_capabilities.py (:558) uses total_timeout_seconds=30 and the
    default per-factory budget, and stays. test_podman_capabilities.py:302
    passes podman_timeout_seconds=0.1 on purpose to test the cleanup reserve
    and stays. V341-001 (in progress) owns the production probe timeouts.
scope:
  in:
    - "Give the non-hanging factories a generous budget and end the hanging probe deterministically (for example a per-factory budget seam the test sets for that probe only, or a hanging probe the test cancels or releases), in both tests."
  out:
    - "Production probe timeouts and discovery behaviour."
acceptance_criteria:
  - id: A1
    given: "A loaded host (both tests repeated 50 times with parallel CPU load)"
    when: "They run"
    then: "They pass."
  - id: A2
    text: "Each test still fails if a hanging probe is not omitted or a passing factory is dropped; the change is checked by making the hanging probe return once and seeing the test fail."
tests:
  - command: "cd runtime && for i in $(seq 50); do uv run --locked pytest -q tests/test_capabilities.py -k 'probe_timeout' || exit 1; done"
    covers: [A1, A2]
  - command: "cd runtime && uv run --locked pytest tests/test_capabilities.py"
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2]
