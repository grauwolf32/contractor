schema_version: '1.0'
id: V64-008
title: Expose Audit tasks check results findings and selected materials
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P1
status: completed
depends_on:
- V64-012
- V64-013
- V64-034
- V411-010
languages:
- go
- typescript
- json
- yaml
- markdown
goal: The ordinary public API and CLI can inspect the research chain, control the Audit and select/publish
  retained materials without formal review resources.
demonstration: An API/CLI caller starts and pauses/resumes a program, reads ordinary task/check outputs
  and hypothesis history separately from Project problem findings with their sources, then publishes an
  exact material.
context:
  authority: 'User assignment on 2026-11-06: implement V64-008 from current main,
    explicitly using common-contract.md and hypotheses.md as normative inputs.
    User direction on 2026-11-05: API coverage follows proposal 0054 and V64-034; distinguish
    proposal output from registered hypotheses and expose exact selected grounds without a
    numbered-slot contract. That earlier task-formation update started no implementation.
    User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. User decision on 2026-11-01 rejects parallel
    Audit/Project Finding models: V64-014 supplies one Project identity/current state and its existing
    read/edit callers; this task reuses that owner rather than adding another Finding lifecycle.'
  implementation_gate: Assigned by the user on 2026-11-06; all dependencies are completed
    and integrated into main. Implement on codex/audit-api-cli from b84f7f672.
    Demo deployment and dependent tasks remain unassigned.
  design:
  - docs/proposals/0054-workflow-hypothesis-production.md
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/common-contract.md
  - docs/spec/audits/hypotheses.md
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/findings/findings.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  - docs/spec/api/public-api.md
  - api/openapi/contractor-public-v1.yaml
  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  boundary_decision: >-
    V64-008 uses existing accepted artifact links and execution membership for bounded material
    and Task-attempt reads. A link ordinal is internal pagination metadata: the 512-byte logical
    key cannot safely fit in the existing 512-byte signed cursor. An indexed ordinal preserves
    both bounds without offset scans or a new receipt store. The old Round items/coverage routes
    and their exclusive response consumers are removed; workspace reads persisted Task/Run
    counters only. Hypothesis pages and exact Task results own semantic coverage, and Project
    Findings retain their existing source/history owner. Reopen only if a real caller needs an
    additional semantic summary with a separately specified bounded implementation.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
scope:
  in:
  - Complete only public/CLI fields and operations needed by the real base scenario beyond V64-002 minimal
    endpoints.
  - Expose bounded exact task/hypothesis/finding/provenance/coverage/result reads and Artifact publication
    with existing owner/CAS/idempotency rules.
  - Derive automatic links from stored context. Source Audit/Hypothesis links stay readable after permitted
    source cleanup through retained provenance.
  - Update OpenAPI, both generated clients, public errors/events and actual CLI consumers together; remove
    superseded review/source-mapping operations end to end.
  out:
  - A second research API, generic graph endpoints, broad cross-Project grants or manual identity/revision
    fields in model-facing result commands.
  - Changing user model configuration or deploying/migrating the demo.
requirements:
- id: R1
  text: Every list follows existing pagination/byte bounds, including complete source-contribution traversal;
    all PostgreSQL handlers document existing retryable storage conflicts.
- id: R2
  text: Stale edits/publication never overwrite newer data. Read-only live views and retained snapshots
    remain explicitly different.
- id: R3
  text: Credentials and allocation/internal details retain existing visibility and secret rules. Public
    result/history reads retain supported/refuted/inconclusive and tested conditions; findings lists contain
    evidenced problems. A completed Run does not imply a supported hypothesis, and a refuted bug claim
    does not require a finding.
failure_outcomes:
- operation: Expose owner-authorized research commands and paginated reads
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Expose owner-authorized research commands and paginated reads
  expected: 'Base fixture: 2 ordinary Runs, 2 seeded hypotheses, 1 generated hypothesis and several conclusions.'
  maximum: Keep applicable published LIM-AUD/LIM-FND ceilings unless proposal 0050 explicitly identifies
    a reviewed change; no new full-pool work.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: the real base Audit and Project
  when: public API and CLI traverse the chain
  then: all pages, exact outputs, negative/inconclusive check history and automatic associations are accessible
    under owner authorization separately from optional Project problem findings; proposal output and
    accepted hypotheses are distinguishable, and each hypothesis exposes exact selected grounds separately
    from origin, including authorized materials selected during its producer Run
- id: A2
  given: stale revisions, foreign owners and lost mutation replies
  when: the same operations run
  then: classified errors/replay preserve identity and do not repeat execution or broaden access
- id: A3
  given: OpenAPI/events and both generated clients
  when: verification runs
  then: all real endpoint callers and deleted routes agree with one strict contract
tests:
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/httpapi/public/... ./internal/publicclient/...
    ./internal/cli ./internal/auditdomain ./internal/auditservice ./internal/artifacts/... ./internal/auditstore/...
    ./internal/persistence/... ./internal/auditcontroller
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api verify-public-api-postgres
  covers:
  - A1
  - A2
  - A3
- command: make ui-verify
  covers:
  - A1
  - A2
  - A3
- command: >-
    node --input-type=module -e "import {runBrowserGate} from './ui/server/browser-gate.mjs';
    await runBrowserGate('audit-research', 'Audit research',
    ['e2e/audit-hypotheses.spec.ts', 'e2e/audit-research.spec.ts'])"
  covers: [A3]
- command: make lint
test_prerequisites:
- Listed commands are required implementation acceptance; results are recorded after execution.
- Use disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; configured/unavailable DB or mandatory
  skips fail. A focused selector matching zero tests fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Run whole touched-package
  suites and required release selectors.
- Create and register any named future gate in this task before claiming it ran. Use deterministic clocks/work
  counters; live model quality is outside deterministic acceptance.
verification_requirements:
- Update OpenAPI and both generated clients for public changes; shared wire fixtures cover every changed
  cross-language rule.
- Classify new packages in the layer registry and register relation ownership/ERD changes; preserve downward
  dependencies and strict reads/writes.
- Delete the replaced vertical path and its exclusive schemas/states/tests as its callers migrate. Final
  V64-011 proves no parallel legacy pipeline remains.
verification:
  date: '2026-11-06'
  environment: >-
    Go 1.26.9, Node 24.20.0, pnpm 11.24.0 and an owned disposable PostgreSQL
    database over TCP. GOFLAGS=-p=2 bounds parallel Go package builds;
    VITEST_MAX_WORKERS=4 bounds UI workers without changing assertions or timeouts.
  passed:
  - make require-database
  - go test -tags=integration -count=1 ./internal/httpapi/public/... ./internal/publicclient/...
      ./internal/cli ./internal/auditdomain ./internal/auditservice ./internal/artifacts/...
      ./internal/auditstore/... ./internal/persistence/... ./internal/auditcontroller
  - make verify-public-api verify-public-api-postgres
  - make ui-verify
  - >-
      node --input-type=module -e "import {runBrowserGate} from './ui/server/browser-gate.mjs';
      await runBrowserGate('audit-research', 'Audit research',
      ['e2e/audit-hypotheses.spec.ts', 'e2e/audit-research.spec.ts'])"
  - make lint
  evidence:
  - >-
    A real CLI process against HTTP/PostgreSQL creates and controls an Audit,
    replays a lost Task acknowledgement without duplicate work, traverses Tasks
    and hypotheses, reads accepted attempts/materials and publishes an exact material.
    Authorization, stale revisions and retired routes have regression coverage.
  - >-
    Real-store material traversal visits 5000 links with 512-byte logical keys
    without loss or duplication; custom and generic plans use bounded indexed seeks.
    Migration 11-to-12 preserves existing links and backfills unique seek positions.
  - >-
    Generated hypotheses retain exact grounds separately from origin after the
    producer Run is deleted; accepted materials remain readable and explicit
    Project publication survives Audit purge. Existing HG-R6/R8/R12/R15/R16
    requirements remain normative; ACT-R15 now defines the added read operations.
  - >-
    UI verification passes 211 files and 2412 tests with one pre-existing expected
    failure. Four focused browser tests pass, including hypothesis revision
    conflicts and common coordination at 320/390/1440 pixels in light/dark/black.
  additional_gate:
    command: make ui-browser-mocked
    result: >-
      The broader optional run reported 140 passing and 17 failing cases. Its
      invalid new Studio Live fixture was corrected and passed the focused rerun.
      Sixteen existing contract/selector failures are recorded in V450-001;
      the complete browser gate has not subsequently passed and is not claimed green.
  not_run: >-
    Full release-verify and live-model checks were not run. Optional disk-heavy
    fixtures stayed disabled; their skips are not passing coverage.
