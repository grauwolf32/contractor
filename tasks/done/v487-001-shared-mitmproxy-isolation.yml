      socket pairs, pidfd_open)'
    : 94
    explicit real-rootless startup capability gate: 2
    explicit real-rootless deployment/workflow gate: 1
    explicit real-rootless command execution gate: 12
    explicit real-rootless owner-process gate: 3
    explicit real Podman release gate: 5
    'explicit real gate: make test-podman-supervisor': 11
  environment: Used Go 1.26.10, Node 24.20.0 and provisioned ffuf 2.3.0 on PATH. Initial attempts exposed
    missing Go and unsupported Homebrew ffuf 2.1.0-dev; corrected the lane PATH, all 18 ffuf cases and
    the final full Runtime gate passed. Heavy-I/O remained opt-in and disabled. No test database was created.
  delivery: Experiment and grouping are on codex/runtime-multislot-proposal. Group 2 and group 3 remain
