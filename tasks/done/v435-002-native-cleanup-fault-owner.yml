schema_version: "1.0"
id: V435-002
title: Inject the native release cleanup fault at its current owner
milestone: runtime-ownership-2026-11
epic: execution-core
kind: chore
introduced_by: V432-006
priority: P1
status: completed
implementation_commit: 8025296489dba8fb0c2c4aac9c350d1bf908be16
depends_on: [V432-006]
languages: [python]
goal: >-
  The existing native ADK process test actually fails the first release cache
  cleanup and verifies fencing and successful release retry after the owner split.
context:
  integration_note: Renumbered from V434-002 during the 2026-11-02 user-requested main merge because newer main already used that ID for Audit integration work.
  finding: >-
    runtime/tests/fakes/adk_process_faults.py:199 patches
    allocation.service.release_adk_tool_caches, but normal release now calls the
    independent import in allocation.cleanup. Consequently
    TestCrossLanguageMTLSAllocationLifecycleNativeADKFaults/native_cleanup_failure_fences_until_release
    fails at runtime_native_faults_integration_test.go:640 with cleanup failure = nil.
    Reproduced twice while verifying V435-001; none of those production cleanup
    files were changed by the label removal.
  siblings: >-
    Keep failed preparation cleanup in allocation.service unchanged. The fault
    scenario exercises normal release, whose owner is allocation.cleanup. Other
    native fault modes retain their existing behavior and run in the full suite.
  authority: >-
    Agent-proposed minimal test-only verification prerequisite for the user-authorized
    2026-11-02 removal of Runtime startup label assignments. No cleanup production
    behavior changes or supporting subsystem work is included.
  verification: >-
    The complete Control Plane integration suite passed in 42.928s after the
    fault-owner correction and again in 61.451s in the final combined integration
    run. Both Ruff check and format checks passed for the changed fault fixture.
scope:
  in:
    - Patch the existing fault scenario's cache cleanup symbol in allocation.cleanup.
    - Verify the failed first release, fencing and successful retry through real mTLS processes.
  out:
    - Production cleanup behavior, deadlines, allocation ownership or Runtime shutdown changes.
acceptance_criteria:
  - id: A1
    text: The native cleanup fault scenario returns allocation_cleanup_failed on its first release, fences the slot, and completes the existing retry assertions.
  - id: A2
    text: The full Control Plane integration suite and Runtime lint pass with all sibling fault modes preserved.
tests:
  - command: "go test -tags=integration -count=1 ./internal/controlplane"
    covers: [A1, A2]
  - command: "cd runtime && uv run ruff check tests/fakes/adk_process_faults.py"
    covers: [A2]
  - command: "cd runtime && uv run ruff format --check tests/fakes/adk_process_faults.py"
    covers: [A2]
