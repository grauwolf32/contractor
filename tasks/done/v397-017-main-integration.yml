    main implements V391-001 with a single effective profile digest, while V397-010 independently added a separate closure seal for the same underlying failure. Their merged readers and model binding code must use one contract. The original V392 correlation IDs also collide with scanner tasks already on main, so this branch's series is renamed to V397 without changing implementation commit hashes.
  specification:
  - docs/spec/audits/audits.md#AUD-R20
  - docs/spec/configuration/catalog.md#CAT-R80
scope:
  in:
  - Preserve main's effective Audit profile digest implementation, retained-profile drift validation and regression tests.
  - Adapt the additional real-store selection regression to that contract and remove the superseded seal-only fixture assertions.
  - Preserve both fixture reader registrations, regenerate derived documentation and task backlog, and retain both task histories under unique IDs.
  - Run affected configuration, Audit, persistence and finding integration tests, the finding process gate and lint.
  out:
  - Repeating the full release gate, changing the selected model, rewriting retained business data or altering correlation identity and Worker tool contracts.
acceptance_criteria:
- id: A1
  text: Merged code uses the single effective Audit profile digest already on main; exact prepared selections survive default changes and modified profile content remains rejected.
- id: A2
  text: Finding producer and collection process journeys pass with retained automatic duplicates; current persistence fixtures and additional source-selection regression pass against real PostgreSQL.
- id: A3
