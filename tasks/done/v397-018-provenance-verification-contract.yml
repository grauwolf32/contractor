  - "The deployed UI 0.7.4 passed real browser login, unchanged model selection, four online Runtime Agents, retained finding navigation, collapsed Duplicates, truthful not-recorded metadata and validated candidate results with HTTP 200 and no UI alerts, page errors or Server 5xx."
  - "Deployment c5da324a59df77025dc4ae1bf2a3c9972ce2856c has a restore-verified backup, schema 000025 and unchanged Project/Audit/Run/finding business data."
  additional_runtime_checks:
    linux: make test-runtime passed with 4230 passed and 53 skipped in 127.82 seconds on the merged Runtime source.
    macos: Native make test-runtime failed with 102 failed, 4143 passed and 38 skipped; failures include Linux-only Podman/process APIs and other host-sensitive cases. This is not a clean native full-suite result.
