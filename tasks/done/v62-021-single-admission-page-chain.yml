schema_version: '1.0'
id: V62-021
title: Use one immutable admission page chain and root
milestone: audit-iterative-simplification-2026-10
epic: audits
kind: chore
introduced_by: V62-007
priority: P2
status: completed
depends_on:
- V62-020
languages:
- go
- sql
- json
- markdown
goal: Reuse one exact page chain through selection and private staging, retaining independent preparation
  completion and atomic acceptance.
context:
  authority: The user explicitly requested creation, sequential implementation, verification, task closure
    and merge of the five reviewed simplifications on 2026-10-27.
  finding: internal/auditservice/typed_prepared_round.go:24 copies selected pages while changing only
    schema and previous digest; admission_commit.go compares their identical Items.
  review: Read-only review of main 4d50b1cfc4961adad9dfa1fef160ef338cbd86ba and the accepted five-step
    simplification plan.
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/scans.md
  - docs/spec/audits/execution.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/execution/scheduler.md
  format_transition: Forward migration000053 rejects live Audits with old admission checkpoints or typed
    prepared membership metadata using parent-only reads. Stop the previous Server before applying. Terminal
    historical evidence is preserved byte-for-byte; no legacy reader or deployment.
  implementation_boundary: One PreparedRoundPage chain and PreparedRoundRoot; selected/published and staged
    counts remain distinct. The last bounded trusted-page staging phase atomically installs the existing
    SQL membership seal; root publication alone never grants membership. No new table, phase flag or recovery
    mechanism.
  verification_lanes: Full owner packages run in separate worktrees with separate disposable databases,
    at most two heavy lanes. Only scheduling is split; no package or test selection is removed. Required
    process, wire, public API and lint gates run on the combined clean branch.
scope:
  in:
  - Use one strict canonical page/root format, remove second artifact publication/root reference/digest
    chain, and stage trusted stored pages by cursor.
  - Keep selected/staged counters, private proposed membership, separate database membership seal, constant-size
    acceptance, original source cutoff/deadline and claim/CAS fencing.
  - Update forward migration/contract transition, exact budgets, purge, specs and real restart/scale tests;
    retain indexed bounded dispatch.
  out:
  - No new model authority, arbitrary Workflow routing, receipt/lease store or permissive legacy reader.
  - No deployment, live model changes or modification of historical frozen evidence.
acceptance_criteria:
- id: A1
  text: Only one page chain and root are published and charged; selected and staged progress remain distinct
    and partial membership grants no read/review/dispatch authority.
- id: A2
  text: Lost acknowledgements after page publication, root sealing and staging resume the same generation
    with one debit, no duplicate rows and one child execution.
- id: A3
  text: Claim takeover, original deadline, rollback, pause/cancel and populated purge retain their guarantees;
    sealed membership rejects typed and ordinary-looking inserts.
- id: A4
  text: More-than-128-item staging and maximum containing populations respect existing row/byte limits;
    accepted dispatch reads only compact root and selected entries.
- id: A5
  text: The preceding four simplification tasks are complete; this task meets its criteria and all specs/contracts
    and real-process gates pass on the integrated branch, ready for the user-authorized no-ff merge into
    main.
tests:
- command: go test -tags=integration -count=1 ./internal/persistence/postgres
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: go test -tags=integration -count=1 ./internal/auditdomain ./internal/auditstore/...
  covers:
