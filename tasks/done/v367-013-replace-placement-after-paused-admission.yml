schema_version: "1.0"
id: V367-013
title: "Re-place a Stage whose admission was deferred by a paused owner queue"
milestone: hub-audit-2026-10
epic: execution-core
kind: defect
introduced_by: V290-001
priority: P2
status: completed
implementation_commit: "2f2e568a091c3a5d2d41d061230a8bb9f418c7ac"
depends_on: []
languages: [go]
goal: "Pausing the owner queue between placement and admission defers the Stage and places it again after resume, without spending a retry attempt."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq), dispatch G2 / F3, H-1"
  specification:
    - docs/spec/execution/scheduler.md
  finding: >-
    Durable placement writes stage_allocations inside the pinning
    transaction (controlplane/placement.go:368-392). When AdmitStage then
    fails with ErrQueuePaused, releaseUnprepared releases only registry
    grants (scheduler/stage_preparation.go:177-186) and no code deletes the
    stage_allocations rows. After resume liveOrNewReservations sees rows
    without grants and returns errControlPlaneStateLost
    (allocation_reservations.go:27-40); beginAbort control_plane_state_lost
    (stage_preparation.go:156-160) aborts the Stage and spends a retry, or
    fails the Run without a retry policy. The V290 test disables pinning
    (paused_admission_release_test.go:24-30), so it cannot see this; the
    audit's overlay test reproduces the stale row. scheduler.recordReservations
    (allocation_reservations.go:120-153, stage_preparation.go:188-195)
    records the same allocations a second time. The gateway Admit
    reservation of the same Run may also refuse the Run's own re-admission
    (gatewayrecovery/admission.go:62, 77-85; to verify).
  decision: >-
    Chose removal over retention: V290-001 accepted that a paused owner pins
    no Runtime slot, so SCH-R152's sentence that a placement made durable
    before the pause stays reserved until resume was corrected instead. The
    V290 path was broken twice in production: the stale stage_allocations rows
    (finding) and, even without them, Registry.Release leaves a released
    tombstone, so ReserveAllContext for the same StageExecution returns
    ErrReservationReleased (reproduced by the new Control Plane test). On
    ErrQueuePaused for any unadmitted Stage (fresh or reused placement) the
    Scheduler now runs AtomicPersistence.DiscardUnadmittedPlacement: one
    transaction locks Run (pending) and Stage (preparing, unadmitted), deletes
    the unreleased rows, relinquishes the Run's admission probe reservations
    (gatewayrecovery.ReleaseAdmission) and calls
    Allocator.DiscardUnprepared, a new Registry operation that drops a
    committed, never prepared reservation without tombstone or
    reconciliation (refused for activated, fenced, lost or non-preparing
    batches, under the allocations' write gates); a discard error rolls the
    deletion back and the placement is reused. Residual risk, recorded in
    FAIL-SCH-18: a commit failing after the in-memory discard leaves rows
    without grants, which the next claim aborts with retryable
    control_plane_state_lost (the pre-fix behaviour, now only on a failed
    commit). scheduler.recordReservations, releaseUnprepared, the
    allocation_record_failed abort and Store.RecordStageAllocation are
    removed; placement is the only writer of the rows. The scheduler test
    fake now requires pinning, keeps released tombstones like the Registry
    and its store rejects a second write of an allocation row (A2). The
    gateway self-reservation reproduced (second Admit of the same Run was
    refused); Admit now first relinquishes the Run's earlier admission
    reservations in one key-ordered locking pass, which also frees a route
    the Run no longer admits.
scope:
  in:
    - "On ErrQueuePaused for an unadmitted Stage, remove its durable allocation rows in the same transaction as the release (or keep them explicitly retained and reuse them), so resume places it again."
    - "Remove scheduler.recordReservations if placement already records the rows."
    - "The fake placement in scheduler tests always pins like production."
    - "Verify and fix the gateway Admit self-reservation if it reproduces."
  out:
    - "Queue pause semantics for admitted Stages."
acceptance_criteria:
  - id: A1
    text: "A test with production-like pinning: pause between placement and admission, resume, and the Stage is placed again and runs without a retry attempt being consumed."
  - id: A2
    text: "No code path writes the same stage_allocations rows twice."
tests:
  - command: make lint
    covers: [A2]
  - command: "go test -tags integration ./internal/scheduler ./internal/controlplane ./internal/gatewayrecovery"
    covers: [A1, A2]
