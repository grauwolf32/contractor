schema_version: '1.0'
id: V407-019
title: Reconcile a dirty credential deletion fence against durable operation state
milestone: server-runtime-review-2026-10
epic: runtime-config
kind: defect
introduced_by: V8-002
priority: P2
status: completed
depends_on: []
languages:
- go
goal: Clear a conservative process-wide deletion fence when durable reconciliation proves no unresolved
  delete remains, without requiring another delete or a restart.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/configuration/runtime-config.md
  severity: medium
  finding: internal/credentials/lifecycle.go:429-435 sets deleteDirty after an uncertain prepared-operation
    insert/commit error. WithRunCreation and WithAllocationReferences reject every new reference while
    it is set (:182-194). Successful or replayed Delete clears it, but Recover can set ready=true after
    exhausting the journal without clearing this flag (:206-208). A rolled-back insert with no durable
    operation can therefore leave unrelated work blocked indefinitely in the same process. A Gateway manager
    error after a successful prepared insert follows :439-443 and does not itself set deleteDirty.
  validation: 'Validated against main dc7012e8 on 2026-10-23. The sticky flag and its trigger were confirmed
    statically on dc7012e8. The existing real-store TestCredentialFailedDeleteFencesOnlyItsOwnCredential
    covers the distinct manager-error path. The alleged three-way classifier drift was declined: placement
    eligibility, Scheduler retryability and safe provider wrapping have different purposes, and WrapError
    preserves errors.Is via Unwrap.'
  siblings: Both WithRunCreation and WithAllocationReferences share this fence. Cover Delete insert/commit
    uncertainty, definite rollback, successful/replayed deletion, same-process Recover and per-credential
    prepared-delete lookups; preserve unrelated credential behavior on ordinary manager failure.
plan:
- Reconcile a dirty fence using the existing operation identity and deletion synchronization. Before treating
  journal absence as proof, establish that the uncertain transaction has settled, for example by serializing
  on the existing database deletion lock; a bare negative list query must not race a still-committing
  INSERT. Keep reads bounded and retain the fence on failed or inconclusive reconciliation.
- Reset the conservative flag consistently after successful same-process recovery, without racing a new
  prepared mutation or weakening ready=false behavior. Keep the ordinary clean guard free of extra reconciliation
  queries.
- 'Add real-PostgreSQL fault injection precisely at the prepared-operation INSERT/commit outcome: one
  committed-but-response-lost case and one noncommitted case. A manager.Delete failure is a separate test
  and must not be used as the dirty-flag trigger.'
- Exercise both reference guards before and after reconciliation, database-read failure, cancellation
  and concurrent mutation. Preserve the existing operation journal, classified errors and per-credential
  fence; add no generic credential classifier.
scope:
  in:
  - Durable reconciliation and synchronized clearing of deleteDirty.
  - Real-store regression tests for the actual INSERT/commit failure boundary and same-process recovery.
  out:
  - Merging Scheduler, placement and composite-provider error handling.
  - Changing remote deletion retry rules, operation journals, barrier scope or startup traffic policy.
acceptance_criteria:
- id: A1
  text: After an injected failed or ambiguous prepared INSERT whose durable outcome is no unresolved deletion,
    the same Service instance admits Run creation and allocation references after reconciliation without
    a delete retry or restart.
- id: A2
  text: If a relevant prepared deletion exists or durable reconciliation fails, both guards remain conservative;
    after successful same-process recovery they reopen only when durable state permits. Concurrent mutation
    cannot clear a newly required fence. A negative lookup cannot reopen either guard while the original
    database transaction could still commit its deletion intent.
- id: A3
  text: The clean guard performs no additional dirty-state query, reconciliation work is bounded, and
    ordinary manager failure still fences only its credential as before.
- id: A4
  text: Real-PostgreSQL tests reproduce the dirty state at INSERT/commit, assert the credential_operations
    journal state and fail on the unreconciled code; error wrapping/classification and existing credential
    lifecycle tests remain unchanged.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/credentials/...
    ./internal/scheduler/... ./internal/controlplane/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
implementation_commit: a5ee851da7ef7f1a6014acfbb7f16716839122d6
verification:
  date: '2026-10-23'
  environment: macOS arm64; Go 1.26.9, Node 24.20.0 with pnpm and the locked Runtime venv; local PostgreSQL 17.11, database contractor_test_h with an isolated schema per test.
  finding_recheck: >-
    Rechecked on base ac982d28: lifecycle.go:429-436 set deleteDirty after an attempted intent insert failed
    with anything but ErrConflict, ErrInvalid or credential_in_use; :182 refused every reference while it was
    set; :206-208 let Recover set ready=true without clearing it. Sibling found and fixed in the same class:
    :362 and :441 cleared the flag after a replayed or successful delete of any credential, so a delete of
    another credential reopened the guards while the uncertain transaction could still commit.
  decisions:
  - A durable prepared deletion found by reconciliation keeps both guards closed until the same request or
    recovery completes it (A2), rather than narrowing the fence to its credential; recorded in RCF-R53 with
    the reason.
  - Reconciliation tries the credential deletion lock and never waits, so Run creation and placement do not
    queue behind an open transaction; a held lock, failed read or cancellation keeps the fence and the next
    reference, delete or recovery reconciles again.
  - Delete settles an earlier uncertain intent before preparing another and answers credential_recovery_required
    while it is unsettled, so at most one uncertain intent is tracked. The trigger classification of the
    uncertain state, the operation journal and the per-credential fence are unchanged; no generic credential
    classifier was added.
  - 'Siblings ruled out: RuntimeCredentialService.Delete commits one local tombstone with no remote side effect
    and keeps no process-wide fence; an uncertain create intent cannot let a reference reach a deleted key.'
  commands:
  - 'test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/credentials/...
    ./internal/scheduler/... ./internal/controlplane/... passed with TMPDIR set to a directory without
    symlinked components. With the default macOS TMPDIR (/var -> /private/var) only
    TestPostgresSummaryContinuationReconcilesAndRetainsArtifactsAndMemory/filesystem/* fails ("invalid artifact
    blob directory"); the same test fails identically on the unmodified base ac982d28, so it is environmental
    and unrelated.'
  - go test -race -count=10 -run 'TestCredentialDelete|TestCredentialRecoveryCompletes' ./internal/credentials/ passed.
  - 'Regression evidence: with reconciliation disabled 6 of the 7 new tests fail (the late-commit test passes
    because the same request clears the fence); with a negative read taken without the deletion lock the two
    still-committing tests fail.'
  - go test -tags=integration -count=1 ./internal/runtimeconfig/... ./internal/persistence/postgres
    ./internal/apierror/... ./internal/runservice/... ./internal/auditservice/... ./internal/evalservice/...
    ./internal/httpapi/... ./internal/app/... passed.
  - 'go test ./internal/persistence: TestSQLAccessFollowsTableOwnership fails on internal/cli/scan_sweep_remote.go:196
    (projects read outside internal/projectstore); it fails identically on the unmodified base ac982d28 and this
    task does not touch that file.'
  - make verify-public-api passed.
  - make lint passed, after make docs-error-registry, make docs-dependencies and make tasks-backlog regenerated
    their outputs.
  database_tests_configured: true
  review_follow_up:
    date: '2026-10-24'
    change: >-
      Review found that a failed reconciliation read returned a storage error, which the public API answers as
      500 internal_error, while RCF-R53 promises credential_recovery_required. a5ee851d answers it with the
      retryable 503 credential_recovery_required for both guards and for Delete, keeps a cancelled caller's
      context error, and leaves Recover's storage error unchanged. ca700f44 holds the main implementation.
    commands:
    - 'test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/credentials/...
      ./internal/scheduler/... ./internal/controlplane/... passed against contractor_test_h (TMPDIR without
      symlinked components, as above).'
    - go test -race -count=5 -run 'TestCredentialDelete|TestCredentialRecoveryCompletes' ./internal/credentials/ passed;
      the updated outage test fails when a failed reconciliation returns the storage error.
    - go test -tags=integration -count=1 ./internal/runservice/... ./internal/auditservice/... ./internal/evalservice/...
      ./internal/httpapi/public/... passed.
    - make verify-public-api passed.
    - make lint passed after make docs-dependencies regenerated the graph fingerprint.
