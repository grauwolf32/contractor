schema_version: "1.0"
id: V409-003
title: "Lock the owning Run before the Stage in StartPlanner"
milestone: sql-review-2026-10
epic: execution-core
kind: defect
introduced_by: V3-009
priority: P2
status: completed
implementation_commit: 793c9d538e7f6af12b15322d9046bae49a026caf
depends_on: []
languages: [go, sql]
goal: "Make StartPlanner obey the Run-before-Stage lock order without changing Planner start, continuation replay or scheduler-claim expiry semantics."
context:
  review: "docs/research/2026-10-23-sql-review.md, finding A3; the lock-order subclaim is retained after independent validation on 2026-10-23."
  specification:
    - docs/spec/execution/runs.md#RUN-R29
    - docs/spec/execution/runs.md#RUN-R106
    - docs/spec/execution/runs.md#RUN-R50
    - docs/spec/execution/scheduler.md#SCH-R120
    - docs/spec/tools/scanners.md#SCN-R204
    - docs/spec/platform/persistence.md
  severity: medium
  validation: >-
    Partial finding on main 1d533b2db885e0162ebabb01d36470f139546009.
    A synchronized real-PostgreSQL probe of actual session.Service.Begin
    against a transaction using LockRunState then LockStageState produced
    SQLSTATE 40P01: Begin held the Stage while waiting for that Run.
    This proves the store lock-order defect. A full Scheduler abort/start
    race was not demonstrated: the lane normally joins Planner.Run before
    beginning abort. Relevant store source is unchanged at main
    e4480ace5ba68e665535a30ee23f4eb4c3a0ceb6.
  finding: >-
    internal/runstore/stage_store_sql.go:92-148 updates the preparing
    Stage, inserts the Planner session and only then updates workflow_runs
    for event sequences. stage_store.go:179-228 executes it directly on
    the store's DBTX; session/service.go:105-121 calls it on the
    pool-backed production store and does not interpret 40P01 as a business
    replay conflict. RUN-R29/RUN-R106 require every operation taking both
    row locks to acquire Run first. StartPlanner violates that invariant
    independently of whether the normal lane schedule currently exposes
    the interleaving.
  provenance: >-
    V3-009, commit 2fbac4ddcf61709d01fd57025c8aa52d477b44a6, added the
    Run event-sequence UPDATE after the Stage UPDATE in StartPlanner.
    V365-002 moved the existing statement into stage_store_sql.go
    byte-for-byte and did not introduce this ordering.
  siblings: >-
    Review the real Run-first transaction boundaries in run_failure_store,
    Scheduler admission/abort and Memory active-Stage operations; retain
    them and exercise representative competing operations. Resume already
    locks the Run before reading a failed resumable Stage
    (resume_store.go:63-99); same-key replay returns the original target
    before checking the now-pending Run, as RUN-R50 requires. Allocation
    completion writes both release_attempted_at and release_completed_at
    from the same statement_timestamp (allocation_store.go:343-344), so
    the alleged CHECK violation is absent. appendPlannerEventSQL requires
    an unexpired claim (planner_store_sql.go:5-8), as SCN-R204 and the
    existing expiry/takeover test require; a matching expired claim is not
    authority to append before renewal.
plan:
  - >-
    Resolve the Stage's immutable owning Run identity, acquire its row
    lock, then execute the existing preparing-to-running Stage CAS,
    session creation and event allocation atomically. Prefer the existing
    persistencepostgres.Within boundary: it retries a replay-safe callback
    on a pool and joins a caller-owned pgx.Tx without another connection,
    commit or internal retry. If a single statement is used instead,
    enforce the Run-lock dependency in the execution graph; textual CTE
    order alone is not evidence of acquisition order.
  - >-
    Keep validation, accepted states, generated identity reuse, error
    mapping, session contents and event sequence allocation unchanged.
    The Stage CAS remains authoritative. Do not introduce a new Run-state
    restriction as an incidental lock acquisition predicate. Missing or
    changed Stage data must return the existing classified failure without
    a partial session/event or consumed sequence number.
  - >-
    Add synchronized real-store tests through session.Service.Begin and
    transaction-backed StartPlanner. While another transaction owns the
    Run lock, observe StartPlanner waiting for Run and prove that the
    existing Run-first owner can still acquire the Stage lock; release the
    owner and complete the operation. Use barriers, backend lock state and
    counters, with a deadline only as a hang guard. The original ordering
    must fail this test; a source grep or sleep-duration threshold is not
    sufficient.
  - >-
    Cover competing Begin calls, stale Stage state, cancellation/rollback,
    and caller-owned commit/rollback at MaxConns=1. Reuse existing finite
    transaction-conflict classification; do not relabel storage conflicts
    as semantic CAS conflicts. Run existing resume replay, allocation
    release timestamp and expired-claim/takeover tests unchanged apart from
    test helper refactoring needed for the new regression.
failure_outcomes:
  - operation: Start one Planner session for a preparing Stage
    success: "Stage transition, session and initial lifecycle/Planner events commit together with the existing sequence and identity semantics."
    permanent: "Invalid input, missing/stale Stage and business CAS conflicts keep their current classifications and create no partial session/events."
    retryable: "A pool-owned replay-safe callback may use the existing finite definite-abort retry policy; a caller transaction retains responsibility for its entire retry boundary."
    ambiguous: "Do not blindly repeat an uncertain commit; the existing session identity and service reload/reconciliation remain authoritative."
    cancelled: "Join rollback of a pool-owned transaction; never commit or independently retry a cancelled caller transaction."
    timeout: "Keep the existing operation and transaction budgets, without elapsed-time correctness assumptions."
scope:
  in:
    - "StartPlanner Run-first locking for pool-backed and transaction-backed stores, preserving its existing atomic Stage/session/event contract."
    - "Real-store lock-order regression and compatibility tests for the neighboring lifecycle operations."
  out:
    - "Resume CAS cleanup, release-clock unification, relaxing append claim expiry or changing claim renewal cadence."
    - "Changing Scheduler lane ownership, adding a new lock/receipt, or asserting a reproduced full-orchestration abort race."
acceptance_criteria:
  - id: A1
    given: "A preparing Stage and a real PostgreSQL transaction that already holds its owning Run row lock."
    when: "Service.Begin reaches StartPlanner, and the Run-first transaction then acquires the Stage lock before releasing its locks."
    then: "StartPlanner waits without owning the Stage lock, the Run-first acquisition succeeds and the subsequent start completes without this lock cycle. The synchronized assertion fails on the original Stage-first statement."
  - id: A2
    given: "Two concurrent Begin calls for one preparing Stage, plus separate stale/missing-Stage and cancellation fixtures."
    when: "The real store accepts, conflicts or rolls back the starts."
    then: "Only one session and one initial event set commit; the loser follows existing service reload/replay behavior, sequences are not consumed by a rollback, and invalid/stale/cancelled paths preserve existing error classes without partial effects."
  - id: A3
    given: "A transaction-backed StartPlanner store with a one-connection pool, and a separate pool-backed store."
    when: "StartPlanner runs and its owner commits or rolls back, with a definite transaction conflict injected where retry ownership is tested."
    then: "The caller transaction is reused without nested acquisition, commit or retry; its rollback removes all start effects. The pool path applies only the existing finite definite-abort policy and retains the same identities across attempts."
  - id: A4
    given: "Existing failed-Run continuation, release-completion and expired scheduler-claim fixtures."
    when: "The full RunStore, Planner, Scheduler and Memory package suites run."
    then: "Same-key continuation replay still returns the existing target after the Run becomes pending; release timestamps satisfy the existing invariant; expired-claim writes are rejected until renewal and old claims remain fenced after takeover."
  - id: A5
    given: "The completed implementation, tests and task metadata."
    when: "Repository lint, SQL placement and architecture checks run."
    then: "They pass without broadening production exports or introducing a separate transaction/lock mechanism."
tests:
  - command: 'CONTRACTOR_TEST_DATABASE_URL="${CONTRACTOR_TEST_DATABASE_URL:?set a disposable PostgreSQL database URL}" go test -tags=integration -count=1 ./internal/runstore/... ./internal/planner/session/... ./internal/scheduler/... ./internal/memory/... ./internal/persistence/postgres/...'
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A5]
verification:
  date: '2026-10-23'
  environment: >-
    macOS arm64; Go 1.26.9; locked Node 24.20 and Runtime venv; local
    PostgreSQL 17.11 database contractor_test_e with isolated per-test schemas
    and all 32 migrations; deadlock_timeout 1s.
  re_verification: >-
    The finding held on base ac982d28: startPlannerSQL
    (stage_store_sql.go:87-148) updated stage_executions before
    workflow_runs, StartPlanner (stage_store.go:179-226) ran it directly on
    the store's DBTX, and session/service.go:105 calls it on the pool-backed
    production store. The sibling claims also held unchanged: resume locks the
    Run FOR UPDATE before the replay lookup (resume_store.go:66-79),
    allocation completion writes both release timestamps from one
    statement_timestamp (allocation_store.go:334-335) and
    appendPlannerEventSQL still requires an unexpired claim
    (planner_store_sql.go:26-27); none was changed.
  regression_before_fix: >-
    With only the new tests applied to the unmodified StartPlanner, the
    synchronized tests failed as intended: the NOWAIT Stage probe returned
    SQLSTATE 55P03 while the start waited for the Run row
    (TestPostgresStartPlannerLocksTheRunBeforeTheStage pool and caller
    transaction, TestPostgresBeginLocksTheRunBeforeTheStage, the abort and
    cancellation variants), the second concurrent Begin queued for the Stage
    row instead of the Run row, and the pool path made one attempt where the
    shared policy makes three.
  commands:
    - >-
      CONTRACTOR_TEST_DATABASE_URL=... go test -tags=integration -count=1
      ./internal/runstore/... ./internal/planner/session/... ./internal/scheduler/...
      ./internal/memory/... ./internal/persistence/postgres/... passed with
      TMPDIR set to its symlink-free /private/var path. With macOS's default
      TMPDIR under the /var symlink, three filesystem-blob tests
      (scheduler TestPostgresSummaryContinuationReconcilesAndRetainsArtifactsAndMemory/filesystem/*,
      memory TestPostgresPlannerMemoryRemovesDeduplicatedBlobCandidate and
      TestPostgresPlannerMemoryRetainsTransferLeaseThroughPublish) fail in blob
      store setup before any Run code ("invalid artifact blob directory"); the
      same tests fail identically on base ac982d28 in a temporary worktree.
    - >-
      go test -count=15 of the new tests and the trigger probe test, and
      go test -race -count=2 of the new tests, passed.
    - >-
      go test -tags=integration -count=1 ./internal/telemetry/... ./internal/planner/...
      ./internal/runservice/... ./internal/rundeletion/... ./tests/integration/streamline/...
      passed (the other StartPlanner and Planner session callers).
    - make lint passed, including SQL placement, table ownership, SQLSTATE literals, layers, staticcheck and test-only exports.
  database_tests_configured: true
  siblings_reviewed: >-
    Every other StageExecution state change whose lifecycle trigger appends a
    Run event (CreateStageExecution, MarkStageAdmitted, EnterFinalizing,
    CompleteStageResult, EnterAborting, CompleteStageTermination and the Run
    failure store) is called in production only inside Run-first transactions:
    scheduler/postgres.go and admission.go lock the Run with LockRunState
    first, resume_store.go locks the Run FOR UPDATE, and
    run_failure_store.go/memory/postgres.go take LockRunState then
    LockStageState. RecordStageOutputPublicationFailure changes no state and
    locks no Run; allocation placement locks only the Stage and never the
    Run; AppendPlannerEvent locks its session then the Run, and no operation
    locks a session after a Run. None needed a change.
  remaining: >-
    None for this task. Those sibling operations remain callable on a
    pool-backed store, where their trigger-driven Run update would follow the
    Stage update; production never calls them that way, and moving them to
    PostgresTxStore is outside this task's scope.
