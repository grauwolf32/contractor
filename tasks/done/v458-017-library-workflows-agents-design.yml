goal: Demonstrate clearer Workflow and Agent browsing with distinct useful detail views and one consistent Library design.
context:
  authority: User 2026-11-16 requests an updated Workflows and Agents design following the Check types iteration. Preserve existing OpenDesign sources and the configured model.
  design: docs/design/ui/README.md
  finding: Current catalog cards repeat version and contract metadata while stage composition, instructions and template usage require separate exploration.
  boundary: Synthetic local preview only. Workflow inputs, declared outputs and stage bindings remain separate from execution results. Agents are versioned templates, not live workers; tool agents have no prompt or model. No readiness, run status or performance is invented.
scope:
  in:
    - Review current demo and source; make linked Workflow and Agent browser prototypes with a real OpenDesign contribution.
    - Search, filters, exact version selection, stage-to-agent and usage-to-workflow navigation, prompt preview/source, mobile list/detail navigation.
    - Compare before and proposed views in three themes at 390 and 1440 px; retain sources, generation receipts and verified backups in the common archive.
  out:
    - Production adaptation, API changes, deployment, real runs or modifying demo business data.
acceptance_criteria:
  - id: A1
    text: Native OpenDesign output and host additions are separately retained; Workflows foreground contracts and stage bindings, Agents foreground instructions, capabilities and exact-version usage.
  - id: A2
    text: Interactive preview works at 390 and 1440 px in light, dark and black, with consistent fonts and no horizontal overflow or simulated action that starts real work.
  - id: A3
    text: Previous archive and native project files remain intact, recoverable state backups pass integrity checks, and the owned relay is stopped with its secret removed.
tests:
  - command: python3 scripts/check_tasks.py
    covers: [A1, A2, A3]
  - command: git diff --check
    covers: [A1, A2, A3]
  - command: Browser review of archived Workflows and Agents in three themes at 390/1440 with search, filters, version and linked navigation
    covers: [A1, A2]
