    - Native OpenDesign run succeeded and produced 145 lines of CSS plus rationale; applied CSS is byte-identical to native output. Host scaffold and final amendments are separately retained.
    - Twelve browser layout checks passed across both sections, three themes and 390/1440 px. No document or detail-pane horizontal overflow; one font token set throughout.
    - Search, empty/reset, filters, mobile selection/back with retained search, exact Agent/Workflow links, prompt Source/Preview, toolset disclosure and simulated setup/Escape passed. Tool agents show actual call arguments without prompt/model. One pinned version per example is supplied; no multi-version loading is claimed.
    - Preview Before/New, section synchronization, themes and width controls passed; browser console errors are empty. Native relay stopped after 10 of 24 requests and its upstream secret was removed.
    - All 265 previous native project files and previous project/conversation/message/session rows are unchanged. Pre/post SQLite backups passed integrity checks and the original compressed archive hash is unchanged.
