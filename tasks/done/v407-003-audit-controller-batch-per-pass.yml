schema_version: '1.0'
id: V407-003
title: Batch Audit drain mutations under a fixed per-step work budget
milestone: server-runtime-review-2026-10
epic: audits
kind: chore
priority: P2
status: completed
depends_on: []
languages:
- go
goal: Reduce repeated Audit snapshots during drain phases using a fixed bounded mutation batch while preserving
  lifecycle barriers, claim fences and fairness.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/audits/execution.md
  validation: Revalidated against main dc7012e8 on 2026-10-23. One mutation per snapshot is confirmed
    as an optimization opportunity; no lifecycle defect or latency regression was demonstrated. The original
    three-pass terminal cancellation requirement was unsupported because collection and child completion
    are separate phases.
  finding: internal/auditcontroller/controller.go:424-452 observes one terminal child, 469-479 fails one
    unbound intent, 630-658 requests one cancellation, and settlement.go:78-88 deletes one released terminal
    Run per step. Each step reads a new claimed snapshot (controller.go:50-74,89). Run immediately continues
    on progress (35-36), so this is repeated store work rather than one PollInterval per child. Collection
    remains one execution per step (collection.go:14-25), and running children must actually finish before
    terminal Audit settlement. AUX-R95 requires bounded statements independent of total child cardinality;
    an unbounded whole-Audit mutation loop or arbitrary three-pass terminal outcome would violate that
    design.
  siblings: Cover terminal observation, unbound-intent failure, cancellation requests and released-terminal
    Run deletion. Keep collection and final settlement barriers explicit; any phase not safely batchable
    retains its existing boundary and a measured count. Preserve Eval coordinator behavior if the shared
    loop is later refactored by V407-027.
plan:
- Record the baseline counts for each drain phase on real PostgreSQL with 1, 50 and 200 children. Choose
  and document a fixed per-step mutation budget B, independent of Audit size and no larger than MaxReconcileRows,
  with a statement/byte bound and the existing operation/lease deadlines.
- Process at most B eligible terminal observations, unbound intents, cancellation requests or deletions
  during the applicable phase of one claimed step. Retain the existing phase order and per-mutation transactions;
  do not batch across a receipt or lifecycle barrier.
- Use snapshot data only as candidates, retaining every store-side claim, revision, terminal-state and
  deletion check. Stop on lost claim, stale precondition, context budget or the fixed mutation bound;
  use returned authority or a fresh projection where a prior mutation invalidates later inputs.
- Keep collection one execution at a time unless equivalent byte/evidence/receipt guarantees are demonstrated
  with fresh required authority. Document its separate count; requesting cancellation never substitutes
  for observing the actual terminal Run and committing its receipt.
- Add deterministic count tests for batches and tails, controlled asynchronous child completion, cancellation/claim-loss
  mid-batch, and two-Audit fairness. Already-terminal fixtures must show reduced snapshot counts for the
  batched phases with exact count formulas; waiting on live children is driven by signals, not elapsed
  time.
- Clarify AUX-R73/AUX-R95 with the chosen fixed maximum work per claimed step and phase ordering. Preserve
  an upper bound independent of total Audit cardinality and ensure every eligible claimed Audit receives
  a bounded turn.
scope:
  in:
  - Fixed-budget batching of existing drain mutations and deterministic real-store cost coverage.
  - Explicit per-phase accounting, lifecycle barriers, claim fencing and fairness under the existing controller
    architecture.
  out:
  - An unbounded loop or giant transaction over all children, a work budget derived from total Audit size,
    or a new claim mechanism.
  - Guaranteeing AuditCancelled before running children actually finish and their collection receipts
    commit.
  - An arbitrary three-pass drain target, a PollInterval delay claim, or unrelated shared-loop/Eval changes.
acceptance_criteria:
- id: A1
  text: The task and owning spec name fixed B and its row, byte, statement and deadline bounds. A claimed
    step performs no more than B eligible drain mutations and never continues after claim loss, stale
    authority or budget exhaustion.
- id: A2
  text: 'On controlled already-terminal, intent-only and released-deletion fixtures of 1, 50 and 200 children,
    tests assert the chosen phase-specific formula including batch tails: eligible batched work completes
    in ceil(N/B) batch steps when no concurrent change interrupts it. Collection, final transitions and
    other required steps are counted separately, and total snapshot counts improve on the baseline for
    multi-child cases.'
- id: A3
  text: 'Cancellation tests distinguish bounded requests from child terminal transitions: nonterminal
    children keep the settlement barrier closed until explicitly transitioned, and every observed terminal
    child still receives its existing exactly-once receipt before Audit settlement.'
- id: A4
  text: Mid-batch claim loss or a concurrent revision change stops unsafe continuation without duplicate
    effects. A second eligible Audit progresses while another has a large drain, and existing replay,
    deletion and cancellation outcomes are preserved.
- id: A5
  text: Operation-count tests use deterministic clocks and transition signals, not latency thresholds.
    Existing controller suites pass with updates limited to the documented fixed-budget scheduling and
    cost expectations.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/auditcontroller/...
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
decisions:
- >-
  B is 32 drain mutations per claimed reconcile step and batched phase (maxDrainMutationsPerStep,
  LIM-AUX-14, AUX-R96 in docs/spec/audits/execution.md), a constant independent of Audit size and below
  the 200-row snapshot window (auditstore.MaxReconcileRows) its candidates come from; 32 also exercises
  tails at 50 and 200 children. Rows: each mutation is its own transaction over one execution with its
  members (at most batchSize) and one Audit event, or over one child Run and its event; a Run deletion is
  atomic and bounded by the Run revision quota (LIM-ART-6). Bytes: observation, intent failure and
  cancellation write identifiers, states and fixed-shape event payloads only. Statements: a fixed count
  per mutation; measured on real PostgreSQL the largest full-batch pass issues 46 statements
  (cancellation or intent failure), 78 (observation) and 880 (deletion) for both 50 and 200 children,
  against 15 (cancellation or intent failure), 16 (observation) and 43 (deletion) for one mutation per
  pass. Deadline: an ordinary step's batch shares one
  OperationTimeout with its snapshot under a lease at least twice that long; a deleting step's batch uses
  the existing two-minute cleanup budget under the renewed four-minute lease (REV-R160), so a step's
  budget always ends before its claim and the worst-case deleting pass is no longer than before.
- >-
  Phase order and barriers are unchanged. A batched phase that changed anything ends the step: observation
  and intent failure advance the Audit revision, and cancellation requests and deletions change child Run
  states that later revision-fenced phases (settlement, hold release, transitions, purge) read, so those
  wait for a fresh snapshot. Collection stays one execution per step (separate receipt, byte and evidence
  guarantees), the purge runs in a step that found no child Run left, and a cancellation request never
  substitutes for the child's terminal transition, observation and receipt.
- >-
  Stop conditions: the bound, the end of the step budget (no further mutation starts; an interrupted
  mutation committed or rolled back whole, so drainBatch.stop reports progress without an error), the
  first error including ErrClaimLost or ErrPrecondition, and a child Run that is not deletable yet.
  Candidates stay valid under a concurrent owner revision change because terminal Run states are final,
  closed dispatch never reopens, a cancelling or deleting Audit always needs its children cancelled and
  a deleting Audit only proceeds to its purge; claim-fenced store mutations re-check the claim, and every
  deletion candidate comes from a fresh claim-proven NextLiveRunForDeletion read.
- >-
  Baseline (one mutation per pass, measured by the same tests with the bound set to 1) and batched
  snapshot counts. Cancel+delete of running children through purge: 1 child 7 -> 7; 50 children 203 ->
  60 (cancellations 32+18, observations 32+17 then the last 1, deletions 32+18); 200 children 804 by
  formula -> 226 (6x32+8 each). Intent-only cancellation: 1 child 5 -> 5; 50: 103 -> 55; 200: 403 by formula
  -> 210 (6x32+8). Collections (one per execution), the hold release, settlement and transitions and the
  purge passes are counted separately; the tests assert the exact formula, including tails.
- >-
  Rejected: bounding a deletion batch by reading artifact_scopes revision counts. It would add a
  cross-owner read to the table ownership registry and a second copy of LIM-ART-6's value; the existing
  cleanup budget already bounds the deleting step's duration, and the budget-end stop keeps progress.
- >-
  Siblings ruled out: Project deletion purges Runs through its own purge budget (projectlifecycle, REV-R160
  "Project deletion ... is unchanged"); the Eval coordinator and the shared claim loop are left to
  V407-027. The fixtures of more than 32 outstanding children clear audits.outstanding_run_count before
  each ordinary dispatch (the dispatch window never exceeds 32) and restore the true count afterwards;
  every intent, Run and binding still comes from production paths.
verification:
  date: '2026-10-23'
  environment: macOS arm64; Go 1.26.9 (GOTOOLCHAIN=local), Node 24.20.0 with pnpm 11.24.0, the locked
    Runtime venv; isolated PostgreSQL 17.11 database contractor_test_b with per-test schemas and all 32
    migrations.
  commands:
  - test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/auditcontroller/...
    passed (75 top-level tests, none skipped, 50 s), including TestPostgresControllerDrainBatchesCancellationObservationAndDeletion,
    TestPostgresControllerDrainBatchesUnboundIntentFailures (1, 50 and 200 children plus the 50-child
    one-per-pass baseline), TestPostgresControllerDrainBatchStopsAtALostClaim, TestPostgresControllerDrainBatchKeepsRevisionFencedWorkForAFreshSnapshot
    and TestPostgresControllerSecondAuditProgressesBesideALargeDrain.
  - go test -count=1 ./internal/auditcontroller/... passed, including the fake-store tests for bounded
    batches and tails, mid-batch claim loss, a stale intent, the end of the step budget and a blocked deletion.
  - 'Mutation check: with drainBatch.open ignoring the bound, the intent drain (passes [50] and [200]
    instead of [32 18] and 6x32+8), the two-Audit fairness test (40 observed in the first pass instead
    of 32) and the fake batch test failed; the bound was restored before committing.'
  - go test -count=1 ./internal/persistence/ failed only TestSQLAccessFollowsTableOwnership at internal/cli/scan_sweep_remote.go:196,
    the failure that already exists on the base 7bcd8fd6; no new ownership or SQL placement finding.
  - make lint passed, including Go vet/staticcheck/unused exports, the spec checker, the dependency graph
    check and the task checks.
  database_tests_configured: true
  evidence: Snapshot counts per drain (baseline with the bound set to 1 -> batched) are recorded in the
    decisions; the largest full-batch pass issued the same statements for 50 and 200 children (46 cancellation
    or intent failure, 78 observation, 880 deletion).
  declined:
  - >-
    Batching collection: each receipt keeps its own result-import transaction and byte/evidence
    guarantees, so collection stays one execution per step and is counted separately.
  - >-
    A deletion batch bound by Run revision counts (see decisions); the existing cleanup budget bounds the
    deleting step.
