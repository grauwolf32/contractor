goal: The complete mocked browser gate again exercises the shipped UI without stale fixtures or weakened behavioral assertions.
context:
  authority: >-
    Recorded during the user-assigned V64-008 verification on 2026-11-06.
    User 2026-11-06 explicitly assigns the UI portion of V450-001 in this chat.
    Its listed scope is the mocked UI browser gate; API/CLI implementation and
    the other lane’s uncommitted work are outside this assignment.
  specification:
  - docs/spec/ui/ui.md
  - docs/spec/platform/failure-model.md
  - api/openapi/contractor-public-v1.yaml
  finding: >-
    On current main 360ffd44a, after the separately recorded V450-003 activity
    repair, the complete mocked gate reproduced 150 passing and seven failing
    tests. Check types still expected a retired requirements viewer (one);
    Catalog supplied an obsolete AgentTemplate modelPolicy (one); the shared
    Evals fixture still supplied a retired AuditProfile body and camelCase
    input mediaTypes instead of the common media_types contract (two); and
    Scheduler selectors matched decrement/increment buttons along with the
    actual number input (three). All seven Studio cases already passed.
  original_report: >-
    V64-008's earlier additional gate reported 140 passing and 17 failing
    cases. Its sandboxProfile/Selector-object diagnosis and missing normalized
    summarizer-default expectations do not match the current pinned OpenAPI
    and passing Studio tests. Preserve string Selectors and exact YAML assertions.
  locations:
  - ui/e2e/audit-presets.spec.ts:58
  - ui/e2e/catalog.spec.ts:14
  - ui/e2e/check-events.spec.ts:95
  - ui/e2e/support/evals.ts
  - ui/e2e/scheduler-settings.spec.ts:57
  - ui/e2e/studio.spec.ts:143
  - ui/e2e/studio.spec.ts:212
  attribution: >-
    V64-002 (9e803f2fc) introduced the activity replacement, retained by V64-010
    (0b037b4c3); V450-003 repairs that production guarantee separately.
    The original Catalog fixture is V37-007 (97e5663af); V425-041
    (1fd737538) removed AgentTemplate model selection. The original Evals
    fixture comes from 98ad7b818 (its historical task association is not
    recorded); V385-001 (7fa7f1c0) added its input mediaTypes, and V64-010
    subsequently replaced that profile with the common Program contract.
    Scheduler's broad selector came from V400-003 (e4c0bb8fb); V429-028
    (71041cac9) added the accessible stepper buttons and nested saved-settings
    disclosure. Studio retains V425-041's already updated authored fixtures.
  contract_reconciliation:
    audit_presets: V64-010 removed the old item/requirement projection. Keep library paging/search, exact numeric version selection, current required inputs/media types, Workflow role/output links, reload and mobile return context.
    catalog: Remove the no-longer-declared modelPolicy member only. Selector is a string in the pinned OpenAPI and its generated schema; runtime, toolset and sandbox strings remain exact.
    studio: All seven cases pass on the reconciled baseline; retain string Selectors, full parsed-YAML equality, comments, normalized summarizer selections and existing catalog retry assertions unchanged.
    activity: V450-003 preserves and refreshes all explicitly loaded pages through the existing owner, with failure retention asserted at 1440/390/320px.
    evals: Reuse the schema-checked current common AuditProfile fixture, pinning its requested name/version/digest and matching the dataset's source ZIP input; remove the obsolete inventory/execution/interaction shape.
    scheduler: Select exact named spinbuttons, explicitly open Saved scheduling settings before its Technical details, and preserve bounds, viewport, exact two-lane body and If-Match assertions.
  prior_integration_review: >-
    Before the V450-002 merge, current main already rewrote the activity and
    Studio common-Program browser fixtures in V64-010. Re-establish the current
    failing set rather than assuming the historical count of sixteen still holds.
    Read-only inspection confirmed a product gap in AuditActivity: switching
    cursor changes the query key, and failed continuation replaces loaded events
    and navigation with the error. UI-R153/FAIL-UI-6 require settled events to
    remain visible. Main's revised test omits that assertion; a passing page/retry
    test alone does not prove retention. Record this as a production defect before
    changing the component. For Studio YAML, summarizerModelPolicy is already
    present in the imported fixture; the expected-result code overwrites its
    stages map and drops those fields, while the UI preserves them correctly.
  boundary: >-
    Do not change product behavior merely to satisfy an old selector. Compare
    the current specification first, especially FAIL-UI-6's retained activity
    guarantee. If product code violates that guarantee, record the concrete
    defect separately before changing it. V64-008's focused research browser
    checks do not prove this full release gate.
  production_defect: V450-003 owns activity retention/refresh; V450-004 owns the Eval media_types consumer crash exposed by a valid common profile. Resume final fixture verification after these prerequisites complete; do not weaken schemas or settled-history assertions.
scope:
  in:
  - Reconcile every listed fixture and selector against its current owner contract.
  - Keep strict response validation and original behavioral assertions where still normative.
  - Execute the whole mocked browser gate with no skipped or flaky cases.
  out:
  - Weakening response schemas, deleting meaningful assertions or restoring obsolete approvals.
  - Unreviewed changes to production UI behavior.
acceptance_criteria:
- id: A1
  text: Every listed failure has a recorded current-contract explanation and an appropriate fixture correction or separately tracked production defect.
- id: A2
  text: make ui-browser-mocked passes all registered specs with no skips or flaky retries.
tests:
- command: make ui-browser-mocked
  covers: [A1, A2]
- command: make ui-verify
  covers: [A1, A2]
- command: make lint
  covers: [A1, A2]
implementation_commit: 6c1f766e18ffba420a826fae3bfca5d25a22f351
verification:
  baseline: Main 360ffd44a plus the V450-003 activity prerequisite reproduced 150 passing and seven failing mocked cases. The corrected common profile fixture separately exposed V450-004's actual Eval rendering defect.
  integrated_main: 89d182bdc74317a9e0f455992f51a496a8dae3e0
  verified_revision: 6c1f766e18ffba420a826fae3bfca5d25a22f351
  results:
    - make ui-browser-mocked passed all 158 registered cases across 27 specs after importing V450-002's research API, CLI, generated clients and browser spec. The existing report validator confirmed zero skipped, unexpected or flaky attempts; response validators and gate inventory checks are unchanged.
    - make ui-verify passed generated-contract checks, lint, both typechecks, 213 unit test files with 2409 passing tests and one declared expected failure, all 17 static-server tests and the production build.
    - make lint passed on the integrated tree, including generated types/schemas, UI gates, Go checks, script/deployment fixtures, release graph, thirteen-migration ERD, task/spec registries and Runtime lint/layers. Optional disk-heavy fixtures were not enabled; skipped checks are not passing coverage.
    - V450-003 browser regressions first failed on the original product at all three widths and then passed, with 40 focused Audit/QueryView/polling unit cases. V450-004's valid-profile crash was reproduced at both setup widths; its six built journeys and 104 focused Eval cases passed after repair.
    - The complete passing Studio spec retains exact parsed YAML, comments, summarizer policies and original catalog retry assertions. Current-contract explanations and originating tasks/commits for every reported failure are recorded above.
    - All gate-owned private builds and static servers were cleaned up by their existing harness. This UI lane created no database, called no live model and changed no original OpenDesign data.
  delivery: Committed on codex/ui-browser-contracts, based on the current research API integration; not merged into main. UI release 0.11.16. API/CLI implementation remains the owning lane's work and was retained through the merge.
