  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
scope:
  in:
  - Verify the shipped profiles/templates/instructions already rewritten by V64-002/V64-012 and the
    V64-013 producer together on common initial tasks, exact materials and bounded continuation. Align
    only remaining integration consumers and remove obsolete configuration paths; do not repeat the
    earlier profile rewrite or introduce a compatibility executor.
  - Preserve standards/checklist provenance and sufficiency. Version changed Audit standard content as
    required; ordinary pre-release catalog changes follow CAT-R74.
  - Delete replaced internal Audit ZIP codecs/manifests, admission/staging/seal/materialization states,
    source-to-consumer remapping and duplicate execution projections only after their concrete callers
    migrate.
  - Supply populated migration/cutover tests that preserve original reports/evidence/source facts and
    do not invent historical hypotheses or verdicts.
  - Update owning specs, API/wire fixtures, ownership/ERD/architecture/config dependencies and all affected
    release selectors in the same implementation changes.
  - Rebind actual managed Eval Audit create/start/cancel/result/selection callers and fixtures without
    redesigning Eval orchestration. Keep check verdicts, problem findings and Run status distinct in shipped
    programs/reports/scorers; refuted bug claims and supported positive properties are not vulnerabilities.
  out:
  - Removing external exports, source archives or Skills merely because they use ZIP; compatibility readers;
    changing configured live models; demo deployment.
  - Changing user model configuration or deploying/migrating the demo.
  - Removing or redesigning Managed Evals, its datasets or scorer truth; changing model selections.
requirements:
- id: R1
  text: Current requirements are revised with code rather than leaving normative behavior inconsistent.
    Strict snapshots/readers have one target representation.
- id: R2
  text: Technical input validation/bounds, evidence completeness, Project authority, batching and truthful
    gaps remain supported; removal is measured by actual callers/representations, not file moves.
- id: R3
  text: No old review/ZIP/admission pipeline is required for the final base scenario. Historical content
    remains exact under the reviewed migration/retention model.
failure_outcomes:
- operation: Migrate shipped programs and remove their replaced execution representations
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Migrate shipped programs and remove their replaced execution representations
  expected: 'Base fixture: 2 ordinary Runs, 2 seeded hypotheses, 1 generated hypothesis and several conclusions.'
  maximum: Keep applicable published LIM-AUD/LIM-FND ceilings unless proposal 0050 explicitly identifies
    a reviewed change; no new full-pool work.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: every migrated shipped program and test-only catalog fixture
  when: catalog and process validation run
  then: supported scenarios resolve on common contracts, preserve exact evidence/source coverage and ordinary
    negative/inconclusive results, and report/score only evidenced problems as findings; the corrected
    producer reads a common material set and a Finding selected during Run without source_XX slots
    or a separate generator execution type
- id: A2
  given: remaining old package/state/SQL/API references
  when: the caller/removal inventory is audited
  then: only documented independent callers remain; no live legacy Audit execution path or lenient reader
    survives, including no numbered-source context adapter retained for compatibility
- id: A3
  given: populated active/paused/terminal source data
  when: cutover and purge regressions run
  then: business facts and original bytes are preserved or closed through an explicitly reviewed outcome,
    with no fabricated history
