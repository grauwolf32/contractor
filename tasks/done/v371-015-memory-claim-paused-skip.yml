schema_version: "1.0"
id: V371-015
title: "Model the paused-owner claim skip in the Scheduler's memory store doubles"
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V370-020
priority: P3
status: completed
depends_on: []
languages: [go]
goal: "The memory claim doubles skip pending Runs of paused owners as the PostgreSQL claim does, and the race in which a pause commits after the claim is covered by an explicit hook instead of by the divergence."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G6), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/execution/scheduler.md#SCH-R163"
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds; file:line references
    moved and are updated below. The claim SQL is unchanged in substance
    (it now lives in internal/runstore/store_sql.go:166-225). Added the two
    memory tests that depend on the divergence, the harness's Stage-less
    running Run, and the wrapping doubles. No V407/V409/V414 task covers it.
  finding: >-
    Since V370-020 the PostgreSQL claim (PostgresStore.ClaimRunnableRun,
    internal/runstore/store.go:466-494, statement claimRunnableRunSQL in
    internal/runstore/store_sql.go:166-225) skips a pending Run whose owner's
    Queue is paused unless one of its active Stages is aborting or holds an
    allocation whose release has not completed (SCH-R163), in both the ready
    and the deferred probe. memorySchedulerStore.ClaimRunnableRun
    (internal/scheduler/scheduler_test.go:2086-2109) never reads the
    queuePaused flag it aliases (scheduler_test.go:2056-2057, wired at :1916)
    and still claims such a Run. TestSchedulerOwnerQueuePauseDoesNotPlacePendingStage
    (scheduler_test.go:1679) relies on that: it pauses before the claim a
    pending Run whose only Stage is preparing with no allocation, so
    PostgreSQL would answer ErrNoWork, while the memory test claims it and
    asserts the in-lane gate (one queue probe, no reservation). V370-020 kept
    the divergence on purpose, so that memory tests keep covering the in-lane
    pause gate (a pause that commits after the claim), but a double that
    accepts what the store refuses lets a test pass on a path production
    cannot reach (AGENTS.md 3.5).
  siblings: >-
    scanClaimStore (internal/scheduler/scan_planner_test.go:116-134) wraps
    memorySchedulerStore and inherits the fix. laneTestStore
    (supervisor_test.go:407-458) and claimAttemptStore, which wraps it
    (lane_refill_test.go:91), hand out paused-owner Runs only in state running
    (supervisor_test.go:448-455; pending fixtures belong to runnable-owner),
    which PostgreSQL also claims; they need no skip but must not gain a
    pending paused-owner Run. postgresLaneBlockingStore
    (supervisor_postgres_test.go:247) and postgresClaimAttempts
    (lane_refill_postgres_test.go:32) wrap the real store and are correct.
    TestSchedulerOwnerQueuePauseDefersInitialAdmissionUntilResume
    (scheduler_test.go:1619) exercises "initial admission" from the harness's
    default running Run without a Stage (newSchedulerHarness,
    scheduler_test.go:1875, Run state at :1892), which production does not
    produce (admission moves pending to running); its production form is a
    pending Run, which SCH-R163 skips. TestSchedulerReleasesPlacementWhenAdmissionRacesPause
    (paused_admission_release_test.go:17) already pauses after the claim
    through the pin hook and stays valid. PostgreSQL already covers the skip
    (TestPostgresClaimSkipsPendingRunsOfPausedOwners, internal/runstore/claim_postgres_test.go:204;
    TestPostgresQueuePauseDoesNotPlacePendingStage in
    deferred_placement_postgres_test.go:377) and a pause after placement
    (TestPostgresPausedAdmissionPlacesStageAgainAfterResume,
    paused_admission_postgres_test.go:22).
scope:
  in:
    - "memorySchedulerStore.ClaimRunnableRun applies SCH-R163's skip, with its aborting-Stage and unreleased-allocation exceptions, read from the store's own Stages and allocations."
    - "TestSchedulerOwnerQueuePauseDoesNotPlacePendingStage, and the initial-admission pause test moved to a pending Run, drive the pause through a hook that commits it after the claim and before the in-lane gate."
    - "A PostgreSQL test that commits the pause after the claim and before the pre-placement queue probe, and proves no reservation is made, if none of the existing PostgreSQL pause tests covers that window."
  out:
    - "The claim SQL, the in-lane pause gate and AdmitStage."
    - "laneTestStore and the other wrapping doubles beyond keeping them consistent with the rule."
acceptance_criteria:
  - id: A1
    given: "A pending Run of a paused owner whose Stages are not aborting and hold no unreleased allocation"
    when: "memorySchedulerStore is asked for a claim"
    then: "It answers ErrNoWork, as PostgreSQL does; with an aborting Stage or an unreleased allocation it still claims the Run."
  - id: A2
    given: "A pause committed by the hook after the claim"
    when: "The memory and PostgreSQL pause tests run"
    then: "The in-lane gate defers the Run without a reservation, and each test fails when the gate is removed."
  - id: A3
    text: "The changed memory double fails a test on the unfixed code: a regression test that asks it for a paused-owner pending Run gets a Run before the fix."
tests:
  - command: "go test -count=1 ./internal/scheduler"
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 -run 'Pause' ./internal/scheduler ./internal/runstore"
    covers: [A2]
  - command: make lint
    covers: [A1, A2, A3]
