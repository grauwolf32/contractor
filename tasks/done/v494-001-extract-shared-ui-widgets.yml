schema_version: "1.0"
id: V494-001
title: Extract shared artifact, report and cost presentation into widgets
milestone: ui-consolidation-2026-10
epic: ui
kind: chore
priority: P3
status: completed
depends_on: []
languages: [typescript, javascript, css]
goal: Shared presentation has explicit owners outside route modules while retaining the current design and data lifecycle.
context:
  authority: User 2026-11-28 approves the first extraction of Artifact preview, Audit report and LLM cost after reviewing the UI dependency graph at revision 86ceaf2.
  finding: Reusable preview renderers live in routes/artifacts, ReportContent is imported from routes/reports by Inbox, and LLMCostCard is composed in app despite being shared subject-specific presentation.
  boundary: Widgets own presentation, local interaction and their CSS. Existing host controllers retain authenticated reads, exact revisions, query keys, polling, cancellation, authorized links and mutations. No widget may import route modules.
scope:
  in:
    - Move loaded artifact rendering, parsers and local tabs/source rendering together, retaining lazy renderer and worker loading.
    - Move report presentation and cost card with their CSS; hosts supply report navigation targets and existing query state.
    - Replace imports directly, remove obsolete paths and outdated widget documentation, and enforce the route boundary.
  out:
    - Finding review and Check workspace extraction, visual redesign, API or schema changes, new polling, plugin registries, main merge and demo deployment.
acceptance_criteria:
  - id: A1
    text: Artifact, report and cost views have production consumers under widgets and no widget imports routes, including dynamic imports or CSS.
  - id: A2
    text: Hosts retain existing query/mutation ownership and exact navigation; safe Markdown, bounded previews, deferred OpenAPI and LikeC4 worker loading are preserved.
  - id: A3
    text: Styles are owned and loaded by the widgets; current desktop/mobile themes and existing behavior regressions pass without compatibility re-exports.
tests:
  - command: make ui-verify
    covers: [A1, A2, A3]
  - command: make ui-gates
    covers: [A1, A2, A3]
  - command: make ui-browser-mocked
    covers: [A2, A3]
  - command: python3 scripts/check_tasks.py
    covers: [A1, A2, A3]
  - command: python3 scripts/check_spec.py
    covers: [A1, A2, A3]
  - command: git diff --check
    covers: [A1, A2, A3]
verification:
  results:
    - VITEST_MAX_WORKERS=4 make ui-verify passed generated-contract checks, lint/format, both TypeScript projects, 230 test files with 2615 passing tests and one existing expected failure, all 17 static-server tests and the production build.
    - make ui-gates passed all 16 Node gate cases, CSS/breakpoint checks, the zero-tolerance export gate and ESLint. The new boundary regression rejects static/re-export/CSS/lazy/Worker route dependencies and scans the real production widget sources.
    - All former presentation paths are replaced directly, with no compatibility re-exports. Forty-seven files are relocated, preserving renderer implementations, lazy imports, worker placement, existing tests and exact-source handling.
    - The cost query hook, Run artifact action controller and Audit projection-refresh owner are byte-for-byte unchanged. Report queries retain their original keys and polling; report hosts now supply the same task-result and coverage-gap destinations explicitly.
    - CSS declaration comparison found no removed property/value declarations. The only added declarations give the scanner title its independently owned equivalent style. Report list/header styling stays with the route; preview, report and cost styles load with their widgets.
    - make ui-browser-mocked passed all 266 browser cases across 37 specs with no failures or skipped cases, covering report/Inbox readers, all preview formats and LLM cost at desktop/mobile widths in the three themes. The final Project and mobile Materials captures were also visually inspected.
    - UI release is 0.11.48. No API, Server, schema or OpenDesign archive changes, deployment or main merge are included. Finding review and Check workspace remain separate later extractions.
implementation_commit: 3dffed35cbb40d54463bd601c7c5efe40a8d576d
