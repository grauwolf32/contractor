schema_version: '1.0'
id: V323-001
title: One configuration ID and version grammar across languages
milestone: review-defects-2026-10-04
priority: P1
status: completed
implementation_commit: 1dcadfc526055b36baea167977235921a735e086
depends_on: []
languages: [go, python, typescript]
decision: >-
  Keep + in the version grammar: id [a-z][a-z0-9_-]* (at most 128 characters)
  and version [A-Za-z0-9][A-Za-z0-9._+-]* (at most 64). No shipped
  configuration uses +, but docs/spec/00-workflow-and-planner.md defines the
  selector version grammar with it, Audit standard versions allow it
  (auditstandards, the public AuditStandardRef and audit-standard routes) and
  AuditProfiles reference them through the configuration version grammar, and
  RuntimeConfig versions, Runtime Agent software versions, capability refs, the
  private schemas and the Runtime already accept it. Only the public
  ConfigVersion and Selector schemas and the UI rejected it, so they align to
  the spec. Configuration names get their own public ConfigurationName schema;
  ConfigId stays the looser identifier used by user IDs, codes and Stage names.
goal: Accept and reject the same configuration IDs and versions in Go, Python, schemas, OpenAPI and the UI.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: medium
  finding: Go accepts + in configuration versions (internal/config/validation.go:16, copied in internal/contracts/common.go:26 and internal/runtimeconfig/normalize.go:28; publication caps length at 64 but ParseSelector has none), as do the private schemas and Python VERSION_PATTERN, while the public OpenAPI ConfigVersion (^[A-Za-z0-9][A-Za-z0-9_.-]*$, maxLength 64) and ui/src/api/workflows.ts:11 reject it. POST /v1/configurations/model-policies with version 2026.1+eu succeeds, then llm-configurations/detail.tsx:126-149 and workflows/detail.tsx:263-271 show 'Configuration route is invalid' and API responses violate the OpenAPI. openapi-conformance.test.ts only compares the UI with OpenAPI. The Runtime Agent ID pattern ^[0-9a-f]{64}$ is copied five times (contracts/registration.go:16, mtls/mtls.go:22, runtimeconfig/principal.go:19, runstore/allocation_store.go:19, runtime_configuration_handlers.go:25).
scope:
  in:
    - Choose one grammar (keep + only if audit-standard or published configurations need it) and define it once in Go; align schemas, Python, OpenAPI and the UI through a shared api/testdata fixture.
    - A Go test probing ParseSelector and publication against OpenAPI ConfigId and ConfigVersion.
    - One Runtime Agent ID pattern; regenerate the public clients.
  out:
    - Audit-standard version rules other than alignment.
acceptance_criteria:
  - {id: A1, text: "Every layer accepts and rejects the same IDs and versions on the shared fixture."}
  - {id: A2, text: "Length limits agree."}
  - {id: A3, text: "Go has one definition for each pattern."}
tests:
  - {command: "go test -count=1 ./internal/config ./internal/contracts ./internal/runtimeconfig ./internal/httpapi/public", covers: [A1, A2, A3]}
  - {command: "cd runtime && uv run pytest tests/test_contracts.py", covers: [A1, A2, A3]}
  - {command: "cd ui && corepack pnpm generate:check && corepack pnpm exec vitest run src/api", covers: [A1, A2, A3]}
  - {command: "make lint", covers: [A1, A2, A3]}
