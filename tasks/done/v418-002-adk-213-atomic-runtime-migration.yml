  finding: Affected paths include worker/runtime.py _run_adk Runner calls and ContinueCompletion, worker/instrumentation.py
    before_run/before_model/before_tool/on_tool_error, llm/openai.py _complete_tool_call_messages, FunctionTool
    raw argument admission and dependency smoke. ADK 2.9 suppresses a second message under a reused SDK
    invocation ID; 2.9 calls before-tool for unknown placeholders; 2.13 routes CancelledError through
    on-tool-error. Default numeric coercion and generic empty-content classification also change behavior
    independently of optional features.
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
  provenance: 'MVP-012/a565c2426b7ca6019de7735f4567ab3b9260c370 introduced the pinned ADK Runtime; V17-002/22b5ebc19df5545b7a28cdc12b5a734777d26f16
    owns instrumentation assumptions; V39-005 introduced common completion continuation. The current 2.8
    implementation passed the ten-case control: this is a compatibility migration, not evidence that every
    path is defective on its supported pin.'
  execution_authority: 'User authorized implementation on2026-10-25: Runtime V418 first, then Server V419.
    V418001 baseline characterization and baseline fixes008/009 are complete.'
scope:
  in:
  - One atomic change to runtime/pyproject.toml, generated uv.lock, exact-version smoke, production adapters,
    owning contract clarifications and regressions.
  - All ten observed failures and newly characterized strict-type, cancellation-classification and empty-output
    cases, including every sibling model/tool/continuation path.
  out:
  - Enabling native auto compaction, SDK resumability, abort_signal, ToolCallIntegrityPlugin, model fallback,
    ModelConsultTool, classifiers, native Skill lifecycle or EAGER discovery.
  - Replacing the custom Gateway adapter, changing configured models, adding legacy ADK support or updating
    unrelated dependencies without a demonstrated requirement.
acceptance_criteria:
- id: A1
  given: A fresh supported Python installation and committed lock
  when: uv sync --locked and dependency smoke run
  then: ADK is exactly 2.13.0, the declared closure installs, the custom Gateway runs without importing/installing
    openai or litellm, and startup succeeds.
- id: A2
  given: Ordinary/Audit continuation in shared and isolated sessions
  when: Several Runner turns and incomplete-result reminders execute
  then: Every intended reminder is visible, one logical owner and collector remain, counters are cumulative
    and external effects are not repeated.
- id: A3
  given: Budget exhaustion/cancel/error during parallel calls
  when: Another model turn or shared invocation follows
  then: Completed results, proven nonexecution and cancelled/ambiguous dispatched outcomes form truthful
    well-paired request history; no hidden replay or lost required context occurs, and an uncertain remote
    effect follows existing receipt reconciliation.
- id: A4
  given: Unknown names, callback rejection, domain failures and child cancellation
  when: The actual ADK callback chain executes
  then: Known-safe names/codes and exactly one call/error record are retained, cancellation classification
    is stable and correlation state is cleared.
- id: A5
  given: An injected clock crosses the deadline at each admission boundary
  when: ADK schedules another model/tool/finalizer/summarizer callback
  then: No new semantic model/tool attempt charge or dispatch starts after expiry; separately authorized
    bounded terminal cleanup still completes under its owning timeout, and uncertain in-flight remote
    effects remain subject to reconciliation.
- id: A6
  given: Malformed raw arguments through production tool wrappers
  when: 2.13 attempts scalar/list coercion
  then: Strict tool admission sees the original values and rejects invalid input before dispatch, while
    every valid documented declaration remains usable.
- id: A7
  given: Empty/thought-only/whitespace/output-limited model responses
  when: Main, Audit, finalizer and summarizer paths consume them
  then: They produce the specified finite safe outcome, account known usage, preserve output-limit precedence
    and never authorize a false result.
- id: A8
  given: All changed Runtime modules and original ten failing cases
  when: Full warning-strict Runtime and cross-language checks run
  then: Required tests execute and pass on the production lock without xfails, suppressed warnings or
    compatibility branches.
