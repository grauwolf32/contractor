  - A2
  - A3
  - A4
  - A5
- command: go test -count=1 ./internal/telemetry/...
  covers:
  - A4
  - A5
- command: make test-wire-cross-language
  covers:
  - A1
  - A4
- command: make test-runtime
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
requirements:
- id: R1
  text: Keep the production custom BaseLlm object, explicit capabilities, literal instruction providers
    and exact model selection. Main Worker remains tools without output_schema; the separate finalizer
    remains tool-free. Real mock-Gateway payloads verify each role, required/nullable/default schemas,
    allowed tool_choice and absence of injected context parameters.
- id: R2
  text: 'Test malformed/truncated JSON arguments, missing usage/choices, MAX_TOKENS, empty visible output,
    reasoning and rejected responses through the actual adapter. Preserve the existing distinction: Contractor-owned
    wire/result schemas are closed and strict, while the OpenAI-compatible provider envelope may contain
    tolerated extension fields. Document current duplicate-key/tool-argument behavior rather than claiming
    it already rejects duplicates; any newly desired duplicate-key rejection is a separately justified
    contract change, not incidental migration. Never replace malformed-JSON recovery/error semantics with
    native JSON-to-empty-dict repair.'
- id: R3
  text: Every spent response, including rejected ones, and every retry is accounted once under existing
    rules. Preserve distinction between overlapping OpenAI reasoning/output token buckets and genuinely
    disjoint provider buckets; missing counts stay unavailable. Previous reasoning is not silently replayed.
- id: R4
  text: Gateway request timeout, retry-after bounds, recovery/probe ownership, permanent/retryable classification
    and cancellation remain unchanged. Exception chains/logs/State retain no credential, request body
    or raw provider error. Test delayed/ambiguous response and cancellation with the existing recovery
    client.
- id: R5
  text: Contractor exporter continues its existing shared GenAI 1.41.1 schema and whitelist; update neither
    fixtures nor Go/Python readers without an explicit owning contract change. Test serialized OTLP messages,
    not only in-memory span stubs; native ADK telemetry is not a second unreviewed export route.
- id: R6
  text: captureContent=false emits metadata only, and sensitive-output tools force allocation-wide metadata-only
    even when true. Ordinary explicit captureContent=true intentionally exports permitted unredacted model/tool/Skill
    content under OBS-R54; verify that positive path separately. Exercise new callbacks and exception
    logging with canary credentials/configuration and content; prohibit credentials/headers/configuration
    on every mode, prohibit model/tool/reasoning content on metadata-only surfaces, and admit only policy-authorized
    content in the enabled path. No unreviewed exporter bypasses these boundaries.
- id: R7
  text: Concurrent tools retain correct ContextVar correlation and exactly-once call/error/token/observation
    metrics for success, before rejection, cancellation, unknown tools and completed siblings. Keep domain
    tool errors distinct from infrastructure exceptions.
- id: R8
  text: Fresh install and a real mock-Gateway invocation import no optional openai/litellm/anthropic SDKs.
    Record dependency graph changes including google-genai/authlib, protobuf/OTel/Starlette compatibility.
    Advisory audit has its own external prerequisites and is not silently substituted for deterministic
    checks.
test_prerequisites:
- Commands below are future implementation acceptance gates, not checks already passed by this planning
  change. A required command, selected case or dependency setup must not be skipped or match zero tests.
- Run full suites of every touched package/module, in addition to focused regressions. Use real ADK dispatch
  and controlled Gateway responses; persistence/process claims require disposable real PostgreSQL and
  real Server/Runtime processes. Never read live configs from unit tests; use testdata and pseudo-Skills.
- Use injected clocks, synchronization barriers, work/row/byte counters and bounded fixture sizes. Timing
  samples are informational, never flaky wall-clock pass thresholds. Keep configured live models unchanged;
  no live Gateway is part of these deterministic tasks.
- Use the repository lock for acceptance, except the explicitly isolated candidate characterization in
  V418-001. Preserve unrelated user changes. Record the tested revision, lock digest, command, executed
  case count, skips and outcome. The 326-case exploratory run is not a substitute for make test-runtime
  or a release gate.
failure_outcomes:
- operation: Runtime operation at the changed boundary
  permanent: Strict invalid input or unsupported SDK behavior fails with the owning classified outcome;
    no permissive fallback or endless retry. A required verification failure blocks completion.
  retryable: Reuse the existing bounded transport/recovery or cleanup policy only; no SDK upgrade-specific
    retry loop or rerun-until-green.
  ambiguous: Reconcile existing receipts, trusted observations and the same operation identity. Test evidence
    preserves the original uncertain outcome; never repeat an external append or side effect blindly.
  cancelled: The existing invocation/allocation or fixture owner cancels and joins all work before cleanup;
    no later dispatch or unowned callback may outlive release.
  timeout: Execution deadline, per-request timeout, cleanup timeout and harness timeout remain distinct;
    injected expiration cannot start a new admitted attempt.
cardinality:
- collection: Calls, event history, retained State/metrics and fixture cases
  expected: Several sequential logical invocations, parallel tool batches and multiple internal Runner
    turns; scale task adds long histories.
  maximum: Existing owning model/tool/subtask/State/Skill byte and item ceilings; V418-006 must inventory
    the containing limits before choosing maximum fixtures.
  bound: Work follows admitted finite inputs and retained history; no unbounded full-catalog scan, private-history
    copy or unrestricted per-callback rescan. Verify bytes/items/work counters, not only input length.
lifecycle:
- entity: Existing allocation-local sessions, clients, tools, callbacks and test evidence
  delete: Existing invocation/allocation owner or isolated test harness owns teardown; never touch another
    allocation or user database.
  cascade: Join generators, tools, clients and serializers before deleting session/workspace state. Preserve
    required publication receipts through their existing owner.
  retention: No new durable runtime entity. Keep only bounded safe test evidence and ordinary published
    results under existing retention policies.
