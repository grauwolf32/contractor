schema_version: '1.0'
id: V418-004
title: Preserve Gateway and telemetry contracts across ADK 2.13
milestone: adk-213-upgrade-2026-10
epic: operations
kind: chore
priority: P1
status: completed
depends_on:
- V418-002
languages:
- python
- markdown
goal: Keep model requests, accounting, error secrecy and Contractor telemetry stable despite changes in
  ADK providers, callbacks and native OpenTelemetry conventions.
context:
  authority: 'User request on 2026-10-25: plan the ADK 2.13 upgrade with every identified compatibility
    change, adjust the existing compaction series, and keep model consultation as a proposal. These pending
    tasks do not start implementation or change the current delivery focus.'
  review: tasks/evidence/v418-adk-213-review.json
  verification_evidence: tasks/evidence/v418-adk-213-gateway-telemetry.json
  specification:
  - docs/spec/execution/worker.md#WRK-R159
  - docs/spec/execution/worker.md#WRK-R166
  - docs/spec/platform/observability.md#OBS-R23
  - docs/spec/platform/observability.md#OBS-R24
  - docs/spec/platform/observability.md#OBS-R53
  - docs/spec/platform/security.md#SEC-R32
  - docs/spec/tools/toolsets.md#TLS-R34
  finding: ADK 2.13 defaults its native telemetry to GenAI v2/1.44 and removes call_llm. Contractor uses
    a separate exporter and shared GenAI 1.41.1 contract, so an automatic public telemetry migration is
    not justified. The native OpenAI adapter tolerates malformed tool JSON differently and does not replace
    Contractor recovery/strict parsing. New callback ordering directly affects ContextVar correlation
    and exactly-once metrics.
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
  provenance: V42-001/530b0072a3d358d997755ad9330f19a126ea23f8 introduced the custom Gateway surface;
    V8-011/9b684356774c679cce8762f7bef757744a4d79d0 owns OTLP/proto integration; V17-002 owns tool correlation.
    Upstream native telemetry changes do not demonstrate an existing Contractor exporter failure.
scope:
  in:
  - Locked custom BaseLlm/Gateway integration, function declarations, usage/reasoning semantics, telemetry
    content isolation and dependency graph verification.
  - Correct concrete regressions found by these contract tests without enabling optional upstream integrations.
  out:
  - Replacing OpenAICompatibleGatewayLlm with LiteLlm/OpenAILlm, enabling Model Armor or native ADK exporters,
    adding model fallback or Consult.
  - Changing Contractor public GenAI schema merely to match upstream defaults, or claiming native ADK
    call_llm removal breaks dashboards without an actual consumer.
acceptance_criteria:
- id: A1
  given: Exact locked dependency graph and actual custom Gateway adapter
  when: Mock-Gateway construction and calls execute
  then: Used BaseLlm capabilities, literal instructions and schemas work; optional provider SDKs remain
    absent.
- id: A2
  given: Malformed, output-limited, reasoning-bearing and rejected responses
  when: All model roles consume them
  then: Strict failures and usage accounting match the spec, with no coerced tool execution or repeated
    reasoning history.
- id: A3
  given: Retryable/permanent failures, recovery waits and cancellation
  when: Gateway attempts terminate
  then: Bounded retries and classified failures preserve ownership and erase request/credential references.
- id: A4
  given: Metadata-only and capture-enabled allocations, including sensitive tools
  when: Actual OTLP serialization and new callback paths run
  then: Serialized shared schema/whitelist is unchanged; metadata-only and sensitive allocations export
    no model/tool/Skill/reasoning canaries, ordinary explicit capture exports permitted content, and every
    mode excludes credentials/headers/private configuration.
- id: A5
  given: Parallel calls and all callback outcomes
  when: Metrics and State are reconciled
  then: Every attempt has one stable correlation and record; no cumulative usage double counting or arbitrary
    tool-name key occurs.
tests:
- command: cd runtime && uv run --locked pytest -W error tests/test_dependency_smoke.py tests/test_openai_gateway_llm.py
    tests/test_telemetry_content.py tests/test_shared_genai_telemetry.py tests/test_instrumentation.py
    tests/test_metrics.py tests/test_sensitive_output_tools.py
  covers:
