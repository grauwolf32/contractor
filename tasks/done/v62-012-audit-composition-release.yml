schema_version: "1.0"
id: V62-012
title: Verify preparation and OpenAPI scans across production boundaries
milestone: audit-workflow-composition
epic: audits
kind: feature
priority: P1
status: completed
implementation_commit: 8c2441f0b3bd2643adb44ca8c70e30c5cdb38c74
depends_on: [V62-011, V389-001]
languages: [go, python, typescript, yaml, markdown]
goal: Prove supplied and generated OpenAPI scan journeys with mandatory persistence, process, browser and current-schema regression evidence.
context:
  delivery_selection: User clarified on 2026-10-21 that this chain and the accepted A overview/B endpoint details must finish before V377-001; keep V64 and generic graph editing out of scope.
  authority: User requested a concrete task plan for extending Audit Workflow composition.
  design: docs/plans/2026-09-20-audit-workflow-composition.md
  specification:
    - docs/spec/audits/audits.md
    - docs/spec/audits/worker-completion.md
    - docs/spec/audits/scans.md
    - docs/spec/tools/scanners.md
  existing_gate_alignment: V380-001 changed the default Project policy to automatic and added activeChecks to Project reads; scanner acceptance fixtures must explicitly select approval-required when they assert review behavior, and strict Project response fixtures must accept the current field.
  boundary: Use disposable infrastructure and controlled local targets; these tests do not demonstrate autonomous pentest readiness or live-model quality.
scope:
  in:
    - Add a mandatory case matrix and release target proving prepare, generated inventory, SQLMap request checks, Nuclei fixed-URL checks and exact retained evidence.
    - Run the source-to-OpenAPI-to-scan catalog through real Server/PostgreSQL/Scheduler/Runtime and a browser using production public endpoints.
    - Exercise prepare failure, invalid generated input, no-Round pause/deadline/cancel/delete, missing scanner/data and explicit gaps.
    - Inject restart, duplicate delivery, lost replies and claim races around preparation, first inventory acceptance, scanner execution and Audit-level repeat prevention.
    - Verify original/derived input provenance, exact source/request/URL refs, source Run deletion, ownership, protected artifacts and release of holds.
    - Run existing Audit, program-library and completion regressions; document new contract rollout and operational diagnostics.
  out:
    - Deferred iterative snapshots/dependency routing, deploy production services, invoke external targets, run paid models or claim findings quality from scripted fixtures.
deliverables:
  - path: make/features.mk
    description: New test-audit-composition-e2e target with mandatory prerequisites and contract/regression selection.
  - path: scripts/test-audit-composition-e2e.py
    description: New fail-on-missing/skip orchestrator and actual case-count reporting.
  - path: tests/e2e/audit_composition_matrix.yml
    description: New contract/fault matrix mapping every required case to its executable owner.
  - path: tests/e2e
    description: Real process, recovery, controlled scanner and database integration fixtures.
  - path: ui/e2e
    description: Full browser creation, preparation, approval, scan and retained-evidence journey against production APIs.
  - path: docs/guides/audits.md
    description: Validated profile usage, limits, dependency behavior and failure diagnostics.
  - path: tasks/evidence/v62-012.json
    description: Create during implementation verification only, recording actual commands, cases, prerequisites, revisions and residual limitations.
acceptance_criteria:
  - id: A1
    text: One real public-API Audit completes the generated-OpenAPI scan journey with exact per-operation inputs, canonical result receipts, retained evidence and truthful coverage.
  - id: A2
    text: SQLMap and Nuclei cases prove distinct request/URL coverage, exact prepared inputs, accepted preparation reuse and retained evidence after source Run deletion.
  - id: A3
    text: Every required recovery/control/ownership/limit fault has an executed test proving durable identity, bounded work and truthful outcomes; mandatory skips and zero-match filters fail the gate.
  - id: A4
    text: A real browser completes setup, preparation, approval, scans and evidence review and correctly displays pending/failed inventory and exact scan provenance.
  - id: A5
    text: Current-schema profiles, deterministic snapshot round trips, obsolete-schema rejection, retained-output behavior, review, reporting, completion and deletion contracts pass their regression gates; historical schema bytes and old client support are not required.
tests:
  - command: make test-audit-composition-e2e
    covers: [A1, A2, A3, A4, A5]
  - command: make test-audits-e2e test-audit-program-library-e2e test-audit-completion-e2e
    covers: [A3, A5]
  - command: make verify-public-api ui-generate-check ui-typecheck ui-test ui-build test-config
    covers: [A1, A4, A5]
test_prerequisites:
  - New test-audit-composition-e2e target and matrix are deliverables, not existing commands or completed evidence.
  - Disposable PostgreSQL via CONTRACTOR_TEST_DATABASE_URL, locked Runtime dependencies, local scanner/target fixtures, mTLS and browser prerequisites.
  - Source/graph and OpenAPI validation capabilities plus scripted model responses; no external provider credentials are required.
verification_requirements:
  - Record exact revision, complete mandatory case list/counts, zero mandatory skips, production boundaries and retained browser evidence.
  - Keep pending/in_progress until all criteria and required checks pass; task planning never supplies implementation_commit or verification results.
verification:
  date: "2026-10-21"
  evidence: tasks/evidence/v62-012.json
  passed:
    - "make test-audit-composition-e2e: 34 mandatory PostgreSQL cases, nine mandatory process cases and one real browser journey; zero skips."
    - "make test-audits-e2e test-audit-program-library-e2e test-audit-completion-e2e: passed, including Operations, Native and External browser stacks; completion verified 198 Go and 412 Runtime cases without selected skips."
    - "make verify-public-api ui-generate-check ui-typecheck ui-test ui-build test-config lint: passed; UI had 2173 passes and one existing expected-failure case."
  scope: Selected preparation/source-to-scan delivery only; V62-005 through V62-008 and V64 remain deferred.
