  - One bounded scripted process scenario covering both modeled Planners, current HTTP declarations and exact
    artifact read repeats.
  - Checkpoint rereading and image/history behavior, preserved budget/metrics and normal completion after correction.
  - An evidence record naming tested revisions, focused commands, case counts, skips, limitations and resource
    cleanup.
