verification_policy: Create TestRuntimeGuidanceAcrossProductionProcesses in this task using existing process
  helpers, and explicitly verify all four named roots ran. Owner tasks supply the affected package/file suites;
  rerun only those invalidated by new changes. Use the locked Runtime environment and one owned disposable
  PostgreSQL database, stop processes/pools then drop it. Optional heavy-I/O stays disabled. The task is integration
  acceptance, not a repair of an earlier defect, so introduced_by does not apply.
