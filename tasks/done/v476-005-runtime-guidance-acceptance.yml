    and feature implementation outside the prerequisite tasks.
acceptance_criteria:
- id: A1
  text: Real Server/Runtime/PostgreSQL and a scripted Gateway demonstrate current Planner state and HTTP limits,
    A,A,A refusal without a third callable execution, normal progress after B, and correct post-checkpoint
    text/image rereading. No guidance block accumulates in retained events and no secret reaches model input.
- id: A2
  text: Budget and failure metrics/history count each refused model attempt once. No early Worker stop, duplicated
    artifact publication, CAS/receipt change or finalizer capacity bypass occurs. Both Streamline/Router and
    ordinary/Audit component regressions pass on the combined code.
- id: A3
  text: Existing session-mode, compaction and controlled-HTTP boundary process regressions selected below pass;
    the new focused scenario is registered in the release graph or explicitly allowlisted with its reason.
    A missing/zero-test selection or unavailable configured database fails, and skips are not passing coverage.
- id: A4
  text: Owning specs and task records agree with the delivered contract. Evidence preserves each focused result
    and any unchanged-evidence reuse; own processes/databases are removed and the final report states whether
    the implementation is merged. No live quality or full-release claim is made.
tests:
