  - Merge current main into the feature branch and reconcile actual source/specification/fixture conflicts.
  - Align the Audit material migration and real-store migration test with the current baseline and current
    retained-dependency schema.
  - Regenerate public clients, ERD, task backlog and dependency graph through their owning generators.
  - Verify the merged Go, public/shared contracts and mandatory real-process workspace cases before --no-ff
    landing on clean main.
  out:
  - New Audit behavior beyond V64-004, changes to Project Finding semantics or Runtime resource ownership.
  - Demo deployment, demo database migration or model selection changes.
