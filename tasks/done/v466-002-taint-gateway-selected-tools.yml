  - A2
- command: go test -tags=e2e -count=1 -timeout=12m -v ./tests/e2e -run '^(TestAgentSkillsMVPProcesses|TestTaintAnnotationsAcrossRealRuntimeProcess|TestProductionMemoryTemplatesAcrossProcesses)$'
  covers:
  - A1
  - A2
- command: make lint
  covers:
