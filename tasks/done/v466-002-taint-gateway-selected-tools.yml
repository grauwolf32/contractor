goal: The existing taint process fixture admits the exact tools selected by its current pinned template
  and reaches its annotation, reuse and telemetry assertions.
demonstration: TestTaintAnnotationsAcrossRealRuntimeProcess completes both mutate and clean-reuse stages
  through the real Server, Runtime and PostgreSQL with its strict scripted Gateway.
context:
  authority: 'User assignment 2026-11-10 continues Worker acceptance and clarifies that configured telemetry
    permits content while excluding credentials. Agent implementation decision: correct this narrow verification
    prerequisite in its own task, as required by AGENTS.md 4.1, without changing production capabilities
    or weakening exact tool equality. The selected finding capability is an existing user-approved V460-001
    contract, not a new proposal to extend the Worker.'
  specification:
  - docs/spec/findings/findings.md#FND-R230
  finding: tests/e2e/taint_annotations_gateway_test.go:22-31 omits finding from taintAnnotationModelTools.
    configs/agent-templates/workspace_taint_analyst_v3_memory.yaml:41-42 explicitly selects security-findings-trace@1
    with finding. Git blame identifies ab5908091, Task V460-001, as the selection change. The process
    test fails before its first scripted step with the exact tool-set mismatch, independently of credentials
    or OTLP assertions.
  siblings: taintMutationGatewayStage and taintCleanReuseGatewayStage share the same explicit oracle and
    require the same correction. The separate Audit trace fixture already expects finding; its missing
    annotation/workspace-change tools are a different outstanding inventory and remain outside this narrow
    prerequisite.
scope:
  in:
  - Add the already-selected finding tool to the shared explicit taint Gateway inventory.
  - Execute the real mutate and clean-reuse process stages and the regular e2e package/lint gates.
  out:
  - Production Toolsets, templates, model calls, Finding behavior, telemetry code or API changes.
  - Deriving expected tools from the system under test, allowing arbitrary extra tools or changing budgets.
  - Audit trace inventory and nuclei timeout classification.
acceptance_criteria:
- id: A1
  given: The current taint template with its explicitly selected trace Finding facade
  when: Both taint Gateway stages validate actual model tools
  then: Their strict explicit inventory includes finding and still rejects every unexpected tool.
- id: A2
  given: Real Server, Runtime, PostgreSQL and the scripted local provider
  when: The taint process case runs within the existing scenario budget
  then: Both stages complete their existing annotation, source-isolation, cleanup and credential checks.
tests:
- command: go test -count=1 ./tests/e2e
