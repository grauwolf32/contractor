    hydration. Retain exact main-only Runtime/configuration sources and validate
    their shared contracts, rather than changing them. Install a verified
    no-fast-forward merge using the existing clean-path/index-base/CAS approach;
    preserve primary changed file bytes modes and staged delta exactly.
