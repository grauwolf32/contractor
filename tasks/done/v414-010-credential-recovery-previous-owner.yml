    On unfixed code (c73ec31908311c84df532550c09486ec7ee9484a) a temporary
    test with the A1 interleaving failed as the finding states: Recover of
    the fresh Service returned nil, it admitted run-new-owner, the held
    COMMIT left a prepared delete, and the restart Recover answered
    credential_in_use for run-new-owner. With the fix in place and Prove and
    AwaitLeaseHandover temporarily made no-ops, the committed A1 regression
    failed with "restart recovery answers credential_in_use: Runs
    [run-new-owner] pin managed-deleting" and the other handover tests
    failed too; both temporary edits were reverted.
