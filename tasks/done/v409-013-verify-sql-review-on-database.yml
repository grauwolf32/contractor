goal: "Close the SQL-review milestone only after retained work is complete and every original claim has a supported disposition with reproducible evidence."
context:
  review: "docs/research/2026-10-23-sql-review.md, sections A-F; revalidated on main 1d533b2db885e0162ebabb01d36470f139546009 on 2026-10-23"
  specification:
    - docs/spec/platform/persistence.md#PER-R16
    - docs/spec/platform/persistence.md#PER-R21
    - docs/spec/platform/persistence.md#PER-R22
    - docs/spec/audits/review-and-reports.md#REV-R194
    - docs/spec/platform/limits.md
  finding: >-
    The original review was static. Subsequent controlled PostgreSQL 17.11
    checks reproduced import contention, an inbox scan/sort, a StartPlanner
    lock-order cycle, and the review-store precondition gap. They also refuted
    several proposed fixes, including INSERT-only artifact admission, weakened
    correlation FKs and all-or-nothing metrics reads. Synthetic fixtures prove
    these mechanisms, not production latency or the universal best query plan.
    Remaining plan, workload and retained-change claims require evidence on
    the implementation revision that this exit task verifies.
  corrected_claims: >-
    EXPLAIN ANALYZE executes its statement. claimAuditSQL in
    internal/auditstore/internal/pgstore/claims_sql.go:15-85 includes a lease
    UPDATE and must not run with ANALYZE on demo under a read-only promise.
    Zero pg_stat_user_indexes scans do not prove an index is unused: constraints,
    statistics resets and rare paths matter. The report-size estimate of
    4096 times 64 MiB is not an admitted workload: auditimport/report_build.go:145-149
    checks the cumulative 64 MiB report limit before each page write and
    restores that accumulated size on resume. Record actual distributions
    separately from defensive storage fixtures and independent schema maxima.
  decision: >-
    This is the final gate, not a prerequisite for V409-007 or a provider of
    a helper needed before other tasks can start. Each implementation task
    collects its own pre-change evidence, including index plans/catalog
    dependencies in V409-007. Reuse an existing test helper where it fits;
    do not add a generic EXPLAIN abstraction solely to satisfy a helper-count
    criterion. A task ID by itself never proves a finding is resolved.
plan:
  - "After all retained tasks are complete, verify their implementation revisions and run the final checks below. For every original claim in sections A-D and open question in F, record confirmed defect, behavior-preserving optimization, unsupported/refuted claim or explicit retained-risk decision with source/spec evidence and the actual disposition."
  - "Record migration/schema version, fixture generator, cardinalities, selectivity, query parameters, pgx custom/generic plan mode and statistics state for retained plan claims. Use EXPLAIN (ANALYZE, BUFFERS) only in a disposable database for any mutating statement, including claim CTEs; include rollback/isolation and statement/lock budgets. A rollback alone does not make a mutating ANALYZE appropriate for demo."
  - "Collect optional demo statistics only through an explicitly read-only bounded transaction: catalog/statistics reads, plain EXPLAIN without ANALYZE for mutations, and bounded SELECT-only ANALYZE after checking the statement and called functions for side effects. Never run DDL, claim acquisition, data seeding or mutating ANALYZE there. A reproducible disposable workload is required regardless of demo availability."
  - "For each index candidate, retain named readers and integrity/FK dependencies alongside workload evidence; record the stats observation window/reset context or mark it unknown. Explain retained and removed indexes individually. Do not force a particular scan node, disable sequential scans or equate absence of an index-name literal with absence of a reader."
  - "Measure row and byte work for relevant Eval projection/comparison pages, total report bytes and Run event history using admitted producers plus separately labelled stress fixtures. Record unresolved production-frequency questions honestly; do not multiply independent maxima or convert lack of observed load into a safety proof."
  - "Update the review's Status with completed implementation commits and acceptance evidence for retained work. For a declined or accepted-risk claim, record the reason, responsible subsystem, enforcement/detection mechanism and condition to reopen. If retained work remains pending, in_progress, deferred, or has a failed required check, leave this exit task incomplete."
scope:
  in:
    - "Final evidence on the retained implementations, query plans, catalog constraints, workload bounds and report dispositions."
    - "Reproducible disposable-database fixtures/tests where the retained task's existing evidence does not establish its acceptance criterion."
  out:
    - "Schema changes, weakening a contract to match an optimization, production/demo mutations or new runtime features."
    - "A mandatory demo connection, arbitrary helper creation, universal index-scan/no-sort assertions and closure by merely assigning a follow-up ID."
acceptance_criteria:
  - id: A1
    text: "Given the original report and the completed retained tasks, every original claim and open question has an evidence-backed disposition on a named revision. Confirmed defects, optional optimizations, refuted claims and unmeasured workload questions are clearly distinguished."
  - id: A2
    text: "Every retained plan/cost claim has a reproducible fixture or a justified non-plan proof, cardinalities and operation/byte bounds. Index decisions preserve constraint guarantees and include reader/catalog evidence. Mutating ANALYZE runs only on a disposable database; any optional demo session is read-only and bounded."
  - id: A3
    text: "Every retained V409-001 through V409-012 task is completed under the normal task policy, with implementation commits and successful required checks. Explicitly declined original subclaims have reasons and reopening conditions; pending follow-ups are not reported as fixes. The dependency graph has no path from an implementation task back to V409-013."
  - id: A4
    text: "On the final integration revision, the real-PostgreSQL suites for the affected packages and make lint succeed; required integration-tagged tests actually run, and skipped, unreachable-database or zero-match runs are not counted as passes. Recorded commands and outcomes agree with the final report."
manual_verification:
  - check: "Manually reconcile the original report, corrected task scopes and final evidence for A1-A3. Check each dependency's completion/commit record, each accepted risk's owner/reopening condition, and the absence of a dependency cycle. Lint alone cannot establish these outcomes."
    covers: [A1, A3]
  - check: "Review the executed SQL/session logs and fixture provenance for A2; distinguish measured plans from inference, and preserve negative findings without claiming production latency was measured."
    covers: [A2]
tests:
  - command: 'CONTRACTOR_TEST_DATABASE_URL="${CONTRACTOR_TEST_DATABASE_URL:?set a disposable PostgreSQL database URL}" go test -tags=integration -count=1 ./internal/agentprincipal/... ./internal/artifacts/... ./internal/auditcontroller/... ./internal/auditimport/... ./internal/auditservice/... ./internal/auditstore/... ./internal/credentials/... ./internal/evalcoordinator/... ./internal/evaldomain/... ./internal/evalservice/... ./internal/evalstore/... ./internal/findingintake/... ./internal/gatewayrecovery/... ./internal/httpapi/public/... ./internal/memory/... ./internal/persistence/... ./internal/planner/session/... ./internal/projectlifecycle/... ./internal/projectstore/... ./internal/rundeletion/... ./internal/runservice/... ./internal/runstore/... ./internal/runtimeconfig/... ./internal/scheduler/... ./internal/telemetry/...'
    covers: [A4]
  - command: make verify-public-api
    covers: [A4]
  - command: make lint
    covers: [A4]
