schema_version: '1.0'
id: V410-012
title: Keep sitemap member identity consistent across declarations and regrouping
milestone: project-sitemap-2026-10
epic: http-tools
kind: defect
introduced_by: V410-001
priority: P1
status: completed
depends_on:
- V410-001
languages:
- go
goal: Keep sitemap member identity consistent across declarations and regrouping.
context:
  authority: User requested a second assessment, task creation and fixes on 2026-10-27. The raw owner-selected blackbox
    input finding is withdrawn; secret filtering is removed by V410-018.
  specification:
  - docs/spec/artifacts/project-sitemap.md
  severity: medium
  finding: 'internal/projectsitemap/reducer.go:367 and :711: a manual concrete declaration and a templated observation
    can create duplicate member IDs; source regrouping discards ambiguity information.'
  siblings: Use one placement and identity rule for observed and manually declared members, including structural
    selectors and source replacement; preserve manual declaration provenance, annotations and suppression. Report
    ambiguous grouping consistently regardless of arrival order.
scope:
  in:
  - Use one placement and identity rule for observed and manually declared members, including structural selectors
    and source replacement; preserve manual declaration provenance, annotations and suppression. Report ambiguous
    grouping consistently regardless of arrival order.
  - Regression coverage on the existing production path and owning contract updates.
  out:
  - Unrelated pending sitemap imports, reconciliation and workflow delivery; new persistence or retention mechanisms.
failure_outcomes:
- operation: Existing sitemap operation
  permanent: Preserve classified syntax, authority, exact selection and stale-intent errors.
  retryable: Use existing attempt and deadline bounds; no new blanket retries.
  ambiguous: Keep original operation identity and existing receipt or immutable view.
  cancelled: Join work through existing allocation/transaction lifecycle.
  timeout: Keep independent operations within their documented bounded allowance.
cardinality:
- collection: Existing map, view, source and observation collections
  expected: Existing proposal workload and realistic regression fixtures
  maximum: Existing LIM-SMT ceilings; no silently increased limit
  bound: Every page, batch and transaction remains bounded by existing count and byte constraints.
lifecycle:
- entity: Existing sitemap resources
  delete: Existing Project and allocation lifecycle
  cascade: No new lifetime or independent persistence owner
  retention: Existing ArtifactStore exact-reference protection and bounded history
acceptance_criteria:
- id: A1
  text: Template then declare then observe, and observe then declare, preserve one concrete member without rejecting
    the batch.
- id: A2
  text: Structural selections, blackbox projection, source replacement and manual declarations preserve identity
    and metadata; ambiguous templates produce an explicit gap before or after observations.
- id: A3
  text: A real PostgreSQL regression exercises both orderings and rejects the unfixed implementation.
tests:
- command: go test ./internal/projectsitemap
  covers:
  - A1
  - A2
  - A3
- command: make test-project-sitemap-postgres
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
implementation_commit: 334c295df7c35c312f8d72a9923d7ffd99b28f28
verification:
  date: '2026-10-28'
  result: passed
  tested_commit: ab35b1afbd246ebe62418873a40bc71e98bbaf31
  commands:
  - command: make test-project-sitemap-postgres
    result: 'Passed on the integrated tree: 13 complete packages, 15 mandatory cases, zero mandatory skips. Includes
      all new real-store regressions and full projectsitemap/controlplane suites. One producer accepted 257 publications
      totalling 360501946 encoded bytes with ordinary history retention.'
  - command: make lint
    result: Passed generated checks, UI gates, go vet/staticcheck/testonlyexports, deployment tests, release graph,
      tasks/specs/fixtures, Ruff and all four Runtime import contracts.
  evidence:
  - Declaration and observation share member identity and grouping; both orders with and without structural selectors
    preserve declarations, annotations and fixed suppression through source replacement.
  - Regroup reports ambiguous matching templates instead of silently ignoring ambiguity. Blackbox projections retain
    only authorized concrete declaration provenance.
  - Selected member/group snapshots retain matching concrete declarations, including structural identity, without
    adding unrelated members or restricted sources. Eight real-store order/snapshot combinations fail against the
    original implementations and pass with the fixes.
  limitations:
  - Verification used disposable local PostgreSQL 17, Go 1.26.9, Node 24.20 and the locked Runtime environment.
    No demo data or primary checkout files were changed.
  - Initial verification completed on codex/v410-011-sitemap-metadata before main integration. Original structured-import, reconciliation
    and remaining delivery tasks retain their status; this does not claim the full V410 release gate.
