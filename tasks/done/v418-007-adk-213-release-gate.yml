  covers:
  - A2
- command: go test -count=1 ./internal/telemetry/...
  covers:
  - A2
- command: make test-runtime-dependencies-audit
  covers:
  - A3
- command: runtime/.venv/bin/python scripts/check_tasks.py
  covers:
  - A4
requirements:
- id: R1
  text: Record a fresh ordinary locked environment for the patched final revision and exact versions/override/source/lock
    hashes. No hidden SDK overlays. Keep every earlier broad source/lock identity unchanged.
- id: R2
  text: 'Every finding from the case manifest has a disposition and owning passing regression: reminder
    identity, interrupted history, unknown names, deadline admission, cancellation classification, raw
    coercion, empty output, resource cleanup, Skills and Gateway/telemetry contracts. New findings become
    resolved tasks, never silent scope omissions.'
- id: R3
  text: 'Follow the later explicit user instruction: after the certifi/OTel update, do not rerun the full
    Runtime, release graph or globalE2E. Execute the focused profile listed under tests once on final
    inputs, reusing the same actual passing012 command records rather than repeating them. State which
    broad stages never ran and which earlier results concern the old lock. A targeted acceptance is never
    represented as a complete full release.'
- id: R4
  text: Run the separate Runtime dependency advisory gate and record result/date/source availability.
    A service outage is unavailable, never clean; an actionable finding requires a resolved owning decision
    before this task completes. This external audit does not become a dependency of the deterministic
    release graph.
- id: R5
  text: Reconcile normative current-pin references, install/deployment/testing instructions, exact smoke
    tests and safe changelog notes. Maintain Contractor public telemetry and API semantics unless explicitly
    changed end to end in the migration; historical reviews retain their original versions.
- id: R6
  text: No dependency on V417 or proposal 0047 is introduced. V417-002 starts only after this exit is
    completed and uses this exact accepted closure. V417-001 terminal reasoning remains independently
    deliverable; if already implemented when this gate runs, cover it as existing behavior without making
    it a prerequisite.
- id: R7
  text: Record whether the branch is merged and the final implementation commit under normal task policy.
    Completion requires every listed acceptance gate, not merely a successful pin or most Runtime tests;
    no deployment is implied.
- id: R8
  text: Historical reuse is attribution only after the dependency lock changes. No old full Runtime/process
    result is promoted as a full run on the patched closure. Pure UI results may retain their unchanged
    Node/UI inputs, but do not imply Python/process acceptance. User-imposed verification scope is recorded
    explicitly in the final report.
test_prerequisites:
- Commands below are future implementation acceptance gates, not checks already passed by this planning
  change. A required command, selected case or dependency setup must not be skipped or match zero tests.
- The later explicit no-full-rerun instruction limits the final closure to the listed targeted profile.
  All earlier full-suite/process evidence retains its original source/lock; no final full-release claim
  is made. Actual process/store claims retain their real fixture boundary.
- Use injected clocks, synchronization barriers, work/row/byte counters and bounded fixture sizes. Timing
  samples are informational, never flaky wall-clock pass thresholds. Keep configured live models unchanged;
  no live Gateway is part of these deterministic tasks.
- Use the repository lock for acceptance, except the explicitly isolated candidate characterization in
  V418-001. Preserve unrelated user changes. Record the tested revision, lock digest, command, executed
  case count, skips and outcome. The 326-case exploratory run is not a substitute for make test-runtime
  or a release gate.
failure_outcomes:
- operation: Verification setup and evidence collection
  permanent: Strict invalid input or unsupported SDK behavior fails with the owning classified outcome;
    no permissive fallback or endless retry. A required verification failure blocks completion.
  retryable: Reuse the existing bounded transport/recovery or cleanup policy only; no SDK upgrade-specific
    retry loop or rerun-until-green.
  ambiguous: Reconcile existing receipts, trusted observations and the same operation identity. Test evidence
    preserves the original uncertain outcome; never repeat an external append or side effect blindly.
  cancelled: The existing invocation/allocation or fixture owner cancels and joins all work before cleanup;
    no later dispatch or unowned callback may outlive release.
  timeout: Execution deadline, per-request timeout, cleanup timeout and harness timeout remain distinct;
    injected expiration cannot start a new admitted attempt.
cardinality:
- collection: Calls, event history, retained State/metrics and fixture cases
  expected: Several sequential logical invocations, parallel tool batches and multiple internal Runner
    turns; scale task adds long histories.
  maximum: Existing owning model/tool/subtask/State/Skill byte and item ceilings; V418-006 must inventory
    the containing limits before choosing maximum fixtures.
  bound: Work follows admitted finite inputs and retained history; no unbounded full-catalog scan, private-history
    copy or unrestricted per-callback rescan. Verify bytes/items/work counters, not only input length.
lifecycle:
- entity: Existing allocation-local sessions, clients, tools, callbacks and test evidence
  delete: Existing invocation/allocation owner or isolated test harness owns teardown; never touch another
    allocation or user database.
  cascade: Join generators, tools, clients and serializers before deleting session/workspace state. Preserve
    required publication receipts through their existing owner.
  retention: No new durable runtime entity. Keep only bounded safe test evidence and ordinary published
    results under existing retention policies.
