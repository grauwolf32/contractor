goal: Close the ADK2.13 migration after the prior broad evidence and user-authorized targeted checks on
  the patched final dependency closure are honestly reconciled; do not claim a repeated full release after
  the last dependency update.
context:
  authority: User authorized Runtime upgrade before Server upgrade, then explicitly prohibited a full
    rerun after the final certifi/OTel update. The final acceptance scope is the targeted profile below.
  review: tasks/evidence/v418-adk-213-review.json
  specification:
  - docs/testing/README.md
  - docs/spec/execution/worker.md
  - docs/spec/execution/runtime-agent.md
  - docs/spec/tools/toolsets.md
  - docs/spec/platform/observability.md
  finding: The initial 326-case exploration was intentionally partial, used temporary dependency overlays
    and skipped a process case. A supported upgrade needs a fresh locked installation, full Runtime, real-process
    coverage and an integrated release record. Compaction V417-002 must use this accepted version instead
    of proving behavior on the old 2.8 baseline.
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
  verification_acceleration: 'Superseded by the later explicit user instruction: «Только полный прогон
    не делай после этого обновления». Stop the remaining full release stages and globalE2E/Runtime reruns
    after certifi/OTel remediation. Retain all earlier broad source/lock provenance and the first advisory
    failure. Complete only focused checks of the patched closure and report the unexecuted full stages
    explicitly.'
  user_scope_change: User expressly waived a full rerun after the final certifi/OTel update on2026-10-25;
    this overrides the earlier full-release plan without falsifying completed tests.
  evidence: tasks/evidence/v418-final-migration-acceptance.json
scope:
  in:
  - Integrated release verification, dependency advisory evidence, ownership/disposition reconciliation
    and final supported-version documentation.
  - Unblock V417-002 through task completion; preserve the independence of V417-001 and keep Consult a
    proposal.
  out:
  - Deployment or migration of a demo database, claiming compaction or consultation implemented, and live-model
    quality claims.
  - Waiving unrelated required release failures, counting zero/skipped cases, requiring V417 completion
    as a prerequisite or rewriting historical evidence as if it used 2.13.
acceptance_criteria:
- id: A1
  given: The integrated revision and a fresh locked environment
  when: A fresh locked smoke and targeted Runtime compatibility profile run
  then: The patched final2.13 closure works without optional providers or regressions in the tested paths;
    no full-suite claim is made for this lock.
- id: A2
  given: All migration case inventories and predecessor evidence
  when: Prior broad records and the final targeted profile are reconciled under the explicit no-full-rerun
    instruction
  then: Required migration critical paths and real Artifact API evidence are accounted at their exact
    source/lock; unexecuted final full stages and lack of a complete final-release run are explicit.
- id: A3
  given: Current dependency advisory data and source availability
  when: The separate advisory gate runs
  then: Results are recorded honestly and actionable blockers resolved; unavailability is not represented
    as a pass.
- id: A4
  given: Documentation, specs and task dependencies
  when: The milestone is closed
  then: All current-version statements agree, the branch/commit status is recorded, compaction waits on
    this exit and terminal reasoning/Consult remain independent.
