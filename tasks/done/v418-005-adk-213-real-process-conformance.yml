  - docs/spec/audits/worker-completion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/lifecycle.md
  - docs/testing/README.md
  finding: The exploratory run skipped test_audit_completion_e2e because it requires the real Go Artifact
    API. Unit and in-memory Runner results cannot prove publication receipt handling, transport cancellation,
    immutable allocation inputs or real cleanup. Existing family gates already cover these boundaries
    and must be extended/reused rather than replaced by a fake store.
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
  process_evidence: tasks/evidence/v418-adk-213-process-spine.json
scope:
  in:
  - Extend existing process fixtures/gates with the migrated continuation, parallel-tool, deadline and
    allocation-release cases.
  - Required-case inventory and safe revision/lock evidence for real-process acceptance.
  out:
  - New A2A/public protocol operations, receipt tables, production deployment/database changes or a duplicate
    broad e2e runner.
  - Live model quality calls, compaction or consultation activation.
acceptance_criteria:
- id: A1
  given: Real Server/Runtime/PostgreSQL and deterministic Gateway
  when: Ordinary and Audit completion scenarios run
  then: Useful continuation, one result owner, exact model pins and real publication receipts are proven
    without skipped required cases.
- id: A2
  given: Every cancellation/deadline/lease and cleanup transition
  when: Process fault injection runs
  then: No unowned local work survives release and no new semantic call starts after the stop boundary;
    already-dispatched uncertain remote effects reconcile through existing receipts, authorized terminal
    cleanup stays bounded, and failure/retryability remain correctly classified.
- id: A3
  given: Lost publication acknowledgement and a later SDK turn
  when: Existing receipt reconciliation occurs
  then: The original committed effect is reused exactly once and request history remains truthful.
- id: A4
  given: Two allocations and invalid/unknown/model-error scenarios
  when: Real transport and database readers observe them
  then: Isolation, strict admission, safe telemetry and authoritative terminal state match the contracts.
- id: A5
  given: Required-case inventory and actual family reports
  when: The process verification is recorded
  then: All required cases executed and passed with revision/lock digests; no mocked-store or skipped-harness
    result is counted as acceptance.
