requirements:
- id: R1
  text: Use real Go Server/Artifact API, locked Python Runtime processes, disposable PostgreSQL with required
    permissions and a deterministic Gateway. Never mark missing DB, unreachable configured DB, zero cases
    or the audit completion harness skip as success.
- id: R2
  text: Cover ordinary and Audit Workers, shared and isolated sessions, multiple completion reminders,
    terminal summarization where already supported, result finalizer and model-free control. One logical
    invocation/collector remains authoritative through multiple SDK turns.
- id: R3
  text: Inject main/tool/finalizer/summarizer cancellation, expiry between steps, child-originated parallel
    cancellation, failed cleanup and lease loss. Prove joined local work before resource removal and no
    new semantic dispatch after cancellation/deadline. An already-sent remote write may complete ambiguously
    and follows existing receipts; separately authorized WRK-R168 terminal auto-export/State finalization
    retains its independent cleanup budget. Distinguish callback admission from provider requests; no
    unowned local callback survives release.
- id: R4
  text: Force accepted Artifact/result publication with lost acknowledgement and reuse the existing receipt/natural
    key. Preserve completed sibling outputs, proven never-dispatched calls and explicitly uncertain dispatched
    outcomes; never blindly repeat a committed or possibly committed side effect or create another publication
    to repair history.
- id: R5
  text: Run unknown tool, invalid raw arguments and empty/thought-only/output-limit cases through the
    real private transport. Server-observed failure/state/metrics agree with Runtime; no success claim
    precedes the authoritative result.
- id: R6
  text: Verify successive allocations, failed prepare rollback, exact published config/model pins, no
    cross-session secrets/Skill activation and idempotent release retry. Update real-store regressions
    in the packages touched by any fix.
- id: R7
  text: Use existing session, observation, summarizer, Skill and Audit gates directly; inspect actual
    case reports when release consolidation skips a family invocation. Add only missing cases and a required-case
    inventory tied to actual test names.
test_prerequisites:
- Commands below are future implementation acceptance gates, not checks already passed by this planning
  change. A required command, selected case or dependency setup must not be skipped or match zero tests.
- Run full suites of every touched package/module, in addition to focused regressions. Use real ADK dispatch
  and controlled Gateway responses; persistence/process claims require disposable real PostgreSQL and
  real Server/Runtime processes. Never read live configs from unit tests; use testdata and pseudo-Skills.
- Use injected clocks, synchronization barriers, work/row/byte counters and bounded fixture sizes. Timing
  samples are informational, never flaky wall-clock pass thresholds. Keep configured live models unchanged;
  no live Gateway is part of these deterministic tasks.
- Use the repository lock for acceptance, except the explicitly isolated candidate characterization in
  V418-001. Preserve unrelated user changes. Record the tested revision, lock digest, command, executed
  case count, skips and outcome. The 326-case exploratory run is not a substitute for make test-runtime
  or a release gate.
failure_outcomes:
- operation: Runtime operation at the changed boundary
  permanent: Strict invalid input or unsupported SDK behavior fails with the owning classified outcome;
    no permissive fallback or endless retry. A required verification failure blocks completion.
  retryable: Reuse the existing bounded transport/recovery or cleanup policy only; no SDK upgrade-specific
    retry loop or rerun-until-green.
  ambiguous: Reconcile existing receipts, trusted observations and the same operation identity. Test evidence
    preserves the original uncertain outcome; never repeat an external append or side effect blindly.
  cancelled: The existing invocation/allocation or fixture owner cancels and joins all work before cleanup;
    no later dispatch or unowned callback may outlive release.
  timeout: Execution deadline, per-request timeout, cleanup timeout and harness timeout remain distinct;
    injected expiration cannot start a new admitted attempt.
cardinality:
- collection: Calls, event history, retained State/metrics and fixture cases
  expected: Several sequential logical invocations, parallel tool batches and multiple internal Runner
    turns; scale task adds long histories.
  maximum: Existing owning model/tool/subtask/State/Skill byte and item ceilings; V418-006 must inventory
    the containing limits before choosing maximum fixtures.
  bound: Work follows admitted finite inputs and retained history; no unbounded full-catalog scan, private-history
    copy or unrestricted per-callback rescan. Verify bytes/items/work counters, not only input length.
lifecycle:
- entity: Existing allocation-local sessions, clients, tools, callbacks and test evidence
  delete: Existing invocation/allocation owner or isolated test harness owns teardown; never touch another
    allocation or user database.
  cascade: Join generators, tools, clients and serializers before deleting session/workspace state. Preserve
    required publication receipts through their existing owner.
  retention: No new durable runtime entity. Keep only bounded safe test evidence and ordinary published
    results under existing retention policies.
