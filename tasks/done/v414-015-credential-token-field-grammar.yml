schema_version: "1.0"
id: V414-015
title: "Accept only sendable HTTP field values as Project target and infrastructure credential tokens"
milestone: review-v407-v409-followups-2026-10
epic: api-contracts
kind: defect
introduced_by: V23-010
priority: P2
status: completed
depends_on: []
languages: [go, python]
goal: >-
  A bearer token or header value stored in a RuntimeCredential, and every copy of it on the private
  allocation wire, satisfies the HTTP/1.1 field-value grammar that the Runtime's httpx and h11 can
  send (ASCII only, no NUL, CR, LF, VT or FF, no leading or trailing space or tab), so an unsendable
  token is rejected at credential creation as invalid input instead of failing every later request
  as a retried transport failure.
context:
  review: >-
    tasks/done/v407-032-http-caido-loop-and-error-classes.yml, verification.declined: "The Project
    target bearer token (HTTPOriginTargetSettings, a Server-validated wire contract shared with Go)
    is not checked against the field grammar here ... A token with a trailing space would still fail
    at send as a retried transport failure."
  specification:
    - docs/spec/tools/http-caido.md#HTP-R33
    - docs/spec/configuration/runtime-config.md#RCF-R111
    - docs/spec/configuration/runtime-config.md#RCF-R113
    - docs/spec/artifacts/projects.md#PRJ-R71
  severity: medium
  finding: >-
    Public creation of http-origin-bearer@1 goes through internal/credentials/runtime_types.go:140-145
    (NewHTTPOriginBearerCredential) and validBoundedSecret at :374-386, which rejects only bytes
    below 0x20 and 0x7f, so trailing or leading spaces and non-ASCII text are accepted. The private
    wire contract checks only size: Go internal/contracts/runtimesettings/runtime_settings.go:404-409
    (HTTPOriginTargetSettings.Validate) and Python
    runtime/src/contractor_runtime/contracts/settings.py:418-436 (HTTPOriginTargetSettings), which
    also admit VT, FF, CR and LF. The Runtime puts the token into "Authorization: Bearer <token>"
    (runtime/src/contractor_runtime/toolsets/common/credentials.py:19-32, http/tools.py:662-673)
    after model input validation. Reproduced on 19f7477f: the Python contract accepts "tok ",
    "tok\x0b", "tok\x0c" and "toké"; h11.Request rejects the first three with LocalProtocolError and
    httpx rejects "toké" with UnicodeEncodeError; runtime/toolsets/http/fields.py is_field_value is
    false for all four. A scratchpad pytest probe that drives http_request through a real httpcore
    TLS connection (CorruptTLSRecordTarget and WorkerToolCallbacks from tests/test_http_toolset.py)
    with httpOriginTarget.bearerToken = "tok " answered retryable http_request_failed after retry
    waits [0.25, 0.5] and three connections; with "toké" it answered non-retryable
    http_request_invalid on every call, although the model supplied nothing invalid.
  siblings: >-
    Same rule, all in scope: http-proxy-bearer@1 (Proxy-Authorization, credentials.py:35-48;
    runtime_settings.go:195-199; settings.py:460-463), caido-bearer@1 (runtime_settings.go:117-121;
    settings.py:488), interactsh-token@1 (runtime_settings.go:162-166), the LLM Gateway token sent by
    the Runtime model client, and otlp-headers@1 values (Go validHeaderValue at
    runtime_types.go:388-395 allows tab, trailing space and non-ASCII; settings.py:406 rejects only
    CR and LF; the OTLP exporter sends them through httpx). Already correct: model-supplied headers,
    session bearer tokens and cookies (http_session_set, HTP-R33, V407-032); Basic credentials,
    which are base64-encoded before sending (keep the username colon rule). Out of scope: the Go
    Server's own outbound headers (net/http validates them separately).
  provenance: >-
    git blame on runtime_types.go:140-145 gives d4eee1b9786a "feat: add project HTTP target
    credentials", the implementation_commit of V23-010; validBoundedSecret (:374-386) and the
    infrastructure token kinds come from 39a06e14284b (V8-002). The wire Validate methods were
    moved by e666ac9f without changing the rule.
scope:
  in:
    - "One field-value grammar for credential tokens and header values in Go (one exported definition used by credentials material constructors, material decoding and runtimesettings Validate) and in Python (fields.is_field_value used by the contracts settings validators)."
    - "Extend api/testdata/v1alpha1/runtime-settings-bounds-cases.json, or add a field-value fixture registered in api/testdata/readers.json, with token and header-value cases: trailing space, leading space, tab, VT, FF, CR, LF, NUL, non-ASCII, internal space runs and the 8192-byte bound; Go, Python and allocation.schema.json give the same verdicts."
    - "Keep runtime/tests test_field_grammar_matches_the_h11_serializer pinning the Python grammar to h11 and add the same corpus to the shared fixture."
    - "Public RuntimeCredential creation answers the existing invalid-request error for an unsendable token, and OpenAPI states the grammar for the material token and header-value fields (additive within /v1)."
  out:
    - "Changing size bounds (LIM-RCF entries)."
    - "Retry classification of genuine transport failures."
    - "Byte-bound declarations of other machine values (V414-009)."
failure_outcomes:
  - operation: "POST /v1/runtime-credentials with an unsendable token or header value"
    permanent: "400 invalid_request (the existing runtime credential validation error), nothing stored, no Gateway or remote call"
  - operation: "allocation delivery of RuntimeSettings carrying a token that violates the grammar (store written before the rule)"
    permanent: "the Runtime rejects the settings as a wire contract violation before any request; pre-production, so no legacy reader is added"
acceptance_criteria:
  - id: A1
    given: "a RuntimeCredential create request of kind http-origin-bearer@1, http-proxy-bearer@1, caido-bearer@1 or interactsh-token@1 whose token ends in a space or contains non-ASCII text, and an otlp-headers@1 value with a trailing tab"
    when: "the Server handles it"
    then: "it answers 400 invalid_request and stores nothing; a token within the grammar is still accepted"
  - id: A2
    given: "every case of the shared token fixture"
    when: "Go runtimesettings, the Go credential constructors, the Python contracts and the allocation JSON Schema check it"
    then: "all give the fixture's verdict, and the Python grammar still agrees with h11.Request on the whole corpus"
  - id: A3
    given: "an http_request to the Project target with a valid configured token"
    when: "it is sent through the real httpcore transport"
    then: "the Authorization header is the configured token and no retry occurs"
  - id: A4
    given: "the unfixed code at 19f7477f"
    when: "the shared fixture cases for trailing space and non-ASCII tokens run on both sides"
    then: "they fail in Go and in Python"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/credentials/... ./internal/contracts/... ./internal/httpapi/public/..."
    covers: [A1, A2, A4]
  - command: "cd runtime && uv run --locked pytest -q tests/test_contracts.py tests/test_http_toolset.py tests/test_shared_runtime_settings_bounds.py"
    covers: [A2, A3, A4]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> make test-wire-cross-language"
    covers: [A2]
  - command: make verify-public-api
    covers: [A1]
  - command: make lint
    covers: [A2]
decision: >-
  Credential tokens and header values use a stricter grammar than the model-input grammar of
  HTP-R33: one or more visible ASCII characters (0x21-0x7E) with runs of space or tab only between
  them, so every control character is rejected, not only NUL, CR, LF, VT and FF. Guarantee: the value
  is sent unchanged by every sender of the same credential. Evidence: h11 accepts other control
  characters (its field-vchar is any byte but NUL and whitespace), but the Server sends the same
  values through Go net/http (Planner OTLP export with otlp-headers@1, the Planner Gateway client
  with the LLM token), whose httpguts.ValidHeaderFieldValue rejects every control character except
  tab and whose Header.Write trims surrounding whitespace; the Runtime credential constructors
  already rejected control bytes before this task, so the stricter rule loosens nothing.
  Alternative rejected: the h11 grammar itself (contracts.fields.is_field_value), which would accept
  values the Server cannot send. Model-supplied input keeps the h11 grammar, so pentest requests may
  still send any h11-sendable value. Reversal condition: a credential kind that only the Runtime
  sends and that needs control characters. Basic credentials are base64-encoded and keep their
  existing rules. The private schema pattern ends in $(?!\n) because Python re.search, used by
  jsonschema, lets $ match before a final newline; the public OpenAPI pattern has no lookahead
  because kin-openapi compiles RE2.
