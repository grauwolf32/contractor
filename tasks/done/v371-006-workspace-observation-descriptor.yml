schema_version: "1.0"
id: V371-006
title: "Take the Worker tools that observe the workspace from the shared Toolset descriptor"
milestone: hub-audit-defects-2026-10
epic: planner-worker
kind: chore
priority: P3
status: completed
depends_on: []
languages: [go, python]
goal: "The Server decides whether a Worker binding has workspace observations from the same descriptor data the Runtime uses to record them, not from its own tool list."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G2), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/tools/toolsets.md#TLS-R38"
  finding: >-
    selectedWorkspaceObservation (internal/planner/streamline/factory.go:295-321,
    called at :206) hard-codes which selected tools make a Worker binding
    workspace-eligible for the Planner State projections: ls, glob,
    read_file and grep of filesystem@1, nine edit-files@1 tools (write_file,
    append_file, rm, insert_line, edit, replace_range, cp, mv, mkdir), the
    three taint-annotations@1 tools and changed_paths of
    workspace-changes@1. The Runtime decides which tools record a workspace
    observation separately, in runtime/src/contractor_runtime/observations.py:36-97
    (filesystem_tool_observation, edit_tool_observation,
    annotation_tool_observation, workspace_changes_observation; mkdir
    records an empty observation). api/testdata/toolset-descriptors.json,
    the shared record of every built-in Toolset (TLS-R38, extended by
    V369-006), has no field for it, so a tool added to one list and not the
    other makes the Planner's workspace projections report data as
    unavailable or offer projections the Worker never fills (AGENTS.md
    3.1). Predates the shallow history (boundary 6349621).
  siblings: >-
    Server: selectedWorkspaceObservation is the only Go copy; stateview
    Binding.WorkspaceEligible (internal/planner/stateview/service.go:49)
    carries its result. The Server descriptor that would hold the new
    classification is resolved.ToolsetDescriptor
    (internal/config/resolved/descriptors.go:39-57, next to ActiveCheckTools
    and FindingProposalTools). Runtime: the extractors in observations.py and
    the four tool classes whose contractor_observation calls them
    (toolsets/filesystem/tools.py:352-357, toolsets/edit_files/tools.py:134-139,
    toolsets/taint_annotations/tools.py:262-267,
    toolsets/workspace_changes/tools.py:186-191); no other Toolset implements
    contractor_observation. Descriptor parity tests:
    TestSharedToolsetDescriptorParity
    (internal/config/resolved/descriptors_test.go:188) and
    test_shared_toolset_descriptor_parity (runtime/tests/test_capabilities.py:57);
    api/testdata/readers.json:44 declares Go and Python readers of the
    fixture.
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds; the Go switch and the
    Runtime extractors are unchanged in substance and the fixture still has
    no observation field. Refreshed references: the function moved to
    factory.go:295-321, the Go parity test moved from
    internal/config/config_test.go to internal/config/resolved/descriptors_test.go,
    so the Go test command now names ./internal/config/resolved. The
    baseline for A2 is b523ae77 instead of a07f5e9 (the selection rules did
    not change between them).
scope:
  in:
    - "A per-tool workspace observation classification in the Server Toolset descriptor and in toolset-descriptors.json, checked by both parity tests."
    - "selectedWorkspaceObservation reads it; the Runtime tool classes that implement contractor_observation are tested against it (or registered from it), so a tool with an extractor but no classification, or the reverse, fails."
    - "TLS-R38 names the new classification."
  out:
    - "Which tools observe the workspace: behaviour stays as on b523ae77, mkdir included."
acceptance_criteria:
  - id: A1
    given: "A tool marked as observing the workspace in only one of the Server descriptor, the shared fixture and the Runtime factory"
    when: "The parity tests run"
    then: "They fail."
  - id: A2
    text: "Every AgentTemplate selection that was workspace-eligible on b523ae77 still is, and no other one is (a table test over every built-in Toolset tool)."
  - id: A3
    text: "The A1 mutation (a tool removed from one side) is not detected by the parity tests on b523ae77, and is detected after the change."
tests:
  - command: "go test -count=1 ./internal/config/resolved ./internal/planner/streamline ./internal/planner/stateview"
    covers: [A1, A2, A3]
  - command: "cd runtime && uv run pytest tests/test_capabilities.py tests/test_observations.py tests/test_filesystem_observations.py"
    covers: [A1, A3]
  - command: "make test-wire-cross-language"
    covers: [A1]
  - command: make lint
    covers: [A1, A2, A3]
