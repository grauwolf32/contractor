schema_version: "1.0"
id: V371-010
title: "Drop the report projection of a proposal receipt discarded by Run deletion"
milestone: hub-audit-defects-2026-10
epic: findings
kind: defect
introduced_by: V368-001
priority: P2
status: completed
implementation_commit: 10b6d5fd00eb3fb6ea325721662a64c1241fcb89
depends_on: []
languages: [go, sql]
goal: "A discarded finding proposal receipt keeps only bounded tombstone provenance, as FND-R154 and DEL-R29 require, not the proposal's report projection of up to 8 MiB."
context:
  review: "Out-of-scope finding of the hub audit fix batch, sent by the coordinator on 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/findings/findings.md#FND-R154"
  severity: medium
  finding: >-
    V368-001 (f6a874b; internal/persistence/migrations/000004_audit_report_pages.sql:18-24)
    added report_projection, the canonical report fields of the proposal
    (2 bytes to 8,388,608 bytes of text), to finding_proposal_receipts so
    that report finalization need not read proposal artifacts. Run deletion
    (internal/rundeletion/deleter.go:99-105) calls
    findingintake.MarkSourceRunDeleted (internal/findingintake/run_deletion.go:17-26
    with markSourceRunDeletedSQL, run_deletion_sql.go:10-22), which marks
    every unimported receipt discarded before the RunScope purge removes the
    proposal and evidence revisions, but the receipt row keeps
    report_projection. The current immutability trigger
    contractor_protect_finding_proposal_receipt_retention
    (internal/persistence/migrations/000025_finding_comparison_reads.sql:46-66)
    replaces fingerprint_projection and anchor_projection with
    unavailable/discarded markers on discard and recomputes
    comparison_projection (which contractor_finding_comparison_projection,
    :3-14, already makes unavailable for a discarded receipt), but it lets
    no other column change, and report_projection is NOT NULL with at least
    2 bytes. The proposal content therefore outlives its deleted source Run
    until its Project is purged (DEL-R61, V368-009), and forever for a Run
    outside any Project, while FND-R154, DEL-R28 and DEL-R29, LIFE-DEL-6
    and LIFE-FND-1 allow only bounded tombstone provenance for a discarded
    proposal; LIFE-FND-1 already says that discarded projections retain only
    unavailable/discarded markers.
  siblings: >-
    Receipt columns: fingerprint_projection, anchor_projection and
    comparison_projection are already reduced to discarded markers on
    discard (V397-001, V397-002, V397-004; migrations 000022, 000023, 000025).
    Still to decide and record: report_projection (this finding), evidence
    (jsonb array of exact evidence descriptors, up to 1 MiB) and
    proposal_ref (object, up to 4 KiB), which may be provenance rather than
    content. Readers of report_projection: report finalization of held
    receipts (internal/auditstore/internal/pgstore/report_build_sql.go:86-102),
    the Project purge byte budget (internal/findingintake/project_purge.go:26,
    LIM-DEL-3) and intake insert (service_sql.go:38); replay after source Run
    deletion must still work (FND-R167). Audit-held receipts keep the
    projection, which report finalization reads (V368-001). Public and UI
    receipt projections must not show content of a discarded receipt: the
    Audit inbox (FND-R186) lists only native receipts whose source Run still
    exists plus held receipts, and the comparison projection is unavailable
    for discarded receipts; confirm no other public read returns it.
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds; no later migration
    touches report_projection on discard. Changed since a07f5e9: the receipt
    discard moved from internal/rundeletion/deleter_sql.go into
    internal/findingintake (MarkSourceRunDeleted), the retention trigger was
    redefined three times (000022, 000023, 000025) and now already replaces
    the fingerprint, anchor and comparison projections on discard, so the
    fix should extend that trigger in the same way; Project purge now
    deletes tombstones (V368-009, migration 000010). File references, the
    sibling list and the baseline commit were refreshed.
scope:
  in:
    - "Replace or clear report_projection when a receipt becomes discarded (a migration that extends contractor_protect_finding_proposal_receipt_retention like the fingerprint/anchor markers, or changes the column, and clears receipts discarded before it)."
    - "Decide for evidence and proposal_ref whether they are bounded provenance or content, apply the same treatment to any that are content, and record the decision."
    - "State in LIFE-FND-1, FND-R154 and DEL-R29 exactly which receipt fields a discarded tombstone keeps, with their bounds."
    - "A PostgreSQL test that deletes a source Run with one imported and one unimported proposal and reads both receipt rows."
  out:
    - "Receipt deletion on Project purge (V368-009, delivered)."
    - "Audit-held receipts and their report projection."
    - "The fingerprint, anchor and comparison projections (already reduced on discard)."
acceptance_criteria:
  - id: A1
    given: "A source Run with one unimported and one imported proposal"
    when: "The Run is deleted"
    then: "The discarded receipt keeps no report projection or other proposal content, and the audit-held receipt keeps the projection report finalization needs."
  - id: A2
    text: "Report finalization of the destination Audit still renders the imported finding, and replay of the discarded submission still reconciles from the receipt (FND-R167)."
  - id: A3
    text: "The migration clears report projections of receipts discarded before it, and a direct UPDATE that changes report_projection of a source-held or audit-held receipt is still rejected by the trigger."
  - id: A4
    text: "The real intake/import/Run-deletion regression fails before the fix on a7b1c76d (the refreshed current-main baseline)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 -tags integration ./internal/rundeletion ./internal/findingintake ./internal/auditimport ./internal/persistence/postgres"
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]

implementation_notes:
  baseline: a7b1c76d
  decisions:
    - The existing receipt retention trigger clears report_projection to the two-byte empty object on discard; migration 000045 also erases already discarded reports. A CHECK rejects discarded report content supplied directly at INSERT.
    - Exact proposal_ref (4 KiB JSON) and evidence descriptors (1 MiB JSON) are bounded identity/provenance, not Artifact payload. They remain immutable for exact submission replay; the real-service test replays both retained and discarded receipts after deleting every original input.
    - The trigger is shared by ordinary Run deletion, native Audit Run deletion and final Audit-hold removal. Existing fingerprint, anchor and comparison discard markers remain unchanged.
    - Public Run reads require the Run; Audit receipt readers require a live native source or a destination hold. Discarded tombstones supply only replay provenance, never report_projection or hydrated proposal content. Audit report reads use admitted findings whose holds preserve the projection.
  regression_before:
    command: go test -count=1 -tags integration -run '^TestPostgresFindingFingerprintIntakeReplayAndRetention$' ./internal/findingintake
    result: Failed on a7b1c76d after real Run deletion; an unimported receipt retained description, title, locations and severity instead of the empty report object.
  validation:
    - command: go test -count=1 -tags integration ./internal/rundeletion ./internal/findingintake ./internal/auditimport ./internal/persistence/postgres
      result: Passed with PostgreSQL 17 and an independent locked Runtime environment; package times 0.727s, 104.679s, 34.746s and 37.902s. Canonical TMPDIR avoids the macOS /var symlink in filesystem blob fixtures.
    - command: go test -count=1 ./internal/persistence
      result: Passed, including SQL placement and schema ownership checks.
    - command: python3 scripts/erd/build_erd.py
      result: Generated schema version 000045 from a scratch database; 73 tables and 101 foreign keys.
    - command: make tasks-backlog
      result: Passed; 1270 task records are consistent.
    - command: python3 scripts/check_spec.py
      result: Passed; 47 specification documents are consistent.
    - command: python3 scripts/check_database_erd.py
      result: Passed; the diagram matches all 45 migrations.
  remaining_verification: []

