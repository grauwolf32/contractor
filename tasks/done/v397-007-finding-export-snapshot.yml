  - A2
  - A3
- command: make test-wire-cross-language test-findings-e2e verify-public-api
  covers:
  - A1
  - A2
  - A3
- command: make ui-verify test-ui-stack
  covers:
  - A1
  - A3
- command: make lint
  covers:
  - A3

verification_scope:
  authority: "User decision on 2026-10-29: continue SARIF with complete checks of touched packages; record the full Runtime gate as a limitation."
  full_runtime: "The macOS full run was interrupted after 11 failures, 3257 passes and 5 skips; failures were outside SARIF, including known V401-007 platform cases and pentest identity socket tests. No complete Runtime pass is claimed."
  linux_attempt: "A local Podman VM was available, but package repositories returned HTTP 403 while preparing an isolated Linux runner; no Linux pass is claimed."

implementation_evidence: tasks/evidence/v397-007-verification.json
implementation_notes:
  - "Each Audit owns four frozen Artifact bindings in its existing ProjectScope namespace: snapshot, SARIF, diagnostics and replay receipt. Existing bounded purge removes them; no new table or lifecycle is introduced."
  - "The frozen includeDuplicates flag defaults to false. Grouping uses selected qualified primary-key equality and explicit same-Audit duplicate links; the chosen member keeps its own triage and presentation. True emits all selected results, and every identity remains in the snapshot."
  - "The selection-local grouping basis and member IDs are frozen. Global Project representatives/revisions are not queried or used: unselected peers do not affect this export. Revisit that boundary only for an explicitly requested comparison export with a versioned policy."
  - "POST /v1/audits/{auditId}/findings/exports returns a separate exportId and Location ending in /content; /snapshot and /diagnostics download immutable siblings. The content suffix avoids wildcard crossover with duplicate-candidates."
  - "Resource-first method dispatch is required for the literal exports collection beside findings/{findingId}; the same read-only method map serves CORS, and existing HEAD/405 and diagnostic patterns remain intact."
  - "CLI production consumers accompany publication so the new endpoints are reachable. Full structured SARIF rendering and the UI remain dependent stages; the base projection reports pending structured mapping explicitly."

