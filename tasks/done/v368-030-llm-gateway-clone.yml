schema_version: "1.0"
id: V368-030
title: "Deep-copy LLMGateway configuration in snapshot accessors"
milestone: hub-audit-defects-2026-10
epic: workflows
kind: defect
priority: P3
status: completed
implementation_commit: "531b3a5a138bf5c517688d17bd14baf0d14e3e0d"
depends_on: []
languages: [go]
goal: "The reflection test fails on the current clone and passes after the fix."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), config G2; file:line as of 02bbdcbf, re-verify on current main"
  finding: >-
    Snapshot.LLMGateway and the resolved Workflow clone share
    *FailureSignatures with the snapshot (snapshot.go:195-204,
    execution_config.go:388), against the contract that every accessor
    returns a deep copy (snapshot.go:13-14). Introduced with a57162ff.
  decision: >-
    Reproduced on 4146eea: TestSnapshotAccessorResultsShareNoMemoryWithSnapshot
    walks every exported Snapshot accessor's result by reflection (pointers,
    slice backing arrays and maps, through interfaces and unexported fields)
    and reported 61 shared allocations before the fix: the declared
    FailureSignatures of the one Gateway body reached LLMGateway, Workflow,
    Workflows, ResolveRunWorkflow, AuditProfile and AuditProfiles results.
    It also found a sibling: the ExecutionConfig resource body of
    Configuration/Configurations embedded the snapshot's own
    *LLMCredentialRef. The test fails when a new exported accessor is not
    exercised, and its catalog declares failure signatures, Planner and
    Worker selections with credentials, an inline escalation override, an
    ExecutionConfig profile with every field and a cleared credential, scan
    plans and AuditProfiles. Fix: ResolvedLLMGatewayConfig.Clone and
    GatewayFailureSignatures.Clone in contracts/llmgateway are the one deep
    copy, next to the type, so a new field is cloned where it is declared;
    config (snapshot, execution config, profiles, publication), the Runtime
    config resolver and ResolvedRuntimeConfig.Clone (same shallow copy,
    regression test TestResolverAndCloneDetachTheGatewayBody), and the
    scheduler's Runtime settings (a correct hand copy) use it. The resource
    body now carries the credential ref by value; its JSON is unchanged.
    The runtimeconfig ModelPolicy clone was a duplicate of
    ResolvedModelPolicy.Clone and was replaced too. Ruled out: controlplane
    placement and credentials read Gateway bodies from accessor results
    (already detached copies) and never mutate them. introduced_by is not
    recorded: a57162ff is outside this shallow clone and no task file names
    it. Reversal condition: none; a value-only Gateway body would make the
    clone unnecessary.
scope:
  in:
    - "Deep copy plus a reflection test that no accessor result shares a pointer with the snapshot."
  out:
    - "Values returned."
acceptance_criteria:
  - id: A1
    text: "The reflection test fails on the current clone and passes after the fix."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test ./internal/config"
    covers: [A1]
