    document yields; a deleted unprepared draft shows its authoring setup without readiness or plan; an
    external registration has setup and planSha256 and no readiness; a malformed stored readiness
    answers 500 and a schema-invalid one 422 eval_invalid).
  - >-
    A1: with public.go, selected_views.go, review.go and readiness.go of evalservice restored from
