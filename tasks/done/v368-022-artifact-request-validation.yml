schema_version: "1.0"
id: V368-022
title: "Tighten Artifact namespace and revision validation"
milestone: hub-audit-defects-2026-10
epic: projects-artifacts
kind: defect
priority: P2
status: completed
implementation_commit: 657bee3104acb121eac43107a3e8c7261a5029ca
depends_on: []
languages: [go]
goal: "Tests for each of the three cases."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), artifacts G5, G6, G7; file:line as of 02bbdcbf, re-verify on current main"
  specification:
    - docs/spec/artifacts/artifact-store.md#ART-R16
    - docs/spec/artifacts/artifact-store.md#ART-R25
    - docs/spec/artifacts/artifact-store.md#ART-R37
    - docs/spec/artifacts/artifact-store.md#ART-R70
    - docs/spec/api/public-api.md#API-R70
  decision: >-
    Catalog Namespace: ART-R25 reserves exactly audit-standards, so
    IsAuditStandardCatalogNamespace compares the exact name. Every guard
    shares it: the generic UserScope write, the public user PUT, the user
    read, metadata, versions, lineage and archive routes, and Git import.
    The user list had used the prefix filter only because the hard exclusion
    of listArtifactBindings overwrote the caller's excludeNamespace;
    BindingPageQuery.HiddenNamespace is now its own storage predicate
    (validated like the other Namespace fields and honoured by the public
    test fake), used by the user list (audit-standards) and the Run list
    (contractor-system), so both exclusions apply before keyset pagination.
    If-Match: the public artifactWritePrecondition, shared by the User and
    Project PUT and both Git import routes, accepts exactly one plain
    double-quoted revision that passes contracts.ValidResourceID (API-R70,
    LIM-API-19) and answers anything else, including the escaped or
    single-quoted spellings httpx.ParseStrongETag would unquote, with 400
    invalid_request before the store. The OpenAPI document gains an
    ArtifactIfMatch parameter with the same grammar for the four operations
    (the generic IfMatch stays on putRuntimeLabel, whose decimal revision has
    its own parser), and TestArtifactIfMatchContractMatchesTheServer compares
    contract and Server on a probe set. Ruled out: the private If-Match,
    whose revision is an opaque id in api/v1alpha1 that the Runtime only
    echoes (a junk value can only conflict); tightening it or
    httpx.ParseStrongETag, which the private API shares with a Python client
    that quotes with json.dumps, belongs to the cross-language wire
    fixtures. publicclient.QuoteETag only checks that a revision can be sent
    as a header; the Server stays the authority. Worker inputs: Workers may
    advance an existing inputs/<slot> working copy by CAS (ART-R37, ART-R77)
    but never create a binding in inputs. ScopedStore.Write refuses a
    RunScope create there with ErrReservedNamespace (private 403
    artifact_access_denied, retryable false) whether or not the name exists,
    so only the trusted ForkInput and ForkProjectInput create inputs/<slot>
    (ART-R76). Alternatives rejected: denying every Worker write to inputs
    (removes the working copies ART-R77 promises; the scheduler retry test
    advances an input revision), keeping creates (Worker-chosen names appear
    among the Run inputs of the public Run detail, including a forged
    optional input that was absent at creation), and checking names against
    the Workflow input slots (puts the Workflow snapshot on the allocation
    write path and still lets a Worker supply an absent optional input). No
    production writer creates inputs through the generic path: Runtime
    writers use the Stage Agent Namespace, which cannot be inputs, findings
    documents go to findings-<digest>, and no shipped instruction asks for
    it. Reversal: a Workflow that needs an input-like binding during the Run
    that neither an ordinary Stage Namespace with a context mapping nor a
    new trusted operation can provide. Tests that created RunScope inputs
    through the generic write (scheduler createSchedulerRunInProject, the
    public archive test, the private handler, deadline, cross-language and
    paged-list tests) now use the trusted fork or an ordinary Namespace.
    Each new test fails on the pre-fix code (go test -overlay with the
    previous visibility.go, service.go, request.go and artifact_handlers.go).
    introduced_by is not knowable in this shallow clone.
  finding: >-
    IsAuditStandardCatalogNamespace checks a prefix
    (artifactpolicy/visibility.go:22-23) where ART-R25 reserves exactly
    audit-standards, so audit-standards-notes is hidden and unwritable.
    Public If-Match is parsed without the revision grammar
    (httpapi/public/request.go:130) and junk gives 409 instead of 400.
    Workers can create arbitrary inputs/<name> bindings (service.go:141-145)
    that then appear in the Run detail; ART-R16 is ambiguous.
scope:
  in:
    - "Exact reserved name; If-Match uses publicRevisionPattern; decide and enforce whether Workers may write inputs, recording it in artifact-store.md."
  out:
    - "Existing valid names."
