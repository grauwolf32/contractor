schema_version: "1.0"
id: V449-002
title: Stop allocation retries after a pinned engagement credential is deleted
milestone: standalone-run-engagement
epic: execution-core
kind: defect
introduced_by: V449-001
priority: P2
status: completed
depends_on: [V449-001]
languages: [go]
goal: >-
  Resuming an ordinary Run after deleting its pinned credential ends preparation
  with a permanent failure, without spending the Workflow's remaining retries.
context:
  previous_task_id: V448-002
  integration: Renumbered before merge because main independently used the old ID; original implementation hashes remain unchanged.
  authority: User report 2026-11-05 confirms the PostgreSQL delete/resume scenario and requests a safe permanent classification.
  severity: medium
  finding: >-
    internal/engagement/material.go:34 discards the credential provider's error
    identity while redacting its message. internal/controlplane/engagementadapter/prepare.go:67
    supplies that materializer to preparation. internal/scheduler/run_execution.go:304
    defaults every non-RuntimeAPIError preparation failure to retryable. A failed,
    released Run can have its credential deleted, then be manually resumed and
    consume maxAttempts despite immutable deletion.
  specification:
    - docs/spec/execution/runs.md#RUN-R115
    - docs/spec/execution/scheduler.md#SCH-R23
    - docs/spec/execution/scheduler.md#SCH-R184
    - docs/spec/execution/control-plane.md#CTL-R168
    - docs/spec/configuration/runtime-config.md#RCF-R184
  provenance: >-
    V449-001 exposes this existing materializer to ordinary Run manual continuation;
    Audit retains its credential hold. git blame traces the older redaction-only
    return through 41f6fb79e to 6e0252ce8. The reported legitimate delete/resume
    lifecycle became reachable with the ordinary Run input feature.
  siblings: >-
    Audit and ordinary Run preparation share MaterializeHTTPIdentities. Preserve
    context and transient store errors as well as missing/wrong-kind, invalid and
    unreadable credential identities. Scheduler already owns their classification
    for execution-config resolution; reuse it for allocation preparation, including
    joined cleanup errors. Remote RuntimeAPIError flags and opaque infrastructure
    failures retain their existing behavior. No Python or wire shape changes.
scope:
  in:
    - Redact provider text while preserving errors.Is/As through the existing safe error wrapper.
    - Reuse Scheduler credential retry classification for preparation failures and joined cleanup errors.
    - Add a real PostgreSQL regression through creation, failure, release, deletion, manual resume and materialization.
    - Verify actual Scheduler RunOnce progression with retries configured, plus safe messages and temporary failures.
    - Reconcile preparation failure outcomes in Scheduler and Control Plane specifications.
  out:
    - Changing credential deletion eligibility or blocking manual continuation.
    - Replacing credentials, changing pinned policy or adding public error codes or wire fields.
    - New credential stores, retry mechanisms, Runtime transport or policy semantics.
acceptance_criteria:
  - id: A1
    text: Real PostgreSQL delete/resume materialization preserves ErrRuntimeCredentialNotFound with a static secret-free message and no private settings delivered.
  - id: A2
    text: Scheduler configured for three attempts records non-retryable allocation_preparation_failed, releases work, invokes no Planner and creates no automatic retry for a missing pinned credential, including a joined transient cleanup failure.
  - id: A3
    text: Context cancellation/deadline, transient database errors, RuntimeAPIError flags and unknown infrastructure errors retain their appropriate existing retry behavior; partial material is cleared and raw provider text is never rendered.
  - id: A4
    text: The PostgreSQL lifecycle and Scheduler progression regressions fail on the unfixed branch, and all touched package suites and lint pass after the fix.
tests:
  - command: go test -tags=integration -count=1 ./internal/engagement ./internal/scheduler ./internal/runservice ./internal/controlplane/... ./internal/auditservice ./internal/archtest ./internal/app
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]
verification:
  date: 2026-11-05
  before_fix:
    - The real PostgreSQL create/fail/release/delete/resume regression failed because the missing credential lost its error identity.
    - Scheduler with maxAttempts=3 created a second StageExecution and left the Run running after the missing credential preparation failure.
  after_fix:
    - The PostgreSQL lifecycle regression preserves ErrRuntimeCredentialNotFound and returns no private material after resume.
    - Scheduler records allocation_preparation_failed with retryable=false, fails after one attempt, releases once and never invokes a Planner.
    - Joined Runtime API cleanup failures, deadline expiry and cancellation do not override the confirmed permanent credential cause.
    - Context/storage-only errors, unknown infrastructure errors and remote Runtime API flags retain their intended retry behavior; provider diagnostics remain redacted.
  passed:
    - go test -count=1 ./internal/engagement ./internal/scheduler ./internal/runservice ./internal/controlplane/... ./internal/auditservice ./internal/archtest ./internal/app
    - go test -tags=integration -count=1 ./internal/engagement ./internal/scheduler ./internal/runservice ./internal/controlplane/... ./internal/auditservice ./internal/archtest ./internal/app
    - make lint
  environment: Real disposable UTF-8 PostgreSQL over TCP, serialized package execution and canonical temporary paths.
  not_run: Full release-verify was not run. Separate process e2e gates were subsequently rerun successfully during main integration; see delivery.integration_task.
delivery:
  branch: codex/engagement-run-input
  merged_into_main: true
  merge_commit: dfd806fa489e6ae40226e9ebf3c2e3528a9d1a4f
  integration_task: tasks/done/v449-003-integrate-run-engagement-main.yml
  pushed: false
