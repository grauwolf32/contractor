    contractor_test_v414_fence with per-test schemas and all 41 migrations;
    the locked Runtime venv and the pnpm UI install for make lint. Branch
    claude/v414-fence from main 17245309, implementation cc9b1315, then main
    2193cef5 merged in.
  commands:
    - >-
      go test -count=1 -tags=integration ./internal/findingintake
      ./internal/auditimport ./internal/auditservice ./internal/auditstore/...
      ./internal/persistence/... passed before the merge of main (findingintake
      305s, auditservice 397s, persistence/postgres 78s, persistence 3s;
      auditimport 106s and auditstore/internal/pgstore 220s in a rerun, see
      the notes). It ran the new tests
      TestPostgresFindingIntakeSharesTheProjectWithConcurrentAdmissions (Run
      creation, Audit start, Project artifact admission),
      TestPostgresFindingDecisionSharesTheProjectWithChildRunCreation,
      TestPostgresFindingPurgeSerializesWithProjectDeletionClaim (both
