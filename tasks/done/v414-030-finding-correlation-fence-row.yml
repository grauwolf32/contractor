    - >-
      After the merge of main 2193cef5 the same command plus
      ./internal/projectlifecycle passed except
      TestPostgresFindingRunDeletionSerializesWithAuditPurge/run_deletion_commits_first
      ("waited at the wrong lock stage"), a known regression on main since
      the V414-029 merge that V414-031 fixes, independent of this change.
    - >-
      go test -count=1 -tags=integration -run
      'TestPostgresFindingIntakeSerializesWithProjectDeletion|TestTableOwnership|TestSQLAccess'
      ./internal/findingintake ./internal/persistence passed. The listed
