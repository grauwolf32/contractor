    - >-
      go test -count=1 -tags=integration ./internal/projectlifecycle
      ./internal/auditcontroller ./internal/rundeletion ./internal/runservice
      ./internal/evalstore ./internal/evalservice ./internal/httpapi/public/...
      ./internal/auditbaseline ./internal/httpapi/privateartifacts passed
      (dependents of the changed packages). The Project purge test
      TestProjectDeletionPurgesAuditWithDecidedReviewsAndAssessments now
      checks the fence row before deletion and its absence after.
    - make docs-erd regenerated docs/spec/database-erd.html (73 tables, schema 000041).
    - >-
      make lint passed before and after the merge of main, after make
      docs-dependencies.
  a6: >-
    In a temporary worktree at b523ae77, the final A1 tests (appended to
    that revision's own test files, with helpers that need no new API)
    failed: every subtest of
    TestPostgresFindingIntakeSharesTheProjectWithConcurrentAdmissions (Run
    creation, Audit start, Project artifact admission) and
    TestPostgresFindingDecisionSharesTheProjectWithChildRunCreation ended
    with "Project correlation is concurrently changing" (SQLSTATE 40001).
    The worktree was removed.
  can_fail_checks:
    - >-
      Dropping the fence-row join from contractor_finding_correlation_source_deleted
      failed TestPostgresSourceRunDeletionWithoutAuditFencesNothing with
      "Project delete-project has no finding correlation fence (SQLSTATE
      P0004)"; reverted.
    - >-
      The migration test's scan of function bodies for writes and exclusive
      locks of projects matched functions with the old lock and advance
      statements in a scratch-schema probe, and matches none after the
      migration.
  decisions:
    - >-
      Receipts exist for every Project-bound Run, Audit or not. A Project
      that never had an Audit has no fence row, so the source-Run-deletion
      trigger steps only Projects with a fence row; no finding, contribution
      or hold can cite such a receipt. Readers read revision 1 for a Project
      without the row, the row's starting revision.
    - >-
      A BEFORE DELETE trigger keeps the fence row while its Project row
      exists, so only the Project cascade removes it and the revision never
      restarts (LIFE-FND-4).
    - >-
      Audit creation inserts the fence row only when its snapshot shows none,
      before ON CONFLICT DO NOTHING, so it never waits on a finding writer
      that holds the existing row; only two first Audits of one Project wait
      on each other's insert.
    - >-
      FND-R177 records the guarantee, the rejected alternatives (projectstore
      lock API, advisory lock, FOR KEY SHARE admissions) and the reversal
      condition. FAIL-FND-6 and LIFE-FND-4 follow it; FAIL-AUX-3, FAIL-REV-1
      and FAIL-REV-7 still describe the unchanged V409-001 replay.
  notes:
    - >-
      The first run of auditimport failed only in
      TestAuditCompletionRuntimeZIPImporter, because the Runtime venv was
      still being created (fork/exec runtime/.venv/bin/python); the rerun
      passed.
    - >-
      The Project artifact admission contender writes one committed artifact
      first, so its ProjectScope row exists: the first artifact of a Project
      creates that row, and a concurrent first admission waits on its unique
      key, an artifact-store wait unrelated to the fence.
    - >-
      Under five packages in parallel, the budget tests
      TestPostgresAuditClaimReadsOnlyTheReconcilableAudits and, after the
      merge, TestPostgresAuditDeletionProbesReadOnlyTheLiveRuns read one or
      two rows over budget; both passed when the package ran alone, before
      and after the merge. Their statements do not read the fence table.
    - >-
      The finding_proposal_receipts correlation trigger (findingintake) still
      writes auditstore's finding_correlation_fences through
      contractor_advance_finding_correlation; V372-009 now lists that write
      for its registry. Nothing writes projects outside projectstore any more.
