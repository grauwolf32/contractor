    construction and validation, and detached results drop their Worker reference before waiting for the final lifecycle
    check.
  release_negative_probe: /tmp/contractor-v452-release-before.log
  full_runtime_gate: 'make test-runtime passed: 5914 passed, 135 declared skips before final release-ownership hardening.
    Broad rerun after reader joining: 5891 passed, 135 skips, excluding the two previously-passing unaffected long
    ADK modules (27 tests). Final owner selection after the queued-release correction: 380 passed, 15 Linux/Podman
    skips.'
