scope:
  in:
  - Add adversarial deterministic HTTP/HTTPS targets, resolver/protected-alias scenarios and transport
    fault injection around the already implemented V411-003 production preflight path.
  - Add make test-pentest-http-process and register the test selection with release-verify; zero cases,
    skipped mandatory database/process cases or unjustified proof of denial fail.
  - Extend Runtime fixture coverage for canonical URLs, actual socket peer, first-byte events, cancellation
    and resource bounds; record conformance evidence without changing intended production behavior.
  out:
  - No transport, private action protocol or request-accounting implementation; V411-003 owns all
    production code and callers. A newly discovered behavior defect needs its own tracked repair before
    this gate can pass.
  - No model-visible HTTP tool, login, browser/scanner/MCP path, upstream proxy, sandbox egress filtering,
    paid-model call or advertised full pentest capability.
requirements:
- id: R1
  text: Exercise the actual V411-003 Server/Runtime preflight and controlled socket path with real
    deterministic target processes. Mocks may control DNS/time or model output, but cannot stand in
    for observed target writes or accepted action receipts.
- id: R2
  text: Cover allowed requests and denied redirects, rebinding, protected aliases/virtual-host ambiguity,
    alternative numeric hosts, nested/encoded paths, implicit proxy routes and forbidden loopback/link-local/metadata.
    Denial asserts zero target-request writes on the prohibited path.
- id: R3
  text: Inject delayed/lost/duplicate grants and acknowledgements across allocations, expiry and Server/Runtime
    restart. Assert sending-before-write, post-write started, one unacknowledged grant, no catch-up
    burst, no refund of unknown sends and bounded concurrency with injected clocks.
- id: R4
  text: Exercise max URL/header/body bytes, redirect/retry limits, stalled streams, cancellation,
    lease loss and uncertain termination. Verify safe outcomes and quarantine instead of overlapping
    replacement traffic.
- id: R5
  text: Create test-pentest-http-process in the existing make/e2e structure and release graph. Use
    bounded fixtures, actual case-count checks and mandatory prerequisites. Existing HTTP-tool regressions
    stay green; this chore changes no intended production behavior.
failure_outcomes:
- operation: Start/run/teardown the conformance harness
  permanent: Invalid fixtures, zero selected cases, observed prohibited write or mismatched ledger
    outcome fail the gate immediately; no retry hides a failure.
  retryable: Only bounded fixture startup connection retries before a case begins; record attempts
    and deadline.
  ambiguous: Read the original action receipt and independent target-write record; an uncertain result
    fails explicitly rather than resending the measured target request.
  cancelled: Harness joins Server/Runtime/target children and cleans temporary resources before return.
  timeout: Separate finite fixture setup, case and teardown deadlines; no wall-clock correctness assertions.
cardinality:
- collection: Connections/redirect attempts within one Audit
  expected: Five requests per second and two concurrent requests
  maximum: 20 requests per second, eight concurrent requests, five redirect hops and one additional
    safe retry
  bound: V411-003 reserves every physical send; response streaming stops at bounded bytes, and connection
    attempts remain bounded by the shared resolver limit.
- collection: One request/response and route policy
  expected: Anonymous GET/read without a request body and a 256 KiB response.
  maximum: Response at most 1 MiB or the lower engagement cap, 64 headers/32 KiB aggregate,
    8,192-byte URL; 128 routes/exclusions and 16 origins. Private action requests are at most 64 KiB.
  bound: Reject or stream-truncate before unbounded buffering; capture truncation metadata and no
    hidden retry.
lifecycle:
- entity: Conformance fixture processes, temporary certificates and traces
  delete: Harness tears down on success, failure and cancellation.
  cascade: Join every process/request before removing isolated fixtures and test schemas.
  retention: Keep safe assertion diagnostics and exact fixture versions; credentials remain test-only
    and absent from retained outputs.
acceptance_criteria:
- id: A1
  given: Authorized and prohibited direct HTTP/HTTPS targets with independent request observers
  when: The complete production preflight path runs every denial-matrix case
  then: Allowed paths succeed with matching scope/peer/ledger identity and prohibited paths receive
    zero target-request bytes.
- id: A2
  given: Delayed/lost grants and acknowledgements across multiple allocations
  when: Injected clocks and restart/expiry cases execute
  then: Actual start spacing, one outstanding grant and unknown usage retention are proven without
    wall-clock timing assertions.
- id: A3
  given: Maximum-sized URL/header/body inputs, redirects and stalled response streams
  when: The conformance process gate runs
  then: All limits and truthful truncation/timeout outcomes hold without unbounded buffers or hidden
    retries.
- id: A4
  given: Cancellation, lease loss or unproven target-client termination
  when: Cleanup and replacement contend
  then: The fixture demonstrates joined cleanup or capacity quarantine and no overlapping unauthorized
    replacement send.
- id: A5
  given: The release graph and a deliberately empty/broken test selection
  when: The new gate and existing HTTP regressions execute
  then: Zero cases/unexpected skips fail, every new scenario has a release owner and ordinary HTTP
    behavior remains unchanged.
tests:
- command: go test -count=1 ./tests/e2e
  covers:
  - A5
- command: make test-release-process-e2e-a test-release-process-e2e-b test-release-process-e2e-c
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-pentest-http-process test-pentest-action-process test-http-caido-e2e test-runtime
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Disposable PostgreSQL able to create/drop isolated schemas; never print its connection secret.
- Repository-pinned Go and locked Runtime dependencies; run commands from the repository root unless
  the command explicitly changes directory.
verification_requirements:
- Use testdata fixtures, never the live configs tree outside the documented e2e/eval exceptions. Keep
  model choice unchanged; deterministic targets need no real Gateway.
- Run every touched package in full, including any new package introduced by this task. Database tests
  require disposable PostgreSQL through CONTRACTOR_TEST_DATABASE_URL; an unreachable configured database
  fails and skipped mandatory cases do not pass.
- New shared fixtures must be registered with their Go/Python/schema readers in the existing shared-fixture
  gate. New process selections must fail when zero tests match and be reachable from release-verify.
- Update the owning normative specification, shared limits/errors/lifecycle registries and public/private
  contracts in the same change. Preserve existing contract ownership; do not add backward-compatibility
  readers or edit generated clients manually.
- This task adds test-pentest-http-process with deterministic real target servers and Server/Runtime
  processes, using the already complete V411-003 preflight caller. Register all selections with release-verify
  and assert nonzero selected cases; later feature tasks extend the same gate.

