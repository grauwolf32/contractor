applicability:
- V411-003 is completed on main and provides the real controlled transport, action ledger and two
  process fault scenarios. V411-004 remains applicable because the independent route-denial, resource,
  lifecycle and restart conformance matrix and its non-skippable release gate are not yet present.
- This task changes tests and their gate only. A discovered production defect is tracked and repaired
  separately before its conformance case can pass; the production policy is never weakened by a fixture.
- The original unfiltered e2e-tagged command also runs the project's explicitly opt-in real scanner
  and Podman/container tests. The baseline diagnostic demonstrated missing external prerequisites;
  it is not counted as a pass. Required verification uses the full untagged e2e package plus the
  canonical release process union, which includes every deterministic tagged process case and
  preserves the existing opt-in ownership in scripts/check_release_verify_graph.py.
- Independent TCP and Server/Runtime observers confirmed raw dot-segment redirects were normalized
  before admission; V411-022 repairs that production defect. The existing Skills process baseline
  also found a stale public Artifact response DTO introduced by V410-021; V411-023 repairs its
  test consumers without changing production behavior. Both repairs must pass before this task closes.
- V411-024 repairs sibling HTTP/Caido and label process assertions that still expected a single
  advertised adapter after V411-003 added the built-in controlled HTTP capability. It changes no
  production placement or RuntimeConfig provenance; all affected process owners must pass.

