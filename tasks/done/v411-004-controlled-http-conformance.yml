implementation_notes:
- Independent actual Server/Runtime, native TCP/TLS and real PostgreSQL observers cover forbidden
  routes, DNS/peer/SNI/proxy boundaries, first-byte ordering, duplicate receipts, bounded bodies and
  headers, safe retries, cancellation, lease loss and process restarts. No fake target write stands
  in for transport evidence. The process matrix includes the original dropped-reply/expired-grant cases.
- Exact injected-clock store tests cover multiple allocations, persisted cooldown, reconstruction,
  the eight-slot capacity ceiling and the five-field stop proof. Unknown sends keep their charge and
  capacity. Temporary production mutations removing cooldown or accepting a wrong Runtime instance
  made the real-store regressions fail and were restored before verification.
- The process restart observer and real-store replacement-admission tests are complementary. The
  process fixture alone is not claimed to observe a newly authorized replacement allocation. Direct
  controlled HTTP does not gain an upstream proxy capability from ordinary HTTP configuration.
- One manifest requires 38 process identities, two accounting cases and 31 exact parametrized Runtime
  cases. Empty/missing/skipped/failed/duplicate results are rejected. Unique bounded report directories
  record executed identities and report/manifest digests only after success. Cold-cache Go dependency
  setup is separate from the strictly parsed test event stream.
- The same cases belong to canonical process shard B, the full Runtime report and full Go unit report.
  The release graph verifies ownership; gate/report/graph unit tests cover broken selections. The
  independently discovered production redirect defect is fixed separately in V411-022. V411-023 fixes
  stale public Artifact DTOs; V411-024 reuses the concurrent V410-023 selector instead of duplicating it.
