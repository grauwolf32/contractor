schema_version: "1.0"
id: V31-006
title: Enable Podman capabilities only after complete bounded startup probes
milestone: podman-allocation-execution
priority: P0
status: completed
implementation_commit: c5815646e53eb2e0cc05e26669e748e1f1b1ccb9
depends_on: [V31-005]
languages: [python, go]

goal: >-
  Wire the completed sandbox and execution Toolset into positive Runtime
  capability discovery without claiming unsupported isolation or cleanup behavior.

context:
  specification: docs/spec/21-podman-sandbox.md
  capability_rule: >-
    Enabled settings or installed code are not capabilities. Require local
    rootless engine, finite cgroup/resources, pinned image, compatible supervisor,
    mount/UID access, execution, descendant cleanup, liveness expiry and verified
    removal before advertising podman@1 and dependent exec_command.
  isolation: >-
    Only local direct storage is compatible. No privileged Podman, host execution,
    memory/overlay fallback or implied host subprocess/proxy authority is allowed.
    First-version network policy is none; there is no per-allocation bind disk quota.

scope:
  in:
    - Register opt-in production factories and their dependency-aware probes after V31-004/V31-005 are complete.
    - Order stable-owner recovery before workspace orphan cleanup and probes; use separately identified probe containers.
    - Fit creation/command/liveness/cleanup checks into finite documented startup and per-factory budgets; keep event loop responsive.
    - Advertise profile and selected tool capabilities consistently only on success; omit failures without losing unrelated safely usable capabilities.
    - Fence/unready the process when probe teardown is unconfirmed, retaining ownership for recovery.
    - Expose safe effective image/resource diagnostics without host paths, secrets or unenforced disk-quota claims.
    - Add tests/test_podman_capabilities.py and extend Go placement coverage for heterogeneous registered fleets.
  out:
    - Dynamic re-probing during an allocation, optimistic capability advertisement, networked variants, label-based image selection or UI policy editors.

requirements:
  - {id: R1, text: Profile and tool advertisement require all prerequisites and no leaked probe container.}
  - {id: R2, text: Failed or timed-out probes never silently weaken policy or let an unconfirmed slot become idle.}
  - {id: R3, text: Placement checks exact binding requirements and preserves unrelated local-workdir and memory/overlay capacity.}

acceptance_criteria:
  - id: A1
    given: Each prerequisite independently unavailable or failing, including cgroup enforcement and liveness cleanup.
    when: Bounded discovery runs.
    then: Dependent capabilities are omitted; no privilege/backend fallback occurs and diagnostics identify only safe failure categories.
  - id: A2
    given: Fully usable prerequisites or a stuck probe cleanup.
    when: Runtime constructs its frozen registration.
    then: Success advertises matching profile/tool refs after cleanup; uncertainty leaves readiness false and the slot fenced.
  - id: A3
    given: Heterogeneous local/memory agents, selected profiles/tools and unrelated existing validators.
    when: Registration and placement regression tests run.
    then: Only compatible local direct bindings use Podman, and unrelated capabilities retain their behavior.

tests:
  - {name: discovery, command: "cd runtime && uv run pytest -W error tests/test_podman_capabilities.py tests/test_capabilities.py tests/test_podman_recovery.py", covers: [A1, A2, A3]}
  - {name: placement, command: "go test -count=1 ./internal/config ./internal/scheduler ./internal/controlplane", covers: [A3]}
  - {name: real-prerequisites, command: "make test-podman-supervisor", covers: [A1, A2]}

verification:
  verified_on: "2026-09-06"
  image: localhost/contractor-supervisor@sha256:faea9fa41ec757ad3c18bf3a947409692f2fcc374a87c1d209185175b0d215ca
  environment: Local rootless Podman 6.1.0 with systemd cgroup v2; the real gate uses only the explicitly preinstalled digest-pinned image and never pulls or builds images.
  results:
    - Required discovery, capabilities and recovery tests passed, 58 tests with warnings treated as errors and two explicit real-host skips.
    - Expanded mandatory real Podman gate passed all 52 tests, including supervisor resource enforcement, independent owner lifetime, command execution, positive startup, missing image and an ordinary direct allocation after probe removal.
    - Exact placement tests passed in internal/config, internal/scheduler and internal/controlplane, both in the worktree and an isolated staged snapshot; the heterogeneous registered fleet preserves memory/direct and local/overlay slots for ordinary tasks.
    - Isolated staged snapshot passed the full Runtime suite, 1286 tests with warnings treated as errors and 24 explicit skips, without parallel uncommitted changes.
    - Isolated Runtime source and test lint passed; all 11 changed Python files passed formatting, and the staged patch passed whitespace checks.
    - No sandbox-owner-labeled containers or Runtime owner/guardian processes remained after the real gate.
    - Full shared-worktree verification is not green due to parallel audit-results edits; Runtime lint reported an undefined _validate_task_result, and the full worktree suite reported four audit-results failures alongside 1295 passes and 24 skips. Those files were excluded from this implementation commit and left unchanged.
  limitations:
    - Podman remains opt-in and requires local direct storage, a preinstalled approved image and verified rootless prerequisites; memory/overlay and host/network fallback are not enabled.
    - An unreachable recovery engine or uncertain probe cleanup prevents registration; late replies cannot revive readiness, and bind files remain owned for recovery.
    - Startup probes have finite budgets and short independent bootstrap guardian leases; indefinitely blocked kernel operations retain ownership rather than manufacturing cleanup success.
    - Bind disk quotas are not enforced; verified scope swap is a finite upper bound, not a claim of zero swap in all descendants.
    - Reproducible deployment/service-manager instructions and the sample workflow remain V31-007.
