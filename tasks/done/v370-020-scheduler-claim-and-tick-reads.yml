schema_version: "1.0"
id: V370-020
title: "Bound the Scheduler claim and tick reads"
milestone: hub-audit-structure-2026-10
epic: execution-core
kind: defect
priority: P2
status: completed
implementation_commit: 85110dc0b82f3f4cf3210e74fd7580411ce07490
depends_on: []
languages: [go]
goal: "EXPLAIN on 10,000 Runs uses an index for the claim; a tick reads one stage."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), exec-state I2, I3; file:line as of 02bbdcbf, re-verify on current main"
  finding: >-
    The claim ORDER BY CASE (store_sql.go:155-181) cannot use admission_idx
    and sorts all unclaimed active Runs; pending Runs of paused owners are
    claimed and deferred, P/30 claims per second each with GetRun and
    ListStageExecutions. Every tick reads all StageExecutions (up to 1024
    per Run) and the full Run to find one active stage (run_execution.go:39,
    105; scheduler/postgres.go:607).
  siblings: >-
    Re-verified on 4146eea: the claim sorted every candidate in both the
    custom and the generic plan, the paused owner's pending Run was claimed
    and deferred, executeRun and executeCancelling listed the whole Stage
    history, and executeRun, failActiveRun, finishCancelledRun,
    resumeFinalizing (twice), resumeAborting (twice), AdmitStage and
    commitTerminalRun read and validated the whole Run only to compare its
    state. All of them now read GetRunState; executeRun reads the whole Run
    again only when the state changed since the claim. The renewal loop's
    GetRun is V370-019. Ruled out: escalationAttempts lists the history
    once per escalate decision, not per tick, and the no-active-Stage paths
    (a fresh Run's first tick, cancellation cleanup, a broken Run) list it
    once in the Run's life.
  decision: >-
    Guarantee: scheduler_claim_tier stores the state part of the claim rank
    as a generated column; workflow_runs_claim_idx (tier, updated_at,
    created_at, run_id) and workflow_runs_deferred_claim_idx (Runs deferred
    within LIM-SCH-8) serve two probes, and the deferred probe runs only
    when the ready probe found nothing. EXPLAIN over 10,000 claimable Runs
    uses both indexes and neither sorts nor scans workflow_runs. The claim
    skips a pending Run of a paused owner unless an active Stage of it is
    aborting or holds an unreleased allocation (SCH-R163); a progression
    attempt reads one Stage through stage_executions_run_active_idx
    (SCH-R164). Alternatives: skipping every paused pending Run, as the
    audit proposed, would keep a placement whose discard failed (SCH-R152)
    or an aborting never-admitted Stage holding Runtime slots for the whole
    pause; a unique index on the active Stage would enforce SCH-R114 on
    write but changes the failure of every Stage-creation path and of
    fixtures in other packages, so the read reports ErrMultipleActiveStages
    and the Scheduler fails the Run as before; storing the pause on each Run
    would add a second writer of the pause. Accepted cost: the ready probe
    still filters, without sorting, the Runs ahead of the first claimable
    one (lane claims, at most 32; Runs deferred within their window; paused
    pending Runs). Reopen when paused owners routinely hold thousands of
    pending Runs and the claim shows in pg_stat_statements. The memory claim
    double still takes paused Runs, so the in-lane pause gate (the race in
    which a pause commits after the claim) keeps its memory coverage.
    Evidence: TestPostgresClaimReadsTenThousandRunsInClaimOrder,
    TestPostgresClaimSkipsPendingRunsOfPausedOwners and
    TestPostgresActiveStageReadUsesActiveStageIndex fail on 4146eea and pass;
    TestSchedulerProgressionReadsOnlyTheActiveStage fails with the old
    executeRun; TestPostgresQueuePauseDoesNotPlacePendingStage now expects
    no claimable work while paused.
scope:
  in:
    - "Skip paused owners in the claim SQL; tier as an indexed generated column; GetActiveStageExecution and a narrow GetRunState."
  out:
    - "Claim fairness."
acceptance_criteria:
  - id: A1
    text: "EXPLAIN on 10,000 Runs uses an index for the claim; a tick reads one stage."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test -tags integration ./internal/runstore ./internal/scheduler"
    covers: [A1]
