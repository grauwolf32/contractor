schema_version: '1.0'
id: V159-001
title: Avoid false WorkerHandle secret matches on fixed card strings
milestone: worker-handle-secret-collisions-2026-10
priority: P2
status: completed
implementation_commit: 19b589af9b45224f3b01ef9a13f1d1b7bbe0a237
depends_on: []
languages: [go, python]
goal: Let short valid telemetry and basic-auth values coexist with fixed Agent Card strings while retaining checks for actual leaks.
context:
  issue: https://github.com/grauwolf32/contractor/issues/249
  finding: Both Runtime and Server compare every short credential against all WorkerHandle strings, including fixed protocol vocabulary and template versions.
scope:
  in:
    - Align Go and Python WorkerHandle leak checks around Runtime-chosen text.
    - Keep long secret substring detection and short exact detection in freely chosen text.
    - Cover telemetry header and HTTP basic-auth collisions with fixed card strings.
  out:
    - Relax validation of actual Runtime-chosen secret-bearing card text.
acceptance_criteria:
  - {id: A1, text: Prepare accepts telemetry header value "1" end to end.}
  - {id: A2, text: Prepare accepts basic-auth usernames matching fixed card vocabulary.}
  - {id: A3, text: Runtime-chosen card text still rejects long secret substrings and short exact secret values.}
  - {id: A4, text: Go and Python regression tests agree.}
tests:
  - {command: go test ./internal/controlplane, covers: [A1, A2, A3, A4]}
  - {command: PYTHONPATH=runtime/src runtime/.venv/bin/python -m pytest -q runtime/tests/test_allocation.py runtime/tests/test_adapter_host.py, covers: [A1, A2, A3, A4]}
