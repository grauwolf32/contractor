goal: Turn an admitted exact HTTP plan into bounded model-free requests, extractions and controls
  whose result can be recomputed from trusted safe evidence before later replay/proof collection.
context:
  authority: User request on 2026-10-24 to decompose the updated proposals into implementation tasks.
    This record authorizes no implementation during planning and does not reactivate deferred work.
  proposal:
  - docs/proposals/0033-autonomous-pentest-audits.md#82-typed-hypothesis-admission
  - docs/proposals/0033-autonomous-pentest-audits.md#9-recipe-and-deterministic-predicate-contract
  - docs/proposals/0033-autonomous-pentest-audits.md#10-trusted-evidence-proof-and-retention
  - docs/proposals/0033-autonomous-pentest-audits.md#102-result-dimensions
  - docs/proposals/0045-audit-hypothesis-search.md#33-experiments-and-assessment
