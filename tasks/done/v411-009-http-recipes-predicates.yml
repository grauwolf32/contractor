  - docs/spec/execution/worker.md
  replanned: >-
    2026-10-24: distinguish a changed immutable recipe/plan from a technical execution
    retry, as required by proposal 0045. This executor requires exact recipe/context
    inputs, not a research registry. V64-018 later connects research plans to the same
    proof contract; task status, dependencies and target retry policy are unchanged.
  code:
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/src/contractor_runtime/toolsets
  - internal/contracts
