schema_version: '1.0'
id: V62-018
title: Remove the unread accepted plan column
milestone: audit-iterative-simplification-2026-10
epic: audits
kind: chore
introduced_by: V62-007
priority: P2
status: completed
depends_on:
- V62-017
languages:
- go
- sql
- markdown
goal: Persist the accepted plan only in the existing immutable prepared execution projection while retaining
  exact dependency holds.
context:
  authority: The user explicitly requested creation, sequential implementation, verification, task closure
    and merge of the five reviewed simplifications on 2026-10-27.
  finding: internal/auditstore/internal/pgstore/admission_stage.go:101 writes audit_items.accepted_plan
    separately from prepared_execution.accepted_plan; dispatch reads only the latter.
  review: Read-only review of main 4d50b1cfc4961adad9dfa1fef160ef338cbd86ba and the accepted five-step
    simplification plan.
  specification:
  - docs/spec/platform/persistence.md
  - docs/spec/audits/scans.md
  migration: 000051 reserved on this branch; main currently ends at 000050. Recheck before integration.
  database_guarantee: Foreign embedded plan rejection refers to audit_id/item_key, matching the removed
    column constraint. Existing admission owns owner/project/source/route validation; no new lookup is
    introduced.
scope:
  in:
  - Add a forward migration removing the standalone column and moving its shape/identity and immutability
    guarantees onto the embedded plan.
  - Remove the duplicate insert envelope and update persistence inventories/ERD and real migration tests.
  - Keep prepared_execution, its byte/descriptor headers, indexed selected-item reads and retained_dependencies.
  out:
  - No new model authority, arbitrary Workflow routing, receipt/lease store or permissive legacy reader.
  - No deployment, live model changes or modification of historical frozen evidence.
acceptance_criteria:
- id: A1
  text: The standalone accepted_plan column and writer are gone; populated migration preserves the exact
    embedded plan, task identity, membership and dependencies.
- id: A2
  text: Malformed/foreign embedded plans and mutation of frozen membership are rejected by PostgreSQL;
    bounded selected dispatch and populated purge still work.
- id: A3
  text: No new target action, receipt mechanism, retained-evidence debit or unbounded lookup is introduced.
tests:
- command: go test -tags=integration -count=1 ./internal/persistence/postgres ./internal/auditstore/...
  covers:
  - A1
  - A2
  - A3
- command: make test-audit-iterative-postgres
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
failure_outcomes:
  permanent: Invalid source, route, schema or exact bytes fail before target execution; no fallback.
  retryable: Reuse existing bounded retries and original deadlines.
  ambiguous: Reconcile existing receipt, generation, cursor and child intent; never append/recharge blindly.
  cancelled: Join owned work and preserve immutable accepted evidence; partial staged work stays private.
cardinality:
  bound: Preserve existing per-slice rows/bytes, page/closure ceilings and canonical report bounds; no
    whole-history hydration.
lifecycle:
  bound: Existing approval, pause, cancel, producer deletion and Audit purge remain authoritative.
