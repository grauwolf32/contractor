schema_version: '1.0'
id: V425-012
title: Bound the Project deletion drain check by active work, not finished Run history
milestone: hub-audit-defects-2026-10
epic: projects-artifacts
kind: defect
introduced_by: V407-025
priority: P3
status: completed
depends_on: []
languages:
- go
- sql
goal: The active-Run lookup in the Project deletion drain check reads only the Project's active Runs, independent
  of finished Run history and other owners; the existing allocation-release and Audit barriers remain bounded and unchanged.
context:
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  severity: low
  finding: waitForDrainSQL in internal/projectlifecycle/controller_sql.go reads more index entries as
    finished Run history grows (V414-024 measured 214 rows, then 356 with more history) and scans every
    owner's active Runs.
  specification:
  - docs/spec/artifacts/retention-and-deletion.md#DEL-R44
  implementation_decision: >-
    2026-10-31 agent implementation choice: add a partial owner/Project index
    over the canonical active Run states. Retain the existing production SQL
    and deletion outcomes. This removes the history/global-active bitmap
    inputs from the active-Run predicate. As the existing DEL-R44 performance
    contract states, the separate release barrier still walks currently
    unreleased allocations, including release retries for terminal Runs;
    its budget is not a new promise of Project-only allocation indexing.
    A new allocation ownership projection would broaden this task beyond
    the reported Run-index defect and is not introduced. The Audit and purge
    rechecks retain their existing indexes and behavior. Reopen this index
    choice if the active-state set or the Run/Project ownership changes.
  siblings: Other drain and hold checks that V407-025 reduced; the held-credential check measured by V414-024.
scope:
  in:
  - Rewrite the statement or index so its reads are bounded by active Runs of the Project.
  - An explaintest Analysis.Reads budget test at realistic finished-history size (thousands of finished
    Runs, several owners).
  out:
  - Changing deletion semantics.
acceptance_criteria:
- id: A1
  text: Reads stay within the budget as finished history grows by an order of magnitude.
- id: A2
  text: The budget test fails on the unfixed statement.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/projectlifecycle/... ./internal/runstore/... ./internal/persistence/...
  covers: [A1, A2]
- command: make lint
  covers: [A1]
implementation_commit: b318a4e1119f77a19a56fb37f1f5f11ed722e8e2
verification:
  date: '2026-10-31'
  integrated_base: 8e0be503189c5f069f5fa99eef00a8aa0c4c08d1
  migration: 000065_project_active_run_index.sql
  commands:
    - go test -tags=integration -count=1 ./internal/projectlifecycle/... ./internal/runstore/... ./internal/persistence/... passed against disposable PostgreSQL before and after integration with the shared test-pool setup.
    - make lint passed before and after integration, including the canonical active-state index guard, schema/ERD checks, layers and source guards.
    - make docs-erd applied all 65 migrations to a scratch database and regenerated the ERD; make docs-dependencies kept the dependency document current.
  scale_and_budget: >-
    Six owners, thirty Projects, 6000 then 60000 Runs, and three Stages and
    allocations per Run. The target's terminal history grows from 214 to 2142
    Runs; 112 global active Runs and 30 unreleased allocations stay fixed.
    Custom and executed generic plans stay within 38 Run reads (30 release
    lookups plus 8 planning entries), independent of terminal history. The
    measured custom plan reads 2 then 32 Run entries; the active-Run predicate
    returns zero index entries at both sizes. Stage and allocation read budgets
    remain 38 each. Statistics sample the complete 180000-row Stage tables.
  negative_control: >-
    Dropping only the new index inside a rollback-only transaction restores
    2286 Run reads for both custom and generic plans, exceeding the same budget
    of 38. This replaces the obsolete historical-SQL block comparison: both
    SQL spellings benefit equally when measured on the newly indexed schema.
  outcome: >-
    The existing production query and deletion semantics are unchanged.
    Cancellation, cancelling Runs, unreleased allocations, Audit barriers,
    owner claims and the purge recheck retain their result coverage. The active
    state predicate is registered against runstore's canonical state set.
    The separate release lookup retains its established globally-unreleased
    allocation budget; no new ownership projection or store was introduced.
