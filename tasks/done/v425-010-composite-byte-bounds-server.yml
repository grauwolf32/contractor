schema_version: '1.0'
id: V425-010
title: Validate per-part byte bounds of Run label selectors and sitemap rules in the Server and drop their
  gate exceptions
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: defect
introduced_by: V414-009
priority: P2
status: completed
depends_on: []
languages:
- go
- typescript
- yaml
goal: A Run label selector key=value and a sitemap rule origin+path whose parts exceed their byte bounds
  are refused with a classified 400, and the byte-bound gate lists no composite exceptions.
context:
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  severity: low
  authority: 'User decision on 2026-10-30: file Server-side validation instead of keeping the two composites
    as accepted gate exceptions (V414-009).'
  finding: 'V414-009 (tasks/v414-009-*.yml, context around line 85-92) left two composites in requestStringsWithoutByteBound
    because one schema cannot express per-part bounds: Run label selectors key=value (key grammar, LIM-RUN-5
    value bytes) and sitemap rule origin+path (one shared 8 KiB). A client can send a selector value over
    LIM-RUN-5 bytes; check whether the Server refuses it today and with which code.'
  specification:
  - docs/spec/api/public-api.md#API-R4
  - docs/spec/execution/runs.md#RUN-R80
  - docs/spec/artifacts/project-sitemap.md#SMT-R5
  implementation_decision: >-
    2026-10-31 agent investigation: both Server validators already enforce the
    intended limits. parseRunMetadataLabelSelectors delegates to runstore's
    normalizer and runlabels.ValidateRunMetadataLabel; projectsitemap.validRoute
    bounds origin+path before URL projection. Reuse these owners and prove them
    through real public handlers and PostgreSQL instead of adding a second validator.
    Keep the current query and body shapes. A shared selector component declares
    its existing derived 320-byte envelope (63+1+256, LIM-RUN-11), while its
    description preserves the independent part bounds. Sitemap parts declare
    their 8 KiB envelope and their description preserves the shared sum bound.
    The existing sitemap generator carries the public byte declarations into
    the private command schema; regenerate it without a second definition.
    Splitting public fields would widen this contract-only correction without
    removing the need for domain validation. Reopen if the selector syntax changes.
  siblings: Every public parameter or body string that joins bounded parts (search requestStringsWithoutByteBound
    and internal/contracts/runlabels).
scope:
  in:
  - Server validation of each part's byte bound with the owning error code, documented in OpenAPI descriptions.
  - Remove both composite exceptions from the gate; update api/testdata/public/utf8-byte-bound-cases.json
    and both generated clients if the contract changes.
  out:
  - Splitting the selector into separate key and value parameters (V414-009's reopen condition) unless
    that turns out simpler; record the choice.
acceptance_criteria:
- id: A1
  text: Over-long parts are refused with a classified 400 through the real handler; parts at their bound
    are accepted.
- id: A2
  text: The byte-bound gate has no composite exceptions and fails if one is re-added.
tests:
- command: go test -count=1 ./internal/httpapi/public/... ./internal/contracts/...
  covers:
  - A1
  - A2
- command: go test -count=1 ./internal/projectsitemap/... ./internal/publicclient/...
  covers: [A1]
- command: make test-wire-cross-language
  covers: [A1, A2]
- command: cd runtime && uv run pytest -q tests/test_sitemap_contracts.py tests/test_sitemap_views.py tests/test_sitemap_tools.py tests/test_contracts.py
  covers: [A1]
- command: make verify-public-api
  covers:
  - A1
  - A2
- command: make ui-verify
  covers:
  - A1
- command: make lint
  covers:
  - A2
implementation_commit: ff79ed9de46048c718b020c4f4c3ea59a2d40c15
verification:
  date: '2026-10-31'
  source_commit: 97a1f98e13c338bf259a6136d3342ff9ade0ca1f
  commands:
    - go test -count=1 ./internal/httpapi/public/... ./internal/contracts/... ./internal/projectsitemap/... ./internal/publicclient/... passed with disposable PostgreSQL configured.
    - make verify-public-api passed with required operation coverage.
    - make ui-verify passed; 216 test files, 2645 passing tests and one expected failure, static-server tests and the production build passed.
    - make test-wire-cross-language passed; 357 fixtures, 396 Go and 285 Python shared tests. Its Runtime contract stage passed 377 tests.
    - The listed sitemap and Runtime contract selection passed all 366 tests without skips.
    - make lint passed, including shared-config and sitemap generator consistency, shared fixture declarations, layers and specification checks.
    - make generate-public-client ui-generate and the existing sitemap schema generator refreshed every affected generated consumer.
  outcome: >-
    Existing Server validation already enforced these bounds and is unchanged.
    The API and both generated clients now declare the selector's 320-byte
    envelope and each sitemap part's 8 KiB envelope, with the independent label
    part and sitemap sum checks stated in the contract. No composite exception
    remains. Negative probes prove re-adding any of the four entries fails.
    Public-handler regressions with PostgreSQL prove label values at 256 bytes
    and route sums at 8192 bytes are accepted, one byte over returns classified
    400 invalid_request, and a rejected sitemap command consumes neither a
    publication nor its idempotency receipt. UI version is 0.10.24.
