schema_version: '1.0'
milestone: hub-audit-defects-2026-10
epic: planner-worker
depends_on: []
languages:
- go
id: V439-001
title: Simplify Planner orchestration and cache revision-bound file projections
kind: chore
introduced_by: V1-006
priority: P3
status: completed
goal: Keep Planner outcomes unchanged while removing repeated dispatch cleanup, prompt sections, JSON copying
  and per-page workspace scans.
context:
  authority: 'User request on 2026-11-03: "Давай сделаем упрощения и оптимизации и затем поправим проблемы".'
  finding: internal/planner/streamline/tools.go:231 repeats failed-dispatch recording; planner.go:496 repeats
    instruction sections; session/service.go:672 serializes a copy; stateview/service.go:285 rebuilds complete
    file lists per page.
  siblings: Streamline and Router share one engine. Passthrough, scan, durable reads, Gateway main/compactor
    and telemetry consumers are checked where applicable; no Runtime or UI behavior change is introduced.
  specification:
  - docs/spec/execution/planners.md#PLN-R14
  - docs/spec/execution/planners.md#PLN-R106
  - docs/spec/execution/planners.md#PLN-R115
  boundary: 'Implementation decision: preserve the existing Planner/domain/Server-operation separation and
    public fact vocabulary. Keep receipt capacity derived from the pinned plan rather than introduce a new
    event-batching protocol or receipt owner. Atomic event batching remains a separate option if measured database
    cost warrants it.'
  verification:
    date: '2026-11-03'
    environment: Go 1.26.9 darwin/arm64; dedicated disposable PostgreSQL; scripted models, local HTTP Gateway
      and OTLP fixtures.
    evidence: Prompt assembly is byte-identical to the pre-refactor Streamline/Router instructions in the temporary
      comparison probe. Typed completion recovery, dispatch failure precedence and cache invalidation pass
      the real-store suites. A 50-page traversal of 10,000 scope paths drops from 30,603,988 to 518,163 allocated
      bytes; the final benchmark reports 576,033 ns/op and the deterministic traversal bound is 2 MiB. Production
      cleanup removes 58 lines before the subsequent fixes.
    checks:
    - make lint
    - go test -p=2 -count=1 ./internal/planner/... ./internal/scheduler ./internal/archtest ./tests/integration/streamline
      (with PostgreSQL)
    - go test -race -p=2 -count=1 ./internal/planner/... (with PostgreSQL)
    - go test -run '^$' -bench '^BenchmarkWorkerStateCachedPagination$' -benchmem ./internal/planner/stateview
scope:
  in:
  - Share concrete dispatch-failure handling and common prompt assembly while preserving strings, event order
    and failure precedence.
  - Clone Completion through its typed result/failure graph and remove the immediately repeated LoadPlans projection
    validation.
  - Cache read/unread paths per validated Worker State revision; preserve conditional reads, correlation, ordering
    and cursor behavior.
  out:
  - Relocating scanplan, adding Server operations, changing Worker/model selection, changing public schemas
    or replacing the persistence mechanism.
acceptance_criteria:
- id: A1
  text: Existing Planner, Router, completion, cancellation, append-failure and real-store recovery suites pass.
- id: A2
  text: Maximum-size unchanged-revision pagination returns all exact paths and performs bounded allocations
    per page after one projection.
- id: A3
  text: Production orchestration becomes smaller; external validation and the existing public event vocabulary
    remain unchanged.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/planner/...
  covers:
  - A1
  - A2
  - A3
- command: go test -run '^$' -bench '^BenchmarkWorkerStateCachedPagination$' -benchmem ./internal/planner/stateview
  covers:
  - A2
- command: make lint
  covers:
  - A1
  - A2
  - A3
implementation_commit: dc78a33dbafa89839a9a5b8c2ce295a0cbcb522d
