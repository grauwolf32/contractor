  - A2 satisfied. The source scan finds no second Go definition; it now also reports a second same-language pattern in a
    listed file.
  - A3 satisfied. The shared cases get one verdict from contracts.ValidIdempotencyKey, the OpenAPI parameter schemas, the
    PostgreSQL CHECK patterns, the CLI and the UI stringRule, keyring and request-header check.
