schema_version: '1.0'
id: V407-021
title: Align Idempotency-Key, request body bounds and UTF-8 string limits with the public contract
milestone: server-runtime-review-2026-10
epic: api-contracts
kind: defect
introduced_by: V370-009
priority: P1
status: completed
depends_on: []
languages:
- go
- typescript
goal: Eval and sibling mutations enforce the same Idempotency-Key grammar, and declared body/string bounds
  match their handlers without changing documented media-type or page-size rules.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/api/public-api.md
  severity: medium
  finding: internal/evaldomain/mutation.go:18-26 accepts ASCII keys such as a!b and a/b; internal/httpapi/public/eval_helpers.go:47-59
    calls it directly, bypassing the narrower grammar in request.go:25-37. A Go probe accepted both forbidden
    keys. auth_handlers.go:19-22 admits 8192 login-body bytes while api/openapi/contractor-public-v1.yaml:3149
    declares 2048; a maximally JSON-escaped supported password needs more than 2048 bytes. Git import/key
    operations also need their existing body bounds declared. run_handlers.go:323-326 bounds cancellation
    reason by UTF-8 bytes, whereas CancelRunRequest declares only code-point maxLength. The error registry
    omits the model-selection use of unsupported_media_type.
  siblings: internal/publicclient (hand-written) and internal/cli validate some of these client-side;
    the UI validates Idempotency-Key generation in ui/src/mutations; update both from the same fixture.
  validation: 'The OpenAPI IdempotencyKey already has maxLength: 128; its unbounded-looking regex does
    not make the schema unbounded. OPS-R60 intentionally uses 415 for Scheduler settings, and OPS-R168/LIM-OPS-28
    intentionally cap allocation history at 100. Different domain page sizes are not defects and must
    not be unified by this task. Related validator extraction is only support for the demonstrated grammar
    drift.'
plan:
- Use one Go owner for the existing Idempotency-Key grammar and 128-byte ASCII bound across public handlers,
  Eval mutation identity and the sibling stores; add shared accept/reject fixtures including punctuation,
  duplicate headers and boundaries.
- Declare the existing 8192-byte login bound and existing Git import/key bounds in OpenAPI. Add operation-to-handler
  contract coverage for bounded request bodies, identifying and preserving any distinct endpoint-specific
  limits.
- Keep the existing byte semantics for cancellation reason and other reviewed byte-bounded fields; document
  x-max-utf8-bytes alongside applicable maxLength, update their owning limit references, and add multibyte
  boundary fixtures. Check handwritten clients against that declared unit.
- Correct the unsupported_media_type registry description for the actual Operations handlers, retaining
  documented 415 responses and endpoint-specific 400 responses. Preserve allocation-history 100 and other
  existing domain page bounds.
- Regenerate public API artifacts through the existing generators and run the contract gates; use shared
  fixtures for each affected language/client rather than changing generated files manually.
scope:
  in:
  - Idempotency grammar drift, body-limit declarations, string-unit declarations, existing media-type
    registry description and regression fixtures.
  out:
  - Changing domain page sizes, forcing all JSON handlers to use one status, changing unrelated identifier
    grammars, or a standalone page-limit refactor.
acceptance_criteria:
- id: A1
  text: Eval mutations with a!b or a/b return 400 before a receipt/write; valid boundary keys have the
    same verdict in every affected validator and shared-fixture consumer.
- id: A2
  text: Login accepts the supported maximum decoded password in its worst-case JSON encoding within 8192
    bytes; each covered operation declares the same body bound as its handler, and oversized bodies still
    fail with the existing class.
- id: A3
  text: The schema explicitly declares the handler UTF-8 byte bounds; multibyte strings at and over each
    reviewed boundary produce the documented verdict.
- id: A4
  text: Scheduler settings and model-selection retain their documented media-type outcomes, allocation
    history retains its 100 maximum, and registry/OpenAPI descriptions agree with those existing outcomes.
- id: A5
  text: Grammar/body-declaration/string-unit regressions fail against the original revision. Existing-contract
    preservation tests need not fail before the change.
