  database_tests_configured: true
  decisions:
  - A1 status. An invalid Eval key answers the route's documented 422 eval_invalid before any receipt is read or written,
    not 400; API-R70 and the Eval error enum fix that status, and scope.out excludes forcing one status on JSON handlers.
    API-R69 states both.
  - Sibling found and fixed. cancelScanSweep ignored the Idempotency-Key header and did not declare OptionalIdempotencyKey;
    it now declares the parameter and validates a supplied key like RuntimeCredential deletion, API-R28 names both operations,
    and the CLI sends no key because cancellation binds none. The generated Go client's CancelScanSweep takes a params argument.
  - 'New limits: LIM-API-26 (Idempotency-Key), LIM-AUD-28 (Audit start/resume body), LIM-AUD-29 (Audit scope field bytes),
    LIM-GIT-21 (Git key body), LIM-PRJ-5 (Project description bytes), LIM-REV-11 (rationale bytes), LIM-RUN-10 (cancellation
    reason bytes); LIM-PRJ-3 now states its 160-byte bound. No migration and no new error code.'
  declined:
  - 'No PostgreSQL grammar CHECK for the eval family of mutation_receipts (it bounds the key to 1-128 octets only). evalstore
    validates every key before it reads or writes a receipt, tested on PostgreSQL; a CHECK needs a migration redefining
    the family check that other families also change. Reopen if anything writes eval receipts outside evalstore.'
  - 'x-max-utf8-bytes is declared for the reviewed human free-text fields only. Machine values bounded in bytes (credential
    material, OTLP header values, caBundlePem, Git ref, repositoryUrl and privateKey, scan sweep parameter values, Gateway
    failure signature, archive paths, Audit artifact key/revision/member, query parameters, cursors) are ASCII or opaque
    and not edited as text in the UI; a follow-up task should decide them, which the integrator creates and tracks (V414-009).'
  - The Audit start form does not pre-check scope field bytes; the Server's 400 is shown. UI Run label key and count literals
    are a separate rule and were left.
  v371_016:
  - A1 satisfied. Invalid keys and duplicate headers sent to every keyed Run, Project, Audit, credential, configuration,
