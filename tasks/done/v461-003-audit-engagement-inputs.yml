  go: "Full touched Go package suites passed against real PostgreSQL, including pinned launch parameter admission and replay. The full scan Planner suite passed after the retry correction, including real-store CAS, exact prior revision retention and identical acknowledgement recovery."
  contracts: "make verify-public-api and test-wire-cross-language passed: 378 shared fixtures, 425 Go and 270 Python shared tests. One optional disk-heavy shared test skipped; heavy I/O stayed disabled."
  process: "All four shipped scan profiles passed through actual Server, Runtime, Nuclei/SQLMap and PostgreSQL. Nuclei web and engagement gates passed, including cancellation and conservative lost-outcome recovery."
  browser: "Real browser-created web and OpenAPI scans passed without settings artifacts. OpenAPI Tasks retained canonical results after source Run deletion. The real scanner Findings gate passed positive/fixed controls, selected evidence, Runtime-free publication replay and browser source/evidence views."
  ui: "make ui-verify passed: 221 test files, 2487 tests passed and one expected failure; all 17 static-server tests passed and the production build succeeded. Six Chromium web-form checks passed at 390/1440px in light/dark/black themes; screenshots were inspected."
  config: "Shipped catalog validation passed: 31 Workflows, 32 AgentTemplates and 15 Audit profiles."
  lint: "Final make docs-dependencies lint passed, including generated contracts/clients, strict shared fixtures, task/spec checks, Go/Python layers, release graph and UI gates."
