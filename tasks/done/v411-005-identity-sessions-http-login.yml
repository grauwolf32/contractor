schema_version: '1.0'
id: V411-005
title: Isolate target identities and execute bounded private HTTP login recipes
milestone: autonomous-http-pentest-2026-10
epic: http-tools
kind: feature
priority: P1
status: completed
implementation_commit: 53a04dc07d33a1608bd812a8e08cd7dfd5db8e14
