scope:
  in:
  - Wire placed Runtime login preflight to a private identity/session manager over V411-003; support
    anonymous, Basic, bearer and http-login.
  - Implement closed HTTP login recipe request/extraction subset, private field bindings, explicit
    identity control and one refresh per verification/replay invocation.
  - Separate session generations, pools, cookies and tokens; reject caller auth/Host/proxy/private-field
    overrides and suppress Project authorization inheritance on every request.
  out:
  - Browser contexts/login belong to the optional browser series; no raw token/credential input from
    model, sandbox integration or generic session export.
  - Do not reuse ordinary V377 cookie artifacts to seed a pentest identity or replay generation; ordinary
    HTTP session persistence is not changed.
requirements:
- id: R1
  text: The placed authenticated preflight is the production caller; every new session/login helper
    participates in that path before later tools use it. Tools expose only identity IDs and opaque
    allocation-local handles.
- id: R2
  text: Use exact credential revisions from V411-001; inject at the final approved origin only. Separate
    each identity and invalidate handles on replacement/release; anonymous receives no inherited authentication/cookies/storage.
- id: R3
  text: HTTP login success requires an authenticated control with expected identity; status 200/cookie/home
    redirect alone fails. Preserve declared roles/tenants separately from observed assertions; failed
    auth does not relabel work anonymous.
- id: R4
  text: Login/refresh requests consume the same action permits, deadlines and count limits; private
    extracted token/CSRF values remain tainted across variable renaming. Missing extraction is blocked/inconclusive,
    not an empty value.
- id: R5
  text: Keep canonical HTTP login schema and shared valid/invalid fixtures under api/testdata; do
    not create the general PoC executor owned by V411-009. Never publish login-secret bytes in preflight
    results/events/artifacts/logs.
failure_outcomes:
- operation: Prepare/login/refresh a target identity
  permanent: Wrong kind/binding/recipe yields permanent 400 contract validation or blocked_by_policy;
    missing identity assertion/invalid credentials yield auth_failed or auth_expired and disable only
    that identity.
  retryable: At most two default/three maximum login attempts per identity/allocation, only when conservative
    pre-send retry rules allow; at most one refresh per check/replay invocation.
  ambiguous: Reuse original action identities; unknown login/logout effects are retained and not repeated
    automatically. Replacement explicitly creates a new session generation within original budget.
  cancelled: Session manager closes clients, joins login tasks and erases material before allocation
    release.
  timeout: Each action uses V411-003 time bounds and the original login/lifecycle budget; refresh
    never renews them.
- operation: Resolve private credential/extraction bindings
  permanent: Foreign/unheld/revoked or unavailable exact refs fail safe not-found/blocked without
    fallback or model-visible secret details.
  retryable: Only bounded 503 storage conflicts may retry before target sending.
  ambiguous: Inspect the same exact held revision and original action receipt; do not rotate an alias
    to recover.
  cancelled: Join material callbacks and wipe all transient values on failure/cancel.
  timeout: Private material lookup and target request have separate bounded deadlines.
cardinality:
- collection: Identity sessions inside one allocation and Audit
  expected: Anonymous plus accounts A and B
  maximum: Eight engagement identities; eight default/16 maximum login actions per attempt, two default/three
    maximum attempts
  bound: Allocate only assigned identities; all actions counted against one Audit ledger; no shared
    mutable cookie artifact.
- collection: Private login fields and extracted values
  expected: Two login fields and a CSRF token
  maximum: 16 fields and 16 KiB total credential material; extraction/input document and response
    limits from V411-002/V411-003
  bound: Bound values before parsing and keep them memory-only; no per-session unbounded response
    history.
lifecycle:
- entity: Opaque session handle, cookie jar and private login state
  delete: Only allocation release/replacement/session reset destroys local state; no user-readable
    persistence export.
  cascade: Cancel/lease loss joins client work and wipes tokens/cookies; new allocation must log in
    again.
  retention: Safe identity-control provenance may be retained; recoverable secret state never enters
    ArtifactStore or report.
acceptance_criteria:
- id: A1
  given: One target with anonymous, A and B and a Project-level credential
  when: Placed preflight and identity-bound requests run concurrently
  then: Each request has only its selected identity, anonymous inherits nothing and pools/cookie jars
    never transfer authentication.
- id: A2
  given: A login returns 200/cookie but wrong or missing principal assertion
  when: Preflight evaluates its pinned control
  then: It blocks that identity and keeps declared role separate; another valid identity can continue.
- id: A3
  given: Expired session, missing CSRF extraction and refresh failure
  when: A check invokes the allowed refresh
  then: Limits and permits are respected, failures are explicit and no anonymous fallback or guessed
    value appears.
- id: A4
  given: Replacement allocation or replay with old handle
  when: A new session generation is prepared
  then: Old handles fail; fresh login and isolated state are used within original budget.
- id: A5
  given: Credential canaries in response echoes and derived token variables
  when: Failure, cancellation and public telemetry paths execute
  then: No secret appears in model-visible preflight, logs/events/artifacts and transient material
    is erased.
tests:
- command: go test -tags=integration -count=1 ./internal/credentials/... ./internal/contracts/...
    ./internal/controlplane ./internal/auditservice
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-runtime test-wire-cross-language test-http-caido-runtime test-pentest-http-process
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Disposable PostgreSQL able to create/drop isolated schemas; never print its connection secret.
- Repository-pinned Go and locked Runtime dependencies; run commands from the repository root unless
  the command explicitly changes directory.
verification_requirements:
- Use testdata fixtures, never the live configs tree outside the documented e2e/eval exceptions. Keep
  model choice unchanged; deterministic targets need no real Gateway.
- Run every touched package in full, including any new package introduced by this task. Database tests
  require disposable PostgreSQL through CONTRACTOR_TEST_DATABASE_URL; an unreachable configured database
  fails and skipped mandatory cases do not pass.
- New shared fixtures must be registered with their Go/Python/schema readers in the existing shared-fixture
  gate. New process selections must fail when zero tests match and be reachable from release-verify.
- Update the owning normative specification, shared limits/errors/lifecycle registries and public/private
  contracts in the same change. Preserve existing contract ownership; do not add backward-compatibility
  readers or edit generated clients manually.

