applicability:
- Both declared dependencies are completed on current main. Exact immutable target credentials and
  the independent controlled HTTP gate exist; the placed preflight remains anonymous-only and has
  no isolated Basic/bearer/login sessions, authenticated identity control or bounded refresh.
- Reuse the current controlled transport, action ledger and private exact-credential authority.
  Coordinate assignment/action/schema changes before Runtime implementation; do not add a general
  recipe executor, another receipt mechanism or Project session inheritance.

implementation_notes:
- Placed preflight is the production caller for anonymous, Basic, bearer and HTTP-login identities.
  Existing private allocation preparation carries exactly bound credentials; no new credential
  endpoint, model-facing session export, receipt family or journal table is introduced. Ordinary
  Workers and their summarizers receive RuntimeSettings without target credential material.
- Admission reads and validates exact pinned HTTP recipe bodies once. The immutable baseline omits
  loginRecipes when no supported HTTP recipe is assigned, and requires its nonempty exact map when
  one is assigned. This is the canonical current shape, preserving recipe-free baseline bytes and
  existing evidence digests; no reader resolves old aliases or synthesizes missing bodies.
- The closed recipe permits static GET/read and POST/probe requests, flat JSON/form bindings,
  bounded private extraction and an explicit identityEquals control. Basic/bearer without a recipe
  report credential_configured; optional control-only recipes can establish authenticated status.
  HTTP 200, cookies, declared roles and tenants alone establish no observed principal.
- The existing Audit action journal now keys actions by allocation, identity, phase, generation and
  slot. Method/action class are server-derived from the frozen slot. Same-allocation replay uses
  existing receipts; pending traffic for an identity blocks another allocation until joined proof.
  Every physical request keeps the original shared request/rate/capacity/deadline charge. Login
  actions and refresh generations additionally consume the pinned identity allowance.
- Refresh is allowed once after a seed 401/403 and a completed fresh control. A successful control
  means ordinary access denial; unknown transport never enables automatic retry or refresh. The
  only transport retry is one proven pre-send GET/read connect/TLS failure. Anonymous/configured
  identities can continue distinct seed slots without repeating an unknown slot; verified recipe
  sessions instead stop after uncertain transport or invalid private session state.
- Login/control/refresh never process Location or persist its digest. Authenticated seed redirects
  may use only exact pinned seed URLs at the permitted origin; the journal independently rejects
  other authenticated redirect digests. This bounded subset avoids private URL interpolation and
  secret-derived hashes; a general replay executor remains outside this task.
- Sessions own exact-origin memory-only cookie jars, private variables and generation handles.
  Stop joins every active stream and parsing task, clears shared allocation target material and
  drops faulted-task tracebacks before acknowledging stop. No session or token is persisted as an
  Artifact, and failed authentication never becomes an anonymous request.
- Migration 58 preserves journal identities, outcomes, request charges and attribution. It refuses
  atomically if an earlier HTTP-login baseline lacks a validated recipe snapshot, or a partially
  purged journal no longer has the original attempt needed for attribution. It changes no data in
  either case. Pending purge must finish on the previous revision; unsupported recipe snapshots
  require explicit operator resolution. SQL does not invent recipe bodies or rewrite evidence
  digests, and a filesystem-backed artifact cannot be assumed to have a PostgreSQL payload.
- Process tests observe real Server/Runtime/TCP/PostgreSQL boundaries and raw canaries before log
  truncation/redaction. The replacement process case starts a fresh allocation in another Audit;
  same-Audit budget/receipt replacement is separately verified on real PostgreSQL, while native
  Runtime tests prove old internal handles fail and new allocation sessions log in independently.
  These complementary checks are not presented as a general PoC replay implementation.

