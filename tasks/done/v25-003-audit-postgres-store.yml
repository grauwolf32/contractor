schema_version: "1.0"
id: V25-003
title: Persist the core Audit state machine in PostgreSQL
milestone: audits-mvp
priority: P0
status: completed
implementation_commit: 231f57ff93e6bbb2cc1f58a436f42bd8dc4d4b3f
depends_on: [V24-005, V25-001, V25-002, V25-002A]
languages: [go, sql]

goal: >-
  Provide a transactional durable authority for Audit, Round, Item, Execution,
  ExecutionItem, collection receipts, retained artifacts, coverage, events,
  claims and idempotency.

context:
  ownership: >-
    Audit belongs to one owner and one ordinary Project. Run labels are never
    authority. All mutation methods receive the authenticated owner or execute
    through a separate trusted Controller repository interface.
  recovery: >-
    Controller claims are short leases with epochs. Every stale mutation must
    fail even if an old process still believes it owns a claim.

scope:
  in:
    - Add the next ordered migration for audits, rounds, items, executions, execution_items, collection receipts, artifact links, coverage rows, events, idempotency records and Controller claims.
    - Encode closed lifecycle/disposition values with SQL checks and Go validation.
    - Enforce unique round/item ordinals, per-item attempts, execution batch ordinals/membership, null-safe discovery/assessment role attempts, submission keys, non-null Run associations and monotonic per-Audit event sequence.
    - Implement create/get/keyset-list, CAS transition, atomic accepted-round materialization, execution intent/binding, exact terminal observation, collection receipt, retry-or-settle and bounded claim/reconcile queries.
    - Advance the aggregate Audit revision on every projection-visible child, receipt, coverage, artifact or counter mutation, but not on Controller lease traffic.
    - Model one-to-many AuditExecution to AuditExecutionItem even though the MVP start gate permits batchSize=1 only.
    - Persist finite total submitted-Run budgets but no Audit-specific WorkflowRun concurrency setting; keep reservation counters needed by the later derived dispatch window.
    - Serialize create/start/dispatch mutations with the existing Project active/deleting fence.
  out:
    - HTTP routes, actual child Run creation, result package parsing, findings or human review.

requirements:
  - {id: R1, text: Unknown and foreign resources remain indistinguishable to owner-facing callers.}
  - {id: R2, text: Every idempotent mutation replays only an identical canonical request and conflicts on payload drift.}
  - {id: R3, text: No table permits one Run or submission intent to bind to two AuditExecutions, or one item attempt to bind to two executions.}
  - {id: R4, text: Claim expiry alone cannot let a stale epoch commit.}
  - {id: R5, text: Terminal Run observation does not settle an item; one durable collection receipt records every accepted, missing, invalid, failed or cancelled attempt before retry-or-settle.}
  - {id: R6, text: A strong Audit revision/ETag cannot remain unchanged while any field in its bounded public projection changes.}

acceptance_criteria:
  - id: A1
    given: Concurrent creators, starters and two Controller instances.
    when: They race on one Audit.
    then: Exactly one baseline, round, execution-item attempt, intent and event sequence wins without duplicate logical work.
  - id: A2
    given: Project deletion begins before or during Audit mutation.
    when: The transaction reaches its fence.
    then: No new Audit work commits after Project lifecycle is deleting.
  - id: A3
    given: PostgreSQL restart after each durable phase.
    when: A new repository instance scans work.
    then: It can identify the exact next bounded reconcile action.
  - id: A4
    given: A terminal failed or output-less Run and a remaining retry budget.
    when: Collection commits its disposition receipt.
    then: The prior attempt remains immutable and the logical item becomes ready rather than settled; after exhaustion it settles exactly once.

tests:
  - {name: unit, command: "go test ./internal/auditstore", covers: [A1, A4]}
  - {name: postgres, command: "go test -tags=integration ./internal/auditstore", covers: [A1, A2, A3, A4]}
