schema_version: "1.0"
id: V372-019
title: "Check the pg_dump and pg_restore version before the backup and restore rehearsal"
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
priority: P3
status: completed
implementation_commit: "9d98a53753d05dc39174331365c45845f2f0979c"
depends_on: []
languages: [go, markdown]
goal: "make test-backup-restore and the restore test fail at once with a clear message when pg_dump or pg_restore is older than the PostgreSQL server's major version, and the guides state the requirement."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2g: V370-016), an environment note, recorded 2026-10-12; file:line verified on b2b09ea"
  finding: >-
    TestBackupRestorePreservesExactArtifactsAndCAS
    (tests/integration/restore/restore_test.go:29-90) runs pg_dump and
    pg_restore from PATH through runPostgresTool (:198-212). With a client
    older than the server (pg_dump 16 against PostgreSQL 17 on the wave-2
    machine) pg_dump refuses the server-version mismatch and the test fails
    in the middle of its setup with the tool's message. make
    test-backup-restore (make/core.mk:61-63) checks only that both tools
    exist, and docs/testing/README.md:154 and
    docs/operations/artifact-blob-storage.md:120-121 name the tools without
    the version they need. The test and the target predate the shallow
    history (boundary 6349621).
  siblings: >-
    The test is opt-in (scripts/release_integration_tests.py and
    scripts/release_race_packages.py exclude it with a reason), so CI does
    not run it; the operator procedure in artifact-blob-storage.md
    (pg_dump --format=custom, pg_restore --exit-on-error) has the same
    requirement for a real backup.
scope:
  in:
    - "Compare the major version of pg_dump and pg_restore with the server's (SHOW server_version_num) in the make target or at the start of the test, and fail with a message that names both versions."
    - "State the requirement in docs/testing/README.md and docs/operations/artifact-blob-storage.md."
  out:
    - "The rehearsal itself and the backup format."
acceptance_criteria:
  - id: A1
    given: "A pg_dump whose major version is lower than the server's"
    when: "make test-backup-restore runs"
    then: "It fails before any database is created, naming both versions."
  - id: A2
    text: "With matching tools the rehearsal runs as before."
tests:
  - command: "make test-backup-restore"
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2]
verification:
  date: "2026-10-23"
  revision: "4925c9c78b9457bccca516060e789cb4bc939c25"
  environment: >-
    Integration branch integration/quick-wins-2026-10-23 on macOS arm64 with
    Go 1.26.9, Node 24.20.0, pnpm 11.24.0, disposable PostgreSQL 17.11
    (CONTRACTOR_TEST_DATABASE_URL set) and TMPDIR under /private/tmp.
  merged_run:
    - "make -k verify: lint after the dependency graph refresh, ui-verify (2,260 UI tests), test-config and build passed; make lint passed in full on the rerun."
    - "make test-go: every package passed except internal/app TestPostgresControlPlaneLeaseSessionDetectsVanishedHolder, which fails the same way on main because macOS PostgreSQL does not support tcp_user_timeout."
    - "make test-runtime: the 102 failures it reports (Podman, Darwin process limits, sandbox) fail identically on main; test_scan_toolset::test_capabilities_check_each_binary_independently[scan_nuclei] is timing-dependent (V371-022 class) and passed on rerun."
    - "make test-wire-cross-language (243 fixtures, 1,135 tests) and make verify-public-api passed."
  task_commands:
    - "make test-backup-restore: passed with pg_dump and pg_restore 17.11 against PostgreSQL 17.11, and a fake pg_dump 16.4 failed before any database was created."
