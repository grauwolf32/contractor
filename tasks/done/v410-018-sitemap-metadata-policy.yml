    Runtime explicit tools. Matching-secret transport and its unused limit were removed; obsolete input members
    fail strictly.
  - Shared fixtures, PostgreSQL collection tests and actual Server/Runtime scenarios retain credential-like metadata.
    General HTTP evidence and telemetry redaction keep their original policy.
  - 'The earlier owner-input finding is withdrawn: an owner-selected ordinary full map is authorized for a blackbox
    Run. Dedicated sitemap views and snapshots continue to enforce their pinned source mode. The owning spec, proposal
    and unfinished delivery tasks state this boundary.'
