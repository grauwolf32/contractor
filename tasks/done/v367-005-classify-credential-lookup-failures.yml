schema_version: "1.0"
id: V367-005
title: "Keep the failure class of credential lookups during Workflow resolution"
milestone: hub-audit-2026-10
epic: runtime-config
kind: defect
introduced_by: V102-001
priority: P1
status: completed
implementation_commit: 41c584c3f2c3b9a3a438487572e3b7aaf7ad5eaf
depends_on: []
languages: [go]
goal: "A transient or recovering credential store makes Run and Audit creation answer the documented retryable 503, not 400 or 500."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq), config G1 / F1"
  specification:
    - docs/spec/configuration/runtime-config.md
    - docs/spec/platform/errors.md
  finding: >-
    config/execution_config.go:740-742 replaces any LookupLLMCredential error
    with "credential is unavailable" and drops the cause.
    runservice/public.go:54 wraps every resolve error as ErrInvalid, so POST
    /v1/runs answers 400 invalid_request, retryable=false, where OpenAPI
    documents 503 RunCreationUnavailable; auditservice/start.go:122-126
    answers 500 and its transaction retry never sees the conflict. V102-001
    fixed Evals with a side-channel tracker (evalservice/preflight_errors.go:60-103)
    instead of keeping the class. Sibling to check:
    findingintake/service.go:274 treats any error as ErrToolNotSelected.
  decision: >-
    internal/config owns the one rule: during Workflow credential
    revalidation only a confirmed absent credential (credentialerrors.LLMNotFound)
    or a mismatched one is an invalid selection; any other lookup failure, or
    one after the context ended, is classified as config.ErrCredentialLookup
    and keeps its cause behind a static, secret-free message. Callers
    (runservice.CreatePublic, auditservice start, eval preflight, the repeat
    draft) map only the remaining validation errors to their invalid outcome
    and pass lookup failures to the shared error mapping. Alternative: mark
    validation errors positively instead; rejected because every other
    ResolveRunWorkflow error is deterministic validation and positive marking
    would touch every validation site. Reopen if ResolveRunWorkflow gains
    another non-deterministic dependency. Deviations: (1) Audit start now
    answers 400 for a confirmed missing or mismatched pinned credential (it
    answered 500). (2) The repeat draft, also a ResolveRunWorkflow caller,
    answers the classified error instead of a false "selection no longer
    available" notice during an outage, so its OpenAPI 503 now references
    CredentialRecoveryRequired; the UI client is regenerated, the already
    stale Go client is left to V367-011 (the changed response alias is Error
    either way). (3) findingintake verifyTrustedExecution had the same class
    (storage failures while reading the Run, StageExecution or Audit
    execution became a permanent 403) and is fixed with a real-store test.
    (4) The existing secret-escape test's lookup fake now models absence with
    LLMNotFound plus secret text, because an opaque error is now an outage; a
    new test covers outages carrying secret text. Ruled out: runtimeconfig
    credential validation (classified by V102-001; it also counts
    pgx.ErrNoRows as absence, which no LLM provider surfaces), scheduler
    credential resolution and controlplane placement (both keep the cause).
    The eval workflow adapter's CreatePublic path is fixed by the runservice
    change (a lookup outage was eval_pin_mismatch).
scope:
  in:
    - "Wrap a sanitized, classified sentinel from the credential lookup (no secret or credential text in the message); runservice maps only validation errors to ErrInvalid; auditservice and evalservice use the same classification and the evalservice tracker is removed."
    - "Every caller of ResolveRunWorkflow / execution config credential validation."
  out:
    - "Messages for missing or mismatched credentials (still 400)."
acceptance_criteria:
  - id: A1
    text: "Handler tests: a transient lookup failure gives POST /v1/runs 503 RunCreationUnavailable and Audit start the documented retryable error; a missing credential still gives 400."
  - id: A2
    text: "The existing test that a secret value never escapes the error still passes."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test ./internal/config ./internal/runservice ./internal/auditservice ./internal/evalservice ./internal/httpapi/public"
    covers: [A1, A2]
