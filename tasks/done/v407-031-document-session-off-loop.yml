  - 'A1: test_openapi_document_work_runs_on_worker_threads_while_the_loop_runs and
    test_likec4_document_work_runs_on_worker_threads_while_the_loop_runs hold seed decoding at a
    threading.Event barrier while a loop callback runs first (order ["loop callback", "decoded"]), and
