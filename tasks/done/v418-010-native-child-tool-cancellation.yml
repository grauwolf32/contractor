failure_outcomes:
- operation: Child cancellation at an SDK/A2A boundary
  permanent: Prior sandbox/history validation remains fail-closed.
  retryable: No cancellation-specific replay.
  ambiguous: Existing receipts reconcile uncertain external effects; known sibling data wins.
  cancelled: Join and preserve cancellation even when cleanup also fails; terminal A2A status cannot stay
    working.
  timeout: Semantic deadline and independent joined cleanup budget stay distinct.
cardinality:
- collection: Current-turn cancellation evidence
  expected: One boolean.
  maximum: O(1); existing model/tool/turn ceilings unchanged.
  bound: No new history scan or external call; reset only on authorized invocation/turn.
lifecycle:
- entity: Ephemeral SDK-turn cancellation evidence
  delete: Existing invocation/runtime owner clears it.
  cascade: No new durable entity or effects.
  retention: Allocation-local only; existing metrics and terminal State persist under their owners.
verification:
  focused: 301 passed, zero skipped, across all five required owner modules plus the existing repeated
    external-cancellation module. An isolated no-op guard mutation fails all four single/parallel shared/isolated
    regressions.
  native_linux: Fresh locked full Runtime:5051total/4996passed/55unchanged allowed skips/0fail/0errors;
    report verifier passes; all9 native control leaves and the exact required singleton pass. Source manifest
    remains unchanged.
  lint: make lint passes on the final production source; linked evidence retains original component checks,
    first failed Linux attempt, explicit external-origin repair, source/lock/report hashes and exact commands.
