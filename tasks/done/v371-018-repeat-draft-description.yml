schema_version: "1.0"
id: V371-018
title: "Remove the historical-request sentence from the repeat-draft OpenAPI description"
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: chore
priority: P3
status: completed
implementation_commit: "5f9a20e73a8bc7e5e5183bc12e7cfb98879acbb3"
depends_on: []
languages: [yaml, go, typescript]
goal: "The getRunRepeatDraft description states only behaviour the Server has, and the generated clients repeat it."
context:
  review: "Out-of-scope finding of the hub audit fix batch (group G8), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/execution/runs.md#RUN-R101"
  finding: >-
    The getRunRepeatDraft description
    (api/openapi/contractor-public-v1.yaml:4794-4801) says "Historical
    requests that predate executionConfig retention remain explicitly
    unavailable instead of inheriting current defaults silently". There are
    no such requests (pre-production, AGENTS.md section 2):
    RunRepeatExecutionConfig allows only the status available
    (yaml:13432-13438), and a missing or invalid retained fragment is a
    blocking notice without a draft (RUN-R101, FAIL-RUN-8). The sentence is
    repeated in the generated Go client
    (internal/publicclient/generated/public.gen.go, four comments) and the
    generated UI types. Predates the shallow history (boundary 6349621).
  siblings: >-
    Other OpenAPI descriptions that mention historical data, the allocation
    report history (yaml:6208) and the retained Markdown summary
    (yaml:11920), describe retained records and stay; check every
    description that says historical, legacy or predate the same way.
scope:
  in:
    - "Replace the sentence with the RUN-R101 behaviour and regenerate the Go client and the UI types (make generate-public-client, make ui-generate)."
  out:
    - "Repeat-draft behaviour."
acceptance_criteria:
  - id: A1
    text: "No OpenAPI description, generated Go client comment or generated UI type mentions requests that predate executionConfig retention."
  - id: A2
    text: "make verify-public-api passes and both generated files are fresh."
tests:
  - command: "make verify-public-api"
    covers: [A1, A2]
  - command: "make ui-verify"
    covers: [A2]
  - command: make lint
    covers: [A1, A2]
verification:
  date: "2026-10-23"
  revision: "4925c9c78b9457bccca516060e789cb4bc939c25"
  environment: >-
    Integration branch integration/quick-wins-2026-10-23 on macOS arm64 with
    Go 1.26.9, Node 24.20.0, pnpm 11.24.0, disposable PostgreSQL 17.11
    (CONTRACTOR_TEST_DATABASE_URL set) and TMPDIR under /private/tmp.
  merged_run:
    - "make -k verify: lint after the dependency graph refresh, ui-verify (2,260 UI tests), test-config and build passed; make lint passed in full on the rerun."
    - "make test-go: every package passed except internal/app TestPostgresControlPlaneLeaseSessionDetectsVanishedHolder, which fails the same way on main because macOS PostgreSQL does not support tcp_user_timeout."
    - "make test-runtime: the 102 failures it reports (Podman, Darwin process limits, sandbox) fail identically on main; test_scan_toolset::test_capabilities_check_each_binary_independently[scan_nuclei] is timing-dependent (V371-022 class) and passed on rerun."
    - "make test-wire-cross-language (243 fixtures, 1,135 tests) and make verify-public-api passed."
