schema_version: "1.0"
id: V457-006
title: Retain Project target credential creation identity after response loss
milestone: ui-consolidation-2026-10
epic: ui
kind: defect
introduced_by: V28-003
priority: P2
status: completed
depends_on: []
languages: [typescript]
goal: An explicit retry of the same Project target credential reuses its create identity without retaining secret material.
context:
  authority: User decision 2026-11-07 authorizes all reported release-review fixes and scoped simplifications on a separate branch, including U1.
  specification:
    - docs/spec/ui/ui.md#UI-R164
  severity: medium
  finding: >-
    ui/src/routes/projects/http-target-editor.tsx:263-280 creates a fresh credential ID
    and idempotency key for each submission. A committed create whose response is lost
    leaves an active orphan and the same explicit retry creates a second credential.
  siblings: >-
    RuntimeCredentialCreateForm already retains a safe ID/kind/key attempt and clears
    submitted secrets. Preserve its behavior; Project target creation and subsequent
    Project PATCH recovery use the same server credential receipt owner.
scope:
  in:
    - Retain only safe attempt identity and reconcile the credential inventory after uncertain outcomes.
    - Preserve exact retry after creation and a failed Project update, with browser-facing regression coverage.
    - Increment the UI patch version once for the release polish batch.
  out:
    - New credential persistence, protocol operations, secret browser storage or automatic replay.
acceptance_criteria:
  - id: A1
    text: A committed create with a lost response followed by identical explicit retry sends the same credential ID and key and creates one credential.
  - id: A2
    text: Basic and Bearer inputs clear on submit and kind change; changing material under an uncertain identity is refused by existing server MAC validation.
  - id: A3
    text: A refused Project update retains the created credential for retry without creating another credential.
tests:
  - command: cd ui && corepack pnpm test --run src/routes/projects/http-target-editor.test.tsx src/routes/operations/runtime-configs/configuration.test.tsx
    covers: [A1, A2, A3]
  - command: make ui-verify
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
verification:
  focused: 26 passing tests across Project target and Runtime credential configuration suites.
  browser: 4 passing Chromium dialog cases, including lost-response credential replay at 1440 px and 390 px.
  typecheck: Both application and e2e TypeScript configurations passed.
  integration: The full ui-verify gate passed 218 files, 2457 tests and one declared expected failure; Node tests, generation checks, typechecking, lint and production build passed. The integrated make lint and 212-case mocked Chromium gate passed. Skips and the expected failure are not passing coverage.
implementation_commit: 46b331d4967eda6180fd22e16678e381e396d92b
