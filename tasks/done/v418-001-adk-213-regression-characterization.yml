goal: Make the observed ADK 2.8 to 2.13 incompatibilities reproducible on real Runner paths and resolve
  the expected Contractor outcomes before the atomic dependency migration.
context:
  authority: 'User request on 2026-10-25: plan the ADK 2.13 upgrade with every identified compatibility
    change, adjust the existing compaction series, and keep model consultation as a proposal. These pending
    tasks do not start implementation or change the current delivery focus.'
  review: tasks/evidence/v418-adk-213-review.json
  characterization: tasks/evidence/v418-adk-213-characterization.json
  specification:
  - docs/spec/execution/worker.md#WRK-R65
  - docs/spec/execution/worker.md#WRK-R106
  - docs/spec/execution/worker.md#WRK-R167
  - docs/spec/audits/worker-completion.md
  - docs/spec/tools/toolsets.md#TLS-R29
  - docs/spec/platform/observability.md#OBS-R23
  finding: 'The dated exploratory run selected 326 cases: 315 passed, 10 failed and one real-Go-API case
    was skipped with ADK 2.13.0. The same ten failing cases passed on the existing 2.8 environment and
    failed again with only ADK, google-genai and authlib replaced. Five failures lose completion reminders,
    three change interrupted-call history, one retains an unknown tool name and one starts/counts a callback
    after the deadline. The last case made only one provider request, not two. Exact tested source revision
    was not captured in that run and must not be inferred from a later HEAD.'
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
  execution_authority: 'User authorized implementation on2026-10-25: finish Runtime V418 before the Server
    Go ADK migration.'
scope:
  in:
  - Preserve existing real-Runner assertions; extend test-local fixtures for missing cases and capture
    a sanitized reproducible case manifest.
  - Record a concrete logical Contractor invocation versus ADK turn mapping and interrupted-history projection
    contract in the owning spec before implementation, without claiming the migration has shipped.
  out:
  - Production dependency bump or behavior changes; those land together in V418-002.
  - Permanent expected-failure tests, skipped regression gates, a multi-version production adapter or
    a new compaction implementation.
acceptance_criteria:
- id: A1
  given: The current supported lock and the ten recorded regressions
  when: The full affected baseline modules run
  then: All ten execute and pass, or a separately owned current-baseline defect is resolved before this
    task completes; original expectations remain intact.
- id: A2
  given: Real ADK calls with controlled tools and an injected clock
  when: The extended negative scenarios run
  then: Tests distinguish raw-type rejection, side effects, model admission, provider requests, per-call
    accounting and release; deliberately corrupted fixtures fail.
- id: A3
  given: Candidate ADK 2.13 and the same fixtures
  when: The isolated characterization is recorded
  then: Every observed mismatch has a stable scenario and a Contractor outcome, with test exit codes preserved;
    candidate failure evidence does not masquerade as a passing release check.
- id: A4
  given: Logical invocation and SDK turn/history alternatives
  when: The migration contract is selected
  then: One supported design is recorded with its ownership, bounds and reversal condition; it enables
    V418-002 without any dependency on V417 or Consult.
