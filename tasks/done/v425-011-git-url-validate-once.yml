schema_version: '1.0'
id: V425-011
title: Validate a Git import URL once in its canonical form
milestone: hub-audit-defects-2026-10
epic: projects-artifacts
kind: defect
introduced_by: V35-002
priority: P3
status: completed
depends_on: [V425-024]
languages:
- go
goal: A Git import URL is either refused at intake or fetched; a URL that passes intake never fails later
  with ErrURL.
context:
  authority: "2026-10-31: user chose to preserve the 4096-byte input bound and increase canonical provenance storage/API bounds. V425-024 owns that prerequisite."
  decision: >-
    2026-10-31: completed V425-024 preserves LIM-GIT-23 (4096 input bytes) and
    introduces LIM-GIT-24 (12288 canonical provenance bytes) per the user's
    decision. Importer.DoImport is Fetch's only production caller and passes
    ParseRemote's canonical value directly. Fetch must consume that value
    without applying the original input bound again. User/Project imports share
    that intake; credential lookup consumes the parsed Address/User and does
    not reparse the encoded URL. Allowlist, reference and transport validation
    remain at their existing boundaries.
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  severity: low
  finding: internal/gitimport/client.go Fetch (line ~218) re-validates the repository URL after percent-encoding
    it; a non-ASCII URL passes the intake check and then fails at Fetch with ErrURL, after the import
    was accepted.
  siblings: Every other caller that validates a remote URL before percent-encoding (Project Git sources,
    credentials host matching).
scope:
  in:
  - Validate the submitted URL at ParseRemote; Fetch trusts its canonical value without reapplying the input bound.
  - A test with a non-ASCII URL through intake and Fetch.
  out:
  - Changing which URLs are allowed.
acceptance_criteria:
- id: A1
  text: A non-ASCII URL is either refused at intake with the owning code or fetched successfully.
- id: A2
  text: The test fails on the unfixed code.
tests:
- command: "make test-git-read-only on Linux, or execute its make -n recipe with sh inside a Linux VM with Go, Git, Podman and preinstalled Alpine"
  covers: [A1, A2]
- command: "go test -tags=integration -count=1 ./internal/gitimport/..."
  covers: [A1, A2]
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/gitimport/...
  covers:
  - A1
  - A2
- command: make lint
  covers:
  - A1
implementation_commit: 8a8fcfebefb7672170ce6fbb357ccdbec25bade8
verification_results:
- "2026-10-31: go test -count=1 ./internal/gitimport/... passed with the disposable PostgreSQL URL set; go test -tags=integration -count=1 ./internal/gitimport/... passed the full native package suite."
- >-
  TestRealGitUTF8URLIntakeAndFetch fetches a real native-Git repository over
  verified TLS for 2-, 3- and 4-byte Unicode characters at exactly 4096 input
  bytes. It checks the exact commit, all files, the decoded HTTP paths and
  unchanged canonical provenance beyond the raw-input bound.
- "A temporary Go overlay restoring the redundant ParseRemote guard failed all three regression cases with ErrURL; tracked sources were unchanged."
- >-
  The complete make -n test-git-read-only recipe passed inside Podman
  Machine's Linux arm64 VM with a native Linux Go SDK and local Podman.
  The full Git integration suite, including the Unicode regression and the
  nested read-only container proof over HTTPS/private SSH, passed there.
- "make lint passed. The prerequisite's real PostgreSQL, API, UI and shared-wire checks remain recorded under completed V425-024."
