  environment: >-
    macOS arm64; Python 3.13 with the locked Runtime venv; Go 1.26.9 and the pnpm UI install for
    make lint; branch claude/v414-sec containing main c73ec319.
  commands:
    - >-
      cd runtime && uv run --locked pytest -q tests/test_otlp_retries.py tests/test_otlp_adapter.py
      tests/test_otlp_streaming.py passed (95 passed).
    - >-
      A1: test_tls_and_os_transport_failures_retry_exact_payload[tls-send, tls-body, reset-send,
      reset-body] deliver the identical payload on the third attempt with failed_operations 2 and
      nothing dropped. A2: test_persistent_tls_and_os_transport_failures_exhaust_retries (four
      cases) and test_corrupt_tls_record_from_a_real_collector_exhausts_retries[headers, body]
      (real TLS, three connections) drop the batch as retry_exhausted. A3:
      test_terminal_transport_and_implementation_failures_never_retry (UnsupportedProtocol,
      LocalProtocolError, TypeError, a gzip acknowledgement that fails decoding) drop it as
      non_retryable after one request.
    - >-
      A4: with the exporter restored from the pre-fix revision, all ten A1/A2 tests fail
      (OTLPDeliveryError after one attempt, non_retryable) and the A3 tests pass.
    - uv run --locked pytest -q tests/test_http_toolset.py passed (the helper refactor).
    - >-
      make test-runtime: 4609 passed, 39 skipped, 107 failed. Every failure is in a module that
      imports none of the changed code (podman, tool_process, projectfs, trailmark, code_analysis,
      local_direct_faults) and fails on macOS-only causes: OSError [Errno 43] from socketpair,
      the missing pidfd_open symbol, the address-space limit and allocation resource
      preparation. They need the Linux release gate; they are not a pass on this host.
    - make lint passed (exit 0).
