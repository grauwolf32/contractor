failure_outcomes:
- operation: Native model-call admission
  permanent: Existing invalid input, history and sandbox failures retain their owner and classification.
  retryable: Contractor budget exhaustion remains worker_budget_exhausted; SDK defaults cannot invent
    a different early failure.
  ambiguous: Existing Gateway transport and business receipts retain reconciliation; no model or tool
    replay is added.
  cancelled: Existing CancelTask, deadline and joined cleanup ownership remain unchanged.
  timeout: Semantic deadline and independent cleanup budget retain their separate bounds.
cardinality:
- collection: Model operations per logical Worker invocation
  expected: Configured finite maxModelCalls including result finalization.
  maximum: 1000 admitted model calls; no provider dispatch or metric charge for1001.
  bound: Existing cumulative Contractor budget remains authoritative across SDK turns; explicit SDK limits
    do not grant extra semantic work.
- collection: One-shot auxiliary model operations
  expected: One provider dispatch.
  maximum: One dispatch; any finite SDK guard headroom only permits the owned wrapper to reject a repair
    attempt without dispatch.
  bound: Existing one-shot model guard and independently accounted summarizer/finalizer policies.
lifecycle:
- entity: Native per-run configuration
  delete: Runner invocation and one-shot session owner discard it after joined completion.
  cascade: No new durable entity, receipt, allocation state or cleanup operation.
  retention: Existing bounded metrics and Worker State retain outcomes under their current owners.
