schema_version: '1.0'
id: V64-003
title: Execute resumable research phases through ordinary Workflow Runs
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P2
status: archived
depends_on:
- V64-002
- V62-003
languages:
- go
- json
goal: Run bounded generation and optional evaluation as normal Audit-owned Workflows before or between
  Rounds, without a new zero-Worker Scheduler mode.
context:
  authority: On 2026-10-24 the user explicitly requested pending status for the reviewed proposal 0045
    plan, including shared V62 prerequisites. The earlier deferral is historical; dependency completion
    still gates implementation start. On 2026-10-31 the user accepted common hypotheses for all Audit
    assertion checks, with optional research creating new hypotheses, and authorized removing almost all
    formal approvals. This supersedes conflicting earlier scope and acceptance; replacement task boundaries
    remain open. The user also defined findings as hypothesis confirmations/refutations, required deduplication
    and hypothesis links for later selection, and made reducing or controlling Audit complexity the primary
    design constraint. Findings retain Audit/Run origin and an exact hypothesis link when present; exploratory
    tasks can produce findings without a prior hypothesis.
  decision_needed: The target Finding is a research conclusion with Audit/Run origin and optional exact
    hypothesis association. Preserve deduplication and all source contributions without a universal security-issue,
    mandatory hypothesis or human-confirmation gate. Before implementation, reconcile this task scope,
    dependencies and gates with proposal 0050. Keep this task pending and do not execute its superseded
    research-only scope. Route fixed and expanding work through common Run intents and recovery; compare
    ordinary coordinator tasks with a special pre-Round research phase before retaining that phase.
  proposal: docs/proposals/0045-audit-hypothesis-search.md
  design:
  - docs/plans/2026-10-24-audit-hypothesis-search.md
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/persistence.md
  deterministic_boundary: All Audit assertion checks use common hypotheses. Fixed checklist/standard seeds
    remain deterministic without generation, ranking or a separate research phase. Direct Runs and supporting
    non-assertion work need no hypotheses.
  implementation_boundary: Each new table, state, export and schema must have its named production writer/reader
    in this task; include the smallest actual integration caller, not a test-only placeholder waiting
    for another task.
  previous_definition:
    revision: a31579d33e81315818a277b822e3b087ce5c76c1
    path: tasks/v64-003-planner-only-priority-execution.yml
    title: Support ordinary zero-Worker Runs for the audit-priority planner
    depends_on:
    - V64-001
    note: The former fixed-checklist/minimum-ten integration scope is replaced by this task. Its original
      definition and deferral history remain in Git; completed V64-000 is unchanged.
scope:
  in:
  - Extend the single pre-Round phase definition with explicit research intent/submission/collection states
    and its resume predicate.
  - Use existing Run Service, pinned Workflow/Runtime configuration, placement labels, per-lane admission,
    approvals and Scheduler execution.
  - Collect declared ordinary Run outputs against exact cycle/batch manifests and preserve accepted batches
    across recovery.
  - Account generation and evaluation Runs in the same cumulative Run/deadline controls as check work,
    keeping preparation once-per-Audit.
  out:
  - A new Planner-only execution capability or modification of current deterministic profile routes.
  - Implementation during this planning change, changing existing task statuses, or modifying completed/in-progress
    task records.
requirements:
- id: R1
  text: A deterministic selector creates no ranking Run. Ordinary model-free research Workflows use already
    supported tool Workers; no special zero-Worker audit-priority Planner is required.
- id: R2
  text: Only research-enabled Audits enter these states. Shared phase predicates/UI projections have one
    definition; no broad alteration of ordinary Run scheduling.
- id: R3
  text: Scheduler retries stay within one Run. Audit retry requires terminal observation plus collection
    receipt, and ambiguous target work is never blindly repeated.
failure_outcomes:
- operation: Research Run intent, submission and terminal collection
  permanent: Invalid, foreign, unsupported or oversized input is rejected with the owning V64-001/standard
    contract reason; deterministic ErrInvalid is never endlessly retried and no partial authoritative
    result is accepted.
  retryable: Use existing bounded transient storage/provider retries for the owning operation; retry attempt/deadline
    limits are explicit and do not switch research policies or models.
  ambiguous: Reconcile the same existing keyed mutation, accepted producer association or exact result;
    never create another logical effect or repeat target activity to repair acknowledgement loss.
  cancelled: Existing Audit/Run owner fences and join/drain rules apply; allow authorized terminal collection,
    block new dispatch and release resources only after in-flight work is joined.
  timeout: Use the owning operation/Run deadline. Audit admission deadline pauses and drains; non-time
    budget exhaustion follows bounded finalization with gaps.
cardinality:
- collection: In-flight research producer executions
  expected: One bounded producer batch per active cycle
  maximum: Existing Audit submission windows and maxSubmittedRuns; at most one active cycle per Audit
  bound: Bound look-ahead, progress reads and terminal collection; no full-history rescan per tick.
lifecycle:
- entity: Task-owned research records, exact artifacts and projections
  delete: Audit/Project ownership and existing deletion gates apply; accepted evidence used by work is
    retained, not removed by settling or withdrawing a candidate.
  cascade: Use the owning Audit relations and existing artifact hold lifecycle; register any new holder
    inventory entry in this change and leave no independent cleanup owner.
  retention: Preserve exact accepted inputs/results and history through permitted source Run deletion,
    pause and recovery; release only through the owning lifecycle. Stateless validation/read-only outputs
    acquire no artificial persistent state.
acceptance_criteria:
- id: A1
  given: An enabled Audit before its first Round
  when: a configured research Workflow executes
  then: It uses ordinary Run/Stage/Worker lifecycle and accepts exact typed outputs under its pinned intent.
- id: A2
  given: Pause/deadline before dispatch or while a research Stage runs
  when: the Audit drains and resumes
  then: No new work is admitted while paused; existing collection persists and the same intent resumes
    without duplicated accepted batches.
- id: A3
  given: Lost submission response, stale owner claim or cancellation
  when: recovery runs
  then: The original Run association is reconciled and no unauthorized post-fence dispatch or missing
    terminal receipt occurs.
- id: A4
  given: A direct model-free Run and deterministic inventory Audit
  when: they run with research services unselected
  then: No generator/ranker calls or research execution rows are required, and their outcomes are unchanged.
tests:
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/auditcontroller ./internal/auditservice ./internal/auditstore/...
    ./internal/runservice
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make test-audit-composition-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
implementation_commit: null
reactivation:
  date: '2026-10-24'
  previous_status: deferred
  reason: Explicit user request to queue the reviewed proposal 0045 tasks as pending.
  execution_rule: Implementation may start after declared dependencies complete; this update starts no
    implementation.
previous_deferral:
  date: '2026-10-21'
  previous_status: pending
  previous_priority: P1
  reason: User deferred the remaining V64 integration to focus on authenticated HTTP continuity and completion
    of the existing V62 audit journey.
  reactivate_when: Explicit user authorization to implement this reviewed proposal 0045 scope, after its
    declared dependencies are completed. Replanning alone does not activate it.
  previous_reactivate_when: Explicit user decision after cookies and V62 are delivered and representative
    audit measurements show that model-based prioritization improves useful-result yield or time/cost
    over fixed ordering.
deliverables:
- path: internal/auditcontroller
  description: Ordinary research phase dispatch/collection and bounded reconcile integration.
- path: internal/auditservice
  description: Start/resume lifecycle validation for persisted research intent.
- path: internal/runservice
  description: Existing submission path with authoritative Audit associations, without Scheduler fork.
- path: tests/e2e
  description: Real process pre-Round execution/resume cases registered in the release graph.
- path: tests/e2e/audit_composition_matrix.yml
  description: Register every new mandatory composition process case in the existing explicit selector;
    prove nonzero execution.
test_prerequisites:
- Commands are implementation acceptance requirements, not results of this planning change. New named
  gates must be created, registered and fail on zero matching cases.
- Persistence/lifecycle acceptance uses disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; an
  unavailable configured database or mandatory skipped case fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Shipped configuration
  has its dedicated validation command.
- Run complete suites for touched packages; use injected clocks and deterministic work counters. Put timing
  measurements in benchmarks.
verification_requirements:
- Update owning numbered specifications, strict public/wire contracts and shared fixtures with implementation;
  do not cite task IDs from normative specifications.
- Record actual commands, case counts, required prerequisites and exact evidence after implementation.
  Planning does not populate implementation_commit or fabricate successful checks.
- Keep direct deterministic behavior, existing claims/receipts and source-to-consumer exact provenance
  explicit in real-path assertions.
archive:
  date: '2026-10-31'
  previous_status: pending
  reason: User-requested Audit replanning replaces this separate execution/selection/cycle boundary with
    the shared coordinator and ordinary task/Run path. Scope is merged, not implemented.
  superseded_by:
  - V64-002
