test_prerequisites:
  - >-
    Use a disposable PostgreSQL database via CONTRACTOR_TEST_DATABASE_URL with
    schema create/drop authority. Database unavailability after configuration is
    a failure, not a skip; named make gates enforce required prerequisites.
  - >-
    Existing process targets above must be extended to cover successive
    allocations with one Runtime and both real cache callers; no newly named
    test is assumed to exist. Require a nonzero test selection and include any
    added process test in the release graph.
  - >-
    Use temporary real filesystem roots, deterministic clocks, counters and
    synchronization. Do not require a live Gateway, read live configs, introduce
    timing assertions or claim sparse-file allocated blocks equal logical bytes.
  - >-
    Run the complete suites of every additionally touched Go/Python package;
    shared-fixture readers must include both Go and Python and prove that the
    private-only field does not alter public read/write contracts.
implementation_notes:
  - >-
    ImmutableArchiveCache owns only bounded hashed byte identities, integrity
    metadata and reservation/LRU state. Scoped aliases, binding timestamps and
    grants are never retained. ArchiveValue reconstructs the consuming exact
    binding from authenticated metadata; timestamp-bearing ArtifactValue and
    public/shared read/write DTOs remain unchanged. Different binding timestamps
    are the reason not to reuse an ArtifactValue across fork bindings.
  - >-
    Reuse version_id directly as the private opaque token, without a migration,
    new identity store, receipt, lease or public API change. The effective TLS
    CA/verification fingerprint and configured Artifact endpoint isolate trust
    domains. Both production callers opt in explicitly; the general Artifact
    client and allocation-local decoded-text cache retain their own behavior.
  - >-
    Same-key followers authorize independently and coalesce successful fills.
    A cancelled/failed leader publishes no error or payload to another grant;
    followers may use their own ordinary exact fetch, within their original
    deadline. This deliberately permits duplicate fallback downloads and adds
    neither an independent retry loop nor a background fill.
  - >-
    Logical accounting includes the owner marker and full 4-KiB metadata
    reservations. Failed cleanup retains its entire charge and disables new
    population. A single idempotent close finalizer joins maintenance and all
    readers even when its caller is cancelled, before the root owner can exit.
  - >-
    The existing workspace process gate checks source-cache hits independently
    on each specialist Runtime; the Skill process gate checks selected-package
    hits across allocations on one local-storage Runtime. Its source ZIP is
    consumed by Artifact tools, so it correctly remains outside cache eligibility.
    Both gates assert owned cache cleanup and fixed scalar shutdown counters.
  - >-
    The actual private metadata HTTP reader uses decode_private, including
    nested duplicate rejection, and the new DTO admits only camelCase wire
    aliases. Safe protocol errors suppress response input and the opaque token;
    actual-client regression tests verify duplicate, nested duplicate, missing,
    unknown and snake-case responses without a raw fetch or identity in errors.
