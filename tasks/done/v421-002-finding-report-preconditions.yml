  notes: >-
    Preconditions preserve the first receipt's exact strings and order across all five
    report sections. Valid near-8-MiB projections do not guarantee report capacity:
    actual entry bytes and the final envelope retain existing permanent size failures
    before page or artifact writes, without trimming conditions. Migration 000055
    atomically refuses incompatible retained projections and preserves ledger, receipt,
    projection and immutable artifact bytes; discarded {} tombstones remain valid.
    No old-format reader, data backfill, deletion, demo migration or accepted-report
    rewrite was performed. macOS direct Go tests used a symlink-free temporary root
    as documented in docs/testing/README.md. The parent integration owns landing and
    the combined release gate; its frozen functional source has already been merged.
