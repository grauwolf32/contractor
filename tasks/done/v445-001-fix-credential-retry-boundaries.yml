schema_version: "1.0"
id: V445-001
title: Preserve credential retries, store failure classes and development token bounds
milestone: label-driven-runtime-configuration
epic: runtime-config
kind: defect
introduced_by: V8-002
priority: P1
status: completed
implementation_commit: be6b3b126e0a5cb15c56a5af230e4460dce79892
depends_on: []
languages: [go, typescript]
goal: >-
  Credential operations recover from response loss and temporary store failures without false
  identity conflicts, while every LLM token follows the existing bounded validation rule.
context:
  authority:
    - date: '2026-11-04'
      decision: >-
        The user requested rechecking the four credentials review findings against updated main
        and fixing every still-current defect in one pass on a separate branch.
  review: Credentials review in this chat on 2026-11-02, findings 1 to 4.
  specification:
    - docs/spec/configuration/runtime-config.md#RCF-R39
    - docs/spec/configuration/runtime-config.md#RCF-R177
    - docs/spec/api/public-api.md#API-R69
    - docs/spec/platform/persistence.md#PER-R13
    - docs/spec/operations/operations.md#OPS-R35
  severity: medium
  finding: >-
    All four findings remain on main 7a9146845. internal/credentials/lifecycle.go:470 and
    runtime_service.go:375 turn replay record read failures into permanent conflicts;
    runtime_service.go:312 discards the cause of usage lookup errors. The Runtime credential
    form at ui/src/routes/operations/runtime-configs/credentials.tsx:159 generates another
    key after a lost create response. internal/credentials/provider.go:59 accepts a
    development token longer than MaximumTokenBytes.
  siblings: >-
    Cover LLM and Runtime create replay, all three Runtime delete usage sources (RuntimeConfig,
    Project and Audit), and LLM repository conflict-reconciliation reads in InsertCredential and
    InsertOperation. Existing provider, ordinary repository and operation-phase reads already keep
    safe causes. Managed UI creation already uses its non-secret draft keyring correctly. Runtime
    material keeps its existing kind-specific limits; only development LLM tokens miss their bound.
  provenance: >-
    Runtime replay and delete error loss originate in 39a06e14284b70054495c6ae99e55ea4866ffd9f
    (V8-002); LLM replay originates in 4a7797fc2a4fd8272ba3d5a34f537a532c2ca2b4 (V4-003A).
    V385-001 moved the Runtime form unchanged in de75ff41e45a5469ce01f225388266ae3977315a.
    V414-015 changed development field-value validation in cd416de48 without applying its byte bound.
  decision: >-
    The existing repositories own safe cause-preserving reads; services distinguish confirmed
    absence or inconsistent identity from a failed lookup. Reuse WrapError, with no new error
    kind or retry subsystem. One open Runtime create form retains one non-secret ID/kind/key
    tuple after failure and reuses it when that identity is submitted again. Changing identity
    starts another attempt; success clears the tuple and closing the form discards it. The Server's
    existing MAC rejects a changed secret under an already committed key. The simpler alternative,
    a fresh key on each submit, cannot reconcile response loss; storing the canonical secret in
    MutationDraftKeyring would violate the form's secret lifetime. Reopen only if recovery across
    form closure becomes a product requirement.
  verification_budget: >-
    A combined race run passed credentials and credentials/litellm but exhausted the public
    API package's default ten-minute budget while executing its repeated OpenAPI contract loads
    (the active test had run for 17 seconds). Scope race detection to the changed credential
    package; run the unchanged public API package in the ordinary make test-go mode with an
    explicit fifteen-minute total budget. This changes no implementation or test selection.
scope:
  in:
    - Preserve safe PostgreSQL and context causes on every scoped replay, usage and reconciliation read.
    - Reuse the Runtime form's original operation key after failure without retaining secret material.
    - Apply validTokenValue to development LLM tokens and clarify the existing shared bound in RCF-R39.
    - Real PostgreSQL failure regressions, UI response-loss and changed-body tests, and token boundary tests.
  out:
    - Lifecycle barrier changes, proposal 0044, file splitting and metadata query optimization.
    - New endpoints, error codes, receipts, database migrations or secret retention mechanisms.
failure_outcomes:
  - operation: Credential replay or delete reference read
    success: Existing replay and deletion behavior is preserved.
    permanent: Confirmed absent or mismatched replay records keep their existing conflict outcome.
    retryable: Serialization failures and deadlocks preserve SQLSTATE for storage_transaction_conflict.
    cancelled: Caller cancellation and deadline causes remain discoverable without rendering private text.
  - operation: Runtime credential creation through one open form
    ambiguous: Re-entering the same material for the same identity reuses the original key and replays safely.
    permanent: Changed material under a committed key is idempotency_conflict and replaces nothing.
cardinality:
  - collection: Retained Runtime form retry state
    bound: Exactly one non-secret ID, kind and operation key; secret fields are cleared on every submit.
acceptance_criteria:
  - id: A1
    text: LLM and Runtime create replay and repository reconciliation preserve PostgreSQL and context causes.
  - id: A2
    text: Runtime deletion preserves failures from RuntimeConfig, Project and Audit usage reads and writes no tombstone.
  - id: A3
    text: Response-loss UI retry reuses its original key; changed material conflicts and secrets are cleared after each submit.
  - id: A4
    text: Development tokens accept the 16384-byte boundary and reject 16385 bytes through the existing shared validator.
  - id: A5
    text: Regression tests fail on the unfixed code; full affected Go packages, UI verification and lint pass.
tests:
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -count=1 ./internal/credentials/...
    covers: [A1, A2, A4, A5]
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -timeout=15m -count=1 ./internal/httpapi/public/...
    covers: [A1, A2, A4, A5]
  - command: make ui-verify
    covers: [A3, A5]
  - command: make lint
    covers: [A1, A2, A3, A4, A5]
verification:
  date: '2026-11-05'
  baseline: 7a9146845
  red: >-
    Before the production changes, real PostgreSQL regressions lost 40001 and 40P01 in all
    four replay/reconciliation paths and in all three delete-usage sources. Replay and
    reconciliation also lost caller cancellation. The byte-bound test accepted 16385 bytes.
    The UI response-loss test answered runtime_config_conflict for the changed retry key
    instead of the same operation's idempotency_conflict; identity-change cases already passed.
  credentials: >-
    Passed go test -race -count=1 ./internal/credentials/... with a private disposable
    PostgreSQL 17.11 instance; both packages passed, including all new store regressions.
  ui: >-
    make ui-verify passed: 211 Vitest files, 2418 passing tests and one pre-existing expected
    failure, 17 Node service tests, generated contracts, lint, typecheck and production build.
  lint: >-
    make lint passed after make docs-dependencies refreshed only the source fingerprint.
    No architecture node, catalog entry or dependency edge changed.
  public_api: >-
    Passed go test -timeout=15m -count=1 ./internal/httpapi/public/... with the same private
    PostgreSQL instance: public passed in 111.521 seconds and public/events in 8.039 seconds.
    The earlier combined race run exhausted the public package's total ten-minute budget;
    it is recorded as a timeout, not a pass. The changed credentials packages passed race separately.
