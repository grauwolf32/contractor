schema_version: "1.0"
id: V373-007
title: "Build with go1.26.9, golang.org/x/net 0.60.0 and multidict 6.9.1 to clear published advisories"
milestone: hub-audit-defects-2026-10
epic: quality
kind: defect
priority: P1
status: completed
implementation_commit: "0a3e09c7b7dc3c6bb5c44461a7c75c5889b4d6c6"
depends_on: []
languages: [go, python, markdown]
goal: "make advisories passes: the Server builds with a Go toolchain and golang.org/x/net that have no reachable published vulnerability, and the production Runtime lock has no published advisory."
context:
  review: "Advisory job of the manual release-gate run 38287909767 on grauwolf32/contractor#547 (head daef588), reported on that PR"
  severity: high
  finding: >-
    make test-go-vulnerabilities (govulncheck v1.8.0 over ./cmd/...) reports
    12 reachable Go standard-library vulnerabilities in toolchain go1.26.8,
    all fixed in go1.26.9, among them GO-2026-6600 and GO-2026-6599
    (html/template, reached from app.ServeSystem) and several net/http ones.
    Five of the net/http ones (GO-2026-6617, GO-2026-6612, GO-2026-6611,
    GO-2026-6610, GO-2026-6603) are also reported for golang.org/x/net
    v0.57.0, fixed in v0.60.0; with go1.26.9 alone four of them stay
    reachable through x/net/http2. make test-runtime-dependencies-audit
    reports CVE-2026-104874 for multidict 6.7.1 in runtime/uv.lock. All pins
    come from main, not from a code change: the advisories were published
    after the pins.
  siblings: >-
    The toolchain is pinned in go.mod, tools/oapi-codegen.mod and
    tools/testonlyexports/go.mod; no container image pins a Go version.
    golang.org/x/net is required only by go.mod; govulncheck scans the
    commands of the main module, not the tool modules.
    internal/scanplan/plan_http.go imports golang.org/x/net/idna directly,
    so go.mod lists x/net as a direct requirement, not // indirect.
    docs/development.md and docs/testing/evals-release-gate.md name the
    toolchain to use. docs/guides/git-artifacts.md:125 records a measurement
    taken with go1.26.8 and stays as history.
scope:
  in:
    - "toolchain go1.26.9 in the three Go module files and the two documents that name the toolchain to use."
    - "go get golang.org/x/net@v0.60.0 and go mod tidy: x/net 0.57.0 -> 0.60.0 and the golang.org/x modules it requires (crypto 0.57.0, sys 0.48.0, term 0.46.0, text 0.42.0, mod 0.41.0, sync 0.23.0)."
    - "uv lock --upgrade-package multidict in runtime/ (6.7.1 -> 6.9.1, no other package changes)."
  out:
    - "Other dependency upgrades."
acceptance_criteria:
  - id: A1
    text: "make advisories passes on the change in CI (govulncheck needs vuln.go.dev, which the development sandbox cannot reach), and the Runtime audit passes locally."
  - id: A2
    text: "The deterministic release gate stays green with the new toolchain, Go modules and lock; the shared cross-language fixtures (scan host syntax through x/net/idna, NFC member paths through x/text/unicode/norm) still agree."
tests:
  - command: make advisories
    covers: [A1]
  - command: make lint
    covers: [A2]
  - command: make test-wire-cross-language
    covers: [A2]
  - command: go test ./internal/scanplan/... ./internal/sourcebundle/...
    covers: [A2]
