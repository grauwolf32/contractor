  database_tests_configured: true
  acceptance:
  - A1 satisfied. publishRuntimeConfig reads through readJSONBody, the reader decodeJSONBounded uses; a body ending before
    its declared length is 400 invalid_request and publishes no version, an empty body is 400, a declared or undeclared
    oversized body stays 413 request_too_large (the declared one unread), and the raw document still reaches the RuntimeConfig
    strict decoder (a duplicate member stays 400 runtime_config_invalid).
  - A2 satisfied. The tests derive their operations from the OpenAPI document. Every mutation that declares a required
    or optional Idempotency-Key or If-Match gets missing, invalid and duplicate keys and missing or malformed If-Match values
    and answers its documented error with zero body reads and zero Project reads; a body-less operation is sent no body
    and with valid headers gets past the checks, so deleteProject's case fails on the If-Match and not on a body. Every
    counter If-Match operation gets each shared revision case. Every JSON mutation gets a missing, repeated, parameterized
    and other Content-Type and answers its declared media-type status without a body or Project read. Malformed Project
    Artifact query, names, media type and precondition answer 400 without a Project read.
  - A3 satisfied. TestMutationPrecedenceTable and the Project Artifact table pin, per family, valid requests (201/200),
    endpoint media-type statuses (400 for JSON creation routes, 415 for model selection and scheduler settings), strict
    JSON rejection after the key, 413 only once headers are valid, missing and foreign Projects (404), a deleting Project
    (409 project_deleting) and the Audit-managed namespace (404) after the Project.
  - A4 satisfied, see the base run above; no criterion depends on grepping for a helper.
  decisions:
  - 'Precedence (API-R112): query, syntactic path parameters and media type (each endpoint keeps its own status), then
    Idempotency-Key and If-Match/If-None-Match, then the Project read where the route names a Project (Project Run creation,
    Project Artifact upload), then the Audit-managed namespace 404 for uploads, then the body: its bound (413) and then
    strict decoding. Visible changes: a keyless request with an oversized body is now 400, not 413; createProjectRun without
    a key names no Project (400, not 404); a malformed Project Artifact upload to an unknown, foreign or deleting Project
    is 400, not 404/409; a Managed Eval key or If-Match error is answered before the body is read; a private Artifact PUT
    with a malformed name is 400 even for an unknown allocation. None of these discloses a resource: the earlier answers
    depend only on request syntax.'
  - The Eval routes keep their documented 422 eval_invalid and 428 eval_precondition_required; evaldomain.MutationPrecondition
    is the header half of IdentifyMutation, so the grammar has one definition (contracts.ValidIdempotencyKey) and the
    handler and the receipt identity cannot disagree.
  - Spec. New requirement API-R112 in docs/spec/api/public-api.md; FAIL-API-1 in docs/spec/platform/failure-model.md
    now covers a JSON body that cannot be read completely; ART-R45 states the private PUT name check order. The review
    follow-up extends API-R70 (canonical counter spelling), API-R112 (media type of every JSON mutation, optional and
    absent bodies), BLB-R28 and FAIL-BLB-1 (interrupted Artifact payload) and GIT-R72 (the Git import body). No migration,
    no new limit, no new error code and no new requirement ID beyond API-R112.
  - Media type. Every JSON mutation checks it through requireJSONMediaType; the OpenAPI document declares 415 only for
    putModelSelection and putSchedulerSettings, Managed Eval routes answer 422 eval_invalid and every other JSON mutation
    400 invalid_request, as the error registry already said. Audit start and resume take an optional body and check
    the media type only when the request announces one (positive Content-Length or Transfer-Encoding); a body-less
    operation does not check Content-Type. A chunked Audit start without Content-Type is now 400 even if it carries no
    bytes.
  - Counter preconditions. httpx.RequiredIfMatch, ParseRevision and ParseRevisionETag are the one rule; the public
    handlers wrap their errors with 400 messages and evaldomain.MutationPrecondition maps them to eval_invalid. The OpenAPI
    patterns allow up to 20 digits, so 18446744073709551616 to 99999999999999999999 match the schema but are rejected;
    the shared fixture records them as outOfRange.
