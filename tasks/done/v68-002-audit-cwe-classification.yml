schema_version: '1.0'
id: V68-002
title: Retain CWE-classified Audit findings
milestone: github-issue-remediation-2026-10-next
priority: P1
status: completed
implementation_commit: c8b3dbcbc61cacfee08a548b746846a36a3813d5
depends_on: []
languages: [go, python]
goal: Prevent valid CWE-tagged finding proposals from invalidating Audit check results.
context:
  issue: https://github.com/grauwolf32/contractor/issues/130
  finding: >-
    Runtime emits CWE@4.20 as a standard reference but the Audit importer
    rejects every standard that the Audit baseline cannot pin.
scope:
  in:
    - Accept catalog-known CWE@4.20 as incidental classification in Audit import.
    - Keep unknown IDs and versions rejected.
    - Cover check and non-check collection paths and pin cross-language scheme/version parity.
    - Reconcile the relevant Audit and findings specifications.
  out:
    - Make CWE a pinnable Audit standard or a causal requirement.
acceptance_criteria:
  - id: A1
    text: A valid CWE-tagged proposal is retained and can be linked to an accepted check result.
  - id: A2
    text: Unknown CWE IDs and wrong versions fail deterministically.
  - id: A3
    text: Go and Python agree on the CWE scheme and version.
tests:
  - command: go test ./internal/auditimport
    covers: [A1, A2]
  - command: cd runtime && uv run pytest tests/test_security_findings_toolset.py
    covers: [A3]
verification:
  tests: Go auditimport/auditdomain suites, Python findings tests, Ruff checks and formatting passed.
  parity: Go test confirms the bundled Go and Python CWE catalogs are byte-identical.
