schema_version: '1.0'
id: V419-002
title: Upgrade Go ADK to v2.6.0 with atomic API and dependency adaptations
milestone: go-adk-26-upgrade-2026-10
epic: planner-worker
kind: chore
priority: P1
status: completed
depends_on:
- V419-001
languages:
- go
