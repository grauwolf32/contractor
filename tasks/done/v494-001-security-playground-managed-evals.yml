schema_version: '1.0'
id: V494-001
title: Connect Security Playground datasets and Invoice Lab to current Managed Evals
milestone: eval-maintenance-2026-10
epic: evals
kind: feature
priority: P2
status: completed
depends_on: []
languages:
- python
- yaml
- markdown
goal: Import Playground datasets into Contractor and prepare and start native comparisons
  through the current public API; run the existing Invoice Lab fixture gate from security-playground
  instead of contractor-playground.
demonstration: Import an exact visible case and its source artifact into an evaluation
  Project, create and prepare a native comparison using exact published bindings,
  and read its readiness through the public protocol. Run all existing private fixture
  checks against the relocated Invoice Lab.
context:
  authority: 'User request 2026-11-28: adapt security-playground to current Contractor
    Evals, move the pinned fixture gate to Playground and push the changes. User decision
    2026-11-28 selects dataset import and comparisons managed by Contractor over an
    external Playground driver.'
  specification:
  - docs/spec/evals/managed-evals.md
  - docs/spec/evals/format.md
  - api/openapi/contractor-public-v1.yaml
  boundary: Playground owns dataset adaptation, source packaging and private truth.
    Contractor owns native planning, execution, assessments and comparison. Only visible
    case projections and exact input Artifact refs cross the API. The fixture gate
    pins the Invoice Lab subtree and file digests; unrelated Playground commits do
    not change that target identity. A changed subtree or dirty fixture fails. No
    legacy checkout fallback is retained.
  alternatives: An external managed producer would require a separate execution journal
    and assessment bridge. The user selected the simpler existing native coordinator.
    Reopen only for a concrete external-oracle requirement.
  playground_implementation_commit: 7f4ead9a2d60e5b6dc09ce19026b6f06ece4c5d5
  evidence: tasks/evidence/v494-001-playground-integration.json
scope:
  in:
  - Native Managed Eval import, authoring and explicit commands in security-playground.
  - Current exact executable selectors and public API contract verification.
  - Relocated Invoice Lab pin, default path, strict verification and regressions.
  - Documentation and push of both repositories after verification.
  out:
  - Live model campaigns, demo deployment, model changes and paused V417 work.
  - New Server execution mechanisms, external driver or scorer execution service.
requirements:
- id: R1
  text: Managed requests use the current public API with caller-supplied stable idempotency
    keys and revision CAS; hidden ground truth never becomes case inputs.
- id: R2
  text: Dataset import preserves exact source bytes and immutable Artifact revisions;
    unsupported native scoring requirements are explicit rather than silently reported
    as semantic passes.
failure_outcomes:
- operation: Managed public API calls
  permanent: Validation, authorization and revision conflicts are surfaced without
    retries.
  retryable: Transient errors are surfaced for explicit replay using the same caller
    key.
  ambiguous: Reuse the exact request body and key; never generate a new invocation
    during retry.
  cancelled: Synchronous calls return or fail before local cleanup; execution control
    remains server-owned.
  timeout: Each HTTP call has the client's finite timeout; no implicit live polling
    or cancellation.
cardinality:
- collection: Imported visible cases and native comparison members
  expected: Small selected project suites
  maximum: 1000 cases and 1000 expanded native members, within the public document
    bound
  bound: Reject oversized imports and consume every bounded catalog/list page.
lifecycle:
- entity: Existing datasets and native experiments
  delete: Existing owner-scoped Contractor lifecycle
  cascade: Existing Project/Eval deletion rules
  retention: Existing immutable dataset, frozen plan and record retention
acceptance_criteria:
- id: A1
  given: Selected Playground cases and current Contractor API
  when: Importing a dataset and authoring and preparing a native comparison
  then: Exact visible inputs and bindings are used, private data stays local and replay/CAS
    failures remain explicit.
- id: A2
  given: Invoice Lab under security-playground/targets/invoice-lab
  when: Running the fixture gate
  then: All fourteen standalone tests and sixteen mandatory checks pass; target drift
    fails and unrelated repository commits remain valid.
- id: A3
  given: Existing primary checkout changes
  when: Landing the integration
  then: User files are preserved, tasks and documentation agree and changes are pushed
    to origin.
tests:
- command: make test-pentest-fixtures
  covers:
  - A2
- command: make lint
  covers:
  - A2
  - A3
- command: cd ../security-playground && uv run --project evals --locked --offline
    pytest
  covers:
  - A1
- command: cd ../security-playground && uv run --project evals --locked --offline
    playground-eval validate
  covers:
  - A1
- command: cd ../security-playground && uv run --project evals --locked --offline
    ruff check evals/src evals/tests evals/scripts
  covers:
  - A1
implementation_commit: a79bb2dd3bb47fc7104d642dab65a24fbddd4c7a
verification:
  status: passed
  observed: 320 Playground tests; current DTO snapshot, catalog and Ruff; 14 standalone
    Invoice Lab tests and all 16 real Podman/Runtime fixture checks; four pin regressions;
    make lint; 1053 public API test nodes on real disposable PostgreSQL; a real Python
    client/native HTTP preparation/start probe. No skips in these selected suites.
    Owned database and temporary PostgreSQL cluster removed; fixture-owned containers,
    volumes and images removed. No live model campaign or deployment.
