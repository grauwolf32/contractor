  result: >-
    Full Runtime tests passed (6383 passed, 135 declared skips), including the actual Worker/Gateway
    multibyte paging transcript. Configuration, recipe, fixture and UI contract helper checks passed.
    Both listed real-process roots passed in 77.765 seconds after fixing the current Eval recipe
    selector. Final make lint passed with all four import contracts kept. Frozen v1 recipe bytes
    remain unchanged. Full combined acceptance remains required by V474-010; earlier failed full
