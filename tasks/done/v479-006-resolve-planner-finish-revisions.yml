schema_version: '1.0'
id: V479-006
title: Assemble exact Planner finish references without model revisions
milestone: runtime-owned-tool-versions-2026-11
epic: planner-worker
kind: feature
priority: P1
status: completed
depends_on:
- V479-004
languages:
- go
