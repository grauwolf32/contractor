    tests/e2e/shared_memory_gateway_test.go:167,257 expect the literal worker-model in both ordinary Worker and result-finalizer requests. TestProductionMemoryTemplatesAcrossProcesses now stages the exact generated Worker policy selected by artifact_builder@2, so the real configured digest-qualified route is rejected with HTTP 400 before the first append. Full release-verify reaches this failure in process shard C.
  verification_refinement: >-
    On 2026-10-22 the user explicitly declined repeating the full release gate after this local fixture failure. Verify the staging regression, both real Memory process modes and lint; retain the original failed full-gate result without claiming a complete green rerun.
  siblings: >-
    Fix both ordinary Worker scenario dispatch and result finalization in the shared Memory Gateway. Non-production Memory still uses its exact fixture model policy. The UI Gateway was corrected in V392-011. Worker summarizer and session gateways stage fixed test-only policies and retain their explicit role-model assertions; the routing gate deliberately asserts configured model selection. Domain gateways already route through scenario context and tool contracts.
  specification:
  - docs/spec/configuration/catalog.md#CAT-R80
  - docs/spec/tools/memory.md
scope:
  in:
  - Resolve the expected Worker model from the staged catalog and use the same exact model check for ordinary calls and result finalization.
  - Extend the existing staging regression to verify qualified selected models and rejection of incorrect model identities.
  - Run both real Memory process modes, their staging regression and lint.
  out:
  - Any shipped model policy, production code, live Gateway call, prefix/suffix fallback or relaxation of tool schemas and transcript checks.
  - Repeating the full release gate, per the user instruction after the isolated fixture failure.
acceptance_criteria:
- id: A1
  text: Production Memory completes its retained-note, retry, Router and domain-output journeys with the exact configured generated Worker model.
- id: A2
