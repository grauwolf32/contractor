verification_policy: Create test_http_body_arguments.py using real selected tool/ADK dispatch and bounded local
  socket receivers, including all three transport routes and byte-level assertions. Run complete listed owner
  suites. If any immutable shipped content changes, also run config validation/lock checks and its consuming
  gates under the repository catalog policy; otherwise record why no catalog file changes. The combined real
  Server/Runtime/PostgreSQL acceptance is V476-005; no fixture sends traffic to the live demo or changes the
  configured model.
