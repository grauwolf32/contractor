  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
scope:
  in:
  - Reuse ControlledHTTPSession/HTTPTransport capture ownership and existing recent buffer, selected exchange
    publisher and credential handling.
  - Bind normalized selected evidence to the revised finding/result intake and ordinary Artifact publication;
    Server derives task/Audit/Run association.
  - Update existing UI preview decoding and Run material filters for the standalone exchange namespace
    and original provenance; preserve bounded previews and the existing themes/layout.
  - Replace the finding-coupled exchange envelope with the accepted standalone schema/origin/capture
    format across publication, strict readers, analysis/report/export consumers and shared fixtures.
    Reuse existing Artifact refs, retention forks and Finding receipt/source associations.
  - For explicitly selected exchanges, retain attempted request time, redirects/failures/truncation
    and available pinned deployment attribution within existing capture bounds, without fabricating
    omitted bytes or capture facts. Selection never includes unrelated requests from the Run.
  out:
  - A new collector/service, special trusted-proof channel, resending target requests to recover evidence
    or generic transport redesign.
  - Automatic evidence publication of every HTTP request, a durable traffic journal, disk-backed capture
    spool or recovery of unselected traffic. Do not enable bridge flow archival or change the separate
    sitemap metadata collection contract.
  - Changing user model configuration or deploying/migrating the demo.
requirements:
- id: R1
  text: Model-selected request IDs select only actual invocation-owned captures; no arguments or summaries
    author observation facts.
- id: R2
  text: Foreign/evicted/unavailable captures fail before result mutation and remain visible gaps. Preserve
    injected credential redaction and original transport cancellation. Exact captures can support an ordinary
    check result with no finding; retaining negative/inconclusive evidence does not require a problem
    publication or another HTTP request.
- id: R3
  text: HTTP execution alone creates no retained exchange Artifact. Keep unselected exchanges only in
    the existing bounded allocation capture buffer; eviction, allocation cleanup and Runtime restart
    may discard them. Explicit selection publishes only the selected request and its own captured
    attempts/redirects, with ordinary Artifact retention. Do not flush unselected captures to storage
    at invocation completion, pause, cancellation or allocation release.
- id: R4
  text: The retained exchange is a closed contractor.http.exchange.v1 document with schema, origin
    and capture. Origin has required run_id and invocation_id supplied and verified by trusted
    publication code, never by model arguments. Capture preserves source, request_id, applicable
    request_tag and the existing attempts/messages/outcomes. Runtime HTTP capture.observed_at is
    the transport-recorded start of the first attempt, never the publication time; an available
    pinned capture.deployment_marker is optional and omitted when unavailable. Do not synthesize
    timestamps for sources lacking a trusted observation or widen their existing selection eligibility.
    Finding, proposal_id and receipt_id are absent from the exchange envelope.
- id: R5
  text: Check results and Finding contributions select exact exchange Artifacts through their existing
    evidence associations. Finding intake receipts keep proposal/receipt identities outside the
    exchange content. Reuse of selected evidence, receipt replay and ordinary Audit/Project retention
    forks preserve the original origin and content digest; they do not re-encode an exchange with
    a later consumer's identities. Source Run cleanup does not rewrite its recorded provenance.
failure_outcomes:
- operation: Select a real invocation-owned HTTP exchange as retained evidence
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup. Before publication commits, selected evidence may
    be absent; committed or ambiguous publication uses its original receipt/identity for reconciliation.
    Losing a volatile capture never triggers another target request. A retained Artifact alone does
    not imply that a check result was submitted or accepted.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Volatile recent HTTP/Caido captures in one allocation
  expected: Several executed requests, with one explicitly selected for retained evidence.
  maximum: Existing shared limits of 128 recent exchanges (LIM-HTP-18) and 64 MiB of serialized capture
    JSON (LIM-HTP-33); both bounds apply independently.
  bound: Preserve oldest-first eviction and existing per-exchange attempt/header/body limits. Buffer
    pressure discards unselected captures instead of spilling them to disk or publishing them.
- collection: Explicitly selected HTTP evidence
  expected: One selected request_id produces one exchange Artifact; other executed requests produce none.
  maximum: Preserve existing Artifact, check-result evidence, Finding evidence and Audit retention
    limits; this task does not raise them or reserve durable space for the whole capture buffer.
  bound: Publish the selected exchange only, using its existing idempotent publication identity.
    Results reference exact Artifacts rather than embedding the buffer or scanning all Run traffic.
lifecycle:
- entity: Unselected volatile captures
  delete: Oldest-first eviction and allocation cleanup erase buffer entries; a Runtime restart loses them.
  cascade: No durable exchange Artifact or retention hold is created for an unselected capture.
  retention: No durability or recovery guarantee; unavailable evidence remains an explicit gap and is
    never reconstructed by replaying target traffic.
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: a real HTTP request and redirect
  when: actual Runtime selection and PostgreSQL result collection run, with Finding intake only when
    a problem is explicitly published
  then: retained attempts/time/response/evidence match the transport for ordinary results both with and
    without an optional problem finding
- id: A2
  given: foreign/evicted/truncated/failed captures
  when: selection is attempted
  then: no fabricated complete evidence is accepted
- id: A3
  given: committed selected-evidence publication with a lost reply or subsequent cancellation, followed
    by source deletion permitted by the retaining owner
  when: ordinary reconciliation executes
  then: the same retained evidence Artifact remains available without a duplicate or another HTTP
    request; result acceptance is reported only if result intake actually committed
- id: A4
  given: several real HTTP requests in one invocation, including one selected request with redirects
  when: only that request_id is selected and published, then the invocation/allocation is cleaned up
  then: real PostgreSQL/ArtifactStore contains only the selected exchange as HTTP evidence, including
    its own captured attempts; unselected exchanges have no evidence Artifacts or retention holds
- id: A5
  given: no committed evidence publication and cancellation, capture eviction or Runtime restart
  when: cleanup or subsequent evidence selection runs
  then: evidence may be absent and unavailable selection reports the gap; no automatic buffer flush,
    reconstruction or repeat target request occurs
- id: A6
  given: a selected exchange retained by an ordinary check result without a Finding proposal
  when: a later Finding explicitly selects that exact evidence and ordinary retention forks preserve
    it through permitted source Run/Audit deletion
  then: the exchange remains readable with its original Run/invocation, observation metadata and
    content digest; its envelope contains no finding association, and reuse neither rewrites the
    observation nor sends another HTTP request
- id: A7
  given: the accepted standalone exchange format and payloads with an old finding member, missing
    required origin or model-supplied provenance arguments
  when: strict producers/readers and trusted publication validate them
  then: Go/Python/shared-schema fixtures agree on the closed format and invalid submissions fail
    before authoritative result mutation; no reader accepts the replaced finding-coupled envelope
