schema_version: '1.0'
id: V64-028
title: Read completed Audit results without requiring a summary report
milestone: audit-check-prioritization
epic: audits
kind: defect
introduced_by: V64-002
priority: P2
status: completed
depends_on: [V64-002]
languages: [go, typescript, yaml, markdown]
goal: Completed Audits with ordinary Task results remain readable in Inbox and Reports without an aggregate report.
context:
  authority: >-
    User review 2026-11-03 reports this P2 on separate PostgreSQL and requests removal of the
    old mandatory-report assumption. User clarification 2026-11-03 says a new regression test
    is unnecessary; verify through existing suites and a disposable PostgreSQL probe instead.
  finding: >-
    internal/auditservice/service.go:336 returns an unclassified error for a completed Audit
    without report links. Inbox and Reports read this endpoint and receive HTTP 500 although
    the common coordinator intentionally completes with ordinary retained Task results.
  siblings: >-
    Public getAuditReport, cross-project report reads, Inbox ready-report reads and Reports detail
    share this contract. Lists already exclude unavailable reports by default; direct report
    navigation must explain the absence and link to retained Task results. Existing stored report
    integrity checks and genuine storage errors must remain classified failures.
  verification: >-
    On 0fe143e8e7646335b797cb319444a174faf276d9 the full Audit service and public HTTP
    package suites pass against disposable PostgreSQL, as do verify-public-api and
    verify-public-api-postgres. Full ui-verify passes 2459 tests with one expected failure,
    plus lint, typecheck, static-server tests and build. make lint passes.
    A one-off PostgreSQL reader probe confirms unavailable with no invented content for
    completed Audits, while partial report pairs, corrupt descriptors and a failed storage
    read remain errors. The probe uses a disposable schema and temporary Go overlay outside
    the repository; no regression test is added. Inbox/cross-project lists retain their normal
    unavailable filtering, and direct Reports navigation links to the saved Task results.
    This local branch remains unmerged; no deployment or V64-014 completion is claimed.
scope:
  in:
  - Return the existing unavailable projection for a completed Audit with no aggregate report.
  - Adapt remaining report readers and navigation text to ordinary Task results.
  - Update owning specification and public API description without adding a report lifecycle.
  out:
  - New regression tests, report generation/finalization, approvals or broad V411-010 cleanup.
acceptance_criteria:
- id: A1
  text: A completed Audit without report links returns HTTP 200 with status unavailable and no invented report.
- id: A2
  text: Inbox and Reports handle that absence normally, and direct navigation links to ordinary Task results.
- id: A3
  text: Partial or corrupt retained report links and storage failures remain errors rather than being hidden as absent reports.
tests:
- command: go test -tags=integration -count=1 ./internal/auditservice ./internal/httpapi/public
  covers: [A1, A3]
- command: make verify-public-api verify-public-api-postgres
  covers: [A1, A3]
- command: VITEST_MAX_WORKERS=1 make ui-verify
  covers: [A2]
- command: make lint
  covers: [A1, A2, A3]
implementation_commit: 041a9d97f94966ef8dc4f19d0f7f17adffe8b1b3
