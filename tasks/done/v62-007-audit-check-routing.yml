  evidence: >-
    The actual Runtime finding tool publishes verify, replay and an unknown
    method. After the first Round closes, the process fixture pauses, deletes
    the released producer through the public API, restarts Server and resumes.
    Verify and replay select differently named ordinary roles; both read the
    exact retained proposal and accepted producer result through local inputs.
    Downloads match retained bytes, size, digest and media type. The unknown
    method receives one explicit rejection; another restart creates no duplicate
    Round, item, source association, decision or Run.
    Real-store coverage includes 130 selected checks across bounded admission
    and private staging slices, lost acceptance replies, explicit projection
    rebuild waiting, original deadlines, pause/cancel and non-time budget
    deferral, single-connection access, hidden unaccepted membership, immutable
    sealed authority and fully populated prepared/accepted Audit purge. Shared
    tests exercise all registered methods and all five explicit profile modes.
    Domain continuation tests reach 4096 selections; accepted item counting
    reads parent counters at 100000 items. Existing comparison scale fixtures
    retain 100000 receipts and 1000000 findings with generated-column-safe copies.
