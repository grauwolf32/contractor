  replan_history: Deferred on 2026-09-20 outside the delivered OpenAPI/preparation slice; the original
    deferral record is preserved. The 2026-10-24 review at b523ae77 confirmed that this iterative capability
    was still absent. The initial proposal 0045 plan retained deferral; the user subsequently queued this reviewed task as pending. Completed
    V62 preparation/API/UI/release tasks and their original milestone remain unchanged.
  follow_up_ordinary_task_mode: >-
    The pre-existing AUD-R118 legacy allowance remains outside this typed-path change.
    Its owning sources are docs/spec/audits/audits.md#AUD-R118,
    internal/auditdomain/types.go ItemTask.ProfileMode, codec.go validateItemTask,
    inventory.go validateInventoryOptions and Runtime toolsets/audit_results/packages.py
    profile_mode validation (V77-001, commit 4d432c1324d8b790dcc74a66753b5758a06c6ac2).
    Propose a separate tracked removal:
    require an explicit current profile mode for every ordinary task and inventory factory,
    remove the Go empty/omitempty and Runtime None allowance, update old fixtures and
    delete AUD-R118 compatibility wording. No old-record fallback or data migration is needed.
    V62-007 requires explicit mode now for every accepted_plan task without broadening
    unrelated ordinary-task behavior.
  ownership: Generic iterative Audit composition owns these contracts. V64-001 defines research contracts,
    V64-003 owns opt-in research lifecycle, V64-004 consumes exact context, V64-006 owns the base research-to-ordinary-AuditItem
    adapter, and V64-018 adds only its pentest specialization. These are consumers, not dependencies of
    generic V62.
  boundary: The plan routing boundary is source-neutral, but every admitted source requires a production
    trusted adapter. This task wires the existing finding receipt/ordinal adapter. V64-006 adds the base
    research-to-ordinary-AuditItem adapter with exact origin and membership tests; V64-018 specializes
    it for pentest without making generic routing depend on V64.
scope:
  in:
  - Define strict registered plan schema/method/phase to Workflow binding/capability mappings and persist
    the selected exact route with accepted items.
  - Adapt existing finding receipt/ordinal next-Round admission to the common trusted plan descriptor
    and V62-006 dependencies; preserve its consume-once identity.
  - Perform deterministic ownership, dependency, capability, approval and budget checks before atomically
    accepting a new immutable Round.
  - Publish bounded admitted/rejected/deferred dispositions with exact source, route and decision provenance;
    use the V62-005 settled input barrier when required by a declared consumer.
  - Exercise actual next-Round production calls and current standard/default routing, including ordinary
    typed alternatives without adding special execution role kinds.
  out:
  - Hypothesis registry/search selection and the base research-to-ordinary-AuditItem source adapter V64-006;
    pentest recipe/proof/replay policy V411-012 and research pentest specialization V64-018; arbitrary
    Workflow refs from models.
  - New Scheduler phases, verification/replay role kinds, changing accepted worklists, model scoring authority
    or a second receipt/lease store.
deliverables:
- path: internal/config
  description: Strict registered method map and exact closure validation with shared fixtures.
- path: internal/auditservice
  description: Actual finding source adapter and source-neutral next-Round admission boundary.
- path: internal/auditstore
  description: Durable bounded admission provenance, consume-once identities and purge integration.
- path: internal/auditdomain
  description: Accepted plan/source/route descriptors and deterministic validation.
- path: tests/e2e
  description: Real routed later-round fixture consumers and direct-route regressions.
acceptance_criteria:
- id: A1
  given: Trusted finding receipts with several proposed-check ordinals and registered typed method maps
  when: The actual next-Round builder admits and dispatches ordinary check Roles
  then: Each item has the exact source/ordinal, selected binding and V62-006 input mapping; verify/replay
    are distinct ordinary routes without research or proof authority.
- id: A2
  given: Renamed roles, an ambiguous/unknown method, invalid capability and forged source identity
  when: Strict configuration/admission validation runs
  then: Names do not change method classification; invalid/foreign inputs produce explicit decisions and
    no arbitrary fallback item/Run.
- id: A3
  given: Duplicate receipt delivery, competing claims, restart and a lost accepted-Round reply
  when: Admission/dispatch recovery repeats
  then: One accepted immutable Round/item association and one budget debit exist per exact source plan;
    current accepted membership cannot be extended.
- id: A4
  given: An expired approval, pause, Audit deadline, cancel and non-time budget exhaustion
  when: Controller admission and owned work progress
  then: Existing approval, paused-deadline and safe drain/finalization semantics are preserved, with no
    target retry caused by bookkeeping recovery.
- id: A5
  given: Maximum indexed candidate populations and bounded selected dependency closures
  when: Admission advances across pages with injected work counters
  then: Per-slice rows/bytes, existing item/batch limits and exact mapping checks hold without a whole-history
    scan or repeated rejection append.
- id: A6
  given: Current default-route/standard profiles and standalone deterministic Runs without typed mappings
  when: Existing membership, coverage, retry and cancellation scenarios execute
  then: They remain unchanged and invoke no generator/ranker or research record creation; obsolete schemas
    still fail strictly.
