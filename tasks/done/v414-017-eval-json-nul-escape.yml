notes:
  - >-
    For V414-027 open question (2), found while verifying: non-Eval public JSON bodies mostly go
    through decodeJSONBounded/readJSONBody in internal/httpapi/public/request.go (29 call sites), one
    place where strictjson.HasNULEscape could answer 400 before any store call;
    auditdomain.parseStrictJSONNumbers (canonical.go:65) rejects a raw NUL byte but not the escape; a
    Go string holding U+0000 also fails a text parameter with SQLSTATE 22021, answered as the same
    retryable 500; Worker and Runtime writes through the private API need their own check.
