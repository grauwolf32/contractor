schema_version: "1.0"
id: V414-033
title: "Allow incompatible /v1 changes until the first release"
milestone: review-v407-v409-followups-2026-10
epic: api-contracts
kind: chore
priority: P3
status: completed
implementation_commit: 6efdc64f51cd4aea2882d6f782fc70fdda37d104
depends_on: []
languages: [markdown]
goal: >-
  The specification and the agent guide say the same thing about /v1
  compatibility: until the first release an incompatible change is allowed
  when the Server, the OpenAPI document, both generated clients and the UI
  change in the same commit; the first release restores API-R3 without the
  exception.
context:
  specification:
    - docs/spec/api/public-api.md#API-R3
    - docs/spec/ui/ui.md#UI-R7
    - docs/spec/configuration/catalog.md#CAT-R74
  decision: >-
    The user decided on 2026-10-24, first for V414-026 and then for all
    tasks: "пока код не в продакшене, можно менять что угодно". The project
    has no external users, deployments or legacy data (AGENTS.md section 1).
    API-R3 ("Incompatible changes require a new public API version") and
    AGENTS.md 3.1 step 4 ("Within /v1, changes must be additive") still
    forbid it, and V414-026 (EVM-R247) already removed three query
    parameters under a one-off exception. Model the exception on CAT-R74,
    the pre-release exception for the shipped catalog.
scope:
  in:
    - "Amend API-R3 with a pre-release exception: until the first release an incompatible /v1 change is allowed when the Server, api/openapi/contractor-public-v1.yaml, the regenerated UI and Go clients and the UI land in one commit and make verify-public-api passes; the task that makes it records the change. The first release removes the exception."
    - "Point UI-R7 at the amended API-R3; EVM-R247 states the list contract only and cites no exception, so it needs no change."
    - "Rewrite AGENTS.md 3.1 step 4 to match."
  out:
    - "An automated additive-change gate; none exists and the exception makes it unnecessary before the first release."
    - "The private Server-Runtime wire contract, which has no external clients either and follows its own rules."
acceptance_criteria:
  - id: A1
    text: "API-R3, UI-R7 and AGENTS.md 3.1 state the same rule and its end condition."
  - id: A2
    text: "make lint (including scripts/check_spec.py) accepts the change."
tests:
  - command: make lint
    covers: [A1, A2]
decisions:
  - >-
    API-R3 keeps its rule and gains a pre-release exception modelled on
    CAT-R74, with a rationale and the reopen condition (the first release, or
    the first client outside this repository). UI-R7 adds that an
    incompatible change ships only with the UI change in one commit.
    AGENTS.md 3.1 step 4 now tells agents to remove an unused variant end to
    end rather than keep it to stay additive.
  - >-
    Ruled out: open tasks and proposals that describe their own planned
    change as additive (V372-025, V411-001, V411-007, V411-017, V414-009,
    proposals 0033, 0035, 0040, 0041) state a property of the change, not a
    demand to keep legacy behaviour, so they stay as written. Proposal 0039
    question 4 cited the old AGENTS.md rule and now cites API-R3.
verification:
  date: '2026-10-24'
  environment: branch claude/v414-fix from main 63861457.
  commands:
    - "python scripts/check_spec.py: 47 specification documents are consistent."
    - "make lint: exit 0."
