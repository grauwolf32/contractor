schema_version: '1.0'
id: V479-001
title: Manage artifact and document write preconditions inside Runtime
milestone: runtime-owned-tool-versions-2026-11
epic: projects-artifacts
kind: feature
priority: P1
status: completed
depends_on:
- V474-003
- V476-005
languages:
- python
- markdown
goal: A Worker creates and edits artifacts and documents without copying expected_revision, while concurrent
  changes still cannot be silently overwritten.
demonstration: Through the real Worker and Artifact API, create a file-backed artifact, update it after a
  successful read/write, then change it externally before another update. The first two operations succeed
  without expected_revision; the stale change is rejected and the newer bytes remain intact. A1 is the first
  end-to-end delivery.
context:
  authority: 'User request 2026-11-22: create tasks in two ordered stages: remove expected_revision from LLM
    interfaces first, then revision; Runtime manages preconditions and version selection, including compaction
    and V476 repeat rules. User decision 2026-11-22: a new sequential Audit submission automatically replaces
    the result for the same item_key; do not add replace_existing or an equivalent confirmation flag. Identical
    content remains a replay. User clarification 2026-11-22: retain revision in tool results so the model
    can recognize another material version, but remove model-supplied revision arguments. The user did not
    approve a new artifact-handle interface. Agent scope choice: preserve existing namespace/name addressing;
    removing revision does not require new material identifiers. User assignment 2026-11-22: merge the task plan and implement V479 in one continuous pass. Only affected-component verification is authorized, not complete Runtime/Go/lint/release
    suites. The detailed bounded runtime mechanisms below are agent implementation proposals within that direction.
    User decision 2026-11-22: ordinary read_artifact reads the current version; subsequent pages use a Runtime-issued
    cursor fixing version and position, rather than a snapshot-until-refresh interface.'
  baseline: 6a4d479d361f8fcb1ce5c74c7f512c5dfe4666af on local main; recheck actual active callers before implementation.
  specification:
  - docs/spec/artifacts/artifact-store.md#ART-R58
  - docs/spec/artifacts/artifact-store.md#ART-R60
  - docs/spec/tools/memory.md#MEM-R67
  - docs/spec/execution/worker.md#WRK-R192
  - docs/spec/tools/toolsets.md#TLS-R39
  sources:
  - runtime/src/contractor_runtime/toolsets/run_artifacts/tools.py
  - runtime/src/contractor_runtime/toolsets/text_artifacts/tools.py
  - runtime/src/contractor_runtime/toolsets/common/document_session.py
  - runtime/src/contractor_runtime/toolsets/common/document_write.py
  - runtime/src/contractor_runtime/toolsets/common/artifact_write.py
  - runtime/src/contractor_runtime/toolsets/openapi/tools.py
  - runtime/src/contractor_runtime/toolsets/likec4/tools.py
  - runtime/src/contractor_runtime/toolsets/common/resources.py
  boundary_decision: Tools own the semantic selection and validation. Shared Runtime helpers live in toolsets.common
    and are explicitly called by production consumers; no universal argument-rewriting plugin, hidden acceptance
    of deleted arguments, new receipt store, database entity or framework for hypothetical tools. Server remains
    the authoritative owner of grants, exact Artifact reads, CAS, receipts, retention and lifecycle. Existing
    private/public/wire/persisted revision fields remain strict; only model-facing inputs change. Update numbered
    owning specs, descriptions, active instructions and actual ADK schemas with implementation; this task
    plan does not change shipped specs.
  delivery_group: 1 / expected_revision. Implement the narrow create-update-conflict process test in this
    task, not only at the final milestone gate.
  alternative_and_reversal: The simplest alternative fetches latest before each write, but loses the reviewed/prepared-base
    guarantee. Reuse current document sessions and exact-byte recovery instead. Revisit selection state only
    if an actual consumer cannot identify its preparation base without a new model-side protocol.
scope:
  in:
  - 'Remove expected_revision from write_artifact, write_text_artifact, load_openapi, initialize_openapi,
    load_likec4 and write_likec4: six current exported callables.'
  - Reuse DocumentSession and existing Artifact CAS reconciliation, adding only shared private write-base
    state needed by real generic publication consumers.
  - Update model descriptions, relevant instructions, fixtures and schemas together; retain revision in successful
    results and technical diagnostics.
  out:
  - New general artifact-handle addressing, renamed model-supplied version/ETag preconditions, force/replace
    flags, compatibility aliases and automatic semantic rebasing. The approved read_artifact pagination cursor
    is in scope in V479-004.
  - Removal of Server/API/wire/store revision checks, changed grants/retention or model/tool budget semantics.
  - Unrelated UI redesign, live model evaluation, demo deployment and full repository test gates.
requirements:
- id: R1
  text: A new destination uses create-only CAS. A destination previously read/loaded or successfully written
    by this invocation/session uses that exact remembered base. Do not fetch latest immediately before replacing
    prepared bytes. Metadata listings and references merely mentioned in content do not count as a reviewed
    write base. Unknown existing targets reject safely and instruct a fresh read/load; do not require a redundant
    read for a target just successfully written by this owner.
- id: R2
  text: Capture an operation base from trusted invocation/tool state before asynchronous preparation, and
    advance it only after accepted or exactly reconciled success. Calls from one parallel model response must
    not obtain authority from whichever sibling happens to finish first; conflicting same-target changes cannot
    silently become last-writer-wins. Keep document operations lock-guarded and share state only through explicit
    common resources.
- id: R3
  text: Keep all removed fields absent from real ADK declarations. Raw expected_revision, including null,
    is an unknown-argument error; there is no wrapper that silently strips it. Read-side revision remains
    supported until stage two. Return actual committed revision as before; a new revision is not a promise
    that bytes changed.
- id: R4
  text: 'Preserve file-based publication: Runtime reads source_path bytes from the authorized workspace; the
    model never reproduces file contents or base64. A selected source file is captured once for the frozen
    write attempt. Retain existing text-authoring scope of write_text_artifact and document tools.'
- id: R5
  text: A stale write leaves the prior trusted base intact or marks it invalid and returns a semantic reload
    hint. No automatic reload-and-overwrite, content merge, repeated append or new receipt system. Distinguish
    definite conflict from unresolved acknowledgement loss, retaining existing write_artifact_exact recovery.
- id: R6
  text: Compaction preserves private write bases and exact in-flight/recovery identity independently of its
    summary. New logical invocations cannot inherit an unverified old base from model history; reuse only
    explicit current owner state allowed by session lifecycle. Reconcile every already stateful OpenAPI/LikeC4
    mutation so removing entry-point arguments does not create a weaker sibling path.
failure_outcomes:
- operation: Resolve a selected version and perform the existing owner operation
  permanent: Unknown/ambiguous/unavailable selection, malformed or removed argument, stale precondition, denied
    authority and owner limit failures return a bounded classified tool error before a new effect. Preserve
    existing owner codes; new codes must be documented at their owner. No implicit latest substitution on
    conflict.
  retryable: Existing classified infrastructure failures retain bounded attempts and the original call/invocation
    deadline. No retry loop for deterministic conflicts.
  ambiguous: Reuse existing exact-byte CAS recovery or owner receipt with the same frozen payload, precondition
    and identity. Never regenerate intent from latest state or repeat a semantic append after a lost response.
  cancelled: Existing invocation/session owners join admitted I/O and preparation before cleanup. Late completions
    cannot update another invocation or a newer operation generation.
  timeout: Keep existing operation and invocation deadlines; do not introduce an unrelated timeout, poller
    or budget reset.
cardinality:
- collection: Runtime-held selected versions and pending operations
  expected: A few input roles, current document targets and explicitly used materials; admit only actual consumers.
  maximum: Keep existing owner row/byte/page/in-flight limits. Any added shared selection map has an explicit
    proposed ceiling of 4096 entries and 4 MiB encoded metadata per logical invocation, defined once in the
    owning limits registry.
  bound: Point lookup and bounded admission; no entire Run/Project enumeration, raw payload copies or history
    scans on each tool call. Refuse new admissions at the bound without silently evicting an in-use selection
    or relabeling it as current.
lifecycle:
- entity: Private version/precondition state of the existing tool session or logical invocation
  delete: Clear through the existing owner after completion/cancellation and joined work; allocation close
    clears all remaining private state.
  cascade: Successful compaction preserves selected versions and pending write identity; it only resets the
    V476 consecutive series where specified. SDK turns and failed checkpoints do not refresh materials or
    grant write authority.
  retention: No new persistent owner or holds. Replay/recovery uses only existing trusted inputs, admitted
    operation state and validated owner records. A model-written summary or returned revision supplied as
    an argument is never authority. If exact state cannot be restored, require a fresh semantic read/select
    instead of guessing latest.
acceptance_criteria:
- id: A1
  given: A real Worker and PostgreSQL ArtifactStore with a source file and editable document
  when: The scripted model creates then edits without expected_revision
  then: Actual persisted bytes and returned exact versions agree; all six callables have the new declaration
    and the narrow real-process scenario passes.
- id: A2
  given: A target changes after the Worker selected its write base, or parallel sibling updates race
  when: The Worker attempts replacement including transport-loss reconciliation
  then: The competing committed bytes survive; stale operations fail without adopting latest, duplicate append
    or fabricated success.
- id: A3
  given: A loaded target, a committed/failed compaction and a new invocation
  when: Further reads/writes, cancellation and recovery run
  then: Committed compaction preserves valid bases, failed checkpoints do not refresh them, and old invocation
    state cannot authorize a new write.
- id: A4
  given: Removed arguments, an unobserved existing target and the selection-state limit
  when: Actual ADK tools validate and admit the operations
  then: Unknown fields and over-limit state fail before effects; results retain revision and unchanged Server
    CAS/grants remain authoritative.
