  decision: 'Boundary: Worker producer and Server trim independently (two languages), so one definition
    is impossible; the guarantee is the shared fixture plus per-language differential tests against the
    previous loop. Alternatives considered: halving or binary search over the removal count (logarithmic
    encodes, still more than three, and halving would change the retained suffix) and incremental prefix
    sums (chosen, exact and linear). Reversal: if a record field gains a custom marshaler or the report
    encoding stops being element-additive, trimDetail/trim_report_detail fail loudly on the exact-size
    check and the differential tests; then return to measuring candidates. Equal record sizes across the
    boundary are a guarantee of the encoders, not of the fixture: empty arguments are absent on both sides
    and the Server keeps the Runtime''s number literals (OBS-R42) rather than both sides formatting numbers
    alike, because the Runtime''s float text is fixed by its JSON encoder and re-formatting loses integers
    beyond 2^53. The Server''s redaction stays a second, independent pass (OBS-R27) but must leave Runtime
    records unchanged; it may still change a record that holds a deployment secret it alone matches or a
    text containing :// that its URL parser rejects, and only then removes more detail. Reopen if the Runtime
    starts writing number text the Server must normalize, or if a Server-only redaction rule is added.
    Re-review: the replay compares as jsonb in SQL rather than copying PostgreSQL''s numeric normalization
    into Go, so equality is exactly the column''s own equality; a replay that writes 5e-05 where the first
    delivery wrote 0.00005 is equal too, which is harmless because both denote the same value. The number
    range is checked in validation next to the size bound rather than in decoding, so a violation gets the
    same invariant class in Go and Python and both sides pin it in the shared fixtures.
    Round 3 replaces the earlier acceptance of a read-back of about 52 times the byte bound: LIM-OBS-16
    bounds the expanded digits at the source, so a stored report reads back as at most 4.4 times its bound.
    Alternatives rejected: selecting only counters in the readers (Run detail and the replay still decode
    whole documents, and the expansion would remain model-steerable) and re-encoding numbers on read (lossy
    beyond 2^53). Cost: the Runtime now writes the marker for values such as 1e+300 or 5e-324 that it kept
    before, which a security tool argument summary does not need. Reopen if a tool needs argument numbers
    outside -7..19 in its summary; then widen the range only with a new measurement and OBS-R110 update.
    Round 2: this task also repairs a reader defect that predates it. The private 1 MiB check in
    AllocationFinalReport.UnmarshalJSON came from 0b6d4f1d, V32-001 (performance contracts and settings).
    It applied to stored reports and made a report trimmed to the bound unreadable, even with plain strings.
    The check belongs to the received bytes, so it moved to the private response. A stored report keeps
    the strict decoder and every validation rule except the byte bounds. Those bounds measure compact JSON,
    which the jsonb rendering no longer is. This is no lenient legacy reader: it reads the same documents
    with the same rules. Alternative rejected: re-encode stored numbers into a shortest form on read. That
    is lossy for integers beyond 2^53 and would need a copy of numeric normalization. No separate defect
    record was added, so introduced_by stays V1-004.
    Out of scope, reported: the Go metrics policy replaces every configured secret wherever it occurs,
    while OBS-R31 limits secrets under 16 bytes to whole strings (controlplane/runtime_client.go has the
    OBS-R31 matcher).'
  new_spec_ids:
  - OBS-R110 (docs/spec/platform/observability.md) and observability invariant 9
  - LIM-OBS-16 (docs/spec/platform/limits.md, each tool argument number zero or with a leading-digit and
    written decimal exponent between -7 and 19; other numbers become "[NUMBER_OUT_OF_RANGE]")
  amended_spec_ids:
  - OBS-R9 (a replay matches when the documents are equal as jsonb)
  - OBS-R27 (placeholder shape, sensitive-name subset, idempotent second redaction)
  - OBS-R42 (empty arguments absent, number literals kept, LIM-OBS-16 range and its rationale, the one
