schema_version: '1.0'
id: V407-020
title: Reduce bounded telemetry trimming and operations-history copying
milestone: server-runtime-review-2026-10
epic: operations
kind: chore
introduced_by: V1-004
priority: P2
status: completed
implementation_commit: f41fdbdb18860290634a798c3b60240c37a0c9ee
depends_on: []
languages:
- go
- python
goal: Make report trimming proportional to retained detail and avoid copying the full operations history
  on each append, preserving report content, limits and cursor behavior.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/platform/observability.md
  finding: internal/telemetry/policy.go:62-70,132-140 removes one detail record and re-encodes the report
    on each trim step. The same pattern occurs before transport in runtime/src/contractor_runtime/telemetry/metrics.py:502-514,
    including repeated model_dump. Runtime already trims its report and the private client rejects bodies
    above 1MiB, so a 1000-by-4KiB Worker report does not normally reach Server normalization intact. operations.go:428-433
    copies the bounded 255-entry history after each append at capacity; runtime_client.go:391-406 and
    telemetry/repository.go:141-157 duplicate resource-policy normalization.
  validation: Validated against main dc7012e8 on 2026-10-23. The trim loops, ring-buffer opportunity and
    sentinel duplication were verified on dc7012e8; their production latency was not measured. Runtime
    is the reachable large-input sibling. Server trim tests must distinguish local producers/redaction
    expansion from an oversized report already rejected at the private boundary.
  siblings: Cover Python MetricsState.build_report, Go execution/allocation normalization, exact shared
    JSON-size accounting and resource sentinel callers. Preserve oldest-detail eviction order, aggregate
    counters, error priority, redaction, 1MiB report limits and operations cursor overflow behavior.
plan:
- Create representative Runtime producer and Server sanitizer cases with deterministic counters for record
  serialization and complete-report encodes. Include near-limit input, error-only overflow, redaction
  expansion and oversized aggregates.
- Compute exact per-record encoded contribution once and choose the same retained suffix using additive
  sizes/prefix sums or another bounded algorithm; verify the final envelope exactly. Preserve the current
  eviction result rather than dropping half the records merely to reduce iterations.
- Apply the optimization on both Runtime and Server paths, maintaining each format and shared escaping/byte-size
  rules. Use a small constant bound on full-report encodes independent of removed-record count and linear
  record projection counts.
- Replace the capped operations slice copying with a bounded ring and preserve ordered snapshots, cursor
  gaps and watcher notifications. Share resource-policy sentinel construction without changing either
  caller outcome.
- Test retention equivalence, mutation isolation, append allocations at capacity and lifecycle cleanup;
  use counts and fixtures rather than elapsed-time assertions.
scope:
  in:
  - Runtime and Server report-trimming cost without semantic changes.
  - Bounded operations-history storage and shared resource-policy normalization.
  out:
  - Changing report/truncation order, size caps, retention, public metrics shape or operations cursor
    semantics.
  - Claiming that an oversized Runtime lifecycle report bypasses existing wire validation.
acceptance_criteria:
- id: A1
  text: At 1000 retained candidate calls and maximum error detail, trimming performs a documented constant
    number of complete-report encodes and linear record projections in both Runtime and Server paths;
    output retains exactly the same detail suffix and aggregates as characterization fixtures.
- id: A2
  text: Tests cover producer-to-private-boundary behavior, local Server normalization/redaction expansion,
    exact byte limits and aggregate-too-large failures without requiring an impossible oversized Worker
    response to pass validation.
- id: A3
  text: Appending an operations change at history capacity allocates no new history backing array; ordered
    read snapshots, generation/revision cursors and gap behavior remain unchanged.
- id: A4
  text: Resource-policy normalization has one production definition and identical requested/disabled/invalid
    outcomes at both callers; deterministic encode/allocation count regressions distinguish the old implementation.
tests:
- command: go test -count=1 ./internal/telemetry/... ./internal/controlplane/... ./internal/contracts/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: cd runtime && uv run --locked pytest -q tests/test_metrics.py tests/test_allocation.py
  covers:
  - A1
  - A2
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
