- command: go test -tags=e2e -count=1 -timeout=12m ./tests/e2e -run '^(TestHTTPAndCaidoAcrossHeterogeneousRuntimeProcesses|TestProjectSitemapHTTPCollectionAcrossProductionProcesses|TestEngagementHTTPBoundsAcrossProcesses)$'
  covers:
  - A1
  - A2
  - A3
