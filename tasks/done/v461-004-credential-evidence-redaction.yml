schema_version: "1.0"
id: V461-004
title: Redact every injected credential header before HTTP evidence capture
milestone: audit-scanners-engagement-2026-11
epic: http-tools
kind: defect
introduced_by: V461-002
priority: P1
status: completed
implementation_commit: dc232fd988d4b2575bf90b5ce3264ee3acd32e22
depends_on: []
languages: [python]
goal: A selected controlled HTTP exchange never publishes a privately injected credential header, while the target receives the selected credential and caller-owned headers stay intact.
context:
  authority: "User review supplied 2026-11-09 for codex/audit-engagement at 3d5156c5b authorizes fixing the three reported regressions."
  finding: >-
    runtime/src/contractor_runtime/toolsets/http/controlled.py:334 masks only Authorization/Cookie although adapters/http_session.py now injects arbitrary API-key header names; HTTPExchangePublisher writes the selected captured value into an ordinary artifact.
  siblings: >-
    Controlled HTTP capture, every injected header name/case, redirect/retry attempts, logical query URLs and bearer/basic/cookie identities. Caido and scanner scrubbing remain separate established owners; inspect their callers for the same source.
  specification: docs/spec/tools/http-caido.md
scope:
  in: [shared boundary correction, regression through the actual publication/process/store path, required owning-package verification]
  out: [unrelated cleanup, new scanner capabilities, deployment, compatibility shims]
acceptance_criteria:
  - id: A1
    text: The reported defect reproduces on the original implementation and does not reproduce after the correction.
  - id: A2
    text: Sibling callers and legitimate controls retain their specified behavior, bounds and cancellation or replay guarantees.
  - id: A3
    text: Owning package suites and repository lint pass; any optional skips are reported explicitly.
tests:
  - command: cd runtime && uv run pytest -W error tests/test_http_selected_evidence.py tests/test_http_capture.py tests/test_engagement_api_keys.py
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]

decisions:
  - "The transport already supplies exact injected-header ownership. Mask every owned request header at capture creation; Result and Finding publishers both consume that shared capture. Caller-owned headers retain their actual values."
  - "Runtime HTTP owns response projection separately. Target-returned response bytes retain existing HTP-R74 behavior; reflected or encoded credentials in responses need a separate response-sanitization contract. This fix does not assert that arbitrary target response bytes are secret-free. Reopen this boundary when that policy is defined."
verification:
  date: "2026-11-09"
  regression: "All four published-evidence regressions failed on the original header filter and passed after correction: arbitrary and mixed-case header names, a one-byte key, multiple injected headers, redirects, private query/cookie fields and caller-owned controls."
  focused: "Selected evidence, HTTP capture and API-key suites: 30 passed. Full HTTP/identity/API-key boundary suite: 316 passed."
  independent_review: "Fresh read-only source investigation and candidate review completed. Reviewer found no actionable bypass/regression and verified retry/redirect publication through the production capture path; parent executed the actual socket suites with required permissions."
  runtime: "make test-runtime passed: 6115 passed, 135 declared optional/environment skips; release Runtime report validation passed."
  lint: "make lint passed."
  delivery: "Committed on codex/audit-engagement; not merged or deployed."
