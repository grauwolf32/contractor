schema_version: '1.0'
id: V392-004
title: Read bounded cross-Audit matches and comparisons without losing observations
milestone: finding-correlation-2026-10
epic: findings
kind: feature
priority: P2
status: completed
depends_on:
- V392-001
- V392-002
- V392-003
languages:
- go
- typescript
