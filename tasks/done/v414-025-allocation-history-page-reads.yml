    the page-derived budgets: the 1,500-row-deep Custom page read 9,311 Stages;
    the one-Run Generic page read 18,004. The original statement remains in the
    test as a negative budget control and a full-result pagination oracle.
  focused_after: >-
    TestPostgresAllocationHistoryPagesKeepBoundedReadsAndExactCursors passed with
    both forced plan modes: first page 311 Stage / 105 Run / 54 allocation reads;
    deep cursor, deep upper and pinned cursor pages 329 / 111 / 57; exact Run
    pages 5 Stage reads. Full walks with two-row pages split timestamp ties and
    match the original order, membership and resource projections, with and
    without an upper boundary and with owned or foreign exact Runs.
  owner_suite: >-
    With CONTRACTOR_TEST_DATABASE_URL set to the dedicated disposable PostgreSQL
    database, go test -count=1 ./internal/telemetry/... passed (22.617s), including
    the scale regression, report projection, retention, identity and cursor tests.
    scripts/check_tasks.py, scripts/check_spec.py and git diff --check passed.
  remaining: []

