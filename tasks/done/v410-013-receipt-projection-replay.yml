failure_outcomes:
- operation: Existing sitemap operation
  permanent: Preserve classified syntax, authority, exact selection and stale-intent errors.
  retryable: Use existing attempt and deadline bounds; no new blanket retries.
  ambiguous: Keep original operation identity and existing receipt or immutable view.
  cancelled: Join work through existing allocation/transaction lifecycle.
  timeout: Keep independent operations within their documented bounded allowance.
cardinality:
- collection: Existing map, view, source and observation collections
  expected: Existing proposal workload and realistic regression fixtures
  maximum: Existing LIM-SMT ceilings; no silently increased limit
  bound: Every page, batch and transaction remains bounded by existing count and byte constraints.
lifecycle:
- entity: Existing sitemap resources
  delete: Existing Project and allocation lifecycle
  cascade: No new lifetime or independent persistence owner
  retention: Existing ArtifactStore exact-reference protection and bounded history
