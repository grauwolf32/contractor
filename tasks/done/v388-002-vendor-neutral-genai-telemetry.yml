    - "make test-wire-cross-language with a disposable PostgreSQL database: 232 fixtures; 210 Go and 164 Python shared tests; 1076 Python shared tests passed."
    - "sh deploy/phoenix/test-smoke.sh with the existing rootful Podman connection: real Go and Runtime exporters projected into native LLM system/user/assistant messages and prompt/completion/cache/total token fields; projections survived container replacement."
    - "make lint: full Go/staticcheck/test-only exports, UI gates, scripts, specifications, shared-fixture sources, Ruff and import-linter passed."
    - "sh deploy/phoenix/test-run.sh and git diff --check passed."
