goal: The integrated tool catalog accepts no model revision/precondition arguments, still reports actual versions
  and preserves concurrency, evidence identity, compaction and V476 behavior.
context:
  authority: 'User request 2026-11-22: create tasks in two ordered stages: remove expected_revision from LLM
    interfaces first, then revision; Runtime manages preconditions and version selection, including compaction
    and V476 repeat rules. User decision 2026-11-22: a new sequential Audit submission automatically replaces
    the result for the same item_key; do not add replace_existing or an equivalent confirmation flag. Identical
    content remains a replay. User clarification 2026-11-22: retain revision in tool results so the model
    can recognize another material version, but remove model-supplied revision arguments. The user did not
    approve a new artifact-handle interface. Agent scope choice: preserve existing namespace/name addressing;
    removing revision does not require new material identifiers. Planning only; no implementation, live experiment,
    deployment or merge is assigned. Only affected-component verification is authorized, not complete Runtime/Go/lint/release
    suites. The detailed bounded runtime mechanisms below are agent implementation proposals within that direction.
    User decision 2026-11-22: ordinary read_artifact reads the current version; subsequent pages use a Runtime-issued
    cursor fixing version and position, rather than a snapshot-until-refresh interface.'
  baseline: 6a4d479d361f8fcb1ce5c74c7f512c5dfe4666af on local main; recheck actual active callers before implementation.
  specification:
  - docs/spec/tools/toolsets.md#TLS-R29
  - docs/spec/tools/toolsets.md#TLS-R39
  - docs/spec/artifacts/artifact-store.md#ART-R146
  - docs/spec/execution/worker.md#WRK-R202
  - docs/spec/execution/planners.md#PLN-R118
  sources:
  - runtime/tests/test_worker_function_tools.py
  - runtime/tests/test_finding_tool_contracts.py
  - tests/e2e/runtime_guidance_test.go
  - tests/e2e/project_sitemap_tools_test.go
  - tests/e2e/project_findings_reader_process_test.go
  - scripts/check_spec.py
  - scripts/check_tasks.py
  boundary_decision: Tools own the semantic selection and validation. Shared Runtime helpers live in toolsets.common
    and are explicitly called by production consumers; no universal argument-rewriting plugin, hidden acceptance
    of deleted arguments, new receipt store, database entity or framework for hypothetical tools. Server remains
    the authoritative owner of grants, exact Artifact reads, CAS, receipts, retention and lifecycle. Existing
    private/public/wire/persisted revision fields remain strict; only model-facing inputs change. Update numbered
    owning specs, descriptions, active instructions and actual ADK schemas with implementation; this task
    plan does not change shipped specs.
  delivery_group: Final focused exit after both ordered stages; this is not a third implementation architecture
    or another global gate.
  parallel_plan_reconciliation: A separate, unmerged planning lane codex/v478-audit-plan-results exists at
    review time, with pending V478-002 (sources/evidence/fact) and V478-003 (submit_result/submit_results).
    Its task drafts still mention explicit correction revisions. This newer decision removes those model arguments
    too. Do not edit the other lane's uncommitted files or introduce a dependency on nonexistent main task
    records. Before touching a shared owner, reconcile the landing order and update the affected V478 drafts
    in their owning lane or after they land; then record real depends_on edges where needed. Apply this contract
    to the active names, never preserve submit_check_result aliases or restore revision arguments to satisfy
    an older draft. This is an integration precondition, not authorization to implement/merge V478 or widen
    this package into durable evidence collection.
scope:
  in:
  - Integrated focused verification, drift inventory and updated current tool-interface documentation/catalog
    after implementation.
  - Verify old model-side revision instructions are retired and pinned config changes use new identities.
  - Record exact commands, case counts, skips, base/implementation commits and remaining limitations in tasks/evidence/v479-runtime-owned-versions.json.
  out:
  - New general artifact-handle addressing, renamed model-supplied version/ETag preconditions, force/replace
    flags, compatibility aliases and automatic semantic rebasing. The approved read_artifact pagination cursor
    is in scope in V479-004.
  - Removal of Server/API/wire/store revision checks, changed grants/retention or model/tool budget semantics.
  - Unrelated UI redesign, live model evaluation, demo deployment and full repository test gates.
acceptance_criteria:
- id: A1
  given: All preceding tasks are integrated on one tested tree
  when: Actual Python/Go ADK declarations and model-call paths are inventoried
  then: No covered model revision input or hidden serialized equivalent survives; removed fields fail and
    real returned revisions remain visible.
- id: A2
  given: Real Server/Runtime/PostgreSQL plus deterministic scripted models
  when: The combined write/read/Audit/Sitemap/Finding/Planner and compaction scenarios execute
  then: Stored bytes, exact provenance, conflicts, call accounting and version metadata agree; V476 never
    suppresses a changed current version.
- id: A3
  given: Committed/failed checkpoints, process recovery, parallel calls, response loss and bounds
  when: Lifecycle/failure cases and focused affected suites execute
  then: No latest fallback, lost update, stale overwrite, mixed page, cross-invocation authority or duplicate
    side effect occurs.
- id: A4
  given: Current implementation, task evidence, configs/specs and standalone HTML
  when: The acceptance evidence and catalog are rebuilt and inspected
  then: Signatures/statuses match the actual integrated commit; UTF-8 remains correct, limitations are explicit,
    and no live-quality/full-release claim is made.
