- command: go test -tags=e2e -count=1 -run '^(TestRuntimeManagedArtifactWritesAcrossProcesses|TestRuntimeManagedMaterialVersionsAcrossProcesses|TestRuntimeGuidanceAcrossProductionProcesses|TestAuditCompactionPreservesTrustedCompletionAcrossProcesses|TestProjectSitemapToolsAcrossProductionProcesses|TestRuntimeManagedSitemapEditsAcrossProcesses|TestProjectFindingsReaderAcrossProcesses)$'
    -timeout=30m ./tests/e2e
  covers:
  - A1
  - A2
  - A3
  - A4
- command: cd runtime && uv run pytest tests/test_tool_version_surfaces.py tests/test_worker_function_tools.py tests/test_tool_repeats.py tests/test_finding_tool_contracts.py
    tests/test_worker_artifact_bindings.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: python3 scripts/check_spec.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: cd runtime && uv run python ../scripts/check_tasks.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: go test -tags=e2e -count=1 -run '^(TestAuditHypothesisContinuationAcrossProductionProcesses|TestProjectFactsAcrossProcesses|TestWorkflowMaterialSetsAcrossProductionProcesses)$' -timeout=30m ./tests/e2e
  covers:
  - A1
  - A2
  - A3
  - A4
demonstration: Run scripted real Server/Runtime scenarios that update and reread artifacts, correct Audit
  conclusions, encounter stale sitemap/finding selections, compact and finish. Inspect exact stored results
  and actual model declarations, not only helper outputs.
requirements:
- id: R1
  text: 'Inventory actual LLM inputs, descriptions and validators: 12 top-level expected_revision arguments
    across six Artifact/document, two Audit and four Sitemap callables; five top-level revision arguments
    across four Artifact/document/source readers and Project Finding read; nested findings/evidence/selection,
    scanner/import/proposal and both Planner finish surfaces. Include any active V478 replacement names without
    aliases. No input version under a renamed technical field or opaque JSON loophole. The approved read_artifact
    cursor is a machine-issued pagination/start position, not a freely model-supplied version precondition;
    test its validation and scope separately.'
- id: R2
  text: Assert successful tool results and relevant input context retain actual revision metadata so a model
    can notice another version. Do not rewrite raw artifact content or strip domain revision fields from stored/source
    documents. New revision is an identity observation, not a claim that bytes differ.
- id: R3
  text: Combined real-process coverage includes hidden create/update CAS and stale conflict; Audit sequential
    automatic replacement plus identical replay; cursor-bound exact pagination across external writes; fresh
    current reads; pinned-source/image rereads; successful/failed compaction; V476 two-then-refuse and accounting;
    nested exact selections and deterministic finish. Reuse tests delivered by earlier tasks and extend only
    for interactions not already covered.
- id: R4
  text: Inspect every applicable owner/spec/schema/config/example together. Existing full private/wire/store
    revisions and grants must remain strict. No full suite, live Gateway run, configured-model change or deployment
    is part of acceptance. Required process/database skips or zero selected cases fail this milestone.
- id: R5
  text: Refresh the established HTML interface catalog from the actually integrated implementation, retaining
    its standalone UTF-8 shell and separate inline source. Distinguish implemented changes from proposals
    and report final signatures, preserved output revisions and unresolved limitations. Keep external presentation
    artifacts out of repository commits unless an existing repository owner is explicitly selected.
failure_outcomes:
- operation: Run the focused integration acceptance and build the catalog
  permanent: Missing or skipped required cases, stale generated catalog, an unresolved selection contract,
    incorrect output metadata or a failed owner check leaves the milestone pending/in_progress.
  retryable: Only the existing test infrastructure classification applies; do not repeatedly rerun a failing
    semantic case to obtain a green result.
  ambiguous: A missing/incomplete report is not proof of a pass; use observed process/test outcomes.
  cancelled: Join owned test processes and preserve incomplete evidence without marking tasks completed.
  timeout: Use each selected test command deadline; do not change configured live models or start a full gate.
cardinality:
- collection: Actual tool inventory and deterministic acceptance cases
  expected: The current 150-interface catalog plus concrete changes introduced by prerequisite tasks.
  maximum: Existing owner row/byte/tool limits exercised by prerequisites; this chore adds no Runtime collection.
  bound: Inspect declared inputs and bounded scenario artifacts; do not enumerate unrelated live Projects
    or export transcripts.
lifecycle:
- entity: Acceptance reports, owned test resources and external HTML
  delete: Drop only the owned disposable database after pools/processes stop; remove only owned test resources.
  cascade: No production entity or retention change.
  retention: Commit bounded acceptance evidence to tasks/evidence; retain the established external HTML and
    inline source with explicit UTF-8 packaging.
verification_policy: Commands listed here are required implementation checks, not planning results. Run complete
  affected test files/packages and actual ADK declarations/calls, not only helper tests. New named tests must
  be added by the task; zero matches is a failure. Real persistence claims require a disposable PostgreSQL
  database; missing/skipped prerequisites are not passes. Reuse and explicitly drop one owned database after
  its pools/processes stop. Keep CONTRACTOR_TEST_HEAVY_IO unset unless explicitly requested. Do not run make
  verify, make release-verify, make test-runtime, make test-go or make lint. Use targeted Ruff, import, spec/task
  and selected process checks; extend only to actually affected sibling owners. Changed pinned catalog content
  needs new immutable identities/paths and lock entries; tests use testdata fixtures, not the live configs
  tree. Do not change the configured model or claim measured quality improvement.

assignment: "User request: complete V479 in one pass and merge completed tasks into main; all implementation prerequisites are complete."

fixture_reconciliation: "Integrated acceptance exposed remaining scripted read_artifact(revision=null) calls in Audit compaction and sibling gateways. Remove these deleted fields, nested Finding discovery revisions and exact Planner finish projections from model calls while retaining exact internal/wire assertions. Extend focused checks to Audit hypothesis continuation and Project Facts consumers; do not accept old fields as compatibility."

input_validation_review: "Keep malformed portable material names within the resolver's bounded ToolInputError boundary. The original ArtifactRef grammar remains authoritative; add regressions for invalid namespace/name before any owner I/O."

existing_catalog_limit: "TraceFindingsToolsetFactory creates only finding although it inherits additional registered exports. The HTML marks those inherited interfaces unavailable and extracts TraceFindingTool itself for the actual facade. No new caller or capability repair is introduced by V479; revisit the owning trace factory when selecting one of those extra operations. Model schema inventory counts registered declarations, not one allocation tool roster."

catalog_consumer_reconciliation: "Hypothesis and MaterialSet process fixtures pin the shipped generation Workflow. Migrate their selected identity from @2 to the new immutable @4 produced by V479-002/005; initial generation must validate before Server readiness. Include the complete affected process roots in focused acceptance."

