    covers: [A1, A2, A3, A4, A5, A6]
test_prerequisites:
  - >-
    New history targets are implementation deliverables, not existing passing
    evidence. Require a disposable PostgreSQL database with schema create/drop
    rights, actual Server/Runtime processes and local fixtures; fail missing or
    unreachable prerequisites, skipped mandatory cases and zero-match selections.
  - >-
    Run complete suites of all touched packages, including artifacts, persistence/
    migrations, public/private HTTP, contracts and every holder/writer adapter in
    the inventory. Register process tests in the release graph; regenerate public
    clients normally. Tests never read live configs outside allowed process gates.
  - >-
    Use deterministic counters, injected clocks and real temporary filesystems.
    Exercise actual PostgreSQL references/transactions and failure adapters;
    permissive fakes, wall-clock assertions and only three-row fixtures do not prove
    retention safety or bounded maintenance over the containing collections.
implementation_commit: a2d94244e6237b5950ae00bde28d951e9a655297
decisions:
  - >-
    Only a CAS write (an expected revision) grows history; creates and forks
    are create-only and start a binding at one revision. Each binding keeps
    retained_revisions and retained_bytes (blob size per revision, also when
    deduplicated), maintained by the write and fork statements and by
    eviction; the Run's 50,000 inserted-revision counter is untouched by
    eviction (ART-R118, ART-R123). The typed policy is
    artifacts.HistoryPolicy (one definition with its floors and ceilings),
    installed in the request context from the Server configuration
    (artifactHistoryMaxRevisions/Bytes, CONTRACTOR_ARTIFACT_HISTORY_MAX_*,
    --artifact-history-max-*); api/testdata/v1alpha1/artifact-history-cases.json
    holds the same numbers and the error contract for Go and Python.
  - >-
    Holds are counted on the revision row (artifact_binding_revisions.hold_count)
    by triggers of each holder table in the transaction that records or
    releases the reference, so admission reads one partial index of unheld
    revisions in (binding, created_at, revision) order instead of probing
    holder JSON. A released hold is found again first because the index has
    no stored cursor. Alternative considered: indexed per-holder probes at
    eviction, which need one index per JSON path and repeat on every
    admission. Reopen if a holder cannot maintain its count in its own
    transaction (DEL-R65 rationale).
  - >-
    Strict holders (StageExecutions, Audit inputs, finding proposal
    receipts) reject a missing revision of an existing scope with
    artifact_exact_hold, which each writer reports as its existing not-found
    outcome; finding intake now maps it to ErrAccessDenied. Lenient holders
    (Planner sessions, Run and Audit baseline Skill sources) protect nothing
    when the revision is missing. A reference into a scope that no longer
    exists holds nothing, in triggers and in the migration backfill alike.
  - >-
    Eval dataset case inputs are classified availability-only (DEL-R64), not
    holders: one dataset revision may name up to 1,000 cases of up to 128
    inputs (LIM-EVF-5, LIM-EVF-9), which would make dataset registration and
    the bounded Eval purge (LIM-EVM-20) write an unbounded number of revision
    rows. Eval preflight already reports a missing input as
    eval_evidence_unavailable. Reopen if Eval needs a registered dataset to
    stay runnable without re-upload.
  - >-
    A write needing more than one transaction's 64 removals commits one
    maintenance pass of its own binding and answers the retryable
    artifact_history_maintenance_pending (503, Retry-After 1). Writers that
    own their transaction (Memory, Git import) roll back and then commit the
    pass through PostgresRepository.MaintainHistory. Memory maps both
    history answers to the retryable memory_unavailable and never to
    memory_namespace_full (MEM-R99); the Runtime's document writes resend
    once on pending and the workspace exporter retries it within its CAS
    attempts. No queue, sweep, controller, receipt or lease was added.
  - >-
    The two migrations of this task were folded into
    000043_artifact_history_retention.sql (accounting first, then holds),
    the number the coordinator assigned after main took 000040 to 000042.
