  - path: internal/artifacts
    description: Common automatic per-binding admission/accounting/eviction with existing production writer callers.
  - path: internal/persistence/migrations
    description: Data-preserving accounting/protection and trusted immutable-delete trigger updates, with migration tests.
  - path: docs/spec/artifacts/retention-and-deletion.md
    description: Owning automatic retention contract and complete authoritative holder/writer inventory with lifecycle classification.
  - path: make/features.mk
    description: New test-artifact-history-postgres and test-artifact-history-e2e targets, required in the release graph.
  - path: api/testdata
    description: Shared retention/error fixtures and Go/Python readers; public schema changes through normal generation targets.
