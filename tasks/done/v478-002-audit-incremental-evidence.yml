goal: Workers explicitly save selected code, HTTP and artifact sources during work through evidence, finding
  and fact; acknowledged records remain readable after a later limit or Worker loss.
demonstration: Issue a control request and a test request for one assigned check, retain them and an attributed
  observation, then kill the Runtime before result submission. The Server reads the committed check-linked
  artifacts without replaying either request.
context:
  authority: 'User request 2026-11-22: prepare tasks for a concrete Audit check plan, evidence collected during
    work, a thin result submission tool, and partial results on interruption without invented coverage conclusions.
    The user corrected the assumption that limits reveal completed/remaining semantic steps: execution facts
    do not establish semantic coverage. The user proposed submit_result and explicitly requested joint review
    and agreement before merging these tasks into main. This is planning authorization only. The decisions below supersede the initial agent proposals.
    User review question 2026-11-22: clarify the relationship between Project facts and check-specific evidence,
    including whether a fact may serve as evidence. The user suggests facts as reusable system knowledge and
    evidence as specific to a hypothesis; the distinction was initially proposed for joint review. User decision
    2026-11-22: accept the distinction between reusable Project facts, exact observations/materials, and evidence
    selected for a specific claim. Fact summaries do not automatically verify their claims; original exact
    sources may be explicitly reused with applicability and attribution preserved. This agreement settles that
    distinction only, not other open task choices, implementation or merge. User decision 2026-11-22: accept
    sources as the shared model-facing selection of code, HTTP and exact artifact materials for record_evidence,
    finding and record_fact. Evidence is a relation to the particular check/claim; a Finding need not consume
    an Audit evidence record or have a hypothesis. Preserve independent owners and reuse exact material bytes.
    This does not approve unrelated pending choices or authorize implementation/merge. User decision 2026-11-22:
    publish evidenced security problems through finding even when unrelated to the assigned hypothesis, and
    explicitly instruct the Worker how to use evidence. Publication must precede final result submission when
    feasible; independent discoveries keep honest incidental origin. This approves publication/evidence guidance
    in the task plan, not a new mandatory result flag, a minimum Finding count, semantic auto-detection, implementation
    or merge. User decision 2026-11-22 supersedes the earlier fixed-plan proposal: decide how an Audit plans
    its work separately. For this package make a small scenario-independent instruction improvement using existing
    assignments; no mandatory frozen check-plan document, new criterion/step contract, per-endpoint Task expansion,
    ReAct planner tools or automatic plan generation. Future options include scenario-specific coverage instructions,
    Worker planner tools or executor discretion; none is selected here. User decision 2026-11-22: durably retain
    explicitly selected sources through evidence, finding and fact, with the guarantee beginning at Server
    acknowledgement. Rename the proposed record_evidence tool to evidence and the existing record_fact tool
    to fact; no compatibility aliases. Automatic archival of every observation is not part of this package.
    User decision 2026-11-22 accepts review points 3 and 4: inconclusive can settle an attempt and the Audit
    can finish with visible unresolved conclusions, without mandatory automatic repeats. When an assigned hypothesis
    check stops without an accepted conclusion, expose a system-authored inconclusive with observed stop reason
    and source, meaning no conclusion was accepted. Preserve existing accepted judgments, keep hypothesis-free
    exploration without a verdict, and never turn a failed/cancelled Run into success.
    User request 2026-11-22: review this package against updated main and reconcile affected tasks. Apply
    the already merged V479 contracts for Runtime-owned versions and correction generations; this review
    does not assign feature implementation or change the agreed retention/stop policy.'
  implementation_gate: 'User assignment 2026-11-22 supersedes the planning gate: implement the full reviewed V478 package in one continuous pass. Do not deploy or launch a live Audit. Earlier review gate follows as historical context. All product review decisions recorded below are settled for the task draft. Keep tasks
    pending: this thread is planning/review, not an implementation assignment. Do not deploy or launch an Audit.
    The user requested review before merging the task package into main; report the reconciled package before
    integration. Implementation must follow these task contracts; an unforeseen consequential prerequisite
    needs its own review, not silent scope growth.'
