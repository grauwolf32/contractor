    removed by V471-001 commit 41fc498a72f6bb8ace9a566a8d012f8b0df42fbc.
    tests/e2e/production_memory_configuration_test.go:185 expects 21 summarized
    continuations while the shipped catalog contains 22. Reproduced through
    make test-http-caido-hardening configuration checks.
  siblings: >-
    Both checker template and Stage instruction references are updated together;
    the shared installer serves basic and prepared-256 Audit process fixtures.
    Production catalog and immutable lock remain unchanged by this chore.
scope:
  in:
    - Give the test-only basic checker an instruction owned by its existing installer.
    - Reconcile the explicit Planner continuation count with the complete current catalog, retaining per-Stage policy checks.
  out:
    - Changing runtime tools, shipped Workflow behavior, catalog identities or live model selection.
acceptance_criteria:
  - id: A1
    text: TestAuditCommonFixtureConfigurationLoads and TestProductionMemoryConfigurationStaging execute nonzero cases and pass on the actual staged and shipped catalogs.
  - id: A2
    text: Both basic checker references resolve to the test-owned resource; every shipped modeled Planner and continuation still validates the selected compact policy.
tests:
  - command: "go test -tags=e2e -count=1 ./tests/e2e -run '^(TestAuditCommonFixtureConfigurationLoads|TestProductionMemoryConfigurationStaging)$'"
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2]

