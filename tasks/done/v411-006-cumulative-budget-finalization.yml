schema_version: '1.0'
id: V411-006
title: Enforce cumulative pentest budgets and finalize at the hard active-time cap
milestone: autonomous-http-pentest-2026-10
epic: audits
kind: feature
priority: P1
status: archived
depends_on:
- V411-002
- V411-003
languages:
- go
- python
