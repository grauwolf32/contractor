schema_version: "1.0"
id: "V38-002"
title: "Define managed eval DTOs and portable conformance fixtures"
milestone: "managed-evals-ui"
priority: "P2"
status: "completed"
implementation_commit: "d5f31ab94b16f99254e64ebdd20efa89fdb4100a"
implementation_repository: "contractor"
depends_on: ["V38-001", "V41-008"]
languages: ["go", "json", "yaml"]
goal: >-
  Freeze the producer-neutral managed API schemas and portable identity mapping before adding
  storage or execution.
context:
  specification: >-
    docs/spec/30-managed-evals.md
  design: >-
    docs/evals-experience-design.md
  format: >-
    docs/spec/26-portable-evaluation-format.md
  user_story: >-
    US-10 in docs/spec/ui-user-stories.md
  boundary: >-
    Contractor builds and runs native Evals without Playground. Server and external control
    modes are immutable and mutually exclusive for dispatch. Both submit ordinary Runs/Audits
    through existing services; no new Worker Scheduler or label-based membership authority. The
    delivered portable CLI format and private recovery journals remain compatible.
  verification: >-
    Create the named focused test files/packages as part of implementation. PostgreSQL commands
    require a disposable database and must not pass by skipping integration cases. Use
    deterministic fixtures; these tasks do not authorize paid models, live targets, tighter
    global token defaults or shared-demo mutations.
  locations: >-
    Contractor: new api/evals/v1 schemas, api/testdata/evals fixtures and internal/evaldomain
    codecs. Existing api/openapi/contractor-public-v1.yaml handlers are added only with
    V38-005/006. Playground fixture consumers are implemented separately in V38-009.
scope:
  in:
    - >-
      Define closed, bounded request/response schemas for datasets with private check
      partitions, native drafts/plans, contractor.eval-registration/v1 external manifests,
      capabilities, command receipts, members and paginated execution inventories,
      result/assessment ingestion, review context,
      selection, pair pages and reports. Include full valid HTTP examples and invalid fixtures
      for every mutation. Include the existing portable comparison-gates extension mapping.
      Define chart DTOs and fixtures for quality, token/duration distributions, pair deltas
      and observed progress, including bounded bins/buckets and bound drill-down filters.
      Cover Workflow and Audit in both control modes, with exact profile/Workflow selectors;
      Audit child/round/retry evidence retains one member and parent wall-time semantics.
    - >-
      Map portable snake_case records to managed camelCase DTOs without changing exact retained
      portable bytes. Freeze member/pair hashes, lookup versus portable IDs, source claims
      versus verified digests, producer labels, nullable measurements, error status/reason
      mapping and CAS/idempotency replay rules.
    - >-
      Encode the trace-small 8-member worked example and fault matrix from the design as
      language-neutral expected records and aggregates. Include missing usage, failed execution,
      conflicting receipt, unsupported member, private-truth sentinel and multiple pages.
  out:
    - >-
      Runtime endpoints, database migrations, UI implementation, paid campaigns and any
      dependency on importing Playground code into Contractor.
requirements:
  - id: "R1"
    text: >-
      All schemas distinguish execution, collection and assessment state, preserve expected
      denominators and require explicit bindings/check policy; unknown fields, ambiguous
      variants and invalid digests fail before mutation.
  - id: "R2"
    text: >-
      A server-controlled plan and an external safe registration have different authorities.
      Unverifiable private source hashes are attributed claims. A public projection cannot
      become a writable private CLI journal.
  - id: "R3"
    text: >-
      Portable identifiers use spec 26 exact UTF-8 JSON array hashing, not language-dependent
      map serialization. Fixtures contain both accepted and rejected records and expected
      owner-safe errors.
acceptance_criteria:
  - id: "A1"
    given: >-
      The native/external schemas and portable fixtures.
    when: >-
      Go codecs validate every positive/negative example.
    then: >-
      Valid records round-trip, invalid records fail deterministically, and identity/digest
      expectations do not require Python. Workflow/Audit times two control modes validate;
      mixed execution kinds are rejected. Replayed/overlapping Audit child measurements never
      double-count tokens, sum child wall times or expand the expected member denominator.
  - id: "A2"
    given: >-
      The trace-small fixture with 8 expected members.
    when: >-
      Its stored expected comparison is reviewed and validated.
    then: >-
      A/B end-to-end passes are 3/4 and 2/4, scored quality is 3/3 and 2/3,
      terminal/quality/token pair counts are 3/2/2, and B known 130 tokens cover only 2/4.
      Chart fixtures retain only the two matching token pairs (A 80/45, B 70/60), with
      differences -10/+15 and shared histogram boundaries; missing measurements are not zero.
  - id: "A3"
    given: >-
      Hidden truth, secret and foreign-owner sentinel fixtures.
    when: >-
      Safe projections and error DTOs are produced.
    then: >-
      Private data never enters public views, Run recipes, cursors or errors; authorized review
      context is an explicit separate projection.
tests:
  - name: "conformance"
    command: >-
      go test -race -count=1 ./internal/evaldomain
    covers: ["A1", "A2", "A3"]

verification_result:
  date: "2026-09-19"
  evidence: >-
    Embedded closed managed schemas and pinned portable schema snapshots validate 100
    accepted/rejected fixtures without Python. Tests cover all four execution/control
    combinations, 17 mutation examples, exact hashes, CAS replay, private projections,
    eight-member comparison arithmetic and multi-role Audit retry accounting.
    go test -race -count=1 ./internal/evaldomain and go vet ./internal/evaldomain
    ./api/evals/v1 passed. HTTP endpoints remain for V38-005/006.

review_followup:
  date: "2026-09-20"
  implementation_commit: "e7183230bda98cea2b84c3f457394d00472b80c7"
  evidence: "docs/plans/2026-09-20-managed-evals-core-review.md"
