schema_version: '1.0'
id: V407-004
title: Batch preparing Audit list hydration without changing the response contract
milestone: server-runtime-review-2026-10
epic: audits
kind: chore
introduced_by: V25-004
priority: P2
status: completed
implementation_commit: f9a711f1ff66ab3875939086785d208fb239cd56
depends_on: []
languages:
- go
goal: Hydrate preparation fields for an Audit page with bounded set reads while preserving the complete
  existing list response and revision fences.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/api/public-api.md
  validation: Revalidated against main dc7012e8 on 2026-10-23. N+1 preparation hydration is confirmed.
    The claimed per-row inventory payload downloads are disproved by mutually exclusive phase guards;
    no such download needs fixing.
  finding: internal/httpapi/public/audit_handlers.go:275-280 calls auditDetailReadModel for each preparing
    or inventory-phase Audit. That helper decodes the profile and calls Preparation, GeneratedInventory
    and Get (audit_preparation.go:20-28,46). Preparation performs Get, role/execution reads and a revision
    check (auditservice/preparation.go:20-28,58), so a 200-row preparing page incurs repeated store calls.
    GeneratedInventory already returns nil for phase != rounds before any inventory link/payload read
    (generated_inventory.go:36-47); the list never enters that payload-reading phase. Non-preparing list
    rows already use auditReadModel directly. The opportunity is batched preparation projection, not removal
    of required fields or creation of a narrower incompatible AuditSummary response.
  siblings: Both owner and project lists share this path. Keep GET /v1/audits/{id} detail behavior and
    the existing GeneratedInventory phase guard. Preserve preparation status/output descriptors and every
    currently exposed list field.
plan:
- Capture deterministic statement counts and response fixtures for mixed pages and 200 preparing Audits,
  including bounded preparation roles/attempts and retained output descriptors.
- Add a bounded page hydration reader keyed by the listed Audit IDs and revisions. Retrieve role/execution
  data set-wise, retain owner/project authorization and stale-revision detection, and bound both rows
  and bytes using the enclosing page and per-Audit contracts.
- Use the batched hydration result in the existing list response model. Preserve field presence, preparation
  statuses, output descriptors, pagination and all currently absent GeneratedInventory values; leave detail
  GET behavior unchanged.
- Prove constant set-query counts per allowed page/batch with a PostgreSQL tracer and compare full responses
  with baseline fixtures. Exercise concurrent revision changes and unavailable storage without silently
  returning mixed revisions.
- Keep OpenAPI and generated clients unchanged if the response contract is unchanged. Run public API and
  UI verification to prove compatibility; any necessary schema edit must be additive and generated normally.
scope:
  in:
  - Batched hydration of existing preparation fields for owner/project Audit lists.
  - Real-store statement counts, response parity and revision-conflict coverage at the maximum page size.
  out:
  - Replacing existing list items with a narrower public summary shape or dropping optional fields that
    current callers receive.
  - Claiming or fixing inventory payload downloads on the list path, which already avoids them.
  - Changing detail GET, public pagination limits, stale-revision semantics or UI vocabulary.
acceptance_criteria:
- id: A1
  text: A 200-row preparing page hydrates required preparation data through a documented fixed number
    of set queries per bounded batch rather than per-row service calls; the deterministic count test improves
    on the recorded baseline.
- id: A2
  text: Full owner/project list response fixtures preserve every existing field and preparation output/status,
    pagination and authorization behavior for mixed phases. GeneratedInventory remains absent where the
    current phase guard returns nil.
- id: A3
  text: Revision races produce the existing conflict outcome, and transient storage errors retain their
    classification; the page does not combine incompatible revisions or exceed documented row/byte bounds.
- id: A4
  text: Public API verification and the UI suite pass without a narrowing contract change; detail GET
    behavior and its inventory reads remain unchanged.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/httpapi/public/...
    ./internal/auditservice/... ./internal/auditstore/...
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api
  covers:
  - A2
  - A4
- command: make ui-verify
  covers:
  - A2
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
verification:
  date: '2026-10-23'
  environment: >-
    macOS arm64; Go 1.26.9; locked Node 24.20 and Runtime venv; local
    PostgreSQL 17.11 database contractor_test_b2 with isolated per-test
    schemas; base 7023e96e.
  re_verification: >-
    The finding held on base 7023e96e: listProjectAudits called
    auditDetailReadModel for every preparing or inventory item, which read
    Preparation (Get, roles, executions, revision Get), GeneratedInventory
    (nil before rounds) and Get again. GeneratedInventory never reached an
    inventory link or payload on the list path, as the validation says.
  regression_before_fix: >-
    The new TestSharedPostgresAuditListsHydratePreparationInFixedStatements,
    copied onto base 7023e96e in a temporary worktree, failed in every
    subtest: a 200-item preparing page took 1201 statements (per-row
    hydration of the same page 1200), the 12-item mixed page 61, and the
    interleaved race and storage-loss cases did not hit a hydration
    statement. Mutation checks on the change: dropping the revision fence
    from listPreparationPageSQL fails the race subtest (200 instead of 409)
    and the store test; dropping accepted outputs in the scanner fails the
    mixed-page parity.
  change: >-
    QueryStore.ListPreparationPage reads the pinned prepare roles, attempt
    counts and latest attempts of every listed Audit in one statement fenced
    by owner and listed revision; a changed or vanished Audit is
    auditstore.ErrConflict. The status CASE and attempt joins are shared SQL
    fragments with ListPreparationRoles, and projectPreparationRole is the
    one Go projection for the detail and list reads. The lists call
    Service.PreparationPage once per page and only when an item is preparing
    or inventory with a prepare role; the detail read keeps its statements.
    ASC-R150 records the statement count, fence, bounds (LIM-API-18 Audits,
    LIM-ASC-2 roles, latest attempt only, LIM-ASC-5 outputs) and outcomes.
    OpenAPI and generated clients are unchanged.
  commands:
    - >-
      test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1
      ./internal/httpapi/public/... ./internal/auditservice/... ./internal/auditstore/...
      passed (public 117s, events 9s, auditservice 275s, pgstore 98s); the
      public packages passed again (100s) after the last test edits.
    - make verify-public-api passed.
    - make ui-verify passed (192 files, 2369 tests and 1 expected fail; build ok).
    - make lint passed after make tasks-backlog.
    - go test -count=1 ./internal/archtest/ and the SQL placement tests in ./internal/persistence passed.
  database_tests_configured: true
  acceptance:
    A1: >-
      The public PostgreSQL test counts statements through a pgx tracer: the
      owner list of 200 preparing Audits and of one take 2 statements (list
      and hydration), a Project list 3 (with the Project read), a page
      without preparing items 1; the recorded per-row baseline is 1201. The
      store test reads a 200-Audit page in exactly one statement.
    A2: >-
      Owner pages of 200 preparing Audits and of 12 mixed items (draft,
      pending, intent, submitted, retrying, exhausted, accepted, inventory,
      paused, failed, rounds) and the Project page equal the old per-row
      hydration byte for byte and validate against AuditPage; cursor
      pagination carries over; each item's preparation equals its detail
      GET; no item has generatedInventory. Another owner's Audit is refused
      by the owner fence in the store test.
    A3: >-
      A pause committed just before the hydration statement returns 409
      conflict and a retry shows the paused Audit; a terminated backend
      returns 500 without items; a 40001 failure stays
      IsTransactionConflict (store) and maps to 503
      storage_transaction_conflict (handler); older, newer, absent and
      other-owner revisions are ErrConflict. Bounds: 1..200 unique
      identities, at most 16 roles per Audit and 128 outputs per attempt,
      checked on read.
    A4: >-
      make verify-public-api and make ui-verify pass with OpenAPI and
      generated clients unchanged; auditDetailReadModel keeps its
      Preparation, GeneratedInventory and revision reads.
  declined:
    - >-
      A listed Audit deleted before hydration now fails the list with 409
      conflict instead of the 404 the per-row Get returned; ASC-R150 states
      it. The list and detail operations still do not declare 409 in
      OpenAPI, which was already reachable through the revision check
      before this change; declaring it is left to a contract task.
