schema_version: "1.0"
id: V372-022
title: "Answer the public API on a standby Server with the error envelope"
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: defect
priority: P3
status: completed
implementation_commit: "4925c9c78b9457bccca516060e789cb4bc939c25"
depends_on: []
languages: [go, yaml, markdown]
goal: "A standby Server answers every /v1 request with a registered, retryable error in the public error envelope, so clients see a temporary unavailability instead of a plain-text 404 that reads as a missing resource."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; first noted in V370-010; file:line verified on b2b09ea"
  specification: "docs/spec/platform/persistence.md#PER-R3"
  severity: low
  finding: >-
    While another Server holds the advisory lease, the standby serves
    newProcessHandler with only a readiness handler
    (internal/app/single_active.go:216-226): /healthz and /readyz (503 with
    a JSON status) are registered (internal/app/app.go:313-321), and
    because no public API handler is passed, every /v1 path falls through
    to net/http's text/plain "404 page not found". API-R73 requires every
    failure of the public API to be a registered code in the error
    envelope, and the browser client and the CLI read a 404 as a missing
    resource and do not retry, although the condition ends when the standby
    takes over (PER-R4). PER-R3 states only health and readiness for a
    standby. Predates the shallow history (boundary 6349621).
  siblings: >-
    /v1/events/ws on a standby falls through the same way. The private API
    is not served on a standby at all (PER-R3), which stays. The active
    Server's own unmatched paths already answer 404 not_found in the
    envelope (API-R73).
scope:
  in:
    - "The standby answers every /v1 path, the event upgrade included, with one registered retryable code (an existing one such as overloaded, or a new server-unavailable code) in the error envelope, with X-Request-ID and Cache-Control no-store; PER-R3 and the OpenAPI document say so."
    - "A process test that starts a second Server against a held lease and checks a /v1 response."
  out:
    - "Forwarding requests to the active Server and active-active operation (OPS-R5)."
failure_outcomes:
  - operation: "Any /v1 request to a standby Server"
    permanent: "None."
    retryable: "The registered unavailable code with retryable true; clients back off as for other 503 answers until the standby takes over or the active Server answers."
    ambiguous: "Not applicable: a standby performs no mutation."
    cancelled: "Unchanged."
    timeout: "Unchanged."
acceptance_criteria:
  - id: A1
    given: "A Server standing by because another Server holds the lease"
    when: "GET /v1/runs and the event upgrade are requested"
    then: "Both answer the registered retryable code in the error envelope with a request ID, never text/plain."
  - id: A2
    text: "The process test fails on b2b09ea."
tests:
  - command: "go test ./internal/app"
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./tests/integration/lease"
    covers: [A1]
  - command: "make verify-public-api"
    covers: [A1]
  - command: make lint
    covers: [A1, A2]
verification:
  date: "2026-10-23"
  revision: "4925c9c78b9457bccca516060e789cb4bc939c25"
  environment: >-
    Integration branch integration/quick-wins-2026-10-23 on macOS arm64 with
    Go 1.26.9, Node 24.20.0, pnpm 11.24.0, disposable PostgreSQL 17.11
    (CONTRACTOR_TEST_DATABASE_URL set) and TMPDIR under /private/tmp.
  merged_run:
    - "make -k verify: lint after the dependency graph refresh, ui-verify (2,260 UI tests), test-config and build passed; make lint passed in full on the rerun."
    - "make test-go: every package passed except internal/app TestPostgresControlPlaneLeaseSessionDetectsVanishedHolder, which fails the same way on main because macOS PostgreSQL does not support tcp_user_timeout."
    - "make test-runtime: the 102 failures it reports (Podman, Darwin process limits, sandbox) fail identically on main; test_scan_toolset::test_capabilities_check_each_binary_independently[scan_nuclei] is timing-dependent (V371-022 class) and passed on rerun."
    - "make test-wire-cross-language (243 fixtures, 1,135 tests) and make verify-public-api passed."
  task_commands:
    - "go test -count=1 ./tests/integration/lease and make test-lease-integration: passed (the standby process test and the in-process lease tests); go test ./internal/app passes except TestPostgresControlPlaneLeaseSessionDetectsVanishedHolder, which fails identically on main because macOS PostgreSQL does not support tcp_user_timeout."
