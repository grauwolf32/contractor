schema_version: "1.0"
id: V371-011
title: "Register the per-proposal evidence quota and hold both proposal quotas to the registry"
milestone: hub-audit-defects-2026-10
epic: findings
kind: chore
priority: P3
status: completed
depends_on: []
languages: [go, python, markdown]
goal: "The 64 MiB of evidence per proposal that finding intake enforces is defined in the limits registry and the findings specification with its failure outcome, and both proposal quotas (with LIM-FND-46) are held to one definition by a test."
context:
  review: "Out-of-scope finding of the hub audit fix batch, sent by the coordinator on 2026-10-12; verified on a07f5e9"
  specification:
    - "docs/spec/findings/findings.md#FND-R55"
    - "docs/spec/findings/findings.md#FND-R185"
  finding: >-
    internal/findingintake/service.go:25-28 defines maxProposalsPerRun = 4096
    and maxProposalEvidenceBytes = 64 << 20. The per-Run quota is now
    registered: V409-002 (1d1edc237195e7973e7c97d97645d9f5dc4ca92c) added
    LIM-FND-46 (docs/spec/platform/limits.md:442), FND-R185
    (docs/spec/findings/findings.md:528-536, invalid_finding_request, 400,
    permanent) and the 4,096-receipt case of FAIL-FND-1
    (docs/spec/platform/failure-model.md:380), and
    internal/findingintake/quota_concurrency_test.go covers concurrent final
    submissions, replay and rollback. The per-proposal evidence quota is
    not: a submission sums the sizes of its evidence refs and of a selected
    HTTP exchange and rejects more than 64 MiB as ErrInvalid "proposal
    evidence quota exceeded" (service.go:188-215), but FND-R55
    (findings.md:455-459) mentions it only in prose ("All evidence of a
    finding together remains under the existing 64 MiB quota") with no LIM
    row, no error code and no FAIL-FND-1 outcome; LIM-FND-32 bounds the
    complete private submission bytes, which is a different quantity (the
    evidence refs point at already stored Artifacts). No test pins either
    constant to its registry value: quota_concurrency_test.go uses the
    constant symbolically, so a changed constant passes, and no test reaches
    the evidence quota at all. Predates the shallow history (boundary
    6349621).
  siblings: >-
    The Runtime finding tools (runtime/src/contractor_runtime/toolsets/security_findings/facades.py:40-62
    and the code/HTTP variants) mention neither quota in their agent-facing
    docstrings. Registered neighbours: LIM-FND-10 (8 MiB proposal and
    report projection), LIM-FND-32 (64 MiB complete submission), LIM-FND-46
    (4,096 receipts per Run). V372-023 registers the findings tool error
    codes in errors.md; this task adds no tool code.
  revalidated: >-
    2026-10-24 on b523ae77: the per-Run proposal quota half of this task was
    delivered by V409-002 (LIM-FND-46, FND-R185, FAIL-FND-1 and the
    concurrency test) and is dropped from scope, except for pinning the
    constant to LIM-FND-46. The per-proposal evidence quota is still
    unregistered and untested. File references refreshed.
scope:
  in:
    - "A LIM-FND row and an FND requirement (or an amended FND-R55) for the 64 MiB per-proposal evidence quota: what it counts (stored evidence ref sizes plus the selected HTTP exchange), the error code and retryability the submitter receives, and the matching FAIL-FND-1 outcome."
    - "One definition: a test holds maxProposalsPerRun to LIM-FND-46 and maxProposalEvidenceBytes to the new row (or the constants are generated from the registry)."
    - "A PostgreSQL test of the evidence quota at 64 MiB and 64 MiB plus one byte."
    - "The agent-facing finding tool docstrings name the quota outcome where the model can act on it."
  out:
    - "Changing either bound."
    - "The per-Run quota's locking and counting (V409-002 decision, FND-R185)."
acceptance_criteria:
  - id: A1
    text: "limits.md and findings.md define the evidence quota with its code, FAIL-FND-1 names its outcome, and scripts/check_spec.py passes."
  - id: A2
    given: "A proposal whose evidence totals exactly 64 MiB, and one whose evidence totals 64 MiB plus one byte"
    when: "Both are submitted through the real intake"
    then: "The first is admitted and the second is rejected with the code and retryability the registry states, storing no receipt or Artifact."
  - id: A3
    text: "Changing either constant (to 4097 or to 64 MiB plus one) fails a test that names the registry row; on b523ae77 the same change passes every test."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 -tags integration ./internal/findingintake"
    covers: [A2, A3]
  - command: "cd runtime && uv run python ../scripts/check_spec.py"
    covers: [A1]
  - command: make lint
    covers: [A1, A2, A3]
