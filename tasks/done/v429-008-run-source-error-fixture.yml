schema_version: "1.0"
id: V429-008
title: Use a registered source Run-list failure fixture
milestone: ui-journey-usability
epic: ui
kind: chore
introduced_by: V429-005
priority: P3
status: completed
depends_on: [V429-005]
languages: [typescript]
goal: The source-list retry test models the real public API storage-conflict failure and passes the API registry guard.
context:
  authority: Discovered on 2026-11-01 during the user's authorized main merge and combined UI/API verification.
  specification: docs/spec/platform/errors.md#ERR-R14
  finding: >-
    ui/src/routes/runs/source-pane.test.tsx:278, introduced by 9a3be29ef,
    answers the unregistered storage_unavailable code. The real Run-list API
    documents retryable 503 storage_transaction_conflict. The registry guard
    fails, and the strict test helper converts this invented failure into a
    thrown fixture error instead of the intended storage-failure envelope.
  siblings: >-
    Search all UI source and browser tests for the same invented code. The
    single source-pane fixture is in scope; the Project missing-Workflow
    fixture on main was independently repaired by V429-004.
scope:
  in:
    - Use the registered retryable storage_transaction_conflict response in the source-list read/retry test.
    - Verify existing detail-retention/retry assertions, the full API-error package and combined UI/lint gates.
  out:
    - Production behavior, new API codes, Server data, model configuration and OpenDesign data changes.
acceptance_criteria:
  - id: A1
    text: The browser test-double registry guard accepts the fixture and no storage_unavailable copy remains.
  - id: A2
    text: The real-client source-list test still keeps detail accessible during failure and recovers after an explicit refresh.
tests:
  - command: go test -count=1 ./internal/apierror
    covers: [A1]
  - command: cd ui && corepack pnpm exec vitest run src/routes/runs/source-pane.test.tsx
    covers: [A2]
  - command: VITEST_MAX_WORKERS=2 make ui-verify
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2]
  - command: python3 scripts/check_tasks.py
    covers: [A1, A2]

verification:
  - >-
    The API registry guard failed against the original storage_unavailable
    fixture and passes after replacing it with retryable 503
    storage_transaction_conflict. The twelve real-client source-pane tests
    pass, including the actual Server message, retained detail and explicit
    refresh. No invented code remains in UI source/browser tests.
  - >-
    After integrating current main, VITEST_MAX_WORKERS=2 make ui-verify passed:
    218 files, 2682 passing tests and one existing expected failure; all 17
    static-server tests, generated client checks, formatting/lint, both
    typechecks and production build passed. Existing preview chunk warnings
    remain. The final targeted source-pane suite passed again after its message
    assertion was added.
  - >-
    make lint passed, including UI gates, Go checks, task/spec consistency,
    release-graph checks, Python formatting/layers, deployment/mesh fixture
    checks and 189 script tests with one existing skip. The complete
    internal/apierror package passed separately. The combined production build
    passed 57 browser cases across seven specs without skips or flaky retries.
  - >-
    Main integration preserves the reviewed UI version 0.10.33 and the current
    Workflow/API changes. The independent design-fidelity task was renumbered
    to V429-007 to preserve main's existing V429-004. New integration reports and
    screenshots were saved separately beside the preserved OpenDesign sources;
    original projects, conversations, files and recoverable backups are intact.
implementation_commit: f999bd2eda572ea356832d43110f65638998451b
