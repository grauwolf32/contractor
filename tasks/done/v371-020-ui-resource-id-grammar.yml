schema_version: "1.0"
id: V371-020
title: "Give the UI one ResourceId and Revision grammar and check revisions before If-Match"
milestone: hub-audit-defects-2026-10
epic: ui
kind: defect
priority: P3
status: completed
implementation_commit: 0131f6afd78064e0759da469a36cf62cee412ddb
depends_on: []
languages: [typescript]
goal: "Every UI module validates identities and revisions with one tested definition of the public ResourceId grammar, and the Git import checks its expected revision before it sends If-Match."
context:
  review: "Out-of-scope findings of the hub audit fix batch (groups G8 and G12), recorded 2026-10-12; verified on a07f5e9"
  specification: "docs/spec/api/public-api.md#API-R70"
  severity: low
  finding: >-
    The ResourceId grammar /^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$/
    (LIM-API-19) is written out twelve times under ui/src: api/workflows.ts:17
    (the untested RESOURCE_ID_PATTERN the finding names), api/audits.ts:10,
    api/artifacts.ts:12 (ARTIFACT_REVISION_PATTERN), api/operations.ts:31,
    api/projects.ts:14, api/queue.ts:32, api/error.ts:6, api/runs.ts:34,
    api/performance.ts:41, events/run-events.ts:6, events/socket.ts:5 and
    routes/inbox/model.ts:145, while Go has one definition guarded by a
    source scan (V368-024; AGENTS.md 3.1). Separately, importGitArtifact
    (ui/src/api/git-artifacts.ts:66-72) builds If-Match from
    draft.expectedRevision without checking it, while the Artifact upload
    (api/artifacts.ts:312-318), Projects, Queue and Audits check theirs
    first. All predate the shallow history (boundary 6349621).
  siblings: >-
    The 128-character subscription identifier (events/run-events.ts:7) is
    another rule and stays; the Idempotency-Key pattern is V371-016. Other
    If-Match senders: projects.ts:259-314, queue.ts:116-121,
    audits.ts:456-799 and artifacts.ts:312-318 check their value;
    operations.ts:875, 988 and 1002 and evals.ts:98 must be checked too.
    Configuration names already share one tested definition (V368-015).
scope:
  in:
    - "One exported UI definition of the ResourceId and Revision grammar, used by every module above and tested against the OpenAPI ResourceId and Revision schemas with a shared case list."
    - "importGitArtifact rejects an invalid expected revision before any request, and every If-Match sender checks its value."
  out:
    - "Rules with another bound: subscription identifiers and Idempotency-Keys (V371-016)."
acceptance_criteria:
  - id: A1
    given: "A Git import draft whose expectedRevision is outside the Revision grammar"
    when: "importGitArtifact is called"
    then: "It throws before sending a request."
  - id: A2
    text: "A test fails if a ui/src module other than the shared definition contains the ResourceId pattern."
  - id: A3
    text: "The shared definition accepts exactly what the OpenAPI ResourceId schema accepts for every shared case."
tests:
  - command: "cd ui && corepack pnpm test --run src/api src/events"
    covers: [A1, A2, A3]
  - command: "make ui-verify"
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
