schema_version: '1.0'
id: V411-027
title: Let model-driven Audit HTTP tools select credentials explicitly without seed preflight
milestone: autonomous-http-pentest-2026-10
epic: http-tools
kind: feature
priority: P1
status: completed
implementation_commit: 27af751d90648be6630e181d6e4d158c91a9c471
depends_on: [V411-003, V411-004, V411-029, V411-026]
languages: [go, python, sql, json, yaml]
goal: The LLM chooses HTTP requests from available materials and tools; explicit credential_id selects an Audit-authorized credential while the controlled transport enforces policy and accounting.
decisions:
- The private transport RPC is stop-only. Request fields are apiVersion, allocationId and expectedRuntimeInstanceId; response fields are apiVersion, allocationId, runtimeInstanceId and stopped=true. There is no startup run/status operation or seed/identity summary.
- Stop authority remains the exact mTLS Runtime principal plus allocation and Runtime process acknowledgement; the Server records its existing Run/Stage/principal/process stop marker before generic release. Counters never authorize cleanup.
- Evidence is internal/controlplane/pentest_lifecycle.go stopPentestTransport: it already validates allocation/process and stopped before recording the reservation's exact stop proof; it does not consume seed counters or identity summaries. Existing restart/wrong-process/unknown-stop lifecycle cases remain mandatory.
- Removing the obsolete counter fields removes their reporting bound instead of raising it. Target-request, action-intent, rate, concurrency and active-time caps remain in the durable action ledger.
- Persisted target authority uses the Scheduler's admitted Stage deadline (internal/scheduler/stage_preparation.go). Prepare RPC/storage calls still inherit their original context deadline; each later HTTP tool call has its own timeout, confirmed lease checks and grant deadline. Recording Stage authority must not replace or extend the prepare operation context.
- Explicit raw-value reads intentionally disclose the assigned material to the Worker context. Automatic transport/telemetry/journal/public projections stay content-free; arbitrary model-authored artifacts cannot provide value-level origin enforcement. The Audit author owns this choice; revisit when policy requires credentials to stay outside model context.
context:
  authority: >-
    User direction on 2026-10-30 removes the mandatory seed-by-identity startup
    traversal, lets the LLM choose requests from OpenAPI/sitemap/artifacts, and
    explicitly selects credential_id in http_request with a separate credential
    reading tool allowed to return values when needed.
  specification:
  - docs/spec/tools/http-caido.md#HTP-R137
  - docs/spec/tools/http-caido.md#HTP-R140
  - docs/spec/audits/execution.md#AUX-R104
  - docs/spec/execution/control-plane.md#CTL-R168
  - docs/spec/configuration/runtime-config.md#RCF-R184
scope:
  in:
  - Replace mandatory seed execution at prepare with allocation-owned controlled HTTP available to explicitly selected model tools.
  - Remove seed URLs from the engagement and private execution assignment; preserve exact target origins and declarative route scope.
  - Expose a bounded credential catalog and explicit value-read tool limited to credentials authorized by the immutable Audit assignment.
  - Extend http_request with explicit credential_id selection; omission sends no automatically inherited credentials.
  - Reuse the existing acknowledged transport, receipts, request/rate/concurrency caps, deadlines, DNS/TLS/peer protections and joined stop proof for dynamic requests.
  - Return bounded response data to the model through the HTTP tool while preserving existing observation/evidence classification.
  - Align specification, strict wire models, fixtures, task gates and real-store/process regressions.
  out:
  - Automatic login/refresh, implicit Project credential inheritance, credential search outside the current Audit, and fixed identity sweeps.
  - Trusted vulnerability proof, frozen replay recipes, browser execution and the pending V411-007/008/009 evidence chain.
requirements:
- id: R1
  text: Preparing or replaying a ready allocation emits no target request; only an explicit HTTP tool call can begin a target action.
- id: R2
  text: Every request, including redirect/retry, is scope-checked and journaled under the existing authority and budget; possibly sent or unknown writes are not repeated automatically.
- id: R3
  text: credential_id selects one exact authorized credential and isolated origin-scoped cookies. Missing/foreign credentials fail safely and cannot fall back to anonymous or implicit authentication.
- id: R4
  text: Credential values may be explicitly returned to the LLM by the authorized tool, as requested by the user; secrets remain absent from telemetry, durable journal metadata and public provenance.
failure_outcomes:
- operation: Prepare or close controlled HTTP tools
  permanent: Missing assignment/capability or unsupported selected tools fail before target I/O.
  retryable: Existing allocation and storage-conflict classification applies, without new target traffic.
  ambiguous: Allocation receipts and exact joined stop proof retain authority; readiness replay sends nothing.
  cancelled: Join every owned request before dropping private material and issuing stop proof.
  timeout: Request, control protocol and allocation lease retain separate bounded deadlines.
- operation: Execute model-selected HTTP request
  permanent: Invalid arguments, foreign credential or out-of-scope destination fail before request bytes; no auth fallback.
  retryable: Only the existing conservative bounded pre-send read retry is allowed; protocol redelivery reuses receipts.
  ambiguous: Preserve charged unknown action and refuse unsafe replay; response publication cannot trigger another send.
  cancelled: Join the real stream and settle the action under the existing bounded cleanup protocol.
  timeout: Clip each request and grant to active Audit and allocation authority; no fixed startup sweep deadline.
cardinality:
- collection: Authorized credentials and private sessions
  expected: One or a few explicitly selected accounts
  maximum: Existing engagement identity/reference/origin bounds and cookie count/byte caps
  bound: Resolve only exact held refs, list a finite assignment, and retain independent credential/origin jars.
- collection: Model-selected actions
  expected: A few bounded HTTP calls informed by OpenAPI or sitemap
  maximum: Existing Audit action-intent, target-request, rate, concurrency and byte budgets
  bound: One stable logical call identity and bounded physical attempts; no unbounded target discovery at prepare.
lifecycle:
- entity: Audit credential binding and allocation HTTP session
  delete: Existing exact credential holds prevent deletion while selected; journal rows follow Audit ownership.
  cascade: Cancellation, lease loss and release join tools/streams before erasing private state.
  retention: Runtime cookie state stays scoped to the allocation; public/durable action facts contain no credential values.
acceptance_criteria:
- id: A1
  given: A prepared Audit allocation with authorized credentials
  when: The Worker has not called an HTTP tool
  then: No target DNS/connect/request occurs; ordinary readiness and replay complete without seed execution.
- id: A2
  given: Model-visible HTTP and credential tools
  when: Calls select no credential, an authorized credential or a forbidden credential
  then: Anonymous calls inherit nothing, selected credentials apply only at authorized origins, and forbidden selections emit no target bytes.
- id: A3
  given: Dynamic URLs/methods/bodies, redirects, loss of acknowledgements and cancellation
  when: The real controlled transport executes
  then: Scope, exact accounting, conservative replay behavior, limits and joined cleanup remain enforced and model response data is bounded.
- id: A4
  given: Shared strict schemas and exact Audit credential references
  when: Go, Python and process readers consume the new contract
  then: All agree without seed or legacy startup variants, and private values do not escape telemetry/journal/public projections.
tests:
- command: make lint
  covers: [A1, A2, A3, A4]
- command: make verify-public-api test-wire-cross-language
  covers: [A1, A2, A4]
- command: go test -tags=integration -count=1 ./internal/contracts/... ./internal/credentials/... ./internal/auditservice ./internal/auditstore/internal/pgstore ./internal/controlplane ./internal/httpapi/public ./internal/persistence/postgres
  covers: [A1, A2, A3, A4]
- command: make test-http-caido-runtime test-pentest-http-process
  covers: [A1, A2, A3, A4]
implementation_notes:
- HTTP tools use one allocation-owned acknowledged transport. credential_id is a separate optional parameter; omission uses an independent anonymous jar without Project credential/checkpoint inheritance.
- The bounded catalog and explicit value-read tool expose only exact Audit-assigned immutable references. Credential reference IDs are unique within the assignment, so selection cannot depend on identity ordering.
- Dynamic method, request-body byte count and allocation-keyed opaque request/target fingerprints bind action receipts and redirect/retry continuations. Raw URL queries, expanded auth headers and request bodies stay out of the durable ledger.
- Preparation performs no target DNS/connect/request. Per-call timeouts include queue wait; admitted Stage authority is persisted separately from the shorter prepare operation context.
- Stop joins both physical requests and model-facing response processing, then clears credential jars and private response buffers before exact process acknowledgement. Interactive responses do not acquire trusted pentest evidence authority.
- Migration 60 refuses incompatible seed-era immutable pins before changing data; it preserves historical action attribution, charges and unknown holds. Only disposable test/scratch databases were migrated.
- Removed obsolete seed traversal, startup result/identity summaries and broad formatting-only fixture changes. Public Audit compatibility preflight remains a separate read-only admission operation.
