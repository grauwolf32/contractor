schema_version: '1.0'
id: V463-001
title: Export debug telemetry with simple known credential replacement
milestone: runtime-telemetry-2026-10
epic: operations
kind: feature
priority: P1
status: completed
implementation_commit: 289df746155d64156730b15e93e04c6a976e9c99
depends_on: []
languages: [go, python, typescript, json, yaml, markdown]
goal: >-
  An Audit or Run selecting debug exports useful bounded Worker and Planner
  content through its pinned RuntimeConfig. Exact known credential values are
  replaced with [REDACTED] before content enters exporter queues. A selected
  HTTP, Caido or execution tool no longer suppresses all Worker content.
demonstration: >-
  A configured local collector receives model and tool content with useful URL,
  request/result and ordinary text intact and supplied secret canaries absent.
  A Run without telemetry creates no exporter; an Audit debug selection is pinned
  and propagated to its child Runs by the existing configuration path.
context:
  authority: >-
    User decision 2026-11-09: remove ContentFreeInstrumentation and captureContent;
    debug controls telemetry through the existing label-to-RuntimeConfig mechanism.
    Keep only a simple lightweight replacement of known credential values. No
    field-name detection, HTTP parsing, dynamic secret discovery or encoded-secret
    inference. Implementation is explicitly requested; deployment is not assigned.
  specification:
    - docs/spec/platform/observability.md#OBS-R54
    - docs/spec/configuration/runtime-config.md#RCF-R84
  ownership: >-
    Existing credential resolution supplies execution-local secret material.
    Exporter-owned replacement precedes content encoding/queueing and covers
    Worker and Planner. No external service, model tool, persistent secret index
    or new store. Label names remain data; debug is the operator convention.
  evidence: tasks/evidence/v463-001-debug-telemetry-known-credentials.json
  previous_behavior: >-
    ContentFreeInstrumentation originated in 97990c278 and was extended to HTTP
    and Caido by 7886a72d8; factory declarations moved in 29d351b65. Invoice Lab
    run_05ff2e01d5a5ac5db816dc997a3f0056 retained only metadata despite configured
    content capture, preventing analysis of its 195 HTTP tool calls.
scope:
  in:
    - Remove captureContent end to end from public/private contracts, configuration, UI, generated clients and fixtures.
    - Remove ContentFreeInstrumentation and obsolete sensitive-output selection declarations.
    - Replace exact known credential strings in exporter content, metadata and errors before enqueueing; use matching fixtures shared by Go and Python.
    - Keep existing queue, byte, retry, cancellation and credential lifetime ownership.
  out:
    - Heuristic field detection, HTTP parsers, dynamic cookie/token discovery, encoded or transformed-secret matching.
    - New labels with hard-coded Runtime behavior, extra capture flags, journals or storage.
    - Model changes, scanner behavior changes, deployment and live pentest reruns.
requirements:
  - id: R1
    text: >-
      Telemetry configuration presence enables bounded content; absence disables
      export. Remove captureContent strictly without a compatibility reader. Keep
      ordinary Audit/Run label resolution, precedence and immutable pinning.
  - id: R2
    text: >-
      Replace every nonempty known credential string exactly, including short
      values and embedded occurrences. Case and Unicode are preserved. Apply
      longest original match first without reprocessing replacement text; mask
      string keys and values before serialization so escaping and truncation
      cannot bypass replacement. Unknown or transformed values remain unchanged.
  - id: R3
    text: >-
      Secret inputs come from existing scoped credential resolution, including
      configured target identities and exporter/model credentials. They stay in
      allocation or Planner memory and are released with that execution. Export
      neither secret registries nor secret digests. Do not change the model's
      requests, tool results or stored evidence while preparing telemetry copies.
  - id: R4
    text: >-
      Preserve useful content and current size/queue/deadline bounds. Optional
      capture/encoding failure drops the affected content or span under existing
      diagnostics and never sends its original content or fails execution.
failure_outcomes:
  - operation: Prepare and deliver telemetry
    permanent: Existing invalid configuration and non-retryable collector rejection remain classified; failed content encoding never falls back to raw content.
    retryable: Existing bounded OTLP retry retains only already sanitized bytes.
    ambiguous: Existing best-effort telemetry delivery applies; no target/model execution is replayed.
    cancelled: Existing flush and allocation cleanup join exporter work and release secret references.
    timeout: Existing export and flush deadlines remain authoritative.
cardinality:
  - collection: Known credential values and exported content
    expected: A few credentials and one bounded model or tool payload per span.
    maximum: Existing credential/settings bounds, 256 KiB content, 100000 visited JSON values at depth 64 (LIM-OBS-28) and existing queue span/byte limits.
    bound: Build one deterministic replacement matcher per exporter execution; serialize bounded content and sanitize before queuing, never enumerate unrelated credentials.
lifecycle:
  - entity: Execution-local telemetry replacement values
    delete: Owning allocation or Planner close releases references.
    cascade: Cancellation and shutdown use existing adapter cleanup.
    retention: No new persisted entity or retention policy; queued data contains sanitized content only.
acceptance_criteria:
  - id: A1
    given: Telemetry selected through an ordinary Run or Audit debug RuntimeConfig with HTTP tools
    when: Model and tools execute
    then: Useful bounded content reaches the collector; telemetry-disabled execution does not capture or export content.
  - id: A2
    given: Known short, overlapping, Unicode and JSON-escaped credential values in nested content and errors
    when: Worker and Planner export and retry spans
    then: Original credentials are absent from queued and delivered bytes, ordinary content survives and shared fixtures agree.
  - id: A3
    given: Current strict API, configuration and UI contracts
    when: Configurations are authored, resolved and transmitted
    then: captureContent and sensitive-output suppression are removed end to end; obsolete fields reject and generated clients match.
  - id: A4
    given: Size bounds, serialization errors, cancellation and collector failure
    when: Export and cleanup execute
    then: Existing limits and failure classifications remain intact with no raw-content fallback or model/tool behavior change.
tests:
  - command: make test-runtime
    covers: [A1, A2, A3, A4]
  - command: go test -race -count=1 ./internal/telemetry/... ./internal/runtimeconfig/... ./internal/scheduler/... ./internal/helpers/secretmatch/...
    covers: [A1, A2, A3, A4]
  - command: make ui-generate-check ui-lint ui-typecheck ui-build
    covers: [A3]
  - command: cd ui && corepack pnpm test --run --maxWorkers=1
    covers: [A3]
  - command: cd ui && corepack pnpm test:server
    covers: [A3]
  - command: make verify-public-api test-wire-cross-language
    covers: [A2, A3]
  - command: make lint
    covers: [A1, A2, A3, A4]

implementation_notes:
  - Known match values are passed only to the telemetry adapter; ordinary Worker settings still omit target identity material.
  - Exact replacement is limited to telemetry data strings; protocol vocabulary and trace identities are not arbitrary content.
  - Existing RuntimeConfig documents containing captureContent must be republished under new identities/versions before deployment; no compatibility reader or live-data rewrite is introduced here.
  - Full Runtime pytest first passed 6118 cases with 135 declared skips; the completion guard exposed one obsolete suppression-test reference, replaced with the required credential-redaction regression before final verification.
  - Python replacement uses execution-local literal match state without process-global regular-expression caches.
  - All 223 UI files pass with one worker and original timeouts/assertions; parallel runs exposed timing failures in unchanged Inbox/evidence tests.
verification_results:
  - All declared gates passed; dedicated test PostgreSQL database was removed.
  - Runtime 6119 passed and 135 declared skips; final literal-replacement follow-up 36 passed.
  - UI 223 files and 2512 tests passed with one worker; one pre-existing expected failure, plus 17 Node server tests passed.
  - Public API/wire shared gate passed with 380 fixtures; optional disk-heavy skip is not passing coverage.
  - Implementation remains on codex/debug-telemetry-known-secrets; main merge and demo deployment are not performed.
