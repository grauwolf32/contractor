schema_version: '1.0'
id: V397-008
title: Render deterministic validated generic SARIF from frozen snapshots
milestone: finding-sarif-export-2026-10
epic: findings
kind: feature
priority: P2
status: completed
depends_on:
- V397-007
languages:
- go
- markdown
goal: Deliver this proposal 0028 SARIF stage through production callers with deterministic bounded work, exact evidence and every selected finding
  retained in the snapshot; SARIF duplicate expansion is controlled by includeDuplicates.
context:
  audit_export_authority: >-
    User direction on 2026-10-29: separate export and download by Audit.
    One request, snapshot and SARIF belong to exactly one owner-authorized Audit;
    never combine findings or decisions from different Audits in one file.
    Audit identity comes from the route, not a caller-supplied source list.
  duplicate_export_authority: >-
    User direction on 2026-10-30: make duplicate inclusion a parameter.
    includeDuplicates defaults to false; true exports all selected findings.
    Group only selected identities by the existing qualified automatic key or
    explicit same-Audit manual duplicate links; preserve all independent
    decisions and evidence in the immutable snapshot and never select peers
    from another Audit or infer equality from similar text.
  request: User requested SARIF work on 2026-10-22 alongside deterministic correlation.
  proposal:
  - docs/proposals/0028-finding-analysis-and-sarif.md#rule-rating-and-sarif-mapping
  - docs/proposals/0028-finding-analysis-and-sarif.md#unchanged-worker-tool-contract
  specification:
  - docs/spec/findings/findings.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/limits.md
  - docs/spec/api/public-api.md
  revalidated: >-
    2026-10-30 after V397-007 (c37fa36c2527f504707a13a7c4b374566cd726f6):
    immutable Audit snapshots, includeDuplicates, atomic publication/download
    and CLI callers are complete. The reachable base renderer explicitly
    reports structured_projection_pending; full source/flow/rule/taxonomy
    mapping and locally pinned schema validation remain this task.
  verification_boundary: >-
    This task changes pure Go rendering and its fixtures, not Runtime tools,
    public HTTP field shapes or UI implementation. Run full changed Go packages
    and real-store/API/CLI consumers, shared/public gates and lint. V397-007
    records the complete unchanged UI transport/browser proof; V397-009 runs
    the full UI gates for its new selection/toggle flow.

scope:
  in:
  - One Audit per frozen snapshot and SARIF run; preserve independent results through separate Audit exports.
  - Pure Go generic SARIF 2.1.0 renderer with locally pinned official schema and semantic validation, no export-time downloads.
  - Truthful code/partial-flow/HTTP-only/no-analysis output, separate native/analyst severity, qualified fingerprints, deterministic ordering
    and bounded diagnostics.
  out:
  - Cross-Audit combined files and ordinary-Run/direct-receipt export outside an Audit; contributions remain supporting evidence of selected Audit findings.
  - Model tool schema changes, automatic review mutations, content-based heuristic merging, global issue/receipt stores and model-authored
    export assembly.
  - GitHub upload/profile, source maps, suppression/fix sync, security-score classification and complete-scan/remediation inference.
requirements:
- id: R1
  text: Pure Go generic SARIF 2.1.0 renderer with locally pinned official schema and semantic validation, no export-time downloads.
- id: R2
  text: Truthful code/partial-flow/HTTP-only/no-analysis output, separate native/analyst severity, qualified fingerprints, deterministic ordering
    and bounded diagnostics.
- id: R3
  text: Preserve every selected identity and independent Audit triage/rating/origin in the snapshot; includeDuplicates defaults to false and emits one selected representative per explicit duplicate group, while true emits every selected result; keep all Worker tool declarations/results unchanged and
    use exact frozen evidence without guessed joins.
- id: R4
  text: Update owning contracts/shared fixtures and add a production caller for every export in the same change; pure rendering never performs
    model/network/storage work.
failure_outcomes:
- operation: Render deterministic validated generic SARIF from frozen snapshots
  permanent: Invalid/foreign input, stale selection, changed key and invalid evidence/profile/size use existing classified non-disclosure/conflict/validation
    errors with bounded diagnostics and no partial publication.
  retryable: Existing finite storage retry bounds and 503 storage_transaction_conflict with Retry-After; deterministic invalid content is permanent.
  ambiguous: Reconcile the same existing Artifact publication key/receipt before retry; reads/rendering repeat from the same frozen inputs.
  cancelled: Cancel and join resolution/render/transaction work before cleanup; roll back uncommitted writes and reconcile uncertain commits.
  timeout: Independent existing finite read/publication budgets and proposal aggregate caps, without model or external lookup.
cardinality:
- collection: Explicit selected findings, exact evidence and analysis/export bytes
  expected: Small explicit selections with several contributions per finding.
  maximum: Proposal collection/analysis per-object limits and 16 MiB snapshot/SARIF caps; no Cartesian-product assumption.
  bound: Page/batch explicit reads, validate archive/document/flow and aggregate bytes, and never scan an entire parent or fetch unselected evidence.
lifecycle:
- entity: Ordinary analysis/snapshot/export artifacts and existing publication bindings
  delete: Existing owner Artifact/Run/Project lifecycle authority; no new delete blocker.
  cascade: Existing parent purge and blob GC; failed publication leaves no partial success.
  retention: Frozen versions/decisions/correlation remain historical, with replay preserving original output after later triage/source deletion.
acceptance_criteria:
- id: A1
  given: Authorized code/HTTP/no-analysis findings, duplicate observations and independent Audit results.
  when: The production stage resolves, freezes, renders or publishes its specified inputs.
  then: Every selected typed identity survives in the snapshot with exact evidence and separate ratings, while the frozen includeDuplicates option controls SARIF result grouping; no LLM or Worker schema/result change occurs.
- id: A2
  given: Invalid/foreign/stale inputs, maximum sizes, concurrent changes, cancellation and lost publication responses.
  when: Real store/process paths handle each outcome.
  then: Classified bounded diagnostics, no partial success and exact existing-key reconciliation hold without guessed inputs.
- id: A3
  given: Golden fixtures, reproducible frozen inputs and complete touched-package/shared/public/UI consumers.
  when: All required gates run with a disposable PostgreSQL URL.
  then: Deterministic output, production callers and public operation coverage are proved, without skipped database tests.
tests:
- command: go test -count=1 ./internal/findinganalysis ./internal/findingexport/...
  covers: [A1, A2, A3]
- command: go test -tags=integration -p=2 -count=1 -timeout=20m ./internal/findingintake ./internal/auditservice ./internal/httpapi/public ./internal/publicclient/... ./internal/cli
  covers: [A1, A2, A3]
- command: make test-wire-cross-language verify-public-api
  covers: [A1, A2, A3]
- command: make lint
  covers: [A3]

verification_scope:
  authority: "User decision on 2026-10-29: continue SARIF with complete checks of touched packages; record the full Runtime gate as a limitation."
  full_runtime: "The macOS full run was interrupted after 11 failures, 3257 passes and 5 skips; failures were outside SARIF, including known V401-007 platform cases and pentest identity socket tests. No complete Runtime pass is claimed."
  linux_attempt: "A local Podman VM was available, but package repositories returned HTTP 403 while preparing an isolated Linux runner; no Linux pass is claimed."

