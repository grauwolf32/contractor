  - command: python3 scripts/release_test_reports.py verify-iterative-postgres --report .local/audit-iterative-gate/postgres-eap0qr7s/go.jsonl
    result: Passed reuse of the actual executed PostgreSQL report without rerunning its cases.
  - command: python3 scripts/release_test_reports.py verify-iterative-process --report .local/audit-iterative-gate/process-eva45y52/go.jsonl
    result: Passed reuse of the actual executed process report without rerunning its cases.
  observations: >-
    Development fixture failures, the initial full-owner stale-claim observation
    and successful isolated/full repeats are retained in the evidence. The
    passing repeat objectively records a 566.878-second wall/monotonic clock
    discontinuity; it is consistent with lease expiry after host wake but
    cannot conclusively explain the initial un-timestamped failure. No
    production lease or assertion was weakened. Reopen diagnostics under the
    test/infrastructure owner if it repeats on a stable awake host, capturing
    database clock, expiry, holder and epoch before changing lease semantics.
    A later lint run failed because standard-library files disappeared from
    the temporary Go tree. The identical Go 1.26.9 archive was recovered with
    its official SHA-256 in an ignored task cache outside /tmp, and all
