  replan_history: Deferred on 2026-09-20 outside the delivered OpenAPI/preparation slice; the original
    deferral record is preserved. The 2026-10-24 review at b523ae77 confirmed that this iterative capability
    was still absent. The initial proposal 0045 plan retained deferral; the user subsequently queued this reviewed task as pending. Completed
    V62 preparation/API/UI/release tasks and their original milestone remain unchanged.
  ownership: Generic iterative Audit composition owns these contracts. V64-001 defines research contracts,
    V64-003 owns opt-in research lifecycle, V64-004 consumes exact context, V64-006 owns the base research-to-ordinary-AuditItem
    adapter, and V64-018 adds only its pentest specialization. These are consumers, not dependencies of
    generic V62.
  boundary: The generic source descriptor carries typed accepted origin and exact retained content. Finding
    receipt/ordinal is required only for a finding-intake origin; a domain adapter must prove every other
    origin. V411-012 and future research context/admission reuse this transport without a V64 dependency.
scope:
  in:
  - Define strict named retained-dependency manifests for exact Audit baseline, prepare output, accepted
    item result and explicitly accepted plan/input sources.
  - Wire manifest validation/retention into the existing accepted item/task-package builder and retained-dependency
    resolution into actual Run preparation/dispatch, preserving original source mappings.
  - Resolve all required explicitly declared dependency closure before the consumer becomes schedulable,
    with bounded work and exact configuration/Skill content digests where those are selected inputs.
  - Register new holders with V410-010 and existing Audit purge; exercise source deletion, eviction races,
    restart, cancellation and ambiguous fork outcomes.
  out:
  - Cross-owner/cross-Audit lookup, live Project search, latest fallback, arbitrary recursive traversal
    of references embedded in JSON, or a new hold/receipt service.
  - Hypothesis semantics, source-mode policy invention, new model authority, role routing (V62-007), pentest
    recipes/proof (V411-012) or changes to generic same-Round retained-output.
deliverables:
- path: internal/auditdomain
  description: Exact source-origin/dependency manifest validation and canonical fixtures.
- path: internal/auditservice
  description: Production accepted-item manifest retention and source ownership validation.
- path: internal/auditcontroller
  description: Actual declared retained-dependency resolution and consumer forks.
- path: internal/auditstore
  description: Indexed source associations, holder acquisition/release and purge integration.
- path: internal/config
  description: Strict retained-dependency mapping compatibility and current-profile regressions.
- path: docs/spec/audits/scans.md
  description: New mapping contract with exact closure, failure, limit and lifecycle definitions.
acceptance_criteria:
- id: A1
  given: A later-round item from the existing receipt adapter with exact prepare and accepted first-round
    result inputs
  when: The production item builder and Run preparation reader materialize retained-dependency inputs
  then: The consumer receives precisely those bytes and mappings after producer Run deletion/current binding
    changes; no arbitrary prior-role lookup or preparation rerun occurs.
- id: A2
  given: Registered trusted origin variants, a finding source without its required receipt/ordinal, and
    self-declared/foreign origins
  when: Manifest validation runs
  then: The finding source requires its identity while other valid registered origins are not forced to
    invent receipts; unsupported or foreign variants are rejected without dispatch.
- id: A3
  given: Batches/retries, embedded JSON refs, denied or mixed-provenance context and incomplete required
    closure
  when: Inputs are admitted and materialized
  then: Only explicitly enumerated authorized exact dependencies are supplied; omitted closure, incompatible
    media and unsupported projection block affected work with precise reasons and no latest fallback.
- id: A4
  given: Concurrent history eviction, source deletion, lost retention/fork replies and cancellation
  when: Real PostgreSQL admission/materialization and cleanup race
  then: Exactly one valid ordering retains sources or reports unavailable; replay causes no duplicate
    hold/evidence charge/Run and work joins before release.
- id: A5
  given: Maximum manifests and a large unrelated holder population
  when: Admission, dispatch and populated Audit purge execute with deterministic work counters
  then: All row/byte/statement/purge bounds hold; complete accepted closure survives until proper release
    and no orphan reader/hold remains.
- id: A6
  given: Ordinary direct Runs and existing Audit mappings without retained-dependency
  when: Existing preparation, same-Round consumption, retry and cancel scenarios run
  then: Their mapping semantics and lifecycle outcomes remain unchanged and they require no research entity
    or new source adapter.
