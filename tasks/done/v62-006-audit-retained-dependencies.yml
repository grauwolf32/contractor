test_prerequisites:
- Disposable PostgreSQL is mandatory for store cases. Set CONTRACTOR_TEST_DATABASE_URL; absent or unreachable
  required infrastructure, skipped mandatory cases and zero matched tests fail the dedicated gate.
- Tests use isolated testdata, not the live configs tree. Process cases use actual Server/Runtime and
  scripted local model/provider fixtures; no paid models or live targets are needed.
- Run the complete suites of every touched package. Shared schema changes update every reader, owning
  numbered specifications, limit/error/lifecycle registries and cross-language fixtures in the same implementation
  change.
verification_requirements:
- Assert exact original/retained/consumer refs and digests, actual production callers, indexed holder
  acquisition against eviction and absence of current-binding fallback. V410-010 generic retention gates
  remain mandatory prerequisite evidence.
- No new source-origin implementation is added only for tests. Exercise existing receipt-origin and baseline/prepare
  accepted origins; V64-006 introduces the base research origin with its real ordinary-AuditItem caller,
  and V64-018 adds only pentest-specific validation and proof/replay integration.
requirements:
- id: R1
  text: An accepted manifest binds owner/Audit/baseline, dependency name/kind, exact source and retained
    refs/digests, source execution/Round/item/attempt where applicable, and a trusted accepted origin.
    Finding receipt/ordinal is one origin, not a universal required field. Reject self-declared or undeclared
    origin variants.
- id: R2
  text: Validate accepted source membership, exact payload/media type, source classification and consumer
    authorization before retention/dispatch. Shared metadata is not authority. Domain adapters supply
    approved source-mode projections; unknown or mixed provenance cannot be relabelled safe by the transport.
- id: R3
  text: Enumerate the complete required dependency closure explicitly with bounded descriptors; JSON refs
    are neither recursive loading instructions nor grants. An accepted plan pins source-to-retained-to-consumer
    mapping and exact content digests, including selected guides/Skills/config closure rather than name/version
    alone.
- id: R4
  text: Use V410-010 existing protected-binding/holder lifecycle to acquire exact obligations atomically
    against eviction. Registers and readers of any new JSON-backed authoritative refs ship in this task.
    Existing Audit retained bindings and lineage own storage; no extra hold table or lease.
- id: R5
  text: Add retained-dependency as a strict declared input source and wire the existing item/task-package
    production path and Run preparation reader in this change. Resolve only from the accepted manifest;
    never select a current Project binding or arbitrary prior role/batch/attempt. A no-manifest ordinary
    check keeps existing mappings.
- id: R6
  text: Preserve prepare-output reuse and same-Round retained-output contracts. Selected dependencies
    can survive source Run deletion and cancellation; independent retained copies remain after producer
    cleanup until their owning Audit lifecycle releases them.
- id: R7
  text: Distinct retained exact revisions consume existing evidence accounting once; manifest/closure
    count and byte limits below apply before acceptance. Partial retained work may be durable under existing
    staged retention recovery, but cannot publish a successful accepted item or make its Run schedulable
    before the whole declared closure is valid.
failure_outcomes:
- operation: Validate and retain an accepted dependency manifest
  permanent: Foreign/unaccepted origin, ambiguous attempt, invalid schema/digest/media, unauthorized projection
    or closure overflow produces a durable permanent rejection or unavailable/blocked disposition. Shared
    artifact_history_protected is permanent; no new public endpoint is added.
  retryable: Existing bounded storage_transaction_conflict/503 and V410-010 maintenance-backpressure retries
    apply within the original admission deadline; no unbounded revalidation loop.
  ambiguous: Reconcile the same accepted item/manifest and keyed mutation identity; verify exact retained
    descriptors and finish only missing retention work without repeating an append or evidence charge.
  cancelled: Owning Audit fences acceptance and joins current retention work before cleanup; accepted
    holds remain for terminal collection and normal deletion.
  timeout: Manifest admission and retention use the existing finite admission/collection allowance, independent
    of target requests and model work.
- operation: Materialize accepted exact dependencies into a child Run
  permanent: Missing/evicted/corrupt/denied sources fail input preparation explicitly; never refresh to
    latest or turn a missing dependency into an empty success.
  retryable: Ordinary finite Run input preparation/store retries preserve the exact manifest and fork
    intent; protected-history capacity conflict is not retried automatically.
  ambiguous: Read/reconcile the existing exact fork/source mapping and child-Run intent. A response lost
    after commit cannot create another child or replay target activity.
  cancelled: Join all fetch/fork work before release and use existing cancellation/drain; no orphan work
    or authority remains.
  timeout: The input materialization deadline owns storage work; expiration does not reset the target
    execution budget or mint a new admission identity.
cardinality:
- collection: One accepted item dependency manifest and its explicit closure
  expected: A few named inputs and 1-16 exact dependency descriptors.
  maximum: Proposed 32 exact descriptors and 256 KiB encoded manifest per item; tighter existing binding
    mapping, item-package and evidence bounds apply.
  bound: Validate every descriptor and full closure before acceptance. Source payloads remain separate;
    consumer reads follow ordinary bounded artifact access. DescribeExact uses at most 32 refs per statement.
- collection: Dependencies across one admission/materialization slice and its owning Audit
  expected: One selected item or a small compatible batch, within an Audit with many settled items.
  maximum: Existing Audit item limits and 1,024 retained-link per-call cap; each slice at most 128 primary
    records, 512 total descriptors and 1 MiB metadata, whichever is tighter.
  bound: Indexed selected-item/accepted-source reads only; stage bounded exact retention work under existing
    identity when necessary. Never split final accepted-item visibility or make a partially materialized
    child schedulable.
- collection: Retained payloads and source holder population
  expected: Shared evidence reused by later items while the containing Project has unrelated artifacts.
  maximum: Existing profile maxEvidenceBytes, ArtifactStore payload/history limits and ordinary RunScope
    insert ceiling.
  bound: Account distinct retained revisions once, use indexed holder checks, and test at least 2,000
    unrelated bindings plus the maximum manifest. No payload or all-domain-JSON scan determines availability.
lifecycle:
- entity: Accepted item dependency manifest, exact retained copies and consumer forks
  delete: Audit deletion after drain releases owned obligations; producer Run deletion cannot remove accepted
    retained dependencies.
  cascade: Audit purge covers every manifest relation and holder acquisition, including incomplete admission;
    child Run purges its local forks independently. Shared versions remain until their final legitimate
    reference is removed.
  retention: Accepted manifests and source mappings are immutable through retries and cancellation; no
    TTL, no quota refund or latest substitution. Receipt retention is not itself an artifact hold.

