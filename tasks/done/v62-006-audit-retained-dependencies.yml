  proposal:
  - docs/proposals/0045-audit-hypothesis-search.md
  - docs/proposals/0033-autonomous-pentest-audits.md
  design: docs/plans/2026-09-20-audit-workflow-composition.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/scans.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
