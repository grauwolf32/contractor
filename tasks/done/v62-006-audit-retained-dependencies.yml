  - command: cd runtime && uv run pytest -W error tests/test_audit_retained_dependencies.py tests/test_audit_result_collector.py tests/test_audit_results_*.py tests/test_audit_completion_*.py tests/test_contracts.py tests/test_performance_contracts.py tests/test_artifacts.py tests/test_run_artifacts_toolset.py tests/test_security_findings_toolset.py tests/test_shared_memory_reservation.py tests/test_shared_round_results.py
