  - command: make test-wire-cross-language verify-public-api
    result: passed; 281 fixtures, 331 Go and 229 Python shared tests, 1287 selected Python tests and complete selected public-operation coverage.
  - command: CI=true UV_OFFLINE=1 make lint
    result: passed, including layers, test-only exports, task/specification inventories and release-graph guard.
  - command: CI=true UV_OFFLINE=1 make ui-verify
