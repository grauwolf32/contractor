  focused_fixed: >-
    Public NUL and opaque Git-key tests passed with real PostgreSQL. Private
    decoder/intake/error/bytea round-trip regressions passed with real
    PostgreSQL. Literal backslash-u0000 is accepted by real stores and the same
    idempotency keys remain available after rejection.
  remaining: []

