verification_notes: >-
  Verified and merged on 2026-11-09. The two-parent merge preserves all 42
  main-only paths byte-for-byte and all 121 scanner-only paths byte-for-byte or
  as the original deletion, apart from three recorded reference-only remaps.
  Both main trace workspace validation and scanner success-to-failure transitions
  survive the automatic Go merge. All declared PostgreSQL/race packages passed;
  Finding intake completed in 181.046 seconds. Findings process gate passed all
  16 mandatory cases, including actual trace coordinates, and its 285 Runtime
  contracts. Actual installed Nuclei/SQLMap scanner Finding acceptance passed
  in 175.840 seconds: the 1000-template pack retained a 488417-byte manifest,
  1851-byte evidence and exactly one Finding. Combined wire/API/config checks
  passed 375 fixtures with 422 Go and 269 Python shared tests, 390 contract-model
  cases and all shipped configurations. One optional disk-heavy wire case was
  skipped and is not passing coverage. make lint passed. The full isolated Runtime
  gate passed 6080 tests, zero failures/errors and 135 optional/platform skips
  in 403.95 seconds; Runtime report verification passed. Main was fast-forwarded
  to the verified merge only after all checks passed and after validating its
  expected previous head and clean checkout. Six unrelated primary file hashes,
  modes and staged-index hash match the preservation snapshot before and after
  advancing main. All three owned disposable databases were removed. Remote
  push, live models and deployment were not run.
