acceptance_criteria:
  - id: A1
    text: Main includes both exact parent revisions through a no-fast-forward merge; only the verified baseline remains and its evidence checksum matches.
  - id: A2
    text: Combined real PostgreSQL persistence, Planner and restore suites, wire contracts and lint pass; disabled heavy-I/O cases remain explicit skips.
  - id: A3
    text: Unrelated primary files and index retain their original hashes and modes, task delivery is recorded and the owned disposable database is dropped.
tests:
  - command: go test -tags=integration -count=1 ./internal/persistence/... ./internal/planner/streamline ./tests/integration/restore
