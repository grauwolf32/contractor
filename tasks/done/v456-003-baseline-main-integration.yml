  - command: make -o runtime-venv test-wire-cross-language
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2, A3]
  - command: python3 scripts/check_tasks.py
    covers: [A1, A3]

verification:
  - The parents share changes only in generated tasks/BACKLOG.md; it was regenerated from both task sets. All 103 paths changed only by newer main retain their exact committed content.
  - The folded baseline is the only SQL migration and retains the SHA-256 in tasks/evidence/v456-001-schema-equivalence.json. Main added no schema changes after the pinned fold source.
  - The complete listed persistence, Planner streamline and backup/restore package command passed against real PostgreSQL on the combined tree.
  - The wire gate passed 374 fixtures with 418 Go and 266 Python shared tests and 390 separate Python contract-model cases. One optional disk-heavy case remains a skip, not passing coverage.
  - make lint passed with the locked Runtime environment and pinned cached tools in offline mode, including generated contracts, layers, release graph, task/spec, schema/ERD and Runtime import checks.
  - The six primary tracked/untracked file hashes and modes and the staged index match the recoverable snapshot in /private/tmp/contractor-v456-evidence/main-integration/primary-preservation.json.
  - Full release-verify, live models, optional heavy I/O, deployment and remote push are outside this integration.
  - Main advanced to the prepared merge with the expected two parents, and all primary content, modes and staged entries remained unchanged afterward.
  - The owned contractor_v456_merge database had zero sessions after the gates stopped and was explicitly dropped.
