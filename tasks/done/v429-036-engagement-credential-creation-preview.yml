schema_version: "1.0"
id: V429-036
title: Add inline credentials and all-method defaults to the engagement preview
milestone: ui-journey-usability
epic: ui
kind: feature
priority: P2
status: completed
implementation_commit: e9cf0fe513dae503e99c82745d64e0ee2424374e
depends_on: [V429-035]
languages: [html, css, javascript]
goal: The user can add a matching credential while configuring an identity and starts each new route with all supported HTTP methods selected.
demonstration: Open the retained OpenDesign preview, add a synthetic Bearer, Basic or cookie credential from an identity, use its metadata reference, then add an allowed or excluded route and narrow the initially complete method selection.
context:
  authority: User 2026-11-06 requests credential creation and all methods allowed by default in the current engagement editor preview. Existing instructions preserve all original OpenDesign data and consistent typography/themes.
  specification: [docs/spec/audits/audits.md#AUD-R241, docs/spec/configuration/runtime-config.md#RCF-R184]
  format: api/v1alpha1/engagement.schema.json
  design: docs/design/ui/README.md
  main_merge_authority: User 2026-11-06 explicitly requests merging the reviewed design branch into main; production API integration remains outside this delivery.
  boundary: This extends the local design preview only. Existing Runtime credential creation owns real write-only material and metadata; engagement stores references only. Method defaults are an authoring choice, not a change to Server admission or existing saved policies. Original native CSS and inputs remain unchanged.
scope:
  in:
    - Add credential action next to each non-anonymous identity credential picker, with a matching-kind dialog and synthetic metadata-only result.
    - Basic username/password, Bearer token and bounded cookie name/value rows, local validation, cancel/Escape, focus restoration and no secret retention after submit or dismissal.
    - Derive complete initial method selections from the shared schema for the demo policy and all new allowed/excluded routes; keep individual choices editable.
    - Responsive three-theme review, exact non-secret export checks and preserved native artifacts.
  out:
    - Live credential/API writes, target traffic, production transfer, main merge or changes to pending full HTTP Audit/API/CLI tasks.
requirements:
  - id: R1
    text: A new credential is created in the selected identity's kind and immediately selected; duplicates and invalid IDs are refused without changing an existing reference.
  - id: R2
    text: No secret field reaches policy JSON, browser persistence, logs or requests; forms clear material after every submit and dismissal. Preview success explicitly describes ephemeral demo metadata.
  - id: R3
    text: Every new route selects the shared schema method enum initially; deselection remains explicit and removing every method yields a validation error.
failure_outcomes:
  - operation: Local credential creation example
    permanent: Show field errors for missing material, duplicate/invalid ID or exhausted bounded catalog; keep identity and policy drafts unchanged and clear entered material.
    retryable: The user can correct metadata and re-enter test material; no automatic retry exists.
    ambiguous: No remote mutation exists and no API save is claimed.
    cancelled: Cancel or Escape clears form material and restores focus without adding metadata.
    timeout: No network or background work is launched.
cardinality:
  - collection: Preview credential metadata and cookie rows
    expected: Three existing synthetic credentials and one added credential with one cookie pair.
    maximum: One dialog, 200 local metadata items and at most 128 cookie pairs per the existing credential contract; route method count comes from the schema.
    bound: Local bounded array operations only; no credential secret reads or paginated production collection is introduced.
lifecycle:
  - entity: Local credential form and added metadata
    delete: Discard material immediately after submit/dismissal; metadata disappears on preview reload.
    cascade: Cancel changes no identity reference; successful local creation selects only a safe matching reference.
    retention: Retain original native CSS/inputs and review captures; never retain credential material.
acceptance_criteria:
  - id: A1
    given: An editable named identity and the synthetic credential catalog.
    when: The user creates matching Basic, Bearer or cookie credentials, cancels, or submits invalid metadata.
    then: The modal is usable at phone/desktop widths, preserves policy drafts, restores focus and selects only successfully added demo metadata without retaining material or claiming a live save.
  - id: A2
    given: The normal demo policy or a newly added allowed/excluded route.
    when: It renders and the user narrows or clears methods.
    then: All schema-supported methods start selected, individual changes persist and an empty selection is invalid.
  - id: A3
    given: All responsive states and original native artifacts.
    when: Verification and visual review complete.
    then: Schema-valid exports contain references only, no forbidden requests/browser errors occur, native source hashes match and the preview opens directly.
tests:
  - command: node docs/design/ui/experiments/engagement-editor-opendesign-2026-11-06/verify.mjs
    covers: [A1, A2, A3]
  - command: >-
      cd runtime && uv run python -c 'from pathlib import Path;
      from contractor_runtime.contracts.engagement import Engagement;
      Engagement.model_validate_json(Path("../docs/design/ui/experiments/engagement-editor-opendesign-2026-11-06/review/exported-policy.json").read_text());
      print("Exported policy accepted by the shared Runtime contract")'
    covers: [A2, A3]
  - command: python3 scripts/check_tasks.py
    covers: [A1, A2, A3]
  - command: python3 scripts/check_spec.py
    covers: [A1, A2, A3]
  - command: git diff --check
    covers: [A1, A2, A3]
verification:
  results:
    - The browser verifier passed 107 layout/state checks plus matching-kind credential creation for Basic, Bearer and cookies across three themes and desktop/390/320 widths; browser errors and forbidden requests were empty.
    - Duplicate/invalid IDs, missing material, empty cookie values, cancel/Escape, focus restoration and reload cleanup passed. Every submit cleared material; exact JSON downloads contained metadata references only.
    - All-method defaults, independent narrowing, empty-selection validation and new allowed/excluded route choices passed against the actual engagement schema enum.
    - The exported policy passed the existing Runtime Engagement.model_validate_json contract. Task/spec validators and git diff --check passed.
    - Original native CSS and inputs are unchanged. Host-only modal/preview changes were visually reviewed, including mobile cookies; the existing user-facing tab was refreshed and left open at identities.
  artifact: docs/design/ui/experiments/engagement-editor-opendesign-2026-11-06/verification.json
  delivery: Merged into local main through the user-requested no-fast-forward integration on 2026-11-06. Reconciled main passed make lint, all 107 preview layout/state checks and Runtime export validation; credential creation remains an explicitly simulated local preview with no live API or target calls.
