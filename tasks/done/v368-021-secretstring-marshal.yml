schema_version: "1.0"
id: V368-021
title: "Stop SecretString from marshalling its plaintext"
milestone: hub-audit-defects-2026-10
epic: runtime-config
kind: defect
priority: P2
status: completed
implementation_commit: "068b841f1e968ffc12dd80a33aba9ea5e8f2cade"
depends_on: []
languages: [go]
goal: "Marshalling RuntimeSettings with json.Marshal never contains the secret."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), exec-state D secrets; file:line as of 02bbdcbf, re-verify on current main"
  specification:
    - docs/spec/platform/security.md#SEC-R88
  finding: >-
    contracts.SecretString.MarshalJSON emits the plaintext
    (contracts/common.go:195); any future json.Marshal of RuntimeSettings
    into a log or the database leaks a secret and nothing tests it.
  siblings: >-
    Every Go JSON path that encodes a SecretString was checked. Changed:
    the Control Plane prepare request (controlplane.postJSON marshalled it
    with json.Marshal), and scanplan, which round-trips Options through JSON
    in normalizeOptions and digests them for PreparationDigest; both
    now encode an explicit revealed form, so scan authentication and the
    existing digest identity (TestPrepareStableIdentityAndExactInputProvenance)
    are unchanged. The golden fixture codecs for AllocationSpec and
    RuntimeSettings and the AllocationSpec composition test now use the wire
    encoder. Not affected: the telemetry, Planner, credential and app types
    holding a SecretString are never JSON-encoded. Python (outside this
    task's languages): the Runtime's RuntimeSettings serializers still write
    plaintext in model_dump_json, which production uses only for the keyed
    HMAC allocation fingerprint (allocation/identity.py); redacting by default
    there needs a serialization context and is reported as a follow-up.
  decision: >-
    Guarantee: default JSON encoding of any value holding a SecretString
    writes "[REDACTED]" (SEC-R88). RuntimeSettings.RevealJSON,
    AllocationSpec.RevealJSON and PrepareAllocationRequest.RevealJSON embed
    the type and shadow only its secret fields with plaintext ones, so no
    second field list can drift; the Control Plane picks that encoder for
    the prepare request in controlplane/runtime_request.go and clears the
    body after sending. TestRevealJSONIsCalledOnlyOnTheAllocationWire allows
    RevealJSON in exactly those two production files, and
    TestRuntimeSettingsRevealSecretsOnlyThroughTheAllocationWireEncoder
    proves by reflection that every SecretString field is set in its
    sample, redacted by json.Marshal, revealed and round-tripped by
    RevealJSON and listed by SecretValues. Alternatives rejected: an error
    from MarshalJSON (the scope asks for redaction, and a log line should
    still encode), encoding/json/v2 per-call marshalers (experimental in Go
    1.26), and a mirrored plaintext DTO tree (a second field list).
    Reversal: if another private message must carry these secrets, add its
    encoder to revealJSONCallers in the same change and say why.
scope:
  in:
    - "SecretString marshals redacted by default; the allocation wire path uses an explicit encoder; a test fails if plaintext appears in marshalled settings outside that path."
  out:
    - "The allocation payload Runtime receives."
acceptance_criteria:
  - id: A1
    text: "Marshalling RuntimeSettings with json.Marshal never contains the secret."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test ./internal/contracts/... ./internal/controlplane ./internal/scheduler"
    covers: [A1]
