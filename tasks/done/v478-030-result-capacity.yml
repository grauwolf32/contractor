schema_version: '1.0'
id: V478-030
title: Reserve usable capacity for accepted Audit conclusions
milestone: audit-evidence-results-2026-11
epic: audits
kind: defect
introduced_by: V478-004
priority: P2
status: completed
implementation_commit: 15e139044bd0c6afb1b04bc4706bb435091f3fc4
depends_on: [V478-002, V478-004]
languages: [go, markdown]
goal: Reserve usable capacity for accepted Audit conclusions through the existing Artifact and Audit owners.
context:
  authority: 'User request 2026-11-23 in the review side conversation: continue with the two reported defects and the proposed readability improvements.'
  finding: 'internal/auditstore/internal/pgstore/evidence.go:48 and internal/auditservice/judgments.go:181. Evidence can consume every receipt slot and the reserved bytes cannot be used by judgment writes.'
  siblings: 'Review Runtime prospective admission, Server execution and Audit quotas, normal final import, interrupted collection, scalar and batch judgments, and Finding/Fact source preparation.'
  boundary: 'Keep existing transaction, authority, exact source and replay ownership. No new store, endpoint, schema variant or model contract.'
  decision: >-
    Evidence leaves one receipt slot per actual assigned member and the existing
    byte reserve. Judgments may consume that capacity within the same total
    execution and Audit budgets. Counting actual membership preserves capacity
    for singleton checks; no separate journal or quota is introduced.
scope:
  in:
  - 'Evidence can consume every receipt slot and the reserved bytes cannot be used by judgment writes.'
  - Real-path regressions and the full suites of touched packages.
  out:
  - UI acceptance work, live Audits, demo deployment and changes to another checkout.
acceptance_criteria:
- id: A1
  text: 'Reserve usable capacity for accepted Audit conclusions; existing fences, exact provenance and replay semantics remain enforced.'
- id: A2
  text: 'All sibling paths retain their intended behavior and permanent failures remain atomic.'
- id: A3
  text: 'Relevant regressions and complete touched-package suites pass; owning specifications agree with the implementation.'
tests:
- command: go test -tags=integration -count=1 ./internal/auditservice ./internal/auditimport ./internal/auditstore/... ./internal/runservice
  covers: [A1, A2, A3]
- command: make lint
  covers: [A1, A2, A3]
- command: make test-runtime
  covers: [A1, A2, A3]
verification_notes: >-
  Accepted 2026-11-23. Validated result admission at the receipt-count, execution-byte and Audit-byte boundaries. A twenty-member assignment retains all scalar conclusions after evidence admission reaches its reserved boundary. Identical receipt replay stays idempotent.
  Full touched Go suites passed with actual PostgreSQL and integration tags: auditservice, auditimport, auditstore/... and runservice. Focused concurrency and regression cases passed with -race. Both real Server/Runtime interruption process cases passed. The regression overlay restoring old behavior failed as expected at all three quota boundaries and the context-union bound. make lint passed; final touched-package go vet and specification checks passed. make test-runtime passed with 6637 tests, 134 declared skips and 577 required compaction cases. Optional disk-heavy fixtures were not enabled; disabled cases are not passing coverage. All owned pools and processes stopped and the owned disposable database was dropped. No deployment or live model call. Logs: /tmp/v478-review-go-final.log, /tmp/v478-review-race-final.log, /tmp/v478-review-process.log, /tmp/v478-review-runtime.log, /tmp/v478-review-lint.log, /tmp/v478-review-before-fix.log.
