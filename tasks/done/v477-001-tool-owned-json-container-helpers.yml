verification_policy: Add test_tool_arguments.py with real selected callables and the pinned ADK Runner, including
  a local socket receiver rather than helper-only tests. Run the complete listed owner test files, not just
  new cases; add affected sibling suites if implementation touches another owner. Audit collector tests cover
  pure admission/receipts; combined real-store/process coverage is V476-005. No live-model quality improvement
  is claimed.
