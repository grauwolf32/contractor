schema_version: "1.0"
id: V425-027
title: Consolidate schema-isolated PostgreSQL test pool setup
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V38-004
priority: P3
status: completed
depends_on: []
languages: [go]
goal: Remove repeated PostgreSQL test setup while preserving real-store isolation and each suite's explicit settings.
context:
  authority: "User decision 2026-10-31: preserve the Server reduction research in .local and implement its first item, a shared PostgreSQL test harness."
  finding: >-
    internal/evalstore/postgres_test.go:25 and internal/evalservice/service_postgres_test.go:1258
    repeat schema creation, pool configuration and cleanup. Equivalent helpers recur across internal/.
    git log -S traces the Eval copies to V38-003 (d4c4e8854d73fe44f52c8b3f6d461cfc56dcbcc1)
    and V38-004 (859cc500f829fb88051cc6e47036ba5c43543b8a).
  boundary: >-
    A dependency-light postgrestest package owns random schema creation, search_path, verified
    connections and reverse-order cleanup. Callers retain migrations, fixtures, tracers, budgets,
    dense Audit event checks and production pool configuration tests. A callback configures the
    isolated work pool; its search_path remains owned by the helper. No migration framework,
    new dependency or fake persistence is introduced. Specialized multi-pool, production OpenPool
    and startup/migration fixtures remain local where their setup is the behavior under test.
  related: V425-013 retains wall-clock and listener-budget work; its Eval pool consolidation moves here.
scope:
  in:
    - One shared schema-isolated pgx pool helper, classified in the architecture layer table.
    - Migrate equivalent single-pool helpers across internal/, preserving explicit caller configuration and migrations.
    - Real PostgreSQL tests for independent schemas, caller configuration and cleanup after cancellation.
    - Record remaining specialized fixtures and net code reduction.
  out:
    - Production Server behavior, SQL contracts, migrations or database business data.
    - Wall-clock and listener fixes owned by V425-013; research items 2 through 6.
acceptance_criteria:
  - id: A1
    text: Equivalent single-pool schema setup uses one helper and the change removes more handwritten Go than it adds.
  - id: A2
    text: A missing test URL skips, a configured unreachable URL fails, isolated schemas do not share rows, and cleanup runs after cancellation and setup failures.
  - id: A3
    text: Caller-specific pool settings, tracers, migrations and Audit event cleanup checks remain explicit; specialized fixtures are documented.
  - id: A4
    text: Full suites of every changed Go package and make lint pass, with real PostgreSQL exercised rather than skipped.
tests:
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 -p=2 ./internal/...
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A3, A4]
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -count=1 ./internal/persistence/postgrestest
    covers: [A2, A3]
implementation_notes:
  - 33 single-pool fixture helpers use postgrestest.NewPool; the helper is 87 lines and its real-store regression tests are 164 lines. The Go diff removes 1138 lines net, including the new helper and tests.
  - Migrations remain in callers; raw-schema fixtures remain unmigrated. SQL tracers, MaxConns=1, statement_timeout=10000, lock_timeout=50ms, 30-second/minute cleanup budgets and dense Audit event checks remain explicit.
  - Specialized fixtures retained are settingsstore.isolatedSettingsPool and postgres.isolatedPools (shared-schema reopening/multiple pools), app.isolatedRecoveryPool and performance.databaseFixture (production OpenPool), and app.isolatedStartupDatabase (startup/migration URL).
  - A comparison against the original sources confirmed that the 33 migrated files change only imports and their single setup helper; test scenarios are unchanged.
  - V425-028 separately fixes the pre-existing V425-024 Git wire import inventory omission discovered by the first aggregate test pass.
implementation_commit: 740882ad0e249db9a99e007b367d0614ae10cd93
verification: >-
  The final dedicated PostgreSQL 17 TCP database pass of
  go test -tags=integration -count=1 -p=2 ./internal/... passed in full.
  go test -race -count=1 ./internal/persistence/postgrestest passed against real PostgreSQL.
  make lint passed on the final code. The initial Unix-socket attempt exposed TCP-only
  lease-test prerequisites; it was replaced with a TCP test URL. The next aggregate
  pass found only the unchanged Git import inventory defect, fixed independently by
  V425-028; the final complete rerun had no failures. No production behavior or
  dependencies changed. The branch is codex/postgres-test-harness and is not merged.
