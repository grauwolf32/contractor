manual_verification:
- check: Record before/after statement counts and representative custom/generic query plans with
    dataset cardinalities; confirm any new projected columns have an atomic writer/backfill and every
    retained/rejected original subclaim has its disposition. Do not force index scans or report preservation
    tests as initially failing defects.
  covers:
  - A1
  - A2
  - A4
verification:
  date: '2026-10-23'
  environment: >-
    macOS arm64; Go 1.26.9 (GOTOOLCHAIN=local); locked Node 24.20 and Runtime
    venv; local PostgreSQL 17.11 database contractor_test_c with isolated
    per-test schemas and all migrations through 000038 (000036 is pending on
    another branch); worktree branch claude/rv-c on base ba0f4415.
  re_verification: >-
    The findings held on base ba0f4415: PairPage and SelectedMemberPage sent a
    count statement and a page statement over the same materialized cohort,
    and the member cohort decoded every pair document of the generation with
    convert_from(...)::jsonb before its filter and limit; each recovery step
    (recovery() in submissions.go) locked the evaluation Project FOR SHARE,
    the experiment FOR UPDATE and the claim FOR UPDATE again although the
    composed transactions in execution_operations.go (BindExecution then
    ResolveSuboperation) and driver.go (ObserveTokens then Settle) already
    held them.
  design_decision: >-
    Pages (EVM-R245): the immutable pair row gains, per side, the member's
    frozen ordinal, variant, eligibility, execution state (NULL without an
    execution), assessment and conflict flag. projectComparison writes them
    with the document in the same CopyFrom of the PublishView transaction;
    migration 000037_eval_view_pair_filters backfills retained rows from the
    row's own document and eval_members, disabling eval_view_pairs_immutable
    only around its UPDATE, turning \u0000 into \u0001 before the jsonb cast
    (PostgreSQL rejects the NUL escape in json and jsonb; only free strings
    can carry it), then sets NOT NULL. One statement evaluates the
    materialized cohort once for both the count and a LIMIT n+1 candidate
    list; a scalar subquery reads the document by primary key only for page
    rows whose pair is first in the page, so the lookahead row and a
    member page's second side read none. The owner check became an EXISTS
    that runs once. The member page decodes its side from the pair document
    in Go. Rejected alternatives: a side table (a second writer and table,
    AGENTS 3.7); generated columns (the document is bytea, a cast fails on
    NUL escapes and the ordinal needs a join); keeping jsonb extraction at
    read time (decodes the cohort and fails with 22P05). Reversal: a member
    filter on another field adds its column with the same writer and a
    backfill. Recovery (EVM-R246): Store.RecoverMember returns a
    MemberRecovery bound to the store's transaction; the first step takes
    the three locks (LockMember and RegisterExecutionProject keep their
    workspace Project lock between the evaluation Project and the
    experiment), every later step runs one statement that proves the claim
    live at its epoch and rereads state and deletion_requested_at, so an
    earlier statement of the same transaction that cancels or requests
    deletion still fences new side effects. LockMember after another step
    fails (lock order). Transaction boundaries are unchanged: every
    capability is created inside its d.tx closure, so a retried transaction
    starts over. Rejected: re-taking the locks per step (two extra statements
    per later step, no added guarantee) and trusting the first step without
    a per-step claim proof (PER-R25 requires each write to prove its lease).
    Reversal: a step in a savepoint that can roll back the first step, or in
    another transaction, takes the authority again.
  regression_before_fix: >-
    A4 on a temporary worktree at ba0f4415 (git worktree add, removed
    afterwards): TestSharedPostgresEvalComposedRecoveryTakesItsAuthorityOnce
    rewritten to the base API failed with BindExecution+ResolveSuboperation
    11 statements (authority project 2, experiment 2, claim 2), replayed
    acknowledgement 10 and ObserveTokens+Settle 15, against the new
    assertions 9, 8 and 13 with each lock once plus one refresh; the base
    10,000-member page test with the new one-statement assertion failed with
    "unbounded page 2 5000 100". The equivalence, decoding, migration and
    native-ceiling tests need the new columns or API and cannot run on the
    base; the preservation tests (pause/cancel, expired claim, restart, lost
    acknowledgement in evalservice and evalstore) already passed there and
    are not claimed as reproduced defects.
  manual_verification: >-
    Statement counts: pair or member page 2 -> 1 statement (service read 7 ->
    6 statements of its repeatable-read transaction: begin, Get, LatestView,
    FrozenPlanMetadata, page, commit); BindExecution+ResolveSuboperation 11
    -> 9, replay 10 -> 8, ObserveTokens+Settle 15 -> 13; the rejection,
    tombstone, cancellation and audit-workspace compositions save two
    statements per later step. Plans on the directly seeded 10,000-member
    fixture (5,000 pairs, ANALYZE run; custom plans with actual rows and
    buffers, generic plans logged with the same shape): base pair count and
    page each Seq Scan eval_view_pairs 5,000 rows, 897 blocks, the page
    transferring 101 documents; base member count and page each 10,000 side
    rows with jsonb decoding of every document and a Memoize index scan of
    eval_members, 40,897 blocks each. New pair page: one Seq Scan of 5,000
    rows (961 blocks), count and LIMIT 101 over the CTE, 100 primary-key
    document lookups (300 blocks), 1,261 blocks in total; middle page sorted
    by difference 2,500 rows, 1,270 blocks; member page 10,000 side rows
    (961 blocks) with 50 document lookups (150 blocks), 1,111 blocks;
    failed-filter member page 1,250 rows, 1,261 blocks. The test asserts at
    most 5,000 + limit examined pair rows. Writer and backfill: the columns
    are written only by projectComparison in the PublishView transaction
    (same CopyFrom as the document) and by the migration backfill in the
    migration transaction; eval_view_pairs_immutable keeps them immutable
    and the purge column list includes them. Subclaim dispositions: separate
    count and page statements - fixed; JSON extraction before the limit -
    fixed (no stored document decoded in SQL by the page statement);
    repeated authority reads in composed recovery transactions - fixed for
    every composition; D FindEvalReceipt - unchanged by decision (A3);
    PublishView redesign, persisted next_ordinal and whole-tick
    transactions - out of scope by decision. Exact counting still examines
    the filtered cohort; no claim of page-proportional total work.
  commands:
    - >-
      CONTRACTOR_TEST_DATABASE_URL=postgres://ruslan@localhost:5432/contractor_test_c?sslmode=disable
