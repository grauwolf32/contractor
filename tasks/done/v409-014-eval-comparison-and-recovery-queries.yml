goal: Read Eval comparison pages in one bounded statement and share recovery authority reads inside
  existing composed transactions while keeping selected-view results, fences and replay unchanged.
context:
  review: docs/research/2026-10-23-sql-review.md, C comparison pages and recovery() per member, plus
    D FindEvalReceipt. Split from V409-011 on 2026-10-23; that portion had earlier moved there from
    the original V409-009.
  specification:
  - docs/spec/platform/persistence.md
  - docs/spec/evals/managed-evals.md#EVM-R108
  - docs/spec/evals/managed-evals.md#EVM-R110
  - docs/spec/evals/managed-evals.md#EVM-R164
  - docs/spec/evals/managed-evals.md#EVM-R168
  - docs/spec/evals/managed-evals.md#EVM-R214
  - docs/spec/evals/managed-evals.md#EVM-R216
  finding: evalstore/comparison_pages.go:76-90 performs separate count and page statements, and
    selectedMemberPageSQL extracts JSON filter fields before the limit. evalservice/execution_operations.go:59-65
    and driver.go:159-167 already compose multiple recovery-aware store methods in the same database
    transaction; those methods repeat authority reads. These are verified repeated operations, not
    measured production latency incidents.
  validation: Revalidated on main 1d533b2db885e0162ebabb01d36470f139546009. Existing 10000 directly
    seeded comparison fixture passed with two SQL queries per page and maximum serialized page 632876
    bytes. No reachable cross-Project Eval receipt ambiguity was demonstrated.
  siblings: Eval PairPage/SelectedMemberPage including empty/foreign-owner/filter cases; composed
    BindExecution+ResolveSuboperation and ObserveTokens+Settle transactions. V409-009 owns purge
    only; V407-028/029 own member insertion and FrozenPlan metadata reads. Execution-side batching
    belongs to V409-011.
  provenance: Comparison pages come from 9fc021501ce34389ecc7f35ca65bdf7959a25ce9 (V38-006).
  decisions:
  - EvalReceiptProject is a retained-receipt Project lookup after an addressed experiment disappears,
    not a Create collection lookup. Service-generated experiment IDs use 128-bit randomness; external
    PortableID is distinct. Leave it unchanged. Reopen duplicate-receipt handling only with a reachable
    production writer or demonstrated corruption-detection requirement; adding ProjectID would be
    circular for this lookup.
  - Full PublishView projection redesign and persisted next_ordinal remain outside accepted work
    for the reasons recorded in V409-009. Their omission is a documented decision, not an implementation
    claim. Reuse within current transactions must never create a transaction across an intent commit,
    ordinary Run/Audit side effect and acknowledgement.
plan:
- Replace Eval count-plus-page round trips with one statement that returns both the exact filtered
  total and a bounded page, including an empty after-cursor page. Restrict full output document transfer/decoding
  to selected page rows and the necessary bounded lookahead. Exact counting may still examine the
  filtered cohort; do not claim total work proportional only to page size. If filter/member identity
  columns are projected, maintain them at the existing projection write boundary and add a real migration/backfill
  consistency test.
- Preserve view-generation snapshot, owner/filter binding, full experiment summary, ordering/tie
  breaks and HasMore. Pair/MemberView payloads remain complete. Do not omit data just to meet a statement-text
  assertion; include the exact empty-page FilteredCount and foreign-owner behavior in query equivalence
  tests.
- Share repeated recovery authority work only inside already-composed database-only transactions
  such as BindExecution+ResolveSuboperation and ObserveTokens+Settle. Pass a transaction-bound capability
  or composed operation, not a reusable cached authorization across transactions. Refresh mutable
  state and recheck live-claim/fence conditions where the old protocol requires them; no read saved
  at the cost of admitting work after cancellation or losing intent durability.
- Extend existing comparison page tests at an admitted native ceiling and retain the explicitly store-seeded
  10000-member defensive fixture. Add deterministic SQL-count tests for the composed recovery transactions.
  Compare query counts within defined operations, not elapsed time, and preserve pause/cancel, expired-claim,
  restart and lost-acknowledgement tests.
scope:
  in:
  - Single-statement Eval comparison pages and bounded output-document reads.
  - Recovery-query reuse only inside existing composed database transactions, with focused query-count
    and equivalence tests.
  out:
  - Eval receipt lookup behavior, full PublishView redesign, persistent admission cursor and full-tick
    transactions.
  - Eval purge (V409-009), member INSERT batching/FrozenPlan metadata (V407-028/029), execution-side
    lock/marker batching (V409-011), new external API fields or changed comparison denominators.
acceptance_criteria:
- id: A1
  text: Given any supported Eval pair/member filter and cursor, including empty/end/foreign-owner
    pages, when the page is read, then one SQL statement returns the same exact filtered total, full
    summary identity, complete bounded items, ordering and continuation as before; full output documents
    are fetched only for selected page rows and bounded lookahead.
- id: A2
  text: Given a composed recovery transaction that encounters cancellation, claim loss, an ambiguous
    side-effect acknowledgement or retry, when shared authority reads are used, then every original
    fence/replay outcome remains valid and no transaction spans an external service call; counted
    duplicate queries decrease only within the specified existing transaction boundaries.
- id: A3
  text: Given retained Eval receipts, when existing receipt paths are exercised, then their scope
    resolution is unchanged.
- id: A4
  text: Given the original implementations, when comparison/composed-operation count regressions run,
    then the relevant old operation counts fail their new assertions; preservation tests may already
    pass and are not claimed as reproduced defects. Migration/backfill tests pass against real PostgreSQL
    if projected filter columns are added.
