schema_version: "1.0"
id: V408-007
title: "Record the release gate durations after the optimisations and close the test gate cost review"
milestone: test-gate-cost-2026-10
epic: quality
kind: chore
priority: P3
status: archived
archive:
  date: "2026-10-24"
  previous_status: pending
  authority: "Explicit user request to archive the remaining V408 tasks; further measurements are not needed."
  reason: >-
    The user requested archiving the remaining V408 work and does not want further measurements. V408-003, V408-004 and V408-005 have landed; the additional baseline/after campaign, timeout reductions and three consecutive Linux CI race repetitions are declined.
  disposition: >-
    This is archival, not completion: the full comparison and repeated CI stability acceptance below were not performed. No CI speedup, full release pass or three-run stability result is inferred. Existing release gates, deadlines and the default package parallelism remain unchanged.
  reconsider_when: >-
    The user explicitly reactivates this work, supported by a concrete slow
    or failing gate that warrants the proposed scope. Existing release gates
    remain the detection mechanism; no additional monitoring is scheduled.
depends_on: [V408-001, V408-002, V408-003, V408-004, V408-005, V408-006]
languages: [go, python]
goal: "The report shows before and after numbers per stage and the CI timeouts match the new durations."
context:
  review: "docs/research/2026-10-23-test-gate-cost-review.md"
  finding: >-
    The review's recommendations are only worth keeping if the measured
    gain is recorded; the CI timeouts in scripts/select_ci_stages.py and the
    stage table in docs/testing/README.md must follow the new durations.
plan:
  - "Trigger one manual full-gate CI run, collect reports-<stage>, run scripts/test_durations.py and add an After section to the report next to the Baseline."
  - "Retain V408-003's CI stability check: run all three race stages at the configured RACE_PACKAGE_PARALLELISM three consecutive times on the Linux CI runner, record elapsed time, connection and memory headroom and any failures; local measurements do not substitute for these runs."
  - "Lower RELEASE_STAGE_TIMEOUTS to about twice the measured stage time; update docs/testing/README.md; run make lint."
  - "Record in the report's Status section which finding each task closed and anything declined with its reason."
scope:
  in:
    - "Measurement, timeouts, docs, status."
  out:
    - "Further optimisation."
acceptance_criteria:
  - id: A1
    text: "The report has Baseline and After tables for all twelve stages and names the closing task per finding."
  - id: A2
    text: "CI timeouts are lowered to match, the full gate passes on a manual run, and all three race stages pass three consecutive Linux CI executions at the configured package parallelism."
tests:
  - command: make lint
    covers: [A1, A2]
