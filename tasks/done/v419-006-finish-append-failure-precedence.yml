depends_on: []
languages: [go, markdown]
goal: A validated in-memory finish never hides a required session-write failure, and both modeled Planners preserve the owning persistence and cancellation outcomes.
context:
  severity: medium
  baseline_evidence: tasks/evidence/v419-finish-append-baseline.json
  repair_evidence: tasks/evidence/v419-finish-append-repair.json
  authority: >-
    User requested faster parallel delivery on 2026-10-25. After the committed
    supported-baseline RED proof and separate V419-001 fixture handoff, the
    coordinator authorizes preparing and verifying the minimal Server repair
    in this isolated worktree on the supported ADK1.6 pin while Runtime gates
    finish. Integration into the primary Runtime revision still waits for
    V418-007 completion. Dependency pin/API migration remains outside this task.
  finding: >-
    Supported-v1.6 baseline reproduced with the real Runner and PostgreSQL:
    internal/planner/streamline/tools.go:507-530 records finish_requested and
    sets an in-memory completion before ADK emits its final FunctionResponse.
    Runner.AppendEvent may then fail, but planner.go:189-196 accepts terminal()
    before examining iterationErr at210, calls CompleteSession, and returns the
    candidate. All twelve accepted-finish profile/outcome/failure rows hide the
    real redacted-event rejection this way. Both ordinary ADK append outage
    rows become planner_execution_failed instead of planner_session_unavailable.
    The original twenty baseline leaves ran: fourteen intended failures, six controls
    passed and none skipped. The source/module hashes and actual case IDs are
    retained in baseline_evidence; this RED proof is not task acceptance.
  provenance: >-
    V1-006/aacda4b36be505201f0f95aecc7d586107ba68a5 introduced both the
    terminal-before-iteration-error branch and finish's in-memory setCompletion.
    V414-006/39c37b3c3f8bcc811fbe19375ba9134697334148 repairs CompleteSession
    write/report outcomes, not the preceding final FunctionResponse append.
    V414-008/74d2283ab828bc70fff2a28fd5c5a6bfa1e36cfa classifies ErrInvalid
    in the later iteration-error branch, which an accepted finish bypasses.
    This task proves the supported baseline before attributing anything to v2.
  specification:
    - docs/spec/execution/planners.md#PLN-R79
    - docs/spec/execution/planners.md#PLN-R85
    - docs/spec/execution/planners.md#PLN-R94
