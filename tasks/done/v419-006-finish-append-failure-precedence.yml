test_prerequisites:
  - The committed RED supported-baseline proof is not task completion. Isolated repair is now authorized; every listed acceptance command must pass before completion, and primary integration waits for Runtime V418-007.
  - Use exact supported go.mod/go.sum, real ADK Runner and an owned disposable PostgreSQL database with CREATEDB; configured unreachable storage fails and a zero/required skipped case is not acceptance.
  - The forwarding ADK service observes calls/errors only. The migrated test schema's CHECK or trigger produces the persistence failure; a wrapper-synthesized error is not PostgreSQL conformance.
  - Generate injected SQLSTATE values from the existing persistencepostgres constants. Record injected SQLSTATE outage honestly rather than claiming a real PostgreSQL server outage.
  - Use synchronization barriers and bounded finite fixtures, not elapsed-time assertions. Run at GOMAXPROCS=1 with Go package parallelism1 during concurrent Runtime verification; do not synchronize a shared Runtime virtual environment.
failure_outcomes:
  - operation: Required redacted ADK event append after an ordinary turn or valid finish
    permanent: A definite invalid/rejected PostgreSQL write returns planner_session_rejected with retryable false, no candidate and no further semantic dispatch.
    retryable: An unavailable session returns planner_session_unavailable; retain the owning final-outcome retryability and the existing bounded completion-write policy.
    ambiguous: Preserve existing session identity/sequence and reconcile only through that owner; do not append a fresh semantic effect, redispatch a Worker or invent another receipt.
    cancelled: Genuine caller cancellation retains its owning cancellation code and cause, while a known final outcome or definite store rejection remains nonretryable and the original write cause remains in the private error chain. The same rule applies to a deadline selected by the shared stop helper. Close and join SDK iteration before return; do not reinterpret arbitrary SDK failures as storage failures.
    timeout: Keep execution deadline, append/transport failure, completion-write budget and harness timeout distinct; no detached persistence or cleanup may outlive the Planner.
cardinality:
  - collection: Probe cases, model turns, event writes and retained observations
    expected: Two modeled profiles, three finish outcomes and two storage failure classes, plus ordinary-event and cancellation control rows.
    maximum: Twenty-four leaf cases; each uses at most three model calls, one Worker call and one injected matching event failure under existing item/byte limits.
    bound: Preserve the 256-KiB Planner input, 4-MiB Gateway request, 2-MiB submitted/stored session and event bounds and 256 fact digests. Test-only event guards select the exact finish response instead of globally lowering a state bound that also masks the completion write.
lifecycle:
  - entity: Planner invocation, session adapter and disposable probe schema
    delete: The test owner closes its pools and removes only its own schema/database after all Runner iterations and callbacks join.
    cascade: No durable entity or protocol operation is added; existing session completion and Run-event transactions remain the owners.
    retention: Safe evidence stores revision/module digests, case IDs, expected/actual codes and counts, never raw provider content, candidate payloads or environment values.
