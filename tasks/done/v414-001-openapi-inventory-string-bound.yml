schema_version: "1.0"
id: V414-001
title: "Give openapi-operations@1 the string bounds of the shared OpenAPI document rule"
milestone: review-v407-v409-followups-2026-10
epic: audits
kind: defect
introduced_by: V25-002
priority: P2
status: completed
implementation_commit: e84ff00760761c1dbc1f7e41938167f3c8764dba
depends_on: []
languages: [go, python]
goal: >-
  Every OpenAPI document that the authoring Toolset openapi@1 writes and that scan preparation
  accepts within LIM-SCN-39/41/42 is also accepted by the openapi-operations@1 inventory, or all
  three reject it under one registered string bound; the shared boundary fixture holds all three
  readers to the same verdicts.
context:
  review: >-
    tasks/done/v407-024-cross-language-limits-and-grammars.yml, decisions, "Open residuals" (a):
    openapi-operations@1 caps every string and member name at 64 KiB while openapi@1 and
    internal/scanplan accept longer strings (review Q4).
  specification:
    - docs/spec/tools/scanners.md#SCN-R253
    - docs/spec/tools/scanners.md#SCN-R124
    - docs/spec/audits/audits.md#AUD-R128
    - docs/spec/audits/audits.md#AUD-R143
    - docs/spec/audits/audits.md#AUD-R146
    - docs/spec/platform/limits.md
  severity: medium
  finding: >-
    internal/auditdomain/canonical.go:138 (YAML member names), :174 (YAML strings) and :72-74
    (strictJSONBounds MaxStringBytes for JSON sources and for every canonicalJSON re-encoding at
    :24-37) reject any string above MaximumStringBytes = 64 KiB (internal/auditdomain/limits.go:17).
    internal/scanplan/document.go:21-73,132-160,169-189 and runtime/src/contractor_runtime/toolsets/openapi/tools.py:1204-1290
    have no per-string bound; only the 2 MiB / depth 64 / 100,000-node document bounds apply.
    Reproduced on 19f7477f with temporary tests: an OpenAPI 3.1 document whose operation
    description is 65,537 bytes is accepted by scanplan parseDocument (JSON and YAML) and by
    openapi@1 _parse_document and _dump_document, but BuildOpenAPIInventory answers
    audit_document_invalid: document for both JSON and YAML; at exactly 65,536 bytes all three
    accept. A member name of 65,538 bytes behaves the same way. The shared fixture
    api/testdata/openapi-document-bounds.json already contains accepted cases
    (bytes-at-limit, a 2 MiB x-pad string) that openapi-operations@1 would reject. Neither the
    64 KiB string cap nor the 250,000-node cap (MaximumJSONNodes) of openapi-operations@1 has a
    LIM entry. Impact: an Audit whose profile uses openapi-operations@1 fails at start with
    audit_document_invalid on a document the OpenAPI generation Workflow produced and validated.
  siblings: >-
    (1) openapi-operations@1 single-document path BuildOpenAPIInventory and package path
    BuildOpenAPIInventoryFromPackage (internal/auditdomain/openapi.go:35-77), both through
    parseJSONOrYAML; in scope. (2) canonicalJSON re-encoding of resolved operations into item
    task documents and the canonical inventory basis (internal/auditdomain/inventory.go:42,
    codec.go:83): a long string accepted by the parser must not fail here; in scope. (3) The
    512-byte path-template cap at openapi.go:110 (MaximumPathBytes; :448 applies twice that to refs) is a further
    openapi-operations@1-only rejection of a document the other readers accept; decide it with
    the same rule (keep and register, or remove). (4) checklist@1 (internal/auditdomain/checklist.go:11)
    shares parseJSONOrYAML but reads checklists, not OpenAPI; keep its string bound unless the
    chosen fix changes the shared parser, and then test that it still applies. (5) openapi-scans@1
    inventory (BuildOpenAPIScanInventory) parses through scanplan and is already consistent; confirm
    with the fixture. (6) Runtime openapi@1 and internal/scanplan: change only if the decision
    below registers a per-string bound for all readers.
  provenance: >-
    git blame on internal/auditdomain/limits.go:17 and canonical.go:138,174 gives 658a88dd68d0
    "feat(audits): add deterministic package inventories", the implementation_commit of
    V25-002. canonical.go:72-73 (strictJSONBounds) was moved by 3958f527 without changing the
    bound.
  decision: >-
    Preferred: the scan-preparation document rule (LIM-SCN-39/41/42, SCN-R253) stays the single
    definition, as V407-024 decided, and OpenAPI source documents carry no per-string bound
    beyond it, so openapi-operations@1 drops the generic 64 KiB cap for OpenAPI source strings
    and member names (parser and canonical re-encoding) while LIM-AUD-14/17 and the generated
    package budget LIM-AUD-20 keep bounding the result. Alternative: register one per-string
    bound as a new LIM-SCN entry and enforce it in scanplan, openapi@1 (load, mutation, write,
    validate) and openapi-operations@1 alike. Record the choice, the rejected alternative and
    the reversal condition (a measured need for a per-string cap) in SCN-R253 or AUD-R128.
scope:
  in:
    - "Apply the chosen string rule to every openapi-operations@1 read and re-encoding path listed in siblings (1)-(3)."
    - "Register in limits.md every bound openapi-operations@1 still applies to OpenAPI source documents (string, node and path-template caps), or remove the bound."
    - "Extend api/testdata/openapi-document-bounds.json with member-value and member-name string cases at 64 KiB, 64 KiB + 1 byte and near the 2 MiB document bound, in JSON and YAML, and make internal/auditdomain a third consumer next to internal/scanplan and runtime/tests/test_openapi_toolset.py; register the new reader in api/testdata/readers.json."
    - "Update SCN-R253 so the shared fixture names all three readers."
  out:
    - "Changing LIM-SCN-39/41/42, LIM-AUD-14 or LIM-AUD-17."
    - "YAML 1.1/1.2 scalar resolution differences (V414-003)."
    - "Bounds of Audit-internal values that are not copied from the source document (identifiers, diagnostics, coverage values)."
failure_outcomes:
  - operation: "openapi-operations@1 inventory generation at Audit start"
    permanent: "A document outside the shared bounds still fails with the existing audit_document_invalid / audit_inventory_invalid codes (FAIL-AUD-8); an inventory whose generated packages exceed LIM-AUD-20 keeps its existing limit error."
acceptance_criteria:
  - id: A1
    given: "an OpenAPI document with a 65,537-byte operation description and one with a 65,538-byte member name, each within LIM-SCN-39/41/42, in JSON and YAML"
    when: "scanplan, openapi@1 and BuildOpenAPIInventory (single document and package) read them"
    then: "all three return the same verdict that the shared fixture records, and an accepted document yields an inventory whose item task documents and canonical digest are produced without error"
  - id: A2
    given: "every case of api/testdata/openapi-document-bounds.json"
    when: "make test-wire-cross-language runs"
    then: "the Go scanplan reader, the Go auditdomain reader and the Python openapi@1 reader agree on every case, and scripts/shared_fixture_gate.py accepts the three declared readers"
  - id: A3
    given: "the remaining openapi-operations@1-only bounds (path template, nodes)"
    when: "the task is complete"
    then: "each is either removed or has a LIM entry cited by the owning requirement and a fixture case"
  - id: A4
    given: "the unfixed code at 19f7477f"
    when: "the new auditdomain fixture consumer and the A1 regression run"
    then: "they fail on the 64 KiB + 1 string cases"
tests:
  - command: "go test -count=1 ./internal/auditdomain/... ./internal/scanplan/... ./internal/auditservice/..."
    covers: [A1, A3, A4]
  - command: "cd runtime && uv run --locked pytest -q tests/test_openapi_toolset.py"
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> make test-wire-cross-language"
    covers: [A2]
  - command: make lint
    covers: [A3]

decisions:
  - >-
    D1 Adopt the preferred shared source rule: openapi-operations@1 delegates each direct or
    packaged source document to scanplan.ParseDocument (2 MiB, depth 64, 100,000 nodes including
    names). Remove its 64 KiB source-string and 512-byte source-path limits and the 1,024-byte
    local-ref cap. Keep package-member path limits. Do not add a new per-string source limit;
    SCN-R253 records the measured-resource-use reversal condition and the rejected alternative.
  - >-
    D2 Generated operation tasks, operation identities, inventory bases, comparisons and retained
    reads preserve source strings without the generic Audit string cap. Other Audit documents,
    checklist parsing and internal metadata validation keep their limits. LIM-AUD-30 registers
    the existing 250,000-value resolved-operation/generated-document budget; source parsing now
    uses LIM-SCN-42 instead. Canonical JSON disables temporary HTML escaping so a bounded '<'
    description is not rejected merely because an intermediate encoding inflated sixfold.
  - >-
    D3 The shared fixture has 25 cases in both JSON and YAML: original byte/depth/node boundaries,
    65,536/65,537/65,538-byte and near-2-MiB descriptions/member names, 512/513/65,537-byte paths,
    and a 65,537-byte operationId. Go scanplan and auditdomain share a test-only generator;
    independently generated Python bytes must match the pinned SHA-256 values. Audit tests
    exercise direct and packaged inputs, complete inventory validation and task codec round trips;
    ordinary scan inventory also consumes the description/name/operationId cases.
  - >-
    D4 Existing Runtime authoring readiness remains a separate contract: _parse_document accepts
    the 65,537-byte path under shared source bounds, while load_openapi rejects it under its
    existing 2,048-character structural path rule without writing. Keep this fixture case and
    test both outcomes explicitly rather than narrowing the corpus. All source readers agree;
    no Runtime production policy changes. SCN-R253 explains that source-bound parity does not
    promise authoring/scan/inventory readiness parity. Revisit authoring semantic limits only
    with a separately reviewed change to that policy.
  - >-
    D5 Siblings checked: Runtime audit_results/packages.py reads retained task JSON under its
    whole-document byte bound without the removed per-string limit; the public API exposes
    taskDocument as an arbitrary object and UI reads that retained object without a path-size
    validator. No public field/schema/generated-client update is needed. Extra regressions cover
    long local pointers, internal scope limits, unchanged checklist parsing, HTML text and
    repeated-reference expansion crossing LIM-AUD-30 before any partial inventory escapes.
  - >-
    D6 Check OpenAPI generated-tree JSON byte/depth/node budgets before encoding/json allocates
    its internal buffer. A bounded extent walk counts string escaping and
    repeated references, rejects custom JSON/Text marshalers (including pointer receivers and
    map keys), and stops at the first exceeded bound. A valid 1.5 MiB source with 1,000 aliases
    cannot materialize a 1.5 GiB encoding before its 8 MiB document rejection. Direct/package
    inventory regressions cover this amplification; a seven-alias marshaler probe proves no
    encoding starts before rejection. Against the previous encoder the probe failed with
    invalid JSON bytes and encoded=true; with preflight it returns ErrBounds and encoded=false.
