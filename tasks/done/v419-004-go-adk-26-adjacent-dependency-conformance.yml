acceptance_criteria:
- id: A1
  given: Committed raised dependency graph
  when: Gateway and schema suites execute
  then: Requests, usage, classified errors and strict tool boundaries keep their existing observable contracts.
- id: A2
  given: Direct Contractor A2A client and controlled transport/process fixtures
  when: Send/poll/cancel/result and mTLS cases execute
  then: Identity, exact results, cancellation and reconciliation remain stable without native SDK delegation.
- id: A3
  given: Both content-capture settings and adversarial telemetry values
  when: HTTP exporter and shared GenAI tests run
  then: Only allowed bounded projections are exported once; failures remain supplementary and secrets
    do not escape.
- id: A4
  given: Cross-language fixtures and the supported Runtime lock
  when: Wire conformance runs
  then: No unintended wire changes or hidden Python-upgrade prerequisites appear.
