- command: go test -race -tags=integration -p=1 -json -count=1 -timeout=20m ./internal/planner/a2a ./internal/telemetry
    ./internal/mtls ./internal/gatewayrecovery
  covers:
  - A1
  - A2
  - A3
- command: make test-wire-cross-language
  covers:
