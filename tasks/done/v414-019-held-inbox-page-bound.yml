    - make lint passed, before and after merging main (after make docs-dependencies for the changed spec document).
    - go test -count=1 ./internal/persistence/ ./internal/archtest/... passed (SQL placement and layers).
    - >-
      Run with -v, TestPostgresAuditHeldInboxPageReadsOnlyThePage,
      TestPostgresNextRoundHeldInboxPassReadsGrowWithPages, TestPostgresAuditHoldKeepsItsReceiptTime
      and TestPostgresFindingHoldReceiptTimeMigrationBackfillsHolds report PASS and no SKIP.
    - make docs-erd regenerated docs/spec/database-erd.html for migration 000042.
    - >-
      After main (0f5bed13) brought V414-030's 000041_finding_correlation_fences.sql, the
      migration was renumbered to 000042 (12c504e8). The migration test now installs the prefix
      through 000041 and writes the Project's correlation fence as an Audit draft does.
      Afterwards these were rerun and passed:
      TestPostgresFindingHoldReceiptTimeMigrationBackfillsHolds with -v (PASS, no SKIP);
      go test -tags=integration -count=1 ./internal/persistence/...;
      TestPostgresAuditHeldInboxPageReadsOnlyThePage,
      TestPostgresNextRoundHeldInboxPassReadsGrowWithPages,
      TestPostgresAuditHoldKeepsItsReceiptTime and the TestPostgresAuditInbox tests in
      internal/findingintake; and make lint.
  database_tests_configured: true
  evidence:
    - >-
      A1: one Audit holds 20,150 receipts: 20,000 old receipts of an ordinary Run, imported in
      the reverse of receipt order, plus 100 held native and 50 held native receipts of a deleted
      Run. It also has 300 native receipts. A sibling Audit holds 5,000 receipts, and 20 Audits of
      both owners hold 300 each. At the first, a middle and the last cursor, in pages of 21 and
      200, under force_custom_plan, force_generic_plan and the service's cached statement, the
      held inbox read at most 44 receipt and 21 hold rows per page of 21 (budget 92 and 29) and
      402 and 200 per page of 200 (budget 808 and 208). The combined inbox read at most 67 and
      21 (budget 134 and 29), and 633 and 200 (budget 1,208 and 208). The budget is
      2 x (branches + 1) x page receipt rows plus 8 planning rows, and page plus 8 hold rows; it
      does not depend on H. Every page equals the corresponding slice of the original
      statements.
    - >-
      A3: the held branch as V409-002 left it (holdOrderedHeldInboxKeysSQL, kept verbatim in the
      test) read 20,150 hold rows per page under generic and cached plans, and 31,150 (the whole
      hold relation) under custom plans. It read 20,161 to 20,583 receipt rows per page, at every
      cursor and page size, for both the held and the combined inbox. The test requires each of
      these readings to exceed the page budget.
    - >-
      A2: the next-Round paging protocol of selectNextProposalChecksFromInbox ran over the same
      Audit through pgx's statement cache. It made 51 calls: 50 pages of 200, then one look-ahead
      of 1. Together they read 20,018 receipt and 10,001 hold rows (budget 40,412 and 10,409)
      and listed exactly the original statement's first 10,001 held receipts. The hold-ordered
      statement made the same 51 calls and read 1,037,685 receipt and 1,082,650 hold rows; the
      test requires it to read at least 51 x 20,150 hold rows.
    - >-
      A4: TestPostgresAuditHoldKeepsItsReceiptTime covers holds written by owner import
      (ImportIntoAudit) and by collection retention (RetainAuditCollectionBatch). Both hold
      their receipt's creation time. An update of the column is ClassRejected, an insert naming
      another time is ClassRejected, and an insert for a missing receipt is
      ClassReferenceViolation, the class the receipt foreign key gave before. An insert naming
      the receipt's own time is accepted.
      TestPostgresFindingHoldReceiptTimeMigrationBackfillsHolds applies migrations 1 to 41 and
      writes two holds whose hold order is the reverse of their receipt order, then applies
      000042. It checks that the backfill equals the receipt times, the column is NOT NULL, the
      index (audit_id, receipt_created_at, receipt_id) replaces
      finding_proposal_audit_holds_audit_idx, an update is rejected, and a later hold gets its
      time from the trigger.
  decisions:
    - >-
      Choice (a), not (b). An immutable copy of the receipt time with an index in receipt order
      bounds each page by the page. A per-Audit hold limit would bound it only by the limit, and
      would give owner imports and collection a new classified rejection, which needs new
      outcomes. The copy changes nothing an owner sees, so limits.md registers no limit.
      FND-R186 records the measurements and the reversal condition: reopen if a receipt's
      creation time can change, or if a reader needs an Audit's holds in hold-time order.
    - >-
      A BEFORE INSERT trigger (contractor_copy_finding_hold_receipt_time) fills the column, so
      every writer is covered without change. That includes the only production INSERT,
      internal/findingintake/postgres.go:597, and every test seeder. A writer that supplies a
      different time is rejected (23514, no constraint name). A missing receipt raises 23503
      before the foreign key would. The existing finding_proposal_audit_holds_protect_update
      already rejects every hold update, so the column needs no new update guard. The backfill
      disables only that guard, for the one UPDATE, inside the migration transaction.
    - >-
      The hold-time index (audit_id, created_at, receipt_id) was replaced, not kept beside the
      new one. No statement reads an Audit's holds in hold-time order. The purge batch
      (audit_purge.go) needs only the leading audit_id. postgres.go:116 orders one receipt's
      holds and uses the receipt-keyed index.
    - >-
      The held branch reads the Audit's Project once in an InitPlan
      (hold.project_id = (SELECT project_id FROM audits WHERE audit_id = $2 AND owner_id = $1)).
      It is no longer joined with the Audit row, so the walk keeps the index order and its LIMIT
      stops it. A hold in another Project, or of another owner's receipt, is filtered during the
      walk, before the LIMIT, so pages are never short.
    - >-
      A2 is measured at the statement the builder calls, not through selectNextProposalChecks
      end to end. Service.ListAuditHeldInbox runs listAuditHeldInboxSQL once per call and then
      hydrates only that page's keys. Hydration needs real proposal artifacts for each receipt,
      which the 20,000-receipt synthetic fixture does not have. The selection consumes the list
      as returned, so an identical listing gives an identical selection. The test mirrors the
      builder's paging exactly: limit min(200, 10,000 - scanned), cursor from the last receipt,
      stop on a short page, then one look-ahead of 1.
    - >-
      The 20,000- and 5,000-hold groups are seeded with the hold table's user triggers disabled.
      Through the triggers, each hold admits a finding, writes an event and bumps the Audit
      revision, and one statement of 20,000 holds of one Audit did not finish within the
      4-minute test deadline. These bulk holds are read-model fixtures: they write
      receipt_created_at = receipt.created_at, and the inbox reads neither findings nor
      retention state. The smaller groups go through the triggers.
  siblings:
    - "Fixed: the held branch of listAuditInboxSQL (public inbox) and listAuditHeldInboxSQL (next-Round builder), which share auditHeldInboxKeysSQL."
    - "Ruled out (keyed by receipt_id or the Audit prefix, unchanged): audit_receipt_batch_sql.go, proposal_resolution_sql.go, collection_list_sql.go, collection_publication_sql.go, run_deletion_sql.go in findingintake and pgstore, round_sql.go, audit_purge.go."
    - "Unchanged as scoped: the native branch, the quota COUNT (FND-R185), LIM-AUX-9."
  open_items:
    - >-
      Owned by V414-031, not changed here:
      TestPostgresFindingRunDeletionSerializesWithAuditPurge/run_deletion_commits_first.
    - >-
      The V414-028/V414-029 pgstore scale tests exceed their budgets by 1 to 4 rows when other
      packages share the database, because superseded index entries survive VACUUM while
      another backend holds an old snapshot. They pass alone. This is reported to the
      coordinator, not fixed here.
