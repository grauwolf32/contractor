schema_version: "1.0"
id: V414-019
title: "Bound the held Audit inbox page by the page, not by the Audit's holds"
milestone: review-v407-v409-followups-2026-10
epic: audits
kind: defect
introduced_by: V25-011
priority: P2
status: completed
implementation_commit: 96a2fc37ee269cdbf0de84ec8157fe0c108ca7f8
depends_on: []
languages: [go, sql]
goal: >-
  One page of an Audit's held finding receipts reads a number of hold and
  receipt rows bounded by the page size, whatever the number of holds the
  Audit has, so the next-Round builder's 10,000-receipt pass and the public
  inbox cost O(pages) instead of O(pages x holds); or, if that is declined,
  the hold count per Audit has a registered limit that is enforced and
  detected instead of a reopen note.
context:
  review: >-
    tasks/done/v409-002-finding-inbox-index.yml (held_branch_bound and
    declined: "reopen when one Audit's holds approach the 10,000-per-pass
    scan budget (LIM-AUX-9) in practice"; nothing measures or enforces it,
    AGENTS.md 3.9).
  specification:
    - docs/spec/findings/findings.md#FND-R186
    - docs/spec/audits/execution.md#AUX-R60
    - docs/spec/audits/execution.md#AUX-R61
    - docs/spec/audits/execution.md#AUX-R63
    - docs/spec/platform/limits.md
  severity: medium
  finding: >-
    internal/findingintake/postgres_sql.go:53-69 (auditHeldInboxKeysSQL)
    probes the receipt of every hold of the Audit by primary key and sorts
    them before LIMIT, because finding_proposal_audit_holds
    (000001_baseline.sql:3583-3597, index (audit_id, created_at,
    receipt_id)) carries the hold time, not the receipt time the inbox is
    ordered by. listAuditHeldInboxSQL (:102-108) is that branch alone and
    listAuditInboxSQL (:85-96) unions it with the native branch.
    selectNextProposalChecksFromInbox
    (internal/auditservice/next_round_selection.go:27-75) calls
    ListAuditHeldInbox in pages of pagelimit.MaxRows = 200 until it has
    scanned maxNextRoundInboxScan = 10,000 receipts
    (internal/auditservice/next_round.go:17-20), plus one look-ahead call:
    up to 51 calls per pass, each O(H). Nothing bounds H: native holds
    are bounded only by maxSubmittedRuns (up to MaxAuditSubmittedRuns =
    1,000,000, internal/config/auditprofile/audit_profile.go:31) times 4096
    proposals per Run, and owner imports (findingintake/postgres.go:597)
    have no count limit; limits.md registers no hold limit. Reproduced on
    19f7477f with a temporary integration test in internal/findingintake
    reusing the inbox_budget_integration_test.go seeders: one Audit holding
    H = 20,000 receipts, pages of 200 through listAuditHeldInboxSQL under
    explaintest custom plans. Every one of the 50 calls read 20,000 hold
    rows and about 27,700 receipt rows; the pass read 1,000,000 hold rows
    and 1,390,122 receipt rows to return 10,000 receipts. A pass repeats
    when AcceptNextRound answers ErrPrecondition or the build fails
    transiently (internal/auditcontroller/round_progression.go:108-130).
  siblings: >-
    In scope: the held branch of listAuditInboxSQL (GET
    /v1/audits/{auditId}/finding-proposals, one page per request, so a
    client that pages through H holds reads O(H^2 / page)), and
    listAuditHeldInboxSQL (next-Round builder). Every hold writer must fill
    any new column: findingintake/postgres.go:597 (collection retention and
    owner import) and any test seeder that inserts holds directly
    (inbox_budget_integration_test.go:119-128, collection_postgres_test.go,
    round_postgres_test.go, postgres_integration_test.go,
    finding_inbox_postgres_test.go, audit_pagination_postgres_test.go,
    inbox_service_integration_test.go, multi_audit_import_test.go,
    evalservice/audit_purge_postgres_test.go). Unchanged: the native branch
    (already O(page) through finding_proposal_receipts_audit_idx), exact hold
    hydration (readAuditHoldsBatch), the quota COUNT (FND-R185), and the
    hold update protection trigger
    (contractor_protect_finding_proposal_receipt), which must also protect
    the new column.
  provenance: >-
    git log -S maxNextRoundInboxScan finds 3d2547de (feat(audit): materialize
    proposal-driven rounds), two commits before 9311fa60, the
    implementation_commit of V25-011 (bounded multiple rounds): it added the
    10,000-receipt paged inbox scan per next-Round pass without a bound on
    the work per page or on holds per Audit. 429d4a48 (no task) later
    switched the scan to the held-only list, and V409-002 measured the O(H)
    branch, recorded it in FND-R186 and declined the fix with the reopen
    condition above.
  decision: >-
    (a) Preferred: add an immutable receipt_created_at column to
    finding_proposal_audit_holds, copied from the receipt when the hold is
    inserted (in the same statement or a BEFORE INSERT trigger that reads
    the receipt), protected by the existing column-scoped update trigger,
    with an index (audit_id, receipt_created_at, receipt_id); the held
    branch walks that index after the cursor and stops at the page. A
    column-scoped immutable copy is preferred over a 1:1 side table
    (AGENTS.md 3.7). The migration backfills existing holds and gets a
    *_migration_test.go. (b) Fallback: register a per-Audit hold limit in
    limits.md, enforce it under the Audit lock that hold writers already
    take, give collection and import a classified outcome when it is
    reached, and detect approach to it; this changes behaviour for owners
    and needs the outcomes specified first. Record the choice, the measured
    before and after reads and the reversal condition in FND-R186.
scope:
  in:
    - "The chosen fix for both statements that use the held branch, every hold writer and seeder, FND-R186 and AUX-R60 updated to state the new work bound, and limits.md updated if (b) adds a limit."
    - "Under (a): the migration, its backfill test on PostgreSQL and the update protection of the new column."
    - "A PostgreSQL test at a realistic size (one Audit with at least 20,000 holds and unrelated Audits' holds) that measures hold and receipt rows read per page with explaintest under custom, generic and cached-statement plans, at the first, a middle and the last page, against a budget derived from the page size and planning rows only."
  out:
    - "The native inbox branch, the quota COUNT and the 10,000-receipt pass budget (LIM-AUX-9) itself."
    - "Inbox order: receipts stay ordered by receipt creation time and ID, including old receipts imported later."
failure_outcomes:
  - operation: "Hold insert (collection retention and owner import) writing the receipt time"
    permanent: "A missing receipt or a time that differs from the receipt's is a constraint violation that rolls back the hold transaction with the existing classified error; never a hold without the column."
    retryable: "Unchanged: definite transaction conflicts follow the writer's existing InTx retry."
    ambiguous: "Unchanged: collection retention and import keep their existing receipts and idempotent replay."
    cancelled: "The transaction rolls back; no hold without its receipt time is visible."
    timeout: "The writer's existing transaction budget."
  - operation: "Migration backfill of existing holds (choice a)"
    permanent: "A hold whose receipt is missing cannot exist (FK ON DELETE CASCADE); the migration fails rather than leaving NULL."
    retryable: "Not applicable: migrations run once under the migration lock."
    ambiguous: "The migration ledger records the version only after the file commits."
    cancelled: "The migration transaction rolls back."
    timeout: "The migration deadline (see PER-R31/R32)."
cardinality:
  - collection: "Holds of one Audit"
    expected: "tens to hundreds"
    maximum: "unbounded today: maxSubmittedRuns (up to 1,000,000) x 4096 native proposals plus unlimited imports"
    bound: "after the fix, at most page size + planning rows hold and receipt rows per page"
  - collection: "Inbox pages per next-Round pass"
    expected: "1"
    maximum: "51 (10,000 / 200 plus one look-ahead)"
    bound: "O(page) each"
acceptance_criteria:
  - id: A1
    given: "One Audit with 20,000 holds and other Audits with holds"
    when: "the held inbox page and the combined inbox page are read at the first, a middle and the last cursor"
    then: "each reads at most a budget derived from the page size and planning rows, independent of H, under custom, generic and cached-statement plans, and returns the same receipts in the same order as the current statements."
  - id: A2
    given: "A next-Round pass over 10,000 held receipts"
    when: "selectNextProposalChecks runs on PostgreSQL"
    then: "the rows it reads grow with the pages it takes, not with pages x H, and its selection is unchanged."
  - id: A3
    given: "The unfixed statements at 19f7477f"
    when: "the row-budget test runs"
    then: "it fails (20,000 hold rows read per page)."
  - id: A4
    given: "A hold written by collection, by owner import and by the migration backfill"
    when: "it is read or an update tries to change the new column (choice a), or the limit is reached (choice b)"
    then: "the column equals the receipt's creation time and cannot change, or the limit outcome is the specified classified error and is detectable."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/findingintake ./internal/auditservice ./internal/auditstore/... ./internal/persistence/... ./internal/httpapi/public"
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]
verification:
  date: '2026-10-24'
  environment: >-
    macOS arm64; Go from /private/tmp/contractor-go-darwin; PostgreSQL 17.11 database
    contractor_test_v414_sql with disposable per-test schemas; branch claude/v414-sql with main
    (63861457, then 0f5bed13) merged; TMPDIR set to a path without symlinked components, because the filesystem
    blob store rejects the /var -> /private/var symlink of the macOS default TMPDIR (unrelated to
