  commands:
    - >-
      CONTRACTOR_TEST_DATABASE_URL=postgres://.../contractor_test_v414_sql go test
      -tags=integration -count=1 ./internal/findingintake ./internal/auditservice
      ./internal/auditstore/... ./internal/persistence/... ./internal/httpapi/public, run before and
      after merging main: auditservice, persistence, persistence/explaintest, persistence/postgres,
      persistence/statesettest and httpapi/public ok. findingintake failed only
      TestPostgresFindingRunDeletionSerializesWithAuditPurge/run_deletion_commits_first, the
      pg_stat_activity prefix truncation that V414-029 caused and V414-031 owns; every V414-019
      test and every other findingintake test passed. auditstore/internal/pgstore failed only the
      V414-028/V414-029 scale tests TestPostgresAuditDeletionProbesReadOnlyTheLiveRuns (both
