schema_version: '1.0'
id: V466-017
title: Preserve valid YAML when selecting Audit process compactor policies
milestone: worker-context-compaction-2026-10
epic: planner-worker
kind: defect
introduced_by: V417-006
priority: P1
status: in_progress
depends_on: [V417-006]
languages: [go]
goal: Both real Audit compaction process scenarios start with the intended Worker and compactor policies and exercise their completion and lease-loss guarantees.
context:
  authority: Necessary verification repair discovered during the user-requested V466-016 main integration on 2026-11-14.
  severity: low
  finding: >-
    tests/e2e/audit_compaction_test.go:206 inserts a block-style newline into
    basicCheckWorkflow's flow-style workers mapping. Both Audit compaction
    process tests fail at Server readiness with a strict YAML parser error,
    before reaching their real completion and lease-loss assertions. The
    substitution was introduced in e638133e3e09237e71970d3ab90fb67b2990f1ef.
  siblings: >-
    Both callers share installCompactAuditProcessFixture and are repaired
    together. The ordinary Worker process fixture and the external Eval catalog
    already declare compactorModelPolicy in valid block mappings. A repository
    search found no other newline substitution for compactorModelPolicy.
  boundary: >-
    Keep the existing flow mapping and add the compactor policy as a comma-separated
    member. Expanding the entire shared Workflow fixture or changing catalog
    parsing would add work without a caller requirement. Production behavior,
    policy identities and strict validation remain unchanged.
scope:
  in:
  - Correct the shared test-only Workflow policy substitution.
  - Re-run both failing real Server/Runtime/PostgreSQL scenarios and the complete deterministic process package gate.
  out:
  - Production parsing, model choices, live Gateway experiments and unrelated process behavior.
acceptance_criteria:
- id: A1
  text: Both Audit process scenarios reach their actual compaction completion and lease-loss assertions with the exact intended policies and pass.
- id: A2
  text: The ordinary Worker process scenarios and complete deterministic process gate pass without widening accepted configuration syntax or weakening assertions.
- id: A3
  text: Evidence retains the two strict-YAML readiness failures on the unfixed fixture and the successful real-process regression results after correction.
tests:
- command: make test-e2e
  covers: [A1, A2, A3]
- command: make lint
  covers: [A1, A2]
