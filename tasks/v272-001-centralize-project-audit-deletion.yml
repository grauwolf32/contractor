schema_version: '1.0'
id: V272-001
title: Centralize Project-owned Audit deletion transitions
milestone: code-reuse-2026-10
priority: P1
status: in_progress
implementation_commit: null
depends_on: []
languages: [go]
goal: Keep Project-triggered Audit state changes behind the auditstore boundary.
context:
  issue: https://github.com/grauwolf32/contractor/issues/87
  finding: projectlifecycle directly changed Audit state, revision, and event sequence.
scope:
  in:
    - Move the Project deletion claim and Audit transition into auditstore.
    - Preserve the existing claim fence, SKIP LOCKED behavior, and deletion event.
  out:
    - Other Audit mutation paths tracked by issue 87.
acceptance_criteria:
  - {id: A1, text: projectlifecycle no longer issues UPDATE audits.}
  - {id: A2, text: A live Project deletion claim advances exactly one Audit and records its event.}
  - {id: A3, text: A locked Audit remains skipped until it can be claimed.}
tests:
  - {command: go test ./internal/projectlifecycle ./internal/auditstore, covers: [A1, A2, A3]}
