schema_version: "1.0"
id: "V37-011"
title: "Separate Operations observation from explicit configuration changes"
milestone: "ui-journey-usability"
priority: "P2"
status: "pending"
implementation_commit: null
depends_on: ["V37-001", "V27-004", "V31-001"]
languages: ["typescript"]
goal: >-
  Show operational readiness first and open configuration forms only when users choose a
  relevant action.
context:
  user_stories: ["US-04", "US-11"]
  review_findings: ["UX-10"]
  planning_document: "docs/ui-user-stories.md"
  baseline: >-
    Runtime configuration combines version lists, bindings, credentials and multiple
    create/publish forms on one long page. Existing Scheduler settings and capability guards are
    already implemented.
  performance: >-
    V32-006 owns performance charts and completed allocation resource history; this task neither
    duplicates nor blocks on it. Preserve its navigation/components if present. Go profiling
    remains independently opt-in under V32-007, without a new UI toggle.
  configuration: >-
    RuntimeConfig versions are immutable, bindings are revision-checked and allocation
    preparation freezes settings. Show the actual effect of each operation from its current
    contract; avoid a blanket claim that every setting only affects future allocations.
  browser_verification: >-
    Build the UI with make ui-build and serve it using the documented UI development or Node
    server; set CONTRACTOR_UI_E2E_BASE_URL to that instance. Browser cases must explicitly
    install their API fixtures; a fixture pass is not proof of a live backend. Add new test
    files named below as part of this task.
scope:
  in:
    - >-
      Keep readiness and relevant constraints in Overview and move snapshot/generation/transport
      detail into accessible diagnostics.
    - >-
      Open Create credential, Publish RuntimeConfig and binding edits through explicit actions,
      reusing the shared Dialog or focused page sections with preserved error/draft state.
    - >-
      Show current and proposed values and their scope of effect before submitting changes,
      including future allocation binding resolution versus already pinned execution.
    - >-
      Add relevant navigation from authoritative wait/diagnostic context to
      Runtime/configuration views, showing actual unknown or incompatible capacity when
      applicable.
  out:
    - >-
      New Runtime telemetry, duplicate Performance/pprof UI, configuration model redesign,
      editing immutable versions, inferred server-side scheduler state.
requirements:
  - id: "R1"
    text: >-
      The default observation page is not a stack of empty mutation forms. Forms remain
      reachable on mobile and keyboard, and secret fields are transient/cleared at existing
      boundaries.
  - id: "R2"
    text: >-
      Published versions, selected bindings and unsaved proposals are visibly distinct. CAS
      conflict, missing capability and server error preserve meaningful recovery without
      optimistic false state.
  - id: "R3"
    text: >-
      Idle Runtime count is not called compatible capacity. Links and actions reflect actual
      authorization and published capability; unknown placement cause is not invented.
  - id: "R4"
    text: >-
      Preserve current Scheduler settings, Git Settings and any Performance page without route
      or shared-state regressions.
acceptance_criteria:
  - id: "A1"
    given: "An operator opening Runtime configuration/Overview at desktop or mobile width."
    when: "The page loads and an edit/create action is selected."
    then: >-
      Readiness is visible first, the selected form is keyboard usable and current/proposed
      values and effect are clear before submission.
  - id: "A2"
    given: "Concurrent binding changes, a rejected publish, unavailable capabilities or a denied operation."
    when: "The user attempts a change."
    then: >-
      Existing validation and revision semantics hold; values remain distinguishable and errors
      offer a valid next action.
  - id: "A3"
    given: "A Run waits despite an idle incompatible Runtime, or Performance is enabled/disabled."
    when: "The operator navigates related views."
    then: >-
      Compatibility is not inferred from idle count and existing Operations/Settings/Performance
      navigation still works.
tests:
  - name: "ui"
    command: "cd ui && corepack pnpm exec vitest run src/routes/operations"
    covers: ["A1", "A2", "A3"]
  - name: "typecheck"
    command: "make ui-typecheck"
    covers: ["A1", "A2", "A3"]
  - name: "browser"
    command: >-
      cd ui && corepack pnpm exec playwright test e2e/operations-forms.spec.ts
      e2e/scheduler-settings.spec.ts e2e/git-artifacts.spec.ts e2e/responsive-layout.spec.ts
    covers: ["A1", "A2", "A3"]
