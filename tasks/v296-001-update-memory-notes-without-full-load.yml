languages: [go]
goal: Read only the target note when updating an existing Memory note.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: low
  finding: Since V252 WriteMemory always calls LoadAll (up to 129 notes of 32 KiB, about 4 MiB plus blob reads; internal/memory/namespace.go:181-197) to update one note. memory.Store.List and PostgresStore.List (namespace.go:90, postgres.go:39-53) are production-dead after V252.
scope:
