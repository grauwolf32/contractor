schema_version: "1.0"
id: V62-009
title: Connect prepared OpenAPI operations to canonical Audit scan results
milestone: audit-workflow-composition
priority: P1
status: pending
implementation_commit: null
depends_on: [V62-008, V55-007, V55-008, V39-007]
languages: [go, python, yaml, markdown]
goal: Deliver a runnable AuditProfile that analyzes source, generates OpenAPI and performs bounded per-operation scanning with accepted Audit results.
context:
  authority: User-requested source analysis to OpenAPI to scanning Audit journey.
  design: docs/plans/2026-09-20-audit-workflow-composition.md
  specification:
    - docs/spec/19-audits.md
    - docs/spec/25-audit-worker-finalization.md
    - docs/spec/31-scan-request-preparation.md
    - docs/spec/32-scan-planning.md
  reuse: Existing RequestSet preparation, deterministic scan planning, tool Workers, SQLMap request execution and Audit result package schemas remain authoritative.
scope:
  in:
    - Add a bounded audit-openapi-scan Workflow adapter consuming task, execution_manifest, exact prepared OpenAPI and explicit target/request settings.
    - Select only the assigned operation and supplied test parameters; reuse deterministic concrete-request preparation and scanner execution.
    - Assemble canonical per-item Audit results with trusted manifest identity, retained scanner evidence and explicit technical/semantic/gap distinctions.
    - Fix the adapter execution/finalization contract using existing result packages without misapplying the single-Worker audit-check-results@1 strategy to a multi-stage or tool-only path.
    - Ship one complete profile referencing project-analysis@1, openapi-from-analysis@4 and the actual new adapter, plus runnable local input examples.
    - Preserve existing active-check approval and scanner capability requirements; record unavailable data, binaries, auth, truncation and unknown outcomes truthfully.
  out:
    - New scanner engines, autonomous pentest authorization, guessed request values/credentials, scanner installation or production target execution.
deliverables:
  - path: configs/workflows
    description: New immutable audit-openapi-scan Workflow and any explicit preparation/result-assembly binding it requires.
  - path: configs/audit-profiles
    description: Fully resolving generated-OpenAPI AuditProfile with bounded inventory and approval-required active checks.
  - path: internal/scanplan
    description: Reused deterministic operation selection and RequestSet preparation with needed adapter seams only.
  - path: runtime/src/contractor_runtime
    description: Trusted scan-to-Audit result assembly where required by the chosen ordinary Worker completion path.
  - path: tests/e2e
    description: New TestPreparedOpenAPIAuditScanAcrossProductionProcesses with real component boundaries and controlled scanner fixtures.
  - path: docs/guides/audits.md
    description: Complete setup, profile, input, approval, result and gap walkthrough.
acceptance_criteria:
  - id: A1
    text: One started Audit derives items from its generated OpenAPI, runs only assigned bounded SQLMap checks and imports canonical item results with exact source/operation/scan provenance.
  - id: A2
    text: Missing concrete inputs, excluded parameters, failed/truncated scanner output and unknown outcomes produce explicit gaps or failures, never fabricated passing checks.
  - id: A3
    text: Ordinary scanner Workflows and existing Audit completion strategies remain compatible; the new profile resolves all exact refs and retains current approval enforcement.
  - id: A4
    text: Restart, cancellation and collection replay preserve invocation/receipt identity without automatically repeating a scanner action whose outcome is unknown.
tests:
  - command: go test ./internal/scanplan ./internal/config ./internal/auditimport ./internal/auditcontroller
    covers: [A1, A2, A3, A4]
  - command: cd runtime && uv run --frozen pytest -W error tests/test_tool_worker.py tests/test_scan_toolset.py tests/test_scan_http_request.py tests/test_audit_completion_contracts.py
    covers: [A2, A3, A4]
  - command: go test -tags=e2e -count=1 -timeout=6m ./tests/e2e -run '^TestPreparedOpenAPIAuditScanAcrossProductionProcesses$'
    covers: [A1, A2, A3, A4]
test_prerequisites:
  - New named process test must be discovered and executed; disposable PostgreSQL, local target, installed controlled scanner and scripted model/validator fixtures are required.
verification_requirements:
  - Verify the complete canonical result package and receipt, not only a successful scanner exit or JSON report.
  - Do not represent this bounded scan profile as the unimplemented autonomous pentest or independent PoC verification program.
