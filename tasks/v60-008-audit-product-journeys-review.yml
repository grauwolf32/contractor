  discovered_import_limitation: V60-012 PostgreSQL probe confirmed same-Audit receipt replay succeeds, but importing
    that receipt into a second compatible Audit fails with audit_findings_pkey SQLSTATE 23505 and rolls back.
    Migration 041 derives the global finding ID solely from receipt ID. Explicit accepted same-receipt multi-Audit
    semantics were not found; clarify that contract and expected HTTP outcome before choosing identity/migration changes.
scope:
  in:
  - Exercise review TTL, decision replay, multiround restart and retained evidence/report consistency.
  - Resolve the documented same-receipt multi-Audit import contract; reproduce the current identity collision and
    create a bounded correction task with an explicit compatibility and migration decision.
  - Run browser Project/input/Run/result/repeat and Audit/finding/review/report journeys, including errors and unavailable
    exact sources.
  - Distinguish current delivered behavior from pending scan/SARIF/Evals UX work.
  out:
  - Take over active V38 managed Evals, V40-002, V55-004 or V61 toolsets; change intentionally deferred semantics without a contract decision.
  - Live model runs, production data mutation or deployment.
  - Claim whole-project correctness from one review slice.
acceptance_criteria:
- id: A1
  text: All scoped scenarios have source/history analysis and either executed representative verification or a precise
    unresolved limitation; unresolved required verification keeps this task in_progress.
- id: A2
  text: Confirmed defects have reproduction, normative basis, priority, bounded correction task and meaningful regression;
    accepted or rejected hypotheses are recorded separately.
- id: A3
  text: Required commands execute successfully on the reviewed commit; relevant database/process/browser cases must
    not silently skip, and actual toolchain and evidence levels are recorded.
