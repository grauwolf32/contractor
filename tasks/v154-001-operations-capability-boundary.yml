schema_version: '1.0'
id: V154-001
title: Enforce Operations capability across management routes
milestone: operations-capability-boundary-2026-10
priority: P1
status: in_progress
depends_on: [V153-001]
languages: [go]
goal: Require the Operations capability before any management request reaches its handler.
context:
  issue: https://github.com/grauwolf32/contractor/issues/79
  finding: Only selected Operations handlers check capability; credential and RuntimeConfig mutations and configuration publication can bypass the intended boundary.
scope:
  in:
    - Apply Operations capability middleware to the entire /v1/operations/ subtree.
    - Guard configuration publication, which is outside that subtree.
    - Verify denied requests have no management side effects.
  out:
    - Change login or public server timeout behavior completed in V152 and V153.
acceptance_criteria:
  - {id: A1, text: Every /v1/operations/ request requires an authenticated Operations principal.}
  - {id: A2, text: Configuration publication requires Operations capability.}
  - {id: A3, text: Authorized requests continue to route normally.}
tests:
  - {command: go test ./internal/httpapi/public -count=1, covers: [A1, A2, A3]}
  - {command: go vet ./internal/httpapi/public, covers: [A1, A2, A3]}
