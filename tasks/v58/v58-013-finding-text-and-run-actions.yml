schema_version: '1.0'
id: V58-013
title: Restore full Finding descriptions and improve expanded history layouts
milestone: ui-design-review
priority: P1
status: completed
implementation_commit: c030303ab81a80665836ccc484dae7e45e3ed504
depends_on:
- V58-012
languages:
- typescript
- css
- markdown
goal: Address user-reported Finding readability and completed Run/allocation layout regressions after the UI design release.
context:
  authority: User requests full Finding descriptions, completed Run actions inside their cells, wider readable labels, source artifact links when present in the model, and completed allocation details that use the available row width.
  design: docs/plans/2026-09-19-ui-design-implementation.md
scope:
  in:
  - Render full Finding Markdown by default in Audit and Project Findings, retaining access to review decisions.
  - Display expanded Run context across the row with readable label keys and values.
  - Link Findings to exact source artifacts recorded in Audit inputs, without inferring file paths from generated prose.
  - Reserve sufficient space for completed Run delete controls at desktop and mobile widths.
  - Display expanded completed allocation metrics across the row, using columns where space permits.
  - Verify, merge into local main and update the UI stand while preserving concurrent work and backend state.
  out:
  - Changes to API data, Finding decisions or Run deletion semantics.
acceptance_criteria:
- id: A1
  text: Finding descriptions render completely without clipping, character limits or an extra disclosure action.
- id: A2
  text: Every completed Run delete control fits within its cell and row without overlapping neighboring content, including narrow screens.
- id: A3
  text: The tested UI release is deployed and the affected views are checked on the stand without changing queue or backend state.
- id: A4
  text: Expanded labels use the available row width and retain complete keys and values.
- id: A5
  text: Finding source links preserve exact artifact revisions and return to the originating Finding; no file or line reference is invented.
- id: A6
  text: Expanded completed allocation metrics use the available row width, with multiple columns on wide screens and readable stacking on narrow screens.
tests:
- command: cd ui && corepack pnpm test --run src/routes/projects/audits/audits.test.tsx src/routes/runs/runs.test.tsx src/routes/operations/performance/performance.test.tsx
  covers: [A1, A2, A4, A5, A6]
- command: Read-only browser checks for full descriptions, expanded allocation metrics and delete-button containment at 1440, 1024, 768, 390 and 320 px; repeat affected routes on the deployed UI.
  covers: [A1, A2, A3, A4, A5, A6]
verification_results:
- Full Finding Markdown is visible in both Audit and Project Findings; review navigation no longer covers description text.
- Exact source artifact revision links and return-to-Finding navigation passed against the live model; no file/line reference was invented.
- All 47 focused UI tests, ESLint/Prettier, both TypeScript projects and production build passed.
- 21 affected route/width captures passed before and after deployment; six viewport sizes passed delete-button, label and allocation layout checks without document overflow.
- At 1920 px the first expanded allocation card widened from 341 to 1189 px and shortened from 677 to 230 px; all six metric values were retained.
- UI 0.3.1 was merged into local main and deployed; queue, scheduler, 147 Runs, four Runtime identities, backend PIDs and core release were preserved.
- Existing unrelated local edits were preserved; evidence is in tasks/evidence/v58-013.json and .local/ui-design-implementation/phase-013.
