schema_version: '1.0'
id: V58-014
title: Remove redundant configuration navigation and clarify credential inventory
milestone: ui-design-review
priority: P1
status: completed
implementation_commit: e981099436b55528c6d5f85873ac8bbb692ad852
depends_on:
- V58-013
languages:
- typescript
- css
- markdown
goal: Remove the redundant configuration panel while retaining useful contextual links and accurate managed LLM credential inventory copy.
context:
  authority: User asks to remove the redundant configuration panel from all screens after reviewing its purpose; retain the credential inventory clarification.
  evidence: Browser navigation works for other destinations; the current section links to itself. The live managed inventory has zero entries, development tokens are configured, and two separate Runtime credentials exist.
scope:
  in:
  - Remove the shared configuration navigation component and its styles from every consumer, retaining unrelated shared styles and contextual links.
  - Clarify managed LLM credentials, development tokens and Runtime service credentials in the inventory copy and navigation.
  - Verify navigation and empty/loaded inventory behavior, merge into local main and deploy UI while preserving backend state and unrelated edits.
  out:
  - Creating credentials or changing tokens, budgets, provider access, Server contracts or Runtime settings.
acceptance_criteria:
- id: A1
  text: The redundant panel is absent from all five consuming views; primary navigation and contextual Runtime credential and Git SSH links remain usable.
- id: A2
  text: The LLM inventory identifies managed credentials and explains that development tokens are not listed; empty state is accurate and creation remains available.
- id: A3
  text: Existing credential listing and lifecycle tests pass; browser checks cover all four configuration areas at desktop and mobile widths without overflow or writes.
- id: A4
  text: The verified UI release is merged into local main and deployed without changing credentials, queue, scheduler, Runs or Server/Runtime processes.
tests:
- command: cd ui && corepack pnpm test --run src/routes/operations/operations.test.tsx src/routes/operations/settings/settings.test.tsx
  covers: [A1, A2, A3]
- command: make ui-lint ui-typecheck ui-build and read-only browser navigation/inventory checks before and after deployment.
  covers: [A1, A2, A3, A4]
verification_results:
- Shared configuration navigation and its component/styles were removed from all five consuming views; remaining shared styles are imported directly.
- Contextual Runtime service credential and Git SSH links remain usable by pointer and keyboard; managed inventory clarification is retained.
- All 14 focused Operations/Settings tests, ESLint/Prettier, both TypeScript projects and production build passed.
- Five views at 1440/390/320 px passed before and after deployment, with six contextual-link checks and retained Runtime form collapse styles; no overflow, API/JavaScript errors or attempted mutations.
- UI 0.3.3 was merged into local main and deployed; credentials, queue, scheduler, Runs, Runtime identities, backend processes and core release were unchanged.
- Unrelated local changes were preserved; evidence is in tasks/evidence/v58-014.json and .local/ui-design-implementation/phase-014-removal.
