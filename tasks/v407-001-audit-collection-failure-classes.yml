schema_version: "1.0"
id: V407-001
title: "Classify Audit collection failures: transient reads stay retryable, pinned-data decoding is permanent"
milestone: server-runtime-review-2026-10
epic: audits
kind: defect
introduced_by: V45-004
priority: P1
status: pending
depends_on: []
languages: [go]
goal: "A storage blip never settles an Audit item as invalid, and an undecodable pinned plan, report or manifest fails the execution permanently instead of being retried every tick."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings E1, E3, E11; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/audits/execution.md
  severity: high
  finding: >-
    Three sibling paths in internal/auditimport classify collection failures
    wrongly. (1) check_results.go:240-244 resolveMemberProposals turns every
    error of validateMappedProposalStandards into
    invalidCheckResults{code: finding-proposal-standard-reference-invalid};
    collectSucceeded then commits a CollectionInvalidResult receipt and
    consumes an item attempt. But validateMappedProposalStandards
    (standards.go:81-84) returns loadStandards errors unchanged, and the loader
    (standards.go:60-66) returns a plain transient error for a failed
    ReadProjectExact of the retained standard and ErrPermanent for an invalid
    baseline. On a retry attempt where every proposal is already held
    (NeedsRetention false, collection_list.go:30-35) the first loader call of
    the attempt happens inside resolveMemberProposals, so a storage blip
    permanently settles the item as invalid-result.
    TestCollectionLoadsPinnedStandardsOncePerAttempt covers only the
    retain-first path. (2) collectSucceeded wraps a bad execution manifest as
    ErrPermanent (check_results.go:75), but collectScanRecovery
    (scan_recovery.go:30-51, 79-86) returns DecodeExecutionManifest errors
    raw, scan_retention.go:26-36 and auditscan/result.go:82-97 return raw
    errors for an invalid retained plan or report, assignment mismatch and
    bound overflow, auditscan/evidence.go:63-64,112-113 returns raw identity
    and availability errors, and preparation.go:23-26 decodes the profile
    snapshot raw where importer.go:168-173 wraps it. None of these inputs
    change between ticks, so the controller (collection.go:18-25) retries the
    execution forever: the Audit neither fails nor settles. internal/auditscan
    has no tests. (3) importer.go:318,369 retainFindingProposals pages with
    pagelimit.MaxRows (200) and hands the page to
    RetainAuditCollectionBatch, which returns ErrInvalid above
    findingintake.MaxAuditReceiptBatchSize (200); the importer treats
    ErrInvalid as retryable, so if the two literals ever differ the execution
    retries forever.
  siblings: >-
    collectSucceeded's manifest path (check_results.go:75) and
    importer.go:168-173 already wrap as ErrPermanent and are the model to
    follow. collectContractInvalid is the existing sink for ErrPermanent.
    Every other decode of pinned Audit data in internal/auditimport and
    internal/auditscan must be checked and listed in the task log.
plan:
  - "Add a helper in internal/auditimport (e.g. permanentDecode(err, what string) error) that wraps as ErrPermanent and use it at every decode or validation of pinned data: scan_recovery.go, scan_retention.go, auditscan/result.go BuildResult callers, auditscan/evidence.go, preparation.go. Grep for DecodeExecutionManifest, DecodeScanPlan, DecodeScanReport, ValidateRetainedPayload, json.Unmarshal and strictjson.Decode under internal/auditimport and internal/auditscan to find each one."
  - "In resolveMemberProposals, split validateMappedProposalStandards: call loadStandards() first and return its error unchanged (transient stays transient, ErrPermanent reaches collectContractInvalid); wrap only validateProposalStandardRefs and the mapping result in invalidCheckResults."
  - "In retainFindingProposals, derive the page size from findingintake.MaxAuditReceiptBatchSize (or export one constant both use) and map ErrInvalid from RetainAuditCollectionBatch to ErrPermanent."
  - "Record in docs/spec/audits/execution.md, next to the collection failure outcomes, the rule: a read of retained content is retryable; an invalid retained document or manifest is permanent; a contract violation by the Worker is an invalid result."
  - "Tests on the harness used by TestCollectionLoadsPinnedStandardsOncePerAttempt: (a) all proposals retained, standard read fails on the second attempt, expect a retryable error and no receipt; (b) invalid retained scan plan, expect ErrPermanent and the execution marked failed on the next tick; (c) batch bound exceeded, expect ErrPermanent. Add package tests for internal/auditscan BuildResult and scanHistory."
scope:
  in:
    - "Every decode or validation of pinned Audit data in internal/auditimport and internal/auditscan returns ErrPermanent."
    - "Loader errors propagate unchanged from resolveMemberProposals."
    - "One batch size for proposal retention; ErrInvalid from the batch is permanent."
    - "Regression tests on the real harness and PostgreSQL for each of the three paths."
  out:
    - "Changing the receipt or attempt accounting of collection."
    - "Changing the Worker-facing result package format."
acceptance_criteria:
  - id: A1
    text: "A failing ReadProjectExact of a retained standard during a retry attempt with all proposals held yields a retryable error, no CollectionInvalidResult receipt and no consumed attempt; the next attempt succeeds."
  - id: A2
    text: "An invalid retained scan plan, report, execution manifest or profile snapshot settles the execution as failed with a permanent classified error within one controller tick; it is not retried."
  - id: A3
    text: "A retention page larger than the receipt batch bound cannot occur (one constant), and a forced ErrInvalid from the batch is classified permanent."
  - id: A4
    text: "Each new test fails on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/auditimport/... ./internal/auditscan/... ./internal/auditcontroller/..."
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3]
