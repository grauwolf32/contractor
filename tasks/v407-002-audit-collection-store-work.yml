schema_version: "1.0"
id: V407-002
title: "Bound Audit result collection store work per tick: batch receipt resolution, metadata-only evidence reads, one retention transaction"
milestone: server-runtime-review-2026-10
epic: audits
kind: defect
introduced_by: V45-004
priority: P2
status: pending
depends_on: []
languages: [go, sql]
goal: "Collecting one execution issues a bounded, batched number of statements and never copies evidence payloads it does not use."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings E5, E6, C4; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/audits/execution.md
  severity: medium
  finding: >-
    (1) internal/auditimport/check_results.go:134 prepareCheckResults calls
    ReadRunExact for every external evidence item only to obtain its
    descriptor; ServiceArtifactAccess.ReadRunExact (artifacts.go:77-96) does
    Metadata plus ReadExact and copies the full payload, which the caller
    drops. check_results.go:306-337 retainCheckResults then calls
    RetainRunExact once per distinct evidence source, each in its own
    WithArtifactWrite transaction (auditstore/internal/pgstore/artifact_writes.go:24-60)
    that takes the claim lock and SELECT ... FOR UPDATE on the audits row.
    Bound per Collect: 64 items x 256 evidence = up to 16384 full payload
    reads and 16384 serial Audit-row-locking transactions in one tick; the
    existing test uses one evidence item. (2)
    internal/findingintake/postgres.go:257-312 ResolveAuditProposals is N+1:
    per key it runs the resolution query, readReceiptByID (which runs
    readAuditHolds) and hydrateReceiptDocuments with a one-element slice (one
    artifact read each), although hydrateAuditReceiptBatch and
    GetOwnerAuditReceipts already exist for this shape. Called from
    check_results.go:202 with up to 128 keys x 64 items = 8192 keys, about
    32k statements plus 8k single artifact reads per Collect. (3)
    internal/auditstore/internal/pgstore/finding_collection.go:19-43
    CollectionReceiptIDs runs two queries per finding on a pool connection
    (revision and first receipt, then contributions), up to
    MaximumCollectionEntries = 256 findings, 512 round trips with no common
    snapshot.
  siblings: >-
    hydrateAuditReceiptBatch, readRunAuditHoldsBatch and GetOwnerAuditReceipts
    are the batched readers to reuse. internal/auditservice/preparation.go
    and generated_inventory.go read inventory payloads similarly (covered by
    V407-004). Memory and finding intake Submit paths read one StageExecution
    three times (V407-005).
plan:
  - "Add a metadata-only accessor on the Audit artifact access seam (DescribeRunExact or reuse Metadata) and use it in prepareCheckResults; keep ReadRunExact for the one place that needs bytes."
  - "Fork all retained artifacts of one execution inside one WithArtifactWrite transaction: collect the distinct sources first, then call a batch RetainRunExact (new pgstore method with unnest of (run_id, name, revision)) under one audits FOR UPDATE."
  - "Rewrite ResolveAuditProposals as one resolution statement over unnest($keys) returning (key, receipt_id, hold ...), then readRunAuditHoldsBatch and hydrateAuditReceiptBatch once; delete the per-key path. Move the SQL into postgres_sql.go (10-line rule)."
  - "Rewrite CollectionReceiptIDs as one statement with finding_id = ANY($3) and a LEFT JOIN on audit_finding_contributions bounded by LIMIT, scanned into the existing result shape."
  - "Add a PostgreSQL test that collects one execution with 64 items x 256 evidence refs from 8 sources and asserts, via a pgx tracer or pg_stat_statements counter, that the statement count is below a fixed bound (for example 20) and that only one FOR UPDATE on audits happens; add a 256-finding test for CollectionReceiptIDs."
scope:
  in:
    - "Metadata-only descriptor reads for evidence."
    - "One retention transaction per execution."
    - "Batched proposal resolution and collection receipt reads."
    - "Realistic-size PostgreSQL tests with statement counting."
  out:
    - "Changing the evidence or receipt contracts."
    - "Audit inventory reads (V407-004)."
acceptance_criteria:
  - id: A1
    text: "Collecting an execution with 64 items and 256 evidence references each performs no payload read for descriptors and at most one artifact-write transaction."
  - id: A2
    text: "ResolveAuditProposals with 8192 keys issues a bounded number of statements independent of key count (one resolution statement plus the two batch hydrations, paged by the existing batch bounds)."
  - id: A3
    text: "CollectionReceiptIDs for 256 findings issues one statement."
  - id: A4
    text: "The statement-count tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/auditimport/... ./internal/findingintake/... ./internal/auditstore/..."
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3]
