schema_version: "1.0"
id: V11-006
title: Port backend-independent edit-files@1 tools
milestone: runtime-filesystems-mvp
priority: P0
status: planned
implementation_commit: null
depends_on: [V11-004, V11-005]
languages: [python, go]

goal: >-
  Give a Worker exact, atomic text/path editing operations that behave the same
  over writable local, isolated memory and overlay mounts without knowing which
  backend implements WorkspaceWriter.

context:
  exact_tools: >-
    edit-files@1 exports write_file, append_file, mkdir, rm, cp, mv,
    insert_line, edit and replace_range. The Toolset receives only a
    WorkspaceWriter. It must not inspect concrete classes, implicitly create an
    overlay or receive host paths. One supplied string is at most 1 MiB and one
    resulting text file at most 4 MiB; mount quotas are enforced by projectfs.
  backend_matrix: >-
    memory edits its allocation-owned clone; overlay-local and overlay-memory
    edit only their private upper; local edits host data only when trusted
    Runtime config has hostWrite=true. A read-only mount returns
    workspace_read_only even if another mount made this Toolset available.
  legacy_reference: >-
    Port semantic fixtures from contractor-old read_tools/write_tools for exact
    replacement, anchor occurrence, line ranges, trailing newline and LF/CRLF
    preservation. Do not port isinstance(MemoryOverlayFileSystem), implicit
    wrapping, raw fsspec delegation or backend-specific branches.

scope:
  in:
    - Implement every exact tool as a pure validation/transformation step followed by one WorkspaceWriter mutation.
    - write_file and append_file accept strict UTF-8/no-NUL text and report changed false for a byte-identical result.
    - mkdir honors create_parents/exist_ok; rm requires explicit recursion for a non-empty directory.
    - cp/mv stay within one mount, require recursion for directories and reject root, self and descendant targets.
    - insert_line selects one-based anchor occurrence and before/after placement without normalizing an existing file's dominant LF/CRLF style.
    - edit requires exactly one literal match unless replace_all=true; an empty old_string creates only a missing file and cannot erase/duplicate an existing file.
    - replace_range uses one-based inclusive bounds with documented insertion/deletion behavior and preserve_trailing_newline.
    - Validate quotas and all input before mutation; exceptions/cancellation leave the complete previous bytes/tree.
    - Retain metrics with operation, virtual paths, counts, sizes, changed and error code; never retain content, old_string, new_string or anchor plaintext.
    - Add the exact edit-files@1 static descriptor and descriptor/runtime parity tests, with no other Server modification.
  out:
    - Diff, rollback, materialization, patch export, shell commands, formatting, binary writes, Server API/state or backend selection by model input.

deliverables:
  - {path: runtime/src/contractor_runtime/toolsets/edit_files.py, description: Narrow Writer-only ADK Edit Toolset.}
  - {path: runtime/tests/test_edit_files_toolset.py, description: Exact semantics atomicity and backend matrix tests.}
  - {path: internal/config/descriptors.go, description: Static edit-files@1 exported-name metadata only.}
  - {path: internal/config/config_test.go, description: Exact descriptor and Runtime parity coverage.}

requirements:
  - id: R1
    text: Tool code imports WorkspaceWriter protocols/DTOs only and contains no concrete local, memory, overlay or fsspec type check.
  - id: R2
    text: Each call is one observable mutation or no mutation; failed transformations never leave a partially written target or half-moved tree.
  - id: R3
    text: User/model content is excluded from logs, metrics, generic exceptions and repr while safe virtual paths remain diagnosable.
  - id: R4
    text: The existing local-workdir@1 allocation scratch is neither selected nor mutated through edit-files@1.

acceptance_criteria:
  - id: A1
    given: The same writable fixture on local-hostWrite, memory, overlay-local and overlay-memory mounts.
    when: The complete nine-tool success/no-op/error matrix executes.
    then: Effective virtual results match and only direct local-hostWrite mutates a host lower before materialization.
  - id: A2
    given: Zero/multiple matches, invalid line ranges, mixed newlines, quota overflow, read-only mounts and injected cancellation.
    when: Each editing tool fails.
    then: Stable safe errors are returned and the prior file/tree snapshot remains byte-identical.
  - id: A3
    given: edit-files@1 Runtime exports and static descriptor.
    when: Parity/config selection tests run.
    then: Exactly nine tool names match and no Server runtime/filesystem behavior was introduced.

tests:
  - {name: edit-toolset, command: "cd runtime && uv run pytest tests/test_edit_files_toolset.py", covers: [A1, A2]}
  - {name: descriptor, command: "go test ./internal/config", covers: [A3]}
  - {name: runtime-regression, command: "cd runtime && uv run pytest", covers: [A1, A2]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
