schema_version: '1.0'
id: V410-001
title: Publish a bounded Project sitemap through one authorized reducer
milestone: project-sitemap-2026-10
epic: projects-artifacts
kind: feature
priority: P1
status: pending
depends_on: []
languages:
- go
- sql
- json
- yaml
- markdown
goal: Deliver a usable owner-facing sitemap service over ordinary ArtifactStore revisions, with deterministic identity,
  safe metadata, reversible edits, bounded retained history and cumulative Run write budgets on every publication path.
context:
  authority: User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence. The same-day follow-up selects
    oldest-unpinned eviction at the retained-history limit, preserving existing exact retention obligations.
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 2-4, 6-11: representation, projection, identities, source replacement, suppression,
    CAS, quotas and lifecycle.'
  specification:
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/api/public-api.md
  - docs/spec/platform/security.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or deferred V61/V62/V64
    work.
  code:
  - internal/artifacts
  - internal/projectstore
  - internal/projectlifecycle
  - internal/httpapi/public
  - internal/cli
  - internal/contracts
  - internal/persistence/migrations
  - api/openapi/contractor-public-v1.yaml
  - api/testdata
  - internal/archtest/layers_test.go
scope:
  in:
  - Create the owning normative sitemap specification, strict versioned document/typed mutation schemas, canonical
    fixtures and one domain reducer, with a classified layer and a production service caller in this task.
  - Ship owner-bound Project read/mutation operations and matching CLI/public-client callers; endpoint and export
    additions cannot be left referenced only by tests.
  - Implement safe ingress projection, trusted source/content-kind provenance, engagement-local or Run-local context
    keys, bounded concrete members and loss-aware regrouping; user-supplied facts cannot fabricate trusted HTTP
    observations.
  - Implement conditional creation, append merges, expected-revision manual edits, guarded source replacement, suppression/restore
    and bounded source/global gaps.
  - Atomically admit publications against retained Project history and cumulative Run write budgets; enforce the
    dedicated binding policy on direct public Artifact writes/forks/rebinding and keep trusted accounting outside
    replaceable document bytes.
  - Implement ArtifactStore-side bounded oldest-unpinned revision eviction for opted-in managed sitemap bindings
    and partitions, with this sitemap service as its first production caller. Update immutable-delete specs and
    triggers through the named trusted ArtifactStore retention owner, not an unchecked deletion bypass.
  - Integrate indexed protection checks with existing authoritative exact-reference and hold lifecycles, including
    JSON-backed references; FK-only checks and whole-database JSON scans per publication are insufficient.
  - Integrate ordinary Run deletion and Project purge without breaking independently held evidence; define wire/public
    errors, limits and failure outcomes alongside code.
  out:
  - Runtime allocation grants and model tools (V410-002).
  - Automatic collectors and source adapters (V410-003 through V410-005).
  - A second sitemap database, event journal, global automatic Artifact history GC, delta storage, TTL retention
    or a new receipt/claim/hold-lease mechanism. No manual pin API is required by this task.
  - UI sitemap graph, complete traffic archival and pentest enforcement.
requirements:
- id: R1
  text: Use the proposal section 10 limits as the single selected starting policy; publish them once in the shared
    registry/schema and test all consumers against shared fixtures. Missing binding is empty; malformed existing
    bytes are a permanent error and are never replaced implicitly.
- id: R2
  text: Project identity and producer/source attribution come from authenticated service context. Safe projection
    runs before public keys/digests/examples and removes secret-bearing path/query/body/header/structural values
    without storing raw-secret hashes. Omitted data has bounded reason metadata.
- id: R3
  text: Contexts include trusted engagement/baseline identity plus local identityId, or Run-scoped/unknown identity
    for ordinary Runs; aliases or labels do not merge principals. Concrete-member inventory is distinct from representative
    examples; overflow cannot support lossless later regrouping.
- id: R4
  text: Preserve member-scoped metadata and suppression through regrouping. Ambiguous split/merge conflicts instead
    of widening an edit, resurrecting a suppressed member or assigning discarded observations to a new route.
- id: R5
  text: A source replacement checks stable sourceId/deployment attribution and its expected generation, exact predecessor
    ref/digest and policy digest. A stale pinned computation may be retained privately but cannot adopt a fresh
    generation and retry its old source as current.
- id: R6
  text: Use existing keyed mutation receipts and Artifact CAS, with at most three CAS retries inside the owning
    deadline for rebasable observation batches. Manual/source conflicts stay permanent; lost acknowledgements never
    create another accepted revision.
- id: R7
  text: Project quota counts currently retained full encoded logical bytes and revision count across all managed
    sitemap bindings/partitions, including current and protected revisions. Defaults are 2,000 revisions/1 GiB,
    configurable only up to 20,000/8 GiB; physical blob deduplication does not reduce this logical charge. Lifetime
    publication totals are metrics only. Separately preserve each producer Run's cumulative 256-revision/256-MiB
    write-work budget; eviction never refunds it. At 32 MiB per revision this permits only eight accepted publications
    per Run, which V410-007 must prove useful or resolve through a reviewed representation/coalescing remedy.
    A numeric ceiling change needs an explicit user-approved policy revision; no silent increase.
- id: R8
  text: Run creation/deletion, entry removal, rebinding/resetting, generic Artifact mutations and partitioning
    cannot bypass Project-wide retained-history accounting or erase the producer Run's cumulative accounting.
    A true no-op, failed CAS or receipt replay adds no storage/write charge, but remains bounded by request bytes,
    attempts and the original deadline. All publication paths use the same policy before the first revision exists.
- id: R9
  text: Choose oldest committed unprotected history first, ordered by immutable revision-creation timestamp then revision as a stable
    tie-breaker. Preserve current, legitimate explicit retention pins, exact Run inputs, StageContext/StageResult,
    outputs, Audit proof/report holds and existing lineage obligations. Ordinary provenance mentions and successive
    sitemap CAS revisions do not create pins or predecessor lineage chains. Never cut a real lineage edge or
    weaken provenance/holds to admit another write. Use indexed retention checks and lifecycle hooks rather than
    a parallel hold-lease system, and update every authoritative acquisition/release path in this same change.
- id: R10
  text: Serialize pin acquisition/release, CAS, history admission, eligible eviction and both counters atomically
    at the existing ArtifactStore/Project mutation boundary. Calculate fit against the post-publication state;
    new current is protected; former current may be evicted in that same transaction only if it has no other hold.
    Before commit the previous current remains readable. A failed attempted publication changes no current, pins
    or counters and rolls back its eviction; separately committed authorized maintenance may already have removed
    eligible history and must be reported distinctly. If protected post-publication revisions, including new current,
    cannot fit, return permanent 409 sitemap_history_protected without changing current or dropping a hold.
- id: R11
  text: Each retention transaction examines at most 64 candidate rows and removes at most 64 revision-metadata
    rows, loading no payload. If more work is needed, continue through a bounded ArtifactStore keyset/index path
    and return 503 sitemap_history_maintenance_pending with bounded Retry-After backpressure; at most three caller
    retries fit the original deadline. Bind continuation/exhaustion conclusions to the protection/eligibility
    generation or an index preserving
    current oldest-eligible ordering. Unpin behind the cursor invalidates/reseeks before a younger victim or
    no-candidate result; revalidation still obeys all bounds. An incomplete/invalidated scan cannot claim all history is pinned.
    Unreachable storage follows its existing classification. Reuse reference-safe shared-version/blob collection;
    a surviving binding/revision/hold prevents physical deletion. Separately bound physical collection to at most
    64 version/blob candidates and 64 MiB encoded payload per pass, using recorded size metadata. PostgreSQL
    deletion is transactional and filesystem unlink follows the existing post-commit contract; logical quota
    release does not promise immediate disk reclamation. No eviction/collection loop may exceed its deadline.
- id: R12
  text: Eviction does not erase keyed mutation receipts. Replay confirms the original committed outcome and exact
    ref without republishing, charging again or implicitly pinning that ref; if its revision was evicted, exact
    read is explicitly unavailable and never falls forward to latest. A selected proof/context ref must acquire
    its existing protected binding/reference atomically against eviction; a lost race returns exact-source
    unavailability, with explicit caller refresh/reselection rather than substitution. Caches never create holds.
failure_outcomes:
- operation: Owner read or typed mutation, including public Artifact bypass attempts
  permanent: Reject invalid/unsupported documents and projection input with documented 400 sitemap validation errors;
    owner-safe 404 for foreign Project; 409 for manual/source conflict, cumulative Run write budget exhaustion
    or sitemap_history_protected. Failed attempts preserve current/holds/counters; no automatic retry of permanent
    retention conflicts. An evicted exact ref returns artifact_not_found 404, never latest.
  retryable: Classified storage_transaction_conflict/unavailable storage follows existing bounded retry policy;
    sitemap_history_maintenance_pending 503 advertises Retry-After and permits at most three attempts within the
    original deadline. Deterministic rejection is never retried and incomplete scans stay retryable, not all-pinned.
  ambiguous: Reuse the existing keyed receipt and original committed exact ref, even after eviction; replay never
    recreates or pins missing bytes and never recharges usage. Report already committed maintenance separately.
  cancelled: Join service work before returning cancellation; a committed publication remains discoverable by receipt.
  timeout: The API operation deadline owns storage/reducer work; expiry does not authorize recreating a binding
    or resetting counters.
- operation: Retention maintenance or legitimate pin acquisition/release racing a publication
  permanent: An absent/evicted exact source returns artifact_not_found 404 before a new protected ref is committed;
    required existing holds or lineage are never weakened. Invalid eligibility requests fail permanently.
  retryable: Existing storage_transaction_conflict 503 and bounded maintenance backpressure use the original
    deadline and bounded cursor/index; no unbounded rescan or new lease/receipt mechanism.
  ambiguous: Re-read authoritative reference/protection state or the existing mutation receipt; never assume a
    missing response released a hold. Already committed maintenance stays committed without implying publication.
  cancelled: Join transaction work; rolled-back publication/hold changes have no effect and partial maintenance
    resumes only from a committed cursor. Physical shared-blob cleanup follows its existing lifecycle owner.
  timeout: Each transaction obeys the 64-candidate/64-deletion bounds and caller deadline; timeout cannot authorize
    deleting protected history or falling forward to a different exact ref.
- operation: Run deletion or Project purge racing a publication
  permanent: Deleting/fenced scope rejects publication; source evidence that no longer exists is unavailable rather
    than an empty successful ref.
  retryable: Use existing Project deletion claim/recovery and bounded purge batches.
  ambiguous: Reconcile through existing lifecycle state and exact Artifact identities, not an added journal.
  cancelled: Deletion uses existing cancel/drain/release gates before purging scope data.
  timeout: Lifecycle deadlines and claims retain their existing owners; a timed-out batch resumes from committed
    state.
cardinality:
- collection: Current map, concrete members, sources, rules, suppression and provenance
  expected: 100-1000 groups and 1-10 writers
  maximum: Proposal 0042 section 10 ceilings; the encoded document bound independently caps all nested state
  bound: Bound one reducer request by batch rows/bytes and one map; reject conflicting or over-limit edits atomically
    and aggregate omission counters without per-event growth.
- collection: Retained sitemap history across every managed binding/partition of one Project
  expected: Coalesced revisions with oldest-unpinned eviction allowing long-lived sequential Runs
  maximum: Default 2,000 revisions/1 GiB retained full logical bytes; configurable hard ceilings 20,000/8 GiB
  bound: At most 64 candidate rows and 64 removed revision-metadata rows per transaction, no payload reads or
    all-JSON scans; indexed protection predicates include their parent lifecycle scopes. Bounded cursor maintenance
    and backpressure handle longer scans without bypassing shared-version/blob references.
- collection: Unreferenced physical versions/blobs after authorized revision eviction
  expected: Shared payloads often remain referenced, so logical reclamation need not free a blob
  maximum: 64 version/blob candidates and 64 MiB encoded payload per collection pass
  bound: Use recorded sizes and indexed reference checks; preserve every shared reference, transactional PostgreSQL
    deletion and post-commit filesystem unlink. Report physical reclamation separately from retained logical quota.
- collection: Cumulative sitemap publications by one producer Run
  expected: Bounded coalesced batches and no charge for true no-ops or receipt replay
  maximum: 256 accepted revisions or 256 MiB encoded published bytes, whichever comes first
  bound: Charge atomically with publication; history eviction never refunds this write-work budget. At the maximum
    32-MiB map size only eight accepted publications fit. Bound unsuccessful attempts and reads independently.
lifecycle:
- entity: Project sitemap binding, source generations and accounting
  delete: Trusted ArtifactStore retention may evict only opted-in unprotected historical revisions; ordinary
    Project purge owns complete Project deletion and entry removal remains reversible suppression.
  cascade: Project purge removes owned map revisions, counters and source metadata; producer Run deletion leaves
    self-contained Project history and independent holds. Shared versions/blobs survive while any reference needs them.
  retention: Current and legitimate exact-reference/hold/lineage obligations remain protected. Retained quota
    shrinks only with actual authorized revision deletion; Run write budgets are cumulative, lifetime totals are
    metrics, and no TTL or global Artifact history policy is introduced.
- entity: Member/group edits and suppression markers
  delete: Authenticated owner edits require expected revision; restore is explicit.
  cascade: Regrouping carries exact membership selection and rejects ambiguous widening.
  retention: Bound markers and notes with the current map; retained revisions remain immutable until authorized
    oldest-unpinned eviction. Removing an entry does not unpin evidence or rewrite history.
acceptance_criteria:
- id: A1
  given: An empty owned Project and strict valid/invalid document fixtures
  when: The production CLI/API creates, reads and edits its sitemap
  then: The same canonical reducer is used, malformed documents fail without replacement, and no endpoint/export
    lacks a production caller.
- id: A2
  given: Secret canaries, repeated identity labels across engagements and member/context overflow
  when: Observations or manual metadata enter through every public mutation path
  then: Secrets and raw-secret hashes never enter keys/artifact bytes, principals remain distinct and discarded
    data has bounded explicit gaps.
- id: A3
  given: Two source replacements for old/new exact schemas plus concurrent append observations
  when: The new source commits before the older patch retries
  then: Append observations survive; the old source transition conflicts and cannot refresh its expected predecessor
    automatically.
- id: A4
  given: A populated member inventory and suppressions
  when: Late templates/fixed routes split or merge groups after inventory overflow
  then: Retained member identity survives, excluded members stay excluded, unrelated members are not suppressed
    and discarded membership remains unknown.
- id: A5
  given: A real PostgreSQL Project at retained-history limits with mixed protected/unprotected revisions and shared blobs
  when: Concurrent publications, pin acquisition/release, generic mutations and lost replies compete across Runs
  then: Only oldest eligible history is evicted, protected current/exact refs and shared blobs survive, and cumulative
    lifetime publications may exceed 1 GiB while retained usage remains bounded. All-protected failure preserves
    current/holds/counters; Run write usage is never refunded. Replay of an evicted result confirms its original
    receipt without republishing, charging or silently reading latest.
- id: A6
  given: A populated Project with independently retained evidence and deleted producer Runs
  when: Run deletion and Project deletion race readers/writers
  then: Map metadata survives Run deletion, evidence availability is truthful, fenced writes fail and complete Project
    purge removes only its owned state. Concurrent proof selection either acquires the legitimate indexed hold
    atomically or reports the exact ref unavailable, and ordinary provenance/CAS does not pin the entire chain.
- id: A7
  given: More than 64 realistic candidate revisions, JSON-backed exact references and the post-publication former current
  when: Bounded maintenance, publication rollback, reference lifecycle changes and pin/delete races execute, including
    release of an old pin behind a continuation cursor
  then: Every transaction examines at most 64 candidates and removes at most 64 metadata rows without payload
    loads or all-JSON scans; longer work returns bounded retryable backpressure. Cursor generation/revalidation or
    indexed eligibility selects the newly eligible oldest revision and prevents a false protected-history conflict.
    The former current is removed
    only in a successful swap with no other hold, immutable-delete triggers admit only the trusted policy owner,
    and already committed maintenance is distinguished from a failed publication's rolled-back effects. Separate
    physical GC obeys 64-candidate/64-MiB passes and proves shared payloads and failed post-commit unlink remain
    truthful without claiming that logical quota release equals disk reclamation.
deliverables:
- path: internal/projectsitemap
  description: New classified domain service/reducer with actual owner API/CLI callers; reuse existing Artifact
    and keyed mutation services.
- path: internal/artifacts
  description: Trusted opt-in retention admission/eviction and indexed authoritative protection integration, called
    by the sitemap service in this task; accompanying migrations and immutable-delete trigger changes are tested.
- path: docs/spec/artifacts/project-sitemap.md
  description: New owning normative contract with stable requirement IDs, linked registries and existing-spec boundary
    updates, including ArtifactStore/retention ownership of the narrow immutable-history deletion exception.
- path: make/features.mk
  description: Register new test-project-sitemap-postgres with require-database and complete touched-package tests;
    include it in the mandatory release graph.
- path: api/testdata
  description: Versioned canonical/projection/reducer fixtures; V410-002 adds the Runtime reader to the shared-reader
    manifest without inventing an unused Runtime implementation here.
tests:
- command: make test-project-sitemap-postgres
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
  - A6
  - A7
- command: make verify-public-api verify-public-api-postgres
  covers:
  - A1
  - A5
  - A6
  - A7
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
  - A6
  - A7
test_prerequisites:
- test-project-sitemap-postgres is a required new target delivered here, not an existing passing check. It must
  fail when the disposable PostgreSQL prerequisite is missing/unreachable or a selected suite matches zero tests.
- Run complete packages touched by the change, including migrations, domain, Artifact/Project lifecycle, public
  API, CLI and every authoritative exact-reference/hold lifecycle hook; include migration/trigger tests and
  reference-safe shared-blob GC against real PostgreSQL. Regenerate generated clients through repository targets.
