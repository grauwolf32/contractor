schema_version: '1.0'
id: V431-003
title: Bound terminal release candidate reads before aggregation
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: defect
priority: P2
status: in_progress
depends_on: []
languages:
- go
- sql
goal: A terminal-release listing selects a small indexed allocation candidate batch rather than aggregating
  the entire unresolved history.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: internal/runstore/stage_store_sql.go:53 aggregates all pending allocations before LIMIT 32;
    a 3600-allocation fixture read the whole backlog for 32 Stage results.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/scheduler.md#SCH-R71
  - docs/spec/execution/scheduler.md#SCH-R180
scope:
  in:
  - Walk pending allocations in least-recently-attempted order through the existing pending-release index;
    bound candidates before grouping into Stage identities.
  - Exclude locally in-flight releases so a large busy Stage cannot occupy the candidate window.
  - Keep one owning store and existing release timestamps; add no table or lease.
  - Test custom and generic plans at realistic backlog size and preserve recovery pacing/concurrency and
    per-allocation outcomes.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: An indexed bounded candidate window is aggregated instead of the complete terminal-release backlog;
    a real PostgreSQL Reads test fails on the old query.
- id: A2
  text: Never-attempted allocations precede attempted ones, completed releases are omitted and locally
    busy releases cannot hide later work.
- id: A3
  text: Existing Scheduler terminal release, cancellation, pacing and batching suites pass.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/scheduler/... ./internal/persistence/...
  covers: &id001
  - A1
  - A2
  - A3
- command: make lint
  covers: *id001
introduced_by: V6-002
