schema_version: '1.0'
id: V94-001
title: Remove private Git repository paths from transport failure logs
milestone: local-secret-log-and-process-boundaries-2026-10
priority: P2
status: completed
implementation_commit: 2a331265c0e600f25aeecabf8846dd7d140062f8
depends_on: []
languages: [go]
goal: Keep private repository paths out of global logs while retaining safe transport causes.
context:
  issue: https://github.com/grauwolf32/contractor/issues/239
  finding: HTTPS transport errors include request URLs, which safeError logs verbatim.
scope:
  in:
    - Strip url.Error URL-bearing wrappers before logging transport causes.
    - Keep existing API error sentinels and scheme/address log fields.
    - Cover real TLS failure and GET/POST wrapped error paths.
  out:
    - Change remote allowlisting or the public Git import API.
acceptance_criteria:
  - {id: A1, text: TLS and wrapped GET/POST transport error logs contain no private path or full URL.}
  - {id: A2, text: The safe underlying cause remains logged and API callers still receive ErrRemote.}
  - {id: A3, text: Git import package tests and Go checks pass.}
tests:
  - {command: go test ./internal/gitimport, covers: [A1, A2, A3]}
  - {command: go vet ./internal/gitimport, covers: [A3]}
