schema_version: "1.0"
id: V407-030
title: "Let a preparing Eval be cancelled or fall back after bounded attempts, and make usage totals order-independent"
milestone: server-runtime-review-2026-10
epic: evals
kind: defect
introduced_by: V38-004
priority: P3
status: pending
depends_on: []
languages: [go]
goal: "No Eval state retries preparation without a bound or an exit, and usage aggregation is deterministic."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings E10 and E12; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/evals/managed-evals.md
  severity: low
  finding: >-
    internal/evaldomain/lifecycle.go:97-100 CommandCancel requires HasPlan, so
    a preparing experiment advertises no commands; an unclassified
    preparation failure keeps the prepare command pending and
    internal/evalservice/service.go:173-178,326-342 tickExecution retries it
    every tick with no attempt bound (preparationFailed returns to preparing
    for any non-4xx domain error). The only exit is Delete.
    internal/evaldomain/usage.go:129-147 and
    internal/evalservice/usage_collection.go:56,66-76 sum token counters
    while ranging over maps and on int64 overflow skip whichever contributor
    comes last, so total, count, SourceRefs and the partial/unavailable
    outcome depend on map order; native_records.go:24 dedups by
    reflect.DeepEqual, so a nondeterministic Usage would append a new native
    record every tick (reachable only near 2^63 tokens).
  siblings: >-
    Other map-ordered aggregations in internal/evaldomain (grep 'range' over
    map types in summary code).
plan:
  - "Allow Cancel from preparing (Outstanding is 0, so the next tick settles to cancelled) and bound preparation attempts (LIM entry) with a fallback to draft and eval_preparation_unavailable; record both in docs/spec/evals/managed-evals.md and the lifecycle table."
  - "Iterate usage contributors in the sorted executions order and mark the whole counter unavailable on overflow."
  - "Tests: a preparing experiment with a failing adapter can be cancelled and, without cancel, falls back after the bound; a usage test with contributors near overflow yields the same result under shuffled map insertion."
scope:
  in:
    - "Cancel from preparing, attempt bound, deterministic usage."
  out:
    - "Other lifecycle transitions."
acceptance_criteria:
  - id: A1
    text: "A preparing experiment whose adapter keeps failing can be cancelled and, if not cancelled, leaves preparing after the bound with a classified reason."
  - id: A2
    text: "Usage aggregation is identical across 100 shuffled runs of the overflow fixture."
  - id: A3
    text: "Both tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/evaldomain/... ./internal/evalservice/... ./internal/evalstore/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1]
