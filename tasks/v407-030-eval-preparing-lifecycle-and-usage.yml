schema_version: '1.0'
id: V407-030
title: Make Eval usage aggregation deterministic when counters overflow
milestone: server-runtime-review-2026-10
epic: evals
kind: defect
introduced_by: V38-004
priority: P3
status: pending
depends_on: []
languages:
- go
goal: The same authoritative metric observations produce the same usage values, completeness and source
  references regardless of contributor/map order.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/evals/managed-evals.md
  severity: low
  finding: internal/evaldomain/usage.go:129-147 and internal/evalservice/usage_collection.go:56,66-76
    accumulate nonnegative int64 counters in map order, skipping whichever contributor overflows the running
    sum. A probe with MaxInt64-100 and 200 produced two different total values for identical observations.
    Source references/completeness can also depend on the skipped contributor; native_records.go:24 compares
    full observations for deduplication. These magnitudes are theoretical for real token usage, so this
    is a low-priority determinism defect rather than an observed normal-volume growth incident.
  siblings: Other map-ordered aggregations in internal/evaldomain (grep 'range' over map types in summary
    code).
  validation: 'Preparing cancellation is excluded: CommandCancel currently requires a plan, but Duplicate
    is available for an authored draft (lifecycle.go:77-79). EVM-R90 intentionally retains and retries
    an unknown infrastructure failure in preparing with eval_preparation_unavailable and recovery=wait.
    Adding cancel or a retry-attempt fallback would be a separate lifecycle feature, not correction of
    an undocumented endless loop.'
plan:
- 'Specify an order-independent overflow outcome for each counter: mark that counter unavailable with
  a bounded overflow reason instead of publishing a contributor-order-dependent subtotal. Keep nonoverflow
  counters, attribution and safe source references deterministic.'
- Apply the same rule in attemptMetrics and NormalizeUsage; sort or canonicalize contributor/source identities
  as needed without relying on random Go map iteration for correctness.
- Use deterministic permutations of overflow/boundary/missing-counter inputs and a real PostgreSQL collection/replay
  test to prove unchanged observations do not append new native records. Preserve normal-value and incomplete-report
  behavior.
scope:
  in:
  - Counter overflow semantics, deterministic sources/completeness and idempotent usage collection.
  out:
  - Changing preparing-state commands, EVM-R90 retry policy, Retry-After behavior, or introducing a new
    preparation-attempt bound.
acceptance_criteria:
- id: A1
  text: All deterministic contributor permutations at MaxInt64 boundaries produce identical usage, source
    references and completeness; overflow counters are unavailable rather than order-dependent partial
    totals.
- id: A2
  text: Normal totals, zero, missing counters and incomplete reports retain their documented results,
    and both aggregation layers use the specified overflow policy.
- id: A3
  text: Repeated collection of identical overflow observations against real PostgreSQL appends no additional
    native record after the accepted observation.
- id: A4
  text: A deterministic expected-outcome regression fails on the original skip-on-overflow implementation;
    no probabilistic map iteration or elapsed-time assertion is required.
tests:
- command: go test -count=1 ./internal/evaldomain/...
  covers:
  - A1
  - A2
  - A4
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/evalservice/...
    ./internal/evalstore/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
