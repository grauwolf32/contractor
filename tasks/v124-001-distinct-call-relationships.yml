    - Retain the strongest confidence for repeated edges and keep path adjacency unchanged.
    - Document distinct relationship counts alongside call-site edge counts.
  out:
    - Change Trailmark graph parsing or path search behavior.
acceptance_criteria:
  - {id: A1, text: Repeated call sites return one row per distinct caller or callee and correct observedTotal pagination.}
  - {id: A2, text: The strongest confidence wins deterministically for repeated edges.}
  - {id: A3, text: Path queries remain unchanged and spec 12 distinguishes relationship counts from callEdgeCount.}
