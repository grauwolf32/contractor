scope:
  in:
  - Show default and named Runtime bindings inline with versions, avoid duplicate digests and sentinel
    1970 timestamps.
  - Link related configuration and credentials by scope and effect on future runs; preserve existing
    authorization and exact mutation contracts.
  - Use progressive publishing/credential forms with consistent action rows; separate Clone from read-only
    details.
  - Keep secret fields ephemeral and preserve idempotency, conflict review, pending-state and focus
    semantics.
  out:
  - Changes to execution, audit evidence or security boundaries unrelated to UI behavior.
  - New evaluation experiment or toolset-configuration protocols tracked separately in V41/V56.
