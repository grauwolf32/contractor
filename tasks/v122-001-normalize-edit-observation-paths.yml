    - Canonicalize successful edit argument paths with the project path validator.
    - Keep persisted observation and result path validation strict.
    - Verify write, edit, copy and move observations and worker summaries for decomposed Unicode paths.
  out:
    - Change edit tool path handling or persisted observation schema.
acceptance_criteria:
  - {id: A1, text: Successful edit calls record NFC paths and retain complete workspace detail and lean summary.}
  - {id: A2, text: Copy and move observe normalized destination and source paths as applicable.}
  - {id: A3, text: Invalid project paths remain rejected and persisted paths must already be canonical.}
tests:
  - {command: PYTHONPATH=runtime/src runtime/.venv/bin/python -m pytest runtime/tests/test_filesystem_observations.py, covers: [A1, A2, A3]}
