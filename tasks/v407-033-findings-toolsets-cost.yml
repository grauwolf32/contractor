schema_version: '1.0'
id: V407-033
title: Reuse immutable Audit inputs and finding source bytes, and assemble finding pages linearly
milestone: server-runtime-review-2026-10
epic: findings
kind: chore
introduced_by: V39-003
priority: P2
status: in_progress
depends_on: []
languages:
- python
goal: Reduce repeated decoding, source downloads and page canonicalization while preserving Audit admission,
  finding derivation, unsigned cursor and publication contracts.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification:
  - docs/spec/findings/findings.md
  - docs/spec/audits/worker-completion.md
  finding: runtime/src/contractor_runtime/toolsets/audit_results/collector.py:78-79,307,327-364 and encoding.py:59-92
    repeatedly decode immutable task inputs and encode the cumulative prospective result under collector
    ownership; preparation/publication repeat that work in completion.py:122,131 and publication.py:109.
    The collection is bounded to 64 items. security_findings/anchors.py:47-59 serially resolves up to
    32 metadata refs and downloads the selected exact ZIP of at most 8 MiB for every finding; selected
    files are parsed off-loop and ASTs discarded per FND-R169. Anchor timeout yields an unavailable projection,
    not loss of the ordinary finding. reader.py:245-246 canonicalizes the growing page for each candidate.
    Its unsigned cursor at :258-294 implements FND-R137 through FND-R141; common/cursors.py uses HMAC
    and a different schema and is not a drop-in replacement.
  siblings: Audit prepare/begin, single and batch admission, seal/discard and final publication; security
    finding anchor preparation and allocation cleanup; list_findings page sizing. ExactArtifactReadCache
    provides a bounded lifetime precedent but its generic 64-MiB limit is not the anchor-cache bound.
  validation: 'Partially confirmed on dc7012e8: inputs and prospective packages are repeatedly encoded;
    30 findings using one exact ZIP caused 30 payload reads; page-size checks repeatedly canonicalize
    accumulated items. The unsigned finding cursor is explicitly required by FND-R137 through FND-R141
    and is not a defect.'
plan:
- Decode and validate immutable task/manifest inputs once per prepared allocation and reuse trusted immutable
  records across invocations and publication. Preserve owner binding, membership/order/digest validation
  and strict failure classifications.
- Run expensive prospective package encoding through threads.to_thread_until_done while retaining the
  existing serialized admission owner. Join on cancellation and publish no candidate before admission
  succeeds. Reuse immutable prepared values without promising that full aggregate ZIP admission becomes
  linear or weakening aggregate byte checks.
- Add at most one allocation-owned exact-source-byte cache entry bounded to 8 MiB. Reuse only the same
  exact artifact identity, preserve metadata/content consistency and per-invocation content-observation
  accounting, invalidate on replacement/release, and never cache ASTs. Bound any parallel metadata resolution
  and join all reads before failure or cancellation returns.
- Canonicalize each page item once and compute the exact candidate JSON byte cost including separators,
  envelope and its actual unsigned cursor. Preserve FND-R137 through FND-R141 fields, limits, no-signature
  format and query/snapshot binding; do not substitute the HMAC codec.
- Use deterministic decode/download/canonicalization counts, barrier-controlled encoding cancellation
  and exact page-boundary cases. Test a 64-item admitted batch and 30 findings against one ZIP with valid
  bounded fixtures; retain parse-per-publication and unavailable-anchor behavior.
scope:
  in:
  - Immutable decoded-input reuse; threaded encoding under existing atomic admission ownership; bounded
    exact ZIP byte reuse; exact linear finding page assembly.
  out:
  - Audit result format, aggregate limits, admission/replay/CAS outcomes, finding schemas and tool signatures.
  - Signed cursor migration, new cursor fields, relaxed cursor validation or authorization changes.
  - AST reuse, eliminating required per-file parsing, guaranteeing a network deadline never expires or
    changing unavailable-anchor fallback.
acceptance_criteria:
- id: A1
  text: A valid 64-item submission sequence decodes the unchanged task/manifest inputs once per allocation;
    expensive encoding is observed off-loop. Failed or cancelled admission leaves collector state unchanged
    and no work outlives its owner.
- id: A2
  text: Thirty findings against the same exact ZIP perform one source payload download while retaining
    per-publication derivation and content observations. Replacement, missing/oversized source, metadata
    mismatch, transport failure, deadline and cancellation preserve existing outcomes; retained source
    bytes never exceed one 8-MiB entry.
- id: A3
  text: list_findings canonicalizes each admitted candidate item once for sizing and honors the exact
    256-KiB response bound, including the final cursor. Existing unsigned cursors, null fields, 1..100
    limits and FND-R137 through FND-R141 rejection behavior remain byte-compatible.
- id: A4
  text: Count-based regression cases fail on the old repeated-work paths; existing collector, completion,
    publication, findings and anchor tests retain their success/error/cleanup behavior without wall-clock
    performance thresholds.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_audit_results_toolset.py tests/test_audit_result_collector.py
    tests/test_audit_result_publication.py tests/test_audit_completion_runtime.py tests/test_audit_completion_continuation.py
    tests/test_security_findings_toolset.py tests/test_findings_reader_toolset.py tests/test_finding_anchors.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A3
  - A4
