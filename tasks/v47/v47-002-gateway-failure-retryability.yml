  - id: A2
    given: "Cancellation, omitted optional settings and existing successful invocations"
    when: "The focused regression suite runs"
    then: "Compatible behavior and secret-free diagnostics are retained."
tests:
  - command: "cd runtime && .venv/bin/python -m pytest tests/test_openai_gateway_llm.py tests/test_adk_runtime.py tests/test_worker_summarizer.py"
