schema_version: '1.0'
id: V263-001
title: Batch Runtime Agent principal adapter projections
milestone: principal-inventory-2026-10
priority: P2
status: completed
implementation_commit: 1750fa47fce7e0c9f51cc50da274bae4fda6b310
depends_on: []
languages: [go, sql]
goal: Bound Runtime Agent principal list reads regardless of the number of principals and labels.
context:
  issue: https://github.com/grauwolf32/contractor/issues/113
  finding: Principal list projection rereads each label binding and full RuntimeConfig version per principal.
scope:
  in:
    - Read principal pages and their distinct bindings and versions in one read-only repeatable-read transaction.
    - Resolve adapters once per distinct version and skip the pagination sentinel.
    - Preserve existing GET and label-mutation projection behavior.
    - Cover query count, shared references, pagination, and concurrent binding deletion.
  out:
    - Changing Runtime Agent registration or label mutation semantics.
acceptance_criteria:
  - {id: A1, text: Principal list reads use a fixed number of database queries for any page size.}
  - {id: A2, text: Distinct bindings and RuntimeConfig versions are read and decoded once per page.}
  - {id: A3, text: The pagination sentinel does not resolve adapters.}
  - {id: A4, text: Concurrent label removal and binding deletion do not break a list snapshot.}
  - {id: A5, text: Existing principal availability projections remain unchanged.}
tests:
  - {command: go test ./internal/controlplane ./internal/runtimeconfig ./internal/httpapi/public, covers: [A1, A2, A3, A5]}
  - {command: CONTRACTOR_TEST_DATABASE_URL=<postgres> go test -tags=integration ./internal/runtimeconfig, covers: [A1, A2, A4]}
  - {command: make lint, covers: [A1, A2, A3, A4, A5]}
