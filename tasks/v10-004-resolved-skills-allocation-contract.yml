schema_version: "1.0"
id: V10-004
title: Add resolvedSkills to the private allocation contract
milestone: agent-skills-mvp
priority: P0
status: complete
implementation_commit: 323f18bf3b9fb806fa820846cc3db009c4162a41
depends_on: [V10-003]
languages: [go, python, json]

goal: >-
  Deliver only the selected AgentTemplate's exact Run-pinned skill manifest to
  Runtime Agent with strict Go/Python/JSON parity and no owner/catalog
  authority or inline package content.

context:
  wire_shape: >-
    ResolvedAgentTemplate gains its normalized logical skills list, omitted on
    JSON wire/canonical digest when empty for compatibility. AllocationSpec
    gains mandatory resolvedSkills. Each item has name, an exact revisioned
    existing ArtifactRef for RunScope namespace skills and packageDigest
    matching sha256:<64 lowercase hex>. The list is sorted by name, unique and
    contains exactly the selected AgentTemplate's declared names; empty
    templates encode resolvedSkills: [].
  security_boundary: >-
    Runtime gets only exact RunScope refs readable through its existing
    allocation-bound private Artifact client. UserScope refs, source owner,
    ZIP bytes, package descriptions and resources never enter registration,
    heartbeat, Agent Card, A2A message or AllocationSpec.

scope:
  in:
    - Extend the authoritative v1alpha1 JSON Schema and Go allocation contracts with ResolvedSkill and mandatory resolvedSkills, and mirror V10-003's logical AgentTemplate skills field in strict Python Pydantic models.
    - Update cross-language AgentTemplate digest verification so omitted and empty logical lists preserve old digests while a non-empty sorted list contributes exact namespace/name pairs.
    - Update Scheduler/Control Plane reservation fingerprinting, exact replay and Runtime allocation decoding without changing Runtime registration capabilities.
    - Derive each allocation list from the selected template and immutable Run snapshot; reject missing snapshot entry instead of resolving owner current.
    - Validate sorted uniqueness, name/ref agreement, exact non-null revision, namespace skills and digest syntax on both sides before Worker construction.
    - Make Go and Python Worker-policy validation treat non-empty logical skills as a tool surface requiring maxToolCalls, with every native call using the existing shared counter.
    - Add identical valid/invalid JSON fixtures and cross-language round-trip/canonical serialization checks.
  out:
    - Fetching packages, ZIP validation/extraction, ADK SkillToolset construction, public API changes or Artifact upload/update behavior.

deliverables:
  - {path: api/v1alpha1/allocation.schema.json, description: Required resolvedSkills private wire schema.}
  - {path: api/testdata/v1alpha1, description: Shared valid and adversarial allocation manifests.}
  - {path: internal/contracts, description: Strict ResolvedSkill models validation and canonical fingerprint fields.}
  - {path: internal/controlplane, description: Allocation subset assembly and replay-safe delivery.}
  - {path: runtime/src/contractor_runtime/contracts/__init__.py, description: Strict Python logical and exact Skill allocation model parity.}
  - {path: runtime/src/contractor_runtime/digests.py, description: Cross-language logical-skill AgentTemplate digest parity with empty compatibility.}
  - {path: docs/development.md, description: Required drain release and lockstep Server Runtime Agent upgrade procedure.}

requirements:
  - id: R1
    text: >-
      Existing allocations are intentionally wire-incompatible until upgraded
      to include resolvedSkills: []; deployment drains and releases active work
      before replacing Server and Runtime together, and mixed-version prepare
      fails closed rather than attempting rolling compatibility.
  - id: R2
    text: Reservation fingerprints include the exact sorted resolvedSkills manifest, so same Stage replay cannot substitute a newer package.
  - id: R3
    text: Runtime contract errors name only the bounded field/logical skill and never echo refs from unrelated Runs or package content.

acceptance_criteria:
  - id: A1
    given: Allocation fixtures with omitted/empty/non-empty template skills and zero, one and multiple sorted resolved skills.
    when: Go and Python parse, serialize and fingerprint them.
    then: Both accept the same values, preserve template/exact refs and digests, retain legacy empty-template digest and produce stable ordering/replay identity.
  - id: A2
    given: Missing, extra, duplicate, unsorted, versionless, wrong-namespace, name-mismatched or malformed-digest entries.
    when: Either side decodes the allocation.
    then: It rejects before Worker creation with a stable bounded contract error.
  - id: A3
    given: Two templates sharing one Run-pinned skill but declaring different subsets.
    when: Control Plane prepares their allocations.
    then: Each receives exactly its declared subset and neither manifest contains UserScope authority/source refs or package bytes.
  - id: A4
    given: A replayed reservation after the owner skills binding current changes.
    when: Control Plane compares the request.
    then: The exact original Run manifest replays and any substituted digest/ref conflicts.

tests:
  - {name: schema, command: "make verify-wire-contracts", covers: [A1, A2]}
  - {name: go, command: "go test -race ./internal/contracts/... ./internal/controlplane/...", covers: [A1, A2, A3, A4]}
  - {name: python, command: "cd runtime && uv run pytest tests/test_contracts.py tests/test_allocation.py", covers: [A1, A2]}
  - {name: cross-language, command: "make test-wire-cross-language", covers: [A1, A2, A4]}
