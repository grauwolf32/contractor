schema_version: '1.0'
id: V289-001
title: Scope allocation-loss interrupts to the owning Stage
milestone: review-defects-2026-10-04
priority: P1
status: in_progress
depends_on: []
languages: [go]
goal: Interrupt only the Stage whose allocation was lost.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: medium
  finding: "pollAllocationLosses (internal/scheduler/supervisor.go:307-319) calls interruptRun(loss.RunID, ...) and ignores loss.StageExecutionID. When Runtime A dies after Stage S1 finished but before its release succeeded, the grant stays while the owner is live and the Run moves to S2 on Runtime B; when A's lease expires, PollAllocationLosses or V197's ReleaseLost emits loss{run,S1} and cancels S2. Reproduced in the scheduler harness: the Planner ran twice, or S2 ended interrupted/allocation_preparation_failed and the Run failed. Every loss reason also collapses into control_lease_expired."
scope:
  in:
    - Track the lane's current StageExecution in activeRunClaim and interrupt only on a matching StageExecutionID.
    - Losses for terminal Stages trigger release recovery only.
    - Carry AllocationLoss.Reason into the termination code or diagnostic.
    - Harness tests for a loss during PrepareAll, Planner run and finalize.
  out:
    - Changing Runtime lease timings.
acceptance_criteria:
  - {id: A1, text: "Loss of a finished Stage's allocation does not interrupt the current Stage."}
  - {id: A2, text: "Loss of the current Stage's allocation still interrupts it."}
  - {id: A3, text: "The termination diagnostic carries the loss reason."}
tests:
  - {command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/scheduler ./internal/controlplane", covers: [A1, A2, A3]}
  - {command: "make lint", covers: [A1, A2, A3]}
