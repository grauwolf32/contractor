schema_version: '1.0'
id: V231-001
title: Charge and classify rejected Planner Gateway responses
milestone: runtime-maintenance-2026-10
priority: P2
status: in_progress
depends_on: []
languages: [go]
goal: Preserve token accounting and distinguish unusable HTTP 200 model replies from Gateway outages.
context:
  issue: https://github.com/grauwolf32/contractor/issues/273
  finding: The OpenAI adapter drops usage and yields an ordinary error for malformed or length-limited tool replies.
scope:
  in:
    - Reject length-limited, malformed, and empty choices before executing any tool.
    - Charge valid reported usage before returning an invalid-response or token-limit failure.
    - Classify missing or inconsistent usage as an invalid Gateway response.
  out:
    - Changing HTTP transport and status-error recovery.
acceptance_criteria:
  - {id: A1, text: A length-limited response never executes a tool and its reported usage is included in the Planner report and budget.}
  - {id: A2, text: Malformed tool arguments from HTTP 200 charge valid usage and fail as planner_gateway_invalid_response.}
  - {id: A3, text: Missing or inconsistent usage fails as planner_gateway_invalid_response, while transport failures remain planner_gateway_unavailable.}
tests:
  - {command: go test ./internal/planner/streamline ./internal/planner/router -count=1, covers: [A1, A2, A3]}
  - {command: make lint, covers: [A1, A2, A3]}
