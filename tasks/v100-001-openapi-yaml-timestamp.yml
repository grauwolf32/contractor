schema_version: '1.0'
id: V100-001
title: Accept date-style OpenAPI YAML scalars across parsers
milestone: openapi-yaml-and-finding-input-repair-2026-10
priority: P2
status: in_progress
depends_on: []
languages: [go]
goal: Preserve unquoted YAML dates as strings so OpenAPI inventories and scan preparation accept them.
context:
  issue: https://github.com/grauwolf32/contractor/issues/272
  finding: YAML resolves unquoted ISO dates as timestamps; the Audit and scanplan scalar decoders reject them.
scope:
  in:
    - Decode YAML timestamp scalars as their original bounded UTF-8 strings in auditdomain and scanplan.
    - Check JSON/YAML canonical parity for an OpenAPI document with a date-style version.
    - Review implicit scalar handling and retain rejection of non-JSON binary data.
  out:
    - Change the general OpenAPI inventory schema or date formats.
acceptance_criteria:
  - {id: A1, text: Audit inventory accepts an unquoted date-style version and retains its exact string value.}
  - {id: A2, text: Equivalent JSON and YAML OpenAPI inputs produce the same canonical inventory digest.}
  - {id: A3, text: Scanplan accepts the same timestamp scalar while both parsers reject YAML binary.}
  - {id: A4, text: Focused Go package tests pass.}
tests:
  - {command: go test ./internal/auditdomain ./internal/scanplan, covers: [A1, A2, A3, A4]}
