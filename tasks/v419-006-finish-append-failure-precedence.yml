schema_version: '1.0'
id: V419-006
title: Fence Planner completion after a required ADK session write fails
milestone: go-adk-26-upgrade-2026-10
epic: planner-worker
kind: defect
introduced_by: V1-006
priority: P1
status: in_progress
depends_on: []
languages: [go, markdown]
goal: A validated in-memory finish never hides a required session-write failure, and both modeled Planners preserve the owning persistence and cancellation outcomes.
context:
  severity: medium
  authority: >-
    User requested faster parallel delivery on 2026-10-25. The current phase
    authorizes task creation and supported-baseline tests/probes only while
    Runtime verification finishes. Production Server repair or dependency edits
    wait for Runtime V418-007 completion and coordinator authorization.
  finding: >-
    Static supported-v1.6 source path, pending actual baseline reproduction:
    internal/planner/streamline/tools.go:507-530 records finish_requested and
    sets an in-memory completion before ADK emits its final FunctionResponse.
    Runner.AppendEvent may then fail, but planner.go:189-196 accepts terminal()
    before examining iterationErr at210, calls CompleteSession, and returns the
    candidate. A required redacted-event rejection can therefore be hidden if
    that later completion write succeeds. Ordinary ADK append outages also lack
    a typed session-write boundary and may become planner_execution_failed.
  provenance: >-
    V1-006/aacda4b36be505201f0f95aecc7d586107ba68a5 introduced both the
    terminal-before-iteration-error branch and finish's in-memory setCompletion.
    V414-006/39c37b3c3f8bcc811fbe19375ba9134697334148 repairs CompleteSession
    write/report outcomes, not the preceding final FunctionResponse append.
    V414-008/74d2283ab828bc70fff2a28fd5c5a6bfa1e36cfa classifies ErrInvalid
    in the later iteration-error branch, which an accepted finish bypasses.
    This task proves the supported baseline before attributing anything to v2.
  specification:
    - docs/spec/execution/planners.md#PLN-R79
    - docs/spec/execution/planners.md#PLN-R85
    - docs/spec/execution/planners.md#PLN-R94
    - docs/spec/execution/planners.md#PLN-R105
    - docs/spec/execution/planners.md#PLN-R106
    - docs/spec/execution/planners.md#PLN-R107
    - docs/spec/execution/planners.md#PLN-R120
    - docs/spec/platform/persistence.md#PER-R13
    - docs/spec/platform/persistence.md#PER-R24
    - docs/spec/platform/errors.md
    - docs/spec/platform/failure-model.md
    - docs/spec/platform/limits.md
    - docs/spec/platform/lifecycle.md
  siblings: >-
    Streamline and Router share this execution engine. Cover successful,
    retryable-failed and final-failed finish candidates, ordinary pre-finish ADK
    events, invalid/unavailable writes, caller cancellation and independently
    bounded completion. Passthrough has no SDK event append and keeps its
    existing completion-write behavior. V419-003 and V420-001/003 reuse these
    regressions for v2/compaction; they do not duplicate this baseline repair.
scope:
  in:
    - Supported-pin actual Runner and production PostgreSQL adapter regressions before production changes.
    - A classified required-write failure blocks subsequent semantic calls and candidate completion, including after an accepted finish or iterator stop.
    - Preserve exact failure retryability, report coherence, completed recovery and cancellation ownership in both modeled profiles.
    - Minimal production repair and owning contract clarification only after the Runtime exit gate is complete and repair is authorized.
  out:
    - Go ADK pin/API migration, compaction, new receipts, Scheduler algorithms or a new generic e2e runner.
    - Treating an in-memory finish or finish_requested fact as a durable full candidate receipt.
    - Blindly moving all context/deadline checks ahead of valid terminal outcomes or changing the independent completion-write budget.
acceptance_criteria:
  - id: A1
    text: An actual PostgreSQL CHECK rejects only the final finish FunctionResponse event while allowing the finish fact and later completion/failure writes; both profiles return no candidate and nonretryable planner_session_rejected wrapping runstore.ErrInvalid.
  - id: A2
    text: A final-response-only injected PostgreSQL connection-failure condition yields planner_session_unavailable instead of planner_execution_failed or a candidate; successful and retryable-failed outcomes stay retryable, while a final failed candidate cannot become retryable.
  - id: A3
    text: Ordinary pre-finish ADK event rejection and outage use the same owning classes; no additional model or Worker is dispatched, and the stored completion and report match the returned failure.
  - id: A4
    text: Genuine caller cancellation before finish remains planner_cancelled, and cancellation during the independent completion write after a successfully persisted final FunctionResponse does not shorten that write's budget or duplicate the outcome.
  - id: A5
    text: Baseline probes fail for the intended current defect with observed real PostgreSQL rejection and exact case IDs; those failures remain evidence until the repair makes the same assertions pass without xfail or weakened expectations.
  - id: A6
    text: Full owner-package/race/store gates pass after repair; completed recovery invokes no model or Worker, unfinished recovery remains planner_invocation_in_progress, and no raw arguments, candidate text or database credentials enter evidence.
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set an owned disposable PostgreSQL URL}\" GOMAXPROCS=1 go test -p=1 -count=1 ./internal/planner/streamline -run '^(TestPostgresModeledPlannerAppendFailurePrecedence|TestModeledPlannerCancellationKeepsCompletionOwnership)$'"
    covers: [A1, A2, A3, A4, A5]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set an owned disposable PostgreSQL URL}\" GOMAXPROCS=1 go test -p=1 -count=1 ./internal/planner/... ./internal/scheduler/..."
    covers: [A1, A2, A3, A4, A6]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set an owned disposable PostgreSQL URL}\" GOMAXPROCS=1 go test -p=1 -race -count=1 ./internal/planner/..."
    covers: [A1, A2, A3, A4, A6]
  - command: make test-streamline
    covers: [A1, A2, A3, A4, A6]
  - command: make lint
    covers: [A5, A6]
test_prerequisites:
  - Current phase records expected RED supported-baseline probes, not task completion. Every listed acceptance command must pass after the authorized production repair.
  - Use exact supported go.mod/go.sum, real ADK Runner and an owned disposable PostgreSQL database with CREATEDB; configured unreachable storage fails and a zero/required skipped case is not acceptance.
  - The forwarding ADK service observes calls/errors only. The migrated test schema's CHECK or trigger produces the persistence failure; a wrapper-synthesized error is not PostgreSQL conformance.
  - Generate injected SQLSTATE values from the existing persistencepostgres constants. Record injected SQLSTATE outage honestly rather than claiming a real PostgreSQL server outage.
  - Use synchronization barriers and bounded finite fixtures, not elapsed-time assertions. Run at GOMAXPROCS=1 with Go package parallelism1 during concurrent Runtime verification; do not synchronize a shared Runtime virtual environment.
failure_outcomes:
  - operation: Required redacted ADK event append after an ordinary turn or valid finish
    permanent: A definite invalid/rejected PostgreSQL write returns planner_session_rejected with retryable false, no candidate and no further semantic dispatch.
    retryable: An unavailable session returns planner_session_unavailable; retain the owning final-outcome retryability and the existing bounded completion-write policy.
    ambiguous: Preserve existing session identity/sequence and reconcile only through that owner; do not append a fresh semantic effect, redispatch a Worker or invent another receipt.
    cancelled: Genuine caller cancellation retains its owning cancellation outcome; close and join SDK iteration before return. Do not reinterpret arbitrary SDK failures as storage failures.
    timeout: Keep execution deadline, append/transport failure, completion-write budget and harness timeout distinct; no detached persistence or cleanup may outlive the Planner.
cardinality:
  - collection: Probe cases, model turns, event writes and retained observations
    expected: Two modeled profiles, three finish outcomes and two storage failure classes, plus ordinary-event and cancellation control rows.
    maximum: Twenty leaf cases; each uses at most three model calls, one Worker call and one injected matching event failure under existing item/byte limits.
    bound: Preserve the 256-KiB Planner input, 4-MiB Gateway request, 2-MiB submitted/stored session and event bounds and 256 fact digests. Test-only event guards select the exact finish response instead of globally lowering a state bound that also masks the completion write.
lifecycle:
  - entity: Planner invocation, session adapter and disposable probe schema
    delete: The test owner closes its pools and removes only its own schema/database after all Runner iterations and callbacks join.
    cascade: No durable entity or protocol operation is added; existing session completion and Run-event transactions remain the owners.
    retention: Safe evidence stores revision/module digests, case IDs, expected/actual codes and counts, never raw provider content, candidate payloads or environment values.
