schema_version: '1.0'
id: V95-001
title: Reject symlinked source path parents in Git-mode bundles
milestone: sourcebundle-symlink-boundary-2026-10
priority: P2
status: in_progress
implementation_commit: null
depends_on: []
languages: [go]
goal: Keep source push from reading tracked paths through symlinked directories outside the selected root.
context:
  issue: https://github.com/grauwolf32/contractor/issues/165
  finding: Git index paths can traverse ignored symlinked parent directories; final-member Lstat alone misses them.
scope:
  in:
    - Reject symlinked intermediate source directories, including links to another location inside the root.
    - Resolve and open members through an os.Root bound to the selected directory.
    - Cover replaced tracked directories with Git exclusions and the .contractorignore remedy.
  out:
    - Change Git candidate selection or upload API formats.
acceptance_criteria:
  - {id: A1, text: An ignored symlinked parent of a tracked path fails with the parent name and never bundles outside bytes.}
  - {id: A2, text: An inside-root symlinked parent is rejected, while regular nested paths still bundle.}
  - {id: A3, text: File opens cannot escape the source root after inspection, and Go tests and vet pass.}
tests:
  - {command: go test ./internal/sourcebundle, covers: [A1, A2, A3]}
  - {command: go vet ./internal/sourcebundle, covers: [A3]}
