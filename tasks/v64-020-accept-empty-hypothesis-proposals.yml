schema_version: '1.0'
id: V64-020
title: Accept no-new-work results from ordinary hypothesis generation
milestone: audit-check-prioritization
epic: audits
kind: defect
introduced_by: V64-001
priority: P1
status: pending
depends_on:
- V64-001
languages:
- go
- python
- json
- markdown
goal: A generator can report that no new hypotheses or tasks are needed without a validation error or
  fabricated candidate.
context:
  authority: 'User request on 2026-11-01: create fixes for the three implementation-review findings in
    completed V64-001. Preserve the accepted simple Audit task/Run/result model; these are local contract
    corrections, not a new subsystem or authorization to start implementation now.'
  review: Implementation review of main 79d2788d7 on 2026-11-01, following the delegated V64-001 delivery.
  severity: medium
  finding: 'internal/contracts/auditcontract/codec.go:354 rejects len(hypotheses)+len(work)==0. With an
    otherwise valid frozen proposal context, {schema: contractor.audit.proposals.v1, hypotheses: {}, work:
    []} returns audit_document_invalid. A normal exhausted research direction has no valid empty proposal
    result. Introduced in cf6ab1cb5869f82d4a24be0ec59784dab3125d54 (V64-001).'
  siblings: Go validProposals/Decode; api/audit/v1/contract.schema.json proposals already permits both
    collections to be empty; runtime/tests/test_audit_common_contract.py repeats the positive combined-count
    condition; existing real offline CLI validates the same output. Mutation records have a different
    nonempty rule and must not be relaxed.
  specification:
  - docs/spec/audits/common-contract.md#ACT-R7
  - docs/spec/audits/common-contract.md#ACT-R1
  - docs/spec/platform/limits.md#LIM-ACT-2
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  boundary: Use existing auditcontract, real catalog Snapshot and offline config validate caller. No database
    mutation, controller, queue, receipt store, execution capability or compatibility reader.
  priority_rationale: The review severity is P2/medium; delivery priority is P1 because the existing base-slice
    consumer depends on this fix.
scope:
  in:
  - Generation remains optional. Empty hypotheses/work collections mean no new proposals; an empty hypothesis
    statement is still invalid. Programs without a generator or hypotheses remain valid.
  - Accept and canonicalize an empty proposals document against a valid exact proposal context using the
    existing decoder and CLI.
  - Preserve context validation, allowed bindings, duplicate/collision rejection and the upper combined
    slice count of 128.
  - Align shared Go/Python fixtures and clarify ACT-R7 that no-new-work is a successful ordinary output,
    not a trigger for another generation call.
  - Require the actual V64-013 consumer to settle this result without new hypotheses/tasks; this defect
    changes only the contract and documents that consumer obligation.
  out:
  - Requiring a generator in every Audit, automatically invoking one, or allowing blank hypothesis text.
  - Implementing V64-013 continuation, creating a done/empty lifecycle state, receipt store or special
    completion protocol.
  - Relaxing nonempty mutation records, increasing limits, or treating absent/malformed generator output
    as a valid empty result.
acceptance_criteria:
- id: A1
  given: a valid pinned proposal context and explicitly present empty hypotheses/work collections
  when: Decode and the actual offline configuration command validate the proposal
  then: canonical output succeeds with both collections empty and no fabricated work or live side effect
- id: A2
  given: empty output with missing/invalid context, malformed members, or a batch above 128 combined records
  when: the same real paths validate it
  then: the existing classified rejection and all independent bounds remain intact; empty mutations remain
    invalid
- id: A3
  given: the shared schema, Go/Python conformance and continuation specification
  when: regression cases and complete touched-package suites run
  then: the empty-proposal case fails before the fix and passes after it; no-new-work is explicitly successful
    without authorizing a same-context self-loop
tests:
- command: go test -count=1 ./internal/contracts/auditcontract ./internal/app
  covers:
  - A1
  - A2
  - A3
- command: make test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
failure_outcomes:
- operation: Validate a common Audit document through the existing decoder and configuration CLI
  permanent: Invalid content returns audit_document_invalid with no canonical partial result or input
    content in diagnostics. No retry.
  retryable: Preserve existing surfaced filesystem/embedded-schema failures; validation adds no automatic
    mutation retry.
  ambiguous: No durable effect exists to reconcile; never run a Workflow or target request to repair local
    validation.
  cancelled: Validation remains caller-owned with no background work or live mutation.
  timeout: Keep the existing CLI/caller invocation ownership; introduce no controller clock or new timeout.
cardinality:
- collection: One selected document, its bounded trusted context and real loaded Workflow bindings
  expected: One small program/proposal and several selected materials or seeds.
  maximum: Retain LIM-ACT-1 through LIM-ACT-4 and existing containing-document/record/UTF-8 bounds.
  bound: Validate the selected bounded document; no Run/Audit/Project history enumeration or target activity.
lifecycle:
- entity: Existing offline input bytes and canonical validation result
  delete: Caller releases local files/bytes; no new persistent entity.
  retention: Validation creates no hold, grant, receipt or owner-lifetime change.
test_prerequisites:
- Commands are future implementation acceptance, not results of task creation.
- Use testdata catalogs and the real existing config validate path. Validation has no persistence behavior;
  do not introduce a fake store or require a new database fixture.
- Run complete suites of every touched Go package and the shared cross-language cases; a zero-match mandatory
  selection is a failure.
- On macOS use a canonical TMPDIR for the existing strict-root tests. If implementation expands into store
  behavior, report the scope change before proceeding.
implementation_commit: null
