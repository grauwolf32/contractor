    has no use of that symbol, so TestContractsKernelImportersUseWireSymbols
    fails before unrelated feature work can pass make lint.
scope:
  in:
  - Remove the single stale symbol from the existing importer inventory.
  - Keep all actual importer, wire-symbol and architecture checks enabled.
  out:
  - Runtime, archive transport, authorization, public or private API behavior.
acceptance_criteria:
- id: A1
  text: The private artifact package lists only wire symbols it actually uses, and the exact importer guard passes.
- id: A2
  text: The full architecture package and make lint pass without an allowlist expansion or skipped check.
tests:
- command: go test -count=1 ./internal/archtest
  covers: [A1, A2]
- command: make lint
  covers: [A1, A2]
