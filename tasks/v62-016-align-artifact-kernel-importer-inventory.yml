- V413-001
languages: [go, yaml]
goal: Restore the architecture gate's exact symbol inventory without changing artifact behavior or weakening the check.
context:
  review: Full owner and architecture verification during V62-007 integration.
  finding: >-
    internal/archtest/contracts_importers_test.go:61 still lists
    ArtifactReadResult for internal/httpapi/privateartifacts after V413-001
