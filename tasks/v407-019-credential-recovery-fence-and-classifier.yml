schema_version: "1.0"
id: V407-019
title: "Clear the credential recovery fence from durable state and classify credential errors in one place"
milestone: server-runtime-review-2026-10
epic: runtime-config
kind: defect
introduced_by: V8-002
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "An ambiguous credential delete blocks Run creation only while a prepared operation actually exists, and every component classifies credential errors identically."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings D6 and D8 (classifiers); file:line as of 39d89438, re-verify on main"
  specification: docs/spec/configuration/runtime-config.md
  severity: medium
  finding: >-
    internal/credentials/lifecycle.go:182,435: after one ambiguous
    prepared-delete insert, deleteDirty makes WithRunCreation and
    WithAllocationReferences return ErrRecoveryRequired for every credential
    and every Run; the flag is cleared only by a later successful Delete
    (lines 348, 362, 441), Recover never resets it and it is per process. If
    the operator does not retry that delete, Run creation and placement stay
    blocked until a restart, although credential_operations holds the truth
    one bounded query away and EncryptedProvider already checks it per
    credential. Three places classify credential errors as permanent vs
    transient: scheduler/execution_preparation.go:444 classifyCredentialError,
    controlplane/placement.go:809 candidateResolutionUnavailable and
    credentials/composite.go ResolveLLMCredential's pass-through list; they
    already disagree on ErrKeyUnavailable and ErrCrypto vs
    ErrRecoveryRequired.
  siblings: >-
    Any other switch over credentials.Err* outside the credentials package
    (grep 'credentials.Err').
plan:
  - "When deleteDirty is set, have the fence call ListPreparedOperations(ctx, 1); clear the flag when none exists, otherwise keep returning ErrRecoveryRequired. Keep the one-query cost bounded (only while dirty)."
  - "Add credentials.Classify(err) (permanent | transient | recovery) and use it in the Scheduler, placement and composite; delete the three local switches; record the table in docs/spec/configuration/runtime-config.md."
  - "Tests on real PostgreSQL: ambiguous insert (manager returns an ambiguous error after the row commit) followed by no retry: Run creation is blocked while the row exists and allowed after the row is recovered or removed; a table test over every credentials.Err* value asserting the three callers agree through the one classifier."
scope:
  in:
    - "Durable-state fence; one classifier; spec table."
  out:
    - "Changing which errors are retried by the Gateway client."
acceptance_criteria:
  - id: A1
    text: "After an ambiguous delete with no retry, Run creation is allowed as soon as no prepared operation exists, without a restart."
  - id: A2
    text: "A table test covers every credentials.Err* and the three call sites compile against the single classifier."
  - id: A3
    text: "The fence test fails on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/credentials/... ./internal/scheduler/... ./internal/controlplane/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A2]
