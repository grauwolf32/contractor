  current_gap: >-
    runtime/src/contractor_runtime/worker/tool_runtime.py:480-497 publishes the
    ordinary report and notifies an optional subscriber. Allocation composition
    at allocation/preparation.py:170-192 wires the sitemap collector;
    toolsets/common/report_observations.py:29 supports ffuf/Katana reports.
    Neither scanner has a Finding producer. SQLMap request mode at
    toolsets/scan/tools.py:1008-1024 retains reported/unknown and technique names.
    Direct tool calls can lack durable evidence. Reconcile scanners.md's existing
    generic tool-Worker Finding-publication non-goal with explicit operation
    composition; do not quietly add publication to that optional callback.
  incident: >-
    Invoice Lab Nuclei Run run_bb2cdfdd61621eb2ffd489fcfe204f04 succeeded on
    2026-11-08 and retained one medium git-config detection for /.git/config,
    but created no Project Finding. Sibling ffuf Run
    run_e646c140cbfd55edc7abd6ea6a1f1a6e retained two paths. ffuf sitemap
    collection already exists; the demo template omitted its policy. No live
    SQLMap run occurred in this investigation; its gap is established by source.
  ownership: >-
    Runtime provider adapters parse scanner output and materialize a bounded,
    provider-neutral candidate Artifact and exact evidence descriptors. Finding
    domain services own publication of that existing Artifact. A module under
    internal/operations adapts the declared Stage inputs/outputs to the existing
    service; composition registers it and Scheduler dispatches it generically.
    Server validates the common normalized contract and derives authority,
    identity, receipts and retention. It does not branch on raw Nuclei/SQLMap
    JSON. Extend common intake for a claim-bound operation caller if needed;
    do not forge allocations, Worker sessions or source origins.
  operation_contract:
    ref: publish-findings@1
    inputs: Exact current-Run candidate batch and its explicitly selected exact evidence Artifacts, pinned by ordinary Stage context.
    arguments: Bounded common literal/parameter arguments; no owner, foreign Project, arbitrary scope or command.
    outputs: Ordinary bounded Stage summary with counts, bounded canonical Finding/source refs and classified gaps/errors; complete detail uses existing paginated domain readers, never parsing summary prose. No required report or Finding-package Artifact. Operation diagnostics stay Run-local; canonical source receipts and selected evidence follow Project retention, not Run-local lifetime.
    execution: Existing model-free operation Stage lane, original deadline and trusted Run/Stage/claim; no Runtime, Planner or model.
    intent: Selecting the publication Stage explicitly requests problem publication; existing observation-only scanning remains available.
  composition: >-
    Ship Project presets with scan -> publish stages and a publication-only
    Workflow for retained normalized inputs. Audit consumers select linked canonical
    Findings and source-Run navigation. Raw reports remain at the scanner Run;
    do not embed or copy them into Audit collections or result artifacts. Ordinary scan calls keep their own
    semantics and do not silently mutate Findings. Audit child Runs and scan-plan
    outputs use the same normalized contract and explicit operation composition.
    A separate Stage defines sequence, not provider-parser ownership. Do not add
    a Runtime round trip merely to publish already normalized input.
  decision_needed: >-
    Before implementation settle which Nuclei matches assert a problem rather
    than fingerprint/info-only observation, and whether individually complete
    positive rows in a partial scan qualify. Supported positive assertions must
    publish without an additional LLM or analyst confirmation gate. Analyst
    assessment remains null. Distinguish operation execution/input failures from
    existing FND-R210 per-item publication rejections: retain their ordinary
    receipt/error without rewriting the scanner outcome.
  eligibility_recommendation: >-
    Proposed, not a settled user decision: select explicit problem-producing
    rules through pinned provider-adapter policy; severity or a nonempty match
    alone is insufficient. Fingerprints and information-only observations do
    not publish as Findings; they contribute supported metadata to sitemap under
    the user's follow-up decision. Severity info alone does not classify a match
    as harmless or as a problem. Accept an individually complete positive from a partial scan
    with its limitations, without claiming scan completeness. The simpler
    alternative admits only wholly successful scans and a narrower pinned rule
    set; it loses valid positives when unrelated work times out. Freeze the
    selected policy/version in normalized input and test both allowed and
    excluded matches. Server validates common eligibility facts, not provider tags.
  paths_to_cover: >-
    Nuclei installed-template and exact rulepack execution, including existing
    controlled HTTP execution; SQLMap URL and prepared request_ref modes;
    ordinary tool@1, scan-plan and Audit child-Run compositions. Share the owning
    adapter instead of parsing report previews separately in each caller. Direct
    model tool calls remain observation-only unless explicitly composed with
    durable candidate outputs and the publication operation. Do not weaken target
    policy, request redaction or scanner capability restrictions for this feature.
scope:
  in:
    - Provider-owned Nuclei/SQLMap normalization into durable candidate/evidence Artifacts.
    - Nuclei fingerprints/information-only observations contribute bounded source-attributed sitemap metadata through the existing collector and annotation domain.
    - One reusable registered publication operation using existing Finding intake and Project retention.
    - Composed scanner/publish presets and a publication-only Workflow with explicit inputs/outputs.
    - Qualified deduplication, replay, cancellation, claim fencing and Project deletion handling.
    - Existing Findings API/UI visibility and real-process positive, fixed and replay verification.
    - Audit scanner result collection/presentation uses canonical Finding links, with source Run access for reports and no report/Findings Artifact export.
    - Reconcile affected scanner, Finding, Workflow, operation and Audit contracts and shared fixtures.
  out:
    - Implicit Finding writes inside scanners, sitemap callbacks or report notification hooks.
    - Raw scanner parsing in Server/Scheduler, new public scanner endpoints, import queues or receipt stores.
    - Copying or embedding scanner reports in Audit artifacts/results, or publishing canonical Findings as JSON/ZIP artifacts.
    - ffuf discoveries becoming vulnerability Findings, automatic analyst verdicts and new review workflows.
    - New scanner modes, target expansion, model changes, mandatory LLM verification or rescanning for publication recovery.
requirements:
  - id: R1
    text: >-
      A versioned common candidate contract carries a nonempty problem assertion,
      affected subject, severity suggestion, qualified producer identity and exact
      evidence descriptors. Use ordinary Artifact validation/pinning, not a raw or
      legacy report fallback. Artifact content cannot grant publication authority
      or choose owner/Project/Run. Scanner metadata is data, never instructions.
  - id: R2
    text: >-
      Nuclei retains rule/template/manifest provenance and the actual matched
      subject. SQLMap ties reported techniques to the exact prepared request and
      genuinely identified injectable parameter when available. Technique-only
      output must not create a Finding for every tested parameter. Never invent
      a CWE, parameter, HTTP capture or security verdict from process exit.
  - id: R3
    text: >-
      Publish supported assertions automatically with exact evidence and explicit
      operation intent. Preserve null analyst assessment, existing analyst edits,
      canonical qualified equality and independent sources. Duplicate rows,
      concurrent imports and acknowledgement-loss recovery must not duplicate the
      same source; a new actual scan may contribute an independent source.
      Distinguish original scan/candidate identity from publication Run/Stage and
      canonical problem equality. Replaying the same exact candidates in a new
      publication-only Run must not append sources, even when canonical equality
      is unavailable. Derive provenance from trusted Artifact lineage, not payload
      IDs; byte-identical independent scans remain independent sources. Specify
      qualified key components and missing-key behavior for each adapter, including
      distinct endpoints, parameter locations/names and rules; never merge by CWE,
      title, severity or tested-parameter list alone.
  - id: R4
    text: >-
      Preserve selected Finding evidence and original scan provenance through
      existing internal Project evidence retention before execution holds are
      released. Raw scanner reports stay on their concrete Run; retaining evidence
      must not export those reports into Audit artifacts/results. A publication-only Run
      preserves both original scan and publishing Stage provenance through trusted
      exact material/lineage, not IDs supplied inside the document. Source Run/Audit
      purge must leave evidence readable. Exclude credentials from summaries,
      keys and diagnostic traces; retain existing owner evidence authorization.
      A retained, explicitly selected candidate/evidence input set is required
      for a later publication Run: accepted Finding retention does not promise
      indefinite retention of unpublished candidates. Missing purged inputs fail
      explicitly. Artifact copies across Runs must preserve verified lineage;
      uploaded copies cannot impersonate the original scanner execution.
  - id: R5
    text: >-
      Empty/unknown/info-only, malformed, missing or partial evidence follows the
      settled eligibility contract with explicit gaps. Successful scanning does
      not imply successful publication. Expose operation failures separately and
      per-item receipts/errors under FND-R210; partial commits reconcile on replay
      without silent omission. Neither publication nor recovery issues target traffic.
      An invalid batch envelope fails before mutation; independent item publication
      rejections retain their receipts and allow valid siblings to proceed. Report
      published, replayed, rejected and skipped counts and completeness separately
      from Stage success. If an accepted partial scan is eligible, explicit Workflow
      transitions must reach publication after that scanner outcome without turning
      the original failure into success or re-running its target requests.
  - id: R6
    text: >-
      Reuse the operation registry, Stage result, Scheduler claim and Finding
      mutation fence. No synthetic Worker/Planner is recorded. Existing ffuf/Katana
      best-effort sitemap collection remains independent; this operation does not
      convert discovered paths into vulnerability Findings.
  - id: R7
    text: >-
      Canonical Findings are domain records, not an output artifact collection.
      Audit scanner results expose only their linked Findings, including when
      no Findings exist; no report is substituted for an empty result. Reports
      remain inspectable on the source Run. Existing report/plan embedding in
      internal/auditscan and Audit import/collection must be reconciled for these
      scanner Workflows, rather than merely hiding a report copied to Audit.
      Compact technical status/diagnostics remain execution data and never become
      fake Findings. Evidence storage behind Finding sources keeps existing
      authorization/retention without a new Audit report or findings package.
  - id: R8
    text: >-
      Audit membership is derived from the trusted Run/Stage and immutable Task
      membership under FND-R220/R223, including batch item keys and incidental
      discoveries. Publication completion must precede terminal result collection;
      finding collection must also reconcile already committed sources when the
      publication Stage later fails or is cancelled. Another Task's Findings never
      leak into an item's results. A publication-only Run does not gain authority
      to modify a historical Audit merely from embedded origin IDs; preserve
      historical provenance separately from current destination membership.
  - id: R9
    text: >-
      Preserve useful Nuclei informational observations in Project sitemap:
      actual observed URLs and supported technology/version/fingerprint metadata.
      Runtime interprets provider fields once; Server consumes common bounded
      metadata through the existing sitemap owner. Reuse source-owned member
      annotations where adequate, preserving manual annotations and suppression;
      do not invent a technology inventory service or write sitemap artifacts
      directly. Existing HTTP observation rows do not carry technology fields:
      explicitly provide the owning annotation/import path rather than dropping
      those fields or forcing them into HTTP status/parameter names. Never infer
      GET/200 or a concrete member from a match lacking that evidence. Unsupported
      metadata records a bounded omission and remains inspectable in its Run report.
      A match may contribute both valid surface metadata and a problem Finding;
      severity alone is not the routing rule. Ship enabled collection policy for
      the composed scanner presets. Sitemap collection retains its existing
      best-effort failure semantics independently of Finding publication, adds no
      target traffic and exports no reports to Audit. If this requires a broader
      sitemap model redesign, track that prerequisite separately before implementation.
failure_outcomes:
  - operation: Read an exact normalized batch and publish Project Finding sources
    permanent: Reject malformed/unauthorized input; preserve ordinary per-item receipts/errors and original scanner report without fabricated publication success.
    retryable: Existing bounded storage/intake retries retain original Stage deadline and unchanged intent.
    ambiguous: Reconcile domain receipts and exact outputs; never rescan or create a fresh publication identity to recover an acknowledgement.
    cancelled: Join work under Stage cancellation; mutation transactions verify live Run/Stage/claim/Project before committing.
    timeout: Preserve committed receipts/material and classify the operation timeout; recovery processes remaining work without duplicate commits.
cardinality:
  - collection: Candidates, exact evidence descriptors and publication output
    expected: A few findings per invocation.
    maximum: Proposed batch cap of 100 candidates and 512 KiB normalized JSON; existing per-Finding evidence limits, 4096 receipts per source Run and 64 KiB Stage summary remain upper bounds. Pin aggregate selected-evidence byte/ref and transaction-row limits in the shared limits registry before implementation.
    bound: Validate bytes/rows before mutation, use bounded batches/pages and explicit quota/truncation outcomes; no recursive Artifact traversal or unbounded per-row tasks. Scan-plan aggregation cannot bypass per-batch or per-Run bounds. Test exact limits and one over; summaries may bound detail but never omit outcome counts or pretend a truncated scan is complete.
lifecycle:
  - entity: Canonical Finding and retained scanner source material
    delete: Existing owner commands and Project cleanup; source Run/Audit purge does not delete accepted Findings/evidence.
    cascade: Project deletion releases ordinary sources/receipts/material and rejects new publication.
    retention: Existing Project Artifact freezing and evidence ownership; no scanner-private store.
acceptance_criteria:
  - id: A1
    given: Real supported Nuclei/SQLMap positives followed by a publication operation Stage
    when: Composed Project scanner Workflows finish
    then: Findings appear in existing API/UI with null analyst assessment, original scan/publishing provenance and exact evidence; fixed controls create none.
  - id: A2
    given: Exact retained normalized inputs with Runtime and Gateway unavailable, including sources without qualified canonical equality
    when: A publication-only Workflow executes, an interrupted or acknowledgement-lost call is replayed, and the same inputs are published again in a new Run
    then: Server operation execution publishes with zero target requests/model calls/allocations and no duplicate accepted source or lost remaining item.
  - id: A3
    given: Duplicate rows, concurrent scans, multiple tested SQLMap parameters and existing analyst edits
    when: Normalization and publication execute
    then: Correct subjects and qualified equality retain one problem with independent actual scan sources; replay/refresh preserves analyst state.
  - id: A4
    given: Empty/unknown/info-only, malformed, missing, oversized and partial evidence plus permission/quota/claim-loss/cancel/deletion cases
    when: Candidate validation or the operation runs
    then: Outcomes are bounded/classified, no unsupported Finding or clean verdict is fabricated, and the scanner is not restarted to repair publication.
  - id: A5
    given: Findings from ordinary and Audit scan/publish composition
    when: Audit results/artifacts and the source Run report are inspected, then source execution data is purged
    then: Audit results contain canonical Findings with no report or Finding-package Artifact; reports are available at the concrete Run while it exists, selected evidence/provenance survives in Finding sources after purge, and ffuf/Katana sitemap imports still pass.
  - id: A6
    given: A multi-item Audit scan with an incidental discovery and publication interrupted after a committed item
    when: Collection settles the Run and a separate publication-only Run reuses exact retained input
    then: Committed Findings remain visible for the correct Audit Task, batch members stay isolated, hypothesis/incidental provenance is preserved, and replay cannot invent or reassign historical Audit membership.
  - id: A7
    given: Real Nuclei informational fingerprint and vulnerability matches, existing manual sitemap annotations and a repeated scan
    when: The composed scanner Workflow collects sitemap metadata and publishes eligible Findings
    then: Supported informational metadata is visible in sitemap without a fake Finding, eligible problems appear in Findings, replay preserves manual metadata without duplicates, and either publication path cannot conceal the other's classified failure or trigger rescanning.
