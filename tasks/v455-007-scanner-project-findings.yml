schema_version: '1.0'
id: V455-007
title: Publish Nuclei and SQLMap results through a separate Finding operation
milestone: scan-tools-followups
epic: scan-tools
kind: feature
priority: P1
status: pending
depends_on: [V55-003, V64-014, V64-026]
languages: [python, go, typescript, yaml, json, markdown]
goal: >-
  Supported positive Nuclei and SQLMap results appear in Project Findings through
  an explicit deterministic operation after scanning. Publication can be retried
  from exact retained normalized inputs without another scan, target request,
  model call or Runtime allocation.
demonstration: >-
  A Project Workflow scans an isolated target, retains normalized candidates and
  evidence, then executes a publication operation Stage. Real Nuclei git-config
  detection and SQLMap injection produce Findings readable through existing
  API/UI with evidence; fixed controls produce none. A publication-only Workflow
  works from retained normalized inputs while Runtime/Gateway are unavailable.
context:
  authority: >-
    User direction 2026-11-08: ffuf updates sitemap, Nuclei must create Findings;
    SQLMap needs the same integration. The user requested this task and proposed
    a separate operation. This task adopts that direction through the existing
    Server-operation Stage path. Exact operation/schema names are agent proposals.
    This request prepares the task; implementation and deployment remain unassigned.
    It supersedes the initial draft's implicit scanner-publication side effect.
    Further user decision: scanner reports stay on their concrete Run and are not
    added to Audit artifacts. Audit scanner results contain canonical Findings,
    not Finding/report artifacts; users inspect reports through the source Run.
    Review follow-up: fingerprints and information-only observations belong in
    Project sitemap, not discarded merely because they are not problem Findings.
  source_revision: 8cada27e100fe1847e206fe2fe42e0ad759c5751
  evidence: tasks/evidence/v455-007-scanner-findings-gap.json
  specification:
    - docs/spec/execution/server-operations.md#SOP-R1
    - docs/spec/execution/server-operations.md#SOP-R4
    - docs/spec/execution/server-operations.md#SOP-R5
    - docs/spec/execution/server-operations.md#SOP-R7
    - docs/spec/configuration/workflows.md#WFL-R89
    - docs/spec/tools/scanners.md#SCN-R41
    - docs/spec/tools/scanners.md#SCN-R50
    - docs/spec/findings/findings.md#FND-R210
    - docs/spec/findings/findings.md#FND-R211
    - docs/spec/findings/findings.md#FND-R214
    - docs/spec/findings/findings.md#FND-R220
