      cd runtime && uv run pytest -W error tests/test_scan_findings.py
      tests/test_scan_toolset.py tests/test_scan_sqlmap_request.py
      tests/test_tool_report_publication.py tests/test_shared_finding_facades.py
    covers: [A1, A3, A4, A5, A7]
  - command: make test-runtime
    covers: [A1, A3, A4, A5, A7]
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -count=1 ./internal/operations/... ./internal/findingintake ./internal/auditimport ./internal/auditscan ./internal/scheduler ./internal/config ./internal/projectsitemap
    covers: [A1, A2, A3, A4, A5, A6, A7]
  - command: make test-scan-e2e test-findings-e2e test-web-scan-ui-stack
    covers: [A1, A2, A3, A4, A5, A6, A7]
  - command: make test-project-sitemap-tools-e2e test-project-sitemap-postgres
    covers: [A5, A7]
  - command: make verify-public-api test-wire-cross-language
    covers: [A1, A2, A4, A6, A7]
  - command: make lint
    covers: [A1, A2, A3, A4, A5, A6, A7]
verification_requirements: >-
  Extend existing real process gates with pinned actual scanners, isolated targets
  and disposable PostgreSQL, plus existing browser Finding/evidence checks.
  Assert via both API and UI that reports are absent from Audit artifacts/results
  and available through the source Run; a hidden copied report does not pass.
  test_scan_findings.py is a required new regression module, not an existing
  passing suite. Missing binaries, zero selections or skipped required scenarios
  do not count as acceptance. Prove operation replay/claim fencing on real
  storage. Task creation records no implementation, live SQLMap execution or
  acceptance pass.
  Cover every path in context.paths_to_cover and exact-limit/one-over cases;
  changed public receipt origin shapes require OpenAPI, generated clients and
  UI updates together, without synthetic allocation/Worker fields. Include a
  new-Run replay case after original Run purge with explicitly retained inputs,
  and a forged-origin/cross-Project input rejection. Existing gate names are
  commands to extend, not evidence that these new scenarios already run.
