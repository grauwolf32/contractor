schema_version: '1.0'
id: V81-001
title: Keep local-direct workspaces usable after confirmed no-op filesystem errors
milestone: local-direct-noop-failures-2026-10
priority: P1
status: in_progress
implementation_commit: null
depends_on: []
languages: [python, markdown]
goal: Let Workers recover from disk-full or permission errors that leave their workspace unchanged.
context:
  issue: https://github.com/grauwolf32/contractor/issues/300
  finding: LocalDirectWorkspace fences its guard on every physical mutation exception, including errors before commit with cleaned temporary files.
scope:
  in:
    - Mark confirmed no-op filesystem errors from atomic writes and first failed mutating syscalls.
    - Keep the guard usable only when cleanup of temporary files succeeded and no mutation committed.
    - Cover write/update, delete, Podman execution after no-op failure and partial-mutation fences.
  out:
    - Change timeout/cancellation fencing or roll back partial changes.
acceptance_criteria:
  - {id: A1, text: ENOSPC/EDQUOT writes and EACCES temp creation leave target/listing unchanged and guard usable.}
  - {id: A2, text: Failed first unlink and first mkdir leave the guard usable.}
  - {id: A3, text: Podman exec remains possible after a confirmed no-op workspace error.}
  - {id: A4, text: Partial multi-step copy/remove and failed temp cleanup still fence.}
tests:
  - {command: cd runtime && PYTHONPATH=src .venv/bin/pytest tests/test_projectfs_local_direct.py tests/test_projectfs_local_io.py tests/test_podman_command_coordination.py, covers: [A1, A2, A3, A4]}
