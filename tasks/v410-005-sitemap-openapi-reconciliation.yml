goal: Reuse the existing source-import operation and Go OpenAPI normalization to add guarded declarations/grouping
  and a bounded reconciliation result.
context:
  authority: 'User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence. User review on 2026-10-27 supersedes
    generic collection-completeness/status requirements: automatic sitemap updates are best effort and must remain
    isolated from HTTP/scanner outcomes and Run contracts. The 2026-10-27 metadata-policy decision removes sitemap
    secret filtering and matching-secret transport; ordinary owner-selected inputs authorize complete selected context,
    and the 2026-10-28 shared-map decision removes source-mode classification and consumer filtering. All permitted
    readers use the same Project metadata; snapshotInputs controls only needed original-file retention during snapshots.'
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 4 and 6-11: normalized OpenAPI, pure computation, source generations, rebase restrictions,
    shared-map views and bounded regrouping.'
  specification:
  - docs/spec/artifacts/project-sitemap.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
