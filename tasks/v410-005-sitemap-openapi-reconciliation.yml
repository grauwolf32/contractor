scope:
  in:
  - Reuse/extract the existing Go normalized OpenAPI operation/reference logic with callers retained in both scan
    preparation and sitemap reconciliation; do not implement a second Runtime parser.
  - Extend the existing import_sitemap_source dispatcher with exact OpenAPI reconciliation, callable from tool@1;
    reuse policy/grants instead of inventing another tool or independent import protocol.
  - Return a bounded result naming exact inputs and actual publication ref. Materialize an exact context artifact
    only for a declared Workflow/Audit consumer; do not require an enriched-map copy, patch artifact and separate
    report all at once.
  - Implement declared-only/observed-only comparisons, concrete-path precedence, ambiguous-template gaps, parameter/media/outcome
    differences and exact selected context snapshots.
  - Apply optional shared source changes through the same guarded reducer and receipt/quota boundary; pure computation
    alone does not imply publication.
  out:
  - Generating or rewriting OpenAPI, remote reference fetching, guessed origins, new semantic Audit steps or vulnerability
    verdicts.
  - Recovering discarded concrete members or widening suppressed/manual selections during regrouping.
  - Shipped Workflow/Audit catalog composition (V410-006).
  - Unconsumed output copies, default patch artifacts, another reconciliation/import tool surface or collection-completeness
    states.
requirements:
- id: R1
  text: Same exact authorized bytes/refs, explicit origin and versioned policy produce the same canonical computation
    outputs. Publication timestamps/allocated revisions are separate.
- id: R2
  text: Unbound server variables, ambiguous deployment origins, unsupported structures and local reference failures
    are explicit; no implicit remote fetch or target request occurs.
- id: R3
  text: Concrete declarations such as /users/me precede templates. Ambiguous matches remain unresolved, source-derived
    declarations stay labelled, and observation confidence is not upgraded by a schema.
- id: R4
  text: Regroup only retained concrete members. Preserve their applicable context/evidence/manual metadata and exclusions,
    and retain unknown aggregate/gaps for discarded members.
- id: R5
  text: Publication preserves concurrent append observations but compares expected source generation/ref/digest/policy
    and manual state. A stale old-schema Workflow cannot refresh its predecessor and retry as a new intended source
    replacement. A predecessor ref is a CAS condition, not a retention hold or a chain pinning map history.
- id: R6
  text: Keep the tool result bounded. Produce large exact context/output artifacts only for declared consumers, through
    existing snapshot/Artifact paths. Every permitted reader uses the same shared metadata and grouping; absent schema
    bytes never hide known routes or make declarations into observations. snapshotInputs permits only needed original
    Run file retention in the snapshot transaction, independently of map visibility and ordinary owner-selected inputs.
failure_outcomes:
- operation: Exact map/schema read and deterministic reconciliation
  permanent: Invalid map/schema, inaccessible refs, unsupported policy or missing explicit origin fails permanently
    with prior shared content intact; documented per-operation extraction limitations produce bounded gaps.
  retryable: Only storage/Artifact transport failures retry against the same exact inputs and operation deadline.
  ambiguous: Reconcile exact result publication identities; do not rerun target traffic because this tool performs
    none.
  cancelled: Join bounded computation/output assembly before allocation cleanup.
  timeout: The reconciliation deadline owns parse/reindex/output work; budgets bound nested reference expansion and
    source bytes.
- operation: Optional guarded live source replacement
  permanent: Stale source/manual preconditions, generic Artifact admission rejection or all-protected history capacity
    are nonautomatic-retry outcomes; retaining the private computation does not authorize shared rollback.
  retryable: Append-compatible CAS races may rebase within three attempts/deadline; bounded ArtifactStore eviction
    backpressure retries publication only. Source conflicts never refresh intent automatically.
  ambiguous: Existing keyed receipt confirms the original generation/revision even after eviction without republishing;
    unavailable exact bytes never substitute latest.
  cancelled: A fenced allocation cannot publish after cleanup begins.
  timeout: Publication acknowledgement reconciliation has its own remaining operation allowance and never changes
    pinned input intent.
cardinality:
- collection: Selected OpenAPI operations and references plus retained map members
  expected: 100-1000 operations/groups
  maximum: Existing scanplan parse/reference bounds and proposal section 10 map/member/source/rule ceilings; tighter
    bound wins
  bound: Bound bytes/reference expansion and one accepted source patch; no whole-history scan or per-request Workflow.
- collection: Comparison report and output artifacts
  expected: Bounded summary with exact selected differences
  maximum: Artifact/tool-envelope/consumer document limits plus proposal map bounds
  bound: Large output uses explicit artifact slots; truncate only through explicit counts/continuation/gaps, never
    a false complete comparison.
lifecycle:
- entity: Source generation and reconciliation output
  delete: Source replacement is guarded; Project purge removes map source metadata and ordinary output scope purge
    follows existing policy.
  cascade: Independent observed traffic survives source replacement; Run deletion does not erase published Project
    metadata.
  retention: Selected exact computation inputs/outputs and evidence acquire real holds before acceptance, atomically
    against eviction; refs/metadata/receipts alone do not pin history. Live publication records its actual revision
    separately and ArtifactStore owns eviction of eligible history.
acceptance_criteria:
- id: A1
  given: Exact OpenAPI/map inputs and supported/unsupported reference/origin fixtures
  when: The registered tool computes repeatedly
  then: Canonical outputs match and bounded gaps replace guesses or external fetches; the ordinary scan preparation
    regressions remain correct.
- id: A2
  given: Concrete /users/me, template /users/{id}, ambiguous templates and observed extra parameters
  when: Declarations are imported before or after traffic
  then: Concrete precedence, separate declarations/observations and parameter differences are correct without manufactured
    coverage.
- id: A3
  given: Suppressed members, identity contexts and discarded incoming members at inventory limits
  when: A schema regroups the map
  then: Retained provenance/edits survive, no suppression widens and unavailable old membership remains an explicit
    gap.
- id: A4
  given: Concurrent v1/v2 schema replacements and appended observations
  when: The older computation finishes after the newer source commits
  then: Shared source rollback is rejected, appended observations survive and a retry preserves the original expected
    predecessor.
- id: A5
  given: Mixed source kinds, missing source files, large output, a lost publication reply and a concurrent hold/eviction race
  when: A permitted tool computes/publishes through production boundaries
  then: Authorized outputs are materialized only in declared needed slots. Source publication receipts and exact selected
    holds keep their existing semantics without republishing, source substitution, implicit pinning or a cumulative
    Run quota. Dedicated views expose the same complete shared metadata to every permitted reader. Needed missing
    snapshot files produce source-unavailable gaps or fail requireReferencedInputs; ordinary owner-selected inputs
    remain usable in full. No missing file is silently replaced with current content.
