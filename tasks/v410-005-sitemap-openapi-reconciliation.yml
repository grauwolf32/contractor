test_prerequisites:
- Register deterministic reconciliation process cases in the sitemap gate. No target network, installed scanner, browser
  or external model is needed. PostgreSQL-backed source races and receipt/quota cases are mandatory.
execution:
  branch: codex/v410-005-sitemap-openapi
  claimed_on: '2026-10-29'
  note: Started after V410-004 and the user-requested module-boundary guidance landed in main. The earlier Go-parser
    source-import plan is superseded by the user's explicit distinction between external-provider adaptation and
    domain operations over existing artifacts. Implementation follows the server-operation design below.
implementation_decisions:
- date: '2026-10-30'
  decision: Implement the approved operation field as a closed alternative to Planner stages. Pure sitemap-openapi-join@1
    and explicit sitemap-apply-openapi@1 run only through Scheduler, without Runtime allocations or Planner sessions.
    Move the common Stage result to internal/stageresult. Domain writes share the existing Project receipt and Artifact
    transaction, fenced by the Run claim; the first slice requires a Project Run for this existing lifecycle owner.
    Exact inputs and output bindings remain unchanged on recovery. Apply preserves appended observations and rejects
    stale source or manual intent. Unsupported selected structures fail atomically; comparison reports explicit limitations,
    bounded omitted counts and unresolved declarations separately from declared-only. No second decoder, operation
    journal or new receipt/claim table is introduced. Standalone pure execution can be reopened only with a concrete
    consumer and a common retention/replay owner, not an additional sitemap-specific journal.
- date: '2026-10-29'
  decision: The user explicitly requires Scheduler, not Planner, to invoke Server operations. A Stage selects exactly
    one execution path, Planner or Server operation. internal/operations has no Planner dependency; the Stage result
    contract is shared outside the Planner module. Use existing Stage state, Run claim, artifact publication and
    recovery rather than Planner sessions or an additional operation journal. This supersedes the earlier proposal
    to adapt operations through the Planner registry. The initial uncommitted Planner adapter changes were removed.
- date: '2026-10-29'
  decision: The user clarified that OpenAPI is an API contract artifact and join is a Server domain operation, requested
    an explicit Stage and a separate folder of operation modules with the actual body in sitemap. This supersedes
    both previous import_sitemap_source plans. Use internal/operations for the generic executor and thin concrete
    adapter modules; reuse the existing Planner registry/session and Stage result lifecycle. The scheduler does not
    parse OpenAPI or branch on sitemap operation names. Server execution permits zero Workers only for its registered
    model-free operation runner. The join algorithm remains in internal/projectsitemap and reuses Go source decoding.
- date: '2026-10-29'
  decision: Runtime owns OpenAPI document decoding, local-reference extraction and bounded comparison. Server receives
    normalized declarations through its existing guarded source-replacement/reducer and ordinary Artifact metadata,
    receipt and publication mechanisms. Exact caller-selected map context fixes the expected source predecessor;
    retries never refresh it. Shared source-file locators use current-Run Artifact authority and snapshotInputs retains
    only the original inputs needed by an explicitly selected snapshot. No parallel report store or import journal.
- date: '2026-10-27'
  decision: 'Reconciliation has a concrete consumer: it supplies declarations/grouping for the current map and exact
    selected context when a Workflow/Audit requests it. Reuse import_sitemap_source and the Go operation/reference
    parser. Remove mandatory parallel enriched-map/patch/report outputs that have no separate consumer; preserve guarded
    source replacement and immutable exact input selection.'
