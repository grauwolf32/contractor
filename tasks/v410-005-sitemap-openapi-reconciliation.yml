  description: Common Server-operation Stage adapter and the concrete sitemap join module, without duplicating domain algorithms.
- path: internal/projectsitemap
  description: Join exact OpenAPI and sitemap artifacts using existing Go decoding, deterministic grouping and shared Artifact lifecycle mechanisms.
- path: api/testdata
  description: Server/UI operation-selection fixtures, preserving the existing shared canonical sitemap and argument-binding cases.
