  boundary_decision: Tools own the semantic selection and validation. Shared Runtime helpers live in toolsets.common
    and are explicitly called by production consumers; no universal argument-rewriting plugin, hidden acceptance
    of deleted arguments, new receipt store, database entity or framework for hypothetical tools. Server remains
    the authoritative owner of grants, exact Artifact reads, CAS, receipts, retention and lifecycle. Existing
    private/public/wire/persisted revision fields remain strict; only model-facing inputs change. Update numbered
    owning specs, descriptions, active instructions and actual ADK schemas with implementation; this task
    plan does not change shipped specs.
  delivery_group: 2 / revision, after the common exact-selection behavior in V479-004.
  parallel_plan_reconciliation: A separate, unmerged planning lane codex/v478-audit-plan-results exists at
    review time, with pending V478-002 (sources/evidence/fact) and V478-003 (submit_result/submit_results).
    Its task drafts still mention explicit correction revisions. This newer decision removes those model arguments
    too. Do not edit the other lane's uncommitted files or introduce a dependency on nonexistent main task
    records. Before touching a shared owner, reconcile the landing order and update the affected V478 drafts
    in their owning lane or after they land; then record real depends_on edges where needed. Apply this contract
    to the active names, never preserve submit_check_result aliases or restore revision arguments to satisfy
    an older draft. This is an integration precondition, not authorization to implement/merge V478 or widen
    this package into durable evidence collection.
  surface_inventory: 'Do not count only JSON schema property names: scanner dict arguments and selected_materials_json
    currently require revision in descriptions/runtime validation despite generic outer schemas. Inspect all
    exported model callables and distinguish trusted non-model tool Workers.'
scope:
  in:
  - Remove read_project_finding revision and nested model revisions in select_project_findings selectors,
    read_finding_selection collection_ref, finding/fact evidence_refs and selected_materials_json.
  - 'Cover revision requirements hidden by generic schemas: scan_sqlmap request_ref, scan_ffuf wordlist_ref
    and import_sitemap_source artifact_ref; audit every other actual LLM-selected exact-ref consumer.'
  - Preserve the same field addressing where possible, using revision-free input records distinct from full
    internal/output ArtifactRef; align V478 sources only when that separately owned plan lands.
  out:
  - New general artifact-handle addressing, renamed model-supplied version/ETag preconditions, force/replace
    flags, compatibility aliases and automatic semantic rebasing. The approved read_artifact pagination cursor
    is in scope in V479-004.
  - Removal of Server/API/wire/store revision checks, changed grants/retention or model/tool budget semantics.
  - Unrelated UI redesign, live model evaluation, demo deployment and full repository test gates.
requirements:
- id: R1
  text: Keep normal namespace/name and Finding IDs as model selections; derive exact versions from trusted
    invocation materials, prior selected tool results or the owning discovery view. Do not replace one revision
    field with a model-authored digest, generation, ETag or opaque version argument. Return full resolved
    revisions for observation. The approved read_artifact cursor addresses exact bounded reads and is not
    a general replacement for every source selector.
- id: R2
  text: Project Finding reads and selection use the discovered current revision held by Runtime, preserving
    server conflict if it changed. Unknown IDs require discovery; do not invent a version or silently rediscover
    on the model's behalf. Frozen collection cursors and explicitly selected sources retain their exact identity
    and existing lifecycle checks.
- id: R3
  text: For evidence, material composition, scanner inputs and report imports, resolve the exact observed/selected
    material, not whichever bytes are latest when the effect happens. A metadata listing alone is not content
    evidence; retain current observation/provenance rules. Missing, expired, ambiguous, foreign or hidden
    references fail before publication/scanner launch. A bound/current source cannot automatically replace
    an older retained source.
- id: R4
  text: Separate model-input records from internal exact descriptors. Reject nested revision fields and duplicate/unknown
    keys in native and serialized JSON inputs; keep V477 one-layer helpers and field diagnostics. Do not weaken
    ArtifactRef.require_exact, stored schemas or Server validators. Only the Runtime adapter fills exact refs
    after authorizing/resolving the semantic selection.
- id: R5
  text: Model-free tool@1 execution already receives exact ArtifactRefs from deterministic argument bindings.
    Preserve that trusted path separately from the changed model-callable facade; do not strip exact versions
    from scanner execution manifests or introduce compatibility unions to accept both model and internal formats
    everywhere.
- id: R6
  text: Reuse existing selected material handles where they already belong to a domain, without creating a
    generic new artifact-link interface or auto-archiving every observation. Shared preparation lives below
    owners in toolsets.common. Preserve local request_id capture, origin/item membership, source retention
    and existing idempotency keys; no false independent evidence through copied summaries.
- id: R7
  text: Compaction preserves trusted selections and discovery fences independently of summary text. New invocations/recovery
    do not revive unvalidated stale IDs; explicit reread/reselection is required when state is unavailable.
    Enforce shared bounded selection admission without whole-Project discovery or source-history hydration.
failure_outcomes:
- operation: Resolve a selected version and perform the existing owner operation
  permanent: Unknown/ambiguous/unavailable selection, malformed or removed argument, stale precondition, denied
    authority and owner limit failures return a bounded classified tool error before a new effect. Preserve
    existing owner codes; new codes must be documented at their owner. No implicit latest substitution on
    conflict.
  retryable: Existing classified infrastructure failures retain bounded attempts and the original call/invocation
    deadline. No retry loop for deterministic conflicts.
  ambiguous: Reuse existing exact-byte CAS recovery or owner receipt with the same frozen payload, precondition
    and identity. Never regenerate intent from latest state or repeat a semantic append after a lost response.
  cancelled: Existing invocation/session owners join admitted I/O and preparation before cleanup. Late completions
    cannot update another invocation or a newer operation generation.
  timeout: Keep existing operation and invocation deadlines; do not introduce an unrelated timeout, poller
    or budget reset.
cardinality:
- collection: Runtime-held selected versions and pending operations
  expected: A few input roles, current document targets and explicitly used materials; admit only actual consumers.
  maximum: Keep existing owner row/byte/page/in-flight limits. Any added shared selection map has an explicit
    proposed ceiling of 4096 entries and 4 MiB encoded metadata per logical invocation, defined once in the
    owning limits registry.
  bound: Point lookup and bounded admission; no entire Run/Project enumeration, raw payload copies or history
    scans on each tool call. Refuse new admissions at the bound without silently evicting an in-use selection
    or relabeling it as current.
lifecycle:
- entity: Private version/precondition state of the existing tool session or logical invocation
  delete: Clear through the existing owner after completion/cancellation and joined work; allocation close
    clears all remaining private state.
  cascade: Successful compaction preserves selected versions and pending write identity; it only resets the
    V476 consecutive series where specified. SDK turns and failed checkpoints do not refresh materials or
    grant write authority.
  retention: No new persistent owner or holds. Replay/recovery uses only existing trusted inputs, admitted
    operation state and validated owner records. A model-written summary or returned revision supplied as
    an argument is never authority. If exact state cannot be restored, require a fresh semantic read/select
    instead of guessing latest.
acceptance_criteria:
- id: A1
  given: Actual LLM declarations and generic/serialized exact-ref fields
  when: Every listed consumer is invoked without model revision fields
  then: The owning Server/scanner receives exact validated descriptors; output revisions remain and nested
    old fields are rejected.
- id: A2
  given: Changed Finding metadata and changed/expired source artifacts after selection
  when: Read/select, evidence publication, import and scanner preparation run
  then: Existing stale/authority/retention failures remain explicit, with no automatic latest substitution,
    partial publication or scan launch.
- id: A3
  given: A model-free scanner Worker and the same scanner selected for an LLM
  when: Trusted bindings and model selectors use their real execution paths
  then: Both use intended exact request/wordlist bytes; the model never supplies revision while deterministic
    manifests retain it.
- id: A4
  given: Compaction, duplicate selections, concurrency, unavailable provenance and maximum selectors
  when: Real discovery/retention and tool paths complete or reject
  then: Exact attribution and bounds survive; no extra store, whole-owner scan, history-based authority or
    unjoined work appears.
