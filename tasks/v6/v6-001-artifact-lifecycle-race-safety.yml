schema_version: "1.0"
id: V6-001
title: Make Artifact writes and terminal freezing race-safe
milestone: lifecycle-review-hardening
priority: P0
status: completed
implementation_commit: 645d0a287e726e00075c5befc542614284f252dd
depends_on: [V5-003]
languages: [go, sql]

goal: >-
  Ensure an allocation cannot commit an Artifact after its write fence and that
  valid empty Runs plus concurrent first writes cannot become permanently
  stuck or fail with false conflicts.

context:
  failure_modes: >-
    Private PUT previously checked the grant and then wrote through a detached
    ScopedStore, allowing SetWriteFence to win between those actions. Empty
    RunScopes made FreezeRunOutputs return not-found. PostgreSQL CTEs that used
    INSERT ON CONFLICT DO NOTHING and a same-statement SELECT retained the
    pre-wait snapshot for concurrent scope/blob creation.

scope:
  in:
    - Serialize the complete private Artifact mutation with SetWriteFence and allocation release.
    - Recheck the exact allocation grant while the mutation authorization guard is held.
    - Treat freezing an empty Run output set as a successful no-op.
    - Make a concurrent first scope write observe the winning committed scope.
    - Make different bindings concurrently storing identical bytes observe the winning content-addressed blob.
  out:
    - Durable Runtime grants, a new blob backend, weakening binding CAS, or allowing Workers to write outputs.

deliverables:
  - {path: internal/controlplane, description: Allocation-scoped write authorization guard shared by writes, fencing and release.}
  - {path: internal/httpapi/privateartifacts, description: Private PUT holds the authorization guard through Store.Write.}
  - {path: internal/artifacts, description: Empty freeze and PostgreSQL uniqueness-wait fixes with deterministic integration tests.}
  - {path: internal/persistence/migrations/000014_artifact_blob_upsert.sql, description: Immutable no-op blob UPSERT support for atomic concurrent reuse.}
  - {path: docs/spec/03-artifact-plane.md, description: Linearization and empty-output requirements.}

acceptance_criteria:
  - id: A1
    given: An Artifact write is already inside its Store mutation.
    when: Scheduler establishes the allocation write fence.
    then: Fence completion waits for that mutation and no later mutation can start with an unfenced grant.
  - id: A2
    given: A valid terminal Run has no Artifact scope or bindings.
    when: Its outputs are frozen.
    then: Freeze succeeds and the lifecycle transaction can commit.
  - id: A3
    given: Two transactions concurrently create one scope or one identical blob.
    when: The losing uniqueness check resumes after the winner commits.
    then: Both independent binding writes succeed without a false Artifact conflict.

tests:
  - {name: unit, command: "go test ./internal/controlplane ./internal/httpapi/privateartifacts ./internal/artifacts", covers: [A1, A2, A3]}
  - {name: postgres, command: "make test-postgres", covers: [A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
