schema_version: "1.0"
id: V372-028
title: "Decode persisted Run, Stage and allocation snapshots strictly in runstore"
milestone: hub-audit-defects-2026-10
epic: execution-core
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: "runstore decodes every persisted struct-shaped JSON document it reads with strictjson, so a stored document with an unknown member or a member spelled in another case fails to read instead of being silently accepted or dropped."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2b: V370-017, V369-002, V370-005), recorded 2026-10-12; file:line verified on b2b09ea"
  specification: "docs/spec/configuration/catalog.md#CAT-R78"
  revalidated: >-
    2026-10-24 on b523ae77. Still holds for every document but two: the
    candidate and accepted StageResults are already strict, because
    stageresult.StageContentResult gained an UnmarshalJSON that decodes
    with strictjson (internal/planner/stageresult/stage_result.go:48-64,
    194c6101, V378-001), so the json.Unmarshal calls at
    internal/runstore/stage_scan.go:69 and :79 reject unknown and
    case-variant members today; no runstore test proves it on read, so the
    regression test still covers them. runstore's event reads already use
    strictjson (run_event_store.go:103 and :198). No V407, V409 or V414
    task touches these decoders. File:line references below are current.
  finding: >-
    scanStageExecution decodes the stored StageContext and the
    StageTermination with json.Unmarshal (internal/runstore/stage_scan.go:61
    and :89) before validating them. encoding/json ignores unknown members
    and matches member names without regard to case, so a stored document
    that a newer or broken writer shaped differently is read as if it were
    valid; AGENTS.md sections 2 and 6 ask for strict validation on read with
    strictjson, as CAT-R78 already does for persisted Workflow snapshots.
    The columns are jsonb, so PostgreSQL has already collapsed duplicate
    members; the gap is unknown and case-variant members. Predates the
    shallow history (boundary 6349621).
  siblings: >-
    Struct-shaped documents runstore reads the same way, all in scope: the
    Run scan (internal/runstore/scan.go:56 Audit completion, :83
    cancellation, :95 RuntimeConfig snapshot, :103 Project HTTP target,
    :111 Skill snapshot) and the allocation scan
    (internal/runstore/allocation_store.go:228 completion contract, :238
    AgentTemplate ref, :241 WorkerRuntime ref, :255 allocation Runtime
    configuration). Map-shaped documents have no member names to enforce
    and jsonb already rejects duplicates, so they are ruled out unless the
    implementation switches them for uniformity: Run parameters
    (scan.go:92) and metadata labels (scan.go:122, queue_store.go:69,
    store.go:393), and the object check of validateJSONObject
    (types.go:677-683) used for the Stage spec snapshot
    (stage_scan.go:57-60), which is decoded where the Workflow snapshot
    rules apply. A decoded type with its own UnmarshalJSON is checked by
    strictjson for duplicate keys only, so such a method must decode its
    members with strictjson itself (AGENTS.md section 6); on b523ae77 no
    in-scope type has one apart from StageContentResult, which already
    decodes strictly, and a method added later must follow the same rule.
    Other stores reading jsonb with encoding/json are the same class and
    can follow; this task covers runstore. The executionConfig patch
    decoder is V372-014.
scope:
  in:
    - "Every struct-shaped persisted JSON read in runstore decodes with strictjson (or a strict decoder of the type) and fails the read on an unknown or case-variant member."
    - "PostgreSQL tests that store, through a raw UPDATE, a snapshot with an unknown member and one with a case-variant member in each in-scope column (including the candidate and accepted StageResults) and expect the read to fail."
  out:
    - "The stored formats and write paths."
    - "The error class of a failed persisted-document read: it stays what the column's existing validation failure returns today."
failure_outcomes:
  - operation: "Reading a Run, StageExecution or allocation row whose stored document is not strict"
    permanent: "The read fails with the same error the column's existing decode or Validate failure returns (no new class); callers handle it as they handle a document that fails validation today."
    retryable: "Not applicable: a stored document does not change between attempts."
    ambiguous: "Not applicable: a read."
    cancelled: "Not applicable: decoding is in-process."
    timeout: "Not applicable."
acceptance_criteria:
  - id: A1
    text: "A StageExecution, Run or allocation row whose stored struct-shaped JSON has an unknown member or a case-variant member fails to read."
  - id: A2
    text: "Every existing runstore, Scheduler and public Run test passes unchanged."
  - id: A3
    text: "The new tests fail on b523ae77 for the StageContext, StageTermination, Run and allocation documents (the StageResult cases already pass there)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/runstore ./internal/scheduler ./internal/httpapi/public"
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
