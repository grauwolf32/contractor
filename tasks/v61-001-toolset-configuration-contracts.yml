schema_version: "1.0"
id: V61-001
title: Specify Run-scoped toolset configuration and allocation discovery contracts
milestone: toolset-runtime-configuration
priority: P1
status: pending
implementation_commit: null
depends_on: [V8-016, V50-001, V55-003]
languages: [go, python, typescript, json, yaml, markdown]
goal: >-
  Define one strict cross-language extension for generic toolset settings and
  MCP Streamable HTTP before enabling a remotely discovered toolset.
context:
  authority: >-
    User requested implementation task specifications, accepted one shared
    configuration per toolset per Run, and requires Streamable HTTP only with
    reuse of AgentTemplate, RuntimeConfig, bindings and runtimeLabels.
  design: docs/plans/2026-09-19-toolset-runtime-configuration.md
  specification:
    - docs/spec/01-agent-template.md
    - docs/spec/02-runtime-and-a2a.md
    - docs/spec/07-runtime-labels-and-infrastructure-config.md
    - docs/spec/19-audits.md
    - docs/spec/29-tool-workers.md
  compatibility: >-
    Preserve the unified contractor/v1alpha1 wire, old canonical bytes/digests,
    static capabilities, current native tools and model-free Worker contracts.
scope:
  in:
    - Define worker.toolsets keyed by exact toolset ref and typed schema registration with required/optional configuration metadata.
    - Specify atomic per-ref default/Run-label merge, identical-value deduplication, clear semantics and rejection of toolset patches in physical Agent labels.
    - Define MCP endpoint, mcp-headers@1 reference, CA, connect/RPC defaults and bounds, and omission-compatible private materialized settings/origins.
    - Add closed Go/Python models and schemas for allocation-discovered ToolsetCapability, retaining omitted static mode and strict non-empty native tools.
    - Specify optional preparation after resource ownership, exact selected schema lifetime, errors, retries, cancellation and cleanup invariants.
    - Fix finite discovery/message/schema/result limits and the supported JSON Schema/content subset, including isError and structuredContent behavior.
    - Specify public requirements/label-coverage shapes, Run pinning/Repeat semantics, credential holds and conservative unknown-effect Audit admission.
    - Add common positive/negative wire fixtures and regenerate the affected public client/strict parsers without enabling a production MCP factory.
  out:
    - Implement network clients, publish production MCP configurations, change Workflow/Stage binding YAML or advertise an incomplete factory.
    - Add configBinding, configurationInputs, per-agent toolset configurations, generic settings resources or executionConfig toolset overrides.
deliverables:
  - path: docs/spec/07-runtime-labels-and-infrastructure-config.md
    description: Owning normative configuration, merge, credential, source and snapshot rules with valid and invalid examples.
  - path: docs/spec/01-agent-template.md
    description: Descriptor/discovery metadata, exact selection and runtime compatibility while preserving the current authoring shape.
  - path: docs/spec/02-runtime-and-a2a.md
    description: Capability, private settings, preparation ownership and MCP transport/result boundaries.
  - path: docs/spec/19-audits.md
    description: Unknown external effects and reuse of baseline pinning without weakening existing action admission.
  - path: api/v1alpha1
    description: Updated closed private schemas and synchronized Go/Python models.
  - path: api/testdata/toolset-runtime-configuration
    description: New shared canonical and invalid wire fixtures consumed from both languages.
  - path: api/openapi/contractor-public-v1.yaml
    description: Public configuration/credential and planned read-projection contracts with regenerated client and strict parsers.
requirements:
  - id: R1
    text: One exact ref has one configuration on Run; each allocation has independent session state. mcp@1 initially supports adk@1 and one endpoint, with only explicitly selected tools exposed.
  - id: R2
    text: New optional fields are omitted from old encodings; no built-in RuntimeConfig digest or existing AgentTemplate digest changes.
  - id: R3
    text: Freeze connect 10s/default and 1-60s range, RPC 60s/default and 1-600s range, inherited earlier deadlines, per-ref clear semantics and deterministic conflict paths.
  - id: R4
    text: Document numeric limits and supported schema/content constructs before dependent runtime implementation; unsupported content, remote refs and ambiguous calls have explicit outcomes.
acceptance_criteria:
  - id: A1
    text: Normative examples unambiguously cover native configurable toolsets, MCP, binding selection, mixed profiles, inheritance, clear, conflict and physical-Agent label rejection.
  - id: A2
    text: Go, Python and schemas agree on positive/negative settings, credential metadata, origins and discovery fixtures; old golden bytes/digests remain identical.
  - id: A3
    text: Exact schema/content limits, preparation/cleanup ownership, transport/result errors, replay boundaries and Audit admission are written as testable rules with no unresolved first-release behavior.
  - id: A4
    text: Public schema/client/strict parser changes pass contract checks; current catalogs and native static registrations remain valid and MCP is not advertised prematurely.
tests:
  - command: make verify-wire-contracts test-wire-cross-language verify-public-api ui-generate-check
    covers: [A2, A4]
  - command: go test ./internal/config ./internal/contracts ./internal/runtimeconfig
    covers: [A1, A2, A4]
  - command: cd runtime && uv run --frozen pytest -W error tests/test_contracts.py tests/test_allocation_contracts.py tests/test_capabilities.py
    covers: [A2, A4]
  - command: git diff --check
    covers: [A1, A3]
verification_requirements:
  - Review every normative example, ownership transition and failure row against A1/A3; record the exact fixed numeric limits and supported content/schema subset.
  - Shared fixtures are new deliverables; contract commands must select them rather than passing only historical cases.
