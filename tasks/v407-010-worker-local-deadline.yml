schema_version: '1.0'
id: V407-010
title: Enforce the effective Worker-call deadline for ordinary ADK invocations
milestone: server-runtime-review-2026-10
epic: planner-worker
kind: defect
introduced_by: V2-010
priority: P2
status: pending
depends_on: []
languages:
- python
goal: An ordinary ADK Worker locally stops model/tool work at the request deadline even if the Server
  cancellation request is lost.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/execution/worker.md
  validation: 'Revalidated against main dc7012e8 on 2026-10-23. Confirmed with the real ADK Runtime and
    a scripted model: a deadline one day in the past still completed successfully with 2 model calls.
    Existing model/tool/token budgets, request timeouts and allocation abort limit the impact; unbounded
    execution was not established.'
  severity: low
  finding: runtime/src/contractor_runtime/worker/runtime.py:621-633 calculates request.deadline for every
    invocation but applies asyncio.timeout_at only when an Audit completion strategy exists. Ordinary
    completion reaches _complete_ordinary_finish without a deadline (727-758). The Server sends best-effort
    CancelTask and ignores its failure (internal/planner/a2a/client.go:157-163), so ordinary local enforcement
    is missing when cancel does not arrive. WRK-R6 defines the effective deadline carried by the request;
    WRK-R158 currently explicitly describes whole-invocation enforcement for Audit completion. Ordinary
    calls remain bounded by independent model/tool budgets and outbound timeouts. The issue is the missing
    effective request deadline, not an absence of all resource limits.
  siblings: Cover ordinary normal execution, result finalization and terminal summarization within the
    same logical invocation. Preserve Audit completion WRK-R158, outbound request timeouts WRK-R157 and
    separately bounded joined session/allocation cleanup. Model-free ToolWorker deadlines are not the
    reproduced path.
plan:
- Extend the Worker specification to explicitly apply the effective request deadline to ordinary ADK model/tool
  execution, result finalization and terminal summarization. Keep outbound request timeouts independent
  and cleanup under its existing joined cleanup budget.
- Reject an already expired ordinary request before starting model/tool work, and apply the converted
  monotonic deadline across the complete ordinary invocation. Map expiration to the existing worker_timeout
  outcome without masking externally requested cancellation.
- Keep Audit completion error mapping and publication semantics unchanged; ensure no new model recovery/finalizer/summarizer
  call starts after expiration and any in-flight work is cancelled/joined before release.
- Use an injected UTC/monotonic clock or deadline scheduler plus synchronization gates for deterministic
  expiry during model, tool, finalizer and summarizer phases. Do not use sleep-based elapsed-time thresholds.
- Exercise expiration without a CancelTask, explicit cancellation before expiration, exhausted model budgets
  and session cleanup to prove the timeout owner does not change those outcomes.
scope:
  in:
  - Local effective-deadline enforcement on the ordinary ADK invocation path and its auxiliary model phases.
  - Explicit timeout ownership and deterministic production-runtime regression tests.
  out:
  - Changing Server deadline computation, configured models, model/token/tool budgets or outbound request
    timeouts.
  - Changing Audit completion semantics, model-free ToolWorker execution or the existing joined cleanup
    budget.
  - Claims that every ordinary Run currently exceeds its deadline or can run without any bound.
acceptance_criteria:
- id: A1
  text: An ordinary ADK invocation with an already expired effective deadline returns worker_timeout without
    any model or tool call and without receiving CancelTask.
- id: A2
  text: Deterministically advancing the injected deadline during each ordinary execution/finalizer/summarizer
    phase yields worker_timeout, starts no further model/tool calls and joins in-flight work before release.
- id: A3
  text: Explicit cancellation, budget exhaustion, Audit completion and cleanup retain their existing classified
    outcomes and lifecycle behavior; independent outbound timeouts remain in force.
- id: A4
  text: The ordinary expired-deadline regression fails before the fix, and the Worker specification records
    the deadline scope and separate cleanup budget without timing-based acceptance thresholds.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_adk_runtime.py tests/test_worker_summarizer.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
