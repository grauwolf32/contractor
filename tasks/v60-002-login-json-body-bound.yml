schema_version: '1.0'
milestone: project-review-v60
priority: P2
languages:
- go
- python
- typescript
- markdown
id: V60-002
title: Admit supported passwords after bounded JSON escaping
status: completed
implementation_commit: 80ac450db32de809de62270407f149c4d7c4e11e
depends_on:
- V59-005
goal: Allow every supported compact JSON login password at its existing UTF-8 byte bound while retaining a small
  bounded request body.
context:
  authority: User requested fixes followed by implementation of a detailed project review; first pass reproduced
    this admission defect.
  specification:
  - docs/spec/06-server-ui-and-operations.md
  design: docs/plans/2026-09-20-project-review.md
  finding_ids:
  - PR-01
  reproduction: A 1024-byte password hashes and authenticates directly; HTTP login rejects compact JSON of 2082
    bytes for backslashes/quotes or 6178 bytes for U+0001 because body cap is 2048.
scope:
  in:
  - Raise only the login JSON body cap to a justified bounded 8 KiB and synchronize the explicit specification.
  - Preserve current 12–1024 UTF-8 byte password validation, username constraints, origin/CSRF behavior and rate
    limiting.
  - Add real handler regression cases for maximum escaped valid passwords and raw-body overflow; keep malformed/unknown-field
    and authentication protection cases passing.
  out:
  - Change password policy, hashing, sessions, general HTTP limits or global WorkerCompletion limits.
  - Deploy or alter user credentials.
acceptance_criteria:
- id: A1
  text: Actual login succeeds for supported maximum ASCII, quote/backslash and six-byte-escaped control-character
    passwords.
- id: A2
  text: Requests exceeding 8 KiB, invalid password bounds and malformed/unknown fields remain rejected; origin and
    rate-limit behavior remains tested.
- id: A3
  text: Spec and implementation distinguish raw-body bytes from decoded password UTF-8 bytes and explain the bound.
tests:
- command: go test -count=1 ./internal/httpapi/public ./internal/auth
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api
  covers:
  - A1
  - A2
- command: git diff --check
  covers:
  - A3
verification_requirements:
- Reproduce the new regression on the parent implementation before applying the fix.
- Separate implementation and completion metadata commits; record full original implementation hash and actual test
  evidence.
verification:
  verified_on: '2026-09-20'
  base_commit: 35a3ab94ffd2e250e27892fbc8cec26c9de63067
  implementation:
  - Raised only maximumLoginBodyBytes from 2048 to 8192. Password hashing, decoded UTF-8 byte bounds, username
    validation, session handling, Origin/CSRF checks and login rate limiting are unchanged.
  - Updated spec 06 to distinguish raw JSON admission from decoded password bytes. Standard compact JSON
    with a 64-byte ASCII username and 1024 one-byte control characters needs 6237 bytes, including 6144
    escaped password bytes and 29 bytes of framing. Extra formatting remains subject to the raw limit.
  - Replaced the former malformed oversized-body test with real socket HTTP boundary tests retaining its
    existing TestLoginBodyIsBoundedBeforePasswordVerification name.
  reproduction:
    command: >-
      go test -count=1 ./internal/httpapi/public -run
      '^(TestLoginAcceptsMaximumEscapedPasswords|TestLoginBodyIsBoundedBeforePasswordVerification|TestLoginBodyRetainsDecodedValidationAndStrictParsing)$'
      -v
    before_fix: >-
      New regressions failed against the parent production implementation. Direct auth.Service.Login
      accepted all five maximum-password fixtures. HTTP rejected quote/backslash passwords with a
      maximum username at 2141 raw bytes and control-character passwords at 6237 bytes with 400;
      maximum ASCII and multibyte passwords passed. Both exact-8192-byte transfer forms returned 400,
      and a 1025-byte escaped password hit the old raw cap instead of decoded credential validation.
    after_fix: All 19 subcases passed through actual httptest HTTP servers; focused package result 2.384s.
  focused_regressions:
  - name: TestLoginAcceptsMaximumEscapedPasswords
    result: >-
      Passed five 1024-byte passwords with a 64-character username: ASCII, backslash, quote, six-byte
      escaped U+0001 and multibyte UTF-8. Direct authentication and HTTP login both succeed; actual
      JSON sizes, returned principal, CSRF token and creation of a session cookie are asserted.
  - name: TestLoginBodyIsBoundedBeforePasswordVerification
    result: >-
      Passed Content-Length and actual chunked HTTP transfer cases. Six valid-JSON 8193-byte requests
      return 400 without cookies; a following 8192-byte wrong password returns 401 rather than 429,
      proving oversized bodies did not spend failed-login attempts. A correct password in an
      8192-byte body succeeds and creates a session.
  - name: TestLoginBodyRetainsDecodedValidationAndStrictParsing
    result: >-
      Passed 12 HTTP cases covering too-short and oversized decoded passwords, multibyte and escaped
      oversized passwords below the raw cap, invalid/oversized usernames, missing password, unknown
      fields, multiple JSON values, malformed JSON, wrong field type and disallowed Origin. Failures
      create no cookies, retain no-store, preserve the authentication challenge for 401 and grant no
      CORS permission to the rejected Origin.
  checks:
  - command: go test -count=1 ./internal/httpapi/public ./internal/auth
    result: Passed; public 8.926s, auth 2.588s. Database-dependent cases were skipped because no test database URL was set.
  - command: make verify-public-api
    result: Passed the current public API contract gate; 4.128s.
  - command: >-
      go test -race -count=1 ./internal/httpapi/public -run
      '^(TestLoginAcceptsMaximumEscapedPasswords|TestLoginBodyIsBoundedBeforePasswordVerification|TestLoginBodyRetainsDecodedValidationAndStrictParsing|TestLoginFailuresAreGenericAndRateLimitedBySocketPeer|TestCookieUnsafeRequestsFailClosedBeforeDomainSideEffects|TestAuthenticationFailuresDoNotLogPasswordCookieOrCSRF)$'
    result: Passed; 6.275s. Includes all new HTTP regressions and existing rate-limit, CSRF/Origin and secret-log protections.
  - command: git diff --check
    result: Passed; staged implementation diff also passed git diff --cached --check.
  environment:
    go: go1.25.6 linux/amd64
    database: CONTRACTOR_TEST_DATABASE_URL unset; these auth and socket HTTP regressions do not require PostgreSQL.
  limitations:
  - PostgreSQL persistence and deployment were not exercised. HTTP tests use production authentication and routing with existing fixture domain stores.
  - No live models, shared demo, user credentials or deployed services were accessed or changed.
