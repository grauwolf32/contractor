schema_version: "1.0"
id: V414-022
title: "Read trigger functions with the explaintest lexer in the Eval purge coverage guard and check rewrite rules"
milestone: review-v407-v409-followups-2026-10
epic: evals
kind: chore
introduced_by: V409-009
priority: P3
status: in_progress
depends_on: []
languages: [go, sql]
goal: >-
  The Eval purge coverage guard finds every table a trigger function writes however its name is
  spelled, cannot be blinded by a comment marker inside a string constant, and fails when a purged
  table has a rewrite rule that writes rows.
context:
  review: >-
    tasks/done/v409-009-eval-store-bounds.yml (re-review of the purge coverage guard
    TestSharedPostgresEvalPurgeCoversCascadesAndTriggers).
  specification:
    - docs/spec/evals/managed-evals.md#EVM-R243
    - docs/spec/evals/managed-evals.md#EVM-R244
  finding: >-
    internal/evalstore/purge_coverage_postgres_test.go:66-98 parses PL/pgSQL with regular
    expressions. sqlWrite (:68) only accepts an unquoted, unqualified name after INSERT INTO, UPDATE,
    DELETE FROM or MERGE INTO; writtenTables (:82-84) strips -- comments before string constants and
    knows no escape or dollar-quoted constants or block comments. A probe calling writtenTables
    (temporary test, removed) returned: `INSERT INTO "eval_records" ...` -> [] (quoted name missed);
    `DELETE FROM public.eval_records ...` -> [public] (schema taken as the table);
    `RAISE NOTICE 'a -- b'; DELETE FROM eval_records;` on one line -> [] (the comment pass ate the
    write); the plain spelling -> [eval_records]. Calls to quoted function names are missed the
    same way by sqlCall (:70). The guard reads pg_trigger and pg_proc only; a rule in pg_rewrite
    (CREATE RULE ... ON DELETE TO eval_x DO ALSO ...) writes rows the purge would not count and the
    guard never looks. No migration creates a rule today, so no current table is missed; the gap is
    in what the guard can detect.
  siblings: >-
    internal/persistence/explaintest/plpgsql.go already tokenizes PL/pgSQL and SQL the way
    PostgreSQL's lexer does (comments, plain, escape and dollar-quoted constants, quoted
    identifiers, folding) and fails on text it cannot split; SplitStatements
    (explaintest/statements.go) exposes only Words and Values without their order, so the guard
    needs a token-level export (for example the write targets of a function body) from explaintest
    rather than a second lexer. internal/persistence/sql_placement_test.go:60 uses a regex for a
    different purpose (finding statements in Go source) and is out of scope. The Audit purge
    (internal/auditstore/internal/pgstore/purge_sql.go) has no comparable coverage guard; out of
    scope.
  provenance: >-
    git log on purge_coverage_postgres_test.go: added by f58ec2799a2d67042d820757a5eeb6571b098528,
    the implementation_commit of V409-009.
scope:
  in:
    - "Replace sqlComment, sqlLiteral, sqlWrite and sqlCall with the explaintest tokenizer through
      one exported helper; resolve quoted and schema-qualified table and function names (only the
      current schema counts as a purge table), and keep dynamic EXECUTE as \"?\"."
    - "Add a pg_rewrite check: any non-SELECT rule (rulename other than _RETURN) on a table the purge
      deletes from or a declared trigger writes is a violation."
    - "Add guard fixtures for a quoted table, a schema-qualified table, a -- inside a string constant
      before a write on the same line, a dollar-quoted body and a DO ALSO rule; each must be named."
  out:
    - "The purge phases, budgets and declared trigger lists, which must stay exactly as they are."
    - "An Audit purge coverage guard and the SQL placement check."
acceptance_criteria:
  - id: A1
    given: "Each new fixture, applied in a rolled-back transaction"
    when: "TestSharedPostgresEvalPurgeCoversCascadesAndTriggers runs on PostgreSQL"
    then: "the guard names the quoted, qualified and comment-hidden writes and the rule"
  - id: A2
    given: "The current schema"
    when: "the guard runs"
    then: "it reports no violation, and every existing fixture still produces its current message"
  - id: A3
    given: "The regex implementation at the unfixed revision"
    when: "the new fixtures run"
    then: "the quoted, qualified, comment-hidden and rule fixtures fail to be named"
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 -run
      'TestSharedPostgresEvalPurgeCoversCascadesAndTriggers' ./internal/evalstore/"
    covers: [A1, A2, A3]
  - command: "go test -count=1 ./internal/persistence/explaintest/..."
    covers: [A1]
  - command: make lint
    covers: [A1, A2]
