schema_version: '1.0'
id: V474-005
title: Decide how a configured vision model receives an image artifact
milestone: model-policy-runtime-correctness
epic: planner-worker
kind: chore
priority: P2
status: pending
depends_on: []
languages:
- python
- go
- yaml
goal: Determine whether a selected image can reach the configured model as an image part with bounded
  cost and exact provenance.
context:
  authority: User suggestion 2026-11-21 considers images via read_artifact. Agent proposal from the model
    tool interface review of main 86db128db on 2026-11-21. Multimodal delivery and the choice of transport
    require a decision.
  specification:
  - docs/spec/artifacts/artifact-store.md#ART-R117
  - docs/spec/tools/toolsets.md#TLS-R4
  boundary: runtime/src/contractor_runtime/llm/openai.py:295 serializes FunctionResponse.response to JSON
    text. In the current artifact reader, normal image media fail a metadata preflight. The image preview
    in the browser UI has a separate consumer.
  decision_needed: Choose image support through the common reader or metadata-only image results for this
    release. Recommend considering an image part only after a real caller, supported model/gateway message
    format, and affordable bounds are demonstrated.
scope:
  in:
  - Check the precise configured Gateway route and ADK-to-Gateway mapping. Use a small synthetic PNG in
    an offline payload fixture to distinguish actual image parts from a textual data URI. Identify provider
    compatibility or real-route validation that remains open.
  - Record limits for encoded bytes, decoded dimensions/pixels and context use, access to exact refs,
    cancellation, compaction/history replay and content redaction. Describe the text-only, unknown capability,
    rejected media and unsupported gateway outcomes.
  out:
  - Changing a configured model, adding a new endpoint, proactively running a model experiment, or making
    image support a dependency of plain-text reads.
acceptance_criteria:
- id: A1
  text: A decision record identifies the caller and exact supported transport shape or records why metadata-only
    suffices. It identifies who makes the capability decision, with explicit outcomes for supported and
    unavailable routes.
- id: A2
  text: The design distinguishes transport base64 from model text, respects the same access/cache constraints,
    and identifies bounded replay/redaction cases and any live proof still needed before claiming support.
tests:
- command: cd runtime && uv run python ../scripts/check_tasks.py
  covers:
  - A1
  - A2
