schema_version: '1.0'
id: V405-001
title: Publish startup-owned cloud and local Runtime placement labels
milestone: runtime-placement-labels-2026-10
epic: execution-core
kind: feature
priority: P2
status: in_progress
depends_on: []
languages:
- go
- python
goal: An operator declares cloud or local location labels at Runtime startup; registration freezes them
  for that process incarnation and Operations exposes their actual values without RuntimeConfig bindings.
context:
  proposal: docs/proposals/0043-runtime-placement-labels.md
  specification:
  - docs/spec/execution/control-plane.md#CTL-R26
  - docs/spec/execution/control-plane.md#CTL-R75
  - docs/spec/execution/runtime-agent.md#RTA-R6
scope:
  in:
  - Shared placement grammar and bounds, Go and Python validation, startup CLI/environment and private
    registration schema.
  - Registration fingerprint and detached snapshots preserve immutable declarations across retries and
    reject same-instance changes.
  - Additive Operations projection, generated clients and Ansible startup arguments and operator documentation.
  - Owning specification requirements and shared grammar fixtures.
  out:
  - Run requirements and placement filtering (V405-002).
  - Audit propagation (V405-003), picker UI (V405-004), and end-to-end release gate (V405-005).
requirements:
- id: R1
  text: Only cloud and local roots; each slash-delimited segment matches [a-z][a-z0-9_-]*. At most 32
    unique labels, each at most 63 ASCII bytes including slashes. Successful wire and stored values are
    sorted. No wildcard or implicit namespace inference.
- id: R2
  text: All labels on one subject form a single ancestor chain; mixing cloud and local or disjoint provider/site
    branches is invalid. Empty declarations are allowed and imply no location. CLI order is normalized
    but duplicates are rejected.
- id: R3
  text: placementLabels is an optional non-null registration array; omission means no declared location.
    It participates in the immutable incarnation fingerprint and never changes durable RuntimeConfig principal
    labels.
failure_outcomes:
- operation: Placement declaration, selection or observation at the task boundary
  permanent: Malformed, oversized or inconsistent input is rejected before mutation using the existing
    invalid_request/400 or registration-conflict/409 classification; no retry.
  retryable: Reuse subsystem storage_transaction_conflict/503 and existing bounded registration, controller
    or capacity backoff; read failures never fabricate empty success.
  ambiguous: Reconcile registration by immutable instance fingerprint and keyed writes through existing
    request receipts; do not introduce another journal.
  cancelled: Existing request/controller owner joins in-flight work; no new background worker survives
    cancellation.
  timeout: Existing registration/request/controller budgets own calls; capacity waiting does not consume
    the execution budget before admission.
cardinality:
- collection: Placement declarations and launch requirements
  expected: 1 location path per instance or launch
  maximum: 32 labels of at most 63 ASCII bytes each
  bound: Canonical sorted unique arrays, one compatible ancestor chain; no fleet IDs copied into launch
    snapshots.
- collection: Runtime fleet and UI inventory
  expected: A few local and cloud instances
  maximum: Existing bounded registry capacity times the per-instance label bound
  bound: Reuse registry limits and public pagination; no unbounded history scan or external lookup per
    label.
lifecycle:
- entity: Placement labels on existing Runtime incarnations, Runs, Audits or allocations
  delete: Follow the owning existing entity deletion API and authorization.
  cascade: No new side-table lifecycle; parent deletion removes its embedded placement data.
  retention: Runtime declarations live with their incarnation; immutable requirements and allocation provenance
    live with their owning retained Run/Audit.
acceptance_criteria:
- id: A1
  given: Shared maximum-size, namespace, separator, duplicate, ordering and incompatible-chain cases
  when: Go and Python readers run
  then: Both enforce the same grammar and bounds; startup flags override the environment and registrations
    carry normalized declarations.
- id: A2
  given: A registered incarnation with cloud/aws
  when: It re-registers, changes its placement labels, or is replaced by a new authenticated incarnation
    after release
  then: Identical retries preserve labels, same-instance changes fail with the existing registration conflict,
    and the new instance publishes its own labels. Returned snapshots cannot mutate registry state.
- id: A3
  given: Operations observations and an Ansible inventory with per-host and per-instance placement labels
  when: Public projections and deployment resolution run
  then: Actual labels are visible and validated; deployed argv contains the intended startup labels without
    requiring RuntimeConfig bindings.
tests:
- command: go test ./internal/contracts/... ./internal/controlplane ./internal/httpapi/public ./internal/publicclient
  covers:
  - A1
  - A2
  - A3
- command: cd runtime && uv run pytest tests/test_settings.py tests/test_contracts.py tests/test_state.py
    tests/test_shared_placement_labels.py
  covers:
  - A1
  - A2
- command: make test-ansible
  covers:
  - A3
- command: make verify-public-api
  covers:
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
