schema_version: "1.0"
id: V64-004
title: Freeze bounded service and finding context for each priority cycle
milestone: audit-check-prioritization
priority: P1
status: pending
implementation_commit: null
depends_on: [V64-002]
languages: [go, json]
goal: >-
  Give each independent checklist verdict the same immutable optional context
  and exact candidate facts without accumulating prior verdict conversations.
context:
  authority: User requested optional service description and existing findings as context for independent checklist verdicts.
  design: docs/plans/2026-09-20-audit-check-prioritization.md
  specification: [docs/spec/34-audit-check-prioritization.md, docs/spec/19-audits.md]
  contract: V64-001 fixes bounds and source semantics; V64-002 supplies immutable cycle state and protected retention.
scope:
  in:
    - Resolve the declared optional service description and authorized finding inputs into a versioned cycle context using exact owner/project/source references.
    - Snapshot accepted findings, analyst dispositions/severity revisions and settled previous-pass results at the cycle boundary; preserve their distinct source meanings.
    - Give every request the same complete common context and exactly one pinned checklist statement/applicability/method/evidence package; no selective fact retrieval or sibling verdicts enter the prompt.
    - Freeze canonical context, candidate, prompt template and policy digests before calls; feed every candidate a fresh request without other candidates' verdicts or chat history.
    - Enforce 128 KiB canonical context artifact, 24 KiB common-context projection, 8 KiB service description, 100 combined finding/result entries and 48 KiB encoded per-item request limits without silent truncation or secret authorization/body fields.
    - Reject unavailable/foreign/oversized declared sources explicitly while permitting all optional context to be absent; overflow produces priority_context_limit_exceeded before model dispatch and absence alone does not lower priority.
    - Retain the exact model-visible snapshot and provenance under protected Audit storage and reuse it after allowed source Run deletion or Controller restart.
  out:
    - LLM summarization, growing conversational memory, automatic proposed-check insertion or materializing V62 generated OpenAPI inventory.
deliverables:
  - path: internal/auditpriority
    description: New typed frozen-context builder, canonicalization, finite-limit validation and per-candidate request facts.
  - path: internal/auditservice
    description: Authorized source resolution and analyst/settled-result revision pins at each cycle boundary.
  - path: internal/artifacts
    description: Protected context snapshots and exact evidence source references surviving allowed source deletion.
acceptance_criteria:
  - id: A1
    text: Description/findings may each be absent; identical pins produce identical context digests and requests contain only shared frozen context plus the current candidate.
  - id: A2
    text: Analyst edits and new findings during a cycle cannot change its context; the next cycle captures accepted revisions and settled results, while concurrent snapshot edits retry capture rather than mix revisions.
  - id: A3
    text: Foreign, missing, oversized and prohibited secret-bearing inputs follow explicit contract outcomes, and every emitted evidence reference resolves within the authorized pinned snapshot.
  - id: A4
    text: Restart and permitted source Run deletion preserve the exact prior snapshot and provenance while Audit deletion releases owned holds through existing fences.
tests:
  - command: go test -race ./internal/auditpriority ./internal/auditservice ./internal/artifacts
    covers: [A1, A2, A3, A4]
  - command: go test -tags=integration -count=1 ./internal/auditservice ./internal/auditstore ./internal/artifacts
    covers: [A2, A3, A4]
test_prerequisites:
  - The new internal/auditpriority package is a deliverable of this task; required retention and revision cases use disposable PostgreSQL.
verification_requirements:
  - Compare exact frozen request bytes/digests and source revisions across candidates, restarts and edits rather than checking only that a context object exists.
  - No real or paid model calls are needed to verify deterministic context construction.
