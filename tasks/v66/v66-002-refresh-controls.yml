- id: A1
  text: Replace page-level primary Refresh buttons with one secondary icon control in the page header,
    or remove them where live events and query refetch already keep the view current.
- id: A2
  text: Keep explicit refresh only for views without live updates (Performance, configuration catalogs)
    and label it uniformly.
- id: A3
  text: Preserve refetch behaviour and tests that rely on a refresh action by keeping an accessible name.
tests:
