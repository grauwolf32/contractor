schema_version: '1.0'
id: V466-003
title: Read internal Stage checkpoints in production Workflow process fixtures
milestone: artifact-release-cleanup-2026-11
epic: quality
kind: chore
introduced_by: V465-002
priority: P1
status: in_progress
depends_on:
- V465-002
languages: [go]
goal: Production Workflow process fixtures verify user-visible domain outputs and inspect workspace
  checkpoints through their retained exact Stage references, following the current Workflow contract.
context:
  authority: >-
    V465-002 records the user decision of 2026-11-09 to keep workspace checkpoints in technical Run
    artifacts while removing their promotion to shipped Workflow outputs. This task is an agent-proposed
    verification prerequisite discovered on 2026-11-10. User assignment 2026-11-10 approves the reviewed
    next-step plan: implement this migration, finish V466-001/002 and V417-003 acceptance, then continue
    isolated Audit compaction. Shared compaction remains the last V417 task.
  specification:
  - docs/spec/configuration/workflows.md#WFL-R69
  - docs/spec/configuration/workflows.md#WFL-R71
  - docs/spec/tools/workspace.md
  finding: >-
    tests/e2e/taint_annotations_test.go:496-520 requires workspace_state/workspace_diff in Run outputs
    and downloads their retired /outputs routes. After its Gateway oracle was corrected, the real Run
    succeeds and publishes taint_report, then this assertion stops the test before reuse and OTLP checks.
    Completed V465-002 intentionally retained Stage exports rather than those Workflow outputs.
  siblings: >-
    tests/e2e/project_workflows_test.go:295-333 and :376-415 also expect promoted checkpoint outputs and
    output-namespace inventory entries for shipped production Workflows. Inspect
    tests/e2e/git_artifacts_test.go:177-180 against its concrete selected Workflow before changing it.
    Explicit workspace-roundtrip fixtures that intentionally declare checkpoint outputs remain valid;
    frozen Eval catalogs retain their independent contract.
  decision: >-
    User approval 2026-11-10 selects the reviewed migration: correct all affected shipped-Workflow
    readers together, using ordinary exact Stage result and Artifact reads while preserving
    state/diff/source assertions. Do not restore retired Workflow outputs or weaken checkpoint
    verification merely to pass the gate.
scope:
  in:
  - Find production-checkpoint output assumptions and distinguish them from intentional custom outputs.
  - Use existing exact Stage result references and ordinary Run Artifact reads for state/diff inspection.
  - Preserve source edits, unchanged-file checks, reuse isolation, release fences and captured-evidence assertions.
  out:
  - Production Workflow output restoration, compatibility readers, current-binding fallback or new APIs/stores.
  - Changes to the workspace export protocol, model/tool behavior, frozen Evals or intentional roundtrip outputs.
  - Nuclei timeout classification and the separate Audit trace tool inventory.
acceptance_criteria:
- id: A1
  given: Shipped production Workflows with internal workspace checkpoints
  when: Taint and Project workspace process fixtures inspect their completed Runs
  then: Only declared domain results are required as Workflow outputs; exact Stage checkpoint revisions
    still prove the expected state, edits and diff through existing Artifact reads.
- id: A2
  given: Intentional custom checkpoint outputs, lifecycle fencing and replacement allocations
  when: Existing transport and reuse cases execute
  then: Their current contracts and assertions remain valid; no unverified current binding or retired
    output fallback can replace a missing exact Stage reference.
tests:
- command: go test -count=1 ./tests/e2e
  covers: [A1, A2]
- command: go test -tags=e2e -count=1 -timeout=12m -v ./tests/e2e -run '^(TestTaintAnnotationsAcrossRealRuntimeProcess|TestProjectWorkspaceLifecycleAcrossProductionProcesses)$'
  covers: [A1, A2]
- command: make lint
  covers: [A1, A2]
test_prerequisites:
- Use a single owned disposable PostgreSQL database and locked Runtime; exact selected cases must execute.
- Apply existing platform/optional-engine and heavy-I/O policies. Optional skips are not passing coverage.
- Run the concrete Git transport control if its assertions change; do not enable real-engine fixtures implicitly.
verification_results:
- The untagged e2e package passes. The real Project scenario passes both production Workflows,
  eight exact Stage checkpoint pairs, publication, lineage and Runtime release assertions.
- >-
  The combined process command fails in Taint after exact Stage downloads: V463-001 stripped
  the context-prefix spaces from five blank lines of its expected unified diff. Actual checkpoint
  bytes retain those required spaces. A separate fixture task will repair the expectation;
  this task remains in_progress until the complete declared command passes.
