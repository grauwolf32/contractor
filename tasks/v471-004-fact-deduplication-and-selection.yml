schema_version: "1.0"
id: V471-004
title: Deduplicate fact observations through Finding correlation and select exact grounds
milestone: project-facts-2026-11
epic: findings
kind: feature
priority: P1
status: pending
depends_on: [V471-001]
languages: [go, python, json, typescript, markdown]
goal: >-
  Equal qualified assertions share one Project Finding, repeated use of one
  exact material shares one displayed source group, and every producing attempt
  remains attributable. A hypothesis can explicitly select an exact ground.
demonstration: >-
  A failed extraction attempt has saved nginx for a qualified service/context.
  A new attempt reuses the exact snapshot and records the same normalized claim.
  The UI reader returns one Finding and one material group with two receipts.
  A third execution supplies a distinct source version with identical bytes and
  adds a second material group. Another environment/value stays distinct.
  Technology and its version use separate properties. A later generator selects
  one exact source into hypothesis.sources.
context:
  authority: >-
    User decisions 2026-11-20: facts need deduplication, clear relations and a
    separate interface over the same project-level Finding. Planning only.
    User follow-up 2026-11-20 prefers severity-filtered common Findings and
    informational exclusion from needs review. Remove the proposed purpose key
    component. Identity remains based on the qualified assertion and its context.
    User decision 2026-11-20 accepts exact qualified assertion deduplication,
    same-material grouping and retained per-attempt receipts. Task/hypothesis
    associations are optional. Reverse navigation is deferred. The accepted first
    slice uses deterministic qualified equality and defers semantic-match
    infrastructure. Update tasks/diagrams and merge the reviewed package into main.
  proposal: docs/proposals/0055-project-facts-through-findings.md
  specification:
    - docs/spec/findings/findings.md#FND-R211
    - docs/spec/findings/findings.md#FND-R174
    - docs/spec/findings/findings.md#FND-R177
    - docs/spec/findings/findings.md#FND-R228
    - docs/spec/audits/hypotheses.md#HG-R6
    - docs/spec/artifacts/artifact-store.md#ART-R143
  boundary: >-
    Existing Finding owner owns qualified assertion identity, its fence and paged
    source grouping. Receipts retain individual submissions. ArtifactStore owns
    exact material identity, lineage and selection. Grouping is a reader projection
    over retained versions and receipts. Any necessary index has the concrete
    source reader as a production caller in this task. The versioned key applies
    to a qualified assertion from either Finding facade.
scope:
  in:
    - Reuse exact receipt replay and existing canonical Finding correlation for informational observations from either facade.
    - Define one versioned qualified assertion key with shared fixtures and a first real technology-observation caller.
    - Group cited materials by their exact Artifact version and verified fork lineage while retaining per-receipt citations and attempt history.
    - Extend existing Finding selection to expose exact fact snapshots and preserve individual source selection for hypothesis grounds.
    - Retain original receipts, evidence, origin, incompatible contexts and changed versions.
  out:
    - Semantic-match model calls, similarity candidate retrieval, embeddings infrastructure and whole-Project pairwise comparison.
    - A distinct Fact registry, evidence-independence scores or replacing submission receipts with material identities.
    - Treating same severity/text as identity or granting proof/dispatch authority through a fact-to-hypothesis link.
    - New Fact IDs, arbitrary edges, reverse fact-to-hypothesis navigation or a new duplicate approval lifecycle.
requirements:
  - id: R1
    text: >-
      Replay of the same admitted tool call returns its existing receipt. A new
      invocation or allocation retains its own receipt and origin. Equal qualified
      assertions resolve atomically to one Finding under the existing Project
      fence, including concurrent writers. A receipt count describes submissions.
      The displayed materials count describes distinct exact versions. Neither
      count claims independent corroboration. Existing receipt quotas and cleanup
      apply even when many submissions share one material.
  - id: R2
    text: >-
      The versioned key includes Project scope, authoritative subject, property,
      normalized value and the necessary known environment/baseline/conditions.
      The model supplies bounded components and exact citations through the common
      submission. Runtime assembles them and Server validates authority, normalizes
      supported values and computes the key. Never accept a model-authored key as
      trusted equality. Define the first supported technology/property vocabulary
      and normalization in the owning spec with shared fixtures. Represent nginx
      and version 1.25 as web_server=nginx and web_server_version=1.25.
      Title wording, severity, facade, Run, Task and hypothesis IDs do not enter
      assertion identity. Missing essential context or unsupported structured
      claims have an unavailable key and remain separate with a visible reason.
      A false property value or different scope/conditions cannot collapse into
      a positive or unconditional assertion. Unknown context is not a shared key.
      Structured components and citation metadata fit the existing V471-001
      authored-payload/source ceilings and the shared subject-field limits.
  - id: R3
    text: >-
      Within a Finding, group evidence by exact material version using trusted
      Artifact metadata and verified fork lineage. A new binding of that version
      belongs to the same group. Different original versions with identical bytes
      remain distinct. Different citations inside one material stay attributable
      to their receipts and locators. Group pages and per-group receipt pages use
      existing owner authorization, revision fencing and bounded keysets. Reading
      a page cannot scan an entire source fanout to compute unique counts. Metadata
      groups acquire no separate retention holds or lifecycle. Raw source receipts
      remain reachable through existing history/selection readers.
  - id: R4
    text: >-
      Hypothesis grounds pin exact selected artifacts or collection entries through
      current readers. Selecting a collection does not imply every member is a
      ground; later revisions and new evidence do not rewrite existing sources.
failure_outcomes:
  - operation: Correlate a qualified assertion, page exact material groups and select grounds
    permanent: Invalid or foreign components/selection and stale revision fail with the owning classified error. Valid unqualified claims are saved separately with an unavailable-key reason.
    retryable: Existing bounded database retry and storage_transaction_conflict 503 under the original deadline.
    ambiguous: Reconcile the existing receipt or selection identity on same-call replay. New attempts retain their own receipts and use qualified correlation and exact-version grouping.
    cancelled: Join owner work and prohibit writes after existing execution/deletion fences.
    timeout: Existing call and Stage deadlines apply with finite indexed reads and no background Project rescan.
cardinality:
  - collection: Project Findings, exact material groups, receipt history and selections
    expected: Thousands of records, one list page and one selected material group.
    maximum: Fifty summary rows, at most 64 material groups or receipt rows per page, existing 32-material input ceiling and shared response byte limits.
    bound: Indexed bounded reads and payload hydration for explicit selections. Test 10000 records and source-heavy groups with 10000 receipts across multiple Runs within existing per-Run quotas, over one version and over distinct versions. Scope all grouping by Project/Finding and avoid whole-fanout aggregation per page.
lifecycle:
  - entity: Existing canonical Finding, submission receipts, grouped exact materials and selection snapshots
    delete: Finding/Project ownership and exact Artifact lifecycle remain authoritative.
    cascade: Deleting one source owner does not change surviving canonical identity or remove retained evidence and hypothesis grounds.
    retention: Existing Project material bindings retain exact versions and receipt history. Grouping adds no new holds. Project purge removes receipts and retained materials through their ordinary owners.
acceptance_criteria:
  - id: A1
    given: Same-call replay, new attempt receipts for equal qualified assertions, reused exact material and independently written byte-identical material
    when: They are admitted concurrently through real PostgreSQL
    then: Replay adds no receipt, new attempts retain their receipts, one Finding represents the qualified assertion, reused/forked versions share a material group and independent equal-byte versions form separate groups.
  - id: A2
    given: Missing identity context, another environment, an explicit version refinement, conflicting values and a severity-only change
    when: Qualification and correlation run for both facades
    then: Unqualified cases remain separate with visible reasons, environment/value/condition changes stay distinct, technology and version form separate properties, and title/severity/Task/hypothesis changes preserve the same qualified identity.
  - id: A3
    given: A selected fact among many collection entries and a later changed source
    when: A generator accepts a grounded hypothesis and its source is read again
    then: The exact selected member and conditions remain attributable, without whole-collection attribution or latest substitution.
  - id: A4
    given: Ten thousand retained receipts distributed over reused and distinct versions with concurrent writes and subsequent source deletion
    when: The common reader traverses material groups and receipt history and the Project is purged
    then: Pages remain bounded and complete, grouping uses verified version identity, source Run deletion preserves Project materials, and Project purge releases owned data without group-specific holds.
tests:
  - command: go test ./internal/findingintake/... ./internal/auditdomain/... ./internal/auditservice/... ./internal/artifacts/...
    covers: [A1, A2, A3, A4]
  - command: make test-project-facts-e2e
    covers: [A1, A2, A3, A4]
  - command: make test-wire-cross-language
    covers: [A1, A2, A3]
  - command: make verify-public-api
    covers: [A1, A2, A3]
  - command: make test-runtime
    covers: [A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
test_prerequisites:
  - Test concurrent correlation, pagination and retention against real PostgreSQL; skipped required cases are not passes.
  - Shared fixtures exercise positive, negative, conditional and unqualified assertions, title/severity changes and exact-fork versus equal-byte independent versions.
