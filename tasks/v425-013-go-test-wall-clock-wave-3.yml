schema_version: '1.0'
id: V425-013
title: Replace the remaining wall-clock waits in Go PostgreSQL tests and restore the listener budget coverage
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V371-021
priority: P3
status: pending
depends_on: []
languages:
- go
goal: The listed Go PostgreSQL tests detect their regressions through events, injected clocks or database
  clocks instead of multi-second sleeps and deadlines, and the listener test again exercises short server-side
  timeouts.
context:
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  finding: 'Left after V371-021 and V372-016: internal/scheduler/planner_reentry_postgres_test.go:44,84
    (5 s) and terminal_release_pacing_postgres_test.go:310,427,437 (10 s) wait on fixed durations; TestPostgresCancellationCleanupRetainsRunClaim
    only notices a stopped renewal at its 45 s deadline; TestPostgresMigrationLeaderWaitOutlivesDDLLockTimeout
    (25 s outer budget), TestPostgresOpenPoolDefaults (10 s) and newCollectingAuditFixture (45 s) keep
    wall-clock budgets; evalstore and evalservice duplicate their test pool helpers. V371-021 made the
    listener test open its pool with default budgets, so short statement_timeout and idle_in_transaction_session_timeout
    on a listener connection are no longer tested.'
  siblings: Search internal/ and tests/ for time.Sleep and literal time.Second deadlines in *_postgres_test.go.
scope:
  in:
  - Event- or clock-driven waits for each listed test; one shared test pool helper for evalstore and evalservice
    in a *test package.
  - A listener test pool with short server-side budgets and generous client budgets, proving the listener
    survives them.
  out:
  - Production behaviour.
acceptance_criteria:
- id: A1
  text: Each listed test detects its regression without waiting for a multi-second deadline.
- id: A2
  text: The listener test fails if the listener connection inherits a short server-side timeout that would
    cancel the LISTEN wait.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/scheduler/... ./internal/persistence/...
    ./internal/evalstore/... ./internal/evalservice/... ./internal/auditcontroller/...
  covers:
  - A1
  - A2
- command: make lint
  covers:
  - A1
