schema_version: '1.0'
id: V425-013
title: Replace the remaining wall-clock waits in Go PostgreSQL tests and restore the listener budget coverage
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
introduced_by: V371-021
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: The listed Go PostgreSQL tests detect their regressions through events, injected clocks or database
  clocks instead of multi-second sleeps and deadlines, and the listener test again exercises short server-side
  timeouts.
context:
  authority: >-
    User decision 2026-10-31: implement shared PostgreSQL test setup as V425-027.
    EvalStore/EvalService pool consolidation moves to that task; this task retains
    its wall-clock and listener-budget acceptance criteria.
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  finding: 'Left after V371-021 and V372-016: internal/scheduler/planner_reentry_postgres_test.go:44,84
    (5 s) and terminal_release_pacing_postgres_test.go:310,427,437 (10 s) wait on fixed durations; TestPostgresCancellationCleanupRetainsRunClaim
    only notices a stopped renewal at its 45 s deadline; TestPostgresMigrationLeaderWaitOutlivesDDLLockTimeout
    (25 s outer budget), TestPostgresOpenPoolDefaults (10 s) and newCollectingAuditFixture (45 s) keep
    wall-clock budgets; evalstore and evalservice duplicate their test pool helpers. V371-021 made the
    listener test open its pool with default budgets, so short statement_timeout and idle_in_transaction_session_timeout
    on a listener connection are no longer tested.'
  implementation_decision: >-
    2026-10-31 agent implementation choice: retain only the shared go-test
    watchdog for unexpected hangs; event assertions and controlled clock/DB
    state drive the listed scenarios. Use a deterministic synctest preflight
    for cancellation renewal lifetime before its real-store lease proof, and
    monitor outcome events before asserting failed release gates are gone.
    A failed attempt is acknowledged before firing the next poll, so the
    test cannot race the monitor's in-flight accounting.
    Migration leader progress is observed through PostgreSQL query_start with
    a short DDL lock budget, replacing the fixed 11-second pause. LISTEN uses
    a pool with short server timeouts and generous clients; its tracer verifies
    settings on the actual subscription connection, preserves the ordinary
    acquire/query hooks, and proves the operation context has ended before
    subscription delivery continues. A separate notifier keeps ordinary
    budgets and each test has a unique notification identity.
    Corrected source locations: the listener test belongs to runstore and
    newCollectingAuditFixture belongs to auditstore/internal/pgstore, so both
    package suites are included below. No production behavior or test-only
    production hook is added.
  siblings: >-
    Search of internal/ and tests/ distinguishes the named remaining wave
    cases from other integration watchdogs. Server timeout enforcement tests
    intentionally exercise real PostgreSQL budgets; their SQLSTATE and
    cancellation assertions remain. The shared manual-poll helper also keeps
    its caller deadline entry point, so these tests arm it through t.Context
    rather than its separate ten-second convenience watchdog.
scope:
  in:
  - Event- or clock-driven waits for each listed test. Shared EvalStore/EvalService pool setup is owned by V425-027.
  - A listener test pool with short server-side budgets and generous client budgets, proving the listener
    survives them.
  out:
  - Production behaviour.
acceptance_criteria:
- id: A1
  text: Each listed test detects its regression without waiting for a multi-second deadline.
- id: A2
  text: The listener test fails if the listener connection inherits a short server-side timeout that would
    cancel the LISTEN wait.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -p 2 -tags=integration -count=1 ./internal/scheduler/... ./internal/persistence/...
    ./internal/evalstore/... ./internal/evalservice/... ./internal/auditcontroller/... ./internal/auditstore/... ./internal/runstore/...
  covers:
  - A1
  - A2
- command: make lint
  covers:
  - A1
