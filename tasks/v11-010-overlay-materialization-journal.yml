schema_version: "1.0"
id: V11-010
title: Implement crash-safe overlay-local materialization journal
milestone: runtime-filesystems-materialization-and-hardening
priority: P1
status: planned
implementation_commit: null
depends_on: [V11-009]
languages: [python]

goal: >-
  Allow an explicitly authorized Worker to materialize one overlay-local upper
  into its rooted host project with stale-base detection, deterministic rollback
  and a durable Runtime-local recovery journal.

context:
  authority: >-
    Host materialization exists only when trusted startup config has
    mode=overlay-local and hostWrite=true and AgentTemplate explicitly selects
    materialize_changes. Labels, Workflow/Stage data, skills and tool arguments
    cannot grant it. Runtime owns all implementation; nothing is persisted or
    executed by Server.
  consistency: >-
    The first pending mutation of each affected path captures lower type plus
    SHA-256 bytes, or absent. One materialize call locks the WorkspaceSession,
    rechecks affected paths and relevant parents, and returns
    workspace_base_conflict with zero host writes on mismatch. A host tree
    commit is not globally atomic, so a durable staged backup/journal provides
    rollback and restart recovery.
  journal: >-
    Store journals below a dedicated projectfs subdirectory of Runtime
    work_root, never inside a project. Bind to config/mount digest; record only
    normalized virtual operations, fingerprints, staged hashes, phases and
    backed-up regular bytes/entry types needed to restore. Use bounded count and
    bytes, restrictive permissions, fsync ordering and an explicit versioned
    state machine. One call permits at most 10000 affected paths, 16 MiB per
    backed-up lower file, 64 MiB staged replacement bytes, 128 MiB total backup,
    8 MiB encoded metadata and 60 seconds inside the outer Stage deadline.
    Never store credentials or host paths in remote diagnostics.

scope:
  in:
    - Capture immutable base fingerprints lazily on first overlay mutation and retain them through further edits/rollback as required by the remaining change set.
    - Build a complete materialization plan and enforce the exact 10000-path, 16-MiB/file, 64-MiB staged, 128-MiB backup, 8-MiB metadata and 60-second bounds before creating a journal or touching the lower.
    - Revalidate path confinement, no-follow entry types, base fingerprints and relevant parents in one preflight with no writes.
    - Stage replacement files and backups under work_root; durably write state transitions prepared, applying, rollback, committed using atomic journal-file replacement.
    - Apply deterministic operations descriptor-relatively: create dirs shallow-first, replace files atomically, delete paths deepest-first, and flush files/parents.
    - On ordinary apply error, roll back all applied operations from backups and verify restored fingerprints before returning workspace_materialize_failed.
    - Mark committed only after durable lower state, then atomically clear upper/set new baseline and delete staging; a repeated call after lost response is a successful no-op.
    - Advertise materialize_changes for eligible overlay-local only after startup recovery/probe succeeds; incompatible mounts remain unsupported.
    - Add phase/failure metrics containing mount name, counts, bytes, duration and stable code but no journal path, lower hash or file content.
  out:
    - Distributed locking, multiple writable Runtime owners, general multi-file atomicity, Server persistence, automatic materialization or recovery across changed config roots.

deliverables:
  - {path: runtime/src/contractor_runtime/projectfs/materialize.py, description: Fingerprint planner durable journal apply rollback and idempotent commit.}
  - {path: runtime/src/contractor_runtime/projectfs/provider.py, description: Journal root ownership recovery gate and eligible capability probe.}
  - {path: runtime/tests/test_workspace_materialize.py, description: Conflict ordering rollback durability bounds and response-loss tests.}

requirements:
  - id: R1
    text: No host path is modified until the complete plan, quota, confinement and fingerprint preflight succeeds.
  - id: R2
    text: Every journal transition is restart-decidable; no state requires guessing whether a lower mutation occurred.
  - id: R3
    text: An ordinary failure either restores the exact pre-call lower or retains a recovery-required journal and fences Runtime reuse.
  - id: R4
    text: Successful materialization preserves the effective view, clears pending changes and survives allocation release and Run cancellation by design.

acceptance_criteria:
  - id: A1
    given: External add/edit/delete/type/parent changes after overlay base capture.
    when: Materialization preflight runs.
    then: Every relevant stale case returns workspace_base_conflict, performs no lower write and keeps upper changes intact.
  - id: A2
    given: Failures injected after each journal transition and each applied create/replace/delete.
    when: The in-process rollback path runs.
    then: It restores exact original host bytes/types or retains a valid recovery-required journal, never reports false success and never escapes the root.
  - id: A3
    given: A successful commit whose response is discarded.
    when: materialize_changes is called again in the same session.
    then: It returns a successful no-op, host state is unchanged and no pending upper/journal remains.

tests:
  - {name: materialization, command: "cd runtime && uv run pytest tests/test_workspace_materialize.py", covers: [A1, A2, A3]}
  - {name: materialization-lint, command: "cd runtime && uv run ruff check src tests", covers: [A1, A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
