goal: Use the same task/Run/result path for checklist seeds and manual hypotheses, with stable identity,
  automatic exact association, optional problem findings and honest fixed coverage.
demonstration: A checklist creates hypotheses without model calls; checks retain supported/refuted/inconclusive
  results with system-filled context, only evidenced problems emit findings, and an incidental discovery
  may lack a hypothesis.
context:
  authority: 'User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request.'
  implementation_gate: Task formation only, requested on 2026-10-31 after acceptance of the common execution
    skeleton. Keep pending until implementation is requested and dependencies are complete. Do not start
    code, migrations, live Runs or deployment in this planning turn. Resolve the explicitly labelled remaining
    contract proposals in V64-001 before dependent implementation.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/findings/findings.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  agent_proposal: 'For review: checklist/manual hypotheses state one observable claim under explicit conditions.
    A suspected violation is the recommended AppSec search formulation, without forbidding positive properties
    or requiring a formal claim/polarity classifier.'
  contract_review_followup: User-requested implementation review on 2026-11-01 found a V64-001 contract
    defect. V64-022 supplies this consumer's corrected boundary before implementation; the accepted Audit
    skeleton and this task's remaining scope are unchanged.
scope:
  in:
  - Create the Audit-owned hypothesis registry and real seed/manual write/read callers, with stable opaque
    ID/revisions independent of owner and immutable source provenance.
  - Extend actual task selection/creation, ordinary result assembly and optional finding intake with trusted
    exact per-item hypothesis context. Users/models provide no persisted hypothesis ID/revision pair in
    output.
  - Implement simple deterministic task ordering using explicit human attention, source order, prerequisites,
    existing accepted results and remaining budget; reuse the common coordinator.
  - Preserve checklist source/version/sufficiency and its fixed coverage denominator. Splits, exclusions,
    missing evidence, applicability and generated work do not silently change that denominator.
  - Keep scoped support/refutation/conflicts in ordinary immutable check outputs and hypothesis history.
    Use optional findings only for evidenced problems; no independent hypothesis queue, assessment lifecycle
    or result service.
  - On Project finding publication, retain the exact source hypothesis revision as ordinary Project-owned
    evidence. Audit purge may remove its live registry but preserves ID/revision and readable assertion
    in finding provenance; no second live registry is created.
  out:
  - A Project hypothesis registry now, learned priority scores, incremental frontier propagation, attack-tree
    execution or a separate checklist scheduler.
  - Implementation during this planning-only update; changing user model configuration or deploying/migrating
    the demo.
requirements:
- id: R1
  text: Task acceptance pins the exact revision. Source edits and retries cannot rebind existing checks
    to latest.
- id: R2
  text: A batched Run uses trusted item membership. A conclusion is not attached to all Run hypotheses;
    exploratory findings can remain without a hypothesis even in a checking Run.
- id: R3
  text: Edits create an immutable new version; a new research direction may be a new hypothesis. Never
    rebind accepted evidence/results to changed bytes. Future ownership changes preserve IDs/references;
    no model-based semantic-equivalence gate or automatic successor graph is required.
- id: R4
  text: Generated and human origins cannot be spoofed; requested attention does not establish truth or
    override scope/budgets. Not reproducing an existential bug claim in an insufficient sample remains
    inconclusive, not a global refutation. Positive and negative results retain their tested conditions.
failure_outcomes:
- operation: Admit hypotheses and select exact hypothesis-bound tasks
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Admit hypotheses and select exact hypothesis-bound tasks
  expected: 'Base fixture: 2 fixed assertions and 1 manual hypothesis; scale fixture with at least 1,000
    records and sparse ready work.'
  maximum: Proposed hypothesis contract bounds are fixed by V64-001 in LIM/shared fixtures; current task/iteration/batch
    ceilings remain authoritative.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: fixed checklist and manual hypotheses
  when: seeds are admitted and tasks run without a generator/ranker
  then: source membership and exact hypothesis links appear automatically in results and coverage
- id: A2
  given: a source revision changes after acceptance, retries and several batched hypotheses
  when: results are published
  then: original per-item pins survive; forged/foreign associations and accidental fanout fail
- id: A3
  given: bug claims and positive-property claims, insufficient negative probes, split checklist entries
    and incidental discoveries
  when: checks publish results and progress/report views are read
  then: all verdicts and gaps remain in history with the original coverage denominator; only evidenced
    problems emit findings, and verdict polarity alone is insufficient
- id: A4
  given: large settled history and a small ready set
  when: simple selection and pages are read
  then: indexed bounded work is demonstrated without frontier/dirty-state machinery
- id: A5
  given: a Project finding from an Audit-owned hypothesis
  when: the source Audit is purged
  then: the Project finding still exposes original hypothesis ID/revision and the exact retained assertion/evidence
    without a dangling-only reference or fabricated replacement
