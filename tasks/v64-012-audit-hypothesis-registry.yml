    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  agent_proposal: 'For review: checklist/manual hypotheses state one observable claim under explicit conditions.
    A suspected violation is the recommended AppSec search formulation, without forbidding positive properties
    or requiring a formal claim/polarity classifier.'
  contract_review_followup: User-requested implementation review on 2026-11-01 found a V64-001 contract
    defect. V64-022 supplies this consumer's corrected boundary before implementation; the accepted Audit
    skeleton and this task's remaining scope are unchanged.
  shipped_yaml:
    restoration_authority: >-
      User decision 2026-11-02 during V64-002 implementation permits temporarily removing these
      eight old-format profiles when the shared loader/executor switches. Restore the scenarios
      in the common format together with this task's hypothesis/result behavior, not an old reader.
      Restore the assertion-specific execution Eval tests removed from
      tests/eval/audit_programs during the cutover together with the corresponding real common
      callers. Restore checklist and standard-to-task mapping checks through that common path;
      V64-027 removes the old inventory-wrapper tests with their uncalled builders. Static
      standard-package, source/license and shared parser checks remain. Restore the CLI standard-selection
      validation cases from internal/app/config_command_test.go when a common selection caller ships;
      the bundled-standard validity checks remain active. Integration note 2026-11-03 (agent):
      during the requested main rebase,
      the old inventory-backed checklist composer/state, authoring fixtures and exclusive scope
      tests are also retired. Restore their applicable checks and UI through common hypothesis-bound
      callers; do not restore BuildChecklistInventory or an alternate reader. Restore the fixed-name Start UI
      suggestions only when the rewritten profiles ship. Their previous tests and YAML are retained
      in Git at 9b4ba9c8b1901c5c7eeb301015ad7e61cd94066d.
    boundary: Rewrite fixed checklist/standard assertions as common hypothesis-bound work without a
      model-generated seed step. Update the related Workflow, template, instruction, completion/context
      bindings and fixtures needed by the real callers. Preserve source standards, applicability,
      sufficiency and coverage; generation remains optional V64-013 work.
    profiles:
