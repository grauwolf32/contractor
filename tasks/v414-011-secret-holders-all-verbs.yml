schema_version: "1.0"
id: V414-011
title: "Redact every Go secret holder for every fmt verb, slog and unexported-field nesting"
milestone: review-v407-v409-followups-2026-10
epic: operations
kind: defect
introduced_by: MVP-002
priority: P1
status: pending
depends_on: []
languages: [go]
goal: >-
  No Go value that holds a secret prints, logs or encodes plaintext, whatever the fmt verb, the
  flags, the nesting (struct, map, slice, pointer, unexported field) or the encoder (fmt, log/slog,
  encoding/json), and a guard test stops a new holder from skipping the rule.
context:
  review: >-
    tasks/done/v407-018-credential-delete-lock-scope.yml and
    tasks/done/v407-019-credential-recovery-fence-and-classifier.yml (follow-up found while
    reviewing the credential work; not recorded in either record). The scheduler's prepared-secret
    cache already redacts itself for every verb (V407-015, a525cf29); its siblings were not fixed.
  specification:
    - docs/spec/platform/security.md#SEC-R88
    - docs/spec/platform/security.md#SEC-R31
  severity: high
  finding: >-
    internal/contracts/common.go:221-246 gives SecretString only String, GoString and MarshalJSON.
    fmt calls String only for the verbs v, s, q, x and X; for every other verb it prints the
    struct field. A probe (zz test in internal/contracts, run with -vet=off and then deleted) on
    NewSecretString("hunter2-plaintext") printed "{%!d(string=hunter2-plaintext)}" for %d, and the
    same plaintext for %t %o %c %U %b %e %f, directly and inside a struct, a pointer to a struct, a
    map and a slice, and through fmt.Errorf("x: %w %d"). %v %+v %#v %s %q %x %X, padded widths,
    fmt.Sprint/Sprintln, slog JSON and text handlers and encoding/json were redacted.
    A second probe showed that fmt cannot call String through an unexported field at all: a struct
    with an unexported SecretString field and an unexported []string printed
    "{{hunter2-x} [hunter2-y]}" for %v, "&{token:{value:hunter2-x} plain:[hunter2-y]}" for %+v,
    and the same through slog's text handler. A Format method on the leaf type therefore cannot fix
    holders that keep a secret in an unexported field; each such holder must redact itself as a
    whole, as internal/scheduler/report_secrets.go:45-81 already does. No production call site
    that formats a holder this way was found (grep for %+v, %#v and non-string verbs on secret
    values), so the leak is latent; a future log or error line would expose plaintext.
  siblings: >-
    Every Go secret holder, probed the same way (all in scope):
    internal/credentials/types.go:48-61 Token (%d %t %o print the token);
    internal/credentials/runtime_types.go:57-60,149-157 RuntimeCredentialMaterial (%d and %o print
    the canonical JSON bytes, e.g. {"token":"..."}, as numbers);
    internal/credentials/crypto.go:17-22,164-165 *TokenCipher (%d prints the derived runtime MAC
    key bytes; %t prints the AES-GCM key schedule whose first words are the master key bytes,
    858927408 = "0123" in the probe);
    internal/credentials/runtime_types.go:203-224 RuntimeCredentialRecord and
    RuntimeCredentialCreation (request MAC, idempotency digest; same mechanism);
    internal/credentials/litellm/bindings.go:28-53 adminKey, exactBinding (no methods; %v printed
    "{ {hunter2-admin}}") and *AdminBindings (%d printed the admin key);
    internal/credentials/litellm/manager.go:57-69 *Manager (%t printed the admin key through its
    bindings);
    internal/auth/session.go:43-105 Session (CSRFToken printed by %d), Login (CookieValue printed
    by %d), *Service (stored CSRF tokens in its sessions map), SessionHandle (digest bytes);
    internal/auth/bootstrap.go:12-23 Bootstrap (password hash; same mechanism);
    unexported-field holders that print plaintext even for %v: internal/app/config_inputs.go:34,42,43
    (configInputs.publicBearerToken, developmentWorkerToken, developmentPlannerToken),
    internal/telemetry/planner_otlp.go:95-112 (otlpHTTPPlannerTelemetry.headers
    map[string]SecretString and secretValues []string);
    plain-string secrets with no redaction: internal/app/app.go:36 Config.DatabaseURL (may carry a
    password).
    Exported SecretString fields (runtimesettings BasicAuth, scanplan.Options.Authentication,
    planner types Token, app.Config tokens) are covered once SecretString redacts for every verb.
    Already correct: internal/scheduler/report_secrets.go preparedSecretEntry and
    preparedSecretCache (Format, GoString, MarshalJSON, LogValue).
    Ruled out: Runtime Python. pydantic SecretStr masks str and repr, and a format spec or %d/%x
    raises TypeError instead of printing plaintext (checked with the pinned pydantic); no Runtime
    class defines its own secret __repr__ or __format__.
  provenance: >-
    git blame on internal/contracts/common.go:221-246: the type and its String/GoString methods
    come from e5dee8f0 (feat: define cross-language runtime contracts), the implementation_commit
    of MVP-002. 068b841f (V368-021) later fixed MarshalJSON but did not add Format, and a525cf29
    (V407-015) fixed only the scheduler cache. The other holders followed the String/GoString-only
    pattern MVP-002 set.
scope:
  in:
    - "Give SecretString, credentials.Token, RuntimeCredentialMaterial and litellm.adminKey a
      Format method that writes only the redaction marker for every verb and flag, and a LogValue
      method, keeping String, GoString and the existing MarshalJSON outcomes."
    - "Make every holder that keeps a secret in an unexported field (directly or through a nested
      type) redact itself as a whole for fmt, slog and encoding/json, following
      preparedSecretEntry: TokenCipher, AdminBindings, exactBinding, Manager, auth Session, Login,
      Service, SessionHandle, Bootstrap, RuntimeCredentialRecord, RuntimeCredentialCreation,
      configInputs and otlpHTTPPlannerTelemetry."
    - "Decide app.Config.DatabaseURL: hold it as SecretString or give Config a whole-value
      redacting Format; record the choice in SEC-R88."
    - "A guard test that enumerates Go struct types (source or go/types scan) and fails when a type
      reaches a secret leaf type, or a field named like a secret holding a plain string, through an
      unexported field without implementing fmt.Formatter; it lists the holders above and fails on
      a new one."
    - "Extend SEC-R88 to say every verb, slog and unexported nesting are covered and that holders
      redact as a whole."
  out:
    - "Changing which values are secret, the redaction marker text, Reveal call sites or the
      private-wire RevealJSON encoders."
    - "Runtime Python secret holders (ruled out above)."
    - "Telemetry text matching of secrets (V414-023)."
acceptance_criteria:
  - id: A1
    given: "Each secret leaf type holding a known plaintext"
    when: "it is formatted with every fmt verb (v + # s q x X d t o O c U b e E f F g G p) with and
      without width and flags, directly, through a pointer, inside an exported struct field, a
      map value and key, a slice, and through fmt.Errorf, slog JSON and text handlers and
      encoding/json"
    then: "no output contains the plaintext or its decimal, octal or hex encoding"
  - id: A2
    given: "Each listed holder with a secret in an unexported field"
    when: "it is formatted with %v, %+v, %#v and %d, logged through slog and JSON-encoded"
    then: "only the holder's redacted form appears; existing redaction tests still pass"
  - id: A3
    given: "A new test-only struct with an unexported SecretString field and no Format method"
    when: "the guard test runs over a fixture package containing it"
    then: "the guard fails and names the type; over the production tree it passes"
  - id: A4
    given: "The unfixed code at 19f7477f"
    when: "the regression tests from A1 and A2 run"
    then: "they fail on SecretString %d, on exactBinding %v and on configInputs %v"
tests:
  - command: "go test -count=1 ./internal/contracts/... ./internal/credentials/... ./internal/auth/...
      ./internal/app/... ./internal/telemetry/... ./internal/scheduler/... ./internal/archtest/..."
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3]
