test_prerequisites:
- These are future implementation acceptance commands, not verification performed while creating tasks.
  Implement every explicitly named new gate in its owning task; zero selected or skipped mandatory cases
  fail.
- Use locked Runtime dependencies, testdata catalogs and pseudo-Skills. Unit and integration tests never
  read the live configs tree; make test-config validates the shipped catalog.
- Persistence and immutable snapshot reads use disposable real PostgreSQL. Set CONTRACTOR_TEST_DATABASE_URL
  for required gates; an unreachable configured database or skipped required case is a failure.
- Run full suites for every touched package in addition to focused gates. Use injected clocks and deterministic
  work counters for assertions, not wall-clock thresholds.
- Run integration acceptance on the exact ADK 2.13.0 closure accepted by V418-007; record Runtime revision
  and lock digest. No separate old-SDK compaction implementation or version-switching production path.
- Follow the current Linux/platform and disk-heavy test policies (V433-007 and AGENTS.md). Do not enable
  CONTRACTOR_TEST_HEAVY_IO implicitly or count declared optional skips as passing coverage. Record exact
  revision, executed cases and exclusions; this backlog review ran no feature acceptance suites.
