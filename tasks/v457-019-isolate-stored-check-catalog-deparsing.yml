schema_version: "1.0"
id: V457-019
title: "Filter owned CHECK constraints before deparsing stored-size definitions"
milestone: review-v407-v409-followups-2026-10
epic: quality
kind: chore
introduced_by: V414-007
priority: P2
status: in_progress
depends_on: []
languages: [go]
goal: "The exact stored-size registry gate inspects only its migrated schema and survives other test schemas being dropped concurrently."
context:
  authority: "User request 2026-11-07 authorizes release review fixes; the coordinating agent assigned this repeated full-Go verification failure."
  specification: [docs/spec/platform/persistence.md#PER-R44, docs/testing/README.md]
  finding: >-
    internal/persistence/postgres/stored_size_checks_postgres_test.go:45 places
    pg_get_constraintdef(oid) in the same WHERE list as the namespace filter.
    PostgreSQL may evaluate that function before the schema condition, opening
    relations from concurrent foreign test schemas. The full Go run failed at
    line 59 with could not open relation with OID 10607426 (SQLSTATE XX000).
    tasks/done/v434-001-integrate-audit-artifacts.yml records the same prior
    concurrent catalog-reflection failure. V414-007 introduced this query in
    cba40ecadbbad8c74175d33d59f6db84d7b4f86a.
  decision: >-
    Materialize only the current schema's CHECK OIDs/names before invoking the
    deparser, preserving the exact discovered set and all registry comparisons.
    Prove evaluation ordering with an owned-schema low-cost shadow deparser
    that rejects foreign constraint OIDs and delegates owned OIDs to pg_catalog.
    This tests the boundary deterministically without timing concurrent DROP.
  siblings: >-
    The remaining constraint/index/default/trigger deparsers in runstore,
    statesettest, persistence/postgres, explaintest and evalstore occur in SELECT
    projections after their owned schema or exact-regclass qualification.
    foreignKeyProbeIndexesSQL also deparses inside a predicate, but its shared
    owned-FK CTE is materialized and the relation identity is bound by the join
    before the correlated partial-index predicate. A second cheap shadow
    pg_get_expr guard and owned/foreign partial-index fixtures confirm that
    existing query accepts exactly the owned FK's covering index without
    deparsing any foreign relation; EXPLAIN shows the owned hash join before
    the deparser join filter. No sibling source changes are needed.
scope:
  in:
    - "A test-only materialized owned-constraint query boundary and its real PostgreSQL negative control/EXPLAIN evidence."
    - "Review sibling catalog introspection deparsers for the same unguarded WHERE evaluation pattern and record the applicable evidence."
    - "Preserve exact registry drift checks and test-schema cleanup."
  out:
    - "Production SQL or migrations, retries/ignored catalog errors, broader database isolation or weakened registry expectations."
acceptance_criteria:
  - id: A1
    text: "The query calls pg_get_constraintdef only for current-schema CHECK OIDs and returns the unchanged exact stored-size constraint set."
  - id: A2
    text: "A deterministic real PostgreSQL probe rejects the original query for a foreign OID and accepts the materialized query; EXPLAIN confirms the owned boundary."
  - id: A3
    text: "The complete touched PostgreSQL package passes ordinarily and under race detection, and sibling review has an explicit disposition."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -p=2 -count=1 ./internal/persistence/postgres"
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -p=2 -count=1 ./internal/persistence/postgres"
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
verification:
  date: "2026-11-08"
  root_cause: >-
    Real PostgreSQL 17 EXPLAIN with the built-in function places
    pg_get_constraintdef before connamespace in the original scan filter.
    The deterministic low-cost shadow deparser rejects a foreign CHECK OID
    on the original query; before the fix the real caller query fails the same
    probe. The fixed plan materializes the type/namespace-qualified OIDs first
    and deparses only that CTE. It returns exactly catalog_probe_size while
    another owned non-size CHECK and a foreign copy remain excluded. The
    unchanged migrated-schema registry/exactness gate passes. The sibling
    partial-index deparser passes its own foreign-relation guard after the
    owned-FK join; independent UI-lane read-only review found no concerns.
  commands: >-
    Complete internal/persistence/postgres suite passed against the owned
    data-lane PostgreSQL database: 72 top-level tests, zero skips, ordinarily
    in 24.831 seconds and under race detection in 26.576 seconds. No optional
    heavy I/O was enabled. Diff whitespace checks pass; task validation reports
    only the expected generated BACKLOG update reserved for the coordinating
    lane. Integrated lint, full Go verification and task closure remain there.
  attempts: >-
    The initial race launch ran no tests because the shared temporary Go SDK
    lost its standard-library sources at midnight. Its setup-failure log is
    preserved; the coordinator restored the checksum-verified identical Go
    1.26.9 SDK outside temporary storage. The first subsequent full race run
    passed 71 tests but its unrelated existing migration-lock 500 ms deadline
    assertion received a transport I/O timeout. All ten unchanged focused race
    controls then passed, followed by the complete 72-test race pass above.
    No timeout, migration-lock assertion, retry policy or migration code was changed.
  classifier_guard: >-
    The integrated SQLSTATE guard rejected the probe's literal for PostgreSQL's
    default RAISE code. The negative control now asserts the PostgreSQL error
    type and its unique foreign-OID marker without spelling that irrelevant
    default SQLSTATE or adding a test-only classifier entry. The complete
    parent persistence package and PostgreSQL package then passed in 3.151 and
    24.577 seconds on the owned integration database; every registry and
    foreign-OID assertion remains intact.
