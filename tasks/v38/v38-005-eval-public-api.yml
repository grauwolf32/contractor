schema_version: "1.0"
id: "V38-005"
title: "Expose native eval setup and external producer submission APIs"
milestone: "managed-evals-ui"
priority: "P2"
status: completed
implementation_commit: "bb3c3bdbe6f3001728f32dec106f6832351fc079"
implementation_repository: "contractor"
depends_on: ["V38-004"]
languages: ["go", "yaml", "typescript"]
goal: >-
  Deliver authenticated authoring, readiness and execution control routes used identically by
  the UI and any external client.
context:
  specification: >-
    docs/spec/30-managed-evals.md
  design: >-
    docs/evals-experience-design.md
  format: >-
    docs/spec/26-portable-evaluation-format.md
  user_story: >-
    US-10 in docs/spec/ui-user-stories.md
  boundary: >-
    Contractor builds and runs native Evals without Playground. Server and external control
    modes are immutable and mutually exclusive for dispatch. Both submit ordinary Runs/Audits
    through existing services; no new Worker Scheduler or label-based membership authority. The
    delivered portable CLI format and private recovery journals remain compatible.
  verification: >-
    Create the named focused test files/packages as part of implementation. PostgreSQL commands
    require a disposable database and must not pass by skipping integration cases. Use
    deterministic fixtures; these tasks do not authorize paid models, live targets, tighter
    global token defaults or shared-demo mutations.
  locations: >-
    Contractor: internal/httpapi/public, internal/evalservice,
    api/openapi/contractor-public-v1.yaml, internal/publicclient and
    ui/src/api/generated/public.ts. Regenerate public clients using existing repository
    commands.
scope:
  in:
    - >-
      Implement capabilities, dataset list/revision import/visible-case reads, native/external
      experiment create/list/detail, draft PATCH,
      prepare/start/pause/resume/cancel/finalize/duplicate commands, command polling, member
      listing/submission and experiment DELETE from spec 30.
    - >-
      Publish OpenAPI and generated client changes atomically with handlers. Expose exact
      compatible Workflow/AuditProfile versions, bounded supported validators and safe
      unavailability reasons using existing catalogs; latest is draft convenience only.
    - >-
      Apply owner authorization, cookie CSRF/origin checks, HEAD/method conventions, strict
      schemas, CAS, stable idempotency and safe error mappings.
      Review/result/assessment/comparison endpoints are delivered with V38-006, not stubbed as
      successful here.
  out:
    - >-
      Browser UI, server calls to Playground, producer-name-specific routing, implicit Run-label
      adoption and assessment/comparison business logic owned by V38-006.
requirements:
  - id: "R1"
    text: >-
      Every accepted mutation has a durable receipt. Lost responses replay the exact key/body;
      changed-key semantics cannot create a second member execution. Prepare submits no work and
      Start requires the exact frozen hash/revision.
  - id: "R2"
    text: >-
      Owner identity is derived from authentication. Foreign artifacts/projects/members fail
      with owner-safe 404 before side effects. Runtime private credentials cannot manage Evals.
      Registration strings cannot grant permissions.
  - id: "R3"
    text: >-
      Implement list bounds, indexed queries and collection/view cursor binding from spec 30.
      Overlarge limits fail explicitly. Imported visible bytes retain their verified digest and
      distinguish source assertions; private check data never appears in generic list/detail
      DTOs.
acceptance_criteria:
  - id: "A1"
    given: >-
      A disposable API/database fixture with native and external clients.
    when: >-
      Clients create/import, prepare, start, poll, replay and finalize through HTTP.
    then: >-
      Responses follow the published contract and invoke existing execution services exactly
      once, while external and native dispatch ownership remain enforced. Exercise Workflow
      and Audit in both modes, reject mixed-kind registrations and preserve kind=project Audit
      execution workspaces behind the evaluation Project association.
  - id: "A2"
    given: >-
      Foreign owners, Worker credentials, cookie requests and malformed/stale bodies.
    when: >-
      Each new route and method is exercised.
    then: >-
      Authorization/CSRF/HEAD/schema/CAS failures occur before effects and reveal no private
      data; same-key replay remains recoverable.
  - id: "A3"
    given: >-
      A multi-page owner collection with concurrent changes.
    when: >-
      Limits, filters, cursors and capabilities are queried.
    then: >-
      Queries and responses stay bounded; stale collection cursors request explicit reload, and
      capabilities expose exact support without hidden host configuration.
tests:
  - name: "api"
    command: >-
      test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -race -count=1
      ./internal/httpapi/public -run "Test.*Eval"
    covers: ["A1", "A2", "A3"]
  - name: "public-contract"
    command: >-
      make verify-public-api && make ui-typecheck
    covers: ["A1", "A2"]

verification_result:
  date: "2026-09-19"
  database: "Disposable PostgreSQL 17; isolated schemas, no demo writes or live execution."
  evidence: >-
    Required HTTP Eval race suite passed with real ordinary Workflow/Audit services in
    native and external modes. Requests and responses validate against OpenAPI.
    Checks cover owner isolation, cookie CSRF, Worker credentials, HEAD, strict JSON,
    exact CAS/idempotent replay including retained receipts after purge, draft/prepare/
    start/finalize/duplicate/delete, separate Audit workspaces, metadata-only collections,
    bound cursor invalidation and exact paginated capabilities. verify-public-api and
    ui-typecheck passed using repository-supported Node 24.20.0; generated Go/TypeScript
    clients are committed. Broader evalservice/evalstore/evaldomain/PostgreSQL/app/
    publicclient race suites, focused go vet and diff checks also passed.

review_followup:
  date: "2026-09-20"
  implementation_commit: "e7183230bda98cea2b84c3f457394d00472b80c7"
  evidence: "docs/plans/2026-09-20-managed-evals-core-review.md"
