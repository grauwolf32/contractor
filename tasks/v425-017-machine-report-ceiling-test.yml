acceptance_criteria:
- id: A1
  text: At the ceiling the report builds; one byte over it is refused with the registered code.
- id: A2
  text: The test fails if the check is removed.
tests:
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/auditimport/...
  covers:
  - A1
  - A2
- command: make lint
  covers:
  - A1
test_prerequisites:
- Set CONTRACTOR_TEST_DATABASE_URL to a disposable PostgreSQL database before the listed commands. An
  explicitly configured unreachable database fails; a required skipped/zero-match regression is not a
  pass.
- Run the whole suite of every touched report-owner package if implementation relocates the assembler;
  do not keep obsolete auditimport code solely for this command.
- These are future implementation acceptance commands, not claimed results of task formation.
