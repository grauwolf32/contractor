languages: [go, python, typescript, sql]
goal: >-
  Every follow-up found while implementing and reviewing V407 and V409 has a
  verified disposition: each V410 task is completed with its real-path
  regression, or archived with a recorded decision and removed from this
  list in the same change, and the landing revision passes make lint and the
  suites the V410 tasks touched.
context:
  review: >-
    The V407 and V409 task records the V410 tasks cite in context.review:
    tasks/done/v407-001, -004, -008, -011, -017, -018, -019, -020 (open,
    tasks/v407-020-telemetry-trim-and-history.yml), -021, -024, -029,
    -030, -032 and -034; tasks/done/v409-001, -002, -004, -007, -009, -010
    and -012.
  finding: >-
    Twenty-five follow-up candidates were rechecked on 19f7477f (the
    integration branch claude/review-v407-v409 with main merged) before
    filing. All held and became V410-001 to V410-026 (candidate 25 split into
    the allocation-history page, V410-025, and the Eval summary page,
    V410-026). This is an exit gate, not another defect: closing it requires
    the dependencies, not new implementation.
  open_questions: >-
    Items found during verification that no V410 task owns; each needs a
    disposition here (a new task, an existing task, or a recorded decline with
    its reason): (1) the optional-filter predicate shape
    ($n = '' OR column = $n, NOT $n::boolean OR ..., $n IS NULL OR ...) also
    appears in internal/auditstore/internal/pgstore (finding_reads_sql.go,
    read_sql.go, store_sql.go, workspace_sql.go, report_build_sql.go,
    provenance_reads_sql.go), internal/artifacts (postgres_query_sql.go,
    postgres_fork_sql.go), internal/runstore (store_sql.go,
    queue_store_sql.go), internal/projectstore/store_sql.go and
    internal/findingintake/postgres_sql.go; only the two statements of
    V410-025 and V410-026 were measured; decide per statement whether its
    generic plan is bounded by its parent or needs the V410-025/026 fix;
    (2) Audit and finding stores pass request strings with a \u0000 escape to
    jsonb parameters, which fails at write with an unclassified 500 instead of
    a 4xx (nothing is stored; found while verifying V410-017); (3) Planner
    error codes still missing from docs/spec/platform/errors.md besides
    planner_invocation_in_progress (for example planner_cancelled,
    planner_initialization_failed, worker_task_failed, planner_session_invalid;
    found while verifying V410-006): confirm V372-020 covers them or file a
    task; (4) V371-009 (Audit list preparation batch) may be superseded by
    V407-004's one-snapshot list read: confirm and archive it or keep it with
    a reason; (5) V410-006 and V410-008 both change
    planner.SessionError; the second to land rebases on the first.
scope:
  in:
    - "Reconcile every V410 dependency: completed with its implementation_commit and moved to tasks/done/, or archived by the user's decision with the reason, the evidence and its removal from depends_on in the same metadata change. Archived or deferred tasks never count as completed."
    - "Record a disposition for every item in context.open_questions."
    - "Run make lint and the suites the V410 tasks touched on the landing revision, with CONTRACTOR_TEST_DATABASE_URL set, and record commands, revision and results, naming any skipped or environment-limited test."
    - "Say whether the branch that carries the V410 work is merged into main and what is left (AGENTS.md section 4, Land your branch)."
  out:
    - "Implementing any V410 task inside this one."
    - "New findings unrelated to V407/V409 follow-ups; file them separately."
acceptance_criteria:
  - id: A1
    given: "the V410 task files"
    when: "this task is closed"
    then: "every task in depends_on is completed with a full implementation_commit in tasks/done/, or was archived with a recorded decision and removed from depends_on in the same change, and make lint accepts the index"
  - id: A2
    given: "context.open_questions"
    when: "this task is closed"
    then: "each item names its owning task or its recorded decline with evidence"
  - id: A3
    given: "the landing revision"
    when: "the commands under tests run with a disposable PostgreSQL database"
    then: "they pass, and the task records each command, the revision and the result; a skipped database test is reported as skipped, not as a pass"
tests:
  - command: make lint
    covers: [A1, A2]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make test-go"
    covers: [A3]
  - command: make test-runtime
    covers: [A3]
  - command: make ui-verify
    covers: [A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make verify-public-api-postgres"
    covers: [A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=\"${CONTRACTOR_TEST_DATABASE_URL:?Set a disposable PostgreSQL URL}\" make test-wire-cross-language"
    covers: [A3]
