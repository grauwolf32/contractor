schema_version: '1.0'
id: V64-005
title: Optionally rank the common Audit ready-task shortlist
milestone: audit-research-ranking-quality-2026-10
epic: audits
kind: feature
priority: P2
status: pending
depends_on:
- V64-012
- V64-013
- V64-034
languages:
- go
- python
- json
- yaml
goal: Let a selected research policy use bounded model judgments while retaining deterministic eligibility,
  selection and direct execution independence.
context:
  authority: 'User direction on 2026-11-05: use the corrected Workflow hypothesis contract in proposal 0054
    after V64-034, including exact grounds and independent check results. This update starts no
    implementation.
    User decisions on 2026-10-31: Contractor is a research platform. Audit provides durable
    coordination over ordinary Runs, fixed assertions use common hypotheses, exploratory findings may
    have no hypothesis, deduplication and exact Audit/Run origin remain, hypothesis associations are automatic
    and owner-independent, formal approvals are removed almost completely, and complexity must decrease
    or stay controlled. The user requested task replanning and diagrams for review before implementation.'
  proposal: docs/proposals/0045-audit-hypothesis-search.md
  design:
  - docs/proposals/0054-workflow-hypothesis-production.md
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/persistence.md
  deterministic_boundary: All Audit assertion checks use common hypotheses. Fixed checklist/standard seeds
    remain deterministic without generation, ranking or a separate research phase. Direct Runs and supporting
    non-assertion work need no hypotheses.
  implementation_boundary: Each new table, state, export and schema must have its named production writer/reader
    in this task; include the smallest actual integration caller, not a test-only placeholder waiting
    for another task.
  previous_definition:
    revision: a31579d33e81315818a277b822e3b087ce5c76c1
    path: tasks/v64-005-independent-priority-verdicts.yml
    title: Produce durable independent model verdicts for every remaining candidate
    depends_on:
    - V64-002
    - V64-004
    note: The former fixed-checklist/minimum-ten integration scope is replaced by this task. Its original
      definition and deferral history remain in Git; completed V64-000 is unchanged.
  implementation_gate: Planning only. The user will review the revised task graph and proposal 0050 before
    authorizing implementation. Keep pending and do not start code, migrations, live Runs or deployment
    from this planning update.
  extension_boundary: Use the existing deterministic task order as the baseline; optional model judgments
    cannot invent work, metadata authority, scope or human attention. No separate research admission or
    ranker controller.
  execution_scope: Optional follow-up outside the requested basic scenario and V64-011 exit. Its pending
    status does not add it to the current base implementation scope; select it separately after the reviewed
    prerequisites.
scope:
  in:
  - Implement an ordinary evaluation Workflow/Worker and typed result tooling for a frozen shortlist under
    a pinned rubric.
  - Validate echoed assigned IDs, evidence membership, priority/confidence separation, reasons and omissions;
    Runtime assembles trusted packages.
  - Integrate the optional evaluator registration and profile validation without changing the deterministic
    policy or introducing automatic mode fallback.
  - Reuse or revise V64-000 verdict APIs with real production consumers; remove unused exports/obsolete
    restrictions rather than retaining compatibility shims.
  out:
  - Live-model quality claims (V64-016), a new Scheduler lane or requiring model evaluation in deterministic
    search.
  - Implementation during this planning change, changing existing task statuses, or modifying completed/in-progress
    task records.
requirements:
- id: R1
  text: Model outputs do not select Workflows, expand inputs or authorize Run admission; the V64-012 selector
    owns final selection.
- id: R2
  text: Every accepted verdict belongs to one exact shortlist/context/rubric. Missing or malformed declared-batch
    verdicts fail that batch, not a fabricated partial top-N.
- id: R3
  text: No model ranking dependency is added to V64-002, V64-011, V62 or baseline V411 release. Keep the
    configured model route unchanged in live evaluation.
- id: R4
  text: Optional model judgments may assess experiment usefulness but cannot overwrite trusted human authorship
    or requested verification priority; rejected/absent model scores do not erase a human candidate from
    the next eligible shortlist.
failure_outcomes:
- operation: Optional model evaluation and verdict collection
  permanent: Invalid, foreign, unsupported or oversized input is rejected with the owning V64-001/standard
    contract reason; deterministic ErrInvalid is never endlessly retried and no partial authoritative
    result is accepted.
  retryable: Use existing bounded transient storage/provider retries for the owning operation; retry attempt/deadline
    limits are explicit and do not switch research policies or models.
  ambiguous: Reconcile the same existing keyed mutation, accepted producer association or exact result;
    never create another logical effect or repeat target activity to repair acknowledgement loss.
  cancelled: Existing Audit/Run owner fences and join/drain rules apply; allow authorized terminal collection,
    block new dispatch and release resources only after in-flight work is joined.
  timeout: Use the owning operation/Run deadline. Audit admission deadline pauses and drains; non-time
    budget exhaustion follows bounded finalization with gaps.
cardinality:
- collection: Candidates in one model evaluation call
  expected: At most 32 from the frozen shortlist
  maximum: 32 per call, shortlist at most 128, existing model token budgets and bounded context bytes
  bound: Split only into declared exact batches; complete membership and aggregate cost are reconciled
    before selection.
lifecycle:
- entity: Task-owned research records, exact artifacts and projections
  delete: Audit/Project ownership and existing deletion gates apply; accepted evidence used by work is
    retained, not removed by settling or withdrawing a candidate.
  cascade: Use the owning Audit relations and existing artifact hold lifecycle; register any new holder
    inventory entry in this change and leave no independent cleanup owner.
  retention: Preserve exact accepted inputs/results and history through permitted source Run deletion,
    pause and recovery; release only through the owning lifecycle. Stateless validation/read-only outputs
    acquire no artificial persistent state.
acceptance_criteria:
- id: A1
  given: A frozen shortlist and scripted evaluation model
  when: the optional Workflow completes
  then: Exact validated judgments feed deterministic selection and are retained with provenance.
- id: A2
  given: Foreign IDs, invented evidence, incomplete output or overflow
  when: the result is imported
  then: The declared batch fails with explicit reasons and does not admit partial guessed work.
- id: A3
  given: Provider failure, timeout, response loss or owner cancellation
  when: ordinary execution/recovery applies
  then: Existing bounded retries and receipts govern recovery; accepted judgment is not duplicated or
    mistaken for proof.
- id: A4
  given: Ranking is not selected
  when: deterministic research and direct Audits run
  then: There are zero ranker calls and no dependency on the model-evaluation capability.
tests:
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/auditpriority ./internal/auditservice ./internal/auditimport
    ./internal/auditcontroller
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make test-runtime test-wire-cross-language test-config
  covers:
  - A1
  - A2
  - A4
- command: make lint
implementation_commit: null
reactivation:
  date: '2026-10-24'
  previous_status: deferred
  reason: Explicit user request to queue the reviewed proposal 0045 tasks as pending.
  execution_rule: Implementation may start after declared dependencies complete; this update starts no
    implementation.
previous_deferral:
  date: '2026-10-21'
  previous_status: pending
  previous_priority: P1
  reason: User deferred the remaining V64 integration to focus on authenticated HTTP continuity and completion
    of the existing V62 audit journey.
  reactivate_when: Explicit user authorization to implement this reviewed proposal 0045 scope, after its
    declared dependencies are completed. Replanning alone does not activate it.
  previous_reactivate_when: Explicit user decision after cookies and V62 are delivered and representative
    audit measurements show that model-based prioritization improves useful-result yield or time/cost
    over fixed ordering.
deliverables:
- path: runtime/src/contractor_runtime/toolsets
  description: Bounded judgment authoring and Runtime-assembled result integration.
- path: internal/auditpriority
  description: Strict optional verdict validation with actual production consumers.
- path: internal/auditimport
  description: Frozen shortlist/evaluator-output validation and acceptance.
- path: configs
  description: Separately named optional evaluation Workflow/policy with test-only catalog fixtures.
test_prerequisites:
- Commands are implementation acceptance requirements, not results of this planning change. New named
  gates must be created, registered and fail on zero matching cases.
- Persistence/lifecycle acceptance uses disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; an
  unavailable configured database or mandatory skipped case fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Shipped configuration
  has its dedicated validation command.
- Run complete suites for touched packages; use injected clocks and deterministic work counters. Put timing
  measurements in benchmarks.
verification_requirements:
- Update owning numbered specifications, strict public/wire contracts and shared fixtures with implementation;
  do not cite task IDs from normative specifications.
- Record actual commands, case counts, required prerequisites and exact evidence after implementation.
  Planning does not populate implementation_commit or fabricate successful checks.
- Keep direct deterministic behavior, existing claims/receipts and source-to-consumer exact provenance
  explicit in real-path assertions.
