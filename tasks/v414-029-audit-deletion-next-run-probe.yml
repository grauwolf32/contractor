schema_version: "1.0"
id: V414-029
title: "Find a deleting Audit's next live child Run without reading every execution and Run"
milestone: review-v407-v409-followups-2026-10
epic: audits
kind: defect
introduced_by: V25-008
priority: P2
status: in_progress
progress: >-
  Checkpoint 2026-10-24 20:14 before pause, on main ee2c9658 merged. Done: nextLiveRunForDeletionSQL
  (internal/auditstore/internal/pgstore/lifecycle_sql.go) rewritten to a
  CROSS JOIN LATERAL over audit_executions with run_id IS NOT NULL AND
  run_deleted_at IS NULL (the prefix of audit_executions_audit_run_cleanup_idx,
  which yields created_at, execution_id order) plus an EXISTS probe of
  workflow_runs by primary key, ORDER BY created_at, execution_id LIMIT 1; the
  audit/claim gate and the NextLiveRunForDeletion caller are unchanged. It
  compiles and go vet passes, and the task test command (auditstore,
  auditcontroller, rundeletion with -tags=integration, TMPDIR without a
  symlinked component on macOS) passes with it; make lint not yet run.
  Design decision: keep the EXISTS on workflow_runs
  so the meaning stays "the earliest execution whose Run still exists"; the
  run_deleted_at predicate only skips executions whose Run the deferred
  contractor_require_matching_audit_run check proved absent when the stamp
  committed. Open point: no trigger on workflow_runs DELETE requires the stamp,
  so a Run deleted without markExecutionRunDeletedSQL stays an index entry the
  probe reads (still correct, but outside the bound). Checked so far:
  internal/rundeletion/deleter.go:91 stamps through MarkExecutionRunDeleted in
  the Run-deletion transaction for every audit-managed Run; still to confirm
  the Project purge path and that run IDs are never reused. The pgstore purge
  tests delete the child Run with a bare DELETE (purge_postgres_test.go:346,
  deleteChildRunForPurge) without the stamp; the kept EXISTS keeps them
  correct.
  Not yet done: the A1 scale test (explaintest.ExplainPrepared, Custom and
  Generic, committed fixture of a deleting Audit with >=20,000 executions, a
  small live tail and thousands of unrelated Runs, built by inserts and
  VACUUM (INDEX_CLEANUP ON) as in V414-028's claim_scale_postgres_test.go;
  keep the original statement verbatim from main for A3), the A2 traversal
  test against the original statement with a lost claim and the purge gate,
  the purgeClaimedAuditSQL sibling measurement (fix it with the same
  run_deleted_at IS NULL predicate if it reads beyond a constant), the
  AUX-R97 spec note, the gates and the close. Next step: write the A1 and A2
  tests in internal/auditstore/internal/pgstore.
depends_on: []
languages: [go, sql]
goal: >-
  Each deletion step of a deleting Audit finds its next live child Run with
  work bounded by a constant, not by the Audit's executions or by the
  workflow_runs table, in both plan cache modes, returning the same Run in
  the same order until no child Run is left.
context:
  review: >-
    docs/research/2026-10-23-sql-review.md, open question F ("partial-index
    choice for the claim probes claimAuditSQL and nextLiveRunForDeletionSQL")
    and its Status disposition; measured by V409-013 on 2026-10-24.
  specification:
    - docs/spec/audits/execution.md#AUX-R97
    - docs/spec/platform/persistence.md#PER-R21
    - docs/spec/artifacts/retention-and-deletion.md
  severity: medium
  finding: >-
    internal/auditstore/internal/pgstore/lifecycle_sql.go:133-147
    (nextLiveRunForDeletionSQL, called by ClaimStore.NextLiveRunForDeletion in
    lifecycle.go:79-108) joins every execution of the deleting Audit with
    workflow_runs and sorts by (execution.created_at, execution.execution_id)
    LIMIT 1. internal/auditcontroller/settlement.go:87-120
    (deleteReleasedRunBatch) calls it once per child Run it deletes, so a
    whole deletion repeats it once per child Run. The statement has no
    run_deleted_at predicate, so audit_executions_audit_run_cleanup_idx
    (audit_id, run_deleted_at, created_at, execution_id) WHERE run_id IS NOT
    NULL cannot deliver the order and stop at the first live Run. V409-013
    measured it with explaintest.ExplainPrepared (Analysis.Reads, both plan
    cache modes, rolled back) on the finding-scale fixture of
    internal/auditstore/internal/pgstore: the deleting Audit has 20,001
    collected executions of which 51 still have a Run, and three other
    Audits of the fixture have 15,000 live child Runs (the fixture clones the
    Runs and stamps run_deleted_at with user triggers disabled). One call
    read 60,001 executions (a sequential scan of the whole table) and 15,053
    Runs in the custom plan, 39,954
    execution index entries (20,001 live rows plus versions the fixture's bulk
    run_deleted_at update superseded) and 15,053 Runs in the generic plan, to
    return one Run; a drained Audit of 5,000 executions read 10,000 execution
    entries and 15,053 Runs to return none. The pinned maxSubmittedRuns
    admits up to 1,000,000 child Run attempts per Audit (LIM-AUX-13; the
    store's validateLimits ceiling in pgstore/validation.go:66), so the deletion
    work is quadratic in the Audit's executions plus linear in all Runs per
    step. The only detection is the AUX-R97 warning
    (internal/auditcontroller/controller.go:125-135) once a deletion step outlasts the operation
    budget.
  siblings: >-
    purgeClaimedAuditSQL (lifecycle_sql.go:149-175) checks NOT EXISTS over
    the same execution and workflow_runs join; it runs once per purge
    attempt after the drain and is to be measured with the same fixture and
    fixed the same way if it reads beyond a constant. markExecutionRunDeletedSQL
    (run_deletion_sql.go:33-40) stamps run_deleted_at in the Run-deletion
    transaction, and the deferred Run association check (000001_baseline.sql
    contractor_require_matching_audit_run, scoped by migration 000037) holds
    run_deleted_at IS NULL exactly while the Run row exists at commit; confirm
    that invariant before relying on it as the live-Run predicate.
  prior_probe: >-
    A first rewrite with execution.run_deleted_at IS NULL, measured on the
    same fixture, read 5,000 and 0 execution entries for the drained Audit
    (custom, generic) but still 20,003 execution entries and 15,053 Runs for
    the live tail in both plans (a hash join over a sequential Run scan; the
    fixture's bulk update had left superseded index entries unvacuumed). The
    predicate alone is therefore not shown to be sufficient; the regression
    fixture must build its state without unvacuumed bulk updates (or VACUUM
    it) and the statement must reach the first live Run by index order.
scope:
  in:
    - >-
      Restrict the probe (and the purge gate if its measurement requires it)
      to executions whose Run is not marked deleted, so the cleanup index
      yields (created_at, execution_id) order and the probe stops at the
      first live Run, or an equivalent statement with the same bound.
    - >-
      Real PostgreSQL regression with explaintest.ExplainPrepared in Custom
      and Generic modes on a committed fixture with a deleting Audit of at
      least 20,000 executions, a small live tail and thousands of unrelated
      Runs: Analysis.Reads budgets for audit_executions and workflow_runs that
      are constant (plus the documented allowance for superseded entries) and
      independent of the Audit's executions and of workflow_runs.
    - "A traversal test: repeated calls with Run deletions in between return the same Runs in the same order as the original statement until none is left, then the purge gate passes."
  out:
    - "Deletion batch size, drain bounds, the AUX-R97 detection and Run deletion itself."
    - "Index changes, unless the measurement shows the existing cleanup index cannot serve the bound."
failure_outcomes:
  - operation: "next live child Run lookup of a deleting Audit"
    success: "unchanged: the earliest execution's still existing Run, or no row once none is left"
    permanent: "unchanged: a lost or foreign claim and a non-deleting Audit keep their ErrClaimLost and ErrPrecondition outcomes"
    retryable: "unchanged: storage errors return to the controller pass, which retries"
    ambiguous: "not applicable: read-only statement"
    cancelled: "the step context cancels the statement; nothing to clean up"
    timeout: "the existing operation timeout owns it; the fix must not depend on raising it"
acceptance_criteria:
  - id: A1
    text: >-
      Given the committed fixture, when the probe runs with a live tail and
      after the Audit is drained, in Custom and Generic plans, then
      Analysis.Reads of audit_executions and workflow_runs stay within a
      constant budget independent of the Audit's execution count and of the
      unrelated Runs.
  - id: A2
    text: >-
      Given the traversal test, when Runs are deleted between calls, then the
      returned Runs and their order match the original statement, a lost
      claim still yields ErrClaimLost, and the purge gate passes only once no
      child Run is left.
  - id: A3
    text: >-
      Given the original statement, when the A1 test runs, then it fails
      (60,001 / 39,954 execution reads and 15,053 Run reads per call in
      V409-013's measurement).
tests:
  - command: >-
      CONTRACTOR_TEST_DATABASE_URL="${CONTRACTOR_TEST_DATABASE_URL:?Set a
      disposable PostgreSQL URL}" go test -tags=integration -count=1
      ./internal/auditstore/... ./internal/auditcontroller/... ./internal/rundeletion/...
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A2]
