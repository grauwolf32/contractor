schema_version: '1.0'
id: V274-001
title: Centralize Run-deletion Audit projection invalidation
milestone: code-reuse-2026-10
priority: P1
status: completed
implementation_commit: bbff50d2e802d2482303bd54316102a5f4fb6ead
depends_on: []
languages: [go]
goal: Keep Audit revision updates caused by Run deletion behind auditstore.
context:
  issue: https://github.com/grauwolf32/contractor/issues/87
  finding: runstore directly incremented Audit revisions when deleting a Run used by findings or executions.
scope:
  in:
    - Move the Audit invalidation into auditstore under the existing Run deletion transaction.
    - Preserve finalizing report timestamps and avoid fabricating an Audit event.
  out:
    - Other Audit mutation paths tracked by issue 87.
acceptance_criteria:
  - {id: A1, text: runstore no longer issues UPDATE audits.}
  - {id: A2, text: Affected Audits advance revision while event sequence stays unchanged.}
  - {id: A3, text: Finalizing Audit updated_at remains frozen; other Audits advance updated_at.}
  - {id: A4, text: Existing Run deletion and finding retention behavior remains valid.}
tests:
  - {command: go test ./internal/runstore ./internal/auditstore, covers: [A1, A2, A3, A4]}
  - {command: go test -tags=integration ./internal/findingintake, covers: [A4]}
