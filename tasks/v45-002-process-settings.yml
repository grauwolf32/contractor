schema_version: '1.0'
id: V45-002
title: Separate process settings phases and name deployment defaults
milestone: server-maintainability
priority: P2
status: pending
depends_on:
- V45-001
languages:
- go
goal: Separate process settings phases and name deployment defaults.
context:
  verified_evidence: ParseConfig mixes environment resolution, flag registration and validation; development
    gateway and registry timing defaults are embedded in composition.
  current_contract: Behavior-preserving refactoring of the existing Go Server. Preserve exact pinned identities,
    authority checks and operation/resource ownership. Tests describe the required verification, not measured
    production performance.
scope:
  in:
  - Separate default/file/environment input, flag overrides and effective configuration validation.
  - Name heartbeat and lease defaults and retain existing RegistryOptions validation.
  - Make the development LLM Gateway selector explicit with local-litellm@1 as the compatible default;
    document the setting.
  - Expose registry timings through ServerConfig only when supported by a concrete deployment requirement.
  out:
  - Secret values in ServerConfig, precedence changes, hot reload and new scheduling policy.
requirements:
- id: R1
  text: Keep dependencies explicit and changes confined to this task; preserve unrelated working-tree
    changes.
- id: R2
  text: Use existing behavior tests and add regressions for newly exposed boundaries or bounded query
    counts.
acceptance_criteria:
- id: A1
  given: The current Server contracts and supported input fixtures.
  when: The refactored path executes.
  then: Existing aliases, default values, strict YAML validation, redaction and file/environment/CLI precedence
    are preserved.
- id: A2
  given: Failures, boundary cases and existing lifecycle behavior.
  when: The relevant regression suite runs.
  then: Development gateway selection is explicit and tested without changing ordinary production credential
    resolution.
tests:
- name: app-config
  command: go test -race -count=1 ./internal/app ./internal/config ./internal/controlplane
  covers:
  - A1
  - A2
- name: diff
  command: git diff --check
  covers:
  - A1
  - A2
