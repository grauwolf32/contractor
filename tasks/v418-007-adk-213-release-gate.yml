schema_version: '1.0'
id: V418-007
title: Close the ADK 2.13 migration with an integrated release gate
milestone: adk-213-upgrade-2026-10
epic: quality
kind: chore
priority: P1
status: pending
depends_on:
- V418-005
- V418-006
languages:
- python
- markdown
goal: Accept the exact ADK 2.13 dependency closure only after the full deterministic release and all migration-specific
  case inventories pass, then unblock the existing compaction spike.
context:
  authority: 'User request on 2026-10-25: plan the ADK 2.13 upgrade with every identified compatibility
    change, adjust the existing compaction series, and keep model consultation as a proposal. These pending
    tasks do not start implementation or change the current delivery focus.'
  review: tasks/evidence/v418-adk-213-review.json
  specification:
  - docs/testing/README.md
  - docs/spec/execution/worker.md
  - docs/spec/execution/runtime-agent.md
  - docs/spec/tools/toolsets.md
  - docs/spec/platform/observability.md
  finding: The initial 326-case exploration was intentionally partial, used temporary dependency overlays
    and skipped a process case. A supported upgrade needs a fresh locked installation, full Runtime, real-process
    coverage and an integrated release record. Compaction V417-002 must use this accepted version instead
    of proving behavior on the old 2.8 baseline.
  implementation_boundary: Preserve the owning Contractor contracts; update numbered specs, limits/error/failure/lifecycle
    registries and affected implementations together when an explicit clarification is necessary. No ADK-version
    branches, legacy readers, dual production runtimes, model replacement, silent retries, new receipt
    store or speculative public API. Read current code and re-establish the dated evidence before implementation.
scope:
  in:
  - Integrated release verification, dependency advisory evidence, ownership/disposition reconciliation
    and final supported-version documentation.
  - Unblock V417-002 through task completion; preserve the independence of V417-001 and keep Consult a
    proposal.
  out:
  - Deployment or migration of a demo database, claiming compaction or consultation implemented, and live-model
    quality claims.
  - Waiving unrelated required release failures, counting zero/skipped cases, requiring V417 completion
    as a prerequisite or rewriting historical evidence as if it used 2.13.
acceptance_criteria:
- id: A1
  given: The integrated revision and a fresh locked environment
  when: Dependency smoke and the complete Runtime suite run
  then: The supported 2.13 closure works without optional provider SDKs, regressions or skipped mandatory
    cases.
- id: A2
  given: All migration case inventories and predecessor evidence
  when: The integrated release graph runs
  then: Every required deterministic stage passes with actual case counts, including the previously skipped
    real Go Artifact API scenario.
- id: A3
  given: Current dependency advisory data and source availability
  when: The separate advisory gate runs
  then: Results are recorded honestly and actionable blockers resolved; unavailability is not represented
    as a pass.
- id: A4
  given: Documentation, specs and task dependencies
  when: The milestone is closed
  then: All current-version statements agree, the branch/commit status is recorded, compaction waits on
    this exit and terminal reasoning/Consult remain independent.
tests:
- command: cd runtime && uv sync --locked
  covers:
  - A1
- command: make test-runtime
  covers:
  - A1
  - A2
- command: make test-runtime-dependencies-audit
  covers:
  - A3
- command: make release-verify
  covers:
  - A1
  - A2
  - A4
- command: make lint
  covers:
  - A4
requirements:
- id: R1
  text: Create the final verification record from a clean isolated checkout/environment at the integrated
    revision with uv sync --locked; record exact ADK, Python and transitive closure/lock digest and all
    executed commands. Do not use exploratory PYTHONPATH overlays for final acceptance.
- id: R2
  text: 'Every finding from the case manifest has a disposition and owning passing regression: reminder
    identity, interrupted history, unknown names, deadline admission, cancellation classification, raw
    coercion, empty output, resource cleanup, Skills and Gateway/telemetry contracts. New findings become
    resolved tasks, never silent scope omissions.'
- id: R3
  text: Run the full deterministic release gate once on the integrated revision. Verify consolidation
    reports so every required Runtime, real-store, real-process and wire case actually ran; zero matches/skipped
    mandatory prerequisites fail. Correct documentation and generated gate inventory through their owning
    commands.
- id: R4
  text: Run the separate Runtime dependency advisory gate and record result/date/source availability.
    A service outage is unavailable, never clean; an actionable finding requires a resolved owning decision
    before this task completes. This external audit does not become a dependency of the deterministic
    release graph.
- id: R5
  text: Reconcile normative current-pin references, install/deployment/testing instructions, exact smoke
    tests and safe changelog notes. Maintain Contractor public telemetry and API semantics unless explicitly
    changed end to end in the migration; historical reviews retain their original versions.
- id: R6
  text: No dependency on V417 or proposal 0047 is introduced. V417-002 starts only after this exit is
    completed and uses this exact accepted closure. V417-001 terminal reasoning remains independently
    deliverable; if already implemented when this gate runs, cover it as existing behavior without making
    it a prerequisite.
- id: R7
  text: Record whether the branch is merged and the final implementation commit under normal task policy.
    Completion requires every listed acceptance gate, not merely a successful pin or most Runtime tests;
    no deployment is implied.
test_prerequisites:
- Commands below are future implementation acceptance gates, not checks already passed by this planning
  change. A required command, selected case or dependency setup must not be skipped or match zero tests.
- Run full suites of every touched package/module, in addition to focused regressions. Use real ADK dispatch
  and controlled Gateway responses; persistence/process claims require disposable real PostgreSQL and
  real Server/Runtime processes. Never read live configs from unit tests; use testdata and pseudo-Skills.
- Use injected clocks, synchronization barriers, work/row/byte counters and bounded fixture sizes. Timing
  samples are informational, never flaky wall-clock pass thresholds. Keep configured live models unchanged;
  no live Gateway is part of these deterministic tasks.
- Use the repository lock for acceptance, except the explicitly isolated candidate characterization in
  V418-001. Preserve unrelated user changes. Record the tested revision, lock digest, command, executed
  case count, skips and outcome. The 326-case exploratory run is not a substitute for make test-runtime
  or a release gate.
failure_outcomes:
- operation: Verification setup and evidence collection
  permanent: Strict invalid input or unsupported SDK behavior fails with the owning classified outcome;
    no permissive fallback or endless retry. A required verification failure blocks completion.
  retryable: Reuse the existing bounded transport/recovery or cleanup policy only; no SDK upgrade-specific
    retry loop or rerun-until-green.
  ambiguous: Reconcile existing receipts, trusted observations and the same operation identity. Test evidence
    preserves the original uncertain outcome; never repeat an external append or side effect blindly.
  cancelled: The existing invocation/allocation or fixture owner cancels and joins all work before cleanup;
    no later dispatch or unowned callback may outlive release.
  timeout: Execution deadline, per-request timeout, cleanup timeout and harness timeout remain distinct;
    injected expiration cannot start a new admitted attempt.
cardinality:
- collection: Calls, event history, retained State/metrics and fixture cases
  expected: Several sequential logical invocations, parallel tool batches and multiple internal Runner
    turns; scale task adds long histories.
  maximum: Existing owning model/tool/subtask/State/Skill byte and item ceilings; V418-006 must inventory
    the containing limits before choosing maximum fixtures.
  bound: Work follows admitted finite inputs and retained history; no unbounded full-catalog scan, private-history
    copy or unrestricted per-callback rescan. Verify bytes/items/work counters, not only input length.
lifecycle:
- entity: Existing allocation-local sessions, clients, tools, callbacks and test evidence
  delete: Existing invocation/allocation owner or isolated test harness owns teardown; never touch another
    allocation or user database.
  cascade: Join generators, tools, clients and serializers before deleting session/workspace state. Preserve
    required publication receipts through their existing owner.
  retention: No new durable runtime entity. Keep only bounded safe test evidence and ordinary published
    results under existing retention policies.
