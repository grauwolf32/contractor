languages: [yaml]
goal: Stop merging changes that have not passed CI.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: high
  finding: "GET /branches/main returns protected:false with no required status checks and no rulesets; PRs #512, #534 and #536 were merged 19-25 s after opening and #518 was merged while its PR run was still running (that run failed). Combined with a release gate that has never passed, every merge since 2026-05-29 is effectively ungated."
scope:
