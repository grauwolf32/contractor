schema_version: '1.0'
id: V309-001
title: Scrub Runtime-injected target credentials from Caido results
milestone: review-defects-2026-10-04
priority: P1
status: in_progress
depends_on: []
languages: [python]
goal: Keep credentials that the Runtime injects into target requests out of model-visible Caido results and artifacts.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: high
  finding: "On the tool-http route through Caido, http_request injects the httpOriginTarget Authorization header (runtime/src/contractor_runtime/toolsets/http/tools.py:602-610) and Caido stores the request. caido_request_detail returns raw.data verbatim up to 8192 characters and writes the full raw exchange to an artifact whose reference goes to the model (toolsets/caido/tools.py:292-295, _raw_preview at :1809); caido_replay does the same (:413-417). The HTTP toolset replaces the value with [runtime-target-credential] (http/capture.py:49-52); the Caido path has no equivalent. Reproduced: the detail raw.data and the exchange artifact both contained the injected bearer token."
scope:
  in:
    - Scrub Authorization and Proxy-Authorization values equal to configured target or proxy credentials, and Runtime secrets of at least 16 bytes, from Caido previews, details, replays and exchange artifacts.
    - Regression tests for detail, replay and the exchange artifact.
  out:
    - Changing what the HTTP toolset captures.
acceptance_criteria:
  - {id: A1, text: "No Caido tool result or artifact contains the injected target credential."}
  - {id: A2, text: "Non-secret headers are preserved."}
tests:
  - {command: "cd runtime && uv run pytest tests -k 'caido or http_capture or target_credential'", covers: [A1, A2]}
  - {command: "cd runtime && uv run ruff check . && uv run ruff format --check .", covers: [A1, A2]}
