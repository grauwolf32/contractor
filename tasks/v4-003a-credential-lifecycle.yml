schema_version: "1.0"
id: V4-003A
title: Orchestrate recoverable credential lifecycle and public API
milestone: server-ui-and-operations
priority: P0
status: planned
implementation_commit: null
depends_on: [V4-003, V4-001A]
languages: [go, sql]

goal: >-
  Turn the encrypted persistence primitives into idempotent create/delete
  workflows with startup recovery, non-terminal Run deletion protection and a
  secret-free public credential API, while keeping the concrete Gateway HTTP
  adapter injectable.

context:
  lifecycle: >-
    A credential row means active. There is no disabled/revoked/current state.
    Create and delete use durable prepared/completed operations around one
    injected GatewayCredentialManager. Successful deletion retains only a safe
    tombstone; a credential ID is never reused.
  run_race: >-
    The single-Server process must serialize deletion against Run creation from
    credential revalidation through Run commit. A delete first discovers every
    non-terminal Run whose immutable snapshot pins the ID and performs no
    remote or database side effect when any exists.
  recovery: >-
    Recovery runs before public traffic. Prepared create uses the manager's
    deterministic cleanup contract before retry; prepared delete finishes the
    remote deletion and local tombstone transition.

scope:
  in:
    - Implement a manager registry plus idempotent create/delete service over V4-003 repository primitives.
    - Validate bounded generated token/remote ID and encrypt only after a successful manager create.
    - Persist prepared intent before an outbound call and atomically complete active-row or tombstone transitions.
    - Recover every prepared operation before traffic, with deterministic create cleanup and already-absent delete normalization delegated to the manager.
    - Add single-process credential read/write guarding so Run resolution and commit cannot race successful deletion.
    - Query non-terminal immutable Run snapshots for exact credential pins and return bounded safe Run IDs on credential_in_use.
    - Implement bounded list/detail/create/delete public handlers; create never accepts and no response ever returns a token.
    - Mark credential OpenAPI operations implemented only when the production composition supplies the lifecycle service.
  out:
    - LiteLLM HTTP payloads, admin keys, consumption polling, browser sessions, mutable credentials, disable, update, or master-key rotation.

deliverables:
  - {path: internal/credentials, description: Lifecycle service, manager registry, recovery and Run guard.}
  - {path: internal/runstore, description: Exact bounded non-terminal credential-pin query.}
  - {path: internal/httpapi/public, description: Secret-free credential list/detail/create/delete handlers and errors.}
  - {path: internal/app, description: Pre-traffic recovery and lifecycle composition.}

requirements:
  - id: R1
    text: Token bytes exist only in the bounded manager result, encryption call and just-in-time resolver; public requests, responses, journals and diagnostics are secret-free.
  - id: R2
    text: The same idempotency key plus request returns the same outcome; key reuse or immutable identity reuse with different input conflicts.
  - id: R3
    text: Deletion performs no remote or database side effect when any non-terminal Run pins the credential, including a Run committing concurrently in this Server process.
  - id: R4
    text: Public traffic starts only after every prepared operation is completed or startup fails safely.

acceptance_criteria:
  - id: A1
    given: A fake manager returns one bounded token and remote ID.
    when: Credential creation commits or its response is retried.
    then: Exactly one active encrypted row and one completed operation exist, and every returned/logged value is secret-free.
  - id: A2
    given: A non-terminal Run pins the credential or starts concurrently.
    when: Delete is requested.
    then: credential_in_use returns safe bounded Run IDs and neither manager deletion nor tombstone transition occurs.
  - id: A3
    given: Process loss in each create/delete crash window.
    when: recovery runs before traffic.
    then: The system exposes either one active credential or one tombstone, never a selectable partial state or untracked remote key.
  - id: A4
    given: List/detail/create/delete success, conflict, not-found, in-use and manager failure.
    when: Public contract fixtures validate responses.
    then: Status, pagination, idempotency and closed DTOs match OpenAPI without token/cipher/provider payload fields.

tests:
  - {name: lifecycle-race, command: "go test -race ./internal/credentials/... ./internal/httpapi/public/...", covers: [A1, A2, A3, A4]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... go test ./internal/credentials/... ./internal/runstore/... ./internal/httpapi/public/...", covers: [A1, A2, A3]}
  - {name: openapi, command: "make verify-public-api", covers: [A4]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
