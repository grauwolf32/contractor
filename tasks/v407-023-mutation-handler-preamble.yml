schema_version: '1.0'
id: V407-023
title: Classify aborted RuntimeConfig bodies and reject invalid mutation metadata before expensive work
milestone: server-runtime-review-2026-10
epic: api-contracts
kind: defect
introduced_by: V370-009
priority: P3
status: pending
depends_on: []
languages:
- go
goal: Malformed request bodies and metadata produce the documented client error before avoidable body
  buffering or store reads, while endpoint-specific request contracts remain intact.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/api/public-api.md
  severity: low
  finding: internal/httpapi/public/runtime_configuration_handlers.go:556-571 discards a non-size body-read
    cause and returns an unclassified error. errors.go:22-32 maps it to retryable 500; a probe with io.ErrUnexpectedEOF
    reproduced this, while request.go:47-64 maps the same read failure to invalid_request. project_artifact_handlers.go:47-78
    queries the Project before checking query/name/media/preconditions. Run, Project, Audit, configuration
    and credential creation handlers also decode bounded bodies before requiring Idempotency-Key, unlike
    RuntimeConfig handlers.
  siblings: Every POST/PUT/PATCH/DELETE handler under internal/httpapi/public (list them in the task log)
    and the private artifact PUT.
  validation: 'The differing JSON decoder styles have not demonstrated a strictness defect: string arrays
    have no object members and the labels token loop checks duplicates. Dead nil checks and generic preamble/decoder
    consolidation are cleanup recommendations, not prerequisites for this fix. Nested Git WithTimeout
    calls inherit the earliest deadline rather than adding durations; the outer handler also owns socket
    read/write deadlines.'
plan:
- Reuse the bounded JSON read/error-classification logic for RuntimeConfig while preserving its exact
  body representation, strict decoder, null and duplicate-key checks and payload-too-large outcome.
- For authenticated mutations in the named families, reject invalid mandatory headers/preconditions before
  body reads. Keep each endpoint media-type/status policy, declared raw-body size handling and authorization
  precedence; share a helper only where the contract is genuinely identical.
- Validate syntactic Project artifact request metadata before Project lookup; preserve ownership/deleting-state
  checks before mutation. Document/test the intended error precedence for affected inputs.
- Add a failing request-body reader, a counting reader and counting stores through real handlers. Review
  sibling body readers for the same loss of client-error class.
scope:
  in:
  - RuntimeConfig body-read classification and avoidable work on syntactically invalid requests, with
    focused shared-helper changes only as needed.
  out:
  - A universal mutation framework, unrelated JSON decoder/nil-check cleanup, changing accepted shapes,
    and removing Git import or socket deadlines.
acceptance_criteria:
- id: A1
  text: RuntimeConfig publish with a body that fails mid-read returns 400 invalid_request and no write;
    oversized input retains its distinct existing error class.
- id: A2
  text: Affected mutation requests with missing/invalid mandatory headers do not read their body; malformed
    Project artifact metadata causes no Project-store read after authentication.
- id: A3
  text: A precedence table covers the affected mutation families and preserves authorized valid requests,
    endpoint-specific media-type statuses, strict JSON rejection and Project ownership/deleting outcomes.
- id: A4
  text: Body-abort and no-read/no-store regressions fail against the original handlers; helper sharing
    does not become a grep-only acceptance criterion.
tests:
- command: go test -count=1 ./internal/httpapi/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make verify-public-api
  covers:
  - A1
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
