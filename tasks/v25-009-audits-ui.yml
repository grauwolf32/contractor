schema_version: "1.0"
id: V25-009
title: Add Project Audit creation, progress, coverage and report UI
milestone: audits-mvp
priority: P0
status: pending
implementation_commit: null
depends_on: [V25-004, V25-007, V25-008]
languages: [typescript, react]

goal: >-
  Let an owner configure and operate the one-round Audit MVP from the separate
  frontend while keeping the global Runs queue authoritative.

context:
  navigation: >-
    Add Project / Audits with Overview, Coverage, Checks, Runs and Report. The UI
    uses only generated public API types and existing WebSocket invalidation;
    it is independently built/deployed from the Go Server.
  truthfulness: >-
    Technical Run outcome, semantic assessment and Audit completion are distinct.
    Empty, partial and inconclusive coverage must never look like a passing audit.

scope:
  in:
    - Add Project Audit list/create flow with exact profile and compatible exact artifact selection.
    - Add start, pause-new-runs, resume, cancel and delete controls with revision preconditions and replay-safe feedback.
    - Render baseline/profile versions, state, budgets, coverage rows, explicit gaps, item attempts and child Run backlinks.
    - Render exact downloadable report/evidence links and safe terminal errors.
    - Handle loading/empty/error/refetch states without manual browser refresh.
  out:
    - Findings, human review, standards comparison, report editing or a separate Audit execution queue.

requirements:
  - {id: R1, text: UI never calculates authoritative Audit state or coverage from Run labels.}
  - {id: R2, text: Actions refresh from Server revision and surface stale-precondition conflicts rather than optimistic divergence.}
  - {id: R3, text: No secret or raw package content is cached in localStorage or route query parameters.}

acceptance_criteria:
  - id: A1
    given: A Project with compatible and incompatible artifacts.
    when: The user creates an Audit.
    then: Required exact selections are clear and invalid start is prevented/explained.
  - id: A2
    given: An Audit progresses through waiting Runs and mixed results.
    when: WebSocket updates or reconnect occurs.
    then: Overview, checks and coverage converge without reload and preserve distinctions.
  - id: A3
    given: Pause/cancel/delete conflicts or safe errors.
    when: The user acts.
    then: Controls recover to authoritative state and retain useful bounded diagnostics.

tests:
  - {name: unit, command: "cd ui && pnpm test -- --run", covers: [A1, A2, A3]}
  - {name: browser, command: "cd ui && pnpm exec playwright test", covers: [A1, A2, A3]}
