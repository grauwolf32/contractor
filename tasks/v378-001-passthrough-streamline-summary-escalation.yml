    covers: [A8]
  - command: go test ./internal/planner/... ./internal/scheduler/... ./internal/config/... ./internal/runstore/...
    covers: [A1, A2, A3, A4, A6, A7, A8]
  - command: make test-postgres
    covers: [A2, A5, A6]
  - command: make test-streamline
    covers: [A1, A2, A3, A7]
  - command: make test-runtime
    covers: [A1, A4, A8]
  - command: make test-wire-cross-language
    covers: [A4, A7, A8]
  - command: make verify-public-api
    covers: [A8]
  - command: make verify-public-api-postgres
    covers: [A5, A8]
  - command: make test-e2e
    covers: [A1, A2, A3, A4, A5, A6]
  - command: go run ./cmd/contractor server config validate --root ./configs
    covers: [A8]
