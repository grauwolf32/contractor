schema_version: '1.0'
id: V45-003
title: Batch Audit finding related reads
milestone: server-maintainability
priority: P2
status: in_progress
depends_on: []
languages:
- go
goal: Batch Audit finding related reads.
context:
  verified_evidence: ListFindings hydrates receipt, decision and assessment for each row while the primary
    PostgreSQL result remains open.
  current_contract: Behavior-preserving refactoring of the existing Go Server. Preserve exact pinned identities,
    authority checks and operation/resource ownership. Tests describe the required verification, not measured
    production performance.
scope:
  in:
  - Read and close the base page before loading related records.
  - Load receipts, decisions and assessments in bounded batches with exact owner and Audit checks.
  - Batch receipt holds and exact artifact reads as well as the outer finding projection; preserve blob
    backend integrity checks and transfer bounds.
  - Separate finding reads and hydration from review commands and provenance where it improves locality.
  out:
  - Public response changes, authorization changes, generic ORM and goroutines as a substitute for batching.
requirements:
- id: R1
  text: Keep dependencies explicit and changes confined to this task; preserve unrelated working-tree
    changes.
- id: R2
  text: Use existing behavior tests and add regressions for newly exposed boundaries or bounded query
    counts.
acceptance_criteria:
- id: A1
  given: The current Server contracts and supported input fixtures.
  when: The refactored path executes.
  then: Pages containing 1, 5 and 30 findings use a fixed or explicitly bounded related-query count.
- id: A2
  given: Failures, boundary cases and existing lifecycle behavior.
  when: The relevant regression suite runs.
  then: Ordering, pagination, missing optional decisions/assessments and owner isolation match existing
    behavior; a single-connection pool can serve the page.
tests:
- name: postgres-race
  command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -race -count=1 ./internal/artifacts
    ./internal/auditservice ./internal/findingintake ./internal/httpapi/public
  covers:
  - A1
  - A2
- name: diff
  command: git diff --check
  covers:
  - A1
  - A2
