schema_version: "1.0"
id: V372-026
title: "Move the Project, Audit and review request digests out of the public handlers"
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [go]
goal: "The idempotency request digests of Project creation, Audit creation and lifecycle actions and Audit review mutations are computed by the packages that own those requests, as runservice.PublicRequestDigest does for Runs, with their pinned values unchanged."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; first noted in V370-009; file:line verified on b2b09ea"
  specification: "docs/spec/api/public-api.md#API-R69"
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds; the four functions are
    still in internal/httpapi/public and their lines were re-read. Their
    values are already pinned by TestRequestDigestsArePinned and
    TestAuditRequestDigestBindsEveryAction
    (internal/httpapi/public/request_digest_test.go:14-56), which the move
    carries along instead of writing new pins. The Project digest now
    includes activeChecks (b8a9e325, V380). V407-021 delivered the
    Idempotency-Key grammar half of the old cross-reference to V371-016
    (archived as delivered by V407-021).
  finding: >-
    V370-009 moved the Run creation digest into runservice
    (internal/runservice/digest.go:16, PublicRequestDigest) and left the
    others in the edge: projectRequestDigest
    (internal/httpapi/public/project_handlers.go:258-272, called at :67),
    createAuditRequestDigest and auditRequestDigest
    (internal/httpapi/public/audit_models.go:145-167 and 172-180, called at
    audit_handlers.go:155, 324 and 404) and reviewRequestDigest
    (internal/httpapi/public/audit_review_handlers.go:394-401, called at :164
    for review requests and :264 for review and action review decisions).
    The digest decides whether a repeated Idempotency-Key replays or is the
    idempotency conflict (API-R69, PER-R24), so its canonical form is part
    of the owning context's rule: another caller of the same service cannot
    reproduce it without copying edge code, and a change to a request shape
    has to be mirrored by hand. auditRequestDigest and reviewRequestDigest
    also discard the json.Marshal error. V370-009 noted that projectstore has
    no service layer and auditservice could own the Audit digests; that is
    still so (internal/projectlifecycle owns Project deletion, not creation).
    Predates the shallow history (boundary 6349621).
  siblings: >-
    Run creation (runservice, done) and the Eval mutation digests, which
    evaldomain computes from the document (evaldomain.Digest, used by
    internal/evalservice/audit_adapter.go:96-206 and member_resources.go:127).
    Runtime configuration management and publication digest their requests
    in runtimeconfig (management.go:287, publisher.go:114), not the edge. The
    keyed mutations that store these digests since V370-007
    (mutation_receipts) only compare them. The Idempotency-Key grammar was
    V371-016, delivered by V407-021.
scope:
  in:
    - "Each digest moves next to the request type of its owner (projectstore for Project creation, auditservice for Audit creation, lifecycle actions, review requests and decisions), returning the encoding error instead of discarding it, with the existing pinned values moved into the owner's tests."
    - "A source check in internal/httpapi/public tests that fails if a non-test file there computes a request digest (calls contentdigest or defines a *RequestDigest function)."
  out:
    - "The digest values, replay and conflict behaviour, and the Idempotency-Key grammar."
acceptance_criteria:
  - id: A1
    given: "the non-test Go files of internal/httpapi/public"
    when: "the source check runs"
    then: "none computes a request digest, and a probe function there that does fails the check"
  - id: A2
    given: "the pinned digests of request_digest_test.go on b523ae77"
    when: "the moved functions compute them"
    then: "every value is unchanged, so stored receipts keep replaying"
  - id: A3
    text: "Existing Project, Audit lifecycle and review handler tests, including their PostgreSQL replay tests, pass unchanged."
tests:
  - command: "go test ./internal/httpapi/public ./internal/auditservice ./internal/projectstore ./internal/runservice"
    covers: [A1, A2, A3]
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/httpapi/public ./internal/projectstore ./internal/auditservice"
    covers: [A2, A3]
  - command: make lint
    covers: [A1, A2]
