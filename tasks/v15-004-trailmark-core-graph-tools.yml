schema_version: "1.0"
id: V15-004
title: Expose core Trailmark graph navigation tools
milestone: workspace-code-analysis-mvp
priority: P0
status: pending
implementation_commit: null
depends_on: [V15-002, V15-003]
languages: [python]

goal: >-
  Complete the graph-navigation MVP by exposing graph_summary, find_symbol,
  find_callers and find_callees through the allocation child and advertising
  them only on a successfully probed local workspace Runtime.

context:
  placement: >-
    CodeAnalysisToolsetFactory already advertises shallow tools after V15-002.
    Extend its positive probe result with these four operations only when the
    provider capability says storage=local and V15-003's offline child probe
    passes. A memory Runtime or local Runtime with a failed Trailmark probe
    remains shallow-only.
  identity: >-
    Trailmark name lookup returns the first match and is unsafe for duplicate
    names. Contractor find_symbol is the sole name resolver. Map every graph
    node to an allocation-key-protected opaque symbolId bound to workspace
    digest plus complete upstream ID; relationship tools accept only that exact
    ID and a Router sibling cannot reuse it.

scope:
  in:
    - Add model-visible typed tools graph_summary, find_symbol, find_callers and find_callees sharing one child-backed allocation session.
    - Project only bounded symbol ID/name/kind, relative path/line and call-confidence fields; strip host paths and arbitrary Trailmark attributes.
    - Return all equal-name find_symbol candidates with deterministic cursor pagination instead of selecting one.
    - Reject name strings in relationship tools, unknown IDs and IDs from an older digest with stable non-content-bearing errors.
    - Rebuild the child automatically when the next call observes a changed WorkspaceSnapshot digest.
    - Bound ordinary pages to 1..200 and query/IPC deadlines to the V15-003 limits.
    - Add exact local/memory/broken-dependency capability tests and Server placement containment tests for mixed shallow/core selections.
    - Ensure each returned tool closes the shared session idempotently through normal allocation ToolInstance cleanup.
  out:
    - Paths, attack-surface, complexity or exception tools; raw graph IDs/objects; graph persistence; AgentTemplate/config additions.

requirements:
  - {id: R1, text: Core graph tools are advertised only when their complete child-backed contract can run on a local workspace Runtime.}
  - {id: R2, text: find_symbol exposes ambiguity; every relationship call requires one exact opaque symbolId and cannot silently resolve a bare name.}
  - {id: R3, text: Every row uses relative workspace paths and every response carries exact bounded graph coverage.}
  - {id: R4, text: A workspace digest change invalidates IDs and graph state before any later query is answered.}

acceptance_criteria:
  - id: A1
    given: Memory, healthy-local and shallow-only-local Runtime capability snapshots.
    when: Registration and placement run.
    then: They advertise 2, 6 and 2 code-analysis operations respectively, and exact selected-tool containment chooses only a complete candidate.
  - id: A2
    given: Two files defining the same bare symbol plus distinct callers/callees.
    when: find_symbol and relationship tools run.
    then: Both candidates are returned, their IDs select different exact nodes, and passing the bare name is rejected.
  - id: A3
    given: Direct or overlay content changes after a graph response.
    when: A new graph call uses an old ID and then performs a fresh find.
    then: The old ID is stale, the child is replaced, and fresh results correspond only to the new effective snapshot.
  - id: A4
    given: Trailmark returns absolute mirror locations and large/custom attributes.
    when: Responses, errors, metrics and logs are serialized.
    then: Only bounded relative slim fields escape and no mirror/host path is retained.

tests:
  - {name: core-tools, command: "cd runtime && uv run pytest -W error tests/test_code_analysis_graph.py -k 'summary or symbol or callers or callees'", covers: [A2, A3, A4]}
  - {name: capability, command: "cd runtime && uv run pytest -W error tests/test_capabilities.py tests/test_factories.py tests/test_trailmark_probe.py", covers: [A1]}
  - {name: placement, command: "go test ./internal/controlplane ./internal/config", covers: [A1]}
  - {name: aggregate, command: "make test-code-analysis-runtime", covers: [A1, A2, A3, A4]}

decisions:
  - >-
    Opaque Contractor symbol IDs prevent Trailmark implementation IDs and
    scratch paths from becoming a compatibility contract while preserving
    exact selection within one workspace digest.
