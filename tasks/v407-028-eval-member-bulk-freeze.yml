schema_version: "1.0"
id: V407-028
title: "Freeze Eval members with one set-based insert instead of one statement per member"
milestone: server-runtime-review-2026-10
epic: evals
kind: defect
introduced_by: V38-003
priority: P2
status: pending
depends_on: []
languages: [go, sql]
goal: "Freezing a plan with MaxMembers members is one bounded statement whose cost does not hold the Project lock for thousands of round trips."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding C1; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/evals/managed-evals.md
  severity: medium
  finding: >-
    internal/evalstore/experiments.go:296-330 persistPlan inserts
    eval_members one row at a time in a Go loop, up to Budgets.MaxMembers
    (evaldomain MaxMembers = 10000; native plans 1000), inside one transaction
    that holds the Project FOR SHARE, the experiment FOR UPDATE and the
    receipt advisory lock. Each INSERT fires the row trigger
    contractor_eval_member_bound (a SELECT on eval_experiments) and the
    statement trigger contractor_eval_members_inserted (inserts a projection
    row and upserts eval_projection_queue, bumping its revision), so a
    10k-member registration is about 10k round trips plus 20k trigger
    executions while every other mutation of that Project waits. The only
    realistic-size test (internal/evalstore/comparison_pages_postgres_test.go:46-93)
    seeds members with a bulk insert, bypassing the production path.
  siblings: >-
    Other per-row insert loops in internal/evalstore and
    internal/auditstore (grep 'for _, ' near Exec in *_sql callers).
plan:
  - "Replace the loop with one INSERT ... SELECT FROM unnest($1::text[], $2::text[], ...) (as pgstore's round statements do), so the statement trigger fires once and the row trigger stays per row but in one statement; move the SQL to experiments_sql.go."
  - "Change the comparison-pages test to seed through FreezePrepared/Create and add a test that freezes a MaxMembers plan within the statement and query budgets, asserting one eval_projection_queue revision bump."
scope:
  in:
    - "Set-based member insert; realistic-size test through the production path."
  out:
    - "Member bounds and projection semantics."
acceptance_criteria:
  - id: A1
    text: "Freezing 10000 members issues one insert statement and bumps the projection queue revision once."
  - id: A2
    text: "The freeze completes within the statement and query budgets on real PostgreSQL; the existing comparison tests pass seeded through the production path."
  - id: A3
    text: "The revision-bump assertion fails on the unfixed code (10000 bumps)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/evalstore/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1]
