  review: "docs/research/2026-10-23-server-runtime-review.md"
  finding: >-
    The review lists about 75 findings across sections B to G and seven open
    questions in section I that needed running code or a product decision:
    listProjectAudits query count, Runtime-side deadline enforcement, ADK
    session state readers, Audit openapi-operations@1 bounds, long lock holds
    in document and analysis sessions, renewClaim clock skew, and three
    projectfs test failures on macOS. Lesson 3.6: 28 of 127 completed fix
    tasks in the 2026-10-04 review were partial.
plan:
  - "Answer each open question in section I by running the named test or reading the code on current main; file a follow-up task for anything that turns out to be a defect."
  - "Walk sections B to G and for every finding record in the report's Status section the closing task, or 'declined' with the reason and the detection signal if a risk is accepted (AGENTS 3.9)."
  - "Run make release-verify (make -k) on the branch that lands the last task and record the outcome in the report."
  - "Remove the report's row from docs/research/README.md only if no open task cites it (README rule)."
scope:
  in:
    - "Status section, open-question answers, follow-up tasks, release gate run."
  out:
    - "New fixes beyond follow-up task creation."
acceptance_criteria:
  - id: A1
    text: "Every finding in the report has a closing task ID or a recorded decision in the Status section."
  - id: A2
    text: "Every open question has an answer with evidence (command and output, or file:line)."
  - id: A3
    text: "make release-verify passes on the landing revision and the result is recorded."
tests:
  - command: make release-verify
    covers: [A3]
  - command: make lint
