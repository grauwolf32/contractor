schema_version: '1.0'
id: V84-001
title: Remove unused UI API exports, query keys and subscription resume API
milestone: ui-api-dead-surface-2026-10
priority: P2
status: completed
implementation_commit: 04a8895c7ac5041986cf1e885abea01944850f5b
depends_on: []
languages: [typescript]
goal: Match the UI API and event surface to the code production owners actually call.
context:
  issue: https://github.com/grauwolf32/contractor/issues/303
  finding: Several API exports and query-key factories have no production callers; resume exists only for event tests while owners resubscribe.
scope:
  in:
    - Remove four unused audit/operations helpers and 12 query-key factories.
    - Remove subscription resume methods and test unsubscribe/resubscribe after authoritative refetch.
    - Correct the event-manager resync owner comment.
  out:
    - Change production event owner behavior or remove broad invalidation keys that have callers.
acceptance_criteria:
  - {id: A1, text: Dead helper definitions and unused query-key factories are gone.}
  - {id: A2, text: No resume method remains on either subscription interface or implementation.}
  - {id: A3, text: Event tests prove unsubscribe/resubscribe keeps other subscriptions live and discards late frames.}
tests:
  - {command: cd ui && ./node_modules/.bin/vitest run src/events/run-events.test.ts, covers: [A2, A3]}
  - {command: cd ui && ./node_modules/.bin/tsc --noEmit, covers: [A1, A2]}
  - {command: cd ui && ./node_modules/.bin/vitest run, covers: [A1, A2, A3]}
