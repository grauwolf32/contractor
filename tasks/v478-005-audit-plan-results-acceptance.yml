schema_version: '1.0'
id: V478-005
title: Expose honest plan progress and gate partial-result lifecycle
milestone: audit-plan-evidence-results-2026-11
epic: audits
kind: feature
priority: P1
status: pending
depends_on:
- V478-001
- V478-002
- V478-003
- V478-004
