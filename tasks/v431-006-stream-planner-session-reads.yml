schema_version: '1.0'
id: V431-006
title: Consume Planner session batches without retaining every raw state
milestone: hub-audit-defects-2026-10
epic: planner-worker
kind: chore
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: Run detail and scan history decode a Planner session at a time while retaining only their required
  projections.
context:
  authority: 'User decision 2026-11-01: fix the RunStore review findings and simplify the implementation
    autonomously; create tasks, verify the changes and merge into main. Prefer existing mechanisms and
    no new tables.'
  finding: internal/runstore/planner_batch.go:20 accumulates every full state in a map before LoadPlans
    decodes it; 1024 states at the existing 2 MiB bound can retain 2 GiB of raw JSON in addition to final
    projections.
  siblings: Single/batch store paths and all production callers named in scope; existing public/wire contracts
    are preserved.
  specification:
  - docs/spec/execution/runs.md#RUN-R89
  - docs/spec/execution/runs.md#RUN-R90
scope:
  in:
  - Replace the unused-after-migration full-state map reader with a simple per-row consumer in the same
    single SQL statement.
  - Migrate LoadPlans and scan history, preserving identity, strict schema, missing-session and whole-read
    failure behavior.
  - Reuse one Planner session scanner for single and batch reads and keep one-query-per-collection semantics.
  - Do not add endpoints, tables, product limits, truncate plans or relax validation of persisted state.
  out:
  - Unrelated Audit redesign and the existing V425-015/V425-016 tasks.
acceptance_criteria:
- id: A1
  text: Production consumers process one raw state at a time and GetPlannerSessions is removed end to
    end.
- id: A2
  text: PostgreSQL batches with many sessions, empty/missing sessions and decode/consumer errors retain
    correct results and close rows on every outcome.
- id: A3
  text: Run detail and scan history tests preserve snapshot consistency, ownership and one query per collection.
tests:
- command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -race -tags=integration -count=1 ./internal/runstore/...
    ./internal/planner/session/... ./internal/runservice/... ./internal/httpapi/public/... ./internal/auditservice/...
  covers: &id001
  - A1
  - A2
  - A3
- command: make lint
  covers: *id001
