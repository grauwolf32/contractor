schema_version: '1.0'
id: V249-001
title: Include integration regressions in the release gate
milestone: release-gate-integration-coverage-2026-10
priority: P2
status: in_progress
depends_on: []
languages: [make, go, python]
goal: Ensure every integration-tagged regression has a reachable release-gate owner or an explicit tool-dependent exception.
context:
  issue: https://github.com/grauwolf32/contractor/issues/158
  finding: Hand-written release regexes omit concurrency and retention tests that protect multi-replica behavior.
scope:
  in:
    - Add PostgreSQL-only integration tests to release-verify without duplicate execution.
    - Keep restore and tool-dependent tests on explicit gates.
    - Check that matrix owner tests and integration test names match reachable gates.
  out:
    - Change production concurrency or artifact behavior.
acceptance_criteria:
  - {id: A1, text: The release gate selects each named PostgreSQL-only integration regression.}
  - {id: A2, text: New or renamed integration tests fail coverage checks unless allowlisted with reason.}
  - {id: A3, text: Audit matrix owner tests must match their declared gate.}
  - {id: A4, text: Focused integration tests and release graph checks pass.}
tests:
  - {command: python3 scripts/check_release_verify_graph.py, covers: [A1, A2]}
  - {command: go test ./tests/e2e/audits_matrix_test.go, covers: [A3]}
