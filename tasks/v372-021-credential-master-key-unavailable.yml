schema_version: "1.0"
id: V372-021
title: "Answer an LLM or Runtime credential operation without the master key with a registered non-retryable code"
milestone: hub-audit-defects-2026-10
epic: runtime-config
kind: defect
priority: P2
status: in_progress
depends_on: []
languages: [go, yaml, typescript]
goal: "A credential operation on a Server that has no credential master key answers a registered, non-retryable code that tells the operator what is missing, as the Git key path already does, instead of the retryable 500 internal_error."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; first noted in V370-010; file:line verified on b2b09ea"
  specification: "docs/spec/configuration/runtime-config.md#RCF-R44"
  severity: medium
  finding: >-
    A Server may start without the master key while no credential row
    exists (RCF-R44). TokenCipher returns credentials.ErrKeyUnavailable when
    it has no key (internal/credentials/crypto.go:57, 119 and 173), and so do
    LLM credential creation and rotation (credentials/lifecycle.go:289 and
    506) and the Runtime credential repository (runtime_repository.go:40 and
    48). ErrKeyUnavailable has no public kind by design
    (credentials/types.go:30-33), so the public API answers 500
    internal_error with retryable true (docs/spec/platform/errors.md:371,
    API-R73). No retry can succeed until an operator configures the key, the
    browser and the CLI retry anyway, and the answer does not say what is
    missing. The Git key, encrypted with the same master key, already
    answers 503 git_key_unavailable with retryable false (ErrGitKeyUnavailable,
    credentials/git_keys.go:27; errors.md:366). The behaviour predates the
    shallow history (boundary 6349621); V370-010 recorded it and left it
    out of scope.
  siblings: >-
    Every path that returns ErrKeyUnavailable to a handler: LLM credential
    create, rotate and delete, Runtime credential create and delete, and
    the credential reads that decrypt. Ruled out: Run placement and Planner
    construction report the missing key as the attempt diagnostic
    credential_key_unavailable (internal/httpapi/public/error_diagnostics.go:41-42
    and the Scheduler's credential failure), which already says what is
    wrong; startup with encrypted rows but no key is refused (RCF-R44). The
    UI shows credential errors on the Operations credential pages; their
    message for the new code comes from the registry.
scope:
  in:
    - "A registered code (for example credential_key_unavailable, 503, retryable false) reported through a narrowed kind of ErrKeyUnavailable on every path above; errors.md regenerated, RCF-R44 and the failure-model row name the answer, and the OpenAPI responses of the affected operations list it."
    - "Handler tests on a Server without the master key for LLM and Runtime credential creation and deletion."
  out:
    - "Running without a master key, key rotation and keyrings."
failure_outcomes:
  - operation: "LLM or Runtime credential mutation or decrypting read without a master key"
    permanent: "The new code, 503, retryable false; nothing is written and no Gateway call is made."
    retryable: "None: the condition lasts until an operator configures the key and restarts the Server."
    ambiguous: "Not applicable: the operation stops before any write."
    cancelled: "Unchanged."
    timeout: "Unchanged."
acceptance_criteria:
  - id: A1
    given: "A Server started without a credential master key"
    when: "An LLM or Runtime credential is created or deleted through the public API"
    then: "The answer is the registered non-retryable code with its message, and nothing is stored."
  - id: A2
    text: "The browser client and the CLI do not retry that answer."
  - id: A3
    text: "The handler tests fail on b2b09ea."
tests:
  - command: "go test ./internal/credentials ./internal/apierror ./internal/httpapi/public"
    covers: [A1, A3]
  - command: "cd ui && corepack pnpm test --run src/api"
    covers: [A2]
  - command: "make verify-public-api"
    covers: [A1]
  - command: make lint
    covers: [A1, A2, A3]
