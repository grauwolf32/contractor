worker_results_state_planning_review:
  reviewed_on: "2026-09-04"
  verdict: ready_to_implement_in_dependency_order
  source_reference:
    repository: /home/ruslan/src/contractor-old
    reviewed_revision: 9c76b56cf7b83377fb1dd5e4a17440fa27b723f3
    retained_ideas:
      - Structured per-subtask semantic Worker output.
      - Deterministic tool/file observations separated from model claims.
      - Per-invocation filesystem interactions and explicit incomplete coverage.
    rejected_implementation_details:
      - Global fsspec coupling and implicit State-key access by model tools.
      - Arbitrary result-format recovery and model-authored observation fields.
  checks:
    - >-
      Result ownership is explicit: the main Worker model authors only bounded
      semantic text, the mandatory tool-free finalizer serializes its exact text
      plus Runtime's authoritative subtaskId, and Runtime rejects any rewrite;
      Runtime owns trusted metadata and technical failures, Planner owns
      StageResult and Scheduler owns durable acceptance/policy.
    - >-
      V17-001 adds inert compatible wire types; V17-002 supplies revisioned
      State/correlation before V17-003 atomically changes A2A and Planner
      adapters, keeping every task commit buildable.
    - >-
      One ADK plugin owns callback correlation, while typed reducers and
      per-tool safe extractors prevent generic argument/result retention and
      preserve current ExecutionReport semantics.
    - >-
      Workspace coverage describes model-visible operations. Tree-sitter and
      Trailmark internal scans retain their distinct analyzer coverage and do
      not falsely mark every parsed file as read.
    - >-
      The Runtime state route is GET-only and exposes the full bounded
      Contractor schema, never raw ADK State. Go Planner tools load that
      snapshot and apply fixed typed projections without model-selected keys.
    - >-
      Correlation through hidden allocation/invocation/subtask/revision data
      closes the sequential-allocation race; those values are removed before
      Planner model output and durable facts.
    - >-
      RuntimeSettings and credentials remain constructor-injected outside ADK
      State. Allocation prepare is the only initial configuration channel;
      per-task semantic data remains StageContentRequest and shared mutable
      facts remain Memory/artifacts.
    - >-
      V18 depends on the complete V17 release gate and implements terminal
      summarization independently from ADK conversation compaction. Disabled
      AgentTemplates retain the exact pre-feature hard-budget path.
    - >-
      All ten new tasks are self-contained, independently testable and have
      implementation_commit null until their implementation task is completed.
  accepted_risks:
    - >-
      The first lean@1 observation composition is intentionally evaluable, not
      permanently universal. Future alternatives need a new profile identity.
    - >-
      A 10000-path/4 MiB live State bound can make workspace coverage partial;
      projections expose lower bounds and refuse exact unread results instead
      of consuming unbounded Runtime memory.
    - >-
      Live detailed paths disappear on release and are not available in UI or
      historical inspection. Durable support would require a separately
      reviewed privacy/retention contract.
    - >-
      Missing provider usage cannot trigger the initial token-based summarizer,
      and a context rejection that happens before a safe boundary remains a
      Worker failure. The independent hard call/tool limits still terminate it.

