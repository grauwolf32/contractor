schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  current_delivery_focus: >-
    User decision 2026-11-02 splits the actual shipped Audit YAML rewrite between the tasks delivering
    its behavior: V64-002 owns six observation/tracing/scan programs and V64-012 owns eight checklist/standard
    assertion programs, including required Workflow/template/instruction bindings and real callers.
    Rewrite ordinary pre-release catalog content directly; add no legacy reader/executor or unsupported-profile
    compatibility mode. V64-010 verifies the integrated catalog and removes remaining obsolete callers,
    rather than postponing these YAML rewrites. Dependencies and pending implementation gates are unchanged.
    User decision 2026-11-01 rejects codex/project-problem-findings: its unmerged head is archived as
    archive/v64-014-project-problem-findings-2026-11-01. V64-014 is in progress and must move the existing
    Finding model to Project scope with one current state and command owner. Sources/results/history
    are not mutable Audit Findings or another lifecycle. V64-014 migrates current reads/edits and removes
    Finding-specific reviews; V411-010 removes remaining item/report approvals using those same commands.
    User review 2026-11-01 clarifies V64-014 admission: explicit problem publication requires selected
    exact evidence, while evidence-optional proposals remain ordinary retained results/receipts without
    automatic confirmation. Old Audit facts and snapshots survive only as opaque immutable Artifacts; the operational Finding/intake
    model starts empty. Current Project assessment is unset until an explicit Project edit; V64-014 owns those direct Finding commands.
    V64-014 acceptance includes real concurrent equal-key admission and bounded large-history traversal.
    User clarification 2026-11-01 keeps V64-014 to Project finding ownership and retained contributions
    using existing deduplication, intake receipts, correlation fence and Run-to-Project Artifact forks.
    The existing Run-to-Project path removes the technical prerequisite on V64-004: V64-014 depends
    only on completed V64-001; V64-002 still integrates both. Semantic comparison, new matching rules
    and a second deduplication engine are outside V64-014. Implementation was assigned on 2026-11-01. Later user decisions discard old operational Findings/intake, archive old Audit facts and snapshots as opaque immutable Project Artifacts, and remove execution compatibility.
    User clarification 2026-11-01 keeps V64-004 to the existing role-output collection and dependent
    RunService input path, using real Audit Artifact scope and per-artifact exact forks/publication.
    Multiple explicit Workflow inputs remain supported. Automatic report-link/dependency collection
    is not a current priority; no universal composite format, resolver or new coordinator belongs in
    V64-004. The existing V410-025 owns its concrete sitemap snapshot/original-input composition after
    the basic primitives. New workspace-specific mandatory cases extend the existing composition gate.
    User request 2026-11-01 authorized implementing the three review defects from completed V64-001:
    V64-020/021/022 (completed, P1, introduced_by V64-001). V64-020 accepts an explicitly empty
    proposal from an optional generator; it does not require generation or allow blank hypothesis text.
    V64-021 validates effective initial-task input requiredness; V64-022 bounds initial/generated seed
    content. Their respective consumers V64-013, V64-002 and V64-012 depend on the fixes, bringing
    them into the existing V64-011 base gate. These local validator fixes do not authorize dependent implementation.
    Audit task-formation request 2026-10-31: after accepting the common execution skeleton the user
    requested concrete tasks. Sixteen existing pending tasks form the base package (12 core, 3 HTTP,
    one report-bound regression); their scope/acceptance reflects the accepted result/finding distinction.
    Implementation is a subsequent step. Replanned Audit-dependent tasks carry this explicit implementation
    gate; dependency completion alone does not authorize their execution. V64-001 finalizes the remaining
    explicitly labelled contract proposals; accepted structural decisions are not reopened. User clarification
    2026-10-31 removes the old approvals mechanism rather than introducing an approval migration or compatibility
    protocol. V64-001 is delegated to a separate implementation agent; this clarification does not start dependent
    tasks. User decision 2026-10-31
    separates a parallel sitemap lane: V410-006 ships standalone discovery/reconciliation Runs and
    V410-007 gates their independent scale/lifecycle slice. Their completed prerequisites and ordinary
    task policy control selection; the Audit review gate does not apply to V410-006/007 or their
    optional V410-008/009 follow-ups. New V410-025 owns the later Audit task/workspace/profile
    integration after V410-007 and V64-002; V411-014/020 depend on it. This planning change starts no
    implementation. User clarification accepted on 2026-10-31: investigation, checking and generation
    use the same accepted-task/ordinary-Run/result path. No mandatory discovery-finding-generator
    sequence exists; initial work may check authored hypotheses or generate from selected materials,
    and an Audit can complete without findings or generation. Use one Audit task/Run
    coordination path, exact Audit/Project Artifact handoff/publication, Project findings with
    deduplication and immutable source contributions, and Audit-owned hypotheses with stable owner-
    independent IDs/revisions. User clarification accepted on 2026-10-31: ordinary check outputs
    retain supported/refuted/inconclusive results with tested conditions; AppSec findings record
    evidenced problems and remain optional. Negative results feed history and later generation,
    without a separate assessment ledger. Trusted task/Run context derives hypothesis links automatically;
    exploration can have no hypothesis. Remove formal approval requests/report acceptance and
    replace them with pinned operation policy and optional direct annotations. Basic task owners are
    V64-001/004/014/002/012/013/008/009/010/011 plus V411-010/011; HTTP evidence/fixture/demo remain
    V411-007/019/015 and the report bound remains V425-017. V64-003, V64-006 and V64-007 are
    archived as merged into V64-002/012/013, not implemented. V64-005/015/016/017/018 stay optional
    pending extensions outside V64-011. Deferred V61/V62-008 and in-progress unrelated work are
    unchanged. User decision 2026-10-31: Sweep is not a product entity. Concrete target scans belong
    to ordinary Project Audits and selected Workflows. V425-033 removes the independent local and
    durable sweeps, their API/CLI and persistence through the existing web-scan Audit path. This
    supersedes preservation of cross-Project sweeps in V406-018. Implementation was authorized on
    2026-10-31; V425-035 separately repairs the existing custom-rule Audit input read bound required
    by the replacement demonstration. Pentest delivery revised by the user on 2026-10-30: V422-002
    and V422-003 are completed on main; preserve their recorded implementation and verification. The
    early HTTP demonstration V411-015 now follows the lean Audit coordinator V64-002, actual capture
    V411-007 and private fixture V411-019. Keep the base HTTP path independent of browser, callback,
    scanners and V64. V411-020 accepts the composed slice after its revised prerequisites, and
    V411-021 separately evaluates live quality. V411-006/008/009/012 and V412-002 are archived
    historical designs and cannot be prerequisites of active delivery. V422-003 delivered Nuclei
    integration with local HTTP authority; V412-005 is the remaining ffuf integration. No action
    journal, global HTTP quota, automatic login, separate preflight API or proof/recipe framework is
    scheduled by the remaining tasks. This replaces the 2026-10-24 pentest execution order, without
    starting implementation in this planning change. Unrelated delivery directions retained from
    2026-10-24: the sitemap lane proceeds through V410-006/007 and optional V410-008 after its
    completed foundations. The V414 follow-ups run in groups that share code (secrets and telemetry;
    Evals; Planner session and store error classes; SQL read bounds; OpenAPI rules and byte bounds;
    Audit read model; Server lifecycle; Runtime; finding fence) and close through V414-027. This is
    delivery order, not an additional technical dependency. The 2026-10-24 research-only task graph
    is superseded by the reviewed planning package; completed V62 history stays intact. The new
    review gate controls Audit-dependent replanned work; the independent sitemap exception above
    supersedes the earlier blanket gate. Optional model-ranking evidence belongs to V64-016, not
    the deterministic core exit. V61 and V62-008 remain deferred. The earlier evening resumption
    covered tasks not blocked by V62; the newly pending shared tasks can now enter execution once
    their prerequisites complete. Each lane works on its branch claude/<lane> and merges each closed
    task into main; the coordinator assigns migration numbers before lanes merge. Synchronised on
    2026-10-25 after every lane closed its task: next, before other V410-V414 work, the follow-ups
    the lanes found (V414-034 to V414-039), then the remaining queues with five or six lanes, not
    ten, because ten parallel Go and PostgreSQL suites overloaded the machine and made real-deadline
    tests fail.
  task_files_are_self_contained: true
  task_statuses:
    pending: Not yet taken into development.
    in_progress: Taken into development; implementation or verification is ongoing.
    deferred: Explicitly on hold after review; must not be selected until the user reactivates it.
    completed: Finished under completion_rule and implementation_commit_rule.
    archived: Deferred out of the active backlog; retained evidence does not imply completion.
  task_status_rule: >-
    Set status to in_progress in the task file before beginning implementation.
    Keep it in_progress while implementation or required verification remains;
    an intermediate commit does not complete the task. Set status to completed
    only after completion_rule is satisfied, and record implementation_commit.
    Only completed tasks satisfy dependencies; pending and in_progress are
    unfinished. Do not independently take an in_progress
    task already being worked on unless explicitly assigned to continue it.
    Exclude deferred tasks from eligible work even when dependencies are complete.
    They do not satisfy dependencies. Preserve their scope and record the date,
    previous status, reason and reactivation condition in deferral. Dependency
    completion alone never reactivates a deferred task; explicit user direction
    and a reviewed scope are required before changing it back to pending.
    Exclude archived tasks from active work and backlog counts; they do not
    satisfy dependencies. Retain their original scope and evidence together
    with the archive date, previous status and reason in the task file.
  task_location_rule: >-
    Task files are the index. Open tasks (pending, in_progress, deferred) live
    in tasks/; finished tasks (completed, archived) live in tasks/done/. The
    commit that sets a terminal status moves the file with git mv and repoints
    links to it. scripts/check_tasks.py (make lint) enforces location, declared
    statuses, priorities, epics and kinds, unique IDs matching file names,
    full implementation commits, known dependencies and introduced_by
    references, and milestone exit tasks. tasks/BACKLOG.md is generated from
    the files by make tasks-backlog, and make lint rejects a stale copy.
  task_classification_rule: >-
    Every task names its epic, one of the stable areas declared in
    tasks/epics.yml, and its kind: feature (adds or extends a capability),
    defect (corrects behaviour that was wrong) or chore (no intended behaviour
    change: tests, CI, dead code, refactoring, documentation, schema
    consolidation). A defect or chore that repairs earlier work names that
    task in introduced_by whenever it can be identified. Milestones remain
    delivery slices; group defects by epic instead of declaring a milestone
    per defect.
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies. Each task states its scope,
    authority, dependencies and acceptance locally. Normative documents explicitly
    named in context.specification, context.design, context.format or
    context.proposal are required contract inputs; unlisted design documents and
    earlier conversation are not prerequisites. A normative format must be
    resolved before its dependent implementation is marked ready.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.
    P2: Planned follow-up that is intentionally outside the first releasable slice.
    P3: Low-impact correction with no user-visible failure, such as documentation, dead code or test hygiene.

