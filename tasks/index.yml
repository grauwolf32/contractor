schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  task_files_are_self_contained: true
  task_statuses:
    pending: Not yet taken into development.
    in_progress: Taken into development; implementation or verification is ongoing.
    deferred: Explicitly on hold after review; must not be selected until the user reactivates it.
    completed: Finished under completion_rule and implementation_commit_rule.
    archived: Deferred out of the active backlog; retained evidence does not imply completion.
  task_status_rule: >-
    Set status to in_progress in the task file before beginning implementation.
    Keep it in_progress while implementation or required verification remains;
    an intermediate commit does not complete the task. Set status to completed
    only after completion_rule is satisfied, and record implementation_commit.
    Only completed tasks satisfy dependencies; pending and in_progress are
    unfinished. Do not independently take an in_progress
    task already being worked on unless explicitly assigned to continue it.
    Exclude deferred tasks from eligible work even when dependencies are complete.
    They do not satisfy dependencies. Preserve their scope and record the date,
    previous status, reason and reactivation condition in deferral. Dependency
    completion alone never reactivates a deferred task; explicit user direction
    and a reviewed scope are required before changing it back to pending.
    Exclude archived tasks from active work and backlog counts; they do not
    satisfy dependencies. Retain their original scope and evidence together
    with the archive date, previous status and reason in the task file.
  task_location_rule: >-
    Task files are the index. Open tasks (pending, in_progress, deferred) live
    in tasks/; finished tasks (completed, archived) live in tasks/done/. The
    commit that sets a terminal status moves the file with git mv and repoints
    links to it. scripts/check_tasks.py (make lint) enforces location, declared
    statuses, priorities, epics and kinds, unique IDs matching file names,
    full implementation commits, known dependencies and introduced_by
    references, and milestone exit tasks. tasks/BACKLOG.md is generated from
    the files by make tasks-backlog, and make lint rejects a stale copy.
  task_classification_rule: >-
    Every task names its epic, one of the stable areas declared in
    tasks/epics.yml, and its kind: feature (adds or extends a capability),
    defect (corrects behaviour that was wrong) or chore (no intended behaviour
    change: tests, CI, dead code, refactoring, documentation, schema
    consolidation). A defect or chore that repairs earlier work names that
    task in introduced_by whenever it can be identified. Milestones remain
    delivery slices; group defects by epic instead of declaring a milestone
    per defect.
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies. Each task states its scope,
    authority, dependencies and acceptance locally. Normative documents explicitly
    named in context.specification, context.design, context.format or
    context.proposal are required contract inputs; unlisted design documents and
    earlier conversation are not prerequisites. A normative format must be
    resolved before its dependent implementation is marked ready.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.
    P2: Planned follow-up that is intentionally outside the first releasable slice.
    P3: Low-impact correction with no user-visible failure, such as documentation, dead code or test hygiene.

