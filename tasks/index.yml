  intentional_differences:
    - >-
      Source code is a required application/zip Workflow input forked to
      inputs/source; Runtime never receives an arbitrary host project path.
    - >-
      Discovery reports and generated documents are explicit RunScope
      artifacts. A later Stage never reads an earlier Worker's sandbox.
    - >-
      Existing OpenAPI and LikeC4 documents are optional Workflow inputs and
      are copied into the document Agent's Namespace before mutation.
    - >-
      The default workflows rerun discovery. The old implicit cross-Run
      artifact-exists skip is represented later by explicit precomputed-input
      workflow variants, not hidden Scheduler state.
    - >-
      Old TaskRunner iterations/max_steps are not copied literally. One v2
      Stage is one bounded Planner/Worker invocation; whole-Stage retry remains
      explicit in Workflow transitions and the deployment Planner deadline is
      the hard wall bound.

