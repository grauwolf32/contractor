agent_skills_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_after_label_runtime_p0
  checks:
    - >-
      The design reuses ordinary owner UserScope Artifact PUT/GET/history and
      exact UserScope-to-RunScope forks. SkillCatalog is an internal validation
      and resolution boundary, not a new HTTP API, Artifact scope, SQL model or
      Runtime credential.
    - >-
      AgentTemplate contains optional versionless skills ArtifactRefs, with
      omitted and explicit empty sets normalized identically;
      WorkflowRun resolves all current/later/escalation template refs once and
      stores exact owner source, Run fork and package digest before scheduling.
    - >-
      V10-001 owns the hostile-package contract, V10-002 owns SkillCatalog and
      bundled initialization, V10-003 owns template/Run pinning, V10-004 owns
      wire parity and V10-005 owns only Runtime/ADK lifecycle. Their boundaries
      do not require a worker to infer behavior from this specification.
    - >-
      The P0 path ends at V10-007 after LikeC4 migration and exercises the
      production Artifact API for package update, exact old/new Run pinning,
      native ADK functions and slot cleanup without direct state fixtures.
      Skill-enabled LikeC4 templates and Workflows are additive versions;
      existing versioned configuration remains unchanged.
    - >-
      The remaining eight contractor-old packages are split by compatibility
      risk. Analysis packages can migrate independently; live-testing packages
      wait for V9-005 so old auth memory conventions can be rewritten against
      the final MemoryTools contract. None is assigned to a mismatched Worker.
    - >-
      V10-010 joins the completed label and Memory hardening gates and owns
      update-vs-initialize races, dual validation, reserved-Namespace attacks,
      content redaction, cleanup faults and the exact nine-package inventory.
    - >-
      The pinned ADK build injects script guidance even without an executor.
      V10-005 therefore retains native list/load/resource implementations but
      owns an exact three-tool filter plus a script-free instruction adapter,
      both covered by its startup compatibility probe.
    - >-
      Every V10 task is self-contained, granular, has implementation_commit
      null until completion, and names focused deterministic tests plus an
      aggregate verification gate.
  accepted_risks:
    - >-
      Initial public authentication has one owner. Skills are therefore stored
      in that owner's UserScope; multi-owner shared/operator provisioning is
      deliberately deferred instead of introducing premature SystemScope/RBAC.
    - >-
      The generic Artifact API may store an invalid Skill ZIP. Authoring helper
      catches this early, but authoritative Server validation occurs only when
      a referencing Run initializes; unrelated ordinary Artifact behavior stays
      domain-neutral.
    - >-
      A versionless AgentTemplate ref intentionally means future Runs observe a
      newer owner current revision without a new template version. Exact Run
      source/fork pinning preserves execution reproducibility after creation.
    - >-
      ADK 2.8.0 natively includes run_skill_script and script-bearing guidance.
      Runtime retains native list/load/resource implementations but filters the
      script declaration and replaces only that generated guidance; startup
      probes make an upstream behavior change fail closed.

