schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  task_files_are_self_contained: true
  task_statuses:
    pending: Not yet taken into development.
    in_progress: Taken into development; implementation or verification is ongoing.
    completed: Finished under completion_rule and implementation_commit_rule.
    complete: Legacy alias of completed; existing task files remain valid.
  task_status_rule: >-
    Set status to in_progress in the task file before beginning implementation.
    Keep it in_progress while implementation or required verification remains;
    an intermediate commit does not complete the task. Set status to completed
    only after completion_rule is satisfied, and record implementation_commit.
    Treat complete and completed as finished when checking dependencies; pending
    and in_progress are unfinished. Do not independently take an in_progress
    task already being worked on unless explicitly assigned to continue it.
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies. Each task states its scope,
    authority, dependencies and acceptance locally. Normative documents explicitly
    named in context.specification, context.design, context.format or
    context.proposal are required contract inputs; unlisted design documents and
    earlier conversation are not prerequisites. A normative format must be
    resolved before its dependent implementation is marked ready.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.
    P2: Planned follow-up that is intentionally outside the first releasable slice.

fixed_decisions:
  server:
    language: Go 1.25
    module: github.com/grauwolf32/contractor
    http_stack: Go standard library net/http
    database_driver: github.com/jackc/pgx/v5
  runtime_agent:
    language: Python 3.13
    packaging: uv with a src-layout package
    agent_framework: Google ADK Python
    a2a_sdk: Official a2a-sdk Python package
    llm_client: >-
      A Contractor-owned ADK BaseLlm adapter speaks openai-compatible@1 directly
      through allocation-owned AsyncOpenAI. LiteLLM remains an external shared
      Gateway implementation and is not imported by each Runtime process.
  planner:
    mvp: >-
      passthrough@1 is deterministic Go code and makes one A2A call. It records
      a durable Contractor planner session but does not need an LLM or ADK event
      loop.
    first_slice: >-
      streamline@1 and router@1 use Google ADK Go with a PostgreSQL-backed
      SessionService and a bounded typed subtask plan. Streamline has exactly
      one logical Worker; Router selects among a fixed non-empty logical Worker
      mapping without observing physical Runtime Agent identities.
  a2a:
    protocol: A2A 1.0
    binding: HTTP JSON-RPC
    go_sdk: github.com/a2aproject/a2a-go/v2
  worker_model_boundary:
    reusable_behavior: AgentTemplate resolved instruction text and selected tools/skills
    task_input: Planner objective/instructions, opaque subtask ID, string parameters and named exact input refs
    model_output: >-
      Main Worker authors bounded terminal semantic text without output_schema;
      one mandatory tool-free ADK result finalizer copies the exact subtask ID
      and text into strict WorkerModelResult for ordinary completion. Planned
      V39 adds an explicit Audit-check strategy at the same completion boundary;
      it validates collected per-item data and constructs ZIP/WorkerResult in
      code without changing ordinary completion or the optional summarizer.
    result_projection: >-
      Runtime validates the subtask echo, stamps trusted identity, deterministic
      observations, summarized state and only current-invocation exact artifact
      refs; Planner separately owns StageResult.
    finalizer_accounting: >-
      The finalizer uses the same pinned model route and normal Worker
      maxModelCalls/maxTotalTokens accounting, makes exactly one call, cannot
      rewrite text and is distinct from optional terminal summarization.
  worker_live_state:
    storage: >-
      One bounded versioned Contractor subtree in allocation-local ADK State;
      cumulative metrics plus one current and one last-completed invocation.
    transport: >-
      Read-only mTLS Runtime endpoint for complete safe snapshots. There is no
      generic state mutation, public endpoint or durable state history.
    planner_access: >-
      Streamline/Router receive only explicit Server-side coverage/file/tool
      projections correlated to the newest WorkerCompletion; no raw state key,
      allocation, invocation or revision is model-selectable.
  worker_summarization:
    mode: >-
      Optional AgentTemplate-selected one-shot terminal summarizer at a
      deterministic provider-reported context-window boundary with an optional
      cumulative spending budget; omission disables it.
    isolation: >-
      Separate exact tool-free ModelPolicy over the same pinned Worker Gateway
      route, bounded model-visible transcript, Runtime-owned summarized flag and
      separately attributable metrics. ADK continuing compaction is deferred.
  worker_sessions:
    authoring: >-
      Each Stage selects isolated or shared; new authoring omission resolves to
      isolated before Run snapshotting, and old snapshots without the field
      retain their pre-feature shared behavior only at the legacy decode boundary.
    transport: >-
      Scheduler and Control Plane pin one explicit mode into every AllocationSpec.
      Planner and StageContentRequest carry neither the mode nor a session ID.
    runtime: >-
      One generic adk@1 Worker keeps allocation-owned Runner/resources. Isolated
      uses one lazily created session per invocation with bounded State but no
      event carry; shared lazily creates and reuses one session until release.
  run_metadata_labels:
    public_contract: >-
      The former top-level labels infrastructure-selector array is renamed
      runtimeLabels in one strict Server/UI cutover. labels becomes an
      independent bounded string map describing one concrete WorkflowRun.
    lifecycle: >-
      Metadata labels are immutable, owner-scoped, included in the Run-create
      idempotency digest and stored atomically with the Run. They never affect
      Workflow semantics, scheduling, placement, authorization, budgets,
      RuntimeConfig resolution, tools or artifacts.
    observability: >-
      Server propagates the bounded map to Planner root traces and through
      AllocationSpec to Worker root traces. Runtime treats it as opaque
      telemetry metadata, never model/State/tool input or high-cardinality
      metric dimensions.
    evaluation: >-
      purpose=eval plus eval.name/id/leg/fixture/case/sample is a client-owned
      convention. One sample is one ordinary isolated WorkflowRun and exact
      conjunctive Run-list filters recover its eval group without an eval-only
      Scheduler path.
  projects:
    boundary: >-
      An optional owner-scoped Project groups reusable ProjectScope artifacts
      and ordinary WorkflowRuns. Standalone Runs remain first-class; Project
      identity never becomes Scheduler, placement or Runtime state.
    artifacts: >-
      ProjectScope is the third structural view of the existing ArtifactStore.
      Arbitrary artifacts are allowed; exact selected revisions fork to
      RunScope, and Runtime never receives ProjectScope authority.
    recommendations: >-
      UI recommends one Workflow at a time when all required artifact inputs
      have media-compatible Project candidates. primary Workflow outputs only
      suppress completed recommendations and never change execution success.
    publication: >-
      Successful Project Run outputs fork create-only to outputs/<slot>.
      Existing bindings or publication failures are recorded but never
      overwrite data or change the semantic WorkflowRun outcome.
    organization: >-
      Evaluation is an immutable Project kind rendered in a separate Evals UI;
      Skills remain global owner UserScope artifacts. Queue is a read projection
      over all nonterminal ordinary Runs, not another Scheduler.
    lifecycle_controls: >-
      UI consolidates Queue and terminal history under Runs. Owner pause is a
      durable normal-Stage admission gate that permits drain and cleanup.
      Released terminal Runs may be hard-deleted with complete RunScope data;
      Project deletion durably cancels/drains all Runs and purges ProjectScope.
      Both purge paths collect only globally unreferenced artifact content.
  audits:
    boundary: >-
      Audit is one owner/ordinary-Project-bound durable coordinator of ordinary
      WorkflowRuns, exact evidence, findings and human decisions. Workflow
      Scheduler remains the only Run/Stage authority and Runtime has no Project
      or Audit control authority.
    reproducibility: >-
      Start pins exact Project input revisions, the complete resolved
      AuditProfile and child Workflow closures, one exact Run RuntimeConfig
      snapshot and durable credential usage holds. Later catalog, Run-label or
      credential mutation cannot silently change future child Runs.
    artifacts: >-
      There is no AuditScope. Trusted import retains exact accepted outputs in
      protected create-only Audit-managed ProjectScope bindings; child Runtime
      processes receive only ordinary exact RunScope forks.
    execution: >-
      A periodic PostgreSQL Audit Controller owns immutable rounds, bounded
      child Run intents/imports and truthful coverage. Run metadata labels are
      display hints only; authoritative association is committed with the Run.
    concurrency: >-
      AuditProfile has no WorkflowRun concurrency field. Scheduler
      maxConcurrentRuns is the sole execution limit for ordinary and Audit
      child Runs; Controller derives a non-pinned per-Audit submission
      look-ahead from the current global value while maxSubmittedRuns remains a
      cumulative work budget.
    reporting: >-
      Technical Run outcome, observation, requirement/hypothesis assessment,
      finding triage and Audit completion remain distinct. Empty, partial or
      inconclusive work never implies a clean security or compliance verdict.
    worker_completion_planned: >-
      V39 pins audit-check-results@1 from an explicit AuditProfile check binding
      to one passthrough Worker selecting audit-results@2. Runtime collects
      validated items with revisioned corrections, gives at most two same-budget
      reminders for missing submissions, then seals and deterministically
      publishes one ZIP. No ordinary Workflow mandatory-tool policy, label-based
      activation, partial durable acceptance or automatic demo rollout is added.
  persistence:
    database: PostgreSQL
    mvp_blob_backend: PostgreSQL bytea addressed through ArtifactStore
  scheduler_concurrency:
    authority: >-
      One PostgreSQL singleton stores global maxConcurrentRuns in 1..32 with a
      default of one and revision CAS. It is editable only through Operations
      GET/PUT /v1/operations/settings/scheduler.
    execution: >-
      One supported Server process supervises at most that many concurrently
      claimed WorkflowRuns. Each Run still has one active StageExecution and
      Runtime placement may reduce actual utilization.
    reconfiguration: >-
      Increases wake new lanes; decreases drain without cancelling active work.
      Owner Queue Pause, cancellation and safety/release maintenance retain
      independent semantics.
  memory:
    scope: One Run plus one resolved Agent Namespace
    storage: One canonical memory.<name> RunScope artifact per logical note
    transport: Existing ArtifactStore service and private allocation Artifact API only
    toolset: >-
      memory-tools@1 exports exactly list, read, write, append, any-tag search
      and tag-list operations selected through each AgentTemplate allowlist.
  agent_skills:
    source: Versionless UserScope ArtifactRefs in AgentTemplate, resolved exactly per Run
    storage: Ordinary UserScope and reserved read-only RunScope Artifact bindings
    catalog: >-
      Internal SkillCatalog validates bundled sources and resolves/forks
      ordinary artifacts; it has no endpoint, SystemScope or separate schema.
    runtime: >-
      Google ADK native SkillToolset with registry disabled; the initial package
      profile accepts SKILL.md, references and assets but rejects scripts.
  runtime_filesystems:
    ownership: >-
      Workflow composes logical RunScope ZIP/state artifacts and selects
      direct|overlay semantics. Scheduler pins exact refs in AllocationSpec;
      Python Runtime startup alone selects disposable local|memory storage.
    implementation: >-
      fsspec-backed WorkspaceReader/Writer/Changes adapters over one relative
      run_workdir; each logical Worker has an independent physical session and
      Edit tools depend on narrow interfaces rather than concrete backends.
    safety: >-
      Direct changes affect only a disposable copy. Overlay state is cumulative
      text persisted through ordinary artifacts before terminal A2A; release,
      abort and lease loss erase private storage. No host materialize exists.
  code_analysis:
    toolset: >-
      code-analysis@1 exports two portable Tree-sitter operations plus nine
      local-only Trailmark graph operations. AgentTemplate selects exact tools
      and existing supportedToolsets[].tools placement never downgrades them.
    workspace: >-
      Every call reads one exact effective WorkspaceSnapshot through a narrow
      reader. Derived state invalidates by digest; neither shallow nor graph
      code sees an ArtifactRef, fsspec backend or provider physical root.
    graph_runtime: >-
      trailmark==0.5.0 runs offline in one bounded allocation-local child over a
      managed-text scratch mirror. It is internal Toolset machinery, not a
      runtime-subprocess-launcher channel, and must be reaped before slot reuse.
  taint_annotations:
    toolset: >-
      taint-annotations@1 exports exactly annotate_trace, annotate_validate and
      annotate_sink as portable Tree-sitter-backed structured mutations over a
      narrowed workspace Writer. It is separate from read-only code-analysis@1.
    mutation: >-
      Runtime resolves one exact function-like declaration, preserves syntax
      prefixes and atomically compares parsed text inside update_text. Exact
      replay is a no-op; ambiguity and concurrent changes fail explicitly.
    persistence: >-
      Direct changes remain disposable. Durable annotation state/diff uses the
      existing Workflow-selected overlay auto-export and ordinary artifacts;
      no Server annotation API or graph mutation exists.
  http_caido:
    generic_http: >-
      http-tools@1 uses allocation-owned direct transport or the optional
      label-resolved tool-http forward proxy; complete bodies are bounded Run
      artifacts and session secrets remain allocation-memory-only.
    caido: >-
      caido@1 requires the separate caido-graphql@1 label-driven adapter with
      optional caido-bearer@1 credential. AgentTemplate grants exact tools;
      labels configure infrastructure only.
    boundary: >-
      URL/origin checks do not claim DNS or private-network isolation; closed
      egress belongs to the mandatory proxy/network policy. Caido compatibility
      is the reviewed static GraphQL operation/shape set, without introspection
      or generated-query fallback.
  deployment:
    topology: >-
      One VM, one Server process, PostgreSQL, and one or more single-slot
      Runtime Agent processes whose immutable environments may expose different
      positive capability snapshots.
    private_security: >-
      Deployment-CA mTLS. Each concurrent Runtime Agent process uses a distinct
      certificate/key; Server derives its durable configuration principal from
      SHA-256 of the authenticated certificate public key.
    runtime_configuration: >-
      Database-backed Runtime labels select immutable typed infrastructure
      configs. Every Run pins default plus explicit labels; candidate Agent
      labels are the highest physical Worker configuration layer but never
      change ModelPolicy, budgets, tools or Workflow behavior.
    public_auth: >-
      One owner-only local-auth principal backs bounded in-memory browser
      sessions and the retained bearer-token automation path; cookie mutations
      require exact-origin CORS and session-bound CSRF.

milestones:
  - id: mvp
    exit_task: MVP-015
    outcome: >-
      A local user uploads one artifact, starts one exact Workflow version, and
      receives one frozen output after a Go Scheduler invokes one Python ADK
      Worker over A2A. All private traffic uses mTLS.
  - id: first-slice-hardening
    exit_task: V1-006
    outcome: >-
      Cancellation, lease fencing, retry, metrics, race safety, and the first
      model-backed Streamline Planner satisfy the v2 first-slice contracts.
  - id: project-workflows-mvp
    exit_task: V2-007
    outcome: >-
      A user can upload a bounded ZIP source tree and run the four-Stage
      OpenAPI or LikeC4 workflow through the real Go Server and Python Runtime
      Agent, receiving validated frozen documents and validation reports.
  - id: project-workflows-quality
    exit_task: V2-009
    outcome: >-
      The port has an opt-in live-model quality gate and explicit workflow
      variants that reuse caller-supplied discovery reports without adding
      implicit cross-Run cache semantics to Scheduler.
  - id: project-workflows-operations
    exit_task: V2-010
    outcome: >-
      Every Worker tool loop has explicit cumulative model, tool, and token
      budgets and terminates with complete safe metrics before Stage retry.
  - id: planner-routing-and-escalation
    exit_task: V3-010
    outcome: >-
      Streamline and Router execute a durable bounded subtask plan through
      deterministic Worker adapters, while Scheduler owns retry and pinned
      execution-configuration escalation.
  - id: server-ui-and-operations
    exit_task: V4-011
    outcome: >-
      A separately deployed React UI uses the committed public API, local
      browser sessions and a resumable WebSocket to operate Runs, inspect live
      Planner progress and manage active LLM configuration and credentials.
  - id: live-model-reliability
    exit_task: V5-003
    outcome: >-
      Historical V5 behavior let tool-complete Workers recover from malformed
      output, added explicit project-scale LikeC4 budgets and exposed safe
      attempt errors. Its semantic repair-style finalizer was superseded by V13;
      V21 later introduces a mandatory exact-copy serializer without restoring
      model-authored recovery semantics.
  - id: lifecycle-review-hardening
    exit_task: V6-003
    outcome: >-
      Artifact revocation and concurrent writes are linearizable, terminal
      allocation cleanup is bounded and cannot block unrelated Runs, exact Run
      replay survives mutable dependency deletion, and volatile registry
      history remains bounded and operationally current.
  - id: runtime-capability-placement
    exit_task: V7-004
    outcome: >-
      Runtime Agents probe and freeze environment-specific capabilities before
      registration, Control Plane finds complete compatible Stage assignments,
      Operations explains each positive snapshot, and a real heterogeneous
      process test proves capacity waiting plus later execution.
  - id: label-driven-runtime-configuration
    exit_task: V8-016
    outcome: >-
      Control Plane resolves pinned default/Run labels plus durable Agent labels
      into exact allocation-scoped LLM, OTLP and HTTP-proxy settings; complete
      capability placement, APIs/UI, Planner telemetry, mTLS principal binding
      and deterministic failure-path gates preserve secrets and slot reuse.
  - id: shared-memory-tools
    exit_task: V9-007
    outcome: >-
      Streamline and Router Planners coordinate with their corresponding
      logical Workers through explicitly selected bounded Run-scoped notes over
      the existing ArtifactStore, with hidden revisions, safe response-loss
      reconciliation, exact routing schemas and content-free telemetry.
  - id: agent-skills-mvp
    exit_task: V10-007
    outcome: >-
      Bundled and owner-updated LikeC4 Skill artifacts are validated, pinned per
      Run and loaded through native ADK progressive disclosure using only the
      existing Artifact APIs and persistence.
  - id: agent-skills-port-and-hardening
    exit_task: V10-010
    outcome: >-
      All nine contractor-old packages are migrated with explicit compatibility
      boundaries, and adversarial races/isolation/redaction prove that no script
      or Skill-specific transport/persistence authority was introduced.
  - id: run-workspaces-mvp
    exit_task: V11-011
    outcome: >-
      Exact Run ZIP/state artifacts hydrate isolated local/memory workspaces;
      selected read/Edit/change tools work in direct/overlay mode and graceful
      overlay results export cumulative state/diff before terminal A2A.
  - id: run-workspaces-hardening
    exit_task: V11-012
    outcome: >-
      Legacy parity plus adversarial archives, paths, races, cancellation,
      exact limits and retained-surface scans prove confinement, isolation,
      cleanup and content-free metrics.
  - id: http-caido-tools-mvp
    exit_task: V12-007
    outcome: >-
      Bounded generic HTTP and static Caido tools execute through direct/proxied
      and typed label-configured clients with complete placement, artifact body
      handling, release and heterogeneous real-process coverage.
  - id: http-caido-tools-hardening
    exit_task: V12-008
    outcome: >-
      Injection, proxy-bypass, response-bomb, GraphQL, concurrency, cancellation
      and secret-retention gates close the migrated HTTP/Caido surface.
  - id: worker-model-boundary
    exit_task: V13-001
    outcome: >-
      Worker models receive only AgentTemplate behavior and Planner task data;
      Runtime privately and deterministically projects strict A2A results from
      invocation-local trusted artifact observations.
  - id: runtime-lifecycle-hardening
    exit_task: V14-003
    outcome: >-
      Multi-Runtime terminal control cannot strand healthy Workers, volatile
      process-instance retention cannot exhaust admission, and allocation
      filesystem teardown remains deadline-bounded without blocking asyncio.
  - id: workspace-code-analysis-mvp
    exit_task: V15-004
    outcome: >-
      Local and memory Runtime Agents expose bounded Tree-sitter symbol tools,
      while a successfully probed local Runtime additionally serves core
      Trailmark summary/symbol/caller navigation from a killable child over the
      exact effective workspace snapshot.
  - id: workspace-code-analysis-port
    exit_task: V15-008
    outcome: >-
      All retained read-only contractor-old code-analysis tools have bounded
      deterministic implementations, explicit shallow/graph Workflow variants
      and heterogeneous production-process placement, invalidation, cleanup and
      retained-data proof.
  - id: workspace-taint-annotations-mvp
    exit_task: V16-002
    outcome: >-
      Local and memory Runtime Agents expose exact Tree-sitter-resolved
      trace/validation/sink annotation operations with syntax-safe atomic edits,
      explicit ambiguity and idempotent replay.
  - id: workspace-taint-annotations-port
    exit_task: V16-005
    outcome: >-
      The bundled trace Skill and a graph-aware overlay Workflow use structured
      annotations through production process boundaries with bounded lifecycle,
      redaction, exported artifacts and clean slot reuse.
  - id: worker-results-and-live-state
    exit_task: V17-007
    outcome: >-
      Every Worker returns a strict semantic result correlated to its subtask;
      Runtime attaches deterministic observations and exact artifacts, while
      explicit Planner tools inspect only safe live State projections through
      the private Runtime endpoint.
  - id: terminal-worker-summarization
    exit_task: V18-003
    outcome: >-
      An AgentTemplate may opt into one bounded tool-free terminal summarizer at
      a deterministic soft-token boundary without changing disabled behavior,
      trusted observations/artifacts, lifecycle ownership or slot cleanup.
  - id: worker-session-modes
    exit_task: V19-001
    outcome: >-
      Every Stage pins isolated-by-default or explicit shared Worker-session
      semantics into its allocations, with conversation isolation, bounded
      allocation-local State handoff and cancellation-safe cleanup.
  - id: run-metadata-labels
    exit_task: V20-006
    outcome: >-
      Every WorkflowRun may carry immutable queryable metadata labels that
      correlate eval groups and A/B legs across public API, UI and
      Planner/Worker traces without affecting execution or RuntimeConfig
      selection.
  - id: adk-worker-result-finalizer
    exit_task: V21-001
    outcome: >-
      Every ordinary adk@1 Worker separates tool execution from one exact-copy
      tool-free structured-output call, eliminating backend-dependent
      tools-plus-schema grammar failures without changing result ownership.
  - id: workflow-catalog-consolidation
    exit_task: V22-003
    outcome: >-
      OpenAPI domain tools validate the same project workspace exposed to the
      Worker, LikeC4 retains a workspace-backed Streamline option, and the
      default catalog contains current user workflows rather than historical
      implementation versions or process-only fixtures.
  - id: openapi-workflow-variants
    exit_task: V44-002
    outcome: >-
      The OpenAPI catalog exposes an explicitly limited graph comparison profile
      and a workspace-backed Streamline variant, preserving existing finding
      production, source/evidence contracts and the separate quality-eval boundary.
  - id: project-workspaces-mvp
    exit_task: V23-007
    outcome: >-
      A user creates a Project, uploads arbitrary reusable artifacts, receives
      deterministic compatible-Workflow recommendations and launches an
      ordinary exact-input WorkflowRun whose successful outputs return to the
      Project without silent overwrite.
  - id: project-workspaces-operations
    exit_task: V23-011
    outcome: >-
      Global Queue, separate Evals and Skills views, allocation-only Project
      target credentials and production-process recovery/security tests make
      Project organization releasable without changing standalone execution.
  - id: workspace-lifecycle-controls
    exit_task: V24-006
    outcome: >-
      One Runs surface provides Queue/Completed views and durable owner pause,
      terminal Runs can be safely hard-deleted, Projects can be durably
      cancelled and purged, and the general Artifact library excludes Skills
      while reusing the Project file-drop interaction.
  - id: local-direct-disk-authority
    exit_task: V30-004
    outcome: >-
      Local direct workspaces use disk as the source of truth, expose completed
      external changes through filesystem and analysis tools, and preserve
      bounded rooted access and operation ownership through cancellation.
      Memory and overlay behavior remains unchanged.
  - id: podman-allocation-execution
    exit_task: V31-008
    outcome: >-
      An opt-in local Runtime owns one verified rootless Podman container per
      allocation with a shared local direct workspace, explicit bounded command
      tools, independent liveness enforcement and container-before-files cleanup.
      Real process/resource/crash gates precede feature completion.
  - id: postgres-reliability-and-query-efficiency
    exit_task: V29-007
    outcome: >-
      Transaction-bound credential reads, shared configuration pinning,
      concurrent Artifact collection, selective SQL access, batched Run detail,
      typed transaction recovery and bounded waits address the PostgreSQL
      findings verified on the demo instance.
  - id: implementation-maintainability
    exit_task: V28-004
    outcome: >-
      Scheduler execution preparation, Worker invocation ownership and Project
      UI operations have focused implementation boundaries; safe public error
      diagnostics preserve existing contracts and make failures diagnosable.
  - id: workflow-scheduler-concurrency
    exit_task: V27-005
    outcome: >-
      Operations owns one durable global WorkflowRun concurrency limit;
      Scheduler dynamically drains/resizes bounded lanes across every ordinary
      Run source while Runtime capacity, owner Queue Pause and safety cleanup
      retain their separate authority.
  - id: audits-mvp
    exit_task: V25-009
    outcome: >-
      A Project owner selects exact baseline artifacts, starts a deterministic
      checklist or OpenAPI Audit, observes bounded ordinary child Runs and
      receives retained truthful coverage/report data through the independent UI.
  - id: audits-iterative
    exit_task: V25-011
    outcome: >-
      Explicit Workers can durably propose findings while authenticated exact
      review and immutable bounded rounds turn accepted hypotheses into later
      checks without granting models scheduling or approval authority.
  - id: audits-hardening
    exit_task: V25-012
    outcome: >-
      PostgreSQL/mTLS/browser fault gates prove idempotent multi-Controller
      recovery, isolation, retention, lifecycle cleanup and non-certifying
      security reporting without regressing ordinary execution.
  - id: audit-program-library
    exit_task: V26-005
    outcome: >-
      Exact license-aware standard packages and curated Top 10 2025/ASVS 5.0
      programs provide reproducible mappings, evidence contracts, denominators
      and non-certifying reports through production Audit paths.
  - id: audit-batch-efficiency
    exit_task: V26-006
    outcome: >-
      Small compatible Audit item sets may share one ordinary Run while each
      logical item retains independent identity, attempts, evidence, authority,
      coverage and whole-batch recovery semantics.

  - id: operations-performance-and-profiling
    exit_task: V32-008
    outcome: >-
      Operations shows bounded Server/PostgreSQL performance history and final
      allocation resource summaries, with startup opt-out, independent loopback
      Go profiling and measured enabled/disabled overhead.

  - id: catalog-and-agent-prompts
    exit_task: V33-001
    outcome: >-
      Catalog groups Workflows, Agents and Skills, with exact-version base
      instruction viewing, safe Markdown/source/copy and compatible legacy links.

  - id: artifact-blob-backends
    exit_task: V34-005
    outcome: >-
