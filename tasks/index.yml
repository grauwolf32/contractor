schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  task_files_are_self_contained: true
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies but is not expected to read
    docs/spec or know earlier design discussions.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.

fixed_decisions:
  server:
    language: Go 1.25
    module: github.com/grauwolf32/contractor
    http_stack: Go standard library net/http
    database_driver: github.com/jackc/pgx/v5
  runtime_agent:
    language: Python 3.13
    packaging: uv with a src-layout package
    agent_framework: Google ADK Python
    a2a_sdk: Official a2a-sdk Python package
  planner:
    mvp: >-
      passthrough@1 is deterministic Go code and makes one A2A call. It records
      a durable Contractor planner session but does not need an LLM or ADK event
      loop.
    first_slice: >-
      streamline@1 and router@1 use Google ADK Go with a PostgreSQL-backed
      SessionService and a bounded typed subtask plan. Streamline has exactly
      one logical Worker; Router selects among a fixed non-empty logical Worker
      mapping without observing physical Runtime Agent identities.
  a2a:
    protocol: A2A 1.0
    binding: HTTP JSON-RPC
    go_sdk: github.com/a2aproject/a2a-go/v2
  persistence:
    database: PostgreSQL
    mvp_blob_backend: PostgreSQL bytea addressed through ArtifactStore
  memory:
    scope: One Run plus one resolved Agent Namespace
    storage: One canonical memory.<name> RunScope artifact per logical note
    transport: Existing ArtifactStore service and private allocation Artifact API only
    toolset: >-
      memory-tools@1 exports exactly list, read, write, append, any-tag search
      and tag-list operations selected through each AgentTemplate allowlist.
  agent_skills:
    source: Versionless UserScope ArtifactRefs in AgentTemplate, resolved exactly per Run
    storage: Ordinary UserScope and reserved read-only RunScope Artifact bindings
    catalog: >-
      Internal SkillCatalog validates bundled sources and resolves/forks
      ordinary artifacts; it has no endpoint, SystemScope or separate schema.
    runtime: >-
      Google ADK native SkillToolset with registry disabled; the initial package
      profile accepts SKILL.md, references and assets but rejects scripts.
  runtime_filesystems:
    ownership: >-
      Named host roots, local/memory/overlay mode, upper state and host-write
      authority are immutable Python Runtime Agent startup configuration; no
      path, backend state or change set crosses the Server wire.
    implementation: >-
      fsspec-backed WorkspaceReader/Writer/ChangeSet adapters with virtual
      rooted paths; Edit tools depend on narrow interfaces rather than concrete
      Local, Memory or Overlay classes.
    safety: >-
      Direct or materialized host mutation requires hostWrite=true plus an
      explicitly selected tool. Memory/overlay state is allocation-private,
      and interrupted local materialization fences Runtime startup until its
      local journal is recovered.
  deployment:
    topology: >-
      One VM, one Server process, PostgreSQL, and one or more single-slot
      Runtime Agent processes whose immutable environments may expose different
      positive capability snapshots.
    private_security: >-
      Deployment-CA mTLS. Each concurrent Runtime Agent process uses a distinct
      certificate/key; Server derives its durable configuration principal from
      SHA-256 of the authenticated certificate public key.
    runtime_configuration: >-
      Database-backed Runtime labels select immutable typed infrastructure
      configs. Every Run pins default plus explicit labels; candidate Agent
      labels are the highest physical Worker configuration layer but never
      change ModelPolicy, budgets, tools or Workflow behavior.
    public_auth: >-
      One owner-only local-auth principal backs bounded in-memory browser
      sessions and the retained bearer-token automation path; cookie mutations
      require exact-origin CORS and session-bound CSRF.

milestones:
  - id: mvp
    exit_task: MVP-015
    outcome: >-
      A local user uploads one artifact, starts one exact Workflow version, and
      receives one frozen output after a Go Scheduler invokes one Python ADK
      Worker over A2A. All private traffic uses mTLS.
  - id: first-slice-hardening
    exit_task: V1-006
    outcome: >-
      Cancellation, lease fencing, retry, metrics, race safety, and the first
      model-backed Streamline Planner satisfy the v2 first-slice contracts.
  - id: project-workflows-mvp
    exit_task: V2-007
    outcome: >-
      A user can upload a bounded ZIP source tree and run the four-Stage
      OpenAPI or LikeC4 workflow through the real Go Server and Python Runtime
      Agent, receiving validated frozen documents and validation reports.
  - id: project-workflows-quality
    exit_task: V2-009
    outcome: >-
      The port has an opt-in live-model quality gate and explicit workflow
      variants that reuse caller-supplied discovery reports without adding
      implicit cross-Run cache semantics to Scheduler.
  - id: project-workflows-operations
    exit_task: V2-010
    outcome: >-
      Every Worker tool loop has explicit cumulative model, tool, and token
      budgets and terminates with complete safe metrics before Stage retry.
  - id: planner-routing-and-escalation
    exit_task: V3-010
    outcome: >-
      Streamline and Router execute a durable bounded subtask plan through
      deterministic Worker adapters, while Scheduler owns retry and pinned
      execution-configuration escalation.
  - id: server-ui-and-operations
    exit_task: V4-011
    outcome: >-
      A separately deployed React UI uses the committed public API, local
      browser sessions and a resumable WebSocket to operate Runs, inspect live
      Planner progress and manage active LLM configuration and credentials.
  - id: live-model-reliability
    exit_task: V5-003
    outcome: >-
      Tool-complete Workers recover malformed result envelopes through bounded
      structured output, project-scale LikeC4 variants use explicit larger
      finite budgets, and owners can inspect safe actionable attempt errors.
  - id: lifecycle-review-hardening
    exit_task: V6-003
    outcome: >-
      Artifact revocation and concurrent writes are linearizable, terminal
      allocation cleanup is bounded and cannot block unrelated Runs, exact Run
      replay survives mutable dependency deletion, and volatile registry
      history remains bounded and operationally current.
  - id: runtime-capability-placement
    exit_task: V7-004
    outcome: >-
      Runtime Agents probe and freeze environment-specific capabilities before
      registration, Control Plane finds complete compatible Stage assignments,
      Operations explains each positive snapshot, and a real heterogeneous
      process test proves capacity waiting plus later execution.
  - id: label-driven-runtime-configuration
    exit_task: V8-016
    outcome: >-
      Control Plane resolves pinned default/Run labels plus durable Agent labels
      into exact allocation-scoped LLM, OTLP and HTTP-proxy settings; complete
      capability placement, APIs/UI, Planner telemetry, mTLS principal binding
      and deterministic failure-path gates preserve secrets and slot reuse.
  - id: shared-memory-tools
    exit_task: V9-005
    outcome: >-
      Streamline and Router Planners coordinate with their corresponding
      logical Workers through explicitly selected bounded Run-scoped notes over
      the existing ArtifactStore, with hidden revisions, safe response-loss
      reconciliation, exact routing schemas and content-free telemetry.
  - id: agent-skills-mvp
    exit_task: V10-007
    outcome: >-
      Bundled and owner-updated LikeC4 Skill artifacts are validated, pinned per
      Run and loaded through native ADK progressive disclosure using only the
      existing Artifact APIs and persistence.
  - id: agent-skills-port-and-hardening
    exit_task: V10-010
    outcome: >-
      All nine contractor-old packages are migrated with explicit compatibility
      boundaries, and adversarial races/isolation/redaction prove that no script
      or Skill-specific transport/persistence authority was introduced.
  - id: runtime-filesystems-mvp
    exit_task: V11-009
    outcome: >-
      One Runtime-local configuration exposes confined named project roots
      through local, isolated-memory and overlay Workspace sessions; explicitly
      selected read/Edit/change tools work with bounded backend-independent
      behavior and no Server filesystem state.
  - id: runtime-filesystems-materialization-and-hardening
    exit_task: V11-012
    outcome: >-
      Explicit overlay materialization detects stale lowers, recovers partial
      host writes before registration, and the selectively ported legacy plus
      adversarial matrix proves path confinement, allocation isolation,
      cancellation, cleanup and content-free metrics.

v8_v11_spec_review:
  reviewed_on: "2026-09-01"
  verdict: ready_to_implement
  blocking_findings: []
  corrections_applied:
    - >-
      Removed model-visible run_skill_script and ADK's stock script-bearing
      guidance; the Runtime adapter keeps only native list/load/resource Skill
      behavior and probes that exact surface.
    - >-
      Bound Planner Memory mutations to the active StageExecution and the same
      durable finalizing/aborting Artifact write fence as Worker mutations.
    - >-
      Kept project filesystems entirely Runtime-local, separated the new
      contractor_runtime.projectfs package from existing allocation scratch,
      and prohibited filesystem fields in Server wire/API/database state.
    - >-
      Reconciled project import with the existing 30-second global Runtime
      startup deadline and made hostWrite probing non-mutating.
    - >-
      Added hard-link rejection, honest direct-local crash limitations and
      exact host materialization/journal/recovery resource bounds.
    - >-
      Clarified that Contractor credentials have no disabled/revoked state:
      access removal deletes the Gateway key and durable row through the
      existing fenced lifecycle.
  verification:
    - All indexed task YAML parsed and the 110-task dependency graph is acyclic.
    - All local Markdown links resolve and git diff whitespace validation passes.
    - LikeC4 1.56.0 validates docs/spec/architecture.c4.
    - make verify passes with 175 Python tests, 1 skipped, all Go packages, 102 UI tests, Node server tests and production builds.
  decision_log: docs/implementation-decisions-v8-v11.md

current_checkpoint:
  completed_through: V8-011
  next_task: V8-012
  summary: >-
    Runtime now exports allocation-owned, content-free OTLP/HTTP protobuf spans
    for Worker model, tool, A2A and error activity through a bounded in-memory
    queue. Exporter failures and timeouts remain metrics-only, while close still
    enforces secret erasure before slot reuse. Next, implement the concrete
    target-scoped HTTP proxy adapter.

current_planning_review:
  reviewed_on: "2026-08-31"
  verdict: ready_to_implement
  checks:
    - >-
      The owning spec and all cross-document edits pass LikeC4 validation,
      relative-link checks, the fixed contractor-empty@1 digest check and git
      whitespace validation before task decomposition.
    - >-
      The graph has two independent roots: V8-001 builds durable configuration
      while V8-003 lands the synchronized Go/Python private-v2 contract. They
      converge through principal identity, Run pinning and the pure resolver;
      no task depends on itself or a later cycle.
    - >-
      V8-006 isolates precedence/conflict semantics from V8-007 database,
      registry and network integration. This keeps the most important label
      rule exhaustively unit-testable before allocation concurrency is added.
    - >-
      V8-008 and V8-009 expose management APIs before the P0 process gate, so
      V8-013 configures its scenario through production boundaries instead of
      direct SQL fixtures. V8-015 consumes the already committed API rather
      than coupling frontend work to Server asset rebuilding.
    - >-
      V8-010 supplies one adapter lifecycle host; OTLP and proxy behavior land
      independently in V8-011 and V8-012. Their common release, lease-loss and
      redaction invariants therefore have one implementation owner.
    - >-
      The P0 path ends at V8-013 with default, Run and Agent precedence, complete
      heterogeneous placement, write-only config APIs, real Worker telemetry
      and selected proxy traffic. P1 adds Server Planner telemetry, UI and a
      broader adversarial release gate without delaying the Worker MVP.
    - >-
      Every task repeats the exact behavior it owns for a worker without spec
      context, names concrete files/failures/acceptance criteria, and keeps
      implementation_commit null until the task's final implementation commit.
    - >-
      Labels remain infrastructure aliases rather than affinity or policy: a
      debug Run can use an unlabeled adapter-capable Agent, while an Agent label
      overrides only future physical Worker settings and never semantic model
      policy, tools, budgets or Workflow graph behavior.
  accepted_risks:
    - >-
      RuntimeConfig is database/API-managed in this increment; export/import,
      immutable version garbage collection and an S3/file authoring workflow
      are deferred.
    - >-
      OTLP support exports content-free traces only with a bounded in-memory
      queue. There is no durable external-telemetry spool, content capture or
      cross-process W3C parent topology; Contractor reports remain authoritative.
    - >-
      Runtime capabilities remain composable positive sets and the process
      environment remains immutable. Combination-specific environments still
      require a safe common subset or separate uniquely certified processes.
    - >-
      The first implementation remains one active Control Plane and uses labels
      neither for RBAC nor arbitrary scheduling affinity. HTTP proxy injection
      covers declared model/tool channels, not a general network sandbox.

memory_tools_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_after_label_runtime_p0
  checks:
    - >-
      The design adds no Memory service, endpoint, credential, SQL table or
      replay log. Planner uses a bound ArtifactStore view and Worker uses the
      existing allocation-bound private Artifact API with its current mTLS,
      Run isolation, ETag CAS and atomic write fence.
    - >-
      One note remains one canonical memory.<name> artifact. Binding/revision
      timestamps are a small generic Artifact response enhancement; logical
      models and tool schemas never expose ArtifactRef or revision.
    - >-
      Planner direct-store mutations are StageExecution-bound and linearize in
      the same Artifact transaction as finalizing/aborting write fencing; they
      do not become a Run-wide bypass around the Worker allocation fence.
    - >-
      V9-001 starts after the label-runtime P0 process gate V8-013, so the
      MemoryTools MVP does not wait for label UI/Planner-telemetry hardening.
      V9-005 joins V8-016 before the final adversarial release gate.
    - >-
      V9-001 owns only cross-language codec and Artifact metadata, V9-002 owns
      Worker tools, V9-003 owns Planner mirroring, V9-004 is the first process
      MVP and V9-005 owns response-loss/fence/redaction hardening.
    - >-
      The 128-note/max-ordinal rule relies only on already normative v1
      serialization: one Planner tool call, at most one active dispatch, one
      Runtime task and no concurrent Run Stages. Future different-name create
      concurrency is explicitly gated on a generic Artifact batch-CAS feature.
    - >-
      Lost create/update/append responses reuse the exact bytes and stale
      precondition, then compare current canonical payload. This is the existing
      Artifact CAS contract and cannot duplicate append without a replay table.
    - >-
      Exact per-operation Router worker_name enums are derived from immutable
      AgentTemplate selections, while Passthrough remains unchanged and no
      unrelated Worker Toolset is mirrored into Planner.
    - >-
      Every task is self-contained, keeps implementation_commit null until its
      implementation commit, and has focused deterministic tests plus an
      aggregate verification gate.
  accepted_risks:
    - >-
      There is no pagination because a Memory Namespace is capped at 128 notes;
      list/search may read all bounded note payloads to build ordered previews.
    - >-
      Authenticated Run owners and operator diagnostics may inspect underlying
      memory artifacts and revisions. The abstraction boundary is model-visible
      tools, not an attempt to hide a user's own Run data from the user.
    - >-
      Concurrent different-name creates in one Memory Namespace are outside v1
      scheduling. Enabling them requires generic ArtifactStore atomic batch/CAS
      before changing Scheduler or Planner concurrency.

