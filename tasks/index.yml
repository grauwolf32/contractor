runtime_filesystems_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_to_implement_independently
  checks:
    - >-
      The design is Runtime-only. No task adds an AllocationSpec field, public
      or private endpoint, SQL table, Artifact kind, label setting or UI. Go
      work is limited to immutable Toolset/tool-name descriptors already
      required for AgentTemplate authoring validation.
    - >-
      Allocation scratch remains local-workdir@1, while project WorkspaceFS is
      a separate Runtime service sourced from an optional strict local config.
      This avoids turning SandboxProfile into a path transport or changing an
      existing exact profile's semantics.
    - >-
      The implementation package is contractor_runtime.projectfs because
      contractor_runtime.workspace already owns allocation scratch; no task
      creates a conflicting Python module/package or renames existing imports.
    - >-
      V11-001 through V11-004 establish config, confinement, isolated memory
      and overlay behavior before any model-visible mutation is registered.
      V11-005 through V11-007 then bind independent Reader, Writer and
      ChangeSet Toolsets, and V11-008 owns lifecycle/capability integration.
    - >-
      V11-009 is the earliest process gate and proves a Runtime with no config
      remains backward compatible. It also proves local/memory/overlay read and
      Edit parity, diff/rollback and release isolation with no model or network
      dependency.
    - >-
      Host materialization is not hidden inside the MVP. V11-010 owns
      fingerprint preflight plus the journal state machine, V11-011 owns
      restart recovery and real-process failure injection, and V11-012 closes
      legacy/adversarial parity, cancellation, metrics and leak checks.
    - >-
      Materialization bounds are executable before the first host write:
      10000 affected paths, 16 MiB per backup, 64 MiB staged bytes, 128 MiB
      backup, 8 MiB metadata and bounded resumable startup recovery.
    - >-
      Direct local write is deliberately available in the MVP only under
      hostWrite=true and has no rollback promise. Overlay-local is the safer
      choice; no automatic finalize/abort materialization exists.
    - >-
      Stock fsspec MemoryFileSystem global class state and instance cache are
      explicitly excluded as isolation mechanisms. Tests create simultaneous
      and sequential allocation sessions and prove teardown/prefix separation.
    - >-
      Every V11 task repeats paths, bounds, failure behavior and exclusions for
      a worker with no spec context, remains independently testable and starts
      with implementation_commit null.
  accepted_risks:
    - >-
      Control Plane receives no project identity. Initially, only one eligible
      filesystem Runtime may be connected or all eligible processes must have
      equivalent logical mounts/content; artifact auto-mounting or affinity is
      a later Server/allocation design.
    - >-
      Tool confinement is not an OS sandbox against arbitrary in-process code.
      The increment exposes no shell/Python executor, follows no links and
      requires a future stronger SandboxProfile for hostile native plugins.
    - >-
      A host filesystem cannot provide portable atomic multi-file commit.
      Materialization therefore uses stale-base preflight, per-file atomic
      replacement and a recoverable rollback journal rather than claiming a
      false global transaction.
    - >-
      Memory import is strict UTF-8 text-only and bounded to 64 MiB/10,000
      files per mount. Binary-aware project tooling and larger/remote trees are
      separate increments.

