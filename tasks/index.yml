schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  task_files_are_self_contained: true
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies but is not expected to read
    docs/spec or know earlier design discussions.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.

fixed_decisions:
  server:
    language: Go 1.25
    module: github.com/grauwolf32/contractor
    http_stack: Go standard library net/http
    database_driver: github.com/jackc/pgx/v5
  runtime_agent:
    language: Python 3.13
    packaging: uv with a src-layout package
    agent_framework: Google ADK Python
    a2a_sdk: Official a2a-sdk Python package
  planner:
    mvp: >-
      passthrough@1 is deterministic Go code and makes one A2A call. It records
      a durable Contractor planner session but does not need an LLM or ADK event
      loop.
    first_slice: >-
      streamline@1 and router@1 use Google ADK Go with a PostgreSQL-backed
      SessionService and a bounded typed subtask plan. Streamline has exactly
      one logical Worker; Router selects among a fixed non-empty logical Worker
      mapping without observing physical Runtime Agent identities.
  a2a:
    protocol: A2A 1.0
    binding: HTTP JSON-RPC
    go_sdk: github.com/a2aproject/a2a-go/v2
  worker_model_boundary:
    reusable_behavior: AgentTemplate resolved instruction text and selected tools/skills
    task_input: Planner objective/instructions, string parameters and named exact input refs
    result_projection: >-
      Runtime-owned strict A2A response from plain final summary plus only
      current-invocation trusted tool observations matched to Workflow `from` bindings.
  persistence:
    database: PostgreSQL
    mvp_blob_backend: PostgreSQL bytea addressed through ArtifactStore
  memory:
    scope: One Run plus one resolved Agent Namespace
    storage: One canonical memory.<name> RunScope artifact per logical note
    transport: Existing ArtifactStore service and private allocation Artifact API only
    toolset: >-
      memory-tools@1 exports exactly list, read, write, append, any-tag search
      and tag-list operations selected through each AgentTemplate allowlist.
  agent_skills:
    source: Versionless UserScope ArtifactRefs in AgentTemplate, resolved exactly per Run
    storage: Ordinary UserScope and reserved read-only RunScope Artifact bindings
    catalog: >-
      Internal SkillCatalog validates bundled sources and resolves/forks
      ordinary artifacts; it has no endpoint, SystemScope or separate schema.
    runtime: >-
      Google ADK native SkillToolset with registry disabled; the initial package
      profile accepts SKILL.md, references and assets but rejects scripts.
  runtime_filesystems:
    ownership: >-
      Workflow composes logical RunScope ZIP/state artifacts and selects
      direct|overlay semantics. Scheduler pins exact refs in AllocationSpec;
      Python Runtime startup alone selects disposable local|memory storage.
    implementation: >-
      fsspec-backed WorkspaceReader/Writer/Changes adapters over one relative
      run_workdir; each logical Worker has an independent physical session and
      Edit tools depend on narrow interfaces rather than concrete backends.
    safety: >-
      Direct changes affect only a disposable copy. Overlay state is cumulative
      text persisted through ordinary artifacts before terminal A2A; release,
      abort and lease loss erase private storage. No host materialize exists.
  code_analysis:
    toolset: >-
      code-analysis@1 exports two portable Tree-sitter operations plus nine
      local-only Trailmark graph operations. AgentTemplate selects exact tools
      and existing supportedToolsets[].tools placement never downgrades them.
    workspace: >-
      Every call reads one exact effective WorkspaceSnapshot through a narrow
      reader. Derived state invalidates by digest; neither shallow nor graph
      code sees an ArtifactRef, fsspec backend or provider physical root.
    graph_runtime: >-
      trailmark==0.5.0 runs offline in one bounded allocation-local child over a
      managed-text scratch mirror. It is internal Toolset machinery, not a
      runtime-subprocess-launcher channel, and must be reaped before slot reuse.
  taint_annotations:
    toolset: >-
      taint-annotations@1 exports exactly annotate_trace, annotate_validate and
      annotate_sink as portable Tree-sitter-backed structured mutations over a
      narrowed workspace Writer. It is separate from read-only code-analysis@1.
    mutation: >-
      Runtime resolves one exact function-like declaration, preserves syntax
      prefixes and atomically compares parsed text inside update_text. Exact
      replay is a no-op; ambiguity and concurrent changes fail explicitly.
    persistence: >-
      Direct changes remain disposable. Durable annotation state/diff uses the
      existing Workflow-selected overlay auto-export and ordinary artifacts;
      no Server annotation API or graph mutation exists.
  http_caido:
    generic_http: >-
      http-tools@1 uses allocation-owned direct transport or the optional
      label-resolved tool-http forward proxy; complete bodies are bounded Run
      artifacts and session secrets remain allocation-memory-only.
    caido: >-
      caido@1 requires the separate caido-graphql@1 label-driven adapter with
      optional caido-bearer@1 credential. AgentTemplate grants exact tools;
      labels configure infrastructure only.
    boundary: >-
      URL/origin checks do not claim DNS or private-network isolation; closed
      egress belongs to the mandatory proxy/network policy. Caido compatibility
      is the reviewed static GraphQL operation/shape set, without introspection
      or generated-query fallback.
  deployment:
    topology: >-
      One VM, one Server process, PostgreSQL, and one or more single-slot
      Runtime Agent processes whose immutable environments may expose different
      positive capability snapshots.
    private_security: >-
      Deployment-CA mTLS. Each concurrent Runtime Agent process uses a distinct
      certificate/key; Server derives its durable configuration principal from
      SHA-256 of the authenticated certificate public key.
    runtime_configuration: >-
      Database-backed Runtime labels select immutable typed infrastructure
      configs. Every Run pins default plus explicit labels; candidate Agent
      labels are the highest physical Worker configuration layer but never
      change ModelPolicy, budgets, tools or Workflow behavior.
    public_auth: >-
      One owner-only local-auth principal backs bounded in-memory browser
      sessions and the retained bearer-token automation path; cookie mutations
      require exact-origin CORS and session-bound CSRF.

milestones:
  - id: mvp
    exit_task: MVP-015
    outcome: >-
      A local user uploads one artifact, starts one exact Workflow version, and
      receives one frozen output after a Go Scheduler invokes one Python ADK
      Worker over A2A. All private traffic uses mTLS.
  - id: first-slice-hardening
    exit_task: V1-006
    outcome: >-
      Cancellation, lease fencing, retry, metrics, race safety, and the first
      model-backed Streamline Planner satisfy the v2 first-slice contracts.
  - id: project-workflows-mvp
    exit_task: V2-007
    outcome: >-
      A user can upload a bounded ZIP source tree and run the four-Stage
      OpenAPI or LikeC4 workflow through the real Go Server and Python Runtime
      Agent, receiving validated frozen documents and validation reports.
  - id: project-workflows-quality
    exit_task: V2-009
    outcome: >-
      The port has an opt-in live-model quality gate and explicit workflow
      variants that reuse caller-supplied discovery reports without adding
      implicit cross-Run cache semantics to Scheduler.
  - id: project-workflows-operations
    exit_task: V2-010
    outcome: >-
      Every Worker tool loop has explicit cumulative model, tool, and token
      budgets and terminates with complete safe metrics before Stage retry.
  - id: planner-routing-and-escalation
    exit_task: V3-010
    outcome: >-
      Streamline and Router execute a durable bounded subtask plan through
      deterministic Worker adapters, while Scheduler owns retry and pinned
      execution-configuration escalation.
  - id: server-ui-and-operations
    exit_task: V4-011
    outcome: >-
      A separately deployed React UI uses the committed public API, local
      browser sessions and a resumable WebSocket to operate Runs, inspect live
      Planner progress and manage active LLM configuration and credentials.
  - id: live-model-reliability
    exit_task: V5-003
    outcome: >-
      Tool-complete Workers tolerate arbitrary bounded final text without a
      model-authored result envelope, project-scale LikeC4 variants use explicit
      larger finite budgets, and owners can inspect safe actionable attempt errors.
  - id: lifecycle-review-hardening
    exit_task: V6-003
    outcome: >-
      Artifact revocation and concurrent writes are linearizable, terminal
      allocation cleanup is bounded and cannot block unrelated Runs, exact Run
      replay survives mutable dependency deletion, and volatile registry
      history remains bounded and operationally current.
  - id: runtime-capability-placement
    exit_task: V7-004
    outcome: >-
      Runtime Agents probe and freeze environment-specific capabilities before
      registration, Control Plane finds complete compatible Stage assignments,
      Operations explains each positive snapshot, and a real heterogeneous
      process test proves capacity waiting plus later execution.
  - id: label-driven-runtime-configuration
    exit_task: V8-016
    outcome: >-
      Control Plane resolves pinned default/Run labels plus durable Agent labels
      into exact allocation-scoped LLM, OTLP and HTTP-proxy settings; complete
      capability placement, APIs/UI, Planner telemetry, mTLS principal binding
      and deterministic failure-path gates preserve secrets and slot reuse.
  - id: shared-memory-tools
    exit_task: V9-007
    outcome: >-
      Streamline and Router Planners coordinate with their corresponding
      logical Workers through explicitly selected bounded Run-scoped notes over
      the existing ArtifactStore, with hidden revisions, safe response-loss
      reconciliation, exact routing schemas and content-free telemetry.
  - id: agent-skills-mvp
    exit_task: V10-007
    outcome: >-
      Bundled and owner-updated LikeC4 Skill artifacts are validated, pinned per
      Run and loaded through native ADK progressive disclosure using only the
      existing Artifact APIs and persistence.
  - id: agent-skills-port-and-hardening
    exit_task: V10-010
    outcome: >-
      All nine contractor-old packages are migrated with explicit compatibility
      boundaries, and adversarial races/isolation/redaction prove that no script
      or Skill-specific transport/persistence authority was introduced.
  - id: run-workspaces-mvp
    exit_task: V11-011
    outcome: >-
      Exact Run ZIP/state artifacts hydrate isolated local/memory workspaces;
      selected read/Edit/change tools work in direct/overlay mode and graceful
      overlay results export cumulative state/diff before terminal A2A.
  - id: run-workspaces-hardening
    exit_task: V11-012
    outcome: >-
      Legacy parity plus adversarial archives, paths, races, cancellation,
      exact limits and retained-surface scans prove confinement, isolation,
      cleanup and content-free metrics.
  - id: http-caido-tools-mvp
    exit_task: V12-007
    outcome: >-
      Bounded generic HTTP and static Caido tools execute through direct/proxied
      and typed label-configured clients with complete placement, artifact body
      handling, release and heterogeneous real-process coverage.
  - id: http-caido-tools-hardening
    exit_task: V12-008
    outcome: >-
      Injection, proxy-bypass, response-bomb, GraphQL, concurrency, cancellation
      and secret-retention gates close the migrated HTTP/Caido surface.
  - id: worker-model-boundary
    exit_task: V13-001
    outcome: >-
      Worker models receive only AgentTemplate behavior and Planner task data;
      Runtime privately and deterministically projects strict A2A results from
      invocation-local trusted artifact observations.
  - id: runtime-lifecycle-hardening
    exit_task: V14-003
    outcome: >-
      Multi-Runtime terminal control cannot strand healthy Workers, volatile
      process-instance retention cannot exhaust admission, and allocation
      filesystem teardown remains deadline-bounded without blocking asyncio.
  - id: workspace-code-analysis-mvp
    exit_task: V15-004
    outcome: >-
      Local and memory Runtime Agents expose bounded Tree-sitter symbol tools,
      while a successfully probed local Runtime additionally serves core
      Trailmark summary/symbol/caller navigation from a killable child over the
      exact effective workspace snapshot.
  - id: workspace-code-analysis-port
    exit_task: V15-008
    outcome: >-
      All retained read-only contractor-old code-analysis tools have bounded
      deterministic implementations, explicit shallow/graph Workflow variants
      and heterogeneous production-process placement, invalidation, cleanup and
      retained-data proof.
  - id: workspace-taint-annotations-mvp
    exit_task: V16-002
    outcome: >-
      Local and memory Runtime Agents expose exact Tree-sitter-resolved
      trace/validation/sink annotation operations with syntax-safe atomic edits,
      explicit ambiguity and idempotent replay.
  - id: workspace-taint-annotations-port
    exit_task: V16-005
    outcome: >-
      The bundled trace Skill and a graph-aware overlay Workflow use structured
      annotations through production process boundaries with bounded lifecycle,
      redaction, exported artifacts and clean slot reuse.

v8_v12_spec_review:
  reviewed_on: "2026-09-01"
  verdict: implemented_and_release_verified
  blocking_findings: []
  corrections_applied:
    - >-
      Removed model-visible run_skill_script and ADK's stock script-bearing
      guidance; the Runtime adapter keeps only native list/load/resource Skill
      behavior and probes that exact surface.
    - >-
      Bound Planner Memory mutations to the active StageExecution. Worker
      mutations use the allocation-grant gate; Scheduler fences those grants
      before a Run-then-Stage durable transition that serializes with Planner
      Artifact transactions.
    - >-
      Replaced the stale host-root design with Workflow-owned logical workspace
      aliases, exact Scheduler pins in AllocationSpec and Runtime-owned
      disposable local/memory storage.
    - >-
      Defined secure ZIP hydration, cumulative text overlay state, checkpoint
      diff/rollback and export-before-terminal ordering over existing Artifact
      APIs without host materialization.
    - >-
      Separated HTTP forward-proxy routing from a typed label-configured Caido
      GraphQL adapter and kept AgentTemplate as the only tool authority.
    - >-
      Clarified that Contractor credentials have no disabled/revoked state:
      access removal deletes the Gateway key and durable row through the
      existing fenced lifecycle.
  verification:
    - All indexed task YAML parses and the dependency graph is acyclic.
    - All local Markdown links resolve and git diff whitespace validation passes.
    - LikeC4 1.56.0 validates the one source model under docs/spec.
    - make verify passes with 495 Python tests, 1 skipped, all Go packages, 108 UI tests, Node server tests and production builds.
    - make release-verify passes against PostgreSQL with every Runtime/configuration, browser, Memory, Skill and HTTP/Caido process gate.
  decision_log: docs/implementation-decisions-v8-v11.md

current_checkpoint:
  completed_through: V16-003
  next_task: V16-004
  summary: >-
    V8 labels/adapters, V9 shared Memory and V10 artifact-pinned native ADK
    Skills are complete. Workspace and HTTP/Caido specifications/tasks were
    rewritten after user synchronization. V11-001 strict cross-language
    workspace wire contracts, strict Workflow publication and exact
    StageContext-to-allocation projection, immutable local/memory providers and
    bounded exact-ZIP hydration, cumulative overlay state, invocation
    checkpoints, deterministic diff/rollback, bounded filesystem@1 reads,
    atomic edit-files@1 mutations, workspace-changes@1 checkpoint tools,
    pre-terminal cumulative overlay export, explicit OpenAPI/LikeC4 workspace
    variants, local/memory allocation-boundary E2E and workspace hardening are
    complete. V12-001 added atomic label-driven Caido RuntimeConfig, encrypted
    bearer credentials, private settings/provenance and placement inputs.
    V12-002 added the static-operation Caido GraphQL client, typed private
    handle, capability discovery, mandatory tool-to-adapter placement and
    bounded lifecycle cleanup. V12-003 added allocation-scoped direct or
    mandatory-proxy HTTP tools, bounded exact body artifacts, redacted
    memory-only sessions, safe retries and teardown. V12-004 added strict
    static Caido discovery/read operations, bounded normalized results and
    atomic exact raw-exchange artifacts. V12-005 added bounded scope creation,
    tagged Replay, byte-exact Automate and convert/active Workflow actions with
    no ambiguous mutation retries. V12-006 connected the revised Caido Skill to
    an exact explicit AgentTemplate, added HTTP/Caido templates and an opt-in
    security-analysis Workflow, and locked their compatibility plus a
    secret-free label configuration example in the repository release gate.
    V12-007 added a deterministic allocation-boundary gate plus a PostgreSQL,
    mTLS and two-process heterogeneous Runtime E2E. It proves HTTP proxy/body
    artifacts, Caido read/mutation pinning across an Agent-label rebind,
    non-blocking release recovery, slot reuse and retained-surface redaction;
    the gate also found and fixed cleanup through a terminally detached HTTP
    adapter. V12-008 closed aggregate header/cookie state, cancellation and
    response-cookie cleanup; added adversarial URL/redirect/response/GraphQL,
    concurrency and retained-secret suites plus a strict executable matrix;
    and documented the explicit DNS/egress and Caido schema-compatibility
    boundaries. V13-001 removed the model-facing Contractor result protocol and
    second serializer call. AgentTemplate now supplies reusable behavior,
    Planner supplies semantic task data, and Runtime maps only exact artifacts
    observed in the current invocation through trusted Workflow result bindings.
    V14-001 made terminal control fan-out concurrent with independent budgets
    and repeatable drain/finalize/abort/release recovery. V14-002 bounded
    retired Runtime process-instance history. V14-003 moved allocation cleanup
    off asyncio and retained one deadline-bounded retry-safe cleanup task.
    V15-001 added the exact code-analysis@1 Server descriptor, strict workspace
    publication rule and pinned parser/Trailmark dependency contract while
    deliberately keeping the unimplemented Toolset out of Runtime capability
    registration. V15-002 added the portable 19-language Tree-sitter shallow
    surface with signed pagination, exact-snapshot cache invalidation, bounded
    coverage and content-free metrics on local/memory direct/overlay
    workspaces. V15-003 added an allocation-scratch snapshot mirror, a
    sanitized and 1 GiB-bounded Trailmark child, strict framed protocol,
    deadline/reap/cleanup lifecycle, local-only offline graph readiness probe
    and a reproducible resource characterization command. V15-004 exposed the
    four core graph operations only on healthy local Runtime Agents, added
    allocation-key-protected exact symbol identity, duplicate-safe resolution,
    bounded pagination and projections, digest-triggered child replacement,
    and exact operation-subset placement coverage. V15-005 completed the nine
    graph operations with allocation-local exact-ID paths, deterministic
    limit-plus-one traversal, bounded entrypoint/complexity/exception pages,
    full local-only probe coverage and canonical signed cursors. V15-006 made
    shallow CPU work cancellation-safe, bounded cache entries independently,
    added one pre-write-only child replay, terminal Toolset teardown before
    adapter/workspace cleanup, stable cancellation metrics and executable
    concurrency/fault/redaction coverage. V15-007 published immutable shallow
    `openapi/likec4-from-workspace@2` and all-graph `@3` variants with narrow
    discovery templates, model-facing coverage/opaque-ID guidance and strict
    digest/graph-isolation tests. V15-008 added the real PostgreSQL/mTLS Server,
    memory/local Runtime and deterministic-gateway process gate; it also fixed
    capacity-defer claim fairness so an unavailable graph Stage cannot starve a
    runnable shallow Stage. V16-001 added the exact inert Server/Python
    taint-annotations@1 contract and workspace publication validation while
    keeping positive Runtime capability absent. V16-002 implemented and
    registered all three portable tools with nineteen-language structural
    resolution, prefix-safe atomic mutation, explicit ambiguity and idempotent
    replay across local/memory direct/overlay workspaces. V16-003 added
    cancellation-safe parser ownership, close fencing, resulting-file bounds,
    safe parser/storage failure normalization, real cross-Toolset races,
    retained-surface redaction and a strict executable hardening matrix.
    V16-004 is next.

runtime_configuration_hardening_review:
  reviewed_on: "2026-09-01"
  verdict: complete
  implementation_commit: 5ea78cc580edc833c41aadd6cd3e87201fbda0a5
  checks:
    - >-
      The executable matrix references every new mutation boundary and every
      acceptance category; its validator fails if an owning Go/Python test is
      removed or renamed.
    - >-
      The full PostgreSQL race gate, 25 strict Python adapter/lease tests, the
      two-certificate production process scenario and Chromium stack pass.
    - >-
      The process scenario replays RuntimeConfig, Runtime credential, label,
      Agent-label and Run creation mutations, rejects a duplicate live SPKI and
      allocation borrowing by another CA-valid principal, and then reuses both
      adapter-specialist slots.
    - >-
      Spec review clarified equal Runtime role eligibility versus allocation-
      scoped principal/instance grants; no other V8 cross-document conflict was
      found. LikeC4, OpenAPI/config validation, all documentation links and the
      112-task acyclic dependency graph pass.
  decisions: [D025]

current_planning_review:
  reviewed_on: "2026-08-31"
  verdict: ready_to_implement
  checks:
    - >-
      The owning spec and all cross-document edits pass LikeC4 validation,
      relative-link checks, the fixed contractor-empty@1 digest check and git
      whitespace validation before task decomposition.
    - >-
      The graph has two independent roots: V8-001 builds durable configuration
      while V8-003 lands the synchronized Go/Python private-v2 contract. They
      converge through principal identity, Run pinning and the pure resolver;
      no task depends on itself or a later cycle.
    - >-
      V8-006 isolates precedence/conflict semantics from V8-007 database,
      registry and network integration. This keeps the most important label
      rule exhaustively unit-testable before allocation concurrency is added.
    - >-
      V8-008 and V8-009 expose management APIs before the P0 process gate, so
      V8-013 configures its scenario through production boundaries instead of
      direct SQL fixtures. V8-015 consumes the already committed API rather
      than coupling frontend work to Server asset rebuilding.
    - >-
      V8-010 supplies one adapter lifecycle host; OTLP and proxy behavior land
      independently in V8-011 and V8-012. Their common release, lease-loss and
      redaction invariants therefore have one implementation owner.
    - >-
      The P0 path ends at V8-013 with default, Run and Agent precedence, complete
      heterogeneous placement, write-only config APIs, real Worker telemetry
      and selected proxy traffic. P1 adds Server Planner telemetry, UI and a
      broader adversarial release gate without delaying the Worker MVP.
    - >-
      Every task repeats the exact behavior it owns for a worker without spec
      context, names concrete files/failures/acceptance criteria, and keeps
      implementation_commit null until the task's final implementation commit.
    - >-
      Labels remain infrastructure aliases rather than affinity or policy: a
      debug Run can use an unlabeled adapter-capable Agent, while an Agent label
      overrides only future physical Worker settings and never semantic model
      policy, tools, budgets or Workflow graph behavior.
  accepted_risks:
    - >-
      RuntimeConfig is database/API-managed in this increment; export/import,
      immutable version garbage collection and an S3/file authoring workflow
      are deferred.
    - >-
      OTLP support exports content-free traces only with a bounded in-memory
      queue. There is no durable external-telemetry spool, content capture or
      cross-process W3C parent topology; Contractor reports remain authoritative.
    - >-
      Runtime capabilities remain composable positive sets and the process
      environment remains immutable. Combination-specific environments still
      require a safe common subset or separate uniquely certified processes.
    - >-
      The first implementation remains one active Control Plane and uses labels
      neither for RBAC nor arbitrary scheduling affinity. HTTP proxy injection
      covers declared model/tool channels, not a general network sandbox.

memory_tools_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_after_label_runtime_p0
  checks:
    - >-
      The design adds no Memory service, endpoint, credential, SQL table or
      replay log. Planner uses a bound ArtifactStore view and Worker uses the
      existing allocation-bound private Artifact API with its current mTLS,
      Run isolation, ETag CAS and atomic write fence.
    - >-
      One note remains one canonical memory.<name> artifact. Binding/revision
      timestamps are a small generic Artifact response enhancement; logical
      models and tool schemas never expose ArtifactRef or revision.
    - >-
      Planner direct-store mutations are StageExecution-bound and lock/check
      the durable Run and Stage rows in the Artifact transaction. Worker writes
      linearize against their allocation grant gates; Scheduler fences and
      drains those gates before the durable Stage transition, forming one
      ordered terminal barrier without pretending both paths use one lock.
    - >-
      V9-001 starts after the label-runtime P0 process gate V8-013, so the
      MemoryTools MVP does not wait for label UI/Planner-telemetry hardening.
      V9-006 joins V8-016 before the terminal fault matrix, and V9-007 owns the
      final retained-data and release gate.
    - >-
      V9-001 owns only cross-language codec and Artifact metadata, V9-002 owns
      Worker tools, V9-003 owns Planner mirroring and V9-004 is the first
      process MVP. V9-005 closes semantic/model boundaries, V9-006 owns
      response-loss and terminal races, and V9-007 owns redaction/release.
    - >-
      The 128-note/max-ordinal rule relies only on already normative v1
      serialization: one Planner tool call, at most one active dispatch, one
      Runtime task and no concurrent Run Stages. Future different-name create
      concurrency is explicitly gated on a generic Artifact batch-CAS feature.
    - >-
      Lost create/update/append responses reuse the exact bytes and stale
      precondition, then compare current canonical payload. This is the existing
      Artifact CAS contract and cannot duplicate append without a replay table.
    - >-
      Exact per-operation Router worker_name enums are derived from immutable
      AgentTemplate selections, while Passthrough remains unchanged and no
      unrelated Worker Toolset is mirrored into Planner.
    - >-
      Every task is self-contained, keeps implementation_commit null until its
      implementation commit, and has focused deterministic tests plus an
      aggregate verification gate.
  accepted_risks:
    - >-
      There is no pagination because a Memory Namespace is capped at 128 notes;
      list/search may read all bounded note payloads to build ordered previews.
    - >-
      Authenticated Run owners and operator diagnostics may inspect underlying
      memory artifacts and revisions. The abstraction boundary is model-visible
      tools, not an attempt to hide a user's own Run data from the user.
    - >-
      Concurrent different-name creates in one Memory Namespace are outside v1
      scheduling. Enabling them requires generic ArtifactStore atomic batch/CAS
      before changing Scheduler or Planner concurrency.

