schema_version: "1.0"

project:
  name: contractor-v2
  objective: >-
    Deliver a single-VM workflow runtime whose Control Plane and public server
    are implemented in Go and whose single-slot Runtime Agent is implemented in
    Python.

execution_policy:
  task_files_are_self_contained: true
  dependency_rule: >-
    A task may start only after every ID in depends_on is complete. The worker
    may inspect code produced by those dependencies but is not expected to read
    docs/spec or know earlier design discussions.
  change_rule: >-
    Keep each implementation task in its own commit unless two tasks must be
    landed atomically to keep the repository buildable.
  completion_rule: >-
    A task is complete only when every acceptance criterion passes and all
    commands listed under tests succeed.
  implementation_commit_rule: >-
    Every completed task file records implementation_commit as the full hash of
    the last commit whose primary purpose completed that task. Later metadata or
    unrelated maintenance commits do not replace it.
  priorities:
    P0: Required for the first runnable MVP.
    P1: Required to harden the MVP into the specified first slice.

fixed_decisions:
  server:
    language: Go 1.25
    module: github.com/grauwolf32/contractor
    http_stack: Go standard library net/http
    database_driver: github.com/jackc/pgx/v5
  runtime_agent:
    language: Python 3.13
    packaging: uv with a src-layout package
    agent_framework: Google ADK Python
    a2a_sdk: Official a2a-sdk Python package
  planner:
    mvp: >-
      passthrough@1 is deterministic Go code and makes one A2A call. It records
      a durable Contractor planner session but does not need an LLM or ADK event
      loop.
    first_slice: >-
      streamline@1 and router@1 use Google ADK Go with a PostgreSQL-backed
      SessionService and a bounded typed subtask plan. Streamline has exactly
      one logical Worker; Router selects among a fixed non-empty logical Worker
      mapping without observing physical Runtime Agent identities.
  a2a:
    protocol: A2A 1.0
    binding: HTTP JSON-RPC
    go_sdk: github.com/a2aproject/a2a-go/v2
  persistence:
    database: PostgreSQL
    mvp_blob_backend: PostgreSQL bytea addressed through ArtifactStore
  deployment:
    topology: One VM, one Server process, PostgreSQL, and one or more identical single-slot Runtime Agent processes.
    private_security: Deployment-CA mTLS
    public_auth: >-
      One owner-only local-auth principal backs bounded in-memory browser
      sessions and the retained bearer-token automation path; cookie mutations
      require exact-origin CORS and session-bound CSRF.

milestones:
  - id: mvp
    exit_task: MVP-015
    outcome: >-
      A local user uploads one artifact, starts one exact Workflow version, and
      receives one frozen output after a Go Scheduler invokes one Python ADK
      Worker over A2A. All private traffic uses mTLS.
  - id: first-slice-hardening
    exit_task: V1-006
    outcome: >-
      Cancellation, lease fencing, retry, metrics, race safety, and the first
      model-backed Streamline Planner satisfy the v2 first-slice contracts.
  - id: project-workflows-mvp
    exit_task: V2-007
    outcome: >-
      A user can upload a bounded ZIP source tree and run the four-Stage
      OpenAPI or LikeC4 workflow through the real Go Server and Python Runtime
      Agent, receiving validated frozen documents and validation reports.
  - id: project-workflows-quality
    exit_task: V2-009
    outcome: >-
      The port has an opt-in live-model quality gate and explicit workflow
      variants that reuse caller-supplied discovery reports without adding
      implicit cross-Run cache semantics to Scheduler.
  - id: project-workflows-operations
    exit_task: V2-010
    outcome: >-
      Every Worker tool loop has explicit cumulative model, tool, and token
      budgets and terminates with complete safe metrics before Stage retry.
  - id: planner-routing-and-escalation
    exit_task: V3-010
    outcome: >-
      Streamline and Router execute a durable bounded subtask plan through
      deterministic Worker adapters, while Scheduler owns retry and pinned
      execution-configuration escalation.
  - id: server-ui-and-operations
    exit_task: V4-011
    outcome: >-
      A separately deployed React UI uses the committed public API, local
      browser sessions and a resumable WebSocket to operate Runs, inspect live
      Planner progress and manage active LLM configuration and credentials.

current_checkpoint:
  completed_through: V4-008
  next_task: V4-009
  summary: >-
    The repository now has an independently built React/Vite UI with committed
    generated OpenAPI types, direct cookie/CSRF transport, guarded owner routes,
    explicit public-API compatibility checks and a WebSocket adapter skeleton.
    A dependency-free Node service exposes only static files, health and closed
    non-secret runtime config with explicit fallback/cache/security behavior;
    its exact Node 24.20 container builds without rebuilding Go Server. V4-009
    next replaces the Artifact placeholder with the exact-version UserScope
    library required by the separately planned Workflow/Run-create and live
    Run-inspection slices V4-009A and V4-009B.

current_planning_review:
  reviewed_on: "2026-08-31"
  verdict: ready_to_implement
  checks:
    - >-
      V3-001 through V3-004 first correct the existing model-facing contract
      and deliver Streamline plus Router without waiting for the UI or managed
      configuration publication work.
    - >-
      Reusable configuration documents, immutable Run resolution and Scheduler
      escalation are separate tasks so each schema, resolver and state-machine
      change has an independently testable boundary.
    - >-
      Typed Planner state is introduced before persistence and WebSocket
      delivery; no UI task needs to scrape prompts, ADK state or generic tool
      payloads.
    - >-
      V4 starts with the committed API contract and a separate owner-scoped
      Workflow/Run/Artifact query slice before configuration, Operations,
      security and UI work. The Node service remains a static frontend host
      and never becomes a BFF or lifecycle authority.
    - >-
      Every new task is self-contained, names concrete production and test
      deliverables, and retains the full implementation-commit rule above.
    - >-
      Credential work is split into encrypted persistence (V4-003), generic
      recoverable lifecycle/public API (V4-003A), and the concrete bounded
      LiteLLM adapter (V4-004), so crypto, state transitions and HTTP behavior
      have independent gates.
    - >-
      The former all-in-one Workflow/Artifact/Run UI task is split into
      UserScope Artifact management (V4-009), Workflow selection/idempotent Run
      creation (V4-009A), and authoritative live Run inspection (V4-009B), so
      each mutation and resynchronization boundary has an independent commit.
  accepted_risks:
    - >-
      The first PlannerPlan intentionally omits legacy decomposition, skip and
      summarizer machinery; those operations can be versioned later if simple
      ordered subtasks prove insufficient.
    - >-
      Managed publication uses the specified single-Server process lock;
      distributed publication and remote configuration roots remain deferred.
    - >-
      UI visual design is deliberately functional and domain-neutral; design
      system expansion is outside the first Operations slice.

project_workflow_port:
  source_repository: /home/ruslan/src/contractor-old
  reviewed_revision: 9c76b56cf7b83377fb1dd5e4a17440fa27b723f3
  source_workflows:
    - contractor/workflows/oas_building
    - contractor/workflows/likec4_building
  retained_shape: >-
    dependency discovery, project discovery, document build, and repair-only
    validation remain four serial Stage executions using passthrough@1.
  intentional_differences:
    - >-
      Source code is a required application/zip Workflow input forked to
      inputs/source; Runtime never receives an arbitrary host project path.
    - >-
      Discovery reports and generated documents are explicit RunScope
      artifacts. A later Stage never reads an earlier Worker's sandbox.
    - >-
      Existing OpenAPI and LikeC4 documents are optional Workflow inputs and
      are copied into the document Agent's Namespace before mutation.
    - >-
      The default workflows rerun discovery. The old implicit cross-Run
      artifact-exists skip is represented later by explicit precomputed-input
      workflow variants, not hidden Scheduler state.
    - >-
      Old TaskRunner iterations/max_steps are not copied literally. One v2
      Stage is one bounded Planner/Worker invocation; whole-Stage retry remains
      explicit in Workflow transitions and the deployment Planner deadline is
      the hard wall bound.

planning_review:
  reviewed_on: "2026-08-30"
  verdict: project_workflow_increment_complete
  checks:
    - >-
      Dependency graph is acyclic and reaches a deterministic P0 exit through
      V2-001 -> V2-002 -> V2-003/V2-005 -> V2-004/V2-006 -> V2-007.
    - >-
      Every P0 task is independently testable, keeps one primary responsibility,
      and names its exact code/config/test deliverables and model-visible tools.
    - >-
      Server and Runtime descriptor parity is covered before a Workflow can
      select a Toolset; domain state remains RunScope artifacts rather than
      allocation-local hidden persistence.
    - >-
      The deterministic end-to-end task crosses all production boundaries and
      substitutes only the external model and fixed validator executables.
    - >-
      V2-008 exercises the same production stack against a real
      OpenAI-compatible model and records either semantic success or a bounded,
      actionable diagnostic without making ordinary CI network-dependent.
    - >-
      V2-009 expresses discovery reuse as explicit versioned Workflow inputs;
      it adds no hidden cache lookup or conditional Scheduler behavior.
    - >-
      V2-010 closes the live-evaluation runaway-loop finding at the Worker
      boundary and proves bounded failure, complete metrics, release, and slot
      reuse end to end.
  accepted_risks:
    - >-
      application/zip remains subject to the existing 16 MiB Artifact limit;
      larger repositories require the deferred streaming/S3 increment.
    - >-
      Vacuum and LikeC4 are direct Runtime host prerequisites. Missing binaries
      fail explicitly at tool use and never masquerade as successful validation.
    - >-
      Initial source search is bounded text search rather than the legacy
      tree-sitter/graph index. Live evidence shows that it is adequate for the
      compact fixture; larger or polyglot repositories may justify a future
      source-analysis@2.
    - >-
      Explicit caller-selected discovery reuse is implemented. Automatic cache
      keys, provenance compatibility checks, and invalidation remain deferred.
    - >-
      Model quality and result-envelope reliability remain provider-dependent.
      Finite Worker budgets now bound time and spend, but policy tuning across
      larger repositories needs a broader future evaluation matrix.

