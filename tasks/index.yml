run_metadata_labels_planning_review:
  reviewed_on: "2026-09-04"
  verdict: ready_to_implement_in_dependency_order
  agreed_contract:
    - >-
      Existing Run infrastructure selectors move from labels to runtimeLabels
      in a hard lockstep cutover with no type-based compatibility alias.
    - >-
      WorkflowRun metadata labels are a maximum-32 immutable string map,
      atomically durable, owner-scoped and part of canonical idempotency.
    - >-
      Exact repeated selectors use AND semantics; rich selector languages and
      post-create mutation are deferred.
    - >-
      Planner and Worker root traces receive the labels, but prompts, ADK
      State, tools, results, RuntimeConfig, placement and metric dimensions do
      not.
    - >-
      purpose=eval and eval.name/id/leg/fixture/case/sample are a client-owned
      convention. Each sample remains one ordinary WorkflowRun.
  dependency_review:
    - >-
      V20-001 first frees the public labels name while leaving all V8
      infrastructure semantics and durable snapshots untouched.
    - >-
      V20-002 owns strict validation, idempotent atomic persistence and read
      models; V20-003 adds only indexed list selection on that durable base.
    - >-
      V20-004 independently extends the strict private wire and telemetry after
      storage exists. V20-005 consumes only the completed public create/query
      API. V20-006 joins both paths in one production-process release gate.
    - >-
      The graph is acyclic and does not depend on unfinished V19 because Run
      metadata neither observes nor changes Worker session mode.
  review_findings:
    - >-
      Runtime and metadata labels must remain different domain types even
      though both are attached during Run creation; otherwise eval metadata
      could accidentally enter infrastructure merge or capability placement.
    - >-
      Labels repeat on create/list/detail but not every lifecycle event. Events
      retain runId correlation, avoiding bounded-but-multiplicative stream
      payload growth.
    - >-
      Runtime uses per-execution span attributes rather than process Resource
      attributes because one long-lived process serves different labeled Runs.
    - >-
      Normalized relational storage plus an exact key/value index supports
      owner/state/cursor conjunctions without scanning JSON for all historical
      Runs.
    - >-
      The end-to-end gate is eval-substrate verification, not the eval runner;
      suite definitions, scoring, pass@N aggregation and result envelopes are a
      later separately planned increment.
  accepted_risks:
    - >-
      The public field rename intentionally invalidates old request bodies and
      pre-cutover browser drafts. A drained lockstep upgrade is acceptable at
      the current pre-stable API stage.
    - >-
      Metadata values are declared telemetry-visible safe strings. Server
      cannot reliably detect a secret pasted by a caller and does not promise
      to redact an already accepted arbitrary value.
    - >-
      Version 1 cannot add or correct a label after Run creation; a caller must
      create a new Run, preserving experimental provenance.
    - >-
      Exact AND filtering is deliberately less expressive than Kubernetes-like
      selectors, but covers eval grouping while keeping query cost bounded.

project_workspaces_planning_review:
  reviewed_on: "2026-09-04"
  verdict: ready_to_implement_in_dependency_order
  agreed_contract:
    - >-
      Project is optional durable organization around ordinary Runs and a
      ProjectScope ArtifactStore view; no default Project, ProjectSnapshot,
      batch launch entity or Project-aware Scheduler exists.
    - >-
      ProjectScope accepts arbitrary artifacts. Sources/OpenAPI/LikeC4/Docs/
      Diffs/Other are editable frontend upload shortcuts, not Server enums.
    - >-
      Project input refs resolve exactly once and fork into RunScope. Skills
      still resolve globally from owner UserScope and Runtime sees only RunScope.
    - >-
      primary output metadata drives advisory recommendations. Automatic output
      publication is create-only and a conflict cannot change Run success.
    - >-
      Queue is one owner-scoped nonterminal Run read model. Evaluation is a
      Project kind plus generic eval labels and remains a normal execution path.
    - >-
      Project application auth reuses encrypted RuntimeCredential and enters
      plaintext RuntimeSettings only in AllocationSpec after placement.
  dependency_review:
    - >-
      V23-001 establishes ownership/identity; V23-002 adds ProjectScope; V23-003
      composes exact Project inputs with the unchanged Run path. This is the
      shortest Server-side vertical slice.
    - >-
      V23-004 is separate schema/catalog work. V23-005 joins exact Run outputs
      to ProjectScope only after both input membership and output intent exist.
    - >-
      V23-006 delivers useful artifact organization before recommendations;
      V23-007 then consumes completed Project, artifact, Run and output schemas
      and is the first user-facing MVP exit.
    - >-
      Queue, Evals/Skills and target auth remain independently testable P1
      slices. V23-011 is the only task that joins every production boundary.
  review_findings:
    - >-
      Interpreting the same ArtifactRef by endpoint avoids adding scope to the
      public ref and prevents mixed-scope ambiguity inside one Run request.
    - >-
      Create-only automatic publication avoids a subtle last-finisher-wins race
      between recomputations. Explicit later replacement retains ordinary CAS.
    - >-
      A numeric queue position would be false because cancellation, recovery,
      claims and capability placement can reorder effective progress.
    - >-
      Proxy and origin credentials require different kinds: reusing encrypted
      storage is correct, reusing proxy Authorization semantics is not.
  accepted_risks:
    - >-
      Compatibility initially uses current binding media type only and does not
      score semantic freshness or inspect payload schemas.
    - >-
      One optional Project HTTP target is sufficient for the first slice;
      multiple targets and OAuth need a later typed contract.
    - >-
      Automatic publication of technical outputs grows ProjectScope history;
      Project retention and explicit Workflow composition are deferred.

audits_planning_review:
  reviewed_on: "2026-09-05"
  verdict: corrected_after_contract_review_ready_to_implement_in_dependency_order
  implementation_baseline: a7b4aa8d8cefc865c16c2be9ce7c554400c4803a
  checks:
    - >-
      Audit is not a Project kind, Workflow subtype, Planner mode, Scheduler
      branch or ArtifactStore scope. It is a Project-bound durable coordinator
      that creates ordinary pinned Runs through a trusted service.
    - >-
      Exact baseline ArtifactRefs require revisions. Audit start retains the
      complete resolved profile/workflow/Run-runtime closure and credential
      holds, closing mutable catalog, Run-label and credential-deletion gaps
      between later rounds. Physical Agent labels retain normal allocation-time
      semantics.
    - >-
      User-settable audit.* Run labels are limited to search/telemetry. Database
      association committed atomically with child Run creation is the only
      authority and prevents label spoofing or orphan recovery ambiguity.
    - >-
      Existing create-only Project outputs cannot host repeated result/proposal
      slots. A trusted audit-managed publication mode suppresses generic
      publication while exact Audit import creates protected namespaced
      ProjectScope bindings; no AuditScope or Runtime Project authority appears.
    - >-
      The first vertical slice is deterministic and one-round: strict profile,
      packages/inventory, store/API, trusted Run creation, reconcile/import,
      lifecycle and UI. Finding intake and human/multi-round behavior follow
      only after the retention and cancellation boundaries exist.
    - >-
      Exact OpenAPI source byte identity is provenance only. Stable operation
      identity uses a separate normalized canonical inventory digest; required
      remote dependencies reject inventory while unselected callback/webhook
      surfaces become gaps and are never fetched.
    - >-
      Catalog validity does not imply executable support. Dedicated read-only
      profile projections report compatibility and start atomically gates
      unsupported review, discovery, multi-round, batching and input-dependent
      manual work with stable reason codes.
    - >-
      Terminal Run observation only enters collecting. One durable collection
      receipt covers accepted, missing, invalid, failed or cancelled output and
      owns retry-or-settle; only settled logical items enter the Round barrier.
    - >-
      AuditExecutionItem separates logical AuditItem attempts from WorkflowRun
      executions now. MVP enforces batchSize=1; later complete-result batching
      can reuse workspace without merging permissions or conversation state.
    - >-
      Run deletion waits for terminal release plus collection, not successful
      import. Dispatch credential holds, exact Skill pins, Audit evidence holds
      and ordinary proposal pins have explicitly different release conditions.
    - >-
      MVP UI uses authoritative revision/ETag polling. Audit WebSocket sequence,
      authorization and resync are deferred together rather than inferred from
      the existing Run event socket.
    - >-
      OWASP Top 10:2025 is treated as risk awareness, while stable ASVS 5.0.0
      identifiers are version-qualified. Neither incomplete automation nor an
      empty inventory can be rendered as certification or complete compliance.
    - >-
      Every V25 task repeats its context and acceptance tests for an implementer
      who has not read docs/spec. Completed tasks must record the full hash of
      their final implementation commit under implementation_commit.
  accepted_risks:
    - >-
      AuditProfile is operator-loaded and read-only in the first increment;
      managed/public profile authoring waits for an explicit API and licensing
      contract.
    - >-
      Aggregate monetary/token totals remain advisory until conservative
      cross-Run reservations exist. Exact per-Run execution budgets remain
      enforced by current Workflow/ModelPolicy machinery.
    - >-
      The MVP supports deterministic checklist/OpenAPI inventory and one Round.
      Model discovery, finding confirmation and multiple rounds are deliberately
      isolated in later tasks rather than hidden inside the first Controller.
    - >-
      V25 stores a batch-ready relational/result shape but executes one item per
      Run. Whole-batch retry is accepted for the later bounded batching task;
      durable partial item checkpoints require another receipt protocol.
    - >-
      V25-008A supplies runnable generic checklist/OpenAPI examples. Curated Top
      10 and ASVS packages/programs remain separate V26 deliverables because
      their mappings, licensing and evidence contracts need independent gates.

scheduler_concurrency_planning_review:
  reviewed_on: "2026-09-05"
  verdict: ready_to_implement_in_dependency_order
  inspected_baseline:
    - >-
      internal/scheduler Scheduler.Run currently invokes RunOnce serially;
      RunOnce owns one renewable Run claim through the complete bounded
      lifecycle attempt.
    - >-
      ClaimRunnableRun already uses PostgreSQL FOR UPDATE SKIP LOCKED,
      cancellation-first ordering and updated-at rotation, while owner Queue
      Pause serializes only normal Stage admission.
    - >-
      Each Runtime Agent process has one slot, but one Stage may reserve several
      compatible agents. The supported deployment has one active Server;
      multi-Server global coordination remains deferred.
    - >-
      Operations already provides capability/CSRF/CAS conventions and typed
      process-local invalidations, but has no durable general settings resource
      or Settings route.
    - >-
      Audit maxActiveRuns counted reserved/nonterminal child Runs rather than
      runtime execution. Because Audit children are ordinary WorkflowRuns, that
      public policy duplicated Scheduler concepts under a misleading name.
  agreed_contract:
    - >-
      Global maxConcurrentRuns in 1..32 is the sole WorkflowRun execution limit
      for standalone, Project, Evaluation and Audit sources. Default one
      preserves current behavior.
    - >-
      GET/PUT /v1/operations/settings/scheduler is one strict singleton
      resource with strong revision ETag, CSRF, Operations authorization,
      no-store reads, audit logging and no action/query-force variants.
    - >-
      Scheduler limits concurrent Run claims/progression, not durable running
      records. Dynamic increases wake lanes and decreases drain; no active Run
      is cancelled solely by a setting change.
    - >-
      Queue Pause stays owner-scoped. Runtime slot compatibility may lower
      actual concurrency, while cancellation/release/recovery maintenance is
      never disabled by the semantic lane limit.
    - >-
      AuditProfile maxActiveRuns is removed before Audit persistence/API. The
      Controller derives a per-Audit outstanding submission window from the
      current global value and retains maxSubmittedRuns only as a cumulative
      bounded-work budget.
  dependency_review:
    - >-
      V25-002A corrects the already implemented AuditProfile catalog before
      V25-003 persists snapshots or limits and before V25-006 dispatch exists.
    - >-
      V27-001 adds hidden durable settings first; V27-002 consumes them in the
      production Scheduler; V27-003 then exposes an already effective API;
      V27-004 adds UI and V27-005 joins all production boundaries.
    - >-
      V25-006 depends only on the effective V27-002 backend, not on Operations
      API/UI, and remains responsible for transactional derived-window dispatch
      across two Audit Controllers.
  explicit_non_goals:
    - Per-owner, Project, Workflow or Audit execution quotas and queue priority.
    - Automatic limit changes from Runtime Agent count or multi-slot agents.
    - Multiple active Server/Control Plane replicas or a distributed semaphore.
    - Concurrent StageExecutions inside one WorkflowRun.

