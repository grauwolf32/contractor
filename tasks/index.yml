  reviewed_revision: 9c76b56cf7b83377fb1dd5e4a17440fa27b723f3
  implementation_references:
    - contractor/tools/code/annotations.py
    - contractor/agents/trace_agent/agent.py
    - contractor/agents/trace_agent/prompts/converge.md
    - contractor/skills/trace/references/annotations.md
  test_references:
    - tests/units/contractor_tests/tools/test_code_annotations.py
  retained_surface: [annotate_trace, annotate_validate, annotate_sink]
  intentional_differences:
    - >-
      taint-annotations@1 receives one narrow workspace Writer; it never sees a
      raw fsspec object, Runtime storage provider, root or ArtifactRef.
    - >-
      Real function-like definitions resolve case-sensitively; duplicate names
      require definition_line instead of selecting the first search result.
    - >-
      Annotation placement preserves decorators, attributes, exports and
      templates. Different trace targets can coexist in insertion order.
    - >-
      Exact replay returns changed=false, while a changed body for the same
      target conflicts. A compare under update_text prevents lost concurrent
      Edit-tool changes.
    - >-
      PHP uses the trace Skill's // convention and Haskell/Lua use --. Stable
      errors and automatic telemetry omit source, paths and annotation values.
  rejected_surface: >-
    Mutable Trailmark graph annotations, generic editing authority, grep
    fallback, host materialization, annotation deletion/replacement, a Server
    annotation endpoint and persistence outside ordinary overlay artifacts.

taint_annotations_planning_review:
  reviewed_on: "2026-09-02"
  verdict: ready_to_implement
  blocking_findings: []
  checks:
    - >-
      The design reuses context.workspace, exact Toolset operation placement,
      WorkspaceWriter atomic mutation, overlay auto-export, ToolInstance
      teardown, metrics and Agent Skill pinning. It adds no wire type, database
      table, public/private endpoint, label, credential or infrastructure channel.
    - >-
      V16-001 keeps the descriptor inert until V16-002 registers a complete
      factory. V16-002 is the smallest usable portable MVP and owns all three
      operations so capability cannot imply inconsistent language coverage.
    - >-
      Structural identity is intentionally path + exact symbol + optional line,
      not code-analysis symbolId: the latter is graph-engine and digest local,
      while annotation works on memory Runtime Agents without Trailmark.
    - >-
      Parsing outside the event loop plus an exact compare inside update_text
      closes both heartbeat starvation and cross-Toolset lost-update races
      without widening WorkspaceWriter or inventing a second persistence API.
    - >-
      V16-003 independently owns cancellation, race, bound and redaction proof;
      V16-004 owns only Skill/template/Workflow compatibility; V16-005 crosses
      the real PostgreSQL, mTLS, Scheduler, A2A and Runtime process boundaries.
    - >-
      Every task is self-contained, testable, acyclic and records the full last
      implementation commit when completed under implementation_commit_rule.
  accepted_risks:
    - >-
      Version 1 inserts but does not replace/delete annotations. A conflicting
      same-target trace requires rollback or a future reviewed mutation API;
      this keeps retries deterministic and avoids silent evidence rewriting.
    - >-
      Tree-sitter provides structural, not semantic, identity. Overloads or
      repeated local functions with equal names require a current line selector,
      and edits that shift it require re-reading before retry.
    - >-
      Direct-mode annotations intentionally disappear at release. Workflows
      needing a durable diff must declare overlay export explicitly.
    - >-
      This application boundary prevents tools from seeing provider paths; it
      is not an OS sandbox against arbitrary trusted Runtime Python code.

project_workflow_port:
