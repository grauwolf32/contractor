    - >-
      V2-008 exercises the same production stack against a real
      OpenAI-compatible model and records either semantic success or a bounded,
      actionable diagnostic without making ordinary CI network-dependent.
    - >-
      V2-009 expresses discovery reuse as explicit versioned Workflow inputs;
      it adds no hidden cache lookup or conditional Scheduler behavior.
    - >-
      V2-010 closes the live-evaluation runaway-loop finding at the Worker
      boundary and proves bounded failure, complete metrics, release, and slot
      reuse end to end.
  accepted_risks:
    - >-
      application/zip remains subject to the existing 16 MiB Artifact limit;
      larger repositories require the deferred streaming/S3 increment.
    - >-
      Vacuum and LikeC4 are direct Runtime environment prerequisites. The
      planned startup probes omit their validation tools when unavailable, so
      a requiring Stage waits for compatible capacity rather than assigning a
      Worker that cannot honor the validator contract.
    - >-
      Initial source search is bounded text search rather than the legacy
      tree-sitter/graph index. Live evidence shows that it is adequate for the
      compact fixture; larger or polyglot repositories may justify a future
      source-analysis@2.
    - >-
      Explicit caller-selected discovery reuse is implemented. Automatic cache
      keys, provenance compatibility checks, and invalidation remain deferred.
    - >-
      Model quality and result-envelope reliability remain provider-dependent.
      Finite Worker budgets now bound time and spend, but policy tuning across
      larger repositories needs a broader future evaluation matrix.

