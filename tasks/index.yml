  retained_behavior: >-
    Virtual rooted paths, bounded path-aware glob/read/search, exact text Edit
    semantics, CRLF preservation, lower-preserving overlay writes, tombstones,
    type conflicts, deterministic changed paths, unified diff and rollback.
  rejected_behavior: >-
    Implicit overlay wrapping, concrete Overlay isinstance checks in Edit
    tools, stock global MemoryFileSystem isolation, raw lower delegation,
    readable symlinks, unbounded fallback scans, model-visible materialize,
    binary patching and the specialized longest-byte fork merge.

runtime_filesystems_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_to_implement_independently
  checks:
    - >-
      Workflow owns logical source/state aliases and mode; Scheduler reuses
      durable StageContext pins and sends exact refs in AllocationSpec. No new
      Artifact endpoint/store, workspace SQL plane or public filesystem API is
      introduced.
    - >-
      Allocation scratch remains local-workdir@1 while projectfs is a separate
      optional WorkspaceSession. Runtime startup chooses only local|memory
      storage/limits and never sees operator project roots.
    - >-
      The implementation package is contractor_runtime.projectfs because
      contractor_runtime.workspace already owns allocation scratch; no task
      creates a conflicting Python module/package or renames existing imports.
    - >-
      V11-001 through V11-006 establish wire/YAML/pinning/provider/hydration and
      cumulative overlay contracts before all three model-visible Toolsets.
      V11-010 alone owns export-before-terminal and checkpoint advancement.
    - >-
      V11-011 is the deterministic process gate for local/memory, exact refs,
      Router isolation and release. V11-012 closes legacy/adversarial parity,
      races, cancellation, exact limits and retained-surface scans.
    - >-
      Direct edits mutate only the disposable allocation copy. Overlay export
      writes cumulative state and checkpoint diff through existing allocation
      Artifact grants before terminal A2A. There is no materialize or host
      recovery journal.
    - >-
      ZIP entry/count/expanded bytes, managed text/file bytes, state/diff and
      Artifact payload limits are executable before mutation/export and are
      repeated in self-contained task acceptance tests.
    - >-
      Local storage retains binary files while memory skips them; both expose
      only strict UTF-8-no-NUL managed text through tools and overlay state.
    - >-
      Stock fsspec MemoryFileSystem global class state and instance cache are
      explicitly excluded as isolation mechanisms. Tests create simultaneous
      and sequential allocation sessions and prove teardown/prefix separation.
    - >-
      Every V11 task repeats paths, bounds, failure behavior and exclusions for
      a worker with no spec context, remains independently testable and starts
      with implementation_commit null.
  accepted_risks:
    - >-
      Tool confinement is an application boundary, not an OS sandbox against
      arbitrary in-process plugins. No shell or Python execution tool is added.
    - >-
      Artifact payloads remain capped at 16 MiB, so very large cumulative state
      or diff export fails deterministically until chunking/S3 streaming exists.
    - >-
      Router siblings intentionally diverge after hydration. Synchronization
      requires an explicit later Stage consuming an exported state revision.
    - >-
      Binary files are available only in disposable local storage and excluded
      from text tools/state/digests. Binary patches are a future media type.

http_caido_planning_review:
  reviewed_on: "2026-09-01"
  verdict: ready_to_implement_after_v11
  checks:
    - >-
      http-tools@1 and caido@1 are separate Toolsets. Caido control uses the
      new typed caido-graphql@1 adapter; it is never confused with the existing
      HTTP forward proxy.
    - >-
      Runtime labels configure endpoint/routing/credentials while AgentTemplate
      grants exact tools. Placement and Runtime prepare both require the Caido
      adapter when caido@1 is selected.
    - >-
      Generic HTTP keeps target 4xx/5xx as data, makes a configured proxy route
      mandatory, stores full bodies as bounded artifacts and keeps auth/session
      secrets only in allocation memory.
    - >-
      Caido exposes only compiled GraphQL operations with bounded variables and
      artifact-backed raw exchanges. Mutation calls are not retried after
      ambiguous sends.
    - >-
      V12 tasks cover contracts/store, adapter, generic HTTP, read/mutation
      Caido tools, Skill/config wiring, heterogeneous process E2E and security
      hardening in dependency order.
  accepted_risks:
    - >-
      Generic HTTP intentionally reaches model-selected network targets; the
      first increment denies Contractor private origins but does not claim a
      complete DNS/network namespace sandbox.
    - >-
      Caido GraphQL compatibility is pinned to the migrated static operations;
      a future Caido schema change may remove the adapter/tool capability until
      code and fixtures are updated.

project_workflow_port:
  source_repository: /home/ruslan/src/contractor-old
  reviewed_revision: 9c76b56cf7b83377fb1dd5e4a17440fa27b723f3
  source_workflows:
    - contractor/workflows/oas_building
    - contractor/workflows/likec4_building
  retained_shape: >-
    dependency discovery, project discovery, document build, and repair-only
    validation remain four serial Stage executions using passthrough@1.
  intentional_differences:
    - >-
      Source code is a required application/zip Workflow input forked to
      inputs/source; Runtime never receives an arbitrary host project path.
    - >-
      Discovery reports and generated documents are explicit RunScope
      artifacts. A later Stage never reads an earlier Worker's sandbox.
    - >-
      Existing OpenAPI and LikeC4 documents are optional Workflow inputs and
      are copied into the document Agent's Namespace before mutation.
    - >-
      The default workflows rerun discovery. The old implicit cross-Run
      artifact-exists skip is represented later by explicit precomputed-input
      workflow variants, not hidden Scheduler state.
    - >-
      Old TaskRunner iterations/max_steps are not copied literally. One v2
      Stage is one bounded Planner/Worker invocation; whole-Stage retry remains
      explicit in Workflow transitions and the deployment Planner deadline is
      the hard wall bound.

planning_review:
  reviewed_on: "2026-08-30"
  verdict: project_workflow_increment_complete
  checks:
    - >-
      Dependency graph is acyclic and reaches a deterministic P0 exit through
      V2-001 -> V2-002 -> V2-003/V2-005 -> V2-004/V2-006 -> V2-007.
    - >-
      Every P0 task is independently testable, keeps one primary responsibility,
      and names its exact code/config/test deliverables and model-visible tools.
    - >-
      Server and Runtime descriptor parity is covered before a Workflow can
      select a Toolset; domain state remains RunScope artifacts rather than
      allocation-local hidden persistence.
    - >-
      The deterministic end-to-end task crosses all production boundaries and
      substitutes only the external model and fixed validator executables.
    - >-
      V2-008 exercises the same production stack against a real
      OpenAI-compatible model and records either semantic success or a bounded,
      actionable diagnostic without making ordinary CI network-dependent.
    - >-
      V2-009 expresses discovery reuse as explicit versioned Workflow inputs;
      it adds no hidden cache lookup or conditional Scheduler behavior.
    - >-
      V2-010 closes the live-evaluation runaway-loop finding at the Worker
      boundary and proves bounded failure, complete metrics, release, and slot
      reuse end to end.
  accepted_risks:
    - >-
      application/zip remains subject to the existing 16 MiB Artifact limit;
      larger repositories require the deferred streaming/S3 increment.
    - >-
      Vacuum and LikeC4 are direct Runtime environment prerequisites. The
      planned startup probes omit their validation tools when unavailable, so
      a requiring Stage waits for compatible capacity rather than assigning a
      Worker that cannot honor the validator contract.
    - >-
      Initial source search is bounded text search rather than the legacy
      tree-sitter/graph index. Live evidence shows that it is adequate for the
      compact fixture; larger or polyglot repositories may justify a future
      source-analysis@2.
    - >-
      Explicit caller-selected discovery reuse is implemented. Automatic cache
      keys, provenance compatibility checks, and invalidation remain deferred.
    - >-
      Model quality and result-envelope reliability remain provider-dependent.
      Finite Worker budgets now bound time and spend, but policy tuning across
      larger repositories needs a broader future evaluation matrix.

