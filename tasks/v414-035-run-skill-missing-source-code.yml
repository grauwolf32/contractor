schema_version: "1.0"
id: V414-035
title: "Fail Run initialization with skill_artifact_not_found when a pinned Skill source is gone"
milestone: review-v407-v409-followups-2026-10
epic: agent-skills
kind: defect
introduced_by: V10-003
priority: P2
status: pending
depends_on: []
languages: [go]
goal: >-
  A Run whose pinned Agent Skill source revision no longer exists fails
  initialization with the permanent skill_artifact_not_found that RUN-R27
  requires, while a transient read failure keeps the retryable
  skill_artifact_unavailable.
context:
  specification:
    - docs/spec/execution/runs.md#RUN-R27
    - docs/spec/tools/skills.md
  review: >-
    Found while implementing V410-010 (tasks/done/v410-010-artifact-history-retention.yml,
    notes). The user asked on 2026-10-24 to file it and fix it next.
  severity: medium
  finding: >-
    internal/agentskills/run.go:173-176 maps every error from
    store.Read(ctx, artifacts.ArtifactRef(*skill.Source)) to
    runSkillError(CodeArtifactUnavailable, skill.Name, true), including a
    committed not-found. RUN-R27 (docs/spec/execution/runs.md:391-394)
    requires skill_artifact_not_found for a committed missing source, so a
    Run whose Skill source was removed is retried as unavailable instead of
    failing with the stable not-found code. Line 171 already returns
    CodeArtifactNotFound when the pin has no source at all.
  siblings: >-
    Every reader of a pinned Skill source revision: Run initialization
    (this one), Audit Skill sources, Planner or Worker Skill package reads
    in the Runtime handoff, and any other caller of the agentskills package
    that reads a source by exact revision. Each distinguishes not found
    from unavailable or is ruled out with the reason.
scope:
  in:
    - "Map the ArtifactStore's not-found result for the exact Skill source revision to the permanent skill_artifact_not_found; keep other read failures retryable."
    - "Apply the same classification to every sibling listed above."
    - "A real-PostgreSQL regression test that removes the pinned revision and observes the Run fail initialization with skill_artifact_not_found and no StageExecution."
  out:
    - "Changing when Skill source revisions may be removed; V410-010 holds them while referenced."
acceptance_criteria:
  - id: A1
    text: "A Run whose pinned Skill source revision is missing fails initialization with skill_artifact_not_found, not retryable, and no StageExecution (FAIL-RUN-2)."
  - id: A2
    text: "A transient store failure still answers the retryable skill_artifact_unavailable."
  - id: A3
    text: "Each sibling reader behaves the same way or is ruled out with the reason."
  - id: A4
    text: "The regression test fails on the unfixed code with skill_artifact_unavailable."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 ./internal/agentskills/... ./internal/runservice/..."
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A3, A4]
