schema_version: "1.0"
id: V414-009
title: "Declare the byte bounds of machine values in the public API and hold OpenAPI, Go and the UI to them"
milestone: review-v407-v409-followups-2026-10
epic: api-contracts
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [go, typescript, yaml]
goal: >-
  Every public string that the Server bounds in UTF-8 bytes declares that bound, either as
  x-max-utf8-bytes next to an equal maxLength or as an ASCII-only grammar under which maxLength
  already equals bytes, so a client that follows OpenAPI never sends a value the Server rejects for
  its size; the existing shared byte-bound gate covers request bodies, inline schemas and
  parameters.
context:
  review: >-
    tasks/done/v407-021-public-api-grammars-one-definition.yml, verification.declined, the note
    "x-max-utf8-bytes is declared for the reviewed human free-text fields only. Machine values
    bounded in bytes ... a follow-up task should decide them".
  specification:
    - docs/spec/api/public-api.md
    - docs/spec/platform/limits.md
    - docs/spec/configuration/runtime-config.md#RCF-R113
    - docs/spec/artifacts/git-import.md#GIT-R40
  finding: >-
    Rechecked on 19f7477f: x-max-utf8-bytes is still declared only for the reviewed free-text
    fields (19 occurrences in api/openapi/contractor-public-v1.yaml, all listed in
    api/testdata/public/utf8-byte-bound-cases.json plus LoginRequest.password). Machine values keep
    a code-point maxLength while Go counts bytes and accepts non-ASCII, for example: Git import ref
    (OpenAPI GitImportRequest.ref maxLength 1024; internal/gitimport/client.go:217 rejects
    len(ref) > 1024 bytes, so 513 copies of "é" pass the schema and fail with the ref error) and
    repositoryUrl (maxLength 4096; client.go:77 counts bytes); GatewayFailureSignature
    messageEquals / litellmWrapped (maxLength 512; internal/contracts/llmgateway/llm_gateway.go:151
    counts bytes, LIM-RCF-1); RuntimeCredential material tokens and passwords (maxLength 8192;
    internal/credentials/runtime_types.go:23,374-386 counts bytes and accepts any byte >= 0x20);
    OTLPHeadersMaterial header values (maxLength 4096, LIM-RCF-21 bytes). Other values in the note
    are ASCII by grammar or opaque (caBundlePem, privateKey, cursors, Audit artifact key, revision
    and member query parameters, archive paths, scan sweep parameter values) and need either an
    ASCII declaration or a byte bound. internal/httpapi/public/utf8_byte_bounds_test.go:37-77
    (TestSharedUTF8ByteBoundsAreDeclared) walks only components.schemas, so inline request bodies
    (PUT /v1/settings/git-key privateKey) and query parameters (cursor, key, revision, member) are
    outside the gate.
  siblings: >-
    OpenAPI document; the Go owners named in utf8ByteBoundOwners; the generated Go client
    (internal/publicclient/generated, regenerate only); the UI stringRule in ui/src/api/contract.ts
    and its test ui/src/api/contract.test.ts, which already read x-max-utf8-bytes from the
    generated schemas; ui/src/api/generated (regenerate only). The bearer-token grammar task V414-015 of this
    milestone (Project target and infrastructure tokens become HTTP field values, ASCII only) makes
    token maxLength equal to bytes; coordinate so the token fields are declared once.
  provenance: >-
    introduced_by is omitted: each field received its code-point maxLength in the task that added
    it (Git import, RuntimeConfig credentials, Gateway failure signatures, cursors), and V407-021
    deliberately declined the machine values as a separate change; no single task introduced the
    gap.
  decision: >-
    Chore, not feature or defect: the Server's accepted set does not change. Per field, choose
    and record in the shared fixture: (a) non-ASCII accepted and bounded in bytes: declare
    x-max-utf8-bytes equal to maxLength and add the field with its LIM rule and Go owner to
    utf8-byte-bound-cases.json; (b) ASCII-only by grammar: declare the grammar (pattern or an
    existing shared grammar fixture) and assert the Go validator rejects non-ASCII, with no byte
    extension; (c) opaque Server-issued values (cursors, revisions): declare them ASCII. Changes are
    additive within /v1.
  implementation: >-
    2026-10-30. Scope: client-sent strings (request bodies and parameters, following $refs); a
    response schema is declared only where it shares the request's component (AuditSubjectKey) or
    rule (sitemap pointers). (a) x-max-utf8-bytes and fixture entries: GitImportRequest ref and
    repositoryUrl (new LIM-GIT-22, LIM-GIT-23), GitPrivateKey (new component, LIM-GIT-3),
    GatewayFailureSignature texts (LIM-RCF-1), BasicCredentialUsername/Password (LIM-RCF-23), scan
    sweep parameter names and values (new LIM-SCN-94), ArchiveFilePath (new component, LIM-API-27),
    AuditArtifactKey and AuditSubjectKey (new components, LIM-AUD-39, LIM-AUD-40), SitemapMutation.url
    (LIM-SMT-2) and the sitemap rule/declaration pointers (new LIM-SMT-16; OpenAPI said 8192 while
    the reducer bounds them at 2 KiB, so the declaration was corrected, the Server is unchanged).
    Literal Go bounds became named constants (gitimport, credentials, scanservice, auditstore,
    projectsitemap). (b) CABundlePEM (new component, ASCII class) and OTLP header names (HTTP token
    pattern), with Go tests that non-ASCII is rejected. (c) sealed cursors and Eval bin tokens declare
    unpadded base64url; the Audit artifact revision uses Revision and member the identifier
    grammar; sitemap memberIds declare SHA-256 hex. format uri counts as an ASCII grammar (RFC 3986;
    the Go URL validators also accept IRIs and percent-encode them, which is wider than the contract
    and never a size rejection of a conforming value). TestSharedUTF8ByteBoundsAreDeclared now finds
    every x-max-utf8-bytes anywhere in the raw document (each must be a listed component location)
    and classifies every request string with a maxLength; TestUTF8ByteBoundCheckFindsProbes pins
    that it can fail. A4 was checked by running the extended gate against the unchanged document:
    it fails for ref, messageEquals and both Basic credential schemas, among others. Exceptions,
    listed with reasons in requestStringsWithoutByteBound: code-point bounds (credential label,
    ModelPolicy model, catalog q), Eval lookups that the Server only compares (projectId, suiteId,
    variantId, viewSnapshot), Eval documents (validated by the embedded Eval JSON Schemas, code
    points), and two composites whose parts carry separate bounds: Run label selectors key=value
    (key grammar, LIM-RUN-5 value bytes) and sitemap rule origin+path (one shared 8 KiB). Reopen
    the composites if label selectors become separate key and value parameters or the sitemap rule
    takes a single route string.
scope:
  in:
    - "Inventory every public string, inline schema and parameter whose Go bound counts bytes, starting from the V407-021 list, and classify it as (a), (b) or (c)."
    - "Declare (a) fields with x-max-utf8-bytes and add them to api/testdata/public/utf8-byte-bound-cases.json with their LIM rule and Go owner; declare (b) and (c) grammars."
    - "Extend TestSharedUTF8ByteBoundsAreDeclared to walk inline path schemas and parameters, and extend the UI contract test to the new fields."
    - "Register missing LIM entries for byte bounds that have none, and run make ui-generate and make generate-public-client."
  out:
    - "Changing any Server bound or accepted character set (the bearer-token grammar is V414-015)."
    - "Human free-text fields already declared by V407-021."
    - "Editing generated files by hand."
acceptance_criteria:
  - id: A1
    given: "every public string, inline schema and parameter whose Go validator counts bytes"
    when: "TestSharedUTF8ByteBoundsAreDeclared runs"
    then: "each is either listed in utf8-byte-bound-cases.json with x-max-utf8-bytes equal to maxLength and to its Go owner, or carries a declared ASCII grammar; the walk covers parameters and inline schemas"
  - id: A2
    given: "the shared characters a, é, € and 🛑 at exactly the byte bound and one byte over it for each (a) field"
    when: "the Go owners and the UI stringRule check them"
    then: "both accept the first and reject the second"
  - id: A3
    given: "the public API contract checks"
    when: "make verify-public-api runs"
    then: "the changes are additive within /v1 and the generated clients are current"
  - id: A4
    given: "the gate as it stands at 19f7477f"
    when: "the extended gate runs against the unchanged OpenAPI document"
    then: "it fails for GitImportRequest.ref, GatewayFailureSignature.messageEquals and the credential material fields"
tests:
  - command: "go test -count=1 ./internal/httpapi/public/... ./internal/contracts/... ./internal/gitimport/... ./internal/credentials/..."
    covers: [A1, A2, A4]
  - command: make ui-verify
    covers: [A2]
  - command: make verify-public-api
    covers: [A3]
  - command: make lint
    covers: [A1, A3]
