- id: A2
  text: Confirmed defects have reproduction, normative basis, priority, bounded correction task and meaningful regression;
    accepted or rejected hypotheses are recorded separately.
- id: A3
  text: Required commands execute successfully on the reviewed commit; relevant database/process/browser cases must
    not silently skip, and actual toolchain and evidence levels are recorded.
