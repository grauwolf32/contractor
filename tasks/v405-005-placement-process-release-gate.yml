schema_version: '1.0'
id: V405-005
title: Verify cloud and local placement across real processes and fold proposal 0043
milestone: runtime-placement-labels-2026-10
epic: execution-core
kind: feature
priority: P2
status: pending
depends_on:
- V405-001
- V405-002
- V405-003
- V405-004
languages:
- go
- python
- typescript
goal: A deterministic release gate proves location selection end to end across Server, Runtime and PostgreSQL,
  and the reference specification owns the delivered guarantees.
context:
  proposal: docs/proposals/0043-runtime-placement-labels.md
scope:
  in:
  - Process coverage for broad cloud, provider-specific, local and empty selection with heterogeneous
    capabilities.
  - Audit preparation/check/round propagation, capacity deferral, late Runtime connection, registration
    restart, retry/resume, cancellation and retained allocation provenance.
  - Release-verify graph integration and nonzero test-selection checks.
  - Fold proposal 0043 into current specifications and update operator examples and topology statements
    affected by remote Runtime deployment.
  out:
  - Live Gateway/model benchmarks, cloud VM provisioning APIs and demo deployment.
requirements:
- id: R1
  text: Use a disposable real PostgreSQL database, real Runtime startup arguments and deterministic non-model
    Workers. Gate skips only when its database URL is unset; a configured unreachable database and zero
    selected tests fail.
failure_outcomes:
- operation: Placement declaration, selection or observation at the task boundary
  permanent: Malformed, oversized or inconsistent input is rejected before mutation using the existing
    invalid_request/400 or registration-conflict/409 classification; no retry.
  retryable: Reuse subsystem storage_transaction_conflict/503 and existing bounded registration, controller
    or capacity backoff; read failures never fabricate empty success.
  ambiguous: Reconcile registration by immutable instance fingerprint and keyed writes through existing
    request receipts; do not introduce another journal.
  cancelled: Existing request/controller owner joins in-flight work; no new background worker survives
    cancellation.
  timeout: Existing registration/request/controller budgets own calls; capacity waiting does not consume
    the execution budget before admission.
cardinality:
- collection: Placement declarations and launch requirements
  expected: 1 location path per instance or launch
  maximum: 32 labels of at most 63 ASCII bytes each
  bound: Canonical sorted unique arrays, one compatible ancestor chain; no fleet IDs copied into launch
    snapshots.
- collection: Runtime fleet and UI inventory
  expected: A few local and cloud instances
  maximum: Existing bounded registry capacity times the per-instance label bound
  bound: Reuse registry limits and public pagination; no unbounded history scan or external lookup per
    label.
lifecycle:
- entity: Placement labels on existing Runtime incarnations, Runs, Audits or allocations
  delete: Follow the owning existing entity deletion API and authorization.
  cascade: No new side-table lifecycle; parent deletion removes its embedded placement data.
  retention: Runtime declarations live with their incarnation; immutable requirements and allocation provenance
    live with their owning retained Run/Audit.
acceptance_criteria:
- id: A1
  given: Real Server and heterogeneous Runtime processes with shared fixtures
  when: The location process gate runs
  then: Every accepted parent-match and lifecycle guarantee is exercised and wrong-location Runtime instances
    never receive allocations.
- id: A2
  given: The finished series
  when: Release-graph, API, wire and lint checks run
  then: The gate is reachable, all required commands pass, and proposal status/specification/operations
    documentation agree.
tests:
- command: make test-runtime-placement-e2e
  covers:
  - A1
- command: make test-wire-cross-language
  covers:
  - A1
  - A2
- command: make verify-public-api-postgres
  covers:
  - A2
- command: make lint
  covers:
  - A1
  - A2
