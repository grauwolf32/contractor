goal: Make registered schema and method the only authored semantic key; derive phase in the resolved route
  and accepted plan.
context:
  authority: The user explicitly requested creation, sequential implementation, verification, task closure
    and merge of the five reviewed simplifications on 2026-10-27.
  finding: internal/config/auditprofile/check_methods.go:16 and OpenAPI AuditCheckMethodMapping repeat
    phase already determined by internal/contracts/check_plans.go.
  review: Read-only review of main 4d50b1cfc4961adad9dfa1fef160ef338cbd86ba and the accepted five-step
    simplification plan.
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/configuration/catalog.md
  - docs/spec/api/public-api.md
scope:
  in:
  - Remove authored phase from profile mapping, public API and Studio; retain registry-derived phase in
    resolved snapshots, projection and accepted plans.
  - Update all Go/Python/UI readers, strict fixtures and generated clients together; reject removed authored
    fields rather than accept a legacy form.
  - Keep explicit Workflow bindings, exact Worker capability requirements and default/standard routing
    behavior.
  out:
  - No new model authority, arbitrary Workflow routing, receipt/lease store or permissive legacy reader.
  - No deployment, live model changes or modification of historical frozen evidence.
acceptance_criteria:
- id: A1
  text: Every registered method selects its existing phase and route; unknown methods and incompatible
    exact Worker tools fail.
- id: A2
  text: Authored phase is absent end to end; resolved phase remains deterministic and verified. Go/UI/OpenAPI/shared
    fixtures agree.
- id: A3
  text: Renamed roles do not infer method authority; active-check policy and approval requirements are
    unchanged.
tests:
- command: go test -tags=integration -count=1 ./internal/config/... ./internal/contracts ./internal/auditbaseline
    ./internal/auditdomain ./internal/auditservice ./internal/auditcontroller
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api verify-public-api-postgres test-wire-cross-language
  covers:
  - A1
  - A2
  - A3
- command: make ui-verify
  covers:
  - A1
  - A2
  - A3
- command: make test-audit-iterative-e2e
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
failure_outcomes:
  permanent: Invalid source, route, schema or exact bytes fail before target execution; no fallback.
  retryable: Reuse existing bounded retries and original deadlines.
  ambiguous: Reconcile existing receipt, generation, cursor and child intent; never append/recharge blindly.
  cancelled: Join owned work and preserve immutable accepted evidence; partial staged work stays private.
cardinality:
  bound: Preserve existing per-slice rows/bytes, page/closure ceilings and canonical report bounds; no
    whole-history hydration.
lifecycle:
  bound: Existing approval, pause, cancel, producer deletion and Audit purge remain authoritative.
