schema_version: "1.0"
id: V367-007
title: "Validate Runtime Agent toolset capabilities at registration with one grammar"
milestone: hub-audit-2026-10
epic: api-contracts
kind: defect
introduced_by: V323-001
priority: P1
status: in_progress
depends_on: []
languages: [go, python]
goal: "A registration that Operations could not show is rejected when it arrives, and the capability bounds live in one place shared by Go, Python and the schemas."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq), dispatch G3 / F2"
  specification:
    - docs/spec/execution/runtime-agent.md
    - docs/spec/execution/control-plane.md
    - docs/spec/operations/operations.md
  finding: >-
    Registration accepts a toolset with more than 256 tools or a tool name
    such as server:tool (contracts/control/agent.go:105-125,
    api/v1alpha1 agent-registration.schema.json:141-148, Python
    contracts registration.py:31-42), while controlplane/operations.go:24, 30,
    268-275 rejects the whole Operations snapshot for it, so all three
    Operations lists fail (operations_handlers.go:21, 42, 83, 115-119).
    Reproduced by the audit's overlay test. V323-001 (1dcadfc5) meant to
    remove the controlplane copy of the grammar but operationsConfigIDPattern
    remains.
  decision: >-
    Scope widened to what A1's property needs. The Operations snapshot also
    rejected registration values other than tools: a capability ref longer
    than 256 characters and an instanceId or reported allocationId outside
    the public ResourceId grammar, which registration and heartbeat accepted
    as any non-blank string. So registration and heartbeat now bound all of
    them, and spec CTL-R148 / LIM-CTL-9 record the rule. One Go definition
    each: contracts.ValidName (the public ConfigId grammar, at most 128
    characters, used for tool names and for the logical Worker names
    Operations shows, so operationsConfigIDPattern is gone), contracts.ValidResourceID
    (replacing operationsResourceIDPattern), and control.MaxRuntimeCapabilityRefs,
    MaxRuntimeCapabilityRefLength, MaxToolsetCapabilityTools,
    ValidRuntimeCapabilityRef and ValidateToolsetCapability, which both
    registration and Operations call. Sibling paths fixed: the private
    registration and heartbeat schemas, the Runtime models, the Server's
    Toolset descriptor registry (every selectable tool name now has the same
    grammar), and Runtime discovery, which now fails startup with a safe
    error (RTA-R112) instead of building a registration the Server always
    rejects. The shared cases are also checked against the public
    RuntimeAgentObservation schema. Ruled out: AgentTemplate selections and
    AllocationSpec tool lists (each selected tool must be a descriptor export
    and within the registered capability, TLS-R19/R20); Server-issued
    allocationIds in AllocationSpec, finalize/abort/release and
    HeartbeatResponse (randomid values, never Runtime input to Operations);
    the UI Operations decoder (it already applies the public schema bounds,
    which the shared cases now pin). Left open: Workflow agent names are only
    checked as non-blank without a slash (config validateMapKey) although
    Operations shows them as logicalWorker in the ConfigId grammar; the
    Runtime retries a permanently rejected registration forever
    (control_client.register_until_stopped); six other Go copies of the
    ResourceId pattern (auditstore, runstore, evalstore, auditservice,
    httpapi/public request and events) and auth's principal ID copy of the
    ConfigId pattern still exist.
scope:
  in:
    - "The tool-count bound and the tool-name grammar move to contracts (control or core) and are enforced by registration validation in Go, by the registration JSON Schema and by the Python model; controlplane uses the shared rule and its own copy is removed."
    - "A shared fixture api/testdata/v1alpha1/runtime-capability-cases.json read by Go and Python."
  out:
    - "Which tools a toolset declares."
acceptance_criteria:
  - id: A1
    text: "Registration with 257 tools or a name outside the grammar is rejected in Go and Python; every accepted registration yields a valid Operations snapshot (property test)."
  - id: A2
    text: "The fixture cases pass on both sides through make test-wire-cross-language."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test ./internal/contracts/... ./internal/controlplane"
    covers: [A1]
  - command: make test-wire-cross-language
    covers: [A2]
  - command: "go test ./internal/config ./internal/httpapi/public -run 'TestToolsetDescriptorToolNamesGoldenCases|TestPublicRuntimeAgentObservationSchemaMatchesSharedCapabilityCases'"
    covers: [A1, A2]
  - command: "cd runtime && uv run pytest tests/test_contracts.py tests/test_capabilities.py"
    covers: [A1, A2]
