schema_version: "1.0"
id: V372-023
title: "Name the findings error codes the open question lists and register the findings tool codes"
milestone: hub-audit-defects-2026-10
epic: findings
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [markdown, python]
goal: "FND-R109, FND-R123 and FND-R135 name their codes, every findings_* code the Runtime findings tools return is in the errors.md registry with its retryability, and a test holds the Runtime to that list."
context:
  review: "Out-of-scope finding of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; still unresolved on b2b09ea"
  specification: "docs/spec/findings/findings.md#FND-R123"
  finding: >-
    The open-questions register (docs/decisions/open-questions.md:381-387,
    removed in af9fd522) recorded that several findings error codes are
    unnamed, and on b523ae77 they still are: FND-R109
    (docs/spec/findings/findings.md:1119-1121) gives publication failures
    as the statuses 404, 409, 400 and 422 without codes; FND-R123
    (:1211-1216) says a failed reader preparation reports "its bounded
    findings_* code"; FND-R135 (:1288-1290) calls the oversized-item answer
    "an explicit limit error". The findings cross-reference list
    (:1417-1422) names only three findings_* codes and says "Publication
    statuses are listed in FND-R109". The Runtime findings tools return ten
    findings_* codes: findings_collection_invalid, findings_digest_mismatch
    and findings_reference_invalid
    (runtime/src/contractor_runtime/toolsets/security_findings/collection.py),
    findings_arguments_invalid, findings_cursor_invalid,
    findings_reader_unavailable, findings_collection_unavailable,
    findings_document_conflict and findings_document_unavailable
    (reader.py), and findings_limit_exceeded (both). Only the last three
    reader codes are registered, in the Other error and stop codes table of
    docs/spec/platform/errors.md (:465-467); the other seven are not. The
    codes the model sees cannot be held to one definition (AGENTS.md 3.1).
    Predates the shallow history (boundary 6349621).
  siblings: >-
    The public publication codes of FND-R109 are registered public codes
    since V370-010; the specification only has to name them, and FAIL-FND-3
    (docs/spec/platform/failure-model.md:383) repeats the bare statuses.
    Other tool vocabularies are closed lists in errors.md (ERR-R10 to
    ERR-R13) or delegated with a requirement (ERR-R22, Interactsh); the
    findings tools get the same treatment. No other Runtime module emits a
    findings_* code (findings_by_offset in the Caido adapter is a field
    name). V371-011 adds no tool code (the evidence quota is an intake
    rejection).
  revalidated: >-
    2026-10-24 on b523ae77: the finding still holds; no requirement names
    the codes and errors.md still lists only the three reader preparation
    codes. Line references refreshed (findings.md and errors.md grew), the
    code-to-file mapping corrected, and the truncated goal sentence fixed.
scope:
  in:
    - "Name the codes in FND-R109, FND-R123 and FND-R135 (and FAIL-FND-3) and add a findings tool error list to errors.md with the retryability of each code."
    - "A Runtime test that every findings_* code the findings toolsets can return is in that list, and every listed tool code is reachable."
  out:
    - "Changing any code or its retryability."
acceptance_criteria:
  - id: A1
    text: "FND-R109, FND-R123 and FND-R135 name codes, errors.md lists every findings tool code with its retryability, and scripts/check_spec.py passes."
  - id: A2
    given: "A findings_* code added to collection.py or reader.py without a registry entry, or a registry entry no tool returns"
    when: "The Runtime tests run"
    then: "A test fails; on b523ae77 no test holds the codes to errors.md."
tests:
  - command: "cd runtime && uv run pytest tests/test_security_findings_toolset.py tests/test_findings_reader_toolset.py"
    covers: [A2]
  - command: "cd runtime && uv run python ../scripts/check_spec.py"
    covers: [A1]
  - command: make lint
    covers: [A1, A2]
