  boundary_decision: Tools own the semantic selection and validation. Shared Runtime helpers live in toolsets.common
    and are explicitly called by production consumers; no universal argument-rewriting plugin, hidden acceptance
    of deleted arguments, new receipt store, database entity or framework for hypothetical tools. Server remains
    the authoritative owner of grants, exact Artifact reads, CAS, receipts, retention and lifecycle. Existing
    private/public/wire/persisted revision fields remain strict; only model-facing inputs change. Update numbered
    owning specs, descriptions, active instructions and actual ADK schemas with implementation; this task
    plan does not change shipped specs.
  delivery_group: 1 / expected_revision. Read-side revision removal waits until this and the other stage-one
    tasks complete.
  parallel_plan_reconciliation: A separate, unmerged planning lane codex/v478-audit-plan-results exists at
    review time, with pending V478-002 (sources/evidence/fact) and V478-003 (submit_result/submit_results).
    Its task drafts still mention explicit correction revisions. This newer decision removes those model arguments
    too. Do not edit the other lane's uncommitted files or introduce a dependency on nonexistent main task
    records. Before touching a shared owner, reconcile the landing order and update the affected V478 drafts
    in their owning lane or after they land; then record real depends_on edges where needed. Apply this contract
    to the active names, never preserve submit_check_result aliases or restore revision arguments to satisfy
    an older draft. This is an integration precondition, not authorization to implement/merge V478 or widen
    this package into durable evidence collection.
  correction_decision: User explicitly chose automatic sequential replacement on 2026-11-22 after discussion.
    This supersedes the agent suggestion to add replace_existing=true. Version counters stay in results; they
    are not model-controlled concurrency tokens.
scope:
  in:
  - Remove expected_revision from submit_check_result and submit_hypothesis_proposals, including their active
    replacement names if the separately planned V478 rename lands first.
  - Keep item revision bookkeeping and result receipts; use runtime-owned exact output CAS and preserve proposal
    material associations.
  - Update old single/batch correction descriptions and tests without weakening atomic full-batch behavior
    or terminal completion.
  out:
  - New general artifact-handle addressing, renamed model-supplied version/ETag preconditions, force/replace
    flags, compatibility aliases and automatic semantic rebasing. The approved read_artifact pagination cursor
    is in scope in V479-004.
  - Removal of Server/API/wire/store revision checks, changed grants/retention or model/tool budget semantics.
  - Unrelated UI redesign, live model evaluation, demo deployment and full repository test gates.
requirements:
- id: R1
  text: 'For a live unsealed collector: missing item creates; identical canonical content replays the current
    receipt without increment; changed content in a subsequent model response replaces that item atomically
    and increments its internal revision. No replace_existing flag, separate confirm call or model-provided
    expected counter. Keep revisions in receipts for observation.'
- id: R2
  text: Different changes of one item issued in the same parallel model response must not both successively
    overwrite each other based on scheduler order. Admit them against the same runtime-owned starting generation;
    at most one different update succeeds, others return a classified conflict. Identical duplicates can replay.
    Different items remain independently admissible; invalid calls cannot erase accepted data.
- id: R3
  text: Do not replay an older content A over newer B merely because A was previously accepted or its reply
    was lost. Infrastructure retries preserve the original admitted generation/content/operation identity;
    reconcile through existing receipt rules. A genuinely new later model call with A is a new semantic replacement.
    This contract does not claim to detect hallucinated changes of mind.
- id: R4
  text: 'Keep complete batch atomicity: identical present items replay and absent items create; changed existing
    members reject the entire batch and direct the model to a single-item submission. The user approved automatic
    sequential single-item replacement, not silent batch replacement or additional work after the existing
    seal/completion boundary.'
- id: R5
  text: Proposal output uses the shared hidden CAS contract. Preserve previous selected-material associations
    and immutable handle-to-source meaning; identical payload replay is effect-free. A stale/conflicting target
    or ambiguous mismatching recovery never rebinds sources or automatically reloads a new base.
- id: R6
  text: Retain V477 strict normalization/error behavior and local HTTP request_id capture; checkpoint compaction
    preserves accepted conclusions, internal generations and replay identity. New invocation, seal, failure/cancellation
    and release keep their existing ownership. A receipt is neither durable Audit acceptance nor permission
    to resume a completed Worker.
failure_outcomes:
- operation: Resolve a selected version and perform the existing owner operation
  permanent: Unknown/ambiguous/unavailable selection, malformed or removed argument, stale precondition, denied
    authority and owner limit failures return a bounded classified tool error before a new effect. Preserve
    existing owner codes; new codes must be documented at their owner. No implicit latest substitution on
    conflict.
  retryable: Existing classified infrastructure failures retain bounded attempts and the original call/invocation
    deadline. No retry loop for deterministic conflicts.
  ambiguous: Reuse existing exact-byte CAS recovery or owner receipt with the same frozen payload, precondition
    and identity. Never regenerate intent from latest state or repeat a semantic append after a lost response.
  cancelled: Existing invocation/session owners join admitted I/O and preparation before cleanup. Late completions
    cannot update another invocation or a newer operation generation.
  timeout: Keep existing operation and invocation deadlines; do not introduce an unrelated timeout, poller
    or budget reset.
cardinality:
- collection: Runtime-held selected versions and pending operations
  expected: A few input roles, current document targets and explicitly used materials; admit only actual consumers.
  maximum: Keep existing owner row/byte/page/in-flight limits. Any added shared selection map has an explicit
    proposed ceiling of 4096 entries and 4 MiB encoded metadata per logical invocation, defined once in the
    owning limits registry.
  bound: Point lookup and bounded admission; no entire Run/Project enumeration, raw payload copies or history
    scans on each tool call. Refuse new admissions at the bound without silently evicting an in-use selection
    or relabeling it as current.
lifecycle:
- entity: Private version/precondition state of the existing tool session or logical invocation
  delete: Clear through the existing owner after completion/cancellation and joined work; allocation close
    clears all remaining private state.
  cascade: Successful compaction preserves selected versions and pending write identity; it only resets the
    V476 consecutive series where specified. SDK turns and failed checkpoints do not refresh materials or
    grant write authority.
  retention: No new persistent owner or holds. Replay/recovery uses only existing trusted inputs, admitted
    operation state and validated owner records. A model-written summary or returned revision supplied as
    an argument is never authority. If exact state cannot be restored, require a fresh semantic read/select
    instead of guessing latest.
acceptance_criteria:
- id: A1
  given: A live two-item Audit collector through actual ADK
  when: Calls create, identical replay, changed scalar and final completion occur without expected_revision
  then: Only the new accepted scalar changes its revision; the sealed package contains the latest conclusion
    and returned receipts still identify versions.
- id: A2
  given: Parallel same-item changes, identical duplicates and independent item keys
  when: One model response invokes them concurrently
  then: Different same-base changes cannot silently overwrite; duplicates replay and distinct items stay correct;
    no flag or revision is requested from the model.
- id: A3
  given: A complete batch mixes new/identical/changed items, plus an old ambiguous update
  when: Batch submission and technical recovery execute
  then: The batch is atomic and the older retry cannot overwrite a newer accepted conclusion; a new deliberate
    sequential scalar remains possible before seal.
- id: A4
  given: An accepted result/proposal and successful/failed compaction, cancellation or response loss
  when: The real completion and publication owners settle
  then: Trusted evidence, associations, generations and exact output CAS remain coherent; no stale restore
    or repeated target HTTP request occurs.
