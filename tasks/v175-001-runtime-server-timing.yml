schema_version: '1.0'
id: V175-001
title: Remove Runtime-owned heartbeat and lease timing flags
milestone: runtime-server-timing-2026-10
priority: P2
status: in_progress
depends_on: []
languages: [python, go]
goal: Make registration response the Runtime Agent authority for heartbeat and confirmed-lease timing.
context:
  issue: https://github.com/grauwolf32/contractor/issues/256
  finding: Runtime flags are overwritten by registration before production heartbeat or lease use.
scope:
  in:
    - Remove unused Runtime timing CLI flags, environment settings and validation.
    - Keep pre-registration retry backoff bounded by a fixed ceiling.
    - Remove misleading flags from e2e Runtime launchers.
  out:
    - Add Server-side timing configuration.
acceptance_criteria:
  - {id: A1, text: Runtime help and settings no longer expose local heartbeat or lease controls.}
  - {id: A2, text: Registration retries remain bounded before server timing arrives.}
  - {id: A3, text: Heartbeats and lease watchdogs use the registration response.}
  - {id: A4, text: Affected e2e launchers do not pass removed flags.}
tests:
  - {command: cd runtime && .venv/bin/python -m pytest tests/test_settings.py tests/test_control_client.py tests/test_lease_watchdog.py, covers: [A1, A2, A3]}
  - {command: go test -tags=e2e -run '^$' ./tests/e2e, covers: [A4]}
