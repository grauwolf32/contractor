schema_version: "1.0"
id: "V38-006"
title: "Collect eval results and build attributed complete comparisons"
milestone: "managed-evals-ui"
priority: "P2"
status: "pending"
implementation_commit: null
implementation_repository: "contractor"
depends_on: ["V38-005"]
languages: ["go", "sql", "yaml", "typescript"]
goal: >-
  Provide separate execution/assessment evidence, explicit selection and bounded truthful A/B
  reports for native and external experiments.
context:
  specification: >-
    docs/spec/29-managed-evals.md
  design: >-
    docs/evals-experience-design.md
  format: >-
    docs/spec/26-portable-evaluation-format.md
  user_story: >-
    US-10 in docs/spec/ui-user-stories.md
  boundary: >-
    Contractor builds and runs native Evals without Playground. Server and external control
    modes are immutable and mutually exclusive for dispatch. Both submit ordinary Runs/Audits
    through existing services; no new Worker Scheduler or label-based membership authority. The
    delivered portable CLI format and private recovery journals remain compatible.
  verification: >-
    Create the named focused test files/packages as part of implementation. PostgreSQL commands
    require a disposable database and must not pass by skipping integration cases. Use
    deterministic fixtures; these tasks do not authorize paid models, live targets, tighter
    global token defaults or shared-demo mutations.
  locations: >-
    Contractor: internal/evalservice, internal/evalstore, internal/evaldomain,
    internal/httpapi/public and public OpenAPI/generated clients. Extend native result
    observation without changing execution authority.
scope:
  in:
    - >-
      Collect native exact output roles/usage through registered bounded normalizers; ingest
      external result records without overriding server-observed execution facts. Run registered
      structural checks and support pinned human review plus attributed external assessments.
    - >-
      Implement owner-only review context, immutable result/assessment revisions, predecessor
      links and CAS selection. Add their public routes plus pairs, pair detail and safe
      JSON/Markdown report endpoints from spec 29. Add bounded member execution inventories
      over authoritative Run/Audit associations, including all roles/rounds and inventory
      revision/completeness, for UI and external collectors.
    - >-
      Materialize atomic complete view generations over all expected members. Include
      per-arm/suite totals, paired dimension coverage, regression/unresolved filters,
      nearest-rank p50/p90, stable snapshot pagination and missing-evidence invalidation.
    - >-
      Add the spec 29 chart endpoint and bound bin drill-down filters. Materialize quality,
      complete-pair token/duration distributions with at most 20 shared bins, paginated raw-unit
      pair deltas, and server-observed progress with at most 200 returned time buckets.
  out:
    - >-
      Implicit LLM judges, arbitrary uploaded scorer code, callbacks to producers, success-only
      denominators, best-of-N selection and treating external claims as server-verified
      semantics.
requirements:
  - id: "R1"
    text: >-
      Technical success does not imply pass. Required-check precedence is
      error/fail/incomplete/pass. Human decisions identify actor/rubric/result; external
      assessments identify producer/check implementation/plan/result and exact evidence.
      Reassessment does not rerun models. Native first records use audited system CAS;
      later/external records require exact selection. Human Save and use retains the review
      if selection conflicts.
  - id: "R2"
    text: >-
      Result normalization cannot reconstruct findings or expected outcomes from private truth.
      Safe reports omit hidden rubrics/expectations; owner review obtains them through the
      dedicated bounded endpoint.
  - id: "R3"
    text: >-
      A view publishes atomically with unfiltered experiment summary. Conflicts and missing
      required evidence make conclusions inconclusive while known regressions remain visible.
      Cost/latency uses complete matching scopes including measurable failures; null is not
      zero. Deleting evidence invalidates current completeness. Freeze explicit candidate-pass,
      allowed-quality-drop and optional token-ratio gates using the existing portable
      comparison-gates extension; label a pass as meeting declared gates.
  - id: "R4"
    text: >-
      Chart summaries use the same complete snapshot and exact cohort as their tables, with
      explicit units, measurement scope, coverage and exclusions. Percentiles are exact,
      not computed from histogram bins. Record progress observations during view publication;
      missing history is a gap. Bin drill-down tokens bind owner, filters, scope and snapshot.
  - id: "R5"
    text: >-
      Audit members use every authoritative owned child execution across roles/rounds/retries,
      deduplicating Run/stage snapshots and never adding parent totals. One Audit remains one
      scored/terminal member. Use parent createdAt-to-finishedAt wall time, not summed children;
      incomplete child reports stay partial. Normalized report/coverage/findings retain exact
      importer-backed refs; Audit completion alone is not quality pass.
acceptance_criteria:
  - id: "A1"
    given: >-
      The trace-small fixture with failed/unsubmitted members and unavailable usage.
    when: >-
      Results, assessments and selected comparison are materialized.
    then: >-
      Expected denominators and 3/2/2 terminal/quality/token pair counts match V38-002; B
      partial 130 tokens never establishes total savings and the conclusion is inconclusive.
  - id: "A2"
    given: >-
      Native checks, human review and two external assessment revisions.
    when: >-
      Scoring fails, selection races, evidence is deleted and projection is interrupted.
    then: >-
      Errors remain distinct from execution failure, exact prior records survive, stale CAS
      fails, previous complete views remain marked stale and reassessment causes no execution.
  - id: "A3"
    given: >-
      Two owners and a 10,000-member fixture.
    when: >-
      Pairs/review/reports are read through multiple filtered pages.
    then: >-
      Owner/private-data boundaries hold, each page has the same full summary, changed snapshots
      fail explicitly, and measured database query counts and response sizes stay bounded
      without historical Run/artifact scans.
  - id: "A4"
    given: >-
      Paired measurements, one/zero-sample cohorts, differing scopes, observation gaps and a
      10,000-member fixture.
    when: >-
      Every chart endpoint and bin drill-down is queried across filters and snapshots.
    then: >-
      Counts, exact percentiles and pair deltas agree with selected records; bins and progress
      stay within their bounds, missing data is not zero, foreign/stale filter tokens fail and
      page changes do not change whole-experiment chart totals. An Audit fixture with multiple
      roles/rounds/retries and overlapping child lifetimes verifies parent duration, complete
      child accounting, replay deduplication and partial coverage for a missing child.
      Paginated inventories include non-item discovery/assessment executions and expose
      unresolved/deleted children as gaps; changed inventory cursors request reload.
tests:
  - name: "comparison"
    command: >-
      test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -race -count=1 ./internal/evaldomain
      ./internal/evalstore ./internal/evalservice ./internal/httpapi/public -run "Test.*Eval"
    covers: ["A1", "A2", "A3", "A4"]
  - name: "public-contract"
    command: >-
      make verify-public-api && make ui-typecheck
    covers: ["A2", "A3"]
