      feat/v55-006-scan-release from main 5fad87a3, preserving unrelated dirty
      workspace changes. Existing nuclei, naabu and SQLMap Workflows and both
      deterministic plan Workflows are available. Implementing the missing ffuf
      catalog, semantic wordlist upload/preview support, real Server/Runtime
      integration against controlled local fixtures, and browser journey evidence.
