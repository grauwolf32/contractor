schema_version: '1.0'
id: V407-035
title: Cache bounded text decoding for Artifact pages without changing reader interfaces
milestone: server-runtime-review-2026-10
epic: projects-artifacts
kind: chore
priority: P3
status: pending
depends_on: []
languages:
- python
goal: Reuse UTF-8 validation and line indexing across pages of one exact Artifact revision while preserving
  existing outputs, limits and LikeC4 behavior.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/artifacts/artifact-store.md
  finding: runtime/src/contractor_runtime/toolsets/common/artifact_read_cache.py:14,30-64 retains one
    bounded exact payload, but text_artifacts/tools.py:156-160 fully decodes and splits it on every page
    and run_artifacts/tools.py:208 fully decodes it again to check UTF-8. Reading all fixed-size pages
    therefore repeats O(payload size) work per page on the loop. LikeC4 tools.py:188 already calls common/line_window.py;
    :725-729 is only argument-validation duplication. Its existing description :394-396 explicitly returns
    a prefix for a line beyond 128 KiB. A decoded cache must budget raw bytes, text storage and any line
    index instead of quietly multiplying the existing 64-MiB payload allowance.
  siblings: Text and Run Artifact tools share allocation_artifact_read_cache and close/invalidation behavior.
    Text already has line_offset continuation; preserve it. Inspect other cache consumers before changing
    entry ownership. LikeC4 is compatibility coverage, not a new reader API.
  validation: 'Confirmed repeated work on dc7012e8: ten calls to either Artifact reader downloaded one
    payload but decoded it ten times. LikeC4 already uses the shared line-window helper; its documented
    long-line prefix limitation is not a hidden data-corruption defect and adding continuation is out
    of scope.'
plan:
- Extend the one-entry exact Artifact cache with reusable UTF-8 validation and a compact text/line representation
  prepared lazily through threads.to_thread_until_done. Avoid one Python string/object per line where
  a compact offset index or byte-backed window suffices.
- Define and enforce a finite cache budget covering retained raw data and derived text/index storage,
  including worst-case Unicode and many-short-line inputs up to the accepted Artifact limit. Preserve
  supported input sizes; use a bounded representation rather than silently refusing previously valid artifacts.
- Page using cached validation/index state and decode only bounded windows where possible. Run-artifacts
  binary refusal and base64 byte slices, text line boundaries, UTF-8 continuation offsets and error codes
  remain identical.
- Join lazy preparation on cancellation before eviction/close; coalesce concurrent preparation for the
  same exact revision, replace all derived state when the revision changes, and preserve content-observation
  accounting on cache hits.
- Test ten pages of a valid 32-MiB Artifact using decode/index counters and deterministic synchronization.
  Keep current LikeC4 long-line behavior and tool signatures unchanged; do not fold distinct continuation
  APIs merely to remove superficially similar helper names.
scope:
  in:
  - Bounded shared decoded/validated Artifact cache state, line indexing and lifecycle; behavior-preserving
    use by text and Run Artifact readers.
  out:
  - New LikeC4 line_offset or continuation feature, changes to partialLine behavior, tool signatures,
    accepted media types or page sizes.
  - Claims that LikeC4 duplicates its window implementation; unrelated argument-validator cleanup.
  - Unbounded decoded-text/line-object retention or relaxation of exact-revision/provenance checks.
acceptance_criteria:
- id: A1
  text: Ten pages of a 32-MiB exact Artifact perform one payload read and at most one full UTF-8 validation/index
    preparation; subsequent work is limited to the requested window. Counters distinguish full-payload
    work from bounded page decoding and fail on the old implementation.
- id: A2
  text: Raw bytes plus decoded/index state obey the documented finite cache budget for worst-case Unicode
    and many-short-line fixtures; all previously accepted Artifact sizes remain readable with the existing
    output limits.
- id: A3
  text: Cancellation, concurrent first reads, exact-revision replacement and close join work and discard
    the appropriate derived state; cached reads retain correct content observations and do not leak an
    old revision.
- id: A4
  text: Existing text line_offset, line-number and Run Artifact byte-page outputs remain equivalent, including
    invalid UTF-8 errors. LikeC4 preserves its documented overlong-line prefix limitation and unchanged
    schema; tests introduce no wall-clock thresholds.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_text_artifacts_toolset.py tests/test_run_artifacts_toolset.py
    tests/test_likec4_toolset.py tests/test_common_line_window.py
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A2
  - A4
