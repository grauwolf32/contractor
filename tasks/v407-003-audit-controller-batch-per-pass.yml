schema_version: '1.0'
id: V407-003
title: Batch Audit drain mutations under a fixed per-step work budget
milestone: server-runtime-review-2026-10
epic: audits
kind: chore
priority: P2
status: pending
depends_on: []
languages:
- go
goal: Reduce repeated Audit snapshots during drain phases using a fixed bounded mutation batch while preserving
  lifecycle barriers, claim fences and fairness.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/audits/execution.md
  validation: Revalidated against main dc7012e8 on 2026-10-23. One mutation per snapshot is confirmed
    as an optimization opportunity; no lifecycle defect or latency regression was demonstrated. The original
    three-pass terminal cancellation requirement was unsupported because collection and child completion
    are separate phases.
  finding: internal/auditcontroller/controller.go:424-452 observes one terminal child, 469-479 fails one
    unbound intent, 630-658 requests one cancellation, and settlement.go:78-88 deletes one released terminal
    Run per step. Each step reads a new claimed snapshot (controller.go:50-74,89). Run immediately continues
    on progress (35-36), so this is repeated store work rather than one PollInterval per child. Collection
    remains one execution per step (collection.go:14-25), and running children must actually finish before
    terminal Audit settlement. AUX-R95 requires bounded statements independent of total child cardinality;
    an unbounded whole-Audit mutation loop or arbitrary three-pass terminal outcome would violate that
    design.
  siblings: Cover terminal observation, unbound-intent failure, cancellation requests and released-terminal
    Run deletion. Keep collection and final settlement barriers explicit; any phase not safely batchable
    retains its existing boundary and a measured count. Preserve Eval coordinator behavior if the shared
    loop is later refactored by V407-027.
plan:
- Record the baseline counts for each drain phase on real PostgreSQL with 1, 50 and 200 children. Choose
  and document a fixed per-step mutation budget B, independent of Audit size and no larger than MaxReconcileRows,
  with a statement/byte bound and the existing operation/lease deadlines.
- Process at most B eligible terminal observations, unbound intents, cancellation requests or deletions
  during the applicable phase of one claimed step. Retain the existing phase order and per-mutation transactions;
  do not batch across a receipt or lifecycle barrier.
- Use snapshot data only as candidates, retaining every store-side claim, revision, terminal-state and
  deletion check. Stop on lost claim, stale precondition, context budget or the fixed mutation bound;
  use returned authority or a fresh projection where a prior mutation invalidates later inputs.
- Keep collection one execution at a time unless equivalent byte/evidence/receipt guarantees are demonstrated
  with fresh required authority. Document its separate count; requesting cancellation never substitutes
  for observing the actual terminal Run and committing its receipt.
- Add deterministic count tests for batches and tails, controlled asynchronous child completion, cancellation/claim-loss
  mid-batch, and two-Audit fairness. Already-terminal fixtures must show reduced snapshot counts for the
  batched phases with exact count formulas; waiting on live children is driven by signals, not elapsed
  time.
- Clarify AUX-R73/AUX-R95 with the chosen fixed maximum work per claimed step and phase ordering. Preserve
  an upper bound independent of total Audit cardinality and ensure every eligible claimed Audit receives
  a bounded turn.
scope:
  in:
  - Fixed-budget batching of existing drain mutations and deterministic real-store cost coverage.
  - Explicit per-phase accounting, lifecycle barriers, claim fencing and fairness under the existing controller
    architecture.
  out:
  - An unbounded loop or giant transaction over all children, a work budget derived from total Audit size,
    or a new claim mechanism.
  - Guaranteeing AuditCancelled before running children actually finish and their collection receipts
    commit.
  - An arbitrary three-pass drain target, a PollInterval delay claim, or unrelated shared-loop/Eval changes.
acceptance_criteria:
- id: A1
  text: The task and owning spec name fixed B and its row, byte, statement and deadline bounds. A claimed
    step performs no more than B eligible drain mutations and never continues after claim loss, stale
    authority or budget exhaustion.
- id: A2
  text: 'On controlled already-terminal, intent-only and released-deletion fixtures of 1, 50 and 200 children,
    tests assert the chosen phase-specific formula including batch tails: eligible batched work completes
    in ceil(N/B) batch steps when no concurrent change interrupts it. Collection, final transitions and
    other required steps are counted separately, and total snapshot counts improve on the baseline for
    multi-child cases.'
- id: A3
  text: 'Cancellation tests distinguish bounded requests from child terminal transitions: nonterminal
    children keep the settlement barrier closed until explicitly transitioned, and every observed terminal
    child still receives its existing exactly-once receipt before Audit settlement.'
- id: A4
  text: Mid-batch claim loss or a concurrent revision change stops unsafe continuation without duplicate
    effects. A second eligible Audit progresses while another has a large drain, and existing replay,
    deletion and cancellation outcomes are preserved.
- id: A5
  text: Operation-count tests use deterministic clocks and transition signals, not latency thresholds.
    Existing controller suites pass with updates limited to the documented fixed-budget scheduling and
    cost expectations.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/auditcontroller/...
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
