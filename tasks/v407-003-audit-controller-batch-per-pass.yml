schema_version: "1.0"
id: V407-003
title: "Settle every terminal, cancelled or deleted child Run of an Audit within one controller pass"
milestone: server-runtime-review-2026-10
epic: audits
kind: defect
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "Cancelling or deleting an Audit with N outstanding child Runs costs one reconcile snapshot plus N bounded mutations, not N snapshots."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding E8; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/audits/execution.md
  severity: medium
  finding: >-
    internal/auditcontroller/controller.go:360-389 and 580-611 and
    settlement.go:76-90: observeOneTerminal, cancelOneSubmittedRun,
    failOneUnboundIntent and the deletion branch each act on exactly one
    execution or Run per reconcile pass, and every pass costs Claim +
    GetReconcileSnapshot (audit, settings, round, 201 items, ready items, 201
    executions with Run states, role executions, receipts) + ReleaseClaim. An
    Audit with N outstanding child Runs therefore reads N full snapshots to
    cancel or delete. TestPostgresControllerFullWindowPassCostIsConstantInChildRuns
    measures one pass, not a drain. SettleUndispatched already does the
    whole-batch form in SQL and is the model.
  siblings: >-
    internal/evalcoordinator ticks one member per claim by design (V259-001
    fixed its pacing); check that the shared loop (V407-027) keeps both.
plan:
  - "In each one-per-pass branch, iterate over the snapshot's matching executions (bounded by MaxReconcileRows) and apply the mutation per execution with the existing claim epoch and expected revision; stop the loop on ErrClaimLost or ErrPrecondition and let the next pass continue."
  - "Keep each mutation in its own store call (no giant transaction); the bound per pass is MaxReconcileRows mutations."
  - "Add a PostgreSQL test: an Audit with 50 submitted child Runs is cancelled; assert the drain completes in a constant number of passes (for example at most 3) and count GetReconcileSnapshot calls through the store seam."
  - "Record the per-pass bound in docs/spec/audits/execution.md next to the existing reconcile window limit."
scope:
  in:
    - "Batch terminal observation, cancellation of submitted Runs, unbound intent failure and deletion within one pass."
    - "Realistic-size PostgreSQL drain test."
  out:
    - "Changing claim ownership or the reconcile snapshot shape."
acceptance_criteria:
  - id: A1
    text: "Cancelling an Audit with 50 submitted child Runs reaches cancelled within 3 controller passes on real PostgreSQL."
  - id: A2
    text: "A claim lost mid-batch stops the batch without a double mutation (existing fencing tests still pass)."
  - id: A3
    text: "The drain test fails on the unfixed code (requires about 50 passes)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/auditcontroller/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2]
