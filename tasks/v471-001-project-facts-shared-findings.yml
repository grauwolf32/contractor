schema_version: "1.0"
id: V471-001
title: Record Project facts through the existing Finding owner and remove the direct publication flag
milestone: project-facts-2026-11
epic: findings
kind: feature
priority: P1
status: pending
depends_on: []
languages: [go, python, json, yaml, typescript, markdown]
goal: >-
  A user or Worker records a fact such as a service technology through a separate
  interface while receiving the same durable Project Finding identity, sources
  and retention as other Findings. A direct finding call always requests Project
  admission; it cannot silently succeed as a Run-only proposal.
demonstration: >-
  A real Server/Runtime scripted-model Run records nginx with one exact source.
  Existing Finding intake creates a receipt and Project Finding. A subsequent
  ordinary Audit Workflow selects its exact material into hypothesis.sources.
  A possible issue uses the same intake without publish_problem and remains
  unassessed. Source Run deletion preserves the Project evidence.
context:
  authority: >-
    User decisions 2026-11-20: facts need a separate interface over the same
    project-level Finding; a detected technology is a fact; publish_problem is
    unnecessary for ordinary finding too; plan tasks and diagrams. Planning only,
    not implementation, live model calls or deployment. The explicit purpose
    marker, source bounds and projectless rejection below are agent proposals.
  proposal: docs/proposals/0055-project-facts-through-findings.md
  specification:
    - docs/spec/findings/findings.md#FND-R3
    - docs/spec/findings/findings.md#FND-R210
    - docs/spec/findings/findings.md#FND-R211
    - docs/spec/findings/findings.md#FND-R214
    - docs/spec/audits/hypotheses.md#HG-R6
    - docs/spec/platform/persistence.md
  decision_needed: >-
    Settle projectless Runs before implementation. Recommended: finding and
    record_fact require an active Project and reject before any write; supporting
    outputs remain ordinary artifacts. Alternative: an explicitly separate
    proposal-only capability for real projectless callers, justified by inventory.
    Do not infer user approval to delete projectless workflows or keep a hidden fallback.
  boundary: >-
    Extend the existing FindingProposal/intake/ProjectFinding/reader owner, not a
    Fact store or Audit registry. Add only the explicit presentation-purpose
    metadata needed by real callers. The first implementation freezes its exact
    placement and shared fixture; severity is not the discriminator.
scope:
  in:
    - Add a separately selected record_fact facade over the existing Finding publisher and Project admission.
    - Distinguish facts explicitly on the existing record and expose a bounded reader filter.
    - Remove publish_problem/publishProblem from direct producer contracts and update every real caller and fixture.
    - Preserve existing scanner publication operations and their explicit Workflow sequencing.
    - Demonstrate exact selection into an existing hypothesis without another hypothesis registry.
    - Update owning specs, API/wire contracts, generated clients and versioned catalog identities together where affected.
  out:
    - Memory extraction, semantic duplicate matching, a separate Fact ID/table/store or new review workflow.
    - Inferring fact purpose from informational severity, title, producer or absent analyst assessment.
    - Live-model runs, changing configured models, deployment or starting dependent tasks.
requirements:
  - id: R1
    text: >-
      Fact and issue interfaces create the same existing Project Finding entity
      and immutable source receipts. Purpose does not imply truth or severity;
      no automatic analyst verdict is assigned. Facts are not vulnerability tasks.
  - id: R2
    text: >-
      Both direct interfaces request admission unconditionally. Retain internal
      proposals/receipts and explicit intermediate Workflow artifacts, but remove
      the direct publication boolean end to end without a deprecated alias.
  - id: R3
    text: >-
      Require selected exact source material. A note-only source remains a reported
      claim and is labelled as such, never independent verification. Source and
      hypothesis context are different from proof. Origin is system-derived.
  - id: R4
    text: >-
      Inventory Go, Runtime, OpenAPI, UI/client, scanner adapters, tests and configs.
      One shared fixture defines new constrained fields. Do not add a second
      normalized candidate pipeline or falsely attach scanner provenance to LLM output.
failure_outcomes:
  - operation: Admit a direct fact or finding through the existing intake
    permanent: Invalid purpose/source, denied Project or over-bound input fails with the owning classified 4xx before partial authoritative admission; no Run-only success fallback.
    retryable: Existing bounded PostgreSQL retries and storage_transaction_conflict 503; keep original intent and deadline.
    ambiguous: Reconcile the existing submission/receipt key; do not append another source on lost acknowledgement.
    cancelled: Existing allocation or operation fence joins work and prohibits writes after release or deletion.
    timeout: Tool, Stage and Run deadlines keep their existing owners; no background admission survives return.
cardinality:
  - collection: Direct fact payloads, evidence and Project source pages
    expected: One fact and one or two sources per call.
    maximum: Proposed fact authored payload 32 KiB and four exact sources; existing evidence/material ceilings apply; source pages at most 64.
    bound: No whole Project hydration; compact metadata pages and exact payload reads. Test 10000 existing receipts with realistic page boundaries.
lifecycle:
  - entity: Existing Project Finding and its source receipts representing a fact
    delete: Existing Project ownership and purge gates; no independently owned Fact cleanup path.
    cascade: Source Run/Audit removal preserves independently Project-retained sources and evidence.
    retention: Existing immutable Artifact holds, receipts and Project lifecycle; no new TTL or review state.
acceptance_criteria:
  - id: A1
    given: An active Project and exact evidence in a real Runtime allocation
    when: record_fact and ordinary finding are called
    then: Each returns an existing Project Finding identity without a publication flag and preserves unassessed state and exact sources.
  - id: A2
    given: An information disclosure issue and a neutral technology observation
    when: They are saved and selected as research materials
    then: Explicit purpose distinguishes them; informational severity alone does not; the exact selected record can ground a hypothesis.
  - id: A3
    given: A replay, invalid source, deletion race or missing Project under the resolved decision
    when: Intake executes through PostgreSQL
    then: No duplicate source, fabricated success, partial canonical admission or post-fence write occurs; retained evidence survives source deletion.
tests:
  - command: make test-project-facts-e2e
    covers: [A1, A2, A3]
  - command: go test ./internal/findingintake/... ./internal/auditdomain/... ./internal/auditservice/... ./internal/artifacts/...
    covers: [A1, A2, A3]
  - command: make test-runtime
    covers: [A1, A2, A3]
  - command: make test-wire-cross-language
    covers: [A1, A2, A3]
  - command: make verify-public-api
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
test_prerequisites:
  - Create the named real-process target in this task; it must select nonzero cases with a scripted Gateway and real PostgreSQL/Server/Runtime.
  - Run all touched package suites; database skips and disabled heavy-I/O fixtures are not passing coverage. Remove the owned disposable database after processes stop.
