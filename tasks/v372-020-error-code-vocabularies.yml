schema_version: "1.0"
id: V372-020
title: "Hold every vocabulary that carries error code names to the registry"
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: chore
priority: P3
status: in_progress
depends_on: []
languages: [go, typescript, json, yaml, markdown]
goal: "The event schema and the browser client accept only the error frame codes the Server sends, the UI test fixtures answer only registered codes with their registered status, the Run recovery cause vocabulary is declared apart from the error code it shares a name with, the private API codes that are also public codes are checked against the registry, and every Planner, Worker-invocation and Scheduler Stage failure code the Server reports is registered in errors.md."
context:
  review: "Out-of-scope findings of the hub audit fix batch, wave 2 (group w2c: V370-009, V369-004, V370-010), recorded 2026-10-12; file:line verified on b2b09ea"
  specification:
    - "docs/spec/platform/errors.md#ERR-R14"
    - "docs/spec/execution/planners.md"
  revalidated: >-
    2026-10-24 on b523ae77: items (1), (2) and (4) still hold; lines were
    re-read and updated, and (2) gained a second unregistered fixture code
    (csrf_required) and a status mismatch. Item (3) is partly done: the UI
    map RUN_RECOVERY_REASONS (ui/src/app/vocabulary.ts:300-314) is typed
    from the generated RunRecovery.code and tested against the OpenAPI enum
    (ui/src/app/vocabulary.test.ts:508-519), and Go
    gatewayrecovery.ValidFailure and the Runtime RECOVERY_FAILURE_CODES
    already share api/testdata/v1alpha1/gateway-recovery-participant-cases.json
    failureCodes (internal/gatewayrecovery/participant_shared_test.go:91,
    runtime/tests/test_shared_gateway_recovery_participant.py:56); what
    remains is the OpenAPI enum against that list and the documentation.
    Item (5) is new: it folds in open question (3) of V414-027 (Planner
    error codes missing from errors.md, found while verifying V414-006),
    so no separate task is needed. V414-006 owns
    planner_invocation_in_progress and V414-004 owns the scan-plan Audit
    result codes; this task registers the rest and its test picks up their
    codes once they land.
  finding: >-
    Five places keep code names outside what the registry
    (internal/apierror/registry.go, ERR-R14; docs/spec/platform/errors.md)
    checks. (1) The ErrorFrame code enum of
    api/events/contractor-events-v1.schema.json:531 and the browser frame
    type (ui/src/events/run-events.ts:194-205) accept unauthorized, and the
    registry marks Unauthorized as a frame code (defineFrame, registry.go:58)
    so that TestEventSchemaErrorFrameCodesAreTheFrameCodes
    (internal/apierror/contract_test.go:147) passes, but no Server path sends
    that frame: the events package sends invalid_frame, subscription_limit,
    not_found and overloaded only (internal/httpapi/public/events/connection.go:79,
    167, 172 and 202; subscriptions.go:32-46 and 104; run_poller.go:142), and
    an unauthorized subscription is answered as not_found. (2) The Eval UI
    fixture answers eval_unavailable with 503 (ui/src/test/evals-fixture.ts:351-353,
    driven by ui/src/routes/evals-setup.test.tsx:294 and 389) although
    V370-009 removed the Server's only eval_unavailable answer and the
    registry has no such code; it answers csrf_required with 403
    (evals-fixture.ts:150-153) where the Server answers forbidden
    (internal/httpapi/public/auth_handlers.go:182-185); and it answers a
    missing key with eval_invalid 400 (:154) where the registry gives
    eval_invalid 422. TestBrowserClientComparesOnlyRegisteredCodes
    (contract_test.go:173-177) skips test files. (3) RunRecovery.code
    (api/openapi/contractor-public-v1.yaml:14765, no description) uses
    gateway_unavailable for an unavailable model gateway route, the
    vocabulary of gatewayrecovery.ValidFailure
    (internal/gatewayrecovery/policy.go:60-67) and the Runtime
    (runtime/src/contractor_runtime/llm/recovery.py:41-42), while the public
    error code gateway_unavailable (registry.go:298, errors.md:368) means
    that the bound Gateway credential manager failed; nothing ties the
    OpenAPI enum to the shared failureCodes list, and neither the schema nor
    errors.md says the two vocabularies differ. ui/src/routes/runs/triage.ts:13
    lists gateway_unavailable among attempt diagnostic codes. (4) The
    private Artifact API (internal/httpapi/privateartifacts/errors.go:30-71,
    gateway_recovery.go:23-63, handler.go:90-167) and the Control Plane API
    (internal/controlplane/http.go:86-173) write codes with their own status
    and retryable flags; artifact_too_large, artifact_transfer_capacity,
    artifact_content_corrupt, artifact_content_missing, artifact_frozen,
    invalid_request, method_not_allowed, not_found,
    storage_transaction_conflict and internal_error are also public codes.
    They agree with the registry on b523ae77, but V370-010 left the private
    APIs out of the registry without a check. (5) Planner, Worker-invocation
    and Scheduler Stage failure codes reach the public API as
    StageTermination.code and AttemptDiagnostic.code (yaml:14124-14134 and
    14170-14185, typed only as ConfigId) but are named nowhere in docs/spec:
    planner_cancelled (internal/planner/errors.go:51,
    planner/a2a/client.go:539, planner/streamline/planner.go:197),
    planner_initialization_failed (streamline/planner.go:103, 135 and 145;
    scheduler/planner_invocation.go:62-65), planner_session_invalid
    (planner/session_lifecycle.go:45-67), planner_already_completed
    (streamline/state.go:52), planner_context_invalid
    (streamline/planner.go:162), planner_execution_failed (:209),
    planner_model_overlap (:263), planner_plan_persistence_failed
    (streamline/tools.go:636), planner_worker_unknown (tools.go:376),
    worker_task_failed, worker_task_cancelled and worker_task_rejected
    (planner/a2a/client.go:461-478), worker_unavailable (a2a/client.go:140,
    planner/errors.go:56), worker_deadline_exceeded (errors.go:46),
    invalid_a2a_response, invalid_stage_content and invalid_worker_handle
    (a2a/client.go:116-217), scan_failed (planner/scan/audit_result.go:36),
    stage_deadline_exceeded (scheduler/stage_preparation.go:283),
    allocation_fence_failed (scheduler/stage_finalization.go:69) and
    model_route_binding_failed (stage_preparation.go:217);
    planner_execution_config_unavailable (scheduler/planner_invocation.go:20),
    control_plane_state_lost (stage_preparation.go:173),
    allocation_report_unavailable (scheduler/reports.go:86) and
    publication_attempts_exhausted (scheduler/postgres.go:745) appear in an
    owning document but have no errors.md row. The UI triage set
    MODEL_INFRASTRUCTURE_ISSUE_CODES (ui/src/routes/runs/triage.ts:10-23)
    compares attempt codes with planner_execution_config_unavailable and
    others that no registry row defines. Items (1) and (3) predate the
    shallow history (boundary 6349621); (2) dates from V370-009, (4) from
    V370-010's decision, and (5) from the Planner and Scheduler work that
    added each code without a registry row.
  siblings: >-
    Other UI test fixtures and fetch doubles that answer API errors
    (ui/src/test, route tests) are in scope for the fixture check; on
    b523ae77 a probe of error("<code>", <status>) calls found only the two
    Eval fixture codes above unregistered. The Runtime reads private API
    codes and retryable flags (runtime/src/contractor_runtime); its
    comparisons stay with the private vocabulary. Planner tool-result codes
    returned to the model (planner_subtask_limit, planner_dispatch_active,
    planner_tool_rejected and the rest in internal/planner/plan.go and
    streamline/state.go) are model-visible and in scope of item (5) only
    where they also end an invocation as its failure code. Run event reason
    codes (runstore.Reason, for example planner_started and
    planner_completed) are another vocabulary and stay out. Renaming
    RunRecovery.code or the public gateway_unavailable is an incompatible
    change within /v1 (API-R3) and is not part of this task.
scope:
  in:
    - "Unauthorized becomes a plain error code; the ErrorFrame enum and the browser frame type drop unauthorized; a test derives the frame codes from the events package's sendError and endAll calls and requires them to equal the registry's frame codes."
    - "The Eval fixture answers the code and status the Server sends for each case (forbidden 403 for a bad CSRF token, eval_invalid 422 for a missing key, and a registered code for the unavailable case), and a UI or Go test rejects any fixture or test double that answers an unregistered code or a registered code with another status."
    - "The RunRecovery.code description and errors.md state that its values are model gateway failure causes, a vocabulary of its own; a test holds the OpenAPI enum to the shared failureCodes list that Go and the Runtime already read."
    - "A test that every code the private APIs write which is also a public code has the registry's status and retryable flag."
    - "Every Planner, Worker-invocation and Scheduler Stage failure code listed in item (5) gets its owning requirement and one errors.md row (retryability and meaning), and a Go test derives the codes the emitting packages (internal/planner/..., internal/scheduler) write into planner failures and Stage terminations and fails on one without a row; the UI triage set compares only registered codes."
  out:
    - "Moving the private APIs into the public registry (V370-010's reversal condition)."
    - "Renaming any code (API-R3) or changing any retryability."
    - "planner_invocation_in_progress and the Planner session write outcomes (V414-006); the scan-plan Audit result codes (V414-004)."
acceptance_criteria:
  - id: A1
    given: "the registry frame codes, the event schema enum, the browser frame type and the events package's sendError and endAll calls"
    when: "a frame code is declared but never sent, or sent but not declared"
    then: "a test fails"
  - id: A2
    given: "the UI test fixtures and fetch doubles"
    when: "one answers an unregistered code, or a registered code with a status other than the registry's"
    then: "a test fails"
  - id: A3
    text: "The recovery cause list is pinned once across OpenAPI, Go, the Runtime and the UI, and its documentation separates it from the error code of the same name."
  - id: A4
    text: "Changing the status or retryable flag of a shared code on one side only (private API or registry) fails a test."
  - id: A5
    given: "a Planner failure or Stage termination code written by Go code in internal/planner/... or internal/scheduler"
    when: "it has no errors.md row"
    then: "a test fails, and on the fixed revision every code listed in item (5) has a row naming its owning requirement"
  - id: A6
    text: "The new tests of A1, A2, A3 and A5 fail on b523ae77."
tests:
  - command: "go test ./internal/apierror ./internal/httpapi/... ./internal/controlplane ./internal/gatewayrecovery ./internal/planner/... ./internal/scheduler"
    covers: [A1, A3, A4, A5, A6]
  - command: "cd ui && corepack pnpm test --run src/events src/test src/routes/runs src/routes/inbox src/routes/evals-setup.test.tsx src/app"
    covers: [A1, A2, A3, A6]
  - command: "cd runtime && uv run pytest tests/test_shared_gateway_recovery_participant.py"
    covers: [A3]
  - command: "make verify-public-api"
    covers: [A1, A3]
  - command: make lint
    covers: [A1, A2, A3, A4, A5]
