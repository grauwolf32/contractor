schema_version: "1.0"
id: V40-002
title: "Prepare instruction experiment bindings and a frozen plan after format readiness"
milestone: agent-instruction-evaluation
priority: P1
status: pending
implementation_commit: null
depends_on: ["V40-001", "V41-008"]
languages: ["python", "json", "yaml", "go"]

goal: >-
  Prepare the instruction-specific experiment using the portable format already
  implemented by V41, without starting model executions.
context:
  specification: docs/spec/26-portable-evaluation-format.md
  plan: tests/eval/agent_instructions/README.md
  implementation_repository: >-
    Use sibling playground-v2 and its existing CLI, dataset catalog, adapters,
    scorers and publishers. V41 owns their generic implementation; this task
    creates only instruction experiment bindings, suite selections and pins.
  inputs: >-
    Reuse baseline.json, variants.json and candidate/configs from
    tests/eval/agent_instructions. V40-001 supplies the mapping to playground
    assets and remaining negative cases. Preserve all original default configs.
  comparability: >-
    Pin identical source/tasks, ground truth, scorers, tools/docstrings, Skills,
    model/sampling and effective budgets. Allow only instruction bytes and their
    dependent template/workflow/AuditProfile wrapper version/digest refs to differ.
    Audit wrappers must otherwise preserve inventory, standards, evidence contract,
    execution and interaction policy. Unknown required
    pins prevent strict execution; never invent server metadata support.
  execution: >-
    Workflow bindings use ordinary evaluation Project Runs; Audit bindings retain
    existing controller/importer authority and exact profile pins. Labels do not
    select prompts. Hidden expectations stay evaluator-local, never Project inputs.
  wrappers: >-
    Existing AuditProfiles still select baseline Workflows. Prepare explicit
    immutable evaluation profile wrappers for both arms using the intended exact
    baseline/candidate Workflow refs. Record these release artifacts without
    publishing them in this task. Labels or a Workflow binding cannot override
    an AuditProfile's child Workflow. Add an equivalent ordinary test wrapper
    for any standalone Worker case such as http_explorer when selected.
  preparation: >-
    Author experiments/agent-instructions.yaml in playground using
    playground.experiment/v1, then use experiment plan to validate/resolve a
    frozen experiments/agent-instructions/plan.json. Plan/preflight may read
    configuration but must not submit Runs/Audits, launch targets or publish defaults.
  budgets: >-
    Start with the six mapped D1/O1/L1/T1/T2/A1 scenarios, two arms and two repeats
    (24 members) only if coverage/capabilities support them. Record unsupported
    members rather than shrinking the denominator. Initial proposal is 90 minutes,
    one in-flight member and 2 million observed model tokens; observation thresholds
    are not guaranteed hard spend caps. Freeze actual limits before future run.

scope:
  in:
    - "Author exact baseline/candidate bindings and suites using the implemented portable schemas."
    - "Prepare source/config/scorer pins, explicit member order, budgets and equality checks."
    - "Validate with recorded observations and read-only provider preflight; report blockers and exact release versions needed."
  out:
    - "Generic format/runner implementation, model evaluation, benchmark target startup, server deployment, publishing default configs or changing running Audits."
deliverables:
  - {path: ../playground-v2/experiments/agent-instructions.yaml, description: "Instruction experiment authoring document."}
  - {path: ../playground-v2/evals/bindings, description: "Exact provider bindings, with no hidden expectations or literal credentials."}
  - {path: tests/eval/agent_instructions/evaluation-configs, description: "New immutable AuditProfile/Worker wrappers required by selected cases; preserve original baseline and candidate snapshots."}
  - {path: ../playground-v2/experiments/agent-instructions/plan.json, description: "Frozen private plan and referenced local bundle; no live results implied."}
  - {path: tests/eval/agent_instructions/README.md, description: "Actual preparation commands, pins, readiness and future execution boundary."}
requirements:
  - {id: R1, text: "Use the implemented V41 format and adapter contract; no parallel experiment implementation."}
  - {id: R2, text: "Required-equal pin mismatches or unsupported exact candidate versions remain explicit blockers."}
  - {id: R3, text: "Planning never starts a model evaluation; execution belongs only to V40-003."}
acceptance_criteria:
  - {id: A1, given: "Baseline and candidate bindings", when: "Resolved", then: "Only declared instruction/version differences remain; source, scorer, model, tools and Skills pins match."}
  - {id: A2, given: "The requested matrix and budgets", when: "Frozen", then: "Members and denominators are explicit, private truth is excluded from execution projections and every required pin is available."}
  - {id: A3, given: "Preparation and recorded-provider checks", when: "Reviewed", then: "The plan is valid without any model Run/Audit or target campaign, and actual commands/provenance are retained."}
tests:
  - command: "cd ../playground-v2/evals && uv run playground-eval validate"
    covers: ["A1", "A2"]
  - command: "cd ../playground-v2/evals && uv run playground-eval experiment plan --spec ../experiments/agent-instructions.yaml --out ../experiments/agent-instructions"
    covers: ["A1", "A2", "A3"]
  - command: "go test ./tests/eval/agent_instructions ./internal/config"
    covers: ["A1", "A3"]
