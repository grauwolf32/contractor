schema_version: '1.0'
id: V115-001
title: Build and scan with a patched Go toolchain
milestone: patched-go-toolchain-2026-10
priority: P1
status: in_progress
implementation_commit: null
depends_on: []
languages: [go, yaml]
goal: Ensure local builds and CI use a patched Go 1.26 release and block reachable Go vulnerabilities.
context:
  issue: https://github.com/grauwolf32/contractor/issues/231
  finding: The module and CI currently select Go 1.26.0, which has reachable standard library vulnerabilities.
scope:
  in:
    - Select Go 1.26.8 via the module toolchain directive.
    - Have CI install the selected toolchain and run govulncheck on production commands.
    - Correct the documented Go prerequisite.
  out:
    - Upgrade the Go language baseline to 1.27.
acceptance_criteria:
  - {id: A1, text: Go commands in the module select Go 1.26.8.}
  - {id: A2, text: CI installs the toolchain directive version and fails on reachable findings.}
  - {id: A3, text: govulncheck reports no reachable findings for production commands.}
  - {id: A4, text: Development documentation names the selected Go version.}
tests:
  - {command: go version, covers: [A1]}
  - {command: govulncheck ./cmd/..., covers: [A3]}
  - {command: go test ./cmd/... ./internal/..., covers: [A1]}
