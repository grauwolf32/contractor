schema_version: '1.0'
id: V78-001
title: Validate Audit finding proposal links before result publication
milestone: audit-proposal-link-validation-2026-10
priority: P1
status: completed
implementation_commit: 7720500a1a1cca514ab76cee759aad17d5614e6e
depends_on: []
languages: [python, markdown]
goal: Reject result links that the importer would reject while the Worker can still repair them.
context:
  issue: https://github.com/grauwolf32/contractor/issues/312
  finding: Runtime accepts invented proposal keys and proposals missing the assigned standard entries, which invalidate the whole imported check result.
scope:
  in:
    - Register successful finding client keys and exact standard references in the current Audit invocation.
    - Reject unknown, cross-invocation and cross-item proposal links without changing previously recorded results.
    - Reject Audit finding references that cannot be verified against assigned task standards or the bundled CWE catalog.
    - Require linked proposals on standard-mapped tasks to cite every assigned entry ID.
    - Clarify finding and check-result guidance and preserve importer-side authoritative checks.
  out:
    - Change the importer or weaken its finding-proposal validation.
acceptance_criteria:
  - {id: A1, text: Unknown keys, receipt IDs and proposal IDs are rejected locally with a repairable proposal_keys error and no collection mutation.}
  - {id: A2, text: Standard-mapped links missing assigned entries are rejected locally with a repair hint.}
  - {id: A3, text: Valid finding client keys with assigned standard refs and valid CWE classifications record and publish successfully.}
  - {id: A4, text: Registrations are invocation-local, distinct proposals belong to distinct batch items, and failed finding submissions cannot be linked.}
  - {id: A5, text: Importer still rejects unresolved keys and accepts valid bundled CWE references.}
tests:
  - {command: cd runtime && PYTHONPATH=src .venv/bin/pytest tests/test_audit_result_collector.py tests/test_audit_results_toolset.py tests/test_finding_facades.py tests/test_audit_completion_e2e.py, covers: [A1, A2, A3, A4]}
  - {command: go test ./internal/auditimport, covers: [A5]}
verification:
  python: Full Runtime pytest suite passed after updating an older normalization fixture; focused suites and repository-wide Ruff checks passed.
  go: Audit importer unit suite and PostgreSQL-backed integration gate passed, including process-loss proposal conflict and unresolved-key/CWE cases.
