- Browser verified failed GET recovery retaining namespace, 16 Tab steps contained in the nested dialog, two Escape focus returns, mobile Audit navigation and progressive telemetry fields.
- Successful Run Results moved to y=753 on the 390 px viewport; evidence and probes are in .local/ui-design-implementation/phase-011.
