schema_version: "1.0"
id: V8-002
title: Add encrypted write-only Runtime adapter credentials
milestone: label-driven-runtime-configuration
priority: P0
status: planned
implementation_commit: null
depends_on: [V8-001]
languages: [go, sql]

goal: >-
  Store and resolve OTLP/proxy credentials without exposing their values, and
  make create replay and deletion safe under concurrent configuration use.

context:
  current_state: >-
    internal/credentials encrypts generated LiteLLM tokens with AES-256-GCM and
    owns managed-key lifecycle. RuntimeConfig now needs adapter-owned secret
    schemas whose values are supplied once by an operator rather than generated
    by LiteLLM.
  credential_kinds: >-
    otlp-headers@1 is 1..32 validated HTTP headers; http-proxy-basic@1 is a
    bounded username/password; http-proxy-bearer@1 is one bounded token. Their
    canonical plaintext JSON is at most 32 KiB. Reads expose only ID, kind and
    creation metadata.
  replay_contract: >-
    Secret create requires Idempotency-Key. Store only an HMAC of the canonical
    request under a master-key-derived subkey, never a public request hash or
    plaintext request. Same key/body replays safe metadata; another body
    conflicts.

scope:
  in:
    - Add migration 000016_runtime_credentials.sql for immutable encrypted records, tombstones and bounded idempotency metadata.
    - Extend the credential master-key boundary with domain-separated HMAC key derivation without changing existing LiteLLM ciphertext compatibility.
    - Implement strict constructors, AES-256-GCM envelopes, safe metadata projections, just-in-time resolution and explicit in-memory secret wrappers.
    - Reject hop-by-hop, host, framing, routing, proxy-auth-in-OTLP and CR/LF header input and enforce every byte/count bound.
    - Add a usage-check interface and lifecycle barrier; immediately fence active RuntimeConfig bindings and leave hooks for Run/allocation references added later.
    - Make delete idempotent, retain the encrypted row on an ambiguous failure and permanently reserve a deleted credential ID.
  out:
    - HTTP handlers, browser forms, label placement, OTLP export or proxy transport behavior.

deliverables:
  - {path: internal/persistence/migrations/000016_runtime_credentials.sql, description: Encrypted adapter credential and replay schema.}
  - {path: internal/credentials, description: Runtime credential kinds, encryption, HMAC replay and lifecycle integration.}
  - {path: internal/runtimeconfig, description: Credential-kind validation interface used by publication and binding.}
  - {path: Makefile, description: Focused runtime-credential test target.}

requirements:
  - id: R1
    text: Secret types format as redacted, cannot be marshalled accidentally and are decrypted only for one selected consumer.
  - id: R2
    text: Database rows, idempotency metadata, errors and structured logs contain no plaintext secret and no public deterministic secret hash.
  - id: R3
    text: RuntimeConfig publication/binding accepts only an existing credential of the kind required by its containing adapter block.
  - id: R4
    text: Creation and deletion serialize with the shared credential lifecycle barrier so a successful delete cannot race a newly committed reference.

acceptance_criteria:
  - id: A1
    given: Each valid credential kind and a configured master key.
    when: It is created, read, resolved once and deleted.
    then: Reads remain metadata-only, resolution returns the original value, and the ID cannot be recreated.
  - id: A2
    given: A lost create response.
    when: The exact key/body is retried and then the key is reused with changed secret bytes.
    then: The exact retry returns the original safe result and the changed retry conflicts without revealing equality details.
  - id: A3
    given: A credential referenced by the active default or another active label binding.
    when: Delete is requested concurrently with a binding change.
    then: Lock ordering produces either a completed unreferenced delete or a credential_in_use result, never a dangling committed binding.
  - id: A4
    given: Invalid headers, CR/LF, excessive values, wrong credential kind or corrupted ciphertext.
    when: Validation or resolution runs.
    then: It fails closed with a bounded safe code and does not fall back to plaintext or another credential.

tests:
  - {name: unit, command: "go test ./internal/credentials/... ./internal/runtimeconfig/...", covers: [A1, A2, A4]}
  - {name: postgres, command: "CONTRACTOR_TEST_DATABASE_URL=postgres://... make test-runtime-credentials", covers: [A1, A2, A3, A4]}
  - {name: race, command: "go test -race ./internal/credentials/... ./internal/runtimeconfig/...", covers: [A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3, A4]}
