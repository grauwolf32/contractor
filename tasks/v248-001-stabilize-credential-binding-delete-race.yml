schema_version: '1.0'
id: V248-001
title: Stabilize credential binding and deletion release regression
milestone: release-gate-test-dedup-2026-10
priority: P1
status: completed
implementation_commit: c1ab52429b184ed36274bca1c676a00ef98b50b0
depends_on: []
languages: [go]
goal: Make the binding/deletion concurrency regression reflect and enforce the actual credential reference barrier.
context:
  issue: https://github.com/grauwolf32/contractor/issues/304
  finding: The full release race gate failed in the credential binding/deletion concurrency regression on main.
scope:
  in:
    - Identify the underlying error when deletion wins the race.
    - Correct the production classification or test expectation without hiding database failures.
    - Rerun focused race and release-gate checks.
  out:
    - Weaken the credential deletion reference fence.
acceptance_criteria:
  - {id: A1, text: Deletion and binding serialize with either a valid binding or a classified missing credential.}
  - {id: A2, text: Transient database faults remain retryable and are not disguised as missing credentials.}
  - {id: A3, text: The focused race regression and affected package suite pass.}
tests:
  - {command: go test -race -count=50 ./internal/credentials -run '^TestRuntimeConfigBindingAndCredentialDeleteSerializeAcrossBarriers$', covers: [A1, A2]}
  - {command: go test -race -count=1 ./internal/credentials/... ./internal/runtimeconfig/..., covers: [A3]}
  - {command: make lint && go build ./..., covers: [A3]}
