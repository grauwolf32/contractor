goal: Run a small exploratory Audit with one bounded coordinator over ordinary Runs, durable task identities,
  accepted results and simple pause/stop/continuation.
demonstration: The real public API starts a two-Workflow Audit without initial hypotheses, transfers an
  exact artifact, accepts a Project finding and continues after Server restart without duplicate Run or
  result.
context:
  authority: 'User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. User decision on 2026-11-01 rejects parallel
    Audit/Project Finding models: V64-014 supplies one Project identity/current state and its existing
    read/edit callers; this task reuses that owner rather than adding another Finding lifecycle.
    User decision on 2026-11-02 moves shipped YAML rewriting into the tasks delivering its execution:
    V64-002 owns exploratory/supporting/observation/scan programs; V64-012 owns checklist and assertion-check
    programs. Rewrite the configurations with their actual consumers rather than retaining the old format
    or introducing an unsupported-profile compatibility mode. V64-010 verifies the combined catalog and
    removes remaining obsolete callers; it no longer owns the initial YAML rewrite. This is a planning
    amendment, not assignment of dependent implementation. User decision on 2026-11-02 resolves
    OpenAPI task granularity: an ordinary preparation Workflow uses an existing Server-operation
    Stage to produce a bounded work-list output; common Audit acceptance creates separate tasks
    per operation and the coordinator submits ordinary checking Runs. The domain owns parsing,
    selection, conditions and gaps; the operations module adapts declared Workflow inputs/outputs;
    Audit service owns IDs, validation, bounded acceptance and idempotency. Compatible tasks can
    batch. V64-026 owns the narrow operation/output/admission-validation prerequisite. Web-scan
    remains one task per selected target. This is deterministic preparation, not V64-013 generation.'
  execution_authority: >-
    User assigned implementation on 2026-11-02 and explicitly permitted starting on current main
    despite V64-014 remaining in_progress. Its merged implementation is the integration baseline;
    this exception neither completes V64-014 nor treats its outstanding verification as passing.
    Work is isolated on codex/audit-task-coordinator. No demo deployment is authorized.
  implementation_gate: >-
    Implementation is assigned. V64-001, V64-004 and V64-021 are completed; the user explicitly
    waived waiting for formal V64-014 completion for this task on 2026-11-02. V64-026 completed at
    6e75823c634f71471fd916e52b175ab35a9c478f with all declared checks; dependent implementation
    resumes under the existing assignment without another approval.
  explicit_task_handoff: >-
    User decision 2026-11-02: after collection of Run A output, accept task B through the common
    authenticated task-creation API with an explicitly selected exact input. The controller creates
    its ordinary Run through RunService. The first demonstration pauses after A is admitted, drains
    and collects A while paused, accepts B, then resumes. Pause closes Run submission, not task
    acceptance, and an empty paused Audit does not automatically complete. No additional waiting
    state or continuation mechanism is introduced; automatic proposals and generation remain V64-013.
  catalog_cutover: >-
    User decision 2026-11-02: temporarily remove the eight checklist/assertion YAML owned by
    V64-012 from the shipped catalog when switching the loader/executor. V64-012 restores their
    scenarios in the common format with actual assertion behavior. Do not keep an old reader,
    executor or unsupported-profile mode. Original YAML remains available in Git at main
    9b4ba9c8b1901c5c7eeb301015ad7e61cd94066d, without duplicate archived catalog files.
  openapi_preparation_boundary: >-
    User settled the former decision_needed on 2026-11-02. Reuse the existing OpenAPI/scan domain
    builders through an ordinary Server-operation preparation Workflow, with the concrete bounded
    output-to-task contract supplied by V64-026. This task accepts that exact work through its one
    task-creation operation in bounded slices, preserving producer/list/entry identity and partial
    intake/replay. It supplies the actual owner persistence/control/RunService integration; the operation
    itself writes no Audit task and introduces no inventory phase, admission engine or generator loop.
  implementation_progress: >-
    Preparatory commit 8947ae49bf91122340322a3779c7312f9553aabf adds shared typed Program decoding
    through the existing strict common validator and migrates the real catalog validation caller to it.
    Full auditcontract, config/... and configload/... Go suites passed with canonical macOS TMPDIR.
    V64-026 is completed at 6e75823c634f71471fd916e52b175ab35a9c478f. Catalog slot validation now
    returns the exact allowed Workflow closures through the owning auditprofile module, sharing one
    rule with offline validation and the upcoming accepted-task path; complete config/configload suites passed.
    Work on 2026-11-03 adds strict pinned common programs, bounded durable Task acceptance using
    mutation_receipts, and public task create/list/detail operations with generated Go/UI clients.
    Exact Project inputs are retained through the ordinary frozen Project-to-Audit fork; baseline
    input descriptors remain exact Project selections, so existing baseline holds keep their owner.
    Accepted Tasks reference real Audit-scope material. Collected Run inputs reuse the existing
    Run-to-Audit path and the same deterministic material name as output collection.
    The existing execution/membership relations now reserve common Task attempts without a Round,
    manifest or task ZIP. RunService derives Workflow, configuration, parameters and selected inputs
    from the locked owner pin; trusted context is authored after the real Run identity/input forks.
    The existing importer/collection receipt retains ordinary supporting outputs and normalizes
    observation conclusions with exact Task/Run provenance and Audit-owned evidence.
    Real PostgreSQL checks cover paused intake, equal-key concurrency, exact metadata/ownership,
    row/byte limits, Project/claim fences, stable Run creation, paused collection, source Run purge
    and replay before mutable source reads. A 100000-Task fixture proves sparse filtered pages in
    custom/generic PostgreSQL plans and bounded lifecycle purge. Generic state parameters initially
    scanned settled history; the query now uses closed validated state literals and passes both plans.
    Full Go suites with integration tags and PostgreSQL passed for auditstore/..., runservice,
    auditservice, auditimport, config/..., configload/..., archtest and httpapi/public, including
    the new routes' common contract gates and dedicated Task/attempt FK/purge topology. ERD is
    regenerated from four migrations. These are intermediate checks, not task acceptance; full
    gates must be rerun after the remaining integration and final schema cutover.
    The next intermediate slice connects authored initial work and declared prepared-work outputs
    to common acceptance. It verifies the real frozen producer output and every selected material,
    checkpoints exact source/count/offset on the existing execution, and advances that offset with
    the Task acceptance receipt. The producer stays collecting until intake finishes or closes.
    PostgreSQL covers 256 entries over a 90000-Task history, lost acknowledgements, claim takeover,
    paused intake, cancellation and immutable committed source/progress. The common controller uses
    the existing claim pass, RunService and importer; sparse ready selection probes at most 64 small
    keys per allowed Workflow then hydrates at most 64 Tasks / 1 MiB, excluding closed lane windows.
    Custom and generic PostgreSQL plans pass the 100000-Task ready/source lookup and purge checks.
    Real-store controller checks cover two different Workflow refs, paused collection, exact API-owner
    handoff after source Run purge, Resume, completion without a finding or approval, lost creation
    acknowledgement, reserved-intent Resume at the Run ceiling, lane fairness, deadline and cancellation.
    Importer outcome checks retain failed partial output, settle malformed/missing output/context once,
    and retry ambiguous reads without inventing a semantic gap. A two-Task ordinary Run preserves
    distinct contexts/conclusions and charges shared selected evidence once through existing collection
    links. Full affected Go suites passed with
    PostgreSQL/integration tags; the architecture import-shadow failures were fixed and its full suite
    rerun successfully. Full persistence tests and make lint passed; the ERD and dependency graph
    are regenerated. These are component checks; the public create/start
    cutover, common Finding integration, six executable profile migrations, deletion of the retired
    pipeline and actual Server/Runtime process E2E remain unfinished.
    The current additive migration and temporary execution-role branches are development staging,
    not the final schema or a supported compatibility path. The eight YAML remain until the loader
    switch; V64-012 records their accepted removal/restoration boundary. No full lint/release result
    or V64-002 completion is claimed.
