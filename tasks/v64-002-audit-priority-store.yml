goal: Run a small exploratory Audit with one bounded coordinator over ordinary Runs, durable task identities,
  accepted results and simple pause/stop/continuation.
demonstration: The real public API starts a two-Workflow Audit without initial hypotheses, transfers an
  exact artifact, accepts a Project finding and continues after Server restart without duplicate Run or
  result.
context:
  authority: 'User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. User decision on 2026-11-01 rejects parallel
    Audit/Project Finding models: V64-014 supplies one Project identity/current state and its existing
    read/edit callers; this task reuses that owner rather than adding another Finding lifecycle.
    User decision on 2026-11-02 moves shipped YAML rewriting into the tasks delivering its execution:
    V64-002 owns exploratory/supporting/observation/scan programs; V64-012 owns checklist and assertion-check
    programs. Rewrite the configurations with their actual consumers rather than retaining the old format
    or introducing an unsupported-profile compatibility mode. V64-010 verifies the combined catalog and
    removes remaining obsolete callers; it no longer owns the initial YAML rewrite. This is a planning
    amendment, not assignment of dependent implementation.'
  implementation_gate: V64-001 decisions are settled. Keep pending until implementation is assigned and
    dependencies are complete; this task amendment starts no code, migrations, live Runs or deployment.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/findings/findings.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  planned_gate: Create test-audit-basic-e2e with real Server/Runtime/PostgreSQL and fail-on-missing cases;
    V64-011 later registers the integrated core exit.
  contract_review_followup: User-requested implementation review on 2026-11-01 found a V64-001 contract
    defect. V64-021 supplies this consumer's corrected boundary before implementation; the accepted Audit
    skeleton and this task's remaining scope are unchanged.
  shipped_yaml:
    boundary: The current observation/tracing and bounded scanner programs below do not need a dummy
      hypothesis or a generator. Migrate their YAML and the Workflow/template/instruction/result bindings
      required by the real caller together. Source-to-OpenAPI supporting work uses ordinary exact material
      handoff and the same task-creation operation; it does not justify another dependency engine.
    profiles:
    - configs/audit-profiles/openapi_operation_observe.yaml
    - configs/audit-profiles/openapi_operation_trace.yaml
    - configs/audit-profiles/openapi_nuclei_scan.yaml
    - configs/audit-profiles/openapi_sqlmap_scan.yaml
    - configs/audit-profiles/source_openapi_sqlmap_scan.yaml
    - configs/audit-profiles/web_scan.yaml
    next_owner: V64-012 rewrites the eight checklist/standard assertion profiles. Their full behavior
      is not this task's acceptance and must not create a dependency back from V64-002 to V64-012.
scope:
  in:
  - Reuse and simplify the existing Audit controller/service/store and ordinary RunService submission
    path; a task contains selected work and Run attempt associations, not a duplicate Run execution lifecycle.
  - Wire minimal create/start/detail/task/result/pause/resume/cancel reads and commands plus one actual
    runnable exploratory program for the same-change process demonstration.
  - Keep one reconcile loop for control intent, terminal observation/collection, ready selection, stable-key
    Run creation and completion with explicit gaps.
  - Treat an iteration as a selected work boundary/ordinal; remove separate research cycle/pre-Round progression
    and replaced intent/phase representations as callers migrate.
  - Keep Scheduler concurrency/placement/retry and existing claims/receipts authoritative; allow terminal
    collection while paused or cancelling.
  - Collect ordinary immutable result outputs even when no finding is emitted. Preserve exact conditions/evidence
    and optional finding references through the existing output publication/receipt path; do not make
    successful task completion depend on creation of a problem card.
  - Rewrite the six context.shipped_yaml profiles as common programs with selected inputs, allowed Workflows,
    initial ordinary work, operation policy and bounded budgets. Adapt their actual catalog/execution
    bindings and equivalent testdata in the same change; preserve useful observation/scan behavior and
    evidence without old Round/approval/ZIP authoring. Do not postpone this rewrite to V64-010.
  out:
  - A new Scheduler, admission service, collector service, research controller, report approval or universal
    program DSL.
  - Checklist/standard hypothesis execution and its eight shipped profiles (V64-012), automatic generation
    and proposal-driven continuation (V64-013), or preserving a legacy profile reader/executor.
  - Implementation during this planning-only update; changing user model configuration or deploying/migrating
    the demo.
requirements:
- id: R1
  text: Soft pause closes new admission and lets admitted Runs drain. Resume keeps accepted inputs/results;
    terminal cancellation joins/releases child work and does not masquerade as resume.
- id: R2
  text: Ambiguous create reconciles the exact original submission key/Run association; target execution
    is never repeated to repair persistence.
- id: R3
  text: A new Run attempt is an explicit permitted retry after terminal observation, not a fresh identity
    on every tick. No per-item active approval or mandatory finding review blocks the target program.
- id: R4
  text: Keep task/Run membership valid for batching; first caller may be small without defining one-Run-per-task
    as a universal restriction.
- id: R5
  text: 'Keep the program small: pinned inputs/allowed Workflows, initial work, optional ordinary continuation
    and limits/policy. Later tasks are accepted from already available exact materials through the same
    task-creation operation. No second arbitrary Workflow graph or task-dependency engine is introduced.
    Initial work may use any allowed binding, including supporting work or generation. No finding or generator
    invocation is required for completion; hypothesis presence alone never launches a Run.'
- id: R6
  text: Migrated YAML uses the executable common contract and existing domain parsers/scanner adapters.
    Preserve source/settings/rules selection, exact evidence, Workflow closures and applicable tighter
    budgets. A prior kind=check label does not require an invented hypothesis for exploratory scanning
    or observation. Retain actual assertion semantics with V64-012 rather than silently weakening them.
failure_outcomes:
- operation: Reconcile one bounded Audit task slice
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Reconcile one bounded Audit task slice
  expected: 'Base fixture: 2 ordinary Runs without hypotheses or generation, with retained results and
    optional findings. Shipped rewrite: 6 observation/tracing/scan profiles.'
  maximum: Keep applicable published LIM-AUD/LIM-FND ceilings unless proposal 0050 explicitly identifies
    a reviewed change; no new full-pool work.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: a real Server/Runtime/PostgreSQL and two selected Workflows
  when: a no-hypothesis exploratory program completes
  then: exact output handoff, retained results with and without findings, and Project finding origins
    are visible through the public API without a new result store
- id: A2
  given: create/collection acknowledgements are lost and Server restarts
  when: the coordinator resumes
  then: the original Run/result identities reconcile once, without a duplicate action or result
- id: A3
  given: pause, deadline, resume, cancellation and deletion during pending/running/collection work
  when: commands and competing claims race
  then: no unauthorized new submission occurs; admitted work drains/joins and partial outcome is truthful
- id: A4
  given: at-ceiling pending task records with few ready tasks
  when: reconcile and purge run
  then: per-tick/transaction/page work stays bounded without full-history hydration
- id: A5
  given: the six context.shipped_yaml profiles and equivalent isolated catalog/process fixtures
  when: their rewritten programs resolve and their real task/Run callers execute
  then: the owned observation/scan scenarios use the common path with selected exact materials, original
    scope/budgets and ordinary retained outputs; none executes the retired profile pipeline or requires
    a fabricated hypothesis/generator; validation-only YAML changes do not satisfy this criterion
