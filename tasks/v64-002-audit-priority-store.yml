schema_version: "1.0"
id: V64-002
title: Persist Audit candidate inventory, ranking cycles and atomic admissions
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P2
status: deferred
deferral:
  date: "2026-10-21"
  previous_status: pending
  previous_priority: P1
  reason: User deferred the remaining V64 integration to focus on authenticated HTTP continuity and completion of the existing V62 audit journey.
  reactivate_when: Explicit user decision after cookies and V62 are delivered and representative audit measurements show that model-based prioritization improves useful-result yield or time/cost over fixed ordering.
implementation_commit: null
depends_on: [V64-001, V62-002]
languages: [go, sql]
goal: >-
  Preserve the full Audit inventory and every ranking decision independently of
  selected Round items, with durable claims, budgets and exact provenance.
context:
  authority: User-requested Audit checklist prioritization task series.
  design: docs/plans/2026-09-20-audit-check-prioritization.md
  specification: [docs/proposals/0034-audit-check-prioritization.md, docs/spec/audits/audits.md]
  foundations: V62-002 supplies Audit-scoped execution identity and no-Round persistence; V64 adds ranking state instead of inventing a second lifecycle.
  revalidated: >-
    2026-10-24 on b523ae77: still deferred under execution_policy.current_delivery_focus, not
    superseded. The deliveries named in reactivate_when have landed (cookie persistence V377-001,
    c50d6ab0; the V62 journey through V62-012, 8c2441f0) and every dependency outside V64 is
    complete (V64-000, V62-001, V62-002, V62-003, V25-011); what remains is representative audit
    evidence and an explicit user decision. The new plans do not supersede it: proposal 0033 section
    14 says V64 is not a prerequisite, its section 8.2 orders pentest hypotheses by frozen
    assessment order, policy, budget and plan digest rather than per-candidate model verdicts,
    V411-012 excludes V64 ranking integration, and V55-009 (pending scanner ranking) stays
    independent per proposal 0034. The V64-000 pure core in internal/auditpriority (domain layer,
    internal/archtest/layers_test.go:117) still has no production importer:
    tools/testonlyexports/baseline.txt:67-70 holds BindVerdict and DecodeVerdict for V64-005 and
    ResolveTopN and SelectionDigest for V64-006, so archiving the series would also require removing
    those exports. Its schema and fixtures live in api/audit-priority/v1, not the
    api/testdata/audit-priority path named in the V64-001, V64-005 and V64-010 deliverables.
    Proposal 0034 was last refreshed on 2026-10-21 (631d6d51) and already cites the domain
    specification documents. Task-specific: the Audit schema now has 14 tables (inventory in
    docs/plans/2026-10-23-schema-reduction-round-2.md); audit_items carries coverage and proposal
    rows (V365-018), audit_executions carries collection receipts (V365-017) and the
    report-acceptance review request holds frozen report links (V365-019). An inventory, cycle,
    intent, verdict and reservation design must use mutation_receipts through KeyedMutation
    (PER-R24) and ControllerClaims over audit_controller_claims (PER-R25) instead of new receipt or
    claim tables (AGENTS.md section 3.2), reuse the Audit dispatch windows of AUX-R3 to AUX-R6
    (000027_audit_dispatch_windows.sql) for reservations, keep long SQL in *_sql.go and add
    migration 000040 or later on top of 000001_baseline.sql. internal/auditstore is split into
    claimstore, hookstore, ownerstore, querystore, reviewstore and internal/pgstore.
scope:
  in:
    - Add an immutable Audit-wide inventory with stable canonical candidate IDs and lineage; unadmitted candidates consume retention capacity but no execution item budget, and selected Round items cannot replace the coverage denominator.
    - Persist ranking cycle identity, exact remaining pool, context/prompt/policy digests, revisions, per-candidate intents/verdicts and explicit incomplete or blocked reasons.
    - Add claim-bound compare-and-swap transitions and unique constraints for one model-call intent and at most one accepted verdict per candidate/cycle.
    - Persist pre-ranking cycle-owned reservations for one ranking Run, target initial check Run count and target item slots; ranking submission consumes its reserved slot, selection atomically converts counts to exact item identities and neither step double charges.
    - Keep unknown model usage reserved, prevent retries from stealing selected initial-attempt reservations, release batch excess after settlement and release unused cycle capacity on failure/cancel under existing claim fences.
    - Implement atomic selection admission accepting complete pool/context revisions, exact selected IDs and accepted frozen-output receipt, converting the whole selected-set reservation and creating the immutable Round together.
    - Retain successful verdicts on incomplete cycles, all candidate dispositions and cycle history through permitted source Run deletion and Audit pause/recovery.
    - Extend owned artifact/credential holds, reference fences and deletion cleanup to frozen context, accepted results and ranking-only Audits.
    - Add a forward migration preserving persisted current-schema Audit identities, immutable snapshots, receipts and holds without supporting obsolete snapshot formats; coordinate the next migration number at implementation time.
  out:
    - Model calls, context summarization, ranking policy decisions, Controller dispatch or a new scheduler.
deliverables:
  - path: internal/persistence/migrations
    description: Additive inventory, cycle, intent, verdict, reservation and admission constraints preserving current-schema Audit state and immutable accepted data.
  - path: internal/auditstore
    description: Transactional inventory/cycle reads, claims, CAS, exact result acceptance and all-or-nothing Round admission.
  - path: internal/artifacts
    description: Protected immutable priority-context and result retention with exact ownership and reference holds.
acceptance_criteria:
  - id: A1
    text: PostgreSQL rejects duplicate identities, foreign candidates, stale pool/context/claim revisions and conflicting accepted verdict replay, including concurrent requests.
  - id: A2
    text: Eleven submission slots admit one ranking Run plus ten initial check Runs with no double charge during submission/admission replay; whole-set acceptance atomically converts reserved counts into exact identities, and failure cannot partially admit or steal reservations.
  - id: A3
    text: Crashes at intent, result acceptance and admission boundaries recover without duplicate calls or admitted items; unknown intents remain distinguishable from calls never started.
  - id: A4
    text: Source deletion, Audit deletion and reference-release races preserve required provenance without cross-owner reads, leaked holds or changes to immutable accepted snapshots; obsolete snapshot formats are rejected without conversion.
tests:
  - command: go test -tags=integration -count=1 ./internal/auditstore/... ./internal/artifacts ./internal/runstore ./internal/persistence/...
    covers: [A1, A2, A3, A4]
  - command: git diff --check
    covers: [A4]
test_prerequisites:
  - Disposable PostgreSQL via CONTRACTOR_TEST_DATABASE_URL; all mandatory migration, race and transaction cases must execute.
verification_requirements:
  - Record exact transaction case counts and assert durable row identities, pool membership, reservations and hold counts, not only terminal state.
  - Validate upgrades with persisted current-schema Audit/profile fixtures and obsolete-schema rejection cases; do not rename an already applied migration from another series.
