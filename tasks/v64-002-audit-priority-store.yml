schema_version: '1.0'
id: V64-002
title: Coordinate durable Audit tasks through ordinary Runs
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P1
status: pending
depends_on:
- V64-001
- V64-004
- V64-014
- V64-021
languages:
- go
