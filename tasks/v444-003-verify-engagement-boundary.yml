schema_version: "1.0"
id: V444-003
title: Verify the reduced engagement boundary across existing HTTP execution
milestone: autonomous-http-pentest-2026-10
epic: quality
kind: chore
introduced_by: V411-002
priority: P1
status: pending
depends_on: [V444-002]
languages: [go, python, yaml, markdown]
goal: Prove that existing HTTP execution preserves network authority after engagement loses unrelated Audit responsibilities.
demonstration: Real Server/Runtime/PostgreSQL executes allowed anonymous and authenticated HTTP work, refuses denied work and releases all private state using the reduced document.
context:
  authority:
    - date: "2026-11-04"
      decision: >-
        User requested the three-task engagement refactor, no blackbox or backward
        compatibility, tasks on main and then implementation. Sandbox egress and
        independent ordinary-Run setup remain separate scopes.
  specification:
    - docs/spec/audits/audits.md
    - docs/spec/audits/execution.md
    - docs/spec/tools/http-caido.md
    - docs/spec/tools/scanners.md
    - docs/testing/engagement-http-conformance.md
    - docs/testing/README.md
  boundary: >-
    Reuse test-engagement-http-process and existing HTTP/Nuclei/identity tests.
    This task accepts the refactor, not the complete pentest product or live-model
    quality. V411-020 remains the composed product exit task. Planning changes
    already reconcile dependent tasks; this gate verifies they stayed aligned.
scope:
  in:
    - Run the existing real-process and real-store matrices with the final reduced engagement.
    - Verify ordinary material inputs/deadlines, exact policy pins, HTTP/Nuclei shared local limits, explicit credentials and joined cancellation/release.
    - Replace obsolete source-mode cases with ordinary input access cases; extend only uncovered real boundary cases, without implementation-mirroring tests.
    - Verify dependent HTTP/API/UI/report/browser/sandbox task scopes use the reduced document and do not promise new egress or global counters.
    - Record actual commands, selected case counts, platform skips and remaining product limitations.
  out:
    - Full pentest release, new capture/report/UI features, live-model runs and implementation of optional integrations.
    - A new test framework, default quota, source-mode policy or old-record compatibility.
acceptance_criteria:
  - id: A1
    text: The existing process gate executes nonzero real Server/Runtime/PostgreSQL scenarios with zero unexpected mandatory skips.
  - id: A2
    text: Denied scope/credentials, configured and omitted limits, fresh allocation counters and cancellation/release preserve existing behavior.
  - id: A3
    text: Shared contracts, public API, shipped configuration and task/spec checks pass; no active plan reintroduces source modes or engagement-owned Audit inputs/budgets.
tests:
  - command: make require-database
    covers: [A1, A2]
  - command: make test-engagement-http-process test-wire-cross-language verify-public-api verify-public-api-postgres test-config
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A3]
