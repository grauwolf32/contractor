schema_version: '1.0'
id: V126-001
title: Redact allocation credentials at the report persistence boundary
milestone: allocation-report-secrets-2026-10
priority: P1
status: in_progress
implementation_commit: null
depends_on: []
languages: [go]
goal: Redact per-allocation Runtime credentials from Worker reports even when another Scheduler instance finalizes the Stage.
context:
  issue: https://github.com/grauwolf32/contractor/issues/283
  specification: docs/spec/04-execution-lifecycle-and-metrics.md
  finding: Scheduler report redaction reads a production-unset RuntimeSettings token and misses resolved allocation credentials.
scope:
  in:
    - Narrow Scheduler static Runtime options to the two fields it uses.
    - Re-resolve each live allocation's credential values when persisting its report.
    - Share RuntimeSettings secret extraction with the controlplane handle validator.
    - Keep report persistence best-effort when a credential cannot be resolved.
  out:
    - Retain plaintext allocation credentials between preparation and finalization.
acceptance_criteria:
  - {id: A1, text: Scheduler options have no unused LLM gateway token or URL and static telemetry secrets no longer read one.}
  - {id: A2, text: Per-allocation LLM, OTLP, proxy, Caido and HTTP-origin credentials are redacted in persisted Worker arguments and errors.}
  - {id: A3, text: A different Scheduler instance can re-resolve the pinned credentials during report finalization.}
  - {id: A4, text: Credential resolution failures do not block report persistence.}
tests:
  - {command: go test -p 1 ./internal/scheduler ./internal/telemetry ./internal/controlplane ./internal/contracts, covers: [A1, A2, A3, A4]}
