schema_version: "1.0"
id: V409-004
title: "Reduce avoidable Audit read work while preserving exact totals and expiry"
milestone: sql-review-2026-10
epic: audits
kind: chore
introduced_by: V367-009
priority: P2
status: in_progress
depends_on: []
languages: [go, sql]
goal: "Optimize evidenced Audit item/inventory read costs and remove test-only production reads without changing counts, cursor semantics, lifecycle authority or reconciliation order."
context:
  review: "docs/research/2026-10-23-sql-review.md, A4, A5 and related section C observations; corrected by independent validation on 2026-10-23."
  specification:
    - docs/spec/audits/audits.md#AUD-R224
    - docs/spec/audits/review-and-reports.md#REV-R165
    - docs/spec/audits/review-and-reports.md#REV-R170
    - docs/spec/ui/ui.md#UI-R143
    - docs/spec/ui/ui.md#UI-R144
    - docs/spec/audits/execution.md
    - docs/spec/evals/managed-evals.md#EVM-R186
    - docs/spec/platform/limits.md
    - docs/spec/platform/persistence.md
  validation: >-
    Performance/refactoring opportunity on main
    1d533b2db885e0162ebabb01d36470f139546009; no universal full-scan plan,
    production latency regression or wrong workspace count was proved.
    Existing indexes and mandatory totals/expiry make the original blanket
    index-only/O(page) goal unsound. listItems' zero-limit branch has a
    test caller, and CountItems serves next-Round capacity planning in
    addition to the later atomic acceptance check. Relevant source is
    unchanged at main e4480ace5ba68e665535a30ee23f4eb4c3a0ceb6.
  finding: >-
    internal/auditstore/internal/pgstore/read_sql.go:46-57 orders public
    items by Round ordinal then item ordinal/ID; read.go:141-167 has a
    separate bounded reconciliation order that postpones awaiting_review.
    workspace_sql.go:13-32 computes exact finding counts, pending reviews
    unexpired at statement time and current-Round coverage in one snapshot.
    finding_reads_sql.go:47-56 contains filtered list count bases.
    report_review_sql.go:94-97, report_sql.go:39-42 and
    lifecycle_sql.go:165-168 have uncollected-execution probes;
    item_review_renewal_sql.go:13-43 and claimAuditSQL use review joins.
    internal/evalstore/inventory_pages_sql.go:39-52 compares a prefixed
    execution key. These shapes need per-query plans before index changes.
    QueryStore.ListExecutions at read.go:199-221 is production code with
    only test consumers (tools/testonlyexports/baseline.txt), a separate
    cleanup opportunity.
  provenance: >-
    V367-009, commit 5f37b8c588c7eed996d3a5b3d85f9b7756f756b9,
    introduced the current workspace coverage aggregation and corrected
    pending-review expiry. Its semantics are intentional and retained.
    The item/inventory queries and test-only readers have distinct older
    origins; this task does not attribute every observation to V367-009.
  cardinality: >-
    An Audit admits at most 32 Rounds, 10000 items per Round and 100000
    items total (pgstore/validation.go:66-75, LIM-AUD-25/26). Those are
    item limits, not a 100000-finding admission cap: the report-building
    finding limit does not bound all retained Audit findings. Record the
    actual finding/review/execution fixture populations separately.
    Existing audit_items_round_ordinal, dispatch and ready indexes must
    be considered; a missing state index cannot be assumed.
  siblings: >-
    Preserve listItems controller fairness and MaxReconcileRows+1 overflow
    detection, listReadyItems and settleUndispatched ordering.
    export_test.go:14-17 calls listItems with zero to inspect all test
    items; move that read into test-only code rather than deleting it.
    CountItems (round_reads.go:11-17) feeds
    auditservice/next_round.go:53-59 before work is prepared; acceptNextRoundSQL
    at round_sql.go:178-197 checks capacity again under mutation authority.
    Both guarantees remain. V407-003 covers controller batching and
    V407-004 covers Audit-list hydration; this task preserves their
    boundaries and adds no dependency on the V409-013 exit gate.
plan:
  - >-
    Before implementation, add reproducible SELECT-only plan fixtures on
    a fully migrated disposable database. Cover the named item, workspace,
    filtered count, execution-existence, review-join and inventory queries,
    with actual parameters/statistics and prepared-query mode. For every
    candidate record the measured rows/loops and a specific fixed-or-kept
    decision. Do not execute mutation EXPLAIN ANALYZE outside an isolated
    rolled-back test. Store plan/budget evidence with the tests/completion
    record, not as an unverified lint claim.
  - >-
    Implement bounded candidate construction for unfiltered item pages,
    using Round-ordered per-Round keysets and existing indexes where
    practical. At most 32 Rounds may contribute at most the fetch limit
    each before the final merge; sorting that bounded candidate set is
    allowed. Preserve filtering before pagination, stable ties and owner
    checks. Measure selective Round/state/subject cases separately and add
    an index only where a demonstrated access-path gap justifies its write
    cost; do not promise the same bound for arbitrary sparse filters.
  - >-
    Normalize the Eval inventory cursor's parent key "0" and child key
    "1" plus execution_id before comparing the bare child ID, preserving
    the existing signed cursor format and parent-first behavior. Test
    absent parent, first/late child pages, foreign owner and stale revision.
    Require an execution-key range probe on the selective large fixture,
    without forcing an index plan on tiny tables.
  - >-
    For uncollected probes, first verify the allowed state set and reuse
    its canonical domain definition when making a partial-index predicate
    explicit. Keep the exact meaning of pending/decided/expired review
    joins. Evaluate current indexes before adding a broader subject index.
    Optimize only cases whose measured cost improves; record an explicit
    reason for keeping an already suitable query/index.
  - >-
    Retain exact filtered totals before cursors and the count/page/hydration
    revision fence. Retain workspace asOf and the expires_at comparison
    against the same PostgreSQL statement time, even before any expiry
    mutation runs. Do not replace these with mutation-only counters or drop
    totals based on a UI guess. Preserve the single-pass coverage buckets
    and both next-Round planning capacity and atomic acceptance capacity.
    Any count-index change must improve a measured case; count cost may
    still depend on the matching population.
  - >-
    Move ListExecutions to the existing auditstoretest helper or the owning
    package's export_test.go according to its real test consumers; shrink
    the testonlyexports baseline. Move the zero-limit full-item read to
    test-only code and keep the production reconciliation read explicitly
    bounded with identical ordering. Do not introduce a production export
    used only to keep tests convenient.
scope:
  in:
    - "Measured item-page and Eval inventory keyset optimization, targeted query/index changes and migration coverage where necessary."
    - "Plan inventory of the listed count/probe/review queries with per-case fixed-or-kept decisions and executable row-budget checks for changed cases."
    - "Removal of ListExecutions and full-test-item reads from production paths, preserving test behavior and shrinking the test-only export baseline."
  out:
    - "Removing public totals, changing response/cursor formats, storing expiry-sensitive mutation-only counters, or weakening next-Round admission."
    - "A universal ban on Sort/Seq Scan, an O(page) claim for exact arbitrary-filter counts, or changes to controller fairness and lifecycle behavior."
acceptance_criteria:
  - id: A1
    given: "Real-store item fixtures reaching 32 Rounds and 100000 total items with no Round above 10000, plus separate smaller/selective fixtures and early/late cursors."
    when: "The public unfiltered item query and each changed filtered query run through their production parameter path."
    then: "Unfiltered candidate/merge work is bounded by 32 times the fetch limit. A changed query has a selected regression budget that the original fails; if the original already meets the budget across the representative matrix, retain it with reproducible evidence. Filtered cases have explicit measured budgets, and every page keeps filter-before-limit, owner, tie-order and cursor semantics."
  - id: A2
    given: "A large Audit execution inventory with a parent entry, mixed missing/present child Runs and signed cursors at the parent boundary and late child IDs."
    when: "InventoryPage reads each page and the selective query plan is inspected."
    then: "The child keyset constrains the execution-ID access range instead of filtering all preceding IDs; page identities, parent-first order, ownership and revision conflicts are unchanged. A changed query has a row-visit assertion that fails for the original expression; if the existing plan already meets that bound, retain it with reproducible evidence."
  - id: A3
    given: "Findings/reviews with verdict and severity filters, all coverage buckets, and pending reviews on both sides of the statement-time expiry boundary without an expiry mutation."
    when: "Workspace and revision-pinned finding/review pages run, including a synchronized intervening mutation."
    then: "Exact totals cover the full normalized filter before the cursor, workspace pending count includes only reviews unexpired at its asOf, coverage buckets retain their contract, and count/page/hydration conflicts still return the existing 409. Tests use fixed fixtures/injected time where supported, never sleep-duration assertions."
  - id: A4
    given: "The execution/review probe fixture matrix, a next-Round capacity-boundary race and an Audit with active plus awaiting-review items."
    when: "Changed probes, preparation/acceptance and controller reads run against PostgreSQL."
    then: "Each changed probe has a falsifiable row-budget and result-equivalence test; kept statements have reproducible plan evidence and a stated reason. Preparation respects available capacity, atomic acceptance rejects overflow, and reconciliation ordering, fairness and overflow detection remain identical."
  - id: A5
    given: "The existing test consumers of ListExecutions and zero-limit ListItems."
    when: "They use the relocated test helpers and the full affected suites plus repository lint run."
    then: "They receive equivalent test data, production reads remain bounded, ListExecutions is absent from the testonlyexports baseline, and SQL placement/layer/task checks pass without replacing it with another test-only production export."
tests:
  - command: 'CONTRACTOR_TEST_DATABASE_URL="${CONTRACTOR_TEST_DATABASE_URL:?set a disposable PostgreSQL database URL}" go test -tags=integration -count=1 ./internal/auditstore/... ./internal/auditservice/... ./internal/auditcontroller/... ./internal/evalstore/... ./internal/httpapi/public/... ./internal/persistence/postgres/...'
    covers: [A1, A2, A3, A4, A5]
  - command: make lint
    covers: [A5]
