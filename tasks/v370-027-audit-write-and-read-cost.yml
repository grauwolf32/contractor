title: "Reduce Audit start and event listing costs"
milestone: hub-audit-structure-2026-10
epic: audits
kind: defect
priority: P3
status: pending
depends_on: [V370-003]
languages: [go]
goal: "A start retry does not rewrite packages; listing N events costs O(N)."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq; raw reports in docs/research/2026-10-11-hub-audit/), audits I3, I5; public API I4; persistence I2; file:line as of 02bbdcbf, re-verify on current main"
  finding: >-
    Audit start writes up to 4096 task packages (64 MiB) inside one
