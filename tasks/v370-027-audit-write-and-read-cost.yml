    counts all events on every page (events.go:67); coverage reads have no
    auditRevision pin (audit_handlers.go:492).
scope:
  in:
    - "Write content-addressed artifacts before the transaction; derive Total from the dense sequence; additive auditRevision for coverage."
  out:
    - "Results."
