schema_version: '1.0'
id: V64-013
title: Generate cold hypotheses and accept bounded concrete experiment plans
milestone: audit-check-prioritization
epic: audits
kind: feature
priority: P2
status: deferred
depends_on:
- V64-003
- V64-004
- V64-012
languages:
- go
- python
- json
- yaml
- markdown
goal: Turn guides and selected Project facts into useful attributed research directions, and expand them
  after accepted results without enumerating every scenario/endpoint combination.
context:
  authority: User requested the staged task breakdown and revision of V64/V62 for proposal 0045 on 2026-10-24;
    this change plans work only and does not start implementation.
  proposal: docs/proposals/0045-audit-hypothesis-search.md
  design: docs/plans/2026-10-24-audit-hypothesis-search.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/persistence.md
  deterministic_boundary: Direct Runs and current deterministic Audit inventories bypass research; no
    mandatory hypotheses, generation, ranking, new Scheduler mode or attack tree.
  implementation_boundary: Each new table, state, export and schema must have its named production writer/reader
    in this task; include the smallest actual integration caller, not a test-only placeholder waiting
    for another task.
scope:
  in:
  - Implement bounded scenario descriptors and structural OpenAPI/material adapters, distinguishing declared
    data from observations.
  - Provide typed Runtime authoring tools and ordinary generation Workflows that use the configured model
    for bounded judgment or deterministic producers where suitable.
  - Generate claims, explicit unknowns, alternatives and next questions with exact sources; Runtime assembles
    the accepted batch and trusted ingestion supplies IDs.
  - Expand only selected directions or accepted new evidence; persist complete candidates and explicit
    omissions, keeping unexpanded directions visible.
  - Own concrete ExperimentPlan production and trusted acceptance from guides, materials, manual hypotheses
    and accepted research results. Runtime assembles exact hypothesis membership, question, registered
    method, prerequisites, controls, interpretation/evaluator contract, required inputs/capabilities,
    permitted effects and worst-case budget; the model supplies bounded proposals, not admission authority.
  - Persist immutable accepted plan documents in ArtifactStore and their bounded Audit registry associations
    through the existing registry/admission service. Provide the exact plan reader used by context/selection;
    register holders and lifetime quotas in the same change. A changed payload, control or predicate is
    a new plan, not a technical retry.
  - Explicitly unknown applicability can produce a bounded grounding experiment. A human hypothesis does
    not require another hypothesis-generation pass before plan construction.
  out:
  - Proving vulnerabilities, optional model ranking, live target discovery or a standalone project-analysis
    product.
  - Implementation during this planning change, changing existing task statuses, or modifying completed/in-progress
    task records.
requirements:
- id: R1
  text: Cold generation works with guides alone; description and existing OpenAPI improve grounding without
    requiring live discovery, V62-008 or sitemap.
- id: R2
  text: No guide × operation × identity × payload Cartesian materialization; repeated paraphrases are
    not new information.
- id: R3
  text: A guide is methodology/expected property, not evidence of a target defect. Auth declarations and
    policy assertions retain their source class.
- id: R4
  text: Generation cannot schedule child Runs, choose arbitrary Workflow refs, change model policy or
    produce authoritative final packages by freeform JSON.
failure_outcomes:
- operation: Ordinary producer generation and trusted candidate batch collection
  permanent: Invalid, foreign, unsupported or oversized input is rejected with the owning V64-001/standard
    contract reason; deterministic ErrInvalid is never endlessly retried and no partial authoritative
    result is accepted.
  retryable: Use existing bounded transient storage/provider retries for the owning operation; retry attempt/deadline
    limits are explicit and do not switch research policies or models.
  ambiguous: Reconcile the same existing keyed mutation, accepted producer association or exact result;
    never create another logical effect or repeat target activity to repair acknowledgement loss.
  cancelled: Existing Audit/Run owner fences and join/drain rules apply; allow authorized terminal collection,
    block new dispatch and release resources only after in-flight work is joined.
  timeout: Use the owning operation/Run deadline. Audit admission deadline pauses and drains; non-time
    budget exhaustion follows bounded finalization with gaps.
cardinality:
- collection: Candidate expansion from one producer output
  expected: 32 complete candidates
  maximum: 128 candidates / 1 MiB, within lifetime pool and metadata caps
  bound: Bound selected scenario descriptors and prompt bytes separately; declared omissions never count
    as tested requirements.
lifecycle:
- entity: Task-owned research records, exact artifacts and projections
  delete: Audit/Project ownership and existing deletion gates apply; accepted evidence used by work is
    retained, not removed by settling or withdrawing a candidate.
  cascade: Use the owning Audit relations and existing artifact hold lifecycle; register any new holder
    inventory entry in this change and leave no independent cleanup owner.
  retention: Preserve exact accepted inputs/results and history through permitted source Run deletion,
    pause and recovery; release only through the owning lifecycle. Stateless validation/read-only outputs
    acquire no artificial persistent state.
acceptance_criteria:
- id: A1
  given: Guides-only, description-only and existing OpenAPI fixtures
  when: generation runs via ordinary Runtime
  then: It yields bounded distinct candidates with unknown applicability and exact origin links where
    facts are unavailable.
- id: A2
  given: A large operation set and small expansion budget
  when: the generator considers scenario families
  then: Only selected families expand and omitted/unexpanded areas remain visible without full Cartesian
    allocation.
- id: A3
  given: Accepted negative evidence and plausible alternative explanations
  when: a continuation batch is generated
  then: It records why a new proposition or question follows, without automatically treating the alternative
    as supported.
- id: A4
  given: Malformed claims, forged origin refs or interrupted generation
  when: typed tooling and import validate output
  then: Complete-batch rules, stable producer identity and bounded recovery prevent partial authoritative
    state.
- id: A5
  given: A cold or human-authored hypothesis without an experiment
  when: the configured producer proposes a question and method
  then: Trusted code accepts a concrete immutable ExperimentPlan with exact membership and bounded controls/budget;
    malformed or unregistered methods fail before selection.
tests:
- command: make test-runtime test-wire-cross-language test-config
  covers:
  - A1
  - A2
  - A3
  - A5
- command: make require-database
- command: go test -tags=integration -count=1 ./internal/auditdomain ./internal/auditimport ./internal/auditcontroller
    ./internal/auditservice ./internal/auditstore/...
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make lint
implementation_commit: null
deferral:
  date: '2026-10-24'
  previous_status: pending
  reason: Planning-only breakdown of proposal 0045; implementation has not been activated.
  reactivate_when: Explicit user authorization to implement this reviewed proposal 0045 scope, after its
    declared dependencies are completed. Replanning alone does not activate it.
deliverables:
- path: runtime/src/contractor_runtime/toolsets
  description: Typed claim/next-question authoring with Runtime-owned final assembly.
- path: internal/auditimport
  description: Generation batch validation against exact material/result membership.
- path: configs
  description: Generation methodology and Workflow building blocks; runnable profiles delivered by V64-010.
- path: runtime/tests
  description: Fixture-based generation/tool-contract cases, not live configs.
- path: internal/auditservice
  description: Trusted ExperimentPlan assembly/acceptance and exact plan reader, using existing owned
    registry associations.
- path: internal/auditstore
  description: Immutable plan associations, bounds and lifecycle with actual producer/reader callers.
test_prerequisites:
- Commands are implementation acceptance requirements, not results of this planning change. New named
  gates must be created, registered and fail on zero matching cases.
- Persistence/lifecycle acceptance uses disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; an
  unavailable configured database or mandatory skipped case fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Shipped configuration
  has its dedicated validation command.
- Run complete suites for touched packages; use injected clocks and deterministic work counters. Put timing
  measurements in benchmarks.
verification_requirements:
- Update owning numbered specifications, strict public/wire contracts and shared fixtures with implementation;
  do not cite task IDs from normative specifications.
- Record actual commands, case counts, required prerequisites and exact evidence after implementation.
  Planning does not populate implementation_commit or fabricate successful checks.
- Keep direct deterministic behavior, existing claims/receipts and source-to-consumer exact provenance
  explicit in real-path assertions.
