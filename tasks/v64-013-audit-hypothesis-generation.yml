goal: An ordinary configured Workflow derives a useful next hypothesis/check from selected Audit/Project
  materials, check results including refutations/gaps, and existing findings, using the same Audit continuation
  path.
demonstration: After an exploratory discovery and a negative or inconclusive check result, the producer
  reads pinned selected context, proposes one attributed hypothesis/task, and a later check retains its
  result and optional finding.
context:
  execution_authority: >-
    User assigned implementation on a separate branch on 2026-11-04. The same-day
    clarification confirms that ACT-R7 continuation before Audit completion,
    pause/Resume, empty-result settlement and stable receipt reconciliation are
    the existing scope. Implement the saved results -> exact context -> producer
    Run -> common hypothesis/task intake -> checking Run -> retained result path.
    Work starts from main 0d6bf1d03 on codex/audit-hypothesis-generation.
  authority: 'User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. User decision on 2026-11-02 keeps
    deterministic OpenAPI preparation with V64-026 and its common task intake with V64-002;
    neither depends on this optional semantic generator or introduces a second intake engine.'
  implementation_decisions:
  - '2026-11-04 agent implementation: selected ordinary results become exact source_01 through source_16 Run inputs. The existing proposal-context carries handles, per-source task identity, optional exact hypothesis snapshots and gaps. This reuses Artifact paging and retention; embedding payloads would impose a combined content bound and duplicate readers. The existing 8 MiB common-document context ceiling remains; mutation metadata stays bounded by 1 MiB.'
  - '2026-11-04 agent implementation: the ordinary accepted continuation Task retains its consumed source boundary; indexed per-binding seeks exclude producer outputs and preserve unselected history. Manual/initial producers never reset that boundary. Hypothesis/task acceptance shares the existing keyed mutation and execution source cursor, including empty and hypothesis-only decisions.'
  deterministic_preparation_boundary: >-
    User decision 2026-11-02: OpenAPI operation selection is deterministic domain work executed by
    an ordinary Server-operation preparation Workflow (V64-026); V64-002 accepts its work-list through
    the common task operation. That explicit preparation path neither requires this generator nor
    creates an automatic semantic continuation loop. This task continues to own optional proposed
    hypotheses/next work and uses the same accepted-task/Run path without a second intake engine.
  implementation_gate: >-
    Implementation assigned on 2026-11-04 after all dependencies completed.
    Disposable verification is authorized; demo deployment is outside this task.
  design:
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/common-contract.md#ACT-R7
