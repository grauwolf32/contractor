schema_version: "1.0"
id: V25-008
title: Integrate Audit pause, cancel, deletion and retention fences
milestone: audits-mvp
priority: P0
status: completed
implementation_commit: "a8285d51c85c96e9d45a05497f5e881a7d88779b"
depends_on: [V24-005, V25-007]
languages: [go, sql, openapi]

goal: >-
  Make Audit lifecycle safe under owner pause, Run deletion and Project
  deletion without leaked Runs, credentials, artifacts or controller work.

context:
  pause: >-
    The first UI/API guarantee is pause-new-Audit-Runs. Existing active child
    Stages may drain. Collection, cancel and cleanup must ignore owner/Audit
    admission pause.
  deletion: >-
    Audit deletion is durable: close dispatch, cancel and drain child Runs,
    collect every terminal disposition, release lifetime-specific holds, purge
    managed bindings and domain rows. Project deletion must perform this phase
    before its existing Run and ProjectScope purge.

scope:
  in:
    - Add idempotent CAS pause/resume/cancel/delete commands and safe lifecycle projection.
    - Cancel every owned nonterminal Run with bounded independent progress and wait for existing terminal-release authority.
    - Block hard deletion of an Audit-bound Run until terminal release and one durable collection receipt, including failed, cancelled, missing-output and invalid-result cases; preserve nullable tombstone provenance afterward.
    - Retain original child Run IDs, exact Workflow identity/closure digest and safe retained configuration refs, role, item/attempt links and checklist origins independently of live Run rows; expose runDeleted in read projections.
    - Reserve protected Audit-managed Project artifact prefixes from generic mutation.
    - Add Audit cancellation/drain/hold-release phases to Project deletion recovery.
    - Release Audit-level managed LLM/Runtime credential dispatch holds after dispatch is durably closed and every submission intent is resolved; retain exact evidence holds independently until Audit deletion.
  out:
    - Human review, multi-round discovery or finding Toolset.

requirements:
  - {id: R1, text: Cancel/delete cleanup progresses while owner queue and Audit dispatch are paused.}
  - {id: R2, text: Project purge cannot finish with an Audit Run, credential hold or Audit-managed Project binding left behind.}
  - {id: R3, text: Public generic artifact and Run deletion APIs cannot bypass Audit retention guards.}
  - {id: R4, text: Crash/restart at each deletion phase resumes rather than restarts or skips work.}
  - {id: R5, text: Cleanup never waits for a successful output import that a failed, cancelled, output-less or invalid Run cannot produce.}
  - {id: R6, text: Permitted child Run deletion or catalog replacement cannot erase exact check attribution; retained configuration contains no credential values or active grants and is purged with its Audit.}

acceptance_criteria:
  - id: A1
    given: An Audit with active, waiting, terminal-uncollected, accepted, output-less, invalid, failed and cancelled Runs.
    when: Cancel or delete is requested during queue pause.
    then: All children drain, every terminal Run receives its truthful collection receipt, retention rules hold and cleanup converges.
  - id: A2
    given: Project deletion races Audit start/dispatch/import.
    when: The Project fence commits.
    then: No new Audit work wins afterward and Project deletion eventually purges all owned state.
  - id: A3
    given: A public caller targets a managed Audit artifact or premature Run deletion.
    when: The mutation is attempted.
    then: It is rejected with a stable owner-safe conflict.
  - id: A4
    given: Collected checks with multiple attempts and exact Workflow/checklist origins.
    when: Their Runs are hard-deleted and catalog definitions are replaced.
    then: Audit reads retain original Run IDs, all attempts and exact Workflow/checklist refs with runDeleted; later Audit deletion releases these holds.

tests:
  - {name: lifecycle, command: "go test ./internal/auditcontroller ./internal/projectlifecycle ./internal/httpapi/public -run Audit", covers: [A1, A2, A3, A4]}
  - {name: postgres, command: "go test -tags=integration -race ./internal/auditcontroller ./internal/projectlifecycle", covers: [A1, A2, A4]}
