schema_version: "1.0"
id: V60-032
title: Refresh stale browser fixture selectors exposed by restored gate coverage
milestone: project-review-v60
priority: P2
status: in_progress
depends_on: [V60-031]
languages: [typescript, markdown]
goal: Restore the required browser fixture assertions without changing product behavior or reducing coverage.
context:
  authority: User requested completion of the remaining V60 reviews; restored V60-031 coverage reproduced these failures.
  design: docs/plans/2026-09-20-project-review.md
  review_task: V60-008
  reproduction: >-
    The isolated 19-case fixture preflight failed three cases: an ambiguous
    Inconclusive text locator, a removed Additional actions menu label, and a
    GPU temperature text expectation. Sixteen cases passed, with zero skips.
scope:
  in:
    - Trace each failed assertion against the delivered UI and prior contract before changing its selector.
    - Correct only confirmed stale browser fixture expectations and retain their original behavioral assertions.
    - Rerun all 19 affected fixture cases and record actual Playwright JSON results.
  out:
    - Change product behavior, weaken assertions, skip tests or claim fixture APIs prove the real backend.
acceptance_criteria:
  - id: A1
    text: Each correction is grounded in the current UI contract and leaves its behavior assertion intact.
  - id: A2
    text: All 19 fixture cases execute successfully with no skipped, unexpected or flaky outcomes.
  - id: A3
    text: The subsequent full affected test-ui-stack gate passes with all seven required browser files executed.
tests:
  - command: node .local/v60-review/v60-031-preflight.mjs after
    covers: [A1, A2]
  - command: make test-ui-stack
    covers: [A3]
verification_requirements:
  - Record failing and passing JSON report hashes, case counts and exact assertion changes.
  - Keep isolated static UI fixture evidence separate from the following full stack gate.
  - Keep implementation and completion metadata commits separate.
