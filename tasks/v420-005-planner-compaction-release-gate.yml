scope:
  in:
  - A registered real-process gate, integrated release verification, final safe evidence and an optional repeatable
    evaluation recipe.
  out:
  - Automatically running live models, choosing a new model/default, deployment, Python SDK upgrade, Worker
    compaction implementation or substantial Scheduler changes.
acceptance_criteria:
- id: A1
  given: Real Server/Runtime/PostgreSQL, controlled Gateway and both modeled Planners
  when: Repeated compaction process scenarios finish
  then: Exact early evidence survives and each Worker effect occurs once under the same Planner/Stage identity.
- id: A2
  given: Per-owner configuration matrix and existing terminal handoff
  when: Admission and continuation scenarios execute
  then: Mutually exclusive local modes are enforced without forbidding independent Worker summarization or
    changing Scheduler transitions.
- id: A3
  given: Faults/cancel/deadline/checkpoint loss near finish
  when: Real process and store scenarios unwind
  then: No false candidate or late work occurs; failure, receipts and recovery match the owning contracts.
- id: A4
  given: Integrated revision with every predecessor test inventory
  when: Full release and contract checks execute
  then: All required cases actually pass, documentation and configuration agree and quality claims are limited
    to measured evidence.
