schema_version: "1.0"
id: V55-009
title: Optionally rank existing scan candidates with an LLM
milestone: scan-tools-followups
priority: P2
status: pending
depends_on: [V55-008]
languages: [go, yaml, markdown]
goal: Improve scan priority selection without giving a model authority to construct arbitrary scanner commands or expand budgets.
context:
  authority: User suggested optional LLM filtering of the highest-priority prepared scans.
  design: docs/plans/2026-09-19-scan-tools.md
scope:
  in:
    - Optional separately budgeted ranker consuming bounded candidate summaries and returning IDs with reasons.
    - Validate selected IDs, duplicates and limits against the persisted deterministic candidate set.
    - Persist model policy and selection provenance; define deterministic fallback on ranking failure.
  out:
    - Model-authored executable commands, new targets or automatic budget expansion.
acceptance_criteria:
  - id: A1
    text: Invalid or out-of-set model selections cannot dispatch a scan and ranking failure follows the documented fallback.
  - id: A2
    text: Disabling ranking requires no model service and preserves the deterministic planner result.
tests:
  - command: go test ./internal/scanplan/... ./internal/planner/...
    covers: [A1, A2]
