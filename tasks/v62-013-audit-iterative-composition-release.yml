  boundary: The completed audit-workflow-composition milestone/V62-012 remains historical evidence for
    the original preparation/scan release. This new milestone gates only V62-005/006/007 and has no dependency
    on V64 or live sitemap/pentest product delivery.
  classification: New verification/release-gate work following the chore template; this introduces no
    intended product behavior and repairs no identified prior defect, so introduced_by is not applicable.
scope:
  in:
  - Add fail-closed PostgreSQL and process gate targets for the generic iterative composition slice and
    register their real tests in the release verification graph.
  - Exercise initial ordinary checks, exact settled-Round assessment, receipt-derived next-Round routing
    and dependency materialization through real production clients and processes.
  - Inject concurrent review/retention/source deletion, lost replies, pause/resume/cancel and bounded
    recovery faults; compare exact provenance and accepted membership.
  - Prove standalone model-free Runs and current deterministic Audit paths bypass iterative optional capabilities
    and preserve their behavior.
  - Record a concise evidence artifact mapping acceptance to nonzero executed cases and the actual revision/environment.
  out:
  - Research hypotheses/generation/ranking, research pre-Round lifecycle (V64-003), pentest proof/replay
    policy (V411-012), attack-tree analysis or live-model quality claims.
  - Rewriting completed V62 tasks, enabling deferred work through a gate or adding placeholder production
    workflows/interfaces only for tests.
  - Changing product behavior or implementing missing prerequisite features in this gate task; fix any
    discovered product defect through its own tracked task.
requirements:
- id: R1
  text: Create make test-audit-iterative-postgres and make test-audit-iterative-e2e as implementation
    deliverables. They require disposable PostgreSQL and actual process prerequisites, fail on unavailable
    mandatory infrastructure/skips/zero matched cases, and participate in the release graph without duplicate
    family execution.
- id: R2
  text: Run a minimum two-Round process fixture through real ArtifactStore, accepted result collection,
    snapshot consumer, finding receipt adapter, exact route and retained-dependency input preparation.
    Runtime/Server assemble accepted structure; scripted model output supplies only bounded fixture judgments.
- id: R3
  text: Assert each original-to-retained-to-consumer ref/digest and exact item/execution/attempt/receipt
    attribution. A model-visible summary or successful Run status alone cannot prove provenance, ownership,
    complete snapshot membership or finding confirmation.
- id: R4
  text: Include real PostgreSQL maximum-cardinality and surrounding-population cases from each prerequisite.
    Use injected clocks, query/work counters and bounded continuation; no wall-clock timing threshold
    substitutes for row/byte/statement limits.
- id: R5
  text: Test source deletion/eviction-hold race, duplicate/lost acknowledgements, competing claims, partial
    snapshot construction, pause/resume and cancellation. Existing receipt/claim/lifecycle mechanisms
    must resolve them with one accepted outcome and no repeated target work.
- id: R6
  text: Current deterministic Audit profiles and direct model-free Runs execute with no snapshot consumer/mapping,
    generator/ranker, hypothesis/cycle state or dummy research requirement. Compare their original membership,
    coverage, retry/cancel and terminal behavior.
- id: R7
  text: Keep exact fixture catalogs under testdata. Any changed public/wire/schema rule includes normal
    generated clients/shared fixtures and required contract gates. No live configs in ordinary tests and
    no live-model quality conclusion from scripted conformance.
failure_outcomes:
- operation: Run the iterative PostgreSQL/process release gate
  permanent: Missing required binary, database, configured infrastructure, invalid fixture or zero matched/skipped
    mandatory test fails the gate with diagnostics; never report pass or silently downgrade to mocks.
  retryable: Individual fault cases exercise finite production retry budgets; the harness does not rerun
    a failing whole suite until green or hide nondeterminism.
  ambiguous: Fault fixtures inspect accepted state and observed request counts after lost responses, using
    the production receipt/intent identities; contradictory evidence fails the gate.
  cancelled: Harness cancels and joins owned Server/Runtime/fixture processes and records incomplete verification;
    no background target work remains.
  timeout: Per-test/process and whole-gate deadlines are distinct and finite; timeouts fail verification
    with cleanup diagnostics, rather than claiming a production terminal result.
cardinality:
- collection: Generic snapshot/dependency/routing matrix
  expected: A small two-Round real-process fixture plus fault and maximum-size PostgreSQL fixtures.
  maximum: All prerequisite contract ceilings, including 4,096 admitted Round items, 100,000 containing
    Audit items, 32-dependency manifests and bounded source descriptor/retention populations where applicable.
  bound: Use production page/transaction limits with deterministic counters; process fixtures need not
    spawn one Runtime/model call per maximum-size metadata row. Do not weaken production bounds to make
    tests cheap.
- collection: Fixture resources and evidence output
  expected: One isolated database/schema and bounded process set per case; a concise acceptance-to-case
    record.
  maximum: Fixed fixture case list, finite per-case deadlines and a bounded evidence document under the
    ordinary repository artifact convention.
  bound: No scanning arbitrary user projects, network targets or live configs. All owned subprocesses
    and temporary resources are joined/released through the harness lifecycle.
lifecycle:
- entity: Gate fixtures, temporary stores/processes and evidence record
  delete: The test harness owns temporary cleanup; fixture data never shares a user/demo database.
  cascade: Stop/join child processes and release schema/files through existing harness cleanup even after
    fault injection. Accepted evidence record remains as repository verification evidence.
  retention: Only bounded redacted metadata is retained; never secrets, environment values or target bodies.
    A cancelled/incomplete gate cannot produce a passing evidence claim.
acceptance_criteria:
- id: A1
  given: A real Server/Runtime and isolated two-Round catalog with an assessment consumer and typed receipt
    plans
  when: The complete iterative journey executes
  then: Every selected result, snapshot, later item and consumer dependency has exact attributable bytes;
    no implicit prior-role/current Project read is used.
- id: A2
  given: Concurrent review edits, source deletion/eviction, lost publication/fork replies and competing
    claims
  when: Production snapshot/admission/materialization recovery executes
  then: Exactly one valid outcome and budget debit survives; unavailable sources are explicit and accepted
    inputs cannot drift or leak foreign/source-prohibited content.
- id: A3
  given: Pause/resume, Audit deadline exhaustion, cancel during collection and populated Audit deletion
  when: Real lifecycle paths execute across both Rounds
  then: Active work drains/joins under existing policy, the deadline pauses admission, accepted evidence
    remains available until proper purge and no orphan holder or child remains.
- id: A4
  given: Prerequisite maximum collections with a large unrelated containing population
  when: The PostgreSQL scale matrix executes
  then: Indexed page/transaction/DescribeExact/retention/purge work remains within its declared row/byte
    bounds; limits fail truthfully without silent truncation.
- id: A5
  given: Standalone model-free Runs and existing deterministic inventory/default-route profiles
  when: The bypass regression matrix executes
  then: Original membership, coverage, retries, cancellation and completion remain correct with zero generation/ranking
    and no hypothesis/cycle requirement.
- id: A6
  given: Missing prerequisites, an intentionally empty test selection and injected harness cancellation
  when: The release targets and release graph are exercised
  then: Every missing/zero/skipped mandatory case fails, all owned processes are joined and only actual
    nonzero execution is recorded as successful evidence.
