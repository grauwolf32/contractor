goal: Prove the generic settled-results, exact cross-Round dependency and typed routing slice through
  actual Server/Runtime execution, recovery and deletion without requiring hypothesis search, pentest
  proof or model ranking.
context:
  authority: User requested planning-only decomposition and revision of unfinished tasks on 2026-10-24;
