test_prerequisites:
- Disposable PostgreSQL is mandatory for store cases. Set CONTRACTOR_TEST_DATABASE_URL; absent or unreachable
  required infrastructure, skipped mandatory cases and zero matched tests fail the dedicated gate.
- Tests use isolated testdata, not the live configs tree. Process cases use actual Server/Runtime and
  scripted local model/provider fixtures; no paid models or live targets are needed.
- Run the complete suites of every touched package. Shared schema changes update every reader, owning
  numbered specifications, limit/error/lifecycle registries and cross-language fixtures in the same implementation
  change.
- The two iterative targets and their nonzero cases are deliverables, not commands that already exist
  or evidence of success. Their release graph registration and prerequisite rejection must be tested.
verification_requirements:
- Map every acceptance criterion to actual executed tests, package/process boundary and exact code revision.
  Report all commands and outcomes, including failures or skips; no implementation_commit until all required
  checks succeed.
- Completed dependency gates are reused rather than reimplemented; their evidence never substitutes for
  this composed production journey and direct deterministic bypass checks.
- Include the V62-005 more-than-128-page scenario with actual ordinary Run-local page reads and one declared
  input mapping; retained manifest existence alone does not prove usable context transport.
