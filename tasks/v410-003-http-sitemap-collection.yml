schema_version: '1.0'
id: V410-003
title: Collect HTTP observations into the live Project sitemap
milestone: project-sitemap-2026-10
epic: http-tools
kind: feature
priority: P1
status: in_progress
depends_on:
- V410-002
languages:
- go
- python
- json
- yaml
- markdown
goal: Collect ordinary opted-in HTTP attempt metadata into the Project sitemap through an isolated best-effort background
  publisher, without adding Run states, collection reports or completeness markers.
context:
  authority: 'User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence. User review on 2026-10-27 supersedes
    generic collection-completeness/status requirements: automatic sitemap updates are best effort and must remain
    isolated from HTTP/scanner outcomes and Run contracts.'
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 3-5 and 7-11, revised by the 2026-10-27 user direction: bounded best-effort collection;
    no generic completeness/status surface.'
  specification:
  - docs/spec/artifacts/project-sitemap.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/tools/http-caido.md
  - docs/spec/execution/worker.md
  - docs/spec/execution/control-plane.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or V61/V62/V64 work.
  code:
  - runtime/src/contractor_runtime/toolsets/http/capture.py
  - runtime/src/contractor_runtime/toolsets/http/tools.py
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/tests/test_http_capture.py
  - runtime/tests/test_http_cookie_session.py
  - runtime/tests/test_http_toolset_lifecycle.py
  - tests/e2e
  reuse: V377-001 already persists target cookies; use its separate target-response/checkpoint outcome precedent without
    changing cookie state, credential handling or the configured model.
scope:
  in:
  - Emit minimal actual-attempt metadata through an optional transport-neutral subscriber. HTTP tools keep transport,
    retry, auth/session and evidence ownership.
  - Use a bounded private allocation-memory batch; never await storage/network I/O from the HTTP subscriber. The batch
    contains no headers or bodies and is never persisted.
  - Publish one versioned keyed request per batch. Go performs safe projection before sitemap identities, receipt
    hashing and Artifact bytes, then coalesces through the existing reducer. Do not add a separate projection RPC
    or a second Python URL/reducer implementation.
  - Flush by count/time and attempt a flush before acquiring a fresh live view and before Server allocation fencing.
    Reads still return committed data when automatic publication fails.
  - Join publisher/timer work during completion/cancellation/release. Log bounded technical failures; loss of the
    final private batch on crash or exhausted publication is accepted.
  out:
  - Changing target transport retry policy, auth/session persistence, model selection or HTTP scope enforcement.
  - Complete request/response archival, selected finding evidence changes or browser/Caido history collection.
  - New Run/Allocation report fields, public collection-state API, generic incomplete-source markers, required automatic-collection
    completion policies or a durable event queue.
  - New receipt journals, retention ownership, cumulative Run publication quotas or a Workflow per request.
requirements:
- id: R1
  text: Collection requires the explicit pinned template/grant permission. Reader selection or an input artifact does
    not activate a writer.
- id: R2
  text: Raw minimal transport metadata and matching secrets exist only in bounded private allocation RAM and the private
    request. Go projects before any sitemap key, receipt digest or persisted content; headers and body values are
    never map input. No raw persistent queue is introduced.
- id: R3
  text: Only actual attempted requests contribute, including physical redirects/retries and negative outcomes. Existing
    HTTP evidence owns request IDs/tags. A Location-only destination is not observed; no exact global traffic count
    is claimed.
- id: R4
  text: Keep one pending and one in-flight batch, each at most 100 attempt rows/256 KiB including matching inputs;
    flush at the owning five-second/count bounds. Go coalesces group/source/context/outcome sets and min/max times.
    Publication has one original three-request/15-second allowance, honoring Retry-After and not multiplying Server-exhausted
    transaction retries.
- id: R5
  text: Automatic persistence failure cannot replace/repeat a target call, fail a successful HTTP/scanner result,
    introduce Run/report states or publish a generic completeness marker. Diagnostics remain technical collector logs.
    Explicit mutations/imports/snapshots report their own operation errors.
- id: R6
  text: Composition owns admission, a bounded pre-fence flush and joined cleanup. A live read attempts its local flush
    and reads committed data; automatic flush failure is not a read failure. Crash/buffer overflow may drop a bounded
    batch. No publisher survives release and no business decision depends on collection completeness.
failure_outcomes:
- operation: HTTP attempt metadata submission and background publication
  permanent: Keep target outcomes unchanged. Drop an inadmissible frame or stop the allocation publisher after a definite
    refusal; log its classified technical cause. Add no Run/report field or generic map marker.
  retryable: Retry only publication/cleanup backpressure inside its original allowance. Server-exhausted transaction
    conflicts receive no new Runtime retry allowance; target policy remains independent.
  ambiguous: Repeat only the identical keyed metadata request inside the remaining allowance. Existing receipt replay
    confirms an original evicted result without another publication; never repeat target traffic.
  cancelled: Join admitted private publication before release; allocation fencing rejects late requests. Dropping
    unsaved metadata is allowed.
  timeout: The publisher owns its deadline; HTTP submission never awaits network/storage. Exhaustion logs and stops
    automatic publication instead of renewing its budget.
- operation: Fresh live read or terminal collector cleanup
  permanent: A failed automatic flush does not prevent reading the committed map. Explicit read authorization/storage
    failures and explicit snapshot/mutation errors retain their normal contracts.
  retryable: Use only the current publication allowance; reads and closure do not renew an exhausted request budget.
  ambiguous: Preserve the original key during admitted retries; accepted Project metadata remains after local cleanup.
  cancelled: Join active timers/publishers through composition cleanup; do not leak work past release.
  timeout: Drop the remaining bounded private batch after joined cleanup and emit technical diagnostics, without changing
    HTTP results or adding collection business state.
cardinality:
- collection: Pending observations and publication batches
  expected: 1-10 Workers coalescing repeated requests into small batches
  maximum: One pending and one in-flight private batch, each at most 100 attempts/256 KiB; at most 2,048 transient
    matching secrets per ingress.
  bound: Batch by count/time; coalesce only in the owning Go reducer, not with Runtime URL hashes. On backpressure
    drop excess metadata with bounded technical logging.
- collection: Attempt outcomes, contexts and omitted metadata
  expected: A few response/auth variants per group
  maximum: Shared group/member/context/provenance bounds
  bound: Aggregate omissions and negative probes; callback/flush processing does no blocking parsing on the event
    loop.
lifecycle:
- entity: HTTP allocation collector and pending batch
  delete: Allocation finalize/abort/release joins and clears the separate collector through composition-owned lifecycle
    hooks. The HTTP Toolset has no sitemap publication or drain responsibility.
  cascade: Cleanup clears private pending metadata; committed Project data remains. No collection state is attached
    to Run lifecycle.
  retention: Selected finding evidence keeps its existing retention; ordinary traffic remains bounded memory-only
    except safe map summaries.
acceptance_criteria:
- id: A1
  given: Selected and unselected HTTP Workers against a controlled local target
  when: They issue GET/POST, redirects, retries, transport failures and timeouts
  then: Only opted-in actual attempts contribute, hop/outcome attribution is correct and no Location-only target becomes
    observed.
- id: A2
  given: Secret canaries in all request locations and repeated contexts
  when: Automatic observation runs without any model recording call
  then: The committed map contains only the safe projection with distinct context keys and bounded diversity.
- id: A3
  given: A target that counts side effects and a store that loses publication responses or rejects writes
  when: A successful request is followed by failed/ambiguous collection, history eviction or cleanup backpressure
  then: HTTP response and target side-effect count stay unchanged; only identical publication is retried. Receipts
    never republish evicted commits and protected refusal remains distinct from cleanup backpressure. No collection
    state/marker is introduced.
- id: A4
  given: Many observations up to pending/batch/publication bounds
  when: A Worker reads the live map and another Run reads committed state
  then: Submission returns while storage is blocked; both batches stay within row/byte bounds. Fresh reads attempt
    their own flush and return committed state, including after automatic refusal. Other Runs see committed batches
    only.
- id: A5
  given: In-flight capture/publication and a Runtime crash/cancel/release
  when: Allocation closure executes through production processes
  then: No publisher survives release and committed Project data remains after Runtime crash. Ordinary Runtime-loss
    handling applies; no sitemap-specific Run status, collection report or generic completeness marker appears.
deliverables:
- path: runtime/src/contractor_runtime/sitemap_collection.py
  description: Composition-owned bounded best-effort publisher behind a transport-neutral subscriber; one private
    batch RPC.
- path: tests/e2e
  description: HTTP collector production-process cases added to the registered sitemap gate, including side-effect-counting
    and failure injection.
