execution:
  branch: codex/v410-sitemap
  claimed_on: '2026-10-26'
  note: Resumed at the user's request after V410-001 and V410-002 were merged into main. Implement this task in dependency
    order; V410-004 through V410-007 remain pending until their own implementation starts.
implementation_decisions:
- date: 2026-10-26
  decision: 'Superseded by the 2026-10-27 review: Automatic sitemap persistence failures are infrastructure status
    for the Run owner, not an extra model-visible HTTP result field. The user questioned the purpose of exposing these
    failures to the Worker; deterministic collection code owns recovery and required-completion checks. Explicit sitemap
    tools retain truthful operation failures. HTTP target traffic must never repeat to recover collection.'
- date: 2026-10-26
  decision: HTTP tools and scanner execution do not depend on sitemap. Allocation composition wires an optional, narrow
    observation subscriber; the separate collector owns buffering, projection, persistence and drain. Subscriber failure
    cannot change target transport outcomes. Scanner imports consume exact structured reports independently. Verify
    subscriber failure isolation through the real capture path.
- date: 2026-10-26
  decision: Process verification exposed that the existing opaque-token heuristic classified three-label DNS names
    and IPv4 origins as JWTs. Apply host heuristics per label and known-secret matching across the original complete
    host before canonicalization. Paths retain the existing conservative token heuristic. This repairs the shared
    projector used by all ingress siblings and is covered by HTTP collection real-store/process regressions.
- date: 2026-10-26
  decision: 'Superseded by the 2026-10-27 review: Safe projection is a stateless bounded Server RPC before Runtime
    pending admission, reusing the single Go URL/context/structural implementation. This adds bounded metadata latency
    while HTTP still owns its capture; it introduces no raw pending queue or second projector. HTTP-tools owns the
    cost and reopens placement if measured throughput requires it. Buffering, publication, explicit-read barriers
    and closure remain collector/composition responsibilities.'
- date: 2026-10-26
  decision: Real Server/Runtime verification established that Server finalization fences writes before Runtime finalize.
    Drain therefore runs in the infrastructure invocation-completion checkpoint before the Worker result is returned.
    Finalize/abort/release close and join the collector, dropping unsaved private metadata with technical logging; they do not bypass
    fencing. No required-collection failure policy is introduced in this task.
- date: 2026-10-27
  decision: A pending publication keeps one original 15-second deadline and at most three keyed HTTP requests through
    cancellation and drain. A Server-exhausted transaction conflict receives no new Runtime transaction retry budget.
    Cleanup retries honor Retry-After. Definite refusal or exhausted acknowledgement/retry allowance disables automatic
    publication for the allocation and logs the technical cause; later reads and closure cannot silently renew
    it.
- date: '2026-10-27'
  decision: No consumer or decision uses automatic collection completeness. Remove the draft sitemapCollection/unconfirmedItems/pendingLossPossible
    report/API extension and generic loss markers. Keep only bounded private buffers, keyed publication recovery,
    technical logs and joined lifecycle. Automatic flush does not make reads fail. Replace per-exchange projection
    plus publication RPCs with one background batch request; Go owns projection and coalescing before persistence.
