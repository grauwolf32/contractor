schema_version: '1.0'
id: V410-003
title: Collect HTTP observations into the live Project sitemap
milestone: project-sitemap-2026-10
epic: http-tools
kind: feature
priority: P1
status: pending
depends_on:
- V410-002
languages:
- go
- python
- yaml
- markdown
goal: Make ordinary selected HTTP tools contribute safe research metadata automatically while preserving target-call
  outcomes and allocation cleanup guarantees.
context:
  authority: User requested an implementation task breakdown of the reviewed proposals 0033 and 0042 on 2026-10-24;
    this task records planned work, not implementation or verification evidence.
  proposal: docs/proposals/0042-live-project-sitemap.md
  proposal_sections: 'Sections 3-5 and 7-11: safe attempted-request observations, bounded batching, publication
    failures and collection status.'
  specification:
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/artifacts/projects.md
  - docs/spec/artifacts/retention-and-deletion.md
  - docs/spec/platform/persistence.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  - docs/spec/tools/http-caido.md
  - docs/spec/execution/worker.md
  - docs/spec/execution/control-plane.md
  boundary: The live sitemap is shared research context, not current Audit coverage, complete traffic archival or
    proof. The HTTP/OpenAPI first slice has no dependency on proposal 0033 implementation or deferred V61/V62/V64
    work.
  code:
  - runtime/src/contractor_runtime/toolsets/http/capture.py
  - runtime/src/contractor_runtime/toolsets/http/tools.py
  - runtime/src/contractor_runtime/toolsets/common
  - runtime/tests/test_http_capture.py
  - runtime/tests/test_http_cookie_session.py
  - runtime/tests/test_http_toolset_lifecycle.py
  - tests/e2e
  reuse: V377-001 already persists target cookies; use its separate target-response/checkpoint outcome precedent
    without changing cookie state, credential handling or the configured model.
scope:
  in:
  - Observe actual attempted requests before buffer eviction, available responses/failures and each redirect/retry
    hop through the existing HTTP capture boundary.
  - Feed safe typed observations and Run-scoped identity/session provenance into the common collector; no model
    recording call is required.
  - Coalesce batches by group, flush by declared count/time bounds and flush the caller before its live sitemap
    read.
  - Join flushes at completion/cancellation/release; record incomplete source collection after crash, quota exhaustion,
    conflict retry exhaustion or lost pending batch.
  - Expose target outcome and collection outcome separately; an explicitly required collection can fail only at
    its declared completion boundary.
  out:
  - Changing target transport retry policy, auth/session persistence, model selection or HTTP scope enforcement.
  - Complete request/response archival, selected finding evidence changes or browser/Caido history collection.
requirements:
- id: R1
  text: Collection is explicitly opted in by template/grant; HTTP readers or an input artifact alone do not activate
    it.
- id: R2
  text: Safe projection precedes identity, buffer persistence and publication; URL/query/body/header/structural
    value canaries are absent from map bytes and correlation keys. A timeout is an attempt, not a received response.
- id: R3
  text: A Location header does not establish a visited endpoint; redirects and retries are distinct observed physical
    attempts with existing request tags where available.
- id: R4
  text: Use proposal section 10 batch limits and bounded flush count/time settings from the owning registry. Repeated
    observations use set membership/min-max summaries instead of unbounded event storage or exact global traffic
    counters.
- id: R5
  text: A map write failure cannot replace a valid HTTP response with target failure or resend target traffic. Receipt/unknown
    acknowledgements reconcile only publication.
- id: R6
  text: Completion/cancellation/release joins the collector and fences publication; on Runtime crash, Run closure/collection
    status truthfully reports the bounded pending loss without claiming zero-loss capture.
failure_outcomes:
- operation: HTTP target call followed by collection submission/flush
  permanent: Preserve the real target outcome; invalid projection, quota exhaustion or collection denial is a separate
    permanent sitemap outcome. Invalid unsent requests create no successful observation.
  retryable: Only sitemap storage retries use the reducer budget; target retries remain governed solely by existing
    HTTP policy.
  ambiguous: Reconcile the same publication receipt; never resend the target request to recover metadata.
  cancelled: Join target/capture/collector work before release and mark unsaved metadata incomplete.
  timeout: HTTP request and sitemap flush have separate owning deadlines; flush cannot extend target permission
    or turn a timeout into a response.
- operation: Read barrier or terminal collector drain
  permanent: Return/report a collection gap when flushing is permanently rejected; required completion policy may
    fail without rewriting HTTP data.
  retryable: Retry storage only within the remaining flush/closure allowance.
  ambiguous: Query accepted receipt/revision when publication acknowledgement is lost.
  cancelled: Closure joins publisher work; fenced allocation cannot complete a late write.
  timeout: Exhausted drain allowance records bounded loss/incomplete status and releases only after local work is
    joined.
cardinality:
- collection: Pending observations and publication batches
  expected: 1-10 Workers coalescing repeated requests into small batches
  maximum: Batch rows/bytes and per-Run publication quotas from proposal section 10; one explicitly bounded pending
    buffer per allocation
  bound: Flush at count/time limits and never retain one unbounded queue item per target request.
- collection: Attempt outcomes, contexts and omitted metadata
  expected: A few response/auth variants per group
  maximum: Shared group/member/context/provenance bounds
  bound: Aggregate omissions and negative probes; callback/flush processing does no blocking parsing on the event
    loop.
lifecycle:
- entity: HTTP allocation collector and pending batch
  delete: HTTP finalize/abort/release joins and clears the collector.
  cascade: Session cleanup removes allocation-memory observations; committed Project metadata remains.
  retention: Selected finding evidence keeps its existing retention; ordinary traffic remains bounded memory-only
    except safe map summaries.
acceptance_criteria:
- id: A1
  given: Selected and unselected HTTP Workers against a controlled local target
  when: They issue GET/POST, redirects, retries, transport failures and timeouts
  then: Only opted-in actual attempts contribute, hop/outcome attribution is correct and no Location-only target
    becomes observed.
- id: A2
  given: Secret canaries in all request locations and repeated contexts
  when: Automatic observation runs without any model recording call
  then: The committed map contains only the safe projection with distinct context keys and bounded diversity.
- id: A3
  given: A target that counts side effects and a store that loses publication responses or rejects writes
  when: A successful request is followed by failed/ambiguous collection
  then: Its HTTP response remains available, the target count does not increase and the collector reconciles or
    reports a separate gap.
- id: A4
  given: Many observations up to pending/batch/publication bounds
  when: A Worker reads the live map and another Run reads committed state
  then: The caller first flushes bounded pending data, another Run sees only committed batches and limit exhaustion
    is explicit.
- id: A5
  given: In-flight capture/publication and a Runtime crash/cancel/release
  when: Allocation closure executes through production processes
  then: No publisher survives release, committed data remains and bounded pending loss is reported by collection
    status.
deliverables:
- path: runtime/src/contractor_runtime/toolsets/common
  description: Joined bounded collector integration shared without sibling Toolset imports.
- path: tests/e2e
  description: HTTP collector production-process cases added to the registered sitemap gate, including side-effect-counting
    and failure injection.
tests:
- command: uv run --project runtime pytest runtime/tests/test_http_*.py runtime/tests/test_sitemap_*.py
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-http-caido-e2e
  covers:
  - A1
  - A3
  - A5
- command: make test-project-sitemap-tools-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
- command: make test-project-sitemap-postgres
  covers:
  - A3
  - A4
  - A5
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
test_prerequisites:
- Use injected clocks for flush budgets; local HTTP fixtures and real Server/Runtime/PostgreSQL provide process
  evidence, with mandatory collector cases registered in the gate manifest.
