  severity: low
  finding: "Found while fixing V302-001: plan reads still fetch the whole document (about 0.9 ms per read, about 100 ms per tick at 1,000 members); a SHA-plus-setup read takes 0.08 ms and would serve Admit, insertRecord and collectMember. PlanResource still validates small documents on every read."
scope:
