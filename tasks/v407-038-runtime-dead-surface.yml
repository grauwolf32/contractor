schema_version: '1.0'
id: V407-038
title: Move the shared filesystem tool error type into toolsets.common
milestone: server-runtime-review-2026-10
epic: quality
kind: chore
priority: P3
status: pending
depends_on: []
languages:
- python
goal: Remove the filesystem toolset dependency used only for its shared error class while retaining all
  selectable tool capabilities and their contracts.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  finding: runtime/src/contractor_runtime/toolsets/edit_files/tools.py:23 and workspace_changes/tools.py:32
    import FilesystemToolError from filesystem/tools.py:64-69. runtime/pyproject.toml:153-159,211-224
    explicitly permits that existing shared-type chain, so this is a removable architectural exception
    rather than an undiscovered layer violation. read_openapi_document remains a supported selectable
    tool via openapi/tools.py:178-180, internal/config/resolved/descriptors.go:220 and api/testdata/toolset-descriptors.json:115;
    openapi/tools.py:191 also names it in CAS reconciliation guidance. Absence from shipped configs alone
    does not justify deleting its API or requiring every export to appear in a shipped manifest.
  validation: 'Cleanup only on dc7012e8: edit_files and workspace_changes both import FilesystemToolError.
    read_openapi_document has no shipped-template selection but is registered and custom-selectable, and
    CAS recovery guidance names it; this is not evidence of unreachable production code.'
  siblings: FilesystemToolError definition and imports in filesystem, edit_files, workspace_changes and
    their tests; import-linter layer and protected-chain declarations. Other declared chains, especially
    taint_annotations -> code_analysis, are independent.
plan:
- Move the unchanged FilesystemToolError implementation to a focused module under toolsets.common and
  update all production/test imports, including workspace_changes. Do not keep a compatibility re-export
  at the old filesystem path.
- Reclassify filesystem as an independent concrete toolset once both consumers use common; delete only
  the now-unneeded filesystem protected-chain contract and its comments. Preserve exhaustive layer checks
  and the separate code-analysis chain.
- Keep exception codes, messages and existing non-retryable callback behavior unchanged. Use existing
  filesystem/edit/change tool suites and import-linter to verify the relocation.
- Retain read_openapi_document, its selection registration, descriptor/fixture and reconciliation guidance
  exactly as they are. Do not introduce an every-export-must-be-shipped gate or delete tool tests as part
  of this shared-type refactor.
scope:
  in:
  - Shared error-type relocation; both consumer imports; removal of the obsolete filesystem import-linter
    exception.
  out:
  - Removing or wiring read_openapi_document, changing its 256-KiB full-read limit, adding pagination,
    editing tool descriptors or changing selectable capabilities.
  - A gate that equates absence from shipped manifests with dead code.
  - Filesystem error classification changes or changes to other declared toolset chains.
acceptance_criteria:
- id: A1
  text: FilesystemToolError has one definition under toolsets.common; filesystem, edit_files and workspace_changes
    import it without cross-toolset dependencies or compatibility re-exports. Import-linter no longer
    needs the filesystem protected chain.
- id: A2
  text: Existing filesystem/edit/change behavior, error codes/messages, retryability and test outcomes
    are unchanged except for import paths. The separate code-analysis chain and exhaustive layer enforcement
    remain valid.
- id: A3
  text: read_openapi_document remains selectable with its current schema, descriptor and CAS guidance;
    no tool deletion or shipped-selection policy is introduced.
tests:
- command: cd runtime && uv run --locked pytest -q tests/test_filesystem_toolset.py tests/test_edit_files_toolset.py
    tests/test_workspace_changes_toolset.py tests/test_openapi_toolset.py
  covers:
  - A1
  - A2
  - A3
- command: make lint
  covers:
  - A1
  - A2
  - A3
