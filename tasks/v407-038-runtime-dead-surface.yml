  - "Add a test (runtime/tests) that every tool name exported by a toolset is referenced by at least one manifest fixture in runtime/tests/testdata or by the shipped catalog validation (contractor server config validate), so unselected tools are caught (new file runtime/tests/test_tool_selection.py)."
scope:
  in:
    - "Dead tool removal or wiring, exception relocation, selection gate."
  out:
    - "Other openapi tools."
acceptance_criteria:
