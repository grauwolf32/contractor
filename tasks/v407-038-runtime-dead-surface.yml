    text: "No toolset exports a tool that no manifest selects (gate passes); import-linter has no edit_files -> filesystem chain."
  - id: A2
    text: "Existing toolset tests pass unchanged except for the moved symbol; contractor server config validate --root ./configs passes."
tests:
  - command: "cd runtime && uv run --locked pytest -q tests/test_openapi_toolset.py tests/test_edit_files_toolset.py tests/test_tool_selection.py"
