priority: P3
status: pending
depends_on: []
languages: [python]
goal: "Every shipped Runtime tool is selected by a manifest, and toolsets share code only through toolsets.common."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding G15; file:line as of 39d89438, re-verify on main"
  finding: >-
    read_openapi_document is selected by no manifest under configs/ (grep: 0
