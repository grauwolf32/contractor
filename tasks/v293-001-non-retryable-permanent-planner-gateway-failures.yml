schema_version: '1.0'
id: V293-001
title: Report permanent Planner Gateway failures as non-retryable
milestone: review-defects-2026-10-04
priority: P1
status: completed
implementation_commit: 077810e66f70947872edbdb9d6814bd2d5dcfed9
depends_on: []
languages: [go, typescript]
goal: Stop Stage retry policies from repeating deterministic Planner Gateway failures.
context:
  review: docs/research/2026-10-04-code-review.md
  severity: medium
  finding: "gatewayrecovery.Classify marks 401/403, other 4xx and permanent codes such as context_length_exceeded and insufficient_quota non-retryable, but Participant.Do turns that result into an untyped fmt.Errorf (internal/gatewayrecovery/http.go:57-58) and OnModelErrorCallbacks (internal/planner/streamline/planner.go:308-314) maps every error that is not gatewayResponseRejected to providerFailure(): planner_gateway_unavailable with Retryable=true (state.go:117-123). buildProgression (internal/scheduler/stage_finalization.go:246-251) retries while retryable, so a revoked credential or an over-long prompt repeats up to MaxAttempts. The non-recovery status path (streamline/gateway.go:89-91) has the same flaw. This contradicts spec 04 ('401/403 and every other 4xx are permanent')."
scope:
  in:
    - Return a typed error carrying gatewayrecovery.Failure from Participant.Do.
    - Classify the non-recovery path with Classify, or delete it if production never uses it.
    - Map non-retryable failures to the non-retryable Planner code planner_gateway_rejected and document it (the UI triage label is added by V307-001).
    - Tests through the production Recovery participant.
  out:
    - Changing retry behaviour for retryable failures (429, 5xx, transport).
acceptance_criteria:
  - {id: A1, text: "HTTP 401 and a 400 with context_length_exceeded end the Stage non-retryable with planner_gateway_rejected."}
  - {id: A2, text: "Retryable failures still retry."}
  - {id: A3, text: "Spec 04 and the Planner error table list the new code."}
tests:
  - {command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/planner/... ./internal/gatewayrecovery ./internal/scheduler -run 'Gateway|Planner|Recovery'", covers: [A1, A2, A3]}
  - {command: "make lint", covers: [A1, A2, A3]}
