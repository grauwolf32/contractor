schema_version: "1.0"
id: V425-029
title: Replace mechanical PostgreSQL slice collection with pgx collectors
milestone: hub-audit-defects-2026-10
epic: quality
kind: chore
priority: P3
status: in_progress
depends_on: [V425-027]
languages: [go]
goal: Delete repeated row iteration and cleanup without changing SQL, domain validation or public read behavior.
context:
  authority: "User decision 2026-10-31: implement research item 2 using pgx.CollectRows after merging the shared PostgreSQL test harness."
  finding: >-
    Mechanical scan-and-append loops recur in internal/artifacts/postgres_query.go:60,
    internal/runstore/stage_store.go:105 and internal/auditstore/internal/pgstore/read.go:88,
    with siblings in the other row-to-slice repository reads. The patterns span historical
    work, including uncatalogued commit 36159d30721db8f99fde7bd9fe0fd0ed2f7ec288;
    no single introducing task is established for this cross-repository cleanup.
  boundary: >-
    Use the existing pinned pgx/v5 collectors directly. Existing row decoders keep all
    validation and projection responsibilities. CollectRows serves ordinary non-nil slices;
    AppendRows preserves nil slices or explicit preallocation. Query text, limits, ordering,
    authorization and transaction boundaries remain unchanged. Method-level error context may
    replace separate scan/iterate labels while preserving errors.Is/As, SQLSTATE classification,
    safe database errors and public error codes. No new collector wrapper, ORM or dependency.
  selection: >-
    Review every production rows.Next loop. Convert mechanical slice collection only when it
    gets smaller and has the same success/error output shape. Retain map/grouping loops, streaming
    row/byte budgets, early stop, mutations and any path returning partial rows on iteration failure.
scope:
  in:
    - Equivalent slice reads in artifacts, runstore, auditstore/internal/pgstore, runtimeconfig, credentials, projectstore, agentprincipal, telemetry, findingintake and evalstore.
    - Real PostgreSQL regressions for empty/order/look-ahead results, strict decoder rejection and connection reuse after failure/cancellation.
    - Record the converted and retained classes and net handwritten Go reduction in the local research and task.
  out:
    - SQL, table ownership, migrations, pagination bounds, retry/claim semantics or API changes.
    - RowToStruct replacements that bypass existing decoders; new generic abstractions; other research items.
acceptance_criteria:
  - id: A1
    text: Converted reads use pgx collectors directly, remove more handwritten Go than they add, and keep their existing SQL and decoder validation.
  - id: A2
    text: Successful empty/nil slices, ordering, look-ahead rows, row limits, post-read checks and classified errors remain equivalent; retained loop classes are documented.
  - id: A3
    text: Real PostgreSQL tests exercise collector behavior and connection reuse after decoder failure/cancellation, including a one-connection pool.
  - id: A4
    text: Full suites of all changed packages pass with PostgreSQL configured, and make lint passes.
tests:
  - command: CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -tags=integration -count=1 -p=2 ./internal/artifacts ./internal/runstore ./internal/auditstore/internal/pgstore ./internal/runtimeconfig ./internal/credentials ./internal/projectstore ./internal/agentprincipal ./internal/telemetry ./internal/findingintake ./internal/evalstore
    covers: [A1, A2, A3, A4]
  - command: make lint
    covers: [A1, A2, A4]
implementation_notes:
  - >-
    Replaced 33 loops in 18 production files across the ten scoped packages. Existing
    SQL/raw literals and row decoders are unchanged. Production Go shrank by 207 lines;
    113 lines of real-store regressions leave a net reduction of 94 Go lines.
  - >-
    Reviewed the original 133 production iteration loops. The 100 retained loops build
    maps/groups/aggregates (32), enforce streaming/budget/filter or mutation sequencing
    (18), expose partial results on iteration errors (20), perform bounded projections
    or validation (6), use inline projections where callbacks add scaffolding (17),
    or belong to other owners such as migrations and metrics (7). The local research
    folder holds the per-loop review, source snapshots and verification logs.
  - >-
    The Project regression exercises the maximum 201-row look-ahead page, a deterministic
    timestamp tie-breaker, continuation, strict rejection after a full page of valid rows,
    cancellation identity and reuse of a one-connection pool. Stage read regressions hold
    nil history/unreleased lists and the non-nil empty terminal-recovery list to their
    existing shapes. No API, schema, dependency or transaction boundary changed.
