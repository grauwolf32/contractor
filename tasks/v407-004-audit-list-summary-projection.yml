schema_version: '1.0'
id: V407-004
title: Batch preparing Audit list hydration without changing the response contract
milestone: server-runtime-review-2026-10
epic: audits
kind: chore
introduced_by: V25-004
priority: P2
status: pending
depends_on: []
languages:
- go
goal: Hydrate preparation fields for an Audit page with bounded set reads while preserving the complete
  existing list response and revision fences.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/api/public-api.md
  validation: Revalidated against main dc7012e8 on 2026-10-23. N+1 preparation hydration is confirmed.
    The claimed per-row inventory payload downloads are disproved by mutually exclusive phase guards;
    no such download needs fixing.
  finding: internal/httpapi/public/audit_handlers.go:275-280 calls auditDetailReadModel for each preparing
    or inventory-phase Audit. That helper decodes the profile and calls Preparation, GeneratedInventory
    and Get (audit_preparation.go:20-28,46). Preparation performs Get, role/execution reads and a revision
    check (auditservice/preparation.go:20-28,58), so a 200-row preparing page incurs repeated store calls.
    GeneratedInventory already returns nil for phase != rounds before any inventory link/payload read
    (generated_inventory.go:36-47); the list never enters that payload-reading phase. Non-preparing list
    rows already use auditReadModel directly. The opportunity is batched preparation projection, not removal
    of required fields or creation of a narrower incompatible AuditSummary response.
  siblings: Both owner and project lists share this path. Keep GET /v1/audits/{id} detail behavior and
    the existing GeneratedInventory phase guard. Preserve preparation status/output descriptors and every
    currently exposed list field.
plan:
- Capture deterministic statement counts and response fixtures for mixed pages and 200 preparing Audits,
  including bounded preparation roles/attempts and retained output descriptors.
- Add a bounded page hydration reader keyed by the listed Audit IDs and revisions. Retrieve role/execution
  data set-wise, retain owner/project authorization and stale-revision detection, and bound both rows
  and bytes using the enclosing page and per-Audit contracts.
- Use the batched hydration result in the existing list response model. Preserve field presence, preparation
  statuses, output descriptors, pagination and all currently absent GeneratedInventory values; leave detail
  GET behavior unchanged.
- Prove constant set-query counts per allowed page/batch with a PostgreSQL tracer and compare full responses
  with baseline fixtures. Exercise concurrent revision changes and unavailable storage without silently
  returning mixed revisions.
- Keep OpenAPI and generated clients unchanged if the response contract is unchanged. Run public API and
  UI verification to prove compatibility; any necessary schema edit must be additive and generated normally.
scope:
  in:
  - Batched hydration of existing preparation fields for owner/project Audit lists.
  - Real-store statement counts, response parity and revision-conflict coverage at the maximum page size.
  out:
  - Replacing existing list items with a narrower public summary shape or dropping optional fields that
    current callers receive.
  - Claiming or fixing inventory payload downloads on the list path, which already avoids them.
  - Changing detail GET, public pagination limits, stale-revision semantics or UI vocabulary.
acceptance_criteria:
- id: A1
  text: A 200-row preparing page hydrates required preparation data through a documented fixed number
    of set queries per bounded batch rather than per-row service calls; the deterministic count test improves
    on the recorded baseline.
- id: A2
  text: Full owner/project list response fixtures preserve every existing field and preparation output/status,
    pagination and authorization behavior for mixed phases. GeneratedInventory remains absent where the
    current phase guard returns nil.
- id: A3
  text: Revision races produce the existing conflict outcome, and transient storage errors retain their
    classification; the page does not combine incompatible revisions or exceed documented row/byte bounds.
- id: A4
  text: Public API verification and the UI suite pass without a narrowing contract change; detail GET
    behavior and its inventory reads remain unchanged.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/httpapi/public/...
    ./internal/auditservice/... ./internal/auditstore/...
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api
  covers:
  - A2
  - A4
- command: make ui-verify
  covers:
  - A2
  - A4
- command: make lint
  covers:
  - A1
  - A2
  - A3
  - A4
