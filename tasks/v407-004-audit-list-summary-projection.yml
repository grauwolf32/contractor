schema_version: "1.0"
id: V407-004
title: "Serve Audit list pages from a summary projection instead of a per-row detail read model"
milestone: server-runtime-review-2026-10
epic: audits
kind: defect
introduced_by: V25-004
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "A page of Audits costs a bounded number of statements regardless of how many Audits are preparing."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding B4; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/api/public-api.md
  severity: medium
  finding: >-
    internal/httpapi/public/audit_handlers.go:245-251 listProjectAudits and
    listOwnerAudits call auditDetailReadModel for every page item;
    audit_preparation.go:12-50 then decodes the profile snapshot and calls
    Preparation (Get + ListPreparationRoles + ListPreparationExecutions),
    GeneratedInventory (Get + GetArtifactLink + ReadExact of the inventory
    payload up to MaxSnapshotBytes) and a final Audits.Get for every Audit in
    the preparing or inventory phase. A 200-row page can issue about 1200
    statements and 200 payload reads. audit_pagination_postgres_test.go tests
    200 rows only for provenance.
  siblings: >-
    getAudit keeps the detail read model. Eval list pages read FrozenPlan per
    row (V407-029). Check listOwnerAudits and any UI-facing list that embeds
    preparation status.
plan:
  - "Define the list item projection in the OpenAPI document (AuditSummary): state, phase, counts and the preparation status fields the UI actually renders (check ui/src/routes/projects for the fields used); keep the detail shape on GET /v1/audits/{id}."
  - "Add a store reader that returns the summary for a page of audit IDs in one statement (join preparation role and execution counts; no inventory payload read)."
  - "Switch listProjectAudits and listOwnerAudits to the summary projection; run make verify-public-api and regenerate ui/src/api/generated and internal/publicclient/generated."
  - "Add a PostgreSQL pagination test with 200 preparing Audits asserting the statement count via the store seam or a pgx tracer, and a UI test that the list still renders the preparation status."
scope:
  in:
    - "Summary projection for Audit list pages, OpenAPI change (additive), generated clients, UI adaptation if a field name changes."
    - "Realistic-size PostgreSQL test with statement counting."
  out:
    - "The detail read model for a single Audit."
acceptance_criteria:
  - id: A1
    text: "A 200-row page of preparing Audits issues a fixed number of statements (at most 5) and reads no inventory payload."
  - id: A2
    text: "The public API change is additive and make verify-public-api passes; the UI project Audit list shows the same preparation status as before."
  - id: A3
    text: "The statement-count test fails on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/httpapi/public/... ./internal/auditservice/... ./internal/auditstore/..."
    covers: [A1, A3]
  - command: make verify-public-api
    covers: [A2]
  - command: make ui-verify
    covers: [A2]
  - command: make lint
    covers: [A1, A2]
