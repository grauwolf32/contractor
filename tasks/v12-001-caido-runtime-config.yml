schema_version: "1.0"
id: V12-001
title: Add label-driven Caido Runtime configuration contracts
milestone: http-caido-tools-mvp
priority: P0
status: complete
implementation_commit: 82ff8ffbcec5393c7b2a94d5e943509033367713
depends_on: [V11-012]
languages: [go, python, sql]

goal: >-
  Add one atomic worker.caido RuntimeConfig field, caido-bearer@1 credential
  kind and caido-graphql@1 private adapter setting so labels can retarget Caido
  without exposing endpoint or token to AgentTemplate/model input.

context:
  shape: >-
    caido has adapter caido-graphql@1, http/https endpoint without userinfo/query/
    fragment, optional credential ID, optional PEM CA bundle and timeout 1..120.
    null clears the whole field. Credential absence means guest access.

scope:
  in:
    - Extend strict RuntimeConfig normalization/canonicalization, atomic merge, origins, snapshots and database validation.
    - Extend runtime credential CRUD allowlists with caido-bearer@1.
    - Resolve endpoint/token/CA/timeout into RuntimeSettings and safe provenance.
    - Add caido-graphql@1 to RuntimeAdapter refs, registration capability and redacted Go/Python private fixtures.
    - Extend Operations/public OpenAPI projections with safe config/origin/required-adapter metadata only.
    - Add migration coverage for retained RuntimeConfig documents and allocation snapshots.
  out:
    - Runtime HTTP client, Toolset descriptors or Caido GraphQL operations.

requirements:
  - {id: R1, text: Token bytes exist only in encrypted credential storage and secret-bearing private settings.}
  - {id: R2, text: Default then Run then Agent label precedence treats caido as one indivisible field.}
  - {id: R3, text: Existing configs and allocations without caido remain valid and byte-compatible where required.}

acceptance_criteria:
  - {id: A1, given: Default/Run/Agent Caido configs including clear, when: Resolver runs, then: Highest complete field wins with exact safe origin/provenance.}
  - {id: A2, given: Wrong credential kind, bad endpoint/PEM/timeout or duplicate/unknown field, when: Publish/resolve/decode runs, then: It fails without leaking values.}
  - {id: A3, given: Secret canaries, when: APIs/logs/fmt/JSON safe projections are scanned, then: Only the private allocation payload contains token bytes.}

tests:
  - {name: runtime-config, command: "go test ./internal/runtimeconfig ./internal/contracts ./internal/httpapi/public", covers: [A1, A2, A3]}
  - {name: python-contracts, command: "cd runtime && uv run pytest tests/test_private_contracts.py tests/test_contracts.py", covers: [A2, A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
