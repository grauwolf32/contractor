schema_version: "1.0"
id: V497-001
title: Validate a source Finding against the Project target through an ordinary Run
milestone: finding-validation-retest-2026-11
epic: findings
kind: feature
priority: P1
status: pending
depends_on: [V497-006]
languages: [go, python, typescript, yaml, json, markdown]
goal: >-
  Let the owner select one existing source Finding and obtain a bounded HTTP
  validation result with exact evidence in that same Finding's history.
demonstration: >-
  Through real Server, PostgreSQL and Runtime processes, a source Worker emits
  an evidenced Finding, the public API launches its HTTP validation against a
  controlled vulnerable application, and the public history/evidence readers
  return the accepted result without creating an Audit or another Finding.
  A scripted Gateway controls judgments but not HTTP, persistence or collection.
context:
  authority: >-
    User decision 2026-11-28: add Finding retest and validation, record the
    proposal and tasks, and make sources Finding -> target validation -> retest
    after a fix the first scenario. This task decomposition and narrow common
    completion extension are agent proposals implementing that direction;
    planning does not claim implementation or authorize live checks.
    Later user instruction on the same date: keep changes maximally compact,
    reuse existing mechanisms or generalize them, and add code only when necessary.
  reassessment:
    baseline: d4b8c5112fef383a47ce3aae9abc1094e346c2e5
    verdict: Still needed; existing components do not admit a finding-bound ordinary completion.
    required_boundary: >-
      The audit-managed restriction also exists in the workflow_runs CHECK and
      Scheduler. auditservice.RecordJudgments requires AuditExecution/Task,
      AuditScope, generations and budgets. This is a narrow ownership extension
      with a required schema-contract update, not just a template change.
    reuse: >-
      Existing Run create/replay, WorkerCompletion interface, deterministic
      collector/publisher, Artifact CAS/retention, finding source/history reader
      and multiple HTTP evidence. Audit task orchestration/budgets remain with Audit.
  implementation_investigation_2026_11_28:
    authority: User assigns implementation with compact reuse and real-component checks; AGENTS.md 4.1 requires a separate unforeseen prerequisite.
    outcome: Common completion ownership is not yet a reusable ordinary-Run capability. V497-006 now owns that prerequisite; this task returns/remains pending until it completes.
    scope_split: V497-006 generalizes common acceptance/receipts/retention and strict authority. V497-001 then delivers ordinary public launch, exact source selection, configured target/profile and the source-to-HTTP demonstration.
    code_status: A small exploratory launch/pin draft compiled but was withdrawn from the implementation worktree; it did not preserve the full acceptance path and is not an implementation or test pass.
  proposal: docs/proposals/0059-finding-validation-and-retest.md
  specification:
    - docs/spec/findings/findings.md#FND-R209
    - docs/spec/findings/findings.md#FND-R213
    - docs/spec/findings/findings.md#FND-R226
    - docs/spec/audits/common-contract.md#ACT-R4
    - docs/spec/audits/worker-completion.md#AWC-R127
    - docs/spec/artifacts/projects.md#PRJ-R80
    - docs/spec/platform/persistence.md#PER-R24
    - docs/spec/execution/scheduler.md
  current_gap: >-
    internal/runservice/audit_completion.go resolves a completion target through
    an Audit binding; internal/runstore/audit_completion.go only writes it for
    audit-managed Runs; Runtime audit_results collector persists through Audit
    judgments. Merely adding audit-results tools to an ordinary Workflow cannot
    deliver this feature. Direct historical verification retention is also
    currently reached through Audit collection.
  boundary: >-
    Finding service owns exact selection and association with an existing
    Finding/source. RunService and Scheduler own the ordinary Run, immutable
    completion pin and finalization. Extend the existing Runtime collector and
    judgment persistence for this concrete caller, preserving the Audit caller;
    HTTP interpretation stays in Runtime adapters. Reuse Artifact and source
    history retention. A synthetic one-task Audit is simpler but adds artificial
    lifecycle; a Markdown-only Run lacks accepted result semantics. Neither is
    selected. Reopen if the extension needs a new controller or broad Audit redesign.
scope:
  in:
    - One owner-authorized public launch of one source receipt/Finding revision against the current Project HTTP target.
    - A minimal shipped versioned HTTP validation Workflow/AgentTemplate, one passthrough Worker, and configured Project model selection.
    - Integrate the V497-006 common completion and acknowledged judgment/evidence mechanism with the concrete public Finding launch caller; do not repeat its ownership refactor.
    - Trusted finding-bound Run provenance, retained result/history reads and source/Run deletion behavior.
    - Owning specifications, limits/failure/lifecycle registries, OpenAPI, generated clients and shared Go/Python fixtures.
    - A real-component source-to-target process fixture registered in the existing findings gate and completion matrix.
  out:
    - HTTP retest and comparison, owned by V497-002; interactive UI, owned by V497-003.
    - Source validation, universal scanner retest, batch selection, automatic method selection or automatic Finding assessment edits.
    - New queue/controller/receipt store, synthetic Audit/Task, parallel result assembler or a model-authored final structured package.
requirements:
  - id: R1
    text: >-
      Launch pins exactly one authorized active-Project Finding ID/revision,
      explicit source receipt and bounded assertion, exact selected evidence,
      Workflow/AgentTemplate closure, current target and permitted credential
      reference. Same-key same-payload replay returns the original Run before
      consulting mutable inputs; changed payload conflicts. No model origin IDs.
  - id: R2
    text: >-
      Generalize only the completion/judgment admission needed by this ordinary
      Run. Existing Audit and ordinary callers use one validated collection,
      deterministic assembly and acknowledged-write mechanism. Preserve
      allocation/Run/item authority, exact refs, write fencing and bounded
      partial evidence retention; remove replaced Audit-only assumptions from
      the common path without compatibility readers or a broad tool renaming.
  - id: R3
    text: >-
      The HTTP Worker receives the selected claim/evidence as untrusted context,
      checks its explicit conditions and retains selected control/probe exchanges.
      supported/refuted require admitted evidence and tested conditions;
      inconclusive requires limitations. Run success is separate. Failed login,
      unknown deployment mapping or missing role cannot become proof of a fix.
  - id: R4
    text: >-
      Associate the result with the existing Finding/source through the trusted
      Run pin, without publishing the same problem again. Preserve the launch
      Finding revision and independent results even after concurrent analyst
      edits. Do not change canonical assessment, severity or source identity.
      Retain acknowledged materials before releasing Run holds, including
      accepted partial results when later execution fails or is cancelled.
  - id: R5
    text: >-
      Use versioned catalog identities and immutable instruction paths with a
      valid lock. First-slice HTTP failed/interrupted transitions do not
      automatically rerun target work; store/finalization reconciliation remains
      available. Keep configured models, request/Worker/Run/publication budgets
      and existing target/credential policy, without broadening authorization.
  - id: R6
    text: >-
      Register closed launch/provenance/result/history shapes and limits in
      owning specs and shared fixtures. Inspect existing pin/Artifact lineage
      and table ownership before choosing storage; reuse Run/Artifact history
      indexing and receipts, not a mutable check ledger. Any relation change
      updates ownership, ERD and real PostgreSQL migration tests in this task.
  - id: R7
    text: >-
      Keep the delta local to this caller. Prefer a small extension of ordinary
      Run admission and existing Artifact/source-history publication; do not
      preselect a new endpoint/table/controller or migrate the full Audit
      journal into Runs. Each new public surface or abstraction needs a named
      caller and evidence that its existing owner cannot supply the capability.
      Extract shared normalization/assembly/persistence operations only where
      both real callers use them. Remove replaced duplicates in the same change.
      Preserve acknowledged-write/cancellation guarantees; report scope growth
      rather than weaken them. History reads stay scoped to the selected receipt.
failure_outcomes:
  - operation: Launch one finding-bound ordinary Run
    permanent: >-
      Foreign/missing Finding, receipt, material or credential returns existing
      ownership-not-found (404); stale revision/key mismatch conflicts (409/412
      as the existing command contract requires); invalid/unavailable profile,
      missing target or count/byte overflow returns a documented permanent 4xx.
      No Run dispatch or target traffic on rejection. Freeze exact codes in OpenAPI.
    retryable: Existing bounded storage retry, ending in 503 storage_transaction_conflict; no unbounded dispatch retry.
    ambiguous: Reconcile the existing Run creation/request receipt with identical key and payload; never dispatch a second Run to repair a lost reply.
    cancelled: Run/transaction owners settle admission; a committed Run remains discoverable by its request key and uses normal explicit cancellation.
    timeout: Launch/storage deadlines remain separate from admitted Run and HTTP deadlines.
  - operation: Execute HTTP and retain result/evidence
    permanent: Invalid/foreign evidence or contract content is rejected; target/auth failure is a technical outcome or bounded inconclusive judgment, never fixed/false-positive.
    retryable: Existing bounded storage/finalization retries; no automatic active-Stage or hidden target replay.
    ambiguous: Reconcile identical accepted judgment/Artifact bytes using existing receipts and CAS; ambiguous target effects remain uncertainty and are not replayed for persistence recovery.
    cancelled: Fence late writes and join HTTP/publication work before release; retain already acknowledged evidence/results with their attempt outcome.
    timeout: Preserve separate HTTP request, Worker/Run, publication and cleanup budgets; incomplete work does not synthesize a semantic verdict.
cardinality:
  - collection: Launch and assigned work
    expected: One Finding, one explicit source receipt, one assertion, one Worker
    maximum: Exactly one item per Run; 1 MiB encoded launch metadata
    bound: Exact selected inputs use existing finding-collection bounds; never expand all sources or checks of a Finding.
  - collection: Result and retained evidence
    expected: One judgment and a control/probe exchange pair
    maximum: Existing LIM-AWC-2 through LIM-AWC-6, including 256 retained records and 8 MiB combined collected-data budget
    bound: Prospective byte/count admission before writes; Artifact transfer limits also apply.
  - collection: Finding history and containing Project
    expected: Several checks per Finding
    maximum: Lifetime cardinality is paged, not fully loaded; test 10000 history entries with multiple sources
    bound: At most 64 history metadata rows and 1 MiB per response, plus one storage sentinel; full evidence fetched separately, indexed reads independent of lifetime fanout.
lifecycle:
  - entity: Ordinary finding-bound Run and retained result/evidence Artifacts
    delete: Existing owner-authorized terminal Run deletion after allocation release and Project retention; deleting Project denies new launches and writes.
    cascade: Project cleanup releases retained history and materials in existing bounded slices; no new independently deletable check entity.
    retention: Selected source, assertion, result, executor and safe target provenance survive permitted source/validation Run purge; acknowledged partial materials retain truthful attempt status.
acceptance_criteria:
  - id: A1
    given: A real source Worker has created an evidenced Finding and a controlled target has a reproducible flaw
    when: The owner launches validation through the public API and reads its history
    then: One ordinary Run performs real HTTP and retains the exact result/exchanges under the same Finding; no Audit, duplicate Finding or analyst edit is created.
  - id: A2
    given: Stale/foreign selections, incompatible capabilities, malformed shared shapes and over-limit inputs
    when: Launch or result admission occurs
    then: Real Server/PostgreSQL and Runtime reject consistently before unauthorized traffic or partial authoritative publication.
  - id: A3
    given: Lost launch/result replies, serialization aborts and a later analyst edit
    when: The identical operation reconciles
    then: One Run/result identity is retained, no extra target/model execution repairs storage, and the analyst's newer assessment is preserved.
  - id: A4
    given: Login/target failure, cancellation after evidence acknowledgement, or deadline exhaustion
    when: The Run terminates
    then: Execution and semantic outcomes remain distinct, acknowledged evidence is readable, and owned work joins before release with late writes fenced.
  - id: A5
    given: A Finding with 10000 history entries and source/validation Runs eligible for deletion
    when: Paged reads, Run purge and populated Project deletion execute
    then: Work stays within row/byte bounds, retained results survive Run purge, and Project cleanup releases all owned bindings without an orphan hold.
  - id: A6
    given: Existing Audit callers and the new ordinary caller share completion/judgment code
    when: Full package, wire, API and process gates run
    then: Both paths retain their authority and partial-result contracts; the shipped configuration validates, no replaced parallel implementation remains, and a short before/after inventory explains every new mechanism and production LOC change.
tests:
  - command: make require-database
    covers: [A1, A2, A3, A4, A5, A6]
  - command: go test -tags=integration -count=1 ./internal/findingintake/... ./internal/auditstore/... ./internal/auditservice/... ./internal/runservice/... ./internal/runstore/... ./internal/scheduler/... ./internal/controlplane/... ./internal/httpapi/... ./internal/artifacts/... ./internal/config/...
    covers: [A1, A2, A3, A4, A5, A6]
  - command: make test-runtime test-wire-cross-language
    covers: [A1, A2, A3, A4, A6]
  - command: make verify-public-api verify-public-api-postgres test-config
    covers: [A1, A2, A3, A6]
  - command: make test-findings-e2e test-audit-completion-e2e test-audit-common-programs-e2e
    covers: [A1, A2, A3, A4, A5, A6]
  - command: make lint
    covers: [A1, A2, A3, A4, A5, A6]
test_prerequisites:
  - Extend scripts/test-findings-e2e.py, the existing completion matrix and release required-case checks; do not add a feature-specific gate runner. A zero-matching selector never counts as acceptance.
  - Use one disposable PostgreSQL database with the required URL; unreachable configured database or mandatory fixture skips fail. Remove owned database/processes after pools stop.
  - Tests use testdata and pseudo-Skills; only shipped catalog validation reads configs. Run every whole touched package, including additional owners discovered during implementation.
  - Save test output to logs and inspect completion/required skip summaries only unless a failure occurs. Optional heavy I/O stays disabled unless explicitly requested; report those skips separately.
