schema_version: '1.0'
id: V425-006
title: Take the exact JSON integer bound from one definition in Go and one in Python
milestone: hub-audit-defects-2026-10
epic: api-contracts
kind: chore
introduced_by: V371-004
priority: P3
status: in_progress
depends_on: []
languages:
- go
- python
goal: The 2^53-1 exact-integer bound has one foundation Go definition (exactinteger.Max, exposed by contracts.MaxExactInteger) and one Runtime
  definition held to it by a shared fixture.
context:
  origin: Reported by a lane of the 2026-10-30 defect wave and rechecked on main fde39a943 by the coordinator.
  finding: 'internal/contracts/common.go:62 defines MaxExactInteger, but copies remain: internal/config/validation.go:13,
    internal/documentnumber/number.go:12 and :69-70, internal/memory/codec.go:32, internal/auditdomain/codec.go:616,
    finding_collection.go:229, finding_correlation.go:12, finding_limits.go:10, internal/findinganalysis/codec.go:91,
    internal/findingexport/snapshot.go:35, and Runtime toolset copies (V371-004 chose the cap and recorded
    it in WRK-R164).'
  authority: >-
    2026-10-31: the user confirmed this is a fixed numeric-format constant,
    not configuration, and asked to continue the task. Preserve its value
    and merge verified work into main with --no-ff.
  specification:
  - docs/spec/execution/worker.md#WRK-R164
  implementation_decision: >-
    Agent implementation choice, 2026-10-31: put the sole Go literal in a
    dependency-free foundation exactinteger package. contracts derives its
    existing public constant from it, and foundation documentnumber imports
    it directly. Reusing documentnumber would attach the document parser to
    unrelated wire consumers; the small leaf package avoids that dependency.
    Runtime reuses contracts.base.MAX_EXACT_INTEGER. No configurable policy
    or range change is introduced. Reopen if the transport numeric format changes.
    Source guards cover executable Go/Python definitions and decimal-string
    comparisons. Declarative schemas and historical SQL retain their literal
    contract values and existing cross-language fixture validation.
  siblings: Run git grep for 9007199254740991, 1<<53 and 2**53 across internal/, runtime/src/ and ui/src;
    every hit uses the shared definition or is a documented test literal.
scope:
  in:
  - Replace every Go copy with contracts.MaxExactInteger (or a derived constant); consumers without a wire-kernel dependency use foundation exactinteger.Max and every
    Runtime copy with one module constant.
  - A shared fixture case that both sides validate, plus a source scan that fails on a new literal copy.
  out:
  - Changing the bound itself or the UI, which uses Number.MAX_SAFE_INTEGER.
acceptance_criteria:
- id: A1
  text: No production literal copy of the bound remains outside the two definitions.
- id: A2
  text: The source scan fails when a literal copy is added.
