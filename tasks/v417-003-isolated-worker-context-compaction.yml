test_prerequisites:
- These are future implementation acceptance commands, not verification performed while creating tasks.
  Implement every explicitly named new gate in its owning task; zero selected or skipped mandatory cases
  fail.
- Use locked Runtime dependencies, testdata catalogs and pseudo-Skills. Unit and integration tests never
  read the live configs tree; make test-config validates the shipped catalog.
- Persistence and immutable snapshot reads use disposable real PostgreSQL. Set CONTRACTOR_TEST_DATABASE_URL
  for required gates; an unreachable configured database or skipped required case is a failure.
- Run full suites for every touched package in addition to focused gates. Use injected clocks and deterministic
  work counters for assertions, not wall-clock thresholds.
- Run integration acceptance on the exact ADK 2.13.0 closure accepted by V418-007; record Runtime revision
  and lock digest. No separate old-SDK compaction implementation or version-switching production path.
- Cancellation/deadline tests distinguish new semantic dispatch from remote completion of already-sent
  effects and separately authorized bounded terminal cleanup (WRK-R168); unknown effects reconcile through
  existing receipts.
delivery_note: 'This slice is intentionally vertical: splitting unsupported config/wire types from their
  first production consumer would violate AGENTS.md. Shared and Audit combinations remain explicit validation
  errors until V417-004 and V417-005 land. Basic safety, archive recovery and limits are not postponed
  to the exit task.'
decisions:
- >-
  2026-10-31 (lane cmp-worker): contextManagement is one flat tagged union on the binding and
  on AllocationSpec ({strategy} alone, or compact@1 with every member beside it), decoded with
  strictjson in Go and a discriminated union in Python. compact@1 keeps the explicit JSON/YAML
  boolean includeReasoning that R2 requires; the terminal summarizer's true-only encoding
  (TPL-R116, V417-001) is not reused here pending the coordinator's decision on it.
- >-
  2026-10-31 (lane cmp-worker): the compactor policy is pinned by the Workflow binding
  (WFL-R94). Deployment model selection does not retarget it; scripts/generate_model_config.py
  emits a non-selectable compactor@1 (own compactor-model route, default model, maxModelCalls 1,
  finite maxTotalTokens, no tool limits) that stays out of configs/model-selection.json.
  Overrides belong to V417-006. The Server resolves it into the allocation runtime
  configuration only for credential authorization and Gateway recovery routes (CTL-R154).
- >-
  2026-10-31 (lane cmp-worker): one compactor ModelPolicy rule (TPL-R118) for Planner and
  Worker: ResolvedModelPolicy.ValidateForCompactor replaced the duplicate
  resolved.ValidatePlannerCompactorModelPolicy that V420-002 landed in parallel.
- >-
  2026-10-31 (lane cmp-worker): history scope and safety. Groups are indexed incrementally
  from persisted session events and projected once with the terminal summarizer projection
  (redaction, part bounds, tagged reasoning). Skill tool results are replaced by a fixed
  notice in compactor input and read_context_history, so the Worker must call the Skill tool
  again and reserve its disclosure budget again (SKL-R98), instead of re-charging the budget
  per history read. Evidence is selected before reasoning: reasoning does not count against
  the 128 KiB recent-group bound, the 8 MiB input reserves 64 KiB for it and reasoning is
  admitted newest group first (WRK-R188). The proposal bounds of R12 are registered unchanged
  (LIM-WRK-30 to LIM-WRK-36, LIM-WFL-9 to LIM-WFL-12); no live measurement of representative
  sizes was made, so they are proposal values tested at their exact ceilings.
- >-
  2026-10-31 (lane cmp-worker): marker commit reuses the ADK session as its receipt: a failed
  append is followed by one bounded session read; an exactly equal stored marker is committed,
  no marker means not committed (worker_compaction_failed, no fence) and a conflicting marker
  or an unreadable session fences the session lifecycle (WRK-R190). A summary that is not
  smaller than the evidence it replaces is ineffective before commit; ineffectiveness first
  seen in the next measured main response keeps the marker and stops (WRK-R193).
- >-
  2026-10-31 (lane cmp-worker): R16 status is the contractor.worker.context_compaction span
  (generation, outcome, bounded cause) and the model.phase=context_compactor span; no new
  Worker State or ExecutionMetrics field is exposed (richer reporting is V417-007).
- >-
  2026-10-31 (lane cmp-worker): opt-in example taint-trace-from-workspace-compact@1 is a
  copy of taint-trace-from-workspace@4 with compact@1 on its analyst and no on.summarized
  escalation; existing Workflows are unchanged. Specification numbers: WFL-R91 to WFL-R95
  (V420-002 took WFL-R90), WRK-R184 to WRK-R195, FAIL-WRK-8, LIFE-WRK-6.
