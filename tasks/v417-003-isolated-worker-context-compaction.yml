schema_version: '1.0'
id: V417-003
title: Continue an isolated Worker through workflow-selected context compaction
milestone: worker-context-compaction-2026-10
epic: planner-worker
kind: feature
priority: P1
status: in_progress
depends_on:
- V417-002
languages:
- go
- python
- typescript
- yaml
goal: A normal isolated Worker selected by compact@1 in a Workflow continues the same subtask after bounded
  context compression, can retrieve details from retained history, and returns a normal trusted result
  only on actual completion.
context:
  authority: 'User request on 2026-10-25: split proposal 0046 into tasks and make terminal summarizer
    includeReasoning independently deliverable. This record plans work; it does not start implementation
    or change existing delivery priorities. User decision on 2026-10-30: start implementation now; the coordinator session runs it in lane cmp-worker together with V417-001, V417-003 and V420-002.'
  proposal: docs/proposals/0046-workflow-context-compaction.md
  decision_needed: >-
    2026-10-31 (lane cmp-worker): R1 is implemented as written: resolved bindings,
    Workflow/Stage snapshots and AuditProfile-embedded Workflows always carry the explicit
    contextManagement strategy (template@1 included), and a persisted snapshot without it is
    invalid on read (WFL-R91, as WFL-R34 did for session). Consequence: every Workflow
    closure digest changes, and Runs, Audits and Eval pins created before this revision are
    unreadable or rejected after deployment (the demo database keeps the rows, but reads of
    those snapshots fail). V420-002 chose the other encoding for Planner compaction: none is
    an absent member, so existing digests stay unchanged. Options: (a) keep R1 (current
    state; no legacy reader, consistent with WFL-R34); (b) encode template@1 as an absent
    member in resolved snapshots and AllocationSpec-derived digests, matching V420-002 and
    keeping old snapshots readable, at the cost of reworking the Go, Python, UI and fixture
    readers of this slice. Recommendation: (a), unless the demo history must stay readable,
    then (b) in a follow-up task before the demo deployment.
  specification:
  - docs/spec/configuration/workflows.md#WFL-R86
  - docs/spec/configuration/agent-templates.md#TPL-R48
  - docs/spec/execution/worker.md#WRK-R137
  - docs/spec/execution/worker.md#WRK-R146
  - docs/spec/tools/skills.md#SKL-R98
  - docs/spec/tools/memory.md#MEM-R2
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/limits.md
  - docs/spec/platform/errors.md
  implementation_boundary: Update numbered owning specifications, limits/errors/failure/lifecycle registries,
    strict schemas, fixtures and every affected reader/writer together with implemented behavior. Generated
    clients are regenerated through their tools. No legacy readers, unsupported accepted configuration,
    speculative exports or new receipt store.
  adk_migration: V418-007 accepts the exact ADK 2.13.0 lock before V417-002 establishes compaction integration.
    Internal SDK turns are not new logical Contractor invocations; use the accepted migration contract,
    not 2.8 callback/identity assumptions.
scope:
  in:
  - 'One vertical change: Workflow binding authoring and normalization, exact model/instruction dependencies,
    resolved snapshots, allocation wire and the reachable Runtime coordinator.'
  - Ordinary isolated ADK Workers, repeated compaction, bounded retained history and read_context_history,
    minimal truthful state, errors, cancellation and cleanup.
  - Compactor ModelPolicy consumer, instruction resource and an opt-in ordinary Workflow example with
    a real production consumer; generated policies through deploy/models sources.
  - Public descriptors/editor validation and generated clients for the config fields; real PostgreSQL
    snapshot and real Server/Runtime process regressions.
  out:
  - Shared-mode admission (V417-004), Audit completion admission (V417-005), compactorModelPolicy execution
    overrides (V417-006) and richer metrics/UI (V417-007).
  - Terminal summarizer includeReasoning (independent V417-001), Workflow-wide strategy merging, cumulative-spend
    compaction, estimated token triggers, reactive retry after context rejection, recursive map-reduce,
    durable context recovery or new tables.
  - Changing existing Workflows or active Runs to compact@1 by default; learning prompts from benchmark
    answers.
requirements:
- id: R1
  text: 'Introduce a closed contextManagement union on each object-valued Workflow agent binding: template@1
    or compact@1. Missing authoring normalizes to template@1; resolved bindings require an explicit strategy
    and AllocationSpec exactly one effective none/terminal@1/compact@1 branch. No read-time inference
    or legacy acceptance. A compact branch wholly replaces template summary instructions/ratio/cumulativeBudget
    without changing its template digest.'
- id: R2
  text: compact@1 requires explicit includeReasoning and exact modelPolicy/instructions refs; normalize
    contextWindowRatio, keepRecentGroups and maxCompactions defaults. Reject model-free bindings, shared
    sessions and Audit completion until their tasks land, and reject on.summarized with compact@1. Never
    silently fall back to terminal mode or accept ignored summarizer-only overrides.
- id: R3
  text: Pin resolved fields, instruction text and dependencies into Workflow/Run/allocation digests. Strictly
    validate on authoring, persistence read and Runtime admission. Update affected Go/Python/public schemas,
    clients and descriptors together; use shared valid/invalid fixtures under api/testdata/v1alpha1 and
    config fixtures.
- id: R4
  text: Compactor uses one tool-free model consumer with required contextWindowTokens, maxOutputTokens,
    maxModelCalls=1 and finite maxTotalTokens; reject tool/worker-call limits. Use the effective Worker
    Gateway/credential and explicitly selected policy. It receives no domain tools, Skills, Memory, workspace
    or Artifact client.
- id: R5
  text: At the safe boundary after completed tools, ordinary valid completion has priority. Trigger only
    from actual latest main-model prompt usage at min(floor(contextWindowTokens*ratio), contextWindowTokens-maxOutputTokens).
    Missing usage does not cause an estimated trigger; compactor/finalizer usage does not overwrite main
    prompt usage. New context generation and new eligible prefix are required before another compaction.
- id: R6
  text: Retain one logical Contractor invocation/allocation/A2A task/subtask identity, tool instances,
    counters, original deadline, canonical State, trusted observations/refs, Skills and disclosure budgets
    across every internal SDK turn. Use V418 ownership mapping; repeated callbacks never reset State or
    completion. Every compactor call/token counts once toward existing invocation hard budgets plus its
    own finite policy; finalizer remains charged normally. Never use terminal cumulativeBudget as a recurring
    trigger.
- id: R7
  text: Build bounded input from the exact Runtime task, previous memory and newly eligible complete old
    groups. Runtime protects objective/instructions/parameters/named refs, groups call/response pairs
    and assigns checkpoint identity/range/generation. The model returns only non-empty bounded summary;
    model-authored identities/refs do not gain authority. Replace previous memory, not append all summaries.
- id: R8
  text: Reasoning is provider-supplied text only, serialized as tagged ordinary data when the compact
    branch explicitly selects true, with redaction and 8-KiB/part and 64-KiB total bounds and truncation
    markers. Task/tool observations take priority. No raw reasoning replay to the main model and no new
    telemetry-capture permission. This task has no prerequisite on terminal reasoning support; share helpers
    when both real callers exist.
- id: R9
  text: Use the ADK 2.13 adapter and logical invocation/SDK turn mapping proved by V417-002. Close the
    old generator in its owner task, make one bounded compactor call, validate before commit and deliver
    the Runtime continuation to the actual next model request. Native ADK automatic/token-trigger/post-invocation
    compaction and resumability stay off. Bind the marker to Runtime source ordinals/generation/session/branch/isolation;
    inclusive timestamp ranges with equal-time neighbors, previous/overlapping summaries or foreign events
    must represent exactly those groups or fail before mutation.
- id: R10
  text: Use existing allocation-local session events as bounded source history with incremental group
    indexes. Do not reuse the lossy tail-only terminal TranscriptRecorder as a complete archive or allocate
    a second unbounded raw copy. read_context_history accepts scoped ordinals/continuation positions,
    never arbitrary paths/session IDs/refs; responses are historical data, not new protocol calls or current
    mutable state.
- id: R11
  text: History reads use ordinary tool budgets, the same reasoning/redaction projection and current Skill
    disclosure checks, including repeated reads and partial large-group pages. Integrate shared logic
    through toolsets.common or an injected boundary, not upward imports into concrete toolsets. Reject
    access outside the current isolated invocation and clear all cursors/history at its end.
- id: R12
  text: 'Validate and register initial proposal bounds before enabling the branch: cycles 1..16 default8/invocation
    and 32/allocation; recent groups 1..16 default4 and 128 KiB; compactor input 8 MiB; summary 16 KiB;
    retained history 32 MiB and 4096 groups; archive page 32 KiB and 8 groups or a bounded fragment. Measure
    representative serialized inputs and copies first; record any justified adjustment in proposal and
    shared limits before changing these acceptance values.'
- id: R13
  text: Count admitted raw events, indexes, projections, markers and temporary input copies; state a finite
    transient-memory bound as well as archive storage bounds. A required prefix/tail that does not fit
    fails explicitly; no silent prefix loss, half-groups or unbounded rescan per history page. Large serialization
    uses joined off-event-loop work with short State lock holds.
- id: R14
  text: 'Invalid/None/empty/oversized/output-limited output, summarizer exception or a candidate demonstrably
    ineffective before commit produces worker_compaction_failed with a bounded cause: that rejected attempt
    adds no marker and starts no continuation. Native skip cannot authorize using unchanged history after
    an admitted failed attempt. If ineffective is first established from actual main usage after a valid
    checkpoint, retain its marker, observations and charged calls, then stop before another dispatch/cycle
    rather than roll back or loop. Cancellation/deadline retains precedence; history/tail/cycle ceilings
    produce non-retryable worker_context_limit_exceeded, and general budget exhaustion remains worker_budget_exhausted.
    Preserve transport retry classification without semantic repair.'
- id: R15
  text: 'Reconcile ambiguous append by inspecting the same pending marker ID/exact range in the existing
    session. Reused Event.id alone does not prove deduplication: confirm the marker or prove absence before
    append, otherwise fence. Cancel/deadline/lease loss stops new semantic model/tool/publication dispatch
    and joins local work. Already-sent uncertain effects use existing receipts; authorized WRK-R168 cleanup/auto-export
    keeps its separate bounded budget. Finalize/abort/release do not compact and clear owned session/history/reasoning/client
    buffers; incomplete cleanup retains the fence.'
- id: R16
  text: Successful compaction emits bounded factual internal status without reusing the monotone terminal
    summarizer section. Normal finalizer/trusted result assembly returns summarized=false after useful
    continuation; no intermediate WorkerResult, Planner handoff or fresh subtask. Exposed schema fields
    have real readers/writers now; richer numeric reporting belongs to V417-007.
failure_outcomes:
- operation: Workflow publication, snapshot read and allocation admission
  permanent: Reject invalid, unsupported and inapplicable combinations under existing config/400 classifications
    before allocation; deterministic invalid reads are permanent.
  retryable: Existing storage conflict/503 and bounded transport policy only.
  ambiguous: Reconcile existing publication/Run identities and exact pins, never create a second workflow
    or allocation.
  cancelled: Existing request/Run owner joins accepted work before release.
  timeout: Keep admission/request timeouts separate from the invocation deadline.
- operation: Compactor Gateway call and input/output admission
  permanent: worker_compaction_failed preserves permanent provider classification; worker_context_limit_exceeded
    is non-retryable; worker_budget_exhausted remains distinct. No silent terminal fallback.
  retryable: Use existing bounded Gateway attempt/backoff policy within the same original deadline; no
    second semantic attempt.
  ambiguous: A lost Gateway response may repeat computation/billing under existing transport rules; it
    never authorizes a duplicate checkpoint.
  cancelled: Cancellation/lease loss wins; join calls and serializers and discard late output.
  timeout: The original Worker-call deadline bounds every cycle without renewal.
- operation: Session marker commit and history read
  permanent: Invalid/foreign/expired cursors return bounded tool errors; unsafe ranges or unverifiable
    session state stop continuation.
  retryable: No unbounded session retry; deterministic failures are not retried.
  ambiguous: Inspect the same pending marker ID/range; accept once or fence. No new receipt mechanism.
  cancelled: No history/model/tool access after ownership fence; join before clearing session buffers.
  timeout: History reads and commit stay within the existing tool/invocation deadline.
cardinality:
- collection: Invocation cycles and protected recent groups
  expected: 8 cycles configured; last 4 complete groups
  maximum: 16 cycles/invocation, 32/allocation;16 recent groups and128 KiB
  bound: Reject an unrepresentable or oversized protected tail rather than silently discarding required
    groups.
- collection: Retained raw history and transient projections
  expected: Incremental events and one current memory
  maximum: 4096 complete groups and 32 MiB retained history;8-MiB compactor input;16-KiB summary
  bound: Register and test a total raw+projection+copy memory bound. Incremental ordinal index bounds
    read work; byte ceilings use UTF-8 serialized representation.
- collection: Archive response and reasoning projection
  expected: Up to8 groups or part of one large group
  maximum: 32-KiB page;8-KiB per reasoning part and64-KiB included reasoning per compactor input
  bound: Page metadata, delimiters and truncation markers count toward bytes; repeated Skill disclosure
    and ordinary calls remain charged.
lifecycle:
- entity: Compaction session, marker, memory and archive
  delete: Invocation owner deletes all isolated conversation state; allocation abort/release owns client
    cleanup.
  cascade: History, indexes, pending markers, reasoning and cursors disappear with the session; no State
    carry or new durable store.
  retention: No checkpoint recovery after process restart; existing interrupted/retry path applies. Ordinary
    immutable configuration pins retain the existing Run lifecycle.
acceptance_criteria:
- id: A1
  given: Template/no-summarizer and explicit compact Workflows plus invalid shared/Audit/handoff combinations
  when: Configuration is published, stored, read and delivered to Runtime
  then: Every supported strategy/pin is exact and reaches its real consumer; malformed or unsupported
    shapes fail in every language and snapshot path; existing terminal behavior stays valid.
- id: A2
  given: One ordinary isolated task with two compaction boundaries and a prior side effect
  when: Real ADK 2.13 executes multiple internal turns through the production coordinator
  then: The Worker makes useful subsequent tool calls under one logical owner, preserves exact task/refs/state/deadline
    and collector, executes the prior side effect once, and invokes finalizer only at normal completion
    with summarized=false.
- id: A3
  given: Missing/stale usage, high usage with no eligible prefix and hard budgets
  when: Safe-boundary admission evaluates a next call
  then: No estimated or immediate stale re-trigger occurs; progress failure and hard limits are explicit;
    main/compactor/finalizer counts are neither reset nor double counted. When ineffectiveness is detected
    only after a valid committed checkpoint and measured main response, the marker and charged calls remain;
    no next cycle or semantic dispatch is admitted.
- id: A4
  given: History contains interleaved calls/results, errors, partial events, equal-time retained neighbors,
    previous summaries, foreign scopes, reasoning and Skills
  when: Checkpoint projection and paged retrieval execute
  then: Marker ranges cover exactly the selected intact groups or fail before mutation; paged data remains
    scoped and recoverable, reasoning filtering/redaction holds and history cannot bypass Skill disclosure
    or tool-call budgets.
- id: A5
  given: Exact ceilings and one-over cases including 4096 groups/32 MiB, multibyte content and large tool
    payloads
  when: Input admission, history pages and cleanup run
  then: Work and all retained/transient bytes remain bounded; deterministic limits fail without truncating
    required prefix/tail; indexed reads do not repeatedly traverse the entire archive.
- id: A6
  given: Invalid model output, ambiguous append and cancellation/deadline/lease loss before and after
    commit
  when: Each injected failure runs through the real coordinator
  then: Existing error classes and new bounded codes agree across readers; marker commits once or fences;
    no late continuation, leak or terminal fallback occurs. None/native skip/invalid summary adds no marker
    for the rejected attempt and starts zero later model/tool calls; cancellation and deadline retain
    their owning outcome.
- id: A7
  given: Real Server, Runtime and disposable PostgreSQL using the opt-in Workflow
  when: An end-to-end task compresses twice then finishes
  then: Wire selection, snapshot reads, trusted result assembly and cleanup agree; no summarized event
    or streamline handoff is fabricated.
