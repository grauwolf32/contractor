schema_version: '1.0'
id: V407-025
title: Reduce Project-drain and held-Audit query work and scope Stage triggers
milestone: server-runtime-review-2026-10
epic: persistence
kind: chore
introduced_by: V365-004
priority: P2
status: in_progress
depends_on: []
languages:
- go
- sql
goal: Existing drain, credential-hold and Stage validation semantics use selective queries and column-scoped
  triggers without unnecessary repeated work.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/platform/persistence.md
  finding: internal/projectlifecycle/controller_sql.go:9-24 filters workflow_runs by project_id alone,
    while the useful composite index begins with owner_id. pgstore/store.go:42-48 checks held Audit baseline
    JSON members without a matching GIN expression index. baseline.sql:2166-2170 invokes the Stage lifecycle,
    manual-continuation and immutability triggers on every UPDATE, including unrelated columns; PER-R22
    calls for scoped trigger invocation. These query/trigger structures are verified, but no production
    EXPLAIN or latency result was obtained.
  siblings: Other project_id-only predicates (grep 'project_id = ' in *_sql.go) and other AFTER UPDATE
    triggers without UPDATE OF (grep in the baseline).
  validation: A sequential scan on every poll is not established without representative data and a plan.
    The lifecycle function already checks OLD.state IS DISTINCT FROM NEW.state at baseline.sql:148-162,
    so merely asserting no new event on an unrelated UPDATE already passes. This is a behavior-preserving
    query/trigger optimization, not evidence that unrelated updates currently create bogus lifecycle events.
plan:
- Measure query shape with EXPLAIN on a deterministic realistically seeded PostgreSQL fixture, including
  multiple owners/projects and held/released Audits. Use owner_id predicates from the claim where appropriate;
  add an index only where the retained query demonstrably needs it.
- Give held-Audit membership predicates suitable partial expression indexes if the measured plans require
  them; preserve ordering/limit/owner semantics and document the indexed selectivity.
- In a new migration scope the three triggers to the exact guarded columns and state changes, retaining
  INSERT behavior and every immutability/manual-continuation check. Keep old migration files unchanged.
- 'Test actual trigger invocation or catalog definitions as well as resulting rows: an unrelated update
  must avoid unnecessary calls; a guarded change must still reject or emit the same event. Do not use
  a wall-clock threshold or require an index scan for arbitrarily tiny datasets.'
scope:
  in:
  - Query predicates/indexes, a new trigger-scoping migration and real PostgreSQL plan/invocation tests.
  out:
  - Changing drain/purge/hold results, dropping guarded checks, or claiming measured production speedups
    before measurement.
acceptance_criteria:
- id: A1
  text: On the documented realistic fixture, drain and held-Audit queries have selective plans and bounded
    examined-row work; recorded before/after plans explain the benefit without relying on disabled sequential
    scans.
- id: A2
  text: Catalog/invocation tests show that unrelated updates skip the guarded trigger bodies, and all
    INSERT/guarded-column/state-transition behaviors remain identical.
- id: A3
  text: At least the trigger-scoping regression distinguishes the original schema; query tests record
    the original plan rather than assuming every original query must be a sequential scan.
- id: A4
  text: Owner isolation, active/deleting/terminal cases and held/released credential cases pass against
    real PostgreSQL; existing FK-probe index guards remain green.
tests:
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/projectlifecycle/...
    ./internal/auditstore/... ./internal/persistence/...
  covers:
  - A1
  - A2
  - A3
  - A4
- command: make lint
  covers:
  - A2
  - A4
