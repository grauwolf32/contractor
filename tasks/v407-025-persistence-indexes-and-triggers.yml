schema_version: "1.0"
id: V407-025
title: "Index Project drain and held-Audit credential queries and scope stage_executions triggers to the columns they guard"
milestone: server-runtime-review-2026-10
epic: persistence
kind: defect
introduced_by: V365-004
priority: P2
status: pending
depends_on: []
languages: [go, sql]
goal: "Draining a Project and checking credential holds use indexes, and stage_executions triggers fire only for the updates they guard."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings C2, C5, C9; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/platform/persistence.md
  severity: medium
  finding: >-
    internal/projectlifecycle/controller_sql.go:9-24 waitForDrainSQL and
    controller.go:390-394 (purgeProject EXISTS) filter workflow_runs by
    project_id alone; the only indexes with project_id are
    workflow_runs_owner_project_created_idx (owner_id, project_id, ...) and
    workflow_runs_run_project_key (run_id, project_id), so each poll of a
    draining Project (PollInterval 1 s, deferClaim) sequentially scans
    workflow_runs and joins stage_executions and stage_allocations;
    cancelOneRun and purgeOneRun (controller.go:272, 338) pass owner_id and
    are indexed. internal/auditstore/internal/pgstore/store.go about 33-50
    listHeldAuditIDsByCredential: WHERE hold_state = 'held' AND
    (baseline_snapshot->member) ? $1 has no supporting index; the same
    question on workflow_runs got partial GIN indexes in migration 000002.
    internal/persistence/migrations/000001_baseline.sql:2166-2170:
    stage_executions_capture_lifecycle_event, _protect_immutable and
    _manual_continuation fire on every UPDATE including
    output_publication_failures + 1 and admitted_at; migration 000012 fixed
    this class for workflow_runs with UPDATE OF column lists and WHEN
    clauses.
  siblings: >-
    Other project_id-only predicates (grep 'project_id = ' in *_sql.go) and
    other AFTER UPDATE triggers without UPDATE OF (grep in the baseline).
plan:
  - "Add owner_id = $2 to both drain statements (the claim carries OwnerID) so the existing composite index applies; or add a partial index on (project_id) WHERE project_id IS NOT NULL in a new migration if a query cannot carry the owner."
  - "Add partial GIN indexes on the two baseline_snapshot members WHERE hold_state = 'held' in a new migration, mirroring 000002."
  - "Rewrite the three stage_executions triggers with UPDATE OF <guarded columns> and WHEN (OLD.state IS DISTINCT FROM NEW.state) where the trigger only cares about state; keep behaviour for the guarded columns."
  - "Tests: EXPLAIN-based index-use tests (pattern: TestProbeHolderLookupUsesItsIndex) for the drain and held-audit statements; a trigger test that an UPDATE of output_publication_failures does not create a lifecycle event row; the FK probe-index allowlist test stays green."
scope:
  in:
    - "Predicates, indexes, trigger scoping, EXPLAIN tests."
  out:
    - "Any change to drain, purge or hold semantics."
acceptance_criteria:
  - id: A1
    text: "EXPLAIN of the drain statements and listHeldAuditIDsByCredential shows an index scan on a realistically seeded database."
  - id: A2
    text: "Updating output_publication_failures or admitted_at fires none of the three triggers (no lifecycle event row, no immutability check)."
  - id: A3
    text: "The EXPLAIN tests fail on the unfixed code."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/projectlifecycle/... ./internal/auditstore/... ./internal/persistence/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1]
