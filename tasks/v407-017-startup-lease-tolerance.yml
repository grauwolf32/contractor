schema_version: "1.0"
id: V407-017
title: "Bound the single-active Server's startup lease dial and first acquire by the lease tolerance"
milestone: server-runtime-review-2026-10
epic: execution-core
kind: defect
introduced_by: V107-001
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "A stalled PostgreSQL at startup makes the Server stand by or fail within the lease tolerance instead of hanging indefinitely."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, finding D11; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/platform/persistence.md
  severity: low
  finding: >-
    internal/app/single_active.go:216-229 openControlPlaneLease and the first
    tryAcquire(ctx) use the raw process context; the standby loop later bounds
    each probe by tolerance and reconnects (PER-R8), but a stalled PostgreSQL
    at startup (TCP accepted, no response) hangs the process indefinitely
    instead of failing or standing by.
  siblings: >-
    Other startup database calls in internal/app (schema verification
    V256-001, credential recovery V407-018) must have their own bound; list
    them in the task log.
plan:
  - "Wrap the initial dial and probe in context.WithTimeout(ctx, tolerance) and treat a timeout like a failed probe (enter standby and retry, as the loop already does)."
  - "Test with a listener that accepts and never answers: the Server reports standby or fails within tolerance (use the existing lease test harness with an injected dialer)."
scope:
  in:
    - "Tolerance bound on startup lease operations."
  out:
    - "Lease durations and takeover rules."
acceptance_criteria:
  - id: A1
    text: "Startup against a non-answering listener returns or enters standby within the tolerance."
  - id: A2
    text: "The test fails on the unfixed code (hangs beyond the budget)."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/app/..."
    covers: [A1, A2]
  - command: make lint
    covers: [A1]
