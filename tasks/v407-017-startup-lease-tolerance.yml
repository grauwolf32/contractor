schema_version: '1.0'
id: V407-017
title: Document and test inherited startup lease connection and query budgets
milestone: server-runtime-review-2026-10
epic: execution-core
kind: chore
introduced_by: V107-001
priority: P3
status: in_progress
depends_on: []
languages:
- go
goal: Make the existing bounded startup lease behavior explicit and prevent loss of inherited connection/query
  deadlines without changing timeout or standby policy.
context:
  review: docs/research/2026-10-23-server-runtime-review.md (corrected dispositions, verified on main
    dc7012e8; recheck source lines before implementation)
  specification: docs/spec/platform/persistence.md
  finding: internal/app/single_active.go:75-80 copies the pool ConnConfig for the startup lease session.
    persistence/postgres/pool.go:72-87 installs a connect timeout and budgetTracer; budget_tracer.go:35-37,71-72
    bounds each query. The initial call uses the process context but is therefore not unbounded. The startup
    budget and the later lease-specific tolerance have different ownership, which should be explicit in
    documentation and regression coverage.
  validation: Validated against main dc7012e8 on 2026-10-23. The original indefinite-hang claim was disproved.
    net.Pipe probes with a stalled startup handshake and a stalled first query returned the inherited
    timeout under context.Background(). Defaults are 5s connect and 20s query; the later lease liveness
    tolerance is 10s. This task does not choose a new mandatory startup 10s policy.
  siblings: Startup OpenPool.Ping and migration verification precede lease acquisition; lease keepalive
    configuration, first acquire and holderPID use the copied connection. Later standby acquisition/reconnect
    and active liveness probes keep their own established tolerance.
plan:
- Document which configured budget owns initial connect, keepalive configuration, first advisory-lock
  acquire and holder lookup, and contrast that ownership with the existing standby/active probe tolerance.
- Add tests that inspect the copied connection configuration and tracer-created deadlines with an injected
  clock or deadline-recording transport; verify caller deadlines are not extended.
- Use a controlled protocol peer/dialer to exercise cancellation of startup handshake and query paths.
  Assert propagation and cleanup via synchronization, not elapsed wall-clock limits.
- Retain current startup error, standby and takeover behavior. Record that the reviewed infinite-hang
  allegation is declined; any different startup tolerance is a separate design decision.
scope:
  in:
  - Documentation and regression coverage for already enforced startup connection/query budgets.
  out:
  - Changing timeout values, replacing configured query budgets with a mandatory 10s tolerance, or changing
    startup failure into standby/retry behavior.
acceptance_criteria:
- id: A1
  text: Tests prove that the dedicated startup lease session retains configured ConnectTimeout and the
    query budget tracer, and that an earlier caller deadline is respected by connect/query operations.
- id: A2
  text: A controlled stalled peer observes cancellation and connection cleanup for the handshake and initial
    query paths; assertions use deadline ownership and explicit synchronization, not elapsed-time performance
    thresholds.
- id: A3
  text: The persistence specification describes existing startup/standby/active budget ownership without
    introducing a new availability policy. The declined unbounded-startup allegation and its evidence
    remain in this task validation and the research report, not in the normative requirements.
tests:
- command: go test -count=1 ./internal/app/... ./internal/persistence/postgres/...
  covers:
  - A1
  - A2
  - A3
- command: test -n "$CONTRACTOR_TEST_DATABASE_URL" && go test -tags=integration -count=1 ./internal/app/...
    ./internal/persistence/postgres/...
  covers:
  - A1
  - A2
- command: make lint
  covers:
  - A1
  - A2
  - A3
