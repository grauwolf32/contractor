schema_version: '1.0'
id: V173-001
title: Analyze C-family headers in shallow and graph views
milestone: code-analysis-headers-2026-10
priority: P1
status: completed
implementation_commit: 470e0bc008f5e68fe2ae0844c49afeb3b28d8a2b
depends_on: []
languages: [python]
goal: Preserve C and C++ header symbols and graph calls with truthful coverage.
context:
  issue: https://github.com/grauwolf32/contractor/issues/280
  finding: C++ headers use the C grammar, while Trailmark graph admission omits C/ObjC headers.
scope:
  in:
    - Resolve C++ headers in shallow and taint annotation paths while retaining C headers.
    - Admit .h to the graph when C or Objective-C source activates a parser that walks headers.
    - Mark deterministic taint parse failures nonretryable.
  out:
    - Add standalone .h files to Trailmark language auto-detection.
acceptance_criteria:
  - {id: A1, text: Shallow C++ header symbols and inline methods parse cleanly in a C++ snapshot.}
  - {id: A2, text: Taint annotation resolves an inline C++ header method; deterministic parse failures are nonretryable.}
  - {id: A3, text: C header symbols remain valid, and a C call resolves to its header definition in the graph.}
  - {id: A4, text: Header-only snapshots remain unsupported by graph admission.}
tests:
  - {command: cd runtime && .venv/bin/python -m pytest tests/test_code_analysis_shallow.py tests/test_code_analysis_graph.py tests/test_trailmark_probe.py tests/test_taint_annotations.py, covers: [A1, A2, A3, A4]}
