schema_version: '1.0'
id: V144-001
title: Enforce the Audit standard baseline contract and trim dead catalog helpers
milestone: audit-standard-baseline-contract-2026-10
priority: P3
status: in_progress
depends_on: []
languages: [go, markdown]
goal: Reject baselines without standards consistently and remove unused exported catalog helpers.
context:
  issue: https://github.com/grauwolf32/contractor/issues/156
  finding: Audit decoding accepts a missing standards field while finding intake rejects it.
scope:
  in:
    - Require a non-null standards array at Audit baseline validation and preserve it when cloning.
    - Remove unused SeedPlan byte getters and the audit standard error-code accessor.
    - Correct the persisted-baseline compatibility statement in the Audit specification.
  out:
    - Migrate or rewrite persisted baseline snapshots.
acceptance_criteria:
  - {id: A1, text: Audit decoding rejects missing or null standards and accepts an empty standards array.}
  - {id: A2, text: Decoded valid baselines retain the non-null array shape required for validation.}
  - {id: A3, text: Unused catalog exports are removed and validation tests still inspect typed errors.}
  - {id: A4, text: The Audit specification states the strict baseline behavior.}
tests:
  - {command: go test -p 1 ./internal/auditstandards ./internal/agentskills ./internal/auditimport ./internal/auditservice, covers: [A1, A2, A3, A4]}
