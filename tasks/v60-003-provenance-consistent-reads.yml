schema_version: '1.0'
milestone: project-review-v60
priority: P2
status: in_progress
depends_on:
- V59-005
languages:
- go
- python
- markdown
id: V60-003
title: Keep finding provenance reads consistent without nested pool acquisition
goal: Return provenance pages matching their revision envelope and release SQL rows before dependent receipt hydration.
context:
  authority: User requested detailed project review and implementation; initial pass exposed these provenance-read
    gaps.
  specification:
  - docs/spec/19-audits.md
  - docs/spec/27-findings-tools-and-collections.md
  design: docs/plans/2026-09-20-project-review.md
  finding_ids:
  - PR-02
  - PR-03
scope:
  in:
  - Verify revision interleaving and one-connection pool behavior with deterministic handler and isolated PostgreSQL
    regressions.
  - Reject a provenance page when its relevant Audit/finding revisions change during reading, preserving existing
    cursor/CAS semantics.
  - Close provenance query rows before owner-scoped receipt hydration; preserve ordering, identities, item count
    and missing-receipt behavior.
  out:
  - Change database-wide isolation or enlarge connection pools to hide nested acquisition.
  - Redesign cursor format, findings schema, review settlement or artifact retention.
acceptance_criteria:
- id: A1
  text: A mutation during provenance read produces the established conflict response rather than items mislabeled
    with older revisions.
- id: A2
  text: Real PostgreSQL provenance hydration completes with MaxConns=1 and preserves receipt provenance and owner
    isolation.
- id: A3
  text: Maximum-size pagination and stable-cursor behavior from V59 remain valid; all reproduced defects are recorded
    before fixes.
tests:
- command: go test -race -count=1 ./internal/auditservice ./internal/httpapi/public
  covers:
  - A1
  - A2
  - A3
- command: make verify-public-api-postgres
  covers:
  - A2
  - A3
- command: git diff --check
  covers:
  - A1
  - A2
  - A3
verification_requirements:
- Database-dependent regressions must execute with CONTRACTOR_TEST_DATABASE_URL pointing only to the disposable
  local test database.
- If a candidate does not reproduce, record it as rejected rather than implementing a speculative correction.
- Keep an implementation commit and later metadata commit with full original implementation hash.
