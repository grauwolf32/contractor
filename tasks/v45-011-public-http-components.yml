schema_version: '1.0'
id: V45-011
title: Separate HTTP route groups and consumer interfaces
milestone: server-maintainability
priority: P2
status: pending
depends_on:
- V45-001
languages:
- go
goal: Separate HTTP route groups and consumer interfaces.
context:
  verified_evidence: NewHandler combines dependency validation, fallback service construction, routes
    and middleware; RunReader also contains lifecycle commands.
  current_contract: Behavior-preserving refactoring of the existing Go Server. Preserve exact pinned identities,
    authority checks and operation/resource ownership. Tests describe the required verification, not measured
    production performance.
scope:
  in:
  - Separate route registration by resource and middleware composition.
  - Supply Run creation from the app composition root; adapt direct test embeddings explicitly.
  - Split read, queue and lifecycle command interfaces at consumer boundaries.
  out:
  - API or middleware ordering changes, generic router frameworks and authorization changes.
requirements:
- id: R1
  text: Keep dependencies explicit and changes confined to this task; preserve unrelated working-tree
    changes.
- id: R2
  text: Use existing behavior tests and add regressions for newly exposed boundaries or bounded query
    counts.
acceptance_criteria:
- id: A1
  given: The current Server contracts and supported input fixtures.
  when: The refactored path executes.
  then: Every existing route, HEAD rejection, authentication, origin policy and error response retains
    its behavior.
- id: A2
  given: Failures, boundary cases and existing lifecycle behavior.
  when: The relevant regression suite runs.
  then: HTTP dependencies describe operations actually used by each resource and production composition
    supplies explicit services.
tests:
- name: public-http-race
  command: go test -race -count=1 ./internal/httpapi/public/... ./internal/app
  covers:
  - A1
  - A2
- name: diff
  command: git diff --check
  covers:
  - A1
  - A2
