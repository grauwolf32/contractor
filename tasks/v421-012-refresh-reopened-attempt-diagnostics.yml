schema_version: "1.0"
id: V421-012
title: Refresh cached diagnostics when the Run page is reopened
milestone: data-model-consumers-2026-10
epic: ui
kind: defect
introduced_by: V421-003
priority: P2
status: in_progress
depends_on: [V421-003, V421-004]
languages: [typescript, yaml, markdown]
goal: Refresh previously cached open attempt diagnostics once on a real Run page entry while preserving protection from live projection remounts and failed-refresh data loss.
context:
  review: Independent combined V421 consumer review on 2026-10-27 before the integrated release gate.
  specification:
    - docs/spec/ui/ui.md#UI-R208
    - docs/spec/ui/ui.md#UI-R209
  finding: >-
    ui/src/routes/runs/runtime-diagnostics-refresh.ts:23 refreshes only when a
    previous observed state exists, and both diagnostic widgets disable
    refetchOnMount. Cancel a terminal-state refresh by leaving the Run page,
    then reopen the failed Run within cache lifetime: the new RunBody's empty
    state map cannot detect the transition and old pending/partial facts stay
    without another read. An initially open disclosure is a user read intent.
  siblings: Runtime adapter and selected Planner/Worker tool-call diagnostics use the same stable RunBody hook and independent caches.
scope:
  in:
    - Refresh cached facts once per real RunBody entry when their disclosure is active; mark inactive caches stale until opened.
    - Keep state-change refresh, cancelled request joining, explicit refresh, bounded retries and prior data on failed refresh.
    - Preserve no-fetch behavior for unrelated Run invalidation and same-page LiveAttempts snapshot remounts.
    - Add reopen-after-cancel regressions for both diagnostic widgets and amend their owning UI rules.
  out:
    - Polling settled Runs, refetching every loaded diagnostic page on unrelated Run events, new API or persistence.
failure_outcomes:
  - operation: Reopen an attempt diagnostic disclosure with cached facts
    permanent: Display the read error and retain visibly stale prior facts; do not manufacture terminal measurements.
    retryable: Existing bounded read backoff and Retry-After behavior remain authoritative.
    ambiguous: GET is side-effect free and keeps its current page generation.
    cancelled: Leaving the page aborts active reads; a later page entry can start a fresh read.
    timeout: Preserve prior facts with an explicit refresh failure, not a claim that stale data is current.
cardinality:
  - collection: Attempts and cached diagnostic queries
    expected: A few attempts and one selected tool participant
    maximum: Existing Run attempt and diagnostic page bounds
    bound: Mark only the reopened Run's exact attempt caches; fetch active disclosures only and do not add timers.
acceptance_criteria:
  - id: A1
    given: Cached running/pending facts and a terminal refresh cancelled by navigation
    when: The user reopens the Run with its diagnostic disclosure open
    then: A fresh read occurs once and updates or truthfully fails while preserving prior facts.
  - id: A2
    given: Closed disclosures, multiple participants, unrelated Run changes and LiveAttempts remounts
    when: Cache invalidation or view changes occur
    then: Closed facts are not fetched, selected state survives and unrelated remounts do not trigger page reloads.
  - id: A3
    given: Runtime and tool-call widgets plus retryable/permanent read errors
    when: Focused regressions and complete UI/browser/lint checks run
    then: Both siblings follow the same bounded, truthful entry/refresh policy and the new regression fails without the fix.
tests:
  - command: make ui-verify ui-browser-mocked
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1, A2, A3]
