schema_version: '1.0'
id: V458-008
title: Integrate retained LLM cost accounting and UI into current main
milestone: llm-cost-reporting-2026-11
epic: operations
kind: chore
priority: P1
status: in_progress
depends_on: [V458-001, V458-002, V458-003, V458-004, V458-005, V458-006, V458-007]
languages: [go, python, sql, typescript, markdown, yaml]
goal: Main includes the verified attributed Run Audit and Project LLM cost feature while preserving current scanner engagement and credential behavior.
context:
  authority: User request 2026-11-09 explicitly authorizes merging the completed LLM cost branch into main; no demo deployment or business-data reset is requested.
  finding: >-
    Feature head 61916812e24f3b5c9c295d507df4510433ada099 and current main
    e3291ab0c67f0b0b7bd2ced40bef343464633fa4 diverge in public and Runtime
    schemas, Audit UI, generated clients and migration numbers. Main already
    owns migration 000002 for execution origins and 000003 for combined API keys.
  design: >-
    Reconcile in an isolated integration branch, renumber the unshipped cost
    migration after current main, regenerate derived sources and run the
    combined boundary checks before a no-fast-forward merge. Preserve the
    clean main checkout and leave the unrelated dirty primary checkout intact.
scope:
  in:
  - Reconcile existing changes, migration order, generated clients and UI release version without adding new product behavior.
  - Validate merged Go PostgreSQL Runtime wire public API and browser paths, including missing-report retention.
  - Land the verified revision in local main and record the merge result.
  out:
  - Remote push, demo deployment, live inference, new tables and unrelated user edits.
acceptance_criteria:
  - id: A1
    text: Current main contains the completed LLM cost feature and missing-report correction alongside the scanner engagement and credential changes, with sequential migrations and generated sources consistent.
  - id: A2
    text: Combined focused Go and PostgreSQL suites, complete Runtime and UI checks, wire and public contracts, mocked browser gate and lint succeed; owned test resources are removed.
  - id: A3
    text: Main is merged without changing the dirty primary checkout; task evidence records the immutable implementation and local merge status without claiming deployment or a full release gate.
tests:
  - command: make test-runtime
    covers: [A1, A2]
  - command: make test-wire-cross-language
    covers: [A1, A2]
  - command: make verify-public-api
    covers: [A1, A2]
  - command: make verify-public-api-postgres
    covers: [A1, A2]
  - command: make ui-verify
    covers: [A1, A2]
  - command: make ui-browser-mocked
    covers: [A1, A2]
  - command: make lint
    covers: [A1, A2, A3]
