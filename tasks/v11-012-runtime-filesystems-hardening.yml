schema_version: "1.0"
id: V11-012
title: Harden projectfs confinement concurrency and legacy parity
milestone: runtime-filesystems-materialization-and-hardening
priority: P1
status: planned
implementation_commit: null
depends_on: [V11-011]
languages: [python, go]

goal: >-
  Close the Runtime project filesystem increment against adversarial paths,
  concurrent tool calls, resource exhaustion and regressions from the useful
  contractor-old filesystem/Edit behavior.

context:
  legacy_source: >-
    Use contractor-old revision 9c76b56cf7b83377fb1dd5e4a17440fa27b723f3
    as a behavioral reference, especially cli_tests/test_fs_paths.py,
    test_fs_glob.py, test_fs_ls.py, tools_tests/test_fs.py,
    test_overlayfs.py and test_overlay_patch_type_change.py. Port fixtures and
    assertions selectively into the new protocol-based implementation. Do not
    restore implicit overlay wrapping, __getattr__ delegation, readable
    symlinks, generic unbounded fallback, patch serialization or fork merge.
  boundary: >-
    All functional hardening belongs to Python Runtime. Go assertions cover
    only static Toolset descriptor/config selection and unchanged wire
    contracts. Server still receives no project mount/path/backend/state.

scope:
  in:
    - Port the retained old read/list/glob/Edit/overlay/type-change/newline fixtures into parameterized local/memory/overlay backend tests.
    - Add property/fuzz tests for virtual path normalization, sibling-prefix traversal, URI/drive syntax, glob parsing, Unicode NFC and bounded result pagination.
    - Add symlink/hardlink/special-file and concurrent rename/replacement attack tests for reads, direct host writes, import and materialization/recovery.
    - Run concurrent ADK tool calls with read-vs-write, edit-vs-rollback, edit-vs-materialize and cancellation schedules; assert linearizable complete snapshots and no deadlock.
    - Add exact-bound tests for imported/upper/file/workspace/scan/diff/regex/journal count, bytes, depth and time ceilings with leak/resource checks after failure.
    - Audit structured logs, model-visible errors, ExecutionReport metrics and captured private payloads using seeded host paths/content/secrets; retain only permitted hashes/counts/safe virtual values.
    - Assert exact Runtime export/static descriptor parity and that no filesystem field has appeared in Go private/public/OpenAPI/database contracts.
    - Document unsupported OS/in-process sandbox cases, equivalent-root deployment constraint and safe hostWrite ownership requirements.
  out:
    - New backend features, source Artifact mounting, Server placement affinity, UI, shell execution, distributed locks or relaxed bounds.

deliverables:
  - {path: runtime/tests/test_projectfs_legacy_parity.py, description: Selective retained contractor-old behavior matrix.}
  - {path: runtime/tests/test_projectfs_security.py, description: Property path race confinement and disclosure suite.}
  - {path: runtime/tests/test_projectfs_concurrency.py, description: Concurrent operation cancellation and deadlock suite.}
  - {path: runtime/README.md, description: Final supported modes limits authority and operational caveats.}
  - {path: internal/config/config_test.go, description: Static descriptor parity and no-wire-extension guard coverage.}

requirements:
  - id: R1
    text: Fuzz/property runs use deterministic seeds in CI, report reproducing inputs and remain within bounded test time.
  - id: R2
    text: No cancellation or error leaves an active temp file, unclosed handle, allocation prefix, upper mutation, journal lock or partial host write outside recovery rules.
  - id: R3
    text: Security tests validate actual outside bytes/inodes before and after attacks and do not infer confinement only from an error code.
  - id: R4
    text: Every retained legacy behavior is expressed through public Workspace/Toolset contracts so backend-specific test branches cannot hide divergence.

acceptance_criteria:
  - id: A1
    given: Retained contractor-old fixtures across every compatible new backend.
    when: The parity matrix runs.
    then: Read/Edit/overlay semantics match the documented contract and every deliberately rejected legacy behavior has an explicit negative test.
  - id: A2
    given: Adversarial path, filesystem-race, concurrent-call, cancellation and exact-limit schedules.
    when: The hardening suites run repeatedly.
    then: No escape, content leak, partial mutation, deadlock, cross-allocation state or unbounded operation is observed.
  - id: A3
    given: Full Go/Python/UI/spec verification and captured remote schemas.
    when: The repository aggregate gate runs.
    then: All checks pass, tool descriptors match Runtime exports and Server schemas contain no project filesystem field/state/API.

tests:
  - {name: hardening, command: "cd runtime && uv run pytest tests/test_projectfs_legacy_parity.py tests/test_projectfs_security.py tests/test_projectfs_concurrency.py", covers: [A1, A2]}
  - {name: runtime-suite, command: "cd runtime && uv run pytest", covers: [A1, A2]}
  - {name: go-boundary, command: "go test ./internal/config ./internal/contracts ./internal/httpapi/...", covers: [A3]}
  - {name: aggregate, command: "make verify", covers: [A1, A2, A3]}
