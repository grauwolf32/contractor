schema_version: "1.0"
id: V407-026
title: "Classify a missing Project on Run insert as not-found, treat the artifact-write key race as a conflict, and validate immutable Run events once"
milestone: server-runtime-review-2026-10
epic: persistence
kind: defect
introduced_by: V370-012
priority: P3
status: pending
depends_on: []
languages: [go, sql]
goal: "Store rejections map to the same classes on every sibling path, and immutable event rows are not re-validated on every page read."
context:
  review: "docs/research/2026-10-23-server-runtime-review.md, findings C7, C6, C8; file:line as of 39d89438, re-verify on main"
  specification: docs/spec/platform/persistence.md
  severity: low
  finding: >-
    internal/runstore/store.go:165-174 insertRun: contractor_require_active_project
    raises only for a deleting Project; a Run for a non-existent Project
    fails the FK workflow_runs_project_owner_fkey and insertRun returns the
    raw ClassReferenceViolation (internal error), whereas
    CreateStageExecution, RecordStageAllocation and
    RecordRunOutputPublication map the same class to ErrNotFound.
    internal/artifacts/postgres_write_sql.go:37-52 (inserted_blob),
    postgres_write.go:172-190, postgres.go:34-49: the binding CTEs run
    unconditionally, then the blob upsert has ON CONFLICT DO UPDATE ... WHERE
    <condition>; if that WHERE is false (another writer changed the stored
    filesystem key between reusableBlobKey and this statement)
    inserted_blob yields no row, no revision is inserted, current_revision
    already points at the uninserted revision, the immediate FK fails with
    23503 and storeError maps it to ErrInvalidScope, a permanent-looking
    answer for a transient race (plausible; tiny window; no durable damage).
    internal/runstore/run_event_store.go:469-475 ListRunEvents strict-decodes
    and re-validates each payload (up to 2 MiB, up to 1000 per page)
    although workflow_run_events is immutable (trigger) and validated at
    append, and EncodePublicRunEventData validates again before delivery.
  siblings: >-
    Every insert in internal/runstore and internal/projectstore that can hit
    an FK on a parent (grep ClassReferenceViolation).
plan:
  - "Map ClassReferenceViolation to ErrNotFound in insertRun and any sibling found by grep; test on real PostgreSQL with a missing Project."
  - "Make updated_binding and created_binding depend on blob_ready in the write CTE (or classify an FK violation from this statement as a conflict); add a two-writer PostgreSQL test that races the filesystem key change and expects a conflict, not ErrInvalidScope."
  - "In ListRunEvents keep the cheap sequence and kind checks and drop the full strict re-validation (EncodePublicRunEventData still validates before delivery); keep a test that a corrupted row (inserted by the test through SQL) is still rejected at delivery."
scope:
  in:
    - "Error class mapping, CTE dependency, single validation."
  out:
    - "Event payload formats and append validation."
acceptance_criteria:
  - id: A1
    text: "Creating a Run for a missing Project returns ErrNotFound and 404 through the API."
  - id: A2
    text: "The raced artifact write returns a conflict class; the test fails on the unfixed code."
  - id: A3
    text: "ListRunEvents of 1000 events performs no strict payload decode (counted through a hook) while a corrupted row is still rejected at delivery."
tests:
  - command: "CONTRACTOR_TEST_DATABASE_URL=<disposable-db> go test -count=1 ./internal/runstore/... ./internal/artifacts/... ./internal/httpapi/public/..."
    covers: [A1, A2, A3]
  - command: make lint
    covers: [A1]
