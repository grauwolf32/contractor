test_prerequisites:
- These are future implementation acceptance commands, not verification performed while creating tasks.
  Implement every explicitly named new gate in its owning task; zero selected or skipped mandatory cases
  fail.
- Use locked Runtime dependencies, testdata catalogs and pseudo-Skills. Unit and integration tests never
  read the live configs tree; make test-config validates the shipped catalog.
- Persistence and immutable snapshot reads use disposable real PostgreSQL. Set CONTRACTOR_TEST_DATABASE_URL
  for required gates; an unreachable configured database or skipped required case is a failure.
- Run full suites for every touched package in addition to focused gates. Use injected clocks and deterministic
  work counters for assertions, not wall-clock thresholds.
- Run integration acceptance on the exact ADK 2.13.0 closure accepted by V418-007; record Runtime revision
  and lock digest. No separate old-SDK compaction implementation or version-switching production path.
- Follow the current Linux/platform and disk-heavy test policies (V433-007 and AGENTS.md). Do not enable
  CONTRACTOR_TEST_HEAVY_IO implicitly or count declared optional skips as passing coverage. Record exact
  revision, executed cases and exclusions; this backlog review ran no feature acceptance suites.
verification_results:
- 'In progress: 14 new real ADK Runtime controls pass, covering two checkpoints, rejected invented membership/evidence,
  hard-budget completion priority, reminders, synthetic responses, cancellation/abort/deadline, parallel
  joining and later/replacement isolation.'
- make test-runtime passes 6219 tests; 135 declared skips are excluded from passing coverage. The complete
  Runtime report verifier passes.
- 'Real Server/Runtime/PostgreSQL controls pass in 24.452 seconds: three-item/two-checkpoint completion,
  exact Task/Run/hypothesis/Finding origins, one retained result version with a committed response lost
  and read back once; a separate confirmed-lease loss joins compactor work and publishes zero results.'
- Audit family (199 Go / 451 Runtime cases, no selected skips), full touched Go packages, PostgreSQL,
  wire and UI consumer gates pass. The release guard now includes the two new mandatory process cases;
  its 56 regression tests and repeated full lint pass. Complete 52-root process acceptance and final
  owned-database cleanup remain pending.
- The first complete process attempt passed 34 roots, including both new Audit controls, but material
  sets timed out while macOS entered idle sleep. Its wall/monotonic gap and sanitized power-log events
  are retained as failed evidence. A clean rerun uses a verified temporary idle-sleep assertion; no code,
  selection, scenario timeout or retry policy changes. The assertion must be stopped during lane cleanup.
