schema_version: '1.0'
id: V417-005
title: Admit isolated compaction without bypassing trusted Audit completion
milestone: worker-context-compaction-2026-10
epic: audits
kind: feature
priority: P1
status: in_progress
depends_on:
- V417-003
- V64-012
languages:
- go
- python
goal: An isolated Audit Worker can continue an unfinished check after compaction while the existing completeness
  gate, trusted result collection and publication receipts remain authoritative.
demonstration: A real Server/Runtime/PostgreSQL Audit check in an isolated session accepts partial conclusions,
  compacts twice within the same logical invocation, supplies the remaining evidence and publishes one
  ordinary JSON result through the existing completeness gate and receipts (A1).
context:
  authority: 'User decisions on 2026-10-31: Contractor is a research platform. Audit provides durable
    coordination over ordinary Runs, fixed assertions use common hypotheses, exploratory findings may
    have no hypothesis, deduplication and exact Audit/Run origin remain, hypothesis associations are automatic
    and owner-independent, formal approvals are removed almost completely, and complexity must decrease
    or stay controlled. The user requested task replanning and diagrams for review before implementation.
    User decision 2026-11-10: implement Audit compaction for isolated sessions only, remove the dependency
    on V417-004 and leave shared-session compaction deferred until a concrete consumer requires it. Acceptance
    of V417-003 remains a prerequisite. Later user decision 2026-11-10 returns V417-004 to in_progress
    but orders its implementation last in the V417 series; this task remains isolated-only and does not
    regain a dependency on shared-session support. User instruction 2026-11-11: continue the assigned
    implementation and acceptance.'
  proposal: docs/proposals/0046-workflow-context-compaction.md
  specification:
  - docs/spec/audits/worker-completion.md#AWC-R127
  - docs/spec/audits/worker-completion.md#AWC-R128
  - docs/spec/audits/worker-completion.md#AWC-R129
  - docs/spec/audits/worker-completion.md#AWC-R130
  - docs/spec/audits/execution.md
  - docs/spec/execution/worker.md#WRK-R62
  - docs/spec/execution/worker.md#WRK-R63
  - docs/spec/execution/worker.md#WRK-R184
  - docs/spec/platform/persistence.md
  implementation_boundary: Update numbered owning specifications, limits/errors/failure/lifecycle registries,
    strict schemas, fixtures and every affected reader/writer together with implemented behavior. Generated
    clients are regenerated through their tools. No legacy readers, unsupported accepted configuration,
    speculative exports or new receipt store.
  adk_migration: V418-007 accepts the exact ADK 2.13.0 lock before V417-002 establishes compaction integration.
    Internal SDK turns are not new logical Contractor invocations; use the accepted migration contract,
    not 2.8 callback/identity assumptions.
  implementation_gate: 'User assignment 2026-11-10 authorizes isolated Audit compaction. Dependencies
    are completed: V417-003 acceptance is recorded in 678f2f77f and V64-012 is completed. Implementation
    starts 2026-11-11 within the assigned scope; shared compaction remains last.'
  design:
  - docs/spec/audits/worker-completion.md
  - docs/spec/audits/execution.md
  redesign_boundary: Extend the current audit-results@2 collector/completion owner under AWC-R127-R129.
    Use the trusted common Task context, ordinary JSON conclusions and Server-added Task/Run/Finding provenance.
    Do not restore retired internal ZIP packages, execution manifests, approval flows or a second collector.
  replanning_authority: 'User request 2026-11-07: reconcile the compaction backlog with merged refactors
    before implementation. This edit updates task scope and acceptance only; it does not start implementation,
    run live experiments or claim task completion.'
  review_baseline: Local main 1142c2681d6520baa8c04bb0a90ca8fd224deb29. Current owning specifications
    and merged code take precedence over historical proposal/spike descriptions; preserve recorded implementation
    and verification history. Recheck affected contracts if main changes before execution.
  current_state: At implementation start, Go authoring/dispatch and Runtime admission reject Audit compact
    policies, and Audit template validation rejects even a wholly replaced summarizer. The existing audit-results@2
    collector and common Task/JSON publication path remain the owning mechanisms.
  session_boundary: 'User decision 2026-11-10: repeated checkpoints continue one isolated invocation;
    retaining conversation between separate invocations is not needed for this outcome. Supporting both
    modes now would add session-lifetime and cross-invocation authority work without a shipped Audit consumer.
    The later 2026-11-10 user instruction reactivates V417-004 as the last task in the series; this task
    and the deterministic release gate do not depend on it. Shared rejection remains the isolated-delivery
    contract until the later shared implementation updates its affected controls.'
  boundary_decision: 'Agent implementation decision 2026-11-11: the Audit completion owner exposes a bounded
    read-only readiness query over its current authoritative collector. At the settled boundary before
    another main-model call, the Worker checks readiness before context pressure or compaction-cycle limits;
    a ready check unwinds the Runner and uses the existing completion/publication pipeline. Begin/end
    remain once per logical invocation across SDK turns. Checking only after a compaction request is a
    simpler alternative but can miss readiness when eligibility/limits fail first; inspecting summary
    text or diagnostic counters would give authority to the wrong owner. No new collection, schema, receipt
    or completion state is introduced. Revisit only if a concrete additional completion strategy needs
    different readiness semantics.'
  effective_policy_routes: Current reachable escalation variants override execution/model selections;
    they cannot replace the Worker template, context strategy or session mode. Canonical Stage validation
    checks each effective variant, including failed/interrupted summarizer-only selections. Catalog, Audit
    pin and Workflow snapshot tests cover the current routes; no replacement-template mechanism is introduced.
  sdk_control_boundary: ADK 2.13 emits a generic error event before propagating an owned callback exception.
    Compact Audit turns wait for the joined Runner exception chain to classify completion/compaction control.
    Genuine provider errors and exceptions remain failures; names or text in an event cannot request trusted
    completion. Two initial failing real-Runner tests exposed this integration before correction.
  acceptance_evidence:
  - tasks/evidence/v417-005-progress-20261111.json
  - tasks/evidence/v417-005-pre-process-acceptance-20261111.json
  - tasks/evidence/v417-005-host-sleep-20261111.json
scope:
  in:
  - Effective context-policy validation for Audit Worker completion and every reachable escalation, replacing
    only the compact-mode restriction from V417-003.
  - Completion priority, collector/receipt preservation, incomplete-check continuation, result publication
    and real-store/process tests in isolated sessions.
  out:
  - Changing Audit collection schemas, item identity, evidence predicates, findings proof rules, retry
    engine or result authority.
  - Enabling terminal summarization with Audit completion, making compactor output a finding/evidence
    receipt, or mass-enabling compact mode in shipped Audit profiles.
  - Shared-session compaction and conversation transfer between invocations (V417-004, ordered last).
requirements:
- id: R1
  text: 'Audit admission uses the resolved effective context policy: compact@1 is allowed for isolated
    sessions after this task; compact@1 with shared sessions remains rejected consistently before dispatch.
    terminal@1 remains prohibited by the completion contract. A template summarizer wholly replaced by
    compact@1 must not cause a false rejection; template@1 selecting that summarizer still fails. Validate
    snapshots and all reachable escalation paths identically.'
- id: R2
  text: Existing trusted completion runs before context-pressure handling at an ordinary completion boundary.
    A fully complete check finishes without an unnecessary compactor call. An incomplete check keeps its
    collector and continuation contract; compaction may shorten history but cannot report the check complete.
- id: R3
  text: Preserve the current audit-results@2 logical collector, trusted exact per-item Task/hypothesis
    context, accepted partial conclusions, evidence refs and publication identity across checkpoints.
    Runtime assembles the ordinary common JSON output and Server validates membership and adds trusted
    provenance under AWC-R127-R129. Repeated SDK callbacks cannot reset the collector, manufacture result
    identities or authorize duplicate publication. Retired task-ZIP and execution-manifest paths are not
    implemented or tested as alternatives.
- id: R4
  text: Model-authored summaries and reasoning remain untrusted text. An incorrect hypothesis or invented
    artifact/evidence ref cannot satisfy required evidence or become a confirmed finding. History access
    does not substitute for the collector or grant cross-task scope.
- id: R5
  text: Charge main/compactor/finalizer calls and tools under the existing invocation budget and original
    effective deadline. Cancel/deadline/lease loss prevents new model/tool/publication work, while existing
    authorized reconciliation follows the current Audit contract. Synthetic ADK abort/cancel/function-response
    messages are request-history data, never trusted observations, receipts, evidence of completion or
    successful tool execution.
- id: R6
  text: Reuse existing natural keys and publication receipts for ambiguous writes. Real PostgreSQL tests
    cover accepted publication with lost acknowledgement and continued execution; no new receipt table
    or semantic retry is added.
- id: R7
  text: Cover isolated sessions, a later isolated invocation and retry/replacement allocation behavior.
    Compacted conversation and archive access never transfer to another invocation or allocation. Preserve
    rejection of compact@1 with shared sessions in authoring, snapshots and Runtime admission. Keep ordinary
    Worker completion unchanged and update owning AWC/WRK specs and strict wire/shared fixtures with implementation.
failure_outcomes:
- operation: Audit admission and trusted completion/publication around compaction
  permanent: Invalid strategy combinations fail the owning admission validation before dispatch; invalid
    evidence remains a domain tool/result error and never becomes success.
  retryable: Use existing bounded Audit storage/Gateway classifications and deadlines; never retry deterministic
    compaction limits indefinitely.
  ambiguous: Reconcile the existing result/publication receipt and same context marker independently;
    never publish a second collection to repair missing acknowledgement.
  cancelled: Audit/Run owner joins Worker work; no new dispatch or publication after the existing fence.
  timeout: Existing effective Worker/Stage deadlines own work; compaction does not renew them.
cardinality:
- collection: Audit items, evidence refs and compaction history
  expected: One pinned common Task context and its bounded item membership, current conclusions/evidence
    and a few checkpoints
  maximum: Existing AWC item/evidence limits plus registered compaction history/cycle bounds
  bound: Apply current common-context/result and compaction limits; do not copy all Audit Tasks, Runs
    or iteration history into the prompt. Reuse exact Artifact references and existing bounded owner reads.
lifecycle:
- entity: Audit Worker context and existing collection receipts
  delete: Compaction data follows the allocation; Audit/Run deletion and collection retention retain their
    existing owner.
  cascade: Checkpoint deletion does not delete published evidence or authoritative collection receipts.
  retention: No durable summary/archive is attached to the Audit; retained canonical results follow existing
    Audit retention rules.
acceptance_criteria:
- id: A1
  given: An incomplete Audit check with accepted partial submissions
  when: It compacts twice, resumes, supplies remaining evidence and completes
  then: The same collector and accepted conclusions survive; only the ordinary completeness gate authorizes
    common JSON publication. Server adds exact Task/Run origins and retained Finding receipts once. Repeated
    SDK turns do not re-enter completion begin, reset collection or restore ZIP packaging.
- id: A2
  given: A complete check, and a separate false hypothesis/invented-ref summary
  when: Completion and evidence gates run near a context threshold
  then: The complete check skips unnecessary compaction; invented/unsupported evidence does not pass even
    if reasoning included it.
- id: A3
  given: Effective isolated compact policy over a summarizer template, terminal policy, a shared compact
    policy and every reachable escalation
  when: Authoring, snapshot reads and Runtime binding validate
  then: Isolated compact is admitted consistently; terminal and shared compact remain rejected; invalid
    alternate routes cannot bypass completion or session restrictions.
- id: A4
  given: Real PostgreSQL, a publication acknowledgement loss and cancel/deadline/lease loss, synthetic
    abort/cancel responses and interrupted parallel calls
  when: Audit execution continues or is fenced around a checkpoint
  then: Existing receipts reconcile once, no new schema/receipt owner appears, and no unauthorized late
    result is published. Synthetic responses cannot satisfy evidence, mark a tool successful or advance
    completeness.
- id: A5
  given: Sequential isolated invocations and a replacement allocation
  when: Compaction and current Audit task transitions execute
  then: Exact current task authority and all existing completion semantics remain intact; historical data
    never completes another task, and a later invocation or replacement allocation cannot read the prior
    invocation's compacted conversation or archive.
