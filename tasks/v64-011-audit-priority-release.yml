schema_version: "1.0"
id: V64-011
title: Verify contextual checklist prioritization across process and browser boundaries
milestone: audit-check-prioritization
priority: P1
status: pending
implementation_commit: null
depends_on: [V64-009, V64-010]
languages: [go, python, typescript, yaml, markdown]
goal: >-
  Gate release on complete-pool independent verdicts, exact minimum-ten selection,
  truthful deferred coverage and durable recovery through real service boundaries.
context:
  authority: User requested task specifications followed by detailed review before implementation of Audit checklist prioritization.
  design: docs/plans/2026-09-20-audit-check-prioritization.md
  specification: [docs/spec/34-audit-check-prioritization.md, docs/spec/19-audits.md]
  boundary: Use disposable local infrastructure and scripted gateway replies; this gate proves behavior and persistence, not live-model ranking quality.
scope:
  in:
    - Add a fail-on-missing/skip case matrix mapping all V64 acceptance criteria to executable owners and reporting exact case counts.
    - Run ordinary prioritization Runs through real Server/PostgreSQL/Scheduler and scripted gateway with zero Runtime registrations, asserting no allocations or Worker calls.
    - Run the standalone checklist profile through real Runtime-selected checks, fixed Round barriers and multiple passes, then inspect full inventory and provenance via public APIs and authenticated browser.
    - Cover 0, 1, 3, 9, 10, 11, 25, 100, 1000 and 1001 candidate boundaries, topN nine rejection/twelve acceptance, 100 candidates with ten execution slots, stable ties, absent context and high-priority deferral.
    - Inject invalid/missing model responses, invented references, exhausted model/check budgets and approval rejection/expiry; prove no partial scores, undersized Round or replacement backfill is accepted.
    - Inject restart, lost replies, duplicate receipts, claim races and cancellation/Run-Stage-cycle-deadline/delete at per-item intent, dispatch, result acceptance and atomic Round admission boundaries.
    - Expire the Audit admission deadline before a Round and during ranking, assert pause with admitted Stage drain, then extend/disable/resume without repeating accepted verdicts or accepting a Round while paused.
    - Verify immutable snapshots, exact cycle pagination, retained evidence after source Run deletion, ownership fences and complete reference/credential hold cleanup.
    - Preflight an impossible final candidate/token total with zero observed gateway calls, verify whole-pool/per-call reservation transfer and eleven-Run capacity accounting without replay double charges, and reconcile separate Audit/cycle coverage counts.
    - Run legacy Audit, review, completion, profile canonicalization and Scheduler/scan regressions and document capability rollout plus residual limitations.
  out:
    - Deploy production or demo services, call paid models, scan external targets or claim ranking accuracy from scripted responses.
deliverables:
  - path: Makefile
    description: New test-audit-priority-e2e fail-on-missing release target combining mandatory process, browser and compatibility selections.
  - path: scripts/test-audit-priority-e2e.py
    description: New prerequisite-checking orchestrator with executed case counts, zero-match detection and no silent mandatory skips.
  - path: tests/e2e/audit_priority_matrix.yml
    description: New explicit contract/fault matrix tracing all V64 acceptance criteria to required executable cases.
  - path: tests/e2e
    description: Real process and database cases with scripted gateway, ranking without Runtime and actual Runtime-selected checks.
  - path: ui/e2e
    description: Authenticated browser creation, ranking, selected/deferred coverage, review, later-pass and failure journeys.
  - path: docs/guides/audits.md
    description: Verified rollout prerequisites, bounded behavior, recovery diagnostics and known first-version limitations.
  - path: tasks/evidence/v64-011.json
    description: Create during implementation verification only with actual revision, commands, cases, prerequisites, browser artifacts and remaining limitations.
acceptance_criteria:
  - id: A1
    text: Real ranking succeeds with no Runtime; real selected checks require and use Runtime normally, with model/Worker/allocation counts proving the intended boundary.
  - id: A2
    text: The authenticated browser/API multiround journey proves full-pool scoring, exact min(topN, remaining) membership, independent baseline progression and whole-inventory report coverage.
  - id: A3
    text: Every required fault and boundary executes and proves durable identities, no repeated unknown calls, no partial or undersized admission, truthful outcomes and bounded budgets/holds.
  - id: A4
    text: Ownership, immutable context/report history, exact-revision pagination and retained provenance survive source deletion and concurrent analyst/control edits without data leaks.
  - id: A5
    text: Existing non-prioritized Audit, profile, review, completion, Scheduler and scan paths pass regression gates and mandatory skips or zero-match selections fail release.
tests:
  - command: make test-audit-priority-e2e
    covers: [A1, A2, A3, A4, A5]
  - command: make test-audits-e2e test-audit-program-library-e2e test-audit-completion-e2e
    covers: [A3, A4, A5]
  - command: go test -race ./internal/planner/... ./internal/scheduler ./internal/controlplane ./internal/scanplan/...
    covers: [A1, A3, A5]
  - command: make verify-public-api ui-generate-check ui-typecheck ui-test ui-build test-config
    covers: [A2, A4, A5]
test_prerequisites:
  - The new test-audit-priority-e2e target, orchestrator and matrix are deliverables, not existing commands or completed verification evidence.
  - Disposable PostgreSQL via CONTRACTOR_TEST_DATABASE_URL, real Server, controlled scripted gateway, locked Runtime dependencies, mTLS, local fixture inputs and installed browser dependencies.
  - The ranking-without-Runtime case must start in isolation with zero registered Runtime agents; other cases require actual Runtime check completion rather than fabricated final API responses.
verification_requirements:
  - Record complete required case IDs/counts, zero mandatory skips, exact revision, prerequisite versions and process/browser evidence retained after the run.
  - Keep tasks pending/in_progress until implementation and every required check pass; planning must not populate implementation_commit or invented success evidence.
