goal: Accept the lean Audit base only after real components prove exploration, fixed assertions, feedback,
  automatic provenance, exact handoff, publication and recovery with reduced authoritative machinery.
demonstration: One deterministic real Server/Runtime/PostgreSQL/browser matrix executes exploration without
  hypotheses, generates a hypothesis from prior results, checks fixed/generated assertions and preserves
  all evidence through replay/pause/purge.
context:
  authority: 'User direction on 2026-11-05: the base gate requires proposal 0054 and completed V64-033/034,
    including in-Run Finding selection as grounds, initial generation without prior Tasks,
    bounded material sets and no self-trigger. Historical V64-013 passing tests are insufficient.
    This update starts no implementation.
    User decisions and task-formation request on 2026-10-31: Audit durably coordinates ordinary
    tasks/Runs for investigation, checking, supporting work and generation. There is no mandatory discovery-finding-generator
    sequence. Assertion checks use common hypotheses; exploratory work may have none. Check results retain
    support/refutation/inconclusive with tested conditions; AppSec findings record evidenced problems
    and are optional. Preserve Project finding deduplication, independent source contributions, exact
    Audit/task/Run origin and automatic per-item hypothesis ID/revision associations. Reuse Audit/Project
    Artifact mechanisms for selected inputs, outputs and explicit publication. Hypothesis references must
    allow future Project ownership. Remove almost all formal approvals and keep complexity controlled.
    Generation can use selected materials, findings and ordinary results including refutations and gaps.
    The user accepted the common execution skeleton and requested concrete tasks; implementation is a
    subsequent step, not part of this task-formation request. User decision on 2026-11-02 adds
    the V64-026 Server-operation preparation prerequisite through V64-002, preserving separate
    OpenAPI operation tasks and compatible batching; web-scan remains one task per target.
    User decision on 2026-11-05 makes the exact disk-heavy cases registered by V448-002
    optional even in full gates unless CONTRACTOR_TEST_HEAVY_IO=1 is explicitly supplied.
    Disabled-heavy skips are recorded separately and never count as passing coverage;
    other required scenarios and rejection of missing/failed cases remain unchanged.'
  implementation_gate: Task formation only, requested on 2026-10-31 after acceptance of the common execution
    skeleton. Keep pending until implementation is requested and dependencies are complete. Do not start
    code, migrations, live Runs or deployment in this planning turn. Resolve the explicitly labelled remaining
    contract proposals in V64-001 before dependent implementation.
  design:
  - docs/proposals/0054-workflow-hypothesis-production.md
  - docs/proposals/0050-audit-common-hypothesis-model.md
  - docs/plans/2026-10-31-audit-redesign.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/audits/review-and-reports.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/findings/findings.md
  - docs/spec/platform/failure-model.md
  - docs/spec/platform/persistence.md
  specification_baseline: Named specifications describe current behavior. Update their owning requirements,
    API/wire contracts and fixtures with implementation; proposal 0050 governs the reviewed replacement
    direction.
  implementation_boundary: Every new state, export, relation or capability needs its real production caller
    in this task. Reuse RunService, Scheduler, ArtifactStore, finding intake, ControllerClaims and existing
    keyed/natural receipts. No new collector, admission engine, lease store or compatibility reader.
  introduced_by_note: This task replaces the former research-only exit; V64-000 and completed V62 remain
    historical implementation, not mandatory future architecture.
  preparation_boundary: >-
    User decision 2026-11-02 adds V64-026 transitively through V64-002. The composed observation/scan
    proof must use ordinary Server-operation preparation, exact bounded work-list intake and separate
    operation tasks, with compatible batching still allowed. Web-scan remains one target task. Pure
    producer/validator evidence alone does not prove V64-002 durable acceptance or the full base exit;
    no generator or second inventory/admission controller is a prerequisite of this deterministic path.
  review_followup: >-
    Agent scheduling decision on 2026-11-02: include the reviewed P1 cutover defect V64-023 as a base
    gate prerequisite. The user requested its task description; the selected retirement procedure is
    still a proposal recorded in that task. No implementation or data deletion starts here.
scope:
  in:
  - Extend the test-audit-basic-e2e gate and single required-case inventory created by V64-002; integrate
    existing Audit/HTTP/finding process evidence and fail on missing, zero-selected or mandatory skipped
    cases. Register the complete base matrix in release verification without another case registry.
  - Exercise the actual API/UI/Runtime and a deterministic fake Gateway/independent local HTTP oracle.
    Do not use scripted success as live quality evidence.
  - Cover exact input/version pins, per-item automatic association, deduplication, independent/conflicting
    results, Project publication, source deletion and parent purge.
  - Measure bounded DB work at realistic and published ceilings, preserving current limits until a reviewed
    change; stop full-history hydration and unbounded dependency traversal.
  - Record production LOC, authoritative representations, durable states and controller/receipt/lease
    counts versus the pre-redesign baseline, and identify guarantees of every retained complex mechanism.
  - Prove check-result/problem separation for bug and positive-property claims, negative rechecks without
    automatic resolution, and ordinary generation consuming refutations/inconclusive outputs without inventing
    findings. Existing result outputs supply these cases without another ledger.
  out:
  - Optional ranker/frontier/attack tree/browser/callback/scanner expansion, live-model quality claims
    or deployment.
  - Implementation during this planning-only update; changing user model configuration or deploying/migrating
    the demo.
requirements:
- id: R1
  text: The gate reaches ordinary model-free/supporting Runs without dummy hypotheses and fixed assertion
    tasks without generator/ranker calls. Prove initial material-only generation and exploration completing
    without findings or generation; neither route depends on a mandatory discovery-finding-generator pipeline.
- id: R2
  text: No new independent collector/admission/lease/queue owner or old live Audit pipeline remains. The
    current reported guarantees have real-store/process evidence.
- id: R3
  text: Run each mandatory release selector under consolidated mode with verified case reports; preserve
    model policies and increase explicit harness timeouts when required.
failure_outcomes:
- operation: Verify the integrated basic research path and bounded recovery
  permanent: Reject invalid/foreign/unsupported content and exact-revision or collision conflicts through
    the owning API/ERR contract fixed by V64-001. A deterministic ErrInvalid is permanent; no partial
    authoritative result or endless retry.
  retryable: Use existing classified storage_transaction_conflict 503 and bounded retries of the same
    operation, with owning operation/Run timeout and attempt limits.
  ambiguous: Reconcile the original task/Run/publication/intake identity through existing keyed mutations
    or natural receipts. Never repeat target activity or create a new logical result to recover an acknowledgement.
  cancelled: Honor the Audit/Run owner fence, allow authorized terminal collection, and join in-flight
    work before allocation release or scope cleanup.
  timeout: Use the owning operation deadline. Audit deadline pauses new work and drains; model/HTTP/Run
    timeouts remain with their owners. No post-deadline semantic work to repair persistence.
cardinality:
- collection: Verify the integrated basic research path and bounded recovery
  expected: 'Base fixture: 2 ordinary Runs, 2 seeded hypotheses, 1 generated hypothesis and several conclusions.'
  maximum: Keep applicable published LIM-AUD/LIM-FND ceilings unless proposal 0050 explicitly identifies
    a reviewed change; no new full-pool work.
  bound: At most 128 admitted primary records / 1 MiB metadata per mutation slice; lists use existing
    page/byte bounds and explicit continuation.
lifecycle:
- entity: Task-owned records and exact artifacts
  delete: Authenticated Audit/Project deletion uses the owning drain/purge path. No work or reader may
    outlive its authorization.
  cascade: Remove only owner-local task data; shared Project findings retain their source contributions
    and independently retained evidence. Use registered FK/Artifact ownership and bounded cleanup.
  retention: Accepted exact references and original provenance survive pause/restart and permitted source
    deletion until their owner releases them. Reading alone creates no hold.
acceptance_criteria:
- id: A1
  given: integrated Server/Runtime/PostgreSQL/UI with deterministic producers
  when: test-audit-basic-e2e executes
  then: all required scenarios and failure cases run with exact source attribution, truthful completeness,
    negative/inconclusive check history separate from findings, and continuation driven by selected negative
    results; initial manual/checklist checks, material-only generation and no-finding/no-generator completion
    all use the same task/Run path; one ordinary Workflow consumes 17 materials through one set,
    selects a Finding during Run, publishes two hypotheses with exact grounds and proposes one check
- id: A2
  given: lost acknowledgements, claims, pause/deadline/cancel, source cleanup and bounded large history
  when: process/store cases run
  then: one logical effect, joined cleanup and retained exact data are proven without a second controller;
    empty or renamed producer output never triggers itself, permanent continuation errors settle once,
    and 1000-Task history plus a 33-result tail proves bounded traversal without silently lost sources
- id: A3
  given: old and new source inventories
  when: the complexity evidence is reviewed
  then: deleted representations/states/loops are identified and no unsupported compatibility mechanism
    or unused abstraction is left
- id: A4
  given: the relevant aggregate release stages
  when: implementation closes
  then: all required stages pass with commands and case counts; unrelated failures are reported rather
    than called a pass
