goal: Gate the first optional research release on working feedback, exact context, recovery and a separately
  proven deterministic bypass; model ranking and attack trees are not prerequisites.
context:
  authority: >-
    On 2026-10-24 the user explicitly requested pending status for the reviewed
    proposal 0045 plan, including shared V62 prerequisites. The earlier deferral
    is historical; dependency completion still gates implementation start.
  proposal: docs/proposals/0045-audit-hypothesis-search.md
  design: docs/plans/2026-10-24-audit-hypothesis-search.md
  specification:
  - docs/spec/audits/audits.md
  - docs/spec/audits/execution.md
  - docs/spec/artifacts/artifact-store.md
  - docs/spec/platform/persistence.md
  deterministic_boundary: Direct Runs and current deterministic Audit inventories bypass research; no
    mandatory hypotheses, generation, ranking, new Scheduler mode or attack tree.
  implementation_boundary: Each new table, state, export and schema must have its named production writer/reader
    in this task; include the smallest actual integration caller, not a test-only placeholder waiting
    for another task.
  previous_definition:
    revision: a31579d33e81315818a277b822e3b087ce5c76c1
    path: tasks/v64-011-audit-priority-release.yml
    title: Verify contextual checklist prioritization across process and browser boundaries
    depends_on:
    - V64-009
    - V64-010
    note: The former fixed-checklist/minimum-ten integration scope is replaced by this task. Its original
      definition and deferral history remain in Git; completed V64-000 is unchanged.
scope:
  in:
  - Build a fail-on-missing process/browser matrix for cold starts, deterministic next-step changes, many-to-many
    assessments, context materialization and lifecycle recovery.
  - Start real Server/PostgreSQL/Runtime with scripted or deterministic producers, preserving current
    configured model policy; prove selection without a ranker.
  - Assert direct model-free Run and deterministic Audit execution with zero hypothesis/cycle records
    and zero generator/ranker calls.
  - Register test-audit-research-e2e and its process/browser/store suites in release verification, respecting
    consolidated gate behavior.
  - Publish measured contract evidence and operator-facing feature limits without treating scripted success
    as model-quality evidence.
  out:
  - Live quality experiments, external target scans, deployment or mandatory optional adapters.
  - Implementation during this planning change, changing existing task statuses, or modifying completed/in-progress
    task records.
acceptance_criteria:
- id: A1
  given: Guide-only and material-based cold starts
  when: a multi-Round real process run completes
  then: Selected later checks reflect prior evidence and retain exact chain, negative results and unknown
    applicability.
- id: A2
  given: Direct deterministic execution without research services selected
  when: baseline journeys run beside research cases
  then: Original item membership, route, coverage and retry/cancel behavior remain unchanged with no research
    calls/rows.
- id: A3
  given: Faults at intent, materialization, import and decision admission
  when: restart, lost response, pause/deadline/cancel and source deletion occur
  then: Exactly-once logical effects, correct resume/drain and retained evidence are proven.
- id: A4
  given: Large sparse pools, conflicts and forbidden/malformed context
  when: public/browser/store cases execute
  then: Bounds, source-mode isolation, honest projections and non-last-write assessment hold.
- id: A5
  given: The release matrix is run directly and through release verification
  when: a mandatory case is missing or prerequisites unavailable
  then: The gate fails rather than reporting empty or skipped success, and executed cases are retained
    as evidence.
- id: A6
  given: A human hypothesis competes with a large automatically generated pool
  when: manual entry, shortlist, selection and check execute through API/UI/process paths
  then: The high requested attention is retained, model output cannot impersonate or downgrade it, and
    blocked requests remain visible without gaining unauthorized execution.
tests:
- command: make test-audit-research-e2e
  covers:
  - A1
  - A2
  - A3
  - A4
  - A5
  - A6
- command: make test-audit-composition-e2e test-audit-completion-e2e
  covers:
  - A2
  - A3
- command: make verify-public-api ui-verify test-config
  covers:
  - A2
  - A4
- command: make lint
implementation_commit: null
reactivation:
  date: '2026-10-24'
  previous_status: deferred
  reason: Explicit user request to queue the reviewed proposal 0045 tasks as pending.
  execution_rule: Implementation may start after declared dependencies complete; this update starts no implementation.
previous_deferral:
  date: '2026-10-21'
  previous_status: pending
  previous_priority: P1
  reason: User deferred the remaining V64 integration to focus on authenticated HTTP continuity and completion
    of the existing V62 audit journey.
  reactivate_when: Explicit user authorization to implement this reviewed proposal 0045 scope, after its
    declared dependencies are completed. Replanning alone does not activate it.
  previous_reactivate_when: Explicit user decision after cookies and V62 are delivered and representative
    audit measurements show that model-based prioritization improves useful-result yield or time/cost
    over fixed ordering.
requirements:
- id: R1
  text: No dependency on V64-005/016/017/018 or baseline pentest release is allowed in this gate.
- id: R2
  text: Every required case executes against the real owning boundary; mandatory skips, unavailable configured
    databases and zero matching tests fail.
- id: R3
  text: The test demonstrates a changed later question from accepted prior evidence, not merely serialization
    of another summary.
failure_outcomes:
- operation: Core release process/browser/store verification
  permanent: Invalid, foreign, unsupported or oversized input is rejected with the owning V64-001/standard
    contract reason; deterministic ErrInvalid is never endlessly retried and no partial authoritative
    result is accepted.
  retryable: Use existing bounded transient storage/provider retries for the owning operation; retry attempt/deadline
    limits are explicit and do not switch research policies or models.
  ambiguous: Reconcile the same existing keyed mutation, accepted producer association or exact result;
    never create another logical effect or repeat target activity to repair acknowledgement loss.
  cancelled: Existing Audit/Run owner fences and join/drain rules apply; allow authorized terminal collection,
    block new dispatch and release resources only after in-flight work is joined.
  timeout: Use the owning operation/Run deadline. Audit admission deadline pauses and drains; non-time
    budget exhaustion follows bounded finalization with gaps.
cardinality:
- collection: Required release cases
  expected: All declared cold-input, lifecycle, association and direct-bypass cases
  maximum: Task contract ceilings including sparse 10,000-hypothesis / 100,000-edge fixtures
  bound: Explicit executed IDs/counts; bound fixture setup separately from production operation assertions.
lifecycle:
- entity: Task-owned research records, exact artifacts and projections
  delete: Audit/Project ownership and existing deletion gates apply; accepted evidence used by work is
    retained, not removed by settling or withdrawing a candidate.
  cascade: Use the owning Audit relations and existing artifact hold lifecycle; register any new holder
    inventory entry in this change and leave no independent cleanup owner.
  retention: Preserve exact accepted inputs/results and history through permitted source Run deletion,
    pause and recovery; release only through the owning lifecycle. Stateless validation/read-only outputs
    acquire no artificial persistent state.
deliverables:
- path: make/features.mk
  description: New test-audit-research-e2e family with explicit prerequisites and release graph registration.
- path: scripts/test-audit-research-e2e.py
  description: New case-counting process/browser orchestrator; no silent skips.
- path: tests/e2e
  description: Cold-input, feedback, provenance and lifecycle real-process matrix.
- path: ui/e2e
  description: Authenticated research and independent deterministic-path browser cases.
- path: docs/guides/audits.md
  description: Verified feature selection, limits and recovery guidance.
- path: tasks/evidence/v64-011.json
  description: Create during implementation verification only, using actual revision and executed cases.
test_prerequisites:
- Commands are implementation acceptance requirements, not results of this planning change. New named
  gates must be created, registered and fail on zero matching cases.
- Persistence/lifecycle acceptance uses disposable PostgreSQL with CONTRACTOR_TEST_DATABASE_URL set; an
  unavailable configured database or mandatory skipped case fails.
- Use testdata catalogs and pseudo-Skills, not live configs in unit/integration tests. Shipped configuration
  has its dedicated validation command.
- Run complete suites for touched packages; use injected clocks and deterministic work counters. Put timing
  measurements in benchmarks.
- test-audit-research-e2e and its orchestrator/matrix are deliverables of this task; no execution evidence
  exists during planning.
verification_requirements:
- Update owning numbered specifications, strict public/wire contracts and shared fixtures with implementation;
  do not cite task IDs from normative specifications.
- Record actual commands, case counts, required prerequisites and exact evidence after implementation.
  Planning does not populate implementation_commit or fabricate successful checks.
- Keep direct deterministic behavior, existing claims/receipts and source-to-consumer exact provenance
  explicit in real-path assertions.
