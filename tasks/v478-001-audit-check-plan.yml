- command: go test -tags=integration -count=1 ./internal/auditdomain/... ./internal/contracts/auditcontract/...
    ./internal/auditservice/... ./internal/auditstore/... ./internal/auditcontroller/... ./internal/auditimport/...
  covers:
  - A1
  - A2
  - A3
