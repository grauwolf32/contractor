schema_version: "1.0"
id: V367-012
title: "Report a reused idempotency key as a permanent conflict and honour retryable in the CLI client"
milestone: hub-audit-2026-10
epic: api-contracts
kind: defect
introduced_by: MVP-006
priority: P2
status: pending
depends_on: []
languages: [go]
goal: "Reusing an Idempotency-Key with a different body is a permanent error to every client, and the Go client never retries what the Server marked not retryable."
context:
  review: "Hub audit of main @ 02bbdcbf, 2026-10-11 (https://claude.ai/artifact/63wB3aD3Y2LQ4Vy8ZHeEjq), public API G3, G6 / F4"
  specification:
    - docs/spec/platform/failure-model.md
    - docs/spec/platform/errors.md
  finding: >-
    Stores return ErrConflict for an idempotency key reused with a different
    digest (runstore/store.go:284-285, 325-326, projectstore/store.go:61-68),
    and httpapi/public/errors.go:145-149 maps it to 409 conflict with
    retryable:true and "retry with the current revision". FAIL-RUN-1
    (failure-model.md:461) calls this outcome permanent. The Go client
    retries it twice more (publicclient/retry.go:104-121) and treats every
    502/503/504 as transient (retry.go:124-127, 141-146) even when the
    Server sent retryable:false (artifact_content_corrupt,
    git_import_unavailable). The idempotency conflict test checks only 409
    (handler_test.go:1316-1322).
scope:
  in:
    - "A distinct idempotency-conflict sentinel in every store with request idempotency (runstore, projectstore, auditstore, credentials, runtimeconfig and others found by search), mapped to a stable code with retryable:false; the code is listed in the error registry (docs/spec/platform/errors.md) and OpenAPI."
    - "The Go client honours retryable:false on any status."
  out:
    - "Optimistic revision conflicts (still retryable 409)."
acceptance_criteria:
  - id: A1
    text: "Handler tests for each create operation with an Idempotency-Key: same key, different body gives the permanent code with retryable:false; same key, same body still replays."
  - id: A2
    text: "A publicclient test shows no retry for a 503 with retryable:false and retries for retryable:true."
tests:
  - command: make lint
    covers: [A1]
  - command: "go test ./internal/httpapi/public ./internal/publicclient/... ./internal/runstore ./internal/projectstore"
    covers: [A1, A2]
  - command: make verify-public-api
    covers: [A1]
