schema_version: "1.0"
id: V62-002
title: Persist Audit preparation executions and retained outputs
milestone: audit-workflow-composition
priority: P1
status: pending
implementation_commit: null
depends_on: [V62-001, V60-012]
languages: [go, sql]
goal: Persist preparation and its accepted outputs without inventing a Round or AuditItem before inventory exists.
context:
  authority: User-requested V62 Audit Workflow composition task series.
  design: docs/plans/2026-09-20-audit-workflow-composition.md
  specification: [docs/spec/19-audits.md, docs/spec/03-artifact-plane.md]
  contract: V62-001 owns exact phase, identity, retention and migration compatibility rules.
scope:
  in:
    - Add preparation phase and Audit-scoped role execution persistence with explicit identity, attempt, revision, claim and receipt constraints.
    - Extend execution intent and trusted Run association storage to permit preparation without a current Round while preserving check membership rules.
    - Retain accepted outputs under protected Audit-managed ProjectScope and record exact role/attempt/Run/output lineage.
    - Keep original baseline immutable and implement accepted prepare-output resolution and reference holds under the new contract.
    - Extend lifecycle reads, deletion fences and credential/artifact holds for preparation-only Audits and collected/deleted source Runs.
    - Add a forward migration using the next available version and verify existing Audit rows and snapshots survive unchanged.
  out:
    - Controller dispatch, generated inventory parsing, UI or direct ProjectScope access for Workers.
deliverables:
  - path: internal/persistence/migrations
    description: Additive migration with explicit preparation execution and lifecycle invariants.
  - path: internal/auditstore
    description: Claim-bound preparation transactions, queries, links and durable identity constraints.
  - path: internal/artifacts
    description: Exact preparation output retention and source provenance through existing artifact facilities.
acceptance_criteria:
  - id: A1
    text: PostgreSQL permits valid preparation with no Round and rejects invalid role scope, duplicate accepted execution identity, stale claims and conflicting receipt replay.
  - id: A2
    text: Retained prepare outputs survive allowed source Run deletion; ordinary Project routes hide protected bindings and cannot mutate them.
  - id: A3
    text: Upgrade fixtures preserve existing Audits, and pause/cancel/delete reference transactions cannot lose or leak required artifact and credential holds.
tests:
  - command: go test -tags=integration -count=1 ./internal/auditstore ./internal/artifacts ./internal/runstore ./internal/persistence/...
    covers: [A1, A2, A3]
  - command: git diff --check
    covers: [A3]
test_prerequisites:
  - Disposable PostgreSQL selected through CONTRACTOR_TEST_DATABASE_URL; mandatory migration and persistence tests must actually execute.
verification_requirements:
  - Record database case counts, concurrent claim/receipt results and source-deletion regression evidence with zero mandatory skips.
  - Coordinate the migration number at implementation time; do not rename another series' applied migration.
