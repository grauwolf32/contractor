schema_version: '1.0'
id: V474-002
title: Return bounded UTF-8 text when a Worker reads an artifact
milestone: runtime-artifact-cache-2026-10
epic: projects-artifacts
kind: feature
priority: P1
status: pending
depends_on: []
languages:
- python
- go
- yaml
goal: A Worker can use an exact artifact as text immediately and continue a long line without decoding
  bytes.
demonstration: Use a configured Worker fixture with an exact revision, fetch a multibyte line across two
  bounded pages and recover its full text using only the returned continuation.
context:
  authority: User decision 2026-11-21 accepts removing base64 from model-facing artifact content. A common
    read_artifact name for text and images was suggested. The initial text representation is independent
    of image transport.
  specification:
  - docs/spec/artifacts/artifact-store.md#ART-R31
  - docs/spec/artifacts/artifact-store.md#ART-R117
  - docs/spec/tools/toolsets.md#TLS-R4
  consumers: run_artifacts/tools.py:137 exposes dataBase64 even though it accepts only UTF-8. text_artifacts/tools.py:90
    already owns bounded line windows. Check artifact_builder@2, fact_extractor@1, the findings analysts,
    the hypothesis generator, and document@1 recovery allowlists in Go and Python. V2-001 recorded the
    earlier byte-tool contract.
  decision_needed: User suggested a single reader. Recommend moving text consumers to read_artifact and
    removing the redundant text reader in one versioned cutover. The smaller option changes only the byte-reader
    result while retaining two selectable readers. Confirm consolidation before retiring the second export.
scope:
  in:
  - Reuse the current text-window and exact-cache implementation. Return the exact ref, text and continuation.
    Follow the outcome for the second reader in tool selection, recovery allowlists, profiles and prompts.
  - Publish changed shipped manifests and instruction paths under fresh identities, repin dependent configurations
    and Eval fixtures, and validate the catalog lock. Update the owning specs in the same implementation.
  out:
  - Image transport belongs to V474-005. Exact byte writes and copy callers belong to V474-003.
requirements:
- id: R1
  text: Preserve metadata-first rejection, hidden binding checks, current Run grants, pinned revisions,
    cache accounting and cancellation.
failure_outcomes:
- operation: Read an exact UTF-8 page
  permanent: Invalid continuation or unsupported media gives the existing bounded input error. A denied
    binding yields no content.
  retryable: Preserve transport error classification and existing read budgets.
  ambiguous: Continue on the resolved exact revision, even if the current binding moves.
  cancelled: Join derivation and discard cancelled state per ART-R117.
  timeout: Allocation read deadline remains authoritative.
cardinality:
- collection: One page of one exact revision
  bound: Reuse the text window of at most 128 KiB, maximum 400 requested lines, the existing exact artifact
    and index budgets.
lifecycle:
- entity: Exact read cache
  retention: Allocation-owned with existing eviction, close and provenance semantics.
acceptance_criteria:
- id: A1
  text: A Worker Gateway transcript shows ordinary UTF-8 text and its exact ref, and two pages recover
    a long non-ASCII line without gaps, duplicates or base64 content.
- id: A2
  text: Tests cover empty content, limits, read after revision change, hidden or denied binding, invalid
    UTF-8 and binary metadata. Reject known unsupported binary media before payload download.
- id: A3
  text: All selected readers and document recovery consumers agree in Runtime, Server, shipped catalog
    and isolated tests. The chosen tool surface has a production caller and old config identities retain
    their pins.
tests:
- command: make test-runtime
  covers:
  - A1
  - A2
  - A3
- command: make test-config
  covers:
  - A3
- command: make test-e2e
  covers:
  - A1
  - A3
- command: make lint
  covers:
  - A3
