apiVersion: contractor/v1alpha1
kind: Workflow

metadata:
  name: audit-source-check
  version: "2"

spec:
  parameters: {}

  inputs:
    task:
      required: true
      mediaTypes: [application/zip]
    execution_manifest:
      required: true
      mediaTypes: [application/json]
    source:
      required: true
      mediaTypes: [application/zip]

  outputs:
    result:
      required: true
      primary: true
      mediaTypes: [application/zip]

  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker

  entryStage: check
  stages:
    check:
      objective: Evaluate the assigned immutable Audit task set against the supplied source archive
      instructions:
        ref: instructions/audit-source-checker-worker-v2.md
      planner: passthrough@1
      agents:
        checker:
          template: audit_source_checker@2
          namespace: audit-check
      context:
        artifacts:
          task:
            namespace: inputs
            name: task
            required: true
          execution_manifest:
            namespace: inputs
            name: execution_manifest
            required: true
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes: [application/zip]
            from: {namespace: audit-check, name: result}
      workflowOutputs:
        result: result
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
