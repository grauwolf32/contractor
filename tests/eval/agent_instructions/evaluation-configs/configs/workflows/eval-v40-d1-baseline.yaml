apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: eval-v40-d1-baseline
  version: '1'
spec:
  parameters:
    objective:
      required: false
  inputs:
    source:
      required: true
      mediaTypes:
      - application/zip
  outputs:
    dependency_report:
      required: true
      mediaTypes: &id001
      - text/markdown
      primary: true
    workspace_state:
      required: true
      mediaTypes: &id002
      - application/vnd.contractor.workspace-overlay+json
    workspace_diff:
      required: true
      mediaTypes: &id003
      - text/x-diff
  executionConfig:
    workers:
      modelPolicy: domain_worker@2
      llmGateway: local-litellm@1
      credential: development-worker
  entryStage: dependency_discovery
  stages:
    dependency_discovery:
      objective: Inventory runtime dependencies from the hydrated project workspace
      instructions:
        ref: instructions/dependency-discovery-planner.md
      planner: passthrough@1
      agents:
        analyst:
          template: workspace_source_graph_analyst@1
          namespace: analysis
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
        workspace:
          mode: overlay
          sources:
          - artifact: source
            target: ''
          export:
            state: workspace_state
            diff: workspace_diff
      result:
        artifacts:
          dependency_report:
            required: true
            mediaTypes: *id001
            from:
              namespace: analysis
              name: dependencies
          workspace_state:
            required: true
            mediaTypes: *id002
          workspace_diff:
            required: true
            mediaTypes: *id003
      'on':
        succeeded:
          succeed: {}
        failed:
          retry:
            maxAttempts: 2
            then:
              fail: {}
        interrupted:
          retry:
            maxAttempts: 2
            then:
              fail: {}
      workflowOutputs:
        dependency_report: dependency_report
        workspace_state: workspace_state
        workspace_diff: workspace_diff
