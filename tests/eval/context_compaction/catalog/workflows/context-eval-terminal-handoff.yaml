apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: context-eval-terminal-handoff
  version: '1'
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1
      summarizerModelPolicy: terminal_summarizer@1
  entryStage: summarize
  stages:
    summarize:
      objective: Complete the assigned analysis and publish the required evidence
        report.
      instructions:
        ref: instructions/context-eval-task.md
      planner: passthrough@1
      agents:
        builder:
          template: context-eval-terminal-off@1
          contextManagement:
            strategy: template@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          progress:
            required: false
            mediaTypes:
            - text/plain
            from:
              namespace: builder
              name: progress
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: builder
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
        summarized:
          escalate:
            maxAttempts: 1
            planner: streamline@1
            deadlineSeconds: 60
            plannerContextManagement:
              strategy: compact@1
              instructions:
                ref: instructions/planner-compaction.md
              keepRecentGroups: 1
              maxCompactions: 2
            executionConfig:
              planner:
                modelPolicy: summary_continuation_planner@1
                compactorModelPolicy: compactor@1
                llmGateway: local-litellm@1
                credential: development-planner
