apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: context-eval-compact-on
  version: '1'
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      compactorModelPolicy: worker_compactor@1
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1
  entryStage: compact
  stages:
    compact:
      objective: Complete the assigned analysis and publish the required evidence
        report.
      instructions:
        ref: instructions/context-eval-task.md
      planner: passthrough@1
      agents:
        builder:
          template: context-eval-worker@4
          contextManagement:
            strategy: compact@1
            instructions:
              ref: instructions/worker-compaction.md
            includeReasoning: true
            contextWindowRatio: 0.006
            keepRecentGroups: 1
            maxCompactions: 4
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: builder
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
