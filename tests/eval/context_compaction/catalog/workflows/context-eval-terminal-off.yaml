apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: context-eval-terminal-off
  version: '1'
spec:
  parameters: {}
  inputs:
    source:
      required: true
      mediaTypes:
      - application/json
  outputs:
    result:
      required: true
      mediaTypes:
      - application/json
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: worker@1
      summarizerModelPolicy: terminal_summarizer@1
  entryStage: summarize
  stages:
    summarize:
      objective: Complete the assigned analysis and publish the required evidence
        report.
      instructions:
        ref: instructions/context-eval-task.md
      planner: passthrough@1
      agents:
        builder:
          template: context-eval-terminal-off@4
          contextManagement:
            strategy: template@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts:
          result:
            required: true
            mediaTypes:
            - application/json
            from:
              namespace: builder
              name: result
      workflowOutputs:
        result: result
      'on':
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
