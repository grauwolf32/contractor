apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: snapshot-reader-fixture, version: "1"}
spec:
  parameters: {}
  inputs:
    snapshot: {required: true, mediaTypes: [application/json]}
  outputs:
    result: {required: true, mediaTypes: [text/plain]}
  executionConfig:
    workers: {llmGateway: local-litellm@1, credential: development-worker, modelPolicy: worker@2}
  entryStage: read
  stages:
    read:
      objective: Read every exact page from the supplied snapshot descriptor
      instructions: {ref: instructions/snapshot-reader-fixture.md}
      planner: passthrough@1
      agents:
        reader: {template: snapshot_reader_fixture@1}
      context:
        artifacts:
          snapshot: {namespace: inputs, name: snapshot, required: true}
      result:
        artifacts:
          report: {required: true, mediaTypes: [text/plain], from: {namespace: reader, name: report}}
      workflowOutputs: {result: report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
