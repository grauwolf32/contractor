apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: sitemap-editor, version: "1"}
spec:
  description: Verify authorized sitemap operations through production processes.
  runtime: tool@1
  sandboxProfile: local-workdir@1
  sitemap:
    version: sitemap-access@1
    collectObservations: false
  toolsets:
    - ref: sitemap@1
      tools: [upsert_sitemap_entry]
  execution:
    tool: upsert_sitemap_entry
    arguments:
      expected_revision: {source: parameter, name: revision}
      url: {source: parameter, name: url}
      method: {source: literal, value: GET}
    resultArtifact: report
    timeoutSeconds: 30
