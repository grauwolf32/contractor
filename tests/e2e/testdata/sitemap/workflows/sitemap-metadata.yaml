apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: sitemap-metadata, version: "1"}
spec:
  parameters: {}
  inputs: {}
  outputs:
    report: {required: true, primary: true, mediaTypes: [application/json]}
  entryStage: research
  stages:
    research:
      objective: Read retained sitemap source preconditions
      instructions: {ref: instructions/probe.md}
      planner: passthrough@1
      agents:
        researcher: {template: sitemap-metadata@1}
      context: {artifacts: {}}
      result:
        artifacts:
          report: {required: true, mediaTypes: [application/json], from: {namespace: researcher, name: report}}
      workflowOutputs: {report: report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
