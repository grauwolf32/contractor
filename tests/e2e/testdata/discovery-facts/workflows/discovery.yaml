apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: discovery-facts, version: '1'}
spec:
  parameters: {}
  inputs:
    source: {required: true, mediaTypes: [application/zip]}
    dependency_report: {required: true, mediaTypes: [text/markdown]}
  outputs:
    report: {required: true, primary: true, mediaTypes: [text/markdown]}
  executionConfig:
    workers: {modelPolicy: worker@1, llmGateway: local-litellm@1, credential: development-worker}
    stages:
      discover:
        agents:
          analyst: {summarizerModelPolicy: summarizer@1}
  entryStage: discover
  stages:
    discover:
      objective: Map project structure, API surface, security controls, and runtime integrations
      instructions: {ref: instructions/project-discovery-planner.md}
      planner: passthrough@1
      agents:
        analyst: {template: workspace_source_graph_analyst@1, namespace: analysis}
      context:
        artifacts:
          source: {namespace: inputs, name: source, required: true}
          dependency_report: {namespace: inputs, name: dependency_report, required: true}
        workspace:
          mode: overlay
          sources: [{artifact: source, target: ''}]
          export: {state: workspace_state, diff: workspace_diff}
      result:
        artifacts:
          project_report:
            required: true
            mediaTypes: [text/markdown]
            from: {namespace: analysis, name: project}
          workspace_state: {required: true, mediaTypes: [application/vnd.contractor.workspace-overlay+json]}
          workspace_diff: {required: true, mediaTypes: [text/x-diff]}
      workflowOutputs: {report: project_report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
