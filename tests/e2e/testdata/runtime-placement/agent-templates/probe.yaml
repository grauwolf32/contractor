apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: placement-probe, version: "1"}
spec:
  description: Deterministic placement probe using a test-only scanner executable.
  runtime: tool@1
  sandboxProfile: local-workdir@1
  toolsets:
    - ref: scan@1
      tools: [scan_nuclei]
  execution:
    tool: scan_nuclei
    arguments:
      url: {source: parameter, name: target}
      timeout_seconds: {source: literal, value: 10}
    resultArtifact: report
    timeoutSeconds: 20
