apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: engagement-ordinary-run, version: "1"}
spec:
  parameters: {}
  inputs:
    network_policy: {required: true, mediaTypes: [application/vnd.contractor.engagement+json]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [text/plain]}
  executionConfig:
    workers: {llmGateway: local-litellm@1, credential: development-worker, modelPolicy: engagement_fixture_worker@1}
  entryStage: check
  stages:
    check:
      objective: Exercise the selected ordinary Run HTTP policy
      instructions: {ref: instructions/engagement-run-fixture.md}
      planner: passthrough@1
      agents:
        checker: {template: engagement_run_fixture_worker@1, namespace: engagement-run}
      context: {artifacts: {}}
      result:
        artifacts:
          result: {required: true, mediaTypes: [text/plain], from: {namespace: engagement-run, name: result}}
      workflowOutputs: {result: result}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
