apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: iterative-check-fixture, version: "1"}
spec:
  parameters: {}
  inputs:
    task: {required: true, mediaTypes: [application/zip]}
    execution_manifest: {required: true, mediaTypes: [application/json]}
    proposal: {required: true, mediaTypes: [application/json]}
    prior: {required: true, mediaTypes: [application/zip]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [application/zip]}
  executionConfig:
    workers: {llmGateway: local-litellm@1, credential: development-worker, modelPolicy: audit_completion_worker@1}
  entryStage: check
  stages:
    check:
      objective: Inspect the exact assigned proposal and accepted result
      instructions: {ref: instructions/iterative-check-fixture.md}
      planner: passthrough@1
      agents:
        checker: {template: iterative-check-fixture@1, namespace: routed-check}
      context:
        artifacts:
          task: {namespace: inputs, name: task, required: true}
          execution_manifest: {namespace: inputs, name: execution_manifest, required: true}
          proposal: {namespace: inputs, name: proposal, required: true}
          prior: {namespace: inputs, name: prior, required: true}
      result:
        artifacts:
          result: {required: true, mediaTypes: [application/zip], from: {namespace: routed-check, name: result}}
      workflowOutputs: {result: result}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
