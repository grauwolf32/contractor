apiVersion: contractor/v1alpha1
kind: Workflow
metadata: {name: iterative-assessment-fixture, version: "1"}
spec:
  parameters: {}
  inputs:
    snapshot: {required: true, mediaTypes: [application/json]}
  outputs:
    result: {required: true, primary: true, mediaTypes: [text/plain]}
  executionConfig:
    workers: {llmGateway: local-litellm@1, credential: development-worker, modelPolicy: audit_completion_worker@1}
  entryStage: inspect
  stages:
    inspect:
      objective: Inspect the complete accepted Round and its exact local result
      instructions: {ref: instructions/iterative-assessment-fixture.md}
      planner: passthrough@1
      agents:
        reader: {template: iterative-assessment-fixture@1}
      context:
        artifacts:
          snapshot: {namespace: inputs, name: snapshot, required: true}
      result:
        artifacts:
          report: {required: true, mediaTypes: [text/plain], from: {namespace: reader, name: report}}
      workflowOutputs: {result: report}
      on:
        succeeded: {succeed: {}}
        failed: {fail: {}}
        interrupted: {fail: {}}
