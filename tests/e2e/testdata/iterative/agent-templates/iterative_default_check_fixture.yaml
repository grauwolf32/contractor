apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: iterative-default-check-fixture, version: "1"}
spec:
  description: Evaluate one deterministic inventory item with optional capabilities absent
  runtime: adk@1
  instructions: {ref: instructions/typed-check-fixture.md}
  toolsets:
