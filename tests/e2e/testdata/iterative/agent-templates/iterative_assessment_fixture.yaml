apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: iterative-assessment-fixture, version: "1"}
spec:
  description: Inspect exact accepted pages and results through ordinary Artifact tools
  runtime: adk@1
  instructions: {ref: instructions/iterative-assessment-fixture.md}
  toolsets:
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: text-artifacts@1
      tools: [write_text_artifact]
    - ref: source-analysis@1
      tools: [open_source_archive, read_source]
  sandboxProfile: local-workdir@1
