apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: iterative-check-fixture, version: "1"}
spec:
  description: Inspect exact retained result members before recording one bounded check
  runtime: adk@1
  instructions: {ref: instructions/iterative-check-fixture.md}
  toolsets:
    - ref: audit-results@2
      tools: [read_audit_task, submit_check_result, submit_check_results, evidence]
    - ref: security-findings@1
      tools: [finding]
    - ref: run-artifacts@1
      tools: [read_artifact]
    - ref: source-analysis@1
      tools: [open_source_archive, read_source]
  sandboxProfile: local-workdir@1
