apiVersion: contractor/v1alpha1
kind: Workflow
metadata:
  name: worker-session-adk-isolated
  version: "1"
spec:
  parameters:
    mode:
      required: true
  inputs:
    source:
      required: true
      mediaTypes: [text/plain]
  outputs: {}
  executionConfig:
    workers:
      llmGateway: local-litellm@1
      credential: development-worker
      modelPolicy: session_tools_worker@1
  entryStage: probe
  stages:
    probe:
      objective: ADK213_PROCESS_PROBE
      instructions:
        ref: instructions/session-tools-worker.md
      planner: passthrough@1
      session: isolated
      agents:
        builder:
          template: session_tools_worker@1
      context:
        artifacts:
          source:
            namespace: inputs
            name: source
            required: true
      result:
        artifacts: {}
      on:
        succeeded:
          succeed: {}
        failed:
          fail: {}
        interrupted:
          fail: {}
