apiVersion: contractor/v1alpha1
kind: AgentTemplate
metadata: {name: finding_navigation_checker, version: "1"}
spec:
  description: Selects reported memory observations and records the ordinary assigned Audit check
  runtime: adk@1
  instructions: {ref: instructions/finding-navigation-checker.md}
  toolsets:
    - {ref: run-artifacts@1, tools: [read_artifact]}
    - {ref: security-findings@1, tools: [record_fact]}
    - {ref: audit-results@2, tools: [read_audit_task, submit_check_result, submit_check_results, evidence]}
  sandboxProfile: local-workdir@1
