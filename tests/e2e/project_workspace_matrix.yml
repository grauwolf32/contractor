schema_version: "1.0"

policy:
  ownership: >-
    Project, ProjectScope, Project Run membership and Queue projections are
    always resolved through the authenticated owner. A foreign identifier is
    indistinguishable from a missing resource.
  exact_lineage: >-
    Every Project input fork and successful output publication records the
    exact source and target revisions. Project metadata cannot change a pinned
    Run or participate in Runtime capability placement.
  finite_recovery: >-
    Request replay, stale CAS, publication races, Server restart and Runtime
    cleanup have deterministic bounded outcomes and never change Run success.
  secret_retention: >-
    Project target credentials are write-only encrypted material. Public
    resources, model requests, artifacts, logs and durable safe snapshots may
    retain only the credential reference.
  disk_authority: >-
    Local direct reads current disk without refresh. Owned I/O prevents release
    races; failed acquisition never falls back to memory. Overlay and memory
    keep their managed views; this gate enables no execution capability.

cases:
  - id: project_create_replay_and_cas
    category: cas_replay
    requirements: [A1, A2]
    expected: Exact create replay returns one Project and stale metadata CAS changes nothing.
    test: {source: internal/httpapi/public/handler_test.go, symbol: TestProjectCreateReplayListGetAndCASUpdate}
  - id: owner_scoped_project_artifacts
    category: ownership
    requirements: [A1, A2]
    expected: Project artifact routes require ownership and preserve exact historical reads.
    test: {source: internal/httpapi/public/handler_test.go, symbol: TestProjectArtifactRoutesAreOwnerScopedAndRevisionExact}
  - id: owner_scoped_project_runs
    category: ownership
    requirements: [A2]
    expected: Foreign Projects fail safely and cannot capture a standalone idempotency key.
    test: {source: internal/httpapi/public/handler_test.go, symbol: TestProjectRunRejectsForeignProjectAndCannotReplayStandaloneKey}
  - id: immutable_project_run_membership
    category: lineage
    requirements: [A1, A2]
    expected: Project Run creation forks exact inputs and pins immutable Project membership.
    test: {source: internal/httpapi/public/handler_test.go, symbol: TestProjectRunForksExactProjectInputAndKeepsImmutableMembership}
  - id: postgres_exact_input_fork
    category: lineage
    requirements: [A1, A2]
    expected: Current and historical Project revisions fork exactly without changing their source binding.
    test: {source: internal/artifacts/postgres_integration_test.go, symbol: TestPostgresIntegrationProjectInputForkPinsExactAndCurrentRevisions}
  - id: create_only_publication_race
    category: publication_race
    requirements: [A1, A2]
    expected: Concurrent Runs both succeed while exactly one creates the Project output binding.
    test: {source: internal/scheduler/postgres_integration_test.go, symbol: TestPostgresProjectOutputPublicationRaceKeepsBothRunsSucceeded}
  - id: publication_transaction_recovery
    category: publication_race
    requirements: [A2]
    expected: A rolled-back terminal transaction leaves no receipt and a retry publishes once.
    test: {source: internal/scheduler/postgres_integration_test.go, symbol: TestPostgresProjectOutputPublicationRollsBackWithTerminalTransactionAndRetries}
  - id: project_target_is_not_placement_metadata
    category: placement
    requirements: [A1]
    expected: Target plaintext is resolved only for a selected Worker that exposes http_request.
    test: {source: internal/scheduler/scheduler_test.go, symbol: TestSchedulerMaterializesProjectOriginOnlyForHTTPRequestWorkerAndErasesIt}
  - id: runtime_exact_origin_secret_boundary
    category: secrets
    requirements: [A1, A2]
    expected: Authorization is exact-origin only and disappears with allocation cleanup.
    test: {source: runtime/tests/test_http_toolset.py, symbol: test_project_authorization_is_exact_origin_hidden_and_erased}
  - id: production_process_recovery
    category: process_recovery
    requirements: [A1, A2]
    expected: PostgreSQL, restarted Go Server and two specialist Python Runtimes complete independent OpenAPI and LikeC4 Project Runs.
    test: {source: tests/e2e/project_workflows_test.go, symbol: TestProjectWorkspaceLifecycleAcrossProductionProcesses}
  - id: production_browser_workspace
    category: browser
    requirements: [A1, A3]
    expected: The independently served browser UI creates a Project, uploads inputs, launches a compatible Workflow and inspects its publication.
    test: {source: tests/ui-stack/stack_test.go, symbol: TestBrowserOperationsStack}
  - id: standalone_regression
    category: standalone_regression
    requirements: [A3]
    expected: A standalone Run still forks UserScope input and executes without a hidden Project.
    test: {source: tests/e2e/e2e_test.go, symbol: TestLocalGoToPythonArtifactCopy}
  - id: owner_scoped_global_queue
    category: ownership
    requirements: [A1, A3]
    expected: Queue membership filters are owner-scoped and terminal Runs disappear from the read model.
    test: {source: internal/httpapi/public/query_handlers_test.go, symbol: TestRunQueueIsOwnedStableFilteredAndDropsTerminalRuns}

local_direct:
  - id: external_current_projection
    category: external_change
    requirements: [LD1, LD3, LD4]
    expected: Completed external changes including restored-mtime rewrites produce fresh immutable snapshots and metadata.
    test: {source: runtime/tests/test_projectfs_local_direct.py, symbol: test_external_changes_refresh_snapshots_metadata_and_classification}
  - id: current_mutation_bytes
    category: current_mutation
    requirements: [LD2]
    expected: Edits and tree operations use current bytes without resurrecting deleted or overwriting unrelated files.
    test: {source: runtime/tests/test_projectfs_local_direct.py, symbol: test_mutations_use_current_bytes_and_do_not_resurrect_or_overwrite_others}
  - id: stale_shallow_analysis
    category: consumers
    requirements: [LD4]
    expected: Shallow cache and cursor invalidation follows a fresh disk digest.
    test: {source: runtime/tests/test_local_direct_tool_consumers.py, symbol: test_shallow_analysis_checks_disk_digest_before_using_derived_cache}
  - id: stale_graph_analysis
    category: consumers
    requirements: [LD4]
    expected: External edits retire the old graph, mirror, cursor and symbol IDs.
    test: {source: runtime/tests/test_local_direct_tool_consumers.py, symbol: test_external_edit_retires_trailmark_graph_cursor_symbol_and_mirror}
  - id: bounded_scoped_reads
    category: bounds
    requirements: [LD5]
    expected: An unrelated oversized external file rejects complete acquisition but not a bounded read_file.
    test: {source: runtime/tests/test_local_direct_tool_consumers.py, symbol: test_read_file_stays_scoped_when_an_external_file_exceeds_workspace_limits}
  - id: adversarial_disk_types
    category: containment
    requirements: [LD6]
    expected: Current links and special files fail safely, without outside bytes or cached fallback.
    test: {source: runtime/tests/test_local_direct_faults.py, symbol: test_unsupported_external_types_cannot_use_stale_memory_or_escape}
  - id: rooted_parent_replacement
    category: containment
    requirements: [LD6]
    expected: Replacing a root or parent cannot redirect disk access to outside bytes.
    test: {source: runtime/tests/test_projectfs_local_io.py, symbol: test_root_and_parent_replacement_cannot_redirect_access}
  - id: invalid_disk_names_and_limits
    category: containment
    requirements: [LD5, LD6]
    expected: Noncanonical names, deadlines and entry/text/file bounds reject complete acquisition.
    test: {source: runtime/tests/test_projectfs_local_io.py, symbol: test_limits_deadline_names_and_binary_classification}
  - id: growing_read_bound
    category: bounds
    requirements: [LD5, LD6]
    expected: Reads remain bounded when a target grows during acquisition.
    test: {source: runtime/tests/test_projectfs_local_io.py, symbol: test_growing_or_replaced_file_fails_without_stale_fallback}
  - id: recursive_preflight_validation
    category: failure
    requirements: [LD6, LD8]
    expected: Invalid subtree types are rejected before copy, move or removal makes any changes.
    test: {source: runtime/tests/test_projectfs_local_io.py, symbol: test_recursive_type_validation_precedes_changes}
  - id: disappearing_scan
    category: bounds
    requirements: [LD5, LD6, LD7]
    expected: A disappearing entry during scan yields a safe error and never a partial complete snapshot.
    test: {source: runtime/tests/test_local_direct_faults.py, symbol: test_disappearing_scan_is_not_returned_as_complete}
  - id: owned_io_release_retry
    category: ownership
    requirements: [LD7, LD8]
    expected: Blocked mutation keeps release fenced and heartbeat schedulable; retry joins one cleanup and only confirmed release permits reuse.
    test: {source: runtime/tests/test_local_direct_faults.py, symbol: test_owned_mutation_blocks_allocation_release_and_slot_reuse}
  - id: physical_failure_no_reverse_delta
    category: failure
    requirements: [LD8]
    expected: An injected partial mutation is fenced without replaying old contents over an external file.
    test: {source: runtime/tests/test_local_direct_faults.py, symbol: test_partial_copy_failure_fences_without_restoring_unrelated_files}
  - id: imported_direct_state
    category: import
    requirements: [LD9]
    expected: Imported state is physically present before readiness and external writes take precedence.
    test: {source: runtime/tests/test_workspace_state.py, symbol: test_hydration_applies_exact_state_to_overlay_view_and_direct_copy}
  - id: managed_mode_parity
    category: parity
    requirements: [LD10]
    expected: All four mode/backend combinations retain read/edit newline and overlay isolation behavior.
    test: {source: runtime/tests/test_projectfs_legacy_parity.py, symbol: test_retained_read_edit_tree_and_newline_behavior}
  - id: independent_writer_process
    category: external_process
    requirements: [LD1, LD2, LD3, LD9, LD10]
    expected: An independent process changes a live direct allocation and ADK tools and observations use its output; release erases it without automatic export.
    test: {source: runtime/tests/test_workspace_process_e2e.py, symbol: test_external_process_changes_reach_direct_worker_and_observations}

gates:
  - {id: local_direct, command: make test-local-direct-workspace}
  - {id: matrix, command: make test-project-workspaces-matrix}
  - {id: hardening, command: make test-project-workspaces-hardening}
  - {id: process, command: make test-project-workspaces-e2e}
  - {id: browser, command: make test-ui-stack}
  - {id: release, command: make test-project-workspaces-release}
